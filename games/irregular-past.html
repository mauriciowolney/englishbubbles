<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- English Bubbles app (added by the app's build.py, not part of the game's own files) -->
<script>
/* early-theme.js — runs in <head>, before the first paint, in the menu AND in every game: puts on the background
   colour saved in eb-bg (the games' palettes, "p:sky" or "c:#7aa7ff"), so a page never flashes its default colour
   first. The page's own 01-theme.js applies the same colour again a moment later. Keep PAL in step with PALETTES
   (src/js/01-theme.js and the games). */
(function () {
  try {
    var PAL = {
      sky: ["#e4f3fb", "#f1e8fb", "#fdf0e6", 0], peach: ["#ffe6d8", "#ffd6e4", "#fff1c9", 0],
      mint: ["#d9f4e6", "#d3eef6", "#eef6d3", 0], lilac: ["#e9e0fb", "#f7d9ee", "#dbe6fb", 0],
      dusk: ["#2a1740", "#58224f", "#1f3560", 1], midnight: ["#141964", "#441464", "#144e64", 1]
    };
    var s = Storage.prototype.getItem.call(window.localStorage, "eb-bg") || "", c = null;
    if (s.indexOf("p:") === 0) c = PAL[s.slice(2)] || null;
    else if (/^c:#[0-9a-f]{6}$/i.test(s)) {
      var hex = s.slice(2), r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255,
        b = parseInt(hex.slice(5, 7), 16) / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b),
        l = (mx + mn) / 2, h = 0, sat = 0, d = mx - mn;
      if (d) {
        sat = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
        h = (mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) * 60;
      }
      var col = function (dh) { return "hsl(" + ((h + dh + 360) % 360).toFixed(0) + "," + (sat * 100).toFixed(0) + "%," + (l * 100).toFixed(0) + "%)"; };
      c = [col(0), col(40), col(-40), l * 100 < 52];
    }
    if (c) {
      var root = document.documentElement;
      root.style.setProperty("--bg-a", c[0]); root.style.setProperty("--bg-b", c[1]); root.style.setProperty("--bg-c", c[2]);
      root.dataset.theme = c[3] ? "dark" : "light";
    }
  } catch (e) {}
  // The phone's bars (theme-color) follow the background: its top colour --bg-a, set here or later by the page's own
  // colour picker (menu or game: both write --bg-a on <html>). No colour chosen: the default light / dark ones.
  try {
    var html = document.documentElement, last = "";
    var bar = function () {
      var a = html.style.getPropertyValue("--bg-a").trim(), m = document.querySelectorAll('meta[name="theme-color"]');
      for (var i = 0; i < m.length; i++) {
        var v = a || (/dark/.test(m[i].media) ? "#141964" : "#e4f3fb");
        if (m[i].content !== v) m[i].content = v;
      }
      last = a;
    };
    bar();
    document.addEventListener("DOMContentLoaded", bar);
    new MutationObserver(function () {
      if (html.style.getPropertyValue("--bg-a").trim() !== last) bar();
    }).observe(html, { attributes: true, attributeFilter: ["style"] });
  } catch (e) {}
})();

/* iPhone / iPad: ask for a "playback" audio session, so the game's sounds play even with Silent mode on (iOS 17+;
   some games already do this themselves). Websites can't detect Silent mode, so the menu also shows a tip. */
try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
document.documentElement.classList.add("eb-arrive");   /* the header slides in (see the style below) */
</script>
<style>
/* A soft cross-fade between the menu and the games (Chrome; other browsers just switch). Both pages opt in. */
@media (prefers-reduced-motion: no-preference) {
  @view-transition { navigation: auto; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .25s; animation-timing-function: ease-out; }
}
/* The header slides down in from the top when a page arrives (html.eb-arrive, set in <head>, removed when the slide
   ends). It is the real header that moves, not a view-transition snapshot: a snapshot can't show the frosted-glass
   blur (a flat bar showed on PC) and was choppy on Android. The blur is off only while it moves (it is the costly
   part); it returns when the slide ends. */
@media (prefers-reduced-motion: no-preference) {
  html.eb-arrive header.dock { animation: eb-dock-in .48s cubic-bezier(.22,1,.36,1) both; will-change: transform, opacity;
    -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
}
@keyframes eb-dock-in { from { transform: translateY(calc(-100% - 28px)); opacity: 0; } }
/* Leaving with the Games button: the game fades away completely while its sound plays, leaving only its background,
   which is the menu's colour too; the menu then fades in on top. (Half-faded, the page froze on a dim picture while
   the menu loaded: "laggy".) */
html.eb-leaving body { opacity: 0; transition: opacity .22s ease-in; pointer-events: none; }
</style>
<script>
/* Every game saves its progress in the phone's storage. In the app all games share one storage, so each game's
   keys get the prefix "eb:irregular-past:" here; two games can then use the same key names without overwriting each other.
   One exception: the background colour (every game saves it as "<prefix>-bg", e.g. "p:sky" or "c:#7aa7ff", like
   the menu) is ONE setting for the whole app, kept under the menu's key "eb-bg": the game opens with the colour
   chosen in the menu, and a colour chosen in a game becomes the menu's and the other games' too. */
(function () {
  try {
    var P = "eb:irregular-past:", L = window.localStorage, S = Storage.prototype, BG = /^[a-z]+-bg$/;
    var get = S.getItem, set = S.setItem, del = S.removeItem;
    /* The EN / PT toggles too: ONE language for the whole app, the menu's (eb-lang). Each game saves its toggles
       under its own keys, with its own word for Portuguese (games.json "lang": "pt", "tr" or "native"; English is
       always "en"): reading one gives the menu's language, and a tap in a game changes the menu's and every
       game's. Until EN / PT is chosen, the menu's own rule: Portuguese for My level All / A1 / A2, English from B1. */
    var LG = {"spp-guidelang": "tr", "spp-tour-lang": "tr"};
    function appLang() {
      var l = get.call(L, "eb-lang");
      if (l === "en" || l === "pt") return l;
      var lv = get.call(L, "eb-level");
      return lv === "B1" || lv === "B2+" ? "en" : "pt";
    }
    S.getItem = function (k) {
      if (this === L && BG.test(k)) { var app = get.call(this, "eb-bg"); if (app) return app; }
      if (this === L && LG.hasOwnProperty(k)) return appLang() === "en" ? "en" : LG[k];
      return get.call(this, this === L ? P + k : k);
    };
    S.setItem = function (k, v) {
      if (this === L && BG.test(k)) set.call(this, "eb-bg", v);
      if (this === L && LG.hasOwnProperty(k)) set.call(this, "eb-lang", String(v) === "en" ? "en" : "pt");
      return set.call(this, this === L ? P + k : k, v);
    };
    S.removeItem = function (k) { return del.call(this, this === L ? P + k : k); };
    /* The app's own keys (eb-rounds, eb-don…) and language, for the injected donation script (donate.js) */
    window.ebApp = { get: function (k) { return get.call(L, k); }, set: function (k, v) { set.call(L, k, v); }, lang: appLang };
    /* Opened from the menu (a card or Continue)? Then the game starts at the menu's level ("My level"): the menu
       leaves a one-time note (sessionStorage eb-level-go), and the matching level is saved under the game's own
       level key before the game reads it (games.json "level"; the nearest level when the game doesn't have it).
       With "All" on the menu, or on a reload, the game keeps its own last level. */
    var LV = {"key": "spp-level", "A1": "A1", "A2": "A2", "B1": "B1", "B2+": "B1"}, SS = window.sessionStorage;
    if (SS.getItem("eb-level-go") === "irregular-past") {
      SS.removeItem("eb-level-go");
      var m = get.call(L, "eb-level");
      if (LV && LV[m]) set.call(L, P + LV.key, LV[m]);
    }
  } catch (e) {}
})();
</script>

  z-index: 5;
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
  gap: 8px 14px;
  width: max-content; max-width: calc(100% - 24px);
  margin: 14px auto 0;
  padding: 6px 8px;
  border-radius: 28px;
  background: var(--dock-bg);
  border: 1px solid var(--dock-line);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);

}
.seg { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; max-width: 100%; }
.seg button {
  appearance: none; border: 0; cursor: pointer;
  font-family: inherit; font-weight: 500; font-size: .95rem; line-height: 1;
  color: var(--ink); background: transparent;
  padding: .62em 1.1em; border-radius: 999px; white-space: nowrap;
  transition: background-color .2s ease, color .2s ease, transform .2s ease;
}
.seg button:hover { background: var(--dock-line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg-a); }
.sw { display: flex; align-items: center; gap: 8px 0; padding: 0 4px; }   /* the circles are spaced by margins, not the gap, so the picker row adds nothing to the pop-over's width */

.sw button {

  width: 30px; height: 30px; padding: 0; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.9); cursor: pointer;

}

.sw .on { box-shadow: 0 0 0 2px var(--dock-bg), 0 0 0 4px var(--ink); }

/* The colour picker (01-theme.js; from Be Do Modal, Nov 2026): a full-width row under the swatches while picking. Tracks
   are pills of their own gradient (hue: the rainbow; strength: grey to the hue; light: dark to light), the handle a
   white disc ringed in the colour being made. */
.cpick { contain: inline-size; min-width: 0; display: none; flex: 1 0 100%;   /* contain: it takes the swatch row's width and never widens the pop-over */
  flex-direction: column; gap: 12px; padding: 12px 0 4px; margin-top: 4px; border-top: 1px solid var(--dock-line); }
.swwrap.open.picking .cpick { display: flex; }
.cpick { --cp-h: 220; --cp-s: 100%; --cp-l: 74%; --cp-c: hsl(var(--cp-h), var(--cp-s), var(--cp-l)); }
.cp-top { display: flex; align-items: center; gap: 10px; }
.cp-hex { flex: 1; min-width: 0; font: inherit; font-size: .95rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: transparent;
  border: 1px solid var(--dock-line); border-radius: 999px; padding: .45em .9em; outline: none; }
.cp-hex:focus-visible { border-color: var(--underline); box-shadow: 0 0 0 3px hsla(335,80%,65%,.2); }
.cp-r { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 14px; margin: 4px 0; border-radius: 999px; cursor: pointer;
  background: var(--cp-track); box-shadow: inset 0 0 0 1px var(--dock-line); outline: none; touch-action: none; }
.cp-h { --cp-track: linear-gradient(90deg, hsl(0,85%,62%), hsl(60,85%,62%), hsl(120,85%,62%), hsl(180,85%,62%), hsl(240,85%,62%), hsl(300,85%,62%), hsl(359,85%,62%)); }

.cp-l { --cp-track: linear-gradient(90deg, hsl(var(--cp-h), var(--cp-s), 8%), hsl(var(--cp-h), var(--cp-s), 50%), hsl(var(--cp-h), var(--cp-s), 92%)); }

.b {

/* Score, progress, tiles, CTA (from template 2) */
.go { display: grid; grid-template-columns: 78px 1fr 78px; align-items: center; column-gap: 10px; max-width: 680px; margin: 20px auto 0; }

/* Tutorial */
/* Tutorial: the dock button, then a guided tour. A spotlight glides from feature to feature (its huge shadow is the
   dimming), and a card next to it explains each one. */
.tourbtn {

  display: inline-flex; align-items: center; gap: .4em;
  padding: .55em .95em .55em .7em; border-radius: 999px;
  font-family: inherit; font-weight: 500; font-size: .92rem; line-height: 1;
  color: var(--ink); background: transparent; border: 1px solid var(--dock-line);
  transition: background-color .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
}

.tourbtn:hover { background: var(--dock-line); transform: translateY(-1px); }
.tourbtn:active { transform: scale(.96); }

  border: 2px solid var(--underline); opacity: 0; animation: tourping 2.4s ease-out 1.5s infinite;

.tour { position: fixed; inset: 0; z-index: 50; touch-action: none; }

  position: fixed; left: 50%; top: 50%; width: 0; height: 0; border-radius: 22px; pointer-events: none;
  box-shadow: 0 0 0 200vmax rgba(8, 12, 36, .62), 0 0 0 3px rgba(255, 255, 255, .9), 0 0 26px 6px rgba(255, 140, 200, .55);

  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);

.tour-dots span { flex: none; width: 6px; height: 6px; border-radius: 99px; background: rgba(128,128,150,.35); transition: width .3s ease, background-color .3s ease; }
.tour-dots span.on { width: 16px; background: var(--underline); }

/* Theme change (swapBg in 01-theme.js, from Word Family Bubbles): no transitions for that one style change; the old
   background fades away on top */
.theming body, .theming *, .theming *::before, .theming *::after { transition: none !important; }
.bgfade { position: fixed; inset: 0; z-index: -1; pointer-events: none; background-color: var(--fa);
  background-image: radial-gradient(60vmax 50vmax at 8% 6%, var(--fa), transparent 70%),
    radial-gradient(55vmax 45vmax at 95% 40%, var(--fb), transparent 70%),
    radial-gradient(60vmax 50vmax at 30% 100%, var(--fc), transparent 70%);
  transition: opacity .55s ease; will-change: opacity; }
.bgfade.fading { opacity: 0; }

/* Edge jitter (from Word Family Bubbles, via Be Do Modal): while something rises on hover it gets an invisible strip
   below it reaching back past where its bottom edge was, so the cursor on that edge stays "inside" after the lift and
   it doesn't flicker up and down. Only while hovered (a strip that is always there rises with it and loses the cursor
   lower down). The strip is the lift + 3-4px. Bubbles lend their small gloss dot (::after) to it on hover. */
.score, .tile, .pbtn, .tourbtn { position: relative; }
@media (hover: hover) {
  .b:hover:not(.drag)::after, .score:hover::after, .tile:hover::after, .tourbtn:not(.fresh):hover::after, .pbtn:hover:not(:disabled)::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: -12px; width: auto; height: auto; border-radius: 0; background: none; opacity: 0; pointer-events: auto; }
  .b.w:hover:not(.drag)::after, .b.bq-w:hover:not(.drag)::after { bottom: -8px; }

/* The bubbles drifting up behind everything (08-sky.js; from Be Do Modal, Nov 2026, itself from English Bubbles). Sizes
   use lvh (the screen's height with the address bar hidden), not vh: on Android the address bar hides and shows while
   scrolling, which changed vh mid-flight and made every bubble jump (vh is the fallback). Only transform and opacity
   animate. They pause while a bubble is carried (body.carrying). */
.sky { position: fixed; top: 0; left: 0; right: 0; height: 100vh; height: 100lvh; z-index: -1; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; }
.sky.in { opacity: var(--sky-o); }   /* light .85, dark .6 */
.sky span {
  position: absolute; bottom: -120px; border-radius: 50%;
  border: 1.5px solid hsla(var(--h), 80%, var(--sky-rim-l), var(--sky-rim-a));
  background: radial-gradient(circle at 30% 26%, rgba(255,255,255,var(--sky-hi)), hsla(var(--h), 90%, 78%, var(--sky-tint-a)) 50%, hsla(var(--h), 90%, 72%, calc(var(--sky-tint-a) * .8)) 70%, transparent 71%);
  box-shadow: inset 0 0 14px hsla(var(--h), 95%, var(--sky-glow-l), var(--sky-glow-a));
  filter: blur(2px);   /* soft, out of focus: blurred once, then only moved */
  animation: skydrift var(--t, 30s) linear infinite; animation-delay: var(--d, 0s);
  opacity: 0;
}
body.carrying .sky span { animation-play-state: paused; }
@keyframes skydrift {
  0% { transform: translate3d(0, 0, 0); opacity: 0; }
  8% { opacity: .6; }
  50% { transform: translate3d(var(--x, 20px), -60vh, 0); transform: translate3d(var(--x, 20px), -60lvh, 0); }
  92% { opacity: .45; }
  100% { transform: translate3d(0, -125vh, 0); transform: translate3d(0, -125lvh, 0); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .sky { display: none; } }
/* While a window (Guide, Favorites, Seen, the end card) or the tutorial is open, the page behind doesn't
   scroll (from Be Do Modal, Nov 2026): the wheel or a finger scrolls only the window's own card. Scripts can still
   scroll the page (the tutorial moves it to what it points at). The page shows no scrollbar, so nothing shifts. */
html:has(.favmodal.show), html:has(.tour:not([hidden])) { overflow: hidden; overscroll-behavior: none; }

/* While the tutorial or a window (.favmodal) is open (body.covered, 26-shine.js) the game behind it stands still: the
   blur and dimming over it aren't redrawn on every frame (slow phones). Bubbles inside the window keep moving. */
body.covered :is(.pbtn.pulse, .sky span, #stage.rise .pool .w, .shelf.float .pair, .pool .w, #stage.picking .bin, .spin, .bq-cloud .bq-w):not(.tour *, .favmodal *) { animation-play-state: paused !important; }

/* 10-game.css — the play area: hint line, shelf of pairs, pool of bubbles, bin, the text with its gaps, clue words and
   key-word tooltips, tools row, reveal card, toast, particles. Bubble look comes from .b in 00-base.css. */
[hidden] { display: none !important; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px 48px; }
#snd[aria-pressed="true"] { background: transparent; color: inherit; }
#snd[aria-pressed="true"]:hover { background: var(--dock-line); }
#snd[aria-pressed="false"] { opacity: .6; }

/* Hint line and small buttons */
.hint { text-align: center; margin: 14px 12px 0; font-size: 1rem; opacity: .85; min-height: 2.8em; text-wrap: balance; line-height: 1.4; }
.hint b { color: var(--underline); font-weight: 600; }
.pbtn { font: inherit; font-size: .9rem; font-weight: 500; padding: .5em 1em; border-radius: 999px; border: 1.5px solid var(--dock-line); background: var(--dock-bg); color: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background-color .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s ease; }
.pbtn:hover:not(:disabled) { background: var(--dock-line); transform: translateY(-1px); }
.pbtn:disabled { opacity: .35; cursor: default; }
.pbtn:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.pbtn small { font-size: .74rem; opacity: .65; }
.pbtn.speaking, .pbtn[aria-pressed="true"] { background: var(--dock-line); }

/* Stage: shelf of pairs on top, then the pool (match phase) or the text (gaps phase) */
#stage { max-width: 920px; margin: 10px auto 0; display: flex; flex-direction: column; gap: 18px; transition: opacity .25s ease, transform .25s ease; }
#stage.out { opacity: 0; transform: translateY(-10px); }
#stage.rise .pool .w { animation: rise .6s cubic-bezier(.2,.8,.3,1) backwards, bob var(--dur, 4s) ease-in-out var(--dl, 0s) infinite alternate; animation-delay: var(--d, 0s), var(--dl, 0s); }
#stage.rise .slot { animation: rise .5s cubic-bezier(.2,.8,.3,1) backwards; }
.center { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; min-width: 0; }

/* Shelf: one slot per pair, filled as pairs are matched */
/* align-items: no stretching. A solitary verb keeps room under it for its tag (margin-bottom, below), which made its
   row taller: the slots and pairs beside it stretched, the empty slots' bubbles left sitting at the top. */
.shelf { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 26px 14px; padding: 18px 8px 4px; min-height: 64px; }
.slot { display: flex; gap: 4px; padding: 5px; border-radius: 999px; border: 2px dashed var(--dock-line); }
.slot i { display: block; width: 4.6em; height: 2.3em; border-radius: 999px; background: var(--fill-lo); }
/* A solitary verb's slot (participle rounds): one wider bubble, dotted pink rim, its "past = participle" tag under it,
   wide enough for the tag (--solo-w). Once filled, the ring hugs its word (.pair.solo). */
.shelf { --solo-w: 6.6rem; }
.slot.solo { position: relative; box-sizing: border-box; min-width: var(--solo-w); border: 2.5px dotted hsla(330,80%,72%,.6); background: hsla(330,90%,70%,.06); }
.slot.solo i { flex: 1; width: auto; background: radial-gradient(120% 140% at 30% 20%, hsla(330,90%,75%,.14), var(--fill-lo) 70%); }
.slot.solo::after { content: attr(data-both); position: absolute; left: 50%; top: 100%; transform: translate(-50%, 3px); white-space: nowrap;
  font-size: .62rem; font-weight: 600; letter-spacing: .04em; color: hsla(330,70%,var(--lab-l),.75); pointer-events: none; }
.pair { --h: 200; position: relative; display: inline-flex; align-items: center; gap: 4px; padding: 5px; border-radius: 999px;
  background: hsla(var(--h), 85%, 70%, .16); border: 1.5px solid hsla(var(--h), 75%, var(--rim-l), .7); box-shadow: 0 6px 16px var(--shadow);
  transition: opacity .35s ease, filter .35s ease, transform .3s cubic-bezier(.34,1.56,.64,1); }
.pair.pop { animation: split .55s cubic-bezier(.34,1.56,.64,1); }
.pair.auto { border-color: hsl(40,90%,55%); border-style: dashed; }
/* A gentle bob while the gaps are filled: small and slow, so the bubbles stay easy to grab */
.shelf.float .pair { --by: -3px; animation: bob var(--dur, 5.4s) ease-in-out infinite alternate; }
.shelf.float .pair:nth-child(2n) { --dur: 4.8s; --by: -2.5px; }
.shelf.float .pair:nth-child(3n) { --dur: 6s; --bx: 1px; }
.pair.used { opacity: .45; filter: saturate(.4); }
.pair.off { opacity: .3; filter: grayscale(1); }
.pair.off .w { cursor: default; }
/* The meaning of the verb, on top of the pair */
.ptr { position: absolute; left: 50%; top: 0; z-index: 2; transform: translate(-50%, -60%) scale(.6); opacity: 0; pointer-events: none;
  padding: calc(.22em + 1.5px) calc(.8em + 1.5px); border-radius: 999px; white-space: nowrap; font-size: .78rem; font-weight: 600; letter-spacing: .02em;
  /* a flat gradient pill in the pair's hue (as the sibling games' labels, Nov 2026) */
  color: #fff; background: linear-gradient(90deg, hsl(var(--h), 72%, 56%), hsl(calc(var(--h) + 28), 66%, 52%)); text-shadow: 0 1px 1px rgba(0,0,0,.15); box-shadow: 0 3px 8px var(--shadow);
  transition: opacity .3s ease, transform .35s cubic-bezier(.34,1.56,.64,1); }
.pair.tr-on .ptr { opacity: 1; transform: translate(-50%, -78%); }
.shelf .pair:nth-child(2) .ptr { transition-delay: .06s; } .shelf .pair:nth-child(3) .ptr { transition-delay: .12s; }
.shelf .pair:nth-child(4) .ptr { transition-delay: .18s; } .shelf .pair:nth-child(5) .ptr { transition-delay: .24s; }
.shelf .pair:nth-child(6) .ptr { transition-delay: .3s; }

/* Pool: the bubbles float here until they are matched */
.pool { width: 100%; min-height: 200px; box-sizing: border-box; display: flex; flex-wrap: wrap; justify-content: center; align-content: center;
  gap: 18px 14px; padding: 26px 16px; border-radius: 2em; border: 2px dashed var(--dock-line);
  background: radial-gradient(120% 140% at 30% 10%, var(--fill-mid), var(--fill-lo) 70%); transition: opacity .5s ease, transform .5s ease; }
.pool.done { opacity: 0; transform: scale(.96); }
.pool .w { animation: bob var(--dur, 4s) ease-in-out var(--dl, 0s) infinite alternate; }
@keyframes bob { from { translate: 0 0; } to { translate: var(--bx, 0px) var(--by, -6px); } }

/* Word bubbles */
.b.w { font-size: 1.12rem; line-height: 1.1; padding: .58em 1.05em .62em; border-radius: 999px; white-space: nowrap; touch-action: none; user-select: none; -webkit-user-select: none; }
.b.w:hover, .b.w:focus-visible { transform: translateY(-4px) scale(1.07); }
.pair .w { font-size: 1rem; padding: .48em .9em .52em; box-shadow: inset 0 0 14px hsla(var(--h), 95%, var(--glow-l), .38), 0 4px 10px var(--shadow); }
.pair .w.neg { background: radial-gradient(120% 140% at 22% 14%, var(--fill-hi), hsla(var(--h), 70%, 70%, .22) 60%, var(--fill-lo) 100%); }
/* Participle rounds: the participle half, and a solitary verb (bought) with its "past = participle" tag under it */
.pair .w.pp { background: radial-gradient(120% 140% at 22% 14%, var(--fill-hi), hsla(var(--h), 90%, 82%, .3) 55%, var(--fill-lo) 100%); }
/* Its tag can be wider than a short word (left, set): side room so two tags never touch */
.pair.solo { margin-inline: 1.4rem; }
/* ...and room below for the tag, so it never meets the box under the shelf (the text's "Complete the text" title) */
/* The tag hangs into the row gap (the meaning pill above the next row rises only ~5px), so a solo in the top row
   doesn't push the next row down; only the last row needs room under it (the shelf's padding). */
.shelf.claim { padding-bottom: calc(4px + 1.15rem); }
.pair.solo::after { content: attr(data-both); position: absolute; left: 50%; top: 100%; transform: translate(-50%, 3px); white-space: nowrap;
  font-size: .62rem; font-weight: 600; letter-spacing: .04em; color: hsl(var(--h),60%,var(--lab-l)); opacity: .85; pointer-events: none; }
.shelf.claim { border-radius: 1.6em; transition: background-color .2s ease, box-shadow .2s ease; }
.shelf.claim.hot { background: hsla(200,90%,70%,.16); box-shadow: 0 0 0 3px hsla(200,90%,65%,.45); }
#stage.picking .shelf.claim { box-shadow: 0 0 0 2px hsla(200,80%,65%,.3); }
.shelf.claim:focus-visible { outline: 2px solid var(--underline); outline-offset: 4px; }
.pair.used .w, .pair.off .w { transform: none; }
.w.drag { position: fixed; z-index: 60; margin: 0; pointer-events: none; animation: none; transition: none; transform: scale(1.1) rotate(-3deg);
  box-shadow: inset 0 0 22px hsla(var(--h),100%,var(--glow-l),.6), 0 18px 30px var(--shadow), 0 0 0 4px hsla(var(--h),90%,75%,.25); }
.w.lifted { opacity: .22; }
.w.sel { transform: translateY(-6px) scale(1.1); border-color: var(--underline);
  box-shadow: inset 0 0 22px hsla(var(--h),100%,var(--glow-l),.6), 0 14px 24px var(--shadow), 0 0 0 4px hsla(330,90%,70%,.35); }
.w.hot { transform: scale(1.12); border-color: var(--underline); box-shadow: inset 0 0 22px hsla(var(--h),100%,var(--glow-l),.6), 0 0 0 6px hsla(330,90%,70%,.3); }
#stage.picking .pool .w:not(.sel) { cursor: copy; }
.w.bad { border-color: hsl(350,75%,60%); box-shadow: inset 0 0 18px hsla(350,90%,68%,.5), 0 6px 14px var(--shadow); }
.w.ok { border-color: hsl(150,60%,48%); box-shadow: inset 0 0 18px hsla(150,80%,60%,.45), 0 6px 14px var(--shadow); }
.w.shown { border-color: hsl(40,90%,55%); box-shadow: inset 0 0 18px hsla(45,95%,60%,.5), 0 6px 14px var(--shadow); }
.w.shake, .gap.shake, .bin.shake { animation: shake .5s ease; }
/* The trap bubble popping by itself (12-match.js autoPopTrap) */
.pool .w.popping { animation: popout .22s ease-in forwards; pointer-events: none; }
@keyframes popout { 0% { transform: scale(1); } 60% { transform: scale(1.28); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }

/* Bin for the trap bubble (A2, B1) */
.bin { font: inherit; font-size: .9rem; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; padding: .55em 1.2em; border-radius: 999px; cursor: pointer; color: var(--ink);
  border: 2px dashed hsla(350,70%,60%,.7); background: hsla(350,85%,70%,.1); transition: transform .3s cubic-bezier(.34,1.56,.64,1), background-color .2s ease, opacity .4s ease; }
.bin svg { color: hsl(350,70%,55%); }
.bin:hover, .bin.hot { transform: scale(1.06); background: hsla(350,85%,70%,.22); border-style: solid; }
#stage.picking .bin { animation: zpulse 1.5s ease-in-out infinite; --h: 350; }
.bin.done { opacity: 0; transform: scale(.8); }
.bin:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }

/* The text with its gaps */
.para { --h: 265; position: relative; width: 100%; box-sizing: border-box; padding: 1.9em 1.5em 1.3em; border-radius: 1.8em;
  /* the header's frosted glass (.dock), as in Be Do Modal / Word Family Bubbles (Nov 2026), with a hint of its violet */
  background: var(--dock-bg); border: 1px solid hsla(var(--h), 70%, var(--rim-l), .42);
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: inset 0 0 22px hsla(var(--h), 95%, var(--glow-l), .16), 0 8px 22px var(--shadow); }
.para.in { animation: cardin .45s cubic-bezier(.34,1.56,.64,1); }
.ptag { position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%); padding: calc(.3em + 1.5px) calc(.9em + 1.5px); border-radius: 999px; white-space: nowrap;
  font-size: .7rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  /* a flat gradient pill (Be Do Modal's Build labels, Nov 2026): the text's pink-violet */
  color: #fff; background: linear-gradient(90deg, hsl(330, 80%, 62%), hsl(300, 60%, 60%)); text-shadow: 0 1px 1px rgba(0,0,0,.15); }
.ptext { margin: 0; font-size: clamp(1.08rem, .7vw + .95rem, 1.32rem); font-weight: 500; line-height: 2.2; text-align: left; }
.gap { position: relative; display: inline-flex; align-items: center; vertical-align: middle; margin: 0 .12em; line-height: 1; }
.gslot { display: inline-flex; align-items: center; justify-content: center; min-width: 6.4em; min-height: 2.15em; border-radius: 999px; cursor: pointer;
  border: 2px dashed hsla(var(--h),60%,var(--rim-l),.9); transition: background-color .2s ease, border-color .2s ease; }
.gslot:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.gap.on .gslot { border-color: var(--underline); background: hsla(330,90%,70%,.12); }
.gap.hot .gslot { border-color: var(--underline); border-style: solid; background: hsla(330,90%,70%,.25); }
.gap.filled .gslot { border-color: transparent; background: transparent; min-width: 0; cursor: default; }
.gslot .w { font-size: 1rem; padding: .42em .85em .46em; }
/* Clue words: light up after a wrong try; softly marked once the text is complete */
.clue { border-radius: .3em; transition: background-color .3s ease, box-shadow .3s ease; }
/* The glow only grows up and down (two offset shadows, never sideways), so touching pieces don't paint over each other */
.clue.lit { background: hsla(48,100%,62%,.5); box-shadow: 0 .12em 0 hsla(48,100%,62%,.5), 0 -.12em 0 hsla(48,100%,62%,.5); animation: cluein .6s ease; }
.clue.seen { background: none; box-shadow: none; text-decoration: underline 2px hsla(48,95%,52%,.85); text-underline-offset: 4px; }
@keyframes cluein { 0% { background: hsla(48,100%,62%,0); } 40% { background: hsla(48,100%,62%,.85); } }
/* Key words: meaning on hover / tap (16-gloss.js) */
.tw { cursor: help; text-decoration: underline dotted 2px hsla(265,85%,66%,.95); text-underline-offset: 5px; border-radius: .3em; transition: background-color .15s ease, box-shadow .15s ease; }
.tw.on { background: hsla(265,90%,72%,.22); box-shadow: 0 .12em 0 hsla(265,90%,72%,.22), 0 -.12em 0 hsla(265,90%,72%,.22); }
/* A highlight that wraps onto the next line gets rounded ends on each line */
.clue, .tw { -webkit-box-decoration-break: clone; box-decoration-break: clone; }
/* Joined pieces of one highlight (13-gaps.js joinMarks) */
.ptext .jl { border-top-left-radius: 0; border-bottom-left-radius: 0; }
.ptext .jr { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.clue.seen.tw { text-decoration: underline 2px hsla(48,95%,52%,.85); }
.glosstip { position: fixed; z-index: 60; display: flex; align-items: center; gap: 8px; max-width: min(80vw, 300px); padding: 7px 13px 7px 8px; border-radius: 14px;
  background: var(--dock-bg); border: 1px solid var(--dock-line); color: var(--ink); box-shadow: 0 8px 22px var(--shadow);
  backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
  font-weight: 600; font-size: 1rem; line-height: 1.25; pointer-events: none; animation: gpop .12s ease-out; }
.glosstip .pick-badge { flex: none; font-size: .68rem; }
@keyframes gpop { from { opacity: 0; transform: translateY(3px); } }
/* No English voice on this device (03-tts.js noVoice) */
.voicenote { position: fixed; left: 0; right: 0; margin: 0 auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 70; width: max-content; max-width: min(92vw, 520px);
  padding: .7em 1.1em; border-radius: 16px; text-align: center; font-size: .92rem; font-weight: 500; line-height: 1.35;
  background: var(--dock-bg); border: 1.5px solid hsla(40,90%,55%,.8); color: var(--ink); box-shadow: 0 10px 26px var(--shadow);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); animation: pup .35s ease-out; pointer-events: none; }
.answ { font-weight: 700; color: hsl(150,60%,var(--lab-l)); }
.answ.neg { color: hsl(350,65%,var(--lab-l)); }
.answ.pp { color: hsl(200,70%,var(--lab-l)); }

/* Tools row */
.tools { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.trywrap { display: inline-flex; align-items: center; gap: 4px; }
.trylab { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
.tries { display: inline-flex; align-items: center; gap: 6px; padding: 0 6px; }
.tries i { width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(135deg, hsl(315,85%,68%), hsl(275,80%,68%)); box-shadow: 0 1px 4px var(--shadow); transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .3s ease; }
.tries i.used { opacity: .18; transform: scale(.65); }
#hintleft.tick { display: inline-block; animation: tick .5s cubic-bezier(.34,1.56,.64,1); }
#hintbtn.nudge { animation: nudge .7s ease-in-out; }

/* Reveal card */
.reveal { position: relative; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px 18px; max-width: 920px; margin: 18px auto 0; padding: 10px 12px 10px 16px; border-radius: 26px;
  background: var(--dock-bg); border: 1px solid var(--dock-line); box-shadow: 0 8px 22px var(--shadow);
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); animation: cardin .45s cubic-bezier(.34,1.56,.64,1); transition: opacity .25s ease; }
.reveal.out { opacity: 0; }
.rv-tr { flex: 1 1 340px; display: flex; align-items: center; gap: 10px; animation: pup .5s .2s ease-out backwards; }
.rv-tr p { margin: 0; font-size: clamp(.95rem, .3vw + .9rem, 1.05rem); font-weight: 500; text-align: left; line-height: 1.35; }
.rv-tr .pick-badge { font-size: .8rem; }
.rv-btns { flex: none; display: flex; justify-content: center; align-items: center; gap: 8px; }
.chip { display: inline-block; font-size: .74rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: .38em .95em; border-radius: 999px; color: #fff; white-space: nowrap;
  background: linear-gradient(135deg, hsl(var(--h),75%,52%), hsl(calc(var(--h) + 35),70%,50%)); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); text-shadow: 0 1px 1px rgba(0,0,0,.18); }
@keyframes cardin { from { opacity: 0; transform: scale(.92) translateY(12px); } }
@keyframes pup { from { opacity: 0; transform: translateY(10px); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
@keyframes fadein { from { opacity: 0; } }

/* Toast + confetti bubbles */
.toast { position: absolute; left: 50%; top: 0; z-index: 5; padding: .35em 1em; border-radius: 999px; font-weight: 600; white-space: nowrap; pointer-events: none;
  background: hsl(150,60%,42%); color: #fff; box-shadow: 0 6px 16px var(--shadow); animation: toast 1.7s ease-out forwards; }
.toast.zero { background: hsl(35,85%,48%); }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%,-40%) scale(.6); } 15% { opacity: 1; transform: translate(-50%,-115%) scale(1.08); } 75% { opacity: 1; transform: translate(-50%,-130%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-175%); } }
.pf { position: fixed; z-index: 55; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at 30% 30%, #fff, hsla(var(--h),85%,75%,.55)); border: 1px solid hsla(var(--h),85%,68%,.85); animation: pfly .8s ease-out forwards; }
@keyframes pfly { from { transform: translate(-50%,-50%) scale(.3); opacity: .95; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1); opacity: 0; } }

@keyframes tick { 0% { transform: scale(1); } 40% { transform: scale(1.5); color: hsl(45,95%,55%); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 15% { transform: translateX(-9px) rotate(-1.5deg); } 35% { transform: translateX(8px) rotate(1.2deg); } 55% { transform: translateX(-6px); } 75% { transform: translateX(4px); } }
@keyframes split { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes zpulse { 0%,100% { box-shadow: 0 0 0 0 hsla(var(--h),90%,70%,0); } 50% { box-shadow: 0 0 0 6px hsla(var(--h),90%,70%,.3); } }
@keyframes nudge { 0%, 100% { transform: none; } 15% { transform: rotate(-6deg) scale(1.08); } 35% { transform: rotate(5deg) scale(1.08); } 55% { transform: rotate(-3deg) scale(1.04); } 75% { transform: rotate(2deg); } }

/* Tour: the spotlight glides between targets; header with the EN / translation toggle */
.tour-spot { transition: left .45s cubic-bezier(.3,1.15,.5,1), top .45s cubic-bezier(.3,1.15,.5,1), width .45s cubic-bezier(.3,1.15,.5,1), height .45s cubic-bezier(.3,1.15,.5,1); }
/* No glide until Next / Back (.glide, set in tourGo): the first card pops in where it belongs instead of flying in. */
.tour:not(.glide) .tour-card, .tour:not(.glide) .tour-spot { transition: none; }
.tour-card { transition: left .4s ease, top .4s ease; max-height: calc(100vh - 24px); overflow-y: auto; }
.tour-head { display: flex; align-items: center; gap: .6rem; padding-right: 2.2rem; }
.tour-head .tour-step { padding-right: 0; flex: 1; }
.tour-lang { display: flex; gap: 2px; padding: 2px; border-radius: 999px; border: 1px solid var(--dock-line); flex: none; }
.tour-lang button { appearance: none; border: 0; cursor: pointer; font-family: inherit; font-size: .7rem; font-weight: 600; letter-spacing: .06em; line-height: 1;
  padding: .45em .75em; border-radius: 999px; color: var(--ink); background: transparent; transition: background-color .2s ease, color .2s ease; }
.tour-lang button:hover { background: var(--dock-line); }
.tour-lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg-a); }
.tour-lang button:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
/* Welcome card: sample pairs; gaps card: a sample sentence */
.tour-ex { list-style: none; margin: .6rem 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: .45rem .5rem; }
.tour-ex li { --h: 200; display: inline-flex; gap: 3px; padding: 3px; border-radius: 999px; border: 1.5px solid hsla(var(--h),75%,var(--rim-l),.8); background: hsla(var(--h),85%,70%,.14); font-weight: 500; }
.tour-ex span { padding: .2em .65em; border-radius: 999px; background: var(--fill-mid); }
.tour-ex span.neg { background: hsla(var(--h),70%,70%,.25); }
.tour-demo { margin: .7rem 0 0; padding: .5rem .8rem; border-radius: 1rem; border: 1px dashed var(--dock-line); font-weight: 500; line-height: 2.3; }
.tour-demo .gap .w { font-size: .9rem; }

/* Narrow screens */
@media (max-width: 600px) {
  /* Header: always exactly two rows, as in the newer games (Conditional Bubbles): the levels fill row one, the buttons
     share row two, with their names while they fit (icons only below 560px, so there is never a third row; 4 named buttons need about 540px). */
  .dock { gap: 6px 8px; justify-content: space-evenly; }
  .seg.level { flex: 1 1 100%; width: 100%; }
  .seg.vseg { width: auto; }
  .seg.level button { padding: .55em .7em; }
  .dock .hbtns { display: contents; }
  .dock > :not(.seg.level) { flex: none; }
  .dock .tourbtn { padding: .5em .7em .5em .55em; }
  .dock .tourbtn span { display: inline; font-size: .76rem; }
  .hint { font-size: .94rem; margin-top: 10px; }
  .b.w { font-size: 1rem; padding: .5em .85em .55em; }
  /* Pairs two to a row */
  .pair { padding: 4px; gap: 3px; }
  .pair .w { font-size: .84rem; padding: .4em .62em .44em; }
  .slot { padding: 4px; gap: 3px; }
  .slot i { width: 3.6em; height: 1.95em; }
  .shelf { gap: 22px 6px; padding: 16px 0 2px; }
  .shelf.claim { padding-bottom: calc(2px + 1.15rem); }
  .pool { padding: 20px 10px; gap: 14px 10px; min-height: 160px; }
  .para { padding: 1.7em 1em 1em; }
  .ptext { line-height: 2.05; }
  .tools { margin-top: 14px; }
  .reveal { margin-top: 14px; padding: 10px; gap: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  #hintleft.tick, .pool .w, .shelf.float .pair, .pair.pop, .reveal, .rv-tr, .toast, #stage.rise .pool .w, #stage.rise .slot, .w.shake, .gap.shake, .bin.shake,
  #stage.picking .bin, .para.in, .clue.lit, #hintbtn.nudge, .glosstip { animation: none !important; }
  .tour-spot, .tour-card, #stage, .pair, .ptr, .pool { transition: none; }
}
@media (max-width: 560px) {
  .dock .tourbtn { padding: .5em; }
  .dock .tourbtn span { display: none; }
}

/* ---------- Soap bubbles (from Be Do Modal via Word Family Bubbles, Nov 2026) ----------
   Every word bubble (.soap, set by soapify() in 26-shine.js: pool, pair halves, gap words, traps, the bonus round's
   words, the tour's sample) is almost clear: a faint film of colour inside and a 1.5px coloured rim, both turning once
   in 10 s, its own colour leading (--th = --h). The numbers that differ per theme are tokens in 00-base.css (--soap-*,
   --film-a, --srim-*, --sglow-*). The border stays, clear, so nothing changes size. The film and the rim turn by
   rotating a still conic gradient (.spin: a transform animation, nothing is repainted); what follows the mouse moves by
   transform / opacity only (26-shine.js). Paint order, bottom to top: the film (.spin, the white sheen ::before, the
   glow facing the mouse .fg, the inner glow ::after), the shine spot, the rim, the small spot, the word. */
.b.soap { --th: var(--h); border-color: transparent; background: none;
  --ig: inset 0 0 12px hsla(var(--th), 95%, var(--sglow-l), var(--sglow-a));   /* the inner glow, drawn above the film by .film::after; the states below change it */
  box-shadow: 0 6px 14px var(--soap-sh); }
.b.soap::before, .b.soap::after { content: none; }   /* the shine spots are the .spot and .glint spans */
.soap .wl { display: inline-block; position: relative; }   /* relative: drawn above the shine */
.soap .film { position: absolute; inset: -1.5px; z-index: 0; border-radius: inherit; overflow: hidden; pointer-events: none; }
.soap .film::before { content: ""; position: absolute; inset: 0; z-index: 1;
  background: radial-gradient(120% 120% at 30% 20%, rgba(255,255,255,var(--soap-hi)), rgba(255,255,255,var(--soap-lo)) 60%, transparent); }
.soap .film::after { content: ""; position: absolute; inset: 1.5px; z-index: 3; border-radius: inherit; box-shadow: var(--ig); transition: box-shadow .25s ease; }
/* The turning colour of the film and of the rim: a square a little wider than the bubble's diagonal, centred; rotating
   it is the same picture as turning the conic gradient's start. --ang = each bubble's own angle (kept on touch screens). */
.soap .spin { position: absolute; left: 50%; top: 50%; width: calc(100% + 1.6em); aspect-ratio: 1; translate: -50% -50%; rotate: var(--ang, 0deg);
  animation: spin 10s linear var(--fdl, 0s) infinite; }
.film .spin { background: conic-gradient(hsla(var(--th), 95%, 76%, var(--film-a)) 0 30%, hsla(calc(var(--th) + 90), 95%, 80%, calc(var(--film-a) * .6)) 50%, hsla(calc(var(--th) + 200), 90%, 82%, calc(var(--film-a) * .7)) 72%, hsla(var(--th), 95%, 76%, var(--film-a)) 92%); }
.rim .spin { background: conic-gradient(hsla(var(--th), 90%, var(--srim-l), var(--srim-a)) 0 30%, hsla(calc(var(--th) + 90), 90%, calc(var(--srim-l) + 4%), calc(var(--srim-a) * .64)) 50%, hsla(calc(var(--th) + 200), 85%, calc(var(--srim-l) + 8%), calc(var(--srim-a) * .56)) 72%, hsla(var(--th), 90%, var(--srim-l), var(--srim-a)) 92%); }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }   /* an explicit 0deg start, so the turn loops seamlessly */
/* What follows the mouse: 26-shine.js writes the transform and opacity of these wrappers; the look is the <i> inside */
.fg > i, .rh > i, .spot i, .glint > i { position: absolute; inset: 0; }
.film .fg { position: absolute; left: -10%; top: -45%; width: 120%; height: 190%; z-index: 2; opacity: 0; will-change: transform, opacity; }
.fg > i { background: radial-gradient(closest-side, hsla(var(--th), 100%, var(--faceg-l), var(--faceg-a)), transparent); }
.soap .spot { position: absolute; left: .5em; top: .42em; width: .62em; height: .5em; pointer-events: none; transform: rotate(-14deg); will-change: transform; }
.spot > i:first-child { background: radial-gradient(closest-side, rgba(255,255,255,var(--soap-gl)) 32%, rgba(255,255,255,calc(var(--soap-gl) * .55)) 62%, rgba(255,255,255,0)); }
.spot .pl { opacity: 0; }
.spot .pl i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--spot-plus) * .85)), rgba(255,255,255,var(--spot-plus)) 42%, rgba(255,255,255,calc(var(--spot-plus) * .55)) 52%, rgba(255,255,255,calc(var(--spot-plus) * .33)) 62%, rgba(255,255,255,calc(var(--spot-plus) * .12)) 81%, rgba(255,255,255,0)); }
/* The small second spot: a thin streak along the bottom-right curve */
.soap .glint { position: absolute; right: calc(.47em - .17em); bottom: calc(.47em - .085em); width: .34em; height: .17em; pointer-events: none; opacity: .8; transform: rotate(-45deg); will-change: transform, opacity; }
.glint > i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--soap-gl) * .75)) 45%, rgba(255,255,255,0)); }
/* The rim: a ring (a mask cuts out its middle), over the clear border */
.soap .rim { position: absolute; inset: -1.5px; border-radius: inherit; padding: 1.5px; pointer-events: none;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.rim .rh { position: absolute; left: -5%; top: -40%; width: 110%; height: 180%; opacity: 0; will-change: transform, opacity; }
.rh > i { background: radial-gradient(closest-side, hsla(var(--th), 100%, var(--rimhi-l), var(--rimhi-a)), transparent); }
/* The pair halves keep a faint hint of which form they are: the negative and the participle a little tinted */
.pair .b.soap.neg { background: hsla(var(--h), 70%, 70%, .12); }
.pair .b.soap.pp { background: hsla(var(--h), 90%, 82%, .16); }
/* States: a stronger inner glow and a lifted shadow; right / wrong / shown / picked (and a drop target) turn the rim
   green / red / yellow / pink */
.b.soap:hover, .b.soap:focus-visible, .b.soap.playing { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 12px 22px var(--soap-sh2); }
.b.soap.sel, .b.soap.hot { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 12px 22px var(--soap-sh2), 0 0 0 4px hsla(330,90%,70%,.3); }
.b.soap.drag { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 18px 30px var(--soap-sh2), 0 0 0 4px hsla(var(--th), 90%, 72%, .2); }
.b.soap.ok { border-color: transparent; --ig: inset 0 0 16px hsla(150, 80%, 60%, .42); box-shadow: 0 6px 14px var(--soap-sh); }
.b.soap.bad { border-color: transparent; --ig: inset 0 0 16px hsla(350, 90%, 68%, .45); box-shadow: 0 6px 14px var(--soap-sh); }
.b.soap.shown { border-color: transparent; --ig: inset 0 0 16px hsla(45, 95%, 60%, .45); box-shadow: 0 6px 14px var(--soap-sh); }
.soap.ok .rim i, .soap.bad .rim i, .soap.shown .rim i, .soap.sel .rim i, .soap.hot .rim i { visibility: hidden; }   /* hidden, not stopped: they keep turning in step with the film */
.soap.ok .rim { background: hsla(150, 60%, 48%, .85); }
.soap.bad .rim { background: hsla(350, 80%, 60%, .85); }
.soap.shown .rim { background: hsla(40, 90%, 55%, .9); }
.soap.sel .rim, .soap.hot .rim { background: var(--underline); }
/* Off screen (.still, 26-shine.js) or while a bubble is carried (body.carrying), the floats and the turning pause */
.still .soap, .still .spin, .still .pair, body.carrying .soap, body.carrying .spin, body.carrying .shelf .pair { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .soap .spin { animation: none !important; } }
/* Touch screens: the film doesn't turn (each bubble keeps its own angle, --ang); the floats stay */

/* The first participle round's "New goal!": five pulses (the conditional game's type note pulses twice). */

@keyframes goalpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }

/* 30-end.css — end-of-game modal: stars, results list, verbs to review (from Word Family Bubbles, plus the review list). */

.vlist li { display: inline-flex; align-items: baseline; gap: .5em; padding: .4em .9em; border-radius: 999px; border: 1.5px solid hsla(40,90%,55%,.7); background: hsla(45,95%,65%,.14); font-size: .92rem; }

.allright { text-align: center; margin: 8px 0; font-weight: 500; color: hsl(150,60%,var(--lab-l)); }

/* 40-extras.css — progress bar, day streak, combo badge, floating +1, mastery meter (from Word Family Bubbles); Play menu,
   speed clock and 3-2-1 intro, listening controls and text boxes (from Conditional Bubbles). */
.pbar { height: 6px; margin-top: 5px; border-radius: 999px; background: var(--dock-line); overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, hsl(315,85%,62%), hsl(275,80%,62%)); transition: width .4s ease; }
.days { margin-left: .45em; font-size: .8rem; font-weight: 600; }
/* Combo badge on the score tile */
.score { position: relative; }
.combo { position: absolute; top: -9px; right: -9px; padding: .22em .5em; border-radius: 999px; font-style: normal; font-size: .72rem; font-weight: 700; line-height: 1;
  color: #fff; background: linear-gradient(135deg, hsl(315,85%,62%), hsl(275,80%,62%)); box-shadow: 0 2px 8px var(--shadow); }
.combo[hidden] { display: none; }
.combo.tick { animation: tick .5s cubic-bezier(.34,1.56,.64,1); }
.qz-plus { position: fixed; z-index: 60; transform: translate(-50%, -100%); font-weight: 700; font-size: 1.3rem; color: hsl(150,60%,45%); pointer-events: none; animation: qzplus .9s ease-out forwards; }
@keyframes qzplus { to { transform: translate(-50%, -260%); opacity: 0; } }

.meter .pbar { margin-top: 0; }

/* Play menu on the "new game" tile */
.playwrap { position: relative; justify-self: end; }
.playmenu { position: absolute; top: calc(100% + 8px); right: 0; z-index: 40; display: flex; flex-direction: column; gap: 2px; width: max-content; min-width: 210px; padding: 6px;
  border-radius: 20px; background: var(--bg-a); border: 1px solid var(--dock-line); box-shadow: 0 12px 30px var(--shadow); animation: cardin .22s cubic-bezier(.34,1.56,.64,1);
  -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4); }
.playmenu button { appearance: none; border: 0; background: transparent; color: var(--ink); font: inherit; font-weight: 600; text-align: left; cursor: pointer;
  display: flex; flex-direction: column; gap: 1px; padding: .55em .9em; border-radius: 14px; }
.playmenu button small { font-weight: 400; font-size: .76rem; opacity: .7; }
.playmenu button[aria-current="true"] span::after { content: " ●"; font-size: .6em; vertical-align: .25em; color: var(--underline); }   /* current mode */
.playmenu button:hover:not(:disabled), .playmenu button:focus-visible { background: var(--dock-line); outline: none; }
.playmenu button:disabled { opacity: .45; cursor: default; }
/* Speed challenge clock (replaces "Round 1 of 5") */
.prog.clock #proglbl { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; }
.prog.clock #clk { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.prog.clock #clkdone { font-size: .75rem; opacity: .75; margin-top: 3px; }
.prog.clock .pbar { height: 8px; }
.prog.clock .days { display: none; }   /* the clock needs the room */
#clk.beat { animation: beat .7s cubic-bezier(.34,1.56,.64,1); }
@keyframes beat { 0% { transform: scale(1); } 30% { transform: scale(1.45); color: hsl(45,95%,55%); text-shadow: 0 0 18px hsla(45,95%,60%,.7); } 100% { transform: scale(1); } }
.prog.urgent #clk { color: hsl(350,80%,58%); animation: pulse 1s ease-in-out infinite; }
.prog.urgent .pbar i { background: hsl(350,80%,58%); }
/* Speed challenge intro: the goal, then 3-2-1-Go (22-modes.js) */
.cdown { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(20,20,40,.35); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: cdfade .2s ease; }
.cd-card { box-sizing: border-box; width: min(360px, 100%); padding: 22px 20px 24px; border-radius: 28px; text-align: center; color: var(--ink); background: var(--bg-a); border: 1px solid var(--dock-line); box-shadow: 0 20px 50px rgba(0,0,0,.28); animation: cardin .3s cubic-bezier(.34,1.56,.64,1); }
.cd-t { margin: 0; font-size: .78rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; opacity: .65; }
.cd-x { margin: 8px 0 4px; font-size: 1.25rem; font-weight: 600; line-height: 1.3; text-wrap: balance; }
.cd-n { display: block; height: 1.25em; font-size: 4rem; line-height: 1.25; color: var(--underline); }

@keyframes cdfade { from { opacity: 0; } }

/* Listening: Listen / Slower right under the hint line, a text box in each gap (after a hint: the base verb, faint) */
.lsnrow { display: flex; justify-content: center; gap: 8px; margin: 10px 12px 0; }
.gin { width: 8.4em; min-width: 0; box-sizing: border-box; font: inherit; font-size: max(16px, .95em); font-weight: 500; color: var(--ink); text-align: center;
  padding: .3em .6em; border: 0; border-radius: 999px; background: transparent; outline: none; }
.gap.on .gin { background: var(--fill-lo); }
.gin:disabled { opacity: .5; }
.gin::placeholder { color: inherit; opacity: .4; }
.gbase { display: none; }
.gin:not(:placeholder-shown) + .gbase { display: inline; margin: 0 .85em 0 .1em; font-size: .8em; font-style: italic; font-weight: 600; color: hsl(40,85%,var(--lab-l)); }
.gin.based::placeholder { color: hsl(40,85%,var(--lab-l)); opacity: .85; font-style: italic; }
@media (prefers-reduced-motion: reduce) { .combo.tick, .qz-plus, #clk.beat, .prog.urgent #clk, .playmenu, .cdown, .cd-card, .cd-n.pop { animation: none; } }

/* 41-lists.css — favourite star and the Favorites / Seen list modal. */
.hbtns { display: inline-flex; gap: inherit; flex: none; }
.favstar { appearance: none; border: 0; background: transparent; cursor: pointer; padding: .3em; line-height: 0; border-radius: 50%;
  color: var(--ink); opacity: .55; transition: transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s ease, color .2s ease; }

.favstar:hover { opacity: .9; transform: scale(1.12); }

/* Favoriting (as in Be Do Modal): the star and the header Favorites button wobble; gold sparks (.pf.top) fly above
   the modals, so a star in the Favorites / Seen list or on the end card bursts in front of it. */
.favstar.pop, #favbtn.pop { animation: starpop .45s cubic-bezier(.34,1.56,.64,1); }
@keyframes starpop { 0% { transform: scale(1); } 35% { transform: scale(1.45) rotate(-12deg); } 100% { transform: scale(1); } }
.pf.top { z-index: 130; }
.favstar:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
/* On the reveal card: top-right corner */
.reveal { padding-right: 44px; }
.reveal > .favstar { position: absolute; right: 8px; top: 8px; }
.listtabs { width: max-content; margin: 0 auto 12px; padding: 2px; border: 1px solid var(--dock-line); border-radius: 999px; flex-wrap: nowrap; }

.listprog { display: grid; gap: 6px; margin-bottom: 12px; }
.listprog .lp-h { margin: 0 0 2px; font-size: .86rem; opacity: .75; }

/* Row buttons (rowBtns in 17-lists.js): Listen, then the star, floated in the row's top-right corner so the text wraps
   round them and takes the full width below */
.rlist .rb { float: right; display: flex; align-items: center; gap: 2px; margin: -6px -6px 2px 8px; }
.rlist .rb .rp { margin-right: 4px; }
#listbody .rb { margin-bottom: -8px; }   /* Favorites / Seen: they take only the chip line's height */
.lsay { flex: none; width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--ink); opacity: .6; cursor: pointer; transition: opacity .2s ease, background-color .2s ease; }
.lsay:hover { opacity: .9; background: var(--dock-line); }
.lsay.speaking { opacity: 1; color: var(--underline); }
.lsay svg { display: block; }
.lsay:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
.rlist .lvchip { font-size: .6rem; padding: .28em .7em; margin-bottom: 4px; }
/* A bonus question in a list (Favorites, results card): "?" chip, the question in bold, its answer after a dash */
.rlist .rq span { opacity: .8; }
.endbq { margin-top: 16px; }
/* Same gradient as the level's pill in the header (LV_COLORS, 05-controls.js) */
.rlist .lvchip[style] { background: linear-gradient(135deg, var(--lv), var(--lv2)); text-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
/* "Practice these": a game with the texts of the list */
.listfoot { display: flex; justify-content: center; margin: 0 0 12px; }
.listfoot:has(.cta[hidden]) { display: none; }
.listfoot .cta { font-family: inherit; font-size: .92rem; padding: .5em 1.2em; }
.listfoot .cta[hidden] { display: none; }
.listempty { text-align: center; opacity: .7; margin: 18px 0 8px; }
@media (prefers-reduced-motion: reduce) { .favstar.pop, #favbtn.pop { animation: none; } .lsay { transition: none; } }

/* 42-bonus.css — the bonus round (24-bonus.js): its title chip, the answer bubble with the highlighted part,
   A1's four questions to pick from, A2 / B1's question bubble with one slot per word and the word cloud (from Question
   Bubbles' Build round), all laid out as a chat, the note, the question's translation, Listen / Next and Skip. */
.bonus { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; max-width: 820px; margin: 16px auto 0; }
.bonus.in { animation: cardin .35s cubic-bezier(.34,1.56,.64,1); }
.bq-ctx { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.bq-chip { --h: 45; font-size: .7rem; padding: .35em 1em; }

/* The answer: a warm bubble, the part the question asks about highlighted */
.bq-prompt, .bq-box { position: relative; display: flex; align-items: center; justify-content: center; border-radius: 1.8em; color: var(--ink); }
/* Both chat bubbles are the header's frosted glass (Nov 2026, as in the sibling games) with a hint of their colour:
   a faint rim and inner glow (--bqhint) */
.bq-prompt, .bq-box { --bqhint: inset 0 0 22px hsla(var(--h), 95%, var(--glow-l), .2);
  background: var(--dock-bg); -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); }
.bq-prompt { --h: 45; border: 1px solid hsla(var(--h), 75%, var(--rim-l), .55); box-shadow: var(--bqhint), 0 8px 22px var(--shadow); }
.bq-a { margin: 0; font-size: clamp(1.15rem, .8vw + .95rem, 1.4rem); font-weight: 500; line-height: 1.35; }
.bq-hl { color: inherit; background: hsla(330,95%,72%,.28); border-bottom: 2.5px solid hsl(330,80%,62%); border-radius: .25em; padding: 0 .15em; font-weight: 600; }
.bq-tag { position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%); z-index: 2; padding: .3em .85em; border-radius: 999px; white-space: nowrap;
  font-size: .68rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  padding: calc(.3em + 1.5px) calc(.85em + 1.5px);
  /* a flat gradient pill (Be Do Modal's Build labels): the answer's yellow-orange */
  color: #fff; background: linear-gradient(90deg, hsl(42, 92%, 55%), hsl(24, 85%, 56%)); text-shadow: 0 1px 1px rgba(0,0,0,.15); }

/* A1: four questions, one per line */
.bq-opts { display: flex; flex-direction: column; align-items: stretch; gap: 10px; width: min(100%, 520px); }
.bq-opt.pbtn { justify-content: center; font-size: 1.05rem; font-weight: 600; padding: .7em 1.2em; }
.bq-opt.ok { border-color: hsl(150,60%,48%); background: hsla(150,70%,60%,.18); }
.bq-opt.bad { border-color: hsl(350,75%,60%); background: hsla(350,85%,70%,.15); }
.bq-opt.pbtn:disabled { cursor: default; opacity: .45; }
.bq-opt.ok:disabled, .bq-opt.bad:disabled { opacity: 1; }
.bq-opt.shake { animation: shake .5s ease; }
.bq-opt.out { opacity: 0; transform: scale(.92); pointer-events: none; transition: opacity .3s ease, transform .3s ease; }

/* A2 / B1: the question bubble (one slot per word, then "?") and the words to build it with */
.bq-build { display: flex; flex-direction: column; }
.bq-box { --h: 330; border: 1.5px dashed hsla(var(--h), 75%, var(--rim-l), .7); box-shadow: var(--bqhint), 0 8px 22px var(--shadow);
  transition: box-shadow .3s ease, border-color .3s ease; }
.bq-box.hot { border-color: hsla(var(--h), 85%, 62%, .9); box-shadow: var(--bqhint), 0 8px 22px var(--shadow), 0 0 0 5px hsla(var(--h),90%,70%,.3); }
.bq-box.shake { animation: shake .5s ease; }
.bq-box.solved, .bq-box.revealed { border: 1px solid hsla(var(--h), 75%, var(--rim-l), .55); }
.bq-box.solved { animation: bqmerge .6s cubic-bezier(.34,1.56,.64,1); box-shadow: var(--bqhint), 0 8px 22px var(--shadow), 0 0 0 4px hsla(var(--h),90%,75%,.24); }
@keyframes bqmerge { 40% { transform: scale(1.04); } }
.bq-slots { display: flex; flex-wrap: wrap; align-items: center; }
.bq-slot { display: inline-flex; align-items: center; justify-content: center; min-width: 3.4em; min-height: 2.7em; border-radius: 999px;
  border: 2px dashed hsla(var(--h),60%,var(--rim-l),.85); transition: background-color .2s ease, border-color .2s ease; }
.bq-slot.filled { border-color: transparent; min-width: 0; }
.bq-slot.hot { background: hsla(var(--h),90%,70%,.28); border-color: hsla(var(--h),85%,60%,1); }
.bq-punct { align-self: flex-end; font-size: 1.6rem; font-weight: 600; line-height: 1; margin: 0 0 .3em -1px; }
.bq-cloud { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 14px 12px; width: min(100%, 760px); min-height: 56px; }
.bq-home { display: inline-flex; border-radius: 999px; transition: opacity .35s ease, transform .35s ease; }
.bq-home.away { border: 1.5px dashed var(--dock-line); }
.bq-home.gone { opacity: 0; transform: scale(.6); pointer-events: none; }
.b.bq-w { font-size: 1.1rem; line-height: 1.1; padding: .58em 1.05em .62em; border-radius: 999px; white-space: nowrap; touch-action: none; user-select: none; -webkit-user-select: none; }
.bq-cloud .bq-w { animation: bob var(--dur, 4s) ease-in-out var(--dl, 0s) infinite alternate; }
.bonus.in .bq-home { animation: rise .6s cubic-bezier(.2,.8,.3,1) backwards; animation-delay: var(--d, 0s); }
.b.bq-w:hover, .b.bq-w:focus-visible { transform: translateY(-4px) scale(1.07); }
.bq-w.drag { position: fixed; z-index: 60; margin: 0; pointer-events: none; animation: none; transition: none; transform: scale(1.1) rotate(-3deg);
  box-shadow: inset 0 0 22px hsla(var(--h),100%,var(--glow-l),.6), 0 18px 30px var(--shadow), 0 0 0 4px hsla(var(--h),90%,75%,.25); }
.bq-w.ok, .bq-w.shown { cursor: default; }
.bq-w.ok:hover, .bq-w.shown:hover { transform: none; }
.bq-w.ok { border-color: hsl(150,60%,48%); box-shadow: inset 0 0 18px hsla(150,80%,60%,.45), 0 6px 14px var(--shadow); }
.bq-w.bad { border-color: hsl(350,75%,60%); box-shadow: inset 0 0 18px hsla(350,90%,68%,.5), 0 6px 14px var(--shadow); animation: shake .5s ease; }
.bq-w.shown { border-color: hsl(40,90%,55%); box-shadow: inset 0 0 18px hsla(45,95%,60%,.5), 0 6px 14px var(--shadow); }

/* A text-message conversation from the start: the question the player asks on the right (pink), the answer below it
   on the left (warm), both in a centred column of --chat width; the words or the four questions below them */
.bonus { --chat: 620px; }
.bq-build { width: min(100%, var(--chat)); align-items: flex-end; }
.bq-prompt { width: auto; max-width: min(90%, 540px); align-self: flex-start; margin: -6px 0 6px max(0px, (100% - var(--chat)) / 2); }
.bq-box { width: auto; max-width: 94%; border-style: solid; background: radial-gradient(120% 140% at 22% 14%, var(--fill-hi), var(--fill-mid) 48%, var(--fill-lo) 100%); }
.bq-tag { display: none; }   /* no "Answer" / "Your question" labels: the chat says who speaks */
.bq-prompt, .bq-box { min-height: 0; padding: .85em 1.3em; }
.bq-slots { justify-content: flex-start; gap: 8px .3em; font-size: clamp(1.15rem, .8vw + .95rem, 1.4rem); }
.bq-slots .bq-a { font-size: 1em; }
.bq-tw { display: inline-block; }
.bq-nw { white-space: nowrap; }   /* the last word and its "?" */   /* the solved question's words, each moved on its own by bqSettle */
.b.bq-w.bq-ghost { position: absolute; z-index: 5; margin: 0; pointer-events: none; animation: none; transition: none; box-sizing: border-box; }
.b.bq-w.bq-ghost .wl { visibility: hidden; }   /* the word itself glides on in the text (bqSettle) */
/* Normal wrapping: a balanced text leaves the shrink-to-fit bubble wider than its lines (empty sides) */
.bq-a { text-wrap: wrap; text-align: left; }
/* The gaps: dashed ovals in the line; the words already there (levels.json "bonusBlanks") are plain text */
.bq-slot { min-width: 3.2em; min-height: 2.2em; }
.bq-slot.bq-ph { min-width: 9em; }
.bq-pre { font-weight: 500; line-height: 1.35; padding: 0 .05em; white-space: nowrap; }
.bq-pre.ok { color: inherit; }
.bq-slots .b.bq-w { font-size: .82em; padding: .45em .85em .5em; }
.bq-punct { align-self: center; font-size: 1em; font-weight: 500; line-height: 1.35; margin-left: -.36em; }
.bq-slot:not(.filled) + .bq-punct { margin-left: -.1em; }

/* After the question: why, the question with its translation, Listen / Next; Skip before it */
.bq-why { margin: 0; max-width: 640px; text-align: center; font-size: 1rem; line-height: 1.4; text-wrap: balance; animation: pup .35s ease-out; }
.bq-why.ok b { color: hsl(150,60%,var(--lab-l)); }
.bq-why.no b { color: var(--underline); }
.bq-tr { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 8px; text-align: center; animation: pup .45s .1s ease-out backwards; }
.bq-qtr { margin: 0; display: inline-flex; align-items: center; gap: 8px; font-size: .98rem; opacity: .85; }
.bq-qtr .pick-badge { font-size: .75rem; }
.bq-tr .favstar svg { width: 20px; height: 20px; }
.bq-skip { appearance: none; border: 0; background: transparent; color: inherit; font: inherit; font-size: .88rem; opacity: .6; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: .3em .6em; }
.bq-skip:hover { opacity: .9; }
.bq-skip:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; border-radius: 6px; }
@media (max-width: 600px) {
  .bonus { gap: 14px; }
  .bq-prompt, .bq-box { padding: .75em 1em; }
  .b.bq-w { font-size: 1rem; padding: .5em .85em .55em; }
  .bq-slot { min-width: 2.8em; min-height: 2.1em; }
  .bq-cloud { gap: 10px 8px; }
  .bq-opt.pbtn { font-size: 1rem; }
}
@media (prefers-reduced-motion: reduce) { .bonus.in, .bonus.in .bq-home, .bq-cloud .bq-w, .bq-box.solved, .bq-why, .bq-tr, .bq-opt.shake { animation: none !important; } }

/* 43-guide.css — the Guide panel (25-guide.js), from Word Family Bubbles' 50-guide.css: EN / PT switch, the opening
   tip, section links, form chips in the game's colours (past green, didn't red,
   participle blue), example sentences, verb chips by pattern, the most common mistakes (level chip each), the folded
   "For the curious". */
.guidecard { max-width: 780px; max-height: 88vh; }
.favhead .hr { display: flex; align-items: center; gap: 8px; }
#guidebody { --h: 285; }
.gd-lang { display: flex; gap: 2px; padding: 2px; border-radius: 999px; border: 1px solid var(--dock-line); }
.gd-lang button { appearance: none; cursor: pointer; border: 0; border-radius: 999px; padding: .36em .7em; font-family: inherit; font-size: .74rem; font-weight: 600; letter-spacing: .06em; line-height: 1; color: var(--ink); background: transparent; opacity: .6; touch-action: manipulation; transition: background-color .25s ease, color .25s ease, opacity .25s ease; }
.gd-lang button:hover { opacity: 1; background: var(--dock-line); }
.gd-lang button[aria-pressed="true"] { opacity: 1; color: #fff; background: linear-gradient(135deg, #ff5ea8, #c04dff 55%, #8a5cff); }
.gd-lang button:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
/* a form chip (past green, didn't + base red, did + base violet, participle blue) and a verb chip */
.gd-c { display: inline-block; padding: .14em .62em .18em; border-radius: 999px; font-size: .8rem; font-weight: 600; line-height: 1.2; white-space: nowrap; color: #fff; background: hsl(var(--h), 62%, 46%); }
.gd-ws { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
/* the opening idea */
.gd-tip i { font-weight: 600; color: var(--underline); }
.gd-tip { display: flex; gap: 10px; margin: 0 2px 12px; font-size: .98rem; line-height: 1.45; }
.gd-tip > span:first-child { flex: none; }
.gd-tip b { color: var(--underline); }
.gd-pat { font-weight: 500; }
.gd-row .gd-pat { min-width: 10.5em; }
@media (max-width: 560px) { .gd-row .gd-pat { min-width: 0; } }
.gd-arrow { font-size: 1.1rem; font-weight: 600; line-height: 1; color: var(--underline); }
/* section links */
.gd-nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 12px; }
.gd-navb { appearance: none; cursor: pointer; font-family: inherit; font-size: .84rem; font-weight: 600; padding: .4em .95em; border-radius: 999px; color: var(--ink); background: transparent; border: 1.5px solid var(--dock-line); transition: transform .25s cubic-bezier(.34,1.56,.64,1), background-color .2s ease; }
.gd-navb:hover { transform: translateY(-2px); background: var(--dock-line); }
.gd-navb:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
/* sections */
#guidebody section { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--dock-line); scroll-margin-top: 10px; }
#guidebody h3 { margin: 0; font-size: 1.1rem; font-weight: 600; }
.gd-lead { margin: 4px 0 8px; font-size: .88rem; line-height: 1.4; opacity: .75; }
/* a folding card */
.gd-u { margin-top: 8px; border-radius: 18px; background: var(--fill-mid); border: 1.5px solid hsla(var(--h), 70%, var(--rim-l), .6); scroll-margin-top: 10px; }
.gd-u > summary, .gd-m > summary { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 10px 34px 10px 14px; position: relative; cursor: pointer; list-style: none; border-radius: 16px; transition: background-color .2s ease; }
.gd-u > summary::-webkit-details-marker, .gd-m > summary::-webkit-details-marker { display: none; }
.gd-u > summary::after, .gd-m > summary::after { content: ""; position: absolute; right: 16px; top: calc(50% - 6px); width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; opacity: .6; transform: rotate(45deg); transition: transform .25s ease; }
.gd-u[open] > summary::after, .gd-m[open] > summary::after { transform: rotate(-135deg) translate(-3px, -3px); }
.gd-u > summary:hover, .gd-m > summary:hover { background: hsla(var(--h), 85%, 72%, .12); }
.gd-u > summary:focus-visible, .gd-m > summary:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
.gd-u h4 { margin: 0; font-size: 1.05rem; font-weight: 600; color: hsl(var(--h), 60%, var(--lab-l)); }
.gd-u[open] { padding-bottom: 12px; }
.gd-u[open] > :not(summary) { margin-left: 14px; margin-right: 14px; }
/* text blocks: a form, a verb group, a curiosity */
.gd-word + .gd-word { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--dock-line); }
.gd-wh { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0; font-size: .97rem; }
.gd-why { margin: 4px 0 0; font-size: .9rem; line-height: 1.45; opacity: .85; }
.gd-list { display: flex; flex-direction: column; gap: 8px; }
.gd-row { padding: 10px 14px; border-radius: 16px; background: var(--fill-mid); border: 1px solid var(--dock-line); }
/* the most common mistakes */
#gd-mis h3 { color: hsl(350, 65%, var(--lab-l)); }
.gd-mlist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; align-items: start; gap: 10px; }
.gd-mlist li { border-radius: 16px; background: var(--fill-mid); border: 1px solid var(--dock-line); }
.gd-m { --h: 350; }
.gd-m > summary { padding: 11px 34px 11px 14px; }
.gd-m[open] { padding-bottom: 12px; }
.gd-m[open] > :not(summary) { margin-left: 14px; margin-right: 14px; }
.gd-wrong, .gd-right { margin: 0; font-size: .97rem; font-weight: 600; line-height: 1.4; }
.gd-wrong { color: hsl(350, 70%, var(--lab-l)); text-decoration: line-through; text-decoration-thickness: 1.5px; text-decoration-color: hsla(350, 70%, 55%, .6); }
.gd-wrong span, .gd-right span { display: inline-block; text-decoration: none; margin-right: 2px; }
.gd-right { color: hsl(145, 60%, var(--lab-l)); }
@media (max-width: 640px) { .gd-mlist { grid-template-columns: 1fr; } }
.gd-cur { margin-top: 22px; }
@media (prefers-reduced-motion: reduce) { .gd-navb, .gd-u > summary::after, .gd-m > summary::after { transition: none; } }

/* examples, verb chips, mistakes' level chip */
.gd-exs { margin: 5px 0 0; font-size: .95rem; line-height: 1.45; }
.gd-exs b { font-weight: 700; color: hsl(var(--h), 65%, var(--lab-l)); }
.gd-v { display: inline-block; padding: .14em .65em .18em; border-radius: 999px; font-size: .88rem; line-height: 1.3; white-space: nowrap; background: var(--bg-a); border: 1px solid var(--dock-line); }
.gd-v b { font-weight: 700; color: hsl(150, 60%, var(--lab-l)); }
.gd-note { margin: 2px 4px 0; }
.gd-gnote { margin-top: 8px; }
.gd-extr { margin: 1px 0 0; font-size: .8rem; line-height: 1.4; opacity: .7; }
.gd-to { display: inline-flex; align-items: center; gap: 6px 10px; white-space: nowrap; }
.gd-m > summary { flex-wrap: nowrap; }
.gd-m .lvchip { flex: none; font-size: .6rem; padding: .28em .7em; background: linear-gradient(135deg, var(--lv), var(--lv2)); text-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
.gd-m[open] > .gd-right { margin-top: 2px; }

/* 60-scrollbar.css — scrollbars as in the newer games (Guide, lists, end card, tour card; the page has none): a thin glossy pill with the
   pink-to-purple gradient on a clear track. Chrome / Edge / Safari use the ::-webkit-scrollbar parts; Firefox only takes
   colours, so it gets a thin pink thumb (in @supports, since Chrome would let these override the pill). */
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: transparent; margin: 18px 0; }
::-webkit-scrollbar-thumb {
  border: 3px solid transparent; border-radius: 999px; background-clip: padding-box;
  background-image: linear-gradient(180deg, hsl(315,85%,66%), hsl(275,80%,64%));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45);
}
::-webkit-scrollbar-thumb:hover { background-image: linear-gradient(180deg, hsl(315,90%,60%), hsl(275,85%,58%)); }
::-webkit-scrollbar-thumb:active { border-width: 2px; }
::-webkit-scrollbar-button, ::-webkit-scrollbar-corner { display: none; background: transparent; }
@supports (-moz-appearance: none) {
  * { scrollbar-width: thin; scrollbar-color: hsl(295,82%,66%) transparent; }
}
/* The page itself still scrolls on short screens, but shows no bar (only the cards and lists do). */
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }

</style>

egular verbs by pattern (the ones of your level), participles and the most common mistakes."}],"guide":{"_about":"The Guide (25-guide.js). English text; i18n/<lang>.json \"guide\" has the same shape (arrays are merged item by item, so a translation only needs the fields it changes). *word* = an English word or form (italics in sentences, the form's colour in examples). an example's translation (\"tr\") lives only in the i18n pack and shows under it in both languages. f = a form: past, neg (didn't + base), q (did + base), pp (participle). lv = shown from that level up. A group's x shows under its title, note under its verbs; v = its verbs (verbs.json keys; the Guide shows the ones up to the level being played); the group with \"rest\" collects every verb no other group lists. build.py checks all of it.","title":"Simple past guide","tip":"Finished time, finished action: the <b>past form<\/b> (<i lang=\"en\">went<\/i>). Not this time: <b>didn't + the base<\/b> (<i lang=\"en\">didn't go<\/i>). <i lang=\"en\">didn't<\/i> already says \"past\", so the verb goes back to its base.","forms":{"past":"past form","neg":"didn't + base","q":"did + base","pp":"participle"},"nav":{"forms":"The forms","irr":"Irregular verbs","pp":"Participles","mis":"Common mistakes"},"formsTitle":"The forms","formsLead":"The same form for every person: *I went, she went, they went*.","formRows":[{"t":"Affirmative","f":"past","ex":"She *went* home."},{"t":"Negative","f":"neg","ex":"She *didn't go* home."},{"t":"Yes / no question","f":"q","ex":"*Did* she *go* home? Yes, she did. / No, she didn't."},{"t":"Wh- question","f":"q","ex":"Where *did* she *go*?"},{"t":"Subject question (no did)","f":"past","lv":"B1","ex":"Who *went* home?"}],"irrTitle":"Irregular verbs by pattern","irrLead":"The verbs of this level and the ones before it, in groups that change the same way.","groups":[{"t":"No change","note":"*read* changes its sound: the past sounds like *red*.","v":["put","cut","hit","quit","set","bet","sp
