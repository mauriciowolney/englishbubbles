rma base<\/b> (<i lang=\"en\">didn't go<\/i>). O <i lang=\"en\">didn't<\/i> já diz \"passado\", então o verbo volta à forma base.","forms":{"past":"passado","neg":"didn't + base","q":"did + base","pp":"particípio"},"nav":{"forms":"As formas","irr":"Verbos irregulares","pp":"Particípios","mis":"Erros comuns"},"formsTitle":"As formas","formsLead":"A mesma forma para todas as pessoas: *I went, she went, they went*.","formRows":[{"t":"Afirmativa"},{"t":"Negativa"},{"t":"Pergunta de sim / não"},{"t":"Pergunta com wh-"},{"t":"Pergunta pelo sujeito (sem did)"}],"irrTitle":"Verbos irregulares por padrão","irrLead":"Os verbos deste nível e dos anteriores, em grupos que mudam do mesmo jeito.","groups":[{"t":"Não mudam","note":"*read* muda o som: no passado soa como *red*."},{},{},{"t":"O e longo fica curto"},{},{"t":"Um o no passado"},{},{"t":"Um u no passado"},{},{"t":"Mais curtos"},{},{"t":"Únicos","x":"Sem padrão: aprenda de cor."}],"ppTitle":"Particípios","ppLead":"As rodadas 3 e 4 juntam o passado com o particípio: *took + taken*.","ppRows":[{"tr":"Ela quebrou o celular."},{"tr":"A bicicleta foi roubada ontem à noite."},{"p":"sem verbo auxiliar","tr":"Ela quebrou o celular ontem."}],"ppSame":"Muitos verbos usam a mesma forma para os dois: *bought, made, found*. No jogo essa bolha flutua sozinha: mande-a para a prateleira.","misTitle":"Erros mais comuns","misLead":"Toque em um para ver a frase certa.","mistakes":[{"why":"*Yesterday* é tempo terminado: use o passado."},{"why":"O *didn't* já mostra o passado: depois dele, a forma base."},{"why":"Nada de *-s* depois de *didn't*, nem com *he, she, it*."},{"why":"*go* é irregular: o passado é *went*."},{"why":"A negativa precisa de *didn't*; só *not* não basta."},{"why":"O *Did* já mostra o passado: o verbo volta à forma base."},{"why":"A pergunta precisa de *did* antes da pessoa, e da forma base depois dela."},{"why":"*bring* não segue *sing → sang*: é *brought*."},{"why":"Depois de *has / have / had*, o particípio, não o passado."},{"why":"*seen* é o particípio; *saw* é só o passado."},{"why":"Depois de *was / were*, o particípio."},{"why":"Quando *who* é o sujeito, não tem *did*: o verbo vai para o passado."}],"curTitle":"Para os curiosos","curious":[["Did para dar ênfase","*I did lock the door!* = Eu tranquei a porta, sim! O *did* forte + a forma base insiste que aconteceu."],["be não usa didn't","*I wasn't hungry*, não *I didn't be hungry*. O *could* também não: *I couldn't swim*."],["never, e não didn't never","*never* já é negativo: *She never called*, não *She didn't never call*."],["got ou gotten?","Inglês americano: *It has gotten cold*. Inglês britânico: *It has got cold*."],["learned ou learnt?","O inglês britânico também escreve *learnt, dreamt, burnt*. O americano prefere *learned, dreamed, burned*."],["hung ou hanged?","Coisas são *hung*: *She hung the picture*. *hanged* é só para enforcar alguém."],["E os verbos regulares?","A maioria só ganha *-ed*: *worked, played*. O jogo pratica os irregulares porque eles precisam ser memorizados."]]},"tour":{"ui":{"step":"Passo {n} de {total}","back":"Voltar","next":"Próximo","play":"Vamos jogar!","close":"Fechar o tutorial"},"steps":{"welcome":{"t":"Pronto para praticar o passado?","x":"Muitos verbos comuns são <b>irregulares<\/b> no passado: <b>see<\/b> vira <b>saw<\/b>. Mas a negativa é fácil: <b>didn't<\/b> + a forma base, então <b>didn't see<\/b> (nunca <i>didn't saw<\/i>). Cada jogo tem <b>4 rodadas<\/b>. Veja alguns pares:"},"level":{"t":"Escolha seu nível","x":"<b>A1<\/b>: 4 pares por rodada, e os significados aparecem sozinhos. <b>A2<\/b>: 4 pares e uma bolha armadilha. <b>B1<\/b>: 5 pares, duas armadilhas e verbos mais difíceis, com menos tentativas e dicas. No total, o jogo tem <b>{verbs} verbos irregulares<\/b>."},"pool":{"t":"1. Junte os pares","x":"<b>Arraste<\/b> uma forma do passado até a sua negativa (<b>saw<\/b> até <b>didn't see<\/b>). Ou <b>toque<\/b> em uma bolha e depois na outra. Cada par sobe para a prateleira, e você ouve a pronúncia."},"trap":{"t":"Cuidado com a armadilha!","x":"No <b>A2<\/b> (uma bolha) e no <b>B1<\/b> (duas bolhas), as armadilhas são erros comuns, como <b>didn't went<\/b>, <b>didn't goes<\/b>, <b>goed<\/b> ou <b>seen<\/b> (em vez de <b>saw<\/b>). Jogue-as na <b>lixeira<\/b> para estourá-las."},"shelf":{"t":"Seus pares","x":"Os pares formados ficam aqui. Depois você vê o que cada verbo significa: no <b>A1<\/b> sozinho, no A2 e no B1 com o botão <b>Tradução<\/b>."},"gaps":{"t":"2. Complete o texto","x":"Aparece um texto curto com <b>duas lacunas<\/b>. Arraste a forma certa dos pares até cada lacuna — ou toque nela para preencher a lacuna destacada. Aconteceu (<b>went<\/b>) ou não (<b>didn't go<\/b>)? Leia as palavras em volta da lacuna!"},"hint":{"t":"Dicas","x":"Travou no texto? Uma <b>dica<\/b> deixa cinza um par que o texto não usa. As dicas valem para o jogo todo, e cada dica que você economiza vira um <b>ponto extra<\/b> no final."},"score":{"t":"Pontos","x":"<b>+1<\/b> para cada par formado sem erro (e por estourar a armadilha), <b>+2<\/b> para cada lacuna certa na primeira tentativa (+1 na segunda). Acertos seguidos formam um <b>combo<\/b>! No final você vê os verbos para revisar."},"bonus":{"t":"Rodada bônus: perguntas","x":"Depois do último texto, uma <b>rodada bônus<\/b> faz perguntas sobre os seus textos <b>no passado<\/b>: <b>Did<\/b> Sam <b>drink<\/b> his milk? What <b>did<\/b> he <b>eat<\/b>? No <b>A1<\/b> você escolhe a pergunta certa; no <b>A2<\/b> e no <b>B1<\/b> você monta a pergunta com bolhas de palavras. Cuidado: depois de <b>did<\/b>, o verbo volta à forma base!"},"modes":{"t":"Outras formas de jogar","x":"Toque em <b>new game<\/b> para um <b>desafio de velocidade de 1 minuto<\/b> (só juntar pares: o máximo que conseguir), ou <b>Compreensão oral<\/b>: ouça o texto e <b>digite<\/b> os verbos que faltam, para praticar a escrita das formas do passado."},"guide":{"t":"O Guia","x":"O <b>Guia<\/b> resume o passado simples: as formas, os /* 08-sky.js — the bubbles drifting up behind everything (from Be Do Modal, Nov 2026, itself from English Bubbles): 7
   see-through, softly blurred bubbles of random size (40-140 px), place and pace (95-145 s a climb). At page load they
   are already part-way up, spread over the screen, and the layer fades in (.sky.in). Only transform / opacity move;
   they pause while a bubble is carried (body.carrying, 17-shine.js) and are left out with reduced motion. Look: .sky
   at the end of 00-base.css. */
(function () {
  var host = $("sky");

  var hues = [215, 330, 150, 265, 30, 190];
  for (var k = 0; k < 7; k++) {
    var s = document.createElement("span"), size = 40 + Math.round(Math.random() * 100), t = 95 + Math.round(Math.random() * 50);
    // a negative delay starts the climb part-way: spread from 15% to 80% of the way up, bubble by bubble
    var at = (0.15 + 0.65 * (k + Math.random() * 0.8) / 7) * t;

      "--h:" + hues[k % hues.length] + ";--t:" + t + "s;--d:-" + at.toFixed(1) + "s;" +

})();

/* 10-game.js — game state, flow, round building and scoring. One game = ROUNDS rounds at the chosen level.
   A round: the match phase (12-match.js: join each past form with its negative, saw + didn't see; pop the trap bubble
   at A2/B1), then the gaps phase (13-gaps.js: a short text with 2 gaps, filled from the pairs), then the reveal card
   (14-reveal.js). Round building (buildRound) follows the repetition rules in CLAUDE.md: no verb of the previous round
   comes back in the next one, and a verb that already filled a gap never comes back in the same game.
   Points: +1 for each pair matched with no wrong try on its bubbles, +1 for popping the trap with no mistake, +GAP_PTS
   for a gap right first time, +1 on the second try. Hints (text only) come from a pool for the whole game (levels.json
   "hints"), at most hintsPerRound a round; every unused hint is a bonus point at the end.
   Participle rounds (levels.json "ppRounds": the last ones of a normal game): each past form is matched with its
   participle (took + taken) instead of its negative, and a verb whose two forms are the same (bought) floats alone and
   goes up to the shelf by itself (12-match.js claimSolo); the text (marked "pp") has one past gap and one participle gap.
   Modes (22-modes.js, 23-listen.js): "normal"; "speed" (60 s of matching rounds back to back: no text, no hints, no reveal card);
   "listen" (no matching: the voice reads the text and the player types the two verb forms);
   "practice" (17-lists.js "Practice these": a normal game with the texts of a list, G.src = "fav" | "missed" | "recent";
   each round follows the rules of its text's level, G.rl; no best score). */
const ROUNDS = 4, GAP_PTS = 2;
const LEVELS = Object.keys(DATA.levels), VERBS = DATA.verbs;
const lvIdx = l => LEVELS.indexOf(l);
// The level whose rules the round follows: the game's, or in a practice game the level of the round's text.
const curLv = () => G.rl || G.level;
const lvl = () => DATA.levels[curLv()] || {};
const maxTries = () => lvl().tries || 3;
// 0 is a real value, so only a missing key falls back to the default.
const lvlNum = (k, d) => lvl()[k] == null ? d : lvl()[k];
// The hint pool belongs to the game's level, not to the round's.
const hintPool = () => { const h = (DATA.levels[G.level] || {}).hints; return h == null ? 5 : h; };
const maxHints = () => lvlNum("hintsPerRound", 2);
// A verb without "pp" has the same past and participle (bought): in a participle round it floats as one bubble.
const isSolo = v => !VERBS[v].pp;
// A form: "past" (saw), "neg" (didn't see), "pp" (seen) or "solo" (bought, past and participle). true = "neg".
const isNeg = f => f === true || f === "neg";
// A gap's form (build.py: neg, pp).
const gapF = g => g.pp ? "pp" : g.neg ? "neg" : "past";
const formOf = (v, f) => isNeg(f) ? "didn't " + v : f === "pp" ? VERBS[v].pp || VERBS[v].past : VERBS[v].past;
// The same, spelled for the speech engine: verbs.json "tts" fixes a past form it would misread (read -> "red").
const sayOf = (v, f) => isNeg(f) ? "didn't " + (VERBS[v].ttsBase || v) : f === "pp" && !isSolo(v) ? VERBS[v].pp : VERBS[v].tts || VERBS[v].past;
const PAIR_HUES = [200, 330, 150, 28, 265, 95];
const G = { level: "", mode: "normal", idx: 0, total: ROUNDS, score: 0, results: [], streak: 0, combo: 0, hintsLeft: 0,
  used: new Set(), prev: new Set(), seen: {}, missed: [], missedF: {}, r: null, phase: "idle" };
const stage = $("stage"), shelfEl = $("shelf"), centerEl = $("center"), poolEl = $("pool"), binEl = $("bin"), paraEl = $("para");
const revealEl = $("reveal"), hintEl = $("hint"), toolsEl = $("tools");
const scoreEl = $("score"), scEl = $("sc"), bestEl = $("bestlbl"), hintBtn = $("hintbtn"), trBtn = $("trbtn"), triesEl = $("tries");

/* ---------- Game flow ---------- */
// mode: "normal" | "speed" | "listen" | "practice" (see the header). A practice game is only repeated when asked
// (Play again): the level buttons and closing the end card go back to a normal game, and so does an empty list.
function newGame(level, mode = G.mode === "practice" ? "normal" : G.mode) {
  G.ids = mode === "practice" ? practiceIds(G.src) : null;
  if (mode === "practice" && !G.ids.length) { mode = "normal"; G.ids = null; }
  G.level = level; G.mode = mode; G.rl = ""; G.doneP = new Set(); applyUi();
  document.body.classList.toggle("practice-mode", mode !== "normal");   // any other mode: Back returns to a normal game (07-back.js)
  G.idx = 0; G.score = 0; G.pairsDone = 0; G.results = []; G.streak = 0; G.combo = 0; G.r = null;
  G.used = new Set(); G.prev = new Set(); G.seen = {}; G.missed = []; G.missedF = {}; G.trapKinds = []; G.ppShown = false; G.ppSeen = false;
  G.total = mode === "speed" ? Infinity : Math.min(ROUNDS, (G.ids || DATA.paras[level] || []).length);
  G.hintsLeft = mode === "speed" ? 0 : hintPool();
  stopSpeed(); hideGloss(); clearBonus();
  stage.hidden = toolsEl.hidden = false; revealEl.hidden = true; $("lsnrow").hidden = mode !== "listen";
  showScore(); showCombo();
  if (!(DATA.paras[level] || []).length) { G.phase = "idle"; hintEl.textContent = tx("noParas"); return; }
  if (mode === "speed") return speedIntro();
  startRound();
}
// Verbs the level can offer: its own and the easier levels' ones.
function levelVerbs(l = G.level) { return Object.keys(VERBS).filter(v => lvIdx(VERBS[v].lv) <= lvIdx(l)); }
// Distractors: verbs seen least in this game first, the level's own verbs a little more often, random among equals.
function pickDistractors(free, k) {
  const score = v => (G.seen[v] || 0) * 4 + (VERBS[v].lv === curLv() ? 0 : 1.5) + Math.random() * 2;
  return free.map(v => [score(v), v]).sort((a, b) => a[0] - b[0]).slice(0, k).map(x => x[1]);
}
// Is the next round of a normal game a participle round? The last levels.json "ppRounds" rounds are.
const ppRoundNext = () => G.mode === "normal" && G.idx >= ROUNDS - ((DATA.levels[G.level] || {}).ppRounds || 0);
// Distractors for a round; a participle round has one or two verbs whose past and participle are the same (bought),
// at random, so finding one never tells the player whether another is there. soloAns = how many of the text's answers
// are one already (at most one). Fewer when the free verbs can't give them. null when there aren't enough.
function roundDistractors(free, k, pp, soloAns) {
  if (!pp) return free.length >= k ? pickDistractors(free, k) : null;
  const rest = free.filter(v => !isSolo(v)), solos = free.filter(isSolo), want = Math.random() < .5 ? 1 : 2;
  for (let s = Math.min(k, Math.max(0, want - soloAns)); s >= 0; s--)
    if (solos.length >= s && rest.length >= k - s) return [...pickDistractors(solos, s), ...pickDistractors(rest, k - s)];
  return null;
}
// The next round: a paragraph whose two verbs are new to this game and weren't in the previous round, plus
// distractor pairs that are neither of those, nor a verb that also fits a gap ("fits"). build.py simulates this to be
// sure a whole game can always be built; the relaxed pass (previous round allowed) is only a safety net.
function buildRound() {
  const n = lvl().pairs || 4, pool = levelVerbs();
  // Speed challenge: only matching, so no paragraph: the verbs seen least in this game, not those of the previous round.
  if (G.mode === "speed") return { p: null, verbs: shuffle(pickDistractors(pool.filter(v => !G.prev.has(v)), n)) };
  // Practice game: the list's texts not played yet, each with the pairs and verbs of its own level. The player chose
  // them, so a third pass lets an answer verb come back rather than leave a text out.
  // A normal game's participle rounds take the texts marked "pp", the other rounds (and listening) the rest; a practice
  // round is whatever its text is.
  const want = ppRoundNext();
  const list = G.ids ? G.ids.map(id => PARA[id]).filter(p => p && !G.doneP.has(p.id)) : orderParas((DATA.paras[G.level] || []).filter(p => !!p.pp === want));
  for (const relax of G.ids ? [0, 1, 2] : [0, 1]) {
    for (const p of list) {
      const lv = G.ids ? PARA_LV[p.id] : G.level, k = G.ids ? DATA.levels[lv].pairs || 4 : n, vs = p.gaps.map(g => g.v);
      if (vs.some(v => (relax < 2 && G.used.has(v)) || (!relax && G.prev.has(v)))) continue;
      const block = new Set([...G.used, ...vs, ...p.fits, ...(relax ? [] : G.prev)]);
      const free = (G.ids ? levelVerbs(lv) : pool).filter(v => !block.has(v));
      const ds = roundDistractors(free, k - 2, !!p.pp, vs.filter(isSolo).length);
      if (!ds) continue;
      return { p, lv, kind: p.pp ? "pp" : "neg", verbs: shuffle([...vs, ...ds]) };
    }
  }
  return null;
}
// A1 has no trap; A2 hides one wrong form among the bubbles, B1 two (levels.json `traps`), each from a different verb.
// Three kinds of mistake, so the player can't learn one pattern: "didnt" (didn't went / didn't goes), "ed" (verbs.json `wrong`: goed, wented, brang) and "pp" (the participle: seen for saw).
// "ppx" (verbs.json `wrongPp`: boughten, tooken, brung) is in every round, for variety; in a participle round it comes
// from the solitary verb when it has one, and "didnt" is left out. A level with participle rounds leaves "pp" out
// (there, seen is a right bubble).
// The kind is picked first, at random but never the previous trap's (G.trapKinds), then a verb that has it.
function trapOpts(v, kind) {
  const V = VERBS[v], o = {};
  if (V.wrong) o.ed = V.wrong;
  if (V.wrongPp) o.ppx = V.wrongPp;
  if (kind === "pp") return o;
  o.didnt = [V.past !== v && "didn't " + V.past, "didn't " + V.s].filter(Boolean);
  if (V.pp && V.pp !== v && !lvl().ppRounds) o.pp = [V.pp];
  return o;
}
function makeTrap(verbs, rkind) {
  const want = G.mode === "listen" ? 0 : lvl().traps || 0, out = [];
  let free = shuffle(verbs.slice());
  while (out.length < want && free.length) {
    const recent = G.trapKinds.slice(-1), opts = free.map(v => ({ v, o: trapOpts(v, rkind) }));
    const kinds = shuffle([...new Set(opts.flatMap(x => Object.keys(x.o)))]);
    // A random kind that isn't the previous trap's (avoiding more would make a fixed cycle of 3 kinds).
    const age = k => recent.includes(k) ? recent.lastIndexOf(k) + 1 : 0;
    kinds.sort((a, b) => age(a) - age(b));
    const kind = kinds[0]; if (!kind) break;
    const x = (kind === "ppx" && opts.find(y => y.o.ppx && isSolo(y.v))) || opts.find(y => y.o[kind]);
    out.push({ v: x.v, text: pick(x.o[kind]), kind });

}
function startRound() {
  let b = buildRound();

  if (!b && G.mode === "speed") { G.used = new Set(); b = buildRound(); }
  if (!b) { G.total = G.idx; updateProgress(); return showEnd(); }
  // A practice round takes the rules (and the instructions' language) of its text's level.
  if (G.ids) { G.rl = b.lv; applyUi(); showScore(); }
  const p = b.p || { gaps: [] }, n = b.verbs.length, kind = b.kind || "neg", traps = makeTrap(b.verbs, kind);
  if (p.id) { markShown(p.id); G.doneP.add(p.id); }
  b.verbs.forEach(v => { G.seen[v] = (G.seen[v] || 0) + 1; });
  p.gaps.forEach(g => G.used.add(g.v));
  G.prev = new Set(b.verbs);
  const hues = shuffle(PAIR_HUES.slice());
  G.r = { p, kind, verbs: b.verbs, hue: Object.fromEntries(b.verbs.map((v, i) => [v, hues[i % hues.length]])), trapInfos: traps,
    pts: 0, max: G.mode === "listen" ? p.gaps.length * GAP_PTS : n + traps.length + p.gaps.length * GAP_PTS, hints: 0, words: [], pairs: {}, order: [], traps: [], trapDebt: 0,
    sel: null, gaps: [], active: -1, trOn: false, wrongs: new Set(),

  if (kind === "pp" && G.mode !== "practice" && !G.ppShown) { G.ppShown = true; setTimeout(() => { if (G.r && G.r.p === p) toast(tx("ppNew")); }, reduceMotion ? 0 : 500); }
  renderTools(); updateProgress();
  stage.classList.remove("out"); stage.classList.add("rise");
  setTimeout(() => stage.classList.remove("rise"), 1400);
}
function nextRound() {
  if (G.phase !== "done") return;
  G.phase = "idle";
  hush();

  // After the last round: the bonus round (questions about the game's texts, 24-bonus.js), then the results.
  if (G.idx >= G.total) { updateProgress(); if (bonusDue()) startBonus(); else showEnd(); return; }
  stage.classList.add("out"); revealEl.classList.add("out");
  setTimeout(() => { revealEl.classList.remove("out"); startRound(); }, reduceMotion ? 0 : 260);
}

  r.wrongs.forEach(v => { if (!G.missed.includes(v)) G.missed.push(v); (G.missedF[v] = G.missedF[v] || new Set()).add(r.kind || "neg"); });
  if (r.p.id) { recordProgress(r.p.id, perfect); markSeen(r.p.id, r.gaps.every(g => g.ok)); }
  tickDay();
  G.results.push({ p: r.p.id ? r.p : null, pts: r.pts, max: r.max, perfect, gaps: r.gaps.map(g => ({ v: g.v, f: g.f, ok: g.ok })) });

  renderTools(); updateProgress();
  // Speed challenge: no reveal card, a short look at the text, then the next round.
  if (G.mode === "speed") { if (perfect) sndWin(); return speedNext(r, perfect); }
  burst(paraEl);

  if (autoRead()) setTimeout(() => { if (G.r === r) speak(paraText(r.p, true), $("listen")); }, 250);

const autoRead = () => G.mode === "normal" || G.mode === "practice";
// A verb the player had trouble with this round goes to the end screen's review list.
function missVerb(v) { if (v && VERBS[v]) G.r.wrongs.add(v); }

/* ---------- Points and combo ---------- */
function addPts(n, el) {
  if (!n) return;
  G.score += n; G.r.pts += n;
  showScore(); flash(scoreEl, "up"); if (el) toastAt(el, "+" + n);
}
// A right move: the combo grows. Returns how many semitones the chime climbs.
function comboUp() { G.combo++; showCombo(); return Math.min(G.combo - 1, 6) * 2; }
function comboReset() { G.combo = 0; showCombo(); }
function showCombo() { const c = $("combo"); c.hidden = G.combo < 3; c.textContent = "×" + G.combo; if (G.combo >= 3) flash(c, "tick"); }
const BEST = { normal: "spp-best-", speed: "spp-speed-", listen: "spp-listen-" };
function bestKey() { return (BEST[G.mode] || BEST.normal) + G.level; }
function showScore() {
  scEl.textContent = G.score;
  bestEl.textContent = tx("best", { n: parseInt(load(bestKey()), 10) || 0 });
}

/* ---------- Tools row and progress ---------- */
function renderTools() {
  const r = G.r, gaps = G.phase === "gaps";
  hintBtn.hidden = !gaps || G.mode === "speed" || !hintPool() || !maxHints();
  hintBtn.disabled = !G.hintsLeft || !r || r.hints >= maxHints() || !hintable().length;
  $("hintleft").textContent = tx("left", { n: G.hintsLeft });
  hintBtn.title = tx(G.mode === "listen" ? "hintTitleListen" : "hintTitle", { n: G.hintsLeft, m: maxHints() });
  // Levels without "autoTranslate" show the meanings when the player asks (A2, B1).
  trBtn.hidden = !r || lvl().autoTranslate || G.phase !== "gaps" || G.mode === "listen";
  $("checkbtn").hidden = !(gaps && G.mode === "listen");

function updateProgress() {

/* ---------- Hints and translations ---------- */
// Pairs a hint can grey out: not an answer of the text, not greyed yet.
function hintable() {
  const r = G.r; if (!r || G.phase !== "gaps") return [];
  if (G.mode === "listen") return r.gaps.filter(g => !g.done && !g.base);
  const ans = new Set(r.p.gaps.map(g => g.v));
  return r.order.filter(P => !ans.has(P.v) && !P.off);
}
function useHint() {
  const r = G.r, c = hintable();

  if (G.mode === "listen") { r.hints++; G.hintsLeft--; sndHint(); listenHint(c); renderTools(); flash($("hintleft"), "tick"); return; }
  const P = pick(c);

hintBtn.addEventListener("click", useHint);
trBtn.addEventListener("click", () => {
  const r = G.r; if (!r) return;
  r.trOn = !r.trOn; renderShelfTr(); renderTools();
  if (r.trOn) sndHint(); else sndBack();

// Idle reminder: after 15 s without a tap or key (again every 15 s) in the text phase, the hint button wiggles while a
// hint is usable.
let lastAct = Date.now();
["pointerdown", "keydown"].forEach(t => addEventListener(t, () => { lastAct = Date.now(); }, true));
setInterval(() => {
  if (G.phase !== "gaps" || Date.now() - lastAct < 15000 || hintBtn.disabled || hintBtn.hidden || document.activeElement.classList.contains("gin")) return;
  lastAct = Date.now(); if (!reduceMotion) flash(hintBtn, "nudge");
}, 1000);

/* 11-drag.js — moving bubbles: pointer drag & drop, tap, keyboard, and the fly animations.
   Match phase: a pool bubble is dropped on another bubble (its pair, hopefully) or on the bin (the trap bubble).
   Gaps phase: one half of a pair (saw, or didn't see) is dropped on a gap.
   While dragging, the bubble stays in place (faded) and a copy follows the pointer; targets light up (.hot) and a gap
   pulls the copy in a little. A press that doesn't move is a tap: in the match phase the first tap picks a bubble and
   the second tap (another bubble, or the bin) tries it; in the gaps phase a tap fills the highlighted gap.
   Squash and stretch (from Be Do Modal via Word Family Bubbles, Nov 2026): the carried bubble stretches along the way
   it moves, more the faster, and as much thinner across; it rounds out as the pointer slows; let go, the bubble that
   lands wobbles. The bonus round's drag (24-bonus.js) uses the same sqStart / sqMove / sqEnd / wobble. */

const STRETCH = .2, sq = { el: null, vx: 0, vy: 0, lx: 0, ly: 0, lt: 0, raf: 0 };

function sqStart(el) { sq.el = el; sq.vx = sq.vy = 0; sq.lt = 0; }
function sqMove(x, y) {

  if (sq.lt) { const dt = Math.max(8, now - sq.lt); sq.vx += ((x - sq.lx) / dt - sq.vx) * .5; sq.vy += ((y - sq.ly) / dt - sq.vy) * .5; }   // px per ms, smoothed
  sq.lx = x; sq.ly = y; sq.lt = now;

}
function sqTick() {
  sq.raf = 0; if (!sq.el) return;

  let t = "scale(1.1) rotate(-3deg)";   // the carried look (.w.drag, 10-game.css)

  sq.el.style.transform = t;

// The carried bubble is let go: its stretch is cleared; returns how much the landing one wobbles.

/* 12-match.js — the match phase and the shelf of pairs. Every verb of the round floats in the pool twice: its past

/* ---------- Pool ---------- */

/* ---------- A1: pick the question ---------- */
// Wrong versions of a question, each a typical mistake (kind = which one, for the note under the options).
function qVariants(p) {

    nodid: tx("bqNeedDid", { f: formula(B.kind) }), was: tx("bqWas"),
    subjdid: tx("bqSubj", { f: formula("subj") }), subjbase: tx("bqSubjPast", { p: esc(V.past) }),
