:["Maria lives in Canada.","Peter works on Oxford Street.","We visited Lake Como."],"trap":{"pt":"A Maria mora no Canadá.","wrong":"The Maria lives in the Canada.","right":"Maria lives in Canada."}},"poss":{"art":"0","name":"my, your, Tom's, this…","namePt":"my, your, Tom's, this…","hue":300,"rule":"No article before *kw|my / your / his / her / our / their*, a name + 's, *kw|this / that / these / those*, or every / each / some / no: my car, Tom's bike, this book, every day.","rulePt":"Sem artigo antes de *kw|my / your / his / her / our / their*, nome + 's, *kw|this / that / these / those*, ou every / each / some: my car (o meu carro), Tom's bike (a bicicleta do Tom), this book (este livro).","ex":["My sister is a doctor.","Is this your bag?","Every student has a laptop."],"trap":{"pt":"O meu irmão mora com os meus pais.","wrong":"The my brother lives with the my parents.","right":"My brother lives with my parents."}},"routine":{"art":"0","name":"Meals, days, next / last","namePt":"Refeições, dias, next / last","hue":270,"rule":"No article with *kw|meals* (have breakfast / lunch / dinner), *kw|days, months and holidays* (on Monday, in July, at Christmas), at night, and *kw|next / last* + time (next week, last year).","rulePt":"Sem artigo com *kw|refeições* (have breakfast = tomar o café da manhã), *kw|dias, meses e feriados* (on Monday = na segunda, at Christmas = no Natal), at night (à noite) e *kw|next / last* + tempo (next week = na semana que vem, last year = no ano passado).","ex":["We have lunch at noon.","I'm free on Friday.","We moved here last year."],"trap":{"pt":"Na segunda eu almoço com a minha avó. No ano passado eu fui para o Chile.","wrong":"On the Monday I have the lunch with my grandma. In the last year I went to the Chile.","right":"On Monday I have lunch with my grandma. Last year I went to Chile."}},"activity":{"art":"0","name":"Sports, languages, subjects","namePt":"Esportes, idiomas, matérias","hue":285,"rule":"No article with *kw|sports and games* (play soccer, play chess), *kw|languages* (speak English, English is easy) and *kw|school subjects* (study history). (Musical instruments usually take *the*: play the guitar.)","rulePt":"Sem artigo com *kw|esportes e jogos* (play soccer = jogar futebol), *kw|idiomas* (English is easy = O inglês é fácil) e *kw|matérias* (study history). (Instrumentos musicais costumam levar *the*: play the guitar = tocar violão.)","ex":["We play basketball after school.","English is easier than Chinese.","Math is my favorite subject."],"trap":{"pt":"O inglês é fácil, mas a matemática é difícil.","wrong":"The English is easy, but the math is hard.","right":"English is easy, but math is hard."}},"inst":{"art":"0","name":"school, work, bed, home, by bus","namePt":"escola, trabalho, cama, casa, de ônibus","hue":265,"rule":"No article in set phrases like *kw|go to school / work / bed / church / college / prison*, at school / work / home, and *kw|by + transport*: by bus, by car, by plane (but: in my car, on the bus).","rulePt":"Sem artigo em expressões como *kw|go to school / work / bed* (ir para a escola, o trabalho, a cama), go to prison (ser preso), at home (em casa) e *kw|by + transporte*: by bus (de ônibus), by car (de carro), by plane (de avião).","ex":["The kids go to school by bus.","I'm tired: I'm going to bed.","She's at work until six."],"trap":{"pt":"Eu vou para a escola de ônibus.","wrong":"I go to the school by the bus.","right":"I go to school by bus."}},"uncount":{"art":"0","name":"Uncountables: no a / an","namePt":"Incontáveis: sem a / an","hue":295,"rule":"*kw|Uncountable nouns* never take *a / an*, even when Portuguese counts them: advice, news, information, homework, furniture, luggage, weather, bread, money. Use some, a piece of, or nothing: some advice, a piece of news.","rulePt":"*kw|Substantivos incontáveis* nunca levam *a / an*, mesmo quando em português são contáveis: advice (conselho), news (notícia), information, homework (lição de casa), furniture (móveis), luggage (bagagem), weather (tempo). Use some ou a piece of: some advice (um conselho).","ex":["Can I give you some advice?","That's great news!","What nice weather!"],"trap":{"pt":"Que notícia boa! Posso te dar um conselho?","wrong":"What a good news! Can I give you an advice?","right":"What good news! Can I give you some advice?"}},"most":{"art":"0","name":"most people","namePt":"most people (a maioria)","hue":275,"rule":"*kw|most + noun* (in general) has no *the*: Most people like music. Most children love games. *kw|With of*, *the* comes back: most of the students in my class. (the most = the superlative: the most beautiful.)","rulePt":"*kw|most + substantivo* (em geral) não tem *the*: Most people like music (A maioria das pessoas gosta de música). *kw|Com of*, o *the* volta: most of the students in my class. (the most é o superlativo: the most beautiful = o mais bonito.)","ex":["Most people have a phone.","Most teenagers love music.","Most of the shops close at six."],"trap":{"pt":"A maioria das pessoas gosta de música.","wrong":"The most people like the music.","right":"Most people like music."}},"kind":{"art":"a","name":"a coffee, a good education","namePt":"a coffee, a good education (um café, uma boa educação)","hue":210,"rule":"Some uncountable nouns take *a / an* when they mean *kw|one portion or one kind*, often with an adjective: a coffee (one cup), a good education, a knowledge of Spanish, a terrible noise, a great love of music.","rulePt":"Alguns substantivos incontáveis levam *a / an* quando querem dizer *kw|uma porção ou um tipo*, muitas vezes com adjetivo: a coffee (um café, uma xícara), a good education (uma boa educação), a knowledge of Spanish (um conhecimento de espanhol), a terrible noise (um barulho horrível).","ex":["Can I get a coffee, please?","She had a good education.","He has a great love of music."],"bad":{"0":{"en":"Without *a*, it means coffee, education… *kw|in general*. Here it's *kw|one cup, or one kind*: *a / an*.","pt":"Sem *a*, quer dizer café, educação… *kw|em geral*. Aqui é *kw|uma xícara, ou um tipo*: *a / an*."}}},"someone":{"art":"a","name":"a Mr. Silva, a Picasso","namePt":"a Mr. Silva (um tal de), a Picasso (um quadro)","hue":220,"rule":"*a / an* + a name means *kw|someone called that*, or *kw|one work by that artist*: A Mr. Silva called for you (someone named Silva). They own a Picasso (a painting by Picasso).","rulePt":"*a / an* + nome quer dizer *kw|alguém com esse nome*, ou *kw|uma obra desse artista*: A Mr. Silva called for you (um tal de Sr. Silva ligou). They own a Picasso (eles têm um quadro do Picasso).","ex":["A Ms. Costa is waiting for you at reception.","The museum has just bought a Van Gogh.","There's a Ronaldo in my class, but he can't play soccer!"]},"quite":{"art":"a","name":"quite a, such a, half an","namePt":"quite a, such a, half an (a ordem)","hue":180,"rule":"*a / an* goes *kw|after quite, such, half and what*, not before them: quite a long trip, such a mess, half an hour, what a view. Never a quite long trip.","rulePt":"*a / an* vem *kw|depois de quite, such, half e what*, não antes: quite a long trip (uma viagem bem longa), such a mess (uma bagunça tão grande), half an hour (meia hora), what a view (que vista). Nunca a quite long trip.","ex":["It was quite a long trip.","Don't make such a mess!","I'll be back in half an hour."],"trap":{"pt":"Foi uma viagem bem longa.","wrong":"It was a quite long trip.","right":"It was quite a long trip."},"bad":{"the":{"en":"*the* would mean one we both know. After *kw|quite, such and half*, a singular countable noun takes *a / an*: quite a long trip, such a mess, half an hour.","pt":"*the* indicaria um que nós dois sabemos qual é. Depois de *kw|quite, such e half*, substantivo contável no singular leva *a / an*: quite a long trip, such a mess, half an hour (meia hora)."},"0":{"en":"*kw|Quite, such and half* don't replace the article: a singular countable noun still needs *a / an* after them: quite a long trip, such a mess, half an hour.","pt":"*kw|Quite, such e half* não substituem o artigo: substantivo contável no singular ainda precisa de *a / an* depois deles: quite a long trip, such a mess, half an hour (meia hora)."}}},"purpose":{"art":"the","name":"the prison, the school: just the building","namePt":"the prison, the school: só o prédio","hue":35,"clue":true,"rule":"go to prison, go to school, go to church, go to bed: no article when you go there *kw|for what it's for*. With *the*, it's *kw|just the building or the place*: She went to the prison to visit her brother. Dad went to the school for a meeting.","rulePt":"go to prison (ser preso), go to school (estudar), go to church (ir à missa), go to bed (dormir): sem artigo quando você vai lá *kw|para aquilo que o lugar serve*. Com *the*, é *kw|só o prédio ou o lugar*: She went to the prison to visit her brother (foi à prisão visitar o irmão). Dad went to the school for a meeting (o pai foi à escola para uma reunião).","ex":["She went to the prison to visit her brother.","My dad went to the school for a meeting.","The tourists visited the church on the hill."],"bad":{"0":{"en":"Without an article, it means going there *kw|for what the place is for* (go to prison = as a prisoner). Here it's *kw|just the building*, so it takes *the*.","pt":"Sem artigo, quer dizer ir lá *kw|para o que o lugar serve* (go to prison = ser preso). Aqui é *kw|só o prédio*, então leva *the*."},"a":{"en":"*a / an* = one of many, but here *kw|we know which building it is*: *the*.","pt":"*a / an* = um entre vários, mas aqui *kw|sabemos qual é o prédio*: *the*."}}},"family":{"art":"the","name":"the Smiths: the whole family","namePt":"the Smiths: a família toda","hue":25,"rule":"*the* + a *kw|family name in the plural* means the whole family: the Smiths, the Oliveiras, the Obamas. One person takes no article: Mr. Smith.","rulePt":"*the* + *kw|sobrenome no plural* quer dizer a família toda: the Smiths, the Oliveiras (os Oliveira), the Obamas. Uma pessoa só não leva artigo: Mr. Smith.","ex":["The Smiths live next door.","We're having dinner with the Oliveiras.","Have you met the Parks?"],"bad":{"0":{"en":"A *kw|family name in the plural* (the whole family) takes *the*: the Smiths, the Oliveiras.","pt":"*kw|Sobrenome no plural* (a família toda) leva *the*: the Smiths, the Oliveiras."},"a":{"en":"A *kw|family name in the plural* means the whole family, and it takes *the*: the Smiths, the Oliveiras.","pt":"*kw|Sobrenome no plural* quer dizer a família toda, e leva *the*: the Smiths, the Oliveiras."}}},"compar":{"art":"the","name":"The more…, the better","namePt":"Quanto mais…, melhor","hue":15,"rule":"When *kw|two things grow together*, *kw|both comparatives* take *the*: The more you read, the more you learn. The sooner, the better. The older he gets, the calmer he is.","rulePt":"Quando *kw|duas coisas crescem juntas*, *kw|os dois comparativos* levam *the*: The more you read, the more you learn (quanto mais você lê, mais aprende). The sooner, the better (quanto antes, melhor).","ex":["The more you practice, the easier it gets.","The sooner, the better.","The older I get, the less I sleep."],"trap":{"pt":"Quanto mais você pratica, mais fácil fica.","wrong":"More you practice, easier it gets.","right":"The more you practice, the easier it gets."},"bad":{"0":{"en":"When *kw|two things grow together*, *kw|both comparatives* take *the*: the more…, the better. Portuguese says quanto mais…, melhor, with no article.","pt":"Quando *kw|duas coisas crescem juntas*, *kw|os dois comparativos* levam *the*: the more…, the better. O português diz quanto mais…, melhor, sem artigo."},"a":{"en":"In the more…, the better, *kw|both comparatives* take *the*, never *a / an*.","pt":"Em the more…, the better, *kw|os dois comparativos* levam *the*, nunca *a / an*."}}},"decade":{"art":"the","name":"the 1990s, the 21st century","namePt":"the 1990s (os anos 90), the 21st century","hue":48,"rule":"*kw|Decades and centuries* take *the*: in the 1990s, in the eighties, in the 21st century. *kw|Single years* don't: in 1995, in 2010.","rulePt":"*kw|Décadas e séculos* levam *the*: in the 1990s (nos anos 90), in the eighties (nos anos 80), in the 21st century (no século 21). *kw|Anos sozinhos* não: in 1995, in 2010.","ex":["My parents met in the 1990s.","Music was different in the eighties.","We live in the 21st century."],"bad":{"0":{"en":"*kw|Decades and centuries* take *the*: the 1990s, the 21st century (*kw|single years* don't: in 1995).","pt":"*kw|Décadas e séculos* levam *the*: the 1990s, the 21st century (*kw|anos sozinhos* não: in 1995)."},"a":{"en":"*kw|Decades and centuries* take *the*, not *a / an*: the 1990s, the 21st century.","pt":"*kw|Décadas e séculos* levam *the*, não *a / an*: the 1990s, the 21st century."}}},"abstract":{"art":"0","name":"nature, history, society: in general","namePt":"natureza, história, sociedade: em geral","hue":260,"rule":"*kw|Abstract nouns* meant *kw|in general* take no article: Nature is beautiful. History teaches us a lot. Society is changing fast. Use *the* only when the words after it say which: the history of Brazil, the nature of the problem.","rulePt":"*kw|Substantivos abstratos* *kw|em geral* não levam artigo: Nature is beautiful (a natureza é linda). History teaches us a lot (a história nos ensina muito). Society is changing fast. Use *the* só quando as palavras depois dizem qual: the history of Brazil (a história do Brasil), the nature of the problem.","ex":["Nature is beautiful in the spring.","History was my favorite subject.","Technology is changing society."],"trap":{"pt":"A natureza é linda.","wrong":"The nature is beautiful.","right":"Nature is beautiful."},"bad":{"the":{"en":"Here it's meant *kw|in general*, and *kw|nothing after it says which one*: no article. (The history of Brazil would take *the*.)","pt":"Aqui é *kw|em geral*, e *kw|nada depois diz qual*: sem artigo. (The history of Brazil levaria *the*.)"}}},"headline":{"art":"0","name":"Headlines and notices","namePt":"Manchetes e avisos","hue":305,"rule":"*kw|Headlines, notices and labels* leave articles out to save space: Man Bites Dog. Keep Door Closed. Mayor Opens New Bridge. In a normal sentence they come back: A man bit a dog.","rulePt":"*kw|Manchetes, avisos e etiquetas* deixam os artigos de fora para economizar espaço: Man Bites Dog (homem morde cachorro). Keep Door Closed (mantenha a porta fechada). Numa frase normal, eles voltam: A man bit a dog.","ex":["Teenager Finds Gold Coin in Garden","Keep Door Closed","Storm Closes Airport"]}},"wrong":{"the-for-a":{"en":"*the* means *kw|we both know which one*. Here it's *kw|new, or any one of many*: *a / an*.","pt":"*the* quer dizer que *kw|nós dois sabemos qual é*. Aqui é *kw|algo novo, ou qualquer um entre vários*: *a / an*."},"0-for-a":{"en":"A *kw|singular countable noun* can't stand alone in English: it needs *a / an* here, even if Portuguese has nothing.","pt":"Um *kw|substantivo contável no singular* não fica sozinho em inglês: aqui precisa de *a / an*, mesmo que o português não tenha nada."},"a-for-the":{"en":"*a / an* = *kw|any one, or something new*. Here we know *kw|exactly which one*: *the*.","pt":"*a / an* = *kw|qualquer um, ou algo novo*. Aqui sabemos *kw|exatamente qual é*: *the*."},"0-for-the":{"en":"Here we know *kw|exactly which one*, so English needs *the*.","pt":"Aqui sabemos *kw|exatamente qual é*, então o inglês precisa de *the*."},"a-for-0":{"en":"*a / an* only goes with *kw|ONE countable thing* (a book). Here it's *kw|plural, uncountable, a name or a set phrase*: no article.","pt":"*a / an* só vai com *kw|UMA coisa contável* (a book). Aqui é *kw|plural, incontável, um nome ou uma expressão fixa*: sem artigo."},"the-for-0":{"en":"Portuguese often uses *o / a* here, but English uses *kw|no article*.","pt":"O português costuma usar *o / a* aqui, mas o inglês *kw|não usa artigo*."},"sound-a":{"en":"Say it aloud: *kw|{word}* starts with a *kw|consonant sound*, so it's *a*, not *an*.","pt":"Fale em voz alta: *kw|{word}* começa com *kw|som de consoante*, então é *a*, não *an*."},"sound-an":{"en":"Say it aloud: *kw|{word}* starts with a *kw|vowel sound*, so it's *an*, not *a*.","pt":"Fale em voz alta: *kw|{word}* começa com *kw|som de vogal*, então é *an*, não *a*."},"trap-a":{"en":"Listen, don't look: *kw|{word}* is written with a vowel, but it starts with a *kw|consonant sound* (like you or w), so it's *a*.","pt":"Ouça, não olhe: *kw|{word}* se escreve com vogal, mas começa com *kw|som de consoante* (como \"yu\" ou \"uân\"), então é *a*."},"trap-an":{"en":"Listen, don't look: *kw|{word}* is written with a consonant, but it starts with a *kw|vowel sound* (a silent h, or a letter said like em, ef, ex), so it's *an*.","pt":"Ouça, não olhe: *kw|{word}* se escreve com consoante, mas começa com *kw|som de vogal* (h mudo, ou uma letra lida como \"ém\", \"éf\", \"éks\"), então é *an*."}},"mistakes":[{"lv":"A2","pt":"A vida é bela.","wrong":"The life is beautiful.","right":"Life is beautiful.","rule":"general","why":"Things in general take no article in English: life, love, coffee, dogs, music. Portuguese uses *o / a* for them.","whyPt":"Coisas em geral não levam artigo em inglês: life, love, coffee, dogs, music. O português usa *o / a* com elas."},{"lv":"A1","pt":"A Maria mora no Brasil.","wrong":"The Maria lives in the Brazil.","right":"Maria lives in Brazil.","rule":"name","why":"Names of people and most countries have no article. Only plural or \"united\" names take *the*: the USA, the Philippines.","whyPt":"Nomes de pessoas e da maioria dos países não têm artigo. Só nomes no plural ou com United levam *the*: the USA, the Philippines."},{"lv":"A1","pt":"O meu carro é azul.","wrong":"The my car is blue.","right":"My car is blue.","rule":"poss","why":"my / your / his… already say whose it is: never put *the* before them.","whyPt":"my / your / his… já dizem de quem é: nunca coloque *the* antes deles."},{"lv":"A2","pt":"Lavei as mãos antes do jantar.","wrong":"I washed the hands before the dinner.","right":"I washed my hands before dinner.","rule":"poss","why":"For your own body and clothes English uses my / your…, not *the*. And meals take no article.","whyPt":"Para o próprio corpo e roupas o inglês usa my / your…, não *the*. E refeições não levam artigo."},{"lv":"A1","pt":"Ela é médica.","wrong":"She is doctor.","right":"She is a doctor.","rule":"job","why":"To say someone's job, English needs *a / an*. Portuguese has no article here.","whyPt":"Para dizer a profissão de alguém, o inglês precisa de *a / an*. O português não tem artigo aqui."},{"lv":"A1","pt":"Eu não tenho carro.","wrong":"I don't have car.","right":"I don't have a car.","rule":"need","why":"A singular countable noun can't stand alone, not even after not or without.","whyPt":"Um substantivo contável no singular não fica sozinho, nem depois de not ou without."},{"lv":"A2","pt":"Que dia lindo!","wrong":"What beautiful day!","right":"What a beautiful day!","rule":"what","why":"What + a singular countable noun needs *a / an*: What a day! What an idea!","whyPt":"What + substantivo contável no singular precisa de *a / an*: What a day! What an idea!"},{"lv":"B1","pt":"Que notícia boa! Que tempo bom!","wrong":"What a good news! What a nice weather!","right":"What good news! What nice weather!","rule":"uncount","why":"news and weather are uncountable: no *a / an*, even after what.","whyPt":"news e weather são incontáveis: sem *a / an*, mesmo depois de what."},{"lv":"B1","pt":"Posso te dar um conselho?","wrong":"Can I give you an advice?","right":"Can I give you some advice?","rule":"uncount","why":"advice is uncountable in English: some advice, a piece of advice. The same with information, homework, furniture, luggage.","whyPt":"advice é incontável em inglês: some advice, a piece of advice. O mesmo com information, homework, furniture (móveis), luggage (bagagem)."},{"lv":"B1","pt":"A maioria das pessoas gosta de música.","wrong":"The most people like the music.","right":"Most people like music.","rule":"most","why":"most + noun has no *the* (the most is the superlative). And music in general has no article.","whyPt":"most + substantivo não tem *the* (the most é o superlativo). E música em geral não tem artigo."},{"lv":"A2","pt":"No ano passado eu fui para o Chile.","wrong":"In the last year I went to the Chile.","right":"Last year I went to Chile.","rule":"routine","why":"last / next + time: no article and no preposition. (In the last year means during the past 12 months.)","whyPt":"last / next + tempo: sem artigo e sem preposição. (In the last year quer dizer nos últimos 12 meses.)"},{"lv":"A2","pt":"Eu almoço ao meio-dia.","wrong":"I have the lunch at noon.","right":"I have lunch at noon.","rule":"routine","why":"Meals take no article: have breakfast, have lunch, have dinner.","whyPt":"Refeições não levam artigo: have breakfast, have lunch, have dinner."},{"lv":"A2","pt":"Vou para a escola de ônibus.","wrong":"I go to the school by the bus.","right":"I go to school by bus.","rule":"inst","why":"go to school / work / bed and by bus / car / plane are set phrases with no article.","whyPt":"go to school / work / bed e by bus / car / plane são expressões fixas sem artigo."},{"lv":"A2","pt":"Ele joga futebol e toca violão.","wrong":"He plays soccer and guitar.","right":"He plays soccer and the guitar.","rule":"activity","why":"Sports work as in Portuguese: no article. Musical instruments usually take *the*, though Portuguese has none: play the guitar, the piano. (In casual American English you'll also hear play guitar.)","whyPt":"Esportes funcionam como no português: sem artigo. Instrumentos musicais costumam levar *the*, mesmo sem artigo no português: play the guitar, the piano. (No inglês americano informal você também vai ouvir play guitar.)"},{"lv":"A2","pt":"Estou com dor de cabeça.","wrong":"I'm with headache.","right":"I have a headache.","rule":"ache","why":"In English you have a headache, a cold, a fever: have + *a / an*.","whyPt":"Em inglês você \"tem\" a headache, a cold, a fever: have + *a / an*."},{"lv":"A2","pt":"Vou à academia duas vezes por semana.","wrong":"I go to the gym two times for week.","right":"I go to the gym twice a week.","rule":"per","why":"*a* = per: twice a week, three times a day, $10 an hour.","whyPt":"*a* = por: twice a week (duas vezes por semana), three times a day, $10 an hour (10 dólares por hora)."},{"lv":"A1","pt":"Espere uma hora.","wrong":"Wait a hour.","right":"Wait an hour.","why":"*an* goes before a vowel sound, and the h in hour is silent.","whyPt":"*an* vai antes de som de vogal, e o h de hour é mudo."},{"lv":"A1","pt":"Ela estuda numa universidade.","wrong":"She studies at an university.","right":"She studies at a university.","why":"university starts with a you sound (a consonant sound), so it's *a*.","whyPt":"university começa com som de \"yu\" (som de consoante), então é *a*."},{"lv":"B2","pt":"Foi uma viagem bem longa.","wrong":"It was a quite long trip.","right":"It was quite a long trip.","rule":"quite","why":"*a / an* goes after quite and such: quite a long trip, such a good idea.","whyPt":"*a / an* vem depois de quite e such: quite a long trip, such a good idea."},{"lv":"B2","pt":"Quanto mais, melhor.","wrong":"How more, better.","right":"The more, the better.","rule":"compar","why":"Two comparatives that grow together both take *the*.","whyPt":"Dois comparativos que crescem juntos levam *the*, os dois."},{"lv":"B2","pt":"A natureza é linda.","wrong":"The nature is beautiful.","right":"Nature is beautiful.","rule":"abstract","why":"Abstract nouns in general take no article: nature, history, society, technology.","whyPt":"Substantivos abstratos em geral não levam artigo: nature, history, society, technology."},{"lv":"B2","pt":"Ele foi parar na cadeia.","wrong":"He ended up in the prison.","right":"He ended up in prison.","rule":"inst","why":"in prison = as a prisoner: no article. in the prison = inside the building, like a visitor or a guard.","whyPt":"in prison = como preso: sem artigo. in the prison = dentro do prédio, como um visitante ou um guarda."}],"curious":[{"t":"The tiger is in danger","tPt":"The tiger is in danger","x":"A singular noun with *the* can mean a whole kind of thing, but only in formal or scientific English: The tiger is in danger. In everyday English, use the plural with no article: Tigers are in danger.","xPt":"Um substantivo no singular com *the* pode falar de uma espécie inteira, mas só no inglês formal ou científico: The tiger is in danger. No dia a dia, use o plural sem artigo: Tigers are in danger."},{"t":"One or a?","tPt":"One ou a?","x":"Portuguese um means both. English says *a* for just one thing (I have a brother) and one when the number matters: I have one brother, not two. Only one student came.","xPt":"O um do português serve para as duas coisas. O inglês usa *a* quando é só uma coisa qualquer (I have a brother) e one quando o número importa: I have one brother, not two. Only one student came."},{"t":"Letters and short forms","tPt":"Letras e siglas","x":["*a / an* follows the sound of the letter's name, not the letter: an FBI agent (eff), an MBA (em), an X-ray (ex).","But a letter whose name starts with a consonant sound takes *a*: a universe, a URL, a USB cable. That (you) sound counts as a consonant sound."],"xPt":["*a / an* segue o som do nome da letra, não a letra: an FBI agent (éf), an MBA (ém), an X-ray (éks).","Mas uma letra cujo nome começa com som de consoante leva *a*: a universe, a URL, a USB cable. Esse som de (iú) é considerado som de consoante."]},{"t":"When the sounds like thee","tPt":"Quando the soa como thi","x":"Before a vowel sound, many speakers say *the* as thee: the apple, the hour, the end.","xPt":"Antes de som de vogal, muita gente fala *the* como thi: the apple, the hour, the end."},{"t":"Names that take the","tPt":"Nomes que levam the","x":"Most names take no article, but these usually take *the*: newspapers (The New York Times), bands (the Beatles), ships (the Titanic), museums and hotels (the Louvre, the Hilton).","xPt":"A maioria dos nomes vem sem artigo, mas estes costumam levar *the*: jornais (The New York Times), bandas (the Beatles), navios (the Titanic), museus e hotéis (the Louvre, the Hilton)."},{"t":"Both are said","tPt":"As duas formas existem","x":"The game leaves these out because both are fine, e.g. in the summer or in summer. Some depend on the country: Americans say in the hospital and British people say in hospital.","xPt":"O jogo deixa estes de fora porque as duas formas estão certas, ex: in the summer ou in summer. Alguns dependem do país: americanos dizem in the hospital e britânicos dizem in hospital."},{"t":"An historic day?","tPt":"An historic day?","x":"You may read an historic or an hotel in older or very formal British English, from a time when the h was silent. Today the h is said, so it's *a*: a historic day, a hotel.","xPt":"Você pode ler an historic ou an hotel em inglês britânico antigo ou bem formal, de quando o h era mudo. Hoje o h é pronunciado, então é *a*: a historic day, a hotel."},{"t":"Notes, labels and recipes","tPt":"Bilhetes, rótulos e receitas","x":"Like headlines, short notes and instructions often drop articles: Add egg and stir. Keep in cool place. Don't copy this in full sentences.","xPt":"Como as manchetes, bilhetes e instruções curtas muitas vezes tiram os artigos: Add egg and stir. Keep in cool place. Não copie isso em frases completas."}],"demo":[{"en":"My sister is [a:job] nurse.","pt":"Minha irmã é enfermeira."}]},"pt":{"name":"Português","badge":"PT","grad":"linear-gradient(135deg, #1fa463, #e8b600)","ui":{"volEffects":"Efeitos","volEffectsAria":"Volume dos efeitos sonoros","volVoice":"Voz","volVoiceAria":"Volume da voz","favorites":"Favoritos","seen":"Vistos","tutorial":"Tutorial","guide":"Guia","tries":"Tentativas","hint":"Pistas","left":"{n} restantes","reset":"Limpar","check":"Conferir","nothing":"nada","gap":"Lacuna","textOf":"Texto {n} de {total}","  de nomes, possessivos e coisas em geral (<i>a Maria, o meu carro, a vida<\/i>). O inglês não: <b>Maria, my car, life<\/b>. Mas o inglês precisa de <b>a / an<\/b> onde o português não tem nada: <i>ela é médica<\/i> → <b>she's a doctor<\/b>.","groupA":"a / an","groupThe":"the","groupZero":"Ø — sem artigo","mistakesTitle":"Português → inglês: armadilhas clássicas","mistakesLead":"O que o português nos faz dizer, o que o inglês diz no lugar, e por quê, até o seu nível. Toque num cartão.","curTitle":"Para os curiosos","curLead":"Coisas que o jogo não pratica, mas que você vai encontrar.","pmNormal":"Jogo normal","pmSpeed":"Rodada relâmpago","pmReview":"Revisar erros","pmFav":"Favoritos","nTexts":"{n} textos + bônus","nTextsP":"{n} textos","oneText":"1 texto","nSeconds":"{n} segundos · frases soltas","pmNoMiss":"nenhum erro ainda","pmNoFav":"nenhum favorito ainda","oneFav":"1 salvo","nFavs":"{n} salvos","speedTitle":"Rodada relâmpago","speedIntro":"Escolha o artigo certo — uma frase de cada vez, o mais rápido que puder!","go":"Já!","speedAsk":"Qual está certo? Toque ou aperte o número dele.","endGame":"Fim de jogo!","endPractice":"Treino concluído!","endTime":"Acabou o tempo!","onePoint":"1 ponto","nPoints":"{n} pontos","inSeconds":"{x} certas em {s} segundos","msg0":"Continue — a prática leva à perfeição!","msg1":"Bom esforço — continue praticando!","msg2":"Ótimo trabalho!","msg3":"Brilhante! Você domina os artigos.","noSave":"Jogo de treino: a pontuação não é salva.","speedRecord":"Novo recorde relâmpago no {lvl}!","newBest":"Novo recorde no {lvl}!","levelBest":"Nível {lvl} · recorde {n}","hintsUsed":"Pistas usadas: {n} de {m}","bonus":" · +{n} extra","bonusRound":"Rodada bônus: {r}","judgeRound":"Certo ou errado: {r}","missed":"errou","mastered":"textos dominados no {lvl}","daysRow":" · 🔥 {n} dias seguidos","trapsBeaten":"PT ≠ EN — armadilhas do português vencidas: {k} de {n}","playAgain":"Jogar de novo","copy":"Copiar resultado","copied":"Copiado ✓","copyFail":"Não deu para copiar","tryUp":"Tentar o {lvl} →","seenTitle":"Textos vistos","tabRecent":"Recentes","tabMissed":"Com erro","masteredHead":"Textos dominados (perfeitos na primeira conferida)","usesHead":"Regras para praticar (as mais fracas, todos os jogos)","usesOk":"Nenhuma regra fraca: 80% ou mais em todas!","practiseOne":"Praticar este","practiseMany":"Praticar estes","emptyFav":"Nenhum favorito ainda. Toque na estrela de um texto terminado, de uma frase bônus ou de Certo ou errado, de um texto de revisão, ou de uma frase da rodada relâmpago nos resultados, para guardá-lo aqui.","emptyRecent":"Os textos que você terminar aparecem aqui.","emptyMissed":"Nenhum texto com erro. Muito bem!"},"tour":{"ui":{"step":"Passo {n} de {total}","back":"Voltar","next":"Próximo","play":"Vamos jogar!","close":"Fechar o tutorial"},"steps":{"welcome":{"t":"A, An or The?","x":"Cada texto tem bolhas cinza. Toque numa e continue tocando: <b>a<\/b> → <b>an<\/b> → <b>the<\/b> → <b>Ø<\/b> (nada). Bolha que ficar cinza conta como <b>Ø<\/b>. Veja:"},"level":{"t":"Escolha o seu nível","x":"<b>A1<\/b>: a ou an, primeira e segunda menção, profissões, nomes, <i>my<\/i>… — instruções em português. <b>A2<\/b>: coisas em geral, refeições, escola, <i>by bus<\/i> (de ônibus), <i>What a…!<\/i> (Que…!), <i>once a week<\/i> (uma vez por semana). <b>B1<\/b>: textos mais longos, incontáveis (<i>advice, news<\/i>), nomes de lugares, <i>most people<\/i>, <i>a few<\/i> x <i>few<\/i>, e uma rodada de <b>Certo ou errado?<\/b> no lugar do bônus. <b>B2<\/b>: artigos que mudam o sentido (<i>go to prison / the prison<\/i>, <i>a coffee<\/i>), <i>the more…, the better<\/i> (quanto mais…, melhor), <i>the 1990s<\/i>, manchetes, sem Pistas, e depois <b>Qual significado?<\/b> e <b>Revisão<\/b>"},"text":{"t":"Leia o texto inteiro primeiro","x":"Para cada lacuna, pergunte: é <b>um entre vários<\/b> (a / an), um que <b>nós dois sabemos qual é<\/b> (the), ou algo <b>em geral<\/b>, um <b>nome<\/b> ou uma <b>expressão fixa<\/b> (nada)? Toque numa palavra sublinhada com pontinhos para ver o significado."},"spot":{"t":"Toque, toque, toque…","x":"Olhe a primeira lacuna: cinza quer dizer que nada foi escolhido ainda. O primeiro toque escolhe <b>a<\/b> (ou a palavra que uma bolha que troca sozinha mostra); cada toque depois disso avança um passo: a → an → the → Ø. <b>Azul<\/b> = a / an, <b>laranja<\/b> = the, <b>roxo<\/b> = Ø (nada). Shift + toque (ou botão direito) volta; as teclas <b>1<\/b>, <b>2<\/b>, <b>3<\/b>… também funcionam."},"check":{"t":"Conferir","x":"Pare cada lacuna na palavra certa e toque em <b>Conferir<\/b>. Certo na primeira conferida = <b>2 pontos<\/b> por lacuna; numa conferida depois = 1. No A1 e no A2, uma lacuna errada fica vermelha e as certas ficam travadas em verde."},"clues":{"t":"Pistas","x":"Travou? As <b>Pistas<\/b> destacam as palavras que decidem (uma menção anterior, <i>best<\/i>, <i>every<\/i>, <i>by<\/i>…). Elas valem para o jogo todo, e cada pista que sobrar vira um <b>ponto extra<\/b>."},"why":{"t":"Entenda o porquê","x":"Depois de conferir, cada lacuna ganha uma explicação: a regra em inglês e em português, e a <b>armadilha do português<\/b> por trás dela (<i>A Maria mora no Brasil<\/i> → <b>Maria lives in Brazil<\/b>). Lacunas marcadas <b>PT ≠ EN<\/b> são onde as duas línguas são diferentes."},"bonus":{"t":"Rodadas bônus","x":"Depois dos 3 textos vem um <b>bônus<\/b>: uma frase em português e a versão em inglês com lacunas. Arraste (ou toque) as bolhas de palavras para as lacunas — cuidado: as palavras que sobram são os artigos que o português faria você colocar! No <b>B1<\/b> o bônus é <b>Certo ou errado?<\/b>: cada frase está certa? No <b>B2<\/b> são dois: <b>Qual significado?<\/b> (duas frases com um artigo de diferença: qual quer dizer o quê?) e <b>Revisão<\/b> (encontre e corrija os 2 ou 3 artigos errados de um texto)."},"guide":{"t":"O guia","x":"Abra o <b>Guia<\/b> quando quiser: todas as regras com exemplos, a regra do <b>som<\/b> para a / an, e as armadilhas clássicas para quem fala português (<i>a vida<\/i> → <b>life<\/b>, <i>ela é médica<\/i> → <b>she's a doctor<\/b>)."},"score":{"t":"Pontos","x":"Pontos para cada texto e rodada bônus, mais 1 ponto extra para cada pista que você não usar. Textos perfeitos seguidos formam um <b>combo<\/b>!"},"play":{"t":"Mais jeitos de jogar","x":"Toque em <b>new game<\/b> para um jogo novo, uma <b>rodada relâmpago<\/b> de 1 minuto com frases soltas, ou um treino com os textos em que você <b>errou<\/b> ou que <b>marcou com estrela<\/b>."},"lists":{"t":"Favoritos e Vistos","x":"Marque um texto terminado com estrela para guardá-lo nos <b>Favoritos<\/b>. <b>Vistos<\/b> mostra o seu progresso e os seus acertos em cada regra — descubra seus pontos fracos e pratique!"}}}},"texts":{"A1":[{"id":"a1-01","frame":"About me","framePt":"Sobre mim","title":"My family","titlePt":"Minha família","body":["Hi! I'm Lucas, and I'm fourteen. [0:poss] my mom is [a:job] nurse, and my dad is [an:job] engineer. I have a {^dog} and two cats. [the:known] dog is very big, and its name is Max. I love animals!"],"pt":["Oi! Eu sou o Lucas e tenho catorze anos. A minha mãe é enfermeira, e o meu pai é engenheiro. Eu tenho um cachorro e dois gatos. O cachorro é muito grande, e o nome dele é Max. Eu amo animais!"],"w":{"nurse":"enfermeira","engineer":"engenheiro","its name":"o nome dele","animals":"animais"}},{"id":"a1-02","frame":"Postcard","framePt":"Cartão-postal","title":"At the zoo","titlePt":"No zoológico","body":["Dear Grandma, we are at the zoo today! I can see [an:first] {^elephant} and [a:first] giraffe. [the:known] elephant is eating bananas. [0:name] Sofia says it's her favorite animal. See you soon!","Love, Pedro"],"pt":["Querida vovó, estamos no zoológico hoje! Eu consigo ver um elefante e uma girafa. O elefante está comendo bananas. A Sofia diz que é o animal favorito dela. Até logo!","Beijos, Pedro"],"w":{"zoo":"zoológico","giraffe":"girafa","eating":"comendo","favorite":"favorito","See you soon":"até logo","Love":"beijos"}},{"id":"a1-03","frame":"Blog","framePt":"Blog","title":"My town","titlePt":"Minha cidade","body":["I live in a small town in [0:name] Portugal. There is [a:first] {^park} near my house. [the:known] park has a big lake and a lot of trees. On sunny days, [the:unique] sun shines on the water. I go there every Saturday with my friends."],"pt":["Eu moro numa cidade pequena em Portugal. Tem um parque perto da minha casa. O parque tem um lago grande e muitas árvores. Nos dias de sol, o sol brilha na água. Eu vou lá todo sábado com os meus amigos."],"w":{"town":"cidade","near":"perto de","lake":"lago","trees":"árvores","sunny days":"dias de sol","shines":"brilha"}},{"id":"a1-04","frame":"School news","framePt":"Notícias da escola","title":"A new student","titlePt":"Uma aluna nova","body":["We have [a:first] {^new student} in our class. Her name is Aiko, and she is from [0:name] Japan. [the:known] new student speaks English very well. Her father is [a:job] pilot, so she travels a lot. She is very friendly!"],"pt":["Temos uma aluna nova na nossa turma. O nome dela é Aiko, e ela é do Japão. A aluna nova fala inglês muito bem. O pai dela é piloto, então ela viaja muito. Ela é muito simpática!"],"w":{"class":"turma","pilot":"piloto","travels":"viaja","friendly":"simpática"}},{"id":"a1-05","frame":"Diary","framePt":"Diário","title":"Breakfast time","titlePt":"Hora do café da manhã","body":["Every morning I have [0:routine] breakfast at seven. I usually eat [an:any] egg and a {^banana}. Today [the:known] banana was green, so I ate [an:first] apple. Then I went to school with my brother. I love fruit!"],"pt":["Toda manhã eu tomo café da manhã às sete. Normalmente eu como um ovo e uma banana. Hoje a banana estava verde, então eu comi uma maçã. Depois eu fui para a escola com o meu irmão. Eu amo frutas!"],"w":{"breakfast":"café da manhã","usually":"normalmente","egg":"ovo","green":"verde","apple":"maçã","fruit":"frutas"}},{"id":"a1-06","frame":"About me","framePt":"Sobre mim","title":"My best friend","titlePt":"Meu melhor amigo","body":["[0:poss] my best friend is Ben. He is [an:job] artist, and he paints pictures of animals. He has [a:first] {^cat} called Tiger. [the:known] cat sleeps on his bed every night! I visit them on Sundays."],"pt":["O meu melhor amigo é o Ben. Ele é artista e pinta quadros de animais. Ele tem um gato chamado Tiger. O gato dorme na cama dele toda noite! Eu visito os dois aos domingos."],"w":{"best friend":"melhor amigo","artist":"artista","paints":"pinta","pictures":"quadros","called":"chamado","sleeps":"dorme"}},{"id":"a1-07","frame":"Message","framePt":"Mensagem","title":"A photo from Chile","titlePt":"Uma foto do Chile","body":["Look at this photo! It's my grandparents' house in [0:name] Chile. My grandpa is [a:job] farmer. He has [an:first] old {^horse} and some cows. [the:known] horse is twenty years old!"],"pt":["Olha esta foto! É a casa dos meus avós no Chile. O meu avô é fazendeiro. Ele tem um cavalo velho e algumas vacas. O cavalo tem vinte anos!"],"w":{"grandparents":"avós","farmer":"fazendeiro","horse":"cavalo","cows":"vacas"}},{"id":"a1-08","frame":"Diary","framePt":"Diário","title":"A day at the beach","titlePt":"Um dia na praia","body":["On [0:routine] Saturday I went to [the/a:fixed/any] beach with my family. [the:unique] sky was blue and the water was warm. My sister found [a:first] beautiful shell. We had lunch at a small restaurant. It was a perfect day!"],"pt":["No sábado eu fui à praia com a minha família. O céu estava azul e a água estava quente. A minha irmã achou uma concha linda. Nós almoçamos num restaurante pequeno. Foi um dia perfeito!"],"w":{"beach":"praia","sky":"céu","warm":"quente","found":"achou","shell":"concha","perfect":"perfeito"},"notes":[null,{"en":"go to the beach is the usual way to say a day at the beach. a beach is right too: one beach, we don't say which.","pt":"go to the beach é o jeito mais comum de falar de um dia de praia. a beach também está a segunda tela. A maior vantagem é que eu não perco tempo no trânsito. Claro, eu vejo menos os meus colegas, e poucos deles me ligam só para conversar."],"w":{"equipment":"equipamento","screen":"tela","waste":"perco","traffic":"trânsito","coworkers":"colegas","chat":"conversar"}},{"id":"b1-19","frame":"Interview","framePt":"Entrevista","title":"A chef in London","titlePt":"Uma chef em Londres","body":["Rosa López is [a:job] chef from [0:name] Mexico. Ten years ago she moved to [the:place] UK and opened a small restaurant in London. “What's [the:super] {hardest} part of your job?” we asked. “The hours! I work twelve hours [a:per] day,” she said. “And [0:general] people think chefs eat all day, but we hardly have time for lunch!”"],"pt":["Rosa López é uma chef do México. Há dez anos ela se mudou para o Reino Unido e abriu um restaurantezinho em Londres. “Qual é a parte mais difícil do seu trabalho?”, perguntamos. “O horário! Eu trabalho doze horas por dia”, ela disse. “E as pessoas acham que os chefs comem o dia todo, mas a gente quase não tem tempo para almoçar!”"],"w":{"moved":"se mudou","hardest":"mais difícil","hardly":"quase não"}},{"id":"b1-20","frame":"Story","framePt":"História","title":"The lost wallet","titlePt":"A carteira perdida","body":["Last Tuesday I took [a:first] taxi home and left my {^wallet} in it. I was sure I would never see it again. The next day, a woman called me: she had found [the:known] wallet with all my documents in it. I wanted to give her [0:uncount] money as a thank-you, but she said no. [0:few] {few} people would do that! She works at [a:first] bakery near my office, so now I buy my bread there every day."],"pt":["Na terça passada eu peguei um táxi para casa e esqueci a minha carteira dentro dele. Eu tinha certeza de que nunca mais ia vê-la. No dia seguinte, uma mulher me ligou: ela tinha encontrado a carteira com todos os meus documentos. Eu quis dar dinheiro para ela como agradecimento, mas ela disse que não. Poucas pessoas fariam e":"A hostel in Amsterdam","titlePt":"Um hostel em Amsterdã","body":["I stayed at [a:first] hostel near [0:name] Dam Square for three nights. It was [the:super] {cheapest} place I could find in [the:place] Netherlands, but it was great. [the:of] staff {at the front desk} were really helpful and gave us maps of the city. My only complaint: the walls are thin. Still, [0:few] {few} hostels are this clean!"],"pt":["Eu fiquei num hostel perto da praça Dam por três noites. Foi o lugar mais barato que eu consegui achar nos Países Baixos, mas foi ótimo. Os funcionários da recepção foram muito prestativos e nos deram mapas da cidade. A minha única reclamação: as paredes são finas. Mesmo assim, poucos hostels são tão limpos!"],"w":{"staff":"funcionários","front desk":"recepção","helpful":"prestativos","complaint":"reclamação","thin":"finas"}},{"id":"b1-24","frame":"Opinion","framePt":"Opinião","title":"Why we need libraries","titlePt":"Por que precisamos de bibliotecas","body":["I think [0:general] libraries are more important than ever. Not everyone can buy books or pay for the internet, and libraries are free for everyone, including [the:group] poor. My local library gives [0:uncount] free help with job applications, and it has [a:first] room where kids can do their homework. It's [the:super] {only} quiet place in my neighborhood. Sadly, [0:few] {few} politicians seem to care."],"pt":["Eu acho que as bibliotecas são mais importantes do que nunca. Nem todo mundo pode comprar livros ou pagar pela internet, e as bibliotecas são de graça para todos, inclusive para os pobres. A biblioteca do meu bairro oferece ajuda gratuita com candidaturas de emprego, e tem uma sala onde as crianças podem fazer o dever de casa. É o único lugar tranquilo do meu bairro. Infelizmente, poucos políticos parecem se importar."],"w":{"applications":"candidaturas","quiet":"tranquilo","politicians":"políticos","care":"se importar"}},{"id":"b1-25","frame":"Email","framePt":"E-mail","title":"Back from Hol costa de Moçambique. Ela diz que a maioria dos tubarões é tímida, e que poucos chegam a atacar pessoas. Na verdade, os humanos matam cerca de cem milhões de tubarões por ano. \"Os perigosos somos nós\", ela ri."],"w":{"marine biologist":"bióloga marinha","off the coast of":"na costa de","shy":"tímidos","ever attack":"chegam a atacar","laughs":"ri"},"notes":[null,null,null,null,{"en":"Few = almost none (negative). Ever needs a negative idea, so a few doesn't work here.","pt":"Few = quase nenhum (negativo). Ever pede uma ideia negativa, então a few não serve aqui."}]},{"id":"b1-34","frame":"Blog","framePt":"Blog","title":"Learning sign language","titlePt":"Aprendendo língua de sinais","body":["My little cousin Davi is deaf, so last year I started learning [0:activity] Libras, the Brazilian sign language. I take classes on [0:routine] Wednesday evenings at [a:first] community center near my house. [0:general] sign languages aren't universal, which surprised me: [0:activity] American Sign Language is completely different from Libras. Now Davi and I have [a:any] secret way to talk at family dinners!"],"pt":["O meu priminho Davi é surdo, então no ano passado comecei a aprender Libras, a língua brasileira de sinais. Faço aula às quartas à noite num centro comunitário perto da minha casa. As línguas de sinais não são universais, o que me surpreendeu: a língua de sinais americana é completamente diferente da Libras. Agora o Davi e eu temos um jeito secreto de conversar nos jantares de família!"],"w":{"deaf":"surdo","sign language":"língua de sinais","community center":"centro comunitário","universal":"universais","surprised":"surpreendeu","secret":"secreto"}},{"id":"b1-35","frame":"Email","framePt":"E-mail","title":"Out sick","titlePt":"Doente","body":["Hi Marta, I'm sorry, but I won't be at [0:inst] work today. I woke up with [a:ache] fever and [a:ache] bad cough, so I'm staying in [0:inst] bed. The doctor gave me [0:uncount] good advice: drink lots of water and sleep as much as I can. I'll send you [the:of] report {for the Lima project} tonight. Best, Júlio"],"pt":["Oi, Marta, desculpa, mas não vou trabalhar hoje. Acordei com febre e uma tosse forte, então vou ficar na cama. O médico me deu um bom conselho: beber bastante água e dormir o máximo que eu puder. Mando para você o relatório do projeto de Lima hoje à noite. Abraço, Júlio"],"w":{"woke up":"acordei","fever":"febre","cough":"tosse","as much as I can":"o máximo que eu puder","report":"relatório"}},{"id":"b1-36","frame":"News","framePt":"Notícia","title":"Snow in the desert","titlePt":"Neve no deserto","body":["For [the:super] third time in ten years, snow has fallen in [the:place] Sahara. People in Ain Sefra, [a:first] small town in [0:name] Algeria, woke up on Sunday to white sand dunes. [0:general] snow is very rare there: in summer, temperatures can reach 45°C. [the:of] snow {that fell on Sunday} was gone by the afternoon."],"pt":["Pela terceira vez em dez anos, nevou no Saara. Os moradores de Ain Sefra, uma cidadezinha da Argélia, acordaram no domingo com as dunas de areia brancas. A neve é muito rara lá: no verão, a temperatura pode chegar a 45 °C. A neve que caiu no domingo tinha sumido à tarde."],"w":{"has fallen":"caiu","sand dunes":"dunas de areia","rare":"rara","reach":"chegar a","was gone":"tinha sumido"}},{"id":"b1-37","frame":"Story","framePt":"História","title":"A message in a bottle","titlePt":"Uma mensagem numa garrafa","body":["Last summer I was walking on the beach near my house when I found [an:first] old glass {^bottle}. Inside [the:known] bottle was [a:first] {^letter} written in [0:activity] French and dated 1998. With [a:few] little help from my teacher, I read it. [the:known] letter was from a girl in Martinique who wanted a pen pal. I've written back. Who knows?"],"pt":["No verão passado eu estava andando na praia perto de casa quando achei uma garrafa velha de vidro. Dentro da garrafa havia uma carta escrita em francês, com data de 1998. Com uma ajudinha da minha professora, consegui ler. A carta era de uma menina da Martinica que queria um amigo por correspondência. Eu já respondi. Quem sabe?"],"w":{"glass bottle":"garrafa de vidro","dated":"com data de","pen pal":"amigo por correspondência","written back":"respondi"}},{"id":"b1-38","frame":"Review","framePt":"Avaliação","title":"Cooking in Bangkok","titlePt":"Cozinhando em Bangkok","body":["If you visit [0:name] Bangkok, take [a:any] cooking class while you're there. We chose Baan Thai. The class started with [an:first] early visit to the market, where our teacher showed us [the:of] herbs {that Thai cooks use every day}. Then we cooked four dishes and ate them all for [0:routine] lunch. It costs about $35 [a:per] person, and it's worth every cent."],"pt":["Se você for a Bangkok, faça uma aula de culinária enquanto estiver lá. Nós escolhemos a Baan Thai. A aula começou com uma visita cedinho ao mercado, onde a professora nos mostrou as ervas que os cozinheiros tailandeses usam todo dia. Depois preparamos quatro pratos e comemos tudo no almoço. Custa uns 35 dólares por pessoa, e vale cada centavo."],"w":{"chose":"escolhemos","herbs":"ervas","cooks":"cozinheiros","dishes":"pratos","worth every cent":"vale cada centavo"}},{"id":"b1-39","frame":"Message","framePt":"Mensagem","title":"Plan B","titlePt":"Plano B","body":["Hey everyone! What [0:uncount] awful weather! It's been raining since [0:routine] Friday, so our camping trip is off. Plan B: [a:first] movie marathon at [0:poss] my place on Saturday. I already have [a:few] few movies in mind. Bring [0:uncount] popcorn if you can!"],"pt":["Oi, pessoal! Que tempo horrível! Está chovendo desde sexta, então o nosso acampamento foi cancelado. Plano B: maratona de filmes na minha casa no sábado. Já tenho alguns filmes em mente. Tragam pipoca se puderem!"],"w":{"awful":"horrível","is off":"foi cancelado","place":"casa","in mind":"em mente","popcorn":"pipoca"}},{"id":"b1-40","frame":"Article","framePt":"Artigo","title":"The secret of Okinawa","titlePt":"O segredo de Okinawa","body":["[the:group] Japanese live longer than almost anyone else in [the:unique] world, and the island of Okinawa has more people over 100 than almost anywhere. Scientists think diet plays [a:any] big part. [0:most] most people there eat [0:general] vegetables, fish and tofu every day, and they stop eating before they're full. [the:of] purple sweet potato {that grows on the island} is one of their favorite foods."],"pt":["Os japoneses vivem mais do que quase qualquer povo do mundo, e a ilha de Okinawa tem mais pessoas com mais de 100 anos do que quase qualquer outro lugar. Os cientistas acham que a alimentação tem um papel importante. A maioria das pessoas lá come verduras, peixe e tofu todos os dias, e para de comer antes de ficar cheia. A batata-doce roxa que cresce na ilha é uma das comidas favoritas delas."],"w":{"diet":"alimentação","plays a big part":"tem um papel importante","full":"cheios","sweet potato":"batata-doce","purple":"roxa"}}],"B2":[{"id":"b2-01","frame":"Blog","framePt":"Blog","title":"Family history","titlePt":"História de família","body":["My grandfather loves [0:abstract] history, especially [the:of] history {of our family}. He says [the:family] Ferreiras came to Brazil from Portugal in [the:decade] 1890s. Last year he found [a:someone] Ferreira in an old Lisbon newspaper, a man who sold furniture in the 1920s. Was he a cousin? Nobody knows. [the:compar] more my grandfather discovers, the more questions he has!"],"pt":["O meu avô adora história, principalmente a história da nossa família. Ele diz que os Ferreira vieram de Portugal para o Brasil nos anos 1890. No ano passado, ele encontrou um tal de Ferreira num jornal antigo de Lisboa, um homem que vendia móveis nos anos 1920. Era um primo? Ninguém sabe. Quanto mais o meu avô descobre, mais perguntas ele tem!"],"w":{"especially":"principalmente","came":"vieram","newspaper":"jornal","sold":"vendia","furniture":"móveis","discovers":"descobre the:of] nature {of money}, and I understood almost nothing: [0:few] little of it made sense. I really need [a:any] break."],"pt":["Quer tomar um café depois da aula? Tive um dia tão longo! Economia está muito difícil neste semestre. O professor passou duas horas falando da natureza do dinheiro, e eu não entendi quase nada: pouca coisa fez sentido. Eu preciso muito de uma pausa."],"w":{"grab":"pegar, tomar (informal)","semester":"semestre","made sense":"fez sentido","break":"pausa"},"notes":[{"en":"grab a coffee = one cup; grab coffee = coffee, the drink. Both work in American English.","pt":"grab a coffee = uma xícara; grab coffee = café, a bebida. As duas servem no inglês americano."},null,null,null,{"en":"almost nothing made sense, so it's negative: little (not a little).","pt":"quase nada fez sentido, então é negativo: little (e não a little)."}]},{"id":"b2-04","frame":"News","framePt":"Notícia","title":"A lucky find","titlePt":"Um achado de sorte","body":["[0:headline] Teenager Finds [0:headline] Gold Coin in [0:headline] Garden","Sixteen-year-old Lucas Prado was digging in his garden when he found [a:first] small gold coin. Experts say it's from [the:decade] 1700s. “[0:abstract] history is everywhere, if you look,” said [the:of] director {of the city museum}."],"tags":["headline",null],"pt":["Adolescente encontra moeda de ouro no quintal","Lucas Prado, de dezesseis anos, estava cavando no quintal de casa quando encontrou uma pequena moeda de ouro. Especialistas dizem que ela é dos anos 1700 (do século 18). “A história está em todo lugar, se você procurar”, disse o diretor do museu da cidade."],"w":{"digging":"cavando","gold":"ouro","coin":"moeda","experts":"especialistas","everywhere":"em todo lugar"}},{"id":"b2-05","frame":"Email","framePt":"E-mail","title":"Life in Lyon","titlePt":"A vida em Lyon","body":["Dear Tom, we've been in Lyon for half [a:quite] year now. [the:group] French really care about [0:routine] lunch: it can take two hours! [0:abstract] life here is slower, and I think society is more relaxed. I still speak [0/a:few/few] little French, but [the:compar] more I practice, [the:compar] easier it gets."],"pt":["Querido Tom, estamos em Lyon há meio ano. Os franceses levam o almoço muito a sério: ele pode durar duas horas! A vida aqui é mais devagar, e acho que a sociedade é mais tranquila. Eu ainda falo pouco francês, mas quanto mais eu pratico, mais fácil fica."],"w":{"care about":"se importam com","slower":"mais devagar","relaxed":"tranquila","gets":"fica"},"notes":[null,{"en":"the French = all the people of France. The language takes no article: I speak French.","pt":"the French = os franceses (o povo). O idioma não leva artigo: I speak French."},null,null,{"en":"little French = almost none; a little French = some. Both work here.","pt":"little French = quase nada de francês; a little French = um pouco. As duas servem aqui."}]},{"id":"b2-06","frame":"Blog","framePt":"Blog","title":"Our new neighbors","titlePt":"Os nossos vizinhos novos","body":["[the:family] Nakamuras moved in next door last month. Mr. Nakamura is a chef, and on Saturday he cooked us [a:kind] wonderful dinner. [0:abstract] art is his other passion: they even have [a:someone] Monet in the hall! Yesterday a woman we'd never seen before, [a:someone] Ms. Tanaka, knocked on our door looking for them. They seem to have [0:general] friends all over town."],"pt":["Os Nakamura se mudaram para a casa ao lado no mês passado. O Sr. Nakamura é chef, e no sábado ele preparou um jantar maravilhoso para nós. A arte é a outra paixão dele: eles têm até um Monet no corredor! Ontem uma mulher que nunca tínhamos visto antes, uma tal de Sra. Tanaka, bateu na nossa porta procurando por eles. Parece que eles têm amigos pela cidade toda."],"w":{"moved in":"se mudaram","next door":"na casa ao lado","passion":"paixão","hall":"corredor","knocked":"bateu"},"notes":[null,{"en":"Meals take no article (have dinner), but with an adjective it's one particular meal: a wonderful dinner.","pt":"Refeições não levam artigo (have dinner), mas com adjetivo é uma refeição específica: a wonderful dinner."}]},{"id":"b2-07","frame":"Blog","framePt":"Blog","title":"Back to school at 42","titlePt":"De volta à escola aos 42","body":["My mom decided to go back to [0:inst] school at forty-two. She's studying [0:activity] nursing, and with three kids at home, it's quite [a:quite] challenge. [the:compar] harder it gets, [the:compar] more determined she is. Her dream is to work with [the:group] elderly one day."],"pt":["A minha mãe decidiu voltar a estudar aos quarenta e dois anos. Ela está estudando enfermagem e, com três filhos em casa, é um baita desafio. Quanto mais difícil fica, mais determinada ela fica. O sonho dela é um dia trabalhar com idosos."],"w":{"nursing":"enfermagem","challenge":"desafio","determined":"determinada","dream":"sonho","the elderly":"os idosos"},"notes":[{"en":"go back to school = to study again: no article.","pt":"go back to school = voltar a estudar: sem artigo."}]},{"id":"b2-08","frame":"Podcast","framePt":"Podcast","title":"Growing up in the eighties","titlePt":"Crescer nos anos 80","body":["My dad grew up in [the:decade] eighties in São Paulo. Back then, [0/the:abstract/known] technology was very different: phones had cords, and [0:most] most families had only one TV. He says [the:compar] less you had, [the:compar] more you enjoyed it. He still has [a:kind] great love of cassette tapes, and he plays them in [the/a:of/any] car {he bought in 1989}."],"pt":["O meu pai cresceu nos anos 80 em São Paulo. Naquela época, a tecnologia era muito diferente: os telefones tinham fio, e a maioria das famílias tinha só uma TV. Ele diz que quanto menos você tinha, mais aproveitava. Ele ainda tem um grande amor por fitas cassete e as escuta no carro que comprou em 1989."],"w":{"grew up":"cresceu","back then":"naquela época","cords":"fios","enjoyed":"aproveitava","tapes":"fitas"},"notes":[null,{"en":"technology in general: no article. the technology = the technology of that time (back then). Both work.","pt":"technology em geral: sem artigo. the technology = a tecnologia daquela época (back then). As duas servem."},null,null,null,null,{"en":"the car he bought in 1989 = the one he bought (we say which); a car he bought in 1989 = one of the cars he bought. Both work.","pt":"the car he bought in 1989 = o carro que ele comprou (dizemos qual); a car he bought in 1989 = um dos carros que ele comprou. As duas servem."}]},{"id":"b2-09","frame":"Advice column","framePt":"Coluna de conselhos","title":"Your first job","titlePt":"O seu primeiro emprego","body":["Want to work in [0:abstract] tourism? Then [a/0:kind/uncount] good knowledge of [0:activity] Spanish will help, and [0:abstract] experience matters more than diplomas. At [the:of] interview {for my first job}, the manager asked about my weekend job at [a:first] hostel. That was [an:kind] experience I'll never forget!"],"pt":["Quer trabalhar com turismo? Então um bom conhecimento de espanhol vai ajudar, e experiência conta mais do que diplomas. Na entrevista do meu primeiro emprego, o gerente perguntou sobre o meu trabalho de fim de semana num albergue. Foi uma experiência que eu nunca vou esquecer!"],"w":{"tourism":"turismo","knowledge":"conhecimento","matters":"importa, conta","hostel":"albergue"},"notes":[null,{"en":"knowledge is uncountable, but a good knowledge of Spanish (one person's level) is very common. good knowledge of Spanish, with no article, works too.","pt":"knowledge é incontável, mas a good knowledge of Spanish (o nível de uma pessoa) é muito comum. good knowledge of Spanish, sem artigo, também serve."},null,{"en":"experience = practice, skills (uncountable). Compare the last gap: an experience = one event.","pt":"experience = prática (incontável). Compare a última lacuna: an experience = um acontecimento."},null,null,null]},{"id":"b2-10","frame":"Travel blog","framePt":"Blog de viagem","title":"The road trip","titlePt":"A viagem de carro","body":["Last summer [the:family] Oliveiras drove from Rio to Buenos Aires. It was quite [a:quite] long trip: three days and half [a:quite] dozen flat tires! At one point they got stuck in [0:name] Uruguay for a whole day. What [an:what] adventure! [the:compar] longer the trip, [the:compar] better the stories, as my dad always says."],"pt":["No verão passado, os Oliveira foram de carro do Rio a Buenos Aires. Foi uma viagem bem longa: três dias e meia dúzia de pneus furados! Num certo momento, eles ficaram presos no Uruguai por um dia inteiro. Que aventura! Quanto mais longa a viagem, melhores as histórias, como o meu pai sempre diz."],"w":{"drove":"foram de carro","dozen":"dúzia","flat tires":"pneus furados","got stuck":"ficaram presos","adventure":"aventura"}},{"id":"b2-11","frame":"Report","framePt":"Relato","title":"Saturday kitchen","titlePt":"Cozinha de sábado","body":["Every Saturday our youth group goes to [the/a:purpose/any] church {on Rua Augusta} {to cook} for [the:group] homeless. {Most of} [the:of] volunteers are teenagers, but [0:general] people of all ages help. Last month a man none of us had ever seen, [a:someone] Mr. Diniz, donated [a:per] hundred kilos of rice! We still don't know who he is."],"pt":["Todo sábado o nosso grupo de jovens vai à igreja da Rua Augusta cozinhar para os moradores de rua. A maioria dos voluntários são adolescentes, mas pessoas de todas as idades ajudam. No mês passado, um homem que nenhum de nós tinha visto antes, um tal de Sr. Diniz, doou cem quilos de arroz! Até hoje não sabemos quem ele é."],"w":{"youth group":"grupo de jovens","volunteers":"voluntários","donated":"doou","rice":"arroz","none of us":"nenhum de nós"},"notes":[{"en":"the church on Rua Augusta = the one there (we say which); a church on Rua Augusta = one of the churches on that street. Both work. Either way it's the building: they go to cook, not to a service (that would be go to church).","pt":"the church on Rua Augusta = a igreja da Rua Augusta (dizemos qual); a church on Rua Augusta = uma das igrejas daquela rua. As duas servem. Nos dois casos é o prédio: eles vão cozinhar, não à missa (isso seria go to church)."},null,{"en":"most + noun has no the (most people), but with of, the comes back: most of the volunteers.","pt":"most + substantivo não tem the (most people), mas com of o the volta: most of the volunteers."}]},{"id":"b2-12","frame":"School news","framePt":"Notícias da escola","title":"The science fair","titlePt":"A feira de ciências","body":["This year's science fair was about [0:abstract] nature. Our class studied [the:of] nature {of sleep}: why do we need it? We found that [a:per] third of [0/the:general/known] teenagers sleep less than seven hours. [the:compar] later they go to bed, [the:compar] worse their grades are. Our project won [a/the:any/unique] prize!"],"pt":["A feira de ciências deste ano foi sobre a natureza. A nossa turma estudou a natureza do sono: por que precisamos dele? Descobrimos que um terço dos adolescentes dorme menos de sete horas. Quanto mais tarde eles vão dormir, piores são as notas. O nosso projeto ganhou um prêmio!"],"w":{"science fair":"feira de ciências","grades":"notas","won":"ganhou","prize":"prêmio"},"notes":[{"en":"nature = the natural world, in general: no article. the nature of sleep (next gap) = what sleep is like.","pt":"nature = a natureza em geral: sem artigo. the nature of sleep (próxima lacuna) = como o sono é, a sua natureza."},null,null,{"en":"a third of teenagers = of all teenagers; a third of the teenagers = of the ones in our study. Both work.","pt":"a third of teenagers = de todos os adolescentes; a third of the teenagers = dos adolescentes da nossa pesquisa. As duas servem."},null,null,{"en":"won a prize = one of the prizes; won the prize = the only (or main) prize of the fair. Both work.","pt":"won a prize = um dos prêmios; won the prize = o prêmio (o único, ou o principal) da feira. As duas servem."}]},{"id":"b2-13","frame":"Diary","framePt":"Diário","title":"Dad's birthday dinner","titlePt":"O jantar de aniversário do pai","body":["For my dad's birthday we went to a fancy restaurant downtown. We waited almost half [an:quite] hour for a table, and then my sister found [a:first] hair in her soup! The waiter apologized and brought us free dessert. My dad didn't mind at all: [the:compar] more he ate, [the:compar] happier he got. It was quite [a:quite] night!"],"pt":["No aniversário do meu pai fomos a um restaurante chique no centro. Esperamos quase meia hora por uma mesa, e depois a minha irmã achou um fio de cabelo na sopa! O garçom pediu desculpas e nos deu a sobremesa de graça. O meu pai nem ligou: quanto mais ele comia, mais feliz ficava. Foi uma noite e tanto!"],"w":{"fancy":"chique","apologized":"pediu desculpas","didn't mind":"nem ligou"},"notes":[null,{"en":"a hair = one single hair. Without an article, hair is all the hair on your head: She has long hair.","pt":"a hair = um fio de cabelo. Sem artigo, hair é o cabelo todo: She has long hair."},null,null,{"en":"quite a night = an unusual, memorable night.","pt":"quite a night = uma noite e tanto."}]},{"id":"b2-14","frame":"Blog","framePt":"Blog","title":"My paper on the sixties","titlePt":"Meu trabalho sobre os anos 60","body":["I'm writing [a:first] paper for my history class on Brazil in [the:decade] 1960s. I've always loved [0:abstract] history, but [the:of] history of that decade is complicated. My grandmother was a student back then, and she says [0:abstract] society was much more traditional. She's been [a:kind] great help: she even found her old letters for me."],"pt":["Estou escrevendo um trabalho para a aula de história sobre o Brasil nos anos 1960. Eu sempre amei história, mas a história daquela década é complicada. A minha avó era estudante naquela época, e ela diz que a sociedade era muito mais tradicional. Ela tem sido uma grande ajuda: ela até achou as cartas antigas dela para mim."],"w":{"back then":"naquela época","traditional":"tradicional","letters":"cartas"},"notes":[{"en":"a paper = a piece of written work (an essay, a report). Without an article, paper is the material: made of paper.","pt":"a paper = um trabalho escrito (redação, artigo). Sem artigo, paper é o material: feito de papel."},null,null,null,null,{"en":"help is uncountable, but someone or something can be a great help.","pt":"help é incontável, mas alguém pode ser a great help (uma grande ajuda)."}]},{"id":"b2-15","frame":"News","framePt":"Notícia","title":"An app for recycling","titlePt":"Um aplicativo para reciclar","body":["[0:headline] Local Student Wins [0:headline] Prize for [0:headline] Recycling App","Eighteen-year-old Julia Matos has won [a:first] national prize for an {^app} that helps families recycle. She built it in her bedroom in just four months. [the:known] app shows which bin each item goes in. “[the:compar] more people know, [the:compar] more they recycle,” she says."],"pt":["Estudante da cidade ganha prêmio por aplicativo de reciclagem","Julia Matos, de dezoito anos, ganhou um prêmio nacional por um aplicativo que ajuda as famílias a reciclar. Ela criou o aplicativo no quarto dela em apenas quatro meses. O aplicativo mostra em qual lixeira vai cada item. “Quanto mais as pessoas sabem, mais elas reciclam”, ela diz."],"w":{"built":"criou","bin":"lixeira","recycle":"reciclar"},"tags":["headline",null]},{"id":"b2-16","frame":"Email","framePt":"E-mail","title":"Such a week!","titlePt":"Que semana!","body":["Hi Clara! Sorry I didn't write sooner: it's been such [a:quite] crazy week. On Saturday [the:family] Almeidas upstairs had a party until 3 a.m., and on Monday a man none of us knew, [a:someone] Mr. Becker from the building company, came to ask about the noise. To calm down, I've started doing [0:activity] yoga, and I'm trying to drink less coffee: now I have only [a:kind] coffee a day. Write soon!"],"pt":["Oi, Clara! Desculpa não ter escrito antes: foi uma semana muito louca. No sábado os Almeida do andar de cima deram uma festa até as 3 da manhã, e na segunda um homem que nenhum de nós conhecia, um tal de Sr. Becker da administradora do prédio, veio perguntar sobre o barulho. Para me acalmar, comecei a fazer ioga, e estou tentando tomar menos café: agora eu tomo só um café por dia. Escreve logo!"],"w":{"sooner":"antes","upstairs":"do andar de cima","building company":"administradora do prédio","noise":"barulho","calm down":"me acalmar"}},{"id":"b2-17","frame":"Advice column","framePt":"Coluna de conselhos","title":"A year off?","titlePt":"Um ano sabático?","body":["Dear Ana, I'm eighteen and I'd like to take a year off after high school, but my parents are against it. What should I do? Pedro","Dear Pedro, a year off before [0:inst] college can be [an:kind] incredible experience, as long as you plan it. Working abroad, for example, gives you [0:uncount] work experience, and employers love that. [0:most] most universities will let you start a year later if you ask. Talk to your parents: [the:compar] more details you give them, [the:compar] calmer they'll be."],"pt":["Querida Ana, tenho dezoito anos e gostaria de tirar um ano sabático depois do ensino médio, mas os meus pais são contra. O que eu faço? Pedro","Querido Pedro, um ano sabático antes da faculdade pode ser uma experiência incrível, desde que você planeje. Trabalhar no exterior, por exemplo, te dá experiência de trabalho, e os empregadores adoram isso. A maioria das universidades deixa você começar um ano depois se você pedir. Converse com os seus pais: quanto mais detalhes você der, mais tranquilos eles vão ficar."],"w":{"year off":"ano sabático","as long as":"desde que","abroad":"no exterior","employers":"empregadores","calmer":"mais tranquilos"},"notes":[null,{"en":"an experience = one event you live through. Without an article, experience is what you learn by doing something: work experience.","pt":"an experience = uma experiência, algo que você vive. Sem artigo, experience é a prática que você ganha: work experience."},{"en":"Here experience is uncountable: the knowledge you get from working.","pt":"Aqui experience é incontável: a prática que você ganha trabalhando."},null,null,null]},{"id":"b2-18","frame":"Travel blog","framePt":"Blog de viagem","title":"Four days in Madrid","titlePt":"Quatro dias em Madri","body":["Last spring we spent four days in Madrid. On our first morning at the Prado, I stood in front of [a:someone] Velázquez for twenty minutes: [0:abstract] art has never moved me like that. We soon learned that [the:group] Spanish have [0:routine] dinner very late, often after ten. On our last night we had [a:kind] wonderful late dinner in a tiny bar near the Plaza Mayor. It was such [a:quite] good trip that we're already planning the next one."],"pt":["Na primavera passada passamos quatro dias em Madri. Na nossa primeira manhã no Prado, eu fiquei vinte minutos na frente de um Velázquez: a arte nunca tinha me emocionado assim. Logo aprendemos que os espanhóis jantam muito tarde, muitas vezes depois das dez. Na nossa última noite tivemos um jantar tardio maravilhoso num barzinho perto da Plaza Mayor. Foi uma viagem tão boa que já estamos planejando a próxima."],"w":{"stood":"fiquei em pé","moved":"emocionou","tiny":"pequenininho"},"notes":[null,null,{"en":"the Spanish = the people of Spain. The language takes no article: I speak Spanish.","pt":"the Spanish = os espanhóis (o povo). O idioma não leva artigo: I speak Spanish."},null,{"en":"Meals take no article (have dinner), but with an adjective it's one particular meal: a wonderful late dinner.","pt":"Refeições não levam artigo (have dinner), mas com adjetivo é uma refeição específica: a wonderful late dinner."}]},{"id":"b2-19","frame":"Blog","framePt":"Blog","title":"Back to school, as a parent","titlePt":"De volta à escola, como pai","body":["My son started [0:inst] school this year, and last night I went to [the:purpose] school for my first {parents' meeting}. It lasted [an:per] hour and a half! [0:abstract] education has changed so much: kids learn [0:activity] coding at six now. On the way home I realized I hadn't been inside a classroom since [the:decade] nineties."],"pt":["O meu filho começou a escola este ano, e ontem à noite eu fui à escola para a minha primeira reunião de pais. Ela durou uma hora e meia! A educação mudou tanto: as crianças aprendem programação aos seis anos agora. No caminho para casa eu percebi que não entrava numa sala de aula desde os anos noventa."],"w":{"parents' meeting":"reunião de pais","lasted":"durou","coding":"programação","realized":"percebi"}},{"id":"b2-20","frame":"Diary","framePt":"Diário","title":"Summer on the farm","titlePt":"Verão na fazenda","body":["Every July we visit [the:family] Pereiras, my mom's cousins, who run a farm in Minas Gerais. We wake up at five and go to [0:inst] bed at nine. We eat [0:uncount] chicken almost every day, which is funny, because my little brother has [a:first] chicken as a pet. There's [0:few] little to do at night, but [the:compar] longer we stay, [the:compar] less we miss our phones."],"pt":["Todo mês de julho visitamos os Pereira, primos da minha mãe, que têm uma fazenda em Minas Gerais. Acordamos às cinco e vamos dormir às nove. Comemos frango quase todo dia, o que é engraçado, porque o meu irmãozinho tem uma galinha de estimação. Não tem quase nada para fazer à noite, mas quanto mais tempo ficamos, menos sentimos falta do celular."],"w":{"run":"administram","as a pet":"de estimação","miss":"sentimos falta de"},"notes":[null,null,{"en":"chicken with no article = the meat. A chicken = the animal.","pt":"chicken sem artigo = a carne (frango). A chicken = o animal (uma galinha)."}]},{"id":"b2-21","frame":"School news","framePt":"Notícias da escola","title":"Phones in lockers","titlePt":"Celular no armário","body":["Starting in March, all [the/0:of/general] students at our school will have to keep their phones in lockers during class. [0:most] most teachers support the idea, and so far only [a:few] few parents have complained. Our principal says [0:abstract] concentration is the first thing phones destroy. A recent survey seems to prove her right: [a:per] quarter of us check our phones every five minutes!"],"pt":["A partir de março, todos os alunos da nossa escola vão ter que deixar o celular no armário durante a aula. A maioria dos professores apoia a ideia, e até agora só alguns pais reclamaram. A nossa diretora diz que a concentração é a primeira coisa que o celular destrói. Uma pesquisa recente parece dar razão a ela: um quarto de nós olha o celular a cada cinco minutos!"],"w":{"lockers":"armários","support":"apoiam","complained":"reclamaram","principal":"diretora","survey":"pesquisa","prove her right":"dar razão a ela"},"notes":[{"en":"all the students at our school = that group; all students = students as a category. Both work here.","pt":"all the students at our school = todos os alunos desse grupo; all students = alunos em geral. As duas servem aqui."},null,{"en":"only a few = a small number, but some. After only, it's always a few.","pt":"only a few = só alguns, um número pequeno. Depois de only, é sempre a few."},null,null]},{"id":"b2-22","frame":"Opinion","framePt":"Opinião","title":"What is a good education?","titlePt":"O que é uma boa educação?","body":["Everyone wants [a:kind] good education for their kids, but what is it, exactly? In [the:decade] 1980s, my parents learned by memorizing dates and rules. Today [0:abstract] knowledge is just a click away, so what really matters is [the:of] ability to question it. [the:of] teachers I remember best weren't the strictest ones: they were the ones who made us curious. [0:abstract] curiosity, I believe, is the real goal."],"pt":["Todo mundo quer uma boa educação para os filhos, mas o que é isso, exatamente? Nos anos 1980, os meus pais aprendiam decorando datas e regras. Hoje o conhecimento está a um clique de distância, então o que realmente importa é a capacidade de questioná-lo. Os professores de quem eu mais me lembro não eram os mais rígidos: eram os que nos deixavam curiosos. A curiosidade, eu acredito, é o verdadeiro objetivo."],"w":{"memorizing":"decorando","a click away":"a um clique de distância","question":"questionar","strictest":"mais rígidos","goal":"objetivo"}},{"id":"b2-23","frame":"Email","framePt":"E-mail","title":"Moving day","titlePt":"Dia de mudança","body":["We finally moved into our new apartment! Two of the boxes were full of [0:uncount] glass: vases, bowls and cups from my grandma's old cabinet, and of course one of those boxes fell. Now we don't have [a:need] single glass to drink from! Luckily, [the:family] Santoses next door brought us lemonade in paper cups. [0:general] moving is such [an:quite] adventure: I never want to do it again."],"pt":["Finalmente nos mudamos para o apartamento novo! Duas das caixas estavam cheias de vidro: vasos, tigelas e xícaras do armário antigo da minha avó, e é claro que uma dessas caixas caiu. Agora não temos nem um copo para beber! Por sorte, os Santos da casa ao lado nos trouxeram limonada em copos de papel. Mudar de casa é uma aventura e tanto: eu nunca mais quero fazer isso."],"w":{"vases":"vasos","bowls":"tigelas","cabinet":"armário","Luckily":"por sorte","next door":"da casa ao lado","lemonade":"limonada"},"notes":[{"en":"glass with no article = the material (glass things). A glass = one thing you drink from.","pt":"glass sem artigo = o material, vidro. A glass = um copo."}]},{"id":"b2-24","frame":"Podcast","framePt":"Podcast","title":"Alone together","titlePt":"Sozinhos juntos","body":["In today's episode we talk about [0:abstract] loneliness, a problem that affects [the:group] young as much as [the:group] old. Our guest is Dr. Ana Lima, [a:job] psychologist who has studied it for twenty years. She says [0:most] most lonely people don't talk about it, because they feel ashamed. Her advice? Call [a:any] friend you haven't seen in a long time, today."],"pt":["No episódio de hoje falamos sobre a solidão, um problema que afeta os jovens tanto quanto os idosos. A nossa convidada é a Dra. Ana Lima, psicóloga que estuda o assunto há vinte anos. Ela diz que a maioria das pessoas solitárias não fala sobre isso, porque sente vergonha. O conselho dela? Ligue hoje para um amigo que você não vê há muito tempo."],"w":{"episode":"episódio","loneliness":"solidão","affects":"afeta","guest":"convidada","lonely":"solitárias","ashamed":"com vergonha"}},{"id":"b2-25","frame":"News","framePt":"Notícia","title":"From prison to the kitchen","titlePt":"Da prisão para a cozinha","body":["When Rafael Mendes went to [0:inst] prison at nineteen, he had never cooked [a:need] meal in his life. Today he runs [an:first] award-winning restaurant in Belo Horizonte, and every Friday he goes back to [the:purpose] prison {where he served his sentence} to teach cooking. “Everyone deserves [a:any] second chance,” he says, “and [the:compar] sooner they get one, [the:compar] better.” His students seem to agree."],"pt":["Quando Rafael Mendes foi preso aos dezenove anos, ele nunca tinha cozinhado uma refeição na vida. Hoje ele tem um restaurante premiado em Belo Horizonte, e toda sexta-feira ele volta à prisão onde cumpriu a pena para ensinar culinária. “Todo mundo merece uma segunda chance”, ele diz, “e quanto mais cedo, melhor.” Os alunos dele parecem concordar."],"w":{"runs":"administra","award-winning":"premiado","served his sentence":"cumpriu a pena","deserves":"merece"},"notes":[{"en":"went to prison = he was sent there as a prisoner.","pt":"went to prison = ele foi preso (foi para lá como prisioneiro)."}]},{"id":"b2-26","frame":"Opinion","framePt":"Opinião","title":"Is nature a luxury?","titlePt":"A natureza é um luxo?","body":["In my grandparents' time, [0:abstract] nature was part of daily life: they grew up in [a:first] small town where every house had [a:any] garden. Today, [0:most] most children in big cities rarely see a tree on their way to school, and [the:group] poor, especially, live far from
