   first. The page's own 01-theme.js applies the same colour again a moment later. Keep PAL in step with PALETTES
   (src/js/01-theme.js and the games). */
(function () {
  try {
    var PAL = {
      sky: ["#e4f3fb", "#f1e8fb", "#fdf0e6", 0], peach: ["#ffe6d8", "#ffd6e4", "#fff1c9", 0],
      mint: ["#d9f4e6", "#d3eef6", "#eef6d3", 0], lilac: ["#e9e0fb", "#f7d9ee", "#dbe6fb", 0],

    if (s.indexOf("p:") === 0) c = PAL[s.slice(2)] || null;

        l = (mx + mn) / 2, h = 0, sat = 0, d = mx - mn;
      if (d) {

      }

      c = [col(0), col(40), col(-40), l * 100 < 52];
    }
    if (c) {
      var root = document.documentElement;
      root.style.setProperty("--bg-a", c[0]); root.style.setProperty("--bg-b", c[1]); root.style.setProperty("--bg-c", c[2]);

  try {

  // colour picker (menu or game: both write --bg-a on <html>). No colour chosen: the default light / dark ones.

<script>
/* Every game saves its progress in the phone's storage. In the app all games share one storage, so each game's
   keys get the prefix "eb:articles:" here; two games can then use the same key names without overwriting each other.
   One exception: the background colour (every game saves it as "<prefix>-bg", e.g. "p:sky" or "c:#7aa7ff", like
   the menu) is ONE setting for the whole app, kept under the menu's key "eb-bg": the game opens with the colour
   chosen in the menu, and a colour chosen in a game becomes the menu's and the other games' too. */
(function () {
  try {
    var P = "eb:articles:", L = window.localStorage, S = Storage.prototype, BG = /^[a-z]+-bg$/;
    var get = S.getItem, set = S.setItem, del = S.removeItem;
    /* The EN / PT toggles too: ONE language for the whole app, the menu's (eb-lang). Each game saves its toggles
       under its own keys, with its own word for Portuguese (games.json "lang": "pt", "tr" or "native"; English is
       always "en"): reading one gives the menu's language, and a tap in a game changes the menu's and every
       game's. Until EN / PT is chosen, the menu's own rule: Portuguese for My level All / A1 / A2, English from B1. */
    var LG = {"art-guide-lang": "pt", "art-tour-lang": "tr"};
    function appLang() {
      var l = get.call(L, "eb-lang");
      if (l === "en" || l === "pt") return l;
      var lv = get.call(L, "eb-level");
      return lv === "B1" || lv === "B2+" ? "en" : "pt";
    }
    /* The sound-effects volume too (2026-11-26, the user): ONE for the whole app, the menu's "eb-vol" (0-100,
       0 = sound off). Every game saves "<prefix>-vol" (0-100, its Effects slider) plus an on / off key:
       "<prefix>-snd" ("0" = off) or "<prefix>-mute" ("1" = off). Reading them gives the menu's volume (menu at 0:
       the game opens muted, its slider where it was); after a game writes either, eb-vol = 0 if muted, else its
       slider. The Voice slider ("-vvol") stays each game's own. */
    var VOL = /^[a-z]+-vol$/, MUTE = /^[a-z]+-(snd|mute)$/;
    function own(k) { return get.call(L, P + k); }
    function syncVol(k) {
      var pre = k.slice(0, k.indexOf("-")), v = parseInt(own(pre + "-vol"), 10);
      if (isNaN(v) || v < 0 || v > 100) return;
      var off = own(pre + "-snd") === "0" || own(pre + "-mute") === "1";
      set.call(L, "eb-vol", String(off ? 0 : v));
    }
    S.getItem = function (k) {
      if (this === L && BG.test(k)) { var app = get.call(this, "eb-bg"); if (app) return app; }
      if (this === L && (VOL.test(k) || MUTE.test(k))) {
        var ev = get.call(this, "eb-vol");
        if (ev !== null && VOL.test(k) && ev !== "0") return ev;
        if (ev !== null && MUTE.test(k)) { var off = ev === "0"; return /-snd$/.test(k) ? (off ? "0" : "1") : (off ? "1" : "0"); }
      }
      if (this === L && LG.hasOwnProperty(k)) return appLang() === "en" ? "en" : LG[k];
      return get.call(this, this === L ? P + k : k);
    };
    S.setItem = function (k, v) {
      if (this === L && BG.test(k)) set.call(this, "eb-bg", v);
      if (this === L && LG.hasOwnProperty(k)) set.call(this, "eb-lang", String(v) === "en" ? "en" : "pt");
      var r = set.call(this, this === L ? P + k : k, v);
      if (this === L && (VOL.test(k) || MUTE.test(k))) syncVol(k);
      return r;
    };
    S.removeItem = function (k) { return del.call(this, this === L ? P + k : k); };
    /* The app's own keys (eb-rounds, eb-don…) and language, for the injected donation script (donate.js) */
    window.ebApp = { get: function (k) { return get.call(L, k); }, set: function (k, v) { set.call(L, k, v); }, lang: appLang, title: "A, An or The?" };
    /* Opened from the menu (a card or Continue)? Then the game starts at the menu's level ("My level"): the menu
       leaves a one-time note (sessionStorage eb-level-go), and the matching level is saved under the game's own
       level key before the game reads it (games.json "level"; the nearest level when the game doesn't have it).
       With "All" on the menu, or on a reload, the game keeps its own last level. */
    var LV = {"key": "art-level", "A1": "A1", "A2": "A2", "B1": "B1", "B2+": "B2"}, SS = window.sessionStorage;
    if (SS.getItem("eb-level-go") === "articles") {
      SS.removeItem("eb-level-go");
      var m = get.call(L, "eb-level");
      if (LV && LV[m]) set.call(L, P + LV.key, LV[m]);
    }
  } catch (e) {}
})();
</script>

   Content-box, minus its own 2px padding top and bottom; the border adds as on the buttons. */
.seg.level { box-sizing: content-box; height: calc(18px + 1.1 * .92rem - 4px); align-items: stretch; }
.dock .seg.level button { padding-top: 0 !important; padding-bottom: 0 !important; }   /* .dock: wins over the phone paddings */
@media (max-width: 600px) { .seg.level { height: calc(18px + .92rem - 4px); } }
/* Level colours (levels.json "grad"): a tint on hover, the chosen one's gradient on the sliding pill */
.seg.level button:hover { background: color-mix(in srgb, var(--lv, var(--ink)) 22%, transparent); }
.seg.level button[aria-pressed="true"] { color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
.seg.level .seg-ind { background: linear-gradient(135deg, var(--lv, var(--ink)), var(--lv2, var(--ink))); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 3px 10px var(--shadow); }
/* Glass bubble */
.b {
  --h: 200;
  position: relative;
  appearance: none; cursor: pointer;
  font-family: inherit; font-weight: 500;
  font-size: clamp(1.05rem, 1.5vw + .7rem, 1.4rem);
  line-height: 1;
  letter-spacing: .01em;
  color: var(--ink);
  padding: .78em 1.35em .82em;
  border-radius: 1.5em;
  border: 1.5px solid hsla(var(--h), 75%, var(--rim-l), .75);
  background: radial-gradient(120% 140% at 22% 14%, var(--fill-hi), var(--fill-mid) 48%, var(--fill-lo) 100%);
  box-shadow:
    inset 0 0 16px hsla(var(--h), 95%, var(--glow-l), .38),
    inset -5px -7px 14px hsla(calc(var(--h) + 70), 95%, var(--glow-l), .28),
    0 7px 16px var(--shadow);
  transition: transform .28s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease, border-color .25s ease;
}
.b::before {
  content: ""; position: absolute; left: 11%; top: 9%; width: 26%; height: 20%;
  border-radius: 50%;
  background: radial-gradient(closest-side, var(--gloss), transparent);
  transform: rotate(-14deg); opacity: .8; pointer-events: none; transition: opacity .25s ease;
}
.b::after {
  content: ""; position: absolute; right: 9%; bottom: 12%; width: 7%; height: 12%;
  border-radius: 50%; background: var(--gloss); opacity: .35; pointer-events: none;
}
.b:hover, .b:focus-visible, .b.playing {
  transform: translateY(-8px) scale(1.07);
  border-color: hsla(var(--h), 85%, calc(var(--rim-l) - 12%), .95);
  box-shadow:
    inset 0 0 22px hsla(var(--h), 100%, var(--glow-l), .6),
    inset -6px -8px 18px hsla(calc(var(--h) + 70), 100%, var(--glow-l), .45),
    0 16px 26px var(--shadow),
    0 0 0 4px hsla(var(--h), 90%, 75%, .22);
}
.b:hover::before, .b:focus-visible::before, .b.playing::before { opacity: 1; }
.b:focus-visible { outline: 2px solid var(--underline); outline-offset: 4px; }
.b:active { transform: translateY(-3px) scale(.97); }
@keyframes rise { from { opacity: 0; transform: translateY(26px) scale(.9); } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .b, body, .seg button, .sw button { animation: none !important; transition: none !important; }
}
.swwrap { position: relative; padding: 0 4px; }
.swbtn { display: block; width: 27px; height: 27px; padding: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,.9); cursor: pointer; background: conic-gradient(#ff7aa8, #ffd36b, #7be0a4, #6bc7ff, #b08cff, #ff7aa8); box-shadow: 0 1px 5px var(--shadow); transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
.swbtn:hover, .swwrap.open .swbtn { transform: scale(1.12) rotate(40deg); }
.swwrap .sw { position: absolute; top: calc(100% + 12px); right: 0; z-index: 30; width: max-content; max-width: calc(100vw - 32px); flex-wrap: wrap; justify-content: center; padding: 10px 14px; border-radius: 24px; background: var(--bg-a); border: 1px solid var(--dock-line); -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); box-shadow: 0 10px 26px var(--shadow); opacity: 0; visibility: hidden; transform: translateY(-6px) scale(.96); transform-origin: top right; transition: opacity .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1), visibility 0s linear .25s; }
.swwrap .sw::before { content: ""; position: absolute; left: 0; right: 0; top: -14px; height: 14px; }
.swwrap.open .sw { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
@media (hover: hover) { .swwrap:hover .sw { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; } }
@media (max-width: 600px) {
  .swwrap { position: static; }
  .swwrap .sw { left: 12px; right: 12px; width: auto; max-width: none; transform-origin: top center; }
}
/* Modals */
.favmodal { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(20,20,40,.35); -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px); }
.favmodal.show { display: flex; animation: fadein .2s ease; }
.favcard { box-sizing: border-box; width: 100%; max-width: 560px; max-height: 80vh; overflow: auto; padding: 16px 18px 18px; border-radius: 28px; background: var(--bg-a); background: color-mix(in srgb, var(--bg-a) 72%, transparent); color: var(--ink); border: 1px solid var(--dock-line); box-shadow: 0 20px 50px rgba(0,0,0,.28); animation: cardin .3s cubic-bezier(.34,1.56,.64,1); }
.favhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.favhead h2 { margin: 0; font-size: 1.3rem; font-family: inherit; }
.favx { border: 0; background: transparent; color: inherit; font-size: 1.9rem; line-height: 1; cursor: pointer; opacity: .7; padding: 0 4px; }
.pend { text-align: center; padding: 16px 0 4px; }
.pend b { display: block; font-size: 2.2rem; }
.pmsg { font-size: 1.15rem; font-weight: 600; margin-top: 2px; }
.psub { font-size: .85rem; opacity: .7; }
/* Badge (used for the PT translation, glosses) and screen-reader-only text */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pick-badge {
  flex: none; display: inline-grid; place-items: center; min-width: 2.35em; height: 1.85em; padding: 0 .55em; white-space: nowrap;
  border-radius: 999px; font-size: .74em; font-weight: 600; letter-spacing: .04em; color: #fff;
  background: var(--g, linear-gradient(135deg, #2bb673, #f2c230)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35);
  text-shadow: 0 1px 1px rgba(0, 0, 0, .25);
}
#snd { display: inline-flex; align-items: center; justify-content: center; padding: .5em .75em; }
#snd svg { display: block; }
/* Volume */
.volwrap { position: relative; display: flex; flex: 1 1 auto; justify-content: center; }
.volp { position: absolute; top: calc(100% + 10px); left: 50%; z-index: 30; display: flex; align-items: center; padding: 10px 16px; border-radius: 24px; background: var(--bg-a); border: 1px solid var(--dock-line); box-shadow: 0 10px 26px var(--shadow); opacity: 0; visibility: hidden; transform: translateX(-50%) translateY(-6px) scale(.5, .8); transform-origin: top center; transition: opacity .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1), visibility 0s linear .25s; }
.volp::before { content: ""; position: absolute; left: 0; right: 0; top: -12px; height: 12px; }
.volp { flex-direction: column; align-items: stretch; gap: 6px; }   /* two rows: effects, voice (2026-11-25) */
.volr { display: flex; align-items: center; gap: 10px; font-size: .8rem; white-space: nowrap; cursor: pointer; }
.volr span { flex: 1; opacity: .75; }
.volwrap.muted .volr { opacity: .45; }   /* muted by the speaker: the levels are kept, moving a slider unmutes */
.volp input { width: 140px; margin: 0; cursor: pointer; accent-color: hsl(300,70%,58%); }
.volwrap.open .volp { opacity: 1; visibility: visible; transform: translateX(-50%); transition-delay: 0s; }
@media (hover: hover) { .volwrap:hover .volp { opacity: 1; visibility: visible; transform: translateX(-50%); transition-delay: 0s; } }
@media (max-width: 600px) {   /* on a phone the labelled rows hang left from the speaker's right edge, inside the screen */
  .volp { left: auto; right: 0; padding: 10px 12px; transform: translateY(-6px) scale(.5, .8); transform-origin: top right; }
  .volp input { width: 100px; }
  .volwrap.open .volp { transform: none; }
}
@media (max-width: 600px) and (hover: hover) { .volwrap:hover .volp { transform: none; } }
/* Score, progress, tiles, CTA (from template 2) */
.go { display: grid; grid-template-columns: 78px 1fr 78px; align-items: center; column-gap: 10px; max-width: 680px; margin: 20px auto 0; }
.score { cursor: pointer; font: inherit; color: var(--ink); transition: transform .28s cubic-bezier(.34,1.56,.64,1), background .35s ease, box-shadow .35s ease; }
.score:hover { transform: translateY(-2px); }
.score, .tile { justify-self: start; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 78px; height: 54px; padding: 0 8px; border-radius: 18px; background: var(--dock-bg); border: 1px solid var(--dock-line); box-shadow: 0 4px 12px var(--shadow); line-height: 1.05; text-align: center; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: background .35s ease, box-shadow .35s ease; }
.tile { justify-self: end; color: var(--ink); font: inherit; cursor: pointer; transition: transform .28s cubic-bezier(.34,1.56,.64,1), background-color .2s ease; }
.tile:hover { transform: translateY(-2px); background: var(--fill-hi); }
.tile:active { transform: scale(.96); }
.tile svg { display: block; transition: transform .5s cubic-bezier(.34,1.56,.64,1); }
.tile:hover svg { transform: rotate(-200deg); }
.tile small { font-size: .68rem; opacity: .75; white-space: nowrap; line-height: 1.05; }
.tile:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.score b { font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.score small { font-size: .68rem; opacity: .75; white-space: nowrap; }
.score.up { animation: scup .5s cubic-bezier(.34,1.56,.64,1); }
.score.down { animation: scdn .5s ease; }
.score.win { background: hsla(45,100%,80%,.92); box-shadow: 0 0 0 3px hsla(45,95%,60%,.55), 0 6px 18px var(--shadow); animation: scwin .8s cubic-bezier(.34,1.56,.64,1); }
.score.win b, .score.win small { color: #5a3d00; opacity: 1; }
@keyframes scup { 0% { transform: none; } 35% { transform: translateY(-8px) scale(1.22); background: hsla(150,75%,78%,.95); } 100% { transform: none; } }
@keyframes scdn { 0%, 100% { transform: none; } 20% { transform: translateX(-7px) scale(.94); background: hsla(350,85%,82%,.95); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
@keyframes scwin { 0% { transform: scale(1); } 40% { transform: scale(1.3) rotate(-4deg); } 70% { transform: scale(.95) rotate(2deg); } 100% { transform: scale(1); } }
.prog { width: min(100%, 300px); justify-self: center; text-align: center; }
.prog span { font-size: .9rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.cta { font-size: 1rem; font-weight: 600; padding: .6em 1.5em; border: 0; border-radius: 999px; cursor: pointer; color: #fff; background: linear-gradient(135deg, hsl(315,85%,68%), hsl(275,80%,68%)); box-shadow: 0 3px 9px hsla(295,70%,55%,.22); transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease; }
.cta:hover { transform: scale(1.05); box-shadow: 0 4px 12px hsla(295,70%,55%,.3); }
.cta:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.cta.pulse { animation: pulse 1.4s ease-in-out infinite; }
html, body { overflow-x: clip; }
/* Tutorial */
/* Tutorial: the dock button, then a guided tour. A spotlight glides from feature to feature (its huge shadow is the
   dimming), and a card next to it explains each one. */
.tourbtn {
  appearance: none; cursor: pointer; flex: none; position: relative;
  display: inline-flex; align-items: center; gap: .4em;
  padding: .55em .95em .55em .7em; border-radius: 999px;
  font-family: inherit; font-weight: 500; font-size: .92rem; line-height: 1;
  color: var(--ink); background: transparent; border: 1px solid var(--dock-line);
  transition: background-color .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
}
.tourbtn svg { display: block; flex: none; color: var(--underline); }
.tourbtn:hover { background: var(--dock-line); transform: translateY(-1px); }
.tourbtn:active { transform: scale(.96); }
.tourbtn.fresh::after {
  content: ""; position: absolute; inset: -3px; border-radius: inherit; pointer-events: none;
  border: 2px solid var(--underline); opacity: 0; animation: tourping 2.4s ease-out 1.5s infinite;
}
body.trial-on .tourbtn { pointer-events: none; opacity: .35; }
@keyframes tourping { 0% { opacity: .9; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(1.18); } }
.tour { position: fixed; inset: 0; z-index: 50; touch-action: none; }
.tour[hidden] { display: none; }
.tour-shield { position: absolute; inset: 0; }
.tour-spot {
  position: fixed; left: 50%; top: 50%; width: 0; height: 0; border-radius: 22px; pointer-events: none;
  box-shadow: 0 0 0 200vmax rgba(8, 12, 36, .62), 0 0 0 3px rgba(255, 255, 255, .9), 0 0 26px 6px rgba(255, 140, 200, .55);
}
.tour-spot::after {
  content: ""; position: absolute; inset: -6px; border-radius: inherit; border: 2px solid rgba(255, 255, 255, .8);
  animation: tourglow 1.8s ease-out infinite;
}
.tour-spot.none::after { display: none; }
@keyframes tourglow { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.06); } }
.tour-card {
  position: fixed; left: 50%; top: 50%; width: min(380px, calc(100vw - 32px)); box-sizing: border-box;
  display: flex; flex-direction: column; gap: .45rem;
  padding: 1.05rem 1.15rem 1rem; border-radius: 1.4rem;
  color: var(--ink); background: var(--dock-bg); border: 1px solid var(--dock-line);   /* the header's frosted glass */
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: 0 22px 50px rgba(0, 0, 0, .3);
}
.tour-card.in { animation: tourcard .34s cubic-bezier(.2,.9,.3,1.15); }
@keyframes tourcard { from { opacity: 0; transform: translateY(10px) scale(.96); } }
.tour-step { margin: 0; padding-right: 2rem; font-size: .72rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; opacity: .6; }
.tour-title { margin: 0; padding-right: 1.6rem; font-family: inherit; font-size: 1.32rem; font-weight: 600; line-height: 1.2; }
.tour-text { margin: 0; font-size: .98rem; line-height: 1.45; }
.tour-text b { color: var(--underline); font-weight: 600; }
.tour-foot { display: flex; align-items: center; justify-content: space-between; gap: .6rem; margin-top: .45rem; }
.tour-dots { display: flex; gap: 4px; min-width: 0; }
.tour-dots[hidden], .tour-back[hidden] { display: none; }
.tour-dots span { flex: none; width: 6px; height: 6px; border-radius: 99px; background: rgba(128,128,150,.35); transition: width .3s ease, background-color .3s ease; }
.tour-dots span.on { width: 16px; background: var(--underline); }
.tour-dots span.done { background: var(--underline); opacity: .55; }
.tour-nav { display: flex; gap: .4rem; flex: none; margin-left: auto; }
.tour-back, .tour-next {
  appearance: none; cursor: pointer; border: 0; border-radius: 999px;
  font-family: inherit; font-size: .92rem; font-weight: 500; line-height: 1; padding: .7em 1.15em;
  transition: transform .25s cubic-bezier(.34,1.56,.64,1), background-color .2s ease;
}
.tour-back { color: var(--ink); background: transparent; }
.tour-back:hover { background: var(--dock-line); }
.tour-next { color: #fff; font-weight: 600; background: linear-gradient(135deg, #ff5ea8, #c04dff 55%, #8a5cff); box-shadow: 0 4px 14px rgba(200, 77, 255, .4); }
.tour-next:hover { transform: scale(1.05); }
.tour-next:active, .tour-back:active { transform: scale(.96); }
.tour-x {
  appearance: none; cursor: pointer; border: 0; position: absolute; top: .55rem; right: .55rem;
  width: 2rem; height: 2rem; border-radius: 50%; font-family: inherit; font-size: 1.25rem; line-height: 1;
  color: var(--ink); background: transparent; transition: background-color .2s ease;
}
.tour-x:hover { background: var(--dock-line); }
.tourbtn:focus-visible, .tour-back:focus-visible, .tour-next:focus-visible, .tour-x:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.tour-pop { position: fixed; z-index: 51; width: 12px; height: 12px; border-radius: 50%; pointer-events: none; }
@media (max-width: 600px) {
  .tourbtn { padding: .5em; }
  .tourbtn span { display: none; }
  .tour-card { padding: .95rem 1rem .9rem; }
  .tour-title { font-size: 1.18rem; }
  .tour-text { font-size: .94rem; }
}
@media (prefers-reduced-motion: reduce) { .tourbtn.fresh::after, .tour-spot::after, .tour-card.in { animation: none; } }
/* 10-game.css — page wrap, hint line, buttons, tools row, tries, reveal card, chips, toast, particles, tour extras,
   gloss tooltip, hint nudge. Taken from the conditionals template (play-area rules are in 11-text.css). */
[hidden] { display: none !important; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px 48px; }
#snd[aria-pressed="true"] { background: transparent; color: inherit; }
#snd[aria-pressed="true"]:hover { background: var(--dock-line); }
#snd[aria-pressed="false"] { opacity: .6; }
@media (max-width: 600px) { .seg.vseg { width: auto; } }
div.score { cursor: default; }
div.score:hover { transform: none; }
.hint { text-align: center; margin: 14px 12px 0; font-size: 1rem; opacity: .8; min-height: 1.4em; text-wrap: balance; }
.hint b { color: var(--underline); font-weight: 600; }
.pbtn { font: inherit; font-size: .9rem; font-weight: 500; padding: .5em 1em; border-radius: 999px; border: 1.5px solid var(--dock-line); background: var(--dock-bg); color: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background-color .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s ease; }
.pbtn:hover:not(:disabled) { background: var(--dock-line); transform: translateY(-1px); }
.pbtn:disabled { opacity: .35; cursor: default; }
.pbtn:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.pbtn small { font-size: .74rem; opacity: .65; }
.pbtn.speaking { background: var(--dock-line); }
/* Tools row */
.tools { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.trywrap { display: inline-flex; align-items: center; gap: 4px; }
.trylab { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
.tries { display: inline-flex; align-items: center; gap: 6px; padding: 0 6px; }
.tries i { width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(135deg, hsl(315,85%,68%), hsl(275,80%,68%)); box-shadow: 0 1px 4px var(--shadow); transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .3s ease; }
.tries i.used { opacity: .18; transform: scale(.65); }

/* Reveal card */
.reveal { position: relative; max-width: 760px; margin: 18px auto 0; padding: 16px 18px 18px; border-radius: 26px; text-align: center;
  background: var(--dock-bg); border: 1px solid var(--dock-line); box-shadow: 0 8px 22px var(--shadow);   /* the header's glass */
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); animation: cardin .45s cubic-bezier(.34,1.56,.64,1); transition: opacity .25s ease; }
.reveal[hidden] { display: none; }
.reveal.out { opacity: 0; }
.rv-head { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 12px; }
.chip { display: inline-block; font-size: .74rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: .38em .95em; border-radius: 999px; color: #fff; white-space: nowrap;
  background: linear-gradient(135deg, hsl(var(--h),75%,52%), hsl(calc(var(--h) + 35),70%,50%)); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); text-shadow: 0 1px 1px rgba(0,0,0,.18); }
/* A level chip (lists): the level's own gradient (levels.json "grad"), as on the level pill */
.chip.lvchip { background: linear-gradient(135deg, var(--lv, hsl(275,75%,52%)), var(--lv2, hsl(300,70%,50%))); }
.rv-note { margin: 12px 0 0; padding: 8px 12px; border-radius: 14px; font-size: .9rem; background: hsla(45,100%,70%,.2); border: 1px dashed hsla(45,90%,50%,.6); animation: pup .5s .4s ease-out backwards; }
.rv-note b { color: hsl(35,85%,var(--lab-l)); }
.rv-btns { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 16px; }
@keyframes cardin { from { opacity: 0; transform: scale(.92) translateY(12px); } }
@keyframes pup { from { opacity: 0; transform: translateY(10px); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
/* Toast + confetti bubbles */
.toast { position: absolute; left: 50%; top: 0; z-index: 5; padding: .35em 1em; border-radius: 999px; font-weight: 600; white-space: nowrap; pointer-events: none;
  background: hsl(150,60%,42%); color: #fff; box-shadow: 0 6px 16px var(--shadow); animation: toast 1.7s ease-out forwards; }
.toast.zero { background: hsl(35,85%,48%); }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%,-40%) scale(.6); } 15% { opacity: 1; transform: translate(-50%,-115%) scale(1.08); } 75% { opacity: 1; transform: translate(-50%,-130%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-175%); } }
.pf { position: fixed; z-index: 55; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at 30% 30%, #fff, hsla(var(--h),85%,75%,.55)); border: 1px solid hsla(var(--h),85%,68%,.85); animation: pfly .8s ease-out forwards; }

/* 14-soap.css — the bonus round's word bubbles as soap bubbles (from Conditionals / Be Do Modal, 2026-11-22): almost
   clear, a faint film of colour inside and a 1.5px coloured rim, both turning once in 10 s (each word its own hue, --h,
   from WORD_HUES). Built from spans (SOAP in 23-shine.js), each drawn once: the film and the rim turn by rotating a
   still conic gradient (.spin, a transform animation), and what follows the mouse moves by transform / opacity only.
   Paint order, bottom to top: the film (.spin, the white sheen ::before, the glow facing the mouse .fg, the inner glow
   ::after), the shine spot, the rim, the small spot, the word (.wl; .awrap on an article bubble). Per-theme numbers are tokens in 00-base.css
   (--soap-*, --spot-plus, --film-a, --srim-*, --sglow-*, --rimhi-*, --faceg-*). The border stays, clear, so no size
   changes. The article bubbles in the text (.art) use the same spans; their states are in 11-text.css. */
.b.w { --th: var(--h); border-color: transparent; background: none;
  --ig: inset 0 0 12px hsla(var(--th), 95%, var(--sglow-l), var(--sglow-a));   /* the inner glow, drawn above the film by .film::after; states change it */
  box-shadow: 0 6px 14px var(--soap-sh); }
.b.w::before { content: none; }   /* the shine spot is the .spot span */
.b.w::after { content: none; }   /* the small spot is the .glint span */
.b.w .wl { position: relative; }   /* above the moving shine */
:is(.w, .art) .film, :is(.w, .art) .spot, :is(.w, .art) .rim, :is(.w, .art) .glint { cursor: inherit; }
:is(.w, .art) .film { position: absolute; inset: -1.5px; z-index: 0; border-radius: inherit; overflow: hidden; pointer-events: none; }
:is(.w, .art) .film::before { content: ""; position: absolute; inset: 0; z-index: 1;
  background: radial-gradient(120% 120% at 30% 20%, rgba(255,255,255,var(--soap-hi)), rgba(255,255,255,var(--soap-lo)) 60%, transparent); }
:is(.w, .art) .film::after { content: ""; position: absolute; inset: 1.5px; z-index: 3; border-radius: inherit; box-shadow: var(--ig); transition: box-shadow .25s ease; }
/* The turning colour of film and rim: a square wider than the bubble's diagonal, centred; rotating it = turning the
   conic gradient's start. Both start together, so their colours stay in step. */
:is(.w, .art) .spin { position: absolute; left: 50%; top: 50%; width: calc(100% + 1.6em); aspect-ratio: 1; translate: -50% -50%; animation: spin 10s linear var(--dl, 0s) infinite; }
:is(.w, .art) .film .spin { background: conic-gradient(from var(--ang), hsla(var(--th), 95%, 76%, var(--film-a)) 0 30%, hsla(calc(var(--th) + 90), 95%, 80%, calc(var(--film-a) * .6)) 50%, hsla(calc(var(--th) + 200), 90%, 82%, calc(var(--film-a) * .7)) 72%, hsla(var(--th), 95%, 76%, var(--film-a)) 92%); }
:is(.w, .art) .rim .spin { background: conic-gradient(from var(--ang), hsla(var(--th), 90%, var(--srim-l), var(--srim-a)) 0 30%, hsla(calc(var(--th) + 90), 90%, calc(var(--srim-l) + 4%), calc(var(--srim-a) * .64)) 50%, hsla(calc(var(--th) + 200), 85%, calc(var(--srim-l) + 8%), calc(var(--srim-a) * .56)) 72%, hsla(var(--th), 90%, var(--srim-l), var(--srim-a)) 92%); }
@keyframes spin { to { transform: rotate(360deg); } }
/* What follows the mouse: 23-shine.js writes these wrappers' transform / opacity; the look is the <i> inside, and each
   is its own layer, so moving it repaints nothing. */
:is(.w, .art) .fg > i, :is(.w, .art) .rh > i, :is(.w, .art) .spot i, :is(.w, .art) .glint > i { position: absolute; inset: 0; }
:is(.w, .art) .film .fg { position: absolute; left: -10%; top: -45%; width: 120%; height: 190%; z-index: 2; opacity: 0; will-change: transform, opacity; }
:is(.w, .art) .fg > i { background: radial-gradient(closest-side, hsla(var(--th), 100%, var(--faceg-l), var(--faceg-a)), transparent); }
/* The two spots sit on the bubble's round ends: each span is a square as tall as the bubble over one end (so its %
   follow the curve), and the spot (the <i>, one size in em, never stretched) sits a little inside the rim: the shine
   up and left at 30deg past the top, along the curve; the small spot down and right at 45deg */
:is(.w, .art) .spot { position: absolute; left: -1.5px; top: -1.5px; height: calc(100% + 3px); aspect-ratio: 1; pointer-events: none;
  --sx: calc(25% + .19em); --sy: calc(6.7% + .33em); transform-origin: var(--sx) var(--sy); transform: rotate(-30deg); will-change: transform; }
:is(.w, .art) .spot > i { inset: auto; left: calc(var(--sx) - .31em); top: calc(var(--sy) - .25em); width: .62em; height: .5em; }
:is(.w, .art) .spot > i:first-child { background: radial-gradient(closest-side, rgba(255,255,255,var(--soap-gl)) 32%, rgba(255,255,255,calc(var(--soap-gl) * .55)) 62%, rgba(255,255,255,0)); }
:is(.w, .art) .spot .pl { opacity: 0; }   /* brighter, wider core as the mouse nears */
:is(.w, .art) .spot .pl i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--spot-plus) * .85)), rgba(255,255,255,var(--spot-plus)) 42%, rgba(255,255,255,calc(var(--spot-plus) * .55)) 52%, rgba(255,255,255,calc(var(--spot-plus) * .33)) 62%, rgba(255,255,255,calc(var(--spot-plus) * .12)) 81%, rgba(255,255,255,0)); }
/* the small second spot: a thin streak along the bottom-right curve; it moves the other way, a third as far */
:is(.w, .art) .glint { position: absolute; right: -1.5px; bottom: -1.5px; height: calc(100% + 3px); aspect-ratio: 1; pointer-events: none; opacity: .8;
  --gx: calc(85.36% - .17em); transform-origin: var(--gx) var(--gx); transform: rotate(-45deg); will-change: transform, opacity; }
:is(.w, .art) .glint > i { inset: auto; left: calc(var(--gx) - .17em); top: calc(var(--gx) - .085em); width: .34em; height: .17em; }
:is(.w, .art) .glint > i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--soap-gl) * .75)) 45%, rgba(255,255,255,0)); }
/* not on the article bubbles: next to their cycle dots it looked like one more dot (the user) */
.art .glint { display: none; }
/* the rim: a ring (a mask cuts out its middle) over the clear border */
:is(.w, .art) .rim { position: absolute; inset: -1.5px; border-radius: inherit; padding: 1.5px; pointer-events: none;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
:is(.w, .art) .rim .rh { position: absolute; left: -5%; top: -40%; width: 110%; height: 180%; opacity: 0; will-change: transform, opacity; }   /* the side facing the mouse lights up */
:is(.w, .art) .rh > i { background: radial-gradient(closest-side, hsla(var(--th), 100%, var(--rimhi-l), var(--rimhi-a)), transparent); }
/* States: hover / focus / drag glow more; right / wrong / shown turn the rim green / red / yellow */
.b.w:focus-visible { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 12px 22px var(--soap-sh2), 0 0 0 4px hsla(var(--th), 90%, 72%, .18); }
@media (hover: hover) { .b.w:hover:not(.drag):not(.ok):not(.shown) { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 12px 22px var(--soap-sh2); } }
.b.w.drag { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 18px 30px var(--soap-sh2), 0 0 0 4px hsla(var(--th), 90%, 72%, .2); }
.b.w.ok { border-color: transparent; --ig: inset 0 0 16px hsla(150, 80%, 60%, .42); box-shadow: 0 6px 14px var(--soap-sh); }
.b.w.bad { border-color: transparent; --ig: inset 0 0 16px hsla(350, 90%, 68%, .45); box-shadow: 0 6px 14px var(--soap-sh); }
.b.w.shown { border-color: transparent; --ig: inset 0 0 16px hsla(45, 95%, 60%, .45); box-shadow: 0 6px 14px var(--soap-sh); }
.w.ok .rim i, .w.bad .rim i, .w.shown .rim i { visibility: hidden; }   /* hidden, not stopped: they keep turning in step with the film */
.w.ok .rim { background: hsla(150, 60%, 48%, .85); }
.w.bad .rim { background: hsla(350, 80%, 60%, .85); }
.w.shown .rim { background: hsla(40, 90%, 55%, .9); }
/* The bob holds still while hovered (no edge jitter); off screen (#stage.still), while a word is carried
   (body.carrying, 24-squash.js) or while the result card opens or closes (body.calm, 23-shine.js), bob and film pause */
@media (hover: hover) { .bn-cloud .w:hover { animation-play-state: paused; } }
#stage.still .w, #stage.still .spin, body.carrying .w:not(.bad), body.carrying .spin, body.calm .bn-cloud .w, body.calm .spin { animation-play-state: paused !important; }
/* Touch screens: the film doesn't turn (each word keeps its own --ang); the bob stays */
@media (hover: none) { :is(.w, .art) .spin { animation: none; } }
@media (prefers-reduced-motion: reduce) { :is(.w, .art) .spin { animation: none; } }
/* 15-sky.css — from Be Do Modal's revamp (2026-11-22, via Conditionals): the background bubbles (08-sky.js), the custom
   colour picker, no page scroll behind a window. */
/* Background bubbles drifting up behind everything (made in 08-sky.js). lvh, not vh: Android's address bar would make
   them jump. Only transform / opacity animate; paused while a bonus word is carried or the result card opens. */
.sky { position: fixed; top: 0; left: 0; right: 0; height: 100vh; height: 100lvh; z-index: -1; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; }
.sky.in { opacity: var(--sky-o); }
.sky span {
  position: absolute; bottom: -120px; border-radius: 50%;
  border: 1.5px solid hsla(var(--h), 80%, var(--sky-rim-l), var(--sky-rim-a));
  background: radial-gradient(circle at 30% 26%, rgba(255,255,255,var(--sky-hi)), hsla(var(--h), 90%, 78%, var(--sky-tint-a)) 50%, hsla(var(--h), 90%, 72%, calc(var(--sky-tint-a) * .8)) 70%, transparent 71%);
  box-shadow: inset 0 0 14px hsla(var(--h), 95%, var(--sky-glow-l), var(--sky-glow-a));
  filter: blur(2px);
  animation: skydrift var(--t, 30s) linear infinite; animation-delay: var(--d, 0s);
  opacity: 0;
}
body.carrying .sky span, body.calm .sky span { animation-play-state: paused; }
@keyframes skydrift {
  0% { transform: translate3d(0, 0, 0); opacity: 0; }
  8% { opacity: .6; }
  50% { transform: translate3d(var(--x, 20px), -60vh, 0); transform: translate3d(var(--x, 20px), -60lvh, 0); }
  92% { opacity: .45; }
  100% { transform: translate3d(0, -125vh, 0); transform: translate3d(0, -125lvh, 0); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .sky { display: none; } }

/* The custom colour picker (01-theme.js; it replaced the browser's colour box): a full-width row under the swatches while picking. Tracks are pills of their
   own gradient, the handle a white disc ringed in the colour being made. contain: it never widens the pop-over. */
.cpick { contain: inline-size; min-width: 0; display: none; flex: 1 0 100%;
  flex-direction: column; gap: 12px; padding: 12px 0 4px; margin-top: 4px; border-top: 1px solid var(--dock-line); }
.swwrap.open.picking .cpick { display: flex; }
.cpick { --cp-h: 220; --cp-s: 100%; --cp-l: 74%; --cp-c: hsl(var(--cp-h), var(--cp-s), var(--cp-l)); }
.cp-top { display: flex; align-items: center; gap: 10px; }
.cp-hex { flex: 1; min-width: 0; font-family: inherit; font-size: .95rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: transparent;
  border: 1px solid var(--dock-line); border-radius: 999px; padding: .45em .9em; outline: none; }
.cp-hex:focus-visible { border-color: var(--underline); box-shadow: 0 0 0 3px hsla(335,80%,65%,.2); }
.cp-r { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 14px; margin: 4px 0; border-radius: 999px; cursor: pointer;
  background: var(--cp-track); box-shadow: inset 0 0 0 1px var(--dock-line); outline: none; touch-action: none; }
.cp-h { --cp-track: linear-gradient(90deg, hsl(0,85%,62%), hsl(60,85%,62%), hsl(120,85%,62%), hsl(180,85%,62%), hsl(240,85%,62%), hsl(300,85%,62%), hsl(359,85%,62%)); }
.cp-s { --cp-track: linear-gradient(90deg, hsl(var(--cp-h), 0%, var(--cp-l)), hsl(var(--cp-h), 100%, var(--cp-l))); }
.cp-l { --cp-track: linear-gradient(90deg, hsl(var(--cp-h), var(--cp-s), 8%), hsl(var(--cp-h), var(--cp-s), 50%), hsl(var(--cp-h), var(--cp-s), 92%)); }
.cp-r::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 4px solid var(--cp-c); box-shadow: 0 2px 6px var(--shadow); transition: transform .2s cubic-bezier(.34,1.56,.64,1); }
.cp-r::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 4px solid var(--cp-c); box-shadow: 0 2px 6px var(--shadow); }
.cp-r::-moz-range-track { background: transparent; }
.cp-r:hover::-webkit-slider-thumb, .cp-r:active::-webkit-slider-thumb { transform: scale(1.15); }
.cp-r:focus-visible { box-shadow: inset 0 0 0 1px var(--dock-line), 0 0 0 3px hsla(335,80%,65%,.25); }

/* While a window (Favorites, Seen, Guide, end card) or the tutorial is open, the page behind doesn't scroll; only the
   window's card does. Scripts can still scroll the page (the tutorial moves it to what it points at). */
html:has(.favmodal.show), html:has(.tour:not([hidden])) { overflow: hidden; overscroll-behavior: none; }

/* While the tutorial or a window (.favmodal) is open (body.covered, 23-shine.js) the game behind it stands still: the
   blur and dimming over it aren't redrawn on every frame (slow phones). Bubbles inside the window keep moving. */
body.covered :is(.art.right, .bn-cloud .w, .spin, .sky span):not(.tour *, .favmodal *) { animation-play-state: paused !important; }

/* Speed challenge clock (replaces "Sentence 1 of 5") */
.prog.clock #proglbl { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; }
.prog.clock #clk { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.prog.clock #clkdone { font-size: .75rem; opacity: .75; margin-top: 3px; }
.prog.clock .pbar { height: 8px; }
.prog.clock .days { display: none; }   /* the clock needs the room */
#clk.beat { animation: beat .7s cubic-bezier(.34,1.56,.64,1); }
@keyframes beat { 0% { transform: scale(1); } 30% { transform: scale(1.45); color: hsl(45,95%,55%); text-shadow: 0 0 18px hsla(45,95%,60%,.7); } 100% { transform: scale(1); } }
.prog.urgent #clk { color: hsl(350,80%,58%); animation: pulse 1s ease-in-out infinite; }
.prog.urgent .pbar i { background: hsl(350,80%,58%); }
.days { margin-left: .45em; font-size: .8rem; font-weight: 600; }
/* Combo badge on the score tile */
.score { position: relative; }
.combo { position: absolute; top: -9px; right: -9px; padding: .22em .5em; border-radius: 999px; font-style: normal; font-size: .72rem; font-weight: 700; line-height: 1;
  color: #fff; background: linear-gradient(135deg, hsl(315,85%,68%), hsl(275,80%,68%)); box-shadow: 0 2px 8px var(--shadow); }
.combo[hidden] { display: none; }
.combo.tick { animation: tick .5s cubic-bezier(.34,1.56,.64,1); }
/* Play menu on the "new game" tile */
.playwrap { position: relative; justify-self: end; }
.playmenu { position: absolute; top: calc(100% + 8px); right: 0; z-index: 40; display: flex; flex-direction: column; gap: 2px; width: max-content; min-width: 210px; padding: 6px;
  border-radius: 20px; background: var(--bg-a); border: 1px solid var(--dock-line); box-shadow: 0 12px 30px var(--shadow); animation: cardin .22s cubic-bezier(.34,1.56,.64,1);
  -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4); }
.playmenu[hidden] { display: none; }
.playmenu button { appearance: none; border: 0; background: transparent; color: var(--ink); font: inherit; font-weight: 600; text-align: left; cursor: pointer;
  display: flex; flex-direction: column; gap: 1px; padding: .55em .9em; border-radius: 14px; }
.playmenu button small { font-weight: 400; font-size: .76rem; opacity: .7; }
.playmenu button:hover:not(:disabled), .playmenu button:focus-visible { background: var(--dock-line); outline: none; }
.playmenu button:disabled { opacity: .45; cursor: default; }
/* the game being played has a pink dot after its name (from Be/Do Modal) */
.playmenu button.cur > span::after { content: " ●"; font-size: .6em; vertical-align: .25em; color: var(--underline); }
/* Quick question (replaces the stage for one step) */
#stage[hidden], .tools[hidden], .quiz[hidden] { display: none; }
.quiz { max-width: 640px; margin: 18px auto 0; padding: 18px; border-radius: 26px; text-align: center;
  background: var(--dock-bg); border: 1px solid var(--dock-line); box-shadow: 0 8px 22px var(--shadow);   /* the header's glass */
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); }
.quiz.in { animation: cardin .3s cubic-bezier(.34,1.56,.64,1); }
.qz-s { margin: 0 0 14px; font-size: clamp(1.15rem, 1vw + .9rem, 1.4rem); font-weight: 500; line-height: 1.35; text-wrap: balance; }
.qz-opts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.qz-opts .pbtn.ok { border-color: hsl(150,60%,48%); background: hsla(150,70%,60%,.18); }
.qz-opts .pbtn.bad { border-color: hsl(350,75%,60%); background: hsla(350,85%,70%,.15); }
.qz-opts .pbtn:disabled { cursor: default; }
.qz-opts .pbtn.ok:disabled, .qz-opts .pbtn.bad:disabled { opacity: 1; }
.qz-why { margin: 12px 0 0; font-size: .95rem; }
/* Favorites game: after each sentence, its star and Next */
.qz-next { display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin-top: 14px; }
.qz-plus { position: fixed; z-index: 60; transform: translate(-50%, -100%); font-weight: 700; font-size: 1.3rem; color: hsl(150,60%,45%); pointer-events: none; animation: qzplus .9s ease-out forwards; }
@keyframes qzplus { to { transform: translate(-50%, -260%); opacity: 0; } }
/* Mastery meters (Seen modal, end screen) */
.meter { display: grid; grid-template-columns: 2.4em 1fr auto; align-items: center; gap: 10px; font-size: .88rem; }
.meter .pbar { margin-top: 0; }
.meter .pbar i { background: linear-gradient(90deg, var(--lv, hsl(315,85%,68%)), var(--lv2, hsl(275,80%,68%))); }   /* the level's colours */
.meter span { font-variant-numeric: tabular-nums; opacity: .8; }
.listprog { display: flex; flex-direction: column; gap: 6px; margin: 0 0 14px; }
.listprog[hidden] { display: none; }
.lp-h { margin: 0; font-size: .8rem; opacity: .7; text-align: center; }
.listprog .fams { margin: 4px 0 0; }
/* "No weak rules" under the weakest rules' heading */
.lp-ok { font-size: .85rem; opacity: .8; }
/* "Practice these": top-right of the Favorites / Seen card, left of the ✕ (from Conditional Bubbles) */
#listmodal .favhead { gap: 10px; }
#listmodal .favhead h2 { min-width: 0; }
.favtools { flex: none; display: flex; align-items: center; gap: 8px; }
.favtools .cta { font-size: .85rem; padding: .5em 1.1em; white-space: nowrap; }
.favtools .cta[hidden] { display: none; }
.endprog { display: flex; flex-direction: column; gap: 4px; max-width: 320px; margin: 10px auto 0; text-align: center; }
@media (prefers-reduced-motion: reduce) { #clk.beat, .prog.urgent #clk, .combo.tick, .quiz.in, .qz-plus, .playmenu { animation: none; } }
/* Speed challenge intro: the goal, then 3-2-1-Go (22-modes.js) */
.cdown { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(20,20,40,.35); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: cdfade .2s ease; }
.cd-card { box-sizing: border-box; width: min(360px, 100%); padding: 22px 20px 24px; border-radius: 28px; text-align: center; color: var(--ink); background: var(--bg-a); border: 1px solid var(--dock-line); box-shadow: 0 20px 50px rgba(0,0,0,.28); animation: cardin .3s cubic-bezier(.34,1.56,.64,1); }
.cd-t { margin: 0; font-size: .78rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; opacity: .65; }
.cd-x { margin: 8px 0 4px; font-size: 1.25rem; font-weight: 600; line-height: 1.3; text-wrap: balance; }
.cd-n { display: block; height: 1.25em; font-size: 4rem; line-height: 1.25; color: var(--underline); }
.cd-n.pop { animation: cdpop .5s cubic-bezier(.34,1.56,.64,1); }
@keyframes cdfade { from { opacity: 0; } }
@keyframes cdpop { from { transform: scale(.4); } }
@media (prefers-reduced-motion: reduce) { .cdown, .cd-card, .cd-n.pop { animation: none; } }
/* 60-scrollbar.css — scrollbars in the look of the Stressed syllables game (Guide, lists, tour card; the page has none): a thin glossy pill with the
   pink-to-purple gradient on a clear track. Chrome / Edge / Safari use the ::-webkit-scrollbar parts; Firefox only takes
   colours, so it gets a thin pink thumb (in @supports, since Chrome would let these override the pill). */
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: transparent; margin: 18px 0; }
::-webkit-scrollbar-thumb {
  border: 3px solid transparent; border-radius: 999px; background-clip: padding-box;
  background-image: linear-gradient(180deg, hsl(315,85%,66%), hsl(275,80%,64%));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45);
}
::-webkit-scrollbar-thumb:hover { background-image: linear-gradient(180deg, hsl(315,90%,60%), hsl(275,85%,58%)); }
::-webkit-scrollbar-thumb:active { border-width: 2px; }
::-webkit-scrollbar-button, ::-webkit-scrollbar-corner { display: none; background: transparent; }
@supports (-moz-appearance: none) {
  * { scrollbar-width: thin; scrollbar-color: hsl(295,82%,66%) transparent; }
}
/* The page itself still scrolls on short screens, but shows no bar (only the cards and lists do). */
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }
</style>

ans *kw|one or per* in numbers, times and prices: a hundred, a thousand, half an hour, twice a week, $3 a kilo, 80 km an hour.","rulePt":"*a / an* significa *kw|um ou por* em números, frequência e preços: a hundred (cem), a thousand (mil), half an hour (meia hora), twice a week (duas vezes por semana), $3 a kilo (3 dólares o quilo).","ex":["I go swimming three times a week.","The ticket costs a hundred dollars.","The movie starts in half an hour."],"trap":{"pt":"Duas vezes por semana. Meia hora. Cem dólares.","wrong":"two times for week · half hour · hundred dollars","right":"twice a week · half an hour · a hundred dollars"}},"ache":{"art":"a","name":"Aches, colds, fevers","namePt":"Dores, resfriado, febre","hue":225,"rule":"Most *kw|health problems* you have or get take *a / an*: a headache, a stomachache, a cold, a fever, a cough, a sore throat.","rulePt":"A maioria dos *kw|problemas de saúde* que você tem ou pega leva *a / an*: a headache (dor de cabeça), a stomachache (dor de barriga), a cold (resfriado), a fever (febre), a cough (tosse), a sore throat (dor de garganta).","ex":["I have a headache.","She has a bad cold.","He had a fever last night."],"trap":{"pt":"Estou com dor de cabeça. Ele está com febre.","wrong":"I'm with headache. He is with fever.","right":"I have a headache. He has a fever."}},"what":{"art":"a","name":"What a…! / such a…","namePt":"What a…! / such a…","hue":200,"rule":"Exclamations with *kw|what*, and *kw|such / quite* before a singular countable noun, take *a / an*: What a beautiful day! It's such a good idea. (Uncountable: What nice weather!)","rulePt":"Exclamações com *kw|what*, e *kw|such / quite* antes de substantivo contável no singular, levam *a / an*: What a beautiful day! (Que dia lindo!) It's such a good idea. (Incontável: What nice weather! = Que tempo bom!)","ex":["What a great movie!","She's such a nice person.","It was quite a long trip."],"trap":{"pt":"Que dia lindo! Ela é uma pessoa tão legal.","wrong":"What beautiful day! She's so nice person.","right":"What a beautiful day! She's such a nice person."},"bad":{"the":{"en":"In an exclamation with *kw|what*, a singular countable noun takes *a / an*, never *the*: What a day! What an idea!","pt":"Numa exclamação com *kw|what*, substantivo contável no singular leva *a / an*, nunca *the*: What a day! (Que dia!) What an idea! (Que ideia!)"},"0":{"en":"Portuguese says Que dia! with no article, but after *kw|what* English needs *a / an* with a singular countable noun: What a day! Only uncountable or plural nouns go without: What nice weather!","pt":"Em português é Que dia!, sem artigo, mas depois de *kw|what* o inglês precisa de *a / an* com substantivo contável no singular: What a day! Só incontáveis e plurais ficam sem: What nice weather! (Que tempo bom!)"}}},"few":{"art":"a","name":"a few / few, a little / little","namePt":"a few / few, a little / little","hue":185,"rule":"With *a*, it's *kw|positive* (some, enough): I have a few friends here. We have a little time. Without *a*, it's *kw|negative* (not many, not much): Few people came. There's little hope.","rulePt":"Com *a*, é *kw|positivo* (alguns, um pouco): I have a few friends here (tenho alguns amigos aqui). We have a little time (temos um pouco de tempo). Sem *a*, é *kw|negativo* (poucos, quase nada): Few people came (pouca gente veio). Como em português: um pouco de tempo ≠ pouco tempo.","ex":["I know a few good restaurants here.","Few tourists visit this village in winter.","There's a little milk left, but very little bread."],"bad":{"0":{"en":"Without *a*, few / little is *kw|negative* (not many, not much). Here the meaning is *kw|positive*: a few / a little.","pt":"Sem *a*, few / little é *kw|negativo* (poucos, quase nada). Aqui o sentido é *kw|positivo*: a few / a little (alguns, um pouco)."},"a":{"en":"a few / a little is *kw|positive* (some). Here the meaning is *kw|negative* (not many, not much): few / little, with no article.","pt":"a few / a little é *kw|positivo* (alguns, um pouco). Aqui o sentido é *kw|negativo* (poucos, quase nada): few / little, sem artigo."}}},"known":{"art":"the","name":"We know which one","namePt":"Sabemos qual é","hue":28,"clue":true,"rule":"*the* when the listener *kw|knows exactly which one*: it was mentioned before (I saw a dog. The dog was huge.) or it's clear from the situation (Close the door, please).","rulePt":"*the* quando quem ouve *kw|sabe exatamente qual é*: já foi mencionado (I saw a dog. The dog was huge.) ou fica claro pela situação (Close the door, please = Feche a porta, por favor).","ex":["I bought a shirt and a hat. The shirt was cheap.","Where are the keys?","Can you turn off the light?"]},"unique":{"art":"the","name":"There's only one","namePt":"Só existe um","hue":38,"rule":"*the* with things there is *kw|only one* of: the sun, the moon, the sky, the sea, the world, the internet, the environment.","rulePt":"*the* com coisas que *kw|só existe uma*: the sun (o sol), the moon (a lua), the sky (o céu), the world (o mundo), the internet, the environment (o meio ambiente).","ex":["The sun is very hot today.","I read the news on the internet.","Look at the moon!"]},"super":{"art":"the","name":"best, first, only, same","namePt":"melhor, primeiro, único, mesmo","hue":18,"rule":"*the* before *kw|superlatives*, *kw|ordinal numbers* and *kw|only / same / last / next* (one): the best, the first time, the only one, the same school, the last day.","rulePt":"*the* antes de *kw|superlativos*, *kw|números ordinais* e *kw|only / same / last / next*: the best (o melhor), the first time (a primeira vez), the only one (o único), the same school (a mesma escola), the last day (o último dia).","ex":["It's the best pizza in town.","This is the first time I'm here.","We go to the same school."]},"of":{"art":"the","name":"Made specific","namePt":"Especificado","hue":45,"rule":"*the* when *kw|the words after the noun* say which one: the end of the movie, the people in my class, the book you lent me. Compare: Coffee is expensive (in general) / The coffee in this café is expensive (this coffee).","rulePt":"*the* quando *kw|as palavras depois do substantivo* dizem qual é: the end of the movie (o fim do filme), the people in my class, the book you lent me. Compare: Coffee is expensive (café em geral) / The coffee in this café is expensive (este café).","ex":["The center of the city is beautiful.","The food at this hotel is great.","I loved the music in that movie."]},"place":{"art":"the","name":"Places with the","namePt":"Lugares com the","hue":32,"rule":"*the* with *kw|plural or \"united\" country names* (the USA, the UK, the Netherlands, the Philippines), *kw|oceans, seas and rivers* (the Atlantic, the Amazon), *kw|mountain ranges* (the Andes) and *kw|deserts* (the Sahara).","rulePt":"*the* com nomes de *kw|países no plural ou com United* (the USA, the UK, the Netherlands, the Philippines), *kw|oceanos, mares e rios* (the Atlantic, the Amazon), *kw|cordilheiras* (the Andes) e *kw|desertos* (the Sahara). Mas Brazil, Peru, Mount Everest: sem *the*.","ex":["She lives in the USA.","The Nile is very long.","We crossed the Andes by bus."],"bad":{"0":{"en":"*kw|Some place names* take *the*: countries with United or a plural name (the United States, the Netherlands), oceans, rivers, mountain ranges (the Andes) and deserts. Brazil and Mount Fuji don't.","pt":"*kw|Alguns nomes de lugares* levam *the*: países com United ou nome no plural (the United States, the Netherlands), oceanos, rios, cordilheiras (the Andes) e desertos. Brazil e Mount Fuji não levam."},"a":{"en":"*a / an* = one of many, but *kw|this is a name*. Countries with United or a plural name, oceans, rivers, mountain ranges and deserts take *the*: the United States, the Andes.","pt":"*a / an* = um entre vários, mas *kw|isto é um nome*. Países com United ou nome no plural, oceanos, rios, cordilheiras e desertos levam *the*: the United States, the Andes."}}},"fixed":{"art":"the","name":"Set phrases with the","namePt":"Expressões com the","hue":42,"rule":"Some *kw|set phrases* take *the*: in the morning / afternoon / evening, listen to the radio, go to the movies, go to the beach, go to the doctor, on the weekend, all the time.","rulePt":"Algumas *kw|expressões fixas* levam *the*: in the morning (de manhã), in the afternoon (à tarde), listen to the radio, go to the movies (ir ao cinema), go to the beach, on the weekend (no fim de semana), all the time (o tempo todo).","ex":["I study in the morning.","Let's go to the movies tonight.","She listens to the radio in the car."],"trap":{"pt":"Eu estudo de manhã e à tarde.","wrong":"I study in morning and in afternoon.","right":"I study in the morning and in the afternoon."},"bad":{"0":{"en":"It's a *kw|set phrase*, and it takes *the*: in the morning, go to the movies, listen to the radio.","pt":"É uma *kw|expressão fixa*, e ela leva *the*: in the morning, go to the movies, listen to the radio."},"a":{"en":"It's a *kw|set phrase*, and it takes *the*, not *a / an*: in the morning, go to the movies, listen to the radio.","pt":"É uma *kw|expressão fixa*, e ela leva *the*, não *a / an*: in the morning, go to the movies, listen to the radio."}}},"group":{"art":"the","name":"the rich, the elderly…","namePt":"the rich, the elderly…","hue":22,"rule":"*the* + adjective means *kw|all the people of that kind*: the rich, the poor, the young, the elderly, the homeless, and nationalities: the French, the Japanese. The adjective takes no -s, and the verb is plural: The rich are…","rulePt":"*the* + adjetivo quer dizer *kw|todas as pessoas daquele tipo*: the rich (os ricos), the poor (os pobres), the young (os jovens), the elderly (os idosos), the homeless (os sem-teto), e nacionalidades: the French (os franceses), the Japanese (os japoneses). O adjetivo não leva -s, e o verbo fica no plural: The rich are…","ex":["The rich should pay more taxes.","This charity helps the homeless.","The young often have new ideas."],"trap":{"pt":"Os ricos ficam mais ricos.","wrong
