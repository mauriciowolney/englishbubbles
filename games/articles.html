any park. [the:compar] more concrete we pour, [the:compar] hotter our cities get. We need more green spaces, and we need them now."],"pt":["No tempo dos meus avós, a natureza fazia parte do dia a dia: eles cresceram numa cidade pequena onde toda casa tinha um quintal. Hoje, a maioria das crianças das cidades grandes quase não vê uma árvore no caminho da escola, e os pobres, principalmente, moram longe de qualquer parque. Quanto mais concreto a gente joga, mais quentes as nossas cidades ficam. Precisamos de mais áreas verdes, e precisamos agora."],"w":{"daily life":"dia a dia","grew up":"cresceram","rarely":"quase nunca","especially":"principalmente","concrete":"concreto","pour":"despejamos"}},{"id":"b2-27","frame":"Email","framePt":"E-mail","title":"First week at college","titlePt":"Primeira semana na faculdade","body":["Hi Aunt Rosa! I started [0:inst] college last Monday, and I already love it. My favorite class is on [the:of] history of Latin America, and it meets twice [a:per] week. I live half [an:quite] hour from campus. It's quite [a:quite] long ride, but I use it to read. On Sunday I went to [the/a:purpose/any] church {on campus}, not to pray, but to see its famous windows."],"pt":["Oi, tia Rosa! Comecei a faculdade na segunda passada e já estou adorando. A minha matéria favorita é sobre a história da América Latina, e tem aula duas vezes por semana. Eu moro a meia hora do campus. É uma viagem bem longa, mas eu aproveito para ler. No domingo fui à igreja do campus, não para rezar, mas para ver os vitrais famosos."],"w":{"college":"faculdade","meets":"tem aula","ride":"viagem","pray":"rezar","windows":"vitrais"},"notes":[null,null,null,null,null,{"en":"went to the church = visited the building. Went to church would mean going to a service. A church also works if the campus has several.","pt":"went to the church = visitou o prédio. Went to church seria ir à missa / ao culto. A church também serve, se o campus tiver várias."}]},{"id":"b2-28","frame":"Blog","framePt":"Blog","title":"A year in Kyoto","titlePt":"Um ano em Kyoto","body":["Teaching English in Kyoto was [an:kind] experience I'll never forget. When I arrived, I had [0:few] little teaching experience, but my students were patient with me. [the:group] Japanese are famous for being polite, and it's true. I also learned that [0:abstract] silence isn't always awkward. Sometimes it's [a:kind] form of respect."],"pt":["Dar aula de inglês em Kyoto foi uma experiência que eu nunca vou esquecer. Quando cheguei, eu tinha pouca experiência como professor, mas os meus alunos foram pacientes comigo. Os japoneses são famosos por serem educados, e é verdade. Também aprendi que o silêncio nem sempre é constrangedor. Às vezes, é uma forma de respeito."],"w":{"patient":"pacientes","polite":"educados","awkward":"constrangedor","respect":"respeito"},"notes":[{"en":"an experience = something that happened to you. Experience with no article = knowledge or skill (gap 2).","pt":"an experience = algo que aconteceu com você. Experience sem artigo = conhecimento, prática (lacuna 2)."},{"en":"little experience = almost none (that's why the students had to be patient). A little would mean some.","pt":"little experience = quase nenhuma (por isso os alunos precisavam ter paciência). A little seria um pouco."},null,null,null]},{"id":"b2-29","frame":"News","framePt":"Notícia","title":"A night in a cell","titlePt":"Uma noite numa cela","body":["[0:headline] Old Prison Becomes [0:headline] Luxury Hotel","[the:of] prison {in the center of town}, closed since [the:decade] 1990s, reopened last week as [a:any] hotel with forty rooms. The first guest was [a:someone] Mr. Ferraz, a retired teacher nobody at the hotel had ever met, whose grandfather had worked there as [a:job] guard. He says he slept surprisingly well."],"tags":["headline",null],"pt":["Antiga prisão vira hotel de luxo","A prisão do centro da cidade, fechada desde os anos 1990, reabriu na semana passada como um hotel de quarenta quartos. O primeiro hóspede foi um tal de Sr. Ferraz, um professor aposentado que ninguém no hotel conhecia, cujo avô tinha trabalhado lá como guarda. Ele diz que dormiu surpreendentemente bem."],"w":{"becomes":"vira","luxury":"de luxo","reopened":"reabriu","guest":"hóspede","retired":"aposentado","guard":"guarda"}},{"id":"b2-30","frame":"Diary","framePt":"Diário","title":"The new puppy","titlePt":"O cachorrinho novo","body":["[the:family] Almeidas next door got [a:first] puppy last month, and our street hasn't been quiet since. Mrs. Almeida, who is [an:job] architect, works from home and says she has never been so tired. Still, it's such [a:quite] sweet animal that nobody complains. My little brother says [0:general] dogs are better than [0:general] people."],"pt":["Os Almeida aqui do lado ganharam um cachorrinho no mês passado, e a nossa rua nunca mais ficou quieta. A Sra. Almeida, que é arquiteta, trabalha em casa e diz que nunca esteve tão cansada. Mesmo assim, é um bicho tão fofo que ninguém reclama. O meu irmãozinho diz que cachorros são melhores que pessoas."],"w":{"next door":"aqui do lado","puppy":"cachorrinho","quiet":"quieta","architect":"arquiteta","complains":"reclama"}},{"id":"b2-31","frame":"News","framePt":"Notícia","title":"Thirty years of bread","titlePt":"Trinta anos de pão","body":["[0:headline] Bakery Feeds [0:headline] Homeless for 30 Years","Every night since [the:decade] 1990s, [a:first] small bakery in Porto Alegre has given [the/0:of/uncount] bread {it didn't sell} to [the:group] homeless. Its owner, Antônio Reis, says it began almost by accident. “It's become quite [a:quite] tradition,” he says. “Some customers now buy an extra loaf just to leave with us.”"],"pt":["Padaria alimenta moradores de rua há 30 anos","Todas as noites desde os anos 1990, uma padaria pequena de Porto Alegre doa o pão que não vendeu para os moradores de rua. O dono, Antônio Reis, diz que tudo começou quase por acaso. “Virou uma tradição e tanto”, diz ele. “Alguns clientes agora compram um pão a mais só para deixar com a gente.”"],"w":{"feeds":"alimenta","homeless":"moradores de rua","by accident":"por acaso","loaf":"pão (inteiro)"},"notes":[null,null,null,null,{"en":"Both work. The bread it didn't sell = all of that day's leftover bread; bread it didn't sell = unsold bread in general, not all of it.","pt":"Os dois servem. The bread it didn't sell = todo o pão que sobrou naquele dia; bread it didn't sell = pão que não foi vendido, sem dizer que é todo."}],"tags":["headline",null]},{"id":"b2-32","frame":"Email","framePt":"E-mail","title":"A call for you","titlePt":"Ligaram para você","body":["Hi Paula, while you were out, [a:someone] Mr. Takeda called for you. He says he's [an:job] old friend of your father's from [0:name] Osaka. He's staying with [the:family] Nakamuras in Liberdade until [0:routine] Friday and would love to have [0:routine] dinner with you before he flies home. His number is on your desk. Cheers, Rui"],"pt":["Oi, Paula, enquanto você estava fora, um tal de sr. Takeda ligou para você. Ele diz que é um velho amigo do seu pai, de Osaka. Ele está hospedado com os Nakamura na Liberdade até sexta e adoraria jantar com você antes de voltar para casa. O número dele está na sua mesa. Abraço, Rui"],"w":{"while you were out":"enquanto você estava fora","staying with":"hospedado com","flies home":"voltar para casa (de avião)","desk":"mesa"}},{"id":"b2-33","frame":"Blog","framePt":"Blog","title":"Coffee, Italian style","titlePt":"Café ao estilo italiano","body":["When I moved to [0:name] Milan, I learned that [0:general] coffee is serious business here. If you ask for [a:kind] coffee at a bar, you get [an:any] espresso, nothing else. [0:most] most Italians drink it standing up, in under a minute. And they never drink [0/a:general/any] cappuccino after [0:routine] lunch: milk is for mornings."],"pt":["Quando me mudei para Milão, aprendi que café aqui é coisa séria. Se você pede um café num bar, ganha um espresso, e nada mais. A maioria dos italianos toma em pé, em menos de um minuto. E eles nunca tomam cappuccino depois do almoço: leite é coisa da manhã."],"w":{"serious business":"coisa séria","standing up":"em pé","in under a minute":"em menos de um minuto"},"notes":[null,null,null,null,null,{"en":"Both work. drink cappuccino = cappuccino in general; drink a cappuccino = one cup of it.","pt":"Os dois servem. drink cappuccino = cappuccino em geral; drink a cappuccino = uma xícara."}]},{"id":"b2-34","frame":"Opinion","framePt":"Opinião","title":"In praise of boredom","titlePt":"Elogio ao tédio","body":["[0:abstract] boredom has [a:any] bad reputation, but I think we need more of it. [0:general] children today are almost never bored: there's always a screen to look at. Yet [0:abstract] creativity often starts when there's nothing to do. Last month I tried walking to work without [a:need] phone in my pocket. [the:of] ideas {I had on those walks} were [the:super] best I'd had in years."],"pt":["O tédio tem má fama, mas acho que precisamos de mais dele. As crianças de hoje quase nunca ficam entediadas: sempre tem uma tela para olhar. Mas a criatividade muitas vezes nasce quando não há nada para fazer. No mês passado tentei ir a pé para o trabalho sem celular no bolso. As ideias que tive nessas caminhadas foram as melhores que tive em anos."],"w":{"boredom":"tédio","reputation":"fama","bored":"entediadas","screen":"tela","creativity":"criatividade","walks":"caminhadas"}},{"id":"b2-35","frame":"Travel blog","framePt":"Blog de viagem","title":"Hiking in Patagonia","titlePt":"Trilhas na Patagônia","body":["We spent two weeks hiking in [0:name] Patagonia, at the southern end of [the:place] Andes. On our last day we hiked to the base of [0:name] Mount Fitz Roy. It's quite [a:quite] climb, ten hours there and back, but what [a:what] view from the top! That night we slept in [a:first] mountain {^hut} with twenty other hikers. [the:known] hut had no electricity, but nobody cared."],"pt":["Passamos duas semanas fazendo trilhas na Patagônia, no extremo sul dos Andes. No último dia, subimos até a base do monte Fitz Roy. É uma subida e tanto, dez horas ida e volta, mas que vista lá de cima! Naquela noite dormimos num abrigo de montanha com outros vinte trilheiros. O abrigo não tinha luz, mas ninguém ligou."],"w":{"hiking":"fazendo trilhas","southern end":"extremo sul","there and back":"ida e volta","mountain hut":"abrigo de montanha","hikers":"trilheiros","nobody cared":"ninguém ligou"}},{"id":"b2-36","frame":"School news","framePt":"Notícias da escola","title":"Open day","titlePt":"Portas abertas","body":["This Saturday, neighbors and families are invited to come to [the:purpose] school {to visit} our new science lab. [0:most] most of the money came from our bake sales, and [a:first] local engineering company paid for the rest. Students will show visitors [a:few] few simple experiments. We'll also need [0:uncount] help with the cleanup, so if you can spare half [an:quite] hour, please let us know!"],"pt":["Neste sábado, vizinhos e famílias estão convidados a vir à escola para conhecer o nosso laboratório de ciências novo. A maior parte do dinheiro veio das nossas vendas de bolo, e uma empresa de engenharia da região pagou o resto. Os alunos vão mostrar alguns experimentos simples aos visitantes. Também vamos precisar de ajuda com a limpeza, então se você puder dar meia hora, avise a gente!"],"w":{"invited":"convidados","lab":"laboratório","bake sales":"vendas de bolo","spare":"dar, ceder","cleanup":"limpeza"}},{"id":"b2-37","frame":"Podcast","framePt":"Podcast","title":"Vinyl is back","titlePt":"O vinil voltou","body":["When I was a teenager in [the:decade] 2000s, nobody bought [0:general] records anymore. Now [0:general] vinyl is back, and sales have grown every year since 2007. My dad still has [the:of] records {he bought as a student}, and my son plays them more than I do. [0:abstract] nostalgia is quite [a:quite] powerful thing. Or maybe the music really does sound better."],"pt":["Quando eu era adolescente, nos anos 2000, ninguém mais comprava discos. Agora o vinil voltou, e as vendas crescem todo ano desde 2007. O meu pai ainda tem os discos que comprou quando era estudante, e o meu filho toca mais do que eu. A nostalgia é uma coisa bem poderosa. Ou talvez a música soe melhor mesmo."],"w":{"records":"discos","vinyl":"vinil","sales":"vendas","nostalgia":"nostalgia","powerful":"poderosa"}},{"id":"b2-38","frame":"Advice column","framePt":"Coluna de conselhos","title":"Failed twice","titlePt":"Reprovada duas vezes","body":["Dear Bia, you're not alone: [0:most] most people fail their driving test at least once. You don't lack talent; you lack [0:uncount] experience. Book [a:few] few extra lessons, practice on quiet streets, and get [a:any] good night's sleep before [the:super] next test. You'll pass. And when you do, what [a:what] feeling it will be!"],"pt":["Querida Bia, você não está sozinha: a maioria das pessoas reprova no exame de direção pelo menos uma vez. Não te falta talento; te falta experiência. Marque algumas aulas extras, pratique em ruas tranquilas e tenha uma boa noite de sono antes da próxima prova. Você vai passar. E quando passar, que sensação vai ser!"],"w":{"driving test":"exame de direção","lack":"te falta","book":"marque","good night's sleep":"boa noite de sono","feeling":"sensação"},"notes":[null,{"en":"Experience = what you learn by doing: uncountable. An experience is one event (uma experiência).","pt":"Experience = o que se aprende fazendo: incontável. An experience é um acontecimento (uma experiência)."}]},{"id":"b2-39","frame":"Diary","framePt":"Diário","title":"Something in my soup","titlePt":"Tem algo na minha sopa","body":["Tonight we finally tried [the:of] new Peruvian restaurant {across the street}. Halfway through [0:routine] dinner, I found [a:kind] long black hair in my soup. The waiter was so embarrassed! [the:of] manager {herself} came over with [a:first] new bowl and two free desserts. I couldn't complain much, though: I have long black [0:uncount] hair, too."],"pt":["Hoje finalmente experimentamos o restaurante peruano novo do outro lado da rua. No meio do jantar, achei um fio de cabelo preto e comprido na minha sopa. O garçom ficou tão sem graça! A própria gerente veio com uma tigela nova e duas sobremesas de graça. Mas eu não podia reclamar muito: eu também tenho cabelo preto e comprido."],"w":{"halfway through":"no meio de","waiter":"garçom","embarrassed":"sem graça","came over":"veio até a mesa","bowl":"tigela","complain":"reclamar"},"notes":[null,null,{"en":"a hair = one single hair (um fio de cabelo).","pt":"a hair = um fio de cabelo só."},null,null,{"en":"hair = all the hair on your head: uncountable, no article.","pt":"hair = o cabelo todo: incontável, sem artigo."}]},{"id":"b2-40","frame":"Article","framePt":"Artigo","title":"The city of bikes","titlePt":"A cidade das bicicletas","body":["In [0:name] Copenhagen, more people cycle to [0:inst] work than drive. The city has built over 380 kilometers of bike lanes, and [0:general] cyclists even get their own traffic lights. You'll see [the:group] elderly, parents with kids in cargo bikes, and politicians in suits, all riding side by side. Here, life without [a:need] car is completely normal, even in [the:super] coldest months of the year."],"pt":["Em Copenhague, mais gente vai de bicicleta para o trabalho do que de carro. A cidade construiu mais de 380 quilômetros de ciclovias, e os ciclistas têm até semáforos próprios. Você vê idosos, pais com os filhos em bicicletas de carga e políticos de terno, todos pedalando lado a lado. Aqui, a vida sem carro é completamente normal, mesmo nos meses mais frios do ano."],"w":{"cycle":"ir de bicicleta","bike lanes":"ciclovias","traffic lights":"semáforos","cargo bikes":"bicicletas de carga","side by side":"lado a lado"}}]},"bonus":{"A1":[{"id":"a1-b01","pt":"A Maria é enfermeira.","en":"[Maria] is [a] [nurse].","dx":["The","an","one"]},{"id":"a1-b02","pt":"O meu pai é engenheiro.","en":"[My] [dad] is [an] [engineer].","dx":["The","a","his"]},{"id":"a1-b03","pt":"Eu tenho um gato. O gato é preto.","en":"I [have] [a] cat. [The] cat [is] black.","dx":["an","am","has"]},{"id":"a1-b04","pt":"Ela mora no Brasil.","en":"[She] [lives] in [Brazil].","dx":["the","live","Brasil"]},{"id":"a1-b05","pt":"Eu não tenho carro.","en":"I [don't] [have] [a] [car].","dx":["the","an","no"]},{"id":"a1-b06","pt":"Eu como uma maçã por dia.","en":"I [eat] [an] [apple] [a] day.","dx":["the","apples","for"]},{"id":"a1-b07","pt":"O sol está quente hoje.","en":"[The] [sun] [is] hot today.","dx":["A","An","are"]},{"id":"a1-b08","pt":"O meu irmão é ator.","en":"[My] [brother] [is] [an] [actor].","dx":["The","a","are"]},{"id":"a1-b09","pt":"Eu tenho uma ideia!","en":"I [have] [an] [idea]!","dx":["a","the","has"]},{"id":"a1-b10","pt":"A Ana é a minha melhor amiga.","en":"[Ana] [is] [my] [best] friend.","dx":["The","a","better"]},{"id":"a1-b11","pt":"Ela é professora de inglês.","en":"She is [an] [English] [teacher].","dx":["a","the","teachers"]},{"id":"a1-b12","pt":"O cachorro dorme no sofá.","en":"[The] [dog] [sleeps] on the sofa.","dx":["A","An","sleep"]},{"id":"a1-b13","pt":"O meu tio é mecânico.","en":"[My] [uncle] is [a] [mechanic].","dx":["The","an","his"]},{"id":"a1-b14","pt":"Ela tem um guarda-chuva azul.","en":"She [has] [a] [blue] [umbrella].","dx":["an","have","the"]},{"id":"a1-b15","pt":"Ele mora em Lima, no Peru.","en":"He [lives] in [Lima], [in] [Peru].","dx":["the","live","on"]},{"id":"a1-b16","pt":"O meu avô tem um cavalo velho.","en":"[My] grandpa [has] [an] [old] horse.","dx":["The","a","have"]},{"id":"a1-b17","pt":"Eu vi um cachorro. O cachorro era enorme.","en":"I saw [a] dog. [The] [dog] was [huge].","dx":["an","dogs","were"]},{"id":"a1-b18","pt":"Ela é dentista.","en":"[She] [is] [a] [dentist].","dx":["The","an","Her"]},{"id":"a1-b19","pt":"Eu janto às sete.","en":"I [have] [dinner] [at] seven.","dx":["the","a","in"]},{"id":"a1-b20","pt":"Eu moro perto do mar.","en":"I [live] [near] [the] [sea].","dx":["an","lives","at"]},{"id":"a1-b21","pt":"Ele é um aluno novo da Itália.","en":"He [is] [a] [new] [student] from [Italy].","dx":["an","the","Italia"]},{"id":"a1-b22","pt":"Eu como um ovo no café da manhã.","en":"I [eat] [an] [egg] [for] [breakfast].","dx":["a","the","in"]},{"id":"a1-b23","pt":"Eu esperei uma hora.","en":"I [waited] [for] [an] [hour].","dx":["a","the","in"]},{"id":"a1-b24","pt":"Os gatos gostam de peixe.","en":"[Cats] [like] [fish].","dx":["The","a","likes"]}],"A2":[{"id":"a2-b01","pt":"A vida é curta.","en":"[Life] [is] [short].","dx":["The","a","are"]},{"id":"a2-b02","pt":"Eu vou para a escola de ônibus.","en":"I [go] [to] [school] [by] [bus].","dx":["the","in","a"]},{"id":"a2-b03","pt":"Que dia lindo!","en":"[What] [a] [beautiful] [day]!","dx":["How","the","an"]},{"id":"a2-b04","pt":"O café é muito popular no Brasil.","en":"[Coffee] [is] very popular [in] [Brazil].","dx":["The","on","a"]},{"id":"a2-b05","pt":"Eu jogo futebol duas vezes por semana.","en":"I [play] [soccer] [twice] [a] [week].","dx":["the","for","two"]},{"id":"a2-b06","pt":"Estou com dor de cabeça.","en":"I [have] [a] [headache].","dx":["am","with","the"]},{"id":"a2-b07","pt":"A maioria das pessoas gosta de música.","en":"[Most] [people] [like] [music].","dx":["The","of","likes"]},{"id":"a2-b08","pt":"No sábado eu almocei com a minha avó.","en":"On [Saturday] I [had] [lunch] with [my] grandma.","dx":["the","a","lunches"]},{"id":"a2-b09","pt":"O inglês é mais fácil do que o chinês.","en":"[English] [is] [easier] [than] Chinese.","dx":["The","more","then"]},{"id":"a2-b10","pt":"Ela vai para a cama às dez.","en":"She [goes] [to] [bed] [at] ten.","dx":["the","a","in"]},{"id":"a2-b11","pt":"O ônibus chega em meia hora.","en":"The bus arrives in [half] [an] [hour].","dx":["a","the","middle"]},{"id":"a2-b12","pt":"É o melhor restaurante da cidade.","en":"[It's] [the] [best] [restaurant] in the city.","dx":["a","better","Its"]},{"id":"a2-b13","pt":"Ela fala espanhol e francês.","en":"She [speaks] [Spanish] [and] [French].","dx":["the","a","speak"]},{"id":"a2-b14","pt":"Eu vou ao cinema às sextas.","en":"I [go] [to] [the] [movies] [on] Fridays.","dx":["a","at","in"]},{"id":"a2-b15","pt":"Estou com dor de garganta.","en":"I [have] [a] [sore] [throat].","dx":["am","with","the"]},{"id":"a2-b16","pt":"Que ideia ótima!","en":"[What] [a] [great] [idea]!","dx":["How","an","the"]},{"id":"a2-b17","pt":"Ele vai para o trabalho de trem.","en":"He [goes] [to] [work] [by] [train].","dx":["the","a","in"]},{"id":"a2-b18","pt":"A maioria dos adolescentes ama celular.","en":"[Most] [teenagers] [love] [phones].","dx":["The","of","loves"]},{"id":"a2-b19","pt":"Ela joga tênis no sábado.","en":"She [plays] [tennis] [on] [Saturday].","dx":["the","in","a"]},{"id":"a2-b20","pt":"É a primeira vez que eu venho aqui.","en":"It's [the] [first] [time] I've been here.","dx":["a","one","once"]},{"id":"a2-b21","pt":"Eu ganho vinte dólares por hora.","en":"I [earn] twenty dollars [an] [hour].","dx":["by","a","the"]},{"id":"a2-b22","pt":"Os legumes fazem bem para a saúde.","en":"[Vegetables] [are] [good] [for] you.","dx":["The","is","well"]},{"id":"a2-b23","pt":"Eu fiquei em casa no domingo.","en":"I [stayed] [at] [home] [on] Sunday.","dx":["the","in","a"]},{"id":"a2-b24","pt":"O final do filme foi triste.","en":"[The] [end] of the movie [was] [sad].","dx":["A","An","were"]}],"B1":[],"B2":[]},"judge":{"A1":[],"A2":[],"B1":[{"id":"b1-j01","en":"[The life>Life] is too short to drink [_] bad coffee.","pt":"A vida é curta demais para tomar café ruim.","rule":"general","why":"Life in general takes no article in English (Portuguese: a vida).","whyPt":"A vida em geral não leva artigo em inglês (em português: a vida)."},{"id":"b1-j02","en":"She works as [an] engineer for a big company.","pt":"Ela trabalha como engenheira numa empresa grande.","rule":"job","why":"Jobs take *a / an*, and engineer starts with a vowel sound: an engineer.","whyPt":"Profissões levam *a / an*, e engineer começa com som de vogal: an engineer."},{"id":"b1-j03","en":"Can you give me [an advice>some advice]? I don't know what to do.","pt":"Você pode me dar um conselho? Não sei o que fazer.","rule":"uncount","why":"advice is uncountable: some advice or a piece of advice, never an advice.","whyPt":"advice é incontável: some advice ou a piece of advice, nunca an advice."},{"id":"b1-j04","en":"We spent our vacation in [the Brazil>Brazil] and then flew to the USA.","pt":"Passamos as férias no Brasil e depois voamos para os Estados Unidos.","rule":"name","why":"Most countries take no article (Brazil), but plural or \"united\" names do (the USA).","whyPt":"A maioria dos países não leva artigo (Brazil), mas nomes no plural ou com United levam (the USA)."},{"id":"b1-j05","en":"[_] [Most] people in my city go to [_] work by [_] car.","pt":"A maioria das pessoas na minha cidade vai para o trabalho de carro.","rule":"most","why":"most + noun has no *the*. Go to work and by car are set phrases with no article too.","whyPt":"most + substantivo não tem *the*. Go to work e by car também são expressões sem artigo."},{"id":"b1-j06","en":"What [a nice weather>nice weather] we're having today!","pt":"Que tempo bom está fazendo hoje!","rule":"uncount","why":"weather is uncountable: What nice weather! (but What a nice day!).","whyPt":"weather é incontável: What nice weather! (mas What a nice day!)."},{"id":"b1-j07","en":"I've been waiting for [an] hour. Where are you?","pt":"Estou esperando há uma hora. Onde você está?","rule":"per","why":"The h in hour is silent, so it starts with a vowel sound: an hour.","whyPt":"O h de hour é mudo, então a palavra começa com som de vogal: an hour."},{"id":"b1-j08","en":"My brother is [>a] doctor at the hospital in our town.","pt":"O meu irmão é médico no hospital da nossa cidade.","rule":"job","why":"Jobs need *a / an* in English: he is a doctor (Portuguese: ele é médico).","whyPt":"Profissões precisam de *a / an* em inglês: he is a doctor (em português: ele é médico)."},{"id":"b1-j09","en":"[The elderly] often feel lonely, so we visit them every Saturday.","pt":"Os idosos muitas vezes se sentem sozinhos, então visitamos eles todo sábado.","rule":"group","why":"*the* + adjective = a group of people: the elderly. And every Saturday has no article.","whyPt":"*the* + adjetivo = um grupo de pessoas: the elderly (os idosos). E every Saturday não tem artigo."},{"id":"b1-j10","en":"I washed [the>my] hands and sat down to eat.","pt":"Lavei as mãos e sentei para comer.","rule":"poss","why":"For your own body, English uses my / your…: I washed my hands (Portuguese: as mãos).","whyPt":"Para o próprio corpo, o inglês usa my / your…: I washed my hands (em português: as mãos)."},{"id":"b1-j11","en":"[A few] friends came to my party, so it was really fun.","pt":"Alguns amigos vieram à minha festa, então foi muito divertido.","rule":"few","why":"a few = some (positive), which fits \"it was really fun\".","whyPt":"a few = alguns (positivo), o que combina com \"foi muito divertido\"."},{"id":"b1-j12","en":"[A few>Few] people came to the meeting, so it was canceled.","pt":"Pouca gente veio à reunião, então ela foi cancelada.","rule":"few","why":"The meeting was canceled, so the meaning is negative (not many): few, with no *a*.","whyPt":"A reunião foi cancelada, então o sentido é negativo (poucos): few, sem *a*."},{"id":"b1-j13","en":"We climbed [the Mount Kilimanjaro>Mount Kilimanjaro] [_] last year.","pt":"Nós subimos o Monte Kilimanjaro no ano passado.","rule":"name","why":"Single mountains take no article: Mount Kilimanjaro, Mount Fuji (but the Andes, the Alps).","whyPt":"Montanhas não levam artigo: Mount Kilimanjaro, Mount Fuji (mas the Andes, the Alps)."},{"id":"b1-j14","en":"[The] Amazon is the largest rainforest in the world.","pt":"A Amazônia é a maior floresta tropical do mundo.","rule":"place","why":"Rivers and rainforests take *the*: the Amazon. Superlatives and the world take *the* too.","whyPt":"Rios e florestas levam *the*: the Amazon. Superlativos e the world também levam *the*."},{"id":"b1-j15","en":"[The last year>Last year] I visited my cousins in [_] Chile.","pt":"No ano passado eu visitei os meus primos no Chile.","rule":"routine","why":"last / next + time: no article and no preposition: last year. (In the last year = during the past 12 months.)","whyPt":"last / next + tempo: sem artigo e sem preposição: last year. (In the last year = nos últimos 12 meses.)"},{"id":"b1-j16","en":"She's [such a] good teacher that everyone wants to be in her class.","pt":"Ela é uma professora tão boa que todo mundo quer estar na turma dela.","rule":"what","why":"such + *a* + adjective + singular noun: such a good teacher.","whyPt":"such + *a* + adjetivo + substantivo no singular: such a good teacher (uma professora tão boa)."},{"id":"b1-j17","en":"I don't have [>a] car, so I go everywhere by [_] bike.","pt":"Eu não tenho carro, então vou para todo lugar de bicicleta.","rule":"need","why":"A singular countable noun needs *a / an*, even after not: I don't have a car. (By bike: no article.)","whyPt":"Um substantivo contável no singular precisa de *a / an*, mesmo depois de not: I don't have a car. (By bike: sem artigo.)"},{"id":"b1-j18","en":"[The information] on this website is very useful.","pt":"As informações deste site são muito úteis.","rule":"of","why":"information is uncountable (never an information), but here it's specific (on this website), so *the* is right.","whyPt":"information é incontável (nunca an information), mas aqui é específica (deste site), então o *the* está certo."},{"id":"b1-j19","en":"[The music>Music] makes [_] people happy.","pt":"A música deixa as pessoas felizes.","rule":"general","why":"Music in general: no article (Portuguese: a música).","whyPt":"Música em geral: sem artigo (em português: a música)."},{"id":"b1-j20","en":"My grandparents live in a small village in [the Andes].","pt":"Os meus avós moram num vilarejo pequeno nos Andes.","rule":"place","why":"Mountain ranges take *the*: the Andes, the Alps. A small village = one of many.","whyPt":"Cordilheiras levam *the*: the Andes, the Alps. A small village = um entre vários."},{"id":"b1-j21","en":"He plays [the soccer>soccer] every weekend and the guitar in a band.","pt":"Ele joga futebol todo fim de semana e toca violão numa banda.","rule":"activity","why":"Sports take no article (soccer); musical instruments usually take *the* (the guitar).","whyPt":"Esportes não levam artigo (soccer); instrumentos musicais costumam levar *the* (the guitar)."},{"id":"b1-j22","en":"She studies at [an university>a university] in [_] Canada.","pt":"Ela estuda numa universidade no Canadá.","rule":"first","why":"university starts with a you sound (a consonant sound), so it's a university.","whyPt":"university começa com som de \"yu\" (som de consoante), então é a university."},{"id":"b1-j23","en":"[_] Most [of the] shops on my street close on [_] Sundays.","pt":"A maioria das lojas da minha rua fecha aos domingos.","rule":"most","why":"With of, *the* comes back: most of the shops. Days take no article: on Sundays.","whyPt":"Com of, o *the* volta: most of the shops. Dias não levam artigo: on Sundays."},{"id":"b1-j24","en":"[_] [Breakfast] is the most important meal of the day.","pt":"O café da manhã é a refeição mais importante do dia.","rule":"routine","why":"Meals take no article, even as the subject: Breakfast is… (Portuguese: o café da manhã).","whyPt":"Refeições não levam artigo, nem como sujeito: Breakfast is… (em português: o café da manhã)."},{"id":"b1-j25","en":"She left the house without [>an] umbrella and got wet.","pt":"Ela saiu de casa sem guarda-chuva e se molhou.","rule":"need","why":"A singular countable noun needs *a / an*, even after without: without an umbrella (Portuguese: sem guarda-chuva).","whyPt":"Um substantivo contável no singular precisa de *a / an*, mesmo depois de without: without an umbrella (em português: sem guarda-chuva)."},{"id":"b1-j26","en":"He's the only student in our class who speaks [_] [Japanese].","pt":"Ele é o único aluno da nossa turma que fala japonês.","rule":"activity","why":"Languages take no article: he speaks Japanese (never the Japanese, even though Portuguese can say o japonês).","whyPt":"Idiomas não levam artigo: he speaks Japanese (nunca the Japanese, mesmo que em português dê para dizer o japonês)."},{"id":"b1-j27","en":"[_] Gas costs six reais [the liter>a liter] at the station near my house.","pt":"A gasolina custa seis reais o litro no posto perto da minha casa.","rule":"per","why":"A price per unit takes *a / an*: six reais a liter, three dollars a kilo (Portuguese: seis reais o litro).","whyPt":"Preço por unidade leva *a / an*: six reais a liter, three dollars a kilo (em português: seis reais o litro)."},{"id":"b1-j28","en":"We need [a new furniture>new furniture] for the living room.","pt":"Precisamos de móveis novos para a sala.","rule":"uncount","why":"furniture is uncountable: new furniture or a piece of furniture, never a furniture.","whyPt":"furniture é incontável: new furniture ou a piece of furniture, nunca a furniture."},{"id":"b1-j29","en":"Next summer we're going to [the Netherlands] to visit [_] friends.","pt":"No próximo verão vamos para os Países Baixos visitar amigos.","rule":"place","why":"Plural country names take *the*: the Netherlands, the Philippines, the USA.","whyPt":"Nomes de países no plural levam *the*: the Netherlands, the Philippines, the USA."},{"id":"b1-j30","en":"[The Lake Titicaca>Lake Titicaca] is on the border between [_] Peru and [_] Bolivia.","pt":"O lago Titicaca fica na fronteira entre o Peru e a Bolívia.","rule":"name","why":"Lakes take no article: Lake Titicaca, Lake Victoria. Portuguese says o lago.","whyPt":"Lagos não levam artigo: Lake Titicaca, Lake Victoria. Em português dizemos o lago."},{"id":"b1-j31","en":"There's [a little] milk left, enough for [_] two cups of [_] coffee.","pt":"Ainda tem um pouco de leite, o suficiente para duas xícaras de café.","rule":"few","why":"*a* little = some, enough. Without *a*, little would mean almost none.","whyPt":"*a* little = um pouco, o suficiente. Sem *a*, little seria quase nada."},{"id":"b1-j32","en":"[The children>Children] learn [_] languages faster than [_] adults.","pt":"As crianças aprendem idiomas mais rápido que os adultos.","rule":"general","why":"Children in general take no article. Portuguese says as crianças.","whyPt":"Crianças em geral não levam artigo. Em português dizemos as crianças."},{"id":"b1-j33","en":"The government should do more for [the poor].","pt":"O governo deveria fazer mais pelos pobres.","rule":"group","why":"*the* + adjective = all the people of that kind: the poor, the rich, the elderly.","whyPt":"*the* + adjetivo = todas as pessoas daquele tipo: the poor (os pobres), the rich, the elderly."},{"id":"b1-j34","en":"[The most>Most] Brazilians drink [_] coffee every day.","pt":"A maioria dos brasileiros toma café todo dia.","rule":"most","why":"most + noun has no *the*: most Brazilians. The most is the superlative (the most popular).","whyPt":"most + substantivo não tem *the*: most Brazilians. The most é o superlativo (the most popular)."},{"id":"b1-j35","en":"I need [some advice] about my new job.","pt":"Preciso de um conselho sobre o meu emprego novo.","rule":"uncount","why":"advice is uncountable: some advice, never an advice.","whyPt":"advice é incontável: some advice, nunca an advice."},{"id":"b1-j36","en":"This is [>the] best pizza I've ever eaten.","pt":"Esta é a melhor pizza que eu já comi.","rule":"super","why":"Superlatives take *the*: the best, the worst, the biggest.","whyPt":"Superlativos levam *the*: the best, the worst, the biggest."},{"id":"b1-j37","en":"I can't go out tonight: I have [a] terrible headache.","pt":"Não posso sair hoje à noite: estou com uma dor de cabeça horrível.","rule":"ache","why":"Aches take *a / an*: a headache, a stomachache (Portuguese: estou com dor de cabeça).","whyPt":"Dores levam *a / an*: a headache, a stomachache (em português: estou com dor de cabeça)."},{"id":"b1-j38","en":"My cousin wants to be [>an] architect when she grows up.","pt":"A minha prima quer ser arquiteta quando crescer.","rule":"job","why":"Jobs take *a / an*, and architect starts with a vowel sound: an architect.","whyPt":"Profissões levam *a / an*, e architect começa com som de vogal: an architect."},{"id":"b1-j39","en":"We usually have [_] [dinner] at eight on [_] weekdays.","pt":"A gente costuma jantar às oito nos dias de semana.","rule":"routine","why":"Meals take no article: have dinner, have lunch.","whyPt":"Refeições não levam artigo: have dinner, have lunch."},{"id":"b1-j40","en":"I've got [a good news>good news]: I passed the test!","pt":"Tenho uma boa notícia: passei na prova!","rule":"uncount","why":"news is uncountable: good news or a piece of news, never a news.","whyPt":"news é incontável: good news ou a piece of news, nunca a news."},{"id":"b1-j41","en":"[The] Pacific Ocean is the largest ocean in the world.","pt":"O oceano Pacífico é o maior oceano do mundo.","rule":"place","why":"Oceans take *the*: the Pacific, the Atlantic.","whyPt":"Oceanos levam *the*: the Pacific, the Atlantic."},{"id":"b1-j42","en":"We took a boat trip on [>the] Mississippi River.","pt":"Fizemos um passeio de barco no rio Mississippi.","rule":"place","why":"Rivers take *the*: the Mississippi, the Amazon, the Nile.","whyPt":"Rios levam *the*: the Mississippi, the Amazon, the Nile."},{"id":"b1-j43","en":"[Few] tourists visit the island in the rainy season, so the hotels are almost empty.","pt":"Poucos turistas visitam a ilha na época de chuva, então os hotéis ficam quase vazios.","rule":"few","why":"few = not many (negative), which fits almost empty hotels. *a* few would mean some.","whyPt":"few = poucos (negativo), o que combina com hotéis quase vazios. *a* few seria alguns."},{"id":"b1-j44","en":"What [a terrible traffic>terrible traffic]! We've been stuck here for an hour.","pt":"Que trânsito horrível! Estamos presos aqui há uma hora.","rule":"what","why":"traffic is uncountable, so What terrible traffic! (but What a terrible day!).","whyPt":"traffic é incontável, então What terrible traffic! (mas What a terrible day!)."},{"id":"b1-j45","en":"She broke [her] arm playing [_] volleyball.","pt":"Ela quebrou o braço jogando vôlei.","rule":"poss","why":"Body parts take a possessive in English: her arm (Portuguese: o braço). Sports take no article.","whyPt":"Partes do corpo levam possessivo em inglês: her arm (em português: o braço). Esportes não levam artigo."},{"id":"b1-j46","en":"My little brother goes to [the bed>bed] at eight every night.","pt":"O meu irmãozinho vai para a cama às oito toda noite.","rule":"inst","why":"go to bed = to sleep, with no article (Portuguese: ir para a cama).","whyPt":"go to bed = ir dormir, sem artigo (em português: ir para a cama)."},{"id":"b1-j47","en":"I bought a jacket and a hat, but [the] jacket was too small.","pt":"Comprei uma jaqueta e um chapéu, mas a jaqueta ficou pequena.","rule":"known","why":"Second mention: the jacket I just talked about takes *the*.","whyPt":"Segunda menção: a jaqueta de que acabei de falar leva *the*."},{"id":"b1-j48","en":"My English class costs fifty reais [the>an] hour.","pt":"A minha aula de inglês custa cinquenta reais a hora.","rule":"per","why":"Prices per hour, day or kilo take *a / an*: fifty reais an hour (Portuguese: a hora).","whyPt":"Preços por hora, dia ou quilo levam *a / an*: fifty reais an hour (em português: a hora)."},{"id":"b1-j49","en":"[_] [Dogs] are more loyal than [_] cats, my grandma says.","pt":"Os cachorros são mais fiéis que os gatos, diz a minha avó.","rule":"general","why":"Dogs and cats in general take no article (Portuguese: os cachorros, os gatos).","whyPt":"Cachorros e gatos em geral não levam artigo (em português: os cachorros, os gatos)."},{"id":"b1-j50","en":"[>The] name of my street is hard to pronounce.","pt":"O nome da minha rua é difícil de pronunciar.","rule":"of","why":"*the* when the words after the noun say which one: the name of my street.","whyPt":"*the* quando as palavras depois do substantivo dizem qual: the name of my street."},{"id":"b1-j51","en":"She was born in [_] [Canada], but she grew up in the UK.","pt":"Ela nasceu no Canadá, mas cresceu no Reino Unido.","rule":"name","why":"Most countries take no article (Canada), but \"united\" names do (the UK).","whyPt":"A maioria dos países não leva artigo (Canada), mas nomes com United levam (the UK)."},{"id":"b1-j52","en":"He went to the party without [>a] jacket and caught a cold.","pt":"Ele foi para a festa sem jaqueta e pegou um resfriado.","rule":"need","why":"A singular countable noun can't stand alone after without: without a jacket (Portuguese: sem jaqueta).","whyPt":"Um substantivo contável no singular não fica sozinho depois de without: without a jacket (em português: sem jaqueta)."},{"id":"b1-j53","en":"It was [the] worst day of my life.","pt":"Foi o pior dia da minha vida.","rule":"super","why":"Superlatives take *the*: the worst day, the best movie.","whyPt":"Superlativos levam *the*: the worst day, the best movie."},{"id":"b1-j54","en":"We should do more to help [>the] homeless.","pt":"Deveríamos fazer mais para ajudar os sem-teto.","rule":"group","why":"*the* + adjective = all the people of that kind: the homeless.","whyPt":"*the* + adjetivo = todas as pessoas daquele tipo: the homeless (os sem-teto)."}],"B2":[]},"meaning":{"A1":[],"A2":[],"B1":[],"B2":[{"id":"b2-m01","a":"Her brother went to [_] prison last year.","b":"Her brother went to the prison last year.","ma":"He was sent there as a prisoner.","maPt":"Ele foi preso.","mb":"He went to the building, maybe to visit someone or to work.","mbPt":"Ele foi até o prédio da prisão, talvez para visitar alguém ou trabalhar.","rule":"purpose","why":"go to prison = for what a prison is for: as a prisoner. With *the*, it's just the building.","whyPt":"go to prison = para aquilo que a prisão serve: como preso. Com *the*, é só o prédio."},{"id":"b2-m02","a":"Mrs. Lima goes to [_] school every day.","b":"Mrs. Lima goes to the school every day.","ma":"She's a student there.","maPt":"Ela é aluna.","mb":"She goes to the building every day, maybe to work or to pick up her kids.","mbPt":"Ela vai até o prédio da escola todo dia, talvez para trabalhar ou buscar os filhos.","rule":"purpose","why":"go to school = to study. go to the school = to the building, for another reason.","whyPt":"go to school = para estudar. go to the school = até o prédio, por outro motivo."},{"id":"b2-m03","a":"On Sunday we went to [_] church.","b":"On Sunday we went to the church.","ma":"We went to a religious service.","maPt":"Fomos à missa (ao culto).","mb":"We went to see a particular church building, maybe as tourists.","mbPt":"Fomos ver uma igreja específica, talvez como turistas.","rule":"purpose","why":"go to church = to a service. go to the church = to that building.","whyPt":"go to church = à missa ou ao culto. go to the church = até aquele prédio."},{"id":"b2-m04","a":"Sofia is in [_] class right now.","b":"Sofia is in the class right now.","ma":"She's having a lesson at the moment.","maPt":"Ela está em aula agora.","mb":"She's in the classroom (maybe empty), or in that group of students.","mbPt":"Ela está na sala de aula (talvez vazia), ou naquela turma.","rule":"inst","why":"in class = having a lesson, a set phrase with no article. in *the* class = in that room, or that group.","whyPt":"in class = em aula, expressão sem artigo. in *the* class = naquela sala, ou naquela turma."},{"id":"b2-m05","a":"I'd like [_] coffee, please.","b":"I'd like a coffee, please.","ma":"I'd like coffee, not tea or juice.","maPt":"Eu queria café (e não chá ou suco).","mb":"I'd like one cup of coffee.","mbPt":"Eu queria um café (uma xícara).","rule":"kind","why":"coffee = the drink in general. *a* coffee = one cup.","whyPt":"coffee = a bebida em geral. *a* coffee = uma xícara."},{"id":"b2-m06","a":"There's [_] hair in my soup!","b":"There's a hair in my soup!","ma":"There's a lot of hair in it.","maPt":"Tem muito cabelo na sopa.","mb":"There's one single hair in it.","mbPt":"Tem um fio de cabelo na sopa.","rule":"kind","why":"hair = hair in general, a lot of it. *a* hair = one single hair.","whyPt":"hair = cabelo em geral, muito. *a* hair = um fio só."},{"id":"b2-m07","a":"I need [_] paper.","b":"I need a paper.","ma":"I need some sheets of paper to write on.","maPt":"Preciso de papel.","mb":"I need a newspaper (or an essay).","mbPt":"Preciso de um jornal (ou de um trabalho escrito).","rule":"kind","why":"paper = the material. *a* paper = a newspaper, or a piece of written work.","whyPt":"paper = o material. *a* paper = um jornal, ou um trabalho escrito."},{"id":"b2-m08","a":"There was [_] light in the window.","b":"There was a light in the window.","ma":"The window was bright.","maPt":"Havia claridade na janela.","mb":"There was one lamp, or one point of light, in the window.","mbPt":"Havia uma luz (uma lâmpada) na janela.","rule":"kind","why":"light = brightness in general. *a* light = one lamp or one point of light.","whyPt":"light = claridade em geral. *a* light = uma lâmpada, um ponto de luz."},{"id":"b2-m09","a":"Working at the hotel was [_] great experience.","b":"Working at the hotel was a great experience.","ma":"It taught me a lot of useful skills.","maPt":"Me deu muita experiência (prática).","mb":"It was a great time, something I'll remember.","mbPt":"Foi uma experiência ótima, algo de que vou me lembrar.","rule":"kind","why":"experience = skills you get from practice. *an* experience = one event that happened to you.","whyPt":"experience = prática, o que você aprende fazendo. *an* experience = um acontecimento que você viveu."},{"id":"b2-m10","a":"A Mr. Costa called for you.","b":"[_] Mr. Costa called for you.","ma":"Someone called Costa, a person I don't know.","maPt":"Um tal de Sr. Costa ligou.","mb":"Mr. Costa, the man we both know.","mbPt":"O Sr. Costa (que nós dois conhecemos) ligou.","rule":"someone","why":"*a* + name = someone with that name, but I don't know who. A name alone = the person we know.","whyPt":"*a* + nome = alguém com esse nome, mas não sei quem. O nome sozinho = a pessoa que conhecemos."},{"id":"b2-m11","a":"[_] Few students passed the test.","b":"A few students passed the test.","ma":"Not many passed: that's bad news.","maPt":"Poucos passaram: é uma notícia ruim.","mb":"Some students passed.","mbPt":"Alguns alunos passaram.","rule":"few","why":"few = not many (negative). *a* few = some (positive).","whyPt":"few = poucos (negativo). *a* few = alguns (positivo)."},{"id":"b2-m12","a":"She has [_] little money.","b":"She has a little money.","ma":"She has almost no money.","maPt":"Ela tem pouco dinheiro (quase nada).","mb":"She has some money, enough for something small.","mbPt":"Ela tem um pouco de dinheiro.","rule":"few","why":"little = almost none (negative). *a* little = some (positive).","whyPt":"little = quase nada (negativo). *a* little = um pouco (positivo)."},{"id":"b2-m13","a":"[_] Most beautiful beaches are in the north.","b":"The most beautiful beaches are in the north.","ma":"Nearly all the beautiful beaches are in the north.","maPt":"A maioria das praias bonitas fica no norte.","mb":"The beaches that are more beautiful than all the others are in the north.","mbPt":"As praias mais bonitas de todas ficam no norte.","rule":"most","why":"most + noun = nearly all of them. *the* most = the superlative: more than all the others.","whyPt":"most + substantivo = quase todos. *the* most = superlativo: mais do que todos os outros."},{"id":"b2-m14","a":"Yesterday I saw a doctor.","b":"Yesterday I saw the doctor.","ma":"I saw a doctor, not my usual one or one you know.","maPt":"Eu fui a um médico (qualquer um).","mb":"I saw my usual doctor, or the one we talked about.","mbPt":"Eu fui ao médico (o de sempre, ou aquele de que falamos).","rule":"known","why":"*a* doctor = one doctor, we don't say which. *the* doctor = the one we both know.","whyPt":"*a* doctor = um médico, sem dizer qual. *the* doctor = aquele que nós dois conhecemos."},{"id":"b2-m15","a":"He left [_] school at sixteen.","b":"He left the school at sixteen.","ma":"He stopped studying at sixteen.","maPt":"Ele parou de estudar aos dezesseis.","mb":"He left that school at sixteen, maybe for another one.","mbPt":"Ele saiu daquela escola aos dezesseis, talvez para ir para outra.","rule":"purpose","why":"leave school = stop studying. leave *the* school = leave that particular school.","whyPt":"leave school = parar de estudar. leave *the* school = sair daquela escola específica."},{"id":"b2-m16","a":"I had [_] chicken for lunch.","b":"I had a chicken for lunch.","ma":"I ate some chicken meat.","maPt":"Eu comi frango no almoço.","mb":"I ate a whole chicken!","mbPt":"Eu comi uma galinha inteira!","rule":"kind","why":"chicken with no article is the meat. *a* chicken is the whole animal.","whyPt":"chicken sem artigo é a carne (frango). *a* chicken é o animal inteiro."},{"id":"b2-m17","a":"Be careful, there's [_] glass on the floor.","b":"Be careful, there's a glass on the floor.","ma":"There are pieces of broken glass on the floor.","maPt":"Tem caco de vidro no chão.","mb":"There's a drinking glass on the floor.","mbPt":"Tem um copo no chão.","rule":"kind","why":"glass with no article is the material. *a* glass is something you drink from.","whyPt":"glass sem artigo é o material (vidro). *a* glass é um copo."},{"id":"b2-m18","a":"Is there [_] room for one more person?","b":"Is there a room for one more person?","ma":"Is there enough space for one more?","maPt":"Cabe mais uma pessoa?","mb":"Is there a bedroom for one more guest?","mbPt":"Tem um quarto para mais um hóspede?","rule":"kind","why":"room with no article = space. *a* room = a room in a building.","whyPt":"room sem artigo = espaço. *a* room = um cômodo, um quarto."},{"id":"b2-m19","a":"Grandpa is in [_] bed.","b":"Grandpa is in the bed.","ma":"He's resting, sleeping or sick in bed.","maPt":"O vovô está deitado (dormindo, descansando ou doente).","mb":"He's in that particular bed, the one we're talking about.","mbPt":"Ele está naquela cama específica, a de que estamos falando.","rule":"inst","why":"in bed = resting or sleeping. in *the* bed = in that particular bed.","whyPt":"in bed = deitado, descansando ou dormindo. in *the* bed = naquela cama específica."},{"id":"b2-m20","a":"Can you turn on a light?","b":"Can you turn on the light?","ma":"Any light, I don't mind which.","maPt":"Qualquer luz, tanto faz qual.","mb":"The light we both know, the one in this room.","mbPt":"A luz que nós dois sabemos qual é, a deste cômodo.","rule":"known","why":"*a* light = any one. *the* light = the one we both know.","whyPt":"*a* light = qualquer uma. *the* light = aquela que nós dois sabemos qual é."},{"id":"b2-m21","a":"We need [_] iron.","b":"We need an iron.","ma":"We need the metal, or the mineral in food.","maPt":"Precisamos de ferro (o metal, ou o mineral dos alimentos).","mb":"We need the machine for clothes.","mbPt":"Precisamos de um ferro de passar roupa.","rule":"kind","why":"iron with no article is the metal. *an* iron is the thing you use on clothes.","whyPt":"iron sem artigo é o metal (ferro). *an* iron é o ferro de passar."},{"id":"b2-m22","a":"Do you have [_] time?","b":"Do you have the time?","ma":"Are you free for a moment?","maPt":"Você tem um tempinho?","mb":"What time is it?","mbPt":"Você sabe que horas são?","rule":"fixed","why":"Do you have time? = are you free? Do you have *the* time? = what time is it?","whyPt":"Do you have time? = você tem tempo? Do you have *the* time? = que horas são?"},{"id":"b2-m23","a":"This is [_] wine from Chile.","b":"This is a wine from Chile.","ma":"This wine comes from Chile.","maPt":"Este vinho é do Chile.","mb":"This is one kind of Chilean wine, among many.","mbPt":"Este é um vinho chileno, um tipo entre muitos.","rule":"kind","why":"wine with no article is the drink. *a* wine is one kind or brand of it.","whyPt":"wine sem artigo é a bebida. *a* wine é um tipo, uma marca."},{"id":"b2-m24","a":"I don't like [_] dogs.","b":"I don't like the dogs.","ma":"I don't like dogs in general.","maPt":"Eu não gosto de cachorros (em geral).","mb":"I don't like particular dogs, maybe the neighbors'.","mbPt":"Eu não gosto daqueles cachorros, talvez os do vizinho.","rule":"general","why":"dogs with no article = dogs in general. *the* dogs = particular ones we both know.","whyPt":"dogs sem artigo = cachorros em geral. *the* dogs = cachorros específicos."},{"id":"b2-m25","a":"There was [_] noise all night.","b":"There was a noise all night.","ma":"It was noisy all night: lots of sounds.","maPt":"Teve barulho a noite toda.","mb":"There was one sound all night, the same one.","mbPt":"Teve um barulho a noite toda, sempre o mesmo.","rule":"kind","why":"noise with no article = sounds in general. *a* noise = one particular sound.","whyPt":"noise sem artigo = barulho em geral. *a* noise = um som específico."},{"id":"b2-m26","a":"We have [_] Portinari at home.","b":"We have a Portinari at home.","ma":"The painter himself is at our house!","maPt":"O próprio pintor está na nossa casa!","mb":"We have one of his paintings.","mbPt":"Temos um quadro do Portinari.","rule":"someone","why":"A name alone is the person. *a* + an artist's name = one work by that artist.","whyPt":"Um nome sozinho é a pessoa. *a* + nome de artista = uma obra desse artista."},{"id":"b2-m27","a":"I love [_] music.","b":"I love the music.","ma":"I love music in general.","maPt":"Eu amo música (em geral).","mb":"I love this music, the one playing now or in this movie.","mbPt":"Eu amo essa música, a que está tocando ou a deste filme.","rule":"general","why":"music with no article = music in general. *the* music = a particular music.","whyPt":"music sem artigo = música em geral. *the* music = uma música específica."},{"id":"b2-m28","a":"He's [_] captain of the team.","b":"He's a captain of the team.","ma":"He's the team's captain: there's only one.","maPt":"Ele é o capitão do time (só tem um).","mb":"He's one of the team's captains.","mbPt":"Ele é um dos capitães do time.","rule":"job","why":"A role only one person has can lose its article: He's captain. *a* captain = one of several.","whyPt":"Um cargo que só uma pessoa tem pode ficar sem artigo: He's captain. *a* captain = um de vários."},{"id":"b2-m29","a":"Lucas is an only child.","b":"Lucas is the only child.","ma":"He has no brothers or sisters.","maPt":"Ele não tem irmãos (é filho único).","mb":"He's the one child there: everyone else (at the party, on the bus) is an adult.","mbPt":"Ele é a única criança ali: todo o resto (na festa, no ônibus) é adulto.","rule":"super","why":"*an* only child = a child with no brothers or sisters. *the* only child = the one child in a place or group.","whyPt":"*an* only child = filho único. *the* only child = a única criança num lugar ou grupo."},{"id":"b2-m30","a":"My mom went to [_] college.","b":"My mom went to the college.","ma":"She studied there: she has a degree.","maPt":"Ela fez faculdade.","mb":"She went to the building, maybe for a meeting or to pick someone up.","mbPt":"Ela foi até o prédio da faculdade, talvez para uma reunião ou para buscar alguém.","rule":"purpose","why":"go to college = study there. With *the*, it's just the building.","whyPt":"go to college = estudar lá. Com *the*, é só o prédio."},{"id":"b2-m31","a":"I can't find [_] work.","b":"I can't find the work.","ma":"I can't get a job.","maPt":"Não consigo arrumar emprego.","mb":"I've lost a piece of work: a document, a project, a painting.","mbPt":"Perdi um trabalho específico: um documento, um projeto, um quadro.","rule":"uncount","why":"work with no article = a job, employment. *the* work = one specific piece of work.","whyPt":"work sem artigo = emprego. *the* work = um trabalho específico (um documento, uma obra)."},{"id":"b2-m32","a":"At sixteen, he went to [_] sea.","b":"At sixteen, he went to the sea.","ma":"He became a sailor.","maPt":"Ele virou marinheiro.","mb":"He went to the coast, maybe on vacation.","mbPt":"Ele foi para o litoral, talvez de férias.","rule":"inst","why":"go to sea = start working on ships, like go to school or go to work. *the* sea = the place by the water.","whyPt":"go to sea = ir trabalhar em navios, como go to school. *the* sea = o mar, o litoral."},{"id":"b2-m33","a":"There's [_] dinner at eight.","b":"There's a dinner at eight.","ma":"The evening meal is served at eight (at a hotel, at home).","maPt":"O jantar é servido às oito (no hotel, em casa).","mb":"There's a special event at eight: a formal dinner, maybe for a guest.","mbPt":"Tem um evento às oito: um jantar especial, talvez para um convidado.","rule":"kind","why":"dinner = the meal. *a* dinner = an event, a dinner party.","whyPt":"dinner = a refeição. *a* dinner = um evento, um jantar especial."},{"id":"b2-m34","a":"It's [_] good business.","b":"It's a good business.","ma":"It's a good deal: it makes money.","maPt":"É um bom negócio: dá dinheiro.","mb":"It's a good company.","mbPt":"É uma boa empresa.","rule":"kind","why":"business with no article = trade, making money. *a* business = a company.","whyPt":"business sem artigo = negócio, comércio. *a* business = uma empresa."},{"id":"b2-m35","a":"My cousin is in [_] town.","b":"My cousin is in the town.","ma":"He's visiting our city right now.","maPt":"Ele está aqui na cidade, de visita.","mb":"He's in the town, not out in the country.","mbPt":"Ele está na cidade (no centro urbano), não no campo.","rule":"inst","why":"in town = here, in our city, for now. In *the* town = the place, not the countryside.","whyPt":"in town = aqui na nossa cidade, por enquanto. In *the* town = na cidade, e não no campo."},{"id":"b2-m36","a":"[_] Children love this park.","b":"The children love this park.","ma":"Children in general love it.","maPt":"As crianças em geral adoram este parque.","m asso in the attic?","titlePt":"Um Picasso no sótão?","body":"[the:family] Costas from Belo Horizonte were cleaning their attic when they found [0>a:someone] Picasso, or what looked like one. [an:first] expert says it may be from [0>the:decade] 1930s. If it's real, it's worth more than [a:per] million dollars. “[the:compar] more we learn about it, [the:compar] less we sleep,” says Mrs. Costa.","pt":"Os Costa, de Belo Horizonte, estavam limpando o sótão quando encontraram um Picasso, ou o que parecia ser um. Um especialista diz que ele pode ser dos anos 1930. Se for verdadeiro, vale mais de um milhão de dólares. “Quanto mais a gente descobre sobre ele, menos a gente dorme”, diz a Sra. Costa.","w":{"attic":"sótão","expert":"especialista","worth":"vale"}},{"id":"b2-f17","frame":"Email","framePt":"E-mail","title":"Rain and kayaks","titlePt":"Chuva e caiaques","body":"Hi Rafa! I've finally started my new job in [0:name] Vancouver. I work as [0>a:job] software engineer at [a:first] small {^startup}, and [the:known] office has [an:first] amazing view of [the:of] mountains {north of the city}. [the>0:routine] last weekend I went kayaking for [the:super] first time. It rained all day, but I loved every minute. Write soon!","pt":"Oi, Rafa! Finalmente comecei no meu emprego novo em Vancouver. Trabalho como engenheira de software numa startup pequena, e o escritório tem uma vista incrível das montanhas ao norte da cidade. No fim de semana passado fiz caiaque pela primeira vez. Choveu o dia todo, mas eu amei cada minuto. Escreve logo!","w":{"software engineer":"engenheira de software","view":"vista","went kayaking":"fiz caiaque"}},{"id":"b2-f18","frame":"Blog","framePt":"Blog","title":"Grandpa's coffee","titlePt":"O café do vovô","body":"My grandfather has grown [0:general] coffee in [0:name] Minas Gerais since [the:decade] 1970s. He once gave me [an>0:uncount] advice I'll never forget: [the>0:general] good coffee needs [0:uncount] patience. [the>0:most] most farms near his sell to [a:first] big cooperative, but he sells [the:of] beans {he grows} directly to [0:general] cafés in São Paulo. He earns less, but he says it's worth it.","pt":"O meu avô planta café em Minas Gerais desde os anos 1970. Uma vez ele me deu um conselho que nunca vou esquecer: café bom precisa de paciência. A maioria das fazendas perto da dele vende para uma grande cooperativa, mas ele vende os grãos que planta direto para cafeterias de São Paulo. Ele ganha menos, mas diz que vale a pena.","w":{"has grown":"planta","patience":"paciência","cooperative":"cooperativa","beans":"grãos","directly":"direto"}},{"id":"b2-f19","frame":"News","framePt":"Notícia","title":"Books on the platform","titlePt":"Livros na plataforma","body":["[the>0:headline] City Opens [0:headline] Free Library in [0:headline] Old Train Station","[the:of] old train station {in Juiz de Fora}, closed since [the:decade] 1990s, reopened on [0:routine] Monday as [a:first] free public {^library}. [the:known] library has more than 40,000 books and [0:uncount] free Wi-Fi. Computer classes for [0>the:group] elderly start next month."],"tags":["headline",null],"pt":["Cidade abre biblioteca gratuita em antiga estação de trem","A antiga estação de trem de Juiz de Fora, fechada desde os anos 1990, reabriu na segunda-feira como biblioteca pública gratuita. A biblioteca tem mais de 40 mil livros e wi-fi grátis. As aulas de informática para idosos começam no mês que vem."],"w":{"train station":"estação de trem","reopened":"reabriu","public library":"biblioteca pública","computer classes":"aulas de informática"}},{"id":"b2-f20","frame":"Message","framePt":"Mensagem","title":"Saturday on Paulista","titlePt":"Sábado na Paulista","body":"Hey Lu! Are you free on [0:routine] Saturday? There's [a:first] street {^festival} on [the>0:name] Paulista Avenue, with [0:general] food trucks and live music. [the:known] festival starts at noon. I'll meet you at [the:of] subway exit {by the art museum}. Don't come without [0>an:need] um /* 00-util.js — tiny helpers shared by every module, and the text-markup parser.
   All modules share one script scope (see build.py). DATA is defined by build.py before them. */
const $ = id => document.getElementById(id);
function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function rnd(a, b) { return a + Math.random() * (b - a); }
function pick1(a) { return a[Math.floor(Math.random() * a.length)]; }
// Restart a one-shot CSS animation class.
function flash(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); el.addEventListener("animationend", function f() { el.classList.remove(cls); el.removeEventListener("animationend", f); }); }
// A soft glow on an explanation card for a moment (a transition, not an animation: swapping the card's animation would
// replay its pop-in entrance, which looked like a blink). From the conjunctions game.
function glow(el) { el.classList.add("glow"); clearTimeout(el.__glowT); el.__glowT = setTimeout(() => el.classList.remove("glow"), 1100); }

/* 03-tts.js — read English aloud: the recorded clip when there is one (see "Recorded voice" below), else the browser's

   Dialogues and chats get one voice per speaker (castVoices): the text's "voices" ({"Emma": "f", "Tom": "m"}) say
   which gender each speaker is, and voices are matched by their names (Zira, Jenny… / David, Mark…). On a device
   with too few voices, speakers who share a voice (or get one of the other gender) are told apart by pitch and speed.
   Each part can name an element that gets .reading while it is read (the line in the text card).

const FEM = /zira|jenny|aria|\bava\b|samantha|susan|hazel|libby|sonia|natasha|catherine|karen|moira|tessa|fiona|victoria|allison|serena|joanna|salli|kimberly|kendra|\bivy\b|nicole|olivia|michelle|\bemma\b|female|woman|google us english/i;
const MASC = /david|\bmark\b|\bguy\b|daniel|george|ryan|james|\balex\b|\bfred\b|aaron|arthur|oliver|christopher|\beric\b|roger|brian|william|liam|thomas|\bmale\b/i;

/* 04-articles.js — the four choices a gap cycles through, and the words for the explanations.
   Cycle order (tap by tap): a → an → the → Ø (nothing) → (back to a); at the start of a sentence A → An → The → Ø.
   Every gap has all four, so the cycle never gives an answer away. The right one is written in the text ([an:first]),
   with its reason: a rules.json "rules" key. Classes: "a" (a and an), "the", "0" (nothing). */
const ARTS = ["a", "an", "the", "Ø"], ZERO = 3;

const clsOf = st => st === 2 ? "the" : st === 3 ? "0" : "a";

function spotInfo(art, rule, cap) {

const ruleKey = (sp, st) => st === sp.alt && sp.alt >= 0 ? sp.altRule : sp.rule;

// their class colour, so "the when the words after the noun…" reads "[the] when the words after the noun…".
// *kw|in general* = a key word (what the rule turns on), just bold in the text colour (from Doing or To Do?).
const artTxt = s => esc(s).replace(/\*(kw\|)?([^*]+)\*/g, (m, kw, w) => '<b class="aq aq-' + (kw ? "kw" : /^the\b/i.test(w) ? "the" : /^an?\b/i.test(w) ? "a" : /^Ø/.test(w) ? "0" : "pt") + '">' + w + "</b>");

const ruleName = (k, pt) => { const R = DATA.rules.rules[k]; return pt ? R.namePt : R.name; };
const ruleLine = (k, pt) => { const R = DATA.rules.rules[k]; return pt ? R.rulePt : R.rule; };

const isTrap = k => !!(DATA.rules.rules[k] || {}).trap;

function choiceName(sp, st, pt) { return st === ZERO ? "Ø (" + txL(pt, "nothing") + ")" : sp.forms[st]; }

/* ---------- Words for the explanations ---------- */
// Why choice st is wrong for spot sp (rules.json "wrong", or the rule's own "bad"), in English or Portuguese; "" when it
// is right or untouched.
function wrongWhy(sp, st, pt) {

  if (v) Object.keys(v).forEach(n => { s = s.split("{" + n + "}").join(v[n]); });
  return s;
}
function applyUi() {
  document.querySelectorAll("[data-ui]").forEach(el => { el.textContent = tx(el.dataset.ui); });
  document.querySelectorAll("[data-ui-aria]").forEach(el => { el.setAttribute("aria-label", tx(el.dataset.uiAria)); });
