/* 07-back.js — the phone's back gesture (or the browser's Back) closes the open window instead of leaving the page:
   the Guide, Favorites / Seen, the end card, the tutorial, the Play menu and the header pop-ups (colours, volume). Each window holds a history entry while it
   is open. A MutationObserver sees it open and close, whatever closed it (✕, Escape, a click outside, a button), so the
   entry is added and taken back in one place. Back closes the window opened last. */
// Our history entries must not bring back an old scroll position: closing the Guide scrolls to the explanation it was
// opened from, and the browser would undo that (Back restores the scroll saved with the entry).
try { history.scrollRestoration = "manual"; } catch (e) {}
const BACK = [];     // open windows, oldest first: { el, close, pushed }
let backSkip = 0;    // our own history.back() calls, whose popstate is not a Back press
// el: the window's element; isOpen(): whether it shows; close(): what Back does (the same as its ✕ or Escape).
function backLayer(el, isOpen, close) {
  const L = { el, close, pushed: false, byBack: false };
  let was = isOpen();
  new MutationObserver(() => {
    const now = isOpen(); if (now === was) return; was = now;
    if (now) {
      try { history.pushState({ layer: 1 }, ""); L.pushed = true; } catch (e) { L.pushed = false; }   // a file:// page may refuse
      BACK.push(L);
    } else {
      const i = BACK.indexOf(L); if (i >= 0) BACK.splice(i, 1);
      // Closed by the game, not by Back: take its history entry away, so the next Back isn't a dead press.
      if (L.pushed && !L.byBack) { backSkip++; history.back(); }
      L.pushed = false;
    }
  }).observe(el, { attributes: true, attributeFilter: ["class", "hidden"] });
}
window.addEventListener("popstate", () => {
  if (backSkip) { backSkip--; return; }
  const L = BACK[BACK.length - 1]; if (!L) return;
  L.byBack = true; L.close(); setTimeout(() => { L.byBack = false; }, 0);   // the observer has run by then
});
// Header pop-ups (01-theme.js, 02-sound.js; from Conditional Bubbles): the back gesture closes them too.
backLayer(swwrap, () => swwrap.classList.contains("open"), () => swOpen(false));
backLayer(volwrap, () => volwrap.classList.contains("open"), () => volwrap.classList.remove("open"));

/* 08-sky.js — the bubbles drifting up behind everything (from Be Do Modal, Nov 2026, itself from English Bubbles): 7
   see-through, softly blurred bubbles of random size (40-140 px), place and pace (95-145 s a climb). At page load they
   are already part-way up, spread over the screen, and the layer fades in (.sky.in). Only transform / opacity move;
   they pause while a bonus word is carried (body.carrying, 24-squash.js) or the result card opens (body.calm, 23-shine.js), and are left out with reduced motion. Look:
   15-sky.css. */
(function () {
  var host = $("sky");
  if (!host || reduceMotion) return;
  var hues = [215, 330, 150, 265, 30, 190];
  for (var k = 0; k < 7; k++) {
    var s = document.createElement("span"), size = 40 + Math.round(Math.random() * 100), t = 95 + Math.round(Math.random() * 50);
    // a negative delay starts the climb part-way: spread from 15% to 80% of the way up, bubble by bubble
    var at = (0.15 + 0.65 * (k + Math.random() * 0.8) / 7) * t;
    s.style.cssText = "width:" + size + "px;height:" + size + "px;left:" + Math.round(Math.random() * 96) + "%;" +
      "--h:" + hues[k % hues.length] + ";--t:" + t + "s;--d:-" + at.toFixed(1) + "s;" +
      "--x:" + Math.round(Math.random() * 80 - 40) + "px";
    host.appendChild(s);
  }
  setTimeout(function () { host.classList.add("in"); }, 60);   // a timer, not animation frames: a page opened in the background gets none until shown
})();

/* 10-game.js — the game. One game = a level's texts (levels.json "rounds" of them), one text per round, then the
   extra rounds its level has (normal games only; EXTRAS): bonus (11-bonus.js), Which meaning? (17-meaning.js), Right
   or wrong (12-judge.js), Proofreading (18-proof.js).
   Every text has 3–6 gaps ("spots"). An untouched gap is a grey bubble that keeps showing the four choices in turn
   (a → an → the → Ø, ROLL_MS each). The first tap picks the one it shows; every later tap moves one step round the
   cycle (04-articles.js). The player stops each gap on the right word and presses Check.
   Scoring per spot: right on the first check = 2 points, right on a later check = 1, never = 0.
   A wrong check costs a try (levels.json "tries"). Levels with "feedback": "spots" mark the wrong spots and lock the
   right ones; "count" only says how many are wrong. After the last try the answers are shown.
   Hints ("Clues") light up the words that decide: a pool for the whole game (levels.json "hints"), one per text, and
   each unused hint is +1 bonus point at the end. */
const PTS_FIRST = 2, PTS_LATER = 1, ROLL_MS = 2000;
// Rules come from the level of the text being played (practice games can mix levels).
const lvl = () => DATA.levels[(G.r && G.r.level) || G.level] || {};
const levelOf = t => t.id.split("-")[0].toUpperCase();
const maxTries = () => lvl().tries || 2;
const hintPool = () => { const h = (DATA.levels[G.level] || {}).hints; return h == null ? 2 : h; };   // 0 = no Clues
const TEXTS = {};
Object.keys(DATA.texts).forEach(l => DATA.texts[l].forEach(t => { TEXTS[t.id] = t; }));
const G = { level: "A1", mode: "normal", pool: [], total: 3, idx: 0, score: 0, results: [], streak: 0, hintsLeft: 0, r: null, b: null, j: null, m: null, bonus: null, judge: null, meaning: null, s: false, xi: -1, favs: null, phase: "idle" };
const stage = $("stage"), card = $("card"), revealEl = $("reveal"), hintEl = $("hint"), toolsEl = $("tools"), quizEl = $("quiz");
const scoreEl = $("score"), scEl = $("sc"), bestEl = $("bestlbl"), hintBtn = $("hintbtn"), resetBtn = $("resetbtn"), checkBtn = $("checkbtn"), triesEl = $("tries");

/* ---------- Game flow ---------- */
// mode: "normal" | "speed" | "review" | "fav" (see 22-modes.js); ids = the texts for a review / favorites game.
function newGame(level, mode = "normal", ids) {
  G.level = level; G.mode = mode; applyUi();
  G.pool = ids ? shuffle(ids.map(id => TEXTS[id]).filter(Boolean)) : orderPool(DATA.texts[level]);
  G.total = mode === "speed" ? Infinity : Math.min(DATA.levels[level].rounds || 3, G.pool.length);
  Object.assign(G, { idx: 0, score: 0, results: [], streak: 0, hintsLeft: hintPool(), r: null, b: null, j: null, m: null, bonus: null, judge: null, meaning: null, s: false, xi: -1 });
  G.favs = mode === "fav" ? favParts(ids || []) : null;   // a Favorites game: its sentences, bonus and Right-or-wrong ids
  stopSpeed(); stopSpeech(); quizEl.hidden = true; revealEl.hidden = true; stage.hidden = toolsEl.hidden = false;
  toolsEl.classList.remove("bonus"); card.classList.remove("bonuscard", "judgecard", "meancard", "proofcard");
  showScore(); showCombo();
  if (mode === "speed") return speedIntro();   // goal card and 3-2-1 first; it starts the clock
  (G.total ? startRound : afterRound() || startRound)();   // a Favorites game may have no texts
}
function startRound() {
  const t = G.pool[G.idx % G.pool.length], P = parsed(t);
  G.r = { t, P, level: levelOf(t), st: P.spots.map(() => -1), lock: P.spots.map(() => false), first: null, tries: 0, hinted: false };
  G.b = G.j = G.m = null; G.phase = "play";
  revealEl.hidden = true; revealEl.innerHTML = "";
  toolsEl.classList.remove("bonus"); toolsEl.hidden = false;
  hideGloss(); renderCard(); renderTools(); updateProgress(); roll();
  hintEl.innerHTML = tx("introShort");
  stage.classList.remove("out"); if (!reduceMotion) flash(stage, "rise");
}
// The extra rounds after the texts, in this order, each only where it's due: favorite sentences (Favorites games),
// bonus, Which meaning?, Right or wrong, Proofreading. G.xi = the one being played (-1 = still texts).
const EXTRAS = () => [[startSents, sentDue], [startBonus, bonusDue], [startMeaning, meaningDue], [startJudge, judgeDue], [startProof, proofDue]];
// What comes after a finished round: the next text, then the next extra round due, then the end screen (null).
function afterRound() {
  if (G.xi < 0 && G.idx + 1 < G.total) return startRound;
  const x = EXTRAS().find((e, k) => k > G.xi && e[1]());
  return x ? x[0] : null;
}
function nextRound() {
  if (G.phase !== "done") return;
  G.phase = "idle"; stopSpeech();
  const next = afterRound();
  if (G.xi < 0) G.idx++;
  if (!next) { updateProgress(); showEnd(); return; }
  stage.classList.add("out"); revealEl.classList.add("out");
  setTimeout(() => {
    revealEl.classList.remove("out");
    next();
    scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
  }, reduceMotion ? 0 : 260);
}
// The label of the button that leaves a finished round.
function nextLabel() {
  const n = afterRound(), L = [[startRound, "next"], [startSents, "toSents"], [startBonus, "toBonus"], [startMeaning, "toMeaning"], [startJudge, "toJudge"], [startProof, "toProof"]];
  return (L.find(x => x[0] === n) || [0, "results"])[1];
}

/* ---------- Rendering ---------- */
// The text card: a tag (the text's frame: Email, Blog…), the title, then one block per paragraph.
function renderCard() {
  const r = G.r, t = r.t, P = r.P;
  card.className = "card";
  card.innerHTML = '<span class="tag">' + esc(frameName(t)) + '</span><h2 class="ttl">' + esc(t.title) + "</h2>" +
    '<div class="lines">' + P.lines.map((L, li) => { const g = (t.tags || [])[li];   // a paragraph's tag: "headline"
      return '<div class="ln' + (g ? " tagged tag-" + g : "") + '" data-l="' + li + '"><p class="say">' + (g ? '<span class="ln-tag">' + esc(tx("tag_" + g)) + "</span>" : "") + lineHTML(t, P, li) + "</p></div>"; }).join("") + "</div>";
  r.spotEls = [...card.querySelectorAll(".art")];
  r.capEls = P.spots.map((sp, i) => card.querySelector('.cw[data-i="' + i + '"]'));
}
// The card's tag: the text's "frame" ("framePt" at native-UI levels).
function frameName(t) { return (nativeUi() && t.framePt) || t.frame || "Text"; }
// One dot per step of the cycle.
const dots = sp => '<span class="dots" aria-hidden="true">' + "<i></i>".repeat(sp.forms.length) + "</span>";
// The word, stacked over invisible copies of every choice: a bubble is as wide as its longest choice from the start,
// so tapping never moves the text around it.
function spotWord(sp) {
  return '<span class="awrap"><span class="aw">' + esc(sp.forms[0]) + "</span>" + sp.forms.map(f => '<span class="sz" aria-hidden="true">' + esc(f) + "</span>").join("") + "</span>";
}
// A soap bubble's own film angle and turn (SOAP: 23-shine.js), so the bubbles don't turn in step.
const soapVars = () => 'style="--ang:' + Math.round(rnd(0, 360)) + "deg;--dl:" + (-rnd(0, 10)).toFixed(2) + 's"';
function spotHTML(sp, i) {
  return '<button type="button" class="art" data-i="' + i + '" aria-label="' + esc(tx("gap")) + " " + (i + 1) + '" ' + soapVars() + ">" + SOAP + spotWord(sp) + dots(sp) + "</button>";
}
// After a gap that starts a sentence, the next word sits in .cw: it takes the capital when that gap is Ø.
function lineHTML(t, P, li) {
  const cw = (html, p) => p >= 0 && P.spots[p].cap ? html.replace(/^(\s*)((?:<[^>]+>)*[^\s<]+(?:<\/[^>]+>)*)/, '$1<span class="cw" data-i="' + p + '">$2</span>') : html;
  // The words right after a gap (its noun phrase, up to NP_MAX words, even across a clue) sit in .np, for Clues on a
  // gap with no clue words. cur = the gap whose phrase is still open, n = its words so far.
  let cur = -1, n = 0;
  const open = p => { if (p >= 0) { cur = p; n = 0; } };
  const npWrap = html => '<span class="np" data-i="' + cur + '">' + html + "</span>";
  return walk(P, li, 0, Infinity, {
    t: (s, p) => {
      open(p); if (cur < 0) return cw(glossWrap(s, t), p);
      const m = nounLen(s, n), sp = /^\s*/.exec(s)[0].length;   // the space before the phrase stays outside it
      const html = m.end ? s.slice(0, sp) + npWrap(cw(glossWrap(s.slice(sp, m.end), t), p)) + glossWrap(s.slice(m.end), t) : cw(glossWrap(s, t), p);
      n += m.n; if (m.stop || n >= NP_MAX || /\S/.test(s.slice(m.end))) cur = -1;
      return html;
    },
    clue: (c, s, p) => {
      open(p); const html = cw('<span class="clue" data-c="' + c + '">' + glossWrap(s, t) + "</span>", p);
      if (cur < 0) return html;
      n += s.trim().split(/\s+/).length; const out = npWrap(html); if (n >= NP_MAX) cur = -1; return out;
    },
    spot: i => { cur = -1; return spotHTML(P.spots[i], i); }
  });
}
// Show spot i in state st: one of its four choices (st 0–3), or, untouched (st < 0), grey: empty, or with the choice
// grey (0–3) rolling past. The dot under it shows where in the cycle it is.
function paintSpot(el, sp, st, grey) {
  const k = st >= 0 ? st : grey == null ? -1 : grey, aw = el.querySelector(".aw"), w = k < 0 ? "" : sp.forms[k];
  if (aw.textContent !== w) { aw.textContent = w; if (st < 0 && !reduceMotion) flash(aw, "roll"); }
  el.classList.toggle("set", st >= 0);
  ["a", "the", "0"].forEach(c => el.classList.toggle("cls-" + c, st >= 0 && clsOf(st) === c));
  el.classList.toggle("zero", k === ZERO);
  [].forEach.call(el.querySelectorAll(".dots i"), (d, n) => d.classList.toggle("on", st >= 0 && n === st));
  if (el.dataset.i) el.setAttribute("aria-label", tx("gap") + " " + (+el.dataset.i + 1) + ": " + (st >= 0 ? choiceName(sp, st, nativeUi()) : "?"));
}
// The word after a sentence-initial gap takes its capital while that gap is Ø.
function capWord(i, st) { const c = G.r && G.r.capEls[i]; if (c) c.classList.toggle("up", st === ZERO); }
function renderTools() {
  const r = G.r, play = G.phase === "play";
  triesEl.innerHTML = Array.from({ length: maxTries() }, (_, i) => '<i class="' + (r && i < r.tries ? "used" : "") + '"></i>').join("");
  triesEl.title = (maxTries() - (r ? r.tries : 0)) + " tries left";
  hintBtn.style.display = hintPool() ? "" : "none";   // levels with "hints": 0 (B2) have no Clues
  hintBtn.disabled = !play || !G.hintsLeft || !r || r.hinted || !hintAny(r);
  resetBtn.disabled = !play || !r || !r.st.some((s, i) => !r.lock[i] && s !== startSt(r, i));
  checkBtn.disabled = !play;
  checkBtn.classList.toggle("pulse", play && !!r && r.st.every(s => s >= 0));
  $("hintleft").textContent = tx("left", { n: G.hintsLeft });
}
function updateProgress() {
  showDays();
  if (G.mode === "speed") return speedRender();
  if (G.j) { $("proglbl").textContent = tx("judgeOf", { n: Math.min(G.j.k + 1, G.j.items.length), total: G.j.items.length }); $("pfill").style.width = "100%"; return; }
  if (G.b) { $("proglbl").textContent = tx("bonusOf"); $("pfill").style.width = "100%"; return; }
  if (G.m) { $("proglbl").textContent = tx("meaningOf", { n: Math.min(G.m.k + 1, G.m.items.length), total: G.m.items.length }); $("pfill").style.width = "100%"; return; }
  if (G.xi === 4) { $("proglbl").textContent = tx("proofTag"); $("pfill").style.width = "100%"; return; }
  if (G.xi === 0) { $("proglbl").textContent = tx("sentOf", { n: G.spIdx, total: G.sp.length }); $("pfill").style.width = (G.spIdx / G.sp.length * 100) + "%"; return; }
  const n = Math.min(G.idx + 1, G.total), done = G.idx + (G.phase === "done" ? 1 : 0);
  $("proglbl").textContent = tx({ review: "reviewOf", fav: "favOf" }[G.mode] || "textOf", { n, total: G.total });
  $("pfill").style.width = (Math.min(done, G.total) / G.total * 100) + "%";
}
// Best scores are kept for normal games and quick-fire; practice games don't save one ("" = none).
const BEST = { normal: "art-best-", speed: "art-speed-" };
function bestKey() { return BEST[G.mode] ? BEST[G.mode] + G.level : ""; }
function showScore() {
  scEl.textContent = G.score;
  bestEl.textContent = bestKey() ? "best " + (parseInt(load(bestKey()), 10) || 0) : "practice";
}
// "×3" on the score tile while perfect texts keep coming.
function showCombo() { const c = $("combo"); c.hidden = G.streak < 2; c.textContent = "×" + G.streak; if (G.streak >= 2) flash(c, "tick"); }

/* ---------- The grey bubbles' roll ---------- */
// Only the first gap of a game's first text rolls (it shows the next choice every ROLL_MS, to teach the cycle); the
// other grey gaps stay empty (grey -1). A paused tab doesn't roll (the interval is skipped while hidden).
let rollN = 0;
function roll() {
  const r = G.r; if (G.phase !== "play" || !r || !r.spotEls) return;
  r.grey = r.P.spots.map((sp, i) => G.idx === 0 && i === 0 ? rollN % ARTS.length : -1);
  r.spotEls.forEach((el, i) => { if (r.st[i] < 0 && !(demoLive && demoLive.i === i)) paintSpot(el, r.P.spots[i], -1, r.grey[i]); });
}
setInterval(() => { if (!document.hidden && G.phase === "play") { rollN++; roll(); } }, ROLL_MS);

/* ---------- Playing ---------- */
// A tap: the first one picks the choice the grey bubble shows; then one step round the cycle (dir -1 = back: Shift +
// tap, right click, Shift + number key).
function cycleSpot(i, dir = 1) {
  const r = G.r; if (G.phase !== "play" || !r.spotEls[i] || r.lock[i]) return;
  const n = ARTS.length, s = r.st[i], st = r.st[i] = s < 0 ? Math.max(r.grey ? r.grey[i] : 0, 0) : (s + dir + n) % n, el = r.spotEls[i];
  paintSpot(el, r.P.spots[i], st); capWord(i, st);
  el.classList.remove("err", "nudge");
  if (!reduceMotion) flash(el, "pop");
  tone(CYCLE_TONES[st], 0, .12, .07, 0, true);
  renderTools();
}
// A spot's state before any tap: grey (-1), or in a proofreading text what the text says.
const startSt = (r, i) => r.start ? r.start[i] : -1;
function resetAll() {
  const r = G.r; if (G.phase !== "play") return;
  r.st = r.st.map((s, i) => r.lock[i] ? s : startSt(r, i));
  r.spotEls.forEach((el, i) => { if (!r.lock[i]) { el.classList.remove("err"); paintSpot(el, r.P.spots[i], r.st[i]); capWord(i, r.st[i]); } });
  roll(); sndBack(); renderTools();
}
function check() {
  const r = G.r; if (G.phase !== "play") return;
  // A grey (untouched) bubble counts as Ø (nothing).
  r.st.forEach((s, i) => { if (s < 0) { r.st[i] = ZERO; paintSpot(r.spotEls[i], r.P.spots[i], ZERO); capWord(i, ZERO); } });
  const wrong = r.P.spots.map((sp, i) => !isRight(sp, r.st[i]) ? i : -1).filter(i => i >= 0);
  r.tries++;
  if (!r.first) { r.first = r.P.spots.map((sp, i) => isRight(sp, r.st[i])); r.firstSt = r.st.slice(); }
  if (!wrong.length) return finish(true);
  r.wrong = wrong;   // Clues after this check light only these gaps' clue words (or their noun phrase)
  G.streak = 0; showCombo(); sndBad(); flash(card, "shake");
  if (r.tries >= maxTries()) {
    G.phase = "checking"; renderTools(); hintEl.innerHTML = tx("outOfTries");
    setTimeout(() => { if (G.r === r) finish(false); }, reduceMotion ? 0 : 700);
    return;
  }
  const marks = lvl().feedback === "spots", left = maxTries() - r.tries;
  // The "how many are wrong" part pulses a few times so the player notices it (.alert in 10-game.css).
  let msg = '<span class="alert">' + tx(wrong.length === 1 ? "wrong1" : "wrongN", { n: wrong.length }) + "</span>";
  if (marks) {
    // Wrong spots go red; right ones lock green. A hint says what kind of mistake the first wrong one is.
    r.P.spots.forEach((sp, i) => {
      if (wrong.includes(i)) { r.spotEls[i].classList.add("err"); return; }
      r.lock[i] = true; r.spotEls[i].classList.add("lock"); r.spotEls[i].tabIndex = -1;
    });
    const w = r.P.spots[wrong[0]];
    msg += " " + tx(wrong.length === 1 ? "wrongMarked" : "wrongMarkedN") + " " + tx(clsOf(r.st[wrong[0]]) !== w.cls ? "askCls" : "askSound");
  }
  hintEl.innerHTML = msg + " " + tx(left === 1 ? "tryLeft" : "triesLeft", { n: left });
  scrollToHint(); renderTools();
}
// Bring the hint line (above the text) just under the sticky dock when it is off screen: after a wrong check the
// player is down at the Check button and would miss the message (from Present Perfect).
function scrollToHint() {
  const dock = document.querySelector(".dock"), top = (dock ? dock.getBoundingClientRect().bottom : 0) + 12, b = hintEl.getBoundingClientRect();
  if (b.top >= top && b.bottom <= innerHeight) return;
  scrollTo({ top: scrollY + b.top - top, behavior: reduceMotion ? "auto" : "smooth" });
}
// End of a text: every spot shows its right word (green, or red when the choice was wrong), the score, then the explanations.
function finish(allRight) {
  const r = G.r, P = r.P, t = r.t;
  const ok = P.spots.map((sp, i) => isRight(sp, r.st[i]));
  // The spots that count: all of them, or in a proofreading text only its mistakes. Explained (keep): those, and any
  // spot that wasn't right on the first check.
  const cnt = P.spots.map(sp => !r.proof || sp.shown !== sp.ans), keep = cnt.map((c, i) => c || !r.first[i]);
  const n = cnt.filter(Boolean).length, k = ok.filter((o, i) => o && cnt[i]).length;
  const pts = P.spots.reduce((s, sp, i) => s + (!cnt[i] ? 0 : r.first[i] ? PTS_FIRST : ok[i] ? PTS_LATER : 0), 0);
  const perfect = allRight && r.tries === 1;
  // Portuguese traps: the spots whose rule Portuguese says another way, and how many were right on the first check.
  const traps = P.spots.map((sp, i) => cnt[i] && isTrap(sp.rule) ? i : -1).filter(i => i >= 0);
  Object.assign(r, { ok, pts, perfect, cnt, keep });
  G.phase = "done"; G.score += pts; G.streak = perfect ? G.streak + 1 : 0;
  P.spots.forEach((sp, i) => {
    const el = r.spotEls[i];
    const show = ok[i] ? r.st[i] : sp.ans;   // a right choice stays (the / a book), a wrong one becomes the answer
    paintSpot(el, sp, show); capWord(i, show);
    el.classList.remove("err", "lock"); el.classList.add(ok[i] ? "ok" : "bad");
    if (keep[i]) el.insertAdjacentHTML("beforeend", '<sup class="sn">' + (i + 1) + "</sup>");
    // The bubble keeps its size: the number floats on its corner, and a wrong choice is only in the tooltip and the explanation.
    el.title = (ok[i] ? "✓ " + formOf(sp, show) : "✗ " + sp.forms[r.st[i]] + " → " + formOf(sp));
  });
  card.classList.add("done");

  const msg = perfect ? (G.streak >= 3 ? tx("streak", { n: G.streak }) : tx("perfect")) : tx(allRight ? "nice" : k ? "gotIt" : "done");
  toast("+" + pts + " · " + msg, allRight ? "" : "zero");

function bonusTools() {

/* ---------- Moving words (with FLIP animation) ---------- */
// Run mutate(), then animate every word from where it was to where it is now.
function flipAll(mutate) {
  const ws = G.b.words, before = ws.map(W => W.el.getBoundingClientRect());
  mutate();
  if (reduceMotion) return;
  ws.forEach((W, n) => {
    const a = before[n], c = W.el.getBoundingClientRect(), dx = a.left - c.left, dy = a.top - c.top;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
    W.el.animate([{ transform: "translate(" + dx + "px," + dy + "px)" }, { transform: "none" }], { duration: 420, easing: "cubic-bezier(.3,1.25,.55,1)" });
  });
}
function setSlot(i, W) {
  G.b.slots[i] = W;
  if (W) { W.slot = i; G.b.slotEls[i].appendChild(W.el); }
  G.b.slotEls[i].classList.toggle("filled", !!W);
}
function leaveHome(W) { W.home.style.width = W.el.offsetWidth + "px"; W.home.style.height = W.el.offsetHeight + "px"; W.home.classList.add("away"); }
function toHome(W) { W.slot = -1; W.home.appendChild(W.el); W.home.style.width = W.home.style.height = ""; W.home.classList.remove("away"); }
// Put word W into slot i (i < 0 = back home). An unlocked word already in slot i swaps places with W.
function moveRaw(W, i) {
  const b = G.b, from = W.slot;
  if (i < 0) { if (from >= 0) { setSlot(from, null); toHome(W); } return; }
  const occ = b.slots[i];
  if (occ === W || (occ && occ.locked)) return;
  if (from < 0) leaveHome(W); else setSlot(from, null);
  if (occ) { if (from >= 0) setSlot(from, occ); else toHome(occ); }
  setSlot(i, W);
}
function move(W, i) {
  if (W.locked) return;
  const wasHome = W.slot < 0;
  flipAll(() => moveRaw(W, i));
  if (i < 0) sndBack(); else sndPlace();
  if (wasHome || i >= 0) afterMove();
}
function tapWord(W) {
  if (G.phase !== "bonus" || W.locked) return;
  if (W.slot >= 0) move(W, -1);
  else { const i = G.b.slots.findIndex(x => !x); if (i >= 0) move(W, i); }
}
function afterMove() {

}
function bonusClear() {
  const b = G.b; if (G.phase !== "bonus" || !b.slots.some(W => W && !W.locked)) return;
  flipAll(() => b.slots.forEach((W, i) => { if (W && !W.locked) { setSlot(i, null); toHome(W); } }));
  sndBack(); bonusTools();
}

/* ---------- Checking ---------- */
function bonusCheck() {
  const b = G.b, got = b.slots.map(W => W.t.toLowerCase()), want = b.ans.map(t => t.toLowerCase());
  if (got.every((t, i) => t === want[i])) {
    b.slots.forEach(W => { W.el.classList.add("ok"); W.locked = true; });
    return bonusFinish(b.tries === 0 ? BONUS_FIRST : BONUS_LATER, true);
  }
  b.tries++; sndBad(); flash(b.ansBox, "shake"); G.streak = 0; showCombo();
  b.slots.forEach((W, i) => { if (got[i] === want[i]) { W.locked = true; W.el.classList.add("ok"); } else W.el.classList.add("bad"); });
  bonusTools();
  if (b.tries >= BONUS_TRIES) { hintEl.innerHTML = tx("bonusOut"); return setTimeout(bonusReveal, reduceMotion ? 0 : 700); }
  hintEl.innerHTML = tx("bonusWrong"); scrollToHint();
  setTimeout(() => {
    if (G.b !== b) return;
    flipAll(() => b.slots.forEach((W, i) => { if (!W.locked) { W.el.classList.remove("bad"); setSlot(i, null); toHome(W); } }));
    G.phase = "bonus"; bonusTools();
  }, reduceMotion ? 300 : 900);
}
// Out of tries: every gap gets its right word (amber), then the result.
function bonusReveal() {
  const b = G.b;
  flipAll(() => {
    b.slots.forEach((W, i) => { if (W && !W.locked) { W.el.classList.remove("bad"); setSlot(i, null); toHome(W); } });
    b.ans.forEach((t, i) => {
      if (b.slots[i]) return;
      const W = b.words.find(w => w.slot < 0 && w.t.toLowerCase() === t.toLowerCase());
      if (W) { leaveHome(W); setSlot(i, W); W.locked = true; W.el.classList.add("shown"); }
    });
  });

}
function bonusFinish(pts, ok) {

  card.classList.add("done");

// The result bar: the points, a speaker and See results. The finished sentence is read aloud at once.
function showBonusReveal() {

/* ---------- Tap & drag ---------- */
let drag = null;
stage.addEventListener("pointerdown", e => {
  const el = e.target.closest(".w"); if (!el || !el.__w || G.phase !== "bonus" || el.__w.locked || e.button > 0) return;
  e.preventDefault();
  drag = { W: el.__w, x0: e.clientX, y0: e.clientY, on: false, hot: -1 };
  el.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", e => {
  if (!drag) return;
  const W = drag.W, el = W.el, b = G.b;
  if (!drag.on) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 7) return;
    const rc = el.getBoundingClientRect();
    drag.on = true; drag.ox = drag.x0 - rc.left; drag.oy = drag.y0 - rc.top;
    if (W.slot < 0) leaveHome(W); else b.slotEls[W.slot].classList.remove("filled");
    el.style.width = rc.width + "px"; el.classList.add("drag"); sqStart(el, e.clientX, e.clientY);
  }
  let x = e.clientX - drag.ox, y = e.clientY - drag.oy;
  drag.hot = slotAt(e.clientX, e.clientY);
  // Magnet: near a free slot the word is pulled part of the way into it.
  if (drag.hot >= 0) {
    const r = b.slotEls[drag.hot].getBoundingClientRect(), tx0 = r.left + r.width / 2 - el.offsetWidth / 2, ty0 = r.top + r.height / 2 - el.offsetHeight / 2;
    const f = Math.max(0, 1 - Math.hypot(tx0 - x, ty0 - y) / 110) * .55;
    x += (tx0 - x) * f; y += (ty0 - y) * f;
  }
  el.style.left = x + "px"; el.style.top = y + "px"; sqMove(x, y);   // squash and stretch: 24-squash.js
  b.slotEls.forEach((s, i) => s.classList.toggle("hot", i === drag.hot));
});
function endDrag(e) {
  if (!drag) return;
  const d = drag, W = d.W, b = G.b; drag = null;
  if (!d.on) { if (e.type === "pointerup") tapWord(W); return; }
  b.slotEls.forEach(s => s.classList.remove("hot"));
  const wasHome = W.slot < 0;
  flipAll(() => {
    sqEnd(W.el); W.el.classList.remove("drag"); W.el.style.left = W.el.style.top = W.el.style.width = "";
    if (W.slot >= 0) b.slotEls[W.slot].classList.add("filled");

    else if (d.hot < 0) { if (W.slot >= 0) moveRaw(W, -1); else toHome(W); }
  });

}
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
/* Safety nets for this drag (2026-11-22, from Question Bubbles: on computers, a MacBook among them, a dragged bubble
   could stay stuck on its target when the browser never reported the release, e.g. let go outside the window). A mouse
   move with no button held = the drop (a release is sent); a new mouse press or the window losing focus = back. */
(function () {
  function fire(type, e) { stage.dispatchEvent(new PointerEvent(type, { bubbles: true, clientX: e ? e.clientX : 0, clientY: e ? e.clientY : 0, pointerId: e ? e.pointerId : (drag.id || 1), pointerType: "mouse" })); }

  document.addEventListener("pointermove", function (e) { if (drag && e.pointerType === "mouse" && !e.buttons) fire("pointerup", e); }, true);
  document.addEventListener("pointerdown", function (e) { if (e.pointerType === "mouse") back(e); }, true);

stage.addEventListener("click", e => { if (e.detail !== 0) return; const el = e.target.closest(".w"); if (el && el.__w) tapWord(el.__w); });
// Index of the free slot nearest the pointer when it is over the sentence, or -1.
function slotAt(x, y) {
  const b = G.b, box = b.ansBox.getBoundingClientRect(), m = 30;

  let best = -1, bd = Infinity;

    if (b.slots[i] && b.slots[i].locked) return;

/* 12-judge.js — Right or wrong? At levels with "judge": n in levels.json (B1), after the bonus round: n sentences or
   short paragraphs from src/data/judge/<LEVEL>.json, one at a time. The player says whether the articles are right;
   then the mistake is corrected in place (struck out → right word) or the key words are marked, with why in English
   and Portuguese and a link to the rule in the Guide. JUDGE_PTS for each right answer.
   Markup in "en": [x>y] = the mistake x and its correction y (either may be empty: a missing or an extra article; take
   the next word along when the capital moves: [The life>Life]); [x] = in a right sentence, the words to mark afterwards;
   [_] = a place where an article could go but nothing does. Before the answer, every article is marked in its colour
   and every empty place (a [_] or a missing article) shows as the same purple Ø, so neither gives the answer away.
   A sentence is wrong when it has an [x>y]. */
const JUDGE_PTS = 1;
const JUDGE_SCROLL_MS = 400;   // pause after an answer before the page scrolls to the why and Next
const JMARK = /\[([^\]>]*)(?:>([^\]]*))?\]/g;
const SLOT = "_", GAP_HTML = '<mark class="ja ja-0" title="no article">Ø</mark>';
function judgeDue() { if (G.mode === "fav") return G.favs.J.length > 0; return G.mode === "normal" && (DATA.levels[G.level] || {}).judge > 0 && (DATA.judge[G.level] || []).length > 0; }
const judgeWrong = s => /\[[^\]]*>/.test(s.en);
// The text as plain words: before = the version to judge, else the corrected one.
function judgePlain(s, before) { return tidy(s.en.replace(JMARK, (m, x, y) => x === SLOT ? "" : before || y === undefined ? x : y)); }
// Every a / an / the in a piece of text, marked in its class colour (all of them, so the mark gives nothing away).
const artMarks = str => esc(str).replace(/\b(an?|the)\b/gi, (w) => '<mark class="ja ' + (/^the$/i.test(w) ? "ja-the" : "ja-a") + '">' + w + "</mark>");

// correction, or the key words marked.
function judgeHTML(s, after) {

  const plain = after ? esc : artMarks;
  JMARK.lastIndex = 0;
  while ((m = JMARK.exec(s.en))) {
    const x = m[1], y = m[2];
    out += plain(s.en.slice(last, m.index));
    if (x === SLOT) { if (!after) out += GAP_HTML; last = JMARK.lastIndex; continue; }
    if (!after) out += x ? artMarks(x) : GAP_HTML;   // a missing article looks like any other Ø
    else if (y === undefined) out += '<mark class="jk">' + esc(x) + "</mark>";
    else out += (x ? '<s class="jx">' + esc(x) + "</s> " : "") + (y ? '<b class="jy">' + esc(y) + "</b>" : '<b class="jy jz" title="nothing">Ø</b>');
    last = JMARK.lastIndex;

}
function startJudge() {
  const n = DATA.levels[G.level].judge || 4;
  G.r = G.b = G.m = null; G.xi = 3; G.phase = "judge";
  G.j = { items: orderPool(G.mode === "fav" ? G.favs.J : DATA.judge[G.level]).slice(0, n), k: 0, res: [] };
  revealEl.hidden = true; revealEl.innerHTML = ""; toolsEl.hidden = true;
  hideGloss(); renderJudge(); updateProgress();
  hintEl.innerHTML = tx("judgeIntro");
  stage.classList.remove("out"); if (!reduceMotion) flash(stage, "rise");
  sndShuffle();
}
function renderJudge() {
  const J = G.j, s = J.items[J.k];
  card.className = "card judgecard";
  card.innerHTML = '<span class="tag">★ ' + esc(tx("judgeTag")) + "</span>" +
    '<div class="jd-pips" aria-hidden="true">' + J.items.map((_, n) => '<i class="' + (n < J.k ? (J.res[n].ok ? "ok" : "bad") : n === J.k ? "on" : "") + '"></i>').join("") + "</div>" +
    '<p class="jd-s" lang="en">' + judgeHTML(s, false) + "</p>" +
    '<div class="jd-btns"><button type="button" class="jd-b yes" data-v="1"><kbd>1</kbd> ✓ ' + esc(tx("judgeRight")) + '</button>' +
    '<button type="button" class="jd-b no" data-v="0"><kbd>2</kbd> ✗ ' + esc(tx("judgeWrong")) + "</button></div>" +
    '<div class="jd-fb" hidden></div>';
  if (J.k) hintEl.innerHTML = tx("judgeAsk");
}
// The player's answer: v = true for "Right".
function judgeAnswer(v) {
  const J = G.j; if (G.phase !== "judge") return;
  const s = J.items[J.k], wrong = judgeWrong(s), ok = v === !wrong, last = J.k === J.items.length - 1, pt = explainPt();
  J.res.push({ s, ok, pick: v });
  G.phase = last ? "done" : "jwait";
  if (ok) { G.score += JUDGE_PTS; G.streak++; sndOk(Math.min(G.streak - 1, 6) * 2); flash(scoreEl, "up"); toast(tx("judgeYes"), ""); }
  else { G.streak = 0; sndBad(); flash(card, "shake"); toast(tx("judgeNo"), "zero"); }
  showScore(); showCombo();
  recordProgress(s.id, ok ? 2 : 0); recordUses([s.rule], [ok]);
  card.querySelectorAll(".jd-b").forEach(b => {
    b.disabled = true;
    if ((b.dataset.v === "1") === !wrong) b.classList.add("ok"); else if ((b.dataset.v === "1") === v) b.classList.add("bad");
  });

// While a text reads itself (A1): only as far as the result bar and the top of the first explanation (PEEK px), with

const PEEK = 90;

// focus = a rule key to open, scroll to and flash. Opened that way (from an explanation or a rule chip), a "Back"

// The rule the Guide was sent to (from an explanation or a rule chip) stays highlighted until the Guide is opened

$("guidebtn").addEventListener("click", () => openGuide());

/* 15-progress.js — what the player has done, across games, and the daily streak.
   art-prog = {id: [attempts, lastStatus, time]} (texts and bonus sentences): status 2 = perfect on the first check
   ("mastered"), 1 = all right on a later check, 0 = some answers still wrong.
   art-uses = {rule: [answers, right]}: first-check accuracy for each rule (rules.json "rules"), from games and quick-fire.
   art-days = "YYYY-MM-DD|days in a row". */
function getJSON(k) { try { const o = JSON.parse(load(k)); return o && typeof o === "object" ? o : {}; } catch (e) { return {}; } }
function getProg() { return getJSON("art-prog"); }
function recordProgress(id, status) {
  const p = getProg(), o = p[id] || [0, 0, 0];
  p[id] = [o[0] + 1, status, Date.now()]; store("art-prog", JSON.stringify(p));
}
// A level's texts (or bonus sentences) in play order: never seen (random), then wrong last time, then not yet perfect, then mastered (oldest first).
function orderPool(list) {
  const p = getProg(), grp = t => { const o = p[t.id]; return !o ? 0 : o[1] === 0 ? 1 : o[1] === 1 ? 2 : 3; };
  const time = t => (p[t.id] || [0, 0, 0])[2];
  return shuffle(list.slice()).sort((a, b) => grp(a) - grp(b) || time(a) - time(b));
}
// Mastered / total texts at a level.
function mastery(level) {
  const p = getProg(), list = DATA.texts[level];
  return { m: list.filter(t => p[t.id] && p[t.id][1] === 2).length, n: list.length };
}
// One level's meter: label, bar, "3 / 5".
function meterHTML(level) {
  const x = mastery(level);
  return '<div class="meter" style="' + lvVars(level) + '"><b>' + esc(lvName(level)) + '</b><div class="pbar"><i style="width:' + (x.m / x.n * 100).toFixed(1) + '%"></i></div><span>' + x.m + " / " + x.n + "</span></div>";
}

/* ---------- Accuracy per rule ---------- */
// rules = each spot's rule (rules.json key), ok = right on the first check.
function recordUses(rules, ok) {
  const s = getJSON("art-uses");
  rules.forEach((u, i) => { const o = s[u] || [0, 0]; s[u] = [o[0] + 1, o[1] + (ok[i] ? 1 : 0)]; });
  store("art-uses", JSON.stringify(s));
}
// Chips "Jobs: what someone is 7/8", one per rule in stats {rule: [n, right]}, weakest first; weak = only the WEAK_MAX
// weakest under WEAK_PCT. Tap one to open the Guide there.
const WEAK_MAX = 3, WEAK_PCT = .8;
function usesHTML(stats, weak) {
  let ks = Object.keys(DATA.rules.rules).filter(k => stats[k] && stats[k][0]);
  ks.sort((a, b) => stats[a][1] / stats[a][0] - stats[b][1] / stats[b][0]);
  if (weak) ks = ks.filter(k => stats[k][1] / stats[k][0] < WEAK_PCT).slice(0, WEAK_MAX);
  return ks.map(k => {
    const R = DATA.rules.rules[k], s = stats[k], pct = s[1] / s[0];
    return '<button type="button" class="chip usechip' + (pct < .6 ? " weak" : "") + '" data-rule="' + k + '" style="--h:' + R.hue + '" title="' + esc(R.name + " · " + R.namePt) + '">' +
      esc(ruleName(k, nativeUi())) + " " + s[1] + "/" + s[0] + "</button>";
  }).join("");
}
document.addEventListener("click", e => { const b = e.target.closest(".usechip"); if (b) openGuide(b.dataset.rule, b); });

/* ---------- Daily streak ---------- */
function dayStr(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dayState() {
  const [d, n] = (load("art-days") || "|0").split("|"), y = new Date(); y.setDate(y.getDate() - 1);
  return { d, n: +n || 0, today: dayStr(new Date()), yest: dayStr(y) };
}
// Days in a row, counting today or yesterday (the streak is still alive until a day is skipped).
function getDays() { const s = dayState(); return s.d === s.today || s.d === s.yest ? s.n : 0; }
// Called when a text is finished: the first one of the day extends (or restarts) the streak.
function tickDay() {
  const s = dayState(); if (s.d === s.today) return;
  store("art-days", s.today + "|" + (s.d === s.yest ? s.n + 1 : 1)); showDays();
}
function showDays() { const n = getDays(), el = $("days"); el.hidden = n < 2; el.textContent = "🔥 " + n; el.title = n + " days in a row"; }

/* 16-gloss.js — words with a dotted line in the text show their Portuguese meaning on hover or tap. Meanings come from
   the text's own "w" (src/data/texts/*.json); keys can be several words ("of course") and match in any case.
   The article gaps have none (a tap moves them round the cycle). */
const glossEl = document.createElement("div");
glossEl.className = "glosstip"; glossEl.setAttribute("role", "tooltip"); glossEl.hidden = true;
document.body.appendChild(glossEl);
let glossFor = null, glossTimer = 0, lastPointer = "mouse";

// One regex per text for its glossary keys, longest first.
function glossRe(t) {
  if (t._gre !== undefined) return t._gre;
  const ks = Object.keys(t.w || {}).sort((a, b) => b.length - a.length).map(k => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  return (t._gre = ks.length ? new RegExp("\\b(" + ks.join("|") + ")\\b", "gi") : null);
}
// Text s as HTML, its glossary words wrapped in .gw.
function glossWrap(s, t) {
  const re = glossRe(t); if (!re) return esc(s);
  let out = "", last = 0, m;
  re.lastIndex = 0;
  while ((m = re.exec(s))) { out += esc(s.slice(last, m.index)) + '<span class="gw" data-g="' + esc(m[1].toLowerCase()) + '">' + esc(m[1]) + "</span>"; last = re.lastIndex; }
  return out + esc(s.slice(last));
}
function glossOf(k) { return (G.r && (G.r.t.w || {})[Object.keys(G.r.t.w || {}).find(x => x.toLowerCase() === k)]) || ""; }
// The glossed word under an event, or null.
function glossTarget(e) { return e.target.closest ? e.target.closest(".gw") : null; }
// Show the meaning just above the word (below it near the top of the screen); linger = hide by itself after a moment.
// A phrase that wraps onto two lines has one box per line: use the line the pointer is on (x, y), else the first one
// (its whole bounding box spans both lines, which put the tip far from the word).
function showGloss(el, linger, x, y) {
  const g = glossOf(el.dataset.g); clearTimeout(glossTimer);
  if (!g) return hideGloss();
  if (glossFor && glossFor !== el) glossFor.classList.remove("on");
  glossEl.innerHTML = ptBadge() + '<span lang="pt">' + esc(g) + "</span>";
  glossEl.style.left = glossEl.style.top = "0px";   // measure at the left edge: at its old place it could be squeezed narrower
  glossEl.hidden = false; glossFor = el; el.classList.add("on");
  const rs = [...el.getClientRects()], hit = x != null && rs.find(r => x >= r.left - 2 && x <= r.right + 2 && y >= r.top - 2 && y <= r.bottom + 2);
  const b = hit || rs[0] || el.getBoundingClientRect(), t = glossEl.getBoundingClientRect(), below = b.top - t.height - 10 < 8;
  glossEl.style.left = Math.min(Math.max(b.left + b.width / 2 - t.width / 2, 8), innerWidth - t.width - 8) + "px";
  glossEl.style.top = (below ? b.bottom + 10 : b.top - t.height - 10) + "px";
  if (linger) glossTimer = setTimeout(hideGloss, 2600);
}
function hideGloss() { clearTimeout(glossTimer); glossEl.hidden = true; if (glossFor) glossFor.classList.remove("on"); glossFor = null; }

// Mouse: hovering shows the meaning. Tap or click: the meaning (for a moment on touch).
card.addEventListener("pointerover", e => { const g = glossTarget(e); if (g && e.pointerType === "mouse") showGloss(g, false, e.clientX, e.clientY); });
card.addEventListener("pointerout", e => { const g = glossTarget(e); if (g && g === glossFor && e.pointerType === "mouse" && !g.contains(e.relatedTarget)) hideGloss(); });
card.addEventListener("click", e => { const g = glossTarget(e); if (g) showGloss(g, lastPointer !== "mouse", e.clientX, e.clientY); });
document.addEventListener("pointerdown", e => { lastPointer = e.pointerType; if (!glossTarget(e)) hideGloss(); }, true);
addEventListener("scroll", hideGloss, true); addEventListener("resize", hideGloss);

/* 17-meaning.js — Which meaning? At levels with "meaning": n in levels.json (B2), after the texts: n pairs from
   src/data/meaning/<LEVEL>.json, one at a time. A pair is two sentences one article apart (He went to prison / He
   went to the prison), each with its meaning. The card shows one meaning (picked at random) and the two sentences as
   answers; the player picks the one that means it (keys 1 / 2). Then each sentence shows its meaning, with why.
   MEAN_PTS for each right answer. Markup in "a" / "b" as in Right or wrong: [_] = an empty place (shown as Ø). */
const MEAN_PTS = 1;
function meaningDue() { return G.mode === "normal" && (DATA.levels[G.level] || {}).meaning > 0 && (DATA.meaning[G.level] || []).length > 0; }
function startMeaning() {
  const n = DATA.levels[G.level].meaning;
  G.r = G.b = G.j = null; G.xi = 2; G.phase = "meaning";
  G.m = { items: orderPool(DATA.meaning[G.level]).slice(0, n).map(s => ({ s, ask: Math.random() < .5 ? 0 : 1 })), k: 0, res: [] };
  revealEl.hidden = true; revealEl.innerHTML = ""; toolsEl.hidden = true;
  hideGloss(); renderMeaning(); updateProgress();
  hintEl.innerHTML = tx("meaningIntro");
  stage.classList.remove("out"); if (!reduceMotion) flash(stage, "rise");
  sndShuffle();
}
// Sentence k (0 = a, 1 = b) with its articles marked and its empty places as Ø; its meaning in English or Portuguese.
const meanSent = (s, k) => judgeHTML({ en: k ? s.b : s.a }, false);
const meanText = (s, k, pt) => pt ? (k ? s.mbPt : s.maPt) : (k ? s.mb : s.ma);
function renderMeaning() {
  const M = G.m, it = M.items[M.k], s = it.s;
  card.className = "card judgecard meancard";
  card.innerHTML = '<span class="tag">★ ' + esc(tx("meaningTag")) + "</span>" +
    '<div class="jd-pips" aria-hidden="true">' + M.items.map((_, n) => '<i class="' + (n < M.k ? (M.res[n].ok ? "ok" : "bad") : n === M.k ? "on" : "") + '"></i>').join("") + "</div>" +
    '<p class="mn-q">' + esc(tx("meaningAsk")) + '</p><p class="mn-m" lang="en">' + esc(meanText(s, it.ask, false)) + '</p><p class="mn-mpt" lang="pt">' + esc(meanText(s, it.ask, true)) + "</p>" +
    '<div class="mn-btns">' + [0, 1].map(k => '<button type="button" class="jd-b mn-b" data-v="' + k + '"><kbd>' + (k + 1) + '</kbd> <span lang="en">' + meanSent(s, k) + "</span></button>").join("") + "</div>" +
    '<div class="jd-fb" hidden></div>';
  if (M.k) hintEl.innerHTML = tx("meaningAsk");
}
// The player's answer: v = the sentence picked (0 / 1).
function meaningAnswer(v) {
  const M = G.m; if (G.phase !== "meaning") return;
  const it = M.items[M.k], s = it.s, ok = v === it.ask, last = M.k === M.items.length - 1, pt = explainPt();
  M.res.push({ s, ok, pick: v, ask: it.ask });
  G.phase = last ? "done" : "mwait";
  if (ok) { G.score += MEAN_PTS; G.streak++; sndOk(Math.min(G.streak - 1, 6) * 2); flash(scoreEl, "up"); toast(tx("judgeYes"), ""); }
  else { G.streak = 0; sndBad(); flash(card, "shake"); toast(tx("judgeNo"), "zero"); }
  showScore(); showCombo();
  recordProgress(s.id, ok ? 2 : 0); recordUses([s.rule], [ok]);
  // Each sentence now shows its meaning; the right one green, a wrong pick red.
  card.querySelectorAll(".mn-b").forEach(b => {
    const k = +b.dataset.v; b.disabled = true;
    b.classList.add(k === it.ask ? "ok" : k === v ? "bad" : "dim");
    b.insertAdjacentHTML("beforeend", '<small class="mn-means">= ' + esc(meanText(s, k, pt)) + "</small>");
  });
  const pip = card.querySelector(".jd-pips .on"); if (pip) { pip.classList.remove("on"); pip.classList.add(ok ? "ok" : "bad"); }
  const R = DATA.rules.rules[s.rule] || {}, two = (en, p) => pt ? '<p lang="pt">' + artTxt(p) + "</p>" : "<p>" + artTxt(en) + "</p>";   // the level's explanation language only
  const fb = card.querySelector(".jd-fb");
  fb.innerHTML = '<div class="jd-head"><b class="' + (ok ? "ok" : "bad") + '">' + (ok ? "✓ " : "✗ ") + esc(tx(ok ? "judgeYes" : "judgeNo")) + "</b>" +
    (R.name ? '<button type="button" class="ex-use" data-rule="' + esc(s.rule) + '" style="--h:' + R.hue + '">' + esc(ruleName(s.rule, pt)) + "</button>" : "") + "</div>" +
    '<div class="jd-why">' + two(s.why, s.whyPt) + "</div>" +
    (last ? "" : '<div class="jd-next"><button type="button" class="cta pulse" id="mnext">' + esc(tx("next")) + " &rarr;</button></div>");
  fb.hidden = false;
  if (!reduceMotion) flash(fb, "in");
  hintEl.innerHTML = "";
  if (last) { G.meaning = { res: M.res, pts: M.res.filter(x => x.ok).length * MEAN_PTS }; setTimeout(() => { if (G.m === M) showMeaningReveal(); }, reduceMotion ? 0 : 400); }
  else {
    setTimeout(() => { const b = $("mnext"); if (b) b.focus({ preventScroll: true }); }, 50);
    // Then down to the why and Next, with as much of the two meanings above them as fits (as in Right or wrong).
    const k = M.k; setTimeout(() => { if (G.m === M && M.k === k) scrollToReveal(fb); }, reduceMotion ? 0 : JUDGE_SCROLL_MS);
  }
}
function meaningNext() {
  const M = G.m; if (G.phase !== "mwait") return;
  M.k++; G.phase = "meaning"; stopSpeech();
  renderMeaning(); updateProgress(); scrollUpTo(hintEl);
  if (!reduceMotion) flash(stage, "rise");
}
// After the last pair: the round's score and the button to what comes next.
function showMeaningReveal() {
  const k = G.meaning.res.filter(x => x.ok).length, n = G.meaning.res.length;
  revealEl.innerHTML = '<div class="rv-bar"><div class="rv-head"><b class="rv-score">' + esc(tx("meaningScore", { k, n })) + " · +" + G.meaning.pts + "</b></div>" +
    '<div class="rv-act"><button type="button" class="cta pulse" id="next">' + tx(nextLabel()) + " &rarr;</button></div></div>";
  revealEl.hidden = false;
  $("next").addEventListener("click", nextRound);
  $("next").focus({ preventScroll: true });
  const M = G.m; setTimeout(() => { if (G.m === M && !revealEl.hidden) scrollToReveal(); }, reduceMotion ? 0 : JUDGE_SCROLL_MS);
}
// End screen: the sentence asked about and its meaning.
function meaningItemHTML(x) {
  return '<li class="' + (x.ok ? "" : "miss") + '"><span class="ri">' + (x.ok ? "&#10003;" : "&#10007;") + "</span>" +
    '<div class="rs"><div>' + esc(judgePlain({ en: x.ask ? x.s.b : x.s.a })) + '</div><div class="rt">= ' + esc(meanText(x.s, x.ask, nativeUi())) + " · " + esc(ruleName(x.s.rule, nativeUi())) + "</div></div>" +
    '<span class="rp">+' + (x.ok ? MEAN_PTS : 0) + "</span></li>";
}
card.addEventListener("click", e => {
  if (!G.m) return;
  const b = e.target.closest(".mn-b"), use = e.target.closest(".ex-use");
  if (b) return meaningAnswer(+b.dataset.v);
  if (use) return openGuide(use.dataset.rule, use);
  if (e.target.closest("#mnext")) meaningNext();
});
// Keys: 1 / 2 = the sentence, Enter = next pair.
document.addEventListener("keydown", e => {
  if (!G.m || e.ctrlKey || e.metaKey || e.altKey || document.querySelector(".favmodal.show") || !$("tour").hidden) return;
  if (G.phase === "meaning" && (e.key === "1" || e.key === "2")) { e.preventDefault(); meaningAnswer(+e.key - 1); }
  else if (G.phase === "mwait" && e.key === "Enter" && !(e.target.closest && e.target.closest("button:not(#mnext)"))) { e.preventDefault(); meaningNext(); }
});

/* 18-proof.js — Proofreading. At levels with "proof" in levels.json (B2), the last round: a short text from
   src/data/proof/<LEVEL>.json in which every place an article could go is a bubble already showing what the writer
   put (Ø where they put nothing), and 2–3 of them are wrong. The player taps the wrong ones round the cycle to the
   right word and presses Check. The rest is a text round (10-game.js): tries, "count" feedback, explanations. Only
   the mistakes score (PTS_FIRST / PTS_LATER), and only they (and spots the player broke) are explained.
   Markup: as in texts, plus [the>0:general] = the text says "the", the right answer is Ø (rule general). */
// A Favorites game plays one favorite proofreading text (the least recently practised).
function proofDue() { if (G.mode === "fav") return G.favs.F.length > 0; return G.mode === "normal" && (DATA.levels[G.level] || {}).proof > 0 && (DATA.proof[G.level] || []).length > 0; }
function startProof() {
  const t = orderPool(G.mode === "fav" ? G.favs.F : DATA.proof[G.level])[0], P = parsed(t), start = P.spots.map(sp => sp.shown);
  // hinted: true = no Clues here, whatever the level allows.
  G.r = { t, P, level: levelOf(t), st: start.slice(), start, proof: true, lock: P.spots.map(() => false), first: null, tries: 0, hinted: true };
  G.b = G.j = G.m = null; G.xi = 4; G.phase = "play";
  revealEl.hidden = true; revealEl.innerHTML = "";
  toolsEl.classList.remove("bonus"); toolsEl.hidden = false;
  hideGloss(); renderCard();
  card.classList.add("proofcard");
  card.querySelector(".tag").textContent = "✎ " + tx("proofTag");
  P.spots.forEach((sp, i) => { paintSpot(G.r.spotEls[i], sp, start[i]); capWord(i, start[i]); });
  renderTools(); updateProgress();
  hintEl.innerHTML = tx("proofIntro");
  stage.classList.remove("out"); if (!reduceMotion) flash(stage, "rise");
  sndShuffle();
}

/* 19-clues.js — the Clues hint. Before the first check it lights every clue word of the text ({…} in the data); after
   a check that found mistakes, only the clue words of the gaps that were wrong, and for a wrong gap with no clue words,
   its noun phrase (the words right after it, wrapped in .np by lineHTML in 10-game.js) with the "which kind?" question. */
// How much of s (text after a gap, n0 words of its phrase already taken) belongs to the gap's noun phrase: words up to
// NP_MAX, stopping at punctuation or a word that starts something new (of, is, she, today, don't…). The first word is
// always taken (my mom, next week). Returns { end, n, stop }.
const NP_MAX = 3;
const NP_STOP = new Set(("of in on at to for from with by about near into than and or but so because when where while who which that whose " +
  "is are was were be been has have had do does did will would can could should may might must " +
  "i you he she it we they me him her us them my your his its our their this these those a an the " +
  "every each all some any not also always never often still too very really finally almost just only even " +
  "today tonight tomorrow yesterday now ago last next before after early late once twice one two three home up out over as like such then upstairs downstairs " +
  "says said say shines came come comes go goes went drink drinks eat eats sleep think thinks believe feel feels live lives care cares got get gets " +
  "moved drove brought finds wins becomes matters makes make know knows speak speaks called named support supports").split(" "));
function nounLen(s, n0) {
  const re = /\s*((?:Mrs?|Ms|Dr|St)\.|[\p{L}\p{N}'’-]+)/uy; let end = 0, n = 0, m;
  while (n0 + n < NP_MAX && (m = re.exec(s))) {
    const w = m[1].toLowerCase();
    if (n0 + n && (NP_STOP.has(w) || /n['’]t$|['’](ve|ll|re|m|d)$|^(it|that|he|she|there|what)['’]s$/.test(w))) return { end, n, stop: true };
    end = re.lastIndex; n++;
  }
  return { end, n, stop: !m && /\S/.test(s.slice(end)) };
}
// The clue words a hint lights: all of them before the first check; after it, only those of the gaps it found wrong.
function hintClues(r) {
  return r.wrong ? [...new Set(r.wrong.flatMap(i => r.P.spots[i].clues))] : r.P.clues.map((c, k) => k);
}
// After a check: the missed gaps with no clue words of their own (Clues light their noun phrase instead).
const hintNouns = r => r.wrong ? r.wrong.filter(i => !r.P.spots[i].clues.length) : [];
const hintAny = r => hintClues(r).length + hintNouns(r).length > 0;
// Clues: light up the words that decide (one hint per text, from the game's pool).
function useHint() {
  const r = G.r; if (G.phase !== "play" || !G.hintsLeft || r.hinted) return;
  r.hinted = true; G.hintsLeft--; sndHint();
  const words = hintClues(r), nouns = hintNouns(r);
  words.forEach(c => { const el = card.querySelector('.clue[data-c="' + c + '"]'); if (el) el.classList.add("lit"); });
  nouns.forEach(i => card.querySelectorAll('.np[data-i="' + i + '"]').forEach(el => el.classList.add("lit")));

/* 20-end.js — end-of-game modal: score, stars (text points only), hint bonus, bonus round, Right or wrong, Portuguese

const endModal = $("endmodal");
function stars(n) { return [0, 1, 2].map(i => '<span class="' + (i < n ? "" : "off") + '">&#9733;</span>').join(""); }
function showEnd() {
  stopSpeed(); G.phase = "over";
  const speed = G.mode === "speed", done = G.results.length, pool = hintPool();
  // Stars come from the texts only (not proofreading); the total counts everything.
  const texts = G.results.filter(x => !x.proof), pts = texts.reduce((s, x) => s + x.pts, 0), max = G.results.reduce((s, x) => s + x.max, 0);
  const tmax = texts.reduce((s, x) => s + x.max, 0), pct = tmax ? pts / tmax : 0, n = pct >= .85 ? 3 : pct >= .6 ? 2 : pct >= .35 ? 1 : 0;
  // Unused hints become bonus points (not in quick-fire, where time is the pressure).

  $("endmsg").textContent = speed ? tx("inSeconds", { x: sc + " / " + done, s: SPEED_SECS }) : tx("msg" + n);
  $("endsub").textContent = !key ? tx("noSave") :

  if (G.judge) extras.push(tx("judgeRound", { r: G.judge.res.filter(x => x.ok).length + "/" + G.judge.res.length }));

  const days = getDays();
  $("endprog").innerHTML = speed ? "" : meterHTML(G.level) + '<span class="psub">' + tx("mastered", { lvl: esc(lvName(G.level)) }) + (days >= 2 ? tx("daysRow", { n: days }) : "") + "</span>";
  $("endlist").innerHTML = G.results.map(x => x.sp ? speedItemHTML(x) : textItemHTML(x)).join("") + (G.bonus ? bonusItemHTML(G.bonus) : "") + (G.meaning ? G.meaning.res.map(meaningItemHTML).join("") : "") + (G.judge ? G.judge.res.map(judgeItemHTML).join("") : "");

  $("endcopy").textContent = tx("copy");

}
// [traps in this game, right on the first check] (texts and quick-fire).
function trapsBeaten() {
  return G.results.reduce((a, x) => x.traps ? [a[0] + x.traps[0], a[1] + x.traps[1]] : x.sp && isTrap(x.sp.rule) ? [a[0] + 1, a[1] + (x.ok ? 1 : 0)] : a, [0, 0]);

function resultsText() {
  const d = new Date().toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }), u = gameUses(), tr = trapsBeaten();

  if (tr[0]) lines.push("Portuguese traps: " + tr[1] + "/" + tr[0]);
  G.results.forEach(x => {
    if (x.sp) return lines.push((x.ok ? "✓ " : "✗ ") + sentPlain(x.P, x.i) + (x.ok ? "" : " (chose: " + choiceName(x.sp, x.pick, false) + ")"));
    lines.push((x.perfect ? "★ " : x.allRight ? "✓ " : "✗ ") + (x.proof ? "Proofreading: " : "") + x.t.title + " (" + x.k + "/" + x.n + ")");

function copyText(t) {

/* 21-lists.js — favorites and seen texts. A star sits on every finished text, bonus sentence, Right-or-wrong sentence,
   proofreading text and quick-fire sentence (in the results); the header buttons open a list modal: Favorites, or Seen (Recent / Missed,
   with progress meters and accuracy for each rule).
   Stored in localStorage as JSON arrays, newest first: art-fav = [{id}], art-seen = [{id, st}] (st = status, see 15-progress.js).
   Favorite ids: a text ("a1-03"), a quick-fire sentence ("a1-03#2" = gap 2 of that text), a bonus sentence ("a1-b04")
   a Right-or-wrong sentence ("b1-j07") or a proofreading text ("b2-f03"). "Missed" = not perfect on the first check. */
const SEEN_MAX = 60;
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.2 2.7 5.5 6 .9-4.35 4.25 1 6L12 17l-5.4 2.85 1-6L3.3 9.6l6-.9z" stroke-linejoin="round"/></svg>';

Object.keys(DATA.bonus).forEach(l => DATA.bonus[l].forEach(s => { BONUS[s.id] = s; }));
Object.keys(DATA.judge || {}).forEach(l => DATA.judge[l].forEach(s => { JUDGE[s.id] = s; }));
Object.keys(DATA.proof || {}).forEach(l => DATA.proof[l].forEach(t => { PROOF[t.id] = t; }));
// What an id is: "text", "sent" (one gap of a text), "bonus", "judge", "proof", or null (gone from the data).
function favKind(id) {
  if (TEXTS[id]) return "text";
  if (BONUS[id]) return "bonus";
  if (JUDGE[id]) return "judge";
  if (PROOF[id]) return "proof";
  const m = /^(.+)#(\d+)$/.exec(id || "");

}
function sentId(t, i) { return t.id + "#" + i; }
// A favorite sentence as a quick-fire item: { t, P, sp, i }.
function sentItem(id) { const m = /^(.+)#(\d+)$/.exec(id), t = TEXTS[m[1]], P = parsed(t), i = +m[2]; return { t, P, sp: P.spots[i], i }; }

function setList(k, a) { store(k, JSON.stringify(a)); }
function isFav(id) { return getList("art-fav").some(x => x.id === id); }
function toggleFav(id) {
  const a = getList("art-fav"), on = !a.some(x => x.id === id), b = a.filter(x => x.id !== id);
  if (on) b.unshift({ id }); setList("art-fav", b); return on;
}
function markSeen(id, st) {
  const a = getList("art-seen").filter(x => x.id !== id); a.unshift({ id, st }); setList("art-seen", a.slice(0, SEEN_MAX));
}
function favBtn(id) {

}
// Any star anywhere: toggle, then sync every star for the same id.
document.addEventListener("click", e => {
  const b = e.target.closest(".favstar"); if (!b) return;
  const on = toggleFav(b.dataset.id);
  document.querySelectorAll('.favstar[data-id="' + b.dataset.id + '"]').forEach(s => { s.classList.toggle("on", on); s.setAttribute("aria-pressed", on); });
  favFx(b, on);
});
/* Favoriting (as in Be Do Modal): the star and the header Favorites button wobble; a new favorite also gets a chime
   and gold sparks flying from the star, above the windows. */
function favFx(b, on) {
  flash(b, "pop"); flash($("favbtn"), "pop");
  if (!on) { sndBack(); return; }
  sndFav();
  if (reduceMotion) return;
  const r = b.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  for (let i = 0; i < 12; i++) {
    const a = rnd(0, 6.283), d = rnd(26, 56), z = rnd(5, 11), p = document.createElement("i");
    p.className = "pf fx"; p.style.cssText = "left:" + x + "px;top:" + y + "px;width:" + z + "px;height:" + z + "px;--h:" + Math.round(rnd(40, 54)) +
      ";--dx:" + Math.round(Math.cos(a) * d) + "px;--dy:" + Math.round(Math.sin(a) * d * .8 - 10) + "px";

/* ---------- List modal ---------- */

/* ---------- Quick-fire ---------- */

/* 23-shine.js — the bonus words' soap look and its shine (from Conditionals / Be Do Modal, 2026-11-22). SOAP = the spans
   inside every word bubble (14-soap.css): the film (.film: the turning colour .spin, the glow facing the mouse .fg), the
   shine spot (.spot + its brighter core .pl), the rim (.rim: .spin + the bright side .rh) and the small spot (.glint).
   What moves is a bare wrapper whose look is the <i> inside, so only transform / opacity change: nothing is repainted.
   The shine: each visible word's spot stays in its top-left corner and leans a little toward the cursor, the small
   spot moves the other way, the side facing the cursor glows as it nears. With a mouse always; with a finger only
   while a word is carried. Nothing with reduced motion. */

  '<span class="spot" aria-hidden="true"><i></i><i class="pl"><i></i></i></span>' +
  '<span class="rim" aria-hidden="true"><i class="spin"></i><i class="rh"><i></i></i></span><span class="glint" aria-hidden="true"><i></i></span>';

// that animation doesn't also restyle every running animation

}).observe(revealEl, { attributes: true, attributeFilter: ["hidden"] });

  let rcache = null, rlist = null, rtime = 0;

  const RIGHT = 0.07, DOWN = 0.08, LEFT = 0.025, UP = 0.03, NEAR0 = 0.5, FALL = 160;
  const GLOW = 190;     // nearness sk = (GLOW / (distance + GLOW))^2: 1 on the bubble, 1/4 at GLOW px
  const EASE = 0.3;     // share of the way to the target in one 60 fps frame
  const DRAG_SK = 0.45; // while a word is carried, the others keep at least this nearness
  const carried = () => document.querySelector(".w.drag");
  const parts = b => ({ sp: b.querySelector(".spot"), pl: b.querySelector(".spot .pl"), gl: b.querySelector(".glint"), fg: b.querySelector(".fg"), rh: b.querySelector(".rh"), w: {} });

  function put(e, n, p, v) { const key = n + p; if (e.w[key] !== v) { e.w[key] = v; e[n].style[p] = v; } }

    put(e, "pl", "opacity", o);
    put(e, "gl", "transform", "translate(" + (-0.35 * sx).toFixed(1) + "px," + (-0.35 * sy).toFixed(1) + "px) rotate(-45deg)");
    put(e, "gl", "opacity", (0.8 + 0.2 * k).toFixed(3));

    put(e, "fg", "opacity", o);

// While the tutorial or a window (.favmodal) covers the game, everything behind it stands still (body.covered: the
// CSS pauses the loops; the shine above ignores the mouse), so slow phones don't redraw the blur over it every frame
(() => {

/* 24-squash.js — squash and stretch (from Be Do Modal): a carried word stretches along the way it moves, more the
   faster (up to STRETCH longer, as much thinner across), and rounds out as the pointer slows or stops. Let go, it
   wobbles (the `scale` property, so it adds to the FLIP move home and the bob). One frame loop while it moves, writing
   only the carried word's transform (its position is left / top, 11-bonus.js). None with reduced motion.
   While a word is carried every word stops bobbing and turning (body.carrying, 14-soap.css). */
const STRETCH = .2, sq = { el: null, x: 0, y: 0, vx: 0, vy: 0, lt: 0, raf: 0 };
function sqStart(el, x, y) { sq.el = el; sq.vx = sq.vy = 0; sq.x = x; sq.y = y; sq.lt = 0; document.body.classList.add("carrying"); }
function sqMove(x, y) {
  const now = performance.now();
  if (sq.lt) { const dt = Math.max(8, now - sq.lt); sq.vx += ((x - sq.x) / dt - sq.vx) * .5; sq.vy += ((y - sq.y) / dt - sq.vy) * .5; }   // px per ms, smoothed
  sq.x = x; sq.y = y; sq.lt = now;
  if (!sq.raf) sq.raf = requestAnimationFrame(sqTick);
}
function sqTick() {
  sq.raf = 0; if (!sq.el) return;
  const v = Math.hypot(sq.vx, sq.vy), s = reduceMotion ? 0 : Math.min(STRETCH, v * .08);
  let t = "scale(1.1) rotate(-3deg)";   // the carried look at rest (13-bonus.css .w.drag)
  if (s > .004) { const a = (Math.atan2(sq.vy, sq.vx) * 180 / Math.PI).toFixed(1); t = "rotate(" + a + "deg) scale(" + (1.1 * (1 + s)).toFixed(3) + "," + (1.1 / (1 + s)).toFixed(3) + ") rotate(" + (-a) + "deg) rotate(-3deg)"; }
  sq.el.style.transform = t;
  if (performance.now() - sq.lt > 30) { sq.vx *= .8; sq.vy *= .8; }   // the pointer has stopped: round out
  if (s > .004) sq.raf = requestAnimationFrame(sqTick);
}
function sqEnd(el) {
  if (sq.raf) cancelAnimationFrame(sq.raf);
  const v = Math.hypot(sq.vx, sq.vy); sq.raf = 0; sq.el = null;
  document.body.classList.remove("carrying");
  el.style.transform = "";
  if (reduceMotion || !el.animate) return;
  const k = Math.min(1, .35 + v * .6);   // a fuller wobble after a fast move
  el.animate([{ scale: (1 + .07 * k) + " " + (1 - .07 * k) }, { scale: (1 - .045 * k) + " " + (1 + .045 * k) }, { scale: (1 + .02 * k) + " " + (1 - .02 * k) }, { scale: "1 1" }], { duration: 480, easing: "ease-out" });
}

/* ---------- Live cycle demo ---------- */
let demoT = [], demoLive = null;

// The demo sentence(s) (rules.json "demo"; one for now), each with a bubble and a caption, no title.

  background: rgba(8, 12, 36, .62); animation: ebd-fade .25s ease-out;
  font-family: "Fredoka", ui-rounded, system-ui, sans-serif; color: var(--ink, #26385c); text-align: center;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.ebd[hidden] { display: none; }
html.ebd-open { overflow: hidden; overscroll-behavior: none; }
@keyframes ebd-fade { from { opacity: 0; } }
.ebd-card {
  position: relative; box-sizing: border-box; width: min(380px, 100%); max-height: calc(100dvh - 32px); overflow: auto;
  display: flex; flex-direction: column; align-items: center; gap: .6rem;
  padding: 1.3rem 1.2rem 1.05rem; border-radius: 1.4rem;
  background: var(--dock-bg, rgba(255,255,255,.62)); border: 1px solid var(--dock-line, rgba(120,140,200,.25));
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: 0 22px 50px rgba(0, 0, 0, .3);
  animation: ebd-in .34s cubic-bezier(.2,.9,.3,1.15); overscroll-behavior: contain;
}
@keyframes ebd-in { from { opacity: 0; transform: translateY(10px) scale(.96); } }
.ebd button { font: inherit; margin: 0; cursor: pointer; -webkit-appearance: none; appearance: none; text-transform: none; letter-spacing: normal; }
.ebd button:focus-visible { outline: 2px solid var(--underline, #e0558a); outline-offset: 3px; }
.ebd-x {
  position: absolute; top: .2rem; right: .2rem; width: 2.9rem; height: 2.9rem; padding: 0; border: 0; border-radius: 50%;
  display: grid; place-items: center; font-size: 1.55rem !important; line-height: 1; color: inherit; background: transparent;
}
.ebd-t { margin: .1rem 2rem 0; font: 600 1.25rem/1.25 "Fredoka", ui-rounded, system-ui, sans-serif; color: inherit; text-wrap: balance; }
.ebd-hrt { display: block; margin: 0 auto .35rem; width: 38px; height: 38px; border-radius: 50%; color: #fff;
  background: linear-gradient(135deg, #ff5ea8, #c04dff 55%, #8a5cff); box-shadow: 0 3px 9px rgba(200, 77, 255, .3); }
.ebd-hrt svg { display: block; margin: 10px auto 0; }
.ebd p { margin: 0; font-size: .96rem; line-height: 1.45; color: inherit; }
.ebd-p { text-wrap: balance; }
.ebd-amts { display: flex; gap: 4px; padding: 3px; border-radius: 999px; border: 1px solid var(--dock-line, rgba(120,140,200,.25)); }
.ebd-amts button { border: 0; border-radius: 999px; padding: .55em 1em; font-size: .95rem; font-weight: 600; color: inherit; background: transparent;
  transition: background-color .2s ease, color .2s ease; }
.ebd-amts button[aria-pressed="true"] { color: #fff; background: linear-gradient(135deg, #ff5ea8, #c04dff 55%, #8a5cff); box-shadow: 0 3px 9px rgba(200, 77, 255, .22); }
.ebd-qr { display: flex; flex-direction: column; align-items: center; gap: .3rem; }
.ebd-qr svg { display: block; width: 176px; height: 176px; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.15); }
.ebd-qr small { font-size: .8rem; opacity: .75; }
.ebd-show { border: 0; background: none; padding: 2px 4px; font-size: .88rem !important; color: inherit; text-decoration: underline; text-underline-offset: 3px;
  text-decoration-color: var(--underline, #e0558a); display: none; }
/* phones (no mouse): the QR is for another device, so it waits behind "Show QR code"; the copy button comes first */
@media (hover: none) {
  .ebd-qr { display: none; }
  .ebd.qr-on .ebd-qr { display: flex; }
  .ebd-show { display: inline-block; }
  .ebd.qr-on .ebd-show { display: none; }
}
.ebd-copy { border: 0; border-radius: 999px; padding: .8em 1.4em; font-size: 1rem; font-weight: 600; color: #fff;
  background: linear-gradient(135deg, #ff5ea8, #c04dff 55%, #8a5cff); box-shadow: 0 3px 9px rgba(200, 77, 255, .22);
  transition: transform .25s cubic-bezier(.34,1.56,.64,1); }
.ebd-copy:active { transform: scale(.96); }
.ebd-done b { color: var(--underline, #e0558a); font-weight: 600; }
.ebd-any { font-size: .88rem !important; opacity: .8; }
.ebd-code { box-sizing: border-box; width: 100%; resize: none; font: .72rem/1.35 ui-monospace, monospace; padding: .5em; border-radius: 10px;
  border: 1px solid var(--dock-line, rgba(120,140,200,.25)); background: rgba(255,255,255,.5); color: #111; word-break: break-all; }
.ebd-who { font-size: .8rem !important; opacity: .7; }
.ebd-later { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 14px; }
.ebd-later[hidden] { display: none; }
.ebd-later button { border: 0; background: none; padding: 6px 4px; font-size: .88rem; color: inherit; opacity: .8;
  text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--dock-line, rgba(120,140,200,.4)); }
@media (hover: hover) and (pointer: fine) {
  .ebd-x:hover, .ebd-amts button:not([aria-pressed="true"]):hover { background: var(--dock-line, rgba(120,140,200,.2)); }
  .ebd-copy:hover { transform: scale(1.04); }
  .ebd-later button:hover { opacity: 1; }
}

/* the games' end-of-round line: quiet text in the game's own colours, a small heart link */
.ebd-line { margin: .7rem auto 0 !important; text-align: center; font: 400 .9rem/1.4 "Fredoka", ui-rounded, system-ui, sans-serif; color: var(--ink, #26385c); opacity: .85; }
.ebd-line button { display: inline-flex; align-items: center; gap: .3em; margin: 0; padding: 2px 4px; border: 0; background: none; cursor: pointer;
  font: 600 .9rem/1.4 "Fredoka", ui-rounded, system-ui, sans-serif; color: inherit; text-decoration: underline; text-underline-offset: 3px;
  text-decoration-color: var(--underline, #e0558a); -webkit-appearance: none; appearance: none; }
.ebd-line button svg { width: 14px; height: 14px; color: var(--underline, #e0558a); }
.ebd-line button:focus-visible { outline: 2px solid var(--underline, #e0558a); outline-offset: 2px; border-radius: 6px; }
/* the share line's icon (the line itself is .ebd-line) and the "Copied!" note after sharing on a computer */
.ebd-share button svg { color: var(--underline, #e0558a); }
.ebd-note { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 2147483000;
  transform: translate(-50%, 12px); opacity: 0; pointer-events: none; max-width: calc(100% - 32px); padding: .7em 1.2em;
  border-radius: 999px; text-align: center; font: 500 .95rem/1.35 "Fredoka", ui-rounded, system-ui, sans-serif;
  color: var(--ink, #26385c); background: var(--dock-bg, rgba(255,255,255,.62)); border: 1px solid var(--dock-line, rgba(120,140,200,.25));
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); box-shadow: 0 10px 26px rgba(0,0,0,.22);
  transition: opacity .25s ease, transform .3s cubic-bezier(.2,.9,.3,1.15); }
.ebd-note.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .ebd, .ebd-card { animation: none; } }
