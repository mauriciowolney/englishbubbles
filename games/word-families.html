function afterGap() {
  const r = G.r;

  if (r.gaps.every(g => g.done)) { G.phase = "checked"; renderTools(); paraEl.classList.remove("locked"); setTimeout(() => { if (G.r === r) finishRound(); }, reduceMotion ? 300 : 1300); }
}
// The gap's explanation in the instruction language.
function whyOf(g) { const T = famTr(); return (nativeUi() && T.why && T.why[g.i]) || g.why || ""; }

/* ---------- Exam mode: typed words ---------- */
function mkInput(g) {
  const inp = document.createElement("input");
  inp.className = "gin"; inp.type = "text"; inp.autocomplete = "off"; inp.spellcheck = false;
  inp.setAttribute("autocapitalize", "none"); inp.setAttribute("autocorrect", "off"); inp.setAttribute("enterkeyhint", "done");
  inp.setAttribute("aria-label", tx("gapLabel", { n: g.i + 1, root: G.r.f.root.toUpperCase() }));
  inp.addEventListener("focus", () => { if (G.r.active !== g.i) setActive(g.i); });
  // The right word is taken as soon as it's typed; Enter on a wrong one, or 3 s without typing, counts as a try.
  inp.addEventListener("input", () => {
    clearTimeout(g.idle);
    if (accepts(g, norm(inp.value))) return checkTyped(g);
    if (norm(inp.value)) g.idle = setTimeout(() => checkTyped(g), 3000);
  });
  inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); checkTyped(g); } });
  g.slot.appendChild(inp); g.inp = inp;
}
const norm = v => v.trim().toLowerCase().replace(/[’`]/g, "'").replace(/\s+/g, " ");
function checkTyped(g) {
  if (g) clearTimeout(g.idle);
  if (!g || g.done || G.phase !== "gaps" || !g.inp) return;
  const v = norm(g.inp.value);
  if (!v) return g.inp.focus();
  if (accepts(g, v)) {
    const el = document.createElement("span");
    el.className = "b w ok"; el.style.setProperty("--h", DATA.classes[g.c].hue); el.textContent = shownAs(g, g.a); soapify(el);
    g.slot.innerHTML = ""; g.slot.appendChild(el); g.el.classList.add("filled"); g.inp = null;
    return gapRight(g, el, null);
  }
  flash(g.el, "shake");
  const d = G.r.f.words.find(x => x.w === (US_UK[v] || v));
  if (!d && g.tries + 1 < maxTries() && near(v, g.a)) {
    g.tries++; G.r.mistakes++; comboReset(); sndBad(); renderTools();
    hintEl.innerHTML = tx("examNear") + " " + tx(maxTries() - g.tries === 1 ? "tryLeft" : "triesLeft", { n: maxTries() - g.tries });
  } else gapWrong(g, v, d ? (d.c.includes(g.c) ? g.c : d.c[0]) : "");
  if (g.tries >= maxTries()) { g.inp = null; setTimeout(() => { if (!g.done) revealGap(g); }, 700); }
  else { g.inp.select(); g.inp.focus(); }
}
$("checkbtn").addEventListener("click", () => { const r = G.r; if (r) checkTyped(r.gaps[r.active]); });
// One or two letters off (a spelling slip), for words longer than 4 letters.
function near(a, b) {
  if (Math.abs(a.length - b.length) > 2 || b.length < 5) return false;
  let p = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const q = [i];
    for (let j = 1; j <= b.length; j++) q[j] = Math.min(p[j] + 1, q[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));

// After an exam round: every word in its zone, so the player sees the whole family.
// The text glides and narrows from full width to the middle column, then the zones slide in one by one and their words pop in.
function examRecap() {
  const r = G.r, before = centerEl.getBoundingClientRect();
  board.classList.remove("exam");
  r.f.words.forEach(d => d.c.forEach(c => mkBank(d, c, false)));
  r.bank.forEach(B => { if (r.gaps.some(g => g.a === B.w && g.c === B.c)) B.el.classList.add("ok"); });
  CLASSES.forEach((c, i) => {
    zoneEls[c].style.setProperty("--zi", i);
    zoneEls[c].querySelectorAll(".w").forEach((w, j) => w.style.setProperty("--wi", j));
  });
  if (reduceMotion) return;
  board.classList.add("recap"); setTimeout(() => board.classList.remove("recap"), 1800);
  const after = centerEl.getBoundingClientRect();
  // Width too, so the box narrows gradually (the text rewraps as it goes) instead of snapping to the column's size.
  centerEl.animate([{ width: before.width + "px", transform: "translate(" + (before.left - after.left) + "px," + (before.top - after.top) + "px)" },
                    { width: after.width + "px", transform: "none" }], { duration: 700, easing: "cubic-bezier(.3,.9,.3,1)" });
}

/* ---------- Hint ---------- */
// Hints exist only for the text (levels.json "hintsPerFamily" of them). Each greys out a word class that no gap needs
// (its zone and words; in exam mode the zones are hidden, so the hint line just names it); when no such class is left,
// a word that isn't an answer. Greyed words can't be moved. r.off remembers what is greyed: { c: Set, w: Set }.
function greyable() {
  const r = G.r, f = r.f, need = new Set();
  r.gaps.forEach(g => {
    need.add(g.c);
    (g.alt || []).forEach(w => { const d = f.words.find(x => x.w === w); if (d) d.c.forEach(c => need.add(c)); });
  });
  const cs = CLASSES.filter(c => !need.has(c) && !r.off.c.has(c) && f.words.some(d => d.c.includes(c)));

/* 14-reveal.js — the card after each round (the text's translation, listen, why each answer fits behind (?), next,

/* ---------- A family's finished text ---------- */
// HTML: each answer in bold, in its word-class colour.
function filledHTML(f) {

function showReveal() {
  const r = G.r, f = r.f, L = lang(), T = famTr(f), last = G.idx >= G.total - 1, why = r.gaps.filter(g => whyOf(g));
  toolsEl.hidden = true;
  revealEl.innerHTML =
    (T.text ? '<div class="rv-tr"><span class="pick-badge" style="--g:' + esc(L.grad || "") + '">' + esc(L.badge) + '</span><p lang="' + esc(curLang) + '">' + esc(T.text) + "</p></div>" : "") +
    '<div class="rv-btns"><button type="button" class="pbtn" id="listen" aria-label="' + esc(tx("listen")) + '"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg> ' + tx("listen") + "</button>" +
    (why.length ? '<button type="button" class="pbtn rv-q" id="rvq" aria-expanded="false" aria-controls="rvwhy" aria-label="' + esc(tx("whyTitle")) + '" title="' + esc(tx("whyTitle")) + '">?</button>' : "") +
    '<button type="button" class="cta pulse" id="next">' + tx(last ? "results" : "next") + " &rarr;</button>" + favBtn(f) + "</div>" +
    (why.length ? '<ul class="rv-why" id="rvwhy" hidden>' + why.map(g => '<li><span class="chip lc" style="--h:' + DATA.classes[g.c].hue + '">' + esc(g.a) + " · " + esc(clsOf(g.c).name) + "</span><span>" +
      esc(whyOf(g)) + "</span></li>").join("") + "</ul>" : "");
  revealEl.hidden = false;
  // Scroll down (never up) until the card's bottom edge shows with 32px of page under it (as in the sibling games;
  // scrollIntoView "nearest" stopped right at its edge). A place on the page, not a distance, so the second check

  const showCard = () => {
    if (revealEl.hidden || !revealEl.offsetParent) return;
    const top = revealEl.getBoundingClientRect().bottom + scrollY + 32 - innerHeight;

  };
  setTimeout(showCard, reduceMotion ? 0 : 480); setTimeout(showCard, 1100);

  // sounds come first; Listen reads it again, Next pulses. Next (nextRound) stops the voice.
  const say = () => speak(paraText(f), $("listen"));
  setTimeout(() => { if (G.r === r && !revealEl.hidden && $("listen")) say(); }, reduceMotion ? 300 : 700);
  $("listen").addEventListener("click", say);
  $("next").addEventListener("click", nextRound);
  if (why.length) $("rvq").addEventListener("click", e => {
    const b = e.currentTarget, ul = $("rvwhy"), open = ul.hidden;
    ul.hidden = !open; b.setAttribute("aria-expanded", String(open)); sndHint();

  });
}
// Enter goes on to the next family, unless it's pressing one of the card's other buttons.
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && G.phase === "done" && !revealEl.hidden && !document.querySelector(".favmodal.show") && $("tour").hidden && !(e.target.closest("button") && e.target.id !== "next")) { e.preventDefault(); nextRound(); }
});

/* ---------- Little celebrations ---------- */
function toast(text, cls) {

/* 15-progress.js — what the player has done with every family, across games, and the daily streak.

   lex-days = "YYYY-MM-DD|days in a row". */
function getProg() { try { return JSON.parse(load("lex-prog")) || {}; } catch (e) { return {}; } }
function recordProgress(id, pts, max) {
  const p = getProg(), o = p[id] || [0, 0, 0, 0];
  p[id] = [o[0] + 1, pts, max, Date.now()]; store("lex-prog", JSON.stringify(p));
}
const mastered = (p, id) => !!p[id] && p[id][1] === p[id][2];

// A round counts as soon as it starts, so "new game" without finishing still moves on.
function getShown() { try { return JSON.parse(load("lex-shown")) || {}; } catch (e) { return {}; } }

const MISSED_PER_GAME = 2;

  const tiers = {}; list.forEach(f => (tiers[n(f)] = tiers[n(f)] || []).push(f));
  const all = [];
  Object.keys(tiers).map(Number).sort((a, b) => a - b).forEach(k => {
    const fs = shuffle(tiers[k]).sort((a, b) => t(a) - t(b));
    const first = all.length < ROUNDS ? fs.filter(f => p[f.id] && !mastered(p, f.id)).slice(0, MISSED_PER_GAME) : [];
    all.push(...first, ...fs.filter(f => !first.includes(f)));

function meterHTML(level) {
  const x = mastery(level);
  return '<div class="meter" style="' + lvVars(level) + '"><b>' + esc(level) + '</b><div class="pbar"><i style="width:' + (x.n ? x.m / x.n * 100 : 0).toFixed(1) + '%"></i></div><span>' + x.m + " / " + x.n + "</span></div>";

/* ---------- Daily streak ---------- */
function dayStr(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dayState() {
  const [d, n] = (load("lex-days") || "|0").split("|"), y = new Date(); y.setDate(y.getDate() - 1);

}

function tickDay() {

}
function showDays() { const n = getDays(), el = $("days"); el.hidden = n < 2; el.textContent = "🔥 " + n; el.title = tx("daysTitle", { n }); }

/* 16-gloss.js — tap or hover a sorted word (in a zone, in a filled gap), the family root or any word of the text to see
   what it means in the translation language; a tap on a family word (or the root) also says it aloud, a word of the
   text only shows its meaning (as in the other games). Bubbles still in the pool never show a
   meaning, so nothing is given away. In the gaps phase a tap on a zone word fills a gap instead, so those meanings show
   on mouse hover only (text words still answer a tap). At levels with "meaningsAtEnd" (C1) the family's words keep their
   meaning hidden until the text is complete (a tap still says them); with "textMeaningsAtEnd" (C2) so do the text's other words.
   Family words: the translation block's "words": { "act": { "verb": "agir", "noun": "ato" }, "actor": "ator" }.

document.body.appendChild(glossEl);

function glossOf(w, c) {

  if (typeof g === "string") return g;
  return (c && g[c]) || Object.keys(g).map(k => g[k]).join(" · ");
}

const lockedUntilDone = k => !!lvl()[k] && G.phase !== "checked" && G.phase !== "done";
// The meaning of text word (or phrase) k, or "".
function textGlossOf(k) { const g = famTr().gloss || {}; return k in g ? g[k] : (lang().dict || {})[k] || ""; }

const WORD_RE = "[A-Za-z]+(?:[-'’][A-Za-z]+)*";
function wordsHTML(s) {

  // a word's first letter (the single-word pattern matches any letter first), so no lookbehind is needed (old Safari).
  const ph = Object.keys(famTr().gloss || {}).concat(Object.keys(lang().dict || {})).filter(k => k.includes(" ")).sort((a, b) => b.length - a.length)

function glossTarget(e) {

  const root = x.closest(".fam .gw"); if (root) return { el: root, w: G.r.f.root };
  const tw = x.closest(".para .tw"); if (tw) return { el: tw, w: tw.textContent, k: tw.dataset.k, text: true };
  const b = x.closest(".w"); if (!b || b.classList.contains("drag")) return null;

// Show the meaning just above the word (below it near the top of the screen); linger = hide by itself after a moment.

function showGloss(tg, linger, x, y) {

  const L = lang(); clearTimeout(glossTimer);

  glossEl.innerHTML = '<span class="pick-badge" style="--g:' + esc(L.grad || "") + '">' + esc(L.badge) + '</span><span><span lang="' + esc(curLang) + '">' + esc(g) + "</span>" +
    (tg.c ? "<small>" + esc(tg.w) + " · " + esc(clsOf(tg.c).name.toLowerCase()) + "</small>" : "") + "</span>";

addEventListener("scroll", hideGloss, true); addEventListener("resize", hideGloss);

/* 17-shine.js — the soap bubbles (from Be Do Modal, Nov 2026): the spans inside every word bubble (SOAP, soapify()) and
   the shine that follows the mouse. Each visible bubble's shine spot stays in its top-left corner and leans a little
   toward the cursor, the small spot moves the other way, and the side facing the cursor glows as it nears. One
   listener; each frame eases one set of numbers per bubble toward the cursor and writes only the transform / opacity
   of the spans that show them (.spot, .glint, .fg, .rh); the loop stops once all have settled. Positions are measured
   at most every 250 ms. With a mouse it always runs; with a finger or pen only while a bubble is carried, so on phones
   the other bubbles react to the one being dragged (which itself rests). Nothing with reduced motion. Look: the end of
   10-game.css. */

/* The film (.film: a turning colour layer .spin, the glow facing the mouse .fg), the shine spot (.spot and its brighter

   its look is the <i> inside, so moving it re-reads no gradients. */

  '<span class="rim" aria-hidden="true"><i class="spin"></i><i class="rh"><i></i></i></span><span class="glint" aria-hidden="true"><i></i></span>';

  el.style.setProperty("--fx", rnd(-2, 2).toFixed(1) + "px"); el.style.setProperty("--fy", rnd(-3.5, -2).toFixed(1) + "px");
  el.style.setProperty("--fdur", rnd(3.2, 5.2).toFixed(2) + "s"); el.style.setProperty("--fdl", rnd(-5, 0).toFixed(2) + "s");

}
// The same, as HTML (the tour's sample text)
function soapHTML(inner) { return SOAP + '<span class="wl">' + inner + "</span>"; }

/* Off screen, the board's animations (floats, the turning film) pause: .still, 10-game.css */
if (window.IntersectionObserver) new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle("still", !e.isIntersecting))).observe(board);

(function () {
  if (reduceMotion) return;

  // positions measured at most every RECT_MS (the bubbles barely move), and again after a scroll or resize
  let rcache = null, rlist = null, rtime = 0;
  const RECT_MS = 250;
  let odd = false;     // during a finger drag the shine updates every other frame
  let dirty = true;    // targets are worked out again only when something happened (the mouse moved, a scroll, a drop)
  /* The spot only leans toward the cursor: at most RIGHT / DOWN of the bubble's height that way, LEFT / UP the other way
     (less: the rounded corner is near). From NEAR0 of that (cursor far) to all of it (cursor on it); FALL = how
     quickly it fades with distance. The nearness sk = (GLOW / (distance + GLOW))^2: 1 on the bubble, 1/4 at GLOW px.
     EASE = the share of the way covered in one 60 fps frame. While a bubble is carried the others keep at least DRAG_SK. */

  const carried = () => document.querySelector(".w.drag");

    put(e, "pl", "opacity", o);

    put(e, "gl", "opacity", (0.8 + 0.2 * k).toFixed(3));
