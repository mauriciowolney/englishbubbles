:"After “I'm” and before “at cooking” we need an adjective: it means I am very bad at it."},{"a":"hope","c":"verb","why":"After “still” and before “to bake” we need a verb: “hope to + verb” talks about something you want."}],"tr":{"pt-BR":{"text":"Todo mundo diz que não tenho jeito para cozinhar. Mas eu ainda espero conseguir assar um bolo perfeito para o aniversário da minha mãe.","gloss":{"cooking":"cozinhar","bake":"assar","perfect":"perfeito","cake":"bolo","mother's birthday":"aniversário da minha mãe"},"why":["Depois de “I'm” e antes de “at cooking” precisamos de um adjetivo: significa que sou muito ruim nisso.","Depois de “still” e antes de “to bake” precisamos de um verbo: “hope to + verbo” fala de algo que você quer."]}}}]},{"id":"b1-use","root":"use","words":[{"w":"use","m":"use","c":["verb","noun"]},{"w":"user","m":"us[er]","c":["noun"],"sk":"er","person":true},{"w":"useful","m":"use[ful]","c":["adj"],"sk":"ful"},{"w":"useless","m":"use[less]","c":["adj"],"sk":"less"},{"w":"usefulness","m":"use[fulness]","c":["noun"],"sk":"ness"}],"text":"This app is really {0} for learning new vocabulary. Every {1} can create their own word lists.","gaps":[{"a":"useful","c":"adj","why":"After “is really” we need an adjective — a positive one."},{"a":"user","c":"noun","why":"After “every” we need a noun — here, a person who uses the app."}],"tr":{"pt-BR":{"words":{"use":{"verb":"usar","noun":"uso"},"user":"usuário","useful":"útil","useless":"inútil","usefulness":"utilidade"},"gloss":{"app":"aplicativo","learning":"aprender","vocabulary":"vocabulário","create":"criar","word lists":"listas de palavras"},"text":"Este aplicativo é muito útil para aprender vocabulário novo. Cada usuário pode criar as próprias listas de palavras.","why":["Depois de “is really” precisamos de um adjetivo — um positivo.","Depois de “every” precisamos de um substantivo — aqui, uma pessoa que usa o aplicativo."]}},"alt":[{"text":"The paper map was completely {0} because the streets had changed. In the end, we had to {1} my phone to find the station.","gaps":[{"a":"useless","c":"adj","why":"After “was completely” we need an adjective: the map did not help, because the streets had changed."},{"a":"use","c":"verb","why":"After “had to” we need a verb in its base form: they needed to use the phone."}],"tr":{"pt-BR":{"text":"O mapa de papel era completamente inútil porque as ruas tinham mudado. No fim, tivemos que usar o meu celular para encontrar a estação.","gloss":{"paper map":"mapa de papel","completely":"completamente","streets":"ruas","had changed":"tinham mudado","in the end":"no fim das contas","had to":"tivemos que","phone":"celular","find":"encontrar","station":"estação"},"why":["Depois de “was completely” precisamos de um adjetivo: o mapa não ajudou, porque as ruas tinham mudado.","Depois de “had to” precisamos de um verbo na forma base: eles precisaram usar o celular."]}}}]},{"id":"b1-music","root":"music","words":[{"w":"music","m":"music","c":["noun"]},{"w":"musician","m":"music[ian]","c":["noun"],"sk":"ian","person":true},{"w":"musical","m":"music[al]","c":["adj","noun"],"sk":"al","note":"Musical is an adjective (a musical instrument) and also a noun: a musical is a show with songs."},{"w":"musically","m":"music[ally]","c":["adv"],"sk":"ly"}],"text":"My brother is a talented {0} who plays four instruments. Last year, he wrote all the songs for our school {1}.","gaps":[{"a":"musician","c":"noun","why":"After “a talented” we need a noun — a person who plays music."},{"a":"musical","c":"noun","why":"After “our school” we need a noun: a show with songs and dancing."}],"tr":{"pt-BR":{"words":{"music":"música","musician":"músico, musicista","musical":{"adj":"musical","noun":"musical (espetáculo)"},"musically":"musicalmente"},"notes":{"musical":"Musical é adjetivo (a musical instrument = um instrumento musical) e também substantivo: a musical é um espetáculo com músicas."},"gloss":{"brother":"irmão","talented":"talentoso","plays":"toca","instruments":"instrum ve."},{"a":"health","c":"noun","why":"After “your” (a possessive) we need a noun."}],"tr":{"pt-BR":{"words":{"health":"saúde","healthy":"saudável","unhealthy":"pouco saudável, prejudicial à saúde","healthily":"de forma saudável"},"gloss":{"fast food":"fast food, comida rápida","often":"muitas vezes, frequentemente","so":"então, por isso","try":"tento","cook":"cozinhar","at home":"em casa","exercise":"exercício","both":"ambos, os dois"},"text":"Fast food costuma ser muito prejudicial à saúde, então eu tento cozinhar em casa. Comida boa e exercício são importantes para a sua saúde.","why":["Depois de “very” precisamos de um adjetivo — e “so I try to cook at home” mostra que é algo negativo.","Depois de “your” (um possessivo) precisamos de um substantivo."]}},"alt":[{"text":"Jenny walks to work because she wants to stay {0}. Sitting at a desk all day is bad for your {1}.","gaps":[{"a":"healthy","c":"adj","why":"After “to stay” we need an adjective: she wants to be in good health."},{"a":"health","c":"noun","why":"After “bad for your” we need a noun: the condition of your body."}],"tr":{"pt-BR":{"text":"Jenny vai a pé para o trabalho porque quer se manter saudável. Ficar sentado numa mesa o dia todo faz mal à sua saúde.","gloss":{"jenny":"","walks to work":"vai a pé para o trabalho","wants to":"quer","stay":"manter-se","sitting":"ficar sentado","at a desk":"numa mesa de trabalho","all day":"o dia todo","bad for":"ruim para"},"why":["Depois de “to stay” precisamos de um adjetivo: ela quer estar com boa saúde.","Depois de “bad for your” precisamos de um substantivo: o estado do seu corpo."]}}}]},{"id":"b1-comfort","root":"comfort","words":[{"w":"comfort","m":"comfort","c":["noun","verb"]},{"w":"comfortable","m":"comfort[able]","c":["adj"],"sk":"able"},{"w":"uncomfortable","m":"[un]comfort[able]","c":["adj"],"pk":"un","sk":"able"},{"w":"comfortably","m":"comfort[ably]","c":["adv"],"sk":"ly"}],"text":"These shoes look great, but they're really {0}. I can't walk {1} in them etivo; “to stop it” mostra que eles não podiam fazer nada.","Depois de “the” e antes de “of water” precisamos de um substantivo: a força que a água tem."]}}}]},{"id":"b1-colour","root":"colour","words":[{"w":"colour","m":"colour","c":["noun","verb"]},{"w":"colourful","m":"colour[ful]","c":["adj"],"sk":"ful"},{"w":"colourless","m":"colour[less]","c":["adj"],"sk":"less"},{"w":"colourfully","m":"colour[fully]","c":["adv"],"sk":"ly"}],"text":"The paint shop was cheerful, with {0} displays everywhere. We chose a {1} that made the kitchen feel warm.","gaps":[{"a":"colourful","c":"adj","why":"After “with” and before “displays” we need an adjective: the shop is cheerful, so “colourless” would contradict it."},{"a":"colour","c":"noun","why":"After “a” and before “that” we need a noun: it is the thing we chose for the kitchen."}],"tr":{"pt-BR":{"words":{"colour":{"noun":"cor","verb":"colorir, pintar"},"colourful":"colorido","colourless":"incolor, sem cor","colourfully":"de forma colorida"},"gloss":{"paint shop":"loja de tintas","was":"estava","cheerful":"alegre","displays":"mostruários","everywhere":"por toda parte","we":"nós","chose":"escolhemos","that":"que","made the kitchen feel warm":"deixou a cozinha aconchegante"},"text":"A loja de tintas era alegre, com mostruários coloridos por toda parte. Escolhemos uma cor que deixou a cozinha aconchegante.","why":["Depois de “with” e antes de “displays” precisamos de um adjetivo: a loja é alegre, então “incolor” contrariaria a frase.","Depois de “a” e antes de “that” precisamos de um substantivo: é a coisa que escolhemos para a cozinha."]}},"alt":[{"text":"Winter here is long and {0}, with grey skies. In spring, the girls come to the festival {1} dressed in red and yellow.","gaps":[{"a":"colourless","c":"adj","why":"After “long and” we need an adjective; “grey skies” shows that there is no colour in winter."},{"a":"colourfully","c":"adv","why":"Before “dressed” we need an adverb saying how the girls are dressed, and “red and yellow” shows it is with lots of colour."}],"tr":{"pt-BR":{"text":"O inverno aqui é longo e sem cor, com céus cinzentos. Na primavera, as meninas vão à festa vestidas de forma colorida, de vermelho e amarelo.","gloss":{"winter":"inverno","here":"aqui","long":"longo","grey skies":"céus cinzentos","in spring":"na primavera","girls":"meninas","come to":"vão a","festival":"festa, festival","dressed":"vestidas","red":"vermelho","yellow":"amarelo"},"why":["Depois de “long and” precisamos de um adjetivo; “grey skies” mostra que não há cor no inverno.","Antes de “dressed” precisamos de um advérbio que diga como as meninas estão vestidas, e “red and yellow” mostra que há muita cor."]}}}]},{"id":"b1-wonder","root":"wonder","words":[{"w":"wonder","m":"wonder","c":["noun","verb"]},{"w":"wonderful","m":"wonder[ful]","c":["adj"],"sk":"ful"},{"w":"wonderfully","m":"wonder[fully]","c":["adv"],"sk":"ly"}],"text":"We had a {0} holiday in Portugal last summer, with sunshine every day. I often {1} if we will ever go back there.","gaps":[{"a":"wonderful","c":"adj","why":"After “a” and before the noun “holiday” we need an adjective."},{"a":"wonder","c":"verb","why":"After “I often” we need a verb: “wonder if” means ask yourself."}],"tr":{"pt-BR":{"words":{"wonder":{"noun":"admiração, espanto","verb":"perguntar-se, imaginar"},"wonderful":"maravilhoso","wonderfully":"maravilhosamente"},"gloss":{"holiday":"férias","last summer":"no verão passado","sunshine":"sol","every day":"todos os dias","often":"muitas vezes","if":"se","ever":"algum dia","go back":"voltar"},"text":"Tivemos férias maravilhosas em Portugal no verão passado, com sol todos os dias. Muitas vezes me pergunto se um dia vamos voltar lá.","why":["Depois de “a” e antes do substantivo “holiday” precisamos de um adjetivo.","Depois de “I often” precisamos de um verbo: “wonder if” significa perguntar a si mesmo."]}},"alt":[{"text":"After the busy city, our mountain hotel was {0} quiet. The children stared at the snow in {1}, as they had never seen so much.","gaps":[{"a":"wonderfully","c":"adv","why":"Before the adjective “quiet” we need an adverb; it makes the word stronger and shows how pleasant the silence was."},{"a":"wonder","c":"noun","why":"After “in” we need a noun: “in wonder” means with great surprise and pleasure."}],"tr":{"pt-BR":{"text":"Depois da cidade movimentada, nosso hotel na montanha era maravilhosamente tranquilo. As crianças olharam a neve com espanto, pois nunca tinham visto tanta.","gloss":{"busy":"movimentada","city":"cidade","mountain":"montanha","hotel":"hotel","quiet":"tranquilo, silencioso","children":"crianças","stared at":"olharam fixamente para","snow":"neve","had never seen":"nunca tinham visto","so much":"tanta","after":"depois de","as":"pois"},"why":["Antes do adjetivo “quiet” precisamos de um advérbio; ele reforça a palavra e mostra como o silêncio era agradável.","Depois de “in” precisamos de um substantivo: “in wonder” significa com grande surpresa e prazer."]}}}]},{"id":"b1-luck","root":"luck","words":[{"w":"luck","m":"luck","c":["noun"]},{"w":"lucky","m":"luck[y]","c":["adj"],"sk":"y"},{"w":"unlucky","m":"[un]luck[y]","c":["adj"],"pk":"un","sk":"y"},{"w":"luckily","m":"luck[ily]","c":["adv"],"sk":"ly"},{"w":"unluckily","m":"[un]luck[ily]","c":["adv"],"pk":"un","sk":"ly"}],"text":"My brother is always {0}: last week he lost his phone and broke his arm. Let's hope he has better {1} this year.","gaps":[{"a":"unlucky","c":"adj","why":"After “is always” we need an adjective, and losing a phone and breaking an arm are bad things."},{"a":"luck","c":"noun","why":"After “better” we need a noun: “better luck” means good things happening by chance."}],"tr":{"pt-BR":{"words":{"luck":"sorte","lucky":"sortudo","unlucky":"azarado","luckily":"felizmente, por sorte","unluckily":"infelizmente, por azar"},"gloss":{"brother":"irmão","last week":"na semana passada","lost":"perdeu","phone":"celular","broke":"quebrou","arm":"braço","let's hope":"vamos torcer para que","better":"mais, melhor","this year":"este ano"},"text":"Meu irmão é sempre azarado: na semana passada ele perdeu o celular e quebrou o braço. Vamos torcer para que ele tenha mais sorte este ano.","why":["Depois de “is always” precisamos de um adjetivo, e perder o celular e quebrar o braço são coisas ruins.","Depois de “better” precisamos de um substantivo: “better luck” significa coisas boas acontecendo por acaso."]}},"alt":[{"text":"I forgot my umbrella this morning, but {0} it didn't rain. Tom wasn't so {1}: he got soaked on his way home.","gaps":[{"a":"luckily","c":"adv","why":"After “but” we need an adverb that shows the good side of the situation: it didn't rain."},{"a":"lucky","c":"adj","why":"After “wasn't so” we need an adjective; “got soaked” shows that Tom had bad luck."}],"tr":{"pt-BR":{"text":"Esqueci meu guarda-chuva hoje de manhã, mas por sorte não choveu. Tom não teve tanta sorte: ficou encharcado no caminho para casa.","gloss":{"forgot":"esqueci","umbrella":"guarda-chuva","this morning":"hoje de manhã","didn't rain":"não choveu","wasn't so":"não foi tão","got soaked":"ficou encharcado","on his way home":"no caminho para casa","tom":""},"why":["Depois de “but” precisamos de um advérbio que mostre o lado bom da situação: não choveu.","Depois de “wasn't so” precisamos de um adjetivo; “got soaked” mostra que Tom teve azar."]}}}]},{"id":"b1-play","root":"play","words":[{"w":"play","m":"play","c":["verb","noun"]},{"w":"player","m":"play[er]","c":["noun"],"sk":"er","person":true},{"w":"playful","m":"play[ful]","c":["adj"],"sk":"ful"},{"w":"playfully","m":"play[fully]","c":["adv"],"sk":"ly"}],"text":"My little sister is very {0} and never sits still. She dreams of being a football {1} one day.","gaps":[{"a":"playful","c":"adj","why":"After “is very” we need an adjective describing the sister: she loves to have fun."},{"a":"player","c":"noun","why":"After “a football” we need a noun for a person who plays."}],"tr":{"pt-BR":{"words":{"play":{"verb":"brincar; jogar","noun":"p ll dogs, and they are very {0}. I can hear the {1} through the wall every night.","gaps":[{"a":"noisy","c":"adj","why":"After “are very” we need an adjective describing the dogs."},{"a":"noise","c":"noun","why":"After “hear the” we need a noun: the sound that comes through the wall."}],"tr":{"pt-BR":{"words":{"noise":"barulho, ruído","noisy":"barulhento","noisily":"barulhentamente, com barulho","noiseless":"silencioso, sem barulho"},"notes":{"noiseless":"O contrário de noisy: não há som nenhum."},"gloss":{"neighbours":"vizinhos","have":"têm","three":"três","dogs":"cachorros","hear":"ouvir","through":"através de","wall":"parede","every night":"todas as noites"},"text":"Nossos novos vizinhos têm três cachorros pequenos, e eles são muito barulhentos. Consigo ouvir o barulho através da parede todas as noites.","why":["Depois de “are very” precisamos de um adjetivo que descreva os cachorros.","Depois de “hear the” precisamos de um substantivo: o som que atravessa a parede."]}},"alt":[{"text":"The new electric train is almost {0}, so you can hardly hear it coming. The old one used to make a terrible {1}.","gaps":[{"a":"noiseless","c":"adj","why":"After “is almost” we need an adjective; “you can hardly hear it” shows that it makes no sound."},{"a":"noise","c":"noun","why":"After “a terrible” we need a noun: the sound that the old train made."}],"tr":{"pt-BR":{"text":"O novo trem elétrico é quase silencioso, então mal dá para ouvi-lo chegando. O antigo fazia um barulho terrível.","gloss":{"electric train":"trem elétrico","almost":"quase","hardly":"mal, quase não","hear it coming":"ouvi-lo chegando","the old one":"o antigo","used to make":"fazia, costumava fazer","terrible":"terrível","so":"então"},"why":["Depois de “is almost” precisamos de um adjetivo; “you can hardly hear it” mostra que ele não faz som.","Depois de “a terrible” precisamos de um substantivo: o som que o trem antigo fazia."]}}}]},{"id":"b1-happy","root":"happy","words":[{"w":"happy","m":"happy","c":["adj"]},{"w":"unhappy","m":"[un]happy","c":["adj"],"pk":"un"},{"w":"happiness","m":"happi[ness]","c":["noun"],"sk":"ness"},{"w":"unhappiness","m":"[un]happi[ness]","c":["noun"],"pk":"un","sk":"ness"},{"w":"happily","m":"happi[ly]","c":["adv"],"sk":"ly"},{"w":"unhappily","m":"[un]happi[ly]","c":["adv"],"pk":"un","sk":"ly"}],"text":"My grandmother felt lonely and {0} after she moved to the city. Now she has a little dog, and it brings her great {1}.","gaps":[{"a":"unhappy","c":"adj","why":"After “lonely and” we need an adjective with the same negative feeling as “lonely”."},{"a":"happiness","c":"noun","why":"After “great” we need a noun, and the new dog makes her life better, so the feeling is positive."}],"tr":{"pt-BR":{"words":{"happy":"feliz, contente","unhappy":"infeliz, triste","happiness":"felicidade","unhappiness":"infelicidade, tristeza","happily":"alegremente, felizmente","unhappily":"infelizmente, tristemente"},"gloss":{"grandmother":"avó","felt":"se sentia","lonely":"sozinha, solitária","after":"depois que","moved to":"se mudou para","city":"cidade","a little dog":"um cachorrinho","brings":"traz","great":"muita, grande"},"text":"Minha avó se sentia sozinha e infeliz depois que se mudou para a cidade. Agora ela tem um cachorrinho, e ele lhe traz muita felicidade.","why":["Depois de “lonely and” precisamos de um adjetivo com o mesmo sentimento negativo de “lonely”.","Depois de “great” precisamos de um substantivo, e o novo cachorro melhora a vida dela, então o sentimento é positivo."]}},"alt":[{"text":"My sister loves fairy tales where everyone lives {0} ever after. She cries when the ending is sad, because she wants everyone to be {1}.","gaps":[{"a":"happily","c":"adv","why":"After “lives” and before “ever after” we need an adverb: “live happily ever after” is the usual ending of a fairy tale."},{"a":"happy","c":"adj","why":"After “to be” we need an adjective; she cries at sad endings, so she wants the characters to feel good."}],"tr":{"pt-BR":{"text":"Minha irmã adora contos de fadas em que todos vivem felizes para sempre. Ela chora quando o final é triste, porque quer que todos sejam felizes.","gloss":{"sister":"irmã","loves":"adora","fairy tales":"contos de fadas","where":"em que","lives":"vivem","ever after":"para sempre","cries":"chora","ending":"final","sad":"triste","wants":"quer"},"why":["Depois de “lives” e antes de “ever after” precisamos de um advérbio: “live happily ever after” é o final típico de um conto de fadas.","Depois de “to be” precisamos de um adjetivo; ela chora com finais tristes, então quer que os personagens se sintam bem."]}}}]},{"id":"b1-kind","root":"kind","words":[{"w":"kind","m":"kind","c":["adj","noun"],"note":"As a noun, “kind” means a type of thing: a kind of tree."},{"w":"unkind","m":"[un]kind","c":["adj"],"pk":"un"},{"w":"kindness","m":"kind[ness]","c":["noun"],"sk":"ness"},{"w":"kindly","m":"kind[ly]","c":["adv"],"sk":"ly"}],"text":"Lucy was nervous at first, but the other students were so {0} that she soon relaxed. One girl smiled {1} and showed her round.","gaps":[{"a":"kind","c":"adj","why":"After “so” and the verb “were” we need an adjective describing the students; “unkind” would not make her relax."},{"a":"kindly","c":"adv","why":"After “smiled” we need an adverb; “unkindly” would clash with “showed her round”."}],"tr":{"pt-BR":{"words":{"kind":{"adj":"gentil, bondoso","noun":"tipo, espécie"},"unkind":"cruel, antipático","kindness":"gentileza, bondade","kindly":"gentilmente, com bondade"},"notes":{"kind":"Como substantivo, “kind” significa tipo: a kind of tree = um tipo de árvore."},"gloss":{"lucy":"","nervous":"nervosa","at first":"no começo","other students":"outros alunos","so":"tão","soon":"logo","relaxed":"relaxou","one girl":"uma garota","smiled":"sorriu","showed her round":"mostrou a escola"},"text":"Lucy estava nervosa no começo, mas os outros alunos foram tão gentis que ela logo relaxou. Uma garota sorriu gentilmente e lhe mostrou a escola.","why":["Depois de “so” e do verbo : at eighty, she still swims in the sea in winter. My cousin, on the other hand, lives in {1} of spiders.","gaps":[{"a":"fearless","c":"adj","why":"After “is” we need an adjective, and swimming in the sea in winter shows she is brave."},{"a":"fear","c":"noun","why":"After “lives in” we need a noun: “live in fear of” means be very afraid of something all the time."}],"tr":{"pt-BR":{"words":{"fear":{"noun":"medo","verb":"temer, ter medo de"},"fearful":"medroso, temeroso","fearless":"destemido, sem medo","fearlessly":"destemidamente, sem medo"},"gloss":{"grandmother":"avó","at eighty":"aos oitenta anos","swims":"nada","sea":"mar","in winter":"no inverno","cousin":"primo, prima","on the other hand":"por outro lado","lives in":"vive com","spiders":"aranhas"},"text":"Minha avó é destemida: aos oitenta anos, ela ainda nada no mar no inverno. Já meu primo vive com medo de aranhas.","why":["Depois de “is” precisamos de um adjetivo, e nadar no mar no inverno mostra que ela é corajosa.","Depois de “lives in” precisamos de um substantivo: “live in fear of” significa ter muito medo de algo o tempo todo."]}},"alt":[{"text":"Lucy is {0} of dogs, so she crosses the road when she sees one. She says her {1} began when a big dog chased her.","gaps":[{"a":"fearful","c":"adj","why":"After “Lucy is” we need an adjective; she crosses the road when she sees a dog, so she is afraid of them."},{"a":"fear","c":"noun","why":"After “her” we need a noun, the subject of “began”: the feeling of being afraid."}],"tr":{"pt-BR":{"text":"A Lucy tem medo de cachorros, então atravessa a rua quando vê um. Ela diz que seu medo começou quando um cachorro grande a perseguiu.","gloss":{"lucy":"","dogs":"cachorros","so":"então","crosses":"atravessa","road":"rua","sees":"vê","one":"um","began":"começou","big":"grande","dog":"cachorro","chased":"perseguiu"},"why":["Depois de “Lucy is” precisamos de um adjetivo; ela atravessa a rua quando vê um cachorro, então ela tem medo deles.","Depois de “her” precisamos de ":[{"text":"Most families in our village make their living from {0}. Our neighbours, for example, have a small {1} near the river.","gaps":[{"a":"farming","c":"noun","why":"After “make their living from” we need a noun for the work of growing crops and keeping animals."},{"a":"farm","c":"noun","why":"After “a small” we need a noun for the place where the neighbours grow food and keep animals."}],"tr":{"pt-BR":{"text":"A maioria das famílias da nossa vila vive da agricultura. Nossos vizinhos, por exemplo, têm uma pequena fazenda perto do rio.","gloss":{"most":"a maioria das","families":"famílias","make their living from":"vivem de","neighbours":"vizinhos","for example":"por exemplo","have":"têm","near":"perto de","river":"rio"},"why":["Depois de “make their living from” precisamos de um substantivo para o trabalho de plantar e criar animais.","Depois de “a small” precisamos de um substantivo para o lugar onde os vizinhos plantam e criam animais."]}}}]},{"id":"b1-safe","root":"safe","words":[{"w":"safe","m":"safe","c":["adj","noun"],"note":"A safe is also a strong metal box for money. The noun for being safe is safety."},{"w":"safely","m":"safe[ly]","c":["adv"],"sk":"ly"},{"w":"safety","m":"saf[ety]","c":["noun"],"sk":"y"},{"w":"unsafe","m":"[un]safe","c":["adj"],"pk":"un"}],"text":"The bridge was closed for repairs because it was {0} for cars. The city says that {1} is more important than speed.","gaps":[{"a":"unsafe","c":"adj","why":"After “was” we need an adjective; “closed because” means the bridge was dangerous, so “safe” would contradict the sentence."},{"a":"safety","c":"noun","why":"After “says that” we need a noun, the subject of “is”: the state of not being in danger."}],"tr":{"pt-BR":{"words":{"safe":{"adj":"seguro","noun":"cofre"},"safely":"com segurança, seguramente","safety":"segurança","unsafe":"inseguro, perigoso"},"notes":{"safe":"A safe também é um cofre, uma caixa de metal para guardar dinheiro. O substantivo de “estar seguro” é safety."},"gloss":{"bridge":"ponte","closed":"fechada","repairs":"reparos","cars":"carros","city":"prefeitura","more":"mais","speed":"velocidade"},"text":"A ponte foi fechada para reparos porque estava insegura para os carros. A prefeitura diz que a segurança é mais importante que a velocidade.","why":["Depois de “was” precisamos de um adjetivo; como a ponte foi fechada por perigo, “safe” (seguro) não combina.","Depois de “says that” precisamos de um substantivo como sujeito de “is”: o estado de não estar em perigo."]}},"alt":[{"text":"The pilot landed the plane {0} in a field, and nobody was hurt. Many passengers, however, did not feel {1} on a plane for months.","gaps":[{"a":"safely","c":"adv","why":"After “landed the plane” we need an adverb that tells how the pilot landed it: without any accident."},{"a":"safe","c":"adj","why":"After “did not feel” we need an adjective; after the scary landing, many passengers did not feel protected from danger on a plane."}],"tr":{"pt-BR":{"text":"O piloto pousou o avião com segurança em um campo, e ninguém se feriu. Muitos passageiros, porém, não se sentiram seguros em um avião por meses.","gloss":{"pilot":"piloto","landed":"pousou","plane":"avião","field":"campo","was hurt":"se feriu","passengers":"passageiros","did not feel":"não se sentiram","for months":"por meses"},"why":["Depois de “landed the plane” precisamos de um advérbio que diga como o piloto pousou: sem nenhum acidente.","Depois de “did not feel” precisamos de um adjetivo; depois do pouso assustador, muitos passageiros não se sentiram protegidos do perigo em um avião."]}}}]},{"id":"b1-easy","root":"easy","words":[{"w":"easy","m":"easy","c":["adj"]},{"w":"easily","m":"easi[ly]","c":["adv"],"sk":"ly"},{"w":"ease","m":"ease","c":["noun","verb"]},{"w":"uneasy","m":"[un]easy","c":["adj"],"pk":"un"}],"text":"Maria practised every day, so she passed her driving test {0}. Her brother had not studied, so he was {1} about his exam.","gaps":[{"a":"easily","c":"adv","why":"After “passed her driving test” we need an adverb describing how she passed: with no problem."},{"a":"uneasy","c":"adj","why":"After “was” we need an adjective: he had not studied, so he felt worried, not relaxed (“easy”)."}],"tr":{"pt-BR":{"words":{"easy":"fácil","easily":"facilmente, com facilidade","ease":{"noun":"facilidade, alívio","verb":"aliviar, facilitar"},"uneasy":"inquieto, apreensivo"},"gloss":{"maria":"","practised":"treinou","every day":"todos os dias","so":"então","passed":"passou","driving test":"exame de direção","her":"seu","brother":"irmão","studied":"estudou","exam":"prova"},"text":"Maria treinou todos os dias, então passou no exame de direção com facilidade. Seu irmão não estudou, então estava apreensivo com a prova.","why":["Depois de “passed her driving test” precisamos de um advérbio que diga como ela passou: sem dificuldade.","Depois de “was” precisamos de um adjetivo: ele não estudou, então estava preocupado, não tranquilo (“easy”)."]}},"alt":[{"text":"This app is very {0} to use, even for people over ninety. My neighbour learned to send photos with {1} in just one afternoon.","gaps":[{"a":"easy","c":"adj","why":"After “is very” and before “to use” we need an adjective: something that needs no effort."},{"a":"ease","c":"noun","why":"After “with” we need a noun: “with ease” means without any difficulty."}],"tr":{"pt-BR":{"text":"Este aplicativo é muito fácil de usar, até para pessoas com mais de noventa anos. Meu vizinho aprendeu a enviar fotos com facilidade em apenas uma tarde.","gloss":{"app":"aplicativo","to use":"usar","even for":"até para","over ninety":"com mais de noventa anos","neighbour":"vizinho","learned to":"aprendeu a","send":"enviar","photos":"fotos","in just one afternoon":"em apenas uma tarde"},"why":["Depois de “is very” e antes de “to use” precisamos de um adjetivo: algo que não exige esforço.","Depois de “with” precisamos de um substantivo: “with ease” significa sem nenhuma dificuldade."]}}}]},{"id":"b1-love","root":"love","words":[{"w":"love","m":"love","c":["verb","noun"]},{"w":"lovely","m":"love[ly]","c":["adj"],"sk":"ly"},{"w":"loving","m":"lov[ing]","c":["adj"]},{"w":"unloved","m":"[un]love[d]","c":["adj"],"pk":"un"}],"text":"Mrs Silva's garden is {0} in spring, full of roses and tulips. She says that a plant needs {1}, just like a person.","gaps":[{"a":"lovely","c":"adj","why":"After “is” we need an adjective, and “full of roses and tulips” tells us the garden looks beautiful."},{"a":"love","c":"noun","why":"After “needs” we need a noun: the care and affection that a plant needs."}],"tr":{"pt-BR":{"words":{"love":{"verb":"amar","noun":"amor"},"lovely":"lindo, adorável","loving":"carinhoso, afetuoso","unloved":"não amado, rejeitado"},"gloss":{"mrs":"senhora (Sra.)","garden":"jardim","in spring":"na primavera","full of":"cheio de","roses":"rosas","tulips":"tulipas","plant":"planta","needs":"precisa de","just like":"assim como","person":"pessoa"},"text":"O jardim da Sra. Silva fica lindo na primavera, cheio de rosas e tulipas. Ela diz que uma planta precisa de amor, assim como uma pessoa.","why":["Depois de “is” precisamos de um adjetivo, e “full of roses and tulips” mostra que o jardim é bonito.","Depois de “needs” precisamos de um substantivo: o carinho e o cuidado de que uma planta precisa."]}},"alt":[{"text":"Nobody wanted the puppy at first, and it felt {0}. Now it lives with two children and gets lots of {1} every day.","gaps":[{"a":"unloved","c":"adj","why":"After “it felt” we need an adjective; nobody wanted the puppy, so it felt that nobody loved it."},{"a":"love","c":"noun","why":"After “lots of” we need a noun: the affection that the children give the puppy."}],"tr":{"pt-BR":{"text":"Ninguém queria o cachorrinho no começo, e ele se sentia sem amor. Agora ele mora com duas crianças e recebe muito amor todos os dias.","gloss":{"wanted":"queria","puppy":"cachorrinho","at first":"no começo","felt":"se sentia","lives with":"mora com","children":"crianças","gets lots of":"recebe muito","every day":"todos os dias"},"why":["Depois de “it felt” precisamos de um adjetivo; ninguém queria o cachorrinho, então ele sentia que ninguém o amava.","Depois de “lots of” precisamos de um substantivo: o carinho que as crianças dão ao cachorrinho."]}}},{"text":"My grandparents are eighty, and they still {0} dancing together. Grandpa looks after Grandma with {1} care when she is ill.","gaps":[{"a":"love","c":"verb","why":"After “they still” we need a verb: what my grandparents enjoy doing."},{"a":"loving","c":"adj","why":"Before “care” we need an adjective; “loving care” means care full of affection."}],"tr":{"pt-BR":{"text":"Meus avós têm oitenta anos e ainda adoram dançar juntos. O vovô cuida da vovó com carinho quando ela está doente.","gloss":{"grandparents":"avós","eighty":"oitenta anos","still":"ainda","dancing":"dançar","together":"juntos","grandpa":"vovô","looks after":"cuida de","grandma":"vovó","care":"cuidado","ill":"doente"},"why":["Depois de “they still” precisamos de um verbo: o que meus avós gostam de fazer.","Antes de “care” precisamos de um adjetivo; “loving care” é um cuidado cheio de carinho."]}}}]},{"id":"b1-cook","root":"cook","words":[{"w":"cook","m":"cook","c":["verb","noun"],"person":true},{"w":"cooker","m":"cook[er]","c":["noun"],"sk":"er"},{"w":"cooking","m":"cook[ing]","c":["noun"]},{"w":"cookery","m":"cook[ery]","c":["noun"],"sk":"y"},{"w":"undercooked","m":"[under]cook[ed]","c":["adj"],"pk":"under"}],"text":"My father is a {0} and loves making lasagne. Last month he got a new electric {1}, which he uses every day.","gaps":[{"a":"cook","c":"noun","why":"After “is a” we need a noun for a person: someone whose job is making food."},{"a":"cooker","c":"noun","why":"After “new electric” we need a noun for the appliance you cook on: a cooker, not a person."}],"tr":{"pt-BR":{"words":{"cook":{"verb":"cozinhar","noun":"cozinheiro, cozinheira"},"cooker":"fogão","cooking":"culinária, cozinha","cookery":"culinária, arte culinária","undercooked":"malcozido, cr ","c":"adv","why":"Between “left them” and “bitter” we need an adverb that intensifies the adjective: deeply."}],"tr":{"pt-BR":{"words":{"deep":{"adj":"profundo","adv":"fundo"},"depth":"profundidade","deepen":"aprofundar","deeply":"profundamente"},"gloss":{"firm":"empresa","sold":"vendida","few":"poucos","had grasped":"tinham compreendido","rift":"racha","between":"entre","partners":"sócios","years":"anos","shared":"compartilhadas","hardship":"adversidades","left":"deixado","bitter":"amargurados","neither":"nenhum dos dois","would concede":"cederia","single":"único","point":"ponto"},"text":"Quando a empresa foi vendida, poucos tinham compreendido a profundidade do racha entre os dois sócios. Anos de adversidades compartilhadas os haviam deixado profundamente amargurados, e nenhum dos dois cederia um único ponto."}},"alt":[{"text":"As the drought dragged on, the farmers' worries began to {0}, and the river shrank to a trickle. Even the old village well, so {1} that stones took seconds to splash, was running dry.","gaps":[{"a":"deepen","c":"verb","why":"After “began to” we need the base form of a verb meaning to grow stronger or worse: deepen, which fits “worries”."},{"a":"deep","c":"adj","why":"After “so” and before “that” we need an adjective describing the well: deep, since stones take seconds to splash."}],"tr":{"pt-BR":{"text":"À medida que a seca se arrastava, as preocupações dos fazendeiros começaram a se aprofundar, e o rio diminuiu até virar um fio d'água. Até o velho poço da aldeia, tão fundo que as pedras levavam segundos para espirrar água, estava secando.","gloss":{"as":"à medida que","drought":"seca","dragged on":"se arrastava","worries":"preocupações","began to":"começaram a","river":"rio","shrank":"diminuiu","trickle":"fio d'água","even":"até","well":"poço","so":"tão","stones":"pedras","took":"levavam","seconds":"segundos","to splash":"para espirrar água","was running dry":"estava secando","farmers":"dos fazendeiros"}}}}]},{"id":"c2-tolerate","root":"t  professional, an original*. E também *arrival, refusal, approval*."},{"t":"Substantivos em -y","x":"*-y* forma adjetivos (*healthy, lucky*), mas *-ty, -ety* e *-ery* formam substantivos."},{"t":"-er que não é pessoa","x":"*A cook* é uma pessoa (cozinheiro); *a cooker* é o fogão. Máquinas e ferramentas também levam *-er*: *a computer, a printer*."},{"t":"Adjetivos em -ate","x":"*-ate* geralmente forma verbo (*educate, originate*), mas algumas palavras em *-ate* são adjetivos. *deliberate* é as duas coisas: o adjetivo termina num som fraco, o verbo num 'ate' forte."},{"t":"Sem terminação, duas classes","x":"Muitas palavras em inglês mudam de classe sem mudar de forma: *you can act* (agir) e *do a kind act* (um ato gentil). Por isso algumas bolhas vão para duas zonas."}],"twins":{"tion":"-ção","sion":"-são","ion":"-ão","ment":"-mento","ity":"-idade","ance":"-ância","ence":"-ência","ancy":"-ância","ency":"-ência","ism":"-ismo","ist":"-ista","or":"-or","ure":"-ura","ary":"-ário","ive":"-ivo","able":"-ável","ible":"-ível","ous":"-oso","al":"-al","ic":"-ico","ly":"-mente","ise":"-izar","ize":"-izar","ify":"-ificar"},"preTitle":"Prefixos","preLead":"O prefixo muda o sentido, não a classe: *happy* e *unhappy* são os dois adjetivos. *en-* é a exceção.","prefixes":[{"t":"não","x":"*un-* é o mais comum. *in-* e *dis-* aparecem com certas palavras: aprenda-os junto com a palavra (*inactive, dishonest*)."},{"t":"não, antes de m, p, b, l e r","x":"*in-* muda para combinar com a letra seguinte: *im-* antes de m, p e b (*impossible, impatient*), *il-* antes de l (*illegal*), *ir-* antes de r (*irresponsible*). Como em português: impossível, ilegal, irresponsável."},{"t":"errado, mal","x":"*misbehave* = comportar-se mal; *a misfit* é alguém que não se encaixa."},{"t":"de novo","x":"*repaint* = pintar de novo; *reproduce* = reproduzir."},{"t":"demais / de menos","x":"A palavra mantém a classe: *oversleep* é verbo, como *sleep*; *undercooked* é adjetivo, como *cooked*."},{"t":"forma verbo","x":"O único prefixo que muda a classe: *danger* (substantivo) → *endanger* (verbo), *courage → encourage*, *able → enable*."},{"t":"outros","x":"*non-* = não (*noncommittal*), *a-* = não (*atypical*), *pre-* = antes (*preconception*), *counter-* = contra (*counterproductive*)."}],"spellTitle":"Ortografia ao acrescentar uma terminação","spellLead":"Na prova, uma palavra com uma letra errada é uma resposta errada.","spelling":[{"t":"Tire o e final antes de vogal."},{"t":"Mantenha o e antes de consoante."},{"t":"y depois de consoante vira i."},{"t":"Dobre a última consoante quando a última sílaba é a tônica."},{"t":"-ful tem um l só; o advérbio tem dois."},{"t":"-le vira -ly; -ic vira -ically."},{"t":"-able ou -ible? -ance ou -ence? Não há regra: aprenda junto com a palavra (o português ajuda: aceitável, sensível)."},{"t":"A ortografia britânica e a americana estão certas. O modo prova aceita as duas."}],"insideTitle":"Mudanças dentro da palavra","insideLead":"Às vezes não é só a terminação: a própria raiz muda. Estas aparecem o tempo todo na prova.","inside":[{"t":"Adjetivo → substantivo em -th"},{"t":"O fim do verbo muda antes de -ion e -ive"},{"t":"Uma vogal some ou muda de lugar"},{"t":"Uma forma totalmente nova"}],"stressTitle":"Sílaba tônica","stressLead":"Mesma grafia, tônica diferente: no jogo, a sílaba tônica aparece sublinhada em cada zona.","stressMoveTitle":"A tônica pode mudar dentro da família","misTitle":"Erros mais comuns","misLead":"Toque num erro para ver a frase certa.","mistakes":[{"src":"Ela é muito bem-sucedida.","why":"Depois de *very* você precisa de um adjetivo. *success* é o substantivo."},{"src":"Eu quero ter sucesso na vida.","why":"Depois de *to* você precisa de um verbo: *succeed*."},{"src":"Ele dirige com cuidado.","why":"Diz como ele dirige (um verbo), então você precisa do advérbio."},{"src":"O filme foi muito relaxante. Eu me senti muito relaxado.","why":"*-ing* é o que causa a sensação; *-ed* é como a pessoa se sente."},{"src":"Meu pai é um ótimo cozinheiro.","why":"*A cook* é uma pessoa; *a cooker* é o fogão."},{"src":"É impossível.","why":"Antes de p, o prefixo negativo é *im-*."},{"src":"Ele é muito irresponsável.","why":"Antes de r, o prefixo negativo é *ir-*."},{"src":"Obrigado pelas informações.","why":"*information* e *knowledge* são incontáveis: sem *-s*, sem *a/an*."},{"src":"Ela é muito sensível: chora em todo filme.","why":"*sensitive* = sensível, sente as coisas com facilidade. *sensible* = sensato, tem bom senso."},{"src":"Minha chefe é muito compreensiva.","why":"*comprehensive* = completo, abrangente (*a comprehensive guide*)."},{"src":"Nosso vizinho novo é muito simpático.","why":"*sympathetic* = solidário, que entende os problemas dos outros."},{"src":"O filme foi uma decepção.","why":"*deception* = enganação, fazer alguém acreditar numa coisa falsa."},{"src":"Eu pretendo estudar medicina.","why":"*pretend* = fingir."},{"src":"Este carro é muito econômico.","why":"*economical* = econômico, gasta pouco dinheiro ou combustível. *economic* = da economia (*economic growth*)."}],"examTitle":"Dicas de prova","examLead":"Parte 3 da prova de Reading and Use of English do B2 First, do C1 Advanced e do C2 Proficiency.","exam":["Leia o texto inteiro primeiro, para entender a história. Uma frase pode pedir uma palavra negativa que só faz sentido com a frase anterior.","A palavra em MAIÚSCULAS no fim da linha é a sua raiz. Nunca a escreva sem mudança: ela sempre precisa de pelo menos uma mudança.","Olhe as palavras em volta da lacuna: de que classe ela precisa?","Singular ou plural? O verbo precisa de *-s, -ed* ou *-ing*? O jogo mantém as palavras como estão na lista, mas a prova não.","Duas mudanças são comuns: um prefixo e um sufixo (*employ → unemployment*). No C1 e no C2 a própria raiz também pode mudar (*deceive → deceptive*).","A ortografia conta. Britânica ou americana, as duas são aceitas, mas use sempre a mesma.","Nunca deixe uma lacuna em branco: um bom palpite ainda pode valer ponto."],"curTitle":"Para os curiosos","curious":[["-ise ou -ize?","No Reino Unido, *-ise* é mais comum, mas *-ize* também está certo: *criticise* ou *criticize*. Nos Estados Unidos, só *-ize*. A Cambridge aceita as duas; só use a mesma do começo ao fim."],["high / highly, short / shortly","*high* e *short* também são advérbios (*jump high* = pular alto). *highly* quer dizer muito (*highly unlikely* = muito improvável); *shortly* quer dizer em breve (*I'll be there shortly*)."],["use (substantivo) / use (verbo)","O substantivo termina com som de s, o verbo com som de z. Só muda o som de uma letra, então o jogo não marca."],["Verbos novos todo dia","O inglês transforma substantivos em verbos sem terminação nenhuma: *to email, to google, to text*. Por isso tantas famílias têm uma palavra em duas zonas."],["A maior família","*produce* tem dez palavras no jogo: *produce, product, production, producer, productive, unproductive, productivity, productively, reproduce, counterproductive*."]]},"tour":{"ui":{"step":"Passo {n} de {total}","back":"Voltar","next":"Próximo","play":"Vamos jogar!","close":"Fechar o tutorial"},"steps":{"welcome":{"t":"Pronto para explorar famílias de palavras?","x":"Uma <b>família de palavras<\/b> é um grupo de palavras formadas a partir da mesma raiz. Em cada rodada, você classifica uma família por <b>classe gramatical<\/b> e depois usa as palavras num texto curto — como na tarefa de formação de palavras das provas <b>FCE<\/b> e <b>CAE<\/b>. Veja uma família:"},"level":{"t":"Escolha seu nível","x":"<b>B1<\/b>: famílias do dia a dia; o botão <b>Terminações<\/b> mostra as terminações típicas em cada zona quando você precisar. <b>B2<\/b>: famílias do First (FCE). <b>C1<\/b>: famílias do Advanced (CAE), com menos tentativas e dicas, e os significados da família só depois que o texto estiver completo. <b>C2<\/b>: famílias do Proficiency (CPE), sem nenhuma dica e sem traduções até o texto estar completo."},"family":{"t":"Uma família por rodada","x":"Esta é a <b>raiz<\/b> da família. Todas as bolhas são formadas a partir dela, com um <b>prefixo<\/b> (un-, dis-…) ou um <b>sufixo<\/b> (-tion, -ful, -ly…) diferente."},"pool":{"t":"Classifique as bolhas","x":"<b>Arraste<\/b> cada bolha para a sua zona. Ou <b>toque<\/b> numa bolha e depois numa zona."},"zones":{"t":"Quatro zonas","x":"<b>Verbo<\/b>, <b>substantivo<\/b>, <b>adjetivo<\/b> e <b>advérbio<\/b>. Quando uma palavra cai na zona certa, o prefixo e o sufixo se acendem — aprenda a reconhecê-los! Nem toda família tem uma palavra para cada zona. Toque numa palavra classificada para ouvi-la e ver o que ela significa."},"twins":{"t":"Algumas palavras têm duas classes","x":"Algumas palavras pertencem a <b>mais de uma<\/b> classe: <b>act<\/b> é verbo (<i>they act<\/i>) e substantivo (<i>a kind act<\/i>). Quando você classifica uma delas, uma cópia fica na zona e a bolha volta com um selo <b>+1<\/b>. Encontre a outra zona dela!"},"gaps":{"t":"Depois, use as palavras","x":"Quando a família estiver classificada, aparece um texto curto com uma ou duas <b>lacunas<\/b>. Arraste uma palavra das zonas para cada lacuna — ou toque numa palavra para preencher a lacuna destacada. Leia as palavras ao redor da lacuna: de que tipo de palavra ela precisa? Toque em qualquer palavra do texto para ver o que ela significa."},"tools":{"t":"Dicas","x":"Travou no texto? Uma <b>dica<\/b> deixa em cinza um tipo de palavra que ele não usa (o botão Dica aparece junto com o texto). As dicas valem para o jogo todo, e cada dica que você economiza vira um <b>ponto bônus<\/b> no final."},"score":{"t":"Pontos","x":"<b>+1<\/b> para cada bolha classificada sem erro, <b>+2<\/b> para cada lacuna certa na primeira tentativa (+1 na segunda). Acertos seguidos formam um <b>combo<\/b>!"},"play":{"t":"Outras formas de jogar","x":"Toque em <b>novo jogo<\/b> para fazer um <b>simulado<\/b> (digite as palavras, como na prova de verdade), um <b>desafio relâmpago<\/b> de 60 segundos, ou um treino com as famílias em que você <b>errou<\/b> ou que <b>marcou com estrela<\/b>."},"lists":{"t":"Favoritos e Vistas","x":"Toque na <b>estrela<\/b> de uma família concluída para salvá-la em <b>Favoritos<\/b>. <b>Vistas<\/b> mostra seu progresso e as famílias em que você errou, para você revisá-las."},"guide":{"t":"Guia","x":"O <b>Guia<\/b> reúne as terminações de cada classe, os prefixos, as regras de ortografia, a sílaba tônica e os erros mais comuns, com exemplos das famílias do seu nível."}}}}},"audio":["004e87cd","00d0dfb1","00e5378b","00effaa4","0128b582","01493ff1","01505c01","015321c9","0194877b","01ad0c66","0239f182","02f814ff","0302b252","0308a0d9","030f8029","03287475","034371b8","0356948c","0363f3bd","03647906","03794a6a","0426c232","047d2aec","0489e261","0490eade","052cb8ca","05784e19","05de7ff2","05df9bf5","0614637d","06158158","0678085b","069ba679","06ad2ebc","06bc2e46","074fedbc","0772050a","079c8a10","07a2404e","07bc04cb","07bd3f50","080ec15b","08383057","088eea2e","08bfe4c5","08e95c1a","09132a43","0990e45b","0a21d68b","0a378bcd","0a41b453","0a6404da","0a6c9a0e","0a93a591","0aa5c915","0ad7a63f","0adf19bf","0afc8bd4","0b1ce587","0b23e401","0b3528af","0b5afd38","0b6bc77b","0b87eacf","0be3482e","0c3f57c6","0c4d8b53","0c8099a7","0caa24d0","0cd6f80b","0cda157b","0d2f8c04","0d37c30d","0d64a8bd","0d843aff","0daf6776","0e2cf902","0e50cde7","0e568cb2","0e5810c6","0efcba56","0f1b4706","0f2bad74","0f2cdee8","0f4018a4","0f658c9b","0f6689ca","0f7bdbf9","0fc6b6be","1020fb3d","1022141f","1065d89c","1076c387","107d2e41","1092e0ba","10c2447b","112ed211","1142e003","117ea03b","1183a52d","119eba07","11a9a78e","11b81738","11d6ffea","11eb667b","123a56be","124a5e06","1259ada5","12927293","12f3692c","12f582ac","13550fee","13af1e1e","13bfdf1f","13d98566","13f0a7e7","1456c5e3","1488569f","14b6e2ff","14c5336f","14e2c11b","15019c0f","151053aa","157b1294","15a65c2d","15c01499","16290af9","16bab169","16d9a4c1","16e5a0f4","1767e1e1","1775f4af","177b752a","177fee73","179d2094","17a25798","17ad46b4","180 /* 00-util.js — tiny helpers shared by every module. All modules share one script scope (build.py joins them in file-name order). */
const $ = id => document.getElementById(id);
function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function toks(s) { return s.trim().split(/\s+/); }
function rnd(a, b) { return a + Math.random() * (b - a); }
// Restart a one-shot CSS animation class.
function flash(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); el.addEventListener("animationend", function f() { el.classList.remove(cls); el.removeEventListener("animationend", f); }); }
const reduceMotion = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const canHover = !!(window.matchMedia && matchMedia("(hover: hover)").matches);
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
// A word's marked form ("act[ion]", see build.py) as HTML, the affixes wrapped in <i class="afx">.
function markHTML(m) { return m.replace(/\[([^\]]+)\]|([^\[]+)/g, (_, a, s) => a ? '<i class="afx">' + esc(a) + "</i>" : esc(s)); }
// A word written with its stress ("proDUCE": capitals = stressed, "(ate)" = secondary stress) as HTML: the stressed
// syllables underlined (.st), the secondary one dotted (.st2). Used by the zones and the Guide.
function stressHTML(s) { return s.replace(/\(([a-z]+)\)|[A-Z]+|[a-z]+|[^A-Za-z(]+/g, (m, sec) => sec ? '<u class="st st2">' + esc(sec) + "</u>" : /[A-Z]/.test(m) ? '<u class="st">' + esc(m.toLowerCase()) + "</u>" : esc(m)); }
// Plain text from a string with HTML tags (for speech and copied results).
function plain(html) { const d = document.createElement("div"); d.innerHTML = html; return d.textContent; }

/* 01-theme.js — background swatches and colour picker (from Conditional Bubbles; the in-app picker, hex + hue / strength /

var PALETTES = [
  { id: "auto", t: "Match my device", css: "linear-gradient(135deg,#e4f3fb 50%,#141964 50%)" },
  { id: "sky", t: "Sky", c: ["#e4f3fb", "#f1e8fb", "#fdf0e6"], dark: 0 },
  { id: "peach", t: "Peach", c: ["#ffe6d8", "#ffd6e4", "#fff1c9"], dark: 0 },
  { id: "mint", t: "Mint", c: ["#d9f4e6", "#d3eef6", "#eef6d3"], dark: 0 },
  { id: "lilac", t: "Lilac", c: ["#e9e0fb", "#f7d9ee", "#dbe6fb"], dark: 0 },
  { id: "dusk", t: "Dusk", c: ["#2a1740", "#58224f", "#1f3560"], dark: 1 },
  { id: "midnight", t: "Midnight", c: ["#141964", "#441464", "#144e64"], dark: 1 }   /* Be Do Modal's Midnight (Nov 2026), also the default dark background */
];
var root = document.documentElement, swHost = document.getElementById("swatches");
var swwrap = document.getElementById("swwrap"), swbtn = document.getElementById("swbtn");
var customLabel;

function setBg(a, b, c, dark) {
  root.style.setProperty("--bg-a", a);
  root.style.setProperty("--bg-b", b);
  root.style.setProperty("--bg-c", c);
  root.dataset.theme = dark ? "dark" : "light";
}
function clearBg() {
  ["--bg-a", "--bg-b", "--bg-c"].forEach(function (p) { root.style.removeProperty(p); });
  delete root.dataset.theme;
}
// Change the theme in one step (no per-element transitions, which made the dock and bubbles change at different
// speeds), then fade a copy of the old background away on top. From Verb Wheel (via Conditional Bubbles).
var bgReady = false;
function swapBg(fn, fade) {
  var cs = getComputedStyle(root), old = ["--bg-a", "--bg-b", "--bg-c"].map(function (v) { return cs.getPropertyValue(v).trim(); });
  root.classList.add("theming");
  fn();
  void document.body.offsetWidth;
  root.classList.remove("theming");
  if (!fade || !bgReady || reduceMotion) return;
  var f = document.createElement("div");
  f.className = "bgfade"; f.setAttribute("aria-hidden", "true");
  f.style.setProperty("--fa", old[0]); f.style.setProperty("--fb", old[1]); f.style.setProperty("--fc", old[2]);
  document.body.appendChild(f);
  void f.offsetWidth; f.classList.add("fading");   // not "go": that is the score row's class
  setTimeout(function () { f.remove(); }, 700);
}
function mark(el) {
  swHost.querySelectorAll(".on").forEach(function (n) { n.classList.remove("on"); n.removeAttribute("aria-pressed"); });
  if (el) { el.classList.add("on"); if (el.tagName === "BUTTON") el.setAttribute("aria-pressed", "true"); }
}
function hexToHsl(hex) {
  var r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
  var mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, h = 0, s = 0, d = mx - mn;
  if (d) {
    s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h *= 60;
  }
  return [h, s * 100, l * 100];
}
function applyCustom(hex, fade) {   // fade: the old background fades away, as for the palettes (not while sliding)
  var v = hexToHsl(hex), h = v[0], s = v[1], l = v[2];
  function col(dh) { return "hsl(" + ((h + dh + 360) % 360).toFixed(0) + "," + s.toFixed(0) + "%," + l.toFixed(0) + "%)"; }
  swapBg(function () { setBg(col(0), col(40), col(-40), l < 52); }, !!fade);
  customLabel.style.background = hex;
  mark(customLabel);
  store("lex-bg", "c:" + hex);
}
PALETTES.forEach(function (p) {
  var btn = document.createElement("button");
  btn.type = "button";
  btn.title = p.t;
  btn.setAttribute("aria-label", "Background: " + p.t);
  btn.style.background = p.css || "linear-gradient(135deg," + p.c.join(",") + ")";
  btn.addEventListener("click", function () {
    swapBg(function () { if (p.id === "auto") clearBg(); else setBg(p.c[0], p.c[1], p.c[2], p.dark); }, true);
    mark(btn);

backLayer(swwrap, () => swwrap.classList.contains("open"), () => swOpen(false));
backLayer(volwrap, () => volwrap.classList.contains("open"), () => volwrap.classList.remove("open"));

/* 08-sky.js — the bubbles drifting up behind everything (from Be Do Modal, Nov 2026, itself from English Bubbles): 7
   see-through, softly blurred bubbles of random size (40-140 px), place and pace (95-145 s a climb). At page load they
   are already part-way up, spread over the screen, and the layer fades in (.sky.in). Only transform / opacity move;
   they pause while a bubble is carried (body.carrying, 17-shine.js) and are left out with reduced motion. Look: .sky
   at the end of 00-base.css. */
(function () {
  var host = $("sky");
  if (!host || reduceMotion) return;
  var hues = [215, 330, 150, 265, 30, 190];
  for (var k = 0; k < 7; k++) {
    var s = document.createElement("span"), size = 40 + Math.round(Math.random() * 100), t = 95 + Math.round(Math.random() * 50);
    // a negative delay starts the climb part-way: spread from 15% to 80% of the way up, bubble by bubble
    var at = (0.15 + 0.65 * (k + Math.random() * 0.8) / 7) * t;
    s.style.cssText = "width:" + size + "px;height:" + size + "px;left:" + Math.round(Math.random() * 96) + "%;" +
      "--h:" + hues[k % hues.length] + ";--t:" + t + "s;--d:-" + at.toFixed(1) + "s;" +
      "--x:" + Math.round(Math.random() * 80 - 40) + "px";
    host.appendChild(s);
  }
  setTimeout(function () { host.classList.add("in"); }, 60);   // a timer, not animation frames: a page opened in the background gets none until shown
})();

/* 10-game.js — game state, flow and scoring. One game = ROUNDS word families at the chosen level.
   A round: the sort phase (12-sort.js: every bubble into its word-class zone), then the gaps phase (13-gaps.js: the
   1–2 gaps of a short text, filled with words from the zones), then the reveal card (14-reveal.js).
   Points: +1 for each bubble placed with no wrong drop since its last placement; +GAP_PTS for a gap right first time,
   +1 on the second try. Hints are for the text only: they come from a pool for the whole game (levels.json "hints"),
   at most hintsPerFamily a round; every unused hint is a bonus point at the end. G.combo counts right moves in a row (the chime climbs with it). */
const ROUNDS = 4, GAP_PTS = 2;
const CLASSES = Object.keys(DATA.classes);
const FAM = {};
Object.keys(DATA.families).forEach(l => DATA.families[l].forEach(f => { FAM[f.id] = f; }));
const levelOf = f => f.id.split("-")[0].toUpperCase();
// Rules come from the level of the family being played (practice games can mix levels).
const lvl = () => DATA.levels[(G.r && G.r.level) || G.level] || {};
const maxTries = () => lvl().tries || 3;
// 0 is a real value (C2 has no hints), so only a missing key falls back to the default.
const lvlNum = (k, d) => lvl()[k] == null ? d : lvl()[k];
const hintPool = () => lvlNum("hints", 5);
const maxHints = () => lvlNum("hintsPerFamily", 2);
const G = { level: "", mode: "normal", pool: [], total: ROUNDS, idx: 0, score: 0, results: [], streak: 0, combo: 0, hintsLeft: 0, quiz: null, r: null, phase: "idle" };
const stage = $("stage"), board = $("board"), centerEl = $("center"), poolEl = $("pool"), paraEl = $("para"), famEl = $("fam");
const revealEl = $("reveal"), hintEl = $("hint"), toolsEl = $("tools"), quizEl = $("quiz");
const scoreEl = $("score"), scEl = $("sc"), bestEl = $("bestlbl"), hintBtn = $("hintbtn"), triesEl = $("tries");

/* ---------- Game flow ---------- */
// mode: "normal" | "exam" | "sprint" | "review" | "fav" (22-modes.js); ids = the paragraphs of a review / favourites
// game: [{id, vi}] (vi = which of the family's texts), so those rounds replay exactly that paragraph.
function newGame(level, mode = "normal", ids) {
  document.body.classList.toggle("practice-mode", mode !== "normal");   // any other mode: Back returns to a normal game (22-modes.js)
  G.level = level; G.mode = mode; applyUi();
  G.pool = ids ? shuffle(ids.filter(x => FAM[x.id]).map(x => textOf(FAM[x.id], x.vi))) : orderPool(DATA.families[level] || []);
  G.total = mode === "sprint" ? Infinity : Math.min(ROUNDS, G.pool.length);
  G.idx = 0; G.score = 0; G.results = []; G.streak = 0; G.combo = 0; G.quiz = null; G.r = null;
  G.hintsLeft = mode === "sprint" ? 0 : hintPool();
  stopSprint(); quizEl.hidden = true; stage.hidden = toolsEl.hidden = false; revealEl.hidden = true;
  showScore(); showCombo();
  if (!G.pool.length) { G.phase = "idle"; hintEl.textContent = tx("noFamilies"); return; }
  if (mode === "sprint") return sprintIntro();
  startRound();
}
// A family can have several texts (build.py "alt"). textOf(f, vi) is the family object for text vi (0 = the first):
// that text, its gaps and its translation (the family's words stay the same), with .vi saying which text it is.
function textOf(f, vi) {
  const alts = f.alt || [], i = Math.max(0, Math.min(vi | 0, alts.length));
  if (!i) return Object.assign({}, f, { vi: 0 });
  const v = alts[i - 1], tr = {};
  Object.keys(f.tr || {}).forEach(l => { tr[l] = Object.assign({}, f.tr[l], { text: "", gloss: {}, why: undefined }, (v.tr || {})[l]); });
  return Object.assign({}, f, { text: v.text, gaps: v.gaps, tr, vi: i });
}
// Normal rounds take a family's texts in turn, remembered per family in lex-var. A pool entry that already names its
// text (a review / favourites game) keeps it.
function withText(f) {
  if (f.vi != null) return f;
  const alts = f.alt || []; if (!alts.length) return textOf(f, 0);
  let seen = {}; try { seen = JSON.parse(load("lex-var")) || {}; } catch (e) {}
  const i = ((seen[f.id] == null ? -1 : seen[f.id]) + 1) % (alts.length + 1);
  seen[f.id] = i; store("lex-var", JSON.stringify(seen));
  return textOf(f, i);
}
function startRound() {
  const f = withText(G.pool[G.idx % G.pool.length]);
  markShown(f.id);
  G.r = { f, level: levelOf(f), pts: 0, max: 0, hints: 0, mistakes: 0, words: [], bank: [], gaps: [], active: -1, sel: null };
  revealEl.hidden = true; revealEl.innerHTML = ""; toolsEl.hidden = false; hideGloss();
  renderFamily(); renderZones();
  if (G.mode === "exam") startGaps(); else startSort();
  renderTools(); updateProgress();
  stage.classList.remove("out"); stage.classList.add("rise");
  setTimeout(() => stage.classList.remove("rise"), 1400);
}
function nextRound() {
  if (G.phase !== "done") return;
  G.phase = "idle";
  hush();
  G.idx++;
  if (G.idx >= G.total) { updateProgress(); showEnd(); return; }
  stage.classList.add("out"); revealEl.classList.add("out");
  setTimeout(() => { revealEl.classList.remove("out"); if (quizDue()) showQuiz(); else startRound(); }, reduceMotion ? 0 : 260);
}
// Both phases are over: record the round, then the reveal card (straight on to the next family in a sprint).
function finishRound() {
  const r = G.r, perfect = r.pts === r.max;
  G.phase = "done";
  CLASSES.forEach(c => zoneEls[c].classList.remove("off"));
  G.streak = perfect ? G.streak + 1 : 0;
  markSeen(r.f.id, r.f.vi, perfect); recordProgress(r.f.id, r.pts, r.max); tickDay();
  G.results.push({ f: r.f, pts: r.pts, max: r.max, perfect, gaps: r.gaps.map(g => ({ a: g.a, ok: g.ok })) });
  selectWord(null); setHot(null);
  renderTools(); updateProgress();
  if (G.mode === "sprint") return sprintNext();
  if (G.mode === "exam") examRecap();
  burst(paraEl);
  toast(perfect ? (G.streak >= 2 ? tx("streak", { n: G.streak }) : tx("perfect")) : tx("roundPts", { n: r.pts, m: r.max }), perfect ? "" : "zero");
  if (perfect) sndWin();
  hintEl.innerHTML = tx("roundDone");
  setTimeout(() => { if (G.r === r) showReveal(); }, reduceMotion ? 0 : 650);   // the card then reads the finished text (14-reveal.js)
}

/* ---------- Points and combo ---------- */
function addPts(n, el) {
  if (!n) return;
  G.score += n; G.r.pts += n;
  showScore(); flash(scoreEl, "up"); if (el) toastAt(el, "+" + n);
}
// A right move: the combo grows. Returns how many semitones the chime climbs.
function comboUp() { G.combo++; showCombo(); return Math.min(G.combo - 1, 6) * 2; }
function comboReset() { G.combo = 0; showCombo(); }
function showCombo() { const c = $("combo"); c.hidden = G.combo < 3; c.textContent = "×" + G.combo; if (G.combo >= 3) flash(c, "tick"); }
// Best scores are kept for normal games, exam practice and sprints; practice games don't save one ("" = none).
const BEST = { normal: "lex-best-", exam: "lex-exam-", sprint: "lex-sprint-" };
function bestKey() { return BEST[G.mode] ? BEST[G.mode] + G.level : ""; }
function showScore() {
  scEl.textContent = G.score;
  bestEl.textContent = bestKey() ? tx("best", { n: parseInt(load(bestKey()), 10) || 0 }) : tx("practice");
}

/* ---------- Tools row and progress ---------- */
function renderTools() {
  const r = G.r, live = G.phase === "sort" || G.phase === "gaps";
  hintBtn.hidden = G.mode === "sprint" || G.phase === "sort" || !hintPool() || !maxHints();
  hintBtn.disabled = G.phase !== "gaps" || !G.hintsLeft || r.hints >= maxHints() || !greyable().length;
  $("hintleft").textContent = tx("left", { n: G.hintsLeft });
  hintBtn.title = tx("hintTitle", { n: G.hintsLeft, m: maxHints() });
  const eb = $("endbtn");
  eb.hidden = lvl().endings !== "button" || G.mode === "exam";
  eb.disabled = !live;
  const g = G.phase === "gaps" && r.gaps[r.active];
  $("trywrap").hidden = !g;
  if (g) triesEl.innerHTML = Array.from({ length: maxTries() }, (_, i) => '<i class="' + (i < g.tries ? "used" : "") + '"></i>').join("");
  $("checkbtn").hidden = !(G.mode === "exam" && G.phase === "gaps");
}
const PROG = { normal: "progFamily", exam: "progExam", review: "progReview", fav: "progFav" };
function updateProgress() {
  showDays();
  if (G.mode === "sprint") return sprintRender();
  const n = Math.min(G.idx + 1, G.total), done = G.idx + (G.phase === "done" ? 1 : 0);
  $("proglbl").textContent = tx(PROG[G.mode] || "progFamily", { n, m: G.total });
  $("pfill").style.width = (Math.min(done, G.total) / G.total * 100) + "%";
}

/* ---------- Hints and the Endings button ---------- */
// One hint from the game's pool (at most maxHints() a round, text only): greys out something the text doesn't need.
function useHint() {
  const r = G.r;
  if (!r || G.phase !== "gaps" || !G.hintsLeft || r.hints >= maxHints() || !gapHint()) return;
  r.hints++; G.hintsLeft--; sndHint();
  renderTools(); flash($("hintleft"), "tick");
}
hintBtn.addEventListener("click", useHint);
// Levels with "endings": "button" can show the typical endings in the zones, free of charge.
$("endbtn").addEventListener("click", () => {
  const on = !board.classList.contains("ends");
  showEndings(on); if (on) sndHint(); else sndBack();
});
function showEndings(on) { board.classList.toggle("ends", !!on); $("endbtn").setAttribute("aria-pressed", String(!!on)); }
// Idle reminder: after 15 s without a tap or key (again every 15 s) the hint button wiggles while a hint is usable, and
// the Endings button with it while the endings are hidden.
let lastAct = Date.now();
["pointerdown", "keydown"].forEach(t => addEventListener(t, () => { lastAct = Date.now(); }, true));
setInterval(() => {
  if ((G.phase !== "sort" && G.phase !== "gaps") || Date.now() - lastAct < 15000) return;
  const eb = $("endbtn"), bs = [hintBtn, eb].filter(b => !b.disabled && !b.hidden && b.getAttribute("aria-pressed") !== "true");
  if (!bs.length) return;
  lastAct = Date.now(); if (!reduceMotion) bs.forEach(b => flash(b, "nudge"));
}, 1000);

/* 11-drag.js — moving bubbles: pointer drag & drop, tap, keyboard, and the fly-in animation.
   Sort phase: pool bubbles go to zones. Gaps phase: zone bubbles (the word bank) go to gaps.
   While dragging, the bubble stays in place (faded) and a copy follows the pointer; targets light up (.hot) and a gap
   pulls the copy in a little. A press that doesn't move is a tap: in the sort phase it picks the bubble (then tap a
   zone; with a keyboard, Enter on a bubble, then Enter on a zone); in the gaps phase it fills the highlighted gap. On a touch screen (no hover to show meanings),
   where the level shows them (not "meaningsAtEnd"), the first tap lifts the word and shows its meaning; a second tap
   on it, or a tap on a gap, fills that gap.
   Squash and stretch (from Be Do Modal, Nov 2026): the carried copy stretches along the way it moves, more the faster,
   and as much thinner across; it rounds out as the pointer slows; let go, the bubble that lands wobbles. */
let drag = null;
const STRETCH = .2, sq = { el: null, vx: 0, vy: 0, lx: 0, ly: 0, lt: 0, raf: 0 };
let landWobble = 0;   // set while a drop is handled: flyFrom() wobbles what lands, this much (0-1)
function sqStart(el) { sq.el = el; sq.vx = sq.vy = 0; sq.lt = 0; }
function sqMove(x, y) {
  const now = performance.now();
  if (sq.lt) { const dt = Math.max(8, now - sq.lt); sq.vx += ((x - sq.lx) / dt - sq.vx) * .5; sq.vy += ((y - sq.ly) / dt - sq.vy) * .5; }   // px per ms, smoothed
  sq.lx = x; sq.ly = y; sq.lt = now;
  if (!sq.raf) sq.raf = requestAnimationFrame(sqTick);
}
function sqTick() {
  sq.raf = 0; if (!sq.el) return;
  const v = Math.hypot(sq.vx, sq.vy), s = reduceMotion ? 0 : Math.min(STRETCH, v * .08);
  let t = "scale(1.1) rotate(-3deg)";   // the carried look (.w.drag, 10-game.css)
  if (s > .004) { const a = (Math.atan2(sq.vy, sq.vx) * 180 / Math.PI).toFixed(1); t = "rotate(" + a + "deg) scale(" + (1.1 * (1 + s)).toFixed(3) + "," + (1.1 / (1 + s)).toFixed(3) + ") rotate(" + (-a) + "deg) rotate(-3deg)"; }
  sq.el.style.transform = t;
  if (performance.now() - sq.lt > 30) { sq.vx *= .8; sq.vy *= .8; }   // the pointer has stopped: round out
  if (s > .004) sq.raf = requestAnimationFrame(sqTick);
}
function sqEnd() {
  if (sq.raf) cancelAnimationFrame(sq.raf);
  const v = Math.hypot(sq.vx, sq.vy); sq.raf = 0; sq.el = null;
  return Math.min(1, .35 + v * .6);   // a fuller wobble after a fast move
}
// The wobble of a bubble let go: the `scale` property, so it adds to the fly-in's transform and the float's translate.
function wobble(el, k) {
  if (reduceMotion || !el.animate || !k) return;
  el.animate([{ scale: (1 + .07 * k) + " " + (1 - .07 * k) }, { scale: (1 - .045 * k) + " " + (1 + .045 * k) }, { scale: (1 + .02 * k) + " " + (1 - .02 * k) }, { scale: "1 1" }], { duration: 480, easing: "ease-out" });
}
// Pool word W (sort phase) or bank word B (gaps phase) that can move now.
function movable(W) {
  if (!W || W.gone) return false;
  return W.bank ? G.phase === "gaps" && !W.used && !W.off : G.phase === "sort";
}
// Animate el from rect `from` (where it appeared to be) to where it is now.
function flyFrom(el, from) {
  if (!from || reduceMotion) return;
  wobble(el, landWobble);
  const to = el.getBoundingClientRect(), s = from.width / (to.width || 1);
  if (Math.abs(from.left - to.left) < 1 && Math.abs(from.top - to.top) < 1) return;
  el.animate([{ transformOrigin: "0 0", transform: "translate(" + (from.left - to.left) + "px," + (from.top - to.top) + "px) scale(" + s + ")" },
              { transformOrigin: "0 0", transform: "none" }], { duration: 420, easing: "cubic-bezier(.3,1.25,.55,1)" });
}
// The pool bubble picked by a tap (sort phase), or none.
function selectWord(W) {
  const r = G.r; if (!r) return;
  if (r.sel) r.sel.el.classList.remove("sel");
  r.sel = W || null;
  if (W) W.el.classList.add("sel");
  board.classList.toggle("picking", !!W);
}
// The zone word lifted by a first touch tap in the gaps phase (r.pick), or none.
function pickBank(B) {
  const r = G.r; if (!r) return;
  if (r.pick) r.pick.el.classList.remove("sel");
  r.pick = B || null;
  if (B) B.el.classList.add("sel");
}
// pt = the pointer type ("" for a key).
function tap(W, pt) {
  const r = G.r;
  if (G.phase === "sort" && !W.bank) { selectWord(r.sel === W ? null : W); if (r.sel) tone(587.33, 0, .08, .04, 0, true); }
  else if (G.phase === "gaps" && W.bank) {
    if ((pt === "touch" || pt === "pen") && !lvl().meaningsAtEnd && r.pick !== W) {
      pickBank(W); showGloss({ el: W.el, w: W.w, c: W.c }, true); speak(sayWord(W.w, W.c), W.el);
      return;
    }
    pickBank(null); hideGloss();
    if (r.gaps[r.active]) gapDrop(W, r.active, W.el.getBoundingClientRect());
  }
}

/* ---------- Targets ---------- */
// The drop target under (x, y): { zone: class } in the sort phase, { gap: index } in the gaps phase, or null.
function dropAt(x, y) {
  const r = G.r;
  if (G.phase === "sort") {
    for (const c of CLASSES) { const b = zoneEls[c].getBoundingClientRect(), m = 10; if (x > b.left - m && x < b.right + m && y > b.top - m && y < b.bottom + m) return { zone: c }; }
    return null;
  }
  let best = null, bd = 60;   // the nearest open gap within 60 px
  r.gaps.forEach(g => {
    if (g.done || g.busy) return;
    const b = g.slot.getBoundingClientRect(), dx = Math.max(b.left - x, 0, x - b.right), dy = Math.max(b.top - y, 0, y - b.bottom), d = Math.hypot(dx, dy);
    if (d < bd) { bd = d; best = { gap: g.i }; }
  });
  return best;
}
function setHot(hot) {
  CLASSES.forEach(c => zoneEls[c].classList.toggle("hot", !!hot && hot.zone === c));
  if (G.r) G.r.gaps.forEach(g => g.el && g.el.classList.toggle("hot", !!hot && hot.gap === g.i));
}

/* ---------- Pointer ---------- */
board.addEventListener("pointerdown", e => {
  const el = e.target.closest(".w"); if (!el || !el.__w || e.button > 0 || !movable(el.__w)) return;
  e.preventDefault();
  drag = { W: el.__w, x0: e.clientX, y0: e.clientY, on: false, hot: null };
  el.setPointerCapture(e.pointerId);
});
board.addEventListener("pointermove", e => {
  if (!drag) return;
  const W = drag.W, el = W.el;
  if (!drag.on) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 7) return;
    const rc = el.getBoundingClientRect();
    drag.on = true; drag.ox = drag.x0 - rc.left; drag.oy = drag.y0 - rc.top;
    const av = drag.av = el.cloneNode(true);
    av.classList.remove("sel", "glow", "split", "shake"); av.classList.add("drag");
    av.style.width = rc.width + "px"; av.style.height = rc.height + "px";
    document.body.appendChild(av); el.classList.add("lifted"); sqStart(av);
    if (G.r.sel && G.r.sel !== W) selectWord(null);
    pickBank(null);
    hideGloss();
  }
  let x = e.clientX - drag.ox, y = e.clientY - drag.oy;
  const hot = drag.hot = dropAt(e.clientX, e.clientY);
  // Magnet: near a gap the copy is pulled part of the way into it.
  if (hot && hot.gap != null) {
    const b = G.r.gaps[hot.gap].slot.getBoundingClientRect(), av = drag.av;
    const tx = b.left + b.width / 2 - av.offsetWidth / 2, ty = b.top + b.height / 2 - av.offsetHeight / 2;
    const f = Math.max(0, 1 - Math.hypot(tx - x, ty - y) / 120) * .55;
    x += (tx - x) * f; y += (ty - y) * f;
  }
  drag.av.style.left = x + "px"; drag.av.style.top = y + "px";
  sqMove(x, y);
  setHot(hot);
});
function endDrag(e) {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.on) { if (e.type === "pointerup") tap(d.W, e.pointerType); return; }
  setHot(null);
  const from = d.av.getBoundingClientRect();
  d.av.remove(); d.W.el.classList.remove("lifted");
  landWobble = sqEnd();
  try {
    if (!d.hot || !movable(d.W)) { flyFrom(d.W.el, from); sndBack(); return; }
    if (d.hot.zone) sortDrop(d.W, d.hot.zone, from);
    else gapDrop(d.W, d.hot.gap, from);
  } finally { landWobble = 0; }
}
board.addEventListener("pointerup", endDrag);
board.addEventListener("pointercancel", endDrag);
/* Safety nets for this drag (2026-11-22, from Question Bubbles: on computers, a MacBook among them, a dragged bubble
   could stay stuck on its target when the browser never reported the release, e.g. let go outside the window). A mouse
   move with no button held = the drop (a release is sent); a new mouse press or the window losing focus = back. */
(function () {
  function fire(type, e) { board.dispatchEvent(new PointerEvent(type, { bubbles: true, clientX: e ? e.clientX : 0, clientY: e ? e.clientY : 0, pointerId: e ? e.pointerId : (drag.id || 1), pointerType: "mouse" })); }
  function back(e) { if (!drag) return; drag.hot = null; fire("pointercancel", e); }
  document.addEventListener("pointermove", function (e) { if (drag && e.pointerType === "mouse" && !e.buttons) fire("pointerup", e); }, true);
  document.addEventListener("pointerdown", function (e) { if (e.pointerType === "mouse") back(e); }, true);
  window.addEventListener("blur", function () { back(); });
})();

/* ---------- Clicks and keys ---------- */
board.addEventListener("click", e => {
  const r = G.r; if (!r) return;
  // Keyboard Enter / Space on a bubble arrives as a click with detail 0 (pointer taps are handled above).
  const el = e.target.closest(".w");
  if (e.detail === 0 && el && el.__w && movable(el.__w)) return tap(el.__w, "");
  // A picked bubble + a tap on a zone (anywhere on it, even on a word already there).
  const z = e.target.closest(".zone");
  if (z && G.phase === "sort" && r.sel) { e.stopPropagation(); return sortDrop(r.sel, z.dataset.c, r.sel.el.getBoundingClientRect()); }
  // A gap: makes it the active one; with a lifted word (first touch tap), fills it with that word.
  const gp = e.target.closest(".gap");
  if (gp && G.phase === "gaps") {
    const i = +gp.dataset.i, B = r.pick, g = r.gaps[i];
    setActive(i);
    if (B && g && !g.done && !g.busy) { pickBank(null); hideGloss(); gapDrop(B, i, B.el.getBoundingClientRect()); }
  }
});
document.addEventListener("keydown", e => {
  if (G.phase !== "sort" || e.ctrlKey || e.metaKey || e.altKey || !$("tour").hidden || document.querySelector(".favmodal.show")) return;
  const r = G.r;
  if (e.key === "Escape" && r.sel) selectWord(null);
  else if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("zone") && r.sel) {
    e.preventDefault(); sortDrop(r.sel, e.target.dataset.c, r.sel.el.getBoundingClientRect());
  }
});

const PERSON = '<svg class="pi" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg>';

/* ---------- Bubbles ---------- */
function startSort() {

// A pool bubble. Hues stay in the violet band, away from the four zone colours, so colour gives nothing away.
function mkWord(d, n) {

// The copy of word d that stays in zone c. In the gaps phase the zones are the word bank: these go into the gaps.
function mkBank(d, c, shown) {

  if (d.stress) {

function setMore(W) {

/* ---------- Dropping into a zone ---------- */
// from = the rect the bubble flies from (the dragged copy, or the bubble itself after a tap / key).
function sortDrop(W, c, from) {

function sortRight(W, c, from, shown) {

/* ---------- Teaching lines ---------- */
function rightMsg(d, c) { return tx("right", { w: markHTML(d.m), cls: clsOf(c).a }) + tipLine(d, c) + sayLine(d); }
// For a homograph: same spelling, different stress in each class.
function sayLine(d) { return d.stress ? " " + tx("homograph", { w: esc(d.w) }) : ""; }
function tipLine(d, c) { const t = tipFor(d, c); return t ? " " + t : ""; }
// What word d's note (families/*.json) or affixes (affixes.json) say about it, for class c. "" if nothing useful.
// At native-UI levels (B1) the note comes from the family's translation ("notes": { word: text }) when it has one.
function tipFor(d, c) {
  const n = (nativeUi() && (famTr().notes || {})[d.w]) || d.note;
  if (n) return esc(n);
  const A = DATA.affixes;
  if (d.sk) {
    const u = A.suffixes[d.sk], s = esc("-" + d.sk);
    if (c === "noun" && d.person && (A.person || []).includes(d.sk)) return tx("tipPerson", { s });
    if (u === c) return tx("tipSuffix", { s, cls: clsOf(u).plural });
    if (!d.c.includes(u)) return tx("tipSuffixNot", { s, cls: clsOf(u).plural, w: esc(d.w) });
  }
  if (d.pk) {
    const p = A.prefixes[d.pk], s = esc(d.pk + "-");
    if (p === "not") return tx("tipNot", { p: s });
    if (p === "same") return tx("tipSame", { p: s });

/* ---------- Hint ---------- */
// Picks a bubble (one with a wrong drop first), makes it glow with its zone, and says where it goes.

/* 13-gaps.js — the gaps phase: a short text (like Part 3 of the FCE / CAE exams) with 1–2 gaps, each filled with a word
   from the zones: drag it, or tap it to fill the highlighted gap. A gap is checked as soon as it's filled: +GAP_PTS first time, +1 on the second try; the first wrong word
   gets a word-class clue, the next one the gap's "why"; after maxTries() the answer is shown.
   Exam mode (22-modes.js): no sorting and no zones — the player types each word (American spelling accepted); the
   zones fill in at the end. */
function startGaps() {
  const r = G.r, f = r.f, exam = G.mode === "exam";
  G.phase = "gaps";
  r.gaps = f.gaps.map((g, i) => Object.assign({ i, tries: 0, done: false, ok: false, busy: false }, g));
  r.off = { c: new Set(), w: new Set() };
  r.max += GAP_PTS * r.gaps.length;
  poolEl.hidden = true; paraEl.hidden = false; paraEl.classList.toggle("locked", !!lvl().textMeaningsAtEnd);
  paraEl.classList.toggle("long", f.text.split(/\s+/).length > 28);   // C2's longer texts: slightly smaller type, so the card still fits
  board.classList.toggle("exam", exam);
  paraEl.innerHTML = '<span class="tag">' + tx(exam ? "examTag" : "textTag") + '</span><p class="ptext">' + gapsHTML(f) + "</p>";
  r.gaps.forEach(g => { g.el = paraEl.querySelector('.gap[data-i="' + g.i + '"]'); g.slot = g.el.querySelector(".gslot"); });
  if (exam) r.gaps.forEach(mkInput);
  flash(paraEl, "in"); ttsWake();
  setActive(0);
  hintEl.innerHTML = tx(exam ? "examHow" : !canHover && !lvl().meaningsAtEnd ? "gapsHowTouch" : r.gaps.length > 1 ? "gapsHow2" : "gapsHow1", { root: esc(f.root.toUpperCase()) });
  renderTools();
}
// The family's text with empty gaps; its words show their meaning on hover or tap (16-gloss.js). Punctuation right after a gap stays on its line.
function gapsHTML(f) {
  const parts = f.text.split(/\{(\d)\}/);
  return parts.map((s, k) => {
    if (!(k % 2)) return wordsHTML(s);
    const p = (parts[k + 1].match(/^[,.;:!?)]+/) || [""])[0];
    parts[k + 1] = parts[k + 1].slice(p.length);
    return '<span class="gapw"><span class="gap" data-i="' + s + '"><span class="gslot"></span></span>' + esc(p) + "</span>";
  }).join("");

// The gap that a tap on a bank word fills: i, or the first open one.
function setActive(i) {
  const r = G.r, open = r.gaps.filter(g => !g.done);
  const g = r.gaps[i] && !r.gaps[i].done ? r.gaps[i] : open[0];
  r.active = g ? g.i : -1;
  r.gaps.forEach(x => x.el.classList.toggle("on", x === g));

// How the answer of gap g is written in the text (capital at the start of a sentence).
const shownAs = (g, w) => g.cap ? cap(w) : w;

const US_UK = Object.fromEntries(Object.entries(DATA.us).map(([uk, us]) => [us, uk]));

/* ---------- Dragged or tapped words ---------- */
function gapDrop(B, i, from) {

  g.busy = true;
  const el = document.createElement("span");
  el.className = "b w"; el.style.setProperty("--h", DATA.classes[B.c].hue); el.textContent = shownAs(g, B.w); soapify(el);
  g.slot.innerHTML = ""; g.slot.appendChild(el); g.el.classList.add("filled");

function checkGap(g, B, el) {

    // The right word from another of its zones (help from Verb for a noun gap): it scores as usual, but its copy from
    // the right zone takes its place (it flies in from there) and the one dropped goes back to its zone.
    const C = B.c !== g.c && r.bank.find(b => b.w === B.w && b.c === g.c && !b.used);

function gapRight(g, el, B) {

// wc = the class of the word tried (the zone it came from), or "" when a typed word isn't in the family.
function gapWrong(g, w, wc) {

  let msg;

  else if (wc && wc !== g.c) msg = tx("gapClass", { w: esc(w), cls: clsOf(wc).a });

// Out of tries: the answer goes into the gap (amber), no points.
function revealGap(g) {

  const el = document.createElement("span");
  el.className = "b w shown"; el.style.setProperty("--h", DATA.classes[g.c].hue); el.textContent = shownAs(g, g.a); soapify(el);
  g.slot.innerHTML = ""; g.slot.appendChild(el); g.el.classList.add("filled");
