<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- English Bubbles app (added by the app's build.py, not part of the game's own files) -->
<script>
/* early-theme.js — runs in <head>, before the first paint, in the menu AND in every game: puts on the background
   colour saved in eb-bg (the games' palettes, "p:sky" or "c:#7aa7ff"), so a page never flashes its default colour
   first. The page's own 01-theme.js applies the same colour again a moment later. Keep PAL in step with PALETTES
   (src/js/01-theme.js and the games). */
(function () {
  try {
    var PAL = {
      sky: ["#e4f3fb", "#f1e8fb", "#fdf0e6", 0], peach: ["#ffe6d8", "#ffd6e4", "#fff1c9", 0],
      mint: ["#d9f4e6", "#d3eef6", "#eef6d3", 0], lilac: ["#e9e0fb", "#f7d9ee", "#dbe6fb", 0],
      dusk: ["#2a1740", "#58224f", "#1f3560", 1], midnight: ["#141964", "#441464", "#144e64", 1]
    };
    var s = Storage.prototype.getItem.call(window.localStorage, "eb-bg") || "", c = null;
    if (s.indexOf("p:") === 0) c = PAL[s.slice(2)] || null;
    else if (/^c:#[0-9a-f]{6}$/i.test(s)) {
      var hex = s.slice(2), r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255,
        b = parseInt(hex.slice(5, 7), 16) / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b),
        l = (mx + mn) / 2, h = 0, sat = 0, d = mx - mn;
      if (d) {
        sat = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
        h = (mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) * 60;
      }
      var col = function (dh) { return "hsl(" + ((h + dh + 360) % 360).toFixed(0) + "," + (sat * 100).toFixed(0) + "%," + (l * 100).toFixed(0) + "%)"; };
      c = [col(0), col(40), col(-40), l * 100 < 52];
    }
    if (c) {
      var root = document.documentElement;
      root.style.setProperty("--bg-a", c[0]); root.style.setProperty("--bg-b", c[1]); root.style.setProperty("--bg-c", c[2]);
      root.dataset.theme = c[3] ? "dark" : "light";
    }
  } catch (e) {}
  // The phone's bars (theme-color) follow the background: its top colour --bg-a, set here or later by the page's own
  // colour picker (menu or game: both write --bg-a on <html>). No colour chosen: the default light / dark ones.
  try {
    var html = document.documentElement, last = "";
    var bar = function () {
      var a = html.style.getPropertyValue("--bg-a").trim(), m = document.querySelectorAll('meta[name="theme-color"]');
      for (var i = 0; i < m.length; i++) {
        var v = a || (/dark/.test(m[i].media) ? "#141964" : "#e4f3fb");
        if (m[i].content !== v) m[i].content = v;
      }
      last = a;
    };
    bar();
    document.addEventListener("DOMContentLoaded", bar);
    new MutationObserver(function () {
      if (html.style.getPropertyValue("--bg-a").trim() !== last) bar();
    }).observe(html, { attributes: true, attributeFilter: ["style"] });
  } catch (e) {}
})();

/* iPhone / iPad: ask for a "playback" audio session, so the game's sounds play even with Silent mode on (iOS 17+;
   some games already do this themselves). Websites can't detect Silent mode, so the menu also shows a tip. */
try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
document.documentElement.classList.add("eb-arrive");   /* the header slides in (see the style below) */
</script>
<style>
/* A soft cross-fade between the menu and the games (Chrome; other browsers just switch). Both pages opt in. */
@media (prefers-reduced-motion: no-preference) {
  @view-transition { navigation: auto; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .25s; animation-timing-function: ease-out; }
}
/* The header slides down in from the top when a page arrives (html.eb-arrive, set in <head>, removed when the slide
   ends). It is the real header that moves, not a view-transition snapshot: a snapshot can't show the frosted-glass
   blur (a flat bar showed on PC) and was choppy on Android. The blur is off only while it moves (it is the costly
   part); it returns when the slide ends. */
@media (prefers-reduced-motion: no-preference) {
  html.eb-arrive header.dock { animation: eb-dock-in .48s cubic-bezier(.22,1,.36,1) both; will-change: transform, opacity;
    -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
}
@keyframes eb-dock-in { from { transform: translateY(calc(-100% - 28px)); opacity: 0; } }
/* Leaving with the Games button: the game fades away completely while its sound plays, leaving only its background,
   which is the menu's colour too; the menu then fades in on top. (Half-faded, the page froze on a dim picture while
   the menu loaded: "laggy".) */
html.eb-leaving body { opacity: 0; transition: opacity .22s ease-in; pointer-events: none; }
</style>
<script>
/* Every game saves its progress in the phone's storage. In the app all games share one storage, so each game's
   keys get the prefix "eb:word-families:" here; two games can then use the same key names without overwriting each other.
   One exception: the background colour (every game saves it as "<prefix>-bg", e.g. "p:sky" or "c:#7aa7ff", like
   the menu) is ONE setting for the whole app, kept under the menu's key "eb-bg": the game opens with the colour
   chosen in the menu, and a colour chosen in a game becomes the menu's and the other games' too. */
(function () {
  try {
    var P = "eb:word-families:", L = window.localStorage, S = Storage.prototype, BG = /^[a-z]+-bg$/;
    var get = S.getItem, set = S.setItem, del = S.removeItem;
    /* The EN / PT toggles too: ONE language for the whole app, the menu's (eb-lang). Each game saves its toggles
       under its own keys, with its own word for Portuguese (games.json "lang": "pt", "tr" or "native"; English is
       always "en"): reading one gives the menu's language, and a tap in a game changes the menu's and every
       game's. Until EN / PT is chosen, the menu's own rule: Portuguese for My level All / A1 / A2, English from B1. */
    var LG = {"lex-guidelang": "tr", "lex-tour-lang": "tr"};
    function appLang() {
      var l = get.call(L, "eb-lang");
      if (l === "en" || l === "pt") return l;
      var lv = get.call(L, "eb-level");
      return lv === "B1" || lv === "B2+" ? "en" : "pt";
    }
    S.getItem = function (k) {
      if (this === L && BG.test(k)) { var app = get.call(this, "eb-bg"); if (app) return app; }
      if (this === L && LG.hasOwnProperty(k)) return appLang() === "en" ? "en" : LG[k];
      return get.call(this, this === L ? P + k : k);
    };
    S.setItem = function (k, v) {
      if (this === L && BG.test(k)) set.call(this, "eb-bg", v);
      if (this === L && LG.hasOwnProperty(k)) set.call(this, "eb-lang", String(v) === "en" ? "en" : "pt");
      return set.call(this, this === L ? P + k : k, v);
    };
    S.removeItem = function (k) { return del.call(this, this === L ? P + k : k); };
    /* The app's own keys (eb-rounds, eb-don…) and language, for the injected donation script (donate.js) */
    window.ebApp = { get: function (k) { return get.call(L, k); }, set: function (k, v) { set.call(L, k, v); }, lang: appLang };
    /* Opened from the menu (a card or Continue)? Then the game starts at the menu's level ("My level"): the menu
       leaves a one-time note (sessionStorage eb-level-go), and the matching level is saved under the game's own
       level key before the game reads it (games.json "level"; the nearest level when the game doesn't have it).
       With "All" on the menu, or on a reload, the game keeps its own last level. */
    var LV = {"key": "lex-level", "A1": "B1", "A2": "B1", "B1": "B1", "B2+": "B2"}, SS = window.sessionStorage;
    if (SS.getItem("eb-level-go") === "word-families") {
      SS.removeItem("eb-level-go");
      var m = get.call(L, "eb-level");
      if (LV && LV[m]) set.call(L, P + LV.key, LV[m]);
    }
  } catch (e) {}
})();
</script>

<style>
/* 00-base.css — tokens, page, header dock, swatches, colour picker, language picker, volume, glass bubble, modals,
   score / progress tiles, CTA button and the tutorial. Taken unchanged from Conditional Bubbles. */
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg-a: #e4f3fb; --bg-b: #f1e8fb; --bg-c: #fdf0e6;
  --ink: #26385c;
  --fill-hi: rgba(255,255,255,.95);
  --fill-mid: rgba(255,255,255,.45);
  --fill-lo: rgba(255,255,255,.18);
  --gloss: rgba(255,255,255,.95);
  --underline: #e0558a;
  --rim-l: 74%; --glow-l: 82%; --lab-l: 38%;
  /* the soap bubbles (17-shine.js, 10-game.css end): shine, film, rim, inner glow, shadow; the background bubbles (--sky-*) */
  --sky-o: .85; --sky-rim-l: 68%; --sky-rim-a: .38; --sky-glow-l: 74%; --sky-glow-a: .2; --sky-hi: .7; --sky-tint-a: .07; --soap-hi: .3; --soap-gl: 1; --spot-plus: 1; --rimhi-l: 56%; --rimhi-a: .85; --faceg-l: 66%; --faceg-a: .18; --soap-lo: .06; --film-a: .18; --srim-l: 70%; --srim-a: .7; --sglow-l: 78%; --sglow-a: .34; --soap-sh: rgba(60,70,140,.07); --soap-sh2: rgba(60,70,140,.12);
  --shadow: rgba(60,70,140,.16);
  --dock-bg: rgba(255,255,255,.62);
  --dock-line: rgba(38,56,92,.14);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-a: #141964; --bg-b: #441464; --bg-c: #144e64;
    --ink: #eaf1ff;
    --fill-hi: rgba(255,255,255,.16); --fill-mid: rgba(255,255,255,.07); --fill-lo: rgba(255,255,255,.03);
    --gloss: rgba(255,255,255,.55);
    --underline: #ffb3d1;
    --rim-l: 68%; --glow-l: 62%; --lab-l: 78%;
    --sky-o: .6; --sky-rim-l: 68%; --sky-rim-a: .35; --sky-glow-l: 62%; --sky-glow-a: .22; --sky-hi: .55; --sky-tint-a: .06; --soap-hi: .22; --soap-gl: .5; --spot-plus: .39; --rimhi-l: 88%; --rimhi-a: .75; --faceg-l: 74%; --faceg-a: .13; --soap-lo: .03; --film-a: .24; --srim-l: 72%; --srim-a: .85; --sglow-l: 66%; --sglow-a: .4; --soap-sh: rgba(0,0,0,.22); --soap-sh2: rgba(0,0,0,.32);
    --shadow: rgba(0,0,0,.45);
    --dock-bg: rgba(12,16,44,.55);
    --dock-line: rgba(255,255,255,.16);
  }
}
:root[data-theme="dark"] {
  --ink: #eaf1ff;
  --fill-hi: rgba(255,255,255,.16); --fill-mid: rgba(255,255,255,.07); --fill-lo: rgba(255,255,255,.03);
  --gloss: rgba(255,255,255,.55);
  --underline: #ffb3d1;
  --rim-l: 68%; --glow-l: 62%; --lab-l: 78%;
  --sky-o: .6; --sky-rim-l: 68%; --sky-rim-a: .35; --sky-glow-l: 62%; --sky-glow-a: .22; --sky-hi: .55; --sky-tint-a: .06; --soap-hi: .22; --soap-gl: .5; --spot-plus: .39; --rimhi-l: 88%; --rimhi-a: .75; --faceg-l: 74%; --faceg-a: .13; --soap-lo: .03; --film-a: .24; --srim-l: 72%; --srim-a: .85; --sglow-l: 66%; --sglow-a: .4; --soap-sh: rgba(0,0,0,.22); --soap-sh2: rgba(0,0,0,.32);
  --shadow: rgba(0,0,0,.45);
  --dock-bg: rgba(12,16,44,.55);
  --dock-line: rgba(255,255,255,.16);
}
:root[data-theme="dark"]:not([style*="--bg-a"]) { --bg-a: #141964; --bg-b: #441464; --bg-c: #144e64; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100%;
  background-color: var(--bg-a);
  background-image:
    radial-gradient(60vmax 50vmax at 8% 6%, var(--bg-a), transparent 70%),
    radial-gradient(55vmax 45vmax at 95% 40%, var(--bg-b), transparent 70%),
    radial-gradient(60vmax 50vmax at 30% 100%, var(--bg-c), transparent 70%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: "Fredoka", "Nunito", ui-rounded, "Trebuchet MS", system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .4s ease;
}

/* Controls */
.dock {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  z-index: 5;
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
  gap: 8px 14px;
  width: max-content; max-width: calc(100% - 24px);
  margin: 14px auto 0;
  padding: 6px 8px;
  border-radius: 28px;
  background: var(--dock-bg);
  border: 1px solid var(--dock-line);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: 0 8px 22px var(--shadow);
}
.seg { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; max-width: 100%; }
.seg button {
  appearance: none; border: 0; cursor: pointer;
  font-family: inherit; font-weight: 500; font-size: .95rem; line-height: 1;
  color: var(--ink); background: transparent;
  padding: .62em 1.1em; border-radius: 999px; white-space: nowrap;
  transition: background-color .2s ease, color .2s ease, transform .2s ease;
}
.seg button:hover { background: var(--dock-line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg-a); }
.sw { display: flex; align-items: center; gap: 8px 0; padding: 0 4px; }   /* the circles are spaced by margins, not the gap, so the picker row adds nothing to the pop-over's width */
.sw > button + button { margin-left: 8px; }
.sw button {
  position: relative; display: block; flex: none;
  width: 30px; height: 30px; padding: 0; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.9); cursor: pointer;
  box-shadow: 0 1px 5px var(--shadow);
  transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease;
}
.sw button:hover { transform: scale(1.12); }
.sw .on { box-shadow: 0 0 0 2px var(--dock-bg), 0 0 0 4px var(--ink); }
.sw .swc { background: conic-gradient(#ff7aa8, #ffd36b, #7be0a4, #6bc7ff, #b08cff, #ff7aa8); }
/* The colour picker (01-theme.js; from Be Do Modal, Nov 2026): a full-width row under the swatches while picking. Tracks
   are pills of their own gradient (hue: the rainbow; strength: grey to the hue; light: dark to light), the handle a
   white disc ringed in the colour being made. */
.cpick { contain: inline-size; min-width: 0; display: none; flex: 1 0 100%;   /* contain: it takes the swatch row's width and never widens the pop-over */
  flex-direction: column; gap: 12px; padding: 12px 0 4px; margin-top: 4px; border-top: 1px solid var(--dock-line); }
.swwrap.open.picking .cpick { display: flex; }
.cpick { --cp-h: 220; --cp-s: 100%; --cp-l: 74%; --cp-c: hsl(var(--cp-h), var(--cp-s), var(--cp-l)); }
.cp-top { display: flex; align-items: center; gap: 10px; }
.cp-hex { flex: 1; min-width: 0; font: inherit; font-size: .95rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: transparent;
  border: 1px solid var(--dock-line); border-radius: 999px; padding: .45em .9em; outline: none; }
.cp-hex:focus-visible { border-color: var(--underline); box-shadow: 0 0 0 3px hsla(335,80%,65%,.2); }
.cp-r { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 14px; margin: 4px 0; border-radius: 999px; cursor: pointer;
  background: var(--cp-track); box-shadow: inset 0 0 0 1px var(--dock-line); outline: none; touch-action: none; }
.cp-h { --cp-track: linear-gradient(90deg, hsl(0,85%,62%), hsl(60,85%,62%), hsl(120,85%,62%), hsl(180,85%,62%), hsl(240,85%,62%), hsl(300,85%,62%), hsl(359,85%,62%)); }
.cp-s { --cp-track: linear-gradient(90deg, hsl(var(--cp-h), 0%, var(--cp-l)), hsl(var(--cp-h), 100%, var(--cp-l))); }
.cp-l { --cp-track: linear-gradient(90deg, hsl(var(--cp-h), var(--cp-s), 8%), hsl(var(--cp-h), var(--cp-s), 50%), hsl(var(--cp-h), var(--cp-s), 92%)); }
.cp-r::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 4px solid var(--cp-c); box-shadow: 0 2px 6px var(--shadow); transition: transform .2s cubic-bezier(.34,1.56,.64,1); }
.cp-r::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 4px solid var(--cp-c); box-shadow: 0 2px 6px var(--shadow); }
.cp-r::-moz-range-track { background: transparent; }
.cp-r:hover::-webkit-slider-thumb, .cp-r:active::-webkit-slider-thumb { transform: scale(1.15); }
.cp-r:focus-visible { box-shadow: inset 0 0 0 1px var(--dock-line), 0 0 0 3px hsla(335,80%,65%,.25); }
.dock button:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }

/* Phones: the dock fills the width; modes share row one, swatches sit centred on row two */
@media (max-width: 600px) {
  .dock { width: calc(100% - 20px); max-width: none; margin: 10px auto 0; padding: 6px; gap: 6px 10px; border-radius: 24px; }
  .seg { width: 100%; }
  .seg button { flex: 1 1 auto; padding: .62em .35em; font-size: clamp(.78rem, 3.6vw, .92rem); }
  .sw { width: 100%; justify-content: center; gap: 8px 0; padding: 0; }
  .sw > button + button { margin-left: clamp(4px, 1.6vw, 8px); }
}
@media (max-width: 380px) {
  .sw button { width: 28px; height: 28px; }
}
/* Level segment with sliding indicator (from template 2) */
.seg-cap { font-size: .85rem; opacity: .75; padding: 0 .3em 0 .6em; white-space: nowrap; }
/* Menu labels in the dock are set in capitals */
.seg.focus button, .seg-cap, .tourbtn span { text-transform: uppercase; letter-spacing: .07em; }
.seg.focus button { font-size: .88rem; }
.seg-cap { font-size: .76rem; }
.tourbtn span { font-size: .84rem; }
.seg.focus, .seg.level { position: relative; isolation: isolate; }
.seg.focus button[aria-pressed="true"], .seg.level button[aria-pressed="true"] { background: transparent; }
.seg.level { padding: 2px; border-radius: 999px; border: 1px solid var(--dock-line); flex-wrap: nowrap; }
.seg.level button { font-size: .82rem; font-weight: 600; letter-spacing: .04em; padding: .5em .8em; transition: color .3s ease, background-color .2s ease; }
.seg-ind { position: absolute; z-index: -1; top: 0; left: 0; width: 0; height: 0; border-radius: 999px; background: var(--ink); pointer-events: none; opacity: 0; }
.seg-ind.ready { opacity: 1; transition: transform .45s cubic-bezier(.34,1.4,.64,1), width .45s cubic-bezier(.34,1.4,.64,1), background-color .3s ease; }
.seg.focus button { transition: color .3s ease, background-color .2s ease; }
.seg.level .seg-ind { top: 0; left: 0; }
/* The level selector as tall as the header's round buttons (.tourbtn: an 18px icon, its padding at .92rem, a 1px
   border) at every screen size, its buttons filling it (the sliding pill follows them). As in There or Have. */
.seg.level { box-sizing: content-box; height: calc(18px + 1.1 * .92rem - 4px); align-items: stretch; }   /* - its own 2px padding */
.dock .seg.level button { padding-top: 0 !important; padding-bottom: 0 !important; }
@media (max-width: 820px) { .seg.level { height: calc(18px + .92rem - 4px); } }
/* Each level has its own gradient (--lv, --lv2 on its button, from levels.json "grad"): the sliding pill takes the
   chosen one's, and hovering a level tints it with its own colour. As in Preposition Practice and Verb Bubbles. */
.seg.level button:hover { background: color-mix(in srgb, var(--lv, var(--ink)) 22%, transparent); }
.seg.level button[aria-pressed="true"] { color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
.seg.level .seg-ind { background: linear-gradient(135deg, var(--lv, var(--ink)), var(--lv2, var(--ink))); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 3px 10px var(--shadow); }
/* Glass bubble */
.b {
  --h: 200;
  position: relative;
  appearance: none; cursor: pointer;
  font-family: inherit; font-weight: 500;
  font-size: clamp(1.05rem, 1.5vw + .7rem, 1.4rem);
  line-height: 1;
  letter-spacing: .01em;
  color: var(--ink);
  padding: .78em 1.35em .82em;
  border-radius: 1.5em;
  border: 1.5px solid hsla(var(--h), 75%, var(--rim-l), .75);
  background: radial-gradient(120% 140% at 22% 14%, var(--fill-hi), var(--fill-mid) 48%, var(--fill-lo) 100%);
  box-shadow:
    inset 0 0 16px hsla(var(--h), 95%, var(--glow-l), .38),
    inset -5px -7px 14px hsla(calc(var(--h) + 70), 95%, var(--glow-l), .28),
    0 7px 16px var(--shadow);
  transition: transform .28s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease, border-color .25s ease;
}
.b::before {
  content: ""; position: absolute; left: 11%; top: 9%; width: 26%; height: 20%;

/* Family badge: the root of the family */
.fam { display: inline-flex; align-items: baseline; gap: .6em; padding: .45em 1.2em .5em; border-radius: 999px;
  background: var(--dock-bg); border: 1px solid var(--dock-line); box-shadow: 0 4px 14px var(--shadow); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.fam small { font-size: .72rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; opacity: .65; }
.fam b { font-size: clamp(1.35rem, 1.2vw + 1rem, 1.8rem); font-weight: 700; letter-spacing: .14em; line-height: 1.1; }

/* Pool: the family's bubbles float here until they are sorted */
.pool { flex: 1; width: 100%; min-height: 210px; box-sizing: border-box; display: flex; flex-wrap: wrap; justify-content: center; align-content: center;
  gap: 18px 14px; padding: 26px 16px; border-radius: 2em; border: 2px dashed var(--dock-line);
  background: radial-gradient(120% 140% at 30% 10%, var(--fill-mid), var(--fill-lo) 70%); }
.pool .w { animation: bob var(--dur, 4s) ease-in-out var(--dl, 0s) infinite alternate; }
@keyframes bob { from { translate: 0 0; } to { translate: var(--bx, 0px) var(--by, -6px); } }

/* Word bubbles (the look comes from .b in 00-base.css) */
.home { display: inline-flex; border-radius: 999px; transition: opacity .35s ease, transform .35s ease; }
.home.gone { opacity: 0; transform: scale(.6); pointer-events: none; }
.b.w { font-size: 1.12rem; line-height: 1.1; padding: .58em 1.05em .62em; border-radius: 999px; white-space: nowrap; touch-action: none; user-select: none; -webkit-user-select: none; }
.b.w:hover, .b.w:focus-visible { transform: translateY(-4px) scale(1.07); }
.w.drag { position: fixed; z-index: 60; margin: 0; pointer-events: none; animation: none; transition: none; transform: scale(1.1) rotate(-3deg);
  box-shadow: inset 0 0 22px hsla(var(--h),100%,var(--glow-l),.6), 0 18px 30px var(--shadow), 0 0 0 4px hsla(var(--h),90%,75%,.25); }
.w.lifted { opacity: .22; }
.w.sel { transform: translateY(-6px) scale(1.1); border-color: var(--underline);
  box-shadow: inset 0 0 22px hsla(var(--h),100%,var(--glow-l),.6), 0 14px 24px var(--shadow), 0 0 0 4px hsla(330,90%,70%,.35); }
.w.bad { border-color: hsl(350,75%,60%); box-shadow: inset 0 0 18px hsla(350,90%,68%,.5), 0 6px 14px var(--shadow); }
.w.ok { border-color: hsl(150,60%,48%); box-shadow: inset 0 0 18px hsla(150,80%,60%,.45), 0 6px 14px var(--shadow); }
.w.shown { border-color: hsl(40,90%,55%); box-shadow: inset 0 0 18px hsla(45,95%,60%,.5), 0 6px 14px var(--shadow); }
.w.shake, .zone.shake, .gap.shake { animation: shake .5s ease; }
.w.split { animation: split .55s cubic-bezier(.34,1.56,.64,1); }
.w.glow, .zone.glow { animation: glow 1s ease-in-out 3; }
/* "+1": classes still to find for a word that has more than one */
.w .more { position: absolute; top: -9px; right: -9px; z-index: 1; min-width: 22px; height: 22px; padding: 0 5px; box-sizing: border-box; display: grid; place-items: center;
  border-radius: 999px; font-size: .74rem; font-weight: 700; color: #fff; background: linear-gradient(135deg, hsl(315,85%,60%), hsl(275,80%,60%)); box-shadow: 0 2px 8px var(--shadow); }
/* Affixes light up once a word is sorted */
.afx { font-style: normal; font-weight: 700; color: hsl(var(--h),75%,var(--lab-l)); text-decoration: underline 2px hsla(var(--h),80%,60%,.6); text-underline-offset: 3px; }
.pi { width: .95em; height: .95em; margin: 0 .3em -.1em -.15em; fill: none; stroke: currentColor; stroke-width: 2.2; opacity: .75; }

/* Zones: one per word class */
.zone { --h: 200; position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 150px; padding: 1.9em .7em .8em; border-radius: 1.6em; color: var(--ink); outline: none;
  /* the header's glass, edge and shadow (.dock), as Be Do Modal's sentence card and Build boxes (Nov 2026); the zone's
     colour is in its label and its words, plus a hint of it: a faint rim and inner glow (--zhint) */
  --zhint: inset 0 0 22px hsla(var(--h), 95%, var(--glow-l), .16);
  background: var(--dock-bg); border: 1px solid hsla(var(--h), 70%, var(--rim-l), .42);
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: var(--zhint), 0 8px 22px var(--shadow);
  transition: box-shadow .3s ease, border-color .3s ease, opacity .4s ease, filter .4s ease, transform .3s cubic-bezier(.34,1.56,.64,1); }
.zone:focus-visible { outline: 2px solid var(--underline); outline-offset: 4px; }
.zone.hot { transform: scale(1.03); border-color: hsla(var(--h),85%,62%,.9); box-shadow: var(--zhint), 0 8px 22px var(--shadow), 0 0 0 5px hsla(var(--h),90%,70%,.3); }
.board.picking .zone { cursor: pointer; animation: zpulse 1.5s ease-in-out infinite; }
.tag { position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%); z-index: 2; display: inline-flex; align-items: center; gap: .5em; padding: calc(.3em + 1.5px) calc(.85em + 1.5px); border-radius: 999px; white-space: nowrap;
  font-size: .7rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  /* a flat gradient pill, like the header's chosen pills (Be Do Modal's Build labels, Nov 2026): the zone's colour, the text's pink-violet */
  color: #fff; background: linear-gradient(90deg, var(--g1), var(--g2)); text-shadow: 0 1px 1px rgba(0,0,0,.15); }
.zone .tag { --g1: hsl(var(--h), 72%, 56%); --g2: hsl(calc(var(--h) + 28), 66%, 52%); }
.zone[data-c="adv"] .tag { --g1: hsl(42, 92%, 55%); --g2: hsl(24, 85%, 56%); }   /* yellow-orange, as Be Do Modal's prompt label: a yellow end is too light for white text */
.para .tag { --g1: hsl(330, 80%, 62%); --g2: hsl(300, 60%, 60%); }
.zwords { flex: 1; display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; gap: 9px 6px; }
.zone .w { font-size: .98rem; padding: .48em .85em .52em; touch-action: none; }
.zone .w.used { opacity: .4; }
/* A homograph's stressed syllables (its copies in two zones are stressed differently) */
.w .st { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.w .st2 { text-decoration-style: dotted; }
.zone.off { opacity: .45; filter: grayscale(1); }
.zone .w.off { filter: grayscale(1); opacity: .35; cursor: default; }
.zone.off .w.off { opacity: 1; }
.zends { display: none; flex-wrap: wrap; justify-content: center; gap: 4px; margin: 10px 0 0; }
.board.ends .zends { display: flex; }
.zends span { font-size: .74rem; font-weight: 500; padding: .12em .55em; border-radius: 999px; color: hsl(var(--h),60%,var(--lab-l)); border: 1px dashed hsla(var(--h),60%,var(--rim-l),.95); }
.znote { margin: 8px 0 0; text-align: center; font-size: .7rem; font-style: italic; opacity: .55; color: hsl(var(--h),45%,var(--lab-l)); }
.znote:empty, .board.ends .znote, .board.exam .znote { display: none; }
.zempty { margin: auto 0; text-align: center; font-size: .8rem; opacity: .55; }

/* The text with its gaps */
.para { --h: 265; position: relative; width: 100%; box-sizing: border-box; padding: 1.9em 1.5em 1.3em; border-radius: 1.8em;
  background: var(--dock-bg); border: 1px solid var(--dock-line);   /* the header's glass (Be Do Modal, Nov 2026) */
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: 0 8px 22px var(--shadow); }
.para.in { animation: cardin .45s cubic-bezier(.34,1.56,.64,1); }
.ptext { margin: 0; font-size: clamp(1.08rem, .7vw + .95rem, 1.32rem); font-weight: 500; line-height: 2.2; text-align: left; }
.para.long .ptext { font-size: clamp(.95rem, .616vw + .836rem, 1.16rem); }
.gapw { white-space: nowrap; }
.tw { border-radius: .3em; cursor: pointer; transition: background-color .15s ease, box-shadow .15s ease; }
.tw:hover, .tw.on { background: hsla(265,90%,72%,.22); box-shadow: 0 0 0 .12em hsla(265,90%,72%,.22); }
.para.locked .tw { cursor: default; background: none; box-shadow: none; }
.gap { position: relative; display: inline-flex; align-items: center; vertical-align: middle; margin: 0 .12em; line-height: 1; }
.gslot { display: inline-flex; align-items: center; justify-content: center; min-width: 6.4em; min-height: 2.15em; border-radius: 999px; cursor: pointer;
  border: 2px dashed color-mix(in srgb, var(--ink) 38%, transparent); transition: background-color .2s ease, border-color .2s ease; }
/* Gaps stay grey (no zone colour or pink), so their colour never hints at the word class. */
.gap.on .gslot { border-color: color-mix(in srgb, var(--ink) 70%, transparent); background: color-mix(in srgb, var(--ink) 8%, transparent); }
.gap.hot .gslot { border-color: color-mix(in srgb, var(--ink) 85%, transparent); border-style: solid; background: color-mix(in srgb, var(--ink) 15%, transparent); }
.gap.filled .gslot { border-color: transparent; background: transparent; min-width: 0; cursor: default; }
.gslot .w { font-size: 1rem; padding: .42em .85em .46em; }
.gin { width: 8.6em; min-width: 0; box-sizing: border-box; font: inherit; font-size: max(16px, .95em); font-weight: 500; color: var(--ink); text-align: center;
  padding: .3em .6em; border: 0; border-radius: 999px; background: transparent; outline: none; }
.gap.on .gin { background: var(--fill-lo); }
.gap .ans { font-weight: 700; color: hsl(var(--h),70%,var(--lab-l)); }

/* Tools row */
.tools { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.trywrap { display: inline-flex; align-items: center; gap: 4px; }
.trylab { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
.tries { display: inline-flex; align-items: center; gap: 6px; padding: 0 6px; }
.tries i { width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(135deg, hsl(315,85%,68%), hsl(275,80%,68%)); box-shadow: 0 1px 4px var(--shadow); transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .3s ease; }
.tries i.used { opacity: .18; transform: scale(.65); }
#hintleft.tick { display: inline-block; animation: tick .5s cubic-bezier(.34,1.56,.64,1); }
#hintbtn.nudge, #endbtn.nudge { animation: nudge .7s ease-in-out; }

/* Reveal card */
.reveal { position: relative; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px 18px; max-width: 960px; margin: 18px auto 0; padding: 10px 12px 10px 16px; border-radius: 26px;
  background: var(--dock-bg); border: 1px solid var(--dock-line); box-shadow: 0 8px 22px var(--shadow);
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); animation: cardin .45s cubic-bezier(.34,1.56,.64,1); transition: opacity .25s ease; }
.reveal.out { opacity: 0; }
.chip { display: inline-block; font-size: .74rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: .38em .95em; border-radius: 999px; color: #fff; white-space: nowrap;
  background: linear-gradient(135deg, hsl(var(--h),75%,52%), hsl(calc(var(--h) + 35),70%,50%)); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); text-shadow: 0 1px 1px rgba(0,0,0,.18); }
/* A family in the lists: its level's colours, as in the header (levels.json "grad") */
.chip.lv { background: linear-gradient(135deg, var(--lv, hsl(265,75%,52%)), var(--lv2, hsl(300,70%,50%))); }
.chip.lc { text-transform: none; letter-spacing: .02em; font-size: .82rem; }
.answ { font-weight: 700; color: hsl(var(--h),70%,var(--lab-l)); }
.rv-tr { flex: 1 1 340px; display: flex; align-items: center; gap: 10px; animation: pup .5s .2s ease-out backwards; }
.rv-tr p { margin: 0; font-size: clamp(.95rem, .3vw + .9rem, 1.05rem); font-weight: 500; text-align: left; line-height: 1.35; }
.rv-tr .pick-badge { font-size: .8rem; }
.rv-why { flex: 1 1 100%; list-style: none; margin: 2px 0 4px; padding: 0; display: flex; flex-direction: column; gap: 8px; text-align: left; animation: pup .35s ease-out backwards; }
.rv-why[hidden] { display: none; }
.rv-why li { display: flex; align-items: baseline; gap: 10px; font-size: .92rem; line-height: 1.4; }
.rv-why .chip { flex: none; }
.rv-btns { flex: none; display: flex; justify-content: center; align-items: center; gap: 8px; }
.rv-q { justify-content: center; width: 2.3em; height: 2.3em; padding: 0; font-size: 1rem; font-weight: 700; }
.rv-q[aria-expanded="true"] { background: var(--dock-line); }
@keyframes cardin { from { opacity: 0; transform: scale(.92) translateY(12px); } }
@keyframes pup { from { opacity: 0; transform: translateY(10px); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }

/* Toast + confetti bubbles */
.toast { position: absolute; left: 50%; top: 0; z-index: 5; padding: .35em 1em; border-radius: 999px; font-weight: 600; white-space: nowrap; pointer-events: none;
  background: hsl(150,60%,42%); color: #fff; box-shadow: 0 6px 16px var(--shadow); animation: toast 1.7s ease-out forwards; }
.toast.zero { background: hsl(35,85%,48%); }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%,-40%) scale(.6); } 15% { opacity: 1; transform: translate(-50%,-115%) scale(1.08); } 75% { opacity: 1; transform: translate(-50%,-130%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-175%); } }
.pf { position: fixed; z-index: 55; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at 30% 30%, #fff, hsla(var(--h),85%,75%,.55)); border: 1px solid hsla(var(--h),85%,68%,.85); animation: pfly .8s ease-out forwards; }
@keyframes pfly { from { transform: translate(-50%,-50%) scale(.3); opacity: .95; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1); opacity: 0; } }

@keyframes tick { 0% { transform: scale(1); } 40% { transform: scale(1.5); color: hsl(45,95%,55%); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 15% { transform: translateX(-9px) rotate(-1.5deg); } 35% { transform: translateX(8px) rotate(1.2deg); } 55% { transform: translateX(-6px); } 75% { transform: translateX(4px); } }
@keyframes split { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes glow { 0%,100% { box-shadow: 0 0 0 0 hsla(45,100%,60%,0), 0 7px 16px var(--shadow); } 50% { box-shadow: 0 0 0 7px hsla(45,100%,60%,.55), 0 7px 16px var(--shadow); } }
@keyframes zpulse { 0%,100% { box-shadow: var(--zhint), 0 8px 22px var(--shadow); } 50% { border-color: hsla(var(--h),85%,62%,.7); box-shadow: var(--zhint), 0 8px 22px var(--shadow), 0 0 0 5px hsla(var(--h),90%,70%,.24); } }
@keyframes nudge { 0%, 100% { transform: none; } 15% { transform: rotate(-6deg) scale(1.08); } 35% { transform: rotate(5deg) scale(1.08); } 55% { transform: rotate(-3deg) scale(1.04); } 75% { transform: rotate(2deg); } }

/* Tour: the spotlight glides between targets; header with the EN / translation toggle */
.tour-spot { transition: left .45s cubic-bezier(.3,1.15,.5,1), top .45s cubic-bezier(.3,1.15,.5,1), width .45s cubic-bezier(.3,1.15,.5,1), height .45s cubic-bezier(.3,1.15,.5,1); }
/* No glide until Next / Back (.glide, set in tourGo): the first card pops in where it belongs instead of flying in. */
.tour:not(.glide) .tour-card, .tour:not(.glide) .tour-spot { transition: none; }
.tour-card { transition: left .4s ease, top .4s ease; max-height: calc(100vh - 24px); overflow-y: auto; }
.tour-head { display: flex; align-items: center; gap: .6rem; padding-right: 2.2rem; }
.tour-head .tour-step { padding-right: 0; flex: 1; }
.tour-lang { display: flex; gap: 2px; padding: 2px; border-radius: 999px; border: 1px solid var(--dock-line); flex: none; }
.tour-lang button { appearance: none; border: 0; cursor: pointer; font-family: inherit; font-size: .7rem; font-weight: 600; letter-spacing: .06em; line-height: 1;
  padding: .45em .75em; border-radius: 999px; color: var(--ink); background: transparent; transition: background-color .2s ease, color .2s ease; }
.tour-lang button:hover { background: var(--dock-line); }
.tour-lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg-a); }
.tour-lang button:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
/* Welcome card: a sample family, each word with its classes; gaps card: a sample sentence */
.tour-ex { list-style: none; margin: .6rem 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: .45rem .5rem; }
.tour-ex li { display: inline-flex; align-items: center; gap: .35rem; padding: .25em .3em .25em .7em; border-radius: 999px; border: 1px solid var(--dock-line); font-weight: 500; }
.tour-ex .chip { font-size: .58rem; padding: .3em .65em; }
.tour-demo { margin: .7rem 0 0; padding: .5rem .8rem; border-radius: 1rem; border: 1px dashed var(--dock-line); font-weight: 500; line-height: 2.3; }
.tour-demo .gap .w { font-size: .9rem; }

/* Meaning of a sorted word, shown on hover or tap (16-gloss.js) */
.glosstip { position: fixed; z-index: 60; display: flex; align-items: center; gap: 8px; max-width: min(80vw, 300px); padding: 7px 13px 7px 8px; border-radius: 14px;
  background: var(--dock-bg); border: 1px solid var(--dock-line); color: var(--ink); box-shadow: 0 8px 22px var(--shadow);
  backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
  font-weight: 600; font-size: 1rem; line-height: 1.25; pointer-events: none; animation: gpop .12s ease-out; }
.glosstip .pick-badge { flex: none; font-size: .68rem; }
.glosstip small { display: block; font-size: .72rem; font-weight: 500; opacity: .7; }
.gw { cursor: pointer; border-radius: 6px; transition: background-color .15s ease; }
.gw.on { background: hsla(265,90%,70%,.25); }
@keyframes gpop { from { opacity: 0; transform: translateY(3px); } }

/* Narrower screens: the pool / text on top, the zones in a 2 x 2 grid under it */
@media (max-width: 880px) {
  .board { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "c c" "z0 z2" "z1 z3"; gap: 24px 12px; }
  .pool { min-height: 150px; }
  .zone { min-height: 118px; }
}
/* Phones: the family name on top, the zones under it, and the pool (sorting) or the text (gaps) below the zones. The
   middle column's box steps aside (display: contents) so its children sit in the board's grid; the pool and the text
   share one cell, since only one of them shows at a time. Toasts (14-reveal.js) then place themselves on the board. */
@media (max-width: 600px) {
  .board { position: relative; grid-template-areas: "f f" "z0 z2" "z1 z3" "c c"; }
  .board.exam { grid-template-areas: "f" "c"; }
  .center { display: contents; }
  .fam { grid-area: f; justify-self: center; }
  .pool, .para { grid-area: c; }
}
@media (max-width: 600px) {
  .lang-cap { display: none; }
  .dock { gap: 6px 8px; }
  .hint { font-size: .94rem; margin-top: 10px; }
  .b.w { font-size: 1rem; padding: .5em .85em .55em; }
  .zone { padding: 1.7em .45em .6em; border-radius: 1.3em; }
  .zone .w { font-size: .88rem; padding: .42em .7em .46em; }
  .pool { padding: 20px 10px; gap: 14px 10px; }
  .para { padding: 1.7em 1em 1em; }
  .ptext { line-height: 2.05; }
  .tools { margin-top: 14px; }
  .reveal { margin-top: 14px; padding: 10px; gap: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  #hintleft.tick, .pool .w, .reveal, .rv-tr, .rv-why, .toast, #stage.rise .home, #stage.rise .zone, .board.recap .zone, .board.recap .zone .w, .w.shake, .w.split, .w.glow, .zone.glow,
  .zone.shake, .gap.shake, .board.picking .zone, .para.in, .glosstip, #hintbtn.nudge, #endbtn.nudge { animation: none !important; }
  .tour-spot, .tour-card, #stage, .zone { transition: none; }
}

/* ---------- Soap bubbles (from Be Do Modal, Nov 2026) ----------
   Every word bubble (.b.w: pool, zone copies, gap words, the tour's sample) is almost clear: a faint film of colour inside
   and a 1.5px coloured rim, both turning once in 10 s, its own colour leading (about half of each turn: --th = --h). The
   numbers that differ per theme are tokens in 00-base.css (--soap-*, --film-a, --srim-*, --sglow-*). The border stays,
   clear, so nothing changes size. Built from spans (SOAP, soapify() in 17-shine.js), each drawn once: the film and the
   rim turn by rotating a still conic gradient (.spin: a transform animation, nothing is repainted), and what follows
   the mouse moves by transform / opacity only (17-shine.js). Paint order, bottom to top: the film (.spin, the white
   sheen ::before, the glow facing the mouse .fg, the inner glow ::after), the shine spot, the rim, the small spot, the word. */
.b.w { --th: var(--h); border-color: transparent; background: none;
  --ig: inset 0 0 12px hsla(var(--th), 95%, var(--sglow-l), var(--sglow-a));   /* the inner glow, drawn above the film by .film::after; the states below change it */
  box-shadow: 0 6px 14px var(--soap-sh); }
.b.w::before, .b.w::after { content: none; }   /* the shine spots are the .spot and .glint spans */
.w .wl { display: inline-block; position: relative; }   /* relative: drawn above the shine */
.w .film { position: absolute; inset: -1.5px; z-index: 0; border-radius: inherit; overflow: hidden; pointer-events: none; }
.w .film::before { content: ""; position: absolute; inset: 0; z-index: 1;
  background: radial-gradient(120% 120% at 30% 20%, rgba(255,255,255,var(--soap-hi)), rgba(255,255,255,var(--soap-lo)) 60%, transparent); }
.w .film::after { content: ""; position: absolute; inset: 1.5px; z-index: 3; border-radius: inherit; box-shadow: var(--ig); transition: box-shadow .25s ease; }
/* The turning colour of the film and of the rim: a square a little wider than the bubble's diagonal (w + 1.6em is more
   than the diagonal of every word bubble), centred; rotating it is the same picture as turning the conic gradient's
   start. Both start together, so their colours stay in step. --ang = each bubble's own angle (where it stays on touch screens). */
.w .spin { position: absolute; left: 50%; top: 50%; width: calc(100% + 1.6em); aspect-ratio: 1; translate: -50% -50%; rotate: var(--ang, 0deg);
  animation: spin 10s linear var(--fdl, 0s) infinite; }
.film .spin { background: conic-gradient(hsla(var(--th), 95%, 76%, var(--film-a)) 0 30%, hsla(calc(var(--th) + 90), 95%, 80%, calc(var(--film-a) * .6)) 50%, hsla(calc(var(--th) + 200), 90%, 82%, calc(var(--film-a) * .7)) 72%, hsla(var(--th), 95%, 76%, var(--film-a)) 92%); }
.rim .spin { background: conic-gradient(hsla(var(--th), 90%, var(--srim-l), var(--srim-a)) 0 30%, hsla(calc(var(--th) + 90), 90%, calc(var(--srim-l) + 4%), calc(var(--srim-a) * .64)) 50%, hsla(calc(var(--th) + 200), 85%, calc(var(--srim-l) + 8%), calc(var(--srim-a) * .56)) 72%, hsla(var(--th), 90%, var(--srim-l), var(--srim-a)) 92%); }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }   /* an explicit 0deg start, so the turn loops seamlessly */
/* What follows the mouse: 17-shine.js writes the transform and opacity of these wrappers (at rest they are as here);
   the look is the <i> inside, so a wrapper has nothing to re-read when it moves. Each is its own layer (will-change). */
.fg > i, .rh > i, .spot i, .glint > i { position: absolute; inset: 0; }
.film .fg { position: absolute; left: -10%; top: -45%; width: 120%; height: 190%; z-index: 2; opacity: 0; will-change: transform, opacity; }   /* inside, the side facing the mouse glows as it nears */
.fg > i { background: radial-gradient(closest-side, hsla(var(--th), 100%, var(--faceg-l), var(--faceg-a)), transparent); }
.w .spot { position: absolute; left: .5em; top: .42em; width: .62em; height: .5em; pointer-events: none; transform: rotate(-14deg); will-change: transform; }   /* the shine: a fixed size and place (em), so it never stretches with a wide bubble */
.spot > i:first-child { background: radial-gradient(closest-side, rgba(255,255,255,var(--soap-gl)) 32%, rgba(255,255,255,calc(var(--soap-gl) * .55)) 62%, rgba(255,255,255,0)); }
.spot .pl { opacity: 0; }   /* brighter, with a wider core, as the mouse nears (its opacity = the nearness) */
.spot .pl i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--spot-plus) * .85)), rgba(255,255,255,var(--spot-plus)) 42%, rgba(255,255,255,calc(var(--spot-plus) * .55)) 52%, rgba(255,255,255,calc(var(--spot-plus) * .33)) 62%, rgba(255,255,255,calc(var(--spot-plus) * .12)) 81%, rgba(255,255,255,0)); }
/* The small second spot: a thin streak lying along the bottom-right curve, its centre .47em in from both edges. It
   moves the other way from the main spot, a third as far, and brightens as the mouse nears. */
.w .glint { position: absolute; right: calc(.47em - .17em); bottom: calc(.47em - .085em); width: .34em; height: .17em; pointer-events: none; opacity: .8; transform: rotate(-45deg); will-change: transform, opacity; }
.glint > i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--soap-gl) * .75)) 45%, rgba(255,255,255,0)); }
/* The rim: a ring (a mask cuts out its middle), over the clear border */
.w .rim { position: absolute; inset: -1.5px; border-radius: inherit; padding: 1.5px; pointer-events: none;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.rim .rh { position: absolute; left: -5%; top: -40%; width: 110%; height: 180%; opacity: 0; will-change: transform, opacity; }   /* the side facing the mouse lights up as it nears */
.rh > i { background: radial-gradient(closest-side, hsla(var(--th), 100%, var(--rimhi-l), var(--rimhi-a)), transparent); }
/* States: a stronger inner glow and a lifted shadow; right / wrong / shown / picked turn the rim green / red / yellow / pink */
.b.w:hover, .b.w:focus-visible, .b.w.playing { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 12px 22px var(--soap-sh2); }
.w.sel { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 12px 22px var(--soap-sh2), 0 0 0 4px hsla(330,90%,70%,.3); }
.w.drag { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 18px 30px var(--soap-sh2), 0 0 0 4px hsla(var(--th), 90%, 72%, .2); }
.w.ok { border-color: transparent; --ig: inset 0 0 16px hsla(150, 80%, 60%, .42); box-shadow: 0 6px 14px var(--soap-sh); }
.w.bad { border-color: transparent; --ig: inset 0 0 16px hsla(350, 90%, 68%, .45); box-shadow: 0 6px 14px var(--soap-sh); }
.w.shown { border-color: transparent; --ig: inset 0 0 16px hsla(45, 95%, 60%, .45); box-shadow: 0 6px 14px var(--soap-sh); }
.w.ok .rim i, .w.bad .rim i, .w.shown .rim i, .w.sel .rim i { visibility: hidden; }   /* hidden, not stopped: they keep turning in step with the film */
.w.ok .rim { background: hsla(150, 60%, 48%, .85); }
.w.bad .rim { background: hsla(350, 80%, 60%, .85); }
.w.shown .rim { background: hsla(40, 90%, 55%, .9); }
.w.sel .rim { background: var(--underline); }
/* The zone copies float a little (as Be Do Modal's tray: a couple of pixels each, own pace: --fx / --fy / --fdur / --fdl
   from soapify()); it uses translate, so the hover lift and the fly-in (transform) add to it. Pool bubbles keep their bob. */
.board:not(.recap) .zone .w:not(.shake):not(.glow):not(.split) { animation: float var(--fdur, 4s) ease-in-out var(--fdl, 0s) infinite alternate; }
@keyframes float { from { translate: 0 0; } to { translate: var(--fx, 0px) var(--fy, -3px); } }
@media (hover: hover) { .board .w:hover { animation-play-state: paused; } }   /* still under the pointer: no edge jitter */
/* Off screen (.still, 17-shine.js) or while a bubble is carried (body.carrying), the floats and the turning pause */
.board.still .w, .board.still .spin, body.carrying .board .w, body.carrying .spin { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .w .spin, .board .zone .w { animation: none !important; } }
/* Touch screens: the film doesn't turn (each bubble keeps its own angle, --ang); the float stays */
@media (hover: none) { .w .spin { animation: none; } }

.playmenu { position: absolute; top: calc(100% + 8px); right: 0; z-index: 40; display: flex; flex-direction: column; gap: 2px; width: max-content; min-width: 210px; padding: 6px;
  border-radius: 20px; background: var(--bg-a); border: 1px solid var(--dock-line); box-shadow: 0 12px 30px var(--shadow); animation: cardin .22s cubic-bezier(.34,1.56,.64,1);
  -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4); }

   colour, rule lists, homographs, the most common mistakes. Adapted from Preposition Practice. */
.guidecard { max-width: 780px; max-height: 88vh; }

.gd-navb:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
/* sections */
#guidebody section { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--dock-line); scroll-margin-top: 10px; }
#guidebody h3 { margin: 0; font-size: 1.1rem; font-weight: 600; }
.gd-lead { margin: 4px 0 8px; font-size: .88rem; line-height: 1.4; opacity: .75; }
/* a folding card */
.gd-u { margin-top: 8px; border-radius: 18px; background: var(--fill-mid); border: 1.5px solid hsla(var(--h), 70%, var(--rim-l), .6); scroll-margin-top: 10px; }
.gd-u > summary, .gd-m > summary { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 10px 34px 10px 14px; position: relative; cursor: pointer; list-style: none; border-radius: 16px; transition: background-color .2s ease; }
.gd-u > summary::-webkit-details-marker, .gd-m > summary::-webkit-details-marker { display: none; }
.gd-u > summary::after, .gd-m > summary::after { content: ""; position: absolute; right: 16px; top: calc(50% - 6px); width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; opacity: .6; transform: rotate(45deg); transition: transform .25s ease; }
.gd-u[open] > summary::after, .gd-m[open] > summary::after { transform: rotate(-135deg) translate(-3px, -3px); }
.gd-u > summary:hover, .gd-m > summary:hover { background: hsla(var(--h), 85%, 72%, .12); }
.gd-u > summary:focus-visible, .gd-m > summary:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
.gd-u h4 { margin: 0; font-size: 1.05rem; font-weight: 600; color: hsl(var(--h), 60%, var(--lab-l)); }
.gd-u[open] { padding-bottom: 12px; }
.gd-u[open] > :not(summary) { margin-left: 14px; margin-right: 14px; }
.gd-cap { font-size: .86rem; font-weight: 500; opacity: .8; }
.gd-cap small { font-size: .7rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; opacity: .7; }
/* a zone's endings: suffix, its Portuguese twin, examples */
.gd-sfxs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.gd-sfxs li { display: grid; grid-template-columns: 4.2em 6.6em 1fr; align-items: center; gap: 4px 10px; }
.gd-sfxs .gd-ws { margin-top: 0; }
@media (max-width: 560px) { .gd-sfxs li { grid-template-columns: 4.2em 1fr; } .gd-sfxs .gd-ws { grid-column: 1 / -1; } }
/* text blocks: a trap, a curiosity, a prefix group, a rule */
.gd-word + .gd-word { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--dock-line); }
.gd-wh { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0; font-size: .97rem; }
.gd-why { margin: 4px 0 0; font-size: .9rem; line-height: 1.45; opacity: .85; }
.gd-list { display: flex; flex-direction: column; gap: 8px; }
.gd-row { padding: 10px 14px; border-radius: 16px; background: var(--fill-mid); border: 1px solid var(--dock-line); }
.gd-row .gd-sfx { color: var(--underline); }
.gd-ex { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 5px; }
.gd-ex li { padding: .14em .65em .18em; border-radius: 999px; font-size: .9rem; background: var(--bg-a); border: 1px solid var(--dock-line); }
/* homographs */
.gd-homo { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.gd-homo li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 14px; border-radius: 16px; background: var(--fill-mid); border: 1px solid var(--dock-line); }
.gd-homo b { min-width: 6.5em; font-weight: 600; }
.gd-st { display: inline-flex; align-items: center; gap: 6px; }
/* the most common mistakes */
#gd-mis h3 { color: hsl(350, 65%, var(--lab-l)); }
.gd-mlist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; align-items: start; gap: 10px; }
.gd-mlist li { border-radius: 16px; background: var(--fill-mid); border: 1px solid var(--dock-line); }
.gd-m { --h: 350; }
.gd-m > summary { padding: 11px 34px 11px 14px; }
.gd-m[open] { padding-bottom: 12px; }
.gd-m[open] > :not(summary) { margin-left: 14px; margin-right: 14px; }
.gd-src { display: flex; align-items: center; gap: 6px; margin: 0 0 3px; font-size: .86rem; line-height: 1.35; color: color-mix(in srgb, var(--ink) 70%, transparent); }
.gd-wrong, .gd-right { margin: 0; font-size: .97rem; font-weight: 600; line-height: 1.4; }
.gd-wrong { color: hsl(350, 70%, var(--lab-l)); text-decoration: line-through; text-decoration-thickness: 1.5px; text-decoration-color: hsla(350, 70%, 55%, .6); }
.gd-wrong span, .gd-right span { display: inline-block; text-decoration: none; margin-right: 2px; }
.gd-right { color: hsl(145, 60%, var(--lab-l)); }
@media (max-width: 640px) { .gd-mlist { grid-template-columns: 1fr; } }
/* exam tips, for the curious */
.gd-tips { margin: 6px 0 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 6px; font-size: .93rem; line-height: 1.45; }
.gd-tips li::marker { font-weight: 700; color: var(--underline); }
.gd-cur { margin-top: 22px; }
@media (prefers-reduced-motion: reduce) { .gd-navb, .gd-u > summary::after, .gd-m > summary::after { transition: none; } }

/* 90-scrollbar.css — scrollbars from Preposition Practice (originally Verb Bubbles): in the cards that scroll (Guide,
   Favorites / Seen, end of game, tutorial) a thin glossy pill with the pink-to-purple gradient on a clear track; the
   page itself shows none. Chrome / Edge / Safari use the ::-webkit-scrollbar parts; Firefox only takes colours, so it
   gets a thin pink thumb (in @supports, since Chrome would let these override the pill). */
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: transparent; margin: 18px 0; }
::-webkit-scrollbar-thumb {
  border: 3px solid transparent; border-radius: 999px; background-clip: padding-box;
  background-image: linear-gradient(180deg, hsl(315,85%,66%), hsl(275,80%,64%));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45);
}
::-webkit-scrollbar-thumb:hover { background-image: linear-gradient(180deg, hsl(315,90%,60%), hsl(275,85%,58%)); }
::-webkit-scrollbar-thumb:active { border-width: 2px; }
::-webkit-scrollbar-button, ::-webkit-scrollbar-corner { display: none; background: transparent; }
@supports (-moz-appearance: none) {
  * { scrollbar-width: thin; scrollbar-color: hsl(295,82%,66%) transparent; }
}
/* The page itself still scrolls on short screens, but shows no bar (only the cards and lists do). */
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }

</style>

r level","x":"<b>B1<\/b>: everyday families; the <b>Endings<\/b> button shows the typical endings in every zone when you need them. <b>B2<\/b>: First (FCE) families. <b>C1<\/b>: Advanced (CAE) families, with fewer tries and hints, and the family's meanings only once the text is complete. <b>C2<\/b>: Proficiency (CPE) families, no hints at all, and no translations until the text is complete."},{"id":"family","sel":"#fam","t":"One family per round","x":"This is the <b>root<\/b> of the family. Every bubble is built from it, with a different <b>prefix<\/b> (un-, dis-…) or <b>suffix<\/b> (-tion, -ful, -ly…)."},{"id":"pool","sel":"#pool","t":"Sort the bubbles","x":"<b>Drag<\/b> each bubble into its zone. Or <b>tap<\/b> a bubble, then tap a zone."},{"id":"zones","sel":".zone","t":"Four zones","x":"<b>Verb<\/b>, <b>noun<\/b>, <b>adjective<\/b> and <b>adverb<\/b>. When a word lands in the right zone, its prefix and suffix light up — learn to spot them! A family doesn't always have a word for every zone. Tap a sorted word to hear it and see what it means."},{"id":"twins","sel":"#pool","t":"Some words wear two hats","x":"A few words belong to <b>more than one<\/b> class: <b>act<\/b> is a verb (<i>they act<\/i>) and a noun (<i>a kind act<\/i>). When you sort one of them, a copy stays in the zone and the bubble floats back with a <b>+1<\/b> badge. Find its other zone!"},{"id":"gaps","t":"Then use the words","x":"When the family is sorted, a short text appears with one or two <b>gaps<\/b>. Drag a word from the zones into each gap — or tap a word to fill the highlighted gap. Read the words around the gap: what kind of word does it need? Tap any word of the text to see what it means.","demo":{"text":"Maya is an {active} member of the drama club.","c":"adj"}},{"id":"tools","sel":"#hintbtn","t":"Hints","x":"Stuck on the text? A <b>hint<\/b> greys out a kind of word it doesn't need (the Hint button appears with the text). Hints are shared by the whole game, and every hint you save is a <b>bonus point<\/b> at the end."},{"id":"score","sel":"#score","t":"Points","x":"<b>+1<\/b> for every bubble sorted without a mistake, <b>+2<\/b> for every gap right first time (+1 on the second try). Right answers in a row build a <b>combo<\/b>!"},{"id":"play","sel":"#restart","t":"More ways to play","x":"Tap <b>new game<\/b> for <b>exam practice<\/b> (type the words, like the real exam), a <b>60-second sorting sprint<\/b>, or a practice game with the families you <b>missed<\/b> or <b>starred<\/b>."},{"id":"lists","sel":"#listbtns","t":"Favorites and Seen","x":"Tap the <b>star<\/b> on a finished family to save it in <b>Favorites<\/b>. <b>Seen<\/b> shows your progress and the families you missed, so you can review them."},{"id":"guide","sel":"#guidebtn","t":"The Guide","x":"The <b>Guide<\/b> has the endings of every word class, prefixes, spelling rules, stress and the most common mistakes, with examples from the families of your level."}],"us":{"behaviour":"behavior","behavioural":"behavioral","colour":"color","colourful":"colorful","colourfully":"colorfully","colourless":"colorless","criticise":"criticize","economise":"economize","emphasise":"emphasize","hypothesise":"hypothesize","recognise":"recognize","recognisable":"recognizable","unrecognisable":"unrecognizable","sympathise":"sympathize","pretence":"pretense","sceptic":"skeptic","sceptical":"skeptical","sceptically":"skeptically","scepticism":"skepticism","wilful":"willful","wilfully":"willfully","overemphasise":"overemphasize","commercialise":"commercialize"},"guide":{"_about":"The Guide (23-guide.js). English text; i18n/<lang>.json \"guide\" has the same shape (arrays are merged item by item, so a translation only needs the fields it changes). *word* = an English word or phrase in a sentence (shown in italics). Example words and patterns stay in English. \"auto\" fills a trap with family words: sk = suffix keys (affixes.json), c = class, person = person noun or not, bare = no suffix and more than one class. A prefix group's \"skip\" leaves out words that only look prefixed (asleep).","title":"Word formation guide","tip":"In English, the <b>ending<\/b> usually tells you the word class: <b>-tion<\/b> makes a noun, <b>-ful<\/b> an adjective, <b>-ly<\/b> an adverb. To fill a gap, don't start with the word. Look at <b>the words around the gap<\/b>: they tell you what class it needs. Then choose the family word with that ending.","askTitle":"Ask yourself, in this order","ask":[{"q":"What comes before the gap?","hint":"The word just before the gap is often enough.","rows":[{"p":"a / the / my / this ___","c":"noun"},{"p":"to / can / will / didn't ___","c":"verb"},{"p":"be / seem / feel / become / very ___","c":"adj"},{"p":"He drives ___.","n":"after the verb and its object","c":"adv"}]},{"q":"What comes after it?","hint":"If the word before doesn't settle it, look at the next one.","rows":[{"p":"a ___ idea","n":"before a noun","c":"adj"},{"p":"___ difficult / ___ made","n":"before an adjective or a past participle","c":"adv"},{"p":"the ___ of the plan","n":"before of","c":"noun"}]},{"q":"A person or a thing?","hint":"the person who does it: *employer, competitor, scientist* · the action or the idea: *employment, competition, science*"},{"q":"Positive or negative?","hint":"Read the whole sentence. *but, sadly, although* and *not at all* often call for a negative word: *un-, in-, dis-, -less*.","go":"pre"},{"q":"Is the spelling right?","hint":"Adding an ending often changes a letter or two: *create → creation, happy → happiness*.","go":"spell"}],"nav":{"end":"Endings","pre":"Prefixes","spell":"Spelling","inside":"Inside the word","stress":"Stress","mis":"Common mistakes","exam":"Exam tips"},"endTitle":"Endings by word class","endLead":"Each zone with its test sentence and its usual endings. The examples are from this level's families. Tap a zone to open it.","testLabel":"Test","suffixes":{"ise":{"label":"-ise / -ize","add":["industrial[ise]"],"skip":["economise"]}},"trapsTitle":"Endings that lie","trapsLead":"Most endings are reliable, but not all of them. Watch out for these.","traps":[{"t":"-ly adjectives","x":"*-ly* usually makes an adverb, but these are adjectives. They have no adverb of their own: say *in a friendly way*, not *friendlily*.","auto":{"sk":["ly"],"c":"adj"}},{"t":"-al nouns","x":"*-al* usually makes an adjective, but some of these words are nouns too: *a musical, a professional, an original*. Also *arrival, refusal, approval*.","auto":{"sk":["al"],"c":"noun"}},{"t":"-y nouns","x":"*-y* makes adjectives (*healthy, lucky*), but *-ty, -ety* and *-ery* make nouns.","auto":{"sk":["y"],"c":"noun"}},{"t":"-er that isn't a person","x":"A *cook* is a person; a *cooker* is the stove. Machines and tools take *-er* too: *a computer, a printer*.","auto":{"sk":["er","or"],"c":"noun","person":false}},{"t":"-ate adjectives","x":"*-ate* usually makes a verb (*educate, originate*), but some *-ate* words are adjectives. *deliberate* is both: the adjective ends in a weak sound, the verb in a strong 'ate'.","auto":{"sk":["ate"],"c":"adj"}},{"t":"No ending, two classes","x":"Many English words change class without changing shape: *you can act* and *do a kind act*. That's why some bubbles go into two zones.","auto":{"bare":true}}],"preTitle":"Prefixes","preLead":"A prefix changes the meaning, not the class: *happy* and *unhappy* are both adjectives. *en-* is the exception.","prefixes":[{"p":["un","in","dis"],"t":"not","x":"*un-* is the most common. *in-* and *dis-* come with certain words: learn them with the word (*inactive, dishonest*)."},{"p":["im","il","ir"],"t":"not, before m, p, b, l and r","x":"*in-* changes to match the next letter: *im-* before m, p and b (*impossible, impatient*), *il-* before l (*illegal*), *ir-* before r (*irresponsible*)."},{"p":["mis"],"t":"wrongly, badly","x":"*misbehave* = behave badly; a *misfit* is a person who doesn't fit in."},{"p":["re"],"t":"again","x":"*repaint* = paint again; *reproduce* = produce again (or have babies)."},{"p":["over","under"],"t":"too much / not enough","x":"The word keeps its class: *oversleep* is a verb, like *sleep*; *undercooked* is an adjective, like *cooked*."},{"p":["en"],"t":"makes a verb","x":"The one prefix that changes the class: *danger* (noun) → *endanger* (verb), *courage → encourage*, *able → enable*."},{"p":["non","a","pre","counter"],"skip":["asleep"],"t":"others","x":"*non-* = not (*noncommittal*), *a-* = not (*atypical*), *pre-* = before (*preconception*), *counter-* = against (*counterproductive*)."}],"spellTitle":"Spelling when you add an ending","spellLead":"In the exam, a word with one wrong letter is a wrong answer.","spelling":[{"t":"Drop the final e before a vowel.","ex":["create → creation, creative","believe → believable","imagine → imagination"]},{"t":"Keep the e before a consonant.","ex":["use → useful","care → careless","achieve → achievement"]},{"t":"y after a consonant becomes i.","ex":["happy → happiness, happily","beauty → beautiful","rely → reliable","vary → various"]},{"t":"Double the last consonant when the last syllable is stressed.","ex":["commit → committed","compel → compelling","but: benefit → benefited"]},{"t":"-ful has one l; its adverb has two.","ex":["care → careful → carefully","wonder → wonderful → wonderfully"]},{"t":"-le becomes -ly; -ic becomes -ically.","ex":["possible → possibly","comfortable → comfortably","scientific → scientifically","heroic → heroically"]},{"t":"-able or -ible? -ance or -ence? There's no rule: learn them with the word.","ex":["acceptable, reliable · sensible, accessible","tolerance, resistance · independence, preference"]},{"t":"British and American spellings are both right. Exam practice accepts either.","ex":["criticise / criticize","colour / color","behaviour / behavior","sceptical / skeptical"]}],"insideTitle":"Changes inside the word","insideLead":"Sometimes it isn't just an ending: the root itself changes. These come up again and again in the exam.","inside":[{"t":"Adjective → noun in -th","ex":["strong → strength","long → length","wide → width","deep → depth","true → truth","high → height"]},{"t":"The verb's ending changes before -ion and -ive","ex":["decide → decision","persuade → persuasion","explain → explanation","comprehend → comprehension","deceive → deception","solve → solution"]},{"t":"A vowel disappears or moves","ex":["maintain → maintenance","pronounce → pronunciation","repeat → repetition","obey → obedient"]},{"t":"A whole new shape","ex":["succeed → success","believe → belief","lose → loss","die → death","prove → proof","grieve → grief"]}],"stressTitle":"Stress","stressLead":"Same spelling, different stress: in the game, the stressed syllable is underlined in each zone.","stressMoveTitle":"The stress can move inside a family","stressMove":["eCONomy → ecoNOMic → eCONomist","ORigin → oRIGinal → origiNALity","preFER → PREFerence → PREFerable","proDUCE → PROduct → proDUCtion → producTIVity","SCIence → scienTIFic"],"misTitle":"Most common mistakes","misLead":"Tap one to see the right sentence.","mistakes":[{"wrong":"She is very success.","right":"She is very successful.","why":"After *very* you need an adjective. *success* is the noun."},{"wrong":"I want to success in life.","right":"I want to succeed in life.","why":"After *to* you need a verb: *succeed*."},{"wrong":"He drives careful.","right":"He drives carefully.","why":"It says how he drives (a verb), so you need the adverb."},{"wrong":"The film was very relaxing. I felt very relaxing.","right":"The film was very relaxing. I felt very relaxed.","why":"*-ing* is what causes the feeling; *-ed* is how the person feels."},{"wrong":"My dad is a great cooker.","right":"My dad is a great cook.","why":"A *cook* is a person; a *cooker* is the stove."},{"wrong":"It's unpossible.","right":"It's impossible.","why":"Before p, the negative prefix is *im-*."},{"wrong":"He is very unresponsible.","right":"He is very irresponsible.","why":"Before r, the negative prefix is *ir-*."},{"wrong":"Thanks for the informations.","right":"Thanks for the information.","why":"*information* and *knowledge* are uncountable: no *-s*, no *a/an*."},{"wrong":"She is very sensible: she cries at every film.","right":"She is very sensitive: she cries at every film.","why":"*sensitive* = she feels things easily. *sensible* = she has good judgement."},{"wrong":"My boss is very comprehensive.","right":"My boss is very understanding.","why":"*comprehensive* = complete, covering everything (*a comprehensive guide*)."},{"wrong":"Our new neighbour is very sympathetic.","right":"Our new neighbour is very friendly.","why":"*sympathetic* = shows that you understand someone's problems."},{"wrong":"The film was a deception.","right":"The film was a disappointment.","why":"*deception* = making someone believe something false."},{"wrong":"I pretend to study medicine.","right":"I intend to study medicine.","why":"*pretend* = act as if something is true when it isn't."},{"wrong":"This car is very economic.","right":"This car is very economical.","why":"*economical* = uses little money or fuel. *economic* = about the economy (*economic growth*)."}],"examTitle":"Exam tips","examLead":"Part 3 of the Reading and Use of English paper in B2 First, C1 Advanced and C2 Proficiency.","exam":["Read the whole text first, to get the story. A sentence can need a negative word that only makes sense with the sentence before.","The word in CAPITALS at the end of the line is your root. Never write it unchanged: it always needs at least one change.","Check the words around the gap: what class does it need?","Singular or plural? Does a verb need *-s, -ed* or *-ing*? The game keeps every word as listed, but the exam doesn't.","Two changes are common: a prefix and a suffix (*employ → unemployment*). At C1 and C2 the root itself may change too (*deceive → deceptive*).","Spelling counts. British or American, both are accepted, but use one consistently.","Never leave a gap empty: a sensible guess can still score."],"curTitle":"For the curious","curious":[["-ise or -ize?","In the UK, *-ise* is more common, but *-ize* is also correct: *criticise* or *criticize*. In the US, only *-ize*. Cambridge accepts both; just use the same one all the way through."],["high / highly, short / shortly","*high* and *short* are also adverbs (*jump high*). *highly* means very (*highly unlikely*); *shortly* means soon (*I'll be there shortly*)."],["use (noun) / use (verb)","The noun ends in an s sound, the verb in a z sound. Only one letter's sound changes, so the game doesn't mark it."],["New verbs every day","English turns nouns into verbs with no ending at all: *to email, to google, to text*. That's why so many families have a word in two zones."],["The biggest family","*produce* has ten words in the game: *produce, product, production, producer, productive, unproductive, productivity, productively, reproduce, counterproductive*."]]},"families":{"B1":[{"id":"b1-help","root":"help","words":[{"w":"help","m":"help","c":["verb","noun"]},{"w":"helper","m":"help[er]","c":["noun"],"sk":"er","person":true},{"w":"helpful","m":"help[ful]","c":["adj"],"sk":"ful"},{"w":"helpless","m":"help[less]","c":["adj"],"sk":"less"},{"w":"helpfully","m":"help[fully]","c":["adv"],"sk":"ly"}],"text":"My neighbour is always very {0}. Last weekend, she offered to {1} me paint my kitchen.","gaps":[{"a":"helpful","c":"adj","why":"After “very” we need an adjective — a positive one, because she likes helping people."},{"a":"help","c":"verb","why":"After “offered to” we need a verb in its base form."}],"tr":{"pt-BR":{"words":{"help":{"verb":"ajudar","noun":"ajuda"},"helper":"ajudante","helpful":"prestativo; útil","helpless":"indefeso, impotente","helpfully":"prestativamente"},"gloss":{"neighbour":"vizinho, vizinha","last weekend":"no fim de semana passado","offered":"se ofereceu","paint":"pintar","kitchen":"cozinha"},"text":"Minha vizinha é sempre muito prestativa. No fim de semana passado, ela se ofereceu para me ajudar a pintar a minha cozinha.","why":["Depois de “very” precisamos de um adjetivo — um positivo, porque ela gosta de ajudar as pessoas.","Depois de “offered to” precisamos de um verbo na forma base."]}},"alt":[{"text":"Our class has a cheerful young {0} who gives out the books every morning. Without him, our teacher would be almost {1}.","gaps":[{"a":"helper","c":"noun","why":"After “a cheerful young” we need a noun: the person who helps the class."},{"a":"helpless","c":"adj","why":"After “would be almost” we need an adjective: without him, the teacher could hardly do anything."}],"tr":{"pt-BR":{"text":"Nossa turma tem um jovem ajudante alegre que distribui os livros toda manhã. Sem ele, nossa professora ficaria quase perdida.","gloss":{"class":"turma","cheerful":"alegre","gives out":"distribui","books":"livros","every morning":"toda manhã","him":"ele","would be":"ficaria","almost":"quase"},"why":["Depois de “a cheerful young” precisamos de um substantivo: a pessoa que ajuda a turma.","Depois de “would be almost” precisamos de um adjetivo: sem ele, a professora mal conseguiria fazer alguma coisa."]}}}]},{"id":"b1-care","root":"care","words":[{"w":"care","m":"care","c":["verb","noun"]},{"w":"careful","m":"care[ful]","c":["adj"],"sk":"ful"},{"w":"carefully","m":"care[fully]","c":["adv"],"sk":"ly"},{"w":"careless","m":"care[less]","c":["adj"],"sk":"less"},{"w":"carelessly","m":"care[lessly]","c":["adv"],"sk":"ly"}],"text":"Please drive {0} tonight — the roads are icy. Last winter, a {1} driver crashed into our garden wall.","gaps":[{"a":"carefully","c":"adv","why":"“Drive” is a verb, and we need a word that says how you drive: an adverb."},{"a":"careless","c":"adj","why":"Between “a” and the noun “driver” we need an adjective — and a driver who crashes wasn't paying attention."}],"tr":{"pt-BR":{"words":{"care":{"verb":"importar-se; cuidar (care for)","noun":"cuidado"},"careful":"cuidadoso","carefully":"com cuidado, cuidadosamente","careless":"descuidado","carelessly":"descuidadamente"},"gloss":{"drive":"dirija, dirigir","tonight":"hoje à noite","roads":"estradas, ruas","icy":"congelado, com gelo","last winter":"no inverno passado","driver":"motorista","crashed into":"bateu em","garden wall":"muro do jardim"},"text":"Por favor, dirija com cuidado hoje à noite — as estradas estão congeladas. No inverno passado, um motorista descuidado bateu no muro do nosso jardim.","why":["“Drive” é um verbo, e precisamos de uma palavra que diga como se dirige: um advérbio.","Entre “a” e o substantivo “driver” precisamos de um adjetivo — e um motorista que bate o carro não estava prestando atenção."]}},"alt":[{"text":"Lisa takes great {0} of her pet rabbit. She is always {1} to close the cage, so it never escapes.","gaps":[{"a":"care","c":"noun","why":"After “takes great” we need a noun: “take care of” means to look after someone."},{"a":"careful","c":"adj","why":"After “is always” we need an adjective: she pays attention, so the rabbit never escapes."}],"tr":{"pt-BR":{"text":"Lisa cuida muito do seu coelho de estimação. Ela sempre tem o cuidado de fechar a gaiola, para que ele nunca fuja.","gloss":{"lisa":"","takes":"tem (take care of = cuidar de)","pet rabbit":"coelho de estimação","close":"fechar","cage":"gaiola","so":"para que","never":"nunca","escapes":"foge"},"why":["Depois de “takes great” precisamos de um substantivo: “take care of” significa cuidar de alguém.","Depois de “is always” precisamos de um adjetivo: ela presta atenção, então o coelho nunca foge."]}}}]},{"id":"b1-friend","root":"friend","words":[{"w":"friend","m":"friend","c":["noun"]},{"w":"friendly","m":"friend[ly]","c":["adj"],"sk":"ly"},{"w":"unfriendly","m":"[un]friend[ly]","c":["adj"],"pk":"un","sk":"ly"},{"w":"friendship","m":"friend[ship]","c":["noun"],"sk":"ship"},{"w":"friendliness","m":"friend[liness]","c":["noun"],"sk":"ness"}],"text":"Lucy and Ana met at primary school, and their {0} has lasted for twenty years. Ana is kind and {1} to everyone she meets.","gap ]},{"w":"success","m":"success","c":["noun"]},{"w":"successful","m":"success[ful]","c":["adj"],"sk":"ful"},{"w":"unsuccessful","m":"[un]success[ful]","c":["adj"],"pk":"un","sk":"ful"},{"w":"successfully","m":"success[fully]","c":["adv"],"sk":"ly"}],"text":"Everyone agreed that the school concert was a huge {0}. The students hope to be just as {1} next year.","gaps":[{"a":"success","c":"noun","why":"After “a huge” (a + adjective) we need a noun."},{"a":"successful","c":"adj","why":"After the verb “be” (in “to be just as ___”) we need an adjective — a positive one."}],"tr":{"pt-BR":{"words":{"succeed":"ter sucesso, conseguir","success":"sucesso","successful":"bem-sucedido","unsuccessful":"malsucedido","successfully":"com sucesso"},"gloss":{"agreed":"concordaram","school concert":"concerto da escola","huge":"enorme","students":"alunos, estudantes","hope":"esperam, têm esperança de","just as":"igualmente, tão … quanto"},"text":"Todos concordaram que o concerto da escola foi um enorme sucesso. Os alunos esperam ser igualmente bem-sucedidos no ano que vem.","why":["Depois de “a huge” (a + adjetivo) precisamos de um substantivo.","Depois do verbo “be” (em “to be just as ___”) precisamos de um adjetivo — um positivo."]}},"alt":[{"text":"The first two attempts to climb the mountain were {0} because of bad weather. This summer, Jake is determined to {1}.","gaps":[{"a":"unsuccessful","c":"adj","why":"After “were” we need an adjective: the attempts did not work, because of the bad weather."},{"a":"succeed","c":"verb","why":"After “determined to” we need a verb in its base form: this time he wants to reach the top."}],"tr":{"pt-BR":{"text":"As duas primeiras tentativas de escalar a montanha foram malsucedidas por causa do mau tempo. Neste verão, Jake está determinado a conseguir.","gloss":{"first":"primeiras","attempts":"tentativas","climb":"escalar","mountain":"montanha","because of":"por causa de","bad weather":"mau tempo","this summer":"neste verão","is determined":"está determinado"},"why":["Depois de “were” precisamos de um adjetivo: as tentativas não deram certo, por causa do mau tempo.","Depois de “determined to” precisamos de um verbo na forma base: desta vez ele quer chegar ao topo."]}}}]},{"id":"b1-beauty","root":"beauty","words":[{"w":"beauty","m":"beauty","c":["noun"]},{"w":"beautiful","m":"beauti[ful]","c":["adj"],"sk":"ful"},{"w":"beautifully","m":"beauti[fully]","c":["adv"],"sk":"ly"},{"w":"beautify","m":"beaut[ify]","c":["verb"],"sk":"ify"}],"text":"The old village is famous for its {0}, and tourists come from all over the world. My aunt lives there in a {1} stone house.","gaps":[{"a":"beauty","c":"noun","why":"After “its” (a possessive) we need a noun."},{"a":"beautiful","c":"adj","why":"Between “a” and “stone house” we need an adjective."}],"tr":{"pt-BR":{"words":{"beauty":"beleza","beautiful":"bonito, lindo","beautifully":"lindamente, muito bem","beautify":"embelezar"},"gloss":{"famous for":"famoso por, famosa por","tourists":"turistas","come":"vêm","all over the world":"do mundo todo","aunt":"tia","lives":"mora, vive","stone":"de pedra","house":"casa"},"text":"A antiga vila é famosa pela sua beleza, e turistas vêm do mundo todo. Minha tia mora lá, numa linda casa de pedra.","why":["Depois de “its” (um possessivo) precisamos de um substantivo.","Entre “a” e “stone house” precisamos de um adjetivo."]}},"alt":[{"text":"The residents of our street decided to {0} it by planting flowers along the pavement. Everyone agreed that the work was {1} done.","gaps":[{"a":"beautify","c":"verb","why":"After “decided to” we need a verb in its base form: they wanted to make the street more beautiful."},{"a":"beautifully","c":"adv","why":"“Done” is a verb form, so we need an adverb to say how the work was done."}],"tr":{"pt-BR":{"text":"Os moradores da nossa rua decidiram embelezá-la plantando flores ao longo da calçada. Todos concordaram que o trabalho foi lindamente feito.","gloss":{"residents of":"moradores de","street":"rua","decided"
