<script>
/* early-theme.js — runs in <head>, before the first paint, in the menu AND in every game: puts on the background
   colour saved in eb-bg (the games' palettes, "p:sky" or "c:#7aa7ff"), so a page never flashes its default colour
   first. The page's own 01-theme.js applies the same colour again a moment later. Keep PAL in step with PALETTES
   (src/js/01-theme.js and the games). */
(function () {
  try {
    var PAL = {
      sky: ["#e4f3fb", "#f1e8fb", "#fdf0e6", 0], peach: ["#ffe6d8", "#ffd6e4", "#fff1c9", 0],
      mint: ["#d9f4e6", "#d3eef6", "#eef6d3", 0], lilac: ["#e9e0fb", "#f7d9ee", "#dbe6fb", 0],
      dusk: ["#2a1740", "#58224f", "#1f3560", 1], midnight: ["#141964", "#441464", "#144e64", 1]
    };
    var s = Storage.prototype.getItem.call(window.localStorage, "eb-bg") || "", c = null;
    if (s.indexOf("p:") === 0) c = PAL[s.slice(2)] || null;
    else if (/^c:#[0-9a-f]{6}$/i.test(s)) {
      var hex = s.slice(2), r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255,
        b = parseInt(hex.slice(5, 7), 16) / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b),
        l = (mx + mn) / 2, h = 0, sat = 0, d = mx - mn;
      if (d) {
        sat = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
        h = (mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) * 60;
      }
      var col = function (dh) { return "hsl(" + ((h + dh + 360) % 360).toFixed(0) + "," + (sat * 100).toFixed(0) + "%," + (l * 100).toFixed(0) + "%)"; };
      c = [col(0), col(40), col(-40), l * 100 < 52];
    }
    if (c) {
      var root = document.documentElement;
      root.style.setProperty("--bg-a", c[0]); root.style.setProperty("--bg-b", c[1]); root.style.setProperty("--bg-c", c[2]);
      root.dataset.theme = c[3] ? "dark" : "light";
    }
  } catch (e) {}
  // The phone's bars (theme-color) follow the background: its top colour --bg-a, set here or later by the page's own
  // colour picker (menu or game: both write --bg-a on <html>). No colour chosen: the default light / dark ones.
  try {
    var html = document.documentElement, last = "";
    var bar = function () {
      var a = html.style.getPropertyValue("--bg-a").trim(), m = document.querySelectorAll('meta[name="theme-color"]');
      for (var i = 0; i < m.length; i++) {
        var v = a || (/dark/.test(m[i].media) ? "#141964" : "#e4f3fb");
        if (m[i].content !== v) m[i].content = v;
      }
      last = a;
    };
    bar();
    document.addEventListener("DOMContentLoaded", bar);
    new MutationObserver(function () {
      if (html.style.getPropertyValue("--bg-a").trim() !== last) bar();
    }).observe(html, { attributes: true, attributeFilter: ["style"] });
  } catch (e) {}
})();

/* iPhone / iPad: ask for a "playback" audio session, so the game's sounds play even with Silent mode on (iOS 17+;
   some games already do this themselves). Websites can't detect Silent mode, so the menu also shows a tip. */
try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
document.documentElement.classList.add("eb-arrive");   /* the header slides in (see the style below) */

<script>
/* Every game saves its progress in the phone's storage. In the app all games share one storage, so each game's
   keys get the prefix "eb:comparatives:" here; two games can then use the same key names without overwriting each other.
   One exception: the background colour (every game saves it as "<prefix>-bg", e.g. "p:sky" or "c:#7aa7ff", like
   the menu) is ONE setting for the whole app, kept under the menu's key "eb-bg": the game opens with the colour
   chosen in the menu, and a colour chosen in a game becomes the menu's and the other games' too. */
(function () {
  try {
    var P = "eb:comparatives:", L = window.localStorage, S = Storage.prototype, BG = /^[a-z]+-bg$/;
    var get = S.getItem, set = S.setItem, del = S.removeItem;
    /* The EN / PT toggles too: ONE language for the whole app, the menu's (eb-lang). Each game saves its toggles
       under its own keys, with its own word for Portuguese (games.json "lang": "pt", "tr" or "native"; English is
       always "en"): reading one gives the menu's language, and a tap in a game changes the menu's and every
       game's. Until EN / PT is chosen, the menu's own rule: Portuguese for My level All / A1 / A2, English from B1. */
    var LG = {"cmp-guide-lang": "pt", "cmp-tour-lang": "tr"};
    function appLang() {
      var l = get.call(L, "eb-lang");
      if (l === "en" || l === "pt") return l;
      var lv = get.call(L, "eb-level");
      return lv === "B1" || lv === "B2+" ? "en" : "pt";
    }
    /* The sound-effects volume too (2026-11-26, the user): ONE for the whole app, the menu's "eb-vol" (0-100,
       0 = sound off). Every game saves "<prefix>-vol" (0-100, its Effects slider) plus an on / off key:
       "<prefix>-snd" ("0" = off) or "<prefix>-mute" ("1" = off). Reading them gives the menu's volume (menu at 0:
       the game opens muted, its slider where it was); after a game writes either, eb-vol = 0 if muted, else its
       slider. The Voice slider ("-vvol") stays each game's own. */
    var VOL = /^[a-z]+-vol$/, MUTE = /^[a-z]+-(snd|mute)$/;
    function own(k) { return get.call(L, P + k); }
    function syncVol(k) {
      var pre = k.slice(0, k.indexOf("-")), v = parseInt(own(pre + "-vol"), 10);
      if (isNaN(v) || v < 0 || v > 100) return;
      var off = own(pre + "-snd") === "0" || own(pre + "-mute") === "1";
      set.call(L, "eb-vol", String(off ? 0 : v));
    }
    S.getItem = function (k) {
      if (this === L && BG.test(k)) { var app = get.call(this, "eb-bg"); if (app) return app; }
      if (this === L && (VOL.test(k) || MUTE.test(k))) {
        var ev = get.call(this, "eb-vol");
        if (ev !== null && VOL.test(k) && ev !== "0") return ev;
        if (ev !== null && MUTE.test(k)) { var off = ev === "0"; return /-snd$/.test(k) ? (off ? "0" : "1") : (off ? "1" : "0"); }
      }
      if (this === L && LG.hasOwnProperty(k)) return appLang() === "en" ? "en" : LG[k];
      return get.call(this, this === L ? P + k : k);
    };
    S.setItem = function (k, v) {
      if (this === L && BG.test(k)) set.call(this, "eb-bg", v);
      if (this === L && LG.hasOwnProperty(k)) set.call(this, "eb-lang", String(v) === "en" ? "en" : "pt");
      var r = set.call(this, this === L ? P + k : k, v);
      if (this === L && (VOL.test(k) || MUTE.test(k))) syncVol(k);
      return r;
    };
    S.removeItem = function (k) { return del.call(this, this === L ? P + k : k); };
    /* The app's own keys (eb-rounds, eb-don…) and language, for the injected donation script (donate.js) */
    window.ebApp = { get: function (k) { return get.call(L, k); }, set: function (k, v) { set.call(L, k, v); }, lang: appLang };
    /* Opened from the menu (a card or Continue)? Then the game starts at the menu's level ("My level"): the menu
       leaves a one-time note (sessionStorage eb-level-go), and the matching level is saved under the game's own
       level key before the game reads it (games.json "level"; the nearest level when the game doesn't have it).
       With "All" on the menu, or on a reload, the game keeps its own last level. */
    var LV = {"key": "cmp-level", "A1": "A1", "A2": "A2", "B1": "B1", "B2+": "B1"}, SS = window.sessionStorage;
    if (SS.getItem("eb-level-go") === "comparatives") {
      SS.removeItem("eb-level-go");
      var m = get.call(L, "eb-level");
      if (LV && LV[m]) set.call(L, P + LV.key, LV[m]);
    }
  } catch (e) {}
})();
</script>

/* 10-game.css — page wrap, hint line, buttons, tools row, tries, reveal card, chips, toast, particles, tour extras,
   gloss tooltip, hint nudge. Taken from the conditionals template (play-area rules are in 11-text.css). */
[hidden] { display: none !important; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px 48px; }

.pbtn { font: inherit; font-size: .9rem; font-weight: 500; padding: .5em 1em; border-radius: 999px; border: 1.5px solid var(--dock-line); background: var(--dock-bg); color: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background-color .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s ease; }

.tries { display: inline-flex; align-items: center; gap: 6px; padding: 0 6px; }
.tries i { width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(135deg, hsl(315,85%,68%), hsl(275,80%,68%)); box-shadow: 0 1px 4px var(--shadow); transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .3s ease; }
.tries i.used { opacity: .18; transform: scale(.65); }

/* Reveal card */
.reveal { position: relative; max-width: 760px; margin: 18px auto 0; padding: 16px 18px 18px; border-radius: 26px; text-align: center;
  background: var(--dock-bg); border: 1px solid var(--dock-line); box-shadow: 0 8px 22px var(--shadow);   /* the header's glass */

    width: auto; height: auto; border-radius: 0; background: none; opacity: 1; animation: none; }

/* A wrong check: "Not yet: 1 adjective is wrong." pulses three times (check() in 10-game.js) */

/* 11-text.css — the play area: the text card, the adjective bubbles ("spots") and their states, the cycle dots, clue

/* The card: the header's frosted glass, 1px edge and shadow (.dock; from Be Do Modal / Present Perfect, Nov 2026) */
.card { --h: 265; position: relative; padding: 2.1em 1.7em 1.6em; border-radius: 1.8em; color: var(--ink);
  background: var(--dock-bg); border: 1px solid var(--dock-line);

  box-shadow: 0 8px 22px var(--shadow); }

  font-size: .7rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;

/* 14-soap.css — the bonus round's word bubbles as soap bubbles (from Conditionals / Be Do Modal, 2026-11-22): almost
   clear, a faint film of colour inside and a 1.5px coloured rim, both turning once in 10 s (each word its own hue, --h,
   from WORD_HUES). Built from spans (SOAP in 17-shine.js), each drawn once: the film and the rim turn by rotating a
   still conic gradient (.spin, a transform animation), and what follows the mouse moves by transform / opacity only.
   Paint order, bottom to top: the film (.spin, the white sheen ::before, the glow facing the mouse .fg, the inner glow
   ::after), the shine spot, the rim, the small spot, the word (.wl). Per-theme numbers are tokens in 00-base.css
   (--soap-*, --spot-plus, --film-a, --srim-*, --sglow-*, --rimhi-*, --faceg-*). The border stays, clear, so no size
   changes. The adjective spots in the text (.adj) use the same spans; their states are in 11-text.css. */
.b.w { --th: var(--h); border-color: transparent; background: none;
  --ig: inset 0 0 12px hsla(var(--th), 95%, var(--sglow-l), var(--sglow-a));   /* the inner glow, drawn above the film by .film::after; states change it */
  box-shadow: 0 6px 14px var(--soap-sh); }
.b.w::before { content: none; }   /* the shine spot is the .spot span */
.b.w::after { content: none; }   /* the small spot is the .glint span */
.b.w .wl { position: relative; }   /* above the moving shine */
:is(.w, .adj) .film, :is(.w, .adj) .spot, :is(.w, .adj) .rim, :is(.w, .adj) .glint { cursor: inherit; }
:is(.w, .adj) .film { position: absolute; inset: -1.5px; z-index: 0; border-radius: inherit; overflow: hidden; pointer-events: none; }
:is(.w, .adj) .film::before { content: ""; position: absolute; inset: 0; z-index: 1;
  background: radial-gradient(120% 120% at 30% 20%, rgba(255,255,255,var(--soap-hi)), rgba(255,255,255,var(--soap-lo)) 60%, transparent); }
:is(.w, .adj) .film::after { content: ""; position: absolute; inset: 1.5px; z-index: 3; border-radius: inherit; box-shadow: var(--ig); transition: box-shadow .25s ease; }
/* The turning colour of film and rim: a square wider than the bubble's diagonal, centred; rotating it = turning the
   conic gradient's start. Both start together, so their colours stay in step. */
:is(.w, .adj) .spin { position: absolute; left: 50%; top: 50%; width: calc(100% + 1.6em); aspect-ratio: 1; translate: -50% -50%; animation: spin 10s linear var(--dl, 0s) infinite; }
:is(.w, .adj) .film .spin { background: conic-gradient(from var(--ang), hsla(var(--th), 95%, 76%, var(--film-a)) 0 30%, hsla(calc(var(--th) + 90), 95%, 80%, calc(var(--film-a) * .6)) 50%, hsla(calc(var(--th) + 200), 90%, 82%, calc(var(--film-a) * .7)) 72%, hsla(var(--th), 95%, 76%, var(--film-a)) 92%); }
:is(.w, .adj) .rim .spin { background: conic-gradient(from var(--ang), hsla(var(--th), 90%, var(--srim-l), var(--srim-a)) 0 30%, hsla(calc(var(--th) + 90), 90%, calc(var(--srim-l) + 4%), calc(var(--srim-a) * .64)) 50%, hsla(calc(var(--th) + 200), 85%, calc(var(--srim-l) + 8%), calc(var(--srim-a) * .56)) 72%, hsla(var(--th), 90%, var(--srim-l), var(--srim-a)) 92%); }
@keyframes spin { to { transform: rotate(360deg); } }
/* What follows the mouse: 17-shine.js writes these wrappers' transform / opacity; the look is the <i> inside, and each
   is its own layer, so moving it repaints nothing. */
:is(.w, .adj) .fg > i, :is(.w, .adj) .rh > i, :is(.w, .adj) .spot i, :is(.w, .adj) .glint > i { position: absolute; inset: 0; }
:is(.w, .adj) .film .fg { position: absolute; left: -10%; top: -45%; width: 120%; height: 190%; z-index: 2; opacity: 0; will-change: transform, opacity; }
:is(.w, .adj) .fg > i { background: radial-gradient(closest-side, hsla(var(--th), 100%, var(--faceg-l), var(--faceg-a)), transparent); }
/* The two spots sit on the bubble's round ends: each span is a square as tall as the bubble over one end (so its %
   follow the curve), and the spot (the <i>, one size in em, never stretched) sits a little inside the rim: the shine
   up and left at 30deg past the top, along the curve; the small spot down and right at 45deg */
:is(.w, .adj) .spot { position: absolute; left: -1.5px; top: -1.5px; height: calc(100% + 3px); aspect-ratio: 1; pointer-events: none;
  --sx: calc(25% + .19em); --sy: calc(6.7% + .33em); transform-origin: var(--sx) var(--sy); transform: rotate(-30deg); will-change: transform; }
:is(.w, .adj) .spot > i { inset: auto; left: calc(var(--sx) - .31em); top: calc(var(--sy) - .25em); width: .62em; height: .5em; }
:is(.w, .adj) .spot > i:first-child { background: radial-gradient(closest-side, rgba(255,255,255,var(--soap-gl)) 32%, rgba(255,255,255,calc(var(--soap-gl) * .55)) 62%, rgba(255,255,255,0)); }
:is(.w, .adj) .spot .pl { opacity: 0; }   /* brighter, wider core as the mouse nears */
:is(.w, .adj) .spot .pl i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--spot-plus) * .85)), rgba(255,255,255,var(--spot-plus)) 42%, rgba(255,255,255,calc(var(--spot-plus) * .55)) 52%, rgba(255,255,255,calc(var(--spot-plus) * .33)) 62%, rgba(255,255,255,calc(var(--spot-plus) * .12)) 81%, rgba(255,255,255,0)); }
/* the small second spot: a thin streak along the bottom-right curve; it moves the other way, a third as far */
:is(.w, .adj) .glint { position: absolute; right: -1.5px; bottom: -1.5px; height: calc(100% + 3px); aspect-ratio: 1; pointer-events: none; opacity: .8;
  --gx: calc(85.36% - .17em); transform-origin: var(--gx) var(--gx); transform: rotate(-45deg); will-change: transform, opacity; }
:is(.w, .adj) .glint > i { inset: auto; left: calc(var(--gx) - .17em); top: calc(var(--gx) - .085em); width: .34em; height: .17em; }
:is(.w, .adj) .glint > i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--soap-gl) * .75)) 45%, rgba(255,255,255,0)); }
/* the rim: a ring (a mask cuts out its middle) over the clear border */
:is(.w, .adj) .rim { position: absolute; inset: -1.5px; border-radius: inherit; padding: 1.5px; pointer-events: none;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
:is(.w, .adj) .rim .rh { position: absolute; left: -5%; top: -40%; width: 110%; height: 180%; opacity: 0; will-change: transform, opacity; }   /* the side facing the mouse lights up */
:is(.w, .adj) .rh > i { background: radial-gradient(closest-side, hsla(var(--th), 100%, var(--rimhi-l), var(--rimhi-a)), transparent); }
/* States: hover / focus / drag glow more; right / wrong / shown turn the rim green / red / yellow */
.b.w:focus-visible { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 12px 22px var(--soap-sh2), 0 0 0 4px hsla(var(--th), 90%, 72%, .18); }
@media (hover: hover) { .b.w:hover:not(.drag):not(.ok):not(.shown) { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 12px 22px var(--soap-sh2); } }
.b.w.drag { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 18px 30px var(--soap-sh2), 0 0 0 4px hsla(var(--th), 90%, 72%, .2); }
.b.w.ok { border-color: transparent; --ig: inset 0 0 16px hsla(150, 80%, 60%, .42); box-shadow: 0 6px 14px var(--soap-sh); }
.b.w.bad { border-color: transparent; --ig: inset 0 0 16px hsla(350, 90%, 68%, .45); box-shadow: 0 6px 14px var(--soap-sh); }
.b.w.shown { border-color: transparent; --ig: inset 0 0 16px hsla(45, 95%, 60%, .45); box-shadow: 0 6px 14px var(--soap-sh); }
.w.ok .rim i, .w.bad .rim i, .w.shown .rim i { visibility: hidden; }   /* hidden, not stopped: they keep turning in step with the film */
.w.ok .rim { background: hsla(150, 60%, 48%, .85); }

/* Background bubbles drifting up behind everything (made in 08-sky.js). lvh, not vh: Android's address bar would make

.sky { position: fixed; top: 0; left: 0; right: 0; height: 100vh; height: 100lvh; z-index: -1; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; }

  box-shadow: inset 0 0 14px hsla(var(--h), 95%, var(--sky-glow-l), var(--sky-glow-a));

  8% { opacity: .6; }

  background: var(--cp-track); box-shadow: inset 0 0 0 1px var(--dock-line); outline: none; touch-action: none; }

.cp-l { --cp-track: linear-gradient(90deg, hsl(var(--cp-h), var(--cp-s), 8%), hsl(var(--cp-h), var(--cp-s), 50%), hsl(var(--cp-h), var(--cp-s), 92%)); }
.cp-r::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 4px solid var(--cp-c); box-shadow: 0 2px 6px var(--shadow); transition: transform .2s cubic-bezier(.34,1.56,.64,1); }
.cp-r::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 4px solid var(--cp-c); box-shadow: 0 2px 6px var(--shadow); }

.pbar { height: 6px; margin-top: 5px; border-radius: 999px; background: var(--dock-line); overflow: hidden; }

/* 40-scrollbar.css — scrollbars copied from Be Do Modal (../bedomodal, 80-scrollbar.css, itself from the gerund game): in

},"strange":{"pt":"estranho","syl":1},"stressful":{"pt":"estressante","syl":2},"strong":{"pt":"forte","syl":1},"sunny":{"pt":"ensolarado","syl":2},"sweet":{"pt":"doce","syl":1},"tall":{"pt":"alto (pessoa, prédio)","syl":1},"tasty":{"pt":"gostoso","syl":2},"thick":{"pt":"grosso","syl":1},"thin":{"pt":"fino, magro","syl":1},"ugly":{"pt":"feio","syl":2},"unusual":{"pt":"incomum, diferente","syl":4},"useful":{"pt":"útil","syl":2},"warm":{"pt":"quente, morno","syl":1},"well":{"pt":"bem (advérbio)","syl":1,"er":"better","est":"best"},"wet":{"pt":"molhado, chuvoso","syl":1},"wide":{"pt":"largo","syl":1},"windy":{"pt":"com vento","syl":2},"young":{"pt":"jovem, novo","syl":1}},"rules":{"degrees":{"c":{"name":"Comparative","namePt":"Comparativo","hue":205,"why":"Two things are compared (look for than).","whyPt":"Duas coisas são comparadas (procure o than = do que).","ask":"Are two things compared?","askPt":"Duas coisas estão sendo comparadas?","hint":"taller than · more expensive than · which one…? · even / much + comparative","hintPt":"taller than · more expensive than · which one…? (qual dos dois?) · even / much + comparativo"},"s":{"name":"Superlative","namePt":"Superlativo","hue":28,"why":"One thing is at the top of a whole group (look for the).","whyPt":"Uma coisa está no topo de um grupo inteiro (procure o the).","ask":"Is one thing at the top of a group?","askPt":"Uma coisa está no topo de um grupo?","hint":"the tallest in… · the most expensive of… · the best … I've ever… · one of the…","hintPt":"the tallest in… · the most expensive of… · the best … I've ever… (que eu já…) · one of the…"},"b":{"name":"Plain adjective","namePt":"Adjetivo simples","hue":280,"why":"Nothing changes here: as … as, too and enough go with the plain adjective.","whyPt":"Aqui nada muda: as … as, too e enough vão com o adjetivo simples.","ask":"Is it as … as, too, or enough?","askPt":"É as … as, too ou enough?","hint":"as tall as · not as big as · twice as long as · too far · big enough (B1+)","hintPt":"as tall as (tão alto quanto) · not as big as · twice as long as (duas vezes mais longo) · too far (longe demais) · big enough (grande o suficiente) (B1+)"}},"rules":{"short":{"name":"Short: -er / -est","namePt":"Curto: -er / -est","hue":150,"rule":"1 syllable: add -er / -est.","rulePt":"1 sílaba: acrescente -er / -est.","ex":["tall","cheap","fast"]},"e":{"name":"Ends in -e: -r / -st","namePt":"Termina em -e: -r / -st","hue":175,"rule":"Ends in -e: just add -r / -st.","rulePt":"Termina em -e: só acrescente -r / -st.","ex":["nice","large"]},"double":{"name":"Double the consonant","namePt":"Dobra a consoante","hue":120,"rule":"1 syllable, 1 vowel + 1 consonant at the end: double the consonant.","rulePt":"1 sílaba, 1 vogal + 1 consoante no final: dobre a consoante.","ex":["big","hot"]},"y":{"name":"-y → -ier / -iest","namePt":"-y → -ier / -iest","hue":45,"rule":"Ends in consonant + y (even with 2 syllables): y becomes i, then -er / -est.","rulePt":"Termina em consoante + y (mesmo com 2 sílabas): o y vira i, depois -er / -est.","ex":["easy","noisy","healthy"]},"long":{"name":"Long: more / most","namePt":"Longo: more / most","hue":265,"rule":"2 syllables or more (not ending in -y): more / most + adjective. The adjective doesn't change.","rulePt":"2 sílabas ou mais (sem terminar em -y): more / most + adjetivo. O adjetivo não muda.","ex":["expensive","difficult","peaceful"]},"spec":{"name":"Special: more / most","namePt":"Especial: more / most","hue":90,"rule":"Only 1 syllable, but it takes more / most anyway: more fun, the most fun. Never funner or funnest!","rulePt":"Só 1 sílaba, mas leva more / most mesmo assim: more fun, the most fun. Nunca funner nem funnest!","ex":["fun"]},"irr":{"name":"Irregular","namePt":"Irregular","hue":300,"rule":"Irregular: a new word. Never more good or goodest!","rulePt":"Irregular: uma palavra nova. Nunca more good nem goodest!","ex":["good","bad","far"]},"base":{"name":"Plain: as … as / too / enough","namePt":"Simples: as … as / too / enough","hue":280,"rule":"as + adjective + as, too + adjective and adjective + enough never take -er / -est / more / most.","rulePt":"as + adjetivo + as, too + adjetivo e adjetivo + enough nunca levam -er / -est / more / most.","ex":[],"exs":["She isn't as tall as her brother.","My room is twice as big as yours.","It's too far from home.","The stadium is big enough."]}},"wrong":{"deg-c":{"en":"Here two things are compared: it needs a comparative.","pt":"Aqui duas coisas são comparadas: precisa de um comparativo."},"deg-s":{"en":"Here one thing is the top of a group: it needs a superlative.","pt":"Aqui uma coisa é o topo de um grupo: precisa de um superlativo."},"deg-b":{"en":"No -er / -est / more / most here: as … as, too and enough take the plain adjective.","pt":"Aqui não vai -er / -est / more / most: as … as, too e enough levam o adjetivo simples."},"more-short":{"en":"{adj} is short: it takes -er / -est, not more / most.","pt":"{adj} é curto: leva -er / -est, não more / most."},"more-y":{"en":"{adj} ends in consonant + y: it takes -ier / -iest ({er} / {est}), not more / most.","pt":"{adj} termina em consoante + y: leva -ier / -iest ({er} / {est}), não more / most."},"er-long":{"en":"{adj} is long: it takes more / most. “{x}” doesn't exist.","pt":"{adj} é longo: leva more / most. “{x}” não existe."},"er-spec":{"en":"{adj} is special: short, but it takes more / most. “{x}” doesn't exist.","pt":"{adj} é especial: é curto, mas leva more / most. “{x}” não existe."},"irr":{"en":"{adj} is irregular: {er} / {est}.","pt":"{adj} é irregular: {er} / {est}."},"ok-double":{"en":"{adj} is short: -er / -est, and its last consonant doubles: {x}.","pt":"{adj} é curto: leva -er / -est, e a última consoante dobra: {x}."},"ok-e":{"en":"{adj} is short and ends in -e: just add -r / -st: {x}.","pt":"{adj} é curto e termina em -e: só acrescente -r / -st: {x}."}},"mistakes":[{"lv":"A1","wrong":"Sam is more tall than Tom.","right":"Sam is taller than Tom.","why":"Short adjectives never take more. In Portuguese we always say mais alto, but English uses -er.","whyPt":"Adjetivos curtos nunca levam more. Em português sempre dizemos mais alto, mas o inglês usa -er."},{"lv":"A1","wrong":"Sam is the taller in the family.","right":"Sam is the tallest in the family.","why":"Portuguese uses mais alto for both (mais alto / o mais alto). English has two forms: taller (two things) and the tallest (the top of a group).","whyPt":"O português usa mais alto para os dois (mais alto / o mais alto). O inglês tem duas formas: taller (duas coisas) e the tallest (o topo de um grupo)."},{"lv":"A1","wrong":"My phone is better then yours.","right":"My phone is better than yours.","why":"than = do que. then = então, depois. They sound similar, but they are different words.","whyPt":"than = do que. then = então, depois. Soam parecido, mas são palavras diferentes."},{"lv":"A1","wrong":"This pizza is more better.","right":"This pizza is better.","why":"better already means mais bom (melhor). Never more + -er together.","whyPt":"better já quer dizer melhor. Nunca more + -er juntos."},{"lv":"A2","wrong":"It's the best café of the city.","right":"It's the best café in the city.","why":"After a superlative, places take in: the best in the city, the biggest in the world (o melhor DA cidade).","whyPt":"Depois de um superlativo, lugares levam in: the best in the city, the biggest in the world (o melhor DA cidade)."},{"lv":"B1","wrong":"Water is very healthier than soda.","right":"Water is much healthier than soda.","why":"Muito mais = much (or a lot) + comparative. very goes with the normal adjective: very healthy.","whyPt":"Muito mais = much (ou a lot) + comparativo. very vai com o adjetivo normal: very healthy."},{"lv":"B1","wrong":"She isn't as taller as her brother.","right":"She isn't as tall as her brother.","why":"as … as uses the plain adjective (tão alto quanto). Same with too (too tall) and enough (tall enough).","whyPt":"as … as usa o adjetivo simples (tão alto quanto). O mesmo com too (too tall = alto demais) e enough (tall enough = alto o suficiente)."},{"lv":"B1","wrong":"The more you practice, the more good you get.","right":"The more you practice, the better you get.","why":"Quanto mais…, melhor… = the + comparative, the + comparative. The comparative keeps its normal form (better, not more good).","whyPt":"Quanto mais…, melhor… = the + comparativo, the + comparativo. O comparativo mantém a forma normal (better, não more good)."},{"lv":"A2","wrong":"English is more easy than math.","right":"English is easier than math.","why":"2 syllables ending in -y take -ier: easy → easier, happy → happier.","whyPt":"2 sílabas terminando em -y levam -ier: easy → easier, happy → happier."},{"lv":"A2","wrong":"This is the bigest room in the house.","right":"This is the biggest room in the house.","why":"1 syllable ending in consonant + vowel + consonant doubles the last letter: big → bigger → the biggest, hot → hotter.","whyPt":"1 sílaba terminando em consoante + vogal + consoante dobra a última letra: big → bigger → the biggest, hot → hotter."},{"lv":"B1","wrong":"The station is more far than I thought.","right":"The station is farther than I thought.","why":"far is irregular: far → farther → the farthest (mais longe, o mais longe). Never more far.","whyPt":"far é irregular: far → farther → the farthest (mais longe, o mais longe). Nunca more far."},{"lv":"B1","wrong":"She's one of the best student in the class.","right":"She's one of the best students in the class.","why":"one of the + superlative takes a plural noun: one of the best students (uma das melhores alunas).","whyPt":"Depois de one of the + superlativo vem um substantivo no plural: one of the best students (uma das melhores alunas)."}],"curious":[{"t":"cleverer / more clever · quieter / more quiet","en":"Some 2-syllable adjectives work both ways: clever, quiet, simple, narrow, polite, gentle… Both forms are right, so the game leaves them out.","pt":"Alguns adjetivos de 2 sílabas aceitam os dois jeitos: clever, quiet, simple, narrow, polite, gentle… As duas formas estão certas, por isso o jogo não usa esses adjetivos."},{"t":"friendlier / more friendly","en":"Both are used. The game asks for friendlier, the more common one (it follows the -y rule).","pt":"As duas formas são usadas. O jogo pede friendlier, a mais comum (segue a regra do -y)."},{"t":"farther / further","en":"Both talk about distance: farther / further from home. Further also means “more, extra”: further information. The game uses farther, the usual American choice for distance.","pt":"As duas falam de distância: farther / further from home. Further também quer dizer “mais, adicional”: further information. O jogo usa farther, a escolha mais comum nos Estados Unidos para distância."},{"t":"more fun / funner","en":"Children and casual American speech say funner and funnest. In writing and at school it's still more fun / the most fun.","pt":"Crianças e a fala informal americana dizem funner e funnest. Na escrita e na escola continua more fun / the most fun."},{"t":"the taller of the two","en":"With exactly two, English can use the + comparative: She's the taller of the two sisters. With three or more, it's the superlative: the tallest in the family.","pt":"Quando são exatamente dois, o inglês pode usar the + comparativo: She's the taller of the two sisters. Com três ou mais, é o superlativo: the tallest in the family."},{"t":"older / elder · oldest / eldest","en":"For family you can say my elder brother or the eldest daughter (before the noun). But never elder than: that is always older than.","pt":"Na família dá para dizer my elder brother ou the eldest daughter (antes do substantivo). Mas nunca elder than: aí é sempre older than."},{"t":"less / least","en":"The opposite of more / most: less expensive, the least interesting. Natural with long adjectives; with short ones English prefers the opposite word (smaller, not less big).","pt":"O contrário de more / most: less expensive, the least interesting. Soa natural com adjetivos longos; com os curtos, o inglês prefere o adjetivo oposto (smaller, e não less big)."},{"t":"than me / than I am","en":"She's taller than me is normal everyday English. Than I am is more careful, and than I on its own sounds formal.","pt":"She's taller than me é o inglês normal do dia a dia. Than I am é mais cuidadoso, e than I sozinho soa formal."},{"t":"my best friend · London's biggest park","en":"After a possessive (my, your, Ana's…) the superlative has no the: my best friend, London's biggest park. Never the my best friend.","pt":"Depois de um possessivo (my, your, Ana's…) o superlativo vem sem the: my best friend, London's biggest park. Nunca the my best friend."},{"t":"Why more / most for long words?","en":"Many short adjectives (old, cold, young) come from Old English and keep -er / -est. Many long ones (expensive, important, difficult) came from French and Latin and use more / most. It's a tendency, not a rule.","pt":"Muitos adjetivos curtos (old, cold, young) vêm do inglês antigo e mantêm -er / -est. Muitos longos (expensive, important, difficult) vieram do francês e do latim e usam more / most. É uma tendência, não uma regra."}],"demo":[{"en":"The blue whale is the [big:s] animal on Earth.","pt":"A baleia-azul é o maior animal da Terra."}]},"pt":{"name":"Português","badge":"PT","grad":"linear-gradient(135deg, #1fa463, #e8b600)","ui":{"favorites":"Favoritos","seen":"Vistos","tutorial":"Tutorial","guide":"Guia","tries":"Tentativas","hint":"Pistas","left":"{n} restantes","reset":"Limpar","check":"Conferir","volEffects":"Efeitos","volEffectsAria":"Volume dos efeitos sonoros","volVoice":"Voz","volVoiceAria":"Volume da voz","textOf":"Texto {n} de {total}","reviewOf":"Revisão {n} de {total}","favOf":"Favorito {n} de {total}","bonusOf":"Rodada bônus","intro":"Toque em cada adjetivo cinza para mudar a forma: <b>more …<\/b> → <b>-er<\/b> → <b>most …<\/b> → <b>-est<\/b>. Pare na forma certa e toque em <b>Conferir<\/b>.","introBase":"Toque em cada adjetivo cinza para mudar a forma: <b>more …<\/b> → <b>-er<\/b> → <b>most …<\/b> → <b>-est<\/b> → <b>simples<\/b>. Pare na forma certa e toque em <b>Conferir<\/b>.","introShort":"Toque nos adjetivos cinza até cada um ficar na forma certa, depois toque em <b>Conferir<\/b>.","untouched1":"Toque primeiro no adjetivo cinza: do jeito que está, ele não está certo.","untouchedN":"Toque primeiro em todos os adjetivos cinza: nenhum deles está certo do jeito que está.","wrong1":"Ainda não: <b>1<\/b> adjetivo está errado.","wrongN":"Ainda não: <b>{n}<\/b> adjetivos estão errados.","wrongMarked":"Ele está marcado em vermelho — o verde ficou travado.","wrongMarkedN":"Eles estão marcados em vermelho.","askDeg":"Pense: são <b>duas<\/b> coisas comparadas, ou uma é o <b>topo<\/b> de um grupo?","askDegB":"Pense: são <b>duas<\/b> coisas comparadas, uma é o <b>topo<\/b> de um grupo, ou é <b>as … as<\/b>, <b>too<\/b> ou <b>enough<\/b> (adjetivo simples)?","askForm":"A ideia está certa! Agora: o adjetivo é <b>curto<\/b> (-er / -est) ou <b>longo<\/b> (more / most)?","tryLeft":"Resta 1 tentativa.","triesLeft":"Restam {n} tentativas.","outOfTries":"Aqui estão as respostas certas — leia o porquê abaixo.","cluesOn":"<b>Pistas<\/b>: as palavras que decidem estão destacadas. <b>than<\/b> → comparativo. <b>the<\/b> → superlativo.","cluesWrong":"<b>Pistas<\/b>: as palavras que decidem o adjetivo vermelho estão destacadas. <b>than<\/b> → comparativo. <b>the<\/b> → superlativo.","hintLast":"Essa foi a sua última pista neste jogo.","hintsLeftGame":"Restam <b>{n}<\/b> neste jogo.","perfect":"Perfeito!","streak":"{n} perfeitos seguidos!","nice":"Muito bem!","gotIt":"Boa tentativa!","done":"Pronto!","doneNote":"Leia o porquê abaixo — toque num adjetivo do texto para ir até a explicação dele.","correctOf":"{k} de {n} certos","translation":"Tradução","listen":"Ouvir","listenText":"Ouvir o texto","next":"Próximo","results":"Ver resultado","toBonus":"Rodada bônus","youChose":"Você escolheu","youChoseFirst":"Primeiro você escolheu","rightIs":"O certo é {x}","watchOut":"Atenção!","guideBackEx":"Voltar às explicações","meaning":"significado","bonusTag":"Bônus","bonusIntro":"<b>Bônus!<\/b> Monte a frase em inglês: arraste (ou toque) as bolhas para as lacunas.","bonusWrong":"Quase: as palavras verdes estão certas. Tente as outras de novo!","bonusOut":"Esta é a frase.","bonusPerfect":"Bônus +{n}!","bonusGot":"Conseguiu! +{n}","bonusMissed":"Sem bônus desta vez.","guideTitle":"Comparativos e superlativos","guideAsk":"Pergunte-se","guideRules":"Como formar","guideTip":"<b>Armadilha do português:<\/b> <i>mais alto<\/i> pode ser <b>taller<\/b> ou <b>the tallest<\/b>. Com <i>o / a<\/i> na frente (o mais alto), é o superlativo.","mistakesTitle":"Erros mais comuns","mistakesLead":"As armadilhas clássicas para quem fala português: o que não dizer, e por quê.","curTitle":"Para os curiosos","curLead":"Além das regras: formas que você pode ouvir, e por que o jogo deixa algumas de fora.","pmNormal":"Jogo normal","pmSpeed":"Rodada relâmpago","pmReview":"Revisar erros","pmFav":"Favoritos","nTexts":"{n} textos + bônus","nTextsP":"{n} textos","oneText":"1 texto","nSeconds":"{n} segundos · frases soltas","pmNoMiss":"nenhum erro ainda","pmNoFav":"nenhum favorito ainda","speedTitle":"Rodada relâmpago","speedIntro":"Escolha a forma certa — uma frase de cada vez, o mais rápido que puder!","go":"Já!","speedAsk":"Qual forma está certa? Toque ou aperte o número dela.","endGame":"Fim de jogo!","endPractice":"Treino concluído!","endTime":"Acabou o tempo!","onePoint":"1 ponto","nPoints":"{n} pontos","inSeconds":"{x} certas em {s} segundos","msg0":"Continue — a prática leva à perfeição!","msg1":"Bom esforço — continue praticando!","msg2":"Ótimo trabalho!","msg3":"Brilhante! Você está cada vez melhor.","noSave":"Jogo de treino: a pontuação não é salva.","speedRecord":"Novo recorde relâmpago no {lvl}!","newBest":"Novo recorde no {lvl}!","levelBest":"Nível {lvl} · recorde {n}","hintsUsed":"Pistas usadas: {n} de {m}","bonus":" · +{n} extra","bonusRound":"Rodada bônus: {r}","missed":"errou","mastered":"textos dominados no {lvl}","daysRow":" · 🔥 {n} dias seguidos","playAgain":"Jogar de novo","copy":"Copiar resultado","copied":"Copiado ✓","copyFail":"Não deu para copiar","tryUp":"Tentar o {lvl} →","seenTitle":"Textos vistos","tabRecent":"Recentes","tabMissed":"Com erro","masteredHead":"Textos dominados (perfeitos na primeira conferida)","usesHead":"Regras para praticar (as mais fracas, todos os jogos)","usesOk":"Nenhuma regra fraca: 80% ou mais em todas!","practiseOne":"Praticar este","practiseMany":"Praticar estes","emptyFav":"Nenhum favorito ainda. Toque na estrela de um texto terminado para guardá-lo aqui.","emptyRecent":"Os textos que você terminar aparecem aqui.","emptyMissed":"Nenhum texto com erro. Muito bem!"},"tour":{"ui":{"step":"Passo {n} de {total}","back":"Voltar","next":"Próximo","play":"Vamos jogar!","close":"Fechar o tutorial"},"steps":{"welcome":{"t":"Comparativos e superlativos","x":"Cada texto tem dois adjetivos cinza. Cada toque muda a forma: <b>more …<\/b> → <b>-er<\/b> → <b>most …<\/b> → <b>-est<\/b>, e recomeça. Veja:"},"level":{"t":"Escolha o seu nível","x":"<b>A1<\/b>: textos curtos, adjetivos do dia a dia, instruções em português. <b>A2<\/b>: regras de ortografia (big → bigger, easy → easier) e adjetivos longos (more expensive). <b>B1+<\/b>: textos mais longos, um quinto passo com o adjetivo <b>simples<\/b> (as tall as, too far, big enough), e estruturas como <i>the more … the better<\/i> (quanto mais… melhor) e <i>more and more<\/i> (cada vez mais)."},"text":{"t":"Leia o texto inteiro primeiro","x":"Procure as palavras que decidem: <b>than<\/b> (do que) → comparativo (duas coisas). <b>the<\/b> … <b>in / of<\/b> → superlativo (o topo de um grupo). Toque numa palavra sublinhada com pontinhos para ver o significado."},"spot":{"t":"Toque, toque, toque…","x":"Olhe o primeiro adjetivo: cada toque avança um passo no ciclo, e a bolinha embaixo mostra onde você está. As formas <b>azuis<\/b> comparam duas coisas; as <b>laranja<\/b> são o topo (no B1+, um quinto toque dá o adjetivo simples, <b>roxo<\/b>). Shift + toque (ou botão direito) volta; as teclas <b>1<\/b> e <b>2<\/b> também funcionam."},"check":{"t":"Conferir","x":"Pare cada adjetivo na forma certa e toque em <b>Conferir<\/b>. Certo na primeira conferida = <b>2 pontos<\/b> por adjetivo; numa conferida depois = 1. No A1 e no A2, um adjetivo errado fica vermelho e o certo fica travado em verde."},"clues":{"t":"Pistas","x":"Travou? As <b>Pistas<\/b> destacam as palavras que decidem (than, the, of all…). Elas valem para o jogo todo, e cada pista que sobrar vira um <b>ponto extra<\/b>."},"why":{"t":"Entenda o porquê","x":"Depois de conferir, cada adjetivo ganha uma explicação: comparativo ou superlativo, a regra de ortografia, o significado e a sequência completa (<b>big → bigger → the biggest<\/b>). Toque num adjetivo para ir até a explicação, e ouça o texto."},"bonus":{"t":"A rodada bônus","x":"Depois dos 3 textos vem um <b>bônus<\/b>: uma frase em português e a versão em inglês com até 4 lacunas. Arraste (ou toque) as bolhas de palavras para as lacunas. Certo na primeira tentativa = <b>3 pontos<\/b>!"},"guide":{"t":"O guia","x":"Abra o <b>Guia<\/b> quando quiser: quando comparar, todas as regras de ortografia com exemplos, e as armadilhas clássicas para quem fala português (<i>mais alto<\/i> = taller ou the tallest?)."},"score":{"t":"Pontos","x":"Pontos para cada texto e para a rodada bônus, mais 1 ponto extra para cada pista que você não usar. Textos perfeitos seguidos formam um <b>combo<\/b>!"},"play":{"t":"Mais jeitos de jogar","x":"Toque em <b>new game<\/b> para um jogo novo, uma <b>rodada relâmpago<\/b> de 1 minuto com frases soltas, ou um treino com os textos em que você <b>errou<\/b> ou que <b>marcou com estrela<\/b>."},"lists":{"t":"Favoritos e Vistos","x":"Marque um texto terminado com estrela para guardá-lo nos <b>Favoritos<\/b>. <b>Vistos<\/b> mostra o seu progresso e os seus acertos em cada regra — descubra seus pontos fracos e pratique!"}}}},"texts":{"A1":[{"id":"a1-01","frame":"About me","framePt":"Sobre mim","title":"My family","titlePt":"Minha família","body":["My name is Lucy, and I have two brothers. Tom is ten and Sam is fourteen. Sam is [tall:c] {than} Tom. I am twelve, but I am not very tall. My dad is {the} [tall:s] person in our family. He is almost two meters!"],"pt":["Meu nome é Lucy, e eu tenho dois irmãos. O Tom tem dez anos e o Sam tem catorze. O Sam é mais alto do que o Tom. Eu tenho doze anos, mas não sou muito alta. Meu pai é a pessoa mais alta da nossa família. Ele tem quase dois metros!"],"w":{"brothers":"irmãos","person":"pessoa","almost":"quase","meters":"metros"}},{"id":"a1-02","frame":"School project","framePt":"Trabalho da escola","title":"My pets","titlePt":"Meus bichos de estimação","body":["I have a dog and a cat. My dog, Max, is big and brown. My cat, Luna, is [small:c] {than} Max, and she is very fast. Max is slow and lazy, but he is sweet. My mom says Luna is [beautiful:c] {than} Max, but I love them both!"],"pt":["Eu tenho um cachorro e uma gata. Meu cachorro, Max, é grande e marrom. Minha gata, Luna, é menor do que o Max, e ela é muito rápida. O Max é lento e preguiçoso, mas ele é fofo. Minha mãe diz que a Luna é mais bonita do que o Max, mas eu amo os dois!"],"w":{"brown":"marrom","fast":"rápido","slow":"lento","lazy":"preguiçoso","sweet":"fofo, doce","says":"diz","both":"os dois"}},{"id":"a1-03","frame":"Postcard","framePt":"Cartão-postal","title":"Hello from London","titlePt":"Olá de Londres","body":["Hello from London! It is cold and rainy here. Today is {the} [cold:s] day of the week! I am in a nice hotel. My room is on {the} [high:s] floor, and the view is great.","Love, Mia"],"pt":["Olá de Londres! Está frio e chuvoso aqui. Hoje é o dia mais frio da semana! Estou num hotel legal. Meu quarto fica no andar mais alto, e a vista é ótima.","Beijos, Mia"],"w":{"rainy":"chuvoso","week":"semana","floor":"andar","view":"vista"},"notes":[null,{"en":"high = far above the ground: a high floor, a high shelf, a high mountain. tall = people, trees and buildings: a tall man, a tall building.","pt":"high = longe do chão: um andar alto, uma prateleira alta, uma montanha alta. tall = pessoas, árvores e prédios: um homem alto, um prédio alto."}]},{"id":"a1-04","frame":"Blog","framePt":"Blog","title":"Two places","titlePt":"Dois lugares","body":["I live in a small town, but my cousin lives in New York. New York is [big:c] {than} my town, of course! It is also [interesting:c] {than} here, with museums, parks and shows. But my town is quiet and green, and I love it."],"pt":["Eu moro numa cidade pequena, mas meu primo mora em Nova York. Nova York é maior do que a minha cidade, claro! Também é mais interessante do que aqui, com museus, parques e shows. Mas a minha cidade é tranquila e verde, e eu a amo."],"w":{"town":"cidade (pequena)","cousin":"primo","of course":"claro","museums":"museus","quiet":"tranquilo"}},{"id":"a1-05","frame":"Email","framePt":"E-mail","title":"My new school","titlePt":"Minha escola nova","body":["Hi Ben! I love my new school. My teacher, Mr. Brown, is funny and kind. Math is {the} [difficult:s] subject for me. But English is {the} [important:s] one, because I want to travel the world!"],"pt":["Oi, Ben! Eu adoro a minha escola nova. Meu professor, o Sr. Brown, é engraçado e gentil. Matemática é a matéria mais difícil para mim. Mas inglês é a mais importante, porque eu quero viajar pelo mundo!"],"w":{"funny":"engraçado","kind":"gentil","subject":"matéria","travel":"viajar"}},{"id":"a1-06","frame":"Blog","framePt":"Blog","title":"Two cafés","titlePt":"Dois cafés","body":["Our town has two cafés, Café Sol and Café Luna. Café Sol is pretty, but the coffee is not good. It is [bad:c] {than} the coffee at Café Luna! But Café Luna is not cheap. Its sandwiches are [expensive:c] {than} the sandwiches at Café Sol."],"pt":["A nossa cidade tem dois cafés, o Café Sol e o Café Luna. O Café Sol é bonito, mas o café não é bom. É pior do que o café do Café Luna! Mas o Café Luna não é barato. Os sanduíches de lá são mais caros do que os sanduíches do Café Sol."],"w":{"town":"cidade","pretty":"bonito","cheap":"barato"}},{"id":"a1-07","frame":"About me","framePt":"Sobre mim","title":"My grandparents","titlePt":"Meus avós","body":["My grandma is 70 and my grandpa is 75. Grandma is [young:c] {than} Grandpa, but she is not very young! They live in a house by the sea. Their house is [old:c] {than} our apartment, but it has a big garden. I love it there."],"pt":["A minha avó tem 70 anos e o meu avô tem 75. A vovó é mais nova do que o vovô, mas ela não é muito nova! Eles moram numa casa perto do mar. A casa deles é mais velha do que o nosso apartamento, mas tem um jardim grande. Eu adoro ficar lá."],"w":{"grandma":"avó","grandpa":"avô","by the sea":"perto do mar","garden":"jardim"}},{"id":"a1-08","frame":"School trip","framePt":"Passeio da escola","title":"At the zoo","titlePt":"No zoológico","body":["Today my class is at the zoo. The elephants are {the} [big:s] animals here. The monkeys are funny, and they are {the} [popular:s] animals with the kids. My favorite animal is the giraffe. It is very tall!"],"pt":["Hoje a minha turma está no zoológico. Os elefantes são os maiores animais daqui. Os macacos são engraçados, e eles são os animais mais populares com as crianças. O meu animal favorito é a girafa. Ela é muito alta!"],"w":{"zoo":"zoológico","monkeys":"macacos","funny":"engraçado","kids":"crianças","favorite":"favorito","giraffe":"girafa"}},{"id":"a1-09","frame":"Blog","framePt":"Blog","title":"My birthday","titlePt":"Meu aniversário","body":["Today is my birthday, and I am ten! My party is at home, with my family and my friends. My cake is chocolate, and it is [nice:c] {than} my brother's cake last year. This is {the} [happy:s] day of the year for me!"],"pt":["Hoje é o meu aniversário, e eu tenho dez anos! A minha festa é em casa, com a minha família e os meus amigos. O meu bolo é de chocolate, e é mais legal do que o bolo do meu irmão no ano passado. Este é o dia mais feliz do ano para mim!"],"w":{"birthday":"aniversário","party":"festa","cake":"bolo","last year":"no ano passado"}},{"id":"a1-10","frame":"Blog","framePt":"Blog","title":"Two shops","titlePt":"Duas lojas","body":["There are two clothes shops on my street. Shop A is small, and its clothes are very pretty. Shop B is big, and its prices are [low:c] {than} at Shop A. Shop B also has {the} [comfortable:s] shoes in town. I always buy my shoes there!"],"pt":["Há duas lojas de roupas na minha rua. A loja A é pequena, e as roupas de lá são muito bonitas. A loja B é grande, e os preços são mais baixos do que na loja A. A loja B também tem os sapatos mais confortáveis da cidade. Eu sempre compro os meus sapatos lá!"],"w":{"clothes":"roupas","shops":"lojas","street":"rua","pretty":"bonito","prices":"preços","shoes":"sapatos","town":"cidade","always":"sempre","buy":"comprar"}},{"id":"a1-11","frame":"About me","framePt":"Sobre mim","title":"My sports","titlePt":"Meus esportes","body":["I love sports! I play soccer, tennis and basketball. Soccer is {the} [easy:s] sport for me, because I play it every day. Tennis is hard, but I like it. And basketball? I am {the} [bad:s] player on my team! I am not very tall."],"pt":["Eu amo esportes! Eu jogo futebol, tênis e basquete. Futebol é o esporte mais fácil para mim, porque eu jogo todo dia. Tênis é difícil, mas eu gosto. E basquete? Eu sou o pior jogador do meu time! Eu não sou muito alto."],"w":{"sports":"esportes","soccer":"futebol","basketball":"basquete","every day":"todo dia","hard":"difícil","player":"jogador","team":"time"}},{"id":"a1-12","frame":"Blog","framePt":"Blog","title":"My city","titlePt":"Minha cidade","body":["My city is small, but it is famous for its food. People say our pizza is [delicious:c] {than} the pizza in Rome! The old church is {the} [famous:s] building in the city. Every summer, many tourists come here to see it."],"pt":["A minha cidade é pequena, mas é famosa pela comida. As pessoas dizem que a nossa pizza é mais deliciosa do que a pizza de Roma! A igreja antiga é o prédio mais famoso da cidade. Todo verão, muitos turistas vêm aqui para vê-la."],"w":{"food":"comida","people say":"as pessoas dizem","church":"igreja","building":"prédio","tourists":"turistas"},"notes":[null,{"en":"famous has 2 syllables (fa-mous): most famous, not famousest.","pt":"famous tem 2 sílabas (fa-mous): most famous, não famousest."}]},{"id":"a1-13","frame":"About me","framePt":"Sobre mim","title":"My bedroom","titlePt":"Meu quarto","body":["My bedroom is small, but I love it. My sister's room is [big:c] {than} my room, and it has two windows. But my room is [warm:c] {than} hers in winter! I have a bed, a desk and a lot of books."],"pt":["O meu quarto é pequeno, mas eu adoro ele. O quarto da minha irmã é maior do que o meu, e tem duas janelas. Mas o meu quarto é mais quente do que o dela no inverno! Eu tenho uma cama, uma escrivaninha e muitos livros."],"w":{"bedroom":"quarto","windows":"janelas","hers":"o dela","winter":"inverno","desk":"escrivaninha"}},{"id":"a1-14","frame":"School project","framePt":"Trabalho da escola","title":"Our library","titlePt":"Nossa biblioteca","body":["Our school library is my favorite place. It is {the} [old:s] room in the school, and it has thousands of books. My favorite book there is about space. It is {the} [interesting:s] book in the library!"],"pt":["A biblioteca da nossa escola é o meu lugar favorito. É a sala mais antiga da escola, e tem milhares de livros. O meu livro favorito de lá é sobre o espaço. É o livro mais interessante da biblioteca!"],"w":{"library":"biblioteca","favorite":"favorito","thousands":"milhares","space":"espaço"}},{"id":"a1-15","frame":"Blog","framePt":"Blog","title":"I love fruit","titlePt":"Eu amo frutas","body":["I love fruit! Bananas are swee  e uma piscina. As aulas são mais interessantes do que no ano passado, e são divertidas. A minha professora é muito legal!"],"w":{"library":"biblioteca","pool":"piscina","classes":"aulas","last year":"ano passado"}},{"id":"a1-28","frame":"Food","framePt":"Comida","title":"Pizza night","titlePt":"Noite da pizza","body":["On Fridays, my family makes pizza at home. My dad's pizza is [good:c] {than} pizza from a restaurant! My sister puts a lot of cheese on her pizza. But my mom makes {the} [delicious:s] pizza in our family. We eat it in front of the TV."],"pt":["Às sextas-feiras, a minha família faz pizza em casa. A pizza do meu pai é melhor do que pizza de restaurante! A minha irmã coloca muito queijo na pizza dela. Mas a minha mãe faz a pizza mais deliciosa da nossa família. Nós comemos na frente da TV."],"w":{"on Fridays":"às sextas-feiras","a lot of":"muito","cheese":"queijo","in front of":"na frente de"}},{"id":"a1-29","frame":"School trip","framePt":"Passeio da escola","title":"At the zoo","titlePt":"No zoológico","body":["Today we went to the zoo with our class. The giraffes are [tall:c] {than} the elephants. They eat leaves from the trees. But the elephants are {the} [heavy:s] animals in the zoo. My favorite animal is the monkey!"],"pt":["Hoje nós fomos ao zoológico com a nossa turma. As girafas são mais altas do que os elefantes. Elas comem folhas das árvores. Mas os elefantes são os animais mais pesados do zoológico. O meu animal favorito é o macaco!"],"w":{"went":"fomos","giraffes":"girafas","leaves":"folhas","monkey":"macaco"}},{"id":"a1-30","frame":"Sports","framePt":"Esportes","title":"Our soccer team","titlePt":"Nosso time de futebol","body":["I play soccer every Saturday. My friend Peter is [strong:c] {than} me, and he kicks the ball very hard. Our team is not {the} [good:s] team in the city. But we have fun, and we are good friends!"],"pt":["Eu jogo futebol todo sábado. O meu amigo Peter é mais forte do que eu, e ele chuta a bola com muita força. O nosso time não é o melhor time da cidade. Mas a gente se diverte, e somos bons amigos!"],"w":{"kicks":"chuta","hard":"com força","team":"time","have fun":"se divertir"}},{"id":"a1-31","frame":"Diary","framePt":"Diário","title":"Grandma's house","titlePt":"A casa da vovó","body":["My grandma lives in a small house in the country. Her house is [comfortable:c] {than} our apartment. It has a garden with lots of flowers. The air there is [fresh:c] {than} in the city. I love my visits!"],"pt":["A minha avó mora numa casa pequena no campo. A casa dela é mais confortável do que o nosso apartamento. Ela tem um jardim com muitas flores. Lá, o ar é mais fresco do que na cidade. Eu adoro as minhas visitas!"],"w":{"country":"campo","flowers":"flores","air":"ar","visits":"visitas"}},{"id":"a1-32","frame":"Shopping","framePt":"Compras","title":"New shoes","titlePt":"Sapatos novos","body":["I need new shoes for school. The black shoes are 40 dollars. The white shoes are [cheap:c] {than} the black shoes. But the blue shoes are {the} [nice:s] shoes in the store. I buy the blue ones!"],"pt":["Eu preciso de sapatos novos para a escola. Os sapatos pretos custam 40 dólares. Os sapatos brancos são mais baratos do que os pretos. Mas os sapatos azuis são os mais bonitos da loja. Eu compro os azuis!"],"w":{"need":"preciso","shoes":"sapatos","store":"loja","buy":"compro"}},{"id":"a1-33","frame":"Blog","framePt":"Blog","title":"Summer in Canada","titlePt":"Verão no Canadá","body":["I live in Canada. Winter here is very cold. Summer is [hot:c] {than} winter, of course! In summer, the days are [long:c] {than} in winter. It is light at nine o'clock at night!"],"pt":["Eu moro no Canadá. Aqui o inverno é muito frio. O verão é mais quente do que o inverno, é claro! No verão, os dias são mais longos do que no inverno. Ainda está claro às nove horas da noite!"],"w":{"winter":"inverno","summer":"verão","of course":"é claro","light":"claro (com luz do dia)"}},{"id":"a1-34","frame":"About me","framePt":"Sobre mim","title":"My cousins","titlePt":"Meus primos","body":["I have five cousins. Anna is {the} [old:s]: she is twenty. Leo is only six, but he is {the} [funny:s] person in the family. He tells great jokes. Everybody loves Leo!"],"pt":["Eu tenho cinco primos. A Anna é a mais velha: ela tem vinte anos. O Leo tem só seis anos, mas ele é a pessoa mais engraçada da família. Ele conta piadas ótimas. Todo mundo adora o Leo!"],"w":{"cousins":"primos","only":"só","jokes":"piadas","everybody":"todo mundo"}},{"id":"a1-35","frame":"Travel","framePt":"Viagem","title":"To New York","titlePt":"Para Nova York","body":["My family is going to New York. We can go by plane or by bus. The plane is [expensive:c] {than} the bus. But the bus is [slow:c] {than} the plane: twelve hours! I want to go by plane."],"pt":["A minha família vai para Nova York. Podemos ir de avião ou de ônibus. O avião é mais caro do que o ônibus. Mas o ônibus é mais lento do que o avião: doze horas! Eu quero ir de avião."],"w":{"plane":"avião","by bus":"de ônibus","hours":"horas","want":"quero"}},{"id":"a1-36","frame":"Diary","framePt":"Diário","title":"My birthday","titlePt":"Meu aniversário","body":["Yesterday was my birthday. I was ten! My cake was [big:c] {than} last year's cake, with ten candles. All my friends came to the party. It was {the} [exciting:s] day of the year!"],"pt":["Ontem foi o meu aniversário. Eu fiz dez anos! O meu bolo era maior do que o bolo do ano passado, com dez velas. Todos os meus amigos vieram à festa. Foi o dia mais emocionante do ano!"],"w":{"birthday":"aniversário","cake":"bolo","candles":"velas","came":"vieram"}},{"id":"a1-37","frame":"Music","framePt":"Música","title":"My favorite band","titlePt":"Minha banda favorita","body":["I love music. My favorite band is from Korea. They are {the} [popular:s] band in my school. Their new video is [cool:c] {than} their old videos. I watch it every day!"],"pt":["Eu adoro música. A minha banda favorita é da Coreia. Eles são a banda mais popular da minha escola. O vídeo novo deles é mais legal do que os vídeos antigos. Eu assisto todo dia!"],"w":{"band":"banda","new":"novo","watch":"assisto"}},{"id":"a1-38","frame":"Science","framePt":"Ciências","title":"The planets","titlePt":"Os planetas","body":["Our solar system has eight planets. Jupiter is {the} [big:s] planet. It is very far from the Sun. Venus is {the} [hot:s] planet, not Mercury! It has thick clouds."],"pt":["O nosso sistema solar tem oito planetas. Júpiter é o maior planeta. Ele fica muito longe do Sol. Vênus é o planeta mais quente, e não Mercúrio! Ele tem nuvens grossas."],"w":{"solar system":"sistema solar","far":"longe","thick":"grossas","clouds":"nuvens"}},{"id":"a1-39","frame":"Food","framePt":"Comida","title":"Fruit","titlePt":"Frutas","body":["I eat fruit every day. Bananas are my favorite. Strawberries are [small:c] {than} apples, and they are very sweet. A watermelon is [heavy:c] {than} ten apples! We eat it in summer."],"pt":["Eu como fruta todo dia. Bananas são as minhas favoritas. Morangos são menores do que maçãs, e são muito doces. Uma melancia é mais pesada do que dez maçãs! Nós comemos melancia no verão."],"w":{"strawberries":"morangos","apples":"maçãs","sweet":"doces","watermelon":"melancia"}},{"id":"a1-40","frame":"Shopping","framePt":"Compras","title":"My winter coat","titlePt":"Meu casaco de inverno","body":["It is very cold in December. Yesterday I bought a new coat. It is {the} [warm:s] coat in the store! It is also [colorful:c] {than} my old coat. Now I am never cold."],"pt":["Faz muito frio em dezembro. Ontem eu comprei um casaco novo. É o casaco mais quente da loja! Ele também é mais colorido do que o meu casaco antigo. Agora eu nunca sinto frio."],"w":{"bought":"comprei","coat":"casaco","also":"também","never":"nunca"}},{"id":"a1-41","frame":"School project","framePt":"Trabalho da escola","title":"My friend Sara","titlePt":"Minha amiga Sara","body":["Sara is my best friend. She is [young:c] {than} me: she is nine and I am ten. She is {the} [kind:s] girl in our class. She always helps everybody. I love her!"],"pt":["A Sara é a minha melhor amiga. Ela é mais nova do que eu: ela tem nove anos e eu tenho dez. Ela é a menina mais gentil da nossa turma. Ela sempre ajuda todo mundo. Eu adoro ela!"],"w":{"best friend":"melhor amiga","always":"sempre","helps":"ajuda","everybody":"todo mundo"}},{"id":"a1-42","frame":"Blog","framePt":"Blog","title":"My city","titlePt":"Minha cidade","body":["My city is small, but it is very nice. The market is {the} [old:s] building in the city: it is 300 years old! On Saturdays, it is full of people. The new mall is [big:c] {than} the market, but I like the market more."],"pt":["A minha cidade é pequena, mas é muito bonita. O mercado é o prédio mais antigo da cidade: ele tem 300 anos! Aos sábados, ele fica cheio de gente. O shopping novo é maior do que o mercado, mas eu gosto mais do mercado."],"w":{"market":"mercado","building":"prédio","full":"cheio","mall":"shopping"}},{"id":"a1-43","frame":"TV","framePt":"TV","title":"Cartoons","titlePt":"Desenhos animados","body":["I love cartoons. “Space Cats” is {the} [good:s] cartoon on TV. The cats fly to the Moon in a pink rocket! My brother likes “Robot Kids”, but I think it is [boring:c] {than} “Space Cats”. We watch TV after school."],"pt":["Eu adoro desenhos animados. “Space Cats” é o melhor desenho da TV. Os gatos voam para a Lua num foguete cor-de-rosa! O meu irmão gosta de “Robot Kids”, mas eu acho que é mais chato do que “Space Cats”. Nós vemos TV depois da escola."],"w":{"cartoons":"desenhos animados","fly":"voam","rocket":"foguete","after school":"depois da escola"}},{"id":"a1-44","frame":"Email","framePt":"E-mail","title":"Our new apartment","titlePt":"Nosso apartamento novo","body":["Hi Jack! We have a new apartment. It is [high:c] {than} our old one: on the tenth floor! The rooms are [modern:c] {than} in our old apartment, with big windows. Come and visit!","Tom"],"pt":["Oi, Jack! Nós temos um apartamento novo. Ele é mais alto do que o antigo: no décimo andar! Os quartos são mais modernos do que no nosso apartamento antigo, com janelas grandes. Venha nos visitar!","Tom"],"w":{"floor":"andar","rooms":"quartos, cômodos","windows":"janelas","visit":"visitar"}},{"id":"a1-45","frame":"Blog","framePt":"Blog","title":"Three cafés","titlePt":"Três cafés","body":["There are three cafés on my street. Café Blue has {the} [good:s] coffee, but it is expensive. Café Sol is {the} [cheap:s] café on the street. Its cakes are good too. I go there every morning!"],"pt":["Há três cafés na minha rua. O Café Blue tem o melhor café, mas é caro. O Café Sol é o café mais barato da rua. Os bolos de lá também são bons. Eu vou lá toda manhã!"],"w":{"there are":"há","street":"rua","cakes":"bolos","there":"lá","morning":"manhã"}},{"id":"a1-46","frame":"Pets","framePt":"Animais de estimação","title":"My old dog","titlePt":"Meu cachorro velhinho","body":["My dog Rex is fourteen. That is very old for a dog! He sleeps all day, and he is [lazy:c] {than} my cat. He is also [calm:c] {than} other dogs. He is a great friend."],"pt":["O meu cachorro Rex tem catorze anos. Isso é muito velho para um cachorro! Ele dorme o dia todo, e ele é mais preguiçoso do que o meu gato. Ele também é mais calmo do que os outros cachorros. Ele é um ótimo amigo."],"w":{"sleeps":"dorme","all day":"o dia todo","also":"também","great":"ótimo"}},{"id":"a1-47","frame":"Postcard","framePt":"Cartão-postal","title":"At the beach","titlePt":"Na praia","body":["Hi Grandpa! We are at the beach. The sea is [cold:c] {than} the hotel pool, but I love it. This is {the} [beautiful:s] beach in the town. We swim every day!","Hugs, Mia"],"pt":["Oi, vovô! Nós estamos na praia. O mar é mais frio do que a piscina do hotel, mas eu adoro. Esta é a praia mais bonita da cidade. Nós nadamos todo dia!","Abraços, Mia"],"w":{"sea":"mar","pool":"piscina","swim":"nadamos","hugs":"abraços"}},{"id":"a1-48","frame":"School project","framePt":"Trabalho da escola","title":"Books","titlePt":"Livros","body":["I love books. “The Big Tree” is {the} [interesting:s] book in my house. It is about a girl and a magic tree. My mom says books are [important:c] {than} video games. I agree!"],"pt":["Eu adoro livros. “The Big Tree” é o livro mais interessante da minha casa. Ele é sobre uma menina e uma árvore mágica. A minha mãe diz que livros são mais importantes do que videogames. Eu concordo!"],"w":{"about":"sobre","magic":"mágica","says":"diz","agree":"concordo"}}],"A2":[{"id":"a2-01","frame":"Review","framePt":"Avaliação","title":"My new phone","titlePt":"Meu celular novo","body":["Last week I bought a new phone. My old phone was slow, and the battery was terrible. The new one is much [fast:c] {than} my old phone, and the camera is amazing. But it wasn't cheap: it was [expensive:c] {than} my laptop!"],"pt":["Semana passada eu comprei um celular novo. Meu celular antigo era lento, e a bateria era péssima. O novo é muito mais rápido do que o meu celular antigo, e a câmera é incrível. Mas ele não foi barato: foi mais caro do que o meu notebook!"],"w":{"bought":"comprei","slow":"lento","battery":"bateria","terrible":"péssimo","amazing":"incrível","cheap":"barato","laptop":"notebook"},"notes":[{"en":"much + comparative = a lot more: much faster.","pt":"much + comparativo = muito mais: much faster (muito mais rápido)."},null]},{"id":"a2-02","frame":"Travel blog","framePt":"Blog de viagem","title":"A week at the beach","titlePt":"Uma semana na praia","body":["This summer we spent a week at the beach. Every day was hot, but Wednesday was {the} [hot:s] day of the trip: 38 degrees! On the first day we went to the beach near our hotel, but it was full of people. The next day we found a different beach. It was much [empty:c] {than} the first one, and the water was beautiful."],"pt":["Neste verão passamos uma semana na praia. Todos os dias foram quentes, mas a quarta-feira foi o dia mais quente da viagem: 38 graus! No primeiro dia fomos à praia perto do nosso hotel, mas estava cheia de gente. No dia seguinte encontramos uma praia diferente. Ela estava muito mais vazia do que a primeira, e a água era linda."],"w":{"spent":"passamos","trip":"viagem","degrees":"graus","near":"perto de","full of":"cheio de","found":"encontramos"}},{"id":"a2-03","frame":"Blog","framePt":"Blog","title":"My sister's job","titlePt":"O trabalho da minha irmã","body":["My sister Julia is a nurse, and I am a teacher. Her job is [difficult:c] {than} mine, I think. She works at night and on weekends. But she says nursing is {the} [interesting:s] job in the world. She loves helping people."],"pt":["A minha irmã Julia é enfermeira, e eu sou professor. O trabalho dela é mais difícil do que o meu, eu acho. Ela trabalha à noite e nos fins de semana. Mas ela diz que enfermagem é o trabalho mais interessante do mundo. Ela adora ajudar as pessoas."],"w":{"nurse":"enfermeira","mine":"o meu","weekends":"fins de semana","says":"diz","nursing":"enfermagem","helping":"ajudar"}},{"id":"a2-04","frame":"Email","framePt":"E-mail","title":"Our new apartment","titlePt":"Nosso apartamento novo","body":["Hi Grandma! We moved to our new apartment last Saturday. It is {the} [large:s] apartment on our floor, and I have my own room now! The only problem is the neighbors upstairs. They are {the} [noisy:s] people in the building. They play loud music every night!"],"pt":["Oi, vó! Nós nos mudamos para o nosso apartamento novo no sábado passado. É o maior apartamento do nosso andar, e agora eu tenho o meu próprio quarto! O único problema são os vizinhos de cima. Eles são as pessoas mais barulhentas do prédio. Eles tocam música alta todas as noites!"],"w":{"moved":"nos mudamos","floor":"andar","own":"próprio","only":"único","neighbors":"vizinhos","upstairs":"no andar de cima","building":"prédio","loud":"alto (som)"}},{"id":"a2-05","frame":"School news","framePt":"Notícias da escola","title":"Sports Day","titlePt":"Dia dos Esportes","body":["Last Friday was Sports Day at our school. Emma won the 100-meter race. She is {the} [quick:s] runner in our class. In the long jump, Leo jumped only three meters. That was [bad:c] {than} his jump last year, but he still had fun."],"pt":["Na sexta passada foi o Dia dos Esportes na nossa escola. A Emma ganhou a corrida de 100 metros. Ela é a corredora mais rápida da nossa turma. No salto em distância, o Leo saltou só três metros. Foi pior do que o salto dele no ano passado, mas ele se divertiu mesmo assim."],"w":{"won":"ganhou","race":"corrida","runner":"corredor(a)","long jump":"salto em distância","jumped":"saltou","still":"mesmo assim","had fun":"se divertiu"}},{"id":"a2-06","frame":"School trip","framePt":"Passeio da escola","title":"At the museum","titlePt":"No museu","body":["Yesterday I visited the city museum with my class. The dinosaur room was {the} [popular:s] part of the museum, with a huge skeleton in the middle. The art rooms were boring for me. But my friend Sara loved them. For her, paintings are [exciting:c] {than} dinosaurs!"],"pt":["Ontem eu visitei o museu da cidade com a minha turma. A sala dos dinossauros foi a parte mais popular do museu, com um esqueleto enorme no meio. As salas de arte foram chatas para mim. Mas a minha amiga Sara adorou. Para ela, quadros são mais empolgantes do que dinossauros!"],"w":{"huge":"enorme","skeleton":"esqueleto","middle":"meio","boring":"chato","paintings":"quadros, pinturas"}},{"id":"a2-07","frame":"Blog","framePt":"Blog","title":"Two job offers","titlePt":"Duas ofertas de emprego","body":["Last month I had two job offers. The first job was at a bank, and the salary was [high:c] {than} at the second job. The second job was at a school, and it was [far:c] from my house {than} the bank. But I chose the school! For me, teaching is more fun than counting money."],"pt":["No mês passado eu recebi duas ofertas de emprego. O primeiro emprego era num banco, e o salário era mais alto do que no segundo emprego. O segundo emprego era numa escola, e ela ficava mais longe da minha casa do que o banco. Mas eu escolhi a escola! Para mim, ensinar é mais divertido do que contar dinheiro."],"w":{"job offers":"ofertas de emprego","salary":"salário","chose":"escolhi","teaching":"ensinar","fun":"divertido","counting":"contar","money":"dinheiro"},"notes":[null,{"en":"far is irregular: far → farther → the farthest.","pt":"far é irregular: far → farther → the farthest (longe → mais longe → o mais longe)."}]},{"id":"a2-08","frame":"Postcard","framePt":"Cartão-postal","title":"Rainy Scotland","titlePt":"Escócia chuvosa","body":["Hi Tom! We're in Scotland this week. Yesterday was {the} [wet:s] day of our trip: it rained for ten hours! But the castles are amazing. Edinburgh Castle is {the} [beautiful:s] place I've {ever} seen.","See you soon, Ana"],"pt":["Oi, Tom! Estamos na Escócia esta semana. Ontem foi o dia mais molhado da nossa viagem: choveu por dez horas! Mas os castelos são incríveis. O Castelo de Edimburgo é o lugar mais bonito que eu já vi.","Até logo, Ana"],"w":{"trip":"viagem","rained":"choveu","castles":"castelos","amazing":"incrível","seen":"visto"}},{"id":"a2-09","frame":"School project","framePt":"Trabalho da escola","title":"My best friend","titlePt":"Meu melhor amigo","body":["My best friend is Kenji. We are very different. He is {the} [funny:s] person in our class, and he always makes everyone laugh. I am [serious:c] {than} him, and I prefer books to parties. But we never fight!"],"pt":["O meu melhor amigo é o Kenji. Nós somos muito diferentes. Ele é a pessoa mais engraçada da nossa turma, e ele sempre faz todo mundo rir. Eu sou mais sério do que ele, e prefiro livros a festas. Mas nós nunca brigamos!"],"w":{"different":"diferente","makes everyone laugh":"faz todo mundo rir","prefer":"preferir","parties":"festas","never":"nunca","fight":"brigar"}},{"id":"a2-10","frame":"Travel tip","framePt":"Dica de viagem","title":"Train or bus?","titlePt":"Trem ou ônibus?","body":["Last summer I traveled from Paris to Lyon by train. The train was [comfortable:c] {than} the bus, with big seats and free Wi-Fi. But the bus ticket was much [cheap:c] {than} the train ticket. Next time, I'll take the bus!"],"pt":["No verão passado eu viajei de Paris para Lyon de trem. O trem era mais confortável do que o ônibus, com assentos grandes e Wi-Fi grátis. Mas a passagem de ônibus era muito mais barata do que a de trem. Da próxima vez, eu vou de ônibus!"],"w":{"traveled":"viajei","seats":"assentos","free":"grátis","ticket":"passagem","next time":"da próxima vez"}},{"id":"a2-11","frame":"Review","framePt":"Avaliação","title":"A new pizza place","titlePt":"Uma pizzaria nova","body":["Last night we tried Mario's, the new pizza place on Main Street. It was full, so we waited 30 minutes for a table. But the wait was worth it: it was {the} [tasty:s] pizza I've {ever} had! It was a bit [expensive:c] {than} at other places, but I'm going back next week."],"pt":["Ontem à noite nós experimentamos o Mario's, a nova pizzaria da Main Street. Estava lotado, então esperamos 30 minutos por uma mesa. Mas a espera valeu a pena: foi a pizza mais gostosa que eu já comi! Foi um pouco mais cara do que em outros lugares, mas eu vou voltar semana que vem."],"w":{"tried":"experimentamos","full":"lotado","waited":"esperamos","worth it":"valeu a pena","going back":"voltar"},"notes":[null,{"en":"a bit / a little + comparative = um pouco mais: a bit more expensive.","pt":"a bit / a little + comparativo = um pouco mais: a bit more expensive (um pouco mais caro)."}]},{"id":"a2-12","frame":"School news","framePt":"Notícias da escola","title":"Our new science teacher","titlePt":"Nossa nova professora de ciências","body":["Ms. Lopez is the new science teacher at our school. She is from Mexico, and she's {the} [young:s] teacher here: only 24! Her classes are full of experiments. Last week we made a volcano, and it was {the} [messy:s] class of the year!"],"pt":["A Sra. Lopez é a nova professora de ciências da nossa escola. Ela é do México, e é a professora mais jovem daqui: só 24 anos! As aulas dela são cheias de experiências. Na semana passada nós fizemos um vulcão, e foi a aula mais bagunçada do ano!"],"w":{"science":"ciências","experiments":"experiências","made":"fizemos","volcano":"vulcão"}},{"id":"a2-13","frame":"Blog","framePt":"Blog","title":"The new gym","titlePt":"A academia nova","body":["Last month a new gym opened near my house. It's much [large:c] {than} the old one, and it has a pool. It's also {the} [cheap:s] gym in the neighborhood: only 20 dollars a month! I go there three times a week now."],"pt":["No mês passado uma academia nova abriu perto da minha casa. Ela é muito maior do que a antiga, e tem piscina. Também é a academia mais barata do bairro: só 20 dólares por mês! Agora eu vou lá três vezes por semana."],"w":{"gym":"academia","opened":"abriu","pool":"piscina","neighborhood":"bairro","a month":"por mês","three times a week":"três vezes por semana"},"notes":[{"en":"much + comparative = muito mais: much larger.","pt":"much + comparativo = muito mais: much larger (muito maior)."},null]},{"id":"a2-14","frame":"Blog","framePt":"Blog","title":"Video games","titlePt":"Videogames","body":["My brother and I love video games. He prefers racing games, but for me, puzzle games are [fun:c] {than} racing games. They're also [relaxing:c] {than} games with lots of action. Last night I played until midnight!"],"pt":["O meu irmão e eu amamos videogames. Ele prefere jogos de corrida, mas para mim, jogos de quebra-cabeça são mais divertidos do que jogos de corrida. Eles também são mais relaxantes do que jogos com muita ação. Ontem à noite eu joguei até a meia-noite!"],"w":{"prefers":"prefere","racing":"corrida","puzzle":"quebra-cabeça","action":"ação","played":"joguei","midnight":"meia-noite"},"notes":[{"en":"fun is special: more fun / the most fun, never funner or funnest.","pt":"fun é especial: more fun / the most fun, nunca funner nem funnest."},null]},{"id":"a2-15","frame":"Travel blog","framePt":"Blog de viagem","title":"Climbing Snowdon","titlePt":"Subindo o Snowdon","body":["Last weekend my family climbed Snowdon, {the} [high:s] mountain in Wales. It took us four hours to get to the top. The weather up there was terrible: it was {the} [windy:s] place I've {ever} been! But the view was worth it."],"pt":["No fim de semana passado a minha família subiu o Snowdon, a montanha mais alta do País de Gales. Levamos quatro horas para chegar ao topo. O tempo lá em cima estava péssimo: foi o lugar com mais vento onde eu já estive! Mas a vista valeu a pena."],"w":{"climbed":"subiu","took us":"levamos","top":"topo","terrible":"péssimo","view":"vista","worth it":"valeu a pena"}},{"id":"a2-16","frame":"Blog","framePt":"Blog","title":"Shopping online","titlePt":"Compras pela internet","body":["These days I buy almost everything online. It's [easy:c] {than} going to the mall, and the prices are often lower. But last week I bought a jacket, and in real life it was {the} [ugly:s] jacket I've {ever} seen! I sent it back the next day."],"pt":["Hoje em dia eu compro quase tudo pela internet. É mais fácil do que ir ao shopping, e os preços muitas vezes são mais baixos. Mas semana passada eu comprei uma jaqueta, e ao vivo ela era a jaqueta mais feia que eu já vi! Eu devolvi no dia seguinte."],"w":{"almost":"quase","everything":"tudo","mall":"shopping","often":"muitas vezes","jacket":"jaqueta","in real life":"ao vivo, na vida real","sent it back":"devolvi"}},{"id":"a2-17","frame":"Message","framePt":"Mensagem","title":"My new haircut","titlePt":"Meu corte novo","body":["Yesterday I went to the hairdresser and cut my hair. Now it's much [short:c] {than} before! My mom says I look [old:c] {than} my real age, but I love my new style. Next month I want to try a new color!"],"pt":["Ontem eu fui ao cabeleireiro e cortei o cabelo. Agora ele está muito mais curto do que antes! A minha mãe diz que eu pareço mais velho do que a minha idade real, mas eu adoro o meu novo estilo. No mês que vem eu quero experimentar uma cor nova!"],"w":{"hairdresser":"cabeleireiro","cut":"cortei","look":"parecer","age":"idade","style":"estilo","try":"experimentar"}},{"id":"a2-18","frame":"Postcard","framePt":"Cartão-postal","title":"Hello from Barcelona","titlePt":"Olá de Barcelona","body":["Hi Lucy! I'm in Barcelona with my parents. Yesterday we visited the Sagrada Família. It's {the} [unusual:s] building I've {ever} seen! Today we went to the beach, and the water was {the} [warm:s] of the whole trip.","Love, Carla"],"pt":["Oi, Lucy! Estou em Barcelona com os meus pais. Ontem nós visitamos a Sagrada Família. É o prédio mais diferente que eu já vi! Hoje nós fomos à praia, e a água estava a mais quente da viagem toda.","Beijos, Carla"],"w":{"visited":"visitamos","building":"prédio","seen":"visto","whole trip":"viagem toda"}},{"id":"a2-19","frame":"Blog","framePt":"Blog","title":"My grandfather","titlePt":"Meu avô","body":["My grandfather is 90, and he's {the} [old:s] person in our town. He walks every day, and he's [healthy:c] {than} many young people! His secret? He eats lots of vegetables and never gets stressed."],"pt":["O meu avô tem 90 anos, e ele é a pessoa mais velha da nossa cidade. Ele caminha todo dia, e é mais saudável do que muitos jovens! O segredo dele? Ele come muitos legumes e nunca fica estressado."],"w":{"walks":"caminha","young people":"jovens","secret":"segredo","vegetables":"legumes","gets stressed":"fica estressado"}},{"id":"a2-20","frame":"Blog","framePt":"Blog","title":"Driving lessons","titlePt":"Aulas de direção","body":["I'm learning to drive. My first lesson was terrible, but the second one was much [good:c] {than} the first. Driving in the city is [stressful:c] {than} driving on the highway, so I prefer quiet roads for now. My test is next month, and I'm a little nervous."],"pt":["Eu estou aprendendo a dirigir. A minha primeira aula foi péssima, mas a segunda foi muito melhor do que a primeira. Dirigir na cidade é mais
