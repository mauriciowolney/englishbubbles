/* ---------- Text markup (src/data/texts/*.json) ----------
   [tall:c] = a spot: the adjective tall, to be made comparative (c) or superlative (s) by the player; [tall:b] = one
   whose right form is the plain adjective (as tall as, too tall, tall enough: only at levels with "base": true).
   {than}   = a clue: words that decide comparative or superlative (lit up by the Clues hint, marked in explanations).
   parsed(t) reads a text once and keeps the result on it:
     lines  [{ raw, segs }] — segs: { k: "t" | "spot" | "clue", at, end, s, i (spot), c (clue) }
     spots  [{ adj, deg, line, at, sent [start, end) of its sentence, forms (the 4 or 5 cycle forms), ans (index of the
            right one), rule (rules.json key), clues (indexes of the clues in its sentence), note }]
     clues  [{ s, line, at }] */
const MARK = /\[([a-z]+):([csb])\]|\{([^}]+)\}/g;
// Sentence breaks: . ! ? … (maybe a closing quote), a space, then a capital, a digit or an opening mark. Not after Mr. Ms. Dr.
const SENT_END = /(?<!\b(?:Mr|Mrs|Ms|Dr|St)\.)(?<=[.!?…]["”]?)\s+(?=["“{\[]?[A-Z0-9])/g;
function sentRanges(raw) {
  const out = []; let a = 0, m;
  SENT_END.lastIndex = 0;
  while ((m = SENT_END.exec(raw))) { out.push([a, m.index]); a = m.index + m[0].length; }
  out.push([a, raw.length]);
  return out;
}
const bodyOf = t => [].concat(t.body);
function parsed(t) {
  if (t._p) return t._p;
  const P = { lines: [], spots: [], clues: [] }, base = !!(DATA.levels[t.id.split("-")[0].toUpperCase()] || {}).base;
  bodyOf(t).forEach((raw, li) => {
    const segs = [], sents = sentRanges(raw);
    let last = 0, m;
    MARK.lastIndex = 0;
    while ((m = MARK.exec(raw))) {
      if (m.index > last) segs.push({ k: "t", at: last, end: m.index, s: raw.slice(last, m.index) });
      const g = { at: m.index, end: MARK.lastIndex };
      if (m[1]) {
        g.k = "spot"; g.i = P.spots.length;
        P.spots.push(Object.assign(spotInfo(m[1], m[2], base), { line: li, at: m.index, sent: sents.find(r => m.index >= r[0] && m.index < r[1]), note: (t.notes || [])[g.i] || null }));
      } else {
        g.k = "clue"; g.c = P.clues.length; g.s = m[3];
        P.clues.push({ s: m[3], line: li, at: m.index });
      }
      segs.push(g); last = MARK.lastIndex;
    }
    if (last < raw.length) segs.push({ k: "t", at: last, end: raw.length, s: raw.slice(last) });
    P.lines.push({ raw, segs });
  });
  // A spot's clues are the clue words in its own sentence.
  P.spots.forEach(sp => { sp.clues = P.clues.map((c, k) => c.line === sp.line && c.at >= sp.sent[0] && c.at < sp.sent[1] ? k : -1).filter(k => k >= 0); });
  return (t._p = P);
}
// Walk part [a, b) of line li: f.t(text), f.spot(i), f.clue(c, s) give the pieces, joined.
function walk(P, li, a, b, f) {
  return P.lines[li].segs.map(g => {
    if (g.end <= a || g.at >= b) return "";
    if (g.k === "t") return f.t(g.s.slice(Math.max(a, g.at) - g.at, Math.min(b, g.end) - g.at));
    return g.k === "spot" ? f.spot(g.i) : f.clue(g.c, g.s);
  }).join("");
}
// The form a spot shows: the player's choice st (0–3) when given, else the right one.
function formOf(sp, st) { return sp.forms[st === undefined || st < 0 ? sp.ans : st]; }
// Plain text of a line (or part of it), spots in their right form (or as chosen in st[]).
function linePlain(P, li, a = 0, b = Infinity, st) { return walk(P, li, a, b, { t: s => s, spot: i => formOf(P.spots[i], st && st[i]), clue: (c, s) => s }).trim(); }
function sentPlain(P, i, st) { const sp = P.spots[i]; return linePlain(P, sp.line, sp.sent[0], sp.sent[1], st); }
// Spot i's sentence as HTML: that spot as html(i), other spots in their right form, its own clues marked when mark is true.
function sentHTML(P, i, html, mark) {
  const sp = P.spots[i];
  return walk(P, sp.line, sp.sent[0], sp.sent[1], {
    t: s => esc(s),
    spot: j => j === i ? html(j) : esc(formOf(P.spots[j])),
    clue: (c, s) => mark && sp.clues.includes(c) ? "<mark>" + esc(s) + "</mark>" : esc(s)
  }).trim();
}

   where they don't exist (expensiver): the player must see that they are wrong. Irregular ones come from
   adjectives.json "er" / "est" (good → better / best). The validator in build.py uses the same rules. */
const CYCLE = ["more", "er", "most", "est", "base"];
const CYCLE_TONES = [523.25, 587.33, 659.25, 783.99, 880];
const adjInfo = a => DATA.adjectives[a] || { syl: 1 };
const CVC = /[^aeiou][aeiou][^aeiouwxy]$/;
// rules.json key for adjective a: irr, spec, long, e, y, double or short. spec = forced more / most ("long": true in
// adjectives.json, i.e. fun): a short word that still takes more / most.
function ruleOf(a) {
  const A = adjInfo(a);
  if (A.er) return "irr";
  if (A.long) return "spec";
  if (A.syl >= 3 || (A.syl === 2 && !/[^aeiou]y$/.test(a))) return "long";
  if (/e$/.test(a)) return "e";
  if (/[^aeiou]y$/.test(a)) return "y";
  return A.syl === 1 && CVC.test(a) ? "double" : "short";
}
// a + "er" / "est", spelled as a short adjective would be.
function suffixed(a, suf) {
  if (/e$/.test(a)) return a + suf.slice(1);
  if (/[^aeiou]y$/.test(a)) return a.slice(0, -1) + "i" + suf;
  if (adjInfo(a).syl === 1 && CVC.test(a)) return a + a.slice(-1) + suf;
  return a + suf;
}
function cycleForms(a) { const A = adjInfo(a); return ["more " + a, A.er || suffixed(a, "er"), "most " + a, A.est || suffixed(a, "est")]; }
// Index (in CYCLE) of the right form for adjective a in degree deg ("c" / "s" / "b").
// Rules whose comparative / superlative is more / most.
const moreRule = r => r === "long" || r === "spec";
function answerIdx(a, deg) { return deg === "b" ? 4 : (deg === "s" ? 2 : 0) + (moreRule(ruleOf(a)) ? 0 : 1); }
// base = the level has the fifth step (the plain adjective). A "b" spot's rule is "base" (rules.json), whatever its spelling.
function spotInfo(adj, deg, base) {
  return { adj, deg, forms: cycleForms(adj).concat(base ? [adj] : []), ans: answerIdx(adj, deg), rule: deg === "b" ? "base" : ruleOf(adj) };
}
// The degree a cycle index stands for.
const degOf = st => st === 4 ? "b" : st >= 2 ? "s" : "c";
// "tall → taller → the tallest" (the Guide and explanations).
function chainText(a) { const f = cycleForms(a), lng = moreRule(ruleOf(a)); return a + " → " + (lng ? f[0] : f[1]) + " → the " + (lng ? f[2] : f[3]); }

/* ---------- Words for the explanations ---------- */
// Why choice st is wrong for spot sp (rules.json "wrong"), in English or Portuguese; "" when it is right or untouched.
function wrongWhy(sp, st, pt) {
  if (st < 0 || st === sp.ans) return "";
  const W = DATA.rules.wrong, f = sp.forms, L = pt ? "pt" : "en";
  if (degOf(st) !== sp.deg) return W["deg-" + sp.deg][L];
  const fill = s => s.split("{adj}").join(sp.adj).split("{x}").join(f[st]).split("{er}").join(f[1]).split("{est}").join(f[3]);
  if (sp.rule === "irr") return fill(W.irr[L]);
  return fill(W[sp.rule === "spec" ? "er-spec" : sp.rule === "long" ? "er-long" : sp.rule === "y" ? "more-y" : "more-short"][L]);
}
// Why a right answer is right: wrongWhy for the tempting form of the same degree (popular → "popularest" doesn't exist,
// tall → not more / most; a "b" spot → why no -er); double / -e have their own line (rules.json wrong.ok-…: big → biggest).
function rightWhy(sp, pt) {
  if (sp.rule === "double" || sp.rule === "e")
    return DATA.rules.wrong["ok-" + sp.rule][pt ? "pt" : "en"].split("{adj}").join(sp.adj).split("{x}").join(sp.forms[sp.ans]);
  return wrongWhy(sp, sp.deg === "b" ? 1 : sp.ans ^ 1, pt);
}
// The rule line for spot sp: "tall: 1 syllable: add -er / -est. → taller".
function ruleLine(sp, pt) { const R = DATA.rules.rules[sp.rule]; return pt ? R.rulePt : R.rule; }
const ruleName = (k, pt) => { const R = DATA.rules.rules[k]; return pt ? R.namePt : R.name; };
const degName = (d, pt) => { const D = DATA.rules.degrees[d]; return pt ? D.namePt : D.name; };

/* 07-back.js — copied from Perfect or Past? (../present perfect practice): the phone's back gesture (or the browser's
   Back) closes the open window instead of leaving the page: the Guide, Favorites / Seen, the end card, the tutorial,
   the Play menu and the header pop-ups (colours, volume); in Quick-fire, Review missed and Favorites games it goes back
   to a normal game. Each window holds a history entry while it is open. A MutationObserver sees it open and close, whatever
   closed it (✕, Escape, a click outside, a button), so the entry is added and taken back in one place. Back closes the
   window opened last. A new window needs one backLayer(el, isOpen, close) call. */
// Our history entries must not bring back an old scroll position: closing the Guide scrolls to the explanation it was
// opened from, and the browser would undo that.
try { history.scrollRestoration = "manual"; } catch (e) {}
const BACK = [];     // open windows, oldest first: { el, close, pushed }
let backSkip = 0;    // our own history.back() calls, whose popstate is not a Back press
// A window that opens while one of those history.back() calls is still on its way (the Play menu closes and quick-fire
// starts in the same click) waits for it: the browser aims history.back() when it is called, so an entry pushed in
// between would be swept away with it, and the next Back would leave the page. Pushed once the popstate arrives.
const pendingPush = [];
function pushEntry(L) { try { history.pushState({ layer: 1 }, ""); L.pushed = true; } catch (e) { L.pushed = false; } }   // a file:// page may refuse
// el: the window's element; isOpen(): whether it shows; close(): what Back does (the same as its ✕ or Escape).
function backLayer(el, isOpen, close) {
  const L = { el, close, pushed: false, byBack: false };
  let was = isOpen();
  new MutationObserver(() => {
    const now = isOpen(); if (now === was) return; was = now;
    if (now) {
      if (backSkip) pendingPush.push(L); else pushEntry(L);
      BACK.push(L);
    } else {
      const i = BACK.indexOf(L); if (i >= 0) BACK.splice(i, 1);
      const p = pendingPush.indexOf(L); if (p >= 0) pendingPush.splice(p, 1);   // closed before its entry was even added
      // Closed by the game, not by Back: take its history entry away, so the next Back isn't a dead press.
      if (L.pushed && !L.byBack) { backSkip++; history.back(); }
      L.pushed = false;
    }
  }).observe(el, { attributes: true, attributeFilter: ["class", "hidden"] });
}
window.addEventListener("popstate", () => {
  if (backSkip) { backSkip--; if (!backSkip) pendingPush.splice(0).forEach(pushEntry); return; }
  const L = BACK[BACK.length - 1]; if (!L) return;
  L.byBack = true; L.close(); setTimeout(() => { L.byBack = false; }, 0);   // the observer has run by then
});
// Header pop-ups (01-theme.js, 02-sound.js; from Conditional Bubbles): the back gesture closes them too.
backLayer(swwrap, () => swwrap.classList.contains("open"), () => swOpen(false));
backLayer(volwrap, () => volwrap.classList.contains("open"), () => volwrap.classList.remove("open"));

/* 08-sky.js — the bubbles drifting up behind everything (from Be Do Modal, Nov 2026, itself from English Bubbles): 7
   see-through, softly blurred bubbles of random size (40-140 px), place and pace (95-145 s a climb). At page load they
   are already part-way up, spread over the screen, and the layer fades in (.sky.in). Only transform / opacity move;
   they pause while a bonus word is carried (body.carrying, 12-squash.js) or the result card opens (body.calm, 17-shine.js), and are left out with reduced motion. Look:
   15-sky.css. */
(function () {
  var host = $("sky");
  if (!host || reduceMotion) return;
  var hues = [215, 330, 150, 265, 30, 190];
  for (var k = 0; k < 7; k++) {
    var s = document.createElement("span"), size = 40 + Math.round(Math.random() * 100), t = 95 + Math.round(Math.random() * 50);
    // a negative delay starts the climb part-way: spread from 15% to 80% of the way up, bubble by bubble
    var at = (0.15 + 0.65 * (k + Math.random() * 0.8) / 7) * t;
    s.style.cssText = "width:" + size + "px;height:" + size + "px;left:" + Math.round(Math.random() * 96) + "%;" +
      "--h:" + hues[k % hues.length] + ";--t:" + t + "s;--d:-" + at.toFixed(1) + "s;" +
      "--x:" + Math.round(Math.random() * 80 - 40) + "px";
    host.appendChild(s);
  }
  setTimeout(function () { host.classList.add("in"); }, 60);   // a timer, not animation frames: a page opened in the background gets none until shown
})();

/* 10-game.js — the game. One game = a level's texts (levels.json "rounds" of them), one text per round, then (normal
   games only) a bonus round (11-bonus.js).
   Every text has two adjectives in grey bubbles ("spots"). Each tap moves a spot one step round its cycle
   (more + adj → adj-er → most + adj → adj-est, see 04-forms.js); the player stops on the right form and presses Check.
   Scoring per spot: right on the first check = 2 points, right on a later check = 1, never = 0.
   A wrong check costs a try (levels.json "tries"). Levels with "feedback": "spots" mark the wrong spots and lock the
   right ones; "count" only says how many are wrong. After the last try the answers are shown.
   Hints ("Clues") light up the words that decide (than, the…): a pool for the whole game (levels.json "hints"), one per
   text, and each unused hint is +1 bonus point at the end. */
const PTS_FIRST = 2, PTS_LATER = 1;
// Rules come from the level of the text being played (practice games can mix levels).
const lvl = () => DATA.levels[(G.r && G.r.level) || G.level] || {};
const levelOf = t => t.id.split("-")[0].toUpperCase();
const maxTries = () => lvl().tries || 2;
const hintPool = () => (DATA.levels[G.level] || {}).hints || 2;
const TEXTS = {};
Object.keys(DATA.texts).forEach(l => DATA.texts[l].forEach(t => { TEXTS[t.id] = t; }));
const G = { level: "A1", mode: "normal", pool: [], total: 3, idx: 0, score: 0, results: [], streak: 0, hintsLeft: 0, r: null, b: null, bonus: null, phase: "idle" };
const stage = $("stage"), card = $("card"), revealEl = $("reveal"), hintEl = $("hint"), toolsEl = $("tools"), quizEl = $("quiz");
const scoreEl = $("score"), scEl = $("sc"), bestEl = $("bestlbl"), hintBtn = $("hintbtn"), resetBtn = $("resetbtn"), checkBtn = $("checkbtn"), triesEl = $("tries");

/* ---------- Game flow ---------- */
// mode: "normal" | "speed" | "review" | "fav" (see 22-modes.js); ids = the texts for a review / favorites game.
function newGame(level, mode = "normal", ids) {
  G.level = level; G.mode = mode; applyUi();
  document.body.classList.toggle("practice-mode", mode !== "normal");   // quick-fire / review / favorites: Back returns to a normal game (22-modes.js)
  G.pool = ids ? shuffle(ids.map(id => TEXTS[id]).filter(Boolean)) : orderPool(DATA.texts[level], DATA.levels[level].rounds || 3);
  G.total = mode === "speed" ? Infinity : Math.min(DATA.levels[level].rounds || 3, G.pool.length);
  G.idx = 0; G.score = 0; G.results = []; G.streak = 0; G.hintsLeft = hintPool(); G.r = null; G.b = null; G.bonus = null;
  G.bonuses = [];
  G.bq = mode === "normal" ? orderPool(DATA.bonus[level] || [], 1).slice(0, 1) :
    mode === "fav" ? orderPool(favIds().map(id => BONUS[id]).filter(Boolean)).slice(0, 3) : [];
  stopSpeed(); stopSpeech(); quizEl.hidden = true; revealEl.hidden = true; stage.hidden = toolsEl.hidden = false;
  toolsEl.classList.remove("bonus"); card.classList.remove("bonuscard");
  showScore(); showCombo();
  if (mode === "speed") return speedIntro();   // goal card and 3-2-1 first; it starts the clock
  if (!G.pool.length && G.bq.length) return startBonus();   // a Favorites game with only bonus sentences
  startRound();
}
function startRound() {
  const t = G.pool[G.idx % G.pool.length], P = parsed(t);
  G.r = { t, P, level: levelOf(t), st: P.spots.map(() => -1), lock: P.spots.map(() => false), first: null, tries: 0, hinted: false };
  G.b = null; G.phase = "play";
  revealEl.hidden = true; revealEl.innerHTML = "";
  toolsEl.classList.remove("bonus"); toolsEl.hidden = false;
  hideGloss(); renderCard(); renderTools(); updateProgress();
  hintEl.innerHTML = tx(G.idx === 0 ? (lvl().base ? "introBase" : "intro") : "introShort");
  stage.classList.remove("out"); if (!reduceMotion) flash(stage, "rise");
}
// After the last text: the bonus round(s) (normal and Favorites games), else the end screen.
function nextRound() {
  if (G.phase !== "done") return;
  G.phase = "idle"; stopSpeech();
  const wasBonus = !!G.b;
  if (!wasBonus) G.idx++;
  const toBonus = (wasBonus || G.idx >= G.total) && bonusDue();
  if (!toBonus && (wasBonus || G.idx >= G.total)) { updateProgress(); showEnd(); return; }
  stage.classList.add("out"); revealEl.classList.add("out");
  setTimeout(() => {
    revealEl.classList.remove("out");
    if (toBonus) startBonus(); else startRound();
    scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
  }, reduceMotion ? 0 : 260);
}

/* ---------- Rendering ---------- */
// The text card: a tag (the text's frame: Email, Blog…), the title, then one block per paragraph.
function renderCard() {
  const r = G.r, t = r.t, P = r.P;
  card.className = "card";
  card.innerHTML = '<span class="tag">' + esc(frameName(t)) + '</span><button type="button" class="cardsay" aria-label="' + esc(tx("listenText")) + '" title="' + esc(tx("listenText")) + '">' + ICON_SPK + '</button><h2 class="ttl">' + esc(t.title) + "</h2>" +
    '<div class="lines">' + P.lines.map((L, li) => '<div class="ln" data-l="' + li + '"><p class="say">' + lineHTML(t, P, li) + "</p></div>").join("") + "</div>";
  r.spotEls = [...card.querySelectorAll(".adj")];
}
// The card's tag: the text's "frame" ("framePt" at native-UI levels).
function frameName(t) { return (nativeUi() && t.framePt) || t.frame || "Text"; }
// One dot per step of the cycle (4, or 5 with the plain adjective).
const dots = sp => '<span class="dots" aria-hidden="true">' + "<i></i>".repeat(sp.forms.length) + "</span>";
// The word, stacked over invisible copies of every form: a bubble is as wide as its longest form from the start,
// so tapping never moves the text around it.
function spotWord(sp) {
  return '<span class="awrap"><span class="aw">' + esc(sp.adj) + "</span>" + [sp.adj].concat(sp.forms).map(f => '<span class="sz" aria-hidden="true">' + esc(f) + "</span>").join("") + "</span>";
}
// A soap bubble's own film angle and turn (SOAP: 17-shine.js), so the bubbles don't turn in step.
const soapVars = () => 'style="--ang:' + Math.round(rnd(0, 360)) + "deg;--dl:" + (-rnd(0, 10)).toFixed(2) + 's"';
function spotHTML(sp, i) {
  return '<button type="button" class="adj" data-i="' + i + '" data-g="' + esc(sp.adj) + '" aria-label="' + esc(sp.adj) + '" ' + soapVars() + ">" + SOAP + spotWord(sp) + dots(sp) + "</button>";
}
function lineHTML(t, P, li) {
  return walk(P, li, 0, Infinity, {
    t: s => glossWrap(s, t),
    clue: (c, s) => '<span class="clue" data-c="' + c + '">' + glossWrap(s, t) + "</span>",
    spot: i => spotHTML(P.spots[i], i)
  });
}
// Show spot i in state st: grey (st < 0) or one of its four forms; the dot under it shows where in the cycle it is.
function paintSpot(el, sp, st) {
  el.querySelector(".aw").textContent = st < 0 ? sp.adj : sp.forms[st];
  el.classList.toggle("set", st >= 0);
  el.classList.toggle("deg-c", st >= 0 && st < 2); el.classList.toggle("deg-s", st === 2 || st === 3); el.classList.toggle("deg-b", st === 4);
  [].forEach.call(el.querySelectorAll(".dots i"), (d, k) => d.classList.toggle("on", k === st));
}
function renderTools() {
  const r = G.r, play = G.phase === "play";
  triesEl.innerHTML = Array.from({ length: maxTries() }, (_, i) => '<i class="' + (r && i < r.tries ? "used" : "") + '"></i>').join("");
  triesEl.title = (maxTries() - (r ? r.tries : 0)) + " tries left";
  hintBtn.disabled = !play || !G.hintsLeft || !r || r.hinted;
  resetBtn.disabled = !play || !r || !r.st.some((s, i) => s >= 0 && !r.lock[i]);
  checkBtn.disabled = !play;
  checkBtn.classList.toggle("pulse", play && !!r && r.st.every(s => s >= 0));
  $("hintleft").textContent = tx("left", { n: G.hintsLeft });
}
function updateProgress() {
  showDays();
  if (G.mode === "speed") return speedRender();
  if (G.b) { $("proglbl").textContent = tx("bonusOf"); $("pfill").style.width = "100%"; return; }
  const n = Math.min(G.idx + 1, G.total), done = G.idx + (G.phase === "done" ? 1 : 0);
  $("proglbl").textContent = tx({ review: "reviewOf", fav: "favOf" }[G.mode] || "textOf", { n, total: G.total });
  $("pfill").style.width = (Math.min(done, G.total) / G.total * 100) + "%";
}
// Best scores are kept for normal games and quick-fire; practice games don't save one ("" = none).
const BEST = { normal: "cmp-best-", speed: "cmp-speed-" };
function bestKey() { return BEST[G.mode] ? BEST[G.mode] + G.level : ""; }
function showScore() {
  scEl.textContent = G.score;
  bestEl.textContent = bestKey() ? "best " + (parseInt(load(bestKey()), 10) || 0) : "practice";
}
// "×3" on the score tile while perfect texts keep coming.
function showCombo() { const c = $("combo"); c.hidden = G.streak < 2; c.textContent = "×" + G.streak; if (G.streak >= 2) flash(c, "tick"); }

/* ---------- Playing ---------- */
// One step round the cycle (dir -1 = back: Shift + tap, right click, Shift + number key).
function cycleSpot(i, dir = 1) {
  const r = G.r; if (G.phase !== "play" || !r.spotEls[i] || r.lock[i]) return;
  const n = r.P.spots[i].forms.length, s = r.st[i], st = r.st[i] = s < 0 ? (dir > 0 ? 0 : n - 1) : (s + dir + n) % n, el = r.spotEls[i];
  paintSpot(el, r.P.spots[i], st);
  el.classList.remove("err", "nudge");
  if (!reduceMotion) flash(el, "pop");
  tone(CYCLE_TONES[st], 0, .12, .07, 0, true);
  renderTools();
}
function resetAll() {
  const r = G.r; if (G.phase !== "play") return;
  r.st = r.st.map((s, i) => r.lock[i] ? s : -1);
  r.spotEls.forEach((el, i) => { if (!r.lock[i]) { paintSpot(el, r.P.spots[i], -1); el.classList.remove("err"); } });
  sndBack(); renderTools();
}
function check() {
  const r = G.r; if (G.phase !== "play") return;
  // A grey adjective is never right: ask for a tap first (no try is spent).
  const grey = r.st.map((s, i) => s < 0 ? i : -1).filter(i => i >= 0);
  if (grey.length) {
    grey.forEach(i => flash(r.spotEls[i], "nudge")); sndBack();
    hintEl.innerHTML = tx(grey.length === r.st.length && grey.length > 1 ? "untouchedN" : "untouched1");
    return;
  }
  const wrong = r.P.spots.map((sp, i) => r.st[i] !== sp.ans ? i : -1).filter(i => i >= 0);
  r.tries++;
  if (!r.first) { r.first = r.P.spots.map((sp, i) => r.st[i] === sp.ans); r.firstSt = r.st.slice(); }
  if (!wrong.length) return finish(true);
  G.streak = 0; showCombo(); sndBad(); flash(card, "shake");
  if (r.tries >= maxTries()) {
    G.phase = "checking"; renderTools(); hintEl.innerHTML = tx("outOfTries");
    setTimeout(() => { if (G.r === r) finish(false); }, reduceMotion ? 0 : 700);
    return;
  }
  const marks = lvl().feedback === "spots", left = maxTries() - r.tries;
  // The "how many are wrong" part pulses a few times so the player notices it (.alert in 10-game.css).
  let msg = '<span class="alert">' + tx(wrong.length === 1 ? "wrong1" : "wrongN", { n: wrong.length }) + "</span>";
  if (marks) {
    // Wrong spots go red; right ones lock green. A hint says what kind of mistake the first wrong one is.
    r.P.spots.forEach((sp, i) => {
      if (wrong.includes(i)) { r.spotEls[i].classList.add("err"); return; }
      r.lock[i] = true; r.spotEls[i].classList.add("lock"); r.spotEls[i].tabIndex = -1;
    });
    r.wrong = wrong.length < r.st.length ? wrong : null;   // Clues after this check light only these spots' clues (useHint)
    const w = r.P.spots[wrong[0]];
    msg += " " + tx(wrong.length === 1 && wrong.length < r.st.length ? "wrongMarked" : "wrongMarkedN") + " " + tx(degOf(r.st[wrong[0]]) !== w.deg ? (lvl().base ? "askDegB" : "askDeg") : "askForm");
  }
  hintEl.innerHTML = msg + " " + tx(left === 1 ? "tryLeft" : "triesLeft", { n: left });
  scrollToHint(); renderTools();
}
// Bring the hint line (above the text) just under the sticky dock when it is off screen: after a wrong check the
// player is down at the Check button and would miss the message (from Present Perfect).
function scrollToHint() {
  const dock = document.querySelector(".dock"), top = (dock ? dock.getBoundingClientRect().bottom : 0) + 12, b = hintEl.getBoundingClientRect();
  if (b.top >= top && b.bottom <= innerHeight) return;
  scrollTo({ top: scrollY + b.top - top, behavior: reduceMotion ? "auto" : "smooth" });
}
// End of a text: every spot shows its right form (green, or red when the choice was wrong), the score, then the explanations.
function finish(allRight) {
  const r = G.r, P = r.P, n = P.spots.length, t = r.t;
  const ok = P.spots.map((sp, i) => r.st[i] === sp.ans), k = ok.filter(Boolean).length;
  const pts = P.spots.reduce((s, sp, i) => s + (r.first[i] ? PTS_FIRST : ok[i] ? PTS_LATER : 0), 0);
  const perfect = allRight && r.tries === 1;
  Object.assign(r, { ok, pts, perfect });
  G.phase = "done"; G.score += pts; G.streak = perfect ? G.streak + 1 : 0;
  P.spots.forEach((sp, i) => {
    const el = r.spotEls[i];
    paintSpot(el, sp, sp.ans);
    el.classList.remove("err", "lock"); el.classList.add(ok[i] ? "ok" : "bad");
    el.insertAdjacentHTML("beforeend", '<sup class="sn">' + (i + 1) + "</sup>");
    // The bubble keeps its size: the number floats on its corner, and a wrong choice is only in the tooltip and the explanation.
    el.title = (ok[i] ? "✓ " : "✗ " + sp.forms[r.st[i]] + " → ") + formOf(sp);
  });
  card.classList.add("done");
  showScore(); showCombo(); if (pts) flash(scoreEl, "up");
  if (allRight) { sndOk(G.streak > 1 ? Math.min(G.streak - 1, 6) * 2 : 0); burst(card); }
  const msg = perfect ? (G.streak >= 3 ? tx("streak", { n: G.streak }) : tx("perfect")) : tx(allRight ? "nice" : k ? "gotIt" : "done");
  toast("+" + pts + " · " + msg, allRight ? "" : "zero");
  const status = perfect ? 2 : allRight ? 1 : 0;
  markSeen(t.id, status); recordProgress(t.id, status); recordUses(P.spots.map(sp => sp.rule), r.first); tickDay();
  G.results.push({ t, pts, max: n * PTS_FIRST, perfect, allRight, k, n, ok, first: r.first.slice(), firstSt: r.firstSt.slice(), st: r.st.slice(), hinted: r.hinted });
  renderTools(); updateProgress();
  toolsEl.hidden = true;   // tries, Clues, Reset and Check are done with once the text is checked
  hintEl.innerHTML = tx("doneNote");
  setTimeout(() => { if (G.r === r && !G.b) showReveal(); }, reduceMotion ? 0 : 450);
}

/* ---------- Hint & reset ---------- */
// Clues: light up the words that decide (one hint per text, from the game's pool).
function useHint() {
  const r = G.r; if (G.phase !== "play" || !G.hintsLeft || r.hinted) return;
  r.hinted = true; G.hintsLeft--; sndHint();
  // After a check that marked some adjectives green (A1 / A2), only the red ones' clues (from the a / an / the game);
  // else all of them (B1+ feedback only counts mistakes).
  const only = r.wrong ? [...new Set(r.wrong.flatMap(i => r.P.spots[i].clues))] : [];
  if (only.length) only.forEach(c => { const el = card.querySelector('.clue[data-c="' + c + '"]'); if (el) el.classList.add("lit"); });
  else card.classList.add("clues");
  hintEl.innerHTML = tx(only.length ? "cluesWrong" : "cluesOn") + " " + (G.hintsLeft ? tx("hintsLeftGame", { n: G.hintsLeft }) : tx("hintLast"));
  renderTools(); flash($("hintleft"), "tick");
}
hintBtn.addEventListener("click", useHint);
resetBtn.addEventListener("click", () => G.b ? bonusClear() : resetAll());
checkBtn.addEventListener("click", check);

/* ---------- Taps and keys ---------- */
// In play a tap moves a spot round its cycle (Shift + tap or right click: back); once the text is done a tap jumps
// to its explanation.
card.addEventListener("click", e => {
  const say = e.target.closest(".cardsay");
  // The speaker shows only once the text is checked (11-text.css): it reads the text with the right forms.
  if (say) { if (say.classList.contains("speaking")) stopSpeech(); else if (G.phase === "done") speak(textParts(G.r.P), say); return; }
  const a = e.target.closest(".adj"); if (!a || G.b) return;
  if (G.phase === "play") return cycleSpot(+a.dataset.i, e.shiftKey ? -1 : 1);
  if (G.phase === "done") jumpToEx(+a.dataset.i);
});
card.addEventListener("contextmenu", e => { const a = e.target.closest(".adj"); if (a && G.phase === "play" && !G.b) { e.preventDefault(); cycleSpot(+a.dataset.i, -1); } });
// Keys: 1–9 move the spots (Shift: back), Enter checks (or goes on once the explanations are open).
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || document.querySelector(".favmodal.show") || !$("tour").hidden) return;
  if (e.target.closest && e.target.closest("input, textarea, select")) return;
  const d = /^Digit([1-9])$/.exec(e.code);
  if (G.phase === "play" && !G.b && d && G.r.spotEls[+d[1] - 1]) { e.preventDefault(); cycleSpot(+d[1] - 1, e.shiftKey ? -1 : 1); return; }
  if (e.key !== "Enter" || (e.target.closest && e.target.closest("button, a"))) return;
  if (G.phase === "play" && !G.b) { e.preventDefault(); check(); }
  else if (G.phase === "done" && !revealEl.hidden) { e.preventDefault(); nextRound(); }
});

/* 11-bonus.js — the bonus round at the end of a normal game: a Portuguese sentence, its English version with up to 4
   gaps, and word bubbles (the missing words + distractors, src/data/bonus/<LEVEL>.json) to drag or tap into the gaps.
   When every gap is full it is checked: right on the first try = BONUS_FIRST points, on the second = BONUS_LATER.
   A wrong try locks the right words green and sends the others home; after BONUS_TRIES the sentence is shown.
   Moving words (FLIP animation, tap, drag & drop with a magnet) comes from the conditionals game (11-moves.js). */
const BONUS_TRIES = 2, BONUS_FIRST = 3, BONUS_LATER = 1;
const WORD_HUES = [205, 330, 265, 150, 25, 175];
// Every bonus sentence by id (they can be favorites, like texts).
const BONUS = {};
Object.keys(DATA.bonus).forEach(l => DATA.bonus[l].forEach(s => { BONUS[s.id] = s; }));
// G.bq = the bonus sentences still to play in this game (newGame: one in a normal game, up to 3 favorites in a
// Favorites game); G.bonuses = their results.
function bonusDue() { return (G.bq || []).length > 0; }
function startBonus() {
  const s = G.bq.shift(), parts = s.en.split(/\[([^\]]+)\]/);
  // parts alternate: text, gap word, text, gap word…
  const ans = parts.filter((_, k) => k % 2);
  G.r = null; G.phase = "bonus";
  G.b = { s, parts, ans, slots: ans.map(() => null), slotEls: [], words: [], tries: 0, ansBox: null };
  revealEl.hidden = true; revealEl.innerHTML = "";
  toolsEl.classList.add("bonus"); toolsEl.hidden = false;
  hideGloss(); renderBonus(); bonusTools(); updateProgress();
  hintEl.innerHTML = tx("bonusIntro");
  stage.classList.remove("out"); if (!reduceMotion) flash(stage, "rise");
  sndShuffle();
}
function renderBonus() {
  const b = G.b;
  card.className = "card bonuscard";
  card.innerHTML = '<span class="tag">★ ' + esc(tx("bonusTag")) + "</span>" +
    '<p class="bn-pt">' + ptBadge() + ' <span lang="pt">' + esc(b.s.pt) + "</span></p>" +
    '<p class="bn-en" lang="en">' + b.parts.map((p, k) => k % 2 ? '<span class="slot" data-i="' + ((k - 1) / 2) + '"></span>' : esc(p)).join("") + "</p>" +
    '<div class="bn-cloud"></div>';
  b.ansBox = card.querySelector(".bn-en");
  b.slotEls = [...card.querySelectorAll(".slot")];
  const cloud = card.querySelector(".bn-cloud");
  b.words = shuffle(b.ans.concat(b.s.dx)).map((t, n) => {
    const home = document.createElement("span"), el = document.createElement("button");
    home.className = "home"; home.style.setProperty("--d", (n * .05) + "s");
    el.type = "button"; el.className = "b w"; el.innerHTML = SOAP + '<span class="wl">' + esc(t) + "</span>";   // SOAP: 17-shine.js
    el.style.setProperty("--h", WORD_HUES[n % WORD_HUES.length]);
    el.style.setProperty("--dur", rnd(3.2, 4.8).toFixed(2) + "s"); el.style.setProperty("--dl", (-rnd(0, 3)).toFixed(2) + "s");
    el.style.setProperty("--ang", Math.round(rnd(0, 360)) + "deg");   // the soap film's starting angle (where it stays on touch screens)
    home.appendChild(el); cloud.appendChild(home);
    const W = { el, home, t, slot: -1, locked: false }; el.__w = W; return W;
  });
}
function bonusTools() {
  const b = G.b;
  triesEl.innerHTML = Array.from({ length: BONUS_TRIES }, (_, i) => '<i class="' + (i < b.tries ? "used" : "") + '"></i>').join("");
  resetBtn.disabled = G.phase !== "bonus" || !b.slots.some(W => W && !W.locked);
}

/* ---------- Moving words (with FLIP animation) ---------- */
// Run mutate(), then animate every word from where it was to where it is now.
function flipAll(mutate) {
  const ws = G.b.words, before = ws.map(W => W.el.getBoundingClientRect());
  mutate();
  if (reduceMotion) return;
  ws.forEach((W, n) => {
    const a = before[n], c = W.el.getBoundingClientRect(), dx = a.left - c.left, dy = a.top - c.top;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
    W.el.animate([{ transform: "translate(" + dx + "px," + dy + "px)" }, { transform: "none" }], { duration: 420, easing: "cubic-bezier(.3,1.25,.55,1)" });
  });
}
function setSlot(i, W) {
  G.b.slots[i] = W;
  if (W) { W.slot = i; G.b.slotEls[i].appendChild(W.el); }
  G.b.slotEls[i].classList.toggle("filled", !!W);
}
function leaveHome(W) { W.home.style.width = W.el.offsetWidth + "px"; W.home.style.height = W.el.offsetHeight + "px"; W.home.classList.add("away"); }
function toHome(W) { W.slot = -1; W.home.appendChild(W.el); W.home.style.width = W.home.style.height = ""; W.home.classList.remove("away"); }
// Put word W into slot i (i < 0 = back home). An unlocked word already in slot i swaps places with W.
function moveRaw(W, i) {
  const b = G.b, from = W.slot;
  if (i < 0) { if (from >= 0) { setSlot(from, null); toHome(W); } return; }
  const occ = b.slots[i];
  if (occ === W || (occ && occ.locked)) return;
  if (from < 0) leaveHome(W); else setSlot(from, null);
  if (occ) { if (from >= 0) setSlot(from, occ); else toHome(occ); }
  setSlot(i, W);
}
function move(W, i) {
  if (W.locked) return;
  const wasHome = W.slot < 0;
  flipAll(() => moveRaw(W, i));
  if (i < 0) sndBack(); else sndPlace();
  if (wasHome || i >= 0) afterMove();
}
function tapWord(W) {
  if (G.phase !== "bonus" || W.locked) return;
  if (W.slot >= 0) move(W, -1);
  else { const i = G.b.slots.findIndex(x => !x); if (i >= 0) move(W, i); }
}
function afterMove() {
  bonusTools();
  if (G.phase === "bonus" && G.b.slots.every(Boolean)) { G.phase = "bchecking"; setTimeout(bonusCheck, reduceMotion ? 50 : 380); }
}
function bonusClear() {
  const b = G.b; if (G.phase !== "bonus" || !b.slots.some(W => W && !W.locked)) return;
  flipAll(() => b.slots.forEach((W, i) => { if (W && !W.locked) { setSlot(i, null); toHome(W); } }));
  sndBack(); bonusTools();
}

/* ---------- Checking ---------- */
function bonusCheck() {
  const b = G.b, got = b.slots.map(W => W.t.toLowerCase()), want = b.ans.map(t => t.toLowerCase());
  if (got.every((t, i) => t === want[i])) {
    b.slots.forEach(W => { W.el.classList.add("ok"); W.locked = true; });
    return bonusFinish(b.tries === 0 ? BONUS_FIRST : BONUS_LATER, true);
  }
  b.tries++; sndBad(); flash(b.ansBox, "shake"); G.streak = 0; showCombo();
  b.slots.forEach((W, i) => { if (got[i] === want[i]) { W.locked = true; W.el.classList.add("ok"); } else W.el.classList.add("bad"); });
  bonusTools();
  if (b.tries >= BONUS_TRIES) { hintEl.innerHTML = tx("bonusOut"); return setTimeout(bonusReveal, reduceMotion ? 0 : 700); }
  hintEl.innerHTML = tx("bonusWrong");
  setTimeout(() => {
    if (G.b !== b) return;
    flipAll(() => b.slots.forEach((W, i) => { if (!W.locked) { W.el.classList.remove("bad"); setSlot(i, null); toHome(W); } }));
    G.phase = "bonus"; bonusTools();
  }, reduceMotion ? 300 : 900);
}
// Out of tries: every gap gets its right word (amber), then the result.
function bonusReveal() {
  const b = G.b;
  flipAll(() => {
    b.slots.forEach((W, i) => { if (W && !W.locked) { W.el.classList.remove("bad"); setSlot(i, null); toHome(W); } });
    b.ans.forEach((t, i) => {
      if (b.slots[i]) return;
      const W = b.words.find(w => w.slot < 0 && w.t.toLowerCase() === t.toLowerCase());
      if (W) { leaveHome(W); setSlot(i, W); W.locked = true; W.el.classList.add("shown"); }
    });
  });
  bonusFinish(0, false);
}
function bonusFinish(pts, ok) {
  const b = G.b;
  G.phase = "done"; G.score += pts; G.bonus = { s: b.s, pts, ok, first: ok && b.tries === 0 }; G.bonuses.push(G.bonus);
  card.classList.add("done");
  b.words.forEach(W => { if (W.slot < 0) W.home.classList.add("gone"); });
  recordProgress(b.s.id, G.bonus.first ? 2 : ok ? 1 : 0);
  showScore(); toolsEl.hidden = true;
  if (ok) { sndOk(); burst(card); flash(scoreEl, "up"); }
  toast(ok ? tx(G.bonus.first ? "bonusPerfect" : "bonusGot", { n: pts }) : tx("bonusMissed"), ok ? "" : "zero");
  hintEl.innerHTML = "";
  setTimeout(() => { if (G.b === b) showBonusReveal(); }, reduceMotion ? 0 : 500);
}
// The result bar: the points, a speaker and See results. The finished sentence is read aloud at once.
function showBonusReveal() {
  const b = G.b, say = () => speak(b.s.en.replace(/[[\]]/g, ""), $("listen"));
  revealEl.innerHTML = '<div class="rv-bar"><div class="rv-head"><b class="rv-score">' + esc(tx("bonusTag")) + " +" + G.bonus.pts + "</b>" +
    '<button type="button" class="pbtn" id="listen">' + ICON_SPK + " " + tx("listen") + "</button></div>" +
    '<div class="rv-act">' + favBtn(b.s.id) + '<button type="button" class="cta pulse" id="next">' + tx(bonusDue() ? "next" : "results") + " &rarr;</button></div></div>";
  revealEl.hidden = false;
  $("listen").addEventListener("click", say);
  say();
  $("next").addEventListener("click", nextRound);
  $("next").focus({ preventScroll: true });
  showCard(revealEl);
}

/* ---------- Tap & drag ---------- */
let drag = null;
stage.addEventListener("pointerdown", e => {
  const el = e.target.closest(".w"); if (!el || !el.__w || G.phase !== "bonus" || el.__w.locked || e.button > 0) return;
  e.preventDefault();
  drag = { W: el.__w, x0: e.clientX, y0: e.clientY, on: false, hot: -1 };
  el.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", e => {
  if (!drag) return;
  const W = drag.W, el = W.el, b = G.b;
  if (!drag.on) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 7) return;
    const rc = el.getBoundingClientRect();
    drag.on = true; drag.ox = drag.x0 - rc.left; drag.oy = drag.y0 - rc.top;
    if (W.slot < 0) leaveHome(W); else b.slotEls[W.slot].classList.remove("filled");
    el.style.width = rc.width + "px"; el.classList.add("drag"); sqStart(el, e.clientX, e.clientY);
  }
  let x = e.clientX - drag.ox, y = e.clientY - drag.oy;
  drag.hot = slotAt(e.clientX, e.clientY);
  // Magnet: near a free slot the word is pulled part of the way into it.

/* 12-squash.js — squash and stretch (from Be Do Modal): a carried word stretches along the way it moves, more the
   faster (up to STRETCH longer, as much thinner across), and rounds out as the pointer slows or stops. Let go, it
   wobbles (the `scale` property, so it adds to the FLIP move home and the bob). One frame loop while it moves, writing
   only the carried word's transform (its position is left / top, 11-bonus.js). None with reduced motion.
   While a word is carried every word stops bobbing and turning (body.carrying, 14-soap.css). */

  let t = "scale(1.1) rotate(-3deg)";   // the carried look at rest (13-bonus.css .w.drag)
  if (s > .004) { const a = (Math.atan2(sq.vy, sq.vx) * 180 / Math.PI).toFixed(1); t = "rotate(" + a + "deg) scale(" + (1.1 * (1 + s)).toFixed(3) + "," + (1.1 / (1 + s)).toFixed(3) + ") rotate(" + (-a) + "deg) rotate(-3deg)"; }

/* 15-progress.js — what the player has done, across games, and the daily streak.
   cmp-prog = {id: [attempts, lastStatus, time]} (texts and bonus sentences): status 2 = perfect on the first check
   ("mastered"), 1 = all right on a later check, 0 = some answers still wrong.
   cmp-uses = {rule: [answers, right]}: first-check accuracy for each rule (rules.json "rules"), from games and quick-fire.
   cmp-days = "YYYY-MM-DD|days in a row". */
function getJSON(k) { try { const o = JSON.parse(load(k)); return o && typeof o === "object" ? o : {}; } catch (e) { return {}; } }
function getProg() { return getJSON("cmp-prog"); }
function recordProgress(id, status) {
  const p = getProg(), o = p[id] || [0, 0, 0];
  p[id] = [o[0] + 1, status, Date.now()]; store("cmp-prog", JSON.stringify(p));
}
// A level's texts (or bonus sentences) in play order: never seen (random), then wrong last time, then not yet perfect, then mastered (oldest first).
// What the last RECENT_GAMES games played (perGame items a game) waits at the back, so a text missed in one game
// doesn't come straight back in the next one (from Conditional Bubbles); it still comes before nothing else is left.
const RECENT_GAMES = 3;
function orderPool(list, perGame) {
  const p = getProg(), time = t => (p[t.id] || [0, 0, 0])[2];
  const n = Math.max(0, Math.min(RECENT_GAMES * (perGame || 0), list.length - (perGame || 0)));
  const recent = new Set(list.filter(t => time(t)).sort((a, b) => time(b) - time(a)).slice(0, n).map(t => t.id));
  const grp = t => { const o = p[t.id]; return (recent.has(t.id) ? 4 : 0) + (!o ? 0 : o[1] === 0 ? 1 : o[1] === 1 ? 2 : 3); };
  return shuffle(list.slice()).sort((a, b) => grp(a) - grp(b) || time(a) - time(b));
}
// Mastered / total texts at a level.
function mastery(level) {
  const p = getProg(), list = DATA.texts[level];
  return { m: list.filter(t => p[t.id] && p[t.id][1] === 2).length, n: list.length };
}
// One level's meter: label, bar, "3 / 5".
function meterHTML(level) {
  const x = mastery(level);
  return '<div class="meter" style="' + lvVars(level) + '"><b>' + esc(lvName(level)) + '</b><div class="pbar"><i style="width:' + (x.m / x.n * 100).toFixed(1) + '%"></i></div><span>' + x.m + " / " + x.n + "</span></div>";
}

/* ---------- Accuracy per rule ---------- */
// rules = each spot's rule (rules.json key), ok = right on the first check.
function recordUses(rules, ok) {
  const s = getJSON("cmp-uses");
  rules.forEach((u, i) => { const o = s[u] || [0, 0]; s[u] = [o[0] + 1, o[1] + (ok[i] ? 1 : 0)]; });
  store("cmp-uses", JSON.stringify(s));
}
// Chips "Long: more / most 7/8", one per rule in stats {rule: [n, right]}, weakest first; weak = only the WEAK_MAX
// weakest under WEAK_PCT (from the a / an / the game). Tap one to open the Guide there.
const WEAK_MAX = 3, WEAK_PCT = .8;
function usesHTML(stats, weak) {
  let ks = Object.keys(DATA.rules.rules).filter(k => stats[k] && stats[k][0]);
  ks.sort((a, b) => stats[a][1] / stats[a][0] - stats[b][1] / stats[b][0]);
  if (weak) ks = ks.filter(k => stats[k][1] / stats[k][0] < WEAK_PCT).slice(0, WEAK_MAX);
  return ks.map(k => {
    const R = DATA.rules.rules[k], s = stats[k], pct = s[1] / s[0];
    return '<button type="button" class="chip usechip' + (pct < .6 ? " weak" : "") + '" data-rule="' + k + '" style="--h:' + R.hue + '" title="' + esc(R.name + " · " + R.namePt) + '">' +
      esc(ruleName(k, nativeUi())) + " " + s[1] + "/" + s[0] + "</button>";
  }).join("");
}
document.addEventListener("click", e => { const b = e.target.closest(".usechip"); if (b) openGuide(b.dataset.rule); });

/* ---------- Daily streak ---------- */
function dayStr(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dayState() {
  const [d, n] = (load("cmp-days") || "|0").split("|"), y = new Date(); y.setDate(y.getDate() - 1);
  return { d, n: +n || 0, today: dayStr(new Date()), yest: dayStr(y) };
}
// Days in a row, counting today or yesterday (the streak is still alive until a day is skipped).
function getDays() { const s = dayState(); return s.d === s.today || s.d === s.yest ? s.n : 0; }
// Called when a text is finished: the first one of the day extends (or restarts) the streak.
function tickDay() {
  const s = dayState(); if (s.d === s.today) return;
  store("cmp-days", s.today + "|" + (s.d === s.yest ? s.n + 1 : 1)); showDays();
}

/* 16-gloss.js — words with a dotted line in the text show their Portuguese meaning on hover or tap. Meanings come from
   the text's own "w" (src/data/texts/*.json); keys can be several words ("of course") and match in any case.
   The grey adjectives show their meaning (adjectives.json "pt") on mouse hover only: a tap moves them round the cycle. */
const glossEl = document.createElement("div");
glossEl.className = "glosstip"; glossEl.setAttribute("role", "tooltip"); glossEl.hidden = true;
document.body.appendChild(glossEl);
let glossFor = null, glossTimer = 0, lastPointer = "mouse";

// One regex per text for its glossary keys, longest first.
function glossRe(t) {
  if (t._gre !== undefined) return t._gre;
  const ks = Object.keys(t.w || {}).sort((a, b) => b.length - a.length).map(k => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  return (t._gre = ks.length ? new RegExp("\\b(" + ks.join("|") + ")\\b", "gi") : null);
}
// Text s as HTML, its glossary words wrapped in .gw.
function glossWrap(s, t) {
  const re = glossRe(t); if (!re) return esc(s);
  let out = "", last = 0, m;
  re.lastIndex = 0;
  while ((m = re.exec(s))) { out += esc(s.slice(last, m.index)) + '<span class="gw" data-g="' + esc(m[1].toLowerCase()) + '">' + esc(m[1]) + "</span>"; last = re.lastIndex; }
  return out + esc(s.slice(last));
}
function glossOf(k) { return (G.r && (G.r.t.w || {})[Object.keys(G.r.t.w || {}).find(x => x.toLowerCase() === k)]) || (DATA.adjectives[k] || {}).pt || ""; }
// The glossed word under an event, or null. Adjective spots only count for mouse hover (taps move them round the cycle).
function glossTarget(e) {
  const g = e.target.closest ? e.target.closest(".gw, .adj") : null;
  if (!g) return null;
  if (g.classList.contains("adj")) return e.pointerType === "mouse" && /^pointer(over|out)$/.test(e.type) && G.phase === "play" ? g : null;
  return g;
}
// Show the meaning just above the word (below it near the top of the screen); linger = hide by itself after a moment.
// A phrase that wraps onto two lines has one box per line: use the line the pointer is on (x, y), else the first one
// (its whole bounding box spans both lines, which put the tip far from the word). From the a / an / the game.
function showGloss(el, linger, x, y) {
  const g = glossOf(el.dataset.g); clearTimeout(glossTimer);
  if (!g) return hideGloss();
  if (glossFor && glossFor !== el) glossFor.classList.remove("on");
  glossEl.innerHTML = ptBadge() + '<span lang="pt">' + esc(g) + "</span>";
  glossEl.style.left = glossEl.style.top = "0px";   // measure at the left edge: at its old place it could be squeezed narrower
  glossEl.hidden = false; glossFor = el; el.classList.add("on");
  const rs = [...el.getClientRects()], hit = x != null && rs.find(r => x >= r.left - 2 && x <= r.right + 2 && y >= r.top - 2 && y <= r.bottom + 2);
  const b = hit || rs[0] || el.getBoundingClientRect(), t = glossEl.getBoundingClientRect(), below = b.top - t.height - 10 < 8;
  glossEl.style.left = Math.min(Math.max(b.left + b.width / 2 - t.width / 2, 8), innerWidth - t.width - 8) + "px";
  glossEl.style.top = (below ? b.bottom + 10 : b.top - t.height - 10) + "px";
  if (linger) glossTimer = setTimeout(hideGloss, 2600);
}
function hideGloss() { clearTimeout(glossTimer); glossEl.hidden = true; if (glossFor) glossFor.classList.remove("on"); glossFor = null; }

// Mouse: hovering shows the meaning. Tap or click: the meaning (for a moment on touch).
card.addEventListener("pointerover", e => { const g = glossTarget(e); if (g && e.pointerType === "mouse") showGloss(g, false, e.clientX, e.clientY); });
card.addEventListener("pointerout", e => { const g = glossTarget(e); if (g && g === glossFor && e.pointerType === "mouse" && !g.contains(e.relatedTarget)) hideGloss(); });
card.addEventListener("click", e => { const g = glossTarget(e); if (g) showGloss(g, lastPointer !== "mouse", e.clientX, e.clientY); });
document.addEventListener("pointerdown", e => { lastPointer = e.pointerType; if (!glossTarget(e)) hideGloss(); }, true);
addEventListener("scroll", hideGloss, true); addEventListener("resize", hideGloss);

/* 17-shine.js — the bonus words' soap look and its shine (from Conditionals / Be Do Modal, 2026-11-22). SOAP = the spans
   inside every word bubble (14-soap.css): the film (.film: the turning colour .spin, the glow facing the mouse .fg), the
   shine spot (.spot + its brighter core .pl), the rim (.rim: .spin + the bright side .rh) and the small spot (.glint).
   What moves is a bare wrapper whose look is the <i> inside, so only transform / opacity change: nothing is repainted.
   The shine: each visible word's spot stays in its top-left corner and leans a little toward the cursor, the small
   spot moves the other way, the side facing the cursor glows as it nears. With a mouse always; with a finger only
   while a word is carried. Nothing with reduced motion. */
var SOAP = '<span class="film" aria-hidden="true"><i class="spin"></i><i class="fg"><i></i></i></span>' +
  '<span class="spot" aria-hidden="true"><i></i><i class="pl"><i></i></i></span>' +
  '<span class="rim" aria-hidden="true"><i class="spin"></i><i class="rh"><i></i></i></span><span class="glint" aria-hidden="true"><i></i></span>';
// Off screen, the words' animations (bob, turning film) pause: #stage.still
if (window.IntersectionObserver) new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle("still", !e.isIntersecting))).observe(stage);
// While the result card opens or closes, the bobs, films and background bubbles pause (body.calm), so each frame of
// that animation doesn't also restyle every running animation
let calmT = 0;
if (window.MutationObserver && !reduceMotion) new MutationObserver(() => {
  document.body.classList.add("calm"); clearTimeout(calmT);
  calmT = setTimeout(() => document.body.classList.remove("calm"), 450);
}).observe(revealEl, { attributes: true, attributeFilter: ["hidden"] });
(function () {
  if (reduceMotion) return;
  let px = 0, py = 0, on = false, touch = false, raf = 0, last = 0, dirty = true, odd = false;
  let rcache = null, rlist = null, rtime = 0;
  const RECT_MS = 250;   // positions measured at most this often (they barely move), and after a scroll / resize
  // the spot leans at most RIGHT / DOWN of the bubble's height toward the cursor, LEFT / UP the other way;
  // from NEAR0 of that (far) to all of it (on it); FALL = how quickly it fades with distance
  const RIGHT = 0.07, DOWN = 0.08, LEFT = 0.025, UP = 0.03, NEAR0 = 0.5, FALL = 160;
  const GLOW = 190;     // nearness sk = (GLOW / (distance + GLOW))^2: 1 on the bubble, 1/4 at GLOW px
  const EASE = 0.3;     // share of the way to the target in one 60 fps frame
  const DRAG_SK = 0.45; // while a word is carried, the others keep at least this nearness
  const carried = () => document.querySelector(".w.drag");
  const parts = b => ({ sp: b.querySelector(".spot"), pl: b.querySelector(".spot .pl"), gl: b.querySelector(".glint"), fg: b.querySelector(".fg"), rh: b.querySelector(".rh"), w: {} });
  // a write only when the value shows a change
  function put(e, n, p, v) { const key = n + p; if (e.w[key] !== v) { e.w[key] = v; e[n].style[p] = v; } }
  function paint(st) {
    const e = st.el, k = Math.round(st.sk * 100) / 100, sx = st.sx, sy = st.sy, o = k.toFixed(2);
    put(e, "sp", "transform", "translate(" + sx.toFixed(1) + "px," + sy.toFixed(1) + "px) rotate(-30deg) scale(" + (1 + 0.1 * k).toFixed(3) + ")");
    put(e, "pl", "opacity", o);
    put(e, "gl", "transform", "translate(" + (-0.35 * sx).toFixed(1) + "px," + (-0.35 * sy).toFixed(1) + "px) rotate(-45deg)");
    put(e, "gl", "opacity", (0.8 + 0.2 * k).toFixed(3));
    // the glows sit on the edge point facing the cursor (a translate in % is a share of the span itself)
    put(e, "fg", "transform", "translate(" + (st.ux * 50 / 1.2).toFixed(1) + "%," + (st.uy * 50 / 1.9).toFixed(1) + "%)");
    put(e, "fg", "opacity", o);
    put(e, "rh", "transform", "translate(" + (st.ux * 50 / 1.1).toFixed(1) + "%," + (st.uy * 50 / 1.8).toFixed(1) + "%)");
    put(e, "rh", "opacity", o);
  }
  function rest(e) { [e.sp, e.pl, e.gl, e.fg, e.rh].forEach(n => { if (n) n.style.transform = n.style.opacity = ""; }); e.w = {}; }
  function frame(now) {
    raf = 0;
    const held = carried();
    if (touch && !held) on = false;
    if (touch && held && (odd = !odd)) { raf = requestAnimationFrame(frame); return; }   // 30 updates a second on a phone
    const f = 1 - Math.pow(1 - EASE, Math.min(4, (now - (last || now - 16.7)) / 16.7));
    last = now;
    const bs = [...stage.querySelectorAll(".b.w, .adj")];   // bonus words and adjective spots
    let rs = [], moving = false;
    if (rcache && now - rtime < RECT_MS && rlist.length === bs.length && rlist[0] === bs[0]) rs = rcache;
    else { rs = bs.map(b => b.getBoundingClientRect()); rcache = rs; rlist = bs; rtime = now; }   // reads first, then writes
    bs.forEach((b, i) => {
      const r = rs[i];
      const st = b._sh || (b._sh = { sx: 0, sy: 0, sk: 0, ux: 0, uy: -1, el: parts(b) });
      if (!st.el.sp) return;
      if (!r.width) { if (st.w) { b._sh = null; rest(st.el); } return; }
      let t = st.t;
      if (dirty || !t) t = st.t = { sx: 0, sy: 0, sk: 0, ux: st.ux, uy: st.uy };
      if ((dirty || !st.t0) && on && b !== held) {   // the carried word itself rests

      st.t0 = true;

  function more() { if (!raf) raf = requestAnimationFrame(frame); }

    if (document.body.classList.contains("covered")) return;   // the tutorial or a window is open: the spots stay still
    touch = e.pointerType !== "mouse";
    if (touch && !carried()) return;
    px = e.clientX; py = e.clientY; on = true; ask();
  }, { passive: true });

  document.addEventListener("pointerup", release, true);
  document.addEventListener("pointercancel", release, true);
  document.documentElement.addEventListener("pointerleave", () => { on = false; ask(); });
  window.addEventListener("scroll", () => { rcache = null; if (on) ask(); }, { passive: true });
  window.addEventListener("resize", () => { rcache = null; }, { passive: true });
})();

// While the tutorial or a window (.favmodal) covers the game, everything behind it stands still (body.covered: the
// CSS pauses the loops; the shine above ignores the mouse), so slow phones don't redraw the blur over it every frame
(() => {
  const check = () => { const t = document.getElementById("tour"); document.body.classList.toggle("covered", !!(t && !t.hidden) || !!document.querySelector(".favmodal.show")); };
  if (window.MutationObserver) new MutationObserver(check).observe(document.body, { subtree: true, attributes: true, attributeFilter: ["class", "hidden"] });
})();

/* 20-end.js — end-of-game modal: score, stars (text points only), hint bonus, bonus round, level progress, day
   streak, every text with its result, and "Copy results" (plain text to send the teacher, with accuracy for each rule
   in this game; on screen that accuracy is only in the Seen list). Adapts to the mode: quick-fire (no stars, own best)
   and practice games (no best score). */
const endModal = $("endmodal");
function stars(n) { return [0, 1, 2].map(i => '<span class="' + (i < n ? "" : "off") + '">&#9733;</span>').join(""); }
function showEnd() {
  stopSpeed(); G.phase = "over";
  const speed = G.mode === "speed", done = G.results.length, pool = hintPool();
  const pts = G.results.reduce((s, x) => s + x.pts, 0), max = G.results.reduce((s, x) => s + x.max, 0);
  // A game of bonus sentences only (Favorites) gets its stars from them.
  const bPts = G.bonuses.reduce((s, B) => s + B.pts, 0), bMax = G.bonuses.length * BONUS_FIRST;
  const pct = max ? pts / max : bMax ? bPts / bMax : 0, n = pct >= .85 ? 3 : pct >= .6 ? 2 : pct >= .35 ? 1 : 0;
  // Unused hints become bonus points (not in quick-fire, where time is the pressure).
  const bonus = speed || !done ? 0 : G.hintsLeft;
  G.score += bonus;
  const total = max + (speed || !done ? 0 : pool) + bMax, sc = G.score, key = bestKey();
  const prev = key ? parseInt(load(key), 10) || 0 : 0, record = !!key && sc > prev;
  if (record) store(key, sc);

  $("endtitle").textContent = tx(speed ? "endTime" : G.mode === "normal" ? "endGame" : "endPractice");
  $("endstars").innerHTML = speed ? "" : stars(n);
  $("endscore").textContent = speed ? tx(sc === 1 ? "onePoint" : "nPoints", { n: sc }) : sc + " / " + total;
  $("endmsg").textContent = speed ? tx("inSeconds", { x: sc + " / " + done, s: SPEED_SECS }) : tx("msg" + n);
  $("endsub").textContent = !key ? tx("noSave") :
    (record ? tx(speed ? "speedRecord" : "newBest", { lvl: lvName(G.level) }) : tx("levelBest", { lvl: lvName(G.level), n: Math.max(prev, sc) }));
  const extras = [];
  if (!speed && done) extras.push(tx("hintsUsed", { n: pool - G.hintsLeft, m: pool }) + (bonus ? tx("bonus", { n: bonus }) : ""));
  if (G.bonuses.length) extras.push(tx("bonusRound", { r: bPts ? "+" + bPts : tx("missed") }));
  $("endhints").textContent = extras.join(" · ");
  const days = getDays();
  $("endprog").innerHTML = speed ? "" : meterHTML(G.level) + '<span class="psub">' + tx("mastered", { lvl: esc(lvName(G.level)) }) + (days >= 2 ? tx("daysRow", { n: days }) : "") + "</span>";
  $("endlist").innerHTML = speed ? G.results.map(speedItemHTML).join("") : G.results.map(x =>
    '<li class="' + (x.allRight ? "" : "miss") + '"><span class="ri">' + (x.perfect ? "&#9733;" : x.allRight ? "&#10003;" : "&#10007;") + "</span>" +
    '<div class="rs"><div><b>' + esc(x.t.title) + "</b> · " + x.k + "/" + x.n + '</div><div class="rt">' + parsed(x.t).spots.map(sp => esc(formOf(sp))).join(" · ") + "</div></div>" +
    '<span class="rp">+' + x.pts + "</span>" + favBtn(x.t.id) + "</li>").join("") + G.bonuses.map(bonusItemHTML).join("");
  // Offer the next level after a good normal game.
  const lv = Object.keys(DATA.levels), up = lv[lv.indexOf(G.level) + 1], upBtn = $("endup");

}
function bonusItemHTML(B) {
  return '<li class="' + (B.ok ? "" : "miss") + '"><span class="ri">' + (B.first ? "&#9733;" : B.ok ? "&#10003;" : "&#10007;") + "</span>" +
    '<div class="rs"><div><b>★ ' + esc(tx("bonusTag")) + "</b> · " + B.s.en.replace(/[[\]]/g, "") + '</div><div class="rt" lang="pt">' + esc(B.s.pt) + "</div></div>" +
    '<span class="rp">+' + B.pts + "</span>" + favBtn(B.s.id) + "</li>";
}
// {rule: [answers, right on the first check]} for this game.
function gameUses() {
  const s = {}, add = (u, ok) => { const o = s[u] || [0, 0]; s[u] = [o[0] + 1, o[1] + (ok ? 1 : 0)]; };
  G.results.forEach(x => { if (x.sp) add(x.sp.rule, x.ok); else parsed(x.t).spots.forEach((sp, i) => add(sp.rule, x.first[i])); });
  return s;

// Plain-text summary for the teacher (WhatsApp, Classroom...). Wrong answers show the right sentence and the choice made.
function resultsText() {
  const d = new Date().toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }), u = gameUses();
  const lines = ["Bigger, Better, Best · " + lvName(G.level) + " · " + MODE_NAME[G.mode] + " · " + d,
    "Score: " + $("endscore").textContent + ($("endhints").textContent ? " (" + $("endhints").textContent + ")" : ""),

/* ---------- Quick-fire ---------- */
let speedT = 0, speedEnd = 0, speedBeat = 0;
// Every spot of the level: { t, P, sp, i }.
function speedPool(level) {
  const out = [];

  return shuffle(out);
}
function startSpeed() { speedEnd = Date.now() + SPEED_SECS * 1000; speedBeat = Math.ceil(SPEED_SECS / 30); clearInterval(speedT); speedT = setInterval(speedTick, 250); speedRender(); }
function stopSpeed() { stopIntro(); clearInterval(speedT); speedT = 0; $("proglbl").closest(".prog").classList.remove("clock", "urgent"); }
// Before the clock: a card with the goal, then 3, 2, 1, Go! (a tick each). "Go" starts the first sentence and the clock.
const cdEl = document.createElement("div"); cdEl.className = "cdown"; cdEl.hidden = true; document.body.appendChild(cdEl);
let cdT = 0;
function speedIntro() {
  G.phase = "intro"; stage.hidden = toolsEl.hidden = revealEl.hidden = true;
  hintEl.innerHTML = ""; speedRender();
  cdEl.innerHTML = '<div class="cd-card"><p class="cd-t">' + tx("speedTitle") + '</p><p class="cd-x">' + tx("speedIntro") + '</p><b class="cd-n" id="cdn"></b></div>';
  cdEl.hidden = false;
  const steps = ["3", "2", "1", tx("go")]; let i = 0;
  const tick = () => {
    if (i === steps.length) { cdEl.hidden = true; G.sp = speedPool(G.level); G.spIdx = 0; speedRound(); startSpeed(); return; }
    const n = $("cdn"), go = i === steps.length - 1;
    n.textContent = steps[i++]; n.classList.remove("pop"); void n.offsetWidth; n.classList.add("pop");
    if (go) tone(1046.5, 0, .3, .09, 0, true); else tone(659.25, 0, .12, .07, 0, true);
    cdT = setTimeout(tick, go ? 550 : 800);
  };

}
function stopIntro() { clearTimeout(cdT); cdEl.hidden = true; }
function speedLeft() { return speedT ? Math.max(0, speedEnd - Date.now()) : SPEED_SECS * 1000; }
// The progress label becomes a big clock with "7 ✓" under it; the bar drains. Every 30 seconds the clock beats
// (with a chime), and the last 10 seconds pulse red.
function speedRender() {

}
function speedTick() {

}
// One sentence: the adjective grey in a gap, and its forms as buttons (keys 1–4, or 1–5 at B1+, in cycle order).
function speedRound() {

  quizEl.querySelectorAll(".sopt").forEach(b => { b.disabled = true; if (+b.dataset.k === sp.ans) b.classList.add("ok"); else if (+b.dataset.k === k) b.classList.add("bad"); });
  const gap = quizEl.querySelector(".qgap"); gap.className = "qgap " + (ok ? "ok" : "bad"); gap.textContent = formOf(sp);
  G.results.push({ t: it.t, P: it.P, sp, i: it.i, ok, pick: k, pts: ok ? 1 : 0, max: 1 });

  function build() {
    el = document.createElement("div");
    el.className = "ebd ebd-l";
    el.hidden = true;
    el.innerHTML =
      '<div class="ebd-card" role="dialog" aria-modal="true" aria-labelledby="ebd-t">' +
      '<button type="button" class="ebd-x" aria-label="Close · Fechar">&times;</button>' +
      '<h2 class="ebd-t" id="ebd-t"><span class="ebd-hrt">' + HEART + "</span>" + both("Keep English Bubbles free", "Ajude a manter o English Bubbles grátis") + "</h2>" +
      '<p class="ebd-p">' + both("No ads, no sign-up, free for everyone. If you can, a small PIX helps keep it that way.",
        "Sem anúncios, sem cadastro, grátis para todos. Se puder, um PIX ajuda a continuar assim.") + "</p>" +
      '<div class="ebd-amts" role="group" aria-label="Amount · Valor">' + PIX.codes.map(function (c, i) {
        return '<button type="button" data-i="' + i + '">' + (c.label === "any" ? both("Any amount", "Outro valor") : c.label) + "</button>";
      }).join("") + "</div>" +
      '<div class="ebd-qr">' + PIX.codes.map(function (c, i) { return '<div data-i="' + i + '" hidden>' + qrSvg(c) + "</div>"; }).join("") +
      '<small>' + both("Scan it with your bank app", "Escaneie com o app do seu banco") + "</small></div>" +
      '<button type="button" class="ebd-show">' + both("Show QR code", "Mostrar QR code") + "</button>" +
      '<button type="button" class="ebd-copy">' + both("Copy PIX code", "Copiar código PIX") + "</button>" +
      '<p class="ebd-any" hidden>' + both("You type the amount in your bank app.", "Você digita o valor no app do banco.") + "</p>" +
      '<p class="ebd-done" role="status" hidden>' + both("Copied! In your bank app: <b>Pix → Pix Copia e Cola</b>, then paste. Thank you! ♥",
        "Copiado! No app do banco: <b>Pix → Pix Copia e Cola</b> e cole. Obrigado! ♥") + "</p>" +
      '<textarea class="ebd-code" readonly rows="3" hidden aria-label="PIX"></textarea>' +
      '<p class="ebd-who">' + both("Receiver: ", "Recebedor: ") + PIX.receiver + "</p>" +
      '<div class="ebd-later" hidden><button type="button" class="ebd-no">' + both("Not now", "Agora não") + "</button>" +
      '<button type="button" class="ebd-never">' + both("Don't show this again", "Não mostrar de novo") + "</button></div>" +
      "</div>";
    document.body.appendChild(el);
    el.addEventListener("click", function (e) {
      e.stopPropagation();
      var t = e.target;
      if (t === el) { bounce(); return; }
      var amt = t.closest(".ebd-amts button");
      if (amt) { choose(+amt.dataset.i); ding(587.33); return; }
      if (t.closest(".ebd-x") || t.closest(".ebd-no")) { close(); return; }
      if (t.closest(".ebd-never")) { var s = state(); s.off = true; save(s); close(true); return; }
      if (t.closest(".ebd-show")) { el.classList.add("qr-on"); return; }
      if (t.closest(".ebd-copy")) copy();
    });
    // the game behind must not react to taps on the panel
    ["pointerdown", "pointerup", "mousedown", "touchstart", "touchend"].forEach(function (k) { el.addEventListener(k, function (e) { e.stopPropagation(); }); });
  }
  function bounce() {
    var c = el.querySelector(".ebd-card");
    if (c.animate && !matchMedia("(prefers-reduced-motion: reduce)").matches)
      c.animate([{ transform: "scale(1)" }, { transform: "scale(1.03)" }, { transform: "scale(1)" }], { duration: 260, easing: "ease-out" });
  }
  function choose(i) {
    pick = i;
    el.querySelectorAll(".ebd-amts button").forEach(function (b) { b.setAttribute("aria-pressed", String(+b.dataset.i === i)); });
    el.querySelectorAll(".ebd-qr > div").forEach(function (d) { d.hidden = +d.dataset.i !== i; });
    el.querySelector(".ebd-any").hidden = PIX.codes[i].label !== "any";
    el.querySelector(".ebd-done").hidden = true;
    el.querySelector(".ebd-code").hidden = true;
  }
  function copied() {
    el.querySelector(".ebd-done").hidden = false;
    el.querySelector(".ebd-code").hidden = true;
    stat("PIX code copied", { amount: PIX.codes[pick].label, game: GAME });
    var s = state(); s.gave = true; save(s);       // no more pop-ups; the line in the games comes less often
    ding(659.25); setTimeout(function () { ding(987.77); }, 90);
  }
  function copy() {
    var code = PIX.codes[pick].code, ta = el.querySelector(".ebd-code");
    function fallback() {
      ta.value = code; ta.hidden = false; ta.focus(); ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      if (ok) { ta.hidden = true; copied(); }       // else the code stays shown, selected, to copy by hand
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(code).then(copied, fallback);
    else fallback();
  }
  function open(how) {
    if (!el) build();
    if (!el.hidden) return;
    mode = how || "manual";
    stat("Support opened", { from: mode === "ask" ? "menu pop-up" : GAME === "menu" ? "menu link" : "game line", game: GAME });
    back = document.activeElement;
    el.dataset.lang = A.lang();
    el.classList.remove("qr-on");
    el.querySelector(".ebd-later").hidden = mode !== "ask";
    choose(0);
    el.hidden = false;
    document.documentElement.classList.add("ebd-open");
    try { el.querySelector(".ebd-copy").focus({ preventScroll: true }); } catch (e) {}
    if (mode !== "ask") ding(659.25);
  }
  function close(never) {
    if (!el || el.hidden) return;
    if (mode === "ask" && !never) { var s = state(); s.next = rounds() + ASK_AGAIN; save(s); }
    el.hidden = true;
    document.documentElement.classList.remove("ebd-open");
    try { if (back && back.focus) back.focus({ preventScroll: true }); } catch (e) {}
  }
  // While the panel is open the keyboard belongs to it (games use Escape, arrows and letters)
  window.addEventListener("keydown", function (e) {
    if (!el || el.hidden) return;
    e.stopImmediatePropagation();
    if (e.key === "Escape") { e.preventDefault(); close(); return; }
    if (e.key === "Tab") {
      var f = [].filter.call(el.querySelectorAll("button, textarea"), function (b) { return !b.hidden && b.offsetParent !== null; });
      var at = f.indexOf(document.activeElement);
      e.preventDefault(); f[(at + (e.shiftKey ? f.length - 1 : 1) + f.length) % f.length].focus();
    }
  }, true);
  window.ebDonate = open;

  // ------------------------------------------------------------ the menu: the pop-up and the footer link
  if (inMenu) {
    var link = document.getElementById("donlink");
    var showLink = function () { if (link) link.hidden = false; };   // always shown (2026-11-26, the user)
    if (link) link.addEventListener("click", function () { open("manual"); });
    var ask = function () {
      showLink();
      var s = state(), help = document.getElementById("help");
      if (s.off || s.gave || s.asks >= MAX_ASKS || rounds() < Math.max(FIRST, s.next)) return;
      if (help && !help.hidden) return;              // the tour is open
      s.asks += 1; s.next = rounds() + ASK_AGAIN; save(s);
      open("ask");
    };
    // after the page has arrived (the header's slide, then the page's fade-in), and again when Back restores it
    var later = function () { var go = function () { setTimeout(ask, 900); }; if (typeof afterSlide === "function") afterSlide(go); else go(); };
    showLink();
    later();
    window.addEventListener("pageshow", function (e) { if (e.persisted) later(); });
    return;
  }

  // ------------------------------------------------------------ a game: count rounds, add the line
  var lastFp = null;
  function ended(after, fp) {
    if (!after || fp === lastFp) return;
    lastFp = fp;
    var n = rounds() + 1;
    A.set("eb-rounds", String(n));
    stat("Round finished", { game: GAME });
    var old = after.parentNode.querySelector(".ebd-line");
    if (old) old.remove();
    var s = state();
    if (n < FIRST || n < s.line) return;
    s.line = n + (s.gave ? LINE_EVERY_GAVE : LINE_EVERY); save(s);
    var p = document.createElement("p");
    p.className = "ebd-line ebd-l";
    p.dataset.lang = A.lang();
    p.innerHTML = both("Enjoying English Bubbles?", "Está gostando do English Bubbles?") +
      ' <button type="button">' + HEART + both("Support it", "Apoie") + "</button>";
    p.querySelector("button").addEventListener("click", function (e) { e.stopPropagation(); open("manual"); });
    after.parentNode.insertBefore(p, after.nextSibling);
  }
  function text(root, sel) { var x = root && root.querySelector(sel); return x ? x.textContent : ""; }
  var em = document.getElementById("endmodal"), wasOpen = !!(em && em.classList.contains("show"));
  if (em) new MutationObserver(function () {
    var on = em.classList.contains("show");
    if (on && !wasOpen) ended(em.querySelector(".endbtns") || em.querySelector("#endagain"), "m:" + text(em, "#endscore") + "|" + text(em, "#endlist").slice(0, 400));
    wasOpen = on;
  }).observe(em, { attributes: true, attributeFilter: ["class"] });
  var lastBtn = null;
  new MutationObserver(function () {
    var b = document.getElementById("pagain") || document.getElementById("spagain");
    if (!b || b === lastBtn) return;
    lastBtn = b;
    var box = b.closest(".pacts, .endbtns, p") || b;
    var end = b.closest(".pend") || box.parentNode;
    // the same round's end drawn again (a language switch) has the same words: not a new round
    var words = end.querySelectorAll(".w");
    if (!words.length) words = end.querySelectorAll("li");
    ended(box, "p:" + [].map.call(words, function (x) { return x.textContent.slice(0, 30); }).join("|").slice(0, 400) + text(end, ".big"));
  }).observe(document.body, { childList: true, subtree: true });
})();
</script>
