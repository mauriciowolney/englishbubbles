estressante do que dirigir na estrada, então por enquanto eu prefiro ruas tranquilas. A minha prova é no mês que vem, e eu estou um pouco nervoso."],"w":{"learning":"aprendendo","drive":"dirigir","lesson":"aula","terrible":"péssimo","highway":"estrada","prefer":"preferir","quiet":"tranquilo","roads":"ruas","for now":"por enquanto","nervous":"nervoso"}},{"id":"a2-21","frame":"School news","framePt":"Notícias da escola","title":"End-of-year party","titlePt":"Festa de fim de ano","body":["Last Friday our class had a party for the end of the school year. Lucas brought {the} [big:s] chocolate cake I've {ever} seen. We danced and played games all afternoon. It was {the} [fun:s] day of the year!"],"pt":["Na sexta passada a nossa turma fez uma festa para o fim do ano letivo. O Lucas trouxe o maior bolo de chocolate que eu já vi. Nós dançamos e brincamos a tarde toda. Foi o dia mais divertido do ano!"],"w":{"party":"festa","school year":"ano letivo","brought":"trouxe","danced":"dançamos","afternoon":"tarde"},"notes":[null,{"en":"fun is special: more fun / the most fun, never funner or funnest.","pt":"fun é especial: more fun / the most fun, nunca funner nem funnest."}]},{"id":"a2-22","frame":"Blog","framePt":"Blog","title":"Phones then and now","titlePt":"Celulares antes e agora","body":["My first phone was from 2010. Today's phones are much [thin:c] {than} that old phone, and they're also [powerful:c] {than} my first computer! But my old phone had one advantage: the battery lasted a week. Now I charge my phone every night."],"pt":["O meu primeiro celular era de 2010. Os celulares de hoje são muito mais finos do que aquele celular antigo, e também são mais potentes do que o meu primeiro computador! Mas o meu celular antigo tinha uma vantagem: a bateria durava uma semana. Agora eu carrego o meu celular toda noite."],"w":{"today's":"de hoje","advantage":"vantagem","battery":"bateria","lasted":"durava","charge":"carregar (bateria)"}},{"id":"a2-23","frame":"School news","framePt":"Notícias da escola","title":"Champions!","titlePt":"Campeões!","body":["Our basketball team won the final last night! The other team was [tall:c] {than} us, but we were faster. Our captain, Leo, was {the} [good:s] player on the court: he scored 30 points. Tonight the whole school is celebrating!"],"pt":["O nosso time de basquete venceu a final ontem à noite! O outro time era mais alto do que nós, mas nós éramos mais rápidos. O nosso capitão, o Leo, foi o melhor jogador da quadra: ele marcou 30 pontos. Hoje à noite a escola toda está comemorando!"],"w":{"won":"venceu","captain":"capitão","court":"quadra","scored":"marcou","points":"pontos","celebrating":"comemorando"}},{"id":"a2-24","frame":"Review","framePt":"Avaliação","title":"The Sunset Hotel","titlePt":"O Sunset Hotel","body":["We stayed at the Sunset Hotel for three nights. Our room was {the} [clean:s] room I've {ever} stayed in, and the staff were lovely. But breakfast was {the} [bad:s] part: the coffee was cold! Still, we want to go back next summer."],"pt":["Nós ficamos no Sunset Hotel por três noites. O nosso quarto foi o quarto mais limpo em que eu já fiquei, e os funcionários eram uma graça. Mas o café da manhã foi a pior parte: o café estava frio! Mesmo assim, queremos voltar no próximo verão."],"w":{"stayed in":"fiquei (hospedado)","stayed":"ficamos","staff":"funcionários","lovely":"uma graça","breakfast":"café da manhã","go back":"voltar"}},{"id":"a2-25","frame":"Email","framePt":"E-mail","title":"My new job","titlePt":"Meu emprego novo","body":["Hi Emma! I started my new job last week. The office is [big:c] {than} my old office, and it has a café. My new colleagues are [nice:c] {than} my old ones, too: yesterday they brought me a cake! Let's meet on Saturday.","Love, Paula"],"pt":["Oi, Emma! Eu comecei no meu emprego novo semana passada. O escritório é maior do que o meu escritório antigo, e tem um café. Os meus colegas novos são mais legais do que os antigos, também: ontem eles me trouxeram um bolo! Vamos nos encontrar no sábado.","Beijos, Paula"],"w":{"started":"comecei","office":"escritório","colleagues":"colegas","brought":"trouxeram","let's meet":"vamos nos encontrar"}},{"id":"a2-26","frame":"Review","framePt":"Avaliação","title":"Burger Street","titlePt":"Burger Street","body":["Burger Street opened last month, and I tried it on Friday. They have {the} [large:s] menu in town: more than 40 burgers! I ordered the Volcano Burger. It was [spicy:c] {than} any burger I've had, so I drank three glasses of water. Four stars!"],"pt":["O Burger Street abriu mês passado, e eu experimentei na sexta-feira. Eles têm o maior cardápio da cidade: mais de 40 hambúrgueres! Eu pedi o Volcano Burger. Ele era mais apimentado do que qualquer hambúrguer que eu já comi, então eu bebi três copos de água. Quatro estrelas!"],"w":{"opened":"abriu","tried":"experimentei","menu":"cardápio","ordered":"pedi","glasses":"copos"}},{"id":"a2-27","frame":"Blog","framePt":"Blog","title":"My first race","titlePt":"Minha primeira corrida","body":["Last Sunday I ran my first 10K race. The weather was [hot:c] {than} we expected, and there was no shade. The last two kilometers were {the} [hard:s] part of the race. My time was 58 minutes. I wasn't fast, but I finished!"],"pt":["No domingo passado eu corri a minha primeira corrida de 10 km. O tempo estava mais quente do que a gente esperava, e não tinha sombra. Os dois últimos quilômetros foram a parte mais difícil da corrida. O meu tempo foi 58 minutos. Eu não fui rápido, mas eu terminei!"],"w":{"ran":"corri","race":"corrida","expected":"esperava","shade":"sombra","finished":"terminei"}},{"id":"a2-28","frame":"Ad","framePt":"Anúncio","title":"The new X5","titlePt":"O novo X5","body":["Meet the new X5! It is {the} [thin:s] phone in our store: only 6 millimeters. Its screen is [wide:c] {than} the screen of the X4, so videos look amazing. The battery lasts all day. Buy it now and get free headphones!"],"pt":["Conheça o novo X5! Ele é o celular mais fino da nossa loja: só 6 milímetros. A tela dele é mais larga do que a tela do X4, então os vídeos ficam incríveis. A bateria dura o dia todo. Compre agora e ganhe fones de ouvido grátis!"],"w":{"meet":"conheça","screen":"tela","lasts":"dura","free":"grátis","headphones":"fones de ouvido"}},{"id":"a2-29","frame":"Weather report","framePt":"Previsão do tempo","title":"Weekend weather","titlePt":"O tempo no fim de semana","body":["Good morning! Here is the weather for the weekend. Saturday will be {the} [sunny:s] day of the week, with 28 degrees. But Sunday will be {the} [rainy:s] day of the month: it will rain all day. Don't forget your umbrella!"],"pt":["Bom dia! Aqui está a previsão do tempo para o fim de semana. Sábado vai ser o dia mais ensolarado da semana, com 28 graus. Mas domingo vai ser o dia mais chuvoso do mês: vai chover o dia todo. Não esqueça o seu guarda-chuva!"],"w":{"weekend":"fim de semana","degrees":"graus","rain":"chover","forget":"esquecer","umbrella":"guarda-chuva"}},{"id":"a2-30","frame":"Story","framePt":"História","title":"Coco comes home","titlePt":"A Coco volta para casa","body":["Our cat Coco disappeared on Monday. It was {the} [sad:s] week of the year for our family. We put photos of her on every street. On Friday night, she came back! She was [dirty:c] {than} ever, but she was fine."],"pt":["A nossa gata Coco desapareceu na segunda-feira. Foi a semana mais triste do ano para a nossa família. Nós colocamos fotos dela em todas as ruas. Na sexta à noite, ela voltou! Ela estava mais suja do que nunca, mas estava bem."],"w":{"disappeared":"desapareceu","put":"colocamos","came back":"voltou","than ever":"do que nunca","fine":"bem"}},{"id":"a2-31","frame":"School trip","framePt":"Passeio da escola","title":"The science museum","titlePt":"O museu de ciências","body":["Yesterday our class visited the science museum. The building is [modern:c] {than} the history museum, with glass walls and robots. Our guide was a young scientist. She was [funny:c] {than} our teacher, and she told us great stories. I want to go back!"],"pt":["Ontem a nossa turma visitou o museu de ciências. O prédio é mais moderno do que o museu de história, com paredes de vidro e robôs. A nossa guia era uma cientista jovem. Ela era mais engraçada do que o nosso professor, e nos contou histórias ótimas. Eu quero voltar!"],"w":{"building":"prédio","glass":"vidro","walls":"paredes","guide":"guia","go back":"voltar"}},{"id":"a2-32","frame":"About me","framePt":"Sobre mim","title":"My sisters","titlePt":"Minhas irmãs","body":["I have two older sisters, Julia and Rosa. Julia is a doctor, and she is {the} [busy:s] person in our family. She works almost every weekend. Rosa is a yoga teacher. She is {much} [calm:c] {than} Julia!"],"pt":["Eu tenho duas irmãs mais velhas, a Julia e a Rosa. A Julia é médica, e ela é a pessoa mais ocupada da nossa família. Ela trabalha quase todo fim de semana. A Rosa é professora de ioga. Ela é muito mais calma do que a Julia!"],"w":{"doctor":"médica","almost":"quase","weekend":"fim de semana","yoga teacher":"professora de ioga"}},{"id":"a2-33","frame":"Ad","framePt":"Anúncio","title":"Adopt a dog!","titlePt":"Adote um cachorro!","body":["Do you want a dog? Visit the Happy Paws shelter this weekend! Bruno is {the} [cute:s] puppy at the shelter: he has one white ear and one black ear. Max is ten years old. He is {the} [lazy:s] dog here, so he's perfect for a small apartment."],"pt":["Você quer um cachorro? Visite o abrigo Happy Paws neste fim de semana! O Bruno é o filhote mais fofo do abrigo: ele tem uma orelha branca e uma orelha preta. O Max tem dez anos. Ele é o cachorro mais preguiçoso daqui, então ele é perfeito para um apartamento pequeno."],"w":{"shelter":"abrigo","puppy":"filhote","ear":"orelha","perfect":"perfeito"}},{"id":"a2-34","frame":"Review","framePt":"Avaliação","title":"Hotel Azul","titlePt":"Hotel Azul","body":["We stayed at Hotel Azul for five nights. The beds were [comfortable:c] {than} our beds at home! The hotel is next to {the} [safe:s] beach on the coast, so it's great for families. The breakfast was a little boring, but the staff were very friendly."],"pt":["Nós ficamos no Hotel Azul por cinco noites. As camas eram mais confortáveis do que as nossas camas em casa! O hotel fica ao lado da praia mais segura do litoral, então é ótimo para famílias. O café da manhã era um pouco sem graça, mas os funcionários eram muito simpáticos."],"w":{"stayed":"ficamos","next to":"ao lado de","coast":"litoral","breakfast":"café da manhã","staff":"funcionários"}},{"id":"a2-35","frame":"Diary","framePt":"Diário","title":"The interview","titlePt":"A entrevista","body":["Today I had {the} [important:s] interview of my life: a job at a big hotel. I was very nervous in the morning. But the questions were [easy:c] {than} I expected. The manager was nice, and she smiled a lot. I hope I get the job!"],"pt":["Hoje eu tive a entrevista mais importante da minha vida: um emprego num hotel grande. Eu estava muito nervoso de manhã. Mas as perguntas foram mais fáceis do que eu esperava. A gerente foi simpática, e sorriu bastante. Espero conseguir o emprego!"],"w":{"interview":"entrevista","nervous":"nervoso","expected":"esperava","manager":"gerente","hope":"espero"}},{"id":"a2-36","frame":"Blog","framePt":"Blog","title":"Summer camp","titlePt":"Acampamento de férias","body":["This summer I spent two weeks at a camp by a lake. The first night was {the} [scary:s] night of the camp: there were strange noises in the forest! In the second week I made new friends. It was {much} [fun:c] {than} the first week. I want to go again next year!"],"pt":["Neste verão eu passei duas semanas num acampamento perto de um lago. A primeira noite foi a noite mais assustadora do acampamento: havia barulhos estranhos na floresta! Na segunda semana eu fiz amigos novos. Foi muito mais divertido do que a primeira semana. Quero ir de novo no ano que vem!"],"w":{"spent":"passei","camp":"acampamento","lake":"lago","noises":"barulhos","forest":"floresta"},"notes":[null,{"en":"fun is special: more fun / the most fun, never funner or funnest.","pt":"fun é especial: more fun / the most fun, nunca funner nem funnest."}]},{"id":"a2-37","frame":"Movie review","framePt":"Crítica de cinema","title":"Robots 2","titlePt":"Robots 2","body":["I saw “Robots 2” at the movies last night. It is [long:c] {than} the first movie: almost three hours! The story is a bit slow. But the special effects are [good:c] {than} in the first movie, and the music is fantastic. Go and see it!"],"pt":["Eu vi “Robots 2” no cinema ontem à noite. Ele é mais longo do que o primeiro filme: quase três horas! A história é um pouco lenta. Mas os efeitos especiais são melhores do que no primeiro filme, e a música é fantástica. Vá assistir!"],"w":{"at the movies":"no cinema","almost":"quase","slow":"lenta","special effects":"efeitos especiais"}},{"id":"a2-38","frame":"Blog","framePt":"Blog","title":"A gift for Dad","titlePt":"Um presente para o papai","body":["Choosing a gift for my dad is always {the} [difficult:s] part of his birthday. He says he doesn't need anything! This year I went to five stores. In the end, I found {the} [silly:s] T-shirt in the mall: it has a cat playing the guitar. Dad loved it!"],"pt":["Escolher um presente para o meu pai é sempre a parte mais difícil do aniversário dele. Ele diz que não precisa de nada! Este ano eu fui a cinco lojas. No fim, eu achei a camiseta mais boba do shopping: ela tem um gato tocando guitarra. O papai adorou!"],"w":{"choosing":"escolher","gift":"presente","in the end":"no fim","found":"achei","mall":"shopping"}},{"id":"a2-39","frame":"Blog","framePt":"Blog","title":"Pasta day","titlePt":"Dia de massa","body":["On Saturday I took a cooking class. We made pasta by hand. Homemade pasta is [delicious:c] {than} pasta from a box, but it takes a long time. My pasta was [thick:c] {than} the chef's pasta, and it was hard to eat! Next time I'll be more careful."],"pt":["No sábado eu fiz uma aula de culinária. Nós fizemos massa à mão. Massa caseira é mais deliciosa do que massa de caixinha, mas demora muito. A minha massa ficou mais grossa do que a massa do chef, e estava difícil de comer! Da próxima vez vou ter mais cuidado."],"w":{"cooking class":"aula de culinária","by hand":"à mão","homemade":"caseira","takes a long time":"demora muito"}},{"id":"a2-40","frame":"Travel blog","framePt":"Blog de viagem","title":"Oslo and Rome","titlePt":"Oslo e Roma","body":["This year I visited two very different cities. In March, Oslo was {much} [cold:c] {than} Rome: it snowed every day! Rome was beautiful, but it was {the} [crowded:s] city of my trip. There were long lines at every museum. Next time I'll visit in winter."],"pt":["Este ano eu visitei duas cidades muito diferentes. Em março, Oslo estava muito mais fria do que Roma: nevou todo dia! Roma era linda, mas foi a cidade mais lotada da minha viagem. Havia filas longas em todos os museus. Da próxima vez vou visitar no inverno."],"w":{"different":"diferentes","snowed":"nevou","trip":"viagem","lines":"filas"}},{"id":"a2-41","frame":"Message","framePt":"Mensagem","title":"Grandma's smartphone","titlePt":"O smartphone da vovó","body":["My grandma is 80, and last week she got her first smartphone. It is [light:c] {than} her old phone, and the screen is big. Now she sends me photos of her garden every day. She says she is {the} [happy:s] grandma in the world!"],"pt":["A minha avó tem 80 anos, e semana passada ela ganhou o primeiro smartphone dela. Ele é mais leve do que o celular antigo dela, e a tela é grande. Agora ela me manda fotos do jardim dela todo dia. Ela diz que é a avó mais feliz do mundo!"],"w":{"got":"ganhou","screen":"tela","sends":"manda","garden":"jardim"}},{"id":"a2-42","frame":"Blog","framePt":"Blog","title":"Mountain hike","titlePt":"Trilha na montanha","body":["On Sunday we hiked up a mountain near our town. The second trail was [steep:c] {than} the first one, and my legs hurt. After four hours we got to the top. It was {the} [amazing:s] view of my life! We took lots of photos."],"pt":["No domingo nós subimos uma montanha perto da nossa cidade. A segunda trilha era mais íngreme do que a primeira, e as minhas pernas doeram. Depois de quatro horas, nós chegamos ao topo. Foi a vista mais incrível da minha vida! Nós tiramos muitas fotos."],"w":{"hiked":"subimos (fizemos trilha)","trail":"trilha","legs":"pernas","hurt":"doeram","view":"vista"}},{"id":"a2-43","frame":"News","framePt":"Notícia","title":"The music festival","titlePt":"O festival de música","body":["The city music festival was on Saturday. The crowd was [large:c] {than} last year: more than 20,000 people! Twelve bands played in the park. The last band, The Lights, was {the} [popular:s] band of the night. Everybody sang with them."],"pt":["O festival de música da cidade foi no sábado. O público foi maior do que no ano passado: mais de 20 mil pessoas! Doze bandas tocaram no parque. A última banda, The Lights, foi a banda mais popular da noite. Todo mundo cantou com eles."],"w":{"crowd":"público, multidão","bands":"bandas","played":"tocaram","sang":"cantou"}},{"id":"a2-44","frame":"Ad","framePt":"Anúncio","title":"Fresh Market","titlePt":"Fresh Market","body":["Come to Fresh Market on Green Street! We have {the} [fresh:s] fruit and vegetables in town. Everything comes from local farms. And we have {the} [low:s] prices in the neighborhood. Open every day from 7 a.m. to 10 p.m."],"pt":["Venha ao Fresh Market, na Green Street! Nós temos as frutas e verduras mais frescas da cidade. Tudo vem de fazendas da região. E nós temos os preços mais baixos do bairro. Aberto todos os dias, das 7h às 22h."],"w":{"vegetables":"verduras, legumes","local":"da região","farms":"fazendas","prices":"preços","neighborhood":"bairro"}},{"id":"a2-45","frame":"Blog","framePt":"Blog","title":"The new gym","titlePt":"A academia nova","body":["Last month I changed gyms. The new gym is [close:c] to my house {than} the old one, so I can walk there. It has more machines and a pool. But the evening classes are [busy:c] {than} the morning classes, so now I go at 7 a.m.!"],"pt":["Mês passado eu troquei de academia. A academia nova é mais perto da minha casa do que a antiga, então eu posso ir a pé. Ela tem mais aparelhos e uma piscina. Mas as aulas da noite são mais cheias do que as aulas da manhã, então agora eu vou às 7h!"],"w":{"changed":"troquei","gyms":"academias","walk":"ir a pé","machines":"aparelhos"}},{"id":"a2-46","frame":"Blog","framePt":"Blog","title":"The art museum","titlePt":"O museu de arte","body":["On Saturday I went to the new art museum with my cousin. The modern art room was {the} [strange:s] room in the museum: there was a banana on the wall! The old paintings were [colorful:c] {than} I expected. My cousin loved the banana. I didn't understand it!"],"pt":["No sábado eu fui ao museu de arte novo com o meu primo. A sala de arte moderna era a sala mais estranha do museu: tinha uma banana na parede! Os quadros antigos eram mais coloridos do que eu esperava. O meu primo adorou a banana. Eu não entendi!"],"w":{"cousin":"primo","wall":"parede","paintings":"quadros","understand":"entender"}},{"id":"a2-47","frame":"Diary","framePt":"Diário","title":"What a day!","titlePt":"Que dia!","body":["What a day! It was [rainy:c] {than} yesterday, and I forgot my umbrella. Then my bus was [late:c] {than} usual, so I missed the start of my English class. At night, my favorite show wasn't on TV. Tomorrow will be better!"],"pt":["Que dia! Estava mais chuvoso do que ontem, e eu esqueci o meu guarda-chuva. Depois, o meu ônibus chegou mais tarde do que o normal, então eu perdi o começo da aula de inglês. À noite, o meu programa favorito não passou na TV. Amanhã vai ser melhor!"],"w":{"forgot":"esqueci","umbrella":"guarda-chuva","usual":"o normal","missed":"perdi","start":"começo"}},{"id":"a2-48","frame":"Sports news","framePt":"Notícia de esporte","title":"The final","titlePt":"A final","body":["On Saturday our basketball team played {the} [exciting:s] game of the season: the final! The other team's players were taller, but we ran more. Our coach says we were {the} [fit:s] team in the league. We won by ten points!"],"pt":["No sábado o nosso time de basquete jogou o jogo mais emocionante da temporada: a final! Os jogadores do outro time eram mais altos, mas nós corremos mais. O nosso técnico diz que nós éramos o time mais em forma da liga. Nós ganhamos por dez pontos!"],"w":{"season":"temporada","players":"jogadores","coach":"técnico","league":"liga","won":"ganhamos"}}],"B1":[{"id":"b1-01","frame":"Forum post","framePt":"Post de fórum","title":"Which laptop?","titlePt":"Qual notebook?","body":["I need a new laptop for university, and I can't decide between {two models}. The Zento is very light, but the Mira has a big screen and a great keyboard. For a student who travels a lot, {which one} is [practical:c]? Price matters too, and the Mira is {200 dollars} [cheap:c]. Any advice would be welcome!"],"pt":["Preciso de um notebook novo para a faculdade, e não consigo decidir entre dois modelos. O Zento é bem leve, mas o Mira tem uma tela grande e um teclado ótimo. Para um estudante que viaja muito, qual é mais prático? O preço também importa, e o Mira é 200 dólares mais barato. Qualquer conselho é bem-vindo!"],"w":{"decide":"decidir","light":"leve","screen":"tela","keyboard":"teclado","travels":"viaja","matters":"importa","advice":"conselho","welcome":"bem-vindo"},"notes":[{"en":"Two things compared (two models, which one?): comparative, even without than.","pt":"Duas coisas comparadas (two models, which one?): comparativo, mesmo sem than."},{"en":"A number + comparative: 200 dollars cheaper. The than part (than the Zento) is understood.","pt":"Número + comparativo: 200 dollars cheaper (200 dólares mais barato). O than the Zento fica subentendido."}]},{"id":"b1-02","frame":"Story","framePt":"História","title":"A camping trip","titlePt":"Um acampamento","body":["Last year my family went camping in the mountains. It was supposed to be relaxing, but it turned into {the} [bad:s] vacation we've {ever} had. On the first night, a storm destroyed our tent. The second night was {even} [cold:c], and we hardly slept. Now we laugh about it, but at the time nobody was laughing!"],"pt":["No ano passado a minha família foi acampar nas montanhas. Era para ser relaxante, mas acabou sendo as piores férias que já tivemos. Na primeira noite, uma tempestade destruiu a nossa barraca. A segunda noite foi ainda mais fria, e quase não dormimos. Hoje a gente ri disso, mas na hora ninguém estava rindo!"],"w":{"camping":"acampar","supposed to be":"era para ser","relaxing":"relaxante","turned into":"acabou sendo","storm":"tempestade","destroyed":"destruiu","tent":"barraca","hardly":"quase não","at the time":"na hora"},"notes":[{"en":"the + superlative + I've ever …: the worst vacation we've ever had.","pt":"the + superlativo + I've ever …: the worst vacation we've ever had (as piores férias que já tivemos)."},{"en":"even + comparative = ainda mais: even colder (than the first night).","pt":"even + comparativo = ainda mais: even colder (ainda mais fria do que a primeira noite)."}]},{"id":"b1-03","frame":"Magazine","framePt":"Revista","title":"Small changes","titlePt":"Pequenas mudanças","body":["Many people think that eating well is complicated, but small changes can make a big difference. For example, water is a much [healthy:c] drink {than} soda. Walking to work is {one of the} [easy:s] ways to stay active, and it costs nothing. You don't have to be perfect. Just try to be a little more careful about what you eat every day."],"pt":["Muita gente acha que comer bem é complicado, mas pequenas mudanças podem fazer uma grande diferença. Por exemplo, a água é uma bebida muito mais saudável do que o refrigerante. Ir a pé para o trabalho é uma das formas mais fáceis de se manter ativo, e não custa nada. Você não precisa ser perfeito. Só tente ter um pouco mais de cuidado com o que você come todo dia."],"w":{"complicated":"complicado","changes":"mudanças","soda":"refrigerante","stay active":"manter-se ativo","costs":"custa","careful":"cuidadoso"},"notes":[{"en":"healthy has 2 syllables but ends in -y: healthier, not more healthy.","pt":"healthy tem 2 sílabas mas termina em -y: healthier, não more healthy."},{"en":"one of the + superlative + plural noun: one of the easiest ways.","pt":"one of the + superlativo + substantivo no plural: one of the easiest ways (uma das formas mais fáceis)."}]},{"id":"b1-04","frame":"Opinion","framePt":"Opinião","title":"Learning online","titlePt":"Estudar online","body":["These days, many people take courses online instead of going to a classroom. It's certainly {one of the} [convenient:s] ways to learn, because you can study whenever you want. However, it's easy to get distracted at home. In my opinion, {the} [big:s] problem with online learning is loneliness. Nothing replaces a good conversation with classmates."],"pt":["Hoje em dia, muitas pessoas fazem cursos online em vez de ir a uma sala de aula. Com certeza é uma das formas mais convenientes de aprender, porque você pode estudar quando quiser. Por outro lado, é fácil se distrair em casa. Na minha opinião, o maior problema do ensino online é a solidão. Nada substitui uma boa conversa com os colegas."],"w":{"instead of":"em vez de","certainly":"com certeza","whenever":"sempre que","however":"por outro lado","distracted":"distraído","loneliness":"solidão","replaces":"substitui","classmates":"colegas de turma"}},{"id":"b1-05","frame":"Blog","framePt":"Blog","title":"Summer on the farm","titlePt":"Verão na fazenda","body":["Every summer I visit my grandparents, who live on a farm in the north. It's {the} [far:s] place I've {ever} driven to on my own: almost 600 kilometers from home! The journey is long and tiring. But life on the farm is much [peaceful:c] {than} life in the city, and I always come back feeling relaxed."],"pt":["Todo verão eu visito os meus avós, que moram numa fazenda no norte. É o lugar mais distante para onde eu já dirigi sozinho: quase 600 quilômetros de casa! A viagem é longa e cansativa. Mas a vida na fazenda é muito mais tranquila do que a vida na cidade, e eu sempre volto relaxado."],"w":{"grandparents":"avós","farm":"fazenda","driven":"dirigido","on my own":"sozinho","almost":"quase","journey":"viagem","tiring":"cansativo"},"notes":[{"en":"far is irregular: far → farther → the farthest (British English also uses further / furthest).","pt":"far é irregular: far → farther → the farthest (no inglês britânico também further / furthest)."},null]},{"id":"b1-06","frame":"Office newsletter","framePt":"Informativo do escritório","title":"The office party","titlePt":"A festa do escritório","body":["Our team tried three new restaurants this month for the office party. Bella Roma was nice, but the service was slow. Green Garden was {even} [bad:c]: we waited an hour for our food! Finally, we tried Casa Lima. The staff there were {the} [friendly:s] {of all three}, and the food was excellent, so we booked it."],"pt":["A nossa equipe experimentou três restaurantes novos neste mês para a festa do escritório. O Bella Roma era legal, mas o atendimento era lento. O Green Garden foi ainda pior: esperamos uma hora pela comida! Por fim, experimentamos o Casa Lima. Os funcionários de lá eram os mais simpáticos dos três, e a comida era excelente, então fizemos a reserva."],"w":{"we tried":"experimentamos","team":"equipe","tried":"experimentou","service":"atendimento","waited":"esperamos","finally":"por fim","staff":"funcionários","booked":"reservamos"},"notes":[{"en":"even + comparative: even worse (than Bella Roma).","pt":"even + comparativo: even worse (ainda pior do que o Bella Roma)."},{"en":"Three or more: superlative (the friendliest of all three).","pt":"Três ou mais: superlativo (the friendliest of all three = os mais simpáticos dos três)."}]},{"id":"b1-07","frame":"Blog","framePt":"Blog","title":"Learning Japanese","titlePt":"Aprendendo japonês","body":["When I started learning Japanese, my teacher gave me one piece of advice: {the more} you listen, {the} [good:c] you speak. She was right. I watched cartoons every day, and my progress surprised everyone. Japanese grammar isn't {as} [difficult:b] {as} people think; the writing system is the real challenge!"],"pt":["Quando eu comecei a aprender japonês, a minha professora me deu um conselho: quanto mais você ouve, melhor você fala. Ela tinha razão. Eu assisti desenhos animados todo dia, e o meu progresso surpreendeu todo mundo. A gramática japonesa não é tão difícil quanto as pessoas pensam; o sistema de escrita é o verdadeiro desafio!"],"w":{"piece of advice":"conselho","cartoons":"desenhos animados","progress":"progresso","surprised":"surpreendeu","writing system":"sistema de escrita","challenge":"desafio"},"notes":[{"en":"the + comparative …, the + comparative = quanto mais…, melhor…: the more you listen, the better you speak. The \"the\" here doesn't make a superlative!","pt":"the + comparativo …, the + comparativo = quanto mais…, melhor…: the more you listen, the better you speak. Esse \"the\" não forma superlativo!"},{"en":"as + plain adjective + as = tão … quanto: isn't as difficult as.","pt":"as + adjetivo simples + as = tão … quanto: isn't as difficult as (não é tão difícil quanto)."}]},{"id":"b1-08","frame":"News","framePt":"Notícia","title":"Rents keep rising","titlePt":"Os aluguéis não param de subir","body":["Rents in the city center are getting {more and} [expensive:c] every year. According to a new report, a small apartment now costs 40% more than it did in 2020. {By far} {the} [big:s] increase was in the old town, where prices have doubled. Many young people are moving to the suburbs instead."],"pt":["Os aluguéis no centro da cidade estão ficando cada vez mais caros. Segundo um novo relatório, um apartamento pequeno hoje custa 40% a mais do que custava em 2020. O maior aumento, de longe, foi no centro histórico, onde os preços dobraram. Muitos jovens estão se mudando para os subúrbios."],"w":{"rents":"aluguéis","according to":"segundo","report":"relatório","increase":"aumento","old town":"centro histórico","doubled":"dobraram","suburbs":"subúrbios","instead":"em vez disso"},"notes":[{"en":"more and more + adjective = cada vez mais: more and more expensive. Short adjectives repeat the -er form: hotter and hotter.","pt":"more and more + adjetivo = cada vez mais: more and more expensive. Adjetivos curtos repetem a forma -er: hotter and hotter (cada vez mais quente)."},{"en":"by far the + superlative = de longe o…: by far the biggest increase.","pt":"by far the + superlativo = de longe o…: by far the biggest increase (de longe o maior aumento)."}]},{"id":"b1-09","frame":"Opinion","framePt":"Opinião","title":"Do we need a new stadium?","titlePt":"Precisamos de um estádio novo?","body":["The city wants to build a new soccer stadium, but I don't think we need one. The old stadium is [big:b] {enough} for our team: it's never full. The new project would cost 300 million dollars. With that money, we could build {the} [modern:s] hospital in the country."],"pt":["A prefeitura quer construir um novo estádio de futebol, mas eu não acho que precisamos de um. O estádio antigo é grande o suficiente para o nosso time: ele nunca fica cheio. O novo projeto custaria 300 milhões de dólares. Com esse dinheiro, poderíamos construir o hospital mais moderno do país."],"w":{"build":"construir","full":"cheio","project":"projeto","would cost":"custaria","could":"poderíamos"},"notes":[{"en":"adjective + enough = … o suficiente: big enough. The adjective stays plain, and enough comes after it.","pt":"adjetivo + enough = … o suficiente: big enough (grande o suficiente). O adjetivo fica simples, e o enough vem depois."},null]},{"id":"b1-10","frame":"Story","framePt":"História","title":"Sharing an apartment","titlePt":"Dividindo um apartamento","body":["When I moved to Dublin, I shared an apartment with Lucy. Her room was twice {as} [big:b] {as} mine, but we paid the same rent. It didn't seem fair. Still, living with her was {far} [good:c] {than} living alone, and we're still best friends."],"pt":["Quando eu me mudei para Dublin, eu dividi um apartamento com a Lucy. O quarto dela era duas vezes maior que o meu, mas nós pagávamos o mesmo aluguel. Não parecia justo. Mesmo assim, morar com ela era muito melhor do que morar sozinho, e ainda somos melhores amigos."],"w":{"shared":"dividi","rent":"aluguel","seem":"parecer","fair":"justo","alone":"sozinho"},"notes":[{"en":"twice as + plain adjective + as = duas vezes mais…: twice as big as. No -er!","pt":"twice as + adjetivo simples + as = duas vezes mais…: twice as big as (duas vezes maior que). Sem -er!"},{"en":"far + comparative = muito mais: far better (like much better).","pt":"far + comparativo = muito mais: far better (muito melhor, como much better)."}]},{"id":"b1-11","frame":"Advice column","framePt":"Coluna de conselhos","title":"Which university?","titlePt":"Qual universidade?","body":["Dear Sam, I got into two universities. One is {the second} [old:s] university in the country, and it has a great reputation. The other is newer, but it's in my hometown. My parents think the old one is {too} [far:b] from home. What should I do?","Maria"],"pt":["Querido Sam, eu passei em duas universidades. Uma é a segunda universidade mais antiga do país, e tem uma ótima reputação. A outra é mais nova, mas fica na minha cidade natal. Os meus pais acham que a antiga fica longe demais de casa. O que eu devo fazer?","Maria"],"w":{"got into":"passei em","reputation":"reputação","hometown":"cidade natal","should":"devo"},"notes":[{"en":"the second / third + superlative: the second oldest = a segunda mais antiga.","pt":"the second / third + superlativo: the second oldest = a segunda mais antiga."},{"en":"too + plain adjective = … demais: too far = longe demais.","pt":"too + adjetivo simples = … demais: too far = longe demais."}]},{"id":"b1-12","frame":"Magazine","framePt":"Revista","title":"Electric cars","titlePt":"Carros elétricos","body":["Electric cars are becoming more popular, and it's easy to see why. They are [cheap:c] to run {than} gas cars, and they need fewer repairs. One study even found that their owners drive [carefully:c] {than} other drivers. The only problem is the price: buying one is still slightly more expensive."],"pt":["Os carros elétricos estão ficando mais populares, e é fácil entender por quê. Eles são mais baratos de manter do que os carros a gasolina, e precisam de menos consertos. Um estudo até descobriu que os donos deles dirigem com mais cuidado do que os outros motoristas. O único problema é o preço: comprar um ainda é um pouco mais caro."],"w":{"becoming":"ficando","run":"manter (um carro)","gas":"gasolina","repairs":"consertos","owners":"donos","found":"descobriu","slightly":"um pouco"},"notes":[null,{"en":"Adverbs compare too: carefully → more carefully, fast → faster, well → better.","pt":"Advérbios também comparam: carefully → more carefully (com mais cuidado), fast → faster, well → better."}]},{"id":"b1-13","frame":"Opinion","framePt":"Opinião","title":"Working from home","titlePt":"Trabalhar de casa","body":["Since 2020, many companies have let their staff work from home. For most workers, it's {far} [comfortable:c] {than} spending two hours a day in traffic. But is it really {the} [productive:s] way to work? Studies don't agree, and many managers want their teams back in the office."],"pt":["Desde 2020, muitas empresas deixam os funcionários trabalharem de casa. Para a maioria dos trabalhadores, é muito mais confortável do que passar duas horas por dia no trânsito. Mas será que é mesmo a forma mais produtiva de trabalhar? Os estudos não concordam, e muitos gerentes querem as equipes de volta no escritório."],"w":{"let":"deixar","staff":"funcionários","workers":"trabalhadores","traffic":"trânsito","really":"mesmo, de verdade","studies":"estudos","agree":"concordar","managers":"gerentes","back":"de volta"}},{"id":"b1-14","frame":"Review","framePt":"Avaliação","title":"The new science museum","titlePt":"O novo museu de ciências","body":["Last Saturday we finally visited the new science museum. Honestly, it isn't {as} [good:b] {as} the reviews say. The exhibitions were small, and the tickets were {even} [expensive:c] {than} at the old museum. Next time, I'll stay home and watch a documentary."],"pt":["No sábado passado nós finalmente visitamos o novo museu de ciências. Sinceramente, ele não é tão bom quanto as avaliações dizem. As exposições eram pequenas, e os ingressos eram ainda mais caros do que no museu antigo. Da próxima vez, eu vou ficar em casa e assistir a um documentário."],"w":{"finally":"finalmente","honestly":"sinceramente","reviews":"avaliações","exhibitions":"exposições","tickets":"ingressos","documentary":"documentário"},"notes":[{"en":"as + plain adjective + as, even with irregular ones: as good as (never as better as).","pt":"as + adjetivo simples + as, mesmo com os irregulares: as good as (tão bom quanto), nunca as better as."},{"en":"even + comparative = ainda mais: even more expensive.","pt":"even + comparativo = ainda mais: even more expensive (ainda mais caro)."}]},{"id":"b1-15","frame":"Blog","framePt":"Blog","title":"From a village to London","titlePt":"De uma vila para Londres","body":["When I moved from a small village to London, I learned an important lesson: {the} [big:c] the city, {the} [expensive:c] the rent. My new room costs three times more than my old house! But life here is never boring, and I've met people from all over the world. Still, sometimes I miss the quiet of the countryside."],"pt":["Quando eu me mudei de uma vila pequena para Londres, eu aprendi uma lição importante: quanto maior a cidade, mais caro o aluguel. O meu quarto novo custa três vezes mais do que a minha casa antiga! Mas a vida aqui nunca é chata, e eu conheci pessoas do mundo todo. Mesmo assim, às vezes eu sinto falta da tranquilidade do campo."],"w":{"village":"vila","learned":"aprendi","lesson":"lição","rent":"aluguel","three times":"três vezes","boring":"chato","met":"conheci","all over the world":"do mundo todo","miss":"sentir falta de","countryside":"campo, interior"},"notes":[{"en":"the + comparative, the + comparative = quanto mais…, mais…: the bigger the city, the more expensive the rent. These \"the\"s don't make superlatives!","pt":"the + comparativo, the + comparativo = quanto mais…, mais…: the bigger the city, the more expensive the rent (quanto maior a cidade, mais caro o aluguel). Esses \"the\" não formam superlativo!"},null]},{"id":"b1-16","frame":"Magazine","framePt":"Revista","title":"Pack light!","titlePt":"Viaje leve!","body":["{One of the} [bad:s] mistakes travelers make is packing too much. By the third day, their suitcases are {too} [heavy:b] to carry up the stairs. Experts say you only need half of what you think. Leave the \"just in case\" clothes at home!"],"pt":["Um dos piores erros que os viajantes cometem é levar coisas demais. No terceiro dia, as malas estão pesadas demais para carregar escada acima. Os especialistas dizem que você só precisa de metade do que acha. Deixe as roupas \"para o caso de\" em casa!"],"w":{"mistakes":"erros","travelers":"viajantes","packing":"fazer a mala","suitcases":"malas","carry":"carregar","stairs":"escada","experts":"especialistas","half":"metade","just in case":"para o caso de precisar"},"notes":[{"en":"one of the + superlative + plural noun: one of the worst mistakes.","pt":"one of the + superlativo + substantivo no plural: one of the worst mistakes (um dos piores erros)."},{"en":"too + plain adjective = … demais: too heavy.","pt":"too + adjetivo simples = … demais: too heavy (pesado demais)."}]},{"id":"b1-17","frame":"Magazine","framePt":"Revista","title":"Are we sleeping enough?","titlePt":"Estamos dormindo o suficiente?","body":["People are sleeping less and less, and doctors say the effects are getting {more and} [serious:c]. Teenagers are {the} [sleepy:s] group {of all}, mostly because of their phones. The advice is simple: no screens in the bedroom at night. Easier said than done!"],"pt":["As pessoas estão dormindo cada vez menos, e os médicos dizem que os efeitos estão ficando cada vez mais sérios. Os adolescentes são o grupo mais sonolento de todos, principalmente por causa do celular. O conselho é simples: nada de telas no quarto à noite. Falar é fácil, difícil é fazer!"],"w":{"less and less":"cada vez menos","effects":"efeitos","teenagers":"adolescentes","mostly":"principalmente","because of":"por causa de","advice":"conselho","screens":"telas","said than done":"(falar é fácil,) difícil é fazer"},"notes":[{"en":"more and more + long adjective = cada vez mais: more and more serious.","pt":"more and more + adjetivo longo = cada vez mais: more and more serious (cada vez mais sérios)."},null]},{"id":"b1-18","frame":"Blog","framePt":"Blog","title":"Not old enough","titlePt":"Novo demais","body":["Last month I applied for a summer job at a TV station. Sadly, they told me I wasn't [old:b] {enough}: you have to be 20, and I'm only 19. I was disappointed, but next summer I'll be {a year} [old:c], so I'll apply again! Until then, I'm working at my uncle's café."],"pt":["No mês passado eu me candidatei a um trabalho de verão numa emissora de TV. Infelizmente, eles me disseram que eu não tinha idade suficiente: é preciso ter 20 anos, e eu só tenho 19. Eu fiquei decepcionado, mas no próximo verão eu vou estar um ano mais velho, então vou me candidatar de novo! Até lá, eu estou trabalhando no café do meu tio."],"w":{"applied":"me candidatei","TV station":"emissora de TV","sadly":"infelizmente","disappointed":"decepcionado","apply":"candidatar-se","again":"de novo","until then":"até lá"},"notes":[{"en":"old enough = com idade suficiente: the adjective stays plain before enough.","pt":"old enough = com idade suficiente: o adjetivo fica simples antes de enough."},{"en":"A number + comparative: a year older, two hours longer, 10 dollars cheaper.","pt":"Número + comparativo: a year older (um ano mais velho), two hours longer, 10 dollars cheaper."}]},{"id":"b1-19","frame":"Magazine","framePt":"Revista","title":"Coffee or tea?","titlePt":"Café ou chá?","body":["Coffee and tea both contain caffeine, but a cup of coffee is much [strong:c] {than} a cup of tea. Some experts say green tea is {slightly} [good:c] for you {than} coffee, but the difference is small. So drink what you enjoy! Just don't drink either one late in the evening if you want to sleep well."],"pt":["O café e o chá têm cafeína, mas uma xícara de café é muito mais forte do que uma xícara de chá. Alguns especialistas dizem que o chá verde faz um pouco melhor à saúde do que o café, mas a diferença é pequena. Então beba o que você gosta! Só não beba nenhum dos dois tarde da noite se você quiser dormir bem."],"w":{"contain":"conter","cup":"xícara","experts":"especialistas","difference":"diferença","enjoy":"gostar, curtir","either one":"nenhum dos dois"},"notes":[null,{"en":"slightly + comparative = um pouco mais: slightly better.","pt":"slightly + comparativo = um pouco mais: slightly better (um pouco melhor)."}]},{"id":"b1-20","frame":"Science news","framePt":"Notícia de ciência","title":"The longest river","titlePt":"O rio mais longo","body":["The Nile is usually called {the} [long:s] river in the world, but some scientists believe the Amazon is actually longer. Either way, the Amazon carries {by far} {the} [large:s] amount of water: more than the next seven rivers together! The debate is about where each river really begins. Scientists may never agree!"],"pt":["O Nilo costuma ser chamado de o rio mais longo do mundo, mas alguns cientistas acreditam que o Amazonas é, na verdade, mais longo. De qualquer forma, o Amazonas carrega, de longe, a maior quantidade de água: mais do que os sete rios seguintes juntos! A discussão é sobre onde cada rio realmente começa. Talvez os cientistas nunca cheguem a um acordo!"],"w":{"usually":"geralmente","scientists":"cientistas","believe":"acreditar","actually":"na verdade","either way":"de qualquer forma","carries":"carrega","amount":"quantidade","together":"juntos","debate":"discussão, debate","begins":"começa"}},{"id":"b1-21","frame":"Blog","framePt":"Blog","title":"Choosing a gym","titlePt":"Escolhendo uma academia","body":["Before joining a gym, I compared two places near my office. FitZone is twice {as} [expensive:b] {as} PowerGym, but it has a pool and {much} [modern:c] equipment. In the end, I chose PowerGym: I only need a treadmill and some weights! It's half the price, and it's open 24 hours."],"pt":["Antes de entrar numa academia, eu comparei dois lugares perto do meu escritório. A FitZone é duas vezes mais cara do que a PowerGym, mas tem piscina e equipamentos muito mais modernos. No fim, eu escolhi a PowerGym: eu só preciso de uma esteira e alguns pesos! Ela custa a metade, e fica aberta 24 horas."],"w":{"joining":"entrar em","compared":"comparei","pool":"piscina","equipment":"equipamentos","in the end":"no fim","chose":"escolhi","treadmill":"esteira","weights":"pesos","half the price":"metade do preço"},"notes":[{"en":"twice as + plain adjective + as = duas vezes mais…: twice as expensive as.","pt":"twice as + adjetivo simples + as = duas vezes mais…: twice as expensive as (duas vezes mais cara do que)."},{"en":"much + comparative, even without than: much more modern (than FitZone's).","pt":"much + comparativo, mesmo sem than: much more modern (muito mais modernos do que os da outra)."}]},{"id":"b1-22","frame":"Story","framePt":"História","title":"The first time I saw the ocean","titlePt":"A primeira vez que vi o mar","body":["When I was eight, my uncle took me to see the ocean for the first time. It was {the} [exciting:s] day of my childhood. The waves were huge, and the water was {even} [cold:c] {than} I expected. I spent the whole afternoon running away from the waves, screaming and laughing."],"pt":["Quando eu tinha oito anos, o meu tio me levou para ver o mar pela primeira vez. Foi o dia mais emocionante da minha infância. As ondas eram enormes, e a água estava ainda mais fria do que eu esperava. Eu passei a tarde inteira fugindo das ondas, gritando e rindo."],"w":{"uncle":"tio","ocean":"mar, oceano","childhood":"infância","waves":"ondas","huge":"enorme","expected":"esperava","spent":"passei","running away":"fugindo","screaming":"gritando","laughing":"rindo"}},{"id":"b1-23","frame":"Review","framePt":"Avaliação","title":"Book or film?","titlePt":"Livro ou filme?","body":["I read the novel before I saw the film, and in my opinion the book is {far} [good:c]. The film cuts {the} [important:s] scene of the whole story: the ending on the beach! Still, the actors are excellent, and the music is beautiful. I'd give the book five stars and the film three."],"pt":["Eu li o romance antes de ver o filme, e na minha opinião o livro é muito melhor. O filme corta a cena mais importante da história toda: o final na praia! Mesmo assim, os atores são excelentes, e a música é linda. Eu daria cinco estrelas para o livro e três para o filme."],"w":{"novel":"romance","cuts":"corta","scene":"cena","whole story":"história toda","ending":"final","still":"mesmo assim","actors":"atores","stars":"estrelas"},"notes":[{"en":"far + comparative, with the comparison understood: the book is far better (than the film).","pt":"far + comparativo, com a comparação subentendida: the book is far better (muito melhor do que o filme)."},null]},{"id":"b1-24","frame":"Blog","framePt":"Blog","title":"Two years in Toronto","titlePt":"Dois anos em Toronto","body":["I've been living in Toronto for two years now. At first, I was scared to speak English with strangers. But {the} [long:c] I live here, {the} [fluently:c] I speak. Now I even dream in English!"],"pt":["Eu moro em Toronto há dois anos. No começo, eu tinha medo de falar inglês com estranhos. Mas quanto mais tempo eu moro aqui, mais fluentemente eu falo. Agora eu até sonho em inglês!"],"w":{"at first":"no começo","scared":"com medo","strangers":"estranhos","even":"até","dream":"sonhar"},"notes":[{"en":"the + comparative, the + comparative = quanto mais…, mais…: the longer I live here, the more fluently I speak.","pt":"the + comparativo, the + comparativo = quanto mais…, mais…: the longer I live here (quanto mais tempo eu moro aqui), the more fluently I speak."},{"en":"Adverbs compare too: fluently → more fluently.","pt":"Advérbios também comparam: fluently → more fluently (mais fluentemente)."}]},{"id":"b1-25","frame":"Blog","framePt":"Blog","title":"Working from home","titlePt":"Trabalhando de casa","body":["Since March, I've been working from home three days a week. Honestly, I work [efficiently:c] {than} in the office: there are no meetings every hour! The only problem is space. My kitchen table isn't [large:b] {enough} for two screens, so I'm looking for a desk. My cat thinks the keyboard is her bed."],"pt":["Desde março, eu trabalho de casa três dias por semana. Sinceramente, eu trabalho de forma mais eficiente do que no escritório: não tem reunião toda hora! O único problema é o espaço. A minha mesa da cozinha não é grande o suficiente para duas telas, então estou procurando uma escrivaninha. A minha gata acha que o teclado é a cama dela."],"w":{"since":"desde","honestly":"sinceramente","meetings":"reuniões","screens":"telas","desk":"escrivaninha","keyboard":"teclado"},"notes":[{"en":"Adverbs with 3+ syllables take more / most: efficiently → more efficiently.","pt":"Advérbios com 3 ou mais sílabas levam more / most: efficiently → more efficiently."},{"en":"adjective + enough: large enough. The adjective stays plain, and enough comes after it.","pt":"adjetivo + enough: large enough (grande o suficiente). O adjetivo fica simples, e o enough vem depois."}]},{"id":"b1-26","frame":"Opinion","framePt":"Opinião","title":"City or small town?","titlePt":"Cidade grande ou pequena?","body":["People often ask me why I left the city for a small town. First, small towns are usually {much} [safe:c] {than} big cities: I can walk home at midnight without worrying. Houses are cheaper, too. But I have to admit that, for young people, the city is {by far} {the} [exciting:s] place to live. My teenage kids remind me of that every day!"],"pt":["As pessoas muitas vezes me perguntam por que eu troquei a cidade grande por uma cidade pequena. Primeiro, as cidades pequenas costumam ser muito mais seguras do que as cidades grandes: eu posso voltar a pé para casa à meia-noite sem me preocupar. As casas também são mais baratas. Mas eu tenho que admitir que, para os jovens, a cidade grande é, de longe, o lugar mais empolgante para morar. Os meus filhos adolescentes me lembram disso todos os dias!"],"w":{"often":"muitas vezes","left":"deixei","without worrying":"sem me preocupar","admit":"admitir","remind me":"me lembram"},"notes":[{"en":"much / far / a lot + comparative = muito mais…: much safer. Never very + comparative.","pt":"much / far / a lot + comparativo = muito mais…: much safer (muito mais seguro). Nunca very + comparativo."},{"en":"by far the + superlative = de longe o mais…: by far the most exciting.","pt":"by far the + superlativo = de longe o mais…: by far the most exciting (de longe o mais empolgante)."}]},{"id":"b1-27","frame":"Science news","framePt":"Notícia de ciência","title":"The fastest animal","titlePt":"O animal mais rápido","body":["Everyone knows that the cheetah is {the} [fast:s] land animal: it can run at about 110 kilometers per hour. But the peregrine falcon is {even} [fast:c]. When it dives to catch its prey, it can reach more than 300 kilometers per hour! No other animal on Earth can move like that. Scientists are still studying how its eyes and lungs cope with the speed."],"pt":["Todo mundo sabe que o guepardo é o animal terrestre mais rápido: ele pode correr a cerca de 110 quilômetros por hora. Mas o falcão-peregrino é ainda mais rápido. Quando ele mergulha para pegar a presa, pode passar de 300 quilômetros por hora! Nenhum outro animal da Terra consegue se mover assim. Os cientistas ainda estudam como os olhos e os pulmões dele aguentam a velocidade."],"w":{"land animal":"animal terrestre","dives":"mergulha","prey":"presa","reach":"alcançar","lungs":"pulmões","cope with":"aguentar, lidar com"},"notes":[null,{"en":"even + comparative = ainda mais…: even faster. It compares with something said before, so there's no than here.","pt":"even + comparativo = ainda mais…: even faster (ainda mais rápido). Compara com algo já dito, por isso aqui não tem than."}]},{"id":"b1-28","frame":"Advice column","framePt":"Coluna de conselhos","title":"Too nervous to speak?","titlePt":"Nervoso demais para falar?","body":["Dear Ana, I understand English well, but in class I'm {too} [nervous:b] to say a word. What can I do?","Lucas","Dear Lucas, you're not alone! Start with small things: answer one question per class. Remember: {the more} you speak, {the} [easy:c] it gets.","Ana"],"pt":["Querida Ana, eu entendo bem inglês, mas na aula eu fico nervoso demais para dizer uma palavra. O que eu posso fazer?","Lucas","Querido Lucas, você não está sozinho! Comece com coisas pequenas: responda uma pergunta por aula. Lembre-se: quanto mais você fala, mais fácil fica.","Ana"],"w":{"alone":"sozinho","per class":"por aula","remember":"lembre-se","gets":"fica"},"notes":[{"en":"too + plain adjective = … demais: too nervous to speak.","pt":"too + adjetivo simples = … demais: too nervous to speak (nervoso demais para falar)."},{"en":"the + comparative …, the + comparative = quanto mais…, mais…: the more you speak, the easier it gets. This the doesn't make a superlative!","pt":"the + comparativo …, the + comparativo = quanto mais…, mais…: the more you speak, the easier it gets (quanto mais você fala, mais fácil fica). Esse the não forma superlativo!"}]},{"id":"b1-29","frame":"Magazine","framePt":"Revista","title":"Sleep well","titlePt":"Durma bem","body":["Sleep is {one of the} [important:s] habits for good health, but many of us don't get enough. Experts recommend seven to nine hours a night for adults. One study found that people who sleep well feel {much} [happy:c] {than} people who sleep less than six hours. So turn off your phone and go to bed!"],"pt":["O sono é um dos hábitos mais importantes para a boa saúde, mas muitos de nós não dormem o suficiente. Os especialistas recomendam de sete a nove horas por noite para adultos. Um estudo descobriu que as pessoas que dormem bem se sentem muito mais felizes do que as que dormem menos de seis horas. Então desligue o celular e vá para a cama!"],"w":{"habits":"hábitos","health":"saúde","experts":"especialistas","recommend":"recomendam","turn off":"desligar"},"notes":[{"en":"one of the + superlative + plural noun: one of the most important habits.","pt":"one of the + superlativo + substantivo no plural: one of the most important habits (um dos hábitos mais importantes)."},null]},{"id":"b1-30","frame":"Tech review","framePt":"Análise de tecnologia","title":"The X7 or the X6?","titlePt":"O X7 ou o X6?","body":["Should you upgrade to the new X7? It is {much} [light:c] {than} the X6: only 150 grams. The battery also lasts {two hours} [long:c], which is great for travelers. However, the camera hasn't changed at all. If you take a lot of photos, keep your X6 and save 300 dollars."],"pt":["Vale a pena trocar pelo novo X7? Ele é muito mais leve do que o X6: só 150 gramas. A bateria também dura duas horas a mais, o que é ótimo para quem viaja. Mas a câmera não mudou nada. Se você tira muitas fotos, fique com o seu X6 e economize 300 dólares."],"w":{"upgrade":"trocar por um modelo novo","lasts":"dura","travelers":"viajantes","however":"no entanto","save":"economizar"},"notes":[null,{"en":"A number + comparative: two hours longer = duas horas a mais. The comparison (with the X6) is clear, so there's no than.","pt":"Número + comparativo: two hours longer (duas horas a mais). A comparação (com o X6) já está clara, por isso não tem than."}]},{"id":"b1-31","frame":"History","framePt":"História","title":"The Great Wall","titlePt":"A Grande Muralha","body":["The Great Wall of China is probably {the} [famous:s] structure in Asia. Many people think it was built all at once, but parts of it are {much} [old:c] {than} the stone sections you see in photos: the first walls were built more than 2,000 years ago. Different dynasties added new sections over the centuries. Today, visitors can walk on some parts, but others are slowly disappearing."],"pt":["A Grande Muralha da China é provavelmente a construção mais famosa da Ásia. Muita gente acha que ela foi construída de uma vez, mas partes dela são muito mais antigas do que as seções de pedra que você vê nas fotos: as primeiras muralhas foram construídas há mais de 2.000 anos. Diferentes dinastias acrescentaram novas seções ao longo dos séculos. Hoje, os visitantes podem caminhar em algumas partes, mas outras estão desaparecendo aos poucos."],"w":{"probably":"provavelmente","structure":"construção, estrutura","all at once":"de uma vez","dynasties":"dinastias","centuries":"séculos","disappearing":"desaparecendo"}},{"id":"b1-32","frame":"Email","framePt":"E-mail","title":"The job offer","titlePt":"A proposta de emprego","body":["Hi Dan, I need your advice. A company in the city offered me a job. The salary is {slightly} [good:c] {than} at my current job, and the work sounds interesting. The problem is the commute: it would be {twice as} [long:b] {as} it is now. Would you take it?","Carla"],"pt":["Oi, Dan, eu preciso do seu conselho. Uma empresa na cidade me ofereceu um emprego. O salário é um pouco melhor do que no meu emprego atual, e o trabalho parece interessante. O problema é o trajeto: ele seria duas vezes mais longo do que é agora. Você aceitaria?","Carla"],"w":{"advice":"conselho","offered":"ofereceu","salary":"salário","current":"atual","commute":"trajeto (casa–trabalho)"},"notes":[{"en":"slightly / a bit + comparative = um pouco mais…: slightly better.","pt":"slightly / a bit + comparativo = um pouco mais…: slightly better (um pouco melhor)."},{"en":"twice / three times as + plain adjective + as = duas / três vezes mais…: twice as long as.","pt":"twice / three times as + adjetivo simples + as = duas / três vezes mais…: twice as long as (duas vezes mais longo do que)."}]},{"id":"b1-33","frame":"Travel guide","framePt":"Guia de viagem","title":"When to visit Iceland","titlePt":"Quando visitar a Islândia","body":["When is {the} [good:s] time to visit Iceland? It depends on what you want to see. If you're hoping to see the northern lights, go between September and March. Summer is {much} [warm:c], and the sun hardly sets in June, but you won't see the lights. Either way, bring a good raincoat!"],"pt":["Quando é a melhor época para visitar a Islândia? Depende do que você quer ver. Se você espera ver a aurora boreal, vá entre setembro e março. O verão é muito mais quente, e o sol quase não se põe em junho, mas você não vai ver a aurora. De qualquer jeito, leve uma boa capa de chuva!"],"w":{"depends":"depende","northern lights":"aurora boreal","hardly":"quase não","sets":"se põe","either way":"de qualquer jeito","raincoat":"capa de chuva"},"notes":[null,{"en":"much + comparative = muito mais…: much warmer. The comparison (with the winter months) is clear, so there's no than.","pt":"much + comparativo = muito mais…: much warmer (muito mais quente). A comparação (com os meses de inverno) já está clara, por isso não tem than."}]},{"id":"b1-34","frame":"Story","framePt":"História","title":"The storm","titlePt":"A tempestade","body":["We were halfway up the mountain when the sky turned dark. As the storm came closer, the wind got [strong:c] {and} [strong:c]. My brother wanted to keep going, but I convinced him to turn back. Ten minutes later, it started to hail. We reached the car just in time, soaked but safe."],"pt":["Nós estávamos na metade da subida da montanha quando o céu escureceu. À medida que a tempestade se aproximava, o vento ficava cada vez mais forte. O meu irmão queria continuar, mas eu o convenci a voltar. Dez minutos depois, começou a cair granizo. Nós chegamos ao carro bem a tempo, encharcados mas em segurança."],"w":{"halfway":"na metade","keep going":"continuar","convinced":"convenci","turn back":"voltar","hail":"cair granizo","just in time":"bem a tempo","soaked":"encharcados"},"notes":[{"en":"comparative + and + comparative = cada vez mais…: stronger and stronger. With long adjectives: more and more difficult.","pt":"comparativo + and + comparativo = cada vez mais…: stronger and stronger (cada vez mais forte). Com adjetivos longos: more and more difficult."},null]},{"id":"b1-35","frame":"Opinion","framePt":"Opinião","title":"Are phones the problem?","titlePt":"O problema é o celular?","body":["Every week there's a new article about teenagers and their phones. In my opinion, social media isn't {as} [dangerous:b] {as} some parents believe: it's also how young people keep in touch with friends. Still, some apps are designed to keep us scrolling. Short-video apps are probably {the} [addictive:s] apps on our phones. The answer isn't to ban phones, but to use them wisely."],"pt":["Toda semana sai um artigo novo sobre adolescentes e celulares. Na minha opinião, as redes sociais não são tão perigosas quanto alguns pais acreditam: elas também são o jeito como os jovens mantêm contato com os amigos. Mesmo assim, alguns aplicativos são feitos para nos manter rolando a tela. Os aplicativos de vídeos curtos são provavelmente os aplicativos mais viciantes dos nossos celulares. A resposta não é proibir os celulares, mas usá-los com sabedoria."],"w":{"keep in touch":"manter contato","still":"mesmo assim","designed":"feitos, projetados","scrolling":"rolando a tela","ban":"proibir","wisely":"com sabedoria"},"notes":[{"en":"not as + plain adjective + as = não tão … quanto: isn't as dangerous as.","pt":"not as + adjetivo simples + as = não tão … quanto: isn't as dangerous as (não é tão perigoso quanto)."},null]},{"id":"b1-36","frame":"Science","framePt":"Ciências","title":"The Pacific","titlePt":"O Pacífico","body":["The Pacific is {by far} {the} [large:s] ocean on Earth: it is bigger than all the continents together. It is also {the} [deep:s]. In the Mariana Trench, the bottom is almost 11 kilometers below the surface. If you put Mount Everest there, its top would still be under water. Only a few people have ever been down there."],"pt":["O Pacífico é, de longe, o maior oceano da Terra: ele é maior do que todos os continentes juntos. Ele também é o mais profundo. Na Fossa das Marianas, o fundo fica a quase 11 quilômetros abaixo da superfície. Se você colocasse o Monte Everest lá, o topo dele ainda ficaria debaixo d'água. Só algumas pessoas já estiveram lá embaixo."],"w":{"together":"juntos","trench":"fossa","bottom":"fundo","below":"abaixo de","surface":"superfície"},"notes":[{"en":"by far the + superlative = de longe o mais…: by far the largest.","pt":"by far the + superlativo = de longe o mais…: by far the largest (de longe o maior)."},{"en":"A superlative can come without its noun when it's clear: It is also the deepest (ocean).","pt":"O superlativo pode vir sem o substantivo quando ele está claro: It is also the deepest (o mais profundo)."}]},{"id":"b1-37","frame":"Study tips","framePt":"Dicas de estudo","title":"Exam season","titlePt":"Época de provas","body":["Many students study for ten hours the night before an exam, and then forget everything a week later. Research shows that students who study [regularly:c] {than} their classmates remember much more. According to experts, testing yourself is {the} [effective:s] method of all: close your notes and try to remember. It feels hard, but it works!"],"pt":["Muitos alunos estudam dez horas na noite antes de uma prova, e depois esquecem tudo uma semana mais tarde. Pesquisas mostram que os alunos que estudam com mais regularidade do que os colegas lembram muito mais. Segundo os especialistas, testar a si mesmo é o método mais eficaz de todos: feche as anotações e tente lembrar. Parece difícil, mas funciona!"],"w":{"forget":"esquecem","research":"pesquisas","classmates":"colegas de turma","according to":"segundo","notes":"anotações","works":"funciona"},"notes":[{"en":"Adverbs with 3+ syllables take more / most: regularly → more regularly.","pt":"Advérbios com 3 ou mais sílabas levam more / most: regularly → more regularly."},null]},{"id":"b1-38","frame":"Blog","framePt":"Blog","title":"Learning to cook","titlePt":"Aprendendo a cozinhar","body":["When I moved out, I couldn't cook at all. My first soup was {too} [salty:b] to eat, and I burned the rice twice in one week! So I started watching cooking videos every night. Six months later, I cook {much} [well:c] {than} before. Last weekend my parents came for dinner, and my dad asked for the recipe!"],"pt":["Quando eu fui morar sozinho, eu não sabia cozinhar nada. A minha primeira sopa ficou salgada demais para comer, e eu queimei o arroz duas vezes numa semana! Então eu comecei a ver vídeos de culinária toda noite. Seis meses depois, eu cozinho muito melhor do que antes. No último fim de semana os meus pais vieram jantar, e o meu pai pediu a receita!"],"w":{"moved out":"fui morar sozinho","burned":"queimei","rice":"arroz","twice":"duas vezes","recipe":"receita"},"notes":[{"en":"too + plain adjective = … demais: too salty to eat.","pt":"too + adjetivo simples = … demais: too salty to eat (salgada demais para comer)."},{"en":"well is an adverb, and it's irregular: well → better → the best. Never more well.","pt":"well é um advérbio irregular: well → better → the best. Nunca more well."}]},{"id":"b1-39","frame":"Magazine","framePt":"Revista","title":"Electric scooters","titlePt":"Patinetes elétricos","body":["Electric scooters are everywhere now. For short trips, they are {far} [convenient:c] {than} buses: you don't have to wait, and you can leave them almost anywhere. Our town was {one of the} [early:s] towns in the country to have them, back in 2018. But not everyone is happy: some people ride on the sidewalk, which is dangerous for pedestrians."],"pt":["Os patinetes elétricos estão em todo lugar agora. Para trajetos curtos, eles são muito mais práticos do que os ônibus: você não precisa esperar, e pode deixá-los quase em qualquer lugar. A nossa cidade foi uma das primeiras do país a ter patinetes, lá em 2018. Mas nem todo mundo está feliz: algumas pessoas andam na calçada, o que é perigoso para os pedestres."],"w":{"scooters":"patinetes","everywhere":"em todo lugar","trips":"trajetos","ride":"andar","sidewalk":"calçada","pedestrians":"pedestres"},"notes":[{"en":"much / far / a lot + comparative = muito mais…: far more convenient. Never very + comparative.","pt":"much / far / a lot + comparativo = muito mais…: far more convenient (muito mais prático). Nunca very + comparativo."},{"en":"early → earlier → the earliest: early ends in consonant + y, so y becomes i.","pt":"early → earlier → the earliest: early termina em consoante + y, então o y vira i."}]},{"id":"b1-40","frame":"Travel forum","framePt":"Fórum de viagem","title":"Crete or Malta?","titlePt":"Creta ou Malta?","body":["My wife and I can't decide between Crete and Malta for our October vacation. {Which one} is [hot:c] at that time of year? We've read that Malta is {a bit} [small:c], so it's easier to see everything without a car. On the other hand, Crete has more beaches and mountains. Any advice would be welcome!"],"pt":["A minha esposa e eu não conseguimos decidir entre Creta e Malta para as nossas férias de outubro. Qual das duas é mais quente nessa época do ano? Nós lemos que Malta é um pouco menor, então é mais fácil ver tudo sem carro. Por outro lado, Creta tem mais praias e montanhas. Qualquer conselho é bem-vindo!"],"w":{"decide":"decidir","vacation":"férias","on the other hand":"por outro lado","advice":"conselho","welcome":"bem-vindo"},"notes":[{"en":"Which one is + comparative? = Qual dos dois é mais…? Two options are compared, so it's a comparative, even without than.","pt":"Which one is + comparativo? = Qual dos dois é mais…? Duas opções são comparadas, então é comparativo, mesmo sem than."},{"en":"slightly / a bit + comparative = um pouco mais…: a bit smaller.","pt":"slightly / a bit + comparativo = um pouco mais…: a bit smaller (um pouco menor)."}]},{"id":"b1-41","frame":"Story","framePt":"História","title":"The interview","titlePt":"A entrevista","body":["When the bank called me for an interview, I wasn't sure I was [experienced:b] {enough}: I had only worked there as an intern. The interview lasted two hours, and it was {the} [stressful:s] morning of my life. They asked me to solve a problem in front of five managers. A week later, they called again. I got the job!"],"pt":["Quando o banco me chamou para uma entrevista, eu não tinha certeza se era experiente o suficiente: eu só tinha trabalhado lá como estagiário. A entrevista durou duas horas, e foi a manhã mais estressante da minha vida. Eles me pediram para resolver um problema na frente de cinco gerentes. Uma semana depois, eles ligaram de novo. Eu consegui o emprego!"],"w":{"intern":"estagiário","lasted":"durou","solve":"resolver","managers":"gerentes"},"notes":[{"en":"adjective + enough: experienced enough = experiente o suficiente. The adjective stays plain, even when it's long.","pt":"adjetivo + enough: experienced enough (experiente o suficiente). O adjetivo fica simples, mesmo quando é longo."},null]},{"id":"b1-42","frame":"Opinion","framePt":"Opinião","title":"Book or movie?","titlePt":"Livro ou filme?","body":["Whenever a famous book becomes a movie, my friends and I argue about it. In my experience, the book is almost always [good:c] {than} the movie. A two-hour film can't show everything, so the characters lose part of their story. The book is also {far} [detailed:c]: you know what everyone is thinking. Still, some movies surprise me."],"pt":["Sempre que um livro famoso vira filme, os meus amigos e eu discutimos sobre isso. Na minha experiência, o livro é quase sempre melhor do que o filme. Um filme de duas horas não consegue mostrar tudo, então os personagens perdem parte da história. O livro também é muito mais detalhado: você sabe o que todo mundo está pensando. Mesmo assim, alguns filmes me surpreendem."],"w":{"whenever":"sempre que","argue":"discutir","characters":"personagens","lose":"perdem","still":"mesmo assim","surprise":"surpreendem"},"notes":[null,{"en":"detailed has 2 syllables and doesn't end in -y, so: far more detailed. The comparison with the movie is clear, so there's no than.","pt":"detailed tem 2 sílabas e não termina em -y, então: far more detailed (muito mais detalhado). A comparação com o filme já está clara, por isso não tem than."}]},{"id":"b1-43","frame":"Health","framePt":"Saúde","title":"Just walk","titlePt":"Caminhe!","body":["You don't need an expensive gym to stay healthy. Walking is {one of the} [easy:s] ways to exercise, and you can do it almost anywhere. It's also {the} [cheap:s]: all you need is a good pair of shoes. Doctors say thirty minutes a day is enough to protect your heart. So leave the car at home and take the stairs!"],"pt":["Você não precisa de uma academia cara para ficar saudável. Caminhar é uma das formas mais fáceis de se exercitar, e dá para fazer isso quase em qualquer lugar. Também é a mais barata: tudo o que você precisa é de um bom par de tênis. Os médicos dizem que trinta minutos por dia são suficientes para proteger o coração. Então deixe o carro em casa e vá de escada!"],"w":{"gym":"academia","exercise":"se exercitar","pair":"par","protect":"proteger","heart":"coração","stairs":"escada"},"notes":[{"en":"one of the + superlative + plural noun: one of the easiest ways.","pt":"one of the + superlativo + substantivo no plural: one of the easiest ways (uma das formas mais fáceis)."},null]},{"id":"b1-44","frame":"Ad","framePt":"Anúncio","title":"Lingo Language School","titlePt":"Escola de idiomas Lingo","body":["Is your English [good:b] {enough} for a job interview? At Lingo Language School, you'll speak from the first day. Our classes have six students or fewer, so you'll get lots of attention. Students learn {much} [fast:c] {than} with apps alone, and all our teachers are native speakers. Your first class is free!"],"pt":["O seu inglês é bom o suficiente para uma entrevista de emprego? Na Lingo Language School, você fala desde o primeiro dia. As nossas turmas têm seis alunos ou menos, então você recebe muita atenção. Os alunos aprendem muito mais rápido do que só com aplicativos, e todos os nossos professores são nativos. A primeira aula é grátis!"],"w":{"job interview":"entrevista de emprego","fewer":"menos","attention":"atenção","alone":"sozinhos, só","native speakers":"falantes nativos"},"notes":[{"en":"good enough: the adjective stays plain before enough. Never better enough.","pt":"good enough (bom o suficiente): o adjetivo fica simples antes de enough. Nunca better enough."},{"en":"fast is an adjective and an adverb: learn faster.","pt":"fast é adjetivo e advérbio: learn faster (aprender mais rápido)."}]},{"id":"b1-45","frame":"Nature","framePt":"Natureza","title":"Save the bees","titlePt":"Salvem as abelhas","body":["Bees are {one of the} [useful:s] insects on the planet. They pollinate about a third of the food we eat, from apples to almonds. Without them, fruit and vegetables would be {much} [expensive:c], and some would disappear from supermarkets. You can help by planting flowers on your balcony. Even a small pot makes a difference!"],"pt":["As abelhas são um dos insetos mais úteis do planeta. Elas polinizam cerca de um terço dos alimentos que comemos, das maçãs às amêndoas. Sem elas, as frutas e os legumes seriam muito mais caros, e alguns sumiriam dos supermercados. Você pode ajudar plantando flores na sua varanda. Até um vasinho faz diferença!"],"w":{"pollinate":"polinizam","a third":"um terço","almonds":"amêndoas","disappear":"sumir","balcony":"varanda","pot":"vaso"},"notes":[{"en":"one of the + superlative + plural noun: one of the most useful insects.","pt":"one of the + superlativo + substantivo no plural: one of the most useful insects (um dos insetos mais úteis)."},null]},{"id":"b1-46","frame":"Blog","framePt":"Blog","title":"Life in Berlin","titlePt":"A vida em Berlim","body":["I moved to Berlin two years ago, and I love it, but it isn't cheap anymore. My rent is {20 percent} [high:c] {than} when I arrived. The winters are hard, too. I knew they'd be cold, but they're {even} [dark:c] {than} I expected: in December, it's night at four o'clock! Thankfully, the summers make up for everything."],"pt":["Eu me mudei para Berlim há dois anos, e adoro a cidade, mas ela não é mais barata. O meu aluguel está 20 por cento mais alto do que quando eu cheguei. Os invernos também são difíceis. Eu sabia que seriam frios, mas eles são ainda mais escuros do que eu esperava: em dezembro, é noite às quatro horas! Ainda bem que os verões compensam tudo."],"w":{"anymore":"mais (não … mais)","rent":"aluguel","arrived":"cheguei","thankfully":"ainda bem","make up for":"compensar"},"notes":[{"en":"A number + comparative: 20 percent higher, two hours longer, a year older.","pt":"Número + comparativo: 20 percent higher, two hours longer (duas horas a mais), a year older."},{"en":"even + comparative = ainda mais…: even darker than I expected.","pt":"even + comparativo = ainda mais…: even darker than I expected (ainda mais escuros do que eu esperava)."}]},{"id":"b1-47","frame":"Review","framePt":"Avaliação","title":"The new science museum","titlePt":"O novo museu de ciências","body":["The new science museum opened last month, and it's already {the} [impressive:s] building in the city: a giant glass sphere by the river. The exhibitions are interactive, so kids can touch almost everything. Tickets are {ten dollars} [cheap:c] {than} at the art museum, and students get in free on Fridays. My only complaint: the café is tiny and always full."],"pt":["O novo museu de ciências abriu mês passado, e já é o prédio mais impressionante da cidade: uma esfera gigante de vidro na beira do rio. As exposições são interativas, então as crianças podem tocar em quase tudo. Os ingressos são dez dólares mais baratos do que no museu de arte, e estudantes entram de graça às sextas. A minha única reclamação: o café é minúsculo e está sempre cheio."],"w":{"already":"já","sphere":"esfera","exhibitions":"exposições","touch":"tocar","complaint":"reclamação","tiny":"minúsculo"},"notes":[null,{"en":"A number + comparative: ten dollars cheaper, two hours longer, a year older.","pt":"Número + comparativo: ten dollars cheaper, two hours longer (duas horas a mais), a year older."}]},{"id":"b1-48","frame":"Blog","framePt":"Blog","title":"My twin sister","titlePt":"Minha irmã gêmea","body":["People always ask if my twin sister and I are identical. We're not! I'm {as} [tall:b] {as} she is, but that's where the similarities end. She has curly hair, and mine is straight. She's also a fantastic swimmer: she swims {a lot} [well:c] {than} I do. But I can cook, and she can't!"],"pt":["As pessoas sempre perguntam se a minha irmã gêmea e eu somos idênticas. Não somos! Eu sou tão alta quanto ela, mas as semelhanças acabam aí. Ela tem cabelo cacheado, e o meu é liso. Ela também é uma nadadora fantástica: ela nada muito melhor do que eu. Mas eu sei cozinhar, e ela não!"],"w":{"twin":"gêmea","identical":"idênticas","similarities":"semelhanças","curly":"cacheado","straight":"liso","swimmer":"nadadora"},"notes":[{"en":"as + plain adjective + as = tão … quanto: as tall as.","pt":"as + adjetivo simples + as = tão … quanto: as tall as (tão alta quanto)."},{"en":"well → better: she swims better than I do. a lot / much + comparative = muito mais…","pt":"well → better: she swims better than I do (ela nada melhor do que eu). a lot / much + comparativo = muito mais…"}]}]},"bonus /* 00-util.js — tiny helpers shared by every module, and the text-markup parser.

const $ = id => document.getElementById(id);
function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function rnd(a, b) { return a + Math.random() * (b - a); }
function pick1(a) { return a[Math.floor(Math.random() * a.length)]; }
// Restart a one-shot CSS animation class.
function flash(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); el.addEventListener("animationend", function f() { el.classList.remove(cls); el.removeEventListener("animationend", f); }); }

function glow(el) { el.classList.add("glow"); clearTimeout(el.__glowT); el.__glowT = setTimeout(() => el.classList.remove("glow"), 1100); }
