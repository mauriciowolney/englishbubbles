"A Nina está viva e continua trabalhando (uma nova série estreia no mês que vem), então é a experiência dela até agora, sem dizer quando. Compare com a mãe: uma vida terminada → past simple.","pt":"já expôs"},{"use":"pp-since","clue":"Since her mother's death","tl":"since 2009","why":"From her mother's death in 2009 up to now — and she still manages it. Since → present perfect.","whyPt":"Da morte da mãe, em 2009, até agora — e ela ainda cuida do arquivo. Em português: \"administra … desde a morte da mãe\" (presente!).","pt":"administra (desde a morte da mãe)"},{"use":"pp-news","both":{"alt":"ps-context","tlPp":"open until June","tlPs":"the decision","pp":"fresh news with a result now: you still have time to see it","ppPt":"notícia nova com um resultado agora: ainda dá tempo de ver","ps":"a report of a decision the museum made (normal in American English)","psPt":"o relato de uma decisão que o museu tomou (normal no inglês americano)"},"why":"Both are correct. With has, it's news that matters now (the exhibition is still open). Without it, it's a report of a past decision — very common in American English.","whyPt":"As duas formas estão certas. Com has, é uma notícia que importa agora (a exposição continua aberta). Sem has, é o relato de uma decisão passada — muito comum no inglês americano.","pt":"prorrogou"}],"w":{"street photographers":"fotógrafos de rua","twentieth century":"século XX","career":"carreira","photographed":"fotografar","captured":"capturar, registrar","dancing":"dançando","daughter":"filha","exhibited":"expor (uma obra)","series":"série","managed":"administrar, cuidar de","archive":"arquivo","negatives":"negativos (de filme)","brings":"reúne","together":"juntas","extended":"prorrogar, estender","until the end of June":"até o fim de junho"}},{"id":"b2-04","kind":"text","frame":"Science news","framePt":"Notícia de ciência","title":"A new frog in the cloud forest","titlePt":"Um sapo novo na floresta nublada","body":["{Good news} for nature lovers: scientists [have:discovered] a tiny new species of frog in the cloud forests of northern Peru.","The researchers [have:spotted] the frog {during an expedition last October}, when they heard an unusual call near a waterfall.","{Since then}, they [have:recorded] its call more than 200 times, and they believe that only a few hundred of these frogs exist.","The researchers [have:just published] their findings, and they come with a warning: illegal logging is destroying the frog's home.","{Until 2019}, much of the area [has:belonged] to a mining company. Now it is a nature reserve, and the team hopes this will help the tiny frog survive."],"pt":["Boa notícia para quem ama a natureza: cientistas descobriram uma nova espécie de sapo minúsculo nas florestas nubladas do norte do Peru.","Os pesquisadores avistaram o sapo durante uma expedição em outubro do ano passado, quando ouviram um canto incomum perto de uma cachoeira.","Desde então, eles já gravaram o canto mais de 200 vezes, e acreditam que existam apenas algumas centenas desses sapos.","Os pesquisadores acabaram de publicar os resultados, e eles trazem um alerta: o desmatamento ilegal está destruindo o habitat do sapo.","Até 2019, boa parte da área pertencia a uma mineradora. Hoje é uma reserva natural, e a equipe espera que isso ajude o pequeno sapo a sobreviver."],"spots":[{"use":"pp-news","clue":"Good news","tl":"the news","why":"The first sentence of a news story gives the new fact, with no time: present perfect. The details (when, how) follow in the past simple.","whyPt":"A primeira frase de uma notícia traz o fato novo, sem dizer quando: present perfect. Os detalhes (quando, como) vêm depois, no past simple.","pt":"descobriram"},{"use":"ps-time","clue":"during an expedition last October","tl":"last October","why":"Now the details: when? Last October — a finished time, so we use the past simple (like heard, right after it).","whyPt":"Agora os detalhes: quando? Last October (em outubro do ano passado) — um tempo terminado, então usamos o past simple (como heard, logo depois).","pt":"avistaram"},{"use":"pp-since","clue":"Since then","why":"Since then = from last October up to now, and the research continues. Since → present perfect.","whyPt":"Since then = de outubro do ano passado até agora, e a pesquisa continua. Since → present perfect.","pt":"já gravaram (desde então)"},{"use":"pp-news","both":{"alt":"ps-context","tlPp":"just now (UK)","tlPs":"just now (US)","pp":"fresh news connected to now — the British choice, and the usual one in news","ppPt":"notícia fresquinha ligada ao agora — a escolha britânica, e a mais comum em notícias","ps":"the same fresh news, American style: just + past simple","psPt":"a mesma notícia fresquinha, no estilo americano: just + past simple"},"why":"Both are correct, with the same meaning: with just, British English uses the present perfect, and American English often uses the past simple. It's a difference of variety, not of time.","whyPt":"As duas formas estão certas, com o mesmo sentido: com just, o inglês britânico usa present perfect, e o americano muitas vezes usa past simple. É uma diferença de variedade, não de tempo.","pt":"acabaram de publicar"},{"use":"ps-ended","clue":"Until 2019","tl":"until 2019","why":"Until 2019 tells us that this situation is over: now the area is a nature reserve. A finished situation → past simple.","whyPt":"Until 2019 (até 2019) mostra que essa situação acabou: hoje a área é uma reserva natural. Situação terminada → past simple. Em português usamos o imperfeito (\"pertencia\").","pt":"pertencia"}],"w":{"nature lovers":"amantes da natureza","discovered":"descobrir","tiny":"minúsculo","species":"espécie","frog":"sapo, rã","cloud forests":"florestas nubladas","researchers":"pesquisadores","spotted":"avistar","expedition":"expedição","unusual":"incomum","call":"canto (de um animal)","waterfall":"cachoeira","recorded":"gravar","logging":"extração de madeira","belonged":"pertencer","mining company":"mineradora","nature reserve":"reserva natural","survive":"sobreviver","published":"publicar","findings":"resultados","warning":"alerta","destroying":"destruindo"}},{"id":"b2-05","kind":"chat","contract":true,"title":"Long time no see!","titlePt":"Quanto tempo!","voices":{"Sam":"m","Priya":"f"},"body":[["Sam","Priya?! Is that really you? It's been ages! 😮"],["Priya","Sam!! I can't believe it! How are you? What have you been up to?"],["Sam","Lots of things 😅 I [have:changed] jobs twice {since we last met}."],["Priya","Wow! Where are you now?"],["Sam","At a design studio in Berlin. I [have:moved] there {in 2021}."],["Priya","Berlin! I [have:visited] it once, {years ago}, for a conference. Beautiful city."],["Sam","And you? Still at the bank?"],["Priya","No way! I left the bank three years ago and set up my own company 🚀"],["Priya","{So far}, we [have:launched] two apps, and the third one is almost ready."],["Sam","That's amazing! Coffee next week? I want to hear everything ☕ And I need one now — I [have:walked] 15,000 steps {this morning} 😅"]],"pt":["Priya?! É você mesmo? Quanto tempo! 😮","Sam!! Não acredito! Como você está? O que você tem feito?","Muita coisa 😅 Mudei de emprego duas vezes desde a última vez que a gente se viu.","Uau! Onde você está agora?","Num estúdio de design em Berlim. Me mudei pra lá em 2021.","Berlim! Visitei uma vez, anos atrás, para uma conferência. Cidade linda.","E você? Ainda no banco?","De jeito nenhum! Saí do banco há três anos e abri a minha própria empresa 🚀","Já lançamos dois aplicativos, e o terceiro está quase pronto.","Que incrível! Um café semana que vem? Quero saber de tudo ☕ E eu preciso de um agora — andei 15.000 passos hoje de manhã 😅"],"spots":[{"use":"pp-since","clue":"since we last met","why":"From their last meeting up to now. Since → present perfect, even though Portuguese uses the simple past here (\"mudei de emprego\").","whyPt":"Da última vez que se viram até agora. Since → present perfect, mesmo que em português usemos o pretérito (\"mudei de emprego\").","pt":"mudei (desde a última vez)"},{"use":"ps-time","clue":"in 2021","why":"In 2021 is a finished time, so we use the past simple.","whyPt":"In 2021 é um tempo terminado: past simple.","pt":"me mudei"},{"use":"ps-time","clue":"years ago","why":"\"Once\" might make you think of life experience, but years ago gives a finished time — and a finished time always wins: past simple.","whyPt":"\"Once\" (uma vez) pode lembrar experiência de vida, mas years ago (anos atrás) dá um tempo terminado — e o tempo terminado sempre vence: past simple.","pt":"visitei"},{"use":"pp-period","clue":"So far","why":"So far = from the start of the company up to now. The company is still going, and a third app is coming.","whyPt":"So far = do começo da empresa até agora. A empresa continua, e um terceiro aplicativo está a caminho.","pt":"já lançamos"},{"use":"pp-period","clue":"this morning","both":{"alt":"ps-time","tlPp":"this morning (not over)","tlPs":"this morning (over)","pp":"it's still morning as he writes — the period isn't over","ppPt":"ainda é de manhã quando ele escreve — o período não acabou","ps":"the morning is over — he's writing in the afternoon or evening","psPt":"a manhã já acabou — ele está escrevendo à tarde ou à noite"},"why":"Both can be right — it depends on WHEN he writes. Still morning: the period isn't finished → present perfect. Morning over: a finished time → past simple.","whyPt":"As duas podem estar certas — depende de QUANDO ele escreve. Ainda de manhã: o período não terminou → present perfect. A manhã acabou: tempo terminado → past simple.","pt":"andei"}],"w":{"ages":"muito tempo (it's been ages = quanto tempo!)","been up to":"andou fazendo","changed":"mudar (de)","jobs":"empregos","design studio":"estúdio de design","moved":"mudar-se","visited":"visitar","conference":"conferência","no way":"de jeito nenhum","left":"saí (leave)","launched":"lançar","apps":"aplicativos","almost ready":"quase pronto","amazing":"incrível","set up":"abrir, montar (uma empresa)","walked":"andar, caminhar","steps":"passos"}},{"id":"b2-06","kind":"text","contract":true,"frame":"Online review","framePt":"Avaliação online","title":"Great food, slow service","titlePt":"Comida ótima, serviço lento","body":["We [have:celebrated] our anniversary at Casa Lume {last Friday}, and I'm still not sure what to think.","Our table wasn't ready, so we spent forty minutes at the bar. {Then} the waiter [has:mixed] up our orders, and my steak came out cold.","The food, though, was incredible. I [have:tried] a lot of seafood {in my life}, but this was the best octopus I have ever had.","{Since that night}, I [have:recommended] Casa Lume to three friends — but I've told them to book early and bring some patience.","To be fair, the manager [has:answered] my email with a kind apology, so here are three stars instead of two."],"pt":["Comemoramos o nosso aniversário de casamento no Casa Lume na sexta passada, e ainda não sei bem o que pensar.","A nossa mesa não estava pronta, então passamos quarenta minutos no bar. Depois, o garçom trocou os nossos pedidos, e o meu bife chegou frio.","A comida, porém, estava incrível. Já comi muito fruto do mar na vida, mas esse foi o melhor polvo que já comi.","Desde aquela noite, já recomendei o Casa Lume para três amigos — mas avisei que é para reservar cedo e levar paciência.","Justiça seja feita: o gerente respondeu ao meu e-mail com um pedido de desculpas gentil, então aqui vão três estrelas em vez de duas."],"spots":[{"use":"ps-time","clue":"last Friday","why":"Last Friday is a finished time, so we use the past simple.","whyPt":"Last Friday (na sexta passada) é um tempo terminado: past simple.","pt":"comemoramos"},{"use":"ps-story","clue":"Then","tl":"that evening, in order","why":"The story of that evening goes on in order: the wait at the bar, then the mix-up, then the cold steak. Events in a story → past simple.","whyPt":"A história daquela noite continua em ordem: a espera no bar, depois a confusão com os pedidos, depois o bife frio. Fatos de uma história → past simple.","pt":"trocou"},{"use":"pp-exp","clue":"in my life","tl":"in my life so far","why":"Life experience up to now — and the writer's life isn't over. Compare the fixed phrase right after it: the best octopus I have ever had.","whyPt":"Experiência de vida até agora — e a vida de quem escreve não acabou. Compare com a expressão logo depois: the best octopus I have ever had.","pt":"já comi"},{"use":"pp-since","clue":"Since that night","why":"From that night up to now — and the writer may recommend it to more friends. Since → present perfect.","whyPt":"Daquela noite até agora — e a pessoa pode recomendar para mais amigos. Since → present perfect.","pt":"já recomendei (desde aquela noite)"},{"use":"pp-news","both":{"alt":"ps-context","tlPp":"the reply, news now","tlPs":"the reply, reported","pp":"the reply is recent news that matters now — it's why the review gets an extra star","ppPt":"a resposta é uma novidade que importa agora — é por isso que a avaliação ganha uma estrela a mais","ps":"the writer simply reports the reply as a past event (very common in American English)","psPt":"quem escreve só relata a resposta como um fato passado (muito comum no inglês americano)"},"why":"Both are correct. With has, the reply is fresh news connected to now (the extra star). Without it, it's reported as a past event — American English often does this.","whyPt":"As duas formas estão certas. Com has, a resposta é uma novidade ligada ao agora (a estrela a mais). Sem has, é relatada como um fato passado — o inglês americano faz muito isso.","pt":"respondeu"}],"w":{"celebrated":"comemorar","anniversary":"aniversário (de casal)","not sure":"não tenho certeza","spent":"passamos (spend)","waiter":"garçom","mixed":"trocar, confundir (mix up)","orders":"pedidos","came out":"veio (da cozinha)","though":"porém","tried":"provar, experimentar","seafood":"frutos do mar","octopus":"polvo","recommended":"recomendar","book":"reservar","patience":"paciência","to be fair":"justiça seja feita","manager":"gerente","answered":"responder","apology":"pedido de desculpas","instead of":"em vez de"}},{"id":"b2-07","kind":"text","frame":"Sports news","framePt":"Notícia de esporte","title":"A new world record in Oslo","titlePt":"Um novo recorde mundial em Oslo","body":["Kenyan runner Grace Achieng [has:smashed] the women's 5,000-meter world record, and the athletics world {is still talking about it}.","Achieng [has:crossed] the finish line in 13:58.06 {on Thursday night} at the Oslo Diamond League, more than two seconds faster than the old record.","It was a race full of drama. {During the race}, Achieng [has:stayed] behind the leaders, and {then}, with 300 meters to go, she [has:attacked].","{Since her debut in 2019}, she [has:earned] four world titles, and she is only 24."],"pt":["A corredora queniana Grace Achieng quebrou o recorde mundial feminino dos 5.000 metros, e o mundo do atletismo ainda está falando disso.","Achieng cruzou a linha de chegada em 13:58.06 na quinta à noite, na Diamond League de Oslo, mais de dois segundos mais rápido que o antigo recorde.","Foi uma prova cheia de emoção. Durante a corrida, Achieng ficou atrás das líderes e, então, a 300 metros do fim, atacou.","Desde a estreia, em 2019, ela já conquistou quatro títulos mundiais, e tem só 24 anos."],"spots":[{"use":"pp-news","clue":"is still talking about it","tl":"the news","why":"The opening of a news story: the new fact, with no time given, and the result is here now — everybody is still talking about it.","whyPt":"A abertura de uma notícia: o fato novo, sem dizer quando, e o resultado está aqui agora — todo mundo ainda está falando disso.","pt":"quebrou"},{"use":"ps-time","clue":"on Thursday night","why":"Now the details: when? On Thursday night — a finished time. News: present perfect first, then past simple for the details.","whyPt":"Agora os detalhes: quando? On Thursday night (na quinta à noite) — um tempo terminado. Notícia: primeiro present perfect, depois past simple nos detalhes.","pt":"cruzou"},{"use":"ps-context","clue":"During the race","tl":"during the race","why":"During the race — a specific event that is over. Describing what happened in a finished race → past simple.","whyPt":"During the race (durante a corrida) — um evento específico que já terminou. Descrever o que aconteceu numa corrida terminada → past simple.","pt":"ficou"},{"use":"ps-story","clue":"then","tl":"events in order","why":"The race is told in order: first she stayed behind, then she attacked. Events in a story → past simple.","whyPt":"A corrida é contada em ordem: primeiro ela ficou atrás, depois atacou. Fatos de uma história → past simple.","pt":"atacou"},{"use":"pp-since","clue":"Since her debut in 2019","tl":"since 2019","why":"From her debut in 2019 up to now — and her career goes on (she's only 24). Since → present perfect.","whyPt":"Da estreia, em 2019, até agora — e a carreira dela continua (ela tem só 24 anos). Since → present perfect.","pt":"já conquistou (desde 2019)"}],"w":{"runner":"corredora","smashed":"quebrar, pulverizar (um recorde)","world record":"recorde mundial","athletics":"atletismo","crossed":"cruzar","finish line":"linha de chegada","faster":"mais rápido","drama":"emoção, drama","stayed":"ficar","leaders":"líderes","to go":"para o fim","attacked":"atacar","debut":"estreia","earned":"conquistar","titles":"títulos"}},{"id":"b2-08","kind":"dialogue","contract":true,"frame":"At work","framePt":"No trabalho","title":"Bad news on a Monday","titlePt":"Notícia ruim numa segunda-feira","voices":{"Nora":"f","Ken":"m"},"body":[["Nora","Ken, have you seen the new budget?"],["Ken","Not yet. I [have:arrived] {ten minutes ago}."],["Nora","Well, {brace yourself}. Finance [has:reduced] our marketing budget by thirty percent."],["Ken","What? When did they decide that?"],["Nora","{At the board meeting on Friday}. Apparently they [have:discussed] it for about five minutes."],["Ken","Five minutes?! I [have:worked] on that campaign for six months!"],["Nora","I know. I [have:emailed] the finance director twice {since nine o'clock}, and I'm still waiting for an answer."],["Ken","Let's go and talk to her together after lunch."]],"pt":["Ken, você já viu o novo orçamento?","Ainda não. Cheguei há dez minutos.","Bom, se prepare. O financeiro reduziu o nosso orçamento de marketing em trinta por cento.","O quê? Quando eles decidiram isso?","Na reunião da diretoria, na sexta. Pelo jeito, discutiram o assunto por uns cinco minutos.","Cinco minutos?! Foram seis meses de trabalho nessa campanha!","Eu sei. Mandei dois e-mails para a diretora financeira desde as nove, e ainda estou esperando resposta.","Vamos lá falar com ela juntos depois do almoço."],"spots":[{"use":"ps-time","clue":"ten minutes ago","why":"Ten minutes ago is a finished time — even if it was very recent. Careful: \"há dez minutos\" here means ago!","whyPt":"Ten minutes ago é um tempo terminado — mesmo sendo bem recente. Cuidado: \"há dez minutos\" aqui significa ago!","pt":"cheguei"},{"use":"pp-news","clue":"brace yourself","tl":"the news","why":"Nora gives news that matters right now (brace yourself!), with no time. When Ken asks When?, the details move to the past simple.","whyPt":"A Nora dá uma notícia que importa agora (se prepare!), sem dizer quando. Quando o Ken pergunta When?, os detalhes passam para o past simple.","pt":"reduziu"},{"use":"ps-time","clue":"At the board meeting on Friday","tl":"Friday's meeting","why":"Ken asked When? — and the answer is a finished time: the meeting on Friday.","whyPt":"O Ken perguntou When? — e a resposta é um tempo terminado: a reunião de sexta.","pt":"discutiram"},{"use":"pp-since","both":{"alt":"ps-ended","tlPp":"6 months, still going","tlPs":"6 months, finished","pp":"he's still working on the campaign — and now it might be cut","ppPt":"ele ainda está trabalhando na campanha — e agora ela pode ser cortada","ps":"his work on the campaign is finished — six months of work, now wasted","psPt":"o trabalho dele na campanha acabou — seis meses de trabalho, agora desperdiçados"},"why":"Both are correct: nothing in the dialogue says if the campaign work is finished. With have, he's still working on it; without it, that work is over.","whyPt":"As duas formas estão certas: nada no diálogo diz se o trabalho na campanha acabou. Com have, ele ainda está trabalhando nela; sem have, esse trabalho já terminou.","pt":"trabalho / trabalhei (por seis meses)","cont":{"en":"I've been working on that campaign for six months!","why":"With have: one project, still in progress, and Ken stresses how long. Most people would say have been + -ing.","whyPt":"Com have: um projeto só, ainda em andamento, e o Ken destaca há quanto tempo. A maioria das pessoas diria have been + -ing."}},{"use":"pp-since","clue":"since nine o'clock","tl":"since 9:00","why":"From nine o'clock up to now — and she's still waiting. Since → present perfect.","whyPt":"Das nove até agora — e ela ainda está esperando. Since → present perfect.","pt":"mandei e-mails (desde as nove)"}],"w":{"budget":"orçamento","arrived":"chegar","brace yourself":"prepare-se","finance":"o (setor) financeiro","reduced":"reduzir","board meeting":"reunião da diretoria","apparently":"pelo jeito, aparentemente","discussed":"discutir","worked":"trabalhar","campaign":"campanha","emailed":"mandar e-mail","finance director":"diretora financeira","waiting for":"esperando","together":"juntos"}},{"id":"b2-09","kind":"text","contract":true,"frame":"LinkedIn post","framePt":"Post no LinkedIn","title":"Ten years in the classroom","titlePt":"Dez anos em sala de aula","body":["{Ten years ago today}, I [have:walked] into my first classroom, and my hands were shaking.","{Since then}, I [have:helped] more than 1,500 students with their English, and I [have:learned] at least as much from them.","It wasn't always easy. {In my second year}, I [have:considered] a change of career — the workload was crazy.","Along the way, I [have:worked] at four different schools, from a tiny village school to a huge international one.","Thank you to every student, colleague and parent who believes in what we do. Here's to the next ten years!"],"pt":["Há exatamente dez anos, eu entrei na minha primeira sala de aula, e as minhas mãos tremiam.","Desde então, já ajudei mais de 1.500 alunos com o inglês, e aprendi pelo menos o mesmo tanto com eles.","Nem sempre foi fácil. No meu segundo ano, pensei em mudar de profissão — a carga de trabalho era absurda.","Ao longo do caminho, trabalhei em quatro escolas diferentes, de uma escolinha de vila a uma enorme escola internacional.","Agradeço a cada aluno, colega e família que acredita no que fazemos. Aos próximos dez anos!"],"spots":[{"use":"ps-time","clue":"Ten years ago today","tl":"ten years ago","why":"Ten years ago is a finished time — even though the teaching career continues, that first day is over.","whyPt":"Ten years ago (há dez anos) é um tempo terminado — a carreira continua, mas aquele primeiro dia já passou. Cuidado: aqui \"há\" = ago!","pt":"entrei"},{"use":"pp-since","clue":"Since then","why":"From that first day up to now — and the teacher keeps helping students. Since → present perfect.","whyPt":"Daquele primeiro dia até agora — e a pessoa continua ajudando alunos. Since → present perfect.","pt":"já ajudei (desde então)"},{"use":"pp-since","clue":"Since then","why":"Same since then, same tense: from that first day up to now, and the learning goes on.","whyPt":"O mesmo since then, o mesmo tempo verbal: daquele primeiro dia até agora, e o aprendizado continua. Em português fica no pretérito (\"aprendi\").","pt":"aprendi (desde então)"},{"use":"ps-time","clue":"In my second year","why":"In my second year is a finished time (nine years ago), so we use the past simple — like was, in the same sentence.","whyPt":"In my second year (no meu segundo ano) é um tempo terminado (há nove anos), então usamos o past simple — como was, na mesma frase.","pt":"pensei em"},{"use":"pp-exp","both":{"alt":"ps-ended","tlPp":"career so far","tlPs":"those jobs (over)","pp":"the four schools are part of a career that is still going — and may include more schools","ppPt":"as quatro escolas fazem parte de uma carreira que continua — e pode incluir mais escolas","ps":"the writer looks back at those four jobs as finished chapters","psPt":"quem escreve olha para aqueles quatro empregos como capítulos encerrados"},"why":"Both are correct. With have, the four schools are part of a career that is still going. Without it, the writer looks back at those jobs as finished chapters.","whyPt":"As duas formas estão certas. Com have, as quatro escolas fazem parte de uma carreira que continua. Sem have, a pessoa olha para aqueles empregos como capítulos encerrados.","pt":"trabalhei"}],"w":{"walked":"entrar, caminhar (walk into = entrar em)","classroom":"sala de aula","shaking":"tremendo","helped":"ajudar","learned":"aprender","at least":"pelo menos","considered":"considerar, pensar em","career":"carreira","workload":"carga de trabalho","along the way":"ao longo do caminho","worked":"trabalhar","tiny":"minúscula","village":"vila, vilarejo","huge":"enorme","colleague":"colega","believes":"acredita","here's to":"um brinde a"}},{"id":"b2-10","kind":"text","contract":true,"frame":"Travel blog","framePt":"Blog de viagem","title":"A night in Kyoto","titlePt":"Uma noite em Kyoto","body":["I [have:traveled] to {more than twenty countries}, but my night in Kyoto is still my favorite travel story.","{Last April}, I [have:missed] the last train back to my hotel. My phone was dead, and I knew zero words of Japanese.","{Then} an old man [has:approached] me with a big smile and a paper map.","{After that}, we [have:walked] together through quiet streets until we found my hotel. He said no to my money.","We [have:stayed] in touch {ever since}, and every spring he sends me a photo of that station."],"pt":["Já viajei para mais de vinte países, mas a minha noite em Kyoto continua sendo a minha história de viagem favorita.","Em abril do ano passado, perdi o último trem de volta para o hotel. O meu celular estava sem bateria, e eu não sabia nenhuma palavra de japonês.","Então, um senhor se aproximou de mim com um sorriso enorme e um mapa de papel.","Depois disso, caminhamos juntos por ruas tranquilas até encontrarmos o meu hotel. Ele não aceitou o meu dinheiro.","Desde então, mantemos contato, e toda primavera ele me manda uma foto daquela estação."],"spots":[{"use":"pp-exp","clue":"more than twenty countries","tl":"20+ countries so far","why":"Life experience up to now, with no time given — and the traveling goes on, so the number can still grow.","whyPt":"Experiência de vida até agora, sem dizer quando — e as viagens continuam, então o número ainda pode crescer.","pt":"já viajei"},{"use":"ps-time","clue":"Last April","why":"Last April is a finished time, so we use the past simple — and the story starts here.","whyPt":"Last April (em abril do ano passado) é um tempo terminado: past simple — e a história começa aqui.","pt":"perdi"},{"use":"ps-story","clue":"Then","tl":"events in order","why":"The story goes on in order: the writer missed the train, then the old man came to help. Events in a story → past simple.","whyPt":"A história continua em ordem: perdeu o trem, depois o senhor veio ajudar. Fatos de uma história → past simple.","pt":"se aproximou"},{"use":"ps-story","clue":"After that","tl":"events in order","why":"After that = the next event in the story of that night. Events in a story → past simple (like found, right after it).","whyPt":"After that (depois disso) = o próximo fato da história daquela noite. Fatos de uma história → past simple.","pt":"caminhamos"},{"use":"pp-since","clue":"ever since","why":"Ever since = from that night up to now, and they're still in touch (he sends a photo every spring). Ever since → present perfect.","whyPt":"Ever since (desde então) = daquela noite até agora, e eles ainda mantêm contato (ele manda uma foto toda primavera). Em português usamos o presente: \"mantemos contato desde então\".","pt":"mantemos (contato desde então)"}],"w":{"traveled":"viajar","countries":"países","favorite":"favorita","missed":"perder (o trem)","dead":"sem bateria (celular)","knew":"sabia (know)","said no":"recusou, disse não","approached":"aproximar-se de","smile":"sorriso","map":"mapa","walked":"caminhar","quiet":"tranquilas","found":"encontramos (find)","stayed":"ficar, manter (stay in touch = manter contato)","in touch":"em contato","ever since":"desde então","spring":"primavera","station":"estação"}},{"id":"b2-11","kind":"text","frame":"Obituary","framePt":"Obituário","title":"The woman who listened to whales","titlePt":"A mulher que escutava baleias","body":["{The death of Elena Varga on Tuesday}, at 85, leaves the oceans a little quieter. She was the marine biologist whose recordings taught a generation to hear whale song as a kind of language.","For almost half a century, Varga [has:followed] humpback whales across the North Atlantic, often from boats barely bigger than a bathtub.","Her breakthrough came {in the summer of 1979}, when she [has:recorded] two males \"answering\" each other across forty kilometers of open sea.","{Since her retirement in 2011}, her archive of more than 6,000 hours of sound [has:remained] free to anyone who asks. \"The songs belong to the whales, not to me,\" as she often put it.","Remarkably, this is {the first time} in its 90-year history that this magazine [has:dedicated] its cover to a biologist.","I spent three summers on her boat in the 1990s. Thirty years on, I [have:returned] to those tapes {more times than I can count}."],"pt":["A morte de Elena Varga na terça-feira, aos 85 anos, deixa os oceanos um pouco mais silenciosos. Ela era a bióloga marinha cujas gravações ensinaram uma geração a ouvir o canto das baleias como uma espécie de língua.","Por quase meio século, Varga acompanhou baleias-jubarte pelo Atlântico Norte, muitas vezes em barcos pouco maiores que uma banheira.","A grande descoberta veio no verão de 1979, quando ela gravou dois machos \"respondendo\" um ao outro a quarenta quilômetros de distância, em mar aberto.","Desde a aposentadoria dela, em 2011, o seu acervo de mais de 6.000 horas de som continua gratuito para quem pedir. \"As canções pertencem às baleias, não a mim\", como ela costumava dizer.","Curiosamente, esta é a primeira vez, nos 90 anos de história desta revista, que ela dedica a capa a uma bióloga.","Passei três verões no barco dela nos anos 1990. Trinta anos depois, já voltei àquelas fitas mais vezes do que consigo contar."],"spots":[{"use":"ps-ended","clue":"The death of Elena Varga on Tuesday","tl":"half a century (over)","why":"For almost half a century looks like a present perfect signal, but Varga's death on Tuesday makes her working life a finished situation. When a person has died, their life story takes the past simple — even with for.","whyPt":"For almost half a century parece pedir present perfect, mas Varga morreu na terça: a vida de trabalho dela é uma situação terminada. Quando a pessoa já morreu, a história da vida dela vai para o past simple — mesmo com for.","pt":"acompanhou (por quase meio século)"},{"use":"ps-time","clue":"in the summer of 1979","tl":"summer 1979","why":"In the summer of 1979 fixes the time, and the when-clause belongs to that same finished moment.","whyPt":"In the summer of 1979 (no verão de 1979) fixa o tempo, e a oração com when pertence a esse mesmo momento terminado.","pt":"gravou"},{"use":"pp-since","clue":"Since her retirement in 2011","tl":"since 2011","why":"Varga has died, but the subject here is her archive — and it is still free today. Since + a starting point, still true now → present perfect. Ask yourself whose time is still open.","whyPt":"Varga morreu, mas o sujeito aqui é o acervo — e ele continua gratuito hoje. Since + ponto de partida, ainda verdade agora → present perfect. Pergunte-se: de quem é o tempo que ainda está aberto? Em português: \"continua gratuito desde 2011\" (presente!).","pt":"continua (desde 2011)"},{"use":"pp-exp","clue":"the first time","why":"This is the first time… that takes the present perfect: the magazine's 90-year history runs up to now.","whyPt":"This is the first time… that pede present perfect: os 90 anos de história da revista vão até agora. Em português usamos o presente (\"é a primeira vez que a revista dedica\"), mas em inglês o present perfect é obrigatório.","pt":"dedica (pela primeira vez)"},{"use":"pp-exp","clue":"more times than I can count","tl":"countless times so far","why":"The writer is alive, and this is a count up to now that can still grow. Compare Varga, whose life is finished.","whyPt":"Quem escreve está vivo, e é uma contagem até agora que ainda pode crescer. Compare com Varga, cuja vida terminou.","pt":"já voltei (inúmeras vezes)"}],"w":{"marine biologist":"bióloga marinha","whose":"cujo(a)s","whale song":"canto das baleias","leaves":"deixa","quieter":"mais silenciosos","humpback whales":"baleias-jubarte","followed":"acompanhar, seguir","barely":"mal, pouco","bathtub":"banheira","breakthrough":"grande descoberta","recorded":"gravar","open sea":"mar aberto","retirement":"aposentadoria","archive":"acervo, arquivo","remained":"continuar, permanecer","put it":"dizer, expressar (put it)","remarkably":"curiosamente, notavelmente","dedicated":"dedicar","thirty years on":"trinta anos depois","returned":"voltar","tapes":"fitas"}},{"id":"b2-12","kind":"text","frame":"Opinion column","framePt":"Coluna de opinião","title":"A year without the feed","titlePt":"Um ano sem o feed","body":["{Twelve months ago}, on a gray Sunday afternoon, I [have:deleted] every social media app from my phone.","The first weeks were brutal. {At the time}, I [have:reached] for my phone roughly every four minutes, mostly out of habit, and found nothing there.","{Since then}, something odd [has:happened]: my attention span, which I had long given up for dead, is slowly coming back.","I am not naive about the cost. {In the past year}, I [have:missed] two birthday parties and at least one engagement, simply because nobody thought to text me.","Over those twelve months, I [have:considered] going back more than once.","Will I return? Ask me next year."],"pt":["Há doze meses, num domingo cinzento à tarde, apaguei todos os aplicativos de redes sociais do meu celular.","As primeiras semanas foram brutais. Na época, eu pegava o celular mais ou menos a cada quatro minutos, quase sempre por hábito, e não encontrava nada ali.","Desde então, algo curioso aconteceu: a minha capacidade de concentração, que eu já dava como morta havia muito tempo, está voltando aos poucos.","Não me iludo quanto ao preço. No último ano, perdi duas festas de aniversário e pelo menos um noivado, simplesmente porque ninguém lembrou de me mandar mensagem.","Ao longo desses doze meses, pensei em voltar mais de uma vez.","Se eu vou voltar? Me pergunte no ano que vem."],"spots":[{"use":"ps-time","clue":"Twelve months ago","tl":"twelve months ago","why":"Twelve months ago fixes a finished moment — that Sunday afternoon. Ago always takes the past simple.","whyPt":"Twelve months ago (há doze meses) fixa um momento terminado — aquele domingo à tarde. Ago pede sempre past simple. Cuidado: aqui \"há\" = ago.","pt":"apaguei"},{"use":"ps-context","clue":"At the time","tl":"the first weeks","why":"At the time points back to those first weeks, a finished period we already know about. No date is needed: the context fixes WHEN.","whyPt":"At the time (na época) aponta para aquelas primeiras semanas, um período terminado que já conhecemos. Não precisa de data: o contexto diz QUANDO. Em português usaríamos o imperfeito (\"pegava\").","pt":"pegava (o celular)"},{"use":"pp-since","clue":"Since then","why":"From that Sunday up to now — and the change is still going on (\"is slowly coming back\"). Since → present perfect.","whyPt":"Daquele domingo até agora — e a mudança continua (\"está voltando aos poucos\"). Since → present perfect, embora o português use o pretérito (\"aconteceu\").","pt":"aconteceu (desde então)"},{"use":"pp-period","clue":"In the past year","tl":"the past year","why":"In the past year = the twelve months up to today. The period reaches the present → present perfect. Compare: last year = a finished calendar year → past simple.","whyPt":"In the past year (no último ano) = os doze meses até hoje. O período chega ao presente → present perfect. Compare: last year (o ano passado, já terminado) → past simple.","pt":"perdi (no último ano)"},{"use":"pp-period","both":{"alt":"ps-ended","tlPp":"the year, up to now","tlPs":"the year (closed)","pp":"the writer sees the twelve months as reaching up to today — the experiment isn't over","ppPt":"a pessoa vê os doze meses como algo que chega até hoje — o experimento não acabou","ps":"the writer looks back on the year as a closed chapter","psPt":"a pessoa olha para o ano como um capítulo encerrado"},"why":"Both are correct. With have, the year still reaches the present: the experiment goes on. Without it, the writer closes the chapter and looks back on it.","whyPt":"As duas formas estão certas. Com have, o ano ainda chega ao presente: o experimento continua. Sem have, a pessoa fecha o capítulo e olha para trás. Em português: \"pensei em voltar\" nos dois casos.","pt":"pensei em"}],"w":{"deleted":"apagar","gray":"cinzento","at the time":"na época","reached":"estender a mão (reach for = pegar)","roughly":"mais ou menos","out of habit":"por hábito","odd":"estranho, curioso","happened":"acontecer","attention span":"capacidade de concentração","given up for dead":"dado como morto","naive":"ingênuo","missed":"perder (não ir a)","engagement":"noivado","thought to":"lembrou de (think to)","considered":"considerar, pensar em"}},{"id":"b2-13","kind":"text","frame":"Science feature","framePt":"Reportagem científica","title":"What happens to a memory while you sleep","titlePt":"O que acontece com uma lembrança enquanto você dorme","body":["For more than a century, scientists [have:suspected] that sleep does something important for memory. A team in Zurich now thinks it knows what.","{Last month}, the researchers [have:reported] that the sleeping brain \"replays\" the day's events at up to twenty times their real speed.","{During the experiment}, 40 volunteers [have:learned] the positions of 60 objects on a screen before going to sleep in the lab.","Those whose brains ran through the task most intensely could recall almost twice as much the next morning.","{To date}, the team [has:tested] the method only on young adults; a second study, with people over 70, begins in the spring.","\"Older people often sleep badly,\" says lead author Dr. Nadia Okafor. \"If we can strengthen the replay, we might protect their memory too.\""],"pt":["Há mais de um século, os cientistas suspeitam que o sono faz algo importante pela memória. (Ou: por mais de um século, suspeitaram.) Uma equipe de Zurique agora acha que sabe o quê.","No mês passado, os pesquisadores relataram que o cérebro adormecido \"repassa\" os acontecimentos do dia a até vinte vezes a velocidade real.","Durante o experimento, 40 voluntários aprenderam a posição de 60 objetos numa tela antes de dormir no laboratório.","Aqueles cujo cérebro repassou a tarefa com mais intensidade conseguiram lembrar quase o dobro na manhã seguinte.","Até o momento, a equipe testou o método apenas em adultos jovens; um segundo estudo, com pessoas acima de 70 anos, começa na primavera.","\"Pessoas mais velhas muitas vezes dormem mal\", diz a autora principal, a Dra. Nadia Okafor. \"Se conseguirmos fortalecer essa repetição, talvez possamos proteger a memória delas também.\""],"spots":[{"use":"pp-since","both":{"alt":"ps-ended","tlPp":"a century, up to now","tlPs":"a century (over)","pp":"the suspicion runs up to today — the new study is the latest step","ppPt":"a suspeita vem até hoje — o novo estudo é o passo mais recente","ps":"that century of suspicion is over: now a team thinks it knows","psPt":"aquele século de suspeita acabou: agora uma equipe acha que sabe"},"why":"Both are correct. With have, scientists still suspect it today — the new study is one more step. Without it, the suspicion belongs to the past: now a team thinks it knows.","whyPt":"As duas formas estão certas. Com have, os cientistas ainda suspeitam hoje — o novo estudo é mais um passo (\"há mais de um século suspeitam\"). Sem have, a suspeita ficou no passado: agora uma equipe acha que sabe (\"por mais de um século suspeitaram\").","pt":"suspeitam (há um século) / suspeitaram (por um século)"},{"use":"ps-time","clue":"Last month","why":"Last month is a finished time — a typical move in science news: first the big idea, then WHEN the paper came out.","whyPt":"Last month (no mês passado) é um tempo terminado — típico de notícia científica: primeiro a grande ideia, depois QUANDO o artigo saiu.","pt":"relataram"},{"use":"ps-context","clue":"During the experiment","tl":"the experiment","why":"During the experiment refers to a specific study that is already over. The time is clear from context → past simple.","whyPt":"During the experiment (durante o experimento) se refere a um estudo específico que já terminou. O tempo está claro pelo contexto → past simple.","pt":"aprenderam"},{"use":"pp-period","clue":"To date","tl":"to date","why":"To date = up to now. The research isn't finished (a second study begins in the spring) → present perfect.","whyPt":"To date (até o momento) = até agora. A pesquisa não terminou (um segundo estudo começa na primavera) → present perfect.","pt":"testou (até o momento)"}],"w":{"suspected":"suspeitar","team":"equipe","reported":"relatar, informar","sleeping brain":"cérebro adormecido","replays":"repassa, repete","up to":"até","speed":"velocidade","volunteers":"voluntários","learned":"aprender","lab":"laboratório","ran through":"repassar (run through)","recall":"lembrar","to date":"até o momento","tested":"testar","lead author":"autor(a) principal","strengthen":"fortalecer"}},{"id":"b2-14","kind":"text","frame":"Cover letter","framePt":"Carta de apresentação","title":"Application: Head of Sustainability","titlePt":"Candidatura: Diretora de Sustentabilidade","body":["Dear Ms. Laurent,","I am writing to apply for the position of Head of Sustainability at Nordhaven Foods. {For the past six years}, I [have:managed] the environmental program at Brightfield, a grocery chain with 140 stores.","{Under my leadership}, Brightfield [has:reduced] its food waste by 38%, and the numbers keep improving every quarter.","{Before Brightfield}, I [have:worked] as a consultant in Rotterdam for four years, advising ports on their emissions.","{In 2022}, I [have:presented] our zero-waste model at an international food summit in Geneva.","I would welcome the chance to discuss how this experience could support Nordhaven's goals. Thank you for your time and consideration.","Yours sincerely, Clara Jansen"],"pt":["Prezada Sra. Laurent,","Escrevo para me candidatar à vaga de Diretora de Sustentabilidade na Nordhaven Foods. Há seis anos, administro o programa ambiental da Brightfield, uma rede de supermercados com 140 lojas.","Sob a minha liderança, a Brightfield reduziu o desperdício de alimentos em 38%, e os números continuam melhorando a cada trimestre.","Antes da Brightfield, trabalhei como consultora em Roterdã por quatro anos, orientando portos sobre as suas emissões.","Em 2022, apresentei o nosso modelo de desperdício zero num encontro internacional sobre alimentos em Genebra.","Seria um prazer ter a oportunidade de conversar sobre como essa experiência pode apoiar as metas da Nordhaven. Agradeço pelo seu tempo e pela sua consideração.","Atenciosamente, Clara Jansen"],"spots":[{"use":"pp-since","clue":"For the past six years","tl":"the past six years","why":"For the past six years = up to today, and she still has this job. For + a period up to now → present perfect — the standard way to describe your current role in a cover letter.","whyPt":"For the past six years (nos últimos seis anos) = até hoje, e ela continua nesse emprego. For + período até agora → present perfect — o jeito padrão de descrever o cargo atual numa carta de apresentação. Em português: \"há seis anos administro\" (presente!).","pt":"administro (há seis anos)"},{"use":"pp-period","clue":"Under my leadership","tl":"under her leadership","why":"Under my leadership = during a period that is still going on: she still leads the program, and the numbers keep improving. Unfinished period → present perfect.","whyPt":"Under my leadership (sob a minha liderança) = durante um período que continua: ela ainda lidera, e os números seguem melhorando. Período não terminado → present perfect.","pt":"reduziu"},{"use":"ps-ended","clue":"Before Brightfield","tl":"four years (over)","why":"Four years, but that job is over: it was before Brightfield. Previous jobs in a CV or cover letter take the past simple, even with for.","whyPt":"Quatro anos, mas esse emprego acabou: foi antes da Brightfield. Empregos anteriores num currículo ou numa carta vão para o past simple, mesmo com for.","pt":"trabalhei (por quatro anos)"},{"use":"ps-time","clue":"In 2022","why":"In 2022 is a finished time, so we use the past simple.","whyPt":"In 2022 é um tempo terminado: past simple.","pt":"apresentei"}],"w":{"apply for":"candidatar-se a","position":"cargo, vaga","sustainability":"sustentabilidade","managed":"administrar, gerenciar","grocery chain":"rede de supermercados","leadership":"liderança","reduced":"reduzir","food waste":"desperdício de alimentos","quarter":"trimestre","worked":"trabalhar","consultant":"consultor(a)","advising":"orientando, aconselhando","emissions":"emissões","presented":"apresentar","summit":"encontro, cúpula","would welcome":"ficaria feliz com","yours sincerely":"atenciosamente"}},{"id":"b2-15","kind":"dialogue","contract":true,"frame":"Radio interview","framePt":"Entrevista de rádio","title":"Writing in someone else's shadow","titlePt":"Escrevendo à sombra de alguém","voices":{"Priya":"f","Marcus":"m"},"body":[["Priya","Your new novel opens with a few lines for the poet Ruth Adler. Who was she to you?"],["Marcus","Honestly? A kind of compass. I [have:chatted] with her exactly once, at a reading in Dublin {twenty years ago}, and I [have:quoted] her in every book {since then}."],["Priya","She {left us in 2009}, I believe."],["Marcus","She did. She [has:lived] her last years in a tiny cottage on the west coast of Ireland, writing every single morning."],["Priya","And this book is your fifth. Was it different?"],["Marcus","Completely. It's {the first time} I [have:attempted] a novel with no plan at all. Ruth would have found that hilarious — she never made a plan in her life."]],"pt":["O seu novo romance começa com algumas linhas para a poeta Ruth Adler. Quem ela era para você?","Sinceramente? Uma espécie de bússola. Conversei com ela exatamente uma vez, numa leitura em Dublin, há vinte anos, e desde então cito ela em todos os livros.","Ela nos deixou em 2009, se não me engano.","Foi. Ela viveu os últimos anos numa casinha minúscula no litoral oeste da Irlanda, escrevendo todas as manhãs.","E este livro é o seu quinto. Foi diferente?","Totalmente. É a primeira vez que tento escrever um romance sem plano nenhum. A Ruth ia achar isso hilário — ela nunca fez um plano na vida."],"spots":[{"use":"ps-time","clue":"twenty years ago","why":"Exactly once sounds like life experience, but twenty years ago fixes a finished moment. Once + ago → past simple.","whyPt":"Exactly once (exatamente uma vez) parece experiência, mas twenty years ago (há vinte anos) fixa um momento terminado. Once + ago → past simple. Cuidado: aqui \"há\" = ago.","pt":"conversei"},{"use":"pp-since","clue":"since then","why":"From that evening up to now — and he still quotes her (in this new book too). Since → present perfect.","whyPt":"Daquela noite até agora — e ele continua citando a poeta (neste livro novo também). Since → present perfect. Em português: \"desde então cito\" (presente!).","pt":"cito (desde então)"},{"use":"ps-ended","clue":"left us in 2009","tl":"her last years","why":"Her last years are a finished period: she \"left us\" (died) in 2009. Someone who has died can't have a present-perfect life.","whyPt":"Os últimos anos dela são um período terminado: ela morreu em 2009. Quem já morreu não tem uma vida no present perfect.","pt":"viveu"},{"use":"pp-exp","clue":"the first time","why":"It's the first time… takes the present perfect: his writing life up to now has never included a novel without a plan.","whyPt":"It's the first time… pede present perfect: a vida de escritor dele, até agora, nunca incluiu um romance sem plano. Em português usamos o presente (\"é a primeira vez que tento\").","pt":"tento (pela primeira vez)"}],"w":{"novel":"romance","poet":"poeta","compass":"bússola","chatted":"conversar","reading":"leitura (evento)","quoted":"citar","left us":"nos deixou (= morreu)","lived":"viver","cottage":"casinha de campo","west coast":"litoral oeste","every single":"todas as, cada uma das","attempted":"tentar","hilarious":"hilário"}},{"id":"b2-16","kind":"text","contract":true,"frame":"Acceptance speech","framePt":"Discurso de agradecimento","title":"Thank you — and a confession","titlePt":"Obrigado — e uma confissão","body":["Thank you. Truly. When my phone rang {last week} and a stranger said the words \"blogging award\", I [have:assumed] it was a joke.","I'm a nurse, not a writer. I [have:worked] night shifts at St. Anne's Hospital {for twenty-two years}, and {I'll be back there} on Monday night.","This blog began as a way to stay sane after long shifts. {In its first year}, exactly eleven people [have:visited] it — four of them were my sisters.","{Over the past decade}, though, strangers from more than ninety countries [have:shared] their own hospital stories with me, and every one of them has kept me going.","Oh — and I [have:just realized] my notes are still in the car. So, no speech.","Just thank you: to my patients, to my sisters, and to every one of you."],"pt":["Muito obrigado. De verdade. Quando o meu telefone tocou na semana passada e uma pessoa desconhecida disse as palavras \"prêmio de blog\", achei que fosse brincadeira.","Eu trabalho com enfermagem, não com escrita. Faço plantões noturnos no Hospital St. Anne há vinte e dois anos, e volto pra lá na segunda à noite.","Este blog começou como um jeito de manter a sanidade depois de plantões longos. No primeiro ano, exatamente onze pessoas visitaram o blog — quatro delas eram minhas irmãs.","Mas, ao longo da última década, pessoas desconhecidas de mais de noventa países compartilharam comigo as suas próprias histórias de hospital, e cada uma delas me deu forças para continuar.","Ah — e acabei de perceber que as minhas anotações ainda estão no carro. Então, nada de discurso.","Só quero agradecer: aos meus pacientes, às minhas irmãs e a cada um de vocês."],"spots":[{"use":"ps-time","clue":"last week","why":"The when-clause places the moment last week — a finished time. Assumed belongs to that same moment.","whyPt":"A oração com when situa o momento na semana passada — tempo terminado. Assumed pertence a esse mesmo momento. Em português: \"achei que fosse\".","pt":"achei, supus"},{"use":"pp-since","clue":["for twenty-two years","I'll be back there"],"tl":"for 22 years","why":"Twenty-two years up to now, and the job goes on (\"I'll be back there on Monday\"). For + still true → present perfect.","whyPt":"Vinte e dois anos até agora, e o trabalho continua (\"volto pra lá na segunda\"). Em português: \"faço plantões há 22 anos\" (presente!) — esse \"há\" é for, não ago.","pt":"faço plantões (há 22 anos)"},{"use":"ps-time","clue":"In its first year","tl":"its first year","why":"In its first year = a finished period, about ten years ago. Past simple — like were in the same sentence.","whyPt":"In its first year (no primeiro ano) = um período terminado, há uns dez anos. Past simple — como were na mesma frase.","pt":"visitaram"},{"use":"pp-period","clue":"Over the past decade","tl":"the past decade","why":"Over the past decade = the ten years up to now, and the stories are still arriving. Unfinished period → present perfect.","whyPt":"Over the past decade (ao longo da última década) = os dez anos até agora, e as histórias continuam chegando. Período não terminado → present perfect.","pt":"compartilharam (ao longo da última década)"},{"use":"pp-news","both":{"alt":"ps-context","tlPp":"a moment ago (BrE)","tlPs":"a moment ago (AmE)","pp":"the standard British choice: fresh news, connected to now","ppPt":"a escolha padrão no inglês britânico: novidade fresca, ligada ao agora","ps":"very common in American English: just + past simple for a moment ago","psPt":"muito comum no inglês americano: just + past simple para algo de agora há pouco"},"why":"Both are correct, and the meaning hardly changes: it's a matter of variety. British English prefers I've just realized; American English often says I just realized.","whyPt":"As duas formas estão certas, e o sentido quase não muda: é questão de variedade. O inglês britânico prefere I've just realized; o americano diz muito I just realized. Em português: \"acabei de perceber\".","pt":"acabei de perceber"}],"w":{"truly":"de verdade","rang":"tocou (ring)","stranger":"desconhecido(a)","award":"prêmio","assumed":"supor, achar","nurse":"enfermeiro(a)","night shifts":"plantões noturnos","worked":"trabalhar","stay sane":"manter a sanidade","visited":"visitar","decade":"década","shared":"compartilhar","kept me going":"me deu forças para continuar","realized":"perceber","notes":"anotações"}},{"id":"b2-17","kind":"chat","contract":true,"title":"The client from hell","titlePt":"O cliente dos infernos","voices":{"Hannah":"f","Omar":"m"},"body":[["Hannah","You alive? 😅 Heard the Fenwick launch is a mess"],["Omar","Barely. Their CEO [has:changed] the brief {three times since Friday}. Three!"],["Hannah","Classic Fenwick. Same thing as {last spring}, right?"],["Omar","Yep. {Back then} they [have:scrapped] the whole campaign two days before launch 🙃"],["Hannah","Want me to step in? I [have:handled] their marketing director {before}. She's tough, but fair."],["Omar","Would you?? 🙏 I [have:redesigned] this deck {twice since breakfast} and {I'm getting nowhere}."],["Hannah","On it. Send me the latest version and go grab some lunch 🥪"]],"pt":["Sobreviveu? 😅 Ouvi dizer que o lançamento da Fenwick tá uma bagunça","Por pouco. O CEO deles já mudou o briefing três vezes desde sexta. Três!","Típico da Fenwick. Igual à primavera passada, né?","Pois é. Naquela vez, eles cancelaram a campanha inteira dois dias antes do lançamento 🙃","Quer que eu entre no meio? Já lidei com a diretora de marketing deles antes. Ela é durona, mas justa.","Você faria isso?? 🙏 Já refiz essa apresentação duas vezes desde o café da manhã e não saio do lugar.","Deixa comigo. Me manda a última versão e vai almoçar 🥪"],"spots":[{"use":"pp-since","clue":"three times since Friday","tl":"3 times since Friday","why":"Since Friday = from Friday up to now, and the count can still grow (he may change it again!). Since → present perfect.","whyPt":"Since Friday (desde sexta) = de sexta até agora, e a contagem ainda pode crescer (ele pode mudar de novo!). Since → present perfect. Em português: \"já mudou três vezes desde sexta\".","pt":"já mudou (desde sexta)"},{"use":"ps-context","clue":["last spring","Back then"],"tl":"last spring","why":"Back then points to last spring, a finished time Hannah has just mentioned. The context fixes WHEN → past simple.","whyPt":"Back then (naquela vez) aponta para a primavera passada, um tempo terminado que a Hannah acabou de mencionar. O contexto diz QUANDO → past simple.","pt":"cancelaram"},{"use":"pp-exp","clue":"before","tl":"at some point so far","why":"Before, with no time given, means at some point up to now — an experience she can use today. Present perfect.","whyPt":"Before (antes), sem tempo definido, quer dizer em algum momento até agora — uma experiência que ela pode usar hoje. Present perfect. Em português: \"já lidei com ela antes\".","pt":"já lidei"},{"use":"pp-since","clue":["twice since breakfast","I'm getting nowhere"],"tl":"twice since breakfast","why":"Since breakfast = from breakfast up to now, and he's still at it (I'm getting nowhere — right now), so the count may grow. Since → present perfect.","whyPt":"Since breakfast (desde o café da manhã) = do café até agora, e ele continua tentando (I'm getting nowhere — não saio do lugar, agora), então a contagem pode crescer. Since → present perfect. Em português: \"já refiz duas vezes desde o café\".","pt":"já refiz (duas vezes desde o café)"}],"w":{"launch":"lançamento","mess":"bagunça","barely":"por pouco","brief":"briefing (instruções do cliente)","changed":"mudar","back then":"naquela vez, na época","scrapped":"cancelar, descartar","step in":"intervir, entrar no meio","handled":"lidar com","tough":"durona","fair":"justa","redesigned":"refazer (o design)","breakfast":"café da manhã","deck":"apresentação (slides)","getting nowhere":"não sair do lugar","on it":"deixa comigo","grab":"pegar (rapidinho)"}},{"id":"b2-18","kind":"text","frame":"Book review","framePt":"Resenha de livro","title":"A quiet masterpiece, finally in English","titlePt":"Uma obra-prima discreta, enfim em inglês","body":["Few novels arrive in English trailing as much legend as The Salt Orchard.","Its author, the Georgian writer Tamar Beridze, [has:finished] the manuscript {in 1987}, two years before her death, and it then sat in a drawer for three decades.","Beridze [has:published] only two slim books of poetry {in her lifetime}; this novel was the secret she kept.","Her translator, Sofia Brandt, [has:translated] {more than twenty} Georgian novels, yet she calls this one the hardest of her career.","The effort was worth it. {Since its release in March}, the book [has:topped] bestseller lists in four countries — not bad for a manuscript that almost nobody read for thirty-five years."],"pt":["Poucos romances chegam ao inglês carregando tanta lenda quanto O Pomar de Sal.","A autora, a escritora georgiana Tamar Beridze, terminou o manuscrito em 1987, dois anos antes de morrer, e ele depois ficou numa gaveta por três décadas.","Beridze publicou apenas dois livrinhos de poesia em vida; este romance era o segredo que ela guardava.","A tradutora, Sofia Brandt, já traduziu mais de vinte romances georgianos, mas diz que este foi o mais difícil da sua carreira.","O esforço valeu a pena. Desde o lançamento, em março, o livro chegou ao topo das listas de mais vendidos em quatro países — nada mal para um manuscrito que quase ninguém leu durante trinta e cinco anos."],"spots":[{"use":"ps-time","clue":"in 1987","why":"In 1987 is a finished time. The novel is new in English, but it was written long ago.","whyPt":"In 1987 é um tempo terminado. O romance é novo em inglês, mas foi escrito há muito tempo.","pt":"terminou"},{"use":"ps-ended","clue":"in her lifetime","tl":"her lifetime (over)","why":"In her lifetime = the life of a writer who has died, a finished period. Even with a number of books, a dead author's work → past simple.","whyPt":"In her lifetime (em vida) = a vida de uma escritora que já morreu, período terminado. Mesmo com um número de livros, a obra de quem já morreu → past simple. Compare com a tradutora, viva, logo abaixo.","pt":"publicou (em vida)"},{"use":"pp-exp","clue":"more than twenty","tl":"20+ novels so far","why":"Brandt is alive and still working: more than twenty novels is her career up to now, and the number can grow. Compare Beridze, whose two books are a closed account.","whyPt":"Brandt está viva e em atividade: mais de vinte romances é a carreira dela até agora, e o número pode crescer. Compare com Beridze, cuja obra está encerrada.","pt":"já traduziu"},{"use":"pp-since","clue":"Since its release in March","tl":"since March","why":"From March up to now, and the book is still selling. Since → present perfect.","whyPt":"De março até agora, e o livro continua vendendo. Since → present perfect.","pt":"chegou ao topo (desde março)"}],"w":{"trailing":"carregando, arrastando","legend":"lenda","finished":"terminar","manuscript":"manuscrito","drawer":"gaveta","published":"publicar","slim":"fino","in her lifetime":"em vida","kept":"guardava (keep)","translated":"traduzir","yet":"mas, ainda assim","worth it":"valeu a pena","release":"lançamento","topped":"liderar, chegar ao topo","bestseller lists":"listas de mais vendidos"}},{"id":"b2-19","kind":"text","frame":"Public statement","framePt":"Comunicado oficial","title":"An apology to our passengers","titlePt":"Um pedido de desculpas aos nossos passageiros","body":["{Over the past ten days}, thousands of you [have:experienced] delays, missing bags and, in too many cases, silence from us. I am deeply sorry.","The trouble began {on March 3}, when a faulty software update [has:crashed] our booking system for almost fourteen hours.","{Since then}, our teams [have:worked] around the clock, and 96% of our flights are once again on time.","{Last Friday}, we [have:contacted] every passenger with a delay of more than three hours, and we [have:already refunded] over 40,000 tickets.","Apologies are cheap, and we know it. What we do in the coming months will show whether we mean this one.","— Laila Haddad, CEO, SkyMeridian"],"pt":["Nos últimos dez dias, milhares de vocês enfrentaram atrasos, malas extraviadas e, em casos demais, o nosso silêncio. Peço sinceras desculpas.","Os problemas começaram em 3 de março, quando uma atualização de software com defeito derrubou o nosso sistema de reservas por quase catorze horas.","Desde então, as nossas equipes trabalham dia e noite, e 96% dos nossos voos estão novamente no horário.","Na sexta-feira passada, entramos em contato com todos os passageiros com atraso de mais de três horas, e já reembolsamos mais de 40.000 passagens.","Pedidos de desculpa são baratos, e nós sabemos disso. O que fizermos nos próximos meses vai mostrar se este é sincero.","— Laila Haddad, CEO, SkyMeridian"],"spots":[{"use":"pp-period","clue":"Over the past ten days","tl":"the past ten days","why":"Over the past ten days = the period up to today, and passengers are still dealing with the effects. Unfinished period → present perfect.","whyPt":"Over the past ten days (nos últimos dez dias) = o período até hoje, e os passageiros ainda sentem os efeitos. Período não terminado → present perfect.","pt":"enfrentaram"},{"use":"ps-time","clue":"on March 3","why":"On March 3 fixes a finished moment, and the when-clause belongs to it → past simple.","whyPt":"On March 3 (em 3 de março) fixa um momento terminado, e a oração com when pertence a ele → past simple.","pt":"derrubou"},{"use":"pp-since","clue":"Since then","why":"From the crash up to now, and the work goes on. Since → present perfect.","whyPt":"Da pane até agora, e o trabalho continua. Since → present perfect. Em português: \"desde então trabalham\" (presente!).","pt":"trabalham (desde então)","cont":{"en":"Since then, our teams have been working around the clock.","why":"An effort still in progress, and the sentence stresses the activity, not a result: have been + -ing is more natural.","whyPt":"Um esforço ainda em andamento, e a frase destaca a atividade, não um resultado: have been + -ing soa mais natural."}},{"use":"ps-time","clue":"Last Friday","why":"Last Friday is a finished time, so we use the past simple.","whyPt":"Last Friday (na sexta-feira passada) é um tempo terminado: past simple.","pt":"entramos em contato"},{"use":"pp-news","both":{"alt":"ps-context","tlPp":"already (BrE)","tlPs":"already (AmE)","pp":"the standard British choice: a result that matters now","ppPt":"a escolha padrão no inglês britânico: um resultado que importa agora","ps":"common in American English: already + past simple","psPt":"comum no inglês americano: already + past simple"},"why":"Both are correct. With already, British English uses the present perfect (a result that matters now); American English often uses the past simple. No time word is attached to the refunds, so either works.","whyPt":"As duas formas estão certas. Com already, o inglês britânico usa o present perfect (um resultado que importa agora); o americano usa muito o past simple. Nenhuma palavra de tempo está ligada aos reembolsos, então as duas funcionam. Em português: \"já reembolsamos\".","pt":"já reembolsamos"}],"w":{"experienced":"passar por, enfrentar","delays":"atrasos","missing bags":"malas extraviadas","deeply sorry":"profundamente arrependido","faulty":"com defeito","update":"atualização","crashed":"derrubar (um sistema), travar","booking system":"sistema de reservas","worked":"trabalhar","around the clock":"dia e noite","contacted":"entrar em contato com","refunded":"reembolsar","tickets":"passagens","cheap":"baratos","mean":"falar sério (mean it)"}},{"id":"b2-20","kind":"text","contract":true,"frame":"Personal essay","framePt":"Ensaio pessoal","title":"The house on Linden Street","titlePt":"A casa da Linden Street","body":["My grandparents [have:owned] the house on Linden Street for fifty-one years, {until the bank took it in 2003}.","I [have:climbed] the oak in the backyard exactly once, {the summer I was nine}, and broke my wrist on the way down.","{Last month}, for the first time in twenty years, I [have:walked] up Linden Street again.","A young couple [has:lived] in the house {since 2015}. They kept the yellow kitchen, but the oak is gone; only a pale circle in the grass remains.","Their daughter, who is nine, took me upstairs to see her room — my old room. {Since that visit}, I [have:dreamed] about the oak almost every night."],"pt":["Os meus avós foram donos da casa da Linden Street por cinquenta e um anos, até o banco tomá-la em 2003.","Subi no carvalho do quintal exatamente uma vez, no verão em que eu tinha nove anos, e quebrei o pulso na descida.","No mês passado, pela primeira vez em vinte anos, subi a Linden Street de novo.","Um casal jovem mora na casa desde 2015. Eles mantiveram a cozinha amarela, mas o carvalho não existe mais; só resta um círculo claro na grama.","A filha deles, que tem nove anos, me levou lá em cima para ver o quarto dela — o meu antigo quarto. Desde essa visita, sonho com o carvalho quase todas as noites."],"spots":[{"use":"ps-ended","clue":"until the bank took it in 2003","tl":"51 years (until 2003)","why":"Fifty-one years, but that situation ended: until the bank took it in 2003. For + until a finished point → past simple.","whyPt":"Cinquenta e um anos, mas essa situação acabou: until the bank took it in 2003 (até o banco tomá-la). For + until um ponto terminado → past simple.","pt":"foram donos (por 51 anos)"},{"use":"ps-time","clue":"the summer I was nine","why":"Exactly once sounds like life experience, but the summer I was nine fixes WHEN. Once + a finished time → past simple.","whyPt":"Exactly once (exatamente uma vez) parece experiência, mas the summer I was nine (o verão em que eu tinha nove anos) fixa QUANDO. Once + tempo terminado → past simple.","pt":"subi"},{"use":"ps-time","clue":"Last month","why":"Last month is a finished time. Careful: for the first time does NOT call for the present perfect — only this is / it's the first time does.","whyPt":"Last month (no mês passado) é tempo terminado. Cuidado: for the first time (pela primeira vez) NÃO pede present perfect — só this is / it's the first time pede.","pt":"subi (a rua)"},{"use":"pp-since","clue":"since 2015","why":"From 2015 up to now — they still live there. Compare the grandparents' fifty-one years, which ended in 2003.","whyPt":"De 2015 até agora — eles ainda moram lá. Compare com os 51 anos dos avós, que terminaram em 2003. Em português: \"mora desde 2015\" (presente!).","pt":"mora (desde 2015)"},{"use":"pp-since","clue":"Since that visit","why":"From last month's visit up to now, and the dreams continue. Since → present perfect.","whyPt":"Da visita do mês passado até agora, e os sonhos continuam. Em português: \"desde essa visita, sonho\" (presente!).","pt":"sonho (desde essa visita)"}],"w":{"owned":"ser dono de","took":"tomou (take)","climbed":"subir (em), escalar","oak":"carvalho","backyard":"quintal","wrist":"pulso","on the way down":"na descida","walked":"caminhar (walk up = subir a pé)","couple":"casal","lived":"morar","kept":"mantiveram (keep)","pale":"claro, pálido","grass":"grama","remains":"resta, permanece","upstairs":"no andar de cima","dreamed":"sonhar"}},{"id":"b2-21","kind":"text","frame":"Travel essay","framePt":"Ensaio de viagem","title":"Eleven hours in Oruro","titlePt":"Onze horas em Oruro","body":["{In the winter of 2009}, I [have:waited] eleven hours for a train in a small station in Bolivia.","{At first}, I [have:watched] the empty tracks with growing impatience.","{Then} I [have:started] talking to an old man who was selling empanadas on the platform. By midnight, I knew his whole family history.","I [have:returned] to Bolivia {four times since}, and I have never again been in a hurry."],"pt":["No inverno de 2009, esperei onze horas por um trem numa pequena estação na Bolívia.","No começo, eu olhava os trilhos vazios com uma impaciência crescente.","Então comecei a conversar com um senhor que vendia empanadas na plataforma. À meia-noite, eu conhecia toda a história da família dele.","Voltei à Bolívia quatro vezes desde então, e nunca mais tive pressa."],"spots":[{"use":"ps-time","clue":"In the winter of 2009","why":"In the winter of 2009 is a finished time: past simple.","whyPt":"No inverno de 2009 = um tempo terminado: past simple.","pt":"esperei"},{"use":"ps-context","clue":"At first","tl":"that night","why":"At first = the first hours of that wait, which is long over: past simple.","whyPt":"At first (no começo) = as primeiras horas daquela espera, que já acabou: past simple. Em português: \"olhava\".","pt":"olhava"},{"use":"ps-story","clue":"Then","why":"Then = the next event of the story: past simple.","whyPt":"Then (então) = o próximo fato da história: past simple.","pt":"comecei"},{"use":"pp-exp","clue":"four times since","tl":"four times up to now","why":"Four times since (then) = how many times up to now: present perfect.","whyPt":"Quatro vezes desde então, até agora: present perfect. Em português fica no pretérito: \"voltei\".","pt":"voltei (quatro vezes desde então)"}],"w":{"waited":"esperar","watched":"observar, olhar","tracks":"trilhos","growing":"crescente","impatience":"impaciência","started":"começar","platform":"plataforma","returned":"voltar","in a hurry":"com pressa"}},{"id":"b2-22","kind":"text","frame":"Arts news","framePt":"Notícia de arte","title":"A lost painting in a Lyon attic","titlePt":"Uma pintura perdida num sótão de Lyon","body":["{In a remarkable discovery}, a family in Lyon [has:uncovered] a long-lost painting by Marguerite Vey in their attic.","The canvas [has:disappeared] from a Paris gallery {in 1944}, during the last months of the war.","The current owners [have:inherited] the house {in 2003}, without the faintest idea of what lay under the roof.","{Since the discovery}, the painting [has:remained] in a bank vault.","{Over the past week}, more than a dozen museums [have:contacted] the family."],"pt":["Numa descoberta notável, uma família de Lyon encontrou no sótão uma pintura de Marguerite Vey que estava perdida havia muito tempo.","A tela desapareceu de uma galeria de Paris em 1944, nos últimos meses da guerra.","Os atuais donos herdaram a casa em 2003, sem a menor ideia do que havia debaixo do telhado.","Desde a descoberta, a pintura está no cofre de um banco.","Na última semana, mais de uma dúzia de museus entraram em contato com a família."],"spots":[{"use":"pp-news","clue":"In a remarkable discovery","why":"This is the news, in the first sentence: it's new and it matters now. No time is given.","whyPt":"É a notícia, na primeira frase: é novidade e importa agora. Nenhum tempo é dito. Em português: \"encontrou\".","pt":"encontrou"},{"use":"ps-time","clue":"in 1944","why":"In 1944 is a finished time: past simple.","whyPt":"Em 1944 = tempo terminado: past simple.","pt":"desapareceu"},{"use":"ps-time","clue":"in 2003","why":"In 2003 is a finished time: past simple.","whyPt":"Em 2003 = tempo terminado: past simple.","pt":"herdaram"},{"use":"pp-since","clue":"Since the discovery","why":"From the discovery up to now, it's still there: since + present perfect.","whyPt":"Da descoberta até agora, ela continua lá: since + present perfect. Em português: \"desde a descoberta, está\" (presente!).","pt":"está (desde a descoberta)"},{"use":"pp-period","clue":"Over the past week","tl":"the past week","why":"Over the past week = the seven days up to now: present perfect. (Last week → past simple.)","whyPt":"Over the past week (na última semana) = os sete dias até hoje: present perfect. \"Na semana passada\" seria last week → past simple.","pt":"entraram em contato"}],"w":{"remarkable":"notável","uncovered":"descobrir, encontrar","long-lost":"perdido há muito tempo","attic":"sótão","canvas":"tela","disappeared":"desaparecer","inherited":"herdar","faintest idea":"a menor ideia","remained":"permanecer, ficar","vault":"cofre","contacted":"contatar"}},{"id":"b2-23","kind":"dialogue","frame":"Podcast interview","framePt":"Entrevista em podcast","contract":true,"title":"Mandarin at sixty","titlePt":"Mandarim aos sessenta","voices":{"Host":"m","Rosa":"f"},"body":[["Host","Rosa, you took up Mandarin at sixty. Why?"],["Rosa","My granddaughter [has:started] school in Shanghai {three years ago}, and I want to be able to talk to her."],["Host","How has it gone?"],["Rosa","Slowly! But {since then}, I [have:practiced] every single morning."],["Host","Has it paid off?"],["Rosa","Absolutely. {Last month}, I [have:chatted] with her teacher for twenty minutes, in Mandarin! It's {the first time} I [have:managed] a real conversation."],["Host","{Your late husband} was a linguist, wasn't he?"],["Rosa","He was. He [has:translated] Chinese poetry for most of his life. He would laugh at my accent!"]],"pt":["Rosa, você começou a estudar mandarim aos sessenta. Por quê?","Minha neta começou a escola em Xangai há três anos, e eu quero conseguir conversar com ela.","E como tem sido?","Devagar! Mas desde então, pratico todas as manhãs.","Valeu a pena?","Com certeza. No mês passado, conversei com a professora dela por vinte minutos, em mandarim! É a primeira vez que consigo ter uma conversa de verdade.","Seu falecido marido era linguista, não era?","Era. Ele traduziu poesia chinesa durante a maior parte da vida. Ele ia rir do meu sotaque!"],"spots":[{"use":"ps-time","clue":"three years ago","why":"Ago points to a finished moment: past simple.","whyPt":"Aqui \"há três anos\" = ago (quando começou): past simple.","pt":"começou"},{"use":"pp-since","clue":"since then","why":"From three years ago up to now, and she still practices: since + present perfect.","whyPt":"De três anos atrás até agora, e ela continua: since + present perfect. Em português: \"desde então, pratico\" (presente!).","pt":"pratico (desde então)","cont":{"en":"But since then, I've been practicing every single morning.","why":"A repeated activity that is still going on: have been + -ing is more common here.","whyPt":"Uma atividade repetida que ainda continua: aqui have been + -ing é mais comum."}},{"use":"ps-time","clue":"Last month","why":"Last month is a finished time: past simple.","whyPt":"Last month (no mês passado) é um tempo terminado: past simple.","pt":"conversei"},{"use":"pp-exp","clue":"the first time","tl":"first time up to now","why":"It's the first time… = the first time in her life up to now: present perfect.","whyPt":"\"É a primeira vez que…\" pede present perfect em inglês, mesmo com o presente em português (consigo).","pt":"consigo"},{"use":"ps-ended","clue":"Your late husband","tl":"his life (over)","why":"Her husband has died (late = dead), so his life's work is over: past simple, even with for most of his life.","whyPt":"O marido dela já morreu (late = falecido): a obra da vida dele acabou. Past simple, mesmo com for most of his life.","pt":"traduziu"}],"w":{"took up":"começar (um hobby, um estudo)","started":"começar","practiced":"praticar","paid off":"valer a pena","chatted":"conversar, bater papo","managed":"conseguir","late husband":"falecido marido","translated":"traduzir","poetry":"poesia","accent":"sotaque"}},{"id":"b2-24","kind":"text","frame":"Formal email","framePt":"E-mail formal","title":"Noise from the construction site","titlePt":"Barulho da obra","body":["Dear Mr. Patel, I am writing about the construction work next to our building on Grove Road.","The work [has:started] {on March 3}, and at first the noise was bearable.","{Since April 15}, however, the drilling [has:continued] until 10 p.m. every night.","{On two occasions last week}, I [have:contacted] your site office, without any reply.","{To date}, three residents [have:filed] formal complaints with the city council. I hope we can resolve this quickly. Sincerely, Laura Kim"],"pt":["Prezado Sr. Patel, escrevo a respeito da obra ao lado do nosso prédio na Grove Road.","A obra começou em 3 de março, e no início o barulho era suportável.","Desde 15 de abril, porém, a perfuração continua até as 22h todas as noites.","Em duas ocasiões na semana passada, entrei em contato com o escritório da obra, sem nenhuma resposta.","Até o momento, três moradores registraram reclamações formais na prefeitura. Espero que possamos resolver isso rapidamente. Atenciosamente, Laura Kim"],"spots":[{"use":"ps-time","clue":"on March 3","why":"On March 3 is a finished time: past simple.","whyPt":"On March 3 (em 3 de março) é um tempo terminado: past simple.","pt":"começou"},{"use":"pp-since","clue":"Since April 15","why":"From April 15 up to now, and it's still going on: since + present perfect.","whyPt":"De 15 de abril até agora, e continua: since + present perfect. Em português: \"desde 15 de abril, continua\" (presente!).","pt":"continua (desde 15 de abril)"},{"use":"ps-time","clue":"On two occasions last week","why":"Last week is a finished time: past simple.","whyPt":"Last week (na semana passada) é um tempo terminado: past simple.","pt":"entrei em contato"},{"use":"pp-period","clue":"To date","tl":"to date","why":"To date = up to now (a formal so far). More complaints may come.","whyPt":"To date (até o momento) = um so far mais formal: até agora, e pode haver mais.","pt":"registraram (até o momento)"}],"w":{"construction work":"obra","started":"começar","bearable":"suportável","drilling":"perfuração","continued":"continuar","occasions":"ocasiões","contacted":"contatar","reply":"resposta","residents":"moradores","filed":"registrar (uma queixa)","complaints":"reclamações","city council":"prefeitura, câmara municipal"}},{"id":"b2-25","kind":"text","frame":"Exhibition text","framePt":"Texto de exposição","title":"Thirty-two years of storms","titlePt":"Trinta e dois anos de tempestades","body":["For thirty-two years, Agnes Byrne [has:tended] the Kilmore lighthouse alone, {until its automation in 1978}.","{Throughout those years}, she [has:recorded] every storm, every ship and every visitor in a leather diary.","{Since 2019}, her great-niece Clare [has:transcribed] the diaries, page by page.","{So far}, Clare [has:published] six volumes. The seventh, on the great storm of 1961, is on display in this room."],"pt":["Por trinta e dois anos, Agnes Byrne cuidou sozinha do farol de Kilmore, até a sua automação em 1978.","Ao longo desses anos, ela registrou cada tempestade, cada navio e cada visitante num diário de couro.","Desde 2019, sua sobrinha-neta Clare transcreve os diários, página por página.","Clare já publicou seis volumes. O sétimo, sobre a grande tempestade de 1961, está exposto nesta sala."],"spots":[{"use":"ps-ended","clue":"until its automation in 1978","tl":"until 1978","why":"Until its automation in 1978 = her job ended then: past simple, even with for thirty
