os detalhes: quando aconteceu? On Monday morning — um tempo terminado. Notícia: primeiro present perfect, depois past simple nos detalhes.","pt":"lançou"},{"use":"pp-since","clue":"Since May","why":"From May up to now, and the lanes are still popular. Since → present perfect.","whyPt":"De maio até agora, e as ciclovias continuam populares. Em português fica no pretérito (\"aumentou desde maio\"), mas em inglês since pede present perfect.","pt":"aumentou (desde maio)"},{"use":"pp-period","clue":"In the last few weeks","tl":"the last few weeks","why":"In the last few weeks = a period that continues up to now. The complaints are still coming.","whyPt":"In the last few weeks (nas últimas semanas) = um período que vai até agora. As reclamações continuam.","pt":"reclamaram"},{"use":"ps-time","clue":"In 2022","why":"In 2022 is a finished time, so we use the past simple — like took, right after it.","whyPt":"In 2022 é um tempo terminado, então usamos o past simple — como took, logo depois.","pt":"juntaram"}],"w":{"opened":"abrir, inaugurar","bike lanes":"ciclovias","cyclists":"ciclistas","celebrating":"comemorando","mayor":"prefeito(a)","launched":"lançar","ride":"passeio (de bicicleta)","downtown":"centro (da cidade)","increased":"aumentar","though":"porém, mas","complained":"reclamar","traffic jams":"engarrafamentos","high school":"ensino médio","collected":"juntar, coletar","signatures":"assinaturas","took":"levaram (take)","city hall":"prefeitura"}},{"id":"b1-05","kind":"text","frame":"A special person","framePt":"Uma pessoa especial","title":"My grandmother, the traveler","titlePt":"Minha avó, a viajante","body":["My grandmother Rosa is 82, and she's the most adventurous person I know. She [has:visited] {more than forty countries}, and {right now she's planning} a trip to Japan!","My grandfather Paulo was her travel partner. They [have:traveled] together for almost fifty years, {until his death in 2016}.","{In 1975}, they [have:sailed] across the Atlantic in a small boat. Our family still talks about it!","Grandma [has:lived] alone {since 2016}, but she's never lonely. {Over the years}, she [has:collected] almost 500 postcards from her trips, and she adds new ones every year."],"pt":["Minha avó Rosa tem 82 anos e é a pessoa mais aventureira que eu conheço. Ela já visitou mais de quarenta países, e agora mesmo está planejando uma viagem para o Japão!","Meu avô Paulo era o parceiro de viagens dela. Eles viajaram juntos por quase cinquenta anos, até a morte dele, em 2016.","Em 1975, eles atravessaram o Atlântico num barco pequeno. A nossa família fala disso até hoje!","A vovó mora sozinha desde 2016, mas nunca se sente só. Ao longo dos anos, ela juntou quase 500 cartões-postais das viagens, e acrescenta novos todo ano."],"spots":[{"use":"pp-exp","clue":["more than forty countries","right now she's planning"],"tl":"40+ countries so far","why":"Her life experience up to now: no time is given, and her traveling life isn't over — she's planning a trip right now, so the number can still grow.","whyPt":"Experiência de vida até agora: nenhum tempo é dito, e a vida de viagens dela não acabou — ela está planejando uma viagem agora, então o número ainda pode crescer.","pt":"já visitou"},{"use":"ps-ended","clue":"until his death in 2016","tl":"50 years (until 2016)","why":"Almost fifty years, but that time is over: it ended with his death in 2016. For does NOT always mean present perfect!","whyPt":"Quase cinquenta anos, mas esse tempo acabou: terminou com a morte dele, em 2016. For NÃO significa sempre present perfect!","pt":"viajaram (por quase cinquenta anos)"},{"use":"ps-time","clue":"In 1975","why":"In 1975 is a finished time, so we use the past simple.","whyPt":"In 1975 é um tempo terminado: past simple.","pt":"atravessaram (de barco)"},{"use":"pp-since","clue":"since 2016","why":"From 2016 up to now — and she still lives alone. Compare: the fifty years with Grandpa are over (past simple), but this situation continues (present perfect).","whyPt":"De 2016 até agora — e ela ainda mora sozinha. Compare: os cinquenta anos com o vovô acabaram (past simple), mas esta situação continua (present perfect). Em português: \"mora sozinha desde 2016\" (presente!).","pt":"mora (sozinha desde 2016)"},{"use":"pp-period","clue":"Over the years","why":"Over the years = during her life up to now, and she's still adding postcards. The period isn't finished.","whyPt":"Over the years (ao longo dos anos) = durante a vida dela até agora, e ela continua juntando cartões. O período não terminou.","pt":"juntou (ao longo dos anos)"}],"w":{"adventurous":"aventureira","visited":"visitar","planning":"planejando","travel partner":"parceiro de viagens","traveled":"viajar","almost":"quase","death":"morte","sailed":"navegar, velejar","across":"através de, de um lado ao outro","boat":"barco","lived":"morar, viver","alone":"sozinha","lonely":"solitária","collected":"juntar, colecionar","postcards":"cartões-postais","adds":"acrescenta"}},{"id":"b1-06","kind":"chat","contract":true,"title":"How was the concert?","titlePt":"Como foi o show?","voices":{"Nina":"f","Carlos":"m"},"body":[["Nina","Sooo? How was {the concert last night}? 🎸"],["Carlos","Incredible!! 🤩 They [have:played] all their old hits, and {at the end} the singer [has:jumped] into the crowd!"],["Nina","No way! I'm so jealous. I [have:wanted] to see them live {for years} 😭"],["Carlos","Next time you're coming with me. I [have:watched] them live {four times now}, and this was the best show by far."],["Nina","Deal! Did you take any photos?"],["Carlos","Tons! I [have:posted] the best ones this morning. Check my Instagram 📸"],["Nina","Going there now! 👀"]],"pt":["Eee? Como foi o show ontem à noite? 🎸","Incrível!! 🤩 Eles tocaram todos os sucessos antigos, e no final o vocalista pulou no meio do público!","Não acredito! Que inveja. Faz anos que eu quero ver eles ao vivo 😭","Da próxima vez você vem comigo. Já vi eles ao vivo quatro vezes, e esse foi de longe o melhor show.","Combinado! Você tirou fotos?","Um monte! Postei as melhores hoje de manhã. Olha no meu Instagram 📸","Indo lá agora! 👀"],"spots":[{"use":"ps-context","clue":"the concert last night","tl":"last night's concert","why":"There's no time word in Carlos's sentence, but we know WHEN: at the concert last night, which is finished.","whyPt":"Não há palavra de tempo na frase do Carlos, mas sabemos QUANDO: no show de ontem à noite, que já terminou.","pt":"tocaram"},{"use":"ps-story","clue":"at the end","tl":"they played… then…","why":"The story of the concert continues in order: they played their hits, and at the end the singer jumped. Events in a finished story → past simple.","whyPt":"A história do show continua em ordem: tocaram os sucessos, e no final o vocalista pulou. Fatos de uma história terminada → past simple.","pt":"pulou"},{"use":"pp-since","clue":"for years","why":"She started wanting to see them years ago, and she still wants to — she missed this show too. For + a period up to now → present perfect.","whyPt":"Ela começou a querer ver a banda há anos e ainda quer. Em português: \"faz anos que eu quero ver eles ao vivo\" (presente!) — esse \"faz\" é for, não ago.","pt":"quero (faz anos)"},{"use":"pp-exp","clue":"four times now","tl":"four times so far","why":"How many times up to now — and he's planning to go again with Nina, so the number can still grow.","whyPt":"Quantas vezes até agora — e ele pretende ir de novo com a Nina, então o número ainda pode crescer.","pt":"já vi"},{"use":"pp-period","both":{"alt":"ps-time","tlPp":"this morning (not over)","tlPs":"this morning (over)","pp":"it's still morning when Carlos writes — the morning isn't over yet","ppPt":"ainda é de manhã quando o Carlos escreve — a manhã não terminou","ps":"it's afternoon or evening now — the morning is finished","psPt":"já é tarde ou noite — a manhã já terminou"},"why":"Both are correct: the chat doesn't say what time it is now. With have, it's still morning (an unfinished period). Without it, the morning is over (a finished time).","whyPt":"As duas formas estão certas: o chat não diz que horas são agora. Com have, ainda é de manhã (período não terminado). Sem have, a manhã já acabou (tempo terminado). Em português é \"postei\" nos dois casos.","pt":"postei"}],"w":{"concert":"show","incredible":"incrível","played":"tocar","hits":"sucessos","singer":"vocalista, cantor","jumped":"pular","crowd":"multidão, público","no way":"não acredito","jealous":"com inveja","wanted":"querer","live":"ao vivo","watched":"assistir, ver","by far":"de longe","deal":"combinado","tons":"um monte","posted":"postar"}},{"id":"b1-07","kind":"text","frame":"News","framePt":"Notícia","title":"A robot that cleans beaches","titlePt":"Um robô que limpa praias","body":["{Good news} for our oceans: a 16-year-old student from Vancouver [has:designed] a small robot that collects plastic from beaches.","Maya Chen [has:started] the project {two years ago}, after a family trip to the coast. \"I saw so much plastic on the sand. I couldn't believe it,\" she says.","{At first}, the robot was slow, and it often got stuck in the sand. {Then} Maya [has:added] bigger wheels and a better camera, and suddenly it could do the job.","{Since March}, the robot [has:cleaned] three beaches near her home, and it still goes out every weekend.","And Maya's adventure isn't over: {last week}, an environmental group [has:invited] her to show her robot at a conference in Paris."],"pt":["Boa notícia para os oceanos: uma estudante de 16 anos de Vancouver projetou um pequeno robô que recolhe plástico das praias.","Maya Chen começou o projeto há dois anos, depois de uma viagem em família para o litoral. \"Eu vi tanto plástico na areia. Não conseguia acreditar\", ela conta.","No começo, o robô era lento e muitas vezes ficava preso na areia. Depois, a Maya acrescentou rodas maiores e uma câmera melhor, e de repente ele conseguia fazer o trabalho.","Desde março, o robô já limpou três praias perto da casa dela, e ainda sai todo fim de semana.","E a aventura da Maya não acabou: na semana passada, um grupo ambiental a convidou para apresentar o robô num congresso em Paris."],"spots":[{"use":"pp-news","clue":"Good news","why":"This is the news, in the first sentence: it happened recently and it matters now (the robot exists!). No time is given yet.","whyPt":"É a notícia, na primeira frase: aconteceu há pouco e importa agora (o robô existe!). Ainda não há tempo dito. Em português fica no pretérito: \"projetou\".","pt":"projetou, criou"},{"use":"ps-time","clue":"two years ago","why":"Now the article gives the details. When did she start? Two years ago — a finished time.","whyPt":"Agora a notícia dá os detalhes. Quando ela começou? Two years ago (há dois anos) — tempo terminado. Aqui \"há\" = ago!","pt":"começou"},{"use":"ps-story","clue":["At first","Then"],"tl":"at first… then…","why":"The article tells the story of the project in order: at first the robot was slow, then she added new parts. Events in a finished story → past simple.","whyPt":"A notícia conta a história do projeto em ordem: no começo o robô era lento, depois ela acrescentou peças novas. Fatos de uma história terminada → past simple.","pt":"acrescentou"},{"use":"pp-since","clue":"Since March","why":"From March up to now — and the robot still goes out every weekend. Since → present perfect.","whyPt":"De março até agora — e o robô continua saindo todo fim de semana. Since → present perfect. Em português: \"já limpou três praias desde março\".","pt":"já limpou (desde março)"},{"use":"ps-time","clue":"last week","why":"Last week is a finished time, so we use the past simple — even though the conference is still in the future.","whyPt":"Last week (na semana passada) é um tempo terminado: past simple — mesmo que o congresso ainda vá acontecer.","pt":"convidou"}],"w":{"oceans":"oceanos","designed":"projetar, criar","collects":"recolhe","beaches":"praias","started":"começar","coast":"litoral","sand":"areia","couldn't believe":"não conseguia acreditar","at first":"no começo","slow":"lento","got stuck":"ficava preso","added":"acrescentar","wheels":"rodas","suddenly":"de repente","cleaned":"limpar","goes out":"sai","isn't over":"não acabou","environmental":"ambiental","invited":"convidar","conference":"congresso, conferência"}},{"id":"b1-08","kind":"dialogue","contract":true,"title":"After fifteen years","titlePt":"Depois de quinze anos","voices":{"Grace":"f","Daniel":"m"},"body":[["Grace","Daniel? Is that you? Wow, I haven't seen you since high school!"],["Daniel","Grace! I can't believe it! What are you doing these days?"],["Grace","I'm a nurse. I [have:worked] at City Hospital {for ten years now}."],["Daniel","That's great. You were always so good at helping people."],["Grace","Thanks! What about you? Are you a lawyer, like your dad?"],["Daniel","Ha! No, I'm a chef. {Before that}, I [have:studied] law for three years, but {it wasn't for me}."],["Grace","A chef! Do you have your own restaurant?"],["Daniel","Yes, a small Italian place downtown, Casa Verde. We [have:opened] {in 2021}."],["Grace","Casa Verde? I [have:walked] past it {so many times}! The one with the blue door?"],["Daniel","That's the one! Come for dinner on Saturday — it's on me."]],"pt":["Daniel? É você? Nossa, não te vejo desde o ensino médio!","Grace! Não acredito! O que você anda fazendo?","Sou enfermeira. Trabalho no City Hospital há dez anos.","Que ótimo. Você sempre foi muito boa em ajudar as pessoas.","Obrigada! E você? Virou advogado, como o seu pai?","Ha! Não, sou chef de cozinha. Antes disso, estudei direito por três anos, mas não era pra mim.","Chef! Você tem o seu próprio restaurante?","Tenho, um italiano pequeno no centro, o Casa Verde. Abrimos em 2021.","Casa Verde? Já passei na frente dele um monte de vezes! É aquele da porta azul?","Esse mesmo! Venha jantar no sábado — é por minha conta."],"spots":[{"use":"pp-since","clue":"for ten years now","tl":"for ten years","why":"She started ten years ago and she still works there (\"I'm a nurse\"). For + a period up to now → present perfect.","whyPt":"Ela começou há dez anos e ainda trabalha lá (\"sou enfermeira\"). Em português: \"trabalho lá há dez anos\" (presente!) — esse \"há\" é for, não ago.","pt":"trabalho (há dez anos)"},{"use":"ps-ended","clue":["Before that","it wasn't for me"],"tl":"law: 3 years (over)","why":"Three years, but that time is over: he's a chef now, and law \"wasn't for him\". For does NOT always mean present perfect!","whyPt":"Três anos, mas esse tempo acabou: agora ele é chef, e direito \"não era pra ele\". For NÃO significa sempre present perfect! Em português: \"estudei direito por três anos\".","pt":"estudei (por três anos)"},{"use":"ps-time","clue":"in 2021","why":"In 2021 says WHEN they opened, and that time is finished — even though the restaurant is still open.","whyPt":"In 2021 diz QUANDO abriram, e esse tempo já terminou — mesmo que o restaurante continue aberto.","pt":"abrimos"},{"use":"pp-exp","clue":"so many times","tl":"many times so far","why":"How many times up to now — no time is given, and she can walk past it again (maybe on Saturday!).","whyPt":"Quantas vezes até agora — sem dizer quando, e ela pode passar lá de novo (talvez no sábado!).","pt":"já passei (na frente)"}],"w":{"high school":"ensino médio","these days":"hoje em dia","nurse":"enfermeira","worked":"trabalhar","lawyer":"advogado","chef":"chef de cozinha","before that":"antes disso","studied":"estudar","law":"direito","it wasn't for me":"não era pra mim","downtown":"no centro","opened":"abrir","walked past":"passar na frente de (walk past)","it's on me":"é por minha conta"}},{"id":"b1-09","kind":"text","contract":true,"frame":"Online forum","framePt":"Fórum online","title":"Too old to learn? No way!","titlePt":"Velho demais para aprender? De jeito nenhum!","body":["A lot of people on this forum ask: \"Is 40 too late to learn an instrument?\" Here's my answer: absolutely not!","I'm 43, and I [have:played] the guitar {for two years}. {I practice} every day, and it's the best part of my day.","It's not my first try, though. {When I was a teenager}, I [have:tried] the piano for a few months, {but I gave up} — I had no patience back then.","This time, things are different. {So far}, I [have:learned] about thirty songs, and {last month} I [have:performed] at my first open mic night. My hands were shaking, but it was fantastic!","My advice: start small, practice ten minutes a day, and don't compare yourself to teenagers on YouTube. 😄"],"pt":["Muita gente neste fórum pergunta: \"40 anos é tarde demais para aprender um instrumento?\" A minha resposta: de jeito nenhum!","Tenho 43 anos e toco violão há dois anos. Pratico todo dia, e é a melhor parte do meu dia.","Mas não é a minha primeira tentativa. Quando eu era adolescente, tentei piano por alguns meses, mas desisti — eu não tinha paciência naquela época.","Desta vez é diferente. Já aprendi umas trinta músicas, e no mês passado me apresentei pela primeira vez numa noite de microfone aberto. Minhas mãos tremiam, mas foi fantástico!","Meu conselho: comece pequeno, pratique dez minutos por dia e não se compare com adolescentes no YouTube. 😄"],"spots":[{"use":"pp-since","clue":["for two years","I practice"],"tl":"for two years","why":"The writer started two years ago and still plays every day. For + a period up to now → present perfect.","whyPt":"A pessoa começou há dois anos e ainda toca todo dia. Em português: \"toco violão há dois anos\" (presente!) — esse \"há\" é for, não ago.","pt":"toco (há dois anos)"},{"use":"ps-ended","clue":["When I was a teenager","but I gave up"],"tl":"a few months (over)","why":"A few months, but that ended long ago: it was in the writer's teens, and they gave up. A finished situation → past simple, even with for.","whyPt":"Alguns meses, mas isso acabou há muito tempo: foi na adolescência, e a pessoa desistiu. Situação terminada → past simple, mesmo com for.","pt":"tentei (por alguns meses)"},{"use":"pp-period","clue":"So far","tl":"so far","why":"So far = from the start up to now. The writer is still learning, so the number can still grow.","whyPt":"So far (até agora) = do começo até agora. A pessoa continua aprendendo, então o número ainda pode crescer.","pt":"já aprendi"},{"use":"ps-time","clue":"last month","why":"Last month is a finished time, so we use the past simple — like were and was in the next sentence.","whyPt":"Last month (no mês passado) é um tempo terminado: past simple — como were e was na frase seguinte.","pt":"me apresentei"}],"w":{"forum":"fórum","too late":"tarde demais","absolutely not":"de jeito nenhum","played":"tocar (instrumento)","guitar":"violão, guitarra","practice":"praticar","try":"tentativa","though":"mas, porém","teenager":"adolescente","tried":"tentar","gave up":"desisti (give up)","patience":"paciência","back then":"naquela época","learned":"aprender","performed":"apresentar-se","open mic night":"noite de microfone aberto","shaking":"tremendo","advice":"conselho","compare":"comparar"}},{"id":"b1-10","kind":"text","contract":true,"frame":"Website: About us","framePt":"Site: Quem somos","title":"Three generations of ice cream","titlePt":"Três gerações de sorvete","body":["Nonna's is a family business with a long story. My grandmother Lucia [has:opened] the first shop {in 1968}, with one freezer and five flavors.","She [has:worked] there every day for forty years, {until she was 75}. Today she's 92, and she still comes in every Sunday to taste the new flavors!","My father took over the shop in 2008, and {since 2015} I [have:managed] the business with him.","{Over the years}, we [have:created] more than 200 flavors, from classic vanilla to lemon and basil. Some were a big hit, and some… not so much! 😄","Come and visit us on Harbor Street. Your first scoop is on Nonna!"],"pt":["A Nonna's é uma empresa familiar com uma longa história. A minha avó Lucia abriu a primeira loja em 1968, com um freezer e cinco sabores.","Ela trabalhou lá todos os dias por quarenta anos, até os 75. Hoje ela tem 92, e ainda vem todo domingo provar os sabores novos!","Meu pai assumiu a sorveteria em 2008, e desde 2015 eu administro o negócio com ele.","Ao longo dos anos, criamos mais de 200 sabores, da clássica baunilha a limão com manjericão. Alguns fizeram muito sucesso, e outros… nem tanto! 😄","Venha nos visitar na Harbor Street. A sua primeira bola é por conta da Nonna!"],"spots":[{"use":"ps-time","clue":"in 1968","why":"In 1968 says WHEN she opened it, and that time is finished — even though the shop is still open.","whyPt":"In 1968 diz QUANDO ela abriu, e esse tempo já terminou — mesmo que a sorveteria continue aberta.","pt":"abriu"},{"use":"ps-ended","clue":"until she was 75","tl":"40 years (until 75)","why":"Forty years, but that time is over: she stopped at 75. She's alive and still visits — but the work situation ended. Until + a finished point → past simple.","whyPt":"Quarenta anos, mas esse tempo acabou: ela parou aos 75. Ela está viva e ainda visita — mas a situação de trabalho terminou. Until + um ponto terminado → past simple.","pt":"trabalhou (por quarenta anos)"},{"use":"pp-since","clue":"since 2015","why":"From 2015 up to now — and the writer still runs the business with their father. Since → present perfect.","whyPt":"De 2015 até agora — e quem escreve ainda administra o negócio com o pai. Em português: \"administro o negócio desde 2015\" (presente!).","pt":"administro (desde 2015)"},{"use":"pp-period","clue":"Over the years","why":"Over the years = during the shop's life up to now, and they keep creating flavors. The period isn't finished.","whyPt":"Over the years (ao longo dos anos) = durante a vida da sorveteria até agora, e eles continuam criando sabores. O período não terminou.","pt":"criamos (ao longo dos anos)"}],"w":{"family business":"empresa familiar","opened":"abrir","freezer":"freezer, congelador","flavors":"sabores","worked":"trabalhar","comes in":"vem (à loja)","taste":"provar","took over":"assumiu (take over)","managed":"administrar","created":"criar","vanilla":"baunilha","basil":"manjericão","a big hit":"um grande sucesso","not so much":"nem tanto","scoop":"bola (de sorvete)","is on Nonna":"é por conta da Nonna"}},{"id":"b1-11","kind":"text","frame":"Email","framePt":"E-mail","title":"The heating is broken again","titlePt":"O aquecimento quebrou de novo","body":["Dear Mr. Novak,","I am writing about the heating in apartment 4B. {Since last Thursday}, it [has:worked] for only an hour or two a day.","This is not the first problem. {Last winter}, the same thing [has:happened] twice.","{So far this month}, I [have:called] your office four times, but nobody ever picks up. {On Monday}, I [have:emailed] your assistant some photos of the heater, too.","I [have:rented] this apartment {for six years}, and {I would like to stay}, but my children are cold at night. Could you please send someone this week?","Best regards, Elena Kraus"],"pt":["Prezado Sr. Novak,","Escrevo sobre o aquecimento do apartamento 4B. Desde a última quinta-feira, ele só funciona uma ou duas horas por dia.","Este não é o primeiro problema. No inverno passado, a mesma coisa aconteceu duas vezes.","Só este mês, já liguei para o seu escritório quatro vezes, mas ninguém nunca atende. Na segunda-feira, também mandei por e-mail algumas fotos do aquecedor para a sua assistente.","Alugo este apartamento há seis anos e gostaria de continuar aqui, mas os meus filhos estão passando frio à noite. O senhor poderia mandar alguém esta semana?","Atenciosamente, Elena Kraus"],"spots":[{"use":"pp-since","clue":"Since last Thursday","tl":"since last Thursday","why":"From last Thursday up to now — and the problem continues (that's why she's writing). Since → present perfect, even with last.","whyPt":"Da quinta passada até agora — e o problema continua (por isso ela está escrevendo). Since → present perfect, mesmo com last. Em português: \"desde quinta só funciona\" (presente!).","pt":"funciona (desde quinta)"},{"use":"ps-time","clue":"Last winter","why":"Last winter is a finished time, so we use the past simple.","whyPt":"Last winter (no inverno passado) é um tempo terminado: past simple.","pt":"aconteceu"},{"use":"pp-period","clue":"So far this month","tl":"so far this month","why":"So far this month = from the 1st up to now. The month isn't over, and she may call again.","whyPt":"So far this month (até agora, este mês) = do dia 1º até agora. O mês não acabou, e ela pode ligar de novo.","pt":"já liguei (só este mês)"},{"use":"ps-time","clue":"On Monday","why":"On Monday says WHEN, and Monday is finished.","whyPt":"On Monday (na segunda-feira) diz QUANDO, e a segunda já passou.","pt":"mandei por e-mail"},{"use":"pp-since","clue":["for six years","I would like to stay"],"tl":"for six years","why":"Six years up to now — she still rents it and wants to stay. For + still true → present perfect.","whyPt":"Seis anos até agora — ela ainda aluga e quer continuar. Em português: \"alugo há seis anos\" (presente!) — esse \"há\" é for, não ago.","pt":"alugo (há seis anos)"}],"w":{"heating":"aquecimento","worked":"funcionar","happened":"acontecer","twice":"duas vezes","called":"ligar (telefonar)","picks up":"atende (o telefone)","emailed":"mandar por e-mail","heater":"aquecedor","rented":"alugar","would like to":"gostaria de","best regards":"atenciosamente"}},{"id":"b1-12","kind":"dialogue","contract":true,"title":"Apartment for rent","titlePt":"Apartamento para alugar","voices":{"Lena":"f","Mr. Grant":"m"},"body":[["Lena","It's a lovely apartment. Is it yours?"],["Mr. Grant","Yes, I [have:owned] it {since 2012}. My parents were here before me."],["Lena","And the last tenants? Why did they leave?"],["Mr. Grant","A young couple. They [have:stayed] here for four years, {until June}, and then they got jobs in Berlin."],["Lena","The kitchen looks new."],["Mr. Grant","It is! I [have:renovated] it {last spring}."],["Lena","And the neighbors? Is it quiet?"],["Mr. Grant","Very. Mrs. Bell upstairs [has:lived] in the building {for thirty years}, and {she's} the quietest person I know."],["Lena","Perfect. {So far this week}, I [have:visited] six apartments, and this is the best one!"]],"pt":["É um apartamento lindo. É seu?","É, sou dono dele desde 2012. Os meus pais moravam aqui antes de mim.","E os últimos inquilinos? Por que eles saíram?","Um casal jovem. Eles ficaram aqui por quatro anos, até junho, e depois arrumaram emprego em Berlim.","A cozinha parece nova.","E é! Reformei na primavera passada.","E os vizinhos? É tranquilo?","Muito. A Sra. Bell, do andar de cima, mora no prédio há trinta anos, e é a pessoa mais quieta que eu conheço.","Perfeito. Esta semana já visitei seis apartamentos, e este é o melhor!"],"spots":[{"use":"pp-since","clue":"since 2012","why":"He bought it in 2012 and he still owns it (\"Yes\" — it's his). Since → present perfect.","whyPt":"Ele comprou em 2012 e continua sendo o dono (\"Yes\" — é dele). Em português: \"sou dono desde 2012\" (presente!).","pt":"sou dono (desde 2012)"},{"use":"ps-ended","clue":"until June","tl":"four years (until June)","why":"Four years, but that situation ended in June — the apartment is empty now. For + until → past simple.","whyPt":"Quatro anos, mas essa situação acabou em junho — o apartamento está vazio agora. For + until → past simple. Em português: \"ficaram por quatro anos\".","pt":"ficaram (por quatro anos)"},{"use":"ps-time","clue":"last spring","why":"Last spring is a finished time, so we use the past simple — even though the kitchen still looks new.","whyPt":"Last spring (na primavera passada) é um tempo terminado: past simple — mesmo que a cozinha ainda pareça nova.","pt":"reformei"},{"use":"pp-since","clue":["for thirty years","she's"],"tl":"for thirty years","why":"Thirty years up to now — she still lives upstairs (she's the quietest person he knows). For + still true → present perfect.","whyPt":"Trinta anos até agora — ela ainda mora no andar de cima (é a pessoa mais quieta que ele conhece). Compare co book lovers: Miller's Books, the oldest shop on Bridge Street, [has:announced] that it will close in December.","Tom Miller's grandfather [has:opened] the shop {in 1954}, with just two shelves of secondhand novels.","His father [has:managed] it for forty years, {until his death in 2010}.","Tom [has:worked] behind the counter {since he was sixteen}, and he is now 62.","\"Online shopping [has:changed] everything {in the last ten years},\" he says. \"But I have no regrets. This shop gave me a wonderful life.\""],"pt":["Notícia triste para quem ama livros: a Miller's Books, a loja mais antiga da Bridge Street, anunciou que vai fechar em dezembro.","O avô de Tom Miller abriu a loja em 1954, com apenas duas prateleiras de romances usados.","O pai dele administrou a loja por quarenta anos, até a morte dele, em 2010.","Tom trabalha atrás do balcão desde os dezesseis anos, e hoje tem 62.","\"As compras pela internet mudaram tudo nos últimos dez anos\", ele diz. \"Mas não me arrependo de nada. Esta loja me deu uma vida maravilhosa.\""],"spots":[{"use":"pp-news","clue":"Sad news","why":"This is the news, in the first sentence: it happened recently and it matters now. No time is given.","whyPt":"É a notícia, na primeira frase: aconteceu há pouco e importa agora. Nenhum tempo é dito. Em português fica no pretérito: \"anunciou\".","pt":"anunciou"},{"use":"ps-time","clue":"in 1954","why":"In 1954 is a finished time, so we use the past simple.","whyPt":"In 1954 é um tempo terminado: past simple.","pt":"abriu"},{"use":"ps-ended","clue":"until his death in 2010","tl":"40 years (until 2010)","why":"Forty years, but that time is over: it ended with his death in 2010. For does NOT always mean present perfect!","whyPt":"Quarenta anos, mas esse tempo acabou: terminou com a morte dele, em 2010. For NÃO significa sempre present perfect!","pt":"administrou (por quarenta anos)"},{"use":"pp-since","clue":"since he was sixteen","tl":"since he was 16","why":"From age sixteen up to now — he still works there (until December). Since → present perfect. Compare his father: forty years, but over.","whyPt":"Dos dezesseis anos até agora — ele ainda trabalha lá (até dezembro). Since → present perfect. Compare com o pai: quarenta anos, mas acabou. Em português: \"trabalha desde os dezesseis\" (presente!).","pt":"trabalha (desde os dezesseis)"},{"use":"pp-period","clue":"in the last ten years","tl":"the last ten years","why":"In the last ten years = the ten years up to now. The period reaches the present → present perfect.","whyPt":"In the last ten years (nos últimos dez anos) = os dez anos até agora. O período chega ao presente → present perfect.","pt":"mudaram (nos últimos dez anos)"}],"w":{"book lovers":"quem ama livros","announced":"anunciar","close":"fechar","opened":"abrir","shelves":"prateleiras","secondhand":"usados","novels":"romances","managed":"administrar","death":"morte","worked":"trabalhar","counter":"balcão","changed":"mudar","regrets":"arrependimentos"}},{"id":"b1-15","kind":"chat","contract":true,"title":"Whose turn is it?","titlePt":"De quem é a vez?","voices":{"Jess":"f","Ryan":"m"},"body":[["Jess","Ryan, the kitchen is a disaster 😤"],["Ryan","Sorry! I [have:cooked] for some friends {last night}, and I was too lazy to clean up 🙈"],["Jess","That's the third time {so far this week} that I [have:cleaned] up after you!"],["Ryan","OK, OK. I'll do it tonight, I promise."],["Jess","Hmm. You [have:promised] that {before} 😒"],["Ryan","True… but remember {last month}? I [have:painted] the whole living room by myself!"],["Jess","Haha, fair. Kitchen tonight, then. And next time, invite me too 😄"]],"pt":["Ryan, a cozinha está um desastre 😤","Foi mal! Cozinhei para uns amigos ontem à noite e fiquei com preguiça de limpar 🙈","É a terceira vez esta semana que eu limpo a sua bagunça!","Tá, tá. Eu faço hoje à noite, prometo.","Hum. Você já prometeu isso antes 😒","Verdade… mas lembra do mês passado? Pintei a sala inteira sozinho!","Haha, justo. Cozinha hoje à noite, morning. That evening, I saw the old city and ate the best kebab of my life.","{Since that day}, I [have:checked] the time every ten minutes at airports. Never again!"],"pt":["Já viajei para mais de trinta países, mas esta continua sendo a minha história de viagem favorita.","Em outubro do ano passado, cheguei ao aeroporto de Istambul para uma conexão para Tóquio. O meu voo era às 14h.","Peguei um café e comecei a ler. Uma hora depois, olhei para o relógio: 14h10! O meu avião já tinha ido embora.","Aí uma moça muito gentil no balcão da companhia aérea me colocou no voo seguinte — às 9h da manhã do dia seguinte. Naquela noite, conheci a cidade antiga e comi o melhor kebab da minha vida.","Desde aquele dia, confiro a hora a cada dez minutos nos aeroportos. Nunca mais!"],"spots":[{"use":"pp-exp","clue":"more than thirty countries","tl":"30+ countries so far","why":"Life experience up to now: no time is given, and the writer still travels, so the number can grow.","whyPt":"Experiência de vida até agora: nenhum tempo é dito, e a pessoa continua viajando, então o número pode crescer.","pt":"já viajei"},{"use":"ps-time","clue":"Last October","why":"Last October is a finished time — the story begins here.","whyPt":"Last October (em outubro do ano passado) é um tempo terminado — a história começa aqui.","pt":"cheguei"},{"use":"ps-story","clue":"An hour later","tl":"coffee, book… the clock","why":"The story continues in order: coffee, book, and an hour later the clock. Events in a story → past simple.","whyPt":"A história continua em ordem: café, livro e, uma hora depois, o relógio. Fatos de uma história → past simple.","pt":"olhei"},{"use":"ps-story","clue":"Then","tl":"missed it… then","why":"Then = the next event in the story. Still a finished story → past simple.","whyPt":"Then (aí, depois) = o próximo fato da história. Continua sendo uma história terminada → past simple.","pt":"colocou (no voo)"},{"use":"pp-since","clue":"Since that day","why":"From that day up to now — and the habit continues. Since → present perfect.","whyPt":"Daquele dia até agora — e o hábito continua. Em português: \"desde aquele dia, confiro a hora\" (presente!).","pt":"confiro (desde aquele dia)"}],"w":{"traveled":"viajar","arrived":"chegar","connection":"conexão","flight":"voo","began":"comecei (begin)","looked":"olhar","kind":"gentil","airline desk":"balcão da companhia aérea","booked":"reservar, colocar (num voo)","ate":"comi (eat)","checked":"conferir, verificar","never again":"nunca mais"}},{"id":"b1-17","kind":"dialogue","contract":true,"frame":"Radio interview","framePt":"Entrevista de rádio","title":"Running at 70","titlePt":"Correndo aos 70","voices":{"Nora":"f","Ali":"m"},"body":[["Nora","Ali, you're 70, and you [have:finished] {25 marathons}. How?!"],["Ali","Ha! Slowly! I [have:started] running {at 50}, after a health scare."],["Nora","And your first marathon?"],["Ali","Boston, {in 2008}. I [have:crossed] the finish line after five hours, and I was so happy I couldn't speak."],["Nora","Do you train every day?"],["Ali","Six days a week. My wife and I [have:trained] together {for twenty years} — {she's} faster than me!"],["Nora","What's next?"],["Ali","Tokyo, in March. I [have:wanted] to run there {for a long time}."]],"pt":["Ali, você tem 70 anos e já completou 25 maratonas. Como?!","Ha! Devagar! Comecei a correr aos 50, depois de um susto com a saúde.","E a sua primeira maratona?","Boston, em 2008. Cruzei a linha de chegada depois de cinco horas, e estava tão feliz que não conseguia falar.","Você treina todo dia?","Seis dias por semana. Eu e a minha esposa treinamos juntos há vinte anos — ela é mais rápida do que eu!","E o que vem agora?","Tóquio, em março. Faz tempo que eu quero correr lá."],"spots":[{"use":"pp-exp","clue":"25 marathons","tl":"25 marathons so far","why":"His life experience up to now: no time is given, and he's still running (Tokyo is next), so the number will grow.","whyPt":"A experiência de vida dele até agora: nenhum tempo é dito, e ele continua correndo (Tóquio é a próxima), então o número vai crescer.","pt":"já completou"},{"use":"ps-time","clue":"at 50","why":"At 50 = twenty years ago, a finished moment in his life. Past simple.","whyPt":"At 50 (aos 50) = há vinte anos, um momento terminado da vida dele. Past simple.","pt":"comecei"},{"use":"ps-time","clue":"in 2008","why":"In 2008 is a finished time, so we use the past simple — like was in the same sentence.","whyPt":"In 2008 é um tempo terminado: past simple — como was na mesma frase.","pt":"cruzei"},{"use":"pp-since","clue":["for twenty years","she's"],"tl":"for twenty years","why":"Twenty years up to now — they still train together (and she's still faster!). For + still true → present perfect.","whyPt":"Vinte anos até agora — eles ainda treinam juntos (e ela continua mais rápida!). Em português: \"treinamos juntos há vinte anos\" (presente!).","pt":"treinamos (há vinte anos)"},{"use":"pp-since","clue":"for a long time","why":"He started wanting this long ago, and he still wants it — the race is in March. For + still true → present perfect.","whyPt":"Ele começou a querer isso há muito tempo, e ainda quer — a corrida é em março. Em português: \"faz tempo que eu quero correr lá\" (presente!) — esse \"faz\" é for, não ago.","pt":"quero (faz tempo)"}],"w":{"finished":"terminar, completar","marathons":"maratonas","slowly":"devagar","started":"começar","health scare":"susto com a saúde","crossed":"cruzar","finish line":"linha de chegada","train":"treinar","trained":"treinar","faster":"mais rápida","wanted":"querer"}},{"id":"b1-18","kind":"text","contract":true,"frame":"Online review","framePt":"Avaliação online","title":"My e-bike: worth every penny","titlePt":"Minha bike elétrica: vale cada centavo","body":["I [have:owned] this e-bike {for three months} now, and {I use it every day}.","{Before that}, I [have:commuted] by bus for ten years. It was slow, full of people at rush hour and expensive.","The battery is amazing. {Last weekend}, I [have:cycled] 80 km on one charge!","{Since I got it}, I [have:saved] about $120 a month on bus tickets.","The only problem: the app [has:crashed] twice. Still, five stars. My only regret? Waiting so long to buy it!"],"pt":["Tenho esta bike elétrica há três meses, e uso todo dia.","Antes disso, fui de ônibus para o trabalho por dez anos. Era lento, lotado na hora do rush e caro.","A bateria é incrível. No fim de semana passado, pedalei 80 km com uma carga só!","Desde que comprei, economizo uns 120 dólares por mês em passagens de ônibus.","O único problema: o aplicativo travou duas vezes. Mesmo assim, cinco estrelas. Meu único arrependimento? Ter esperado tanto para comprar!"],"spots":[{"use":"pp-since","clue":["for three months","I use it every day"],"tl":"for three months","why":"Three months up to now — and the writer still uses it every day. For + still true → present perfect.","whyPt":"Três meses até agora — e a pessoa continua usando todo dia. Em português: \"tenho a bike há três meses\" (presente!) — esse \"há\" é for.","pt":"tenho (há três meses)"},{"use":"ps-ended","clue":"Before that","tl":"ten years (over)","why":"Ten years, but that situation is over: it was before the e-bike. For does NOT always mean present perfect!","whyPt":"Dez anos, mas essa situação acabou: foi antes da bike. For NÃO significa sempre present perfect!","pt":"fui de ônibus (por dez anos)"},{"use":"ps-time","clue":"Last weekend","why":"Last weekend is a finished time, so we use the past simple.","whyPt":"Last weekend (no fim de semana passado) é um tempo terminado: past simple.","pt":"pedalei"},{"use":"pp-since","clue":"Since I got it","tl":"since I got it","why":"From the day of the purchase up to now — and the saving continues every month. Since → present perfect. (After since we use the past simple: got.)","whyPt":"Do dia da compra até agora — e a economia continua todo mês. Since → present perfect. (Depois de since vem o past simple: got.) Em português: \"desde que comprei, economizo\".","pt":"economizo (desde que comprei)"},{"use":"pp-exp","both":{"alt":"ps-context","tlPp":"twice so far","tlPs":"those two times","pp":"it's the record up to now — and it could happen again","ppPt":"é o histórico até agora — e pode acontecer de novo","ps":"the writer reports those two crashes as finished events","psPt":"a pessoa conta aqueles dois travamentos como fatos terminados"},"why":"Both are correct. With have, twice is the record so far (and the app may crash again). Without it, the writer simply reports those two crashes as finished events — very common in American English.","whyPt":"As duas formas estão certas. Com have, twice (duas vezes) é o histórico até agora (e o app pode travar de novo). Sem have, a pessoa só relata aqueles dois travamentos como fatos terminados — muito comum no inglês americano. Em português: \"travou duas vezes\".","pt":"travou (duas vezes)"}],"w":{"owned":"ter, ser dono de","commuted":"ir e voltar do trabalho","full of people":"lotado","rush hour":"hora do rush","expensive":"caro","battery":"bateria","cycled":"pedalar","charge":"carga","saved":"economizar","crashed":"travar (app)","twice":"duas vezes","regret":"arrependimento"}},{"id":"b1-19","kind":"text","frame":"Museum audio guide","framePt":"Audioguia do museu","title":"The woman who lit up the town","titlePt":"A mulher que iluminou a cidade","body":["Welcome to Room 3. This room is about Clara Holt, the inventor who brought electric light to our town.","Clara [has:worked] in this building for thirty years, {from 1890 to 1920}.","{In 1902}, she [has:designed] a street lamp that was cheap and safe. Soon every street in town had one.","{Since 1985}, the Holt Museum [has:welcomed] more than a million visitors.","Now look up: the lamp above you is one of Clara's originals, and it [has:worked] perfectly {for over 120 years}!"],"pt":["Bem-vindos à Sala 3. Esta sala é sobre Clara Holt, a inventora que trouxe a luz elétrica para a nossa cidade.","Clara trabalhou neste prédio por trinta anos, de 1890 a 1920.","Em 1902, ela projetou um poste de luz barato e seguro. Logo, todas as ruas da cidade tinham um.","Desde 1985, o Museu Holt já recebeu mais de um milhão de visitantes.","Agora olhe para cima: a lâmpada acima de você é uma das originais de Clara, e funciona perfeitamente há mais de 120 anos!"],"spots":[{"use":"ps-ended","clue":"from 1890 to 1920","tl":"30 years (1890–1920)","why":"Thirty years, but that time is over: from 1890 to 1920. For does NOT always mean present perfect!","whyPt":"Trinta anos, mas esse tempo acabou: de 1890 a 1920. For NÃO significa sempre present perfect!","pt":"trabalhou (por trinta anos)"},{"use":"ps-time","clue":"In 1902","why":"In 1902 is a finished time, so we use the past simple.","whyPt":"In 1902 é um tempo terminado: past simple.","pt":"projetou"},{"use":"pp-since","clue":"Since 1985","why":"From 1985 up to now — and the museum is still open (you're in it!). Since → present perfect.","whyPt":"De 1985 até agora — e o museu continua aberto (você está nele!). Since → present perfect. Em português: \"já recebeu desde 1985\".","pt":"já recebeu (desde 1985)"},{"use":"pp-since","clue":"for over 120 years","tl":"120+ years (still on)","why":"The same verb as Clara's thirty years — but the lamp still works today (look up!). For + still true → present perfect.","whyPt":"O mesmo verbo dos trinta anos de Clara — mas a lâmpada ainda funciona hoje (olhe para cima!). Em português: \"funciona há mais de 120 anos\" (presente!).","pt":"funciona (há mais de 120 anos)"}],"w":{"inventor":"inventora","brought":"trouxe (bring)","worked":"trabalhar; funcionar","building":"prédio","designed":"projetar","street lamp":"poste de luz","cheap":"barato","safe":"seguro","welcomed":"receber (visitantes)","look up":"olhe para cima","originals":"originais"}},{"id":"b1-20","kind":"dialogue","contract":true,"title":"Big news, big move","titlePt":"Grande notícia, grande mudança","voices":{"Julia":"f","Marco":"m"},"body":[["Julia","So it's true? You're moving to Canada?"],["Marco","Yes! I [have:accepted] a job in Toronto {last week}. I start in March."],["Julia","Wow. You [have:talked] about Canada for years!"],["Marco","I know! And I [have:applied] for more than twenty jobs there {since January}."],["Julia","Have you ever been to Toronto?"],["Marco","Once, {in 2019}. I [have:visited] my cousin there for a week, and it was love at first sight."],["Julia","I'm going to miss you! But I [have:wanted] a good reason to visit Canada {for a long time} 😄"]],"pt":["Então é verdade? Você vai se mudar para o Canadá?","É! Aceitei um emprego em Toronto na semana passada. Começo em março.","Nossa. Você fala do Canadá há anos! (Ou: você falou do Canadá durante anos!)","Eu sei! E já me candidatei a mais de vinte vagas lá desde janeiro.","Você já foi a Toronto?","Uma vez, em 2019. Visitei meu primo lá por uma semana, e foi amor à primeira vista.","Vou sentir sua falta! Mas faz tempo que eu quero um bom motivo para visitar o Canadá 😄"],"spots":[{"use":"ps-time","clue":"last week","why":"Last week is a finished time, so we use the past simple.","whyPt":"Last week (na semana passada) é um tempo terminado: past simple.","pt":"aceitei"},{"use":"pp-since","both":{"alt":"ps-ended","tlPp":"years, up to now","tlPs":"those years (over)","pp":"he has talked about it for years, up to today — and he still does","ppPt":"ele fala disso há anos, até hoje — e continua falando","ps":"those years of only talking are over: now it's really happening","psPt":"aqueles anos só de conversa acabaram: agora está acontecendo de verdade"},"why":"Both are correct. With have, Julia means he's talked about Canada for years, up to today. Without it, she looks back on those years of talking as over — now the dream is real.","whyPt":"As duas formas estão certas. Com have, a Julia quer dizer que ele fala do Canadá há anos, até hoje. Sem have, ela olha para aqueles anos de conversa como algo terminado — agora o sonho é real.","pt":"fala (há anos) / falou (durante anos)","cont":{"en":"You've been talking about Canada for years!","why":"With have: a complaint about something said again and again up to now. Have been + -ing is the usual form for that.","whyPt":"Com have: uma reclamação sobre algo dito várias e várias vezes até agora. Para isso, o normal é have been + -ing."}},{"use":"pp-since","clue":"since January","why":"From January up to now — he's counting all his applications so far. Since → present perfect.","whyPt":"De janeiro até agora — ele está contando todas as candidaturas até hoje. Since → present perfect. Em português: \"já me candidatei desde janeiro\".","pt":"já me candidatei (desde janeiro)"},{"use":"ps-time","clue":"in 2019","why":"Once sounds like life experience, but in 2019 says WHEN. A finished time → past simple.","whyPt":"Once (uma vez) parece experiência, mas in 2019 diz QUANDO. Tempo terminado → past simple.","pt":"visitei"},{"use":"pp-since","clue":"for a long time","why":"She started wanting this long ago, and she still wants it — now she has her reason! For + still true → present perfect.","whyPt":"Ela começou a querer isso há muito tempo, e ainda quer — agora tem o motivo! Em português: \"faz tempo que eu quero\" (presente!).","pt":"quero (há muito tempo)"}],"w":{"moving":"mudando (de cidade/país)","accepted":"aceitar","talked":"falar, conversar","applied":"candidatar-se (apply for)","once":"uma vez","visited":"visitar","cousin":"primo","love at first sight":"amor à primeira vista","miss":"sentir falta de","wanted":"querer","reason":"motivo"}},{"id":"b1-21","kind":"text","frame":"News","framePt":"Notícia","title":"The train is back in Alden","titlePt":"O trem voltou a Alden","body":["{Big day} in Alden: the small mountain village [has:celebrated] the return of its railway station.","The old station [has:closed] {in 1994}, when the line lost too much money.","{Before the new line}, people [have:traveled] to the city by bus, a trip of almost two hours.","Now the train takes forty minutes, and {so far} more than 800 passengers [have:used] it.","\"My grandchildren can finally visit me on weekends,\" says Rosa Lind, 79."],"pt":["Grande dia em Alden: a pequena vila nas montanhas comemorou a volta da sua estação de trem.","A antiga estação fechou em 1994, quando a linha perdia dinheiro demais.","Antes da nova linha, as pessoas iam para a cidade de ônibus, uma viagem de quase duas horas.","Agora o trem leva quarenta minutos, e até agora mais de 800 passageiros já o usaram.","\"Meus netos finalmente podem me visitar nos fins de semana\", diz Rosa Lind, 79 anos."],"spots":[{"use":"pp-news","clue":"Big day","why":"This is the news, in the first sentence: it's new and it matters now. No time is given.","whyPt":"É a notícia, na primeira frase: é novidade e importa agora. Nenhum tempo é dito. Em português fica no pretérito: \"comemorou\".","pt":"comemorou"},{"use":"ps-time","clue":"in 1994","why":"In 1994 is a finished time: past simple.","whyPt":"In 1994 (em 1994) é um tempo terminado: past simple.","pt":"fechou"},{"use":"ps-ended","clue":"Before the new line","tl":"before the train","why":"Before the new line = that situation is over: people don't take the bus now. Past simple.","whyPt":"Before the new line (antes da nova linha): isso acabou, agora há trem. Situação terminada = past simple. Em português: \"iam\".","pt":"iam"},{"use":"pp-period","clue":"so far","why":"So far = from the opening up to now. More passengers will come.","whyPt":"So far (até agora): desde a inauguração até hoje, e virão mais passageiros.","pt":"usaram (até agora)"}],"w":{"village":"vila, povoado","celebrated":"comemorar, celebrar","railway station":"estação de trem","closed":"fechar","line":"linha","traveled":"viajar, ir","passengers":"passageiros","used":"usar","grandchildren":"netos"}},{"id":"b1-22","kind":"dialogue","contract":true,"title":"Back from Japan","titlePt":"De volta do Japão","voices":{"Omar":"m","Rita":"f"},"body":[["Omar","Rita! {You're back}! How was Japan?"],["Rita","Incredible. We [have:climbed] Mount Fuji!"],["Omar","No way! How long did it take?"],["Rita","Six hours up. And {on our last night}, we [have:stayed] in a capsule hotel in Tokyo."],["Omar","I'd love to go. I [have:saved] money for a big trip {since January}."],["Rita","Go! I [have:cooked] ramen every weekend {since we got back} — I miss it already."]],"pt":["Rita! Você voltou! Como foi o Japão?","Incrível. Subimos o Monte Fuji!","Não acredito! Quanto tempo levou?","Seis horas de subida. E na nossa última noite, ficamos num hotel cápsula em Tóquio.","Eu adoraria ir. Estou guardando dinheiro para uma grande viagem desde janeiro.","Vai! Faço lámen todo fim de semana desde que voltamos — já estou com saudade."],"spots":[{"use":"ps-context","clue":"You're back","tl":"the trip (over)","why":"Rita is back, so the trip is over and both know when it was: past simple.","whyPt":"A Rita voltou: a viagem acabou, e os dois sabem quando foi. Past simple: subimos = climbed.","pt":"subimos"},{"use":"ps-time","clue":"on our last night","why":"On our last night is a finished time: past simple.","whyPt":"On our last night (na nossa última noite) é um tempo terminado: past simple.","pt":"ficamos"},{"use":"pp-since","clue":"since January","why":"Omar started saving in January, and he's still saving. Since → present perfect.","whyPt":"O Omar começou a guardar dinheiro em janeiro, e continua. Since → present perfect. Em português: \"estou guardando… desde janeiro\".","pt":"estou guardando (desde janeiro)"},{"use":"pp-since","clue":"since we got back","why":"From the day they got back up to now: since + present perfect. The starting point (got back) stays in the past simple.","whyPt":"Desde que voltaram até agora: since + present perfect. O momento de início (got back) fica no past simple. Em português: \"faço… desde que voltamos\" (presente!).","pt":"faço (desde que voltamos)","cont":{"en":"I've been cooking ramen every weekend since we got back.","why":"A repeated activity that is still going on: have been + -ing is more common here.","whyPt":"Uma atividade repetida que ainda continua: aqui have been + -ing é mais comum."}}],"w":{"incredible":"incrível","climbed":"subir, escalar","capsule hotel":"hotel cápsula","stayed":"ficar, hospedar-se","saved":"guardar (dinheiro), economizar","cooked":"cozinhar, fazer (comida)","got back":"voltar","miss":"sentir falta"}},{"id":"b1-23","kind":"text","frame":"Blog post","framePt":"Post de blog","title":"Learning to swim at 40","titlePt":"Aprendendo a nadar aos 40","body":["{Until last year}, I [have:avoided] swimming pools. I was afraid of water.","Then, {in March}, I [have:signed] up for lessons at our local pool.","My teacher, Joe, [has:coached] adult beginners {for twenty-five years}, and he's incredibly patient.","{So far}, I [have:learned] to float and to swim ten meters without stopping.","And {last week} I [have:jumped] into the deep end for the first time!"],"pt":["Até o ano passado, eu evitava piscinas. Eu tinha medo de água.","Então, em março, me inscrevi em aulas na piscina do bairro.","Meu professor, Joe, treina adultos iniciantes há vinte e cinco anos, e é incrivelmente paciente.","Já aprendi a boiar e a nadar dez metros sem parar.","E na semana passada pulei na parte funda pela primeira vez!"],"spots":[{"use":"ps-ended","clue":"Until last year","tl":"until last year","why":"Until last year = that situation stopped then. Past simple.","whyPt":"Until last year (até o ano passado): isso acabou. Situação terminada = past simple. Em português: \"evitava\".","pt":"evitava"},{"use":"ps-time","clue":"in March","why":"In March is a finished time: past simple.","whyPt":"In March (em março) é um tempo terminado: past simple.","pt":"me inscrevi"},{"use":"pp-since","clue":"for twenty-five years","why":"Joe still coaches beginners: for + still true → present perfect.","whyPt":"O Joe ainda treina iniciantes: for + ainda é verdade → present perfect. Em português: \"treina… há vinte e cinco anos\" (presente!).","pt":"treina (há 25 anos)"},{"use":"pp-period","clue":"So far","why":"So far = up to now. The lessons go on.","whyPt":"So far (até agora): as aulas continuam.","pt":"já aprendi"},{"use":"ps-time","clue":"last week","why":"Last week is a finished time: past simple — even with for the first time.","whyPt":"Last week (na semana passada) é um tempo terminado: past simple — mesmo com for the first time.","pt":"pulei"}],"w":{"avoided":"evitar","signed up":"inscrever-se","lessons":"aulas","coached":"treinar (alguém)","beginners":"iniciantes","patient":"paciente","learned":"aprender","float":"boiar","jumped":"pular","deep end":"parte funda","afraid of":"com medo de"}},{"id":"b1-24","kind":"dialogue","frame":"Lost and found","framePt":"Achados e perdidos","title":"A blue bag","titlePt":"Uma bolsa azul","voices":{"Mia":"f","Clerk":"m"},"body":[["Mia","Hi. I [have:dropped] my bag {on the 8:15 train} from Brighton."],["Clerk","What does it look like?"],["Mia","It's blue, quite old. I [have:owned] it {for ten years}."],["Clerk","Let me look. {So far today}, three blue bags [have:arrived] here."],["Mia","That one! Oh, thank you!"],["Clerk","You're lucky. A young man [has:handed] it in {an hour ago}."]],"pt":["Oi. Deixei cair minha bolsa no trem das 8h15 vindo de Brighton.","Como ela é?","É azul, bem velha. Tenho ela há dez anos.","Deixe-me ver. Hoje já chegaram três bolsas azuis aqui.","Aquela! Ah, obrigada!","A senhora tem sorte. Um rapaz a entregou há uma hora."],"spots":[{"use":"ps-time","clue":"on the 8:15 train","why":"The 8:15 train left at a finished moment: past simple.","whyPt":"O trem das 8h15 = um momento que já passou: past simple.","pt":"deixei cair"},{"use":"pp-since","clue":"for ten years","why":"Mia still owns the bag: for + still true → present perfect.","whyPt":"A Mia ainda tem a bolsa: for + ainda é verdade → present perfect. Em português: \"tenho ela há dez anos\" (presente!).","pt":"tenho (há dez anos)"},{"use":"pp-period","clue":"So far today","tl":"so far today","why":"So far today = up to now, and the day isn't over: present perfect.","whyPt":"So far today (até agora, hoje): o dia não acabou, então present perfect.","pt":"já chegaram (hoje)"},{"use":"ps-time","clue":"an hour ago","why":"Ago points to a finished moment: past simple.","whyPt":"Aqui \"há uma hora\" = ago (quando aconteceu): past simple.","pt":"entregou"}],"w":{"dropped":"deixar cair","look like":"parecer (aparência)","owned":"possuir, ter","arrived":"chegar","lucky":"com sorte","handed":"entregar"}},{"id":"b1-25","kind":"text","frame":"News","framePt":"Notícia","title":"A fridge that runs on sunshine","titlePt":"Uma geladeira movida a sol","body":["{Good news} from Nairobi: a 16-year-old student [has:invented] a solar fridge for small farmers.","Wanjiru Kamau [has:started] the project {two years ago}, in her school's science club.","{Since then}, she [has:tested] it on six farms around the city.","{Last month}, the fridge [has:earned] her first prize at a national science fair.","{So far}, the farmers [have:loved] it: their milk stays fresh for three days."],"pt":["Boa notícia de Nairóbi: uma estudante de 16 anos inventou uma geladeira solar para pequenos agricultores.","Wanjiru Kamau começou o projeto há dois anos, no clube de ciências da escola.","Desde então, ela a testou em seis fazendas perto da cidade.","No mês passado, a geladeira lhe rendeu o primeiro prêmio numa feira nacional de ciências.","Por enquanto, os agricultores estão adorando: o leite fica fresco por três dias."],"spots":[{"use":"pp-news","clue":"Good news","why":"This is the news, in the first sentence: it's new and it matters now. No time is given.","whyPt":"É a notícia, na primeira frase: é novidade e importa agora. Nenhum tempo é dito. Em português: \"inventou\".","pt":"inventou"},{"use":"ps-time","clue":"two years ago","why":"Ago points to a finished moment: past simple.","whyPt":"Aqui \"há dois anos\" = ago (quando começou): past simple.","pt":"começou"},{"use":"pp-since","clue":"Since then","why":"From two years ago up to now: since + present perfect.","whyPt":"De dois anos atrás até agora: since + present perfect. Em português: \"desde então, testou\".","pt":"testou (desde então)"},{"use":"ps-time","clue":"Last month","why":"Last month is a finished time: past simple.","whyPt":"Last month (no mês passado) é um tempo terminado: past simple.","pt":"rendeu"},{"use":"pp-period","clue":"So far","why":"So far = up to now, and the farmers are still using it.","whyPt":"So far (até agora): os agricultores continuam usando.","pt":"estão adorando (por enquanto)"}],"w":{"invented":"inventar","solar fridge":"geladeira solar","farmers":"agricultores","started":"começar","tested":"testar","earned":"render, ganhar (merecido)","science fair":"feira de ciências","loved":"adorar","fresh":"fresco"}},{"id":"b1-26","kind":"chat","contract":true,"title":"Camping in the rain","titlePt":"Acampando na chuva","voices":{"Eva":"f","Dan":"m"},"body":[["Eva","How's the camping trip going? ⛺"],["Dan","Terrible 😂 It [has:rained] {every day since Friday}."],["Eva","Oh no! Is your tent OK?"],["Dan","Kind of. It [has:worked] perfectly {on our trip last summer}, but now it's leaking."],["Dan","{So far}, we [have:played] about forty games of cards."],["Eva","Ha! When I was a kid, my family [has:camped] every August, {until we got a camper van}."]],"pt":["Como está indo o acampamento? ⛺","Péssimo 😂 Choveu todos os dias desde sexta.","Ah, não! A barraca de vocês está bem?","Mais ou menos. Ela funcionou perfeitamente na nossa viagem do verão passado, mas agora está vazando.","Até agora, já jogamos umas quarenta partidas de baralho.","Ha! Quando eu era criança, minha família acampava todo agosto, até a gente comprar um motorhome."],"spots":[{"use":"pp-since","clue":"every day since Friday","tl":"every day since Friday","why":"Since Friday = from Friday up to now, and the trip isn't over (it may rain again tomorrow). Since → present perfect.","whyPt":"Since Friday (desde sexta) = de sexta até agora, e a viagem não acabou (pode chover de novo amanhã). Since → present perfect. Em português: \"choveu todos os dias desde sexta\".","pt":"choveu (todos os dias desde sexta)"},{"use":"ps-time","clue":"on our trip last summer","why":"Last summer is a finished time: past simple.","whyPt":"Last summer (no verão passado) é um tempo terminado: past simple.","pt":"funcionou"},{"use":"pp-period","clue":"So far","why":"So far = up to now, and the trip isn't over: the number of games can still grow.","whyPt":"So far (até agora): a viagem ainda não acabou, e o número de partidas ainda pode crescer.","pt":"já jogamos"},{"use":"ps-ended","clue":"until we got a camper van","tl":"until the camper van","why":"Until we got a camper van = it stopped then. A finished situation: past simple.","whyPt":"Until we got a camper van (até comprarmos um motorhome): isso acabou. Situação terminada = past simple. Em português: \"acampava\".","pt":"acampava"}],"w":{"camping trip":"acampamento, viagem de camping","rained":"chover","tent":"barraca","worked":"funcionar","leaking":"vazando","played":"jogar","games of cards":"partidas de baralho","camped":"acampar","camper van":"motorhome, trailer"}},{"id":"b1-27","kind":"text","frame":"A special person","framePt":"Uma pessoa especial","title":"Mr. Okafor next door","titlePt":"O Sr. Okafor, o vizinho","body":["Mr. Okafor [has:lived] next door to us {since 1998}. He's like a grandfather to me.","He [has:worked] as a bus driver for thirty years, {until 2015}.","These days he grows tomatoes, and {last summer} he [has:handed] them out to the whole street.","{So far this year}, he [has:planted] forty tomato plants. He says this summer will be his best ever!"],"pt":["O Sr. Okafor mora ao nosso lado desde 1998. Ele é como um avô para mim.","Ele trabalhou como motorista de ônibus por trinta anos, até 2015.","Hoje em dia ele planta tomates, e no verão passado ele os distribuiu para a rua inteira.","Este ano ele já plantou quarenta pés de tomate. Ele diz que este verão vai ser o melhor de todos!"],"spots":[{"use":"pp-since","clue":"since 1998","why":"He still lives next door, starting in 1998: since + present perfect.","whyPt":"Ele ainda mora ao lado, desde 1998: since + present perfect. Em português: \"mora… desde 1998\" (presente!).","pt":"mora (desde 1998)"},{"use":"ps-ended","clue":"until 2015","tl":"until 2015","why":"Until 2015 = he stopped then. A finished situation takes the past simple, even with for.","whyPt":"Until 2015 (até 2015): ele parou. Situação terminada = past simple, mesmo com for.","pt":"trabalhou"},{"use":"ps-time","clue":"last summer","why":"Last summer is a finished time: past simple.","whyPt":"Last summer (no verão passado) é um tempo terminado: past simple.","pt":"distribuiu"},{"use":"pp-period","clue":"So far this year","tl":"so far this year","why":"So far this year = up to now, and the year isn't over.","whyPt":"So far this year (até agora, este ano): o ano continua.","pt":"já plantou (este ano)"}],"w":{"next door":"ao lado, vizinho","lived":"morar","bus driver":"motorista de ônibus","worked":"trabalhar","grows":"cultivar, plantar","planted":"plantar","best ever":"o melhor de todos","handed":"distribuir, entregar"}},{"id":"b1-28","kind":"dialogue","contract":true,"title":"Paula? Is that you?","titlePt":"Paula? É você?","voices":{"Sam":"m","Paula":"f"},"body":[["Sam","Paula? Is that you? I haven't seen you in ages!"],["Paula","Sam! Wow. We [have:worked] together at that café, what, {ten years ago}?"],["Sam","Eleven! Where did you go?"],["Paula","I [have:moved] to Berlin {after that}. But I [have:lived] here again {since March}."],["Sam","Great! I still work in cafés. I [have:managed] my own place {for three years} now."]],"pt":["Paula? É você? Não te vejo há séculos!","Sam! Nossa. A gente trabalhou junto naquele café, há uns dez anos, né?","Onze! Pra onde você foi?","Me mudei para Berlim depois disso. Mas moro aqui de novo desde março.","Que ótimo! Eu ainda trabalho com cafés. Administro o meu próprio há três anos."],"spots":[{"use":"ps-time","clue":"ten years ago","why":"Ago points to a finished time: past simple.","whyPt":"Aqui \"há dez anos\" = ago (quando foi): past simple.","pt":"trabalhamos"},{"use":"ps-story","clue":"after that","why":"After that = the next step in Paula's story. Events in order: past simple.","whyPt":"After that (depois disso) = o próximo passo da história: past simple.","pt":"me mudei"},{"use":"pp-since","clue":"since March","why":"She came back in March and still lives here: since + present perfect.","whyPt":"Ela voltou em março e ainda mora aqui: since + present perfect. Em português: \"moro… desde março\" (presente!).","pt":"moro (desde março)"},{"use":"pp-since","clue":"for three years","why":"Sam still manages it: for + still true → present perfect.","whyPt":"O Sam ainda administra: for + ainda é verdade → present perfect. Em português: \"administro… há três anos\".","pt":"administro (há três anos)"}],"w":{"in ages":"há séculos (muito tempo)","worked":"trabalhar","moved":"mudar-se","lived":"morar","managed":"administrar, gerenciar","place":"lugar, estabelecimento"}},{"id":"b1-29","kind":"text","frame":"Online forum","framePt":"Fórum on-line","title":"Eight months in Spain","titlePt":"Oito meses na Espanha","contract":true,"body":["I [have:lived] in Valencia {for eight months} now, and I love it.","{At first}, I [have:struggled] with the language. People speak so fast!","I [have:signed] up for Spanish classes {in October},","and {so far} I [have:learned] about 500 words. Any tips for the next 500? 😄"],"pt":["Moro em Valência há oito meses, e adoro.","No começo, sofri com a língua. As pessoas falam tão rápido!","Me inscrevi em aulas de espanhol em outubro,","e já aprendi umas 500 palavras. Alguma dica para as próximas 500? 😄"],"spots":[{"use":"pp-since","clue":"for eight months","why":"The writer still lives there: for + still true → present perfect.","whyPt":"A pessoa ainda mora lá: for + ainda é verdade → present perfect. Em português: \"moro… há oito meses\" (presente!).","pt":"moro (há oito meses)"},{"use":"ps-context","clue":"At first","tl":"the first weeks","why":"At first = in the first weeks, a time that is over: past simple.","whyPt":"At first (no começo) = as primeiras semanas, que já passaram: past simple.","pt":"sofri"},{"use":"ps-time","clue":"in October","why":"In October is a finished time: past simple.","whyPt":"In October (em outubro) é um tempo terminado: past simple.","pt":"me inscrevi"},{"use":"pp-period","clue":"so far","why":"So far = up to now. The learning goes on.","whyPt":"So far (até agora): o aprendizado continua.","pt":"já aprendi"}],"w":{"lived":"morar","struggled":"ter dificuldade, sofrer","language":"língua, idioma","signed up":"inscrever-se","learned":"aprender","tips":"dicas"}},{"id":"b1-30","kind":"dialogue","contract":true,"title":"The window","titlePt":"A janela","voices":{"Mom":"f","Leo":"m"},"body":[["Mom","Leo! What's this? The kitchen window is broken!"],["Leo","Sorry, Mom. I [have:kicked] the ball too hard {ten minutes ago}."],["Mom","Inside the house?"],["Leo","No, in the garden! It [has:bounced] off the wall {and then} hit the window."],["Mom","Oh, Leo..."],["Leo","I can pay for it. I [have:saved] forty euros {since Christmas}."],["Mom","Well, {this is the first time} you [have:damaged] anything, so I'm not angry."]],"pt":["Leo! O que é isso? A janela da cozinha está quebrada!","Desculpa, mãe. Chutei a bola forte demais há dez minutos.","Dentro de casa?","Não, no jardim! Ela bateu na parede e depois acertou a janela.","Ai, Leo...","Eu posso pagar. Juntei quarenta euros desde o Natal.","Bom, é a primeira vez que você estraga alguma coisa, então não estou brava."],"spots":[{"use":"ps-time","clue":"ten minutes ago","why":"Ago points to a finished moment: past simple.","whyPt":"Aqui \"há dez minutos\" = ago (quando aconteceu): past simple.","pt":"chutei"},{"use":"ps-story","clue":"and then","why":"And then = events in order, one after the other: past simple.","whyPt":"And then (e depois) = fatos em sequência: past simple.","pt":"bateu"},{"use":"pp-since","clue":"since Christmas","why":"From Christmas up to now: since + present perfect.","whyPt":"Do Natal até agora: since + present perfect. Em português: \"juntei… desde o Natal\".","pt":"juntei (desde o Natal)"},{"use":"pp-exp","clue":"this is the first time","tl":"first time up to now","why":"This is the first time… = the first time in his life up to now: present perfect.","whyPt":"\"É a primeira vez que…\" = a primeira vez na vida até agora: present perfect, mesmo com o presente em português (estraga).","pt":"estraga"}],"w":{"broken":"quebrado","kicked":"chutar","bounced":"quicar, bater e voltar","hit":"acertar, bater","saved":"juntar, economizar","damaged":"estragar, danificar","angry":"bravo, com raiva"}}],"B2":[{"id":"b2-01","kind":"text","frame":"Formal email","framePt":"E-mail formal","title":"Where is my suitcase?","titlePt":"Cadê a minha mala?","body":["Dear Customer Service Team,","I am writing about my lost suitcase and the lack of response from your company. I [have:relied] on SkyHop for my business trips {for over ten years}, and {this is the first time} I have had a serious problem.","{On June 3}, I [have:traveled] from Madrid to Toronto on flight SH 482. {When} I [have:arrived], my suitcase was not on the belt.","I [have:called] your customer service line six times. Each time, an agent said that someone would call me back, but nobody ever did.","{So far}, I [have:purchased] clothes, toiletries and a phone charger, and the receipts add up to $640. Copies are in the attachment.","I expect a full refund and a clear answer within seven days.","Sincerely,","Daniel Moreau"],"pt":["Prezada equipe de atendimento ao cliente,","Escrevo a respeito da minha mala extraviada e da falta de resposta da sua empresa. Eu conto com a SkyHop para as minhas viagens de trabalho há mais de dez anos, e esta é a primeira vez que tenho um problema sério.","No dia 3 de junho, viajei de Madri para Toronto no voo SH 482. Quando cheguei, a minha mala não estava na esteira.","Liguei seis vezes para a central de atendimento. Todas as vezes, um atendente disse que alguém me ligaria de volta, mas ninguém ligou.","Até agora, comprei roupas, itens de higiene e um carregador de celular, e os recibos somam 640 dólares. As cópias estão em anexo.","Espero o reembolso total e uma resposta clara em até sete dias.","Atenciosamente,","Daniel Moreau"],"spots":[{"use":"pp-since","clue":["for over ten years","this is the first time"],"tl":"for over ten years","why":"He started flying with SkyHop over ten years ago and he is still their customer — he's writing to them now. For + a period up to now → present perfect.","whyPt":"Ele começou a voar com a SkyHop há mais de dez anos e ainda é cliente — está escrevendo para eles agora. Em português: \"conto com a SkyHop há mais de dez anos\" (presente!).","pt":"conto com (há mais de dez anos)"},{"use":"ps-time","clue":"On June 3","why":"A date is a finished time, so we use the past simple.","whyPt":"Uma data é um tempo terminado, então usamos o past simple.","pt":"viajei"},{"use":"ps-context","clue":"When","tl":"arrival on June 3","why":"This clause has no date, but we know when: his arrival from that same flight on June 3 — a finished moment. A when-clause about a finished event → past simple.","whyPt":"Esta oração não tem data, mas sabemos quando: a chegada daquele mesmo voo, em 3 de junho — um momento terminado. Oração com when sobre um fato terminado → past simple.","pt":"cheguei"},{"use":"pp-period","both":{"alt":"ps-context","tlPp":"calls up to now","tlPs":"those six calls","pp":"the calls belong to a problem that is still open — and still unsolved","ppPt":"as ligações fazem parte de um problema que continua aberto — e sem solução","ps":"he simply reports six calls as finished events (very common in American English)","psPt":"ele só relata seis ligações como fatos terminados (muito comum no inglês americano)"},"why":"Both are correct here. With have, he connects the calls to now: the problem is still open. Without it, he just reports what happened — American English often does this.","whyPt":"As duas formas estão certas. Com have, ele liga as ligações ao agora: o problema continua aberto. Sem have, ele só relata o que aconteceu — o inglês americano faz muito isso.","pt":"liguei"},{"use":"pp-period","clue":"So far","why":"So far = up to the moment he is writing. The period isn't over: he may need to buy more.","whyPt":"So far = até o momento em que ele escreve. O período não acabou: ele pode precisar comprar mais coisas.","pt":"comprei (até agora)"}],"w":{"suitcase":"mala","lack":"falta","response":"resposta","relied":"contar com (rely on)","business trips":"viagens de trabalho","serious":"sério","traveled":"viajar","arrived":"chegar","belt":"esteira (de bagagem)","called":"ligar (telefonar)","customer service":"atendimento ao cliente","agent":"atendente","purchased":"comprar","toiletries":"itens de higiene","charger":"carregador","receipts":"recibos","add up to":"somam","attachment":"anexo","refund":"reembolso","within":"dentro de, em até"}},{"id":"b2-02","kind":"dialogue","contract":true,"frame":"Podcast interview","framePt":"Entrevista de podcast","title":"From food truck to Michelin star","titlePt":"Do food truck à estrela Michelin","voices":{"Host":"m","Ama":"f"},"body":[["Host","Welcome back to Table Talk! My guest today is chef Ama Mensah. Ama, congratulations on your Michelin star!"],["Ama","Thank you! It still feels unreal. {This is the first time} a vegan restaurant in this city [has:received] one."],["Host","Let's go back to the beginning. How did it all start?"],["Ama","With a food truck! In 2014, my sister and I took out a small loan and bought an old truck."],["Host","And how long did you run it?"],["Ama","We [have:operated] it for four years. {Then}, {in 2018}, we [have:opened] this place."],["Host","And it's been a hit ever since."],["Ama","We've been very lucky. {Since the opening}, we [have:served] over 200,000 meals."],["Host","Impressive! Any famous guests?"],["Ama","A few! I [have:cooked] for two presidents and a very famous rock star — but I can't tell you who!"]],"pt":["Bem-vindos de volta ao Table Talk! Minha convidada de hoje é a chef Ama Mensah. Ama, parabéns pela estrela Michelin!","Obrigada! Ainda parece irreal. É a primeira vez que um restaurante vegano desta cidade recebe uma.","Vamos voltar ao começo. Como tudo começou?","Com um food truck! Em 2014, eu e minha irmã fizemos um pequeno empréstimo e compramos um caminhão velho.","E por quanto tempo vocês tocaram o food truck?","Ficamos com ele por quatro anos. Depois, em 2018, abrimos este lugar.","E é um sucesso desde então.","Tivemos muita sorte. Desde a inauguração, já servimos mais de 200.000 refeições.","Impressionante! Algum convidado famoso?","Alguns! Já cozinhei para dois presidentes e um astro do rock muito famoso — mas não posso dizer quem!"],"spots":[{"use":"pp-exp","clue":"This is the first time","tl":"first time ever","why":"\"This is the first time…\" looks back at everything that has happened up to now, so English uses the present perfect after it.","whyPt":"\"É a primeira vez que…\" olha para tudo o que aconteceu até agora, então o inglês usa present perfect depois dessa expressão. Em português: \"é a primeira vez que … recebe\" (presente!).","pt":"recebe"},{"use":"ps-ended","clue":"Then","tl":"4 years (then ended)","why":"Four years, but the food-truck period is over: then they opened the restaurant. The host's question already says it: How long DID you run it? For + finished → past simple.","whyPt":"Quatro anos, mas a fase do food truck acabou: depois eles abriram o restaurante. A pergunta já mostra isso: How long DID you run it? For + já acabou → past simple.","pt":"ficamos com ele (por quatro anos)"},{"use":"ps-time","clue":"in 2018","why":"In 2018 is a finished time, so we use the past simple.","whyPt":"In 2018 é um tempo terminado: past simple.","pt":"abrimos"},{"use":"pp-since","clue":"Since the opening","why":"From the opening up to now, and they keep serving meals. Since → present perfect.","whyPt":"Da inauguração até agora, e eles continuam servindo refeições. Since → present perfect.","pt":"já servimos (desde a inauguração)"},{"use":"pp-exp","both":{"alt":"ps-context","tlPp":"her career so far","tlPs":"those dinners","pp":"it's part of her experience — something true about her career up to now","ppPt":"faz parte da experiência dela — algo verdadeiro sobre a carreira até agora","ps":"she's remembering those particular dinners as finished events","psPt":"ela está lembrando daqueles jantares específicos como fatos terminados"},"why":"Both are correct. With have, it's her life experience as a chef. Without it, she's thinking of specific dinners in the past.","whyPt":"As duas formas estão certas. Com have, é a experiência de vida dela como chef. Sem have, ela está pensando em jantares específicos no passado.","pt":"já cozinhei / cozinhei"}],"w":{"guest":"convidado(a)","congratulations":"parabéns","unreal":"irreal","vegan":"vegano","received":"receber","took out":"fizemos (um empréstimo)","loan":"empréstimo","truck":"caminhão","run":"administrar, tocar (um negócio)","operated":"operar, administrar","opened":"abrir","hit":"sucesso","lucky":"sortudos","served":"servir","meals":"refeições","impressive":"impressionante","cooked":"cozinhar","guests":"convidados","rock star":"astro do rock"}},{"id":"b2-03","kind":"text","frame":"Exhibition text","framePt":"Texto de exposição","title":"Two women, one camera","titlePt":"Duas mulheres, uma câmera","body":["Mira Kovač ({1931–2009}) was one of the great street photographers of the twentieth century. {During her long career}, she [has:photographed] people in more than sixty cities, from Lagos to Tokyo.","{In 1968}, she [has:captured] her most famous image: a boy dancing in the rain in Lisbon.","Her daughter, Nina Kovač, is also a photographer. Nina [has:exhibited] her own work in {over thirty countries}, and her new series opens in Seoul next month.","{Since her mother's death}, Nina [has:managed] the family archive of more than 400,000 negatives.","This exhibition brings their photos together for the first time. Since its launch in March, more than 50,000 people have come to see it, so the museum [has:extended] it until the end of June."],"pt":["Mira Kovač (1931–2009) foi uma das grandes fotógrafas de rua do século XX. Durante a sua longa carreira, ela fotografou pessoas em mais de sessenta cidades, de Lagos a Tóquio.","Em 1968, ela capturou a sua imagem mais famosa: um menino dançando na chuva em Lisboa.","A filha dela, Nina Kovač, também é fotógrafa. Nina já expôs o próprio trabalho em mais de trinta países, e a sua nova série estreia em Seul no mês que vem.","Desde a morte da mãe, Nina administra o arquivo da família, com mais de 400.000 negativos.","Esta exposição reúne as fotos das duas pela primeira vez. Desde a abertura, em março, mais de 50.000 pessoas vieram vê-la, então o museu prorrogou a exposição até o fim de junho."],"spots":[{"use":"ps-ended","clue":["1931–2009","During her long career"],"tl":"her career (1931–2009)","why":"Mira died in 2009, so her career is a finished period. Even without an exact date, the life of someone who has died is finished time → past simple.","whyPt":"A Mira morreu em 2009, então a carreira dela é um período terminado. Mesmo sem uma data exata, a vida de alguém que já morreu é tempo terminado → past simple.","pt":"fotografou"},{"use":"ps-time","clue":"In 1968","why":"In 1968 is a finished time, so we use the past simple.","whyPt":"In 1968 é um tempo terminado: past simple.","pt":"capturou"},{"use":"pp-exp","clue":"over thirty countries","tl":"30+ countries so far","why":"Nina is alive and still working (a new series opens next month), so this is her experience up to now, with no time given. Compare with her mother: a finished life → past simple.","whyPt":
