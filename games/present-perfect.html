/* 07-back.js — copied from the a / an / the game (../the an a practice): the phone's back gesture (or the browser's
   Back) closes the open window instead of leaving the page: the Guide, Favorites / Seen, the end card, the tutorial and
   the Play menu. Each window holds a history entry while it is open. A MutationObserver sees it open and close, whatever
   closed it (✕, Escape, a click outside, a button), so the entry is added and taken back in one place. Back closes the
   window opened last. A new window needs one backLayer(el, isOpen, close) call. */
// Our history entries must not bring back an old scroll position: closing the Guide scrolls to the explanation it was
// opened from, and the browser would undo that. (Not in the a / an / the game, which has this bug.)
try { history.scrollRestoration = "manual"; } catch (e) {}
const BACK = [];     // open windows, oldest first: { el, close, pushed }
let backSkip = 0;    // our own history.back() calls, whose popstate is not a Back press
// A window that opens while one of those history.back() calls is still on its way (the Play menu closes and quick-fire
// starts in the same click) waits for it: the browser aims history.back() when it is called, so an entry pushed in
// between would be swept away with it, and the next Back would leave the page. Pushed once the popstate arrives.
const pendingPush = [];
function pushEntry(L) { try { history.pushState({ layer: 1 }, ""); L.pushed = true; } catch (e) { L.pushed = false; } }   // a file:// page may refuse
// el: the window's element; isOpen(): whether it shows; close(): what Back does (the same as its ✕ or Escape).
function backLayer(el, isOpen, close) {
  const L = { el, close, pushed: false, byBack: false };
  let was = isOpen();
  new MutationObserver(() => {
    const now = isOpen(); if (now === was) return; was = now;
    if (now) {
      if (backSkip) pendingPush.push(L); else pushEntry(L);
      BACK.push(L);
    } else {
      const i = BACK.indexOf(L); if (i >= 0) BACK.splice(i, 1);
      const p = pendingPush.indexOf(L); if (p >= 0) pendingPush.splice(p, 1);   // closed before its entry was even added
      // Closed by the game, not by Back: take its history entry away, so the next Back isn't a dead press.
      if (L.pushed && !L.byBack) { backSkip++; history.back(); }
      L.pushed = false;
    }
  }).observe(el, { attributes: true, attributeFilter: ["class", "hidden"] });
}
window.addEventListener("popstate", () => {
  if (backSkip) { backSkip--; if (!backSkip) pendingPush.splice(0).forEach(pushEntry); return; }
  const L = BACK[BACK.length - 1]; if (!L) return;
  L.byBack = true; L.close(); setTimeout(() => { L.byBack = false; }, 0);   // the observer has run by then
});
// Header pop-ups (01-theme.js, 02-sound.js; from the a / an / the game): the back gesture closes them too.
backLayer(swwrap, () => swwrap.classList.contains("open"), () => swOpen(false));
backLayer(volwrap, () => volwrap.classList.contains("open"), () => volwrap.classList.remove("open"));

/* 08-sky.js — the bubbles drifting up behind everything (from Be Do Modal, Nov 2026, itself from English Bubbles): 7
   see-through, softly blurred bubbles of random size (40-140 px), place and pace (95-145 s a climb). At page load they
   are already part-way up, spread over the screen, and the layer fades in (.sky.in). Only transform / opacity move;
   they pause while a Build word is carried (body.carrying, 24-shine.js) and are left out with reduced motion. Look: .sky
   at the end of 00-base.css. */
(function () {
  var host = $("sky");
  if (!host || reduceMotion) return;
  var hues = [215, 330, 150, 265, 30, 190];
  for (var k = 0; k < 7; k++) {
    var s = document.createElement("span"), size = 40 + Math.round(Math.random() * 100), t = 95 + Math.round(Math.random() * 50);
    // a negative delay starts the climb part-way: spread from 15% to 80% of the way up, bubble by bubble
    var at = (0.15 + 0.65 * (k + Math.random() * 0.8) / 7) * t;
    s.style.cssText = "width:" + size + "px;height:" + size + "px;left:" + Math.round(Math.random() * 96) + "%;" +
      "--h:" + hues[k % hues.length] + ";--t:" + t + "s;--d:-" + at.toFixed(1) + "s;" +
      "--x:" + Math.round(Math.random() * 80 - 40) + "px";
    host.appendChild(s);
  }
  setTimeout(function () { host.classList.add("in"); }, 60);   // a timer, not animation frames: a page opened in the background gets none until shown
})();

/* 10-game.js — the game. A normal game is the level's "sequence" of steps (levels.json): "text" (one text), "build" (one
   sentence of the Build round, 23-build.js) and "quiz" (the quick question, 22-modes.js), e.g. text, build, quiz, text,
   build. Practice games (review / favorites) are texts only, "rounds" of them.
   Every regular -ed verb in a text has a grey have / has in front (a "spot"). The player switches each one on
   (present perfect) or leaves it off (past simple), then presses Check.
   Scoring per text: all right on the first check = PERFECT_PTS per spot. A wrong check only says HOW MANY choices are
   wrong ("feedback": "sentences" at A2 says how many sentences instead; "lines" also marks the lines with a mistake) and costs a try; after the last try
   (levels.json "tries") the answers are shown and every right spot is 1 point.
   Hints ("Clues") light up the time words of the text: a pool for the whole game (levels.json "hints"), one per text,
   and each unused hint is +1 bonus point at the end. */
const PERFECT_PTS = 2;
// Rules come from the level of the text being played (practice games can mix levels).
const lvl = () => DATA.levels[(G.r && G.r.level) || G.level] || {};
const levelOf = t => t.id.split("-")[0].toUpperCase();
const maxTries = () => lvl().tries || 2;
const hintPool = () => (DATA.levels[G.level] || {}).hints || 3;
const TEXTS = {};
Object.keys(DATA.texts).forEach(l => DATA.texts[l].forEach(t => { TEXTS[t.id] = t; }));
const SENTS = {};   // the Build round's sentences by id (a2-s01…, given by build.py), for favorites
Object.keys(DATA.build).forEach(l => DATA.build[l].forEach(s => { SENTS[s.id] = s; }));
// Name colours for the speakers of a dialogue, in order of appearance.
const WHO_HUE = [205, 330, 150, 35];
const G = { level: "A2", mode: "normal", pool: [], total: 5, idx: 0, score: 0, results: [], streak: 0, hintsLeft: 0, r: null, phase: "idle" };
const stage = $("stage"), card = $("card"), revealEl = $("reveal"), hintEl = $("hint"), toolsEl = $("tools"), quizEl = $("quiz");
const scoreEl = $("score"), scEl = $("sc"), bestEl = $("bestlbl"), hintBtn = $("hintbtn"), resetBtn = $("resetbtn"), checkBtn = $("checkbtn"), triesEl = $("tries");

/* ---------- Game flow ---------- */
// mode: "normal" | "speed" | "review" | "fav" (see 22-modes.js); ids = the texts for a review / favorites game.
function newGame(level, mode = "normal", ids) {
  G.level = level; G.mode = mode; applyUi();
  document.body.classList.toggle("practice-mode", mode !== "normal");   // quick-fire / review / favorites: Back returns to a normal game (22-modes.js)
  G.pool = ids ? shuffle(ids.map(id => TEXTS[id]).filter(Boolean)) : orderPool(DATA.texts[level]);
  const sents = ids ? shuffle(ids.map(id => SENTS[id]).filter(Boolean)) : [];   // favorite sentences in a Favorites game
  // The steps of the game; G.total = how many texts, G.idx = the text being played, G.step = the step.
  const seq = DATA.levels[level].sequence;
  if (mode === "normal" && seq) G.seq = seq.filter(k => k !== "build" || (DATA.build[level] || []).length);
  else if (ids) {   // practice: every text and sentence of the list (texts up to "rounds"), alternating while both last
    const nt = Math.min(DATA.levels[level].rounds || 4, G.pool.length); G.seq = [];
    for (let a = 0, b = 0; a < nt || b < sents.length;) { if (a < nt) { G.seq.push("text"); a++; } if (b < sents.length) { G.seq.push("build"); b++; } }
  } else G.seq = [];
  G.total = mode === "speed" ? Infinity : Math.min(G.seq.filter(k => k === "text").length, G.pool.length);
  G.idx = 0; G.step = 0; G.score = 0; G.results = []; G.streak = 0; G.hintsLeft = hintPool(); G.quiz = null; G.r = null;
  G.build = sents.length ? { list: sents, k: -1, res: [], cur: null } : newBuild();
  stopSpeed(); stopSpeech(); quizEl.hidden = true; revealEl.hidden = true; hideBuild(); stage.hidden = toolsEl.hidden = false;
  showScore(); showCombo();
  if (mode === "speed") return speedIntro();   // goal card and 3-2-1 first; it starts the clock
  runStep();
}
const stepKind = () => G.seq[G.step];
const isLastStep = () => G.step >= G.seq.length - 1;
function runStep() {
  const k = stepKind();
  if (!k) { updateProgress(); showEnd(); return; }
  if (k === "text" && G.idx < G.total) startRound();
  else if (k === "build" && G.build && G.build.k + 1 < G.build.list.length) startBuild();
  else if (k === "quiz" && G.results.length && !G.quiz) showQuiz();
  else { G.step++; runStep(); }   // nothing for this step (no text left, no sentence, nothing to ask about)
}
// On to the next step: the current one slides out first.
function nextStep() {
  G.step++; stopSpeech();
  if (!stepKind()) { updateProgress(); showEnd(); return; }
  stage.classList.add("out"); revealEl.classList.add("out");
  setTimeout(() => {
    revealEl.classList.remove("out"); stage.classList.remove("out");
    runStep();
    scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
  }, reduceMotion ? 0 : 260);
}
function startRound() {
  const t = G.pool[G.idx % G.pool.length], P = parsed(t);
  G.r = { t, P, level: levelOf(t), on: P.spots.map(() => false), tries: 0, hinted: false };
  G.phase = "play";
  stage.hidden = toolsEl.hidden = false; quizEl.hidden = true; hideBuild();
  revealEl.hidden = true; revealEl.innerHTML = "";
  hideGloss(); renderCard(); renderTools(); updateProgress();
  hintEl.innerHTML = tx(G.idx === 0 ? "intro" : "introShort");
  stage.classList.remove("out"); if (!reduceMotion) flash(stage, "rise");
}
function nextRound() {
  if (G.phase !== "done") return;
  G.phase = "idle";
  G.idx++;
  nextStep();
}

/* ---------- Rendering ---------- */
// The text card: a tag (frame or kind), the title, then one block per paragraph or dialogue turn.
// Chats put the second speaker's messages on the right.
function renderCard() {
  const r = G.r, t = r.t, P = r.P, kind = t.kind || "text";
  const who = [...new Set(P.lines.map(L => L.who).filter(Boolean))];
  card.className = "card k-" + kind;
  card.innerHTML = '<span class="tag">' + esc(frameName(t)) + '</span><h2 class="ttl">' + esc(t.title) + "</h2>" +
    '<div class="lines">' + P.lines.map((L, li) => {
      // In a dialogue or chat, a line with no speaker is a stage note: "(some time later)".
      const k = L.who ? who.indexOf(L.who) : -1, note = kind !== "text" && !L.who;
      return '<div class="ln' + (kind === "chat" && k === 1 ? " me" : "") + (note ? " note" : "") + '" data-l="' + li + '"' + (k >= 0 ? ' style="--h:' + WHO_HUE[k % WHO_HUE.length] + '"' : "") + ">" +
        (L.who ? '<span class="who">' + esc(L.who) + "</span>" : "") + '<p class="say">' + lineHTML(t, P, li) + "</p></div>";
    }).join("") + "</div>";
  r.spotEls = [...card.querySelectorAll(".spot")];
}
// The card's tag: the text's "frame" (Postcard, News...; "framePt" at native-UI levels), else its kind.
function frameName(t) {
  const k = t.kind || "text";
  return t.frame ? (nativeUi() && t.framePt) || t.frame : tx(k === "chat" ? "kChat" : k === "dialogue" ? "kDialogue" : "kText");
}
function lineHTML(t, P, li) {
  // A contracted spot ('ve / 's) never wraps away from its pronoun: the space before it doesn't break.
  return walk(P, li, 0, Infinity, {
    t: s => glossWrap(s, t),
    clue: (c, s) => '<span class="clue" data-c="' + c + '">' + glossWrap(s, t) + "</span>",
    spot: i => { const sp = P.spots[i]; return '<span class="spot" data-i="' + i + '"><button type="button" class="aux bw' + (sp.short ? " c" : "") + '" style="--ang:' + (i * 137 % 360) + 'deg;--dl:-' + (i * 2.3 % 10).toFixed(1) + 's" aria-pressed="false" title="' + esc(sp.shown) + ': on / off">' + soapHTML(esc(sp.shown)) + '</button><span class="vb">' + glossWrap(sp.verb, t) + "</span></span>"; }
  }).replace(/ (<span class="spot" data-i="\d+"><button type="button" class="aux bw c")/g, "&nbsp;$1");
}
function renderTools() {
  const r = G.r, play = G.phase === "play";
  triesEl.innerHTML = Array.from({ length: maxTries() }, (_, i) => '<i class="' + (r && i < r.tries ? "used" : "") + '"></i>').join("");
  triesEl.title = (maxTries() - (r ? r.tries : 0)) + " tries left";
  hintBtn.disabled = !play || !G.hintsLeft || r.hinted;
  resetBtn.disabled = !play || !r.on.some(Boolean);
  checkBtn.disabled = !play;
  checkBtn.classList.toggle("pulse", play && r.on.some(Boolean));
  // "2 left": on narrow phones only the number shows (.hl-w hides the words), so the tools keep one row.
  const hl = tx("left", { n: "#N#" }).split("#N#").map(p => p ? '<span class="hl-w">' + esc(p) + "</span>" : "");
  $("hintleft").innerHTML = hl[0] + G.hintsLeft + (hl[1] || "");
}
function updateProgress() {
  showDays();
  if (G.mode === "speed") return speedRender();
  // The bar counts every step of the game (texts, Build sentences, the quick question); the label names the step.
  const k = stepKind(), B = G.build;
  const finished = k === "text" ? G.phase === "done" : k === "build" ? !!(B && B.cur && B.cur.done && G.phase === "build") : k === "quiz" ? !!(G.quiz && G.quiz.ok !== null) : true;
  $("pfill").style.width = (Math.min(G.step + (finished ? 1 : 0), G.seq.length) / G.seq.length * 100) + "%";
  if (k === "build" && B && B.cur) $("proglbl").textContent = tx("buildOf", { n: B.k + 1, total: B.list.length });
  else if (k === "quiz") $("proglbl").textContent = tx("quizLabel");
  else if (k === "text") $("proglbl").textContent = tx({ review: "reviewOf", fav: "favOf" }[G.mode] || "textOf", { n: Math.min(G.idx + 1, G.total), total: G.total });
}
// Best scores are kept for normal games and quick-fire; practice games don't save one ("" = none).
const BEST = { normal: "pp-best2-", speed: "pp-speed-" };   // pp-best2-: games of texts + Build sentences (2026-11-14; pp-best- was 4 texts)
function bestKey() { return BEST[G.mode] ? BEST[G.mode] + G.level : ""; }
function showScore() {
  scEl.textContent = G.score;
  bestEl.textContent = bestKey() ? "best " + (parseInt(load(bestKey()), 10) || 0) : "practice";
}
// "×3" on the score tile while perfect texts keep coming.
function showCombo() { const c = $("combo"); c.hidden = G.streak < 2; c.textContent = "×" + G.streak; if (G.streak >= 2) flash(c, "tick"); }

/* ---------- Playing ---------- */
function toggleSpot(i) {
  const r = G.r; if (G.phase !== "play" || !r.spotEls[i]) return;
  const on = r.on[i] = !r.on[i], el = r.spotEls[i];
  el.classList.toggle("on", on); el.querySelector(".aux").setAttribute("aria-pressed", String(on));
  if (!reduceMotion) flash(el, "pop");
  if (on) sndPlace(); else sndBack();
  el.closest(".ln").classList.remove("err");   // the "!" from the last check goes once its line changes
  renderTools();
}
function resetAll() {
  const r = G.r; if (G.phase !== "play" || !r.on.some(Boolean)) return;
  r.on = r.on.map(() => false);
  r.spotEls.forEach(el => { el.classList.remove("on"); el.querySelector(".aux").setAttribute("aria-pressed", "false"); });
  card.querySelectorAll(".ln.err").forEach(el => el.classList.remove("err"));
  sndBack(); renderTools();
}
// Bring the hint line (above the text) into view, just under the sticky dock, when it is off screen: after a wrong
// check the player is down at the Check button and would miss the message.
function scrollToHint() {
  const dock = document.querySelector(".dock"), topLimit = (dock ? dock.getBoundingClientRect().bottom : 0) + 12, b = hintEl.getBoundingClientRect();
  if (b.top >= topLimit && b.bottom <= innerHeight) return;
  scrollTo({ top: scrollY + b.top - topLimit, behavior: reduceMotion ? "auto" : "smooth" });
}
function check() {
  const r = G.r; if (G.phase !== "play") return;
  const wrong = r.P.spots.map((sp, i) => !sp.both && r.on[i] !== sp.want ? i : -1).filter(i => i >= 0);   // a "both" spot is never wrong
  r.tries++;
  r.wrong = wrong;   // Clues after this check light only these spots' clue words
  if (!wrong.length) return finish(true);
  G.streak = 0; showCombo(); sndBad(); flash(card, "shake");
  if (r.tries >= maxTries()) {
    G.phase = "checking"; renderTools(); hintEl.innerHTML = tx("outOfTries");
    setTimeout(() => { if (G.r === r) finish(false); }, reduceMotion ? 0 : 700);
    return;
  }
  const fb = lvl().feedback, lines = fb === "lines", left = maxTries() - r.tries;
  if (lines) { const ls = new Set(wrong.map(i => r.P.spots[i].line)); card.querySelectorAll(".ln").forEach(el => el.classList.toggle("err", ls.has(+el.dataset.l))); }
  // "sentences" (A2): how many sentences have a mistake, nothing marked in the text.
  const ns = new Set(wrong.map(i => r.P.spots[i].line + ":" + r.P.spots[i].sent[0])).size;
  // The "how many are wrong" part pulses a few times so the player notices it (.alert in 10-game.css).
  hintEl.innerHTML = '<span class="alert">' + (fb === "sentences" ? tx(ns === 1 ? "wrongS1" : "wrongSN", { n: ns }) : tx(wrong.length === 1 ? "wrong1" : "wrongN", { n: wrong.length })) + "</span>" +
    (lines ? " " + tx("wrongLines") + "." : "") + " " + tx(left === 1 ? "tryLeft" : "triesLeft", { n: left });
  scrollToHint();
  renderTools();
}
// End of a text: mark every spot right / wrong (and show the right form), score it, then the explanations.
function finish(allRight) {
  const r = G.r, P = r.P, n = P.spots.length, t = r.t;
  const ok = P.spots.map((sp, i) => !!sp.both || r.on[i] === sp.want), k = ok.filter(Boolean).length;
  const perfect = allRight && r.tries === 1, pts = perfect ? n * PERFECT_PTS : k;
  Object.assign(r, { ok, pts, perfect });
  G.phase = "done"; G.score += pts; G.streak = perfect ? G.streak + 1 : 0;
  P.spots.forEach((sp, i) => {
    const el = r.spotEls[i], b = el.querySelector(".aux");
    // A "both" spot keeps the player's choice (it's right either way); the others show the right form.
    if (sp.both) el.classList.add("both"); else el.classList.add(ok[i] ? "ok" : "bad", sp.want ? "want" : "no");
    b.tabIndex = -1; b.setAttribute("aria-pressed", String(sp.both ? r.on[i] : sp.want));
    el.insertAdjacentHTML("beforeend", '<sup class="sn">' + (i + 1) + "</sup>" + (sp.cont && (!sp.both || r.on[i]) ? contMark() : ""));   // ✱: have been + -ing is more common (13-reveal.js)
    el.title = sp.both ? "⇄ " + ansWords(sp, r.on[i]) : (ok[i] ? "✓ " : "✗ ") + ansWords(sp);
  });
  card.querySelectorAll(".ln.err").forEach(el => el.classList.remove("err"));
  card.classList.add("done");
  showScore(); showCombo(); if (pts) flash(scoreEl, "up");
  if (allRight) { sndOk(G.streak > 1 ? Math.min(G.streak - 1, 6) * 2 : 0); burst(card); }
  const msg = perfect ? (G.streak >= 3 ? tx("streak", { n: G.streak }) : tx("perfect")) : tx(allRight ? "nice" : k ? "gotIt" : "done");
  toast("+" + pts + " · " + msg, allRight ? "" : "zero");
  const status = perfect ? 2 : allRight ? 1 : 0;
  markSeen(t.id, status); recordProgress(t.id, status); recordUses(P.spots.filter(sp => !sp.both).map(sp => sp.use), ok.filter((_, i) => !P.spots[i].both)); tickDay();
  G.results.push({ t, pts, max: n * PERFECT_PTS, perfect, allRight, k, n, ok, on: r.on.slice(), hinted: r.hinted });
  renderTools(); updateProgress();
  hintEl.innerHTML = tx("doneNote");
  setTimeout(() => { if (G.r === r) showReveal(); }, reduceMotion ? 0 : 450);
}

/* ---------- Hint & reset ---------- */
// Clues: light up the text's time words (one hint per text, from the game's pool).
function useHint() {
  const r = G.r; if (G.phase !== "play" || !G.hintsLeft || r.hinted) return;
  r.hinted = true; G.hintsLeft--; sndHint();
  // Before the first check every clue word lights up; after a check with mistakes, only the clues of the spots that
  // were wrong (from the a / an / the game), or all of them when those spots have none.
  const all = r.P.clues.map((c, k) => k), mine = r.wrong ? [...new Set(r.wrong.flatMap(i => r.P.spots[i].clues))] : all;
  (mine.length ? mine : all).forEach(c => { const el = card.querySelector('.clue[data-c="' + c + '"]'); if (el) el.classList.add("lit"); });
  hintEl.innerHTML = tx(r.wrong && mine.length ? "cluesWrong" : "cluesOn") + " " + (G.hintsLeft ? tx("hintsLeftGame", { n: G.hintsLeft }) : tx("hintLast"));
  renderTools(); flash($("hintleft"), "tick");
}
hintBtn.addEventListener("click", useHint);
resetBtn.addEventListener("click", resetAll);
checkBtn.addEventListener("click", check);

/* ---------- Taps and keys ---------- */
// In play a tap on have / has switches it; once the text is done a tap on a verb jumps to its explanation.
card.addEventListener("click", e => {
  const a = e.target.closest(".aux"), sp = e.target.closest(".spot");
  if (a && G.phase === "play") return toggleSpot(+sp.dataset.i);
  if (sp && G.phase === "done") jumpToEx(+sp.dataset.i);
});
// Keys: 1–9 switch the spots, Enter checks (or goes on once the explanations are open).
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || document.querySelector(".favmodal.show") || !$("tour").hidden) return;
  if (e.target.closest && e.target.closest("input, textarea, select")) return;
  if (G.phase === "play" && /^[1-9]$/.test(e.key) && G.r.spotEls[+e.key - 1]) { e.preventDefault(); toggleSpot(+e.key - 1); return; }
  if (e.key !== "Enter" || (e.target.closest && e.target.closest("button, a"))) return;
  if (G.phase === "play") { e.preventDefault(); check(); }
  else if (G.phase === "done" && !revealEl.hidden) { e.preventDefault(); nextRound(); }
});

/* 12-timeline.js — the timeline picture for each use (uses.json), as inline SVG. A line from the past to the future,
   a "now" mark, and one drawing per use: a dot at a finished time, a bar that reaches now, a bracket round your life
   up to now... The label is the spot's own time words (its "tl", else its first clue) or the use's generic "label".
   Colours follow the tense (uses.json "tenses" hue) through CSS: .tl uses --h. */
const TL_Y = 58, TL_NOW = 232;
function tlText(x, y, s, cls = "tl-lab", anchor = "middle") {
  return '<text class="' + cls + '" x="' + x + '" y="' + y + '" text-anchor="' + anchor + '">' + esc(s) + "</text>";
}
const tlDot = (x, cls = "tl-dot") => '<circle class="' + cls + '" cx="' + x + '" cy="' + TL_Y + '" r="5.5"/>';
// Each drawing gets the (already shortened) label.
const TL_DRAW = {
  // Somewhere in your life up to now: a bracket from the left edge to now, dots with question marks.
  "pp-exp": L => '<rect class="tl-zone open" x="20" y="40" width="' + (TL_NOW - 20) + '" height="36" rx="12"/>' +
    [70, 126, 182].map(x => tlDot(x) + tlText(x, 50, "?", "tl-q")).join("") + tlText(126, 30, L),
  // Started in the past, still true now: a bar from its start to now, then a dashed "and on".
  "pp-since": L => '<line class="tl-tick" x1="96" y1="46" x2="96" y2="70"/><line class="tl-bar" x1="96" y1="' + TL_Y + '" x2="' + TL_NOW + '" y2="' + TL_Y + '"/>' +
    '<line class="tl-bar more" x1="' + (TL_NOW + 8) + '" y1="' + TL_Y + '" x2="284" y2="' + TL_Y + '"/>' + tlText(164, 36, L),
  // A period that includes now: a box round now (its future part dashed), something inside it before now.
  "pp-period": L => '<rect class="tl-zone" x="148" y="40" width="' + (TL_NOW - 148) + '" height="36" rx="10"/>' +
    '<rect class="tl-zone open" x="' + TL_NOW + '" y="40" width="58" height="36" rx="10"/>' + tlDot(176) + tlDot(204) + tlText(220, 30, L),
  // Recent news: a dot just before now, an arrow to now, and the result glowing at now.
  "pp-news": L => tlDot(196) + '<path class="tl-arrow" d="M201 51 Q216 30 229 46"/><path class="tl-head" d="M231 49 l-8.5 -2 5 -6.5z"/>' +
    '<circle class="tl-res" cx="' + TL_NOW + '" cy="' + TL_Y + '" r="10"/>' + tlText(200, 26, L),
  // A finished time: a box well before now with the event in it.
  "ps-time": L => '<rect class="tl-zone" x="52" y="40" width="100" height="36" rx="10"/>' + tlDot(102) + tlText(102, 30, L),
  // A story: numbered events one after another in a finished time.
  "ps-story": L => '<rect class="tl-zone" x="30" y="40" width="164" height="36" rx="10"/>' +
    [64, 112, 160].map((x, k) => tlDot(x) + (k ? '<path class="tl-arrow" d="M' + (x - 38) + " " + TL_Y + " H" + (x - 10) + '"/>' : "") + tlText(x, 50, String(k + 1), "tl-q")).join("") + tlText(112, 30, L),
  // It lasted, then it ended: a bar with a start and an end, far from now.
  "ps-ended": L => '<line class="tl-tick" x1="52" y1="46" x2="52" y2="70"/><line class="tl-bar" x1="52" y1="' + TL_Y + '" x2="168" y2="' + TL_Y + '"/>' +
    '<line class="tl-tick" x1="168" y1="46" x2="168" y2="70"/>' + tlText(110, 36, L),
  // A time we already know from the context: one dot, circled.
  "ps-context": L => '<circle class="tl-ring" cx="118" cy="' + TL_Y + '" r="12"/>' + tlDot(118) + tlText(118, 30, L)
};
// SVG for use k with label label (cut to about 26 characters).
function timelineSVG(k, label) {
  const u = DATA.uses[k], T = DATA.tenses[u.tense], L = label.length > 26 ? label.slice(0, 25) + "…" : label;
  return '<svg class="tl" viewBox="0 0 320 100" style="--h:' + T.hue + '" role="img" aria-label="' + esc(T.name + ": " + u.name + " — " + label) + '">' +
    '<line class="tl-ax" x1="10" y1="' + TL_Y + '" x2="304" y2="' + TL_Y + '"/><path class="tl-axh" d="M312 ' + TL_Y + ' l-10 -5.5 v11z"/>' +
    '<line class="tl-now" x1="' + TL_NOW + '" y1="42" x2="' + TL_NOW + '" y2="76"/>' +
    tlText(12, 92, "past", "tl-axt", "start") + tlText(TL_NOW, 92, "now", "tl-nowt") +
    TL_DRAW[k](L) + "</svg>";
}
// A spot's timeline label: its "tl", else its first clue, else the use's label.
function tlLabel(sp) { return sp.tl || [].concat(sp.clue || [])[0] || DATA.uses[sp.use].label; }

/* 13-reveal.js — the card shown after each text: score, Translation and Listen buttons, then one collapsible explanation per spot
   (number, right / wrong, tense and use, the sentence with its time words marked, a timeline, why in English and
   Portuguese, how Portuguese says it, and the "watch out" note for Portuguese speakers when the answer was wrong).
   Hovering an explanation lights up its verb and clues in the text; tapping a verb in the text jumps to it.
   Also the little celebrations (score toast, particle burst). */
const ICON_SPK = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
function showReveal() {
  const r = G.r, t = r.t, P = r.P, n = P.spots.length, k = r.ok.filter(Boolean).length, last = isLastStep();
  // Top bar: the score on the left (no Portuguese title); the favorite star and Next in the top-right corner.
  revealEl.innerHTML =
    '<div class="rv-bar"><div class="rv-head"><b class="rv-score">' + tx("correctOf", { k, n }) + "</b>" +
    (r.perfect ? '<span class="chip" style="--h:150">' + tx("perfect") + "</span>" : "") +
    "</div>" +
    '<div class="rv-act">' + favBtn(t.id) + '<button type="button" class="cta pulse" id="next">' + tx(last ? "results" : "next") + " &rarr;</button></div></div>" +
    '<div class="rv-btns rv-top"><button type="button" class="pbtn" id="trbtn" aria-pressed="false">' + ptBadge() + " " + tx("translation") + "</button>" +
    '<button type="button" class="pbtn" id="listen">' + ICON_SPK + " " + tx("listen") + "</button></div>" +
    '<ol class="exl">' + P.spots.map((sp, i) => exHTML(r, sp, i)).join("") + "</ol>";
  revealEl.hidden = false;
  $("listen").addEventListener("click", () => speak(textParts(t, P, r.on), $("listen")));
  $("trbtn").addEventListener("click", toggleTranslation);
  $("next").addEventListener("click", nextRound);
  // A short pause first, so the card is seen popping in before the page moves (as in the a / an / the game).
  setTimeout(() => { if (G.r === r && !revealEl.hidden) scrollToReveal(); }, reduceMotion ? 0 : REVEAL_SCROLL_MS);
}
const REVEAL_SCROLL_MS = 800;
// Scroll down (never up) so as much of the result card shows as fits: its bottom in view with 32px of page under it, but its top never under the
// sticky dock. Layout offsets, not the bounding box: the card's entrance animation moves it while it plays.
function scrollToReveal() {
  let top = 0; for (let el = revealEl; el; el = el.offsetParent) top += el.offsetTop;
  const dock = document.querySelector(".dock"), topLimit = (dock ? dock.getBoundingClientRect().bottom : 0) + 12;
  const y = Math.min(top + revealEl.offsetHeight + 32 - innerHeight, top - topLimit);
  if (y > scrollY + 4) scrollTo({ top: y, behavior: reduceMotion ? "auto" : "smooth" });
}
// A spot whose present perfect is right but where most people would say have been + -ing (its "cont"): a ✱ in the
// summary and in the text, and this line in the explanation (the reason in the level's explanation language).
function contMark() { return '<span class="cstar" title="' + esc(tx("contTip")) + '" aria-label="' + esc(tx("contTip")) + '">✱</span>'; }
function contHTML(sp, l) {
  const c = sp.cont; if (!c) return "";
  // folded: only "✱ More common: <sentence>" shows; the reason opens on a tap
  return '<details class="ex-cont"><summary><b>✱ ' + tx("contHead") + '</b> <span class="ex-cont-s" lang="en">' + esc(c.en.replace(/[.!?]$/, "")) + "</span></summary>" +
    '<span class="ex-cont-why">' + inL(c.why, c.whyPt, l) + "</span></details>";
}
// One explanation.
function exHTML(r, sp, i) {
  if (sp.both) return exBothHTML(r, sp, i);
  const u = DATA.uses[sp.use], T = DATA.tenses[u.tense], ok = r.ok[i];
  const chose = phrase(sp, r.on[i]);
  // Collapsed by default: the summary is the head row and the sentence; the rest opens on a tap.
  return '<li class="ex ' + (ok ? "ok" : "bad") + '" data-i="' + i + '" style="--h:' + T.hue + '"><details><summary>' +
    '<div class="ex-head"><span class="sn">' + (i + 1) + '</span><span class="ex-mk" aria-label="' + (ok ? "right" : "wrong") + '">' + (ok ? "✓" : "✗") + "</span>" +
    '<span class="chip">' + esc(T.name) + '</span><button type="button" class="ex-use" data-use="' + esc(sp.use) + '" title="' + esc(u.name + " · " + u.namePt) + '">' + esc(useName(u)) + "</button>" + (sp.cont ? contMark() : "") +
    '<button type="button" class="ex-say" aria-label="' + esc(tx("listen")) + '">' + ICON_SPK + "</button></div>" +
    '<p class="ex-s">' + sentHTML(r.P, i, j => '<b class="ex-v">' + esc(ansWords(r.P.spots[j])) + "</b>", true, r.on) + "</p></summary>" +
    (ok ? "" : '<p class="ex-you">' + tx("youChose") + ": <s>" + esc(chose) + "</s>. " + tx("rightIs") + ' <b class="ex-right">' + esc(phrase(sp, sp.want)) + "</b></p>") +
    '<div class="ex-body">' + timelineSVG(sp.use, tlLabel(sp)) +
    '<div class="ex-why">' + whyP(sp.why, sp.whyPt, r.level) +
    '<p class="ex-pt">' + ptBadge() + ' <span lang="pt">' + esc(sp.pt) + "</span></p></div></div>" + contHTML(sp, r.level) +
    (ok ? "" : '<p class="rv-note"><b>' + tx("watchOut") + "</b> " + inL(u.trap, u.trapPt, r.level) + "</p>") + "</details></li>";
}
// A "both" spot: either choice is right, and the meaning changes. Two sides, each with its form, tense, timeline
// and what it means; the player's side is marked, and a line says what their version means.
function exBothHTML(r, sp, i) {
  const b = sp.both, mine = r.on[i] ? "pp" : "ps";
  const side = k => {
    const id = k === "pp" ? sp.use : b.alt, T = DATA.tenses[DATA.uses[id].tense];
    return '<div class="ex-side' + (k === mine ? " mine" : "") + '" style="--h:' + T.hue + '"><p class="ex-side-h"><span class="chip">' + esc(T.name) + "</span> <b>" + esc(phrase(sp, k === "pp")) + "</b>" +
      (k === mine ? '<small class="ex-mine">' + tx("bothMine") + "</small>" : "") + "</p>" + timelineSVG(id, (k === "pp" ? b.tlPp : b.tlPs) || DATA.uses[id].label) +
      '<p class="ex-means">→ ' + inL(b[k], b[k + "Pt"], r.level) + "</p></div>";
  };
  return '<li class="ex both" data-i="' + i + '" style="--h:175"><details><summary>' +
    '<div class="ex-head"><span class="sn">' + (i + 1) + '</span><span class="ex-mk" aria-label="both">⇄</span><span class="chip">' + tx("bothChip") + "</span>" + (sp.cont ? contMark() : "") +
    '<button type="button" class="ex-say" aria-label="' + esc(tx("listen")) + '">' + ICON_SPK + "</button></div>" +
    '<p class="ex-s">' + sentHTML(r.P, i, j => '<b class="ex-v">' + esc(ansWords(r.P.spots[j], r.on[j])) + "</b>", true, r.on) + "</p></summary>" +
    '<p class="ex-you">' + tx("bothYou", { x: esc(phrase(sp, r.on[i])), m: inL(b[mine], b[mine + "Pt"], r.level) }) + "</p>" +
    '<div class="ex-sides">' + side("pp") + side("ps") + "</div>" +
    '<div class="ex-why">' + whyP(sp.why, sp.whyPt, r.level) + contHTML(sp, r.level) + '<p class="ex-pt">' + ptBadge() + ' <span lang="pt">' + esc(sp.pt) + "</span></p></div></details></li>";
}
// The voice for line li of text t: its speaker's (castVoices, with the text's "voices" genders), else the default.
function lineVoice(t, P, li) {
  const who = [...new Set(P.lines.map(L => L.who).filter(Boolean))], w = P.lines[li].who;
  return w ? castVoices(who, t.voices)[w] : {};
}
// What the voice reads: every line with the right forms, each speaker in their own voice, the line lit up in the
// text card while it is read. Stage notes ("(some time later)") in a dialogue are not read.
function textParts(t, P, on) {
  const who = [...new Set(P.lines.map(L => L.who).filter(Boolean))], cast = castVoices(who, t.voices);
  return P.lines.map((L, li) => Object.assign({ text: linePlain(P, li, 0, Infinity, on), el: card.querySelector('.ln[data-l="' + li + '"]'), note: who.length && !L.who }, L.who ? cast[L.who] : {}))
    .filter(x => !x.note);
}
// Portuguese under every line of the text card.
function toggleTranslation() {
  const r = G.r, b = $("trbtn"), on = !card.classList.contains("tr-on");
  if (!card.querySelector(".lt")) card.querySelectorAll(".ln").forEach(el => {
    const s = (r.t.pt || [])[+el.dataset.l]; if (s) el.insertAdjacentHTML("beforeend", '<p class="lt" lang="pt">' + esc(s) + "</p>");
  });
  card.classList.toggle("tr-on", on); b.setAttribute("aria-pressed", String(on));
  if (on) sndHint(); else sndBack();
  if (on) card.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" });
}
// Light up spot i and its clues in the text (-1: none).
let hotI = -1;
function setHot(i) {
  hotI = i;
  card.querySelectorAll(".hot").forEach(el => el.classList.remove("hot"));
  if (i < 0 || !G.r) return;
  const sp = G.r.P.spots[i];
  if (G.r.spotEls[i]) G.r.spotEls[i].classList.add("hot");
  sp.clues.forEach(c => { const el = card.querySelector('.clue[data-c="' + c + '"]'); if (el) el.classList.add("hot"); });
}
function jumpToEx(i) {
  const li = revealEl.querySelector('.ex[data-i="' + i + '"]'); if (!li || revealEl.hidden) return;
  li.querySelector("details").open = true;
  li.scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" });
  glow(li); setHot(i);
}
// Only a real mouse move lights a verb: cards that appear under a still pointer after Check, or slide under it while the
// page scrolls to the result, used to light their verbs for no reason (the browser's hover events after a scroll come
// at the pointer's last position, so they are skipped). From the conjunctions game.
let lastXY = "";
revealEl.addEventListener("pointermove", e => {
  const xy = e.clientX + "," + e.clientY; if (e.pointerType !== "mouse" || xy === lastXY) return;
  const li = e.target.closest(".ex[data-i]"), i = li ? +li.dataset.i : -1; if (i !== hotI) setHot(i);
});
document.addEventListener("pointermove", e => { lastXY = e.clientX + "," + e.clientY; });
revealEl.addEventListener("pointerleave", () => setHot(-1));
revealEl.addEventListener("click", e => {
  const li = e.target.closest(".ex"); if (!li) return;
  const i = +li.dataset.i, sp = G.r.P.spots[i];
  // The buttons in the summary must not also open / close the card.
  if (e.target.closest(".ex-use")) { e.preventDefault(); return openGuide(sp.use, e.target.closest(".ex-use")); }
  if (e.target.closest(".ex-say")) e.preventDefault();

  setHot(i);
  // On a phone the text is above: a tap inside an open card shows the verb and its clues there for a moment.
  if (!canHover && !e.target.closest("summary")) { G.r.spotEls[i].scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" }); flash(G.r.spotEls[i], "ping"); }

/* ---------- Little celebrations ---------- */
function toast(text, cls) {
  const t = document.createElement("div"); t.className = "toast " + (cls || ""); t.textContent = text;
  stage.appendChild(t); setTimeout(() => t.remove(), 1700);
}
// n particles (random hues, or all of hue); cls "top" = gold sparks from a star, above the windows and from its own
// centre (from the conjunctions game).
function burst(el, n = 18, hue, cls) {
  if (reduceMotion || !el) return;
  const b = el.getBoundingClientRect(), cx = b.left + b.width / 2, cy = cls ? b.top + b.height / 2 : Math.min(b.top + b.height / 2, innerHeight / 2);
  for (let i = 0; i < n; i++) {
    const p = document.createElement("span"), a = Math.PI * 2 * i / n + rnd(-.2, .2), d = cls ? rnd(60, 140) : rnd(80, 170), sz = rnd(8, 18);
    p.className = "pf" + (cls ? " " + cls : ""); p.style.left = cx + "px"; p.style.top = cy + "px"; p.style.width = p.style.height = sz + "px";
    p.style.setProperty("--h", hue != null ? hue : Math.round(rnd(0, 360)));
    p.style.setProperty("--dx", Math.cos(a) * d + "px"); p.style.setProperty("--dy", Math.sin(a) * d * .7 + "px");
    document.body.appendChild(p); setTimeout(() => p.remove(), 900);
  }
}

/* 15-progress.js — what the player has done, across games, and the daily streak.
   pp-prog = {textId or Build sentence id: [attempts, lastStatus, time]}: status 2 = perfect on the first check ("mastered"), 1 = all right
   on a later check, 0 = some answers still wrong.
   pp-uses = {useId: [answers, right]}: accuracy for each use (uses.json), from games and quick-fire.
   pp-days = "YYYY-MM-DD|days in a row". */
function getJSON(k) { try { const o = JSON.parse(load(k)); return o && typeof o === "object" ? o : {}; } catch (e) { return {}; } }
function getProg() { return getJSON("pp-prog"); }
function recordProgress(id, status) {
  const p = getProg(), o = p[id] || [0, 0, 0];
  p[id] = [o[0] + 1, status, Date.now()]; store("pp-prog", JSON.stringify(p));
}
// A level's texts in play order: never seen (random), then wrong last time, then not yet perfect, then mastered (oldest first).
function orderPool(list) {
  const p = getProg(), grp = t => { const o = p[t.id]; return !o ? 0 : o[1] === 0 ? 1 : o[1] === 1 ? 2 : 3; };
  const time = t => (p[t.id] || [0, 0, 0])[2];
  return shuffle(list.slice()).sort((a, b) => grp(a) - grp(b) || time(a) - time(b));
}
// Mastered / total texts at a level; with sents, its Build sentences (mastered = right on the first try last time).
function mastery(level, sents) {
  const p = getProg(), list = (sents ? DATA.build : DATA.texts)[level] || [];
  return { m: list.filter(t => p[t.id] && p[t.id][1] === 2).length, n: list.length };
}
// Build sentences were recorded only in Seen before 2026-11-24: carry those results over once, so the meters start from them
(() => {
  const p = getProg(); let n = 0;
  try { (JSON.parse(load("pp-seen")) || []).forEach(x => { if (x && SENTS[x.id] && !p[x.id]) { p[x.id] = [1, x.st || 0, 0]; n++; } }); } catch (e) {}
  if (n) store("pp-prog", JSON.stringify(p));
})();
// One level's meter: label, bar, "3 / 5" (sents: its Build sentences).
function meterHTML(level, sents) {
  const x = mastery(level, sents === true);
  if (!x.n) return "";
  return '<div class="meter" style="' + lvVars(level) + '"><b>' + esc(lvName(level)) + '</b><div class="pbar"><i style="width:' + (x.m / x.n * 100).toFixed(1) + '%"></i></div><span>' + x.m + " / " + x.n + "</span></div>";
}

/* ---------- Accuracy per use ---------- */
function recordUses(uses, ok) {

  uses.forEach((u, i) => { const o = s[u] || [0, 0]; s[u] = [o[0] + 1, o[1] + (ok[i] ? 1 : 0)]; });

// Chips "Finished time 7/8", one per use in stats {use: [n, right]}, weakest first; tense colours; weak = only the
// WEAK_MAX weakest under WEAK_PCT (Seen: "Uses to practice", from the a / an / the game). Tap one to open the Guide there.
const WEAK_MAX = 3, WEAK_PCT = .8;

/* ---------- Daily streak ---------- */
function dayStr(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dayState() {
  const [d, n] = (load("pp-days") || "|0").split("|"), y = new Date(); y.setDate(y.getDate() - 1);
  return { d, n: +n || 0, today: dayStr(new Date()), yest: dayStr(y) };
}
// Days in a row, counting today or yesterday (the streak is still alive until a day is skipped).
function getDays() { const s = dayState(); return s.d === s.today || s.d === s.yest ? s.n : 0; }
// Called when a text is finished: the first one of the day extends (or restarts) the streak.
function tickDay() {

/* 16-gloss.js — words with a dotted line in the text show their Portuguese meaning on hover or tap. Meanings come from
   the text's own "w" (src/data/texts/*.json); keys can be several words ("tour guide") and match in any case.
   Verbs are glossed with their base meaning ("morar"), so the tense is never given away. */
const glossEl = document.createElement("div");
glossEl.className = "glosstip"; glossEl.setAttribute("role", "tooltip"); glossEl.hidden = true;
document.body.appendChild(glossEl);
let glossFor = null, glossTimer = 0, lastPointer = "mouse";

// One regex per text for its glossary keys, longest first.
function glossRe(t) {
  if (t._gre !== undefined) return t._gre;
  const ks = Object.keys(t.w || {}).sort((a, b) => b.length - a.length).map(k => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  return (t._gre = ks.length ? new RegExp("\\b(" + ks.join("|") + ")\\b", "gi") : null);
}
// Text s as HTML, its glossary words wrapped in .gw.
function glossWrap(s, t) {
  const re = glossRe(t); if (!re) return esc(s);
  let out = "", last = 0, m;
  re.lastIndex = 0;
  while ((m = re.exec(s))) { out += esc(s.slice(last, m.index)) + '<span class="gw" data-g="' + esc(m[1].toLowerCase()) + '">' + esc(m[1]) + "</span>"; last = re.lastIndex; }
  return out + esc(s.slice(last));
}
function glossOf(k) { return G.r && (G.r.t.w || {})[Object.keys(G.r.t.w || {}).find(x => x.toLowerCase() === k)] || ""; }
// The glossed word under an event, or null. Once a text is done a tap on a verb jumps to its explanation instead.
function glossTarget(e) {
  const g = e.target.closest ? e.target.closest(".gw") : null;
  if (!g || (G.phase === "done" && g.closest(".spot") && e.type === "click")) return null;
  return g;
}
// Show the meaning just above the word (below it near the top of the screen); linger = hide by itself after a moment.
// A phrase that wraps onto two lines has one box per line: use the line the pointer is on (x, y), else the first one

function showGloss(el, linger, x, y) {
  const g = glossOf(el.dataset.g); clearTimeout(glossTimer);
  if (!g) return hideGloss();
  if (glossFor && glossFor !== el) glossFor.classList.remove("on");
  glossEl.innerHTML = ptBadge() + '<span lang="pt">' + esc(g) + "</span>";
  glossEl.hidden = false; glossFor = el; el.classList.add("on");
  glossEl.style.left = glossEl.style.top = "0px";   // measure at the left edge: at its old place it could be squeezed narrower
  const rs = [...el.getClientRects()], hit = x != null && rs.find(r => x >= r.left - 2 && x <= r.right + 2 && y >= r.top - 2 && y <= r.bottom + 2);
  const b = hit || rs[0] || el.getBoundingClientRect(), t = glossEl.getBoundingClientRect(), below = b.top - t.height - 10 < 8;
  glossEl.style.left = Math.min(Math.max(b.left + b.width / 2 - t.width / 2, 8), innerWidth - t.width - 8) + "px";
  glossEl.style.top = (below ? b.bottom + 10 : b.top - t.height - 10) + "px";
  if (linger) glossTimer = setTimeout(hideGloss, 2600);
}
function hideGloss() { clearTimeout(glossTimer); glossEl.hidden = true; if (glossFor) glossFor.classList.remove("on"); glossFor = null; }

// Mouse: hovering shows the meaning. Tap or click: the meaning (for a moment on touch).
card.addEventListener("pointerover", e => { const g = glossTarget(e); if (g && e.pointerType === "mouse") showGloss(g, false, e.clientX, e.clientY); });
card.addEventListener("pointerout", e => { const g = glossTarget(e); if (g && g === glossFor && e.pointerType === "mouse" && !g.contains(e.relatedTarget)) hideGloss(); });
card.addEventListener("click", e => { const g = glossTarget(e); if (g) showGloss(g, lastPointer !== "mouse", e.clientX, e.clientY); });
document.addEventListener("pointerdown", e => { lastPointer = e.pointerType; if (!glossTarget(e)) hideGloss(); }, true);
addEventListener("scroll", hideGloss, true); addEventListener("resize", hideGloss);

/* 20-end.js — end-of-game modal: score, stars (text points only), hint bonus, quick-question point, level progress,
   day streak, every text with its result, and "Copy results" (plain text to send the teacher, with accuracy for each
   use in this game). Adapts to the mode: quick-fire (no stars, own best) and practice games (no best score). */
const endModal = $("endmodal");
function stars(n) { return [0, 1, 2].map(i => '<span class="' + (i < n ? "" : "off") + '">&#9733;</span>').join(""); }
function showEnd() {

  const br = (G.build && G.build.res) || [];   // the Build round's sentences (23-build.js): 2 points each
  const pts = G.results.reduce((s, x) => s + x.pts, 0) + br.reduce((s, x) => s + x.pts, 0), max = G.results.reduce((s, x) => s + x.max, 0) + br.length * 2;
  const pct = max ? pts / max : 0, n = pct >= .85 ? 3 : pct >= .6 ? 2 : pct >= .35 ? 1 : 0;
  // Unused hints become bonus points (not in quick-fire, where time is the pressure).
  const bonus = speed ? 0 : G.hintsLeft;

  const prev = key ? parseInt(load(key), 10) || 0 : 0, record = !!key && sc > prev;

  $("endsub").textContent = !key ? tx("noSave") :
    (record ? tx(speed ? "speedRecord" : "newBest", { lvl: lvName(G.level) }) : tx("levelBest", { lvl: lvName(G.level), n: Math.max(prev, sc) }));
  const extras = [];
  if (!speed) extras.push(tx("hintsUsed", { n: pool - G.hintsLeft, m: pool }) + (bonus ? tx("bonus", { n: bonus }) : ""));
  if (G.quiz) extras.push(tx("quickQ", { r: G.quiz.ok ? "+1" : tx("missed") }));
  if (br.length) extras.push(tx("buildEnd", { k: br.filter(x => x.ok).length, n: br.length }));
  $("endhints").textContent = extras.join(" · ");

    (sm ? sm + '<span class="psub">' + tx("sentMastered", { lvl: esc(lvName(G.level)) }) + (days >= 2 ? tx("daysRow", { n: days }) : "") + "</span>" : "");
  $("endlist").innerHTML = speed ? G.results.map(speedItemHTML).join("") : G.results.map(x =>
    '<li class="' + (x.allRight ? "" : "miss") + '"><span class="ri">' + (x.perfect ? "&#9733;" : x.allRight ? "&#10003;" : "&#10007;") + "</span>" +
    '<div class="rs"><div><b>' + esc(x.t.title) + "</b> · " + x.k + "/" + x.n + '</div><div class="rt" lang="pt">' + esc(x.t.titlePt || "") + "</div></div>" +
    '<span class="rp">+' + x.pts + "</span>" + favBtn(x.t.id) + "</li>").join("") +
    (br.length ? '<li class="endsep">' + tx("buildRound") + "</li>" + br.map(x =>
      '<li class="' + (x.ok ? "" : "miss") + '"><span class="ri">' + (x.ok ? "&#10003;" : x.solved ? "&#189;" : "&#10007;") + "</span>" +
      '<div class="rs"><div><b>' + esc(bLine(x.s)) + '</b></div><div class="rt" lang="pt">' + esc(x.s.pt) + '</div></div><span class="rp">+' + x.pts + "</span>" + favBtn(x.s.id) + "</li>").join("") : "");
  // Offer the next level after a good normal game.
  const lv = Object.keys(DATA.levels), up = lv[lv.indexOf(G.level) + 1], upBtn = $("endup");

// {use: [answers, right]} for this game.
function gameUses() {
  const s = {}, add = (u, ok) => { const o = s[u] || [0, 0]; s[u] = [o[0] + 1, o[1] + (ok ? 1 : 0)]; };
  // "Both" spots are right either way, so they don't count for accuracy.
  G.results.forEach(x => { if (x.sp) add(x.sp.use, x.ok); else parsed(x.t).spots.forEach((sp, i) => { if (!sp.both) add(sp.use, x.ok[i]); }); });
  ((G.build && G.build.res) || []).forEach(x => add(x.s.use, x.ok));
  return s;
}
// Plain-text summary for the teacher (WhatsApp, Classroom...). Wrong answers show the right sentence.
function resultsText() {
  const d = new Date().toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }), u = gameUses();
  const lines = ["Perfect or Past? · " + lvName(G.level) + " · " + MODE_NAME[G.mode] + " · " + d,
    "Score: " + $("endscore").textContent + ($("endhints").textContent ? " (" + $("endhints").textContent + ")" : ""),
    "By use: " + Object.keys(u).map(k => DATA.uses[k].name + " " + u[k][1] + "/" + u[k][0]).join(", ")];
  if (G.mode === "speed") G.results.forEach(x => lines.push((x.ok ? "✓ " : "✗ ") + linePlain(x.P, x.sp.line, x.sp.sent[0], x.sp.sent[1])));
  else G.results.forEach(x => {
    lines.push((x.perfect ? "★ " : x.allRight ? "✓ " : "✗ ") + x.t.title + " (" + x.k + "/" + x.n + ")");
    const P = parsed(x.t);
    P.spots.forEach((sp, i) => { if (!x.ok[i]) lines.push("   ✗ " + linePlain(P, sp.line, sp.sent[0], sp.sent[1], x.on) + " [" + DATA.uses[sp.use].name + "]"); });
  });
  const br = (G.build && G.build.res) || [];
  if (br.length) {
    lines.push("Build: " + br.filter(x => x.ok).length + "/" + br.length + " right on the first try");
    br.forEach(x => lines.push((x.ok ? "   ✓ " : x.solved ? "   ½ " : "   ✗ ") + bLine(x.s) + (x.ok ? "" : " [" + DATA.uses[x.s.use].name + "]")));

/* 22-modes.js — ways to play beyond a normal game:
   - the Play menu on the "new game" tile: Normal game, Quick-fire, Review missed, Favorites;
   - quick-fire: single sentences from the level's texts, "has visited" or "visited?", as many as possible in SPEED_SECS
     (only sentences whose time words are in the sentence itself; best kept per level);
   - practice games from the Missed / Favorites lists (no best score);
   - one quick "Which timeline?" question in a normal game, at its "quiz" step (levels.json "sequence"; +1 point). It asks about a verb
     from this game, a missed one if there is any, and offers its timeline and its "contrast" use's (uses.json). */

const MODE_NAME = { normal: "Game", speed: "Quick-fire", review: "Review missed", fav: "Favorites" };
const playBtn = $("restart"), playMenu = $("playmenu");

/* ---------- Play menu ---------- */

  $("pm-speed").textContent = lvName(G.level) + " · " + tx("nSeconds", { n: SPEED_SECS });
  // "2 textos + 1 frase": a list can hold texts and Build sentences
  const mix = ids => { const s = ids.filter(id => SENTS[id]).length, t = ids.length - s; return [t ? nt(t) : "", s ? tx(s === 1 ? "oneSent" : "nSents", { n: s }) : ""].filter(Boolean).join(" + "); };

/* ---------- Quick-fire ---------- */
let speedT = 0, speedEnd = 0, speedBeat = 0;
// Every spot of the level whose clues are in its own sentence: { t, P, sp, i }.

  // ("Both" spots have no single answer, so they stay out.)
  DATA.texts[level].forEach(t => { const P = parsed(t); P.spots.forEach((sp, i) => { if (selfContained(P, sp) && !sp.both) out.push({ t, P, sp, i }); }); });
  return shuffle(out);
}
function startSpeed() { speedEnd = Date.now() + SPEED_SECS * 1000; speedBeat = Math.ceil(SPEED_SECS / 30); clearInterval(speedT); speedT = setInterval(speedTick, 250); speedRender(); }

// Before the clock: a card with the goal, then 3, 2, 1, Go! (a tick each). "Go" starts the first sentence and the clock.

let cdT = 0;

    n.textContent = steps[i++]; n.classList.remove("pop"); void n.offsetWidth; n.classList.add("pop");
    if (go) tone(1046.5, 0, .3, .09, 0, true); else tone(659.25, 0, .12, .07, 0, true);
    cdT = setTimeout(tick, go ? 550 : 800);
  };

}
function stopIntro() { clearTimeout(cdT); cdEl.hidden = true; }
function speedLeft() { return speedT ? Math.max(0, speedEnd - Date.now()) : SPEED_SECS * 1000; }
// The progress label becomes a big clock with "7 ✓" under it; the bar drains. Every 30 seconds the clock beats
// (with a chime), and the last 10 seconds pulse red.
function speedRender() {
  const left = speedLeft(), s = Math.ceil(left / 1000), lbl = $("proglbl"), prog = lbl.closest(".prog");
  if (!$("clk")) lbl.innerHTML = '<b id="clk"></b><small id="clkdone"></small>';
  prog.classList.add("clock"); prog.classList.toggle("urgent", s <= 10);
  $("clk").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  $("clkdone").textContent = G.score + " ✓ · " + (G.results.length - G.score) + " ✗";
  $("pfill").style.width = (left / (SPEED_SECS * 1000) * 100) + "%";
  const beat = Math.ceil(s / 30);
  if (speedT && beat < speedBeat && s > 0) { speedBeat = beat; flash($("clk"), "beat"); tone(784, 0, .14, .08, 0, true); tone(1046.5, .1, .22, .07, 0, true); }
}

/* 23-build.js — the Build round: the "build" steps of a normal game (levels.json "sequence"), one sentence each, to put
   together from their Portuguese (idea and look from Be Do Modal's Build round). The English sentence shows its fixed
   words; the [gaps] of src/data/build/<level>.json are dashed slots (at most levels.json "blanks": A2 3, B1 4, B2+ 5),
   and a cloud holds the gap words plus the sentence's traps (wrong forms: did / went, live / ago…). Tap or drag words
   into the slots; the check runs once every slot is full. This is where negatives, questions and irregular verbs come in.
   2 tries per sentence: right on the first = 2 points, on the second = 1. A wrong try locks the right words green and
   sends the others back. Then the sentence's explanation (tense, use → Guide, timeline, why in EN + PT).

const BUILD_TRIES = 2;

// Words seen in lower case anywhere in the game: a sentence's first word shows in lower case in the cloud when it is

const LOWER = new Set((JSON.stringify(DATA.texts) + JSON.stringify(DATA.build)).match(/\b[a-z][a-z'-]*/g) || []);
// How many Build sentences a normal game at this level has: its "build" steps (as many as there are sentences).
const buildCount = l => Math.min(((DATA.levels[l] || {}).sequence || []).filter(k => k === "build").length, (DATA.build[l] || []).length);

// A sentence's parts: words (as written), which are gaps, the final mark.
function bParse(s) {
  const m = s.en.match(/^(.*?)([.?!])$/), ws = m[1].split(/\s+/);
  return { words: ws.map(w => w.replace(/^\[|\]$/g, "")), gap: ws.map(w => /^\[.*\]$/.test(w)), p: m[2] };
}
const bIsQ = s => /\?$/.test(s.en), bIsNeg = s => /n't\b|\bnot\b|\bnever\b|\bnobody\b/i.test(s.en);

function bPick(level) {

  const fresh = all.filter(s => built.indexOf(s.en) < 0), pool = fresh.length >= n ? fresh : all;
  const score = l => +l.some(bIsQ) + +l.some(bIsNeg) + +l.some(s => DATA.uses[s.use].tense === "pp") + +l.some(s => DATA.uses[s.use].tense === "ps");
  let best = null, bs = -1;
  for (let k = 0; k < 40 && bs < 4; k++) { const l = shuffle(pool.slice()).slice(0, n), sc = score(l); if (sc > bs) { best = l; bs = sc; } }
  // questions and negatives first: that's where the word order changes
  return best.sort((a, b) => (bIsQ(b) || bIsNeg(b)) - (bIsQ(a) || bIsNeg(a)));
}
// A normal game draws its sentences at the start (so they make a good mix); each "build" step shows the next one.
function newBuild() { return G.mode === "normal" && buildCount(G.level) ? { list: bPick(G.level), k: -1, res: [], cur: null } : null; }
function startBuild() {
  G.build.k++; G.phase = "build";
  stopSpeech(); hideGloss();
  stage.hidden = toolsEl.hidden = revealEl.hidden = quizEl.hidden = true; buildEl.hidden = false;
  bShow();
}
function hideBuild() { buildEl.hidden = true; }
// The cloud's form of a word: the first word in lower case when it isn't a name (or I).
function bCloudForm(w, i) { return i === 0 && !/^I($|')/.test(w) && LOWER.has(w.toLowerCase()) ? w.toLowerCase() : w; }
// A word bubble: a soap bubble (24-shine.js) in its own colour, with its own gentle bob and film angle.
function bWordHTML(w) {
  return '<button type="button" class="b bw" data-w="' + esc(w) + '" style="--h:' + Math.round(rnd(0, 360)) +
    ";--bx:" + rnd(-6, 6).toFixed(1) + "px;--by:" + rnd(-8, 8).toFixed(1) + "px;--dur:" + rnd(2.6, 4.6).toFixed(2) + "s;--dl:" + rnd(-4, 0).toFixed(2) + "s;--ang:" + Math.round(rnd(0, 360)) + 'deg">' + soapHTML(esc(w)) + "</button>";
}
function bShow() {
  const B = G.build, s = B.list[B.k], P = bParse(s);
  B.cur = { s, P, tries: 0, done: false };
  $("bptag").textContent = tx("buildPrompt");
  $("btag").textContent = tx("buildYours") + " · " + (B.k + 1) + " / " + B.list.length;
  $("bpt").textContent = s.pt;
  // The final mark sticks to a fixed last word ("night?"); after a slot it stands on its own, the size of the words.
  const end = P.words.length - 1;
  bSlots.innerHTML = P.words.map((w, i) => P.gap[i] ? '<span class="bslot" data-i="' + i + '"></span>' : '<span class="bfix">' + esc(w) + (i === end ? P.p : "") + "</span>").join("") +
    (P.gap[end] ? '<span class="bfix bpunct">' + P.p + "</span>" : "");
  const cloud = P.words.map((w, i) => P.gap[i] ? bCloudForm(w, i) : null).filter(Boolean).concat(s.traps);
  bCloud.innerHTML = shuffle(cloud).map(w => '<span class="bhome">' + bWordHTML(w) + "</span>").join("");
  bCloud.querySelectorAll(".bw").forEach(x => { x._home = x.parentNode; });
  bLabel();
  bQbox.className = "bqbox"; bFb.className = "bfb"; bFb.innerHTML = ""; bX.hidden = true; bX.innerHTML = ""; bNext.hidden = true;
  hintEl.innerHTML = tx(canHover ? "buildIntro" : "buildIntroTouch", { n: P.gap.filter(Boolean).length });
  updateProgress();
  if (!reduceMotion && buildEl.animate) buildEl.animate([{ opacity: 0, transform: "translateX(22px)" }, { opacity: 1, transform: "none" }], { duration: 300, easing: "ease-out" });
}
// The first slot shows its word with a capital; the cloud shows words as they are.
function bLabel() {
  buildEl.querySelectorAll(".bw").forEach(x => {
    const first = x.parentNode.classList.contains("bslot") && x.parentNode.dataset.i === "0";
    x.querySelector(".bwl").textContent = first ? cap(x.dataset.w) : x.dataset.w;   // the label only: the soap spans stay
  });
}
function bHome(x) {
  const sl = x.parentNode; if (!sl.classList.contains("bslot")) return;
  sl.classList.remove("filled"); x._home.appendChild(x); x._home.classList.remove("away"); x._home.style.width = x._home.style.height = "";
}
const bFree = () => [...bSlots.querySelectorAll(".bslot")].filter(sl => !sl.querySelector(".bw"));
function bPlace(x, slot) {
  const c = G.build && G.build.cur; if (!c || c.done || x.classList.contains("lock") || slot.querySelector(".lock")) return;
  const occ = slot.querySelector(".bw"); if (occ === x) return;
  if (occ) bHome(occ);
  if (x.parentNode.classList.contains("bhome")) { const h = x.parentNode; h.style.width = x.offsetWidth + "px"; h.style.height = x.offsetHeight + "px"; h.classList.add("away"); }
  else x.parentNode.classList.remove("filled");
  slot.appendChild(x); slot.classList.add("filled");
  bLabel(); sndPlace();
  if (!bFree().length) setTimeout(() => { if (G.build && G.build.cur === c) bCheck(); }, 260);
}
// A word that moves on a tap (or goes back after a wrong try) glides from where it was to its new place (FLIP).
function bFly(x, move, ms) {
  const a = x.getBoundingClientRect(); move();
  if (reduceMotion || !x.animate) return;
  const b = x.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
  if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
  x.animate([{ transform: "translate(" + dx + "px," + dy + "px)" }, { transform: "none" }], { duration: ms || 320, easing: "cubic-bezier(.3,1.2,.5,1)" });
}
function bTap(x) {
  const c = G.build && G.build.cur; if (!c || c.done || x.classList.contains("lock")) return;
  if (x.parentNode.classList.contains("bslot")) { bFly(x, () => { bHome(x); bLabel(); }); sndBack(); return; }
  const free = bFree()[0]; if (free) bFly(x, () => bPlace(x, free));
}
const bGot = () => [...bSlots.querySelectorAll(".bslot")].map(sl => { const x = sl.querySelector(".bw"); return x ? x.dataset.w : null; });
function bCheck() {
  const c = G.build.cur, got = bGot(); if (c.done || got.indexOf(null) >= 0) return;
  const want = c.P.words.filter((w, i) => c.P.gap[i]), ok = got.every((w, i) => w.toLowerCase() === want[i].toLowerCase());
  c.tries++;
  if (ok) return bEnd(true);
  if (c.tries >= BUILD_TRIES) return bEnd(false);
  // A wrong try: the words in the right place lock green, the others shake and go back.
  sndBad(); flash(bQbox, "shake");
  const trap = got.find(w => c.s.traps.indexOf(w) >= 0);
  bFb.className = "bfb bad"; bFb.innerHTML = trap ? tx("buildTrap", { w: esc(trap) }) : tx("buildGreen");
  bSlots.querySelectorAll(".bslot").forEach((sl, i) => {
    const x = sl.querySelector(".bw");
    if (x.dataset.w.toLowerCase() === want[i].toLowerCase()) x.classList.add("ok", "lock");
    else { x.classList.add("bad"); setTimeout(() => { x.classList.remove("bad"); if (G.build && G.build.cur === c && !c.done) bFly(x, () => { bHome(x); bLabel(); }); }, 650); }
  });
}
function bEnd(solved) {
  const B = G.build, c = B.cur, s = c.s, first = solved && c.tries === 1, pts = solved ? (first ? 2 : 1) : 0;
  c.done = true;
  B.res.push({ s, ok: first, solved, pts });
  G.score += pts; showScore(); if (pts) flash(scoreEl, "up");
  recordUses([s.use], [first]); tickDay();
  markSeen(s.id, first ? 2 : solved ? 1 : 0);   // Seen → Recent; not right on the first try → Missed (21-lists.js)
  recordProgress(s.id, first ? 2 : solved ? 1 : 0);   // for the "sentences mastered" meters (15-progress.js)
  if (solved) {
    bSlots.querySelectorAll(".bw").forEach(x => { x.classList.remove("bad"); x.classList.add("ok", "lock"); });
    bQbox.classList.add("solved"); sndOk(); burst(bQbox);
    bFb.className = "bfb ok"; bFb.innerHTML = "";
    toast("+" + pts + " · " + tx(first ? "perfect" : "nice"));
  } else {

    bSlots.querySelectorAll(".bw").forEach(x => { bHome(x); x.classList.remove("ok", "lock", "bad"); });
    const slots = [...bSlots.querySelectorAll(".bslot")];
    c.P.words.filter((w, i) => c.P.gap[i]).forEach((w, k) => {
      const x = [...bCloud.querySelectorAll(".bw")].find(y => y.dataset.w.toLowerCase() === w.toLowerCase()); if (!x) return;
      const h = x.parentNode; h.style.width = x.offsetWidth + "px"; h.style.height = x.offsetHeight + "px"; h.classList.add("away");
      slots[k].appendChild(x); slots[k].classList.add("filled"); x.classList.add("shown", "lock");

  }

  bX.innerHTML = bExHTML(s); bX.style.setProperty("--h", DATA.tenses[DATA.uses[s.use].tense].hue); bX.hidden = false;
  bNext.innerHTML = tx(isLastStep() ? "results" : "next") + " &rarr;"; bNext.hidden = false;
  built = [s.en].concat(built.filter(e => e !== s.en)).slice(0, 40); store("pp-built", JSON.stringify(built));
  hintEl.innerHTML = "";
  updateProgress();
  const line = bLine(s); setTimeout(() => { if (G.build && G.build.cur === c) speak(line); }, 400);
  setTimeout(() => { if (G.build && G.build.cur === c) { bNext.focus({ preventScroll: true }); bX.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" }); } }, reduceMotion ? 0 : 500);
}
const bLine = s => s.en.replace(/[[\]]/g, "");

// Tap or drag the words.
let bDrag = null;

    ding(659.25); setTimeout(function () { ding(987.77); }, 90);
  }
  function copy() {
    var code = PIX.codes[pick].code, ta = el.querySelector(".ebd-code");
    function fallback() {
      ta.value = code; ta.hidden = false; ta.focus(); ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      if (ok) { ta.hidden = true; copied(); }       // else the code stays shown, selected, to copy by hand
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(code).then(copied, fallback);
    else fallback();
  }
  function open(how) {
    if (!el) build();
    if (!el.hidden) return;
    mode = how || "manual";
    stat("Support opened", { from: mode === "ask" ? "menu pop-up" : GAME === "menu" ? "menu link" : "game line", game: GAME });
    back = document.activeElement;
    el.dataset.lang = A.lang();
    el.classList.remove("qr-on");
    el.querySelector(".ebd-later").hidden = mode !== "ask";
    choose(0);
    el.hidden = false;
    document.documentElement.classList.add("ebd-open");
    try { el.querySelector(".ebd-copy").focus({ preventScroll: true }); } catch (e) {}
    if (mode !== "ask") ding(659.25);
  }
  function close(never) {
    if (!el || el.hidden) return;
    if (mode === "ask" && !never) { var s = state(); s.next = rounds() + ASK_AGAIN; save(s); }
    el.hidden = true;
    document.documentElement.classList.remove("ebd-open");
    try { if (back && back.focus) back.focus({ preventScroll: true }); } catch (e) {}
  }
  // While the panel is open the keyboard belongs to it (games use Escape, arrows and letters)
  window.addEventListener("keydown", function (e) {
    if (!el || el.hidden) return;
    e.stopImmediatePropagation();
    if (e.key === "Escape") { e.preventDefault(); close(); return; }
    if (e.key === "Tab") {
      var f = [].filter.call(el.querySelectorAll("button, textarea"), function (b) { return !b.hidden && b.offsetParent !== null; });
      var at = f.indexOf(document.activeElement);
      e.preventDefault(); f[(at + (e.shiftKey ? f.length - 1 : 1) + f.length) % f.length].focus();
    }
  }, true);
  window.ebDonate = open;

  // ------------------------------------------------------------ the menu: the pop-up and the footer link
  if (inMenu) {
    var link = document.getElementById("donlink");
    var showLink = function () { if (link) link.hidden = false; };   // always shown (2026-11-26, the user)
    if (link) link.addEventListener("click", function () { open("manual"); });
    var ask = function () {
      showLink();
      var s = state(), help = document.getElementById("help");
      if (s.off || s.gave || s.asks >= MAX_ASKS || rounds() < Math.max(FIRST, s.next)) return;
      if (help && !help.hidden) return;              // the tour is open
      s.asks += 1; s.next = rounds() + ASK_AGAIN; save(s);
      open("ask");
    };
    // after the page has arrived (the header's slide, then the page's fade-in), and again when Back restores it
    var later = function () { var go = function () { setTimeout(ask, 900); }; if (typeof afterSlide === "function") afterSlide(go); else go(); };
    showLink();
    later();
    window.addEventListener("pageshow", function (e) { if (e.persisted) later(); });
    return;
  }

  // ------------------------------------------------------------ a game: count rounds, add the line
  var lastFp = null;
  function ended(after, fp) {
    if (!after || fp === lastFp) return;
    lastFp = fp;
    var n = rounds() + 1;
    A.set("eb-rounds", String(n));
    stat("Round finished", { game: GAME });
    var old = after.parentNode.querySelector(".ebd-line");
    if (old) old.remove();
    var s = state();
    if (n < FIRST || n < s.line) return;
    s.line = n + (s.gave ? LINE_EVERY_GAVE : LINE_EVERY); save(s);
    var p = document.createElement("p");
    p.className = "ebd-line ebd-l";
    p.dataset.lang = A.lang();
    p.innerHTML = both("Enjoying English Bubbles?", "Está gostando do English Bubbles?") +
      ' <button type="button">' + HEART + both("Support it", "Apoie") + "</button>";
    p.querySelector("button").addEventListener("click", function (e) { e.stopPropagation(); open("manual"); });
    after.parentNode.insertBefore(p, after.nextSibling);
  }
  function text(root, sel) { var x = root && root.querySelector(sel); return x ? x.textContent : ""; }
  var em = document.getElementById("endmodal"), wasOpen = !!(em && em.classList.contains("show"));
  if (em) new MutationObserver(function () {
    var on = em.classList.contains("show");
    if (on && !wasOpen) ended(em.querySelector(".endbtns") || em.querySelector("#endagain"), "m:" + text(em, "#endscore") + "|" + text(em, "#endlist").slice(0, 400));
    wasOpen = on;
  }).observe(em, { attributes: true, attributeFilter: ["class"] });
  var lastBtn = null;
  new MutationObserver(function () {
    var b = document.getElementById("pagain") || document.getElementById("spagain");
    if (!b || b === lastBtn) return;
    lastBtn = b;
    var box = b.closest(".pacts, .endbtns, p") || b;
    var end = b.closest(".pend") || box.parentNode;
    // the same round's end drawn again (a language switch) has the same words: not a new round
    var words = end.querySelectorAll(".w");
    if (!words.length) words = end.querySelectorAll("li");
    ended(box, "p:" + [].map.call(words, function (x) { return x.textContent.slice(0, 30); }).join("|").slice(0, 400) + text(end, ".big"));
  }).observe(document.body, { childList: true, subtree: true });
})();
