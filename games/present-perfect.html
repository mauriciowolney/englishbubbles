</div>
<script>
const DATA = {"levels":{"A2":{"grad":["#3fcf9a","#2bb5c9"],"title":"Short texts, clear time words","nativeUi":true,"tries":2,"hints":2,"feedback":"sentences","rounds":4,"blanks":3,"sequence":["text","build","quiz","text","build"],"explain":"pt"},"B1":{"grad":["#4aa8ff","#5b7bff"],"title":"Longer texts, more context","tries":2,"hints":1,"feedback":"count","rounds":4,"blanks":4,"sequence":["text","build","quiz","text","build"],"explain":"en"},"B2":{"grad":["#a77bff","#d05cff"],"label":"B2+","title":"Authentic texts, subtler contrasts","tries":2,"hints":1,"feedback":"count","rounds":4,"blanks":5,"sequence":["text","build","quiz","text","build"],"explain":"en"}},"tenses":{"pp":{"name":"Present perfect","form":"have / has + verb-ed","hue":285,"short":"connected to now","shortPt":"ligado ao agora","ex":"I have lived here since 2019.","exPt":"Eu moro aqui desde 2019."},"ps":{"name":"Past simple","form":"verb-ed","hue":200,"short":"finished time","shortPt":"tempo terminado","ex":"I lived in Rome in 2015.","exPt":"Eu morei em Roma em 2015."}},"uses":{"pp-exp":{"tense":"pp","name":"Life experience","namePt":"Experiência de vida","rule":"It happened at some time in your life up to now. WHEN it happened is not important, so we don't say it.","rulePt":"Aconteceu em algum momento da vida até agora. QUANDO aconteceu não importa, então não dizemos.","signals":["Have you ever…?","never","before","once","twice","three times"],"ex":"I have visited London twice.","exPt":"Eu já visitei Londres duas vezes.","trap":"Portuguese uses the past here (\"já visitei\"). In English, with no finished time, use have / has. (In informal American English you may hear the past simple, but the present perfect is the standard choice.)","trapPt":"Em português usamos o pretérito (\"já visitei\"). Em inglês, sem um tempo terminado, use have / has. (No inglês americano informal às vezes se ouve o past simple, mas o present perfect é a escolha padrão.)","contrast":"ps-time","label":"sometime before now"},"pp-since":{"tense":"pp","name":"Still true now (for / since)","namePt":"Ainda é verdade (for / since)","rule":"It started in the past and it is still true now. We often say how long with for or since.","rulePt":"Começou no passado e ainda é verdade agora. Muitas vezes dizemos há quanto tempo com for ou since.","signals":["for (+ still true)","since","How long…?"],"ex":"She has lived here since 2020.","exPt":"Ela mora aqui desde 2020.","trap":"Portuguese uses the PRESENT: \"moro aqui há 3 anos\". In English: I have lived here for 3 years — never \"I live here for 3 years\". And this \"há\" means for, not ago!","trapPt":"Em português usamos o PRESENTE: \"moro aqui há 3 anos\". Em inglês: I have lived here for 3 years — nunca \"I live here for 3 years\". E o \"há\" de \"há 3 anos\" aqui é for, não ago!","contrast":"ps-ended","label":"still true now"},"pp-period":{"tense":"pp","name":"Unfinished time","namePt":"Período que não terminou","rule":"The time period is not finished yet: so far, up to now, this year, over the years, in the last few weeks.","rulePt":"O período ainda não terminou: so far (até agora), up to now, this year, over the years, in the last few weeks.","signals":["so far","up to now","this year","over the years","in the last few weeks"],"ex":"We have visited three museums so far.","exPt":"Até agora, nós já visitamos três museus.","trap":"\"Até agora\" and \"nas últimas semanas\" need the present perfect, even when Portuguese uses the past (\"já visitamos\").","trapPt":"\"Até agora\" e \"nas últimas semanas\" pedem present perfect, mesmo que em português o verbo fique no pretérito (\"já visitamos\").","contrast":"ps-time","label":"not finished yet"},"pp-news":{"tense":"pp","name":"News / recent change","namePt":"Notícia / mudança recente","rule":"We give news: something happened recently and the result is important now. No finished time is given.","rulePt":"Damos uma notícia: algo aconteceu recentemente e o resultado importa agora. Nenhum tempo terminado é dito.","signals":["Good news!","the result now","no time word"],"ex":"The city has opened a new park.","exPt":"A cidade inaugurou um parque novo.","trap":"News starts with the present perfect (the new thing). The details (when, how) come after it, in the past simple. Portuguese uses the past for both: \"abriu\".","trapPt":"Notícias começam com o present perfect (a novidade). Os detalhes (quando, como) vêm depois, no past simple. Em português os dois ficam no pretérito: \"abriu\".","contrast":"ps-story","label":"result now"},"ps-time":{"tense":"ps","name":"Finished time","namePt":"Tempo terminado","rule":"We say (or ask) WHEN it happened, and that time is finished: yesterday, last week, two days ago, in 2019, on Monday.","rulePt":"Dizemos (ou perguntamos) QUANDO aconteceu, e esse tempo já terminou: yesterday, last week, two days ago, in 2019, on Monday.","signals":["yesterday","last …","… ago","in 2019","on Monday","When…?"],"ex":"I visited London last year.","exPt":"Eu visitei Londres no ano passado.","trap":"With a finished time, NEVER use have / has: \"I have visited London last year\" is wrong. Careful: \"há duas semanas\" (= two weeks ago) is a finished time!","trapPt":"Com um tempo terminado, NUNCA use have / has: \"I have visited London last year\" está errado. Atenção: \"há duas semanas\" (= two weeks ago) é tempo terminado!","contrast":"pp-exp","label":"finished time"},"ps-story":{"tense":"ps","name":"Telling a story","namePt":"Contando uma história","rule":"We tell events in order, one after another, at a finished time in the past.","rulePt":"Contamos os fatos em ordem, um depois do outro, num tempo passado que já terminou.","signals":["then","after that","later","… minutes later"],"ex":"He opened the door, looked outside and smiled.","exPt":"Ele abriu a porta, olhou para fora e sorriu.","trap":"In a story, once the time is set, all the events stay in the past simple.","trapPt":"Numa história, depois que o momento já está definido, os fatos seguem todos no past simple.","contrast":"pp-news","label":"events in order"},"ps-ended":{"tense":"ps","name":"Finished situation","namePt":"Situação que já acabou","rule":"It lasted for some time, but it is over now. Careful: for does NOT always mean present perfect!","rulePt":"Durou um tempo, mas já acabou. Cuidado: for NÃO significa sempre present perfect!","signals":["for … (and then it ended)","until …","before …"],"ex":"He worked in Paris for two years. Then he moved to Rome.","exPt":"Ele trabalhou em Paris por dois anos. Depois se mudou para Roma.","trap":"\"Morei lá por 5 anos\" (I don't live there anymore) = I lived there for 5 years. \"Moro aqui há 5 anos\" (I still do) = I have lived here for 5 years.","trapPt":"\"Morei lá por 5 anos\" (não moro mais) = I lived there for 5 years. \"Moro aqui há 5 anos\" (ainda moro) = I have lived here for 5 years.","contrast":"pp-since","label":"over now"},"ps-context":{"tense":"ps","name":"Time clear from context","namePt":"Tempo claro pelo contexto","rule":"There's no time word in the sentence, but we already know WHEN: we're talking about a specific event or period that is finished.","rulePt":"Não há palavra de tempo na frase, mas já sabemos QUANDO: estamos falando de um evento ou período específico que já terminou.","signals":["on that trip","at the party","before that","then"],"ex":"How was the party? — Great! We danced all night.","exPt":"Como foi a festa? — Ótima! Nós dançamos a noite toda.","trap":"A Have you ever…? question takes the present perfect in the answer, but the details (when, where, how) move to the past simple.","trapPt":"Uma pergunta com Have you ever…? pede present perfect na resposta, mas os detalhes (quando, onde, como) passam para o past simple.","contrast":"pp-exp","label":"that time"}},"mistakes":[{"kind":"false-friend","wrong":"I have finished ≠ eu tenho terminado","right":"I have finished = eu (já) terminei","why":"\"Ter + particípio\" means something that keeps happening up to now (\"tenho terminado tarde\" = I've been finishing late lately). For one finished action, Portuguese uses the simple past. They only match for repeated actions: \"tenho viajado muito este ano\" = I have traveled a lot this year.","whyPt":"\"Ter + particípio\" é algo que se repete até agora (\"tenho terminado tarde\" = I've been finishing late lately). Para uma ação concluída, o português usa o pretérito. Os dois só coincidem para ações repetidas: \"tenho viajado muito este ano\" = I have traveled a lot this year."},{"pt":"Eu visitei Londres no ano passado.","wrong":"I have visited London last year.","right":"I visited London last year.","why":"A finished time word (last year, yesterday, in 2019, on Monday) never goes with have / has.","whyPt":"Uma palavra de tempo terminado (last year, yesterday, in 2019, on Monday) nunca vai com have / has."},{"pt":"Moro aqui há três anos.","wrong":"I live here for three years.","right":"I have lived here for three years.","why":"Portuguese uses the present (\"moro aqui há três anos\"), but English needs the present perfect for something that started in the past and is still true.","whyPt":"Em português usamos o presente (\"moro aqui há três anos\"), mas o inglês pede present perfect para algo que começou no passado e continua."},{"pt":"Moro aqui desde 2019.","wrong":"I lived here since 2019.","right":"I have lived here since 2019.","why":"Since + a starting point means \"up to now\", so the main verb takes have / has.","whyPt":"Since + ponto de partida significa \"até agora\", então o verbo principal leva have / has."},{"pt":"Terminei a escola há dois anos.","wrong":"I have finished school two years ago.","right":"I finished school two years ago.","why":"\"Há dois anos\" can be ago (a finished moment → past simple) or for (still true → present perfect). With ago, no have / has.","whyPt":"\"Há dois anos\" pode ser ago (momento terminado → past simple) ou for (ainda é verdade → present perfect). Com ago, nada de have / has."},{"pt":"Quando você chegou?","wrong":"When have you arrived?","right":"When did you arrive?","why":"A When…? question asks for a finished moment, so it takes the past simple.","whyPt":"Uma pergunta com When…? pede um momento terminado, então usa o past simple."},{"pt":"Ele trabalhou em Paris por dois anos e depois se mudou para Roma.","wrong":"He has worked in Paris for two years, then he moved to Rome.","right":"He worked in Paris for two years, then he moved to Rome.","why":"For doesn't always mean present perfect: if the situation is over, use the past simple.","whyPt":"For nem sempre significa present perfect: se a situação já acabou, use o past simple."},{"pt":"Meu bisavô viajou o mundo todo.","wrong":"My great-grandfather has traveled all over the world.","right":"My great-grandfather traveled all over the world.","why":"When the person has died, their life is a finished time: past simple.","whyPt":"Quando a pessoa já morreu, a vida dela é um tempo terminado: past simple."},{"pt":"Desde que cheguei, fiz novos amigos.","wrong":"Since I have arrived, I have made new friends.","right":"Since I arrived, I have made new friends.","why":"After since, the starting moment is in the past simple; the main verb is in the present perfect.","whyPt":"Depois de since, o momento de início fica no past simple; o verbo principal fica no present perfect."}],"bothEx":[{"title":"Still true — or over?","titlePt":"Ainda é verdade — ou já acabou?","pp":"I've worked at a café for two years.","ps":"I worked at a café for two years.","use":"pp-since","alt":"ps-ended","tlPp":"2 years, still there","tlPs":"2 years, over","ppMeans":"I still work there.","ppMeansPt":"Ainda trabalho lá.","psMeans":"I don't work there anymore.","psMeansPt":"Não trabalho mais lá."},{"title":"Experience — or one occasion?","titlePt":"Experiência — ou uma ocasião?","pp":"I've watched that movie.","ps":"I watched that movie.","use":"pp-exp","alt":"ps-context","tlPp":"sometime before now","tlPs":"that time (e.g. Friday)","ppMeans":"It's part of my experience: I know it, so no need to watch it again.","ppMeansPt":"Faz parte da minha experiência: eu conheço, não preciso ver de novo.","psMeans":"I'm thinking of one specific time — for example, at the cinema on Friday.","psMeansPt":"Estou pensando numa vez específica — por exemplo, no cinema na sexta."},{"title":"British — or American?","titlePt":"Britânico — ou americano?","pp":"They've just announced the winner.","ps":"They just announced the winner.","use":"pp-news","alt":"ps-context","tlPp":"just now (UK)","tlPs":"just now (US)","ppMeans":"Fresh news connected to now — the British choice with just, already and yet.","ppMeansPt":"Notícia fresquinha ligada ao agora — a escolha britânica com just, already e yet.","psMeans":"The same fresh news — American English often uses the past simple with just, already and yet.","psMeansPt":"A mesma notícia — o inglês americano costuma usar o past simple com just, already e yet."}],"pt":{"name":"Português","badge":"PT","grad":"linear-gradient(135deg, #1fa463, #e8b600)","ui":{"favorites":"Favoritos","seen":"Vistos","tutorial":"Tutorial","guide":"Guia","volEffects":"Efeitos","volEffectsAria":"Volume dos efeitos sonoros","volVoice":"Voz","volVoiceAria":"Volume da voz","tries":"Tentativas","hint":"Pistas","left":"{n} restantes","reset":"Limpar","check":"Conferir","kText":"Texto","kDialogue":"Diálogo","kChat":"Conversa","textOf":"Texto {n} de {total}","reviewOf":"Revisão {n} de {total}","favOf":"Favorito {n} de {total}","intro":"Leia o texto. Toque num <b>have<\/b> / <b>has<\/b> cinza para ativá-lo onde o <b>present perfect<\/b> é o certo. Deixe desligado para o <b>past simple<\/b>. Depois toque em <b>Conferir<\/b>.","introShort":"Ative <b>have / has<\/b> só onde ele faz sentido e toque em <b>Conferir<\/b>.","wrong1":"Ainda não: <b>1<\/b> escolha está errada. Encontre!","wrongN":"Ainda não: <b>{n}<\/b> escolhas estão erradas. Encontre!","wrongLines":"As linhas com erro estão marcadas com <b>!<\/b>","wrongS1":"Ainda não: <b>1<\/b> frase está errada. Encontre!","wrongSN":"Ainda não: <b>{n}<\/b> frases estão erradas. Encontre!","tryLeft":"Resta 1 tentativa.","triesLeft":"Restam {n} tentativas.","outOfTries":"Aqui estão as respostas certas — leia o porquê abaixo.","cluesOn":"<b>Pistas<\/b>: as palavras de tempo estão destacadas. <b>Tempo terminado<\/b> → past simple. <b>Até agora<\/b> → present perfect.","cluesWrong":"<b>Pistas<\/b>: as palavras de tempo dos verbos que você errou estão destacadas. <b>Tempo terminado<\/b> → past simple. <b>Até agora<\/b> → present perfect.","hintLast":"Essa foi a sua última pista neste jogo.","hintsLeftGame":"Restam <b>{n}<\/b> neste jogo.","perfect":"Perfeito!","streak":"{n} perfeitos seguidos!","nice":"Muito bem!","gotIt":"Boa tentativa!","done":"Pronto!","doneNote":"Leia o porquê abaixo — toque num verbo do texto para ir até a explicação dele.","correctOf":"{k} de {n} certas","translation":"Tradução","listen":"Ouvir","next":"Próximo","results":"Ver resultado","buildOf":"Frase {n} de {total}","buildPrompt":"Diga em inglês","buildYours":"Sua frase","buildRound":"Monte as frases","buildIntro":"<b>Monte a frase<\/b> em inglês: arraste as palavras certas para os <b>{n}<\/b> espaços (ou toque nelas). Algumas palavras sobram.","buildIntroTouch":"<b>Monte a frase<\/b> em inglês: toque nas palavras certas para preencher os <b>{n}<\/b> espaços (ou arraste). Algumas palavras sobram.","buildGreen":"Ainda não: as palavras verdes estão certas. Mude as outras.","buildTrap":"Ainda não: “{w}” não serve nesta frase.","buildShown":"A frase certa é:","buildEnd":"Montar: {k} de {n} certas","plusBuild":" + {n} frases","youChose":"Você escolheu","rightIs":"O correto é","watchOut":"Atenção!","contHead":"Mais comum:","contTip":"Certo, mas a maioria das pessoas diria have been + -ing","guideBackEx":"Voltar às explicações","guideBack":"Voltar","bothLead":"Às vezes os dois tempos estão certos: a escolha muda o sentido, ou mostra a variedade (britânica ou americana). Normalmente o contexto decide — quando não decide, as duas servem.","bothChip":"As duas servem","bothMine":"sua escolha","bothYou":"Você escreveu “{x}”: {m}.","guideTitle":"Present perfect ou past simple?","guideAsk":"Pergunte-se","guideQps":"O tempo já terminou?","guideHps":"yesterday · last week · two days ago · in 2019 · uma história contada em ordem · uma situação que já acabou","guideQpp":"A ação está de alguma forma ligada ao agora, ou não tem um momento definido no passado?","guideHpp":"ainda é verdade (for / since) · so far (até agora) · experiência de vida · notícia","guideFalse":"<b>Cuidado: have + particípio ≠ ter + particípio (geralmente).<\/b> \"Eu tenho assistido\" soa como uma ação contínua, enquanto \"I have watched\" soa como uma ação concluída. Para uma ação concluída ou uma experiência, o português usa o pretérito: <i>I have watched<\/i> = <i>eu (já) assisti<\/i>.","signals":"Palavras-sinal","mistakesTitle":"Erros mais comuns","mistakesLead":"As armadilhas clássicas para quem fala português: o que não dizer, e por quê.","pmNormal":"Jogo normal","pmSpeed":"Rodada relâmpago","pmReview":"Revisar erros","pmFav":"Favoritos","kSentence":"Frase","nSents":"{n} frases","oneSent":"1 frase","nTexts":"{n} textos","oneText":"1 texto","nSeconds":"{n} segundos · frases soltas","pmNoMiss":"nenhum erro ainda","pmNoFav":"nenhum favorito ainda","speedTitle":"Rodada relâmpago","speedIntro":"Com have / has ou sem? Uma frase de cada vez — o mais rápido que puder!","go":"Já!","speedAsk":"Qual está certo? Toque ou aperte <b>1<\/b> / <b>2<\/b>.","quizAsk":"<b>Pergunta rápida<\/b> valendo 1 ponto extra: qual linha do tempo combina com o verbo em negrito?","quizLabel":"Pergunta rápida","quizBothWhy":"“{x}”: {m}. (Aqui a outra forma também estaria certa, com o outro sentido.)","quizYes":"Isso! ","quizNo":"Não foi dessa vez. ","quizBonus":"Ponto extra!","quizNoBonus":"Sem ponto extra desta vez.","endGame":"Fim de jogo!","endPractice":"Treino concluído!","endTime":"Acabou o tempo!","onePoint":"1 ponto","nPoints":"{n} pontos","inSeconds":"{x} certas em {s} segundos","msg0":"Continue — a prática leva à perfeição!","msg1":"Bom esforço — continue praticando!","msg2":"Ótimo trabalho!","msg3":"Brilhante! Você sabe quando usar have / has.","noSave":"Jogo de treino: a pontuação não é salva.","speedRecord":"Novo recorde relâmpago no {lvl}!","newBest":"Novo recorde no {lvl}!","levelBest":"Nível {lvl} · recorde {n}","hintsUsed":"Pistas usadas: {n} de {m}","bonus":" · +{n} extra","quickQ":"Pergunta rápida: {r}","missed":"errou","mastered":"textos dominados no {lvl}","sentMastered":"frases dominadas no {lvl}","daysRow":" · 🔥 {n} dias seguidos","playAgain":"Jogar de novo","copy":"Copiar resultado","copied":"Copiado ✓","copyFail":"Não deu para copiar","tryUp":"Tentar o {lvl} →","seenTitle":"Vistos","tabRecent":"Recentes","tabMissed":"Com erro","masteredHead":"Textos dominados (perfeitos na primeira conferida)","sentMasteredHead":"Frases dominadas (certas na primeira tentativa)","usesHead":"Usos para praticar (os mais fracos, todos os jogos)","usesOk":"Nenhum uso fraco: 80% ou mais em todos!","practiseOne":"Praticar este","practiseMany":"Praticar estes","emptyFav":"Nenhum favorito ainda. Toque na estrela de um texto ou frase terminada para guardá-lo aqui.","emptyRecent":"Os textos e frases que você terminar aparecem aqui.","emptyMissed":"Nada com erro. Muito bem!"},"tour":{"ui":{"step":"Passo {n} de {total}","back":"Voltar","next":"Próximo","play":"Vamos jogar!","close":"Fechar o tutorial"},"steps":{"welcome":{"t":"Present perfect ou past simple?","x":"Em cada texto, os verbos regulares têm um <b>have<\/b> ou <b>has<\/b> cinza na frente. Ative-o onde o <b>present perfect<\/b> é o certo, e deixe desligado para o <b>past simple<\/b>:"},"level":{"t":"Escolha o seu nível","x":"<b>A2<\/b>: textos curtos com palavras de tempo claras, e instruções em português. <b>B1<\/b>: textos mais longos, em que o contexto pesa mais. <b>B2+<\/b>: e-mails, entrevistas, notícias e outros textos autênticos, com contrastes mais sutis e palavras de tempo que podem enganar."},"text":{"t":"Leia o texto inteiro primeiro","x":"Cartões-postais, conversas, diálogos, notícias… O <b>contexto<\/b> dá a resposta: palavras de tempo, o que ainda é verdade agora, o que já terminou. Toque numa palavra sublinhada com pontinhos para ver o significado."},"spot":{"t":"Toque em have / has","x":"Toque num <b>have<\/b> ou <b>has<\/b> cinza para ativá-lo (present perfect). Toque de novo para desligar (past simple). O verbo nunca muda: os verbos regulares são iguais nos dois tempos! (As teclas <b>1<\/b>–<b>5<\/b> também funcionam.)"},"check":{"t":"Conferir","x":"Você tem <b>2 tentativas<\/b>. Depois de uma conferida errada, você vê <b>quantas<\/b> escolhas estão erradas (no A2, quantas frases). Tudo certo na primeira = <b>2 pontos<\/b> por verbo; depois disso, 1 ponto por verbo certo."},"clues":{"t":"Pistas","x":"Travou? As <b>Pistas<\/b> destacam as palavras de tempo do texto (yesterday, since, so far…). Elas valem para o jogo todo, e cada pista que sobrar vira um <b>ponto extra<\/b>."},"why":{"t":"Entenda o porquê","x":"Depois de conferir, cada verbo ganha uma explicação com <b>linha do tempo<\/b>, uma nota em português e a tradução. Toque num verbo do texto para ir até a explicação dele, e ouça o texto inteiro."},"guide":{"t":"O guia","x":"Abra o <b>Guia<\/b> quando quiser: todos os usos dos dois tempos, com linhas do tempo, palavras-sinal e as armadilhas clássicas para quem fala português."},"score":{"t":"Pontos","x":"Pontos para cada texto, uma <b>pergunta rápida<\/b> valendo mais 1 no meio do jogo, e 1 ponto extra para cada pista que você não usar."},"play":{"t":"Mais jeitos de jogar","x":"Toque em <b>new game<\/b> para um jogo novo, uma <b>rodada relâmpago<\/b> de 1 minuto com frases soltas, ou um treino com os textos em que você <b>errou<\/b> ou que <b>marcou com estrela<\/b>."},"lists":{"t":"Favoritos e Vistos","x":"Marque um texto terminado com estrela para guardá-lo nos <b>Favoritos<\/b>. <b>Vistos<\/b> mostra o seu progresso e os seus acertos em cada uso — descubra seus pontos fracos e pratique!"}}}},"texts":{"A2":[{"id":"a2-01","kind":"dialogue","contract":true,"title":"The new neighbor","titlePt":"O vizinho novo","voices":{"Emma":"f","Tom":"m"},"body":[["Emma","Hi! Are you the new neighbor?"],["Tom","Yes, I'm Tom. I [have:moved] here {two weeks ago}, from Chicago."],["Emma","Oh, welcome! I'm Emma. I [have:lived] in this building {since 2019}."],["Tom","Nice! Do you like it here?"],["Emma","I love it. The neighbors are friendly, and there's a great café on the corner. I [have:worked] there {for three years} — {I'm a barista}!"],["Tom","Really? I [have:tried] their chocolate cake {yesterday}. It was delicious!"],["Emma","Ha! Thanks — I made it. Come again soon!"]],"pt":["Oi! Você é o vizinho novo?","Sou, eu sou o Tom. Eu me mudei pra cá há duas semanas, de Chicago.","Ah, bem-vindo! Eu sou a Emma. Eu moro neste prédio desde 2019.","Legal! Você gosta daqui?","Adoro. Os vizinhos são simpáticos, e tem um café ótimo na esquina. Eu trabalho lá há três anos — sou barista!","Sério? Eu experimentei o bolo de chocolate de vocês ontem. Estava delicioso!","Ha! Obrigada — fui eu que fiz. Volte sempre!"],"spots":[{"use":"ps-time","clue":"two weeks ago","why":"Two weeks ago says exactly WHEN he moved, and that time is finished.","whyPt":"Two weeks ago (há duas semanas) diz exatamente QUANDO ele se mudou, e esse tempo já terminou.","pt":"me mudei"},{"use":"pp-since","clue":"since 2019","why":"She started living here in 2019 and she still lives here. Since + a starting point → present perfect.","whyPt":"Ela começou a morar aqui em 2019 e ainda mora. Since + ponto de partida → present perfect. Em português usamos o presente: \"moro aqui desde 2019\".","pt":"moro (desde 2019)"},{"use":"pp-since","clue":["for three years","I'm a barista"],"tl":"for three years","why":"She started three years ago and she still works there (\"I'm a barista!\"). For + a period up to now → present perfect.","whyPt":"Ela começou há três anos e ainda trabalha lá (\"sou barista!\"). Em português: \"trabalho lá há três anos\" — esse \"há\" é for, não ago!","pt":"trabalho (há três anos)"},{"use":"ps-time","clue":"yesterday","why":"Yesterday is a finished time, so we use the past simple.","whyPt":"Yesterday (ontem) é um tempo terminado, então usamos o past simple.","pt":"experimentei"}],"w":{"neighbor":"vizinho","neighbors":"vizinhos","moved":"mudar(-se)","lived":"morar","building":"prédio","friendly":"simpáticos","corner":"esquina","worked":"trabalhar","barista":"barista (quem prepara café)","tried":"experimentar","delicious":"delicioso","made":"fiz (make)"}},{"id":"a2-02","kind":"text","contract":true,"frame":"Postcard","framePt":"Cartão-postal","title":"Greetings from Lisbon","titlePt":"Lembranças de Lisboa","body":["Dear Grandma,","Greetings from Lisbon! We [have:arrived] here {on Tuesday}, and the weather is perfect.","{So far}, we [have:explored] four museums and two old churches. {Yesterday}, we [have:walked] up to the castle, and the view was amazing!","Dad [has:visited] Lisbon {twice before}, so he's our tour guide. He loves the food here — he [has:ordered] fresh sardines at every lunch {since Tuesday}!","See you next week!","Love, Sophie"],"pt":["Querida vovó,","Lembranças de Lisboa! Nós chegamos aqui na terça-feira, e o tempo está perfeito.","Até agora, já exploramos quatro museus e duas igrejas antigas. Ontem, subimos a pé até o castelo, e a vista era incrível!","O papai já visitou Lisboa duas vezes antes, então ele é o nosso guia. Ele adora a comida daqui — pede sardinha fresca em todo almoço desde terça!","Até semana que vem!","Beijos, Sophie"],"spots":[{"use":"ps-time","clue":"on Tuesday","why":"On Tuesday says WHEN they arrived, and Tuesday is finished.","whyPt":"On Tuesday (na terça-feira) diz QUANDO eles chegaram, e a terça já terminou.","pt":"chegamos"},{"use":"pp-period","clue":"So far","why":"So far = from the start of the trip up to now. The trip isn't finished, so they can explore more.","whyPt":"So far = até agora. A viagem ainda não terminou, então eles ainda podem explorar mais.","pt":"já exploramos (até agora)"},{"use":"ps-time","clue":"Yesterday","why":"Yesterday is a finished time, so we use the past simple.","whyPt":"Yesterday (ontem) é um tempo terminado: past simple.","pt":"subimos (a pé)"},{"use":"pp-exp","clue":"twice before","why":"This is Dad's experience up to now: twice before this trip, and we don't say when. It's important now, too: he's the tour guide!","whyPt":"É a experiência do pai até agora: duas vezes antes desta viagem, sem dizer quando. E isso importa agora: ele é o guia!","pt":"já visitou"},{"use":"pp-since","clue":"since Tuesday","why":"From Tuesday up to now, and it's still happening. Compare: on Tuesday (a finished day) → arrived, but since Tuesday (up to now) → has ordered.","whyPt":"De terça até agora, e continua acontecendo. Compare: on Tuesday (um dia que terminou) → arrived; since Tuesday (até agora) → has ordered. Em português: \"pede … desde terça\" (presente!).","pt":"pede (desde terça)"}],"w":{"greetings":"saudações, lembranças","arrived":"chegar","weather":"tempo (clima)","explored":"explorar, conhecer","churches":"igrejas","walked":"caminhar, ir a pé","castle":"castelo","view":"vista","amazing":"incrível","visited":"visitar","twice":"duas vezes","tour guide":"guia turístico","ordered":"pedir (comida)","fresh":"fresca","sardines":"sardinhas"}},{"id":"a2-03","kind":"text","frame":"School newsletter","framePt":"Jornal da escola","title":"Meet Ms. Lee!","titlePt":"Conheçam a Ms. Lee!","body":["Meet Ms. Lee, our new music teacher! Ms. Lee is from Canada. She [has:played] the piano {for twenty years}, and she {still} practices every day.","{Before she came to our city}, she [has:worked] at a school in Toronto for five years.","Ms. Lee is very busy at our school. {So far}, she [has:started] a choir and a rock band! {Last month}, the choir [has:performed] at the city festival, and it was a big success.","\"The students here are fantastic,\" she says. Welcome, Ms. Lee!"],"pt":["Conheçam a professora Lee, nossa nova professora de música! Ela é do Canadá. Ela toca piano há vinte anos e ainda pratica todos os dias.","Antes de vir para a nossa cidade, ela trabalhou numa escola em Toronto por cinco anos.","A Ms. Lee está muito ocupada na nossa escola. Até agora, ela já criou um coral e uma banda de rock! No mês passado, o coral se apresentou no festival da cidade, e foi um grande sucesso.","\"Os alunos daqui são fantásticos\", ela diz. Bem-vinda, Ms. Lee!"],"spots":[{"use":"pp-since","clue":["for twenty years","still"],"tl":"for twenty years","why":"She started twenty years ago and she still plays (she practices every day). For + a period up to now → present perfect.","whyPt":"Ela começou há vinte anos e ainda toca (pratica todos os dias). Em português: \"toca piano há vinte anos\" (presente!).","pt":"toca (há vinte anos)"},{"use":"ps-ended","clue":"Before she came to our city","tl":"5 years (over)","why":"Five years, but that job is over: it was before she came to our city. Compare with the piano: for + still true → present perfect; for + finished → past simple.","whyPt":"Cinco anos, mas esse emprego acabou: foi antes de ela vir para a nossa cidade. Compare com o piano: for + ainda verdade → present perfect; for + já acabou → past simple.","pt":"trabalhou (por cinco anos)"},{"use":"pp-period","clue":"So far","why":"So far = from her first day up to now. She is still at the school, so she can start more groups.","whyPt":"So far = do primeiro dia até agora. Ela continua na escola, então pode criar mais grupos.","pt":"já criou (até agora)"},{"use":"ps-time","clue":"Last month","why":"Last month is a finished time, so we use the past simple.","whyPt":"Last month (no mês passado) é um tempo terminado: past simple.","pt":"se apresentou"}],"w":{"meet":"conhecer","played":"tocar (instrumento)","still":"ainda","practices":"pratica","came":"veio (come)","worked":"trabalhar","busy":"ocupada","started":"começar, criar","choir":"coral","performed":"apresentar-se","festival":"festival","success":"sucesso"}},{"id":"a2-04","kind":"chat","contract":true,"title":"Movie night?","titlePt":"Noite de filme?","voices":{"Ana":"f","Jake":"m"},"body":[["Ana","Hey! Do you want to watch a movie tonight? 🍿"],["Jake","Sure! Which one?"],["Ana","What about Ocean Blue?"],["Jake","Oh no, I [have:watched] it {last weekend} 😅"],["Ana","OK… what about Dark Planet? I [have:wanted] to see it {for months}!"],["Jake","Me too! Pizza from Mario's?"],["Ana","Not again! 😂 We [have:ordered] from Mario's {a hundred times}!"],["Jake","Haha, true. What about the new Thai place? My sister [has:celebrated] her birthday there {on Saturday}. She says the food is great."],["Ana","Perfect! See you at 8 👍"]],"pt":["Oi! Quer ver um filme hoje à noite? 🍿","Claro! Qual?","Que tal Ocean Blue?","Ah não, eu vi esse no fim de semana passado 😅","Tá… e Dark Planet? Faz meses que eu quero ver esse!","Eu também! Pizza do Mario's?","De novo não! 😂 A gente já pediu do Mario's umas cem vezes!","Haha, verdade. E o restaurante tailandês novo? Minha irmã comemorou o aniversário dela lá no sábado. Ela diz que a comida é ótima.","Perfeito! Te vejo às 8 👍"],"spots":[{"use":"ps-time","clue":"last weekend","why":"Last weekend is a finished time, so we use the past simple.","whyPt":"Last weekend (no fim de semana passado) é um tempo terminado: past simple.","pt":"vi"},{"use":"pp-since","clue":"for months","why":"She started wanting to see it months ago and she still wants to — she's suggesting it now! For + a period up to now → present perfect.","whyPt":"Ela começou a querer ver há meses e ainda quer — está sugerindo agora! Em português: \"faz meses que eu quero ver\" (presente!) — esse \"faz\" é for, não ago.","pt":"quero (faz meses)"},{"use":"pp-exp","clue":"a hundred times","why":"How many times up to now — no time is given, and the number can still grow (if they order pizza again tonight!).","whyPt":"Quantas vezes até agora — sem dizer quando, e o número ainda pode crescer (se pedirem pizza de novo hoje!).","pt":"já pedimos (umas cem vezes)"},{"use":"ps-time","clue":"on Saturday","why":"On Saturday says WHEN, and Saturday is finished.","whyPt":"On Saturday (no sábado) diz QUANDO, e o sábado já terminou.","pt":"comemorou"}],"w":{"watched":"assistir, ver","tonight":"hoje à noite","weekend":"fim de semana","wanted":"querer","ordered":"pedir (comida)","again":"de novo","true":"verdade","thai":"tailandês","place":"lugar, restaurante","celebrated":"comemorar","birthday":"aniversário"}},{"id":"a2-05","kind":"text","frame":"Local news","framePt":"Notícia do bairro","title":"Max is home!","titlePt":"O Max voltou!","body":["{Good news} from Green Park! Max, the Wilson family's little dog, [has:returned] home after three days away.","{On Monday morning}, Max [has:escaped] from the garden. The family put up posters all over town, but nobody saw him.","Then, {yesterday afternoon}, a girl [has:noticed] a little brown dog near the river. She [has:called] the number on his collar, and {twenty minutes later} Max was home!","Max is fine, but he [has:stayed] in his bed {since he got home}. He needs a long rest!"],"pt":["Boa notícia do Green Park! O Max, o cachorrinho da família Wilson, voltou para casa depois de três dias sumido.","Na segunda de manhã, o Max fugiu do quintal. A família colou cartazes pela cidade toda, mas ninguém o viu.","Então, ontem à tarde, uma menina notou um cachorrinho marrom perto do rio. Ela ligou para o número da coleira dele, e vinte minutos depois o Max estava em casa!","O Max está bem, mas está na cama desde que chegou. Ele precisa de um bom descanso!"],"spots":[{"use":"pp-news","clue":"Good news","why":"This is the news: it happened recently and the result is important now (Max is home!). No time is given.","whyPt":"É a notícia: aconteceu há pouco e o resultado importa agora (o Max está em casa!). Nenhum tempo é dito. Em português fica no pretérito: \"voltou\".","pt":"voltou"},{"use":"ps-time","clue":"On Monday morning","why":"Now the story gives the details. When? On Monday morning — a finished time.","whyPt":"Agora a história dá os detalhes. Quando? On Monday morning (segunda de manhã) — um tempo terminado.","pt":"fugiu"},{"use":"ps-time","clue":"yesterday afternoon","why":"Yesterday afternoon is a finished time, so we use the past simple.","whyPt":"Yesterday afternoon (ontem à tarde) é um tempo terminado: past simple.","pt":"notou, viu"},{"use":"ps-story","clue":"twenty minutes later","tl":"she saw him, called…","why":"The story continues in order: she noticed Max, then she called, and twenty minutes later he was home. Events in a story → past simple.","whyPt":"A história continua em ordem: ela viu o Max, depois ligou, e vinte minutos depois ele estava em casa. Fatos de uma história → past simple.","pt":"ligou"},{"use":"pp-since","clue":"since he got home","tl":"since he got home","why":"From the moment he got home up to now — and he is still in bed. Since → present perfect. (After since we use the past simple: got.)","whyPt":"Desde que chegou em casa até agora — e ele ainda está na cama. Since → present perfect. (Depois de since vem o past simple: got.) Em português: \"está na cama desde que chegou\" (presente!).","pt":"está (na cama desde que chegou)"}],"w":{"news":"notícia","returned":"voltar","away":"fora, longe","escaped":"fugir, escapar","garden":"quintal, jardim","put up":"colar, pendurar","posters":"cartazes","nobody":"ninguém","noticed":"notar, perceber","river":"rio","called":"ligar (telefonar)","collar":"coleira","later":"depois","stayed":"ficar","got home":"chegou em casa","rest":"descanso"}},{"id":"a2-06","kind":"chat","contract":true,"title":"A race on Saturday","titlePt":"Uma corrida no sábado","voices":{"Lucy":"f","Sam":"m"},"body":[["Lucy","Hi Sam! Are you free on Saturday morning? 🌞"],["Sam","I think so. Why?"],["Lucy","There's a 5K race in the park. Do you want to run with me? 🏃‍♀️"],["Sam","Me? I'm not a runner! 😅"],["Lucy","I wasn't a runner either! I [have:started] {in January}, with ten minutes a day."],["Lucy","And I [have:trained] three times a week {since then}. {Now I can run} 5K! 💪"],["Sam","Wow! OK, I'll try… but I [have:played] soccer {last night}, and my legs hurt 😂"],["Lucy","No problem, we can walk a little in the middle 😄"],["Sam","Deal! To be honest, I [have:wanted] to do something like this {for a long time}."],["Lucy","Yay! See you at 8 at the park gate! 🎉"]],"pt":["Oi, Sam! Você está livre no sábado de manhã? 🌞","Acho que sim. Por quê?","Vai ter uma corrida de 5 km no parque. Quer correr comigo? 🏃‍♀️","Eu? Eu não sou corredor! 😅","Eu também não era! Comecei em janeiro, com dez minutos por dia.","E desde então eu treino três vezes por semana. Agora eu consigo correr 5 km! 💪","Uau! Tá, vou tentar… mas eu joguei futebol ontem à noite, e minhas pernas estão doendo 😂","Sem problema, a gente pode caminhar um pouco no meio 😄","Combinado! Pra ser sincero, faz tempo que eu quero fazer algo assim.","Eba! Te vejo às 8 no portão do parque! 🎉"],"spots":[{"use":"ps-time","clue":"in January","why":"In January says WHEN she started, and that time is finished.","whyPt":"In January (em janeiro) diz QUANDO ela começou, e esse tempo já terminou.","pt":"comecei"},{"use":"pp-since","clue":["since then","Now I can run"],"tl":"since January","why":"From January up to now — and she still trains (now she can run 5K!). Since → present perfect.","whyPt":"De janeiro até agora — e ela continua treinando (agora consegue correr 5 km!). Since → present perfect. Em português: \"treino três vezes por semana desde então\" (presente!).","pt":"treino (desde então)","cont":{"en":"I've been training three times a week since then.","why":"A repeated activity that is still going on: have been + -ing is more common here.","whyPt":"Uma atividade repetida que ainda continua: aqui have been + -ing é mais comum."}},{"use":"ps-time","clue":"last night","why":"Last night is a finished time, so we use the past simple.","whyPt":"Last night (ontem à noite) é um tempo terminado: past simple.","pt":"joguei"},{"use":"pp-since","clue":"for a long time","why":"He started wanting this a long time ago, and he still wants it — he's saying yes now! For + a period up to now → present perfect.","whyPt":"Ele começou a querer isso há muito tempo e ainda quer — está dizendo sim agora! Em português: \"faz tempo que eu quero fazer algo assim\" (presente!) — esse \"faz\" é for, não ago.","pt":"quero (faz tempo)"}],"w":{"free":"livre","race":"corrida","runner":"corredor(a)","either":"também (em frase negativa)","started":"começar","trained":"treinar","times a week":"vezes por semana","played":"jogar","soccer":"futebol","legs":"pernas","hurt":"doem","in the middle":"no meio","deal":"combinado","to be honest":"para ser sincero","wanted":"querer","gate":"portão"}},{"id":"a2-07","kind":"text","contract":true,"frame":"Language exchange profile","framePt":"Perfil de intercâmbio de idiomas","title":"Hi, I'm Kenji!","titlePt":"Oi, eu sou o Kenji!","body":["Hi! I'm Kenji. I'm 24 and I'm from Osaka, Japan. I [have:lived] in Toronto {since last September}.","I [have:studied] English {for six years}, and {I still} take classes three evenings a week. Speaking is the hard part for me!","{Last year}, I [have:traveled] around Australia for two months. It was amazing!","Here in Toronto, I [have:worked] at a Japanese restaurant for three months.","I'm looking for a language partner. I can help you with Japanese, and you can help me with my English! 😊"],"pt":["Oi! Eu sou o Kenji. Tenho 24 anos e sou de Osaka, no Japão. Moro em Toronto desde setembro do ano passado.","Estudo inglês há seis anos e ainda faço aulas três noites por semana. Falar é a parte difícil pra mim!","No ano passado, viajei pela Austrália por dois meses. Foi incrível!","Aqui em Toronto, trabalho num restaurante japonês há três meses. (Ou: trabalhei num restaurante japonês por três meses.)","Estou procurando um parceiro de idiomas. Eu posso te ajudar com japonês, e você pode me ajudar com o meu inglês! 😊"],"spots":[{"use":"pp-since","clue":"since last September","why":"He moved to Toronto last September and he still lives there. Since + a starting point → present perfect (even with last!).","whyPt":"Ele se mudou para Toronto em setembro do ano passado e ainda mora lá. Since + ponto de partida → present perfect (mesmo com last!). Em português: \"moro em Toronto desde setembro\" (presente!).","pt":"moro (desde setembro do ano passado)"},{"use":"pp-since","clue":["for six years","I still"],"tl":"for six years","why":"He started six years ago and he still studies — he still takes classes. For + a period up to now → present perfect.","whyPt":"Ele começou há seis anos e ainda estuda — continua fazendo aulas. Em português: \"estudo inglês há seis anos\" (presente!) — esse \"há\" é for, não ago!","pt":"estudo (há seis anos)","cont":{"en":"I've been studying English for six years.","why":"An activity that is still going on, and the sentence stresses how long: most people would say have been + -ing.","whyPt":"Uma atividade que ainda continua, e a frase destaca há quanto tempo: a maioria das pessoas diria have been + -ing."}},{"use":"ps-time","clue":"Last year","why":"Last year is a finished time. The trip lasted two months, but it's over — for doesn't always mean present perfect.","whyPt":"Last year (no ano passado) é um tempo terminado. A viagem durou dois meses, mas acabou — for nem sempre pede present perfect.","pt":"viajei"},{"use":"pp-since","both":{"alt":"ps-ended","tlPp":"still works there","tlPs":"three months (over)","pp":"he still works at the restaurant — he started three months ago","ppPt":"ele ainda trabalha no restaurante — começou há três meses","ps":"that job is over: he worked there for three months and then stopped","psPt":"esse emprego acabou: ele trabalhou lá por três meses e depois parou"},"why":"Both are correct. With have, he still works at the restaurant. Without it, that job is over (but he still lives in Toronto). Nothing in the text tells us which.","whyPt":"As duas formas estão certas. Com have, ele ainda trabalha no restaurante (\"trabalho lá há três meses\"). Sem have, esse emprego acabou (\"trabalhei lá por três meses\"). Nada no texto decide.","pt":"trabalho (há três meses) / trabalhei (por três meses)","cont":{"en":"I've been working at a Japanese restaurant for three months.","why":"With have (he still works there): a new, temporary job that is still going on, so most people would say have been + -ing.","whyPt":"Com have (ele ainda trabalha lá): um emprego novo e temporário que ainda continua, então a maioria das pessoas diria have been + -ing."}}],"w":{"lived":"morar","studied":"estudar","take classes":"fazer aulas","evenings":"noites","hard part":"parte difícil","traveled":"viajar","around":"por (todo lugar de)","amazing":"incrível","worked":"trabalhar","looking for":"procurando","language partner":"parceiro(a) de idiomas"}},{"id":"a2-08","kind":"dialogue","contract":true,"title":"On the train to Paris","titlePt":"No trem para Paris","voices":{"Mia":"f","Leo":"m"},"body":[["Mia","Excuse me, is this seat free?"],["Leo","Yes, of course. Are you going to Paris?"],["Mia","Yes! It's my first time. I [have:wanted] to see the city {since I was a little girl}."],["Leo","Oh, you're going to love it. Do you have a hotel?"],["Mia","Yes, I [have:booked] a small one {last week}, near the river."],["Leo","Nice! I know Paris really well. I [have:lived] there for two years."],["Mia","Really? Then tell me: where can I get a good croissant?"],["Leo","Café Lune, near the Louvre. My friend Pierre [has:opened] it {in 2020}, and his croissants are the best in town!"],["Mia","Perfect, thanks! 🥐"]],"pt":["Com licença, este lugar está livre?","Está, claro. Você está indo para Paris?","Estou! É a minha primeira vez. Eu sonho em conhecer a cidade desde pequena.","Ah, você vai adorar. Já tem hotel?","Tenho, reservei um pequeno na semana passada, perto do rio.","Legal! Eu conheço Paris muito bem. Moro lá há dois anos. (Ou: morei lá por dois anos.)","Sério? Então me diz: onde eu encontro um croissant bom?","No Café Lune, perto do Louvre. Meu amigo Pierre abriu o café em 2020, e os croissants dele são os melhores da cidade!","Perfeito, obrigada! 🥐"],"spots":[{"use":"pp-since","clue":"since I was a little girl","tl":"since she was a girl","why":"She started wanting to see Paris as a little girl, and she still wants to (she's going now!). Since → present perfect. (After since we use the past simple: was.)","whyPt":"Ela começou a querer conhecer Paris quando era pequena, e ainda quer (está indo agora!). Since → present perfect. (Depois de since vem o past simple: was.) Em português: \"sonho em conhecer desde pequena\" (presente!).","pt":"sonho em (desde pequena)"},{"use":"ps-time","clue":"last week","why":"Last week is a finished time, so we use the past simple.","whyPt":"Last week (na semana passada) é um tempo terminado: past simple.","pt":"reservei"},{"use":"pp-since","both":{"alt":"ps-ended","tlPp":"two years, still there","tlPs":"two years (over)","pp":"Leo lives in Paris now — he's going home","ppPt":"o Leo mora em Paris agora — está voltando para casa","ps":"Leo lived in Paris before, but he lives somewhere else now","psPt":"o Leo morou em Paris antes, mas agora mora em outro lugar"},"why":"Both are correct. With have, Leo still lives in Paris (he's going home). Without it, he lived there in the past and now lives somewhere else. Nothing in the dialogue tells us which.","whyPt":"As duas formas estão certas. Com have, o Leo ainda mora em Paris (\"moro lá há dois anos\" — está voltando para casa). Sem have, ele morou lá no passado e agora mora em outro lugar (\"morei lá por dois anos\"). Nada no diálogo decide.","pt":"moro (há dois anos) / morei (por dois anos)"},{"use":"ps-time","clue":"in 2020","why":"In 2020 says WHEN he opened it, and that time is finished — even though the café is still open today.","whyPt":"In 2020 diz QUANDO ele abriu, e esse tempo já terminou — mesmo que o café continue aberto hoje.","pt":"abriu"}],"w":{"excuse me":"com licença","seat":"assento, lugar","free":"livre","wanted":"querer","little girl":"menininha","booked":"reservar","near":"perto de","river":"rio","really well":"muito bem","lived":"morar","opened":"abrir","the best in town":"os melhores da cidade"}},{"id":"a2-09","kind":"text","contract":true,"frame":"Class blog","framePt":"Blog da turma","title":"My little garden","titlePt":"Minha hortinha","body":["My hobby is gardening. I [have:started] {three years ago}, with some tomato seeds from my grandpa.","{Since then}, my little garden [has:changed] a lot. Now it has tomatoes, carrots, herbs and lots of flowers.","{Last summer}, I [have:picked] fifteen kilos of tomatoes! My mom made tomato sauce for the whole family.","{So far this year}, I [have:planted] six new kinds of vegetables. My next project? Strawberries! 🍓"],"pt":["Meu hobby é jardinagem. Comecei há três anos, com umas sementes de tomate do meu avô.","Desde então, a minha hortinha mudou muito. Agora tem tomate, cenoura, ervas e muitas flores.","No verão passado, eu colhi quinze quilos de tomate! Minha mãe fez molho de tomate pra família toda.","Este ano já plantei seis tipos novos de legumes. Meu próximo projeto? Morangos! 🍓"],"spots":[{"use":"ps-time","clue":"three years ago","why":"Three years ago says WHEN the hobby started — a finished time. Ago → past simple.","whyPt":"Three years ago (há três anos) diz QUANDO o hobby começou — um tempo terminado. Cuidado: aqui \"há\" = ago → past simple.","pt":"comecei"},{"use":"pp-since","clue":"Since then","why":"From three years ago up to now — and the garden is still changing. Since → present perfect.","whyPt":"De três anos atrás até agora — e a horta continua mudando. Em português fica no pretérito (\"mudou muito desde então\"), mas em inglês since pede present perfect.","pt":"mudou (desde então)"},{"use":"ps-time","clue":"Last summer","why":"Last summer is a finished time, so we use the past simple.","whyPt":"Last summer (no verão passado) é um tempo terminado: past simple.","pt":"colhi"},{"use":"pp-period","clue":"So far this year","tl":"so far this year","why":"So far this year = from January up to now. The year isn't finished, so the number can still grow.","whyPt":"So far this year (até agora, este ano) = de janeiro até agora. O ano não terminou, então o número ainda pode crescer.","pt":"já plantei (este ano)"}],"w":{"gardening":"jardinagem","started":"começar","seeds":"sementes","grandpa":"vovô","changed":"mudar","carrots":"cenouras","herbs":"ervas","picked":"colher (frutas, legumes)","sauce":"molho","the whole family":"a família toda","planted":"plantar","kinds":"tipos","vegetables":"legumes, verduras","strawberries":"morangos"}},{"id":"a2-10","kind":"text","contract":true,"frame":"Social media post","framePt":"Post em rede social","title":"Happy birthday to us!","titlePt":"Parabéns pra nós!","body":["Our little bakery is one year old today! 🎂 {One year ago today}, we [have:opened] our doors for the first time.","{On that first day}, we [have:waited] all morning for our first customer. She finally came at 11:30 and bought one croissant! 😄","{Since then}, we [have:baked] more than 30,000 loaves of bread, and our team is now five people.","And your favorite? Our chocolate cake! You [have:ordered] it {more than 2,000 times}. 🍫","Thank you, everyone! To celebrate, there's free coffee with every cake today. ☕"],"pt":["A nossa padariazinha faz um ano hoje! 🎂 Há exatamente um ano, abrimos as nossas portas pela primeira vez.","Naquele primeiro dia, esperamos a manhã inteira pelo primeiro cliente. Ela finalmente chegou às 11h30 e comprou um croissant! 😄","Desde então, já fizemos mais de 30.000 pães, e a nossa equipe agora tem cinco pessoas.","E o favorito de vocês? O nosso bolo de chocolate! Vocês já pediram mais de 2.000 vezes. 🍫","Obrigado a todos! Para comemorar, hoje tem café grátis com qualquer bolo. ☕"],"spots":[{"use":"ps-time","clue":"One year ago today","tl":"one year ago","why":"One year ago is a finished time: that first day is over (even though the bakery is still open). Ago → past simple.","whyPt":"One year ago (há um ano) é um tempo terminado: aquele primeiro dia já passou (mesmo com a padaria ainda aberta). Aqui \"há\" = ago!","pt":"abrimos"},{"use":"ps-time","clue":"On that first day","why":"On that first day = one year ago, a finished time. The story of the beginning → past simple.","whyPt":"On that first day (naquele primeiro dia) = há um ano, um tempo terminado. A história do começo → past simple.","pt":"esperamos"},{"use":"pp-since","clue":"Since then","why":"From the opening up to now — and they still bake bread every day. Since → present perfect.","whyPt":"Da inauguração até agora — e eles continuam fazendo pão todo dia. Since → present perfect. Em português: \"já fizemos mais de 30.000 pães desde então\".","pt":"já fizemos (desde então)"},{"use":"pp-exp","clue":"more than 2,000 times","tl":"2,000+ times so far","why":"How many times up to now — no time is given, and the number can still grow (people keep ordering it!).","whyPt":"Quantas vezes até agora — sem dizer quando, e o número ainda pode crescer (o pessoal continua pedindo!).","pt":"já pediram"}],"w":{"bakery":"padaria","one year old":"com um ano (de vida)","opened":"abrir","doors":"portas","waited":"esperar","customer":"cliente","finally":"finalmente","bought":"comprou (buy)","baked":"assar, fazer (pão, bolo)","loaves of bread":"pães","team":"equipe","favorite":"favorito","ordered":"pedir, encomendar","celebrate":"comemorar","free":"grátis"}},{"id":"a2-11","kind":"dialogue","contract":true,"title":"First day at the gym","titlePt":"Primeiro dia na academia","voices":{"Kate":"f","Ben":"m"},"body":[["Kate","Hi! Welcome to Fit Club. Is this your first time here?"],["Ben","Yes. I [have:joined] {yesterday}, online."],["Kate","Great! Have you ever been to a gym before?"],["Ben","No, never. But I [have:played] basketball for ten years, {when I was at school}."],["Kate","Good, so you're strong! What do you do now?"],["Ben","I work in an office. I [have:worked] there {since 2020}, and I sit all day! 😅"],["Kate","OK, let's start slowly: some cardio and a little yoga."],["Ben","Yoga? I [have:tried] yoga once… and I fell asleep!"]],"pt":["Oi! Bem-vindo ao Fit Club. É a sua primeira vez aqui?","É. Eu me inscrevi ontem, pela internet.","Ótimo! Você já foi a uma academia antes?","Não, nunca. Mas eu joguei basquete por dez anos, quando estava na escola.","Bom, então você é forte! O que você faz hoje em dia?","Trabalho num escritório. Trabalho lá desde 2020, e fico sentado o dia todo! 😅","Tá, vamos começar devagar: um pouco de cardio e um pouco de ioga.","Ioga? Já fiz ioga uma vez… e peguei no sono! (Ou: fiz ioga uma vez…)"],"spots":[{"use":"ps-time","clue":"yesterday","why":"Yesterday is a finished time, so we use the past simple.","whyPt":"Yesterday (ontem) é um tempo terminado: past simple.","pt":"me inscrevi"},{"use":"ps-ended","clue":"when I was at school","tl":"ten years (over)","why":"Ten years, but that time is over: it was when he was at school. For does NOT always mean present perfect!","whyPt":"Dez anos, mas esse tempo acabou: foi quando ele estava na escola. For NÃO significa sempre present perfect! Em português: \"joguei basquete por dez anos\".","pt":"joguei (por dez anos)"},{"use":"pp-since","clue":"since 2020","why":"He started in 2020 and he still works there. Since → present perfect.","whyPt":"Ele começou em 2020 e ainda trabalha lá. Since → present perfect. Em português: \"trabalho lá desde 2020\" (presente!).","pt":"trabalho (desde 2020)"},{"use":"pp-exp","both":{"alt":"ps-context","tlPp":"once in his life","tlPs":"that one class","pp":"it's his life experience: one time, at some point up to now","ppPt":"é a experiência de vida dele: uma vez, em algum momento até agora","ps":"he's telling the story of that one class (and then he fell asleep)","psPt":"ele está contando a história daquela aula (e aí pegou no sono)"},"why":"Both are correct. With have, it's his life experience (one time, up to now). Without it, he's telling the story of that one class — like fell, right after it.","whyPt":"As duas formas estão certas. Com have, é a experiência de vida dele (uma vez, até agora). Sem have, ele conta a história daquela aula — como fell, logo depois. Em português: \"já fiz ioga uma vez\" / \"fiz ioga uma vez\".","pt":"já fiz / fiz"}],"w":{"gym":"academia","joined":"entrar (em um clube), inscrever-se","played":"jogar","basketball":"basquete","strong":"forte","worked":"trabalhar","sit":"ficar sentado","slowly":"devagar","tried":"experimentar, tentar","once":"uma vez","fell asleep":"peguei no sono (fall asleep)"}},{"id":"a2-12","kind":"chat","contract":true,"title":"Where are my keys?","titlePt":"Cadê as minhas chaves?","voices":{"Tom":"m","Lily":"f"},"body":[["Tom","Lily, help! I can't find my keys 😩"],["Lily","Again?! 😂 OK, where were you after lunch?"],["Tom","{After lunch} I [have:walked] the dog in the park. {Then} I [have:stopped] at the supermarket."],["Lily","And the supermarket? Did you call them?"],["Tom","Yes, I [have:called] them {ten minutes ago}. Nothing."],["Lily","Look in your jacket pocket. You [have:asked] me this question {three times so far this month}! 😂"],["Tom","…Found them. 🙈 Thank you!!"]],"pt":["Lily, socorro! Não acho as minhas chaves 😩","De novo?! 😂 Tá, onde você estava depois do almoço?","Depois do almoço eu levei o cachorro para passear no parque. Depois parei no supermercado.","E o supermercado? Você ligou pra eles?","Liguei, há dez minutos. Nada.","Olha no bolso da jaqueta. Você já me fez essa pergunta três vezes este mês! 😂","…Achei. 🙈 Obrigado!!"],"spots":[{"use":"ps-time","clue":"After lunch","why":"After lunch is a finished time: lunch is over, and the walk is over too.","whyPt":"After lunch (depois do almoço) é um tempo terminado: o almoço acabou, e o passeio também.","pt":"levei (o cachorro para passear)"},{"use":"ps-story","clue":"Then","tl":"the park, then the shop","why":"He tells what he did in order: first the park, then the supermarket. Events in a story → past simple.","whyPt":"Ele conta o que fez em ordem: primeiro o parque, depois o supermercado. Fatos de uma história → past simple.","pt":"parei"},{"use":"ps-time","clue":"ten minutes ago","why":"Ten minutes ago says WHEN. Ago → past simple, even for something very recent.","whyPt":"Ten minutes ago (há dez minutos) diz QUANDO. Ago → past simple, mesmo para algo bem recente. Aqui \"há\" = ago!","pt":"liguei"},{"use":"pp-period","clue":"three times so far this month","tl":"3 times so far","why":"So far this month = from the 1st up to now. The month isn't over, so the number can still grow (and it probably will!).","whyPt":"So far this month (até agora, este mês) = do dia 1º até agora. O mês não acabou, então o número ainda pode crescer (e provavelmente vai!).","pt":"já perguntou"}],"w":{"find":"achar, encontrar","keys":"chaves","after lunch":"depois do almoço","walked":"passear com (walk the dog)","stopped":"parar","called":"ligar (telefonar)","pocket":"bolso","asked":"perguntar","found":"achei (find)"}},{"id":"a2-13","kind":"text","contract":true,"frame":"Thank-you note","framePt":"Bilhete de agradecimento","title":"Thank you, Mrs. Park!","titlePt":"Obrigado, Sra. Park!","body":["Dear Mrs. Park,","Thank you so much for taking care of Mimi! We [have:arrived] home {last night}, and she was happy and healthy.","{On our trip}, we [have:visited] five cities in two weeks. There's a little present for you from Rome in the box!","You're a wonderful neighbor. You [have:helped] us {so many times}! And Mimi [has:loved] you {since she was a kitten}. 🐱","See you soon, Anna and Leo"],"pt":["Querida Sra. Park,","Muito obrigado por cuidar da Mimi! Chegamos em casa ontem à noite, e ela estava feliz e saudável.","Na nossa viagem, visitamos cinco cidades em duas semanas. Tem um presentinho de Roma pra senhora na caixa!","A senhora é uma vizinha maravilhosa. Já nos ajudou tantas vezes! E a Mimi adora a senhora desde filhote. 🐱","Até logo, Anna e Leo"],"spots":[{"use":"ps-time","clue":"last night","why":"Last night is a finished time, so we use the past simple.","whyPt":"Last night (ontem à noite) é um tempo terminado: past simple.","pt":"chegamos"},{"use":"ps-context","clue":"On our trip","tl":"the trip (over)","why":"On our trip = the two weeks they were away. The trip is over (they're home now), so → past simple.","whyPt":"On our trip (na nossa viagem) = as duas semanas fora. A viagem acabou (eles já estão em casa) → past simple.","pt":"visitamos"},{"use":"pp-exp","clue":"so many times","tl":"many times so far","why":"How many times up to now — no time is given, and she's still their neighbor, so she can help again.","whyPt":"Quantas vezes até agora — sem dizer quando, e ela continua sendo vizinha, então pode ajudar de novo.","pt":"já ajudou"},{"use":"pp-since","clue":"since she was a kitten","tl":"since she was a kitten","why":"Mimi started loving her as a kitten, and she still loves her. Since → present perfect. (After since we use the past simple: was.)","whyPt":"A Mimi começou a gostar dela quando era filhote, e ainda gosta. Since → present perfect. (Depois de since vem o past simple: was.) Em português: \"adora a senhora desde filhote\" (presente!).","pt":"adora (desde filhote)"}],"w":{"taking care of":"cuidar de","arrived":"chegar","healthy":"saudável","trip":"viagem","visited":"visitar","present":"presente","wonderful":"maravilhosa","neighbor":"vizinha","helped":"ajudar","loved":"amar, adorar","kitten":"filhote de gato"}},{"id":"a2-14","kind":"text","frame":"Local news","framePt":"Notícia do bairro","title":"A new room at City Library","titlePt":"Uma sala nova na Biblioteca Municipal","body":["{Big news} from City Library: the library [has:opened] a new room for children!","The library first [has:opened] its doors {in 1925}, in a small room above a bakery.","{Since then}, it [has:moved] three times, and today it has more than 80,000 books.","{Last Saturday}, more than 500 people [have:visited] the new room on its first day.","Library director Sara Lind is very happy. \"Children [have:loved] this library {for a hundred years},\" she says, \"and {they still} do!\""],"pt":["Grande notícia da Biblioteca Municipal: a biblioteca abriu uma sala nova para crianças!","A biblioteca abriu as portas pela primeira vez em 1925, numa salinha em cima de uma padaria.","Desde então, ela mudou de endereço três vezes, e hoje tem mais de 80.000 livros.","No sábado passado, mais de 500 pessoas visitaram a sala nova no primeiro dia.","A diretora da biblioteca, Sara Lind, está muito feliz. \"Há cem anos as crianças adoram esta biblioteca\", ela diz, \"e continuam adorando!\""],"spots":[{"use":"pp-news","clue":"Big news","why":"This is the news, in the first sentence: it happened recently and it matters now (the room is open!). No time is given.","whyPt":"É a notícia, na primeira frase: aconteceu há pouco e importa agora (a sala está aberta!). Nenhum tempo é dito. Em português fica no pretérito: \"abriu\".","pt":"abriu"},{"use":"ps-time","clue":"in 1925","why":"In 1925 says WHEN, and that time is finished. Same verb as the news above, different tense: here we have a date.","whyPt":"In 1925 diz QUANDO, e esse tempo já terminou. O mesmo verbo da notícia acima, outro tempo verbal: aqui temos uma data.","pt":"abriu"},{"use":"pp-since","clue":"Since then","why":"From 1925 up to now — the library still exists, and it may move again. Since → present perfect.","whyPt":"De 1925 até agora — a biblioteca continua existindo e pode mudar de novo. Since → present perfect. Em português fica no pretérito (\"mudou três vezes\").","pt":"mudou (desde então)"},{"use":"ps-time","clue":"Last Saturday","why":"Last Saturday is a finished time, so we use the past simple.","whyPt":"Last Saturday (no sábado passado) é um tempo terminado: past simple.","pt":"visitaram"},{"use":"pp-since","clue":["for a hundred years","they still"],"tl":"for 100 years","why":"A hundred years up to now — and children still love it. For + still true → present perfect.","whyPt":"Cem anos até agora — e as crianças continuam adorando. Em português: \"há cem anos as crianças adoram\" (presente!) — esse \"há\" é for, não ago.","pt":"adoram (há cem anos)"}],"w":{"library":"biblioteca","opened":"abrir","doors":"portas","above":"em cima de","bakery":"padaria","moved":"mudar (de lugar)","visited":"visitar","director":"diretora","loved":"amar, adorar"}},{"id":"a2-15","kind":"dialogue","contract":true,"title":"At the doctor's","titlePt":"No médico","voices":{"Dr. Hall":"f","Paul":"m"},"body":[["Dr. Hall","Good morning, Paul. What's the problem?"],["Paul","My back hurts. It [has:started] {on Sunday}."],["Dr. Hall","I see. What did you do {on Sunday}?"],["Paul","I [have:carried] a big sofa up four floors for my brother! 😅"],["Dr. Hall","Ah, that explains it! Do you do any sport?"],["Paul","Not really. I [have:worked] in an office {for fifteen years}, {so I sit a lot}."],["Dr. Hall","OK. Rest for three days, then walk a little every day. I [have:treated] a lot of \"sofa backs\" {so far this year}! 😄"]],"pt":["Bom dia, Paul. Qual é o problema?","Minhas costas estão doendo. Começou no domingo.","Entendi. O que você fez no domingo?","Subi quatro andares de escada carregando um sofá enorme para o meu irmão! 😅","Ah, isso explica tudo! Você pratica algum esporte?","Não muito. Trabalho num escritório há quinze anos, então fico muito sentado.","Tá. Descanse três dias, depois caminhe um pouco todo dia. Já tratei muitas \"costas de sofá\" este ano! 😄"],"spots":[{"use":"ps-time","clue":"on Sunday","why":"On Sunday says WHEN it started, and Sunday is finished.","whyPt":"On Sunday (no domingo) diz QUANDO começou, e o domingo já terminou.","pt":"começou"},{"use":"ps-context","clue":"on Sunday","tl":"on Sunday","why":"There's no time word in Paul's sentence, but the doctor just asked about Sunday — so we know WHEN, and it's finished.","whyPt":"Não há palavra de tempo na frase do Paul, mas a médica acabou de perguntar sobre o domingo — então sabemos QUANDO, e já terminou.","pt":"subi carregando"},{"use":"pp-since","clue":["for fifteen years","so I sit a lot"],"tl":"for fifteen years","why":"He started fifteen years ago and he still works there (so he sits a lot — now). For + still true → present perfect.","whyPt":"Ele começou há quinze anos e ainda trabalha lá (por isso fica muito sentado — agora). Em português: \"trabalho num escritório há quinze anos\" (presente!).","pt":"trabalho (há quinze anos)"},{"use":"pp-period","clue":"so far this year","tl":"so far this year","why":"So far this year = from January up to now. The year isn't finished, so the number can still grow.","whyPt":"So far this year (até agora, este ano) = de janeiro até agora. O ano não terminou, então o número ainda pode crescer.","pt":"já tratei (até agora)"}],"w":{"back":"costas","hurts":"dói","started":"começar","carried":"carregar","floors":"andares","explains":"explica","worked":"trabalhar","sit":"ficar sentado","rest":"descanse","treated":"tratar (um paciente)"}},{"id":"a2-16","kind":"text","contract":true,"frame":"Diary","framePt":"Diário","title":"A new job at the zoo","titlePt":"Um emprego novo no zoológico","body":["Friday, May 12","What a week! I [have:started] my new job at the city zoo {on Monday}.","{On Tuesday}, I [have:helped] the vet with a sick penguin. Now he's fine!","{So far}, I [have:learned] the names of twenty animals. My favorite is Bongo, an old gorilla.","Bongo [has:lived] at the zoo {since 1995}. He's the oldest animal here, and he's very gentle."],"pt":["Sexta-feira, 12 de maio","Que semana! Comecei no meu emprego novo no zoológico da cidade na segunda-feira.","Na terça, ajudei o veterinário com um pinguim doente. Agora ele está bem!","Já aprendi o nome de vin tar está pronto! 🍝","Em 20 minutos! Quem fez?","Eu! Depois da escola, vi um vídeo de culinária e depois fiz espaguete com molho de tomate.","Incrível! É a sua primeira vez?","É! 😄 Mas já ajudei a vovó na cozinha um monte de vezes.","Verdade. A vovó cozinha para esta família há cinquenta anos, e ainda faz a melhor sopa do mundo.","Corre, tá esfriando! 😋"],"spots":[{"use":"ps-time","clue":"After school","why":"After school is a finished time: school is over for today, and so is the video.","whyPt":"After school (depois da escola) é um tempo terminado: a escola já acabou hoje, e o vídeo também.","pt":"vi, assisti"},{"use":"ps-story","clue":"then","tl":"the video, then dinner","why":"She tells what she did in order: first the video, then the spaghetti. Events in a story → past simple.","whyPt":"Ela conta o que fez em ordem: primeiro o vídeo, depois o espaguete. Fatos de uma história → past simple.","pt":"fiz (cozinhei)"},{"use":"pp-exp","clue":"lots of times","tl":"lots of times so far","why":"How many times up to now — no time is given, and she can help Grandma again.","whyPt":"Quantas vezes até agora — sem dizer quando, e ela pode ajudar a vovó de novo.","pt":"já ajudei"},{"use":"pp-since","clue":["for fifty years","she still makes"],"tl":"for fifty years","why":"Fifty years up to now — and she still cooks (she still makes the best soup). For + still true → present perfect.","whyPt":"Cinquenta anos até agora — e ela continua cozinhando (ainda faz a melhor sopa). Em português: \"cozinha há cinquenta anos\" (presente!).","pt":"cozinha (há cinquenta anos)"}],"w":{"ready":"pronto","made":"fez (make)","after school":"depois da escola","watched":"assistir, ver","cooked":"cozinhar","sauce":"molho","helped":"ajudar","kitchen":"cozinha","soup":"sopa","hurry up":"corre, anda logo","getting cold":"esfriando"}},{"id":"a2-18","kind":"text","frame":"Weather news","framePt":"Notícia do tempo","title":"Snow, snow, snow!","titlePt":"Neve, neve, neve!","body":["{Big news} from the weat u!"]],"pt":["Você já foi ao Chile?","Já! Já viajei pra lá duas vezes. Eu amo.","Sério? Quando você foi?","A primeira vez foi em 2018. Fiquei em Santiago uma semana e conheci umas vinícolas incríveis.","Que legal! O Deserto do Atacama está na minha lista. É tão bonito assim mesmo?","Ah, é incrível! A gente acampou lá na minha segunda viagem. As estrelas eram inacreditáveis.","(algum tempo depois)","Pronto, eu vou! Já olhei o preço das passagens cinco vezes desde a nossa última conversa!","Ha! Me leva junto!"],"spots":[{"use":"pp-exp","clue":["Have you ever","twice"],"tl":"twice (in her life)","why":"Leo asks about her life experience (Have you ever…?). She answers with no time: twice in her life, up to now.","whyPt":"O Leo pergunta sobre a experiência de vida dela (Have you ever…?). Ela responde sem dizer quando: duas vezes na vida, até agora.","pt":"já viajei"},{"use":"ps-time","clue":["When","in 2018"],"tl":"in 2018","why":"Leo asks When? — so now they talk about a specific finished time: in 2018.","whyPt":"O Leo pergunta When? (quando?) — então agora eles falam de um tempo específico e terminado: in 2018.","pt":"fiquei"},{"use":"ps-context","clue":"on my second trip","tl":"her 2nd trip","why":"There's no year, but we know WHEN: on her second trip — a specific trip that is finished.","whyPt":"Não há ano, mas sabemos QUANDO: na segunda viagem dela — uma viagem específica que já terminou.","pt":"acampamos"},{"use":"pp-since","clue":"since our last chat","tl":"since our last chat","why":"From our last chat up to now — and he's still checking! Since → present perfect.","whyPt":"Desde a nossa última conversa até agora — e ele continua olhando! Since → present perfect.","pt":"já olhei (desde a nossa última conversa)"}],"w":{"been to":"ido a (go)","traveled":"viajar","twice":"duas vezes","stayed":"ficar, hospedar-se","wineries":"vinícolas","list":"lista","incredible":"incrível","camped":"acampar","trip":"viagem","stars":"estrelas","unbelievable":"inacreditáveis","checked"
