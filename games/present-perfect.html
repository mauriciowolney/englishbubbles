-two years.","whyPt":"Até a automação em 1978: o trabalho dela acabou. Past simple, mesmo com for thirty-two years.","pt":"cuidou"},{"use":"ps-context","clue":"Throughout those years","tl":"those years","why":"Throughout those years = the thirty-two years that are over: past simple.","whyPt":"Throughout those years (ao longo desses anos) = os trinta e dois anos que já acabaram: past simple.","pt":"registrou"},{"use":"pp-since","clue":"Since 2019","why":"Clare started in 2019 and is still working on it: since + present perfect. Agnes's time is over; Clare's isn't.","whyPt":"Clare começou em 2019 e continua: since + present perfect. O tempo da Agnes acabou; o da Clare, não. Em português: \"transcreve desde 2019\" (presente!).","pt":"transcreve (desde 2019)"},{"use":"pp-period","clue":"So far","why":"So far = up to now. More volumes are coming.","whyPt":"So far (até agora): ainda virão mais volumes.","pt":"já publicou"}],"w":{"tended":"cuidar de","lighthouse":"farol","automation":"automação","throughout":"ao longo de","recorded":"registrar, anotar","leather":"couro","great-niece":"sobrinha-neta","transcribed":"transcrever","published":"publicar","on display":"em exposição"}},{"id":"b2-26","kind":"chat","contract":true,"title":"Did you hear about Marta?","titlePt":"Você soube da Marta?","voices":{"Kim":"f","Lucas":"m"},"body":[["Kim","{Have you heard}? Marta [has:resigned]! 😱"],["Lucas","What?! When?"],["Kim","She [has:announced] it at the team meeting {at nine}."],["Lucas","Wow. I [have:admired] her {since my first day} here."],["Kim","Same. {Remember} when she [has:rescued] the Lisbon project? {That week} she [has:stayed] in the office till midnight every night."]],"pt":["Você soube? A Marta pediu demissão! 😱","O quê?! Quando?","Ela anunciou na reunião da equipe às nove.","Nossa. Eu admiro ela desde o meu primeiro dia aqui.","Eu também. Lembra quando ela salvou o projeto de Lisboa? Naquela semana ela ficou no escritório até meia-noite todas as noites."],"spots":[{"use ems, can do big math."],"pt":["Uma nova pesquisa da Universidade de Melbourne revelou que as abelhas conseguem entender a ideia de zero.","Numa série de experimentos em 2018, os cientistas treinaram abelhas para escolher o cartão com menos pontos.","Quando os pesquisadores depois mostraram um cartão vazio, as abelhas foram direto para ele.","Desde o estudo, outras equipes repetiram o teste com vespas e formigas.","Até agora, os resultados surpreenderam quase todo mundo — cérebros minúsculos, ao que parece, fazem grandes contas."],"spots":[{"use":"pp-news","clue":"New research","why":"This is the news, in the first sentence: new and relevant now. No time is given.","whyPt":"É a notícia, na primeira frase: nova e relevante agora. Nenhum tempo é dito. Em português: \"revelou\".","pt":"revelou"},{"use":"ps-time","clue":"In a series of experiments in 2018","tl":"in 2018","why":"In 2018 is a finished time: past simple.","whyPt":"Em 2018 = tempo terminado: past simple.","pt":"treinaram"},{"use":"pp-since","clue":"Since the study","why":"From the study up to now: since + present perfect.","whyPt":"Do estudo até agora: since + present perfect. Em português: \"desde o estudo, repetiram\".","pt":"repetiram (desde o estudo)"},{"use":"pp-period","clue":"So far","why":"So far = up to now. More results will come.","whyPt":"So far (até agora): ainda virão mais resultados.","pt":"surpreenderam (até agora)"}],"w":{"research":"pesquisa","revealed":"revelar","honeybees":"abelhas","grasp":"entender, captar","trained":"treinar","fewer dots":"menos pontos","empty":"vazio","repeated":"repetir","wasps":"vespas","surprised":"surpreender"}},{"id":"b2-28","kind":"dialogue","frame":"Reference call","framePt":"Telefonema de referência","title":"A reference for Ms. Novak","titlePt":"Uma referência para a Sra. Novak","voices":{"Ms. Ruiz":"f","Mr. Lin":"m"},"body":[["Ms. Ruiz","Thank you for taking my call. Ms. Novak is applying for a position with us."],["Mr. Lin","Of course. She [has:worked] for us for six years, {until last spring}."],["Ms. Ruiz","What were her main responsibilities?"],["Mr. Lin","She [has:managed] our design team {in her last two years} with us."],["Ms. Ruiz","And are you still in touch?"],["Mr. Lin","Yes. {Since she left}, we [have:hired] her twice as a freelancer. Honestly, she is {the best designer} I [have:employed]."]],"pt":["Obrigada por atender a minha ligação. A Sra. Novak está se candidatando a uma vaga conosco.","Claro. Ela trabalhou para nós por seis anos, até a primavera passada.","Quais eram as principais responsabilidades dela?","Ela gerenciou a nossa equipe de design nos últimos dois anos que passou conosco.","E vocês ainda mantêm contato?","Sim. Desde que ela saiu, nós a contratamos duas vezes como freelancer. Sinceramente, ela é a melhor designer que já contratei."],"spots":[{"use":"ps-ended","clue":"until last spring","tl":"until last spring","why":"Until last spring = she left then. A finished situation: past simple, even with for six years.","whyPt":"Until last spring (até a primavera passada): ela saiu. Situação terminada = past simple, mesmo com for six years.","pt":"trabalhou"},{"use":"ps-ended","clue":"in her last two years","tl":"those two years","why":"Her last two years at the company are over: past simple.","whyPt":"Os últimos dois anos dela na empresa já acabaram: past simple.","pt":"gerenciou"},{"use":"pp-since","clue":"Since she left","why":"From the day she left up to now: since + present perfect. The starting point (left) stays in the past simple.","whyPt":"Desde que ela saiu até agora: since + present perfect. O momento de início (left) fica no past simple.","pt":"contratamos (desde que saiu)"},{"use":"pp-exp","clue":"the best designer","tl":"best up to now","why":"The best… I have… = the best in my whole career up to now: present perfect.","whyPt":"\"O melhor… que já…\" = em toda a carreira até agora: present perfect. Em português: \"que já contratei\".","pt":"já contratei"}],"w":{"applying":"candidatar-se","position":"vaga, cargo","worked":"trabalhar","responsibilities":"responsabilidades","managed":"gerenciar","in touch":"em contato","hired":"contratar","freelancer":"autônomo, freelancer","employed":"empregar, contratar"}},{"id":"b2-29","kind":"text","frame":"Personal essay","framePt":"Ensaio pessoal","title":"My father's watches","titlePt":"Os relógios do meu pai","body":["{My father left us last winter}. For forty years, he [has:repaired] watches in a tiny shop on Elm Street.","{As a child}, I [have:watched] him work for hours, holding my breath so the tiny screws wouldn't fly away.","{Since his death}, my mother [has:opened] the shop every Saturday.","{In the past few months}, I [have:learned] to replace a battery and a strap.","{It's the first time} I [have:worked] with my hands, and I finally understand his silence."],"pt":["Meu pai nos deixou no inverno passado. Por quarenta anos, ele consertou relógios numa lojinha na Elm Street.","Quando eu era criança, ficava horas olhando ele trabalhar, prendendo a respiração para os parafusinhos não voarem.","Desde a morte dele, minha mãe abre a loja todo sábado.","Nos últimos meses, aprendi a trocar uma bateria e uma pulseira.","É a primeira vez que trabalho com as mãos, e finalmente entendo o silêncio dele."],"spots":[{"use":"ps-ended","clue":"My father left us last winter","tl":"his life (over)","why":"Her father has died, so his working life is over: past simple, even with for forty years.","whyPt":"O pai já morreu: a vida de trabalho dele acabou. Past simple, mesmo com for forty years.","pt":"consertou"},{"use":"ps-context","clue":"As a child","tl":"childhood","why":"As a child = when the writer was little, a time that is over: past simple.","whyPt":"As a child (quando eu era criança) = um tempo que já acabou: past simple. Em português: \"ficava olhando\".","pt":"ficava olhando"},{"use":"pp-since","clue":"Since his death","why":"From his death up to now, and she still does it: since + present perfect. The mother is alive and her time is still open.","whyPt":"Da morte dele até agora, e ela continua: since + present perfect. A mãe está viva, o tempo dela continua. Em português: \"abre\" (presente!).","pt":"abre (desde a morte dele)"},{"use":"pp-period","clue":"In the past few months","tl":"the past few months","why":"In the past few months = the months up to now: present perfect.","whyPt":"In the past few months (nos últimos meses) = os meses até hoje: present perfect.","pt":"aprendi"},{"use":"pp-exp","clue":"It's the first time","tl":"first time up to now","why":"It's the first time… = the first time in my life up to now: present perfect.","whyPt":"\"É a primeira vez que…\" pede present perfect, mesmo com o presente em português (trabalho).","pt":"trabalho"}],"w":{"left us":"deixar-nos (morrer)","repaired":"consertar","watches":"relógios (de pulso)","watched":"observar, olhar","holding my breath":"prendendo a respiração","screws":"parafusos","opened":"abrir","learned":"aprender","replace":"trocar, substituir","strap":"pulseira","worked":"trabalhar","silence":"silêncio"}},{"id":"b2-30","kind":"text","frame":"Graduation speech","framePt":"Discurso de formatura","title":"Four years, one lasagna","titlePt":"Quatro anos, uma lasanha","body":["{Four years ago}, most of us [have:arrived] here knowing nobody.","{Since then}, we [have:survived] exams, heartbreak and the cafeteria's lasagna.","I [have:changed] my major three times {in my first year} alone.","{In these four years}, I [have:learned] more from all of you than from any textbook.","And to Professor Adeyemi, who [has:passed] away {in March}: thank you for believing in us."],"pt":["Há quatro anos, a maioria de nós chegou aqui sem conhecer ninguém.","Desde então, sobrevivemos a provas, corações partidos e à lasanha do refeitório.","Eu mudei de curso três vezes só no meu primeiro ano.","Nestes quatro anos, aprendi mais com todos vocês do que com qualquer livro.","E ao professor Adeyemi, que faleceu em março: obrigado por acreditar em nós."],"spots":[{"use":"ps-time","clue":"Four years ago","why":"Ago points to a finished moment: past simple.","whyPt":"Aqui \"há quatro anos\" = ago (quando chegamos): past simple.","pt":"chegou"},{"use":"pp-since","clue":"Since then","why":"From that first day up to now: since + present perfect.","whyPt":"Daquele primeiro dia até agora: since + present perfect. Em português: \"desde então, sobrevivemos\".","pt":"sobrevivemos (desde então)"},{"use":"ps-time","clue":"in my first year","why":"My first year is a finished time: past simple.","whyPt":"In my first year (no meu primeiro ano) = um tempo terminado: past simple.","pt":"mudei"},{"use":"pp-period","clue":"In these four years","tl":"these four years","why":"In these four years = the period that reaches today, graduation day: present perfect.","whyPt":"In these four years (nestes quatro anos) = o período que chega até hoje, o dia da formatura: present perfect.","pt":"aprendi"},{"use":"ps-time","clue":"in March","why":"In March is a finished time: past simple.","whyPt":"In March (em março) é um tempo terminado: past simple.","pt":"faleceu"}],"w":{"arrived":"chegar","survived":"sobreviver","heartbreak":"coração partido","cafeteria":"refeitório","changed":"mudar","major":"curso, área principal (na faculdade)","learned":"aprender","textbook":"livro didático","passed":"falecer (pass away)","believing":"acreditar"}}]},"build":{"A2":[{"id":"a2-s01","en":"I [have] [lived] here [for] three years.","pt":"Moro aqui há três anos.","use":"pp-since","tl":"for three years","traps":["live","ago"],"why":"I still live here: for + a period up to now takes the present perfect.","whyPt":"Eu ainda moro aqui. Em português usamos o presente (moro… há três anos); em inglês, have + particípio com for."},{"id":"a2-s02","en":"[Have] [you] ever [been] to London?","pt":"Você já foi a Londres?","use":"pp-exp","traps":["did","went"],"why":"Ever = at any time in your life up to now: a life experience, so the present perfect.","whyPt":"\"Você já foi…?\" pergunta sobre a vida toda até agora: Have you ever been…? (been, não went)."},{"id":"a2-s03","en":"We [moved] here two years [ago].","pt":"Nós nos mudamos para cá há dois anos.","use":"ps-time","tl":"two years ago","traps":["have","for"],"why":"Ago points to a finished moment in the past: past simple.","whyPt":"Aqui \"há dois anos\" = ago (um momento terminado), então past simple: moved."},{"id":"a2-s04","en":"I [haven't] [seen] Tom [since] Monday.","pt":"Não vejo o Tom desde segunda-feira.","use":"pp-since","tl":"since Monday","traps":["didn't","saw"],"why":"From Monday up to now, no meeting: since + present perfect, in the negative.","whyPt":"Português usa o presente (não vejo… desde); inglês usa haven't + particípio (seen)."},{"id":"a2-s05","en":"[Did] you [watch] the game last night?","pt":"Você assistiu ao jogo ontem à noite?","use":"ps-time","tl":"last night","traps":["have","watched"],"why":"Last night is over: past simple. In a question, did + the base form (watch).","whyPt":"Ontem à noite já terminou: Did you watch…? Depois de did o verbo volta à forma base."},{"id":"a2-s06","en":"She [has] [worked] at the bank [since] 2020.","pt":"Ela trabalha no banco desde 2020.","use":"pp-since","tl":"since 2020","traps":["works","for"],"why":"She still works there, starting in 2020: since + present perfect.","whyPt":"\"Trabalha… desde\" fica no presente em português, mas em inglês é has worked since."},{"id":"a2-s07","en":"I [didn't] [go] to school yesterday.","pt":"Eu não fui à escola ontem.","use":"ps-time","tl":"yesterday","traps":["haven't","went"],"why":"Yesterday is finished time: past simple. In the negative, didn't + base form (go).","whyPt":"Ontem = tempo terminado: didn't go (nunca didn't went)."},{"id":"a2-s08","en":"How long [have] [you] [known] Anna?","pt":"Há quanto tempo você conhece a Anna?","use":"pp-since","tl":"still true now","traps":["do","know"],"why":"You still know her: How long…? about a situation up to now takes the present perfect.","whyPt":"\"Há quanto tempo você conhece…?\" não é do you know: em inglês é How long have you known…?"},{"id":"a2-s09","en":"It [rained] a lot [last] week.","pt":"Choveu muito na semana passada.","use":"ps-time","tl":"last week","traps":["has","rain"],"why":"Last week is over: past simple.","whyPt":"Semana passada já terminou: past simple (rained)."},{"id":"a2-s10","en":"My parents [have] [been] married [for] twenty years.","pt":"Meus pais são casados há vinte anos.","use":"pp-since","tl":"for twenty years","traps":["are","ago"],"why":"They are still married: for + a period up to now, present perfect.","whyPt":"Em português: \"são casados há vinte anos\" (presente). Em inglês: have been married for twenty years."},{"id":"a2-s11","en":"I [have] never [eaten] sushi.","pt":"Eu nunca comi sushi.","use":"pp-exp","traps":["ate","did"],"why":"Never = at no time in my life up to now: a life experience, present perfect.","whyPt":"\"Nunca comi\" fala da vida toda até agora: I have never eaten (eaten, não ate)."},{"id":"a2-s12","en":"When [did] [you] [arrive]?","pt":"Quando você chegou?","use":"ps-time","traps":["have","arrived"],"why":"When…? asks for a finished moment: always past simple.","whyPt":"Com When…? use sempre o past simple: When did you arrive? (nunca When have you…)."},{"id":"a2-s13","en":"Sam [has] [visited] Paris three times.","pt":"O Sam já visitou Paris três vezes.","use":"pp-exp","tl":"three times","traps":["visits","did"],"why":"Three times so far in his life, with no time given: present perfect.","whyPt":"Quantas vezes até agora, sem dizer quando: has visited."},{"id":"a2-s14","en":"I [lost] my phone two days [ago].","pt":"Perdi meu celular há dois dias.","use":"ps-time","tl":"two days ago","traps":["have","since"],"why":"Two days ago is a finished moment: past simple.","whyPt":"\"Há dois dias\" aqui é ago (quando aconteceu): past simple (lost)."},{"id":"a2-s15","en":"They [have] never [played] tennis.","pt":"Eles nunca jogaram tênis.","use":"pp-exp","traps":["didn't","plays"],"why":"Never in their lives up to now: present perfect.","whyPt":"Nunca na vida até agora: have never played. Não junte didn't com never."},{"id":"a2-s16","en":"I [lived] in Rome [for] two years.","pt":"Morei em Roma por dois anos.","use":"ps-ended","tl":"over now","traps":["live","since"],"why":"I don't live there now: a finished situation, so past simple even with for.","whyPt":"\"Morei\": não moro mais lá. Situação terminada = past simple, mesmo com for."},{"id":"a2-s17","en":"We [didn't] [have] class last Friday.","pt":"Não tivemos aula na sexta passada.","use":"ps-time","tl":"last Friday","traps":["haven't","had"],"why":"Last Friday is over: past simple, didn't + base form.","whyPt":"Sexta passada já terminou: didn't have (nunca didn't had)."},{"id":"a2-s18","en":"How many countries [have] [you] [visited]?","pt":"Quantos países você já visitou?","use":"pp-exp","tl":"in your life so far","traps":["did","visits"],"why":"How many… in your life up to now: present perfect.","whyPt":"Quantos até agora, na vida toda: have you visited."},{"id":"a2-s19","en":"The movie [started] [at] eight.","pt":"O filme começou às oito.","use":"ps-time","tl":"at eight","traps":["has","start"],"why":"At eight is a finished moment: past simple.","whyPt":"Às oito = um momento que já passou: started."},{"id":"a2-s20","en":"He [has] [had] a cold [since] Sunday.","pt":"Ele está resfriado desde domingo.","use":"pp-since","tl":"since Sunday","traps":["is","for"],"why":"He is still ill, starting on Sunday: since + present perfect (has had).","whyPt":"\"Está resfriado desde domingo\": em inglês, has had a cold since Sunday."},{"id":"a2-s21","en":"I [have] [drunk] three coffees so [far] today.","pt":"Já tomei três cafés hoje.","use":"pp-period","tl":"so far today","traps":["drank","did"],"why":"So far today = from this morning up to now, and the day isn't over: present perfect.","whyPt":"\"Já… hoje\" (so far today): o dia ainda não acabou, então have drunk (drink – drank – drunk)."},{"id":"a2-s22","en":"We [went] to the beach [and] [swam] in the sea.","pt":"Fomos à praia e nadamos no mar.","use":"ps-story","tl":"events in order","traps":["have","swum"],"why":"A little story: one thing after the other, all finished. Past simple (went, swam).","whyPt":"Uma pequena história, um fato depois do outro: past simple (went, swam — swim – swam – swum)."},{"id":"a2-s23","en":"My grandpa [drove] a taxi [for] thirty years.","pt":"Meu avô dirigiu táxi por trinta anos.","use":"ps-ended","tl":"over now","traps":["has","since"],"why":"He doesn't drive a taxi now: a finished situation, so past simple even with for.","whyPt":"\"Dirigiu\": isso já acabou. Situação terminada = past simple (drove), mesmo com for."},{"id":"a2-s24","en":"[Did] [you] [like] the movie?","pt":"Você gostou do filme? (Vocês viram o filme juntos ontem.)","use":"ps-context","tl":"that movie","traps":["have","liked"],"why":"We both know which movie and when we saw it: it's over, so past simple. Did + base form (like).","whyPt":"Os dois sabem de qual filme se trata e quando foi: já terminou, então Did you like…? (depois de did, like)."},{"id":"a2-s25","en":"[Has] [she] ever [seen] snow?","pt":"Ela já viu neve?","use":"pp-exp","traps":["did","saw"],"why":"Ever = at any time in her life up to now: present perfect with the participle (seen).","whyPt":"\"Ela já…?\" sobre a vida toda: Has she ever seen…? (see – saw – seen)."},{"id":"a2-s26","en":"We [didn't] [see] the sun [last] week.","pt":"Não vimos o sol na semana passada.","use":"ps-time","tl":"last week","traps":["haven't","saw"],"why":"Last week is over: past simple. In the negative, didn't + base form (see).","whyPt":"Semana passada já terminou: didn't see (nunca didn't saw)."},{"id":"a2-s27","en":"It [hasn't] [rained] [since] March.","pt":"Não chove desde março.","use":"pp-since","tl":"since March","traps":["didn't","for"],"why":"From March up to now, no rain: since + present perfect in the negative.","whyPt":"\"Não chove desde março\" está no presente em português; em inglês, hasn't rained since March."},{"id":"a2-s28","en":"We [have] [had] two tests so [far] this month.","pt":"Já tivemos duas provas este mês.","use":"pp-period","tl":"so far this month","traps":["has","did"],"why":"So far this month = up to now, and the month isn't over: present perfect (have had).","whyPt":"\"Até agora, este mês\": o mês não acabou, então have had."},{"id":"a2-s29","en":"What [did] [you] [do] last weekend?","pt":"O que você fez no fim de semana passado?","use":"ps-time","tl":"last weekend","traps":["have","done"],"why":"Last weekend is over: past simple. In a question, did + base form (do).","whyPt":"Fim de semana passado = tempo terminado: What did you do…? (nunca What have you done last weekend)."},{"id":"a2-s30","en":"My brother [has] [broken] his arm twice.","pt":"Meu irmão já quebrou o braço duas vezes.","use":"pp-exp","tl":"twice so far","traps":["broke","did"],"why":"Twice in his life up to now, with no time given: present perfect (has broken).","whyPt":"Quantas vezes na vida até agora, sem dizer quando: has broken (break – broke – broken)."},{"id":"a2-s31","en":"You [have] [grown] so much!","pt":"Você cresceu tanto! (Você vê seu sobrinho depois de um ano.)","use":"pp-news","tl":"change: taller now","traps":["grew","did"],"why":"A change up to now, and you can see the result (he's taller now). No time is given: present perfect. Grow – grew – grown.","whyPt":"Uma mudança até agora, com o resultado na sua frente (ele está mais alto). Nenhum tempo é dito: have grown. Em português fica no pretérito: \"cresceu\"."},{"id":"a2-s32","en":"Someone [has] [broken] the window!","pt":"Alguém quebrou a janela! (Você está vendo os cacos agora.)","use":"pp-news","tl":"news: broken now","traps":["broke","did"],"why":"News with a result you can see now (the broken window), and no time: present perfect. Break – broke – broken.","whyPt":"Uma novidade com o resultado na sua frente (a janela quebrada) e sem tempo dito: has broken. Em português fica no pretérito: \"quebrou\"."},{"id":"a2-s33","en":"I [have] [sent] ten messages so [far] today.","pt":"Já mandei dez mensagens hoje.","use":"pp-period","tl":"so far today","traps":["has","sended"],"why":"So far today = up to now, and the day isn't over: present perfect. Send is irregular: send – sent – sent.","whyPt":"\"Até agora, hoje\": o dia não acabou, então have sent. Send é irregular: sent (nunca \"sended\")."},{"id":"a2-s34","en":"We [haven't] [had] any homework so far this week.","pt":"Até agora não tivemos nenhuma lição de casa esta semana.","use":"pp-period","tl":"so far this week","traps":["didn't","has"],"why":"So far this week: the week isn't over, so present perfect in the negative (haven't had).","whyPt":"\"Até agora, esta semana\": a semana não acabou, então haven't had (we → have)."},{"id":"a2-s35","en":"I [woke] up late [so] I [missed] the bus.","pt":"Acordei tarde, então perdi o ônibus.","use":"ps-story","tl":"one thing, then the next","traps":["has","wake"],"why":"A little story: one thing happened, then the next, at a finished time. Past simple for both (woke, missed).","whyPt":"Uma pequena história, um fato depois do outro, num tempo que acabou: pretérito nos dois (woke, missed)."},{"id":"a2-s36","en":"Where [did] [you] [buy] that jacket?","pt":"Onde você comprou essa jaqueta?","use":"ps-context","tl":"when you bought it","traps":["have","bought"],"why":"The jacket is here, so you bought it at one finished moment: past simple. Where did you + base form (buy).","whyPt":"A compra foi num momento que já passou (a jaqueta já está aqui): Where did you buy…? (nunca Where have you bought…?)."}],"B1":[{"id":"b1-s01","en":"How long [have] [you] [worked] [for] this company?","pt":"Há quanto tempo você trabalha nesta empresa?","use":"pp-since","tl":"still true now","traps":["do","work"],"why":"You still work there: How long…? about a situation that continues up to now takes the present perfect.","whyPt":"\"Há quanto tempo você trabalha…?\" fica no presente em português, mas em inglês é How long have you worked…? — nunca How long do you work."},{"id":"b1-s02","en":"I [haven't] [spoken] to my brother [since] Christmas.","pt":"Não falo com meu irmão desde o Natal.","use":"pp-since","tl":"since Christmas","traps":["didn't","spoke"],"why":"From Christmas up to now, no conversation: since + present perfect in the negative (spoken).","whyPt":"\"Não falo… desde\" está no presente em português; em inglês, haven't spoken since."},{"id":"b1-s03","en":"When [did] [you] [start] learning English?","pt":"Quando você começou a aprender inglês?","use":"ps-time","traps":["have","started"],"why":"When…? asks for a finished moment in the past: past simple, did + base form.","whyPt":"Com When…? o inglês usa sempre o past simple: When did you start…? (nunca When have you started)."},{"id":"b1-s04","en":"[Have] [you] ever [ridden] a horse?","pt":"Você já andou a cavalo?","use":"pp-exp","traps":["did","rode"],"why":"Ever = at any time in your life up to now: present perfect with the past participle (ridden).","whyPt":"\"Você já…?\" sobre a vida toda: Have you ever ridden…? (ride – rode – ridden)."},{"id":"b1-s05","en":"We [have] [sold] fifty tickets so [far].","pt":"Até agora vendemos cinquenta ingressos.","use":"pp-period","tl":"so far","traps":["did","sells"],"why":"So far = up to now, and more sales can still come: present perfect.","whyPt":"\"Até agora\" (so far) liga o passado ao presente: have sold."},{"id":"b1-s06","en":"My grandfather [worked] as a teacher [for] forty years.","pt":"Meu avô trabalhou como professor por quarenta anos.","use":"ps-ended","tl":"over now","traps":["has","since"],"why":"He doesn't teach now: a finished situation, so past simple even with for.","whyPt":"\"Trabalhou\": isso já acabou. Situação terminada = past simple, mesmo com for."},{"id":"b1-s07","en":"She [hasn't] [eaten] anything [since] breakfast.","pt":"Ela não come nada desde o café da manhã.","use":"pp-since","tl":"since breakfast","traps":["didn't","ate"],"why":"From breakfast up to now, nothing: since + present perfect (hasn't eaten).","whyPt":"Português: \"não come nada desde\" (presente). Inglês: hasn't eaten anything since."},{"id":"b1-s08","en":"[Did] [you] [go] out [last] weekend?","pt":"Você saiu no fim de semana passado?","use":"ps-time","tl":"last weekend","traps":["have","went"],"why":"Last weekend is over: past simple. In a question, did + base form (go).","whyPt":"Fim de semana passado já terminou: Did you go out…? (depois de did, go — não went)."},{"id":"b1-s09","en":"I [have] [had] this phone [for] three years.","pt":"Tenho este celular há três anos.","use":"pp-since","tl":"for three years","traps":["has","since"],"why":"I still have it: for + a period up to now, present perfect (have had).","whyPt":"\"Tenho… há três anos\": em inglês, have had… for three years (for + período; since + início)."},{"id":"b1-s10","en":"They [didn't] [invite] us to the party.","pt":"Eles não nos convidaram para a festa.","use":"ps-context","tl":"that party","traps":["wasn't","invited"],"why":"We both know which party, and it's over: past simple, didn't + base form (invite).","whyPt":"A festa já aconteceu (o contexto mostra quando): didn't invite — nunca didn't invited."},{"id":"b1-s11","en":"How many times [have] [you] [been] to New York?","pt":"Quantas vezes você já foi a Nova York?","use":"pp-exp","tl":"in your life so far","traps":["did","went"],"why":"How many times… in your life up to now: present perfect. Been = gone and come back.","whyPt":"Quantas vezes até agora: have you been (been to = ir e voltar)."},{"id":"b1-s12","en":"I [met] my best friend [when] I was ten.","pt":"Conheci meu melhor amigo quando eu tinha dez anos.","use":"ps-time","tl":"when I was ten","traps":["have","since"],"why":"When I was ten = a finished time: past simple.","whyPt":"\"Quando eu tinha dez anos\" é um tempo terminado: met."},{"id":"b1-s13","en":"We [haven't] [seen] each other [for] months.","pt":"Não nos vemos há meses.","use":"pp-since","tl":"for months","traps":["didn't","ago"],"why":"For months, up to now: present perfect in the negative.","whyPt":"Aqui \"há meses\" = for months (até agora), não ago: haven't seen each other for months."},{"id":"b1-s14","en":"The city museum [opened] [in] 1990.","pt":"O museu da cidade abriu em 1990.","use":"ps-time","tl":"in 1990","traps":["has","since"],"why":"In 1990 is a finished time: past simple.","whyPt":"Em 1990 = data terminada: opened in 1990."},{"id":"b1-s15","en":"How long [did] [you] [live] in Lisbon?","pt":"Quanto tempo você morou em Lisboa?","use":"ps-ended","tl":"over now","traps":["have","lived"],"why":"You don't live there now: How long…? about a finished situation takes the past simple.","whyPt":"\"Morou\": já não mora lá. How long did you live…? Se ainda morasse: How long have you lived…?"},{"id":"b1-s16","en":"Ana [has] [lived] in Berlin [since] she was a student.","pt":"A Ana mora em Berlim desde que era estudante.","use":"pp-since","tl":"since she was a student","traps":["lives","for"],"why":"She still lives there, starting when she was a student: since + present perfect.","whyPt":"\"Mora… desde que\" (presente em português) = has lived… since."},{"id":"b1-s17","en":"We [arrived] at the hotel and [went] straight to bed.","pt":"Chegamos ao hotel e fomos direto para a cama.","use":"ps-story","tl":"events in order","traps":["have","gone"],"why":"Two events one after the other, in a story about the past: past simple.","whyPt":"Uma história contada em ordem: arrived… went."},{"id":"b1-s18","en":"[Have] [you] ever [lost] your passport?","pt":"Você já perdeu seu passaporte?","use":"pp-exp","traps":["did","was"],"why":"Ever = at any time in your life: present perfect.","whyPt":"\"Você já…?\" sobre a vida toda: Have you ever lost…?"},{"id":"b1-s19","en":"I [didn't] [know] the answer so I [asked] my teacher.","pt":"Eu não sabia a resposta, então perguntei ao meu professor.","use":"ps-story","tl":"events in order","traps":["haven't","knew"],"why":"A short story about a finished moment: past simple, didn't + base form (know).","whyPt":"História no passado: didn't know (nunca didn't knew)… asked."},{"id":"b1-s20","en":"This is the first time I [have] [tried] Thai food.","pt":"É a primeira vez que eu provo comida tailandesa.","use":"pp-exp","tl":"first time up to now","traps":["try","was"],"why":"This is the first time… = the first time in my life up to now: present perfect.","whyPt":"\"É a primeira vez que eu provo\" usa o presente em português; em inglês: the first time I have tried."},{"id":"b1-s21","en":"[Did] [you] [take] many photos in Peru?","pt":"Você tirou muitas fotos no Peru? (Seu amigo acabou de voltar da viagem.)","use":"ps-context","tl":"that trip","traps":["have","took"],"why":"The trip is over and we both know when it was: past simple, did + base form (take).","whyPt":"A viagem já acabou e os dois sabem quando foi: Did you take…? (depois de did, take)."},{"id":"b1-s22","en":"So far this year [I] [have] [read] twelve books.","pt":"Este ano já li doze livros.","use":"pp-period","tl":"so far this year","traps":["was","reading"],"why":"So far this year = up to now, and the year isn't over: present perfect (have read).","whyPt":"\"Até agora, este ano\": o ano continua, então have read (read – read – read, mas pronunciado \"red\")."},{"id":"b1-s23","en":"I [opened] the door [and] [saw] a huge dog.","pt":"Abri a porta e vi um cachorro enorme.","use":"ps-story","tl":"events in order","traps":["have","seen"],"why":"Two events, one after the other, in a story: past simple (opened, saw).","whyPt":"História em sequência: opened… saw (see – saw – seen)."},{"id":"b1-s24","en":"She [played] in a rock band [until] she [was] thirty.","pt":"Ela tocou numa banda de rock até os trinta anos.","use":"ps-ended","tl":"until she was thirty","traps":["has","since"],"why":"Until she was thirty = it stopped then: a finished situation, past simple.","whyPt":"\"Até os trinta anos\" mostra que acabou: played… until she was thirty."},{"id":"b1-s25","en":"I [have] never [been] [on] a plane.","pt":"Eu nunca andei de avião.","use":"pp-exp","traps":["was","went"],"why":"Never in my life up to now: present perfect (have never been).","whyPt":"\"Nunca andei\" fala da vida toda até agora: I have never been on a plane."},{"id":"b1-s26","en":"How long [has] [she] [been] your teacher?","pt":"Há quanto tempo ela é sua professora?","use":"pp-since","tl":"still true now","traps":["is","does"],"why":"She is still your teacher: How long…? up to now takes the present perfect.","whyPt":"\"Há quanto tempo ela é…?\" não é How long is she…: em inglês, How long has she been…?"},{"id":"b1-s27","en":"Why [didn't] [you] [come] to the party last night?","pt":"Por que você não veio à festa ontem à noite?","use":"ps-time","tl":"last night","traps":["haven't","came"],"why":"Last night is over: past simple, didn't + base form (come).","whyPt":"Ontem à noite = tempo terminado: Why didn't you come…? (nunca didn't came)."},{"id":"b1-s28","en":"Prices [have] [gone] [up] a lot over the past year.","pt":"Os preços subiram muito no último ano.","use":"pp-period","tl":"the past year","traps":["went","since"],"why":"Over the past year = the twelve months up to now: present perfect (have gone up).","whyPt":"\"No último ano\" chega até hoje (over the past year): have gone up. \"No ano passado\" seria last year → went up."},{"id":"b1-s29","en":"We [got] married [in] 2018.","pt":"Nós nos casamos em 2018.","use":"ps-time","tl":"in 2018","traps":["have","since"],"why":"In 2018 is a finished time: past simple (got married).","whyPt":"Em 2018 = data terminada: got married."},{"id":"b1-s30","en":"They [have] [known] each other [since] school.","pt":"Eles se conhecem desde a escola.","use":"pp-since","tl":"since school","traps":["know","for"],"why":"They still know each other, starting at school: since + present perfect (have known).","whyPt":"\"Se conhecem desde\" (presente em português) = have known each other since."},{"id":"b1-s31","en":"The city [has] [opened] a new library!","pt":"A cidade abriu uma biblioteca nova! (É a notícia do dia.)","use":"pp-news","tl":"news: open now","traps":["opens","was"],"why":"This is news: it happened recently and the result matters now (the library is open). No time is given: present perfect.","whyPt":"É uma notícia: aconteceu há pouco e o resultado importa agora (a biblioteca está aberta). Nenhum tempo é dito: has opened. Em português fica no pretérito: \"abriu\"."},{"id":"b1-s32","en":"You [haven't] [changed] a [bit]!","pt":"Você não mudou nada! (Você reencontra uma amiga depois de dez anos.)","use":"pp-news","tl":"no change up to now","traps":["didn't","changes"],"why":"You compare then with now: up to now, no change, and you can see it. No time is given: present perfect in the negative (haven't changed).","whyPt":"Você compara aquela época com agora: até agora, nenhuma mudança, e você está vendo. Nenhum tempo é dito: haven't changed. Em português fica no pretérito: \"não mudou\"."},{"id":"b1-s33","en":"What [did] the doctor [say]?","pt":"O que o médico disse? (Você foi à consulta ontem.)","use":"ps-context","tl":"at the appointment","traps":["has","said"],"why":"We know when: at yesterday's appointment, which is over. Past simple: What did… + base form (say).","whyPt":"Já sabemos quando: na consulta de ontem, que já acabou. What did the doctor say? (nunca \"did… said\")."},{"id":"b1-s34","en":"I [didn't] [understand] the ending of the film.","pt":"Não entendi o final do filme. (Você viu o filme ontem.)","use":"ps-context","tl":"when you watched it","traps":["haven't","understood"],"why":"The time is clear: when you watched the film yesterday. Past simple in the negative: didn't + base form.","whyPt":"O tempo está claro: quando você viu o filme, ontem. Negativa no pretérito: didn't understand (nunca \"didn't understood\")."},{"id":"b1-s35","en":"He [missed] the train [so] he [took] a taxi.","pt":"Ele perdeu o trem, então pegou um táxi.","use":"ps-story","tl":"one thing, then the next","traps":["has","taken"],"why":"A story in order: first he missed the train, then he took a taxi. Past simple for both. Take – took – taken.","whyPt":"Uma história em ordem: primeiro perdeu o trem, depois pegou um táxi. Pretérito nos dois: took (taken é o particípio)."},{"id":"b1-s36","en":"We [heard] a noise [and] [ran] outside.","pt":"Ouvimos um barulho e corremos para fora.","use":"ps-story","tl":"one thing, then the next","traps":["have","run"],"why":"Two events in order at a finished time: past simple. Run – ran – run.","whyPt":"Dois fatos em sequência, num tempo que acabou: pretérito. Run – ran – run: aqui é ran."}],"B2":[{"id":"b2-s01","en":"It's the [first] time I [have] [driven] on the left.","pt":"É a primeira vez que dirijo pela esquerda.","use":"pp-exp","tl":"first time up to now","traps":["drive","drove"],"why":"It's the first time… = the first time in my life up to now: present perfect (have driven).","whyPt":"\"É a primeira vez que dirijo\" vem no presente em português; em inglês, it's the first time I have driven."},{"id":"b2-s02","en":"How long [has] [it] [been] [since] you last [saw] your parents?","pt":"Há quanto tempo você não vê seus pais?","use":"pp-since","tl":"since you last saw them","traps":["did","seen"],"why":"How long has it been since…? measures the time up to now; the last visit itself is a finished moment (saw).","whyPt":"Duas partes: has it been (até agora) + since you last saw (o último encontro, terminado)."},{"id":"b2-s03","en":"I [haven't] [heard] from her [since] she [moved] to Canada.","pt":"Não tenho notícias dela desde que ela se mudou para o Canadá.","use":"pp-since","tl":"since she moved","traps":["didn't","moves"],"why":"No news up to now: haven't heard. The move is the finished starting point: since she moved.","whyPt":"A parte principal vai até agora (haven't heard); depois de since, o momento de início fica no past simple (moved)."},{"id":"b2-s04","en":"My late grandmother [taught] music [for] half a century.","pt":"Minha falecida avó ensinou música por meio século.","use":"ps-ended","tl":"over now","traps":["has","since"],"why":"She has died, so her time is over: past simple, even with for half a century.","whyPt":"Alguém que já morreu não tem mais \"até agora\": taught, mesmo com for."},{"id":"b2-s05","en":"[Have] [you] ever [regretted] not [taking] a job?","pt":"Você já se arrependeu de não ter aceitado um emprego?","use":"pp-exp","traps":["did","took"],"why":"Ever = at any time up to now: present perfect. After not, the -ing form (taking).","whyPt":"\"Você já…?\" = Have you ever…? E depois de regret not vem -ing: not taking."},{"id":"b2-s06","en":"The company [has] [grown] steadily [over] the past five years.","pt":"A empresa cresceu de forma constante nos últimos cinco anos.","use":"pp-period","tl":"the past five years","traps":["grew","since"],"why":"Over the past five years = a period that reaches now: present perfect.","whyPt":"\"Nos últimos cinco anos\" chega até hoje (over the past five years): has grown. Compare: in 2019 → grew."},{"id":"b2-s07","en":"She [left] the band [in] 2015 and [hasn't] [performed] [since].","pt":"Ela saiu da banda em 2015 e não se apresenta desde então.","use":"pp-since","tl":"since 2015","traps":["was","didn't"],"why":"Two times: in 2015 is finished (left); since then, up to now, no shows (hasn't performed).","whyPt":"Em 2015 = terminado (left); \"desde então\" vai até agora (hasn't performed since)."},{"id":"b2-s08","en":"I [lived] in Tokyo [until] last year.","pt":"Morei em Tóquio até o ano passado.","use":"ps-ended","tl":"until last year","traps":["have","since"],"why":"Until last year = it stopped then: a finished situation, past simple.","whyPt":"\"Até o ano passado\" mostra que acabou: lived until last year."},{"id":"b2-s09","en":"How many books [has] [she] [written] so far?","pt":"Quantos livros ela escreveu até agora?","use":"pp-period","tl":"so far","traps":["did","wrote"],"why":"So far = up to now, and she is still writing: present perfect (written).","whyPt":"\"Até agora\" + autora viva que continua escrevendo: has she written."},{"id":"b2-s10","en":"Nobody [has] [lived] in that house [since] the war.","pt":"Ninguém mora naquela casa desde a guerra.","use":"pp-since","tl":"since the war","traps":["lives","ago"],"why":"From the war up to now, the house is empty: since + present perfect.","whyPt":"\"Ninguém mora… desde\" (presente em português) = nobody has lived… since."},{"id":"b2-s11","en":"I [first] [noticed] the problem about a month [ago].","pt":"Notei o problema pela primeira vez há cerca de um mês.","use":"ps-time","tl":"a month ago","traps":["have","since"],"why":"About a month ago = a finished moment: past simple. First goes before the verb.","whyPt":"\"Há cerca de um mês\" aqui é ago (quando): first noticed… ago."},{"id":"b2-s12","en":"[Did] [you] ever [meet] your great-grandparents?","pt":"Você chegou a conhecer seus bisavós? (Eles já faleceram.)","use":"ps-context","tl":"while they were alive","traps":["have","met"],"why":"They have died, so the chance to meet them is over: Did you ever meet…? (past simple).","whyPt":"Com pessoas que já morreram, o tempo terminou: Did you ever meet…? Have you ever met… seria para alguém vivo."},{"id":"b2-s13","en":"This is the third time the printer [has] [broken] [down] this month.","pt":"É a terceira vez este mês que a impressora quebra.","use":"pp-exp","tl":"third time up to now","traps":["broke","did"],"why":"This is the third time… counts up to now: present perfect (has broken down).","whyPt":"\"É a terceira vez que…\" pede present perfect em inglês, mesmo com o presente em português (quebra)."},{"id":"b2-s14","en":"Since when [have] [you] [been] a vegetarian?","pt":"Desde quando você é vegetariano?","use":"pp-since","tl":"since when?","traps":["are","do"],"why":"You still are one: Since when…? asks about a state up to now, present perfect.","whyPt":"\"Desde quando você é…?\" não é Since when are you…: em inglês, Since when have you been…?"},{"id":"b2-s15","en":"The power [went] out so we [lit] some candles and [played] cards.","pt":"A luz acabou, então acendemos velas e jogamos cartas.","use":"ps-story","tl":"events in order","traps":["have","gone"],"why":"A little story, events one after the other: past simple (went, lit, played).","whyPt":"História em sequência: went… lit… played (light – lit – lit)."},{"id":"b2-s16","en":"We [haven't] [had] a proper holiday [in] years.","pt":"Não tiramos férias de verdade há anos.","use":"pp-since","tl":"in years","traps":["didn't","ago"],"why":"In years (= for years) up to now: present perfect in the negative.","whyPt":"\"Há anos\" aqui = in years / for years (até agora), não ago: haven't had… in years."},{"id":"b2-s17","en":"He [was] the club's president for a decade [before] he [retired].","pt":"Ele foi presidente do clube por uma década antes de se aposentar.","use":"ps-ended","tl":"until he retired","traps":["has","been"],"why":"Before he retired = that time ended: past simple, even with for a decade.","whyPt":"\"Antes de se aposentar\" mostra o fim: was… retired."},{"id":"b2-s18","en":"Over the past year I [have] [made] more friends than ever.","pt":"No último ano fiz mais amigos do que nunca.","use":"pp-period","tl":"the past year","traps":["make","was"],"why":"Over the past year = the twelve months up to now: present perfect. (Last year → past simple.)","whyPt":"\"No último ano\" = os últimos doze meses até hoje (over the past year): have made. \"O ano passado\" seria last year → made."},{"id":"b2-s19","en":"It [has] [been] two years [since] we last [spoke].","pt":"Faz dois anos que não nos falamos.","use":"pp-since","tl":"since we last spoke","traps":["is","spoken"],"why":"It has been… since: the time up to now; the last conversation is a finished moment (spoke).","whyPt":"\"Faz dois anos\" = it has been two years (até agora); since we last spoke (momento terminado)."},{"id":"b2-s20","en":"My uncle [lived] in Chile [for] thirty years and [loved] every minute.","pt":"Meu tio morou no Chile por trinta anos e amou cada minuto.","use":"ps-ended","tl":"over now","traps":["has","loves"],"why":"He doesn't live there now: a finished situation, past simple for both verbs.","whyPt":"\"Morou… e amou\": a situação acabou, past simple (lived, loved), mesmo com for."},{"id":"b2-s21","en":"I [last] [saw] him [at] a conference [in] 2019.","pt":"Eu o vi pela última vez numa conferência em 2019.","use":"ps-time","tl":"in 2019","traps":["have","seen"],"why":"In 2019 is a finished time: past simple. Last goes before the verb (last saw).","whyPt":"Em 2019 = tempo terminado: last saw (nunca have seen com uma data)."},{"id":"b2-s22","en":"She [read] the letter twice [and] then [tore] it up.","pt":"Ela leu a carta duas vezes e depois a rasgou.","use":"ps-story","tl":"events in order","traps":["has","torn"],"why":"Events one after the other in a story: past simple (read, tore).","whyPt":"História em sequência: read… tore (tear – tore – torn)."},{"id":"b2-s23","en":"What time [did] the meeting [finish] [yesterday]?","pt":"A que horas a reunião terminou ontem?","use":"ps-time","tl":"yesterday","traps":["has","finished"],"why":"Yesterday is over, and What time…? asks for a moment: past simple, did + base form.","whyPt":"Ontem + \"a que horas\" = um momento terminado: What time did… finish?"},{"id":"b2-s24","en":"Where [were] [you] [when] the lights [went] out?","pt":"Onde você estava quando a luz acabou?","use":"ps-time","tl":"when the lights went out","traps":["have","gone"],"why":"When the lights went out = a finished moment: past simple in both parts.","whyPt":"\"Quando a luz acabou\" marca um momento terminado: were… went (go – went – gone)."},{"id":"b2-s25","en":"So far this year the city [has] [planted] ten thousand trees.","pt":"Este ano, a cidade já plantou dez mil árvores.","use":"pp-period","tl":"so far this year","traps":["did","plants"],"why":"So far this year = up to now, and more trees may come: present perfect.","whyPt":"\"Até agora, este ano\" (so far this year): has planted."},{"id":"b2-s26","en":"[Has] [anyone] ever [told] you that you look like your father?","pt":"Alguém já te disse que você parece com seu pai?","use":"pp-exp","traps":["was","say"],"why":"Ever = at any time in your life up to now: present perfect (has… told).","whyPt":"\"Alguém já…?\" sobre a vida toda: Has anyone ever told you…?"},{"id":"b2-s27","en":"The factory [employed] half the town [until] it [closed] in 2008.","pt":"A fábrica empregou metade da cidade até fechar em 2008.","use":"ps-ended","tl":"until 2008","traps":["has","since"],"why":"Until it closed in 2008 = that situation ended: past simple for both verbs.","whyPt":"\"Até fechar em 2008\" mostra o fim: employed… closed."},{"id":"b2-s28","en":"She [hasn't] [touched] the piano [since] her teacher [passed] away.","pt":"Ela não toca no piano desde que a professora dela faleceu.","use":"pp-since","tl":"since her teacher died","traps":["didn't","passes"],"why":"Up to now, no piano: hasn't touched. Her teacher's death is the finished starting point: since… passed away.","whyPt":"A parte principal vai até agora (hasn't touched); depois de since, o momento de início fica no past simple (passed away)."},{"id":"b2-s29","en":"Is this the first time you [have] [been] to Lisbon?","pt":"É a primeira vez que você vem a Lisboa?","use":"pp-exp","tl":"first time up to now","traps":["are","came"],"why":"Is this the first time…? counts up to now: present perfect (have been).","whyPt":"\"É a primeira vez que você vem\" usa o presente em português; em inglês, the first time you have been."},{"id":"b2-s30","en":"Shakespeare [wrote] nearly forty plays [in] his lifetime.","pt":"Shakespeare escreveu quase quarenta peças durante a vida.","use":"ps-ended","tl":"his lifetime (over)","traps":["has","written"],"why":"Shakespeare died centuries ago: his lifetime is over, so past simple.","whyPt":"Alguém que já morreu não tem mais \"até agora\": wrote (write – wrote – written)."},{"id":"b2-s31","en":"Scientists [have] [discovered] a new species of frog in the Andes.","pt":"Cientistas descobriram uma nova espécie de sapo nos Andes. (Manchete de hoje.)","use":"pp-news","tl":"headline: news now","traps":["discover","were"],"why":"A headline gives news: recent, important now, with no time. Present perfect (have discovered); the details that follow would switch to the past simple.","whyPt":"Uma manchete dá a notícia: recente, importante agora, sem tempo dito: have discovered. Os detalhes que vêm depois passariam para o pretérito."},{"id":"b2-s32","en":"Ten flights [have] [been] [canceled] because of the storm.","pt":"Dez voos foram cancelados por causa da tempestade. (Aviso no aeroporto agora.)","use":"pp-news","tl":"news: canceled now","traps":["were","was"],"why":"An announcement about a result that matters now (the flights won't leave), with no time: present perfect passive (have been canceled).","whyPt":"Um aviso sobre um resultado que importa agora (os voos não vão sair), sem tempo dito: have been canceled. Em português fica no pretérito: \"foram cancelados\"."},{"id":"b2-s33","en":"The bridge [was] [built] [in] the 1930s.","pt":"A ponte foi construída nos anos 1930.","use":"ps-time","tl":"in the 1930s","traps":["has","since"],"why":"In the 1930s is a finished time: past simple passive (was built).","whyPt":"Nos anos 1930 é um tempo terminado: was built (passiva no pretérito)."},{"id":"b2-s34","en":"When [did] [you] [last] [see] a dentist?","pt":"Quando foi a última vez que você foi ao dentista?","use":"ps-time","tl":"the last time","traps":["have","seen"],"why":"When asks for a point in finished time, so it takes the past simple: When did you last see…? (never When have you…).","whyPt":"When pede um momento no passado: When did you last see…? Com when, nunca present perfect."},{"id":"b2-s35","en":"[Did] [you] [manage] to get tickets?","pt":"Você conseguiu ingressos? (As vendas fecharam ontem.)","use":"ps-context","tl":"when sales were open","traps":["have","managed"],"why":"The sales are over (they closed yesterday), so the time is clear and finished: past simple (Did you manage…?).","whyPt":"As vendas já acabaram (fecharam ontem): tempo claro e terminado, Did you manage…? (nunca \"did… managed\")."},{"id":"b2-s36","en":"The audience [fell] silent [as] the curtain [rose] and the orchestra [began] to play.","pt":"A plateia ficou em silêncio quando a cortina subiu e a orquestra começou a tocar.","use":"ps-story","tl":"events in order","traps":["has","risen","begun"],"why":"A scene told in order at a finished time: past simple throughout. Rise – rose – risen, begin – began – begun.","whyPt":"Uma cena contada em ordem, num tempo que acabou: pretérito em tudo. Rise – rose – risen, begin – began – begun."}]},"guide":{"ui":{"tip":["Portuguese uses the pretérito for almost any past action. English first asks: <b>is the time finished?<\/b> Finished → past simple. Still connected to now → present perfect.","O português usa o pretérito para quase todo passado. O inglês pergunta antes: <b>o tempo terminou?<\/b> Terminou → past simple. Ainda ligado ao agora → present perfect."],"stepsTitle":["Step by step","Passo a passo"],"stepsLead":["When you're not sure, go down this list and stop at the first yes. Tap an answer to see that use.","Na dúvida, desça a lista e pare no primeiro sim. Toque na resposta para ver aquele uso."],"mapTitle":["Portuguese → English","Português → inglês"],"mapLead":["The Portuguese words that cause most mistakes, and what each one becomes in English.","As palavras do português que mais causam erros, e o que cada uma vira em inglês."],"curTitle":["For the curious","Para os curiosos"],"navMap":["PT → EN","PT → EN"],"navCur":["Curious?","Curiosidades"]},"steps":[{"use":"ps-time","q":"Is there a finished time word?","qPt":"Tem uma palavra de tempo terminado?","hint":"yesterday · last week · two days ago · in 2019 · on Monday · When…?","hintPt":"yesterday · last week · two days ago · in 2019 · on Monday · When…?"},{"use":"ps-context","q":"Do we already know when, from the conversation?","qPt":"Já sabemos quando, pela conversa?","hint":"the party we were talking about · that trip · when I was there","hintPt":"a festa de que falávamos · aquela viagem · quando eu estava lá"},{"use":"ps-ended","q":"Is the person or the situation over?","qPt":"A pessoa ou a situação já acabou?","hint":"someone who has died · a job you left · until last year · for ten years, but not now","hintPt":"alguém que já morreu · um emprego que você deixou · até o ano passado · por dez anos, mas não mais"},{"use":"ps-story","q":"Is it a story, one event after another?","qPt":"É uma história, um fato depois do outro?","hint":"we arrived, had dinner and went to bed","hintPt":"chegamos, jantamos e fomos dormir"},{"use":"pp-since","q":"Is it still true now?","qPt":"Ainda é verdade agora?","hint":"for three years · since 2019 · How long…? (Portuguese often uses the present here)","hintPt":"for three years · since 2019 · How long…? (aqui o português usa o presente)"},{"use":"pp-exp","q":"Is it about your life up to now, with no time given?","qPt":"É sobre a sua vida até agora, sem dizer quando?","hint":"ever · never · three times · It's the first time…","hintPt":"ever · never · three times · It's the first time…"},{"use":"pp-period","q":"Is the period still open?","qPt":"O período ainda não terminou?","hint":"so far · over the past year · this year so far","hintPt":"so far · over the past year · this year so far"},{"use":"pp-news","q":"Is it news, a fresh change you can see now?","qPt":"É uma notícia, uma mudança recente que se vê agora?","hint":"Good news! · a headline · the result is here now","hintPt":"Good news! · uma manchete · o resultado está aí agora"}],"map":[{"pt":"há…","lead":"Two meanings: up to now, or a finished moment.","leadPt":"Dois sentidos: até agora, ou um momento terminado.","items":[{"en":"for","use":"pp-since","note":"still true: up to now","notePt":"ainda é verdade: até agora","s":"a2-s01"},{"en":"ago","use":"ps-time","note":"a finished moment","notePt":"um momento terminado","s":"a2-s03"}]},{"pt":"desde","lead":"Portuguese keeps the present; English needs have / has.","leadPt":"O português fica no presente; o inglês precisa de have / has.","items":[{"en":"have / has … since","use":"pp-since","note":"trabalha desde → has worked since","notePt":"trabalha desde → has worked since","s":"a2-s06"},{"en":"since + past simple","use":"pp-since","note":"desde que + a starting moment","notePt":"desde que + o momento de início","s":"b2-s03"}]},{"pt":"há quanto tempo…? / quanto tempo…?","lead":"Still going, or over?","leadPt":"Ainda continua, ou já acabou?","items":[{"en":"How long have you…?","use":"pp-since","note":"still true (never How long do you…?)","notePt":"ainda é verdade (nunca How long do you…?)","s":"a2-s08"},{"en":"How long did you…?","use":"ps-ended","note":"it's over","notePt":"já acabou","s":"b1-s15"}]},{"pt":"já","lead":"Often it has no English word at all.","leadPt":"Muitas vezes não vira palavra nenhuma em inglês.","items":[{"en":"Have you ever…?","use":"pp-exp","note":"in questions about your life","notePt":"em perguntas sobre a vida","s":"a2-s02"},{"en":"(nothing)","enPt":"(nada)","use":"pp-exp","note":"experience: já visitou → has visited","notePt":"experiência: já visitou → has visited","s":"a2-s13"},{"en":"already","use":"pp-news","note":"earlier than expected (British: I've already eaten; American also: I already ate)","notePt":"antes do esperado (britânico: I've already eaten; americano também: I already ate)","ex":"I've already eaten.","exPt":"Eu já comi."}]},{"pt":"faz … (que)","lead":"Like há: up to now, or a finished moment.","leadPt":"Como o há: até agora, ou um momento terminado.","items":[{"en":"It has been … since","use":"pp-since","note":"faz dois anos que não… → up to now","notePt":"faz dois anos que não… → até agora","s":"b2-s19"},{"en":"ago","use":"ps-time","note":"faz dois anos (= há dois anos) → when it happened","notePt":"faz dois anos (= há dois anos) → quando aconteceu","ex":"He moved to Canada two years ago.","exPt":"Ele se mudou para o Canadá faz dois anos."}]},{"pt":"nunca","lead":"Is the person's time still open?","leadPt":"O tempo da pessoa ainda está aberto?","items":[{"en":"have / has never","use":"pp-exp","note":"your life up to now","notePt":"a vida até agora","s":"a2-s11"},{"en":"never + past simple","use":"ps-ended","note":"someone who has died, a time that is over","notePt":"alguém que já morreu, um tempo que acabou","ex":"My grandfather never flew on a plane.","exPt":"Meu avô (que já faleceu) nunca andou de avião."}]},{"pt":"até agora / nos últimos… / no ano passado","lead":"An open period or a closed one?","leadPt":"Um período aberto ou fechado?","items":[{"en":"so far","use":"pp-period","note":"até agora: still open","notePt":"até agora: ainda aberto","s":"b1-s05"},{"en":"over the past…","use":"pp-period","note":"nos últimos cinco anos: reaches today","notePt":"nos últimos cinco anos: chega até hoje","s":"b2-s06"},{"en":"last year","use":"ps-time","note":"no ano passado: closed","notePt":"no ano passado: fechado","ex":"I made a lot of friends last year.","exPt":"Fiz muitos amigos no ano passado."}]},{"pt":"o pretérito (fui, comi, visitei…)","lead":"One Portuguese form, two English ones: it depends on the time.","leadPt":"Uma forma em português, duas em inglês: depende do tempo.","items":[{"en":"past simple","use":"ps-time","note":"with a finished time","notePt":"com um tempo terminado","s":"a2-s05"},{"en":"present perfect","use":"pp-exp","note":"your life up to now, no time given","notePt":"a vida até agora, sem dizer quando","s":"a2-s18"}]},{"pt":"tenho + particípio (tenho feito)","lead":"A false friend: it only matches for something repeated up to now.","leadPt":"Falso amigo: só combina para algo repetido até agora.","items":[{"en":"I have … (repeated)","enPt":"I have … (repetido)","use":"pp-period","note":"tenho viajado muito → I have traveled a lot","notePt":"tenho viajado muito → I have traveled a lot","ex":"I have traveled a lot this year.","exPt":"Tenho viajado muito este ano."},{"en":"I have … (once)","enPt":"I have … (uma vez)","use":"pp-news","note":"one finished action: Portuguese uses the pretérito","notePt":"uma ação terminada: o português usa o pretérito","ex":"I have finished the report.","exPt":"Terminei o relatório."}]}],"curious":[{"title":"And have been + -ing? (✱)","titlePt":"E have been + -ing? (✱)","text":["With since / for, many verbs also have a continuous form: *I've studied English for six years* and *I've been studying English for six years* are both correct.","The continuous is more common for an activity still going on, something temporary or something repeated again and again: *It's been raining since Friday. I've been staying with a host family. You've been talking about it for years!*","The simple is the one to use for how many / how much and for results: *We've played forty games. She's baked 30,000 loaves.* Never the continuous here.","State verbs (know, have, be, own, want, love) don't take the continuous: *I've known her for years* (never I've been knowing).","In the game a ✱ after a verb means: right as it is, but most people would say have been + -ing. Open its explanation to see how."],"textPt":["Com since / for, muitos verbos também têm a forma contínua: *I've studied English for six years* e *I've been studying English for six years* estão certas.","A contínua é mais comum para uma atividade que ainda continua, algo temporário ou algo repetido várias vezes: *It's been raining since Friday. I've been staying with a host family. You've been talking about it for years!*","A simples é a certa para quantos / quanto e para resultados: *We've played forty games. She's baked 30,000 loaves.* Aqui, nunca a contínua.","Verbos de estado (know, have, be, own, want, love) não vão para a contínua: *I've known her for years* (nunca I've been knowing).","Em português as duas viram quase sempre o presente (estudo inglês há seis anos) ou \"tenho estudado\", e por isso é fácil confundir.","No jogo, um ✱ depois de um verbo quer dizer: está certo assim, mas a maioria das pessoas diria have been + -ing. Abra a explicação para ver como."]},{"title":"just / already / yet in American English","titlePt":"just / already / yet no inglês americano","text":["British English uses the present perfect with these words: *I've just seen him. Have you eaten yet?*","In American English the past simple is also normal: *I just saw him. Did you eat yet? I already did it.*","That's why the game never makes you decide with just, already or yet — except on \"both possible\" spots."],"textPt":["O inglês britânico usa o present perfect com essas palavras: *I've just seen him. Have you eaten yet?*","No inglês americano o past simple também é normal: *I just saw him. Did you eat yet? I already did it.*","Por isso o jogo nunca pede essa decisão com just, already ou yet — só nos casos \"as duas servem\"."]},{"title":"Did you ever…?","titlePt":"Did you ever…?","text":["*Did you ever…?* is right in three situations:","1. Inside a finished period: *When you lived in Rome, did you ever visit Florence?*","2. For someone who has died: *Did you ever meet your great-grandparents?*","3. In everyday American English, for your life up to now: *Did you ever try sushi?* — where British English says *Have you ever tried sushi?* Even in American English it sounds informal, and it can sound a bit rude: *Did you ever think of calling me?* sounds like a complaint, not a question.","So *Have you ever…?* is always safe (and polite) for life experience; *Did you ever…?* needs a finished time, or a casual chat with an American. In the game the Portuguese always shows which one is meant."],"textPt":["*Did you ever…?* está certo em três situações:","1. Dentro de um período terminado: *When you lived in Rome, did you ever visit Florence?* (Quando você morava em Roma, chegou a visitar Florença?)","2. Para alguém que já morreu: *Did you ever meet your great-grandparents?*","3. No inglês americano do dia a dia, para a vida até agora: *Did you ever try sushi?* — onde o britânico diz *Have you ever tried sushi?* Mesmo no inglês americano soa informal, e pode soar um pouco rude: *Did you ever think of calling me?* parece uma reclamação (\"você nem pensou em me ligar?\"), não uma pergunta.","Então *Have you ever…?* é sempre seguro (e educado) para experiência de vida; *Did you ever…?* precisa de um tempo terminado, ou de uma conversa informal com um americano. No jogo, o português sempre mostra qual é."]},{"title":"been or gone?","titlePt":"been ou gone?","text":["*She has been to Japan* = she went and came back (an experience).","*She has gone to Japan* = she went and she is there now."],"textPt":["*She has been to Japan* = ela foi e voltou (experiência).","*She has gone to Japan* = ela foi e está lá agora."]},{"title":"I've got","titlePt":"I've got","text":["*I've got two sisters* = *I have two sisters*. It looks like a present perfect, but it's just about having something now.","American English also has gotten: *He has gotten taller.*"],"textPt":["*I've got two sisters* = *I have two sisters* (tenho duas irmãs). Parece present perfect, mas só fala de ter algo agora.","O inglês americano também usa gotten: *He has gotten taller* (ele ficou mais alto)."]},{"title":"have been + -ing","titlePt":"have been + -ing","text":["*I have been living here for three years* means the same as *I have lived here for three years*, with more focus on the activity going on.","Verbs like know, like and have (= own) stay simple: *I have known her for years* — never I have been knowing."],"textPt":["*I have been living here for three years* significa o mesmo que *I have lived here for three years*, destacando a atividade em andamento.","Verbos como know, like e have (= possuir) ficam na forma simples: *I have known her for years* — nunca I have been knowing."]},{"title":"had + participle (past perfect)","titlePt":"had + particípio (past perfect)","text":["The past perfect goes one step further back: something before another past moment. *When I arrived, the movie had already started.*","It isn't in this game, but it's the next step."],"textPt":["O past perfect volta mais um passo: algo antes de outro momento do passado. *When I arrived, the movie had already started* (quando cheguei, o filme já tinha começado).","Ele não está neste jogo, mas é o próximo passo."]}]},"audio":["0b6df9c5","70b66ede","83a568cf","1edc1c21","fb808f95","e98c3503","130c0512","6bfe47ae","e2ac1bae","4334a499","9fe44793","7afaaea9","abf3daa2","a717a0ec","fe55d5c9","ac80dbf8","30294462","2c0f1358","a8e732a9","2885e8f1","b6e45dfa","b22b4c5d","14bff049","d16bd302","2073899e","07bec9a3","a62f6634","79fd2051","e63ca1db","72be1f96","15d484cc","4a875a80","4de75502","24b373d5","912e8519","87b74cdf","9ee11f67","418e6ecb","53865f4b","0147c0d0","4ebe5555","c028eade","448cd608","11c2d31d","bcd74748","81251f77","d4e34f95","95939508","26c90c36","3372de69","99d92caf","5ab3214c","8d75afe8","725067c8","bbda9b14","8525fce7","a9e9f099","ce29ffeb","1dd4ca03","6c1646af","276d72a5","e576b427","8359ec5c","29a8c3ee","0dde1549","b65a83db","df9c61c8","e2cb1387","facaafe7","39d98d63","1a7b6db2","c5018c24","28311118","b2ee712e","caad8a62","6e67181e","25ca712c","7b4279d1","7b5f0693","42a38e94","5f676e82","a876b766","2cf12c73","5698481c","c2c15890","9670ed39","b7bf1cb8","efa92a36","728157ce","8c3659c2","7f89806b","b1eb9543","87093b5f","7eceeba1","2e0eb74c","7a7cc972","8e685daf","03a7b95c","b1dd15ff","d718529b","bb597ccc","d1d47bee","e52a2507","49c50599","4452cd02","7f08def8","b1a3ceee","50916e19","0863402a","71d4149c","3ab5d2cc","723e8cc4","53320bb4","51881f96","c2f57877","d811fe56","49a856d8","bb32f9df","014db5dd","5cf3743b","a2472ff4","b3de5253","0c7af9ba","4bb07dfb","c5593d6b","bb8a82a7","d40074bb","ab3bf544","340f546c","7882a6b0","18514f1e","76c68 function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- Text markup (src/data/texts/*.json) ----------
   [has:visited] = a spot: a grey have / has before a regular -ed verb (the player decides if it belongs).
   {since 2019}  = a clue: time words that decide a spot (lit up by the Clues hint, linked to the explanations).
   parsed(t) reads a text once and keeps the result on it:
     lines  [{ who, raw, segs }] — segs: { k: "t" | "spot" | "clue", at, end, s, i (spot), c (clue) }
     spots  the text's "spots" data plus aux, verb, line, at, sent [start, end) of its sentence, want (true = have / has;
            for a "both" spot, either choice is right and want is its present-perfect side),
            clues (indexes of its clue spans: the nearest span with each "clue" text)
     clues  [{ s, line, at }] */
const MARK = /\[(have|has):([^\]]+)\]|\{([^}]+)\}/g;
// Sentence breaks: . ! ? … (maybe a closing quote), a space, then a capital, a digit or an opening mark. Not after Mr. Ms. Dr.
const SENT_END = /(?<!\b(?:Mr|Mrs|Ms|Dr|St)\.)(?<=[.!?…]["”]?)\s+(?=["“{\[]?[A-Z0-9])/g;
function sentRanges(raw) {
  const out = []; let a = 0, m;
  SENT_END.lastIndex = 0;
  while ((m = SENT_END.exec(raw))) { out.push([a, m.index]); a = m.index + m[0].length; }
  out.push([a, raw.length]);
  return out;
}
function parsed(t) {
  if (t._p) return t._p;
  const P = { lines: [], spots: [], clues: [] };
  t.body.forEach((row, li) => {
    const who = Array.isArray(row) ? row[0] : null, raw = Array.isArray(row) ? row[1] : row, segs = [], sents = sentRanges(raw);
    let last = 0, m;
    MARK.lastIndex = 0;
    while ((m = MARK.exec(raw))) {
      if (m.index > last) segs.push({ k: "t", at: last, end: m.index, s: raw.slice(last, m.index) });
      const g = { at: m.index, end: MARK.lastIndex };
      if (m[1]) {
        g.k = "spot"; g.i = P.spots.length;
        // Casual texts ("contract": true) show have / has as 've / 's right after a pronoun: I've, she's.
        const subj = t.contract && /\b(I|you|we|they|he|she|it)\s+$/i.exec(raw.slice(0, m.index));
        P.spots.push(Object.assign({}, t.spots[g.i], {
          aux: m[1], verb: m[2], line: li, at: m.index, sent: sents.find(r => m.index >= r[0] && m.index < r[1]),
          short: !!subj, subj: subj ? subj[1] : "", shown: subj ? (m[1] === "have" ? "'ve" : "'s") : m[1]
        }));
      } else {
        g.k = "clue"; g.c = P.clues.length; g.s = m[3];
        P.clues.push({ s: m[3], line: li, at: m.index });
      }
      segs.push(g); last = MARK.lastIndex;
    }
    if (last < raw.length) segs.push({ k: "t", at: last, end: raw.length, s: raw.slice(last) });
    P.lines.push({ who, raw, segs });
  });
  const dist = (a, b) => Math.abs(a.line - b.line) * 1e4 + Math.abs(a.at - b.at);
  P.spots.forEach(sp => {
    sp.want = DATA.uses[sp.use].tense === "pp";
    sp.clues = [].concat(sp.clue || []).map(s => {
      let best = -1, bd = Infinity;
      P.clues.forEach((c, k) => { if (c.s.toLowerCase() === s.toLowerCase() && dist(c, sp) < bd) { bd = dist(c, sp); best = k; } });
      return best;
    }).filter(k => k >= 0);
  });
  return (t._p = P);
}
// Walk part [a, b) of line li: f.t(text), f.spot(i), f.clue(c, s) give the pieces, joined.
function walk(P, li, a, b, f) {
  return P.lines[li].segs.map(g => {
    if (g.end <= a || g.at >= b) return "";
    if (g.k === "t") return f.t(g.s.slice(Math.max(a, g.at) - g.at, Math.min(b, g.end) - g.at));
    return g.k === "spot" ? f.spot(g.i) : f.clue(g.c, g.s);
  }).join("");
}
// The right words for spot sp: "has visited", "'ve changed" or "visited". A "both" spot can take the player's
// choice (on: true / false) — either is right; without it, its present-perfect side.
function ansWords(sp, on) { return ((sp.both && on !== undefined ? on : sp.want) ? sp.shown + " " : "") + sp.verb; }
// The verb phrase on its own, with or without have / has: "I've changed" / "I changed", "has visited" / "visited".
function phrase(sp, on) { return sp.short ? sp.subj + (on ? sp.shown + " " : " ") + sp.verb : (on ? sp.aux + " " : "") + sp.verb; }
// Glue a contraction to the word before it ("I 've" → "I've"), also across the tags of an HTML piece.
function joinC(s) { return s.replace(/\s+((?:<[^>]+>)*)'(ve|s)\b/g, "$1'$2"); }
// Plain text of a line (or of part of it), spots in their right form ("both" spots as chosen in on[], when given).
function linePlain(P, li, a = 0, b = Infinity, on) { return joinC(walk(P, li, a, b, { t: s => s, spot: i => ansWords(P.spots[i], on && on[i]), clue: (c, s) => s })).trim(); }
// Does every clue of spot sp sit in its own sentence? (Then the sentence can be played on its own: quick-fire.)
function selfContained(P, sp) { return sp.clues.length > 0 && sp.clues.every(k => { const c = P.clues[k]; return c.line === sp.line && c.at >= sp.sent[0] && c.at < sp.sent[1]; }); }
// Spot i's sentence as HTML: that spot as html(i), other spots in their right form ("both" ones as chosen in on[],
// when given), its own clues marked when mark is true.
function sentHTML(P, i, html, mark, on) {
  const sp = P.spots[i];
  return joinC(walk(P, sp.line, sp.sent[0], sp.sent[1], {
    t: s => esc(s),
    spot: j => j === i ? html(j) : esc(ansWords(P.spots[j], on && on[j])),
    clue: (c, s) => mark && sp.clues.includes(c) ? "<mark>" + esc(s) + "</mark>" : esc(s)
  })).trim();
}

// The same in a chosen language: Portuguese when pt is true (the Guide has its own EN / PT switch).
