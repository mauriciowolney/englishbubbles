<script>
/* early-theme.js — runs in <head>, before the first paint, in the menu AND in every game: puts on the background
   colour saved in eb-bg (the games' palettes, "p:sky" or "c:#7aa7ff"), so a page never flashes its default colour
   first. The page's own 01-theme.js applies the same colour again a moment later. Keep PAL in step with PALETTES
   (src/js/01-theme.js and the games). */
(function () {
  try {
    var PAL = {
      sky: ["#e4f3fb", "#f1e8fb", "#fdf0e6", 0], peach: ["#ffe6d8", "#ffd6e4", "#fff1c9", 0],
      mint: ["#d9f4e6", "#d3eef6", "#eef6d3", 0], lilac: ["#e9e0fb", "#f7d9ee", "#dbe6fb", 0],
      dusk: ["#2a1740", "#58224f", "#1f3560", 1], midnight: ["#141964", "#441464", "#144e64", 1]
    };
    var s = Storage.prototype.getItem.call(window.localStorage, "eb-bg") || "", c = null;
    if (s.indexOf("p:") === 0) c = PAL[s.slice(2)] || null;
    else if (/^c:#[0-9a-f]{6}$/i.test(s)) {
      var hex = s.slice(2), r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255,
        b = parseInt(hex.slice(5, 7), 16) / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b),
        l = (mx + mn) / 2, h = 0, sat = 0, d = mx - mn;
      if (d) {
        sat = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
        h = (mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) * 60;
      }
      var col = function (dh) { return "hsl(" + ((h + dh + 360) % 360).toFixed(0) + "," + (sat * 100).toFixed(0) + "%," + (l * 100).toFixed(0) + "%)"; };
      c = [col(0), col(40), col(-40), l * 100 < 52];
    }
    if (c) {
      var root = document.documentElement;
      root.style.setProperty("--bg-a", c[0]); root.style.setProperty("--bg-b", c[1]); root.style.setProperty("--bg-c", c[2]);
      root.dataset.theme = c[3] ? "dark" : "light";
    }
  } catch (e) {}
  // The phone's bars (theme-color) follow the background: its top colour --bg-a, set here or later by the page's own
  // colour picker (menu or game: both write --bg-a on <html>). No colour chosen: the default light / dark ones.
  try {
    var html = document.documentElement, last = "";
    var bar = function () {
      var a = html.style.getPropertyValue("--bg-a").trim(), m = document.querySelectorAll('meta[name="theme-color"]');
      for (var i = 0; i < m.length; i++) {
        var v = a || (/dark/.test(m[i].media) ? "#141964" : "#e4f3fb");
        if (m[i].content !== v) m[i].content = v;
      }
      last = a;
    };
    bar();
    document.addEventListener("DOMContentLoaded", bar);
    new MutationObserver(function () {
      if (html.style.getPropertyValue("--bg-a").trim() !== last) bar();
    }).observe(html, { attributes: true, attributeFilter: ["style"] });
  } catch (e) {}
})();

/* iPhone / iPad: ask for a "playback" audio session, so the game's sounds play even with Silent mode on (iOS 17+;
   some games already do this themselves). Websites can't detect Silent mode, so the menu also shows a tip. */
try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
document.documentElement.classList.add("eb-arrive");   /* the header slides in (see the style below) */
</script>

/* The header slides down in from the top when a page arrives (html.eb-arrive, set in <head>, removed when the slide
   ends). It is the real header that moves, not a view-transition snapshot: a snapshot can't show the frosted-glass

<script>
/* Every game saves its progress in the phone's storage. In the app all games share one storage, so each game's
   keys get the prefix "eb:present-perfect:" here; two games can then use the same key names without overwriting each other.
   One exception: the background colour (every game saves it as "<prefix>-bg", e.g. "p:sky" or "c:#7aa7ff", like
   the menu) is ONE setting for the whole app, kept under the menu's key "eb-bg": the game opens with the colour
   chosen in the menu, and a colour chosen in a game becomes the menu's and the other games' too. */
(function () {
  try {
    var P = "eb:present-perfect:", L = window.localStorage, S = Storage.prototype, BG = /^[a-z]+-bg$/;
    var get = S.getItem, set = S.setItem, del = S.removeItem;
    /* The EN / PT toggles too: ONE language for the whole app, the menu's (eb-lang). Each game saves its toggles
       under its own keys, with its own word for Portuguese (games.json "lang": "pt", "tr" or "native"; English is
       always "en"): reading one gives the menu's language, and a tap in a game changes the menu's and every
       game's. Until EN / PT is chosen, the menu's own rule: Portuguese for My level All / A1 / A2, English from B1. */
    var LG = {"pp-guide-lang": "pt", "pp-tour-lang": "tr"};
    function appLang() {
      var l = get.call(L, "eb-lang");
      if (l === "en" || l === "pt") return l;
      var lv = get.call(L, "eb-level");
      return lv === "B1" || lv === "B2+" ? "en" : "pt";
    }
    /* The sound-effects volume too (2026-11-26, the user): ONE for the whole app, the menu's "eb-vol" (0-100,
       0 = sound off). Every game saves "<prefix>-vol" (0-100, its Effects slider) plus an on / off key:
       "<prefix>-snd" ("0" = off) or "<prefix>-mute" ("1" = off). Reading them gives the menu's volume (menu at 0:
       the game opens muted, its slider where it was); after a game writes either, eb-vol = 0 if muted, else its
       slider. The Voice slider ("-vvol") stays each game's own. */
    var VOL = /^[a-z]+-vol$/, MUTE = /^[a-z]+-(snd|mute)$/;
    function own(k) { return get.call(L, P + k); }
    function syncVol(k) {
      var pre = k.slice(0, k.indexOf("-")), v = parseInt(own(pre + "-vol"), 10);
      if (isNaN(v) || v < 0 || v > 100) return;
      var off = own(pre + "-snd") === "0" || own(pre + "-mute") === "1";
      set.call(L, "eb-vol", String(off ? 0 : v));
    }
    S.getItem = function (k) {
      if (this === L && BG.test(k)) { var app = get.call(this, "eb-bg"); if (app) return app; }
      if (this === L && (VOL.test(k) || MUTE.test(k))) {
        var ev = get.call(this, "eb-vol");
        if (ev !== null && VOL.test(k) && ev !== "0") return ev;
        if (ev !== null && MUTE.test(k)) { var off = ev === "0"; return /-snd$/.test(k) ? (off ? "0" : "1") : (off ? "1" : "0"); }
      }
      if (this === L && LG.hasOwnProperty(k)) return appLang() === "en" ? "en" : LG[k];
      return get.call(this, this === L ? P + k : k);
    };
    S.setItem = function (k, v) {
      if (this === L && BG.test(k)) set.call(this, "eb-bg", v);
      if (this === L && LG.hasOwnProperty(k)) set.call(this, "eb-lang", String(v) === "en" ? "en" : "pt");
      var r = set.call(this, this === L ? P + k : k, v);
      if (this === L && (VOL.test(k) || MUTE.test(k))) syncVol(k);
      return r;
    };
    S.removeItem = function (k) { return del.call(this, this === L ? P + k : k); };
    /* The app's own keys (eb-rounds, eb-don…) and language, for the injected donation script (donate.js) */
    window.ebApp = { get: function (k) { return get.call(L, k); }, set: function (k, v) { set.call(L, k, v); }, lang: appLang };
    /* Opened from the menu (a card or Continue)? Then the game starts at the menu's level ("My level"): the menu
       leaves a one-time note (sessionStorage eb-level-go), and the matching level is saved under the game's own
       level key before the game reads it (games.json "level"; the nearest level when the game doesn't have it).
       With "All" on the menu, or on a reload, the game keeps its own last level. */
    var LV = {"key": "pp-level", "A1": "A2", "A2": "A2", "B1": "B1", "B2+": "B2"}, SS = window.sessionStorage;
    if (SS.getItem("eb-level-go") === "present-perfect") {
      SS.removeItem("eb-level-go");
      var m = get.call(L, "eb-level");
      if (LV && LV[m]) set.call(L, P + LV.key, LV[m]);
    }
  } catch (e) {}
})();
</script>

/* Score, progress, tiles, CTA (from template 2) */

/* The bubbles drifting up behind everything (08-sky.js; from Be Do Modal / Lexical Families, Nov 2026, itself from
   English Bubbles). Sizes use lvh (the screen's height with the address bar hidden), not vh: on Android the address
   bar hides and shows while scrolling, which changed vh mid-flight and made every bubble jump (vh is the fallback).
   Only transform and opacity animate. They pause while a Build word is carried (body.carrying). */
.sky { position: fixed; top: 0; left: 0; right: 0; height: 100vh; height: 100lvh; z-index: -1; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; }
.sky.in { opacity: var(--sky-o); }   /* light .85, dark .6 */
.sky span {
  position: absolute; bottom: -120px; border-radius: 50%;
  border: 1.5px solid hsla(var(--h), 80%, var(--sky-rim-l), var(--sky-rim-a));
  background: radial-gradient(circle at 30% 26%, rgba(255,255,255,var(--sky-hi)), hsla(var(--h), 90%, 78%, var(--sky-tint-a)) 50%, hsla(var(--h), 90%, 72%, calc(var(--sky-tint-a) * .8)) 70%, transparent 71%);
  box-shadow: inset 0 0 14px hsla(var(--h), 95%, var(--sky-glow-l), var(--sky-glow-a));
  filter: blur(2px);   /* soft, out of focus: blurred once, then only moved */
  animation: skydrift var(--t, 30s) linear infinite; animation-delay: var(--d, 0s);
  opacity: 0;
}
body.carrying .sky span { animation-play-state: paused; }
@keyframes skydrift {
  0% { transform: translate3d(0, 0, 0); opacity: 0; }
  8% { opacity: .6; }
  50% { transform: translate3d(var(--x, 20px), -60vh, 0); transform: translate3d(var(--x, 20px), -60lvh, 0); }
  92% { opacity: .45; }
  100% { transform: translate3d(0, -125vh, 0); transform: translate3d(0, -125lvh, 0); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .sky { display: none; } }
/* While a window (Guide, Favorites, Seen, the end card) or the tutorial is open, the page behind doesn't scroll (from
   Be Do Modal, Nov 2026): the wheel or a finger scrolls only the window's own card. Scripts can still scroll the page
   (the tutorial moves it to what it points at). The page shows no scrollbar, so nothing shifts. */
html:has(.favmodal.show), html:has(.tour:not([hidden])) { overflow: hidden; overscroll-behavior: none; }

/* While the tutorial or a window (.favmodal) is open (body.covered, 24-shine.js) the game behind it stands still: the
   blur and dimming over it aren't redrawn on every frame (slow phones). Bubbles inside the window keep moving. */

.chip { display: inline-block; font-size: .74rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: .38em .95em; border-radius: 999px; color: #fff; white-space: nowrap;
  background: linear-gradient(135deg, hsl(var(--h),75%,52%), hsl(calc(var(--h) + 35),70%,50%)); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); text-shadow: 0 1px 1px rgba(0,0,0,.18); }
.rv-note { margin: 12px 0 0; padding: 8px 12px; border-radius: 14px; font-size: .9rem; background: hsla(45,100%,70%,.2); border: 1px dashed hsla(45,90%,50%,.6); animation: pup .5s .4s ease-out backwards; }
.rv-note b { color: hsl(35,85%,var(--lab-l)); }
.rv-btns { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 16px; }
@keyframes cardin { from { opacity: 0; transform: scale(.92) translateY(12px); } }
@keyframes pup { from { opacity: 0; transform: translateY(10px); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
/* Toast + confetti bubbles */
.toast { position: absolute; left: 50%; top: 0; z-index: 5; padding: .35em 1em; border-radius: 999px; font-weight: 600; white-space: nowrap; pointer-events: none;
  background: hsl(150,60%,42%); color: #fff; box-shadow: 0 6px 16px var(--shadow); animation: toast 1.7s ease-out forwards; }
.toast.zero { background: hsl(35,85%,48%); }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%,-40%) scale(.6); } 15% { opacity: 1; transform: translate(-50%,-115%) scale(1.08); } 75% { opacity: 1; transform: translate(-50%,-130%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-175%); } }
.pf { position: fixed; z-index: 55; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at 30% 30%, #fff, hsla(var(--h),85%,75%,.55)); border: 1px solid hsla(var(--h),85%,68%,.85); animation: pfly .8s ease-out forwards; }
@keyframes pfly { from { transform: translate(-50%,-50%) scale(.3); opacity: .95; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1); opacity: 0; } }

/* Tour spotlight and card glide between targets, but only once Next / Back was pressed (.glide, 30-tour.js):
   the first card always pops in where it belongs instead of flying in from where it was last time. */
.tour.glide .tour-spot { transition: left .45s cubic-bezier(.3,1.15,.5,1), top .45s cubic-bezier(.3,1.15,.5,1), width .45s cubic-bezier(.3,1.15,.5,1), height .45s cubic-bezier(.3,1.15,.5,1); }
.tour.glide .tour-card { transition: left .4s ease, top .4s ease; }
.tour-card { max-height: calc(100vh - 24px); overflow-y: auto; }
/* Tour header: step label + EN / translation toggle (kept clear of the close button) */
.tour-head { display: flex; align-items: center; gap: .6rem; padding-right: 2.2rem; }
.tour-head .tour-step { padding-right: 0; flex: 1; }
.tour-lang { display: flex; gap: 2px; padding: 2px; border-radius: 999px; border: 1px solid var(--dock-line); flex: none; }
.tour-lang[hidden] { display: none; }
.tour-lang button { appearance: none; border: 0; cursor: pointer; font-family: inherit; font-size: .7rem; font-weight: 600; letter-spacing: .06em; line-height: 1;
  padding: .45em .75em; border-radius: 999px; color: var(--ink); background: transparent; transition: background-color .2s ease, color .2s ease; }
.tour-lang button:hover { background: var(--dock-line); }
.tour-lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg-a); }
.tour-lang button:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
/* Welcome card: one colour-coded example per conditional type */
.tour-ex { list-style: none; margin: .55rem 0 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; }
.tour-ex li { display: flex; flex-wrap: wrap; align-items: baseline; gap: .15rem .5rem; font-weight: 500; }
.tour-ex .chip { font-size: .62rem; padding: .32em .75em; }
.tour-ex .tour-tr { flex-basis: 100%; font-size: .88rem; font-weight: 400; opacity: .8; }
/* Meaning of a pre-filled word, shown on hover or tap (16-gloss.js) */
.glosstip { position: fixed; z-index: 60; display: flex; align-items: center; gap: 8px; max-width: min(80vw, 300px); padding: 7px 13px 7px 8px; border-radius: 14px;
  background: var(--dock-bg); border: 1px solid var(--dock-line); color: var(--ink); box-shadow: 0 8px 22px var(--shadow);
  backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
  font-weight: 600; font-size: 1rem; line-height: 1.25; pointer-events: none; animation: gpop .12s ease-out; }
.glosstip[hidden] { display: none; }
.gw { cursor: pointer; border-radius: 6px; transition: background-color .15s ease; }
.gw.on { background: hsla(var(--h),90%,70%,.25); }
@media (hover: hover) { .gw:hover { background: hsla(var(--h),90%,70%,.18); } }
.glosstip .pick-badge { flex: none; font-size: .68rem; }
@keyframes gpop { from { opacity: 0; transform: translateY(3px); } }
@media (prefers-reduced-motion: reduce) { .glosstip { animation: none; } }
/* Idle reminder on the hint button (14-explain.js) */
#hintbtn.nudge { animation: nudge .7s ease-in-out; }
@keyframes nudge { 0%, 100% { transform: none; } 15% { transform: rotate(-6deg) scale(1.08); } 35% { transform: rotate(5deg) scale(1.08); } 55% { transform: rotate(-3deg) scale(1.04); } 75% { transform: rotate(2deg); } }
/* Theme change (swapBg in 01-theme.js, from the a / an / the game): no transitions for that one style change;
   the old background fades away on top */
.theming body, .theming *, .theming *::before, .theming *::after { transition: none !important; }
.bgfade { position: fixed; inset: 0; z-index: -1; pointer-events: none; background-color: var(--fa);
  background-image: radial-gradient(60vmax 50vmax at 8% 6%, var(--fa), transparent 70%),
    radial-gradient(55vmax 45vmax at 95% 40%, var(--fb), transparent 70%),
    radial-gradient(60vmax 50vmax at 30% 100%, var(--fc), transparent 70%);
  transition: opacity .55s ease; will-change: opacity; }
.bgfade.fading { opacity: 0; }
/* Edge jitter (from the a / an / the game): while something rises on hover it gets an invisible strip reaching back
   past where its bottom edge was, so the cursor on that edge keeps the hover after the lift. Only while hovered: an
   always-on strip catches the cursor below the edge and jitters there instead. The strip = the lift + 3-4px. */
.tile, .pbtn, .qz-tl, .gd-jump, .gd-nav .chip { position: relative; }
@media (hover: hover) {
  .b.bw:hover:not(.drag):not(.lock):not(.gone)::after, .tile:hover::after, .tourbtn:not(.fresh):hover::after,
  .pbtn:hover:not(:disabled)::after, .qz-tl:hover:not(:disabled)::after, .gd-jump:hover::after, .gd-nav .chip:hover::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: -5px;
    width: auto; height: auto; border-radius: 0; background: none; opacity: 1; animation: none; }
  .b.bw:hover:not(.drag):not(.lock):not(.gone)::after { bottom: -8px; }
  .tourbtn:not(.fresh):hover::after, .pbtn:hover:not(:disabled)::after { bottom: -4px; }
}
/* A wrong check: "2 frases estão erradas" pulses three times (check() in 10-game.js) */
#hint .alert { display: inline-block; animation: alertpulse .75s ease-in-out 3; }
@keyframes alertpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); text-shadow: 0 0 10px hsla(330,90%,65%,.75); } }
@media (prefers-reduced-motion: reduce) { #hint .alert { animation: none; } }
/* 11-text.css — the play area: the text card (paragraphs, dialogue, chat bubbles), the have / has spots and their
   states, clue words, line marks after a wrong check, the Portuguese lines, tools-row extras. */
#stage { position: relative; max-width: 760px; margin: 14px auto 0; transition: opacity .25s ease, transform .25s ease; }
#stage.out { opacity: 0; transform: translateY(-10px); }
#stage.rise .card { animation: rise .55s cubic-bezier(.2,.8,.3,1) backwards; }

/* The card: the header's frosted glass, 1px edge and shadow (.dock; from Be Do Modal / Lexical Families, Nov 2026) */
.card { --h: 265; position: relative; padding: 2.1em 1.7em 1.6em; border-radius: 1.8em; color: var(--ink);
  background: var(--dock-bg); border: 1px solid var(--dock-line);
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: 0 8px 22px var(--shadow); }
.card.shake { animation: shake .5s ease; }
.card .tag { position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%); z-index: 2; padding: calc(.3em + 1.5px) calc(.9em + 1.5px); border-radius: 999px; white-space: nowrap;
  font-size: .7rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  /* a flat gradient pill, like the header's chosen pills (Be Do Modal's labels, Nov 2026): pink-violet */
  color: #fff; background: linear-gradient(90deg, hsl(330, 80%, 62%), hsl(300, 60%, 60%)); text-shadow: 0 1px 1px rgba(0,0,0,.15); }
.ttl { margin: 0 0 .75em; font-size: clamp(1.25rem, 1vw + 1rem, 1.6rem); font-weight: 600; line-height: 1.2; text-align: center; text-wrap: balance; }
.lines { display: flex; flex-direction: column; gap: .7em; }
.ln { position: relative; border-radius: .7em; transition: background-color .3s ease, box-shadow .3s ease, outline-color .3s ease; }
.say { margin: 0; font-size: clamp(1.06rem, .55vw + .95rem, 1.26rem); font-weight: 500; line-height: 2.05; }

/* Dialogue: name tag + line; chat: message bubbles, the second speaker on the right */
.who { font-size: .74rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; color: hsl(var(--h),60%,var(--lab-l)); }
.k-dialogue .ln { display: grid; grid-template-columns: minmax(5.2em, max-content) 1fr; column-gap: .9em; align-items: baseline; }
.k-dialogue .who { justify-self: start; padding: .3em .75em; border-radius: 999px; border: 1.5px solid hsla(var(--h),70%,var(--rim-l),.9); background: hsla(var(--h),90%,75%,.14); }
.k-dialogue .lt { grid-column: 2; }
/* The line the voice is reading (Listen) */
.ln.reading { background: hsla(var(--h, 265),85%,72%,.2); box-shadow: 0 0 0 6px hsla(var(--h, 265),85%,72%,.2); }
.k-chat .ln.reading { box-shadow: 0 0 0 3px hsla(var(--h, 265),85%,65%,.55), 0 3px 10px var(--shadow); }
/* Stage note in a dialogue or chat: "(some time later)" */
.ln.note { display: block; align-self: center; max-width: none; padding: 0; background: none; border: 0; box-shadow: none; text-align: center; }
.ln.note .say { font-size: .92rem; font-style: italic; line-height: 1.6; opacity: .65; }
.ln.note .lt { text-align: center; }
.k-chat .lines { gap: .55em; }
.k-chat .ln { max-width: 84%; align-self: flex-start; padding: .45em 1em .55em; border-radius: 1.2em 1.2em 1.2em .35em; background: var(--fill-hi); border: 1px solid var(--dock-line); box-shadow: 0 3px 10px var(--shadow); }
.k-chat .ln.me { align-self: flex-end; border-radius: 1.2em 1.2em .35em 1.2em; background: hsla(var(--h),85%,72%,.28); }
.k-chat .who { display: block; font-size: .68rem; }
.k-chat .me .who { text-align: right; }
.k-chat .say { line-height: 1.95; }
.k-text .ln:first-child:last-child .say, .k-text .say { text-wrap: pretty; }

/* Spots: a grey dashed have / has in front of the verb; switched on it fills with the present-perfect colour */
.spot { position: relative; display: inline-flex; align-items: baseline; white-space: nowrap; border-radius: .55em; transition: background-color .25s ease, box-shadow .25s ease; }
.aux { appearance: none; font: inherit; font-size: .86em; font-weight: 600; line-height: 1.15; letter-spacing: .01em; cursor: pointer;
  max-width: 5em; overflow: hidden; margin: 0 .3em 0 0; padding: .12em .55em .17em; border-radius: 999px;
  color: var(--ink); opacity: .26; background: transparent; border: 1.5px dashed currentColor;
  transition: opacity .2s ease, background-color .2s ease, color .2s ease, border-color .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1), max-width .45s ease, padding .45s ease, margin .45s ease; }
.aux:hover { opacity: .6; transform: translateY(-1px); }
.aux:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; opacity: .8; }
.vb { font-weight: 600; }
.spot.on .aux { opacity: 1; color: #fff; border: 1.5px solid transparent; text-shadow: 0 1px 1px rgba(0,0,0,.2);
  background: linear-gradient(135deg, hsl(285,72%,58%), hsl(320,75%,60%)); box-shadow: 0 3px 10px hsla(290,70%,50%,.35); }
.spot.pop { animation: spotpop .38s cubic-bezier(.34,1.56,.64,1); }
@keyframes spotpop { 40% { transform: scale(1.12); } }
.spot.demo { pointer-events: none; }

/* Trial (2026-11-24): the have / has spots as soap bubbles, the Build words' look (spans from soapHTML(), the rules at
   the end of 33-build.css, the shine in 24-shine.js). Off = a faint grey bubble; on = clear with a pink-violet film and
   rim; after the check the rim turns green / amber / red, teal for "both". No border (the button's overflow: hidden,
   needed to fold a right "off" away, would clip it), so the film and rim sit at inset 0. */
.aux.bw { position: relative; isolation: isolate; --th: 300; border: 0; padding: .17em .66em .22em; background: none; color: var(--ink);
  opacity: .45; filter: saturate(0); text-shadow: none; box-shadow: 0 4px 10px var(--soap-sh);
  --ig: inset 0 0 10px hsla(var(--th), 95%, var(--sglow-l), var(--sglow-a));
  transition: opacity .2s ease, filter .25s ease, box-shadow .25s ease, transform .25s cubic-bezier(.34,1.56,.64,1), max-width .45s ease, padding .45s ease, margin .45s ease; }
.aux.bw .film, .aux.bw .rim, .aux.bw .film::after { inset: 0; }
.aux.bw .shn { display: none; }   /* no top spot: by 've / 's it looked like an apostrophe */
.aux.bw .glint { right: .16em; bottom: .26em; }
.aux.bw:hover { opacity: .75; }
.spot.on .aux.bw { opacity: 1; filter: none; border: 0; background: none; color: var(--ink); text-shadow: none;
  --ig: inset 0 0 14px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .12)); box-shadow: 0 6px 14px var(--soap-sh2); }
.spot.want.ok .aux.bw, .spot.want.bad .aux.bw, .spot.no.bad .aux.bw, .spot.both.on .aux.bw { opacity: 1; filter: none; border: 0; background: none; color: var(--ink); text-shadow: none; box-shadow: 0 6px 14px var(--soap-sh); }
.spot.want.ok .aux.bw { --th: 150; }
.spot.want.bad .aux.bw { --th: 40; }
.spot.no.bad .aux.bw { --th: 350; }
.spot.both.on .aux.bw { --th: 175; }
.spot.ok .aux.bw .rim i, .spot.bad .aux.bw .rim i { visibility: hidden; }
.spot.want.ok .aux.bw .rim { background: hsla(150, 60%, 48%, .85); }
.spot.want.bad .aux.bw .rim { background: hsla(40, 90%, 55%, .9); }
.spot.no.bad .aux.bw .rim { background: hsla(350, 80%, 60%, .85); }
.spot.want.bad .aux.bw::before { content: none; }
.spot.want.bad .aux.bw .bwl::before { content: "+"; }
.spot.no.bad .aux.bw .bwl { text-decoration: line-through 2px hsla(350, 75%, 55%, .9); }
.card.done .aux.bw .spin { animation-play-state: paused; }   /* after the check the spots rest */

/* After the check: have / has where it belongs (green, or amber "+has" when it was missing); where it doesn't, a wrong
   one is struck out in red and a right "off" folds away. Verbs get a coloured underline and their number. */
.card.done .aux { cursor: default; transform: none; }
.card.done .spot { cursor: pointer; }
.spot.want.ok .aux { opacity: 1; color: #fff; border: 1.5px solid transparent; background: hsl(150,55%,40%); box-shadow: none; }
.spot.want.bad .aux { opacity: 1; color: hsl(32,90%,36%); background: hsla(45,100%,70%,.35); border: 1.5px dashed hsl(35,90%,50%); }
.spot.want.bad .aux::before { content: "+"; }
.spot.no.bad .aux { opacity: 1; color: hsl(350,70%,48%); background: hsla(350,90%,75%,.18); border: 1.5px solid hsla(350,75%,60%,.8); text-decoration: line-through; text-decoration-thickness: 2px; box-shadow: none; text-shadow: none; }
.spot.no.ok .aux { max-width: 0; padding-left: 0; padding-right: 0; margin-left: 0; margin-right: 0; border-width: 0; opacity: 0; }
/* "Both possible": the player's choice stays, in teal — have / has if they switched it on, nothing if not */
.spot.both.on .aux { opacity: 1; color: #fff; border: 1.5px solid transparent; background: hsl(175,60%,36%); box-shadow: none; text-shadow: none; }
.spot.both:not(.on) .aux { max-width: 0; padding-left: 0; padding-right: 0; margin-left: 0; margin-right: 0; border-width: 0; opacity: 0; }
.spot.both .vb { text-decoration: underline 3px hsla(175,60%,42%,.8); text-underline-offset: 5px; }
.spot.both .sn, .ex.both .sn { background: hsl(175,60%,36%); }
.spot.both .gw { text-decoration: none; }
/* A contraction ('ve / 's) sits against its pronoun: it pulls itself over the space before it (which comes back when it folds away) */
.aux.c { margin-left: -.24em; padding-left: .38em; padding-right: .42em; }
.spot.ok .vb { text-decoration: underline 3px hsla(150,60%,45%,.75); text-underline-offset: 5px; }
.spot.bad .vb { text-decoration: underline 3px hsla(350,75%,58%,.85); text-underline-offset: 5px; }
.sn { display: inline-grid; place-items: center; min-width: 1.55em; height: 1.55em; padding: 0 .3em; border-radius: 999px; font-size: .62rem; font-weight: 700; line-height: 1; color: #fff; background: hsl(150,55%,40%); }
.spot .sn { position: relative; top: -.85em; margin-left: .15em; }
.spot.bad .sn, .ex.bad .sn { background: hsl(350,70%,54%); }
.spot.hot { background: hsla(50,100%,62%,.32); box-shadow: 0 0 0 4px hsla(50,100%,62%,.32); }
.spot.ping, .ex.ping, .gd-u.ping { animation: ping .9s ease; }
@keyframes ping { 0%, 100% { box-shadow: 0 0 0 0 hsla(50,100%,55%,0); } 30% { box-shadow: 0 0 0 7px hsla(50,100%,55%,.55); } }

/* Clue words: lit up like a highlighter by the Clues hint, and after the check (brighter when linked) */
.clue { padding: .05em .12em; margin: 0 -.12em; border-radius: .3em; -webkit-box-decoration-break: clone; box-decoration-break: clone; transition: background-color .3s ease, box-shadow .3s ease; }
.card .clue.lit { background: hsla(50,100%,58%,.3); }
.card.done .clue { background: hsla(50,100%,58%,.2); }
.card .clue.hot { background: hsla(50,100%,60%,.6); box-shadow: 0 0 0 3px hsla(50,100%,60%,.6); }

/* A wrong check at A2: the lines with a mistake */
.ln.err { background: hsla(350,90%,70%,.13); outline: 1.5px dashed hsla(350,75%,58%,.65); outline-offset: 3px; }
.ln.err::after { content: "!"; position: absolute; right: -.55em; top: -.6em; display: grid; place-items: center; width: 1.45em; height: 1.45em; border-radius: 50%;
  font-size: .8rem; font-weight: 700; color: #fff; background: hsl(350,75%,56%); box-shadow: 0 2px 6px var(--shadow); animation: pup .35s ease-out; }

/* Portuguese under each line (Translation button) */
.lt { display: none; margin: .05em 0 .2em; font-size: .93rem; font-weight: 400; line-height: 1.4; opacity: .8; font-style: italic; }
.card.tr-on .lt { display: block; animation: pup .35s ease-out; }

/* Gloss words have a dotted underline */
.gw { text-decoration: underline dotted 1.5px; text-decoration-color: hsla(var(--h),50%,50%,.55); text-underline-offset: 4px; }
.spot.ok .gw, .spot.bad .gw { text-decoration: none; }

/* Tools row extras */
#checkbtn { padding: .55em 1.6em; }
.cta:disabled { opacity: .45; cursor: default; animation: none; transform: none; }
#hintleft.tick { display: inline-block; animation: tick .5s cubic-bezier(.34,1.56,.64,1); }
@keyframes tick { 0% { transform: scale(1); } 40% { transform: scale(1.5); color: hsl(45,95%,55%); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 15% { transform: translateX(-9px) rotate(-1deg); } 35% { transform: translateX(8px) rotate(.8deg); } 55% { transform: translateX(-6px); } 75% { transform: translateX(4px); } }

@media (max-width: 600px) {
  .card { padding: 1.9em 1em 1.2em; border-radius: 1.4em; }
  .k-dialogue .ln { grid-template-columns: 1fr; row-gap: .1em; }
  .k-dialogue .lt { grid-column: 1; }
  .k-chat .ln { max-width: 92%; }
  .say { line-height: 1.95; }
  /* Tries, Clues, Reset, Check: one row on phones, the Tries label on top of its dots (from the conjunctions game) */
  .tools { flex-wrap: nowrap; gap: 10px; }
  .hl-w { display: none; }   /* Clues "2 left" shows only the 2: room for the gaps between the tools */
  .tools .pbtn, .tools .cta { font-size: .8rem; padding: .45em .55em; gap: .25em; white-space: nowrap; }
  #resetbtn svg { display: none; }   /* room for Check: Reset (Limpar) keeps only its word */
  .tools .pbtn small { font-size: .62rem; }
  .tools .pbtn svg { width: 14px; height: 14px; }
  .trywrap { flex-direction: column; gap: 3px; }
  .trylab { font-size: .52rem; letter-spacing: .02em; line-height: 1; }
  .tries { gap: 4px; padding: 0; }
  .tries i { width: 10px; height: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  #stage.rise .card, .card.shake, .spot.pop, .spot.ping, .ex.ping, .gd-u.ping, .ln.err::after, .card.tr-on .lt, #hintleft.tick { animation: none !important; }
  .aux, #stage { transition: none; }
}

/* Phones: the card labels stick up above the cards, so the stage gets room under the instructions, and the labels
   are a tad smaller (as in Core Word Bubbles, 2026-11-23) */
@media (max-width: 600px) {
  #stage { padding-top: 8px; }
  .card .tag, .btag { font-size: .62rem; letter-spacing: .08em; }
}
/* 12-explain.css — the explanations after a text, the timelines, the Guide modal, the quick question's timeline
   buttons and the quick-fire sentence. */
.rv-score { font-size: 1.25rem; }
/* Result card top bar: score + title (left), star + Next (top-right corner) */
.rv-bar { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; }   /* score, star and Next on one line */
.rv-bar .rv-head { justify-content: flex-start; text-align: left; }
.rv-act { display: flex; align-items: center; gap: 6px; }
.rv-act .cta { white-space: nowrap; }
.rv-ttl { display: inline-flex; align-items: center; gap: 6px; font-size: .95rem; opacity: .85; }

.pbtn svg { flex: none; }

/* One explanation per verb */
.exl { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; text-align: left; }
.ex { --h: 285; position: relative; padding: 0; border-radius: 20px; background: var(--fill-mid); border: 1.5px solid hsla(150,60%,50%,.5);
  transition: box-shadow .35s ease; animation: pup .45s ease-out backwards; }
.ex.glow, .ex.glow:hover { box-shadow: 0 0 0 4px hsla(var(--h),85%,60%,.55), 0 8px 22px var(--shadow); }   /* glow(): back from the Guide, a tapped verb */
.ex:nth-child(2) { animation-delay: .07s; } .ex:nth-child(3) { animation-delay: .14s; } .ex:nth-child(4) { animation-delay: .21s; } .ex:nth-child(5) { animation-delay: .28s; }
.ex.bad { border-color: hsla(350,75%,60%,.65); background: hsla(350,85%,70%,.08); }

.ex-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
/* Collapsible: the summary (head + sentence) has a chevron on the right; the open part keeps the card's padding */
.ex > details > summary { position: relative; display: block; list-style: none; cursor: pointer; padding: 12px 42px 12px 14px; border-radius: 18px; }
.ex > details > summary::-webkit-details-marker { display: none; }
.ex > details > summary::after { content: ""; position: absolute; right: 18px; top: 50%; width: 8px; height: 8px; margin-top: -6px;
  border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; opacity: .55; transform: rotate(45deg); transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
.ex > details[open] > summary::after { transform: rotate(-135deg); margin-top: -2px; }
.ex > details > summary:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
@media (hover: hover) { .ex > details > summary:hover { background: hsla(var(--h),85%,72%,.08); } }
.ex > details[open] { padding-bottom: 14px; }
.ex > details[open] > :not(summary) { margin-left: 14px; margin-right: 14px; animation: pup .3s ease-out; }
.ex > details[open] > .ex-you { margin-top: 0; }
.ex-head .sn { font-size: .8rem; }
.ex-mk { font-weight: 700; font-size: 1.05rem; color: hsl(150,55%,40%); }
.ex.bad .ex-mk { color: hsl(350,70%,52%); }
.ex-head .chip { font-size: .64rem; padding: .34em .85em; }
.ex-use { appearance: none; cursor: pointer; font: inherit; font-size: .8rem; font-weight: 600; padding: .22em .75em; border-radius: 999px;
  color: hsl(var(--h),60%,var(--lab-l)); background: transparent; border: 1.5px solid hsla(var(--h),70%,var(--rim-l),.9); transition: background-color .2s ease; }
.ex-use:hover { background: hsla(var(--h),90%,75%,.18); }
.ex-use::after { content: " ›"; }
.ex-say { appearance: none; margin-left: auto; padding: .35em; line-height: 0; border: 0; border-radius: 50%; color: inherit; background: transparent; opacity: .6; cursor: pointer; }
.ex-say:hover, .ex-say.speaking { opacity: 1; color: var(--underline); background: var(--dock-line); }
.ex-use:focus-visible, .ex-say:focus-visible, .qz-tl:focus-visible, .usechip:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
.ex-s { margin: 8px 0 0; font-size: 1.08rem; font-weight: 500; line-height: 1.5; }
.ex-s mark, .qz-s mark, .qz-why mark, .rlist mark { color: inherit; padding: .05em .12em; margin: 0 -.12em; border-radius: .3em; -webkit-box-decoration-break: clone; box-decoration-break: clone; background: hsla(50,100%,58%,.3); }

.ex-you .ex-right { color: hsl(150,55%,calc(var(--lab-l) * .8 + 6%)); }   /* the right answer: green */   /* the wrong choice: red, no strike-through */
.ex-body { display: grid; grid-template-columns: minmax(0, 300px) 1fr; gap: 8px 16px; align-items: center; margin-top: 8px; }

.ex-sides { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.ex-side { --h: 285; padding: 8px 10px 10px; border-radius: 16px; background: var(--fill-mid); border: 1.5px solid var(--dock-line); }
.ex-side.mine { border-color: hsl(175,60%,45%); box-shadow: 0 0 0 3px hsla(175,60%,50%,.18); }
.ex-side-h { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 0 0 4px; font-size: .95rem; }
.ex-side-h .chip { font-size: .6rem; padding: .3em .75em; }
.ex-mine { margin-left: auto; font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: hsl(175,60%,40%); }

@media (max-width: 640px) { .ex-sides { grid-template-columns: 1fr; } }
.ex-why > p:nth-child(2) { margin-top: 5px; font-size: .87rem; opacity: .78; }

/* Timelines (12-timeline.js). Colour = the tense's hue (--h on the svg). */
.tl { display: block; width: 100%; max-width: 320px; height: auto; overflow: visible; --tc: hsl(var(--h),68%,calc(var(--lab-l) * .6 + 27%)); }

.tl-nowt { font-size: 11px; font-weight: 700; letter-spacing: .05em; fill: var(--underline); }
.tl-lab { font-size: 12.5px; font-weight: 600; fill: var(--tc); }
.tl-q { font-size: 10px; font-weight: 700; fill: var(--tc); }
.tl-dot { fill: var(--tc); stroke: var(--bg-a); stroke-width: 1.5; }
.tl-zone { fill: hsla(var(--h),80%,65%,.17); stroke: var(--tc); stroke-width: 1.5; }
.tl-zone.open { fill: hsla(var(--h),80%,65%,.08); stroke-dasharray: 5 4; }
.tl-bar { stroke: var(--tc); stroke-width: 9; stroke-linecap: round; }
.tl-bar.more { stroke-width: 6; stroke-opacity: .55; stroke-dasharray: 2 7; }
.tl-tick { stroke: var(--tc); stroke-width: 2.5; stroke-linecap: round; }
.tl-arrow { fill: none; stroke: var(--tc); stroke-width: 2; }
.tl-head { fill: var(--tc); }
.tl-res { fill: hsla(var(--h),85%,65%,.25); stroke: var(--tc); stroke-width: 2; }
.tl-ring { fill: none; stroke: var(--tc); stroke-width: 1.5; stroke-dasharray: 3 3; }

/* Guide */
.guidecard { max-width: 780px; max-height: 88vh; }
.guidecard .favhead { gap: 10px; }
.gd-lang { margin-left: auto; }
/* "Ask yourself": one row per question, its tense on the right (below it on phones) */
.gd-ask { padding: 12px 12px 12px; border-radius: 20px; background: var(--fill-mid); border: 1px solid var(--dock-line); }
.gd-ask-h { margin: 0 0 10px 4px; font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .6; }

.gd-nav .chip:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
.gd-t, .gd-mis { scroll-margin-top: 12px; }
/* "Both possible" cards: the two versions side by side inside the open card */

.gd-both .ex-side .tl { max-width: 300px; }
.gd-t { --h: 285; margin-top: 20px; }
/* Most common mistakes */
.gd-mis { --h: 350; margin-top: 24px; }
.gd-mis h3 { margin: 0; font-size: 1.1rem; color: hsl(350,65%,var(--lab-l)); }
.gd-mlist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; align-items: start; gap: 10px; counter-reset: mis; }
.gd-mlist li { counter-increment: mis; position: relative; padding: 0; border-radius: 16px; background: var(--fill-mid); border: 1px solid var(--dock-line); }
.gd-mlist li::before { content: counter(mis); position: absolute; left: 12px; top: 13px; display: grid; place-items: center; width: 1.5em; height: 1.5em; border-radius: 50%;
  font-size: .75rem; font-weight: 700; color: #fff; background: hsl(350,70%,56%); }
.gd-wrong, .gd-right { margin: 0; font-size: .97rem; font-weight: 600; line-height: 1.4; }
.gd-wrong { color: hsl(350,70%,var(--lab-l)); text-decoration: line-through; text-decoration-thickness: 1.5px; text-decoration-color: hsla(350,70%,55%,.6); }
.gd-wrong span, .gd-right span { display: inline-block; text-decoration: none; margin-right: 2px; }
.gd-right { margin-top: 3px; color: hsl(150,55%,calc(var(--lab-l) * .8 + 6%)); }
.gd-mwhy { margin: 6px 0 0; font-size: .88rem; line-height: 1.45; opacity: .82; }
@media (max-width: 640px) { .gd-mlist { grid-template-columns: 1fr; } }
.gd-t h3 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0; font-size: 1rem; }
.gd-form { font-weight: 600; color: hsl(var(--h),60%,var(--lab-l)); }
.gd-short { margin: 4px 0 6px; font-size: .88rem; opacity: .75; }
.gd-u { margin-top: 10px; padding: 0; border-radius: 18px; background: var(--fill-mid); border: 1.5px solid hsla(var(--h),70%,var(--rim-l),.6); scroll-margin-top: 12px; }
.gd-u h4 { margin: 0; font-size: 1.05rem; color: hsl(var(--h),60%,var(--lab-l)); }
/* Collapsible: the summary is the title row with a chevron */
.gd-u > summary, .gd-m > summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; cursor: pointer; list-style: none; border-radius: 16px; transition: background-color .2s ease; }
.gd-u > summary::-webkit-details-marker, .gd-m > summary::-webkit-details-marker { display: none; }
.gd-u > summary::after, .gd-m > summary::after { content: ""; flex: none; width: 8px; height: 8px; margin-right: 4px; border-right: 2px solid hsl(var(--h),60%,var(--lab-l)); border-bottom: 2px solid hsl(var(--h),60%,var(--lab-l));
  transform: rotate(45deg) translateY(-2px); transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
.gd-u[open] > summary::after, .gd-m[open] > summary::after { transform: rotate(-135deg) translateY(-2px); }
.gd-u > summary:hover, .gd-m > summary:hover { background: hsla(var(--h),85%,72%,.1); }
.gd-u > summary:focus-visible, .gd-m > summary:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
.gd-u[open] { padding-bottom: 12px; }
.gd-u[open] > :not(summary) { margin-left: 14px; margin-right: 14px; animation: pup .3s ease-out; }
.gd-u[open] > .gd-body { margin-top: 2px; }
/* Mistake cards: the summary leaves room for the number; the open part lines up with the sentence */
.gd-m > summary { padding: 12px 14px 12px 40px; }
.gd-m[open] { padding-bottom: 12px; }
.gd-m[open] > :not(summary) { margin-left: 40px; margin-right: 14px; animation: pup .3s ease-out; }
.gd-m[open] > .gd-right { margin-top: 0; }
/* The "≠" false-friend card (English vs Portuguese) stands out in amber, across the full width */
.gd-mlist li.ff { grid-column: 1 / -1; background: hsla(45,100%,70%,.16); border: 1.5px dashed hsla(40,90%,50%,.7); }
.gd-mlist li.ff::before { content: "!"; background: hsl(38,90%,48%); }
.gd-ff { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 1rem; font-weight: 700; line-height: 1.4; }
.gd-ff .pick-badge { font-size: .66rem; }
/* The same warning, always visible under the two questions */
.gd-false { display: flex; gap: 8px; margin: 10px 4px 2px; font-size: .86rem; line-height: 1.45; }
.gd-false > span:first-child { flex: none; color: hsl(38,90%,52%); }
.gd-false b { color: hsl(38,85%,calc(var(--lab-l) * .7 + 20%)); }
.gd-body { display: grid; grid-template-columns: minmax(0, 280px) 1fr; gap: 6px 16px; align-items: center; }
.gd-rule { margin: 0; font-size: .95rem; line-height: 1.45; }
.gd-sig { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin: 8px 0 0; }
.gd-sig small { opacity: .7; margin-right: 2px; }
.gd-sig span { font-size: .8rem; font-weight: 600; padding: .18em .65em; border-radius: 999px; background: hsla(var(--h),80%,70%,.16); border: 1px solid hsla(var(--h),70%,var(--rim-l),.7); }
.gd-ex { margin: 8px 0 0; font-size: .93rem; line-height: 1.6; }
.gd-ex span { display: inline-flex; align-items: center; gap: 6px; opacity: .85; }
.gd-u .rv-note { animation: none; }
@media (max-width: 640px) { .gd-body { grid-template-columns: 1fr; } .gd-u .tl { max-width: 340px; margin: 0 auto; } }

/* Use chips (end screen, Seen) are buttons that open the Guide */
.usechip { border: 0; cursor: pointer; font-family: inherit; }
.usechip.weak { box-shadow: 0 0 0 2px hsla(350,80%,60%,.9), inset 0 1px 0 rgba(255,255,255,.35); }
.chip.ghost { --h: 265; color: hsl(var(--h),55%,var(--lab-l)); background: transparent; border: 1.5px solid hsla(var(--h),60%,var(--rim-l),.9); text-shadow: none; box-shadow: none; }

/* Quick question: two timeline buttons */
.qz-tls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qz-tl { appearance: none; font: inherit; color: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 8px 12px; border-radius: 18px;
  background: var(--dock-bg); border: 2px solid var(--dock-line); transition: transform .25s cubic-bezier(.34,1.56,.64,1), border-color .2s ease, background-color .2s ease; }
.qz-tl:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--underline); }
.qz-tl:disabled { cursor: default; }
.qz-tl.ok { border-color: hsl(150,60%,48%); background: hsla(150,70%,60%,.15); }
.qz-tl.bad { border-color: hsl(350,75%,60%); background: hsla(350,85%,70%,.12); }

/* Quick-fire */

.qgap > .aux { margin-left: .06em; }
.qgap .aux.empty { min-width: 6em; text-align: center; }   /* quick-fire: one empty gap for the whole verb phrase */   /* a hair of room after a pronoun it is glued to (we've) */
.qgap.ok { color: hsl(150,55%,38%); }
.qgap.bad { color: hsl(350,70%,52%); }
.quiz.speed .qz-opts .pbtn { font-size: 1.12rem; padding: .7em 1.4em; }
.sopt kbd { font: inherit; font-size: .7rem; font-weight: 700; padding: .1em .45em; margin-right: 2px; border-radius: 6px; border: 1px solid currentColor; opacity: .55; }
.qz-why .chip { font-size: .62rem; }
@media (prefers-reduced-motion: reduce) { .ex, .quiz.shake { animation: none; } }
/* The Guide opened from an explanation: a sticky "Back to the explanations" button (from the a / an / the game) */
.gd-back { position: sticky; bottom: 0; z-index: 2; display: flex; align-items: center; gap: 8px; margin: 14px auto 0; padding: 9px 20px 9px 14px; border-radius: 999px; border: 1px solid var(--dock-line); background: var(--dock-bg); color: var(--ink); font: inherit; font-weight: 600; font-size: 1rem; cursor: pointer; box-shadow: 0 8px 22px rgba(0,0,0,.3); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.gd-back[hidden] { display: none; }
.gd-back svg { flex: none; display: block; }
/* B1 explanations (levels.json "explain": "both"): the Portuguese on a second, quieter line under the English */
.l2 { display: block; margin-top: 4px; font-size: .92em; opacity: .78; }
/* Guide additions (from Preposition Bubbles' Guide): tip, Step by step, Portuguese -> English, mistakes' Portuguese, curious */
.gd-tip { display: flex; gap: 10px; margin: 0 2px 12px; font-size: .98rem; line-height: 1.45; }
.gd-tip > span:first-child { flex: none; }
.gd-tip b { color: var(--underline); }
.gd-steps { margin-top: 12px; }
.gd-steps[open] > .gd-q { margin-top: 8px; background: var(--bg-a); }
.gd-jump { border: 0; cursor: pointer; font-family: inherit; text-transform: none; letter-spacing: .02em; transition: transform .25s cubic-bezier(.34,1.56,.64,1); }
.gd-jump:hover { transform: translateY(-2px); }
.gd-jump:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
.gd-map h3 { margin: 0; font-size: 1.1rem; color: hsl(var(--h),70%,var(--lab-l)); }
/* map cards: the Portuguese word and the arrow on the first row, the English options under it */
.gd-map .gd-u > summary { display: grid; grid-template-columns: 1fr auto; row-gap: 6px; }
.gd-map .gd-u > summary::after { grid-column: 2; grid-row: 1; align-self: center; }
.gd-ws { grid-column: 1; grid-row: 2; display: flex; flex-wrap: wrap; gap: 4px; }
.gd-ws .chip, .gd-exs .chip { font-size: .62rem; text-transform: none; letter-spacing: .02em; }
.gd-exs { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.gd-exs li { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: start; }
.gd-exs li > .chip { margin-top: 2px; }
.gd-note { display: block; font-size: .8rem; opacity: .7; }
.gd-en { display: block; font-weight: 600; font-size: .95rem; }
.gd-pt { display: flex; align-items: center; gap: 6px; font-size: .88rem; opacity: .85; }
.gd-pt .pick-badge, .gd-mpt .pick-badge { font-size: .62rem; }
.gd-mpt { display: flex; align-items: center; gap: 6px; margin: 0 0 3px; font-size: .85rem; opacity: .8; }
.gd-cur { margin-top: 24px; }
.gd-cur .gd-word + .gd-word { margin-top: 14px; }
.gd-cur .gd-mwhy + .gd-mwhy { margin-top: 4px; }
.gd-cur .gd-mwhy b { font-weight: 600; opacity: 1; }
.gd-wh { margin: 0; }
@media (max-width: 560px) { .gd-exs li { grid-template-columns: 1fr; } .gd-exs li > .chip { justify-self: start; } }

/* ✱ = right, but most people would say have been + -ing (a spot's "cont"): in the text after the check, in the

.cstar { display: inline-block; font-weight: 700; font-size: .8em; line-height: 1; color: hsl(215,70%,var(--lab-l)); cursor: help; }
.spot .cstar { position: relative; top: -.95em; margin-left: .1em; font-size: .7em; }
.ex-head .cstar { font-size: 1rem; }
.ex-cont { margin: 10px 0 0; padding: 8px 12px; border-radius: 14px; font-size: .92rem; text-align: left;
  background: hsla(215,90%,70%,.14); border: 1px dashed hsla(215,70%,55%,.55); }
.ex-cont b { color: hsl(215,70%,var(--lab-l)); }
.ex-cont-s { font-weight: 600; }
.ex-cont-why { display: block; margin-top: 4px; opacity: .9; }
/* folded to its one line; a small chevron on the right opens the reason */
.ex-cont > summary { position: relative; display: block; list-style: none; cursor: pointer; padding-right: 22px; }
.ex-cont > summary::-webkit-details-marker { display: none; }
.ex-cont > summary::after { content: ""; position: absolute; right: 4px; top: 50%; width: 6px; height: 6px; margin-top: -5px;

.bw .shn { position: absolute; left: .5em; top: .42em; width: .62em; height: .5em; pointer-events: none; transform: rotate(-14deg); will-change: transform; }   /* the shine: a fixed size and place (em), so it never stretches with a wide bubble */
.shn > i:first-child { background: radial-gradient(closest-side, rgba(255,255,255,var(--soap-gl)) 32%, rgba(255,255,255,calc(var(--soap-gl) * .55)) 62%, rgba(255,255,255,0)); }
.shn .pl { opacity: 0; }   /* brighter, with a wider core, as the mouse nears (its opacity = the nearness) */
.shn .pl i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--spot-plus) * .85)), rgba(255,255,255,var(--spot-plus)) 42%, rgba(255,255,255,calc(var(--spot-plus) * .55)) 52%, rgba(255,255,255,calc(var(--spot-plus) * .33)) 62%, rgba(255,255,255,calc(var(--spot-plus) * .12)) 81%, rgba(255,255,255,0)); }
/* The small second spot: a thin streak lying along the bottom-right curve. It moves the other way from the main spot,
   a third as far, and brightens as the mouse nears. */
.bw .glint { position: absolute; right: calc(.47em - .17em); bottom: calc(.47em - .085em); width: .34em; height: .17em; pointer-events: none; opacity: .8; transform: rotate(-45deg); will-change: transform, opacity; }
.glint > i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--soap-gl) * .75)) 45%, rgba(255,255,255,0)); }
/* The rim: a ring (a mask cuts out its middle), over the clear border */
.bw .rim { position: absolute; inset: -1.5px; border-radius: inherit; padding: 1.5px; pointer-events: none;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.rim .rh { position: absolute; left: -5%; top: -40%; width: 110%; height: 180%; opacity: 0; will-change: transform, opacity; }   /* the side facing the mouse lights up as it nears */
.rh > i { background: radial-gradient(closest-side, hsla(var(--th), 100%, var(--rimhi-l), var(--rimhi-a)), transparent); }
/* States: a stronger inner glow and a lifted shadow; right / wrong / shown turn the rim green / red / yellow */
.b.bw:focus-visible { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 12px 22px var(--soap-sh2); }
@media (hover: hover) { .b.bw:hover:not(.drag):not(.lock):not(.gone) { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 12px 22px var(--soap-sh2); } }
.b.bw.drag { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 18px 30px var(--soap-sh2), 0 0 0 4px hsla(var(--th), 90%, 72%, .2); }
.b.bw.ok { border-color: transparent; --ig: inset 0 0 16px hsla(150, 80%, 60%, .42); box-shadow: 0 6px 14px var(--soap-sh); }
.b.bw.bad { border-color: transparent; --ig: inset 0 0 16px hsla(350, 90%, 68%, .45); box-shadow: 0 6px 14px var(--soap-sh); }
.b.bw.shown { border-color: transparent; --ig: inset 0 0 16px hsla(45, 95%, 60%, .45); box-shadow: 0 6px 14px var(--soap-sh); }
.b.bw.ok .rim i, .b.bw.bad .rim i, .b.bw.shown .rim i { visibility: hidden; }   /* hidden, not stopped: they keep turning in step with the film */
.b.bw.ok .rim { background: hsla(150, 60%, 48%, .85); }
.b.bw.bad .rim { background: hsla(350, 80%, 60%, .85); }
.b.bw.shown .rim { background: hsla(40, 90%, 55%, .9); }
.bcloud .b.bw.gone .spin { animation-play-state: paused; }   /* a used trap word, faded: no need to keep turning */
/* Off screen (.still, 24-shine.js) or while a word is carried (body.carrying), the bob and the turning pause */
.bround.still .bw, .bround.still .spin, body.carrying .bcloud .bw, body.carrying .bround .spin { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .bw .spin { animation: none !important; } }
/* Touch screens: the film doesn't turn (each bubble keeps its own angle, --ang); the bob stays */
@media (hover: none) { .bw .spin { animation: none; } }
/* 90-scrollbar: copied from Preposition Bubbles (../preposition practice 2, 90-scrollbar.css): in the cards that scroll
   (Favorites / Seen, Guide, end of game, tutorial) a thin glossy pill with the pink-to-purple gradient on a clear track;
   the page itself shows none. Firefox only takes colours, so it gets a thin pink thumb (in @supports). */
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: transparent; margin: 18px 0; }
::-webkit-scrollbar-thumb {
  border: 3px solid transparent; border-radius: 999px; background-clip: padding-box;
  background-image: linear-gradient(180deg, hsl(315,85%,66%), hsl(275,80%,64%));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45);
}
::-webkit-scrollbar-thumb:hover { background-image: linear-gradient(180deg, hsl(315,90%,60%), hsl(275,85%,58%)); }
::-webkit-scrollbar-thumb:active { border-width: 2px; }
::-webkit-scrollbar-button, ::-webkit-scrollbar-corner { display: none; background: transparent; }
@supports (-moz-appearance: none) {
  * { scrollbar-width: thin; scrollbar-color: hsl(295,82%,66%) transparent; }
}
/* The page itself still scrolls on short screens, but shows no bar (only the cards and lists do). */
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }
</style>

<div class="sky" id="sky" aria-hidden="true"></div>
<header class="dock" role="toolbar" aria-label="Controls">

  <button type="button" class="tourbtn" id="guidebtn" aria-label="Guide" title="Guide: every use, with timelines"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M8 8h8M8 12h5"/></svg><span data-ui="guide">Guide</span></button>
  <span class="hbtns" id="listbtns">
  <button type="button" class="tourbtn" id="favbtn" aria-label="Favorites" title="Your favorite texts"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3.2 2.7 5.5 6 .9-4.35 4.25 1 6L12 17l-5.4 2.85 1-6L3.3 9.6l6-.9z"/></svg><span data-ui="favorites">Favorites</span></button>
  <button type="button" class="tourbtn" id="seenbtn" aria-label="Seen texts" title="Your progress, recent and missed texts"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 4v4.5h4.5"/><path d="M12 7.5V12l3 2"/></svg><span data-ui="seen">Seen</span></button>
  </span>
  <button type="button" class="tourbtn" id="tour-btn" aria-label="Tutorial" title="Tutorial: a one-minute tour"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.2a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.4-2.7 4"/><circle cx="12" cy="17.6" r=".6" fill="currentColor"/></svg><span data-ui="tutorial">Tutorial</span></button>

    <span class="volwrap" id="volwrap"><button type="button" id="snd" aria-pressed="true" aria-label="Volume" title="Volume"></button><span class="volp"><label class="volr"><span data-ui="volEffects">Effects</span><input type="range" id="vol" min="0" max="100" step="1" aria-label="Sound effects volume" data-ui-aria="volEffectsAria"></label><label class="volr"><span data-ui="volVoice">Voice</span><input type="range" id="vvol" min="0" max="100" step="1" aria-label="Voice volume" data-ui-aria="volVoiceAria"></label></span></span>
  </div>

</header>

<div class="wrap">

    <div class="prog"><span id="proglbl">Text 1 of 5</span><span class="days" id="days" hidden></span><div class="pbar"><i id="pfill"></i></div></div>
    <div class="playwrap" id="playwrap">
      <button type="button" class="tile" id="restart" title="New game and other ways to play" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.5h-4.5"/></svg><small>new game</small></button>
      <div class="playmenu" id="playmenu" role="menu" hidden>
        <button type="button" role="menuitem" data-mode="normal"><span data-ui="pmNormal">Normal game</span><small id="pm-lv"></small></button>
        <button type="button" role="menuitem" data-mode="speed"><span data-ui="pmSpeed">Quick-fire</span><small id="pm-speed"></small></button>
        <button type="button" role="menuitem" data-mode="review"><span data-ui="pmReview">Review missed</span><small id="pm-miss"></small></button>
        <button type="button" role="menuitem" data-mode="fav"><span data-ui="pmFav">Favorites</span><small id="pm-fav"></small></button>

  </main>
  <section class="quiz" id="quiz" hidden aria-live="polite"></section>
  <section class="bround" id="build" hidden aria-label="Build the sentence">
    <div class="bprompt"><span class="btag" id="bptag"></span><p class="bpt" id="bpt" lang="pt"></p></div>
    <div class="bqbox" id="bqbox"><span class="btag" id="btag"></span><div class="bslots" id="bslots"></div></div>
    <div class="bcloud" id="bcloud" aria-label="Words to choose from"></div>
    <p class="bfb" id="bfb" aria-live="polite"></p>
    <div class="bx" id="bx" hidden></div>
    <div class="rv-btns"><button type="button" class="cta pulse" id="bnext" hidden>Next &rarr;</button></div>
  </section>

  <div class="tools" id="tools">
    <span class="trywrap"><small class="trylab" data-ui="tries">Tries</small><span class="tries" id="tries" aria-label="Tries left"></span></span>
    <button type="button" class="pbtn" id="hintbtn" title="Light up the time words (1 per text). Unused hints = bonus points."><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2.2h5c.1-1 .5-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg><span data-ui="hint">Clues</span> <small id="hintleft">3 left</small></button>
    <button type="button" class="pbtn" id="resetbtn" title="Switch every have / has off"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span data-ui="reset">Reset</span></button>
    <button type="button" class="cta" id="checkbtn"><span data-ui="check">Check</span> &#10003;</button>
  </div>

  <section class="reveal" id="reveal" hidden aria-live="polite"></section>
</div>

<div class="favmodal" id="listmodal" role="dialog" aria-modal="true" aria-labelledby="listtitle">
  <div class="favcard">
    <div class="favhead"><h2 id="listtitle"></h2><button type="button" class="favx" data-close aria-label="Close">&times;</button></div>
    <div class="listprog" id="listprog" hidden></div>
    <div class="seg listtabs" id="listtabs" role="group" aria-label="Which texts"><button type="button" data-tab="recent" data-ui="tabRecent">Recent</button><button type="button" data-tab="missed" data-ui="tabMissed">Missed</button></div>
    <ul class="rlist" id="listbody"></ul>
    <p class="listempty" id="listempty" hidden></p>
    <div class="listfoot"><button type="button" class="cta" id="listplay" hidden>Practice these</button></div>
  </div>
</div>
<div class="favmodal" id="endmodal" role="dialog" aria-modal="true" aria-labelledby="endtitle">
  <div class="favcard">
    <div class="favhead"><h2 id="endtitle">Game complete!</h2><button type="button" class="favx" data-close aria-label="Close">&times;</button></div>
    <div class="pend"><div class="stars" id="endstars"></div><b id="endscore"></b><div class="pmsg" id="endmsg"></div><div class="psub" id="endsub"></div><div class="psub" id="endhints"></div></div>
    <div class="endprog" id="endprog"></div>
    <div class="endbtns"><button type="button" class="cta" id="endagain" data-ui="playAgain">Play again</button><button type="button" class="pbtn" id="endcopy">Copy results</button><button type="button" class="pbtn" id="endup" hidden></button></div>
    <ul class="rlist" id="endlist"></ul>
  </div>
</div>
<div class="favmodal" id="guidemodal" role="dialog" aria-modal="true" aria-labelledby="guidetitle">
  <div class="favcard guidecard">
    <div class="favhead"><h2 id="guidetitle">Present perfect or past simple?</h2>
      <div class="tour-lang gd-lang" id="guidelang" role="group" aria-label="Guide language"><button type="button" data-gl="en" lang="en">EN</button><button type="button" data-gl="pt" lang="pt">PT</button></div>
      <button type="button" class="favx" data-close aria-label="Close">&times;</button></div>
    <div id="guidebody"></div>
    <button type="button" class="gd-back" id="guideback" data-close hidden><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg><span id="guidebackt">Back to the explanations</span></button>
  </div>
</div>

<div class="tour" id="tour" hidden>
  <div class="tour-shield"></div>
  <div class="tour-spot" id="tour-spot" aria-hidden="true"></div>
  <div class="tour-card" id="tour-card" role="dialog" aria-modal="true" aria-labelledby="tour-title" aria-describedby="tour-text">
    <button type="button" class="tour-x" id="tour-x" aria-label="Close the tutorial">&times;</button>
