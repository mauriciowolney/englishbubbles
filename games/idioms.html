<script>
/* early-theme.js — runs in <head>, before the first paint, in the menu AND in every game: puts on the background
   colour saved in eb-bg (the games' palettes, "p:sky" or "c:#7aa7ff"), so a page never flashes its default colour
   first. The page's own 01-theme.js applies the same colour again a moment later. Keep PAL in step with PALETTES
   (src/js/01-theme.js and the games). */
(function () {
  try {
    var PAL = {
      sky: ["#e4f3fb", "#f1e8fb", "#fdf0e6", 0], peach: ["#ffe6d8", "#ffd6e4", "#fff1c9", 0],
      mint: ["#d9f4e6", "#d3eef6", "#eef6d3", 0], lilac: ["#e9e0fb", "#f7d9ee", "#dbe6fb", 0],
      dusk: ["#2a1740", "#58224f", "#1f3560", 1], midnight: ["#141964", "#441464", "#144e64", 1]
    };
    var s = Storage.prototype.getItem.call(window.localStorage, "eb-bg") || "", c = null;
    if (s.indexOf("p:") === 0) c = PAL[s.slice(2)] || null;
    else if (/^c:#[0-9a-f]{6}$/i.test(s)) {
      var hex = s.slice(2), r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255,
        b = parseInt(hex.slice(5, 7), 16) / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b),
        l = (mx + mn) / 2, h = 0, sat = 0, d = mx - mn;
      if (d) {
        sat = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
        h = (mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) * 60;
      }
      var col = function (dh) { return "hsl(" + ((h + dh + 360) % 360).toFixed(0) + "," + (sat * 100).toFixed(0) + "%," + (l * 100).toFixed(0) + "%)"; };
      c = [col(0), col(40), col(-40), l * 100 < 52];
    }
    if (c) {
      var root = document.documentElement;
      root.style.setProperty("--bg-a", c[0]); root.style.setProperty("--bg-b", c[1]); root.style.setProperty("--bg-c", c[2]);
      root.dataset.theme = c[3] ? "dark" : "light";
    }
  } catch (e) {}
  // The phone's bars (theme-color) follow the background: its top colour --bg-a, set here or later by the page's own
  // colour picker (menu or game: both write --bg-a on <html>). No colour chosen: the default light / dark ones.
  try {
    var html = document.documentElement, last = "";
    var bar = function () {
      var a = html.style.getPropertyValue("--bg-a").trim(), m = document.querySelectorAll('meta[name="theme-color"]');
      for (var i = 0; i < m.length; i++) {
        var v = a || (/dark/.test(m[i].media) ? "#141964" : "#e4f3fb");
        if (m[i].content !== v) m[i].content = v;
      }
      last = a;
    };
    bar();
    document.addEventListener("DOMContentLoaded", bar);
    new MutationObserver(function () {
      if (html.style.getPropertyValue("--bg-a").trim() !== last) bar();
    }).observe(html, { attributes: true, attributeFilter: ["style"] });
  } catch (e) {}
})();

/* iPhone / iPad: ask for a "playback" audio session, so the game's sounds play even with Silent mode on (iOS 17+;
   some games already do this themselves). Websites can't detect Silent mode, so the menu also shows a tip. */
try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
document.documentElement.classList.add("eb-arrive");   /* the header slides in (see the style below) */

<script>
/* Every game saves its progress in the phone's storage. In the app all games share one storage, so each game's
   keys get the prefix "eb:idioms:" here; two games can then use the same key names without overwriting each other.
   One exception: the background colour (every game saves it as "<prefix>-bg", e.g. "p:sky" or "c:#7aa7ff", like
   the menu) is ONE setting for the whole app, kept under the menu's key "eb-bg": the game opens with the colour
   chosen in the menu, and a colour chosen in a game becomes the menu's and the other games' too. */
(function () {
  try {
    var P = "eb:idioms:", L = window.localStorage, S = Storage.prototype, BG = /^[a-z]+-bg$/;
    var get = S.getItem, set = S.setItem, del = S.removeItem;
    /* The EN / PT toggles too: ONE language for the whole app, the menu's (eb-lang). Each game saves its toggles
       under its own keys, with its own word for Portuguese (games.json "lang": "pt", "tr" or "native"; English is
       always "en"): reading one gives the menu's language, and a tap in a game changes the menu's and every
       game's. Until EN / PT is chosen, the menu's own rule: Portuguese for My level All / A1 / A2, English from B1. */
    var LG = {"idm-guidelang": "pt", "idm-tourlang": "pt"};
    function appLang() {
      var l = get.call(L, "eb-lang");
      if (l === "en" || l === "pt") return l;
      var lv = get.call(L, "eb-level");
      return lv === "B1" || lv === "B2+" ? "en" : "pt";
    }
    /* The sound-effects volume too (2026-11-26, the user): ONE for the whole app, the menu's "eb-vol" (0-100,
       0 = sound off). Every game saves "<prefix>-vol" (0-100, its Effects slider) plus an on / off key:
       "<prefix>-snd" ("0" = off) or "<prefix>-mute" ("1" = off). Reading them gives the menu's volume (menu at 0:
       the game opens muted, its slider where it was); after a game writes either, eb-vol = 0 if muted, else its
       slider. The Voice slider ("-vvol") stays each game's own. */
    var VOL = /^[a-z]+-vol$/, MUTE = /^[a-z]+-(snd|mute)$/;
    function own(k) { return get.call(L, P + k); }
    function syncVol(k) {
      var pre = k.slice(0, k.indexOf("-")), v = parseInt(own(pre + "-vol"), 10);
      if (isNaN(v) || v < 0 || v > 100) return;
      var off = own(pre + "-snd") === "0" || own(pre + "-mute") === "1";
      set.call(L, "eb-vol", String(off ? 0 : v));
    }
    S.getItem = function (k) {
      if (this === L && BG.test(k)) { var app = get.call(this, "eb-bg"); if (app) return app; }
      if (this === L && (VOL.test(k) || MUTE.test(k))) {
        var ev = get.call(this, "eb-vol");
        if (ev !== null && VOL.test(k) && ev !== "0") return ev;
        if (ev !== null && MUTE.test(k)) { var off = ev === "0"; return /-snd$/.test(k) ? (off ? "0" : "1") : (off ? "1" : "0"); }
      }
      if (this === L && LG.hasOwnProperty(k)) return appLang() === "en" ? "en" : LG[k];
      return get.call(this, this === L ? P + k : k);
    };
    S.setItem = function (k, v) {
      if (this === L && BG.test(k)) set.call(this, "eb-bg", v);
      if (this === L && LG.hasOwnProperty(k)) set.call(this, "eb-lang", String(v) === "en" ? "en" : "pt");
      var r = set.call(this, this === L ? P + k : k, v);
      if (this === L && (VOL.test(k) || MUTE.test(k))) syncVol(k);
      return r;
    };
    S.removeItem = function (k) { return del.call(this, this === L ? P + k : k); };
    /* The app's own keys (eb-rounds, eb-don…) and language, for the injected donation script (donate.js) */
    window.ebApp = { get: function (k) { return get.call(L, k); }, set: function (k, v) { set.call(L, k, v); }, lang: appLang };
    /* Opened from the menu (a card or Continue)? Then the game starts at the menu's level ("My level"): the menu
       leaves a one-time note (sessionStorage eb-level-go), and the matching level is saved under the game's own
       level key before the game reads it (games.json "level"; the nearest level when the game doesn't have it).
       With "All" on the menu, or on a reload, the game keeps its own last level. */
    var LV = {"key": "idm-level", "A1": "B1", "A2": "B1", "B1": "B1", "B2+": "B2+"}, SS = window.sessionStorage;
    if (SS.getItem("eb-level-go") === "idioms") {
      SS.removeItem("eb-level-go");
      var m = get.call(L, "eb-level");
      if (LV && LV[m]) set.call(L, P + LV.key, LV[m]);
    }
  } catch (e) {}
})();
</script>

/* 55-soap: Soap bubbles (from Be Do Modal, 2026-11-22): the film, rim, shine spots and glows inside every stage bubble (SOAP in 10-game.js), their states, what pauses them. */
/* Almost clear, a faint film of colour inside and a coloured rim, both turning once in 10 s; the bubble's own colour
   (--h, which drifts: 11-layout.js) leads about half of each turn. The numbers that differ per theme are tokens in
   00-base.css (--soap-*, --spot-plus, --film-a, --srim-*, --sglow-*, --rimhi-*, --faceg-*). Built from spans, each drawn
   once: the film and the rim turn by rotating a still conic gradient (.spin, a transform animation: nothing is
   repainted), and what follows the mouse moves by transform / opacity only (25-shine.js). Paint order, bottom to top:
   the film (.spin, the white sheen ::before, the glow facing the mouse .fg, the inner glow ::after), the shine spot, the
   rim, the small spot, the text (.bt). The border stays, clear, so nothing changes size. This overrides the old filled
   look of .b (10-bubbles.css) and the states' borders / shadows (50-stage.css, 30-extras.css). */
.p .b { --bw: 1.5px; --rw: 1.5px; border-color: transparent; background: none;
  --ig: inset 0 0 12px hsla(var(--h), 95%, var(--sglow-l), var(--sglow-a));   /* the inner glow, drawn above the film by .film::after; the states below change it */
  box-shadow: 0 6px 14px var(--soap-sh); }
.p .b.idm { --bw: 3.5px; --rw: 3px; border-color: transparent; }   /* idioms keep a thicker rim (and the faint outer ring, 10-bubbles.css) */
.p .b::before, .p .b::after { content: none; }   /* the old gloss: the shine is the .spot span now */
.b > .bt { position: relative; display: block; }   /* the text, above the soap spans */
.b > .film, .b > .spot, .b > .rim, .b > .glint { cursor: default; pointer-events: none; }   /* fixed: an inherited cursor would restyle them all when .m comes and goes */
.b > .film { position: absolute; inset: calc(-1 * var(--bw)); z-index: 0; border-radius: inherit; overflow: hidden; }
.b > .film::before { content: ""; position: absolute; inset: 0; z-index: 1;
  background: radial-gradient(120% 120% at 30% 20%, rgba(255,255,255,var(--soap-hi)), rgba(255,255,255,var(--soap-lo)) 60%, transparent); }
.b > .film::after { content: ""; position: absolute; inset: var(--bw); z-index: 3; border-radius: inherit; box-shadow: var(--ig); transition: box-shadow .25s ease; }
/* The turning colour of the film and of the rim: a square at least as wide as the bubble's diagonal (--sq, set in
   place(), 11-layout.js: sentence bubbles can be tall), centred; rotating it is the same picture as turning the conic
   gradient's start. Both start together (one --sdl per bubble), so their colours stay in step. */
.b .spin { position: absolute; left: 50%; top: 50%; width: var(--sq, calc(100% + 1.6em)); aspect-ratio: 1; translate: -50% -50%;
  animation: spin 10s linear var(--sdl, 0s) infinite; }
.film .spin { background: conic-gradient(from var(--ang, 0deg), hsla(var(--h), 95%, 76%, var(--film-a)) 0 30%, hsla(calc(var(--h) + 90), 95%, 80%, calc(var(--film-a) * .6)) 50%, hsla(calc(var(--h) + 200), 90%, 82%, calc(var(--film-a) * .7)) 72%, hsla(var(--h), 95%, 76%, var(--film-a)) 92%); }
.rim .spin { background: conic-gradient(from var(--ang, 0deg), hsla(var(--h), 90%, var(--srim-l), var(--srim-a)) 0 30%, hsla(calc(var(--h) + 90), 90%, calc(var(--srim-l) + 4%), calc(var(--srim-a) * .64)) 50%, hsla(calc(var(--h) + 200), 85%, calc(var(--srim-l) + 8%), calc(var(--srim-a) * .56)) 72%, hsla(var(--h), 90%, var(--srim-l), var(--srim-a)) 92%); }
@keyframes spin { to { transform: rotate(360deg); } }
/* What follows the mouse: 25-shine.js writes the transform and opacity of these wrappers (at rest they are as here);
   the look is the <i> inside, so a wrapper has nothing to re-read when it moves. Each is its own layer. */
.fg > i, .rh > i, .spot i, .glint > i { position: absolute; inset: 0; }
.film .fg { position: absolute; left: -10%; top: -45%; width: 120%; height: 190%; z-index: 2; opacity: 0; will-change: transform, opacity; }   /* inside, the side facing the mouse glows as it nears */
.fg > i { background: radial-gradient(closest-side, hsla(var(--h), 100%, var(--faceg-l), var(--faceg-a)), transparent); }
.b > .spot { position: absolute; left: .5em; top: .42em; width: .62em; height: .5em; transform: rotate(-14deg); will-change: transform; }   /* the shine: a fixed size and place (em), so a wide bubble never stretches it */
.spot > i:first-child { background: radial-gradient(closest-side, rgba(255,255,255,var(--soap-gl)) 32%, rgba(255,255,255,calc(var(--soap-gl) * .55)) 62%, rgba(255,255,255,0)); }
.spot .pl { opacity: 0; }   /* brighter, with a wider core, as the mouse nears (its opacity = the nearness) */
.spot .pl i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--spot-plus) * .85)), rgba(255,255,255,var(--spot-plus)) 42%, rgba(255,255,255,calc(var(--spot-plus) * .55)) 52%, rgba(255,255,255,calc(var(--spot-plus) * .33)) 62%, rgba(255,255,255,calc(var(--spot-plus) * .12)) 81%, rgba(255,255,255,0)); }
/* The small second spot: a thin streak lying along the bottom-right curve (fixed size in em, rotated -45deg, just
   inside the rim). It moves the other way from the main spot, a third as far, and brightens as the mouse nears. */
.b > .glint { position: absolute; right: calc(.47em - .17em); bottom: calc(.47em - .085em); width: .34em; height: .17em; opacity: .8; transform: rotate(-45deg); will-change: transform, opacity; }
.glint > i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--soap-gl) * .75)) 45%, rgba(255,255,255,0)); }
/* The rim: a ring (a mask cuts out its middle), over the clear border */
.b > .rim { position: absolute; inset: calc(-1 * var(--bw)); border-radius: inherit; padding: var(--rw);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.rim .rh { position: absolute; left: -5%; top: -40%; width: 110%; height: 180%; opacity: 0; will-change: transform, opacity; }   /* the side facing the mouse lights up as it nears */
.rh > i { background: radial-gradient(closest-side, hsla(var(--h), 100%, var(--rimhi-l), var(--rimhi-a)), transparent); }
/* States */
.p.m:hover .b, .p.drag .b, .p .b.sel { --ig: inset 0 0 16px hsla(var(--h), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 12px 22px var(--soap-sh2), 0 0 0 4px hsla(var(--h), 90%, 72%, .18); }
.p .b.hot { --srim-a: 1; --ig: inset 0 0 20px hsla(var(--h), 100%, var(--sglow-l), calc(var(--sglow-a) + .24)); box-shadow: 0 10px 20px var(--soap-sh2), 0 0 0 5px hsla(var(--h), 90%, 70%, .3); }
.p .b.done { --srim-a: .95; --ig: inset 0 0 18px hsla(var(--h), 100%, var(--sglow-l), calc(var(--sglow-a) + .16)); box-shadow: 0 8px 18px var(--soap-sh2), 0 0 0 3px hsla(var(--h), 90%, 75%, .2); }   /* a matched idiom: a stronger rim and glow */
.p .b.shake, .p .b.bad { --ig: inset 0 0 14px hsla(350, 95%, 70%, .4); box-shadow: 0 6px 14px var(--soap-sh); }   /* a wrong match: a red rim */
.b.shake > .rim, .b.bad > .rim { background: hsla(350, 85%, 62%, .8); }
.b.shake > .rim .spin, .b.bad > .rim .spin { visibility: hidden; }   /* hidden, not stopped: it keeps turning in step with the film */
/* Off screen (#stage.still) and while a bubble is carried (body.carrying; 25-shine.js / 12-drag.js) the turning pauses */
#stage.still .spin, body.carrying .spin { animation-play-state: paused; }
/* Touch screens: the film doesn't turn (Be Do Modal: it lagged a phone with many bubbles); each bubble keeps its own
   angle (--ang, mk() in 10-game.js). None with reduced motion. */
@media (hover: none) { .b .spin { animation: none; } }
@media (prefers-reduced-motion: reduce) { .b .spin { animation: none; } }
/* A carried bubble's .b gets its transform every frame (squash and stretch, sqFrame in 12-drag.js): no transition on it */
.p.drag .b { transition: box-shadow .25s ease; }
/* A finished idiom with a ? button (.org, 30-extras.css, top left): the shine spot sits just right of it, not under it */
.p.has-org .b > .spot { left: 2.15em; top: .38em; }
/* 60-scrollbar: Scrollbars copied from the user's recent games (../bedomodal 80-scrollbar, ../vocabulary practice): in the cards
   that scroll (end of game, Time's up results, Favorites / Seen, Practice, origin) a thin glossy pill with the
   pink-to-purple gradient on a clear track; the page itself has none. Chrome / Edge / Safari use the ::-webkit-scrollbar
   parts; Firefox only takes colours, so it gets a thin pink thumb (in @supports, since Chrome would let these override the pill). */
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: transparent; margin: 18px 0; }
::-webkit-scrollbar-thumb {
  border: 3px solid transparent; border-radius: 999px; background-clip: padding-box;
  background-image: linear-gradient(180deg, hsl(330,85%,66%), hsl(265,80%,64%));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45);
}
::-webkit-scrollbar-thumb:hover { background-image: linear-gradient(180deg, hsl(330,90%,60%), hsl(265,85%,58%)); }
::-webkit-scrollbar-thumb:active { border-width: 2px; }
::-webkit-scrollbar-button, ::-webkit-scrollbar-corner { display: none; background: transparent; }
@supports (-moz-appearance: none) {
  * { scrollbar-width: thin; scrollbar-color: hsl(330,85%,66%) transparent; }
}
/* The page itself still scrolls on short screens, but shows no bar (only the cards and lists do). */
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }
/* 90-tour: Tutorial button and guided tour (spotlight, card, dots, confetti). */

@media (max-width: 600px) {
  .dock > .seg { width: auto; flex: 0 1 auto; }
  .dock > .seg.level { flex: 1 1 auto; } /* the level picker takes the rest of row one */
  .dock::after { content: ""; flex-basis: 100%; height: 0; order: 1; }
  .dock > #guidebtn, .dock > .hbtns, .dock > #tour-btn, .dock > .vseg, .dock > .swwrap { order: 2; }
}
/* One height for the header pills (the level picker, the idioms-per-round pill, Favorites / Seen / Tutorial): the
   round buttons' own size (18 px icon + padding + border), set on all three so they line up. */
.dock { --pill-h: calc(18px + 1.1 * .92rem + 2px); }
@media (max-width: 600px) { .dock { --pill-h: calc(18px + .92rem + 2px); } }
.tourbtn, .seg.level, .dock > .nseg { box-sizing: border-box; height: var(--pill-h); }
.seg.level { align-items: stretch; }
.seg.level button { padding-top: 0; padding-bottom: 0; }
/* the "− 4 idioms +" control wears the same outline as the other pills */
.dock > .nseg { flex-wrap: nowrap; align-items: center; padding: 0 2px; border-radius: 999px; border: 1px solid var(--dock-line); }
.dock > .nseg .nstep button { padding: .3em .6em; }
/* Edge jitter (from Be, Do & Modals / Verb Bubbles): while something rises on hover it gets an invisible strip reaching
   back past where its bottom edge was, so the cursor on that edge keeps the hover after the lift instead of flickering.
   Only while hovered (an always-on strip would catch the cursor below the edge and jitter there). Strip = lift + 3px:
   the new-game tile rises 2px, the round buttons 1px. The board's bubbles lift inside a still wrapper: no jitter. */
.tile { position: relative; }
@media (hover: hover) {
  .tile:hover::after, .tourbtn:not(.fresh):hover::after { content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: -5px; }
  .tourbtn:not(.fresh):hover::after { bottom: -4px; }
}
/* PT / EN switch beside the step label (2026-11-26, as in False Friend Bubbles' tour-lang) */
.tour-head { display: flex; align-items: center; gap: .6rem; padding-right: 2.2rem; }
.tour-head .tour-step { padding-right: 0; flex: 1; }
.tour-lang { display: flex; gap: 2px; padding: 2px; border-radius: 999px; border: 1px solid var(--dock-line); flex: none; }
.tour-lang button { appearance: none; border: 0; cursor: pointer; font-family: inherit; font-size: .7rem; font-weight: 600; letter-spacing: .06em; line-height: 1;
  padding: .45em .75em; border-radius: 999px; color: var(--ink); background: transparent; transition: background-color .2s ease, color .2s ease; }
.tour-lang button:hover { background: var(--dock-line); }
.tour-lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg-a); }
.tour-lang button:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .tour-spot::after { opacity: .8; } } /* a still ring instead of the pulses */
</style>
</head>

<script>
const DATA = {"idioms":[{"idiom":"Break the ice","level":"B1","meaning":"Ease tension when people first meet.","pt":"quebrar o gelo","example":["I opened with a joke to break the ice."],"ptEx":["Abri com uma piada para {quebrar o gelo}."],"situation":"Nobody at the workshop knew each other, so the host started with a quick, silly game to get people talking.","origin":"Ships once had to break through frozen water to open a path for trade. By the 1500s, English writers were using the phrase figuratively for starting a conversation.","forms":[["past","broke the ice"],["ing","breaking the ice"]]},{"idiom":"Piece of cake","level":"B1","meaning":"Very easy.","pt":"moleza / mamão com açúcar","example":["How was the exam?","Piece of cake."],"ptEx":["Como foi a prova?","{Moleza}."],"situation":"Leo finished the whole test in ten minutes and didn't find a single question hard.","origin":"It may come from 'cakewalk' contests in the American South, where a cake was the prize for the best walk, so winning looked easy."},{"idiom":"Under the weather","level":"B1","meaning":"Feeling slightly sick.","example":["I'm a bit under the weather, so I'll work from home."],"ptEx":["Estou {meio indisposto}, então vou trabalhar de casa."],"situation":"Marta has a slight headache and a runny nose, so she's staying home today.","origin":"Sailors who felt seasick were sent below deck, away from the weather, to recover."},{"idiom":"Hit the nail on the head","level":"B1","meaning":"Describe something exactly right.","pt":"acertar na mosca","example":["You hit the nail on the head: the problem is communication."],"ptEx":["Você {acertou na mosca}: o problema é a comunicação."],"situation":"Sara said the real problem was poor communication, and everyone agreed she was exactly right.","forms":[["ing","hitting the nail on the head"]]},{"idiom":"Spill the beans","level":"B1","meaning":"Reveal a secret.","pt":"dar com a língua nos dentes","example":["Who spilled the beans about the surprise party?"],"ptEx":["Quem {deu com a língua nos dentes} sobre a festa surpresa?"],"situation":"Tom told everyone about the surprise party a week before it happened.","origin":"A popular theory points to ancient Greek voting, where beans were used as ballots and a spilled jar gave away the result early. The idiom itself only appears in print in the early 1900s.","forms":[["past","spilled the beans"],["ing","spilling the beans"]]},{"idiom":"Once in a blue moon","level":"B1","meaning":"Very rarely.","pt":"uma vez na vida, outra na morte","example":["We only eat out once in a blue moon."],"ptEx":["A gente só come fora {uma vez na vida, outra na morte}."],"situation":"We live far apart, so I only see my cousins every few years.","origin":"A 'blue moon' is the rare second full moon in a single calendar month, which happens only about every two or three years."},{"idiom":"Cost an arm and a leg","level":"B1","meaning":"Be very expensive.","pt":"custar os olhos da cara","example":["That repair cost an arm and a leg."],"ptEx":["Esse conserto {custou os olhos da cara}."],"situation":"The concert tickets were so expensive that Julia spent half her salary on them.","forms":[["s","costs an arm and a leg"],["ing","costing an arm and a leg"]]},{"idiom":"Bite the bullet","level":"B1","meaning":"Do something unpleasant that can't be avoided.","example":["I finally bit the bullet and booked the dentist."],"ptEx":["Finalmente {criei coragem} e marquei o dentista."],"situation":"Ben hates the dentist, but the pain wouldn't stop, so he finally booked the appointment.","origin":"Often linked to wounded soldiers biting on a bullet to endure surgery without anesthesia. The phrase is in print by the late 1800s.","forms":[["past","bit the bullet"],["ing","biting the bullet"]]},{"idiom":"Let the cat out of the bag","level":"B1","meaning":"Accidentally reveal a secret.","example":["Oops, I let the cat out of the bag about the promotion."],"ptEx":["Ops, {deixei escapar} a história da promoção."],"situation":"Mia mentioned the gift by mistake, right in front of her brother, days before his birthday.","origin":"Often explained by a market trick: sellers put a cat in a sack instead of a piglet, and opening the bag exposed the swindle. The story is plausible but unproven.","forms":[["ing","letting the cat out of the bag"]]},{"idiom":"Call it a day","level":"B1","meaning":"Stop working for now.","example":["We've done enough. Let's call it a day."],"ptEx":["Já fizemos o bastante. Vamos {encerrar por hoje}."],"situation":"It's 7 p.m. and the team is tired, so the manager says they can stop and continue tomorrow.","forms":[["past","called it a day"],["ing","calling it a day"]]},{"idiom":"On the same page","level":"B1","meaning":"Share the same understanding.","example":["Before we start, are we all on the same page?"],"ptEx":["Antes de começar, {estamos todos alinhados}?"],"situation":"Before the meeting, the two partners checked that they both understood the plan the same way."},{"idiom":"Back to square one","level":"B1","meaning":"Start over after a failure.","pt":"voltar à estaca zero","example":["The client rejected it, so it's back to square one."],"ptEx":["O cliente rejeitou, então {voltamos à estaca zero}."],"situation":"The experiment failed completely, so the team has to begin all over again."},{"idiom":"The ball is in your court","level":"B1","meaning":"It's your turn to act or decide.","example":["I've sent my offer. The ball is in your court."],"ptEx":["Mandei minha proposta. {Agora é com você}."],"situation":"I've sent my offer. Now I'm waiting for you to decide what happens next."},{"idiom":"Beat around the bush","level":"B1","meaning":"Avoid getting to the point.","pt":"fazer rodeios / enrolar","example":["Stop beating around the bush and tell me."],"ptEx":["Pare de {enrolar} e me conte."],"situation":"Instead of saying he wanted a raise, Paulo talked about the weather and the traffic for ten minutes.","forms":[["ing","beating around the bush"]]},{"idiom":"Cut corners","level":"B2+","meaning":"Do something cheaply or carelessly.","example":["They cut corners on the construction."],"ptEx":["Eles {fizeram a obra de qualquer jeito}."],"situation":"To finish faster, the builder used cheap materials and skipped the safety checks.","forms":[["ing","cutting corners"],["s","cuts corners"]]},{"idiom":"Get out of hand","level":"B1","meaning":"Become uncontrollable.","example":["The party got out of hand quickly."],"ptEx":["A festa {saiu do controle} rapidinho."],"situation":"The small party grew to two hundred guests, and nobody could control it anymore.","forms":[["past","got out of hand"],["ing","getting out of hand"]]},{"idiom":"Go the extra mile","level":"B1","meaning":"Make more effort than expected.","example":["She always goes the extra mile for her clients."],"ptEx":["Ela sempre {faz além do esperado} pelos clientes."],"situation":"The waiter walked us to our car with an umbrella, which was far more than his job required.","origin":"Often linked to a teaching in the Bible (Matthew 5:41): if someone forces you to go one mile, go with them two.","forms":[["ing","going the extra mile"],["past","went the extra mile"],["s","goes the extra mile"]]},{"idiom":"Hit the sack","level":"B1","meaning":"Go to bed.","pt":"cair na cama","example":["I'm exhausted. I'm going to hit the sack."],"ptEx":["Estou exausto. Vou {cair na cama}."],"situation":"It's midnight and Dana can't keep her eyes open, so she's heading to bed.","origin":"Mattresses used to be sacks stuffed with straw or hay, so 'the sack' became slang for bed.","forms":[["ing","hitting the sack"]]},{"idiom":"In the loop","level":"B1","meaning":"Informed about what's happening.","example":["Keep me in the loop about the project."],"ptEx":["{Me deixa a par} do projeto."],"situation":"Please copy me on those emails so I know what's going on with the project."},{"idiom":"Keep an eye on","level":"B1","meaning":"Watch or monitor.","pt":"ficar de olho","example":["Can you keep an eye on my bag?"],"ptEx":["Você pode {ficar de olho} na minha bolsa?"],"situation":"Could you watch my bag for a minute while I go to the restroom?","forms":[["ing","keeping an eye on"],["past","kept an eye on"]]},{"idiom":"Miss the boat","level":"B1","meaning":"Lose an opportunity.","pt":"perder o bonde","example":["Tickets sold out. We missed the boat."],"ptEx":["Os ingressos esgotaram. {Perdemos o bonde}."],"situation":"The sale ended yesterday. Rui waited too long to buy the laptop.","forms":[["past","missed the boat"],["ing","missing the boat"]]},{"idiom":"No-brainer","level":"B1","meaning":"An obvious decision.","example":["Free shipping? That's a no-brainer."],"ptEx":["Frete grátis? {Nem precisa pensar}."],"situation":"The new job pays more, is closer to home and has better hours. The choice is obvious.","forms":[["other","no-brainers"]]},{"idiom":"On the fence","level":"B1","meaning":"Undecided.","pt":"ficar em cima do muro","example":["I'm still on the fence about moving."],"ptEx":["Ainda {estou em cima do muro} sobre a mudança."],"situation":"Clara still can't decide whether to accept the job or stay where she is."},{"idiom":"Pull someone's leg","level":"B1","meaning":"Joke or tease someone.","example":["Relax, I'm just pulling your leg."],"ptEx":["Calma, {estou só te zoando}."],"situation":"Dad said the car had been stolen, then laughed and admitted he was only joking.","forms":[["ing","pulling your leg"],["past","pulled my leg"]]},{"idiom":"Read between the lines","level":"B1","meaning":"Understand the hidden meaning.","example":["Read between the lines: he doesn't want the job."],"ptEx":["{Leia nas entrelinhas}: ele não quer o emprego."],"situation":"Her message said \"I'm fine,\" but I could tell from how she wrote it that she was upset.","forms":[["ing","reading between the lines"]]},{"idiom":"Rain check","level":"B1","meaning":"A postponement of an invitation.","example":["Can I take a rain check on dinner?"],"ptEx":["Podemos {remarcar} o jantar?"],"situation":"I can't come to dinner tonight, but I'd love to do it another time.","origin":"In American baseball in the 1800s, a ticket for a rained-out game could be exchanged to attend a later one. Today it means a polite postponement.","forms":[["other","take a rain check"]]},{"idiom":"Sit tight","level":"B1","meaning":"Wait patiently and don't act yet.","example":["Sit tight. I'll call you with an update."],"ptEx":["{Aguenta aí}. Eu te ligo quando tiver novidades."],"situation":"The technician is on his way, so just wait here and don't touch anything.","forms":[["past","sat tight"],["ing","sitting tight"]]},{"idiom":"Take it with a grain of salt","level":"B2+","meaning":"Don't fully believe it.","pt":"dar um desconto","example":["His predictions are usually wrong, so I'd take it with a grain of salt."],"ptEx":["As previsões dele costumam errar, então eu {daria um desconto}."],"situation":"My uncle exaggerates a lot, so I don't completely believe his fishing stories.","origin":"Often traced to Pliny the Elder, who wrote about a poison antidote taken with a pinch of salt. Salt came to stand for caution and skepticism.","forms":[["past","took it with a grain of salt"],["ing","taking it with a grain of salt"]]},{"idiom":"The last straw","level":"B1","meaning":"The final problem that makes you lose patience.","pt":"a gota d'água","example":["Being late again was the last straw."],"ptEx":["Chegar atrasado de novo foi {a gota d'água}."],"situation":"He'd been late all week, and when he missed the big meeting too, his boss finally lost patience."},{"idiom":"Throw in the towel","level":"B1","meaning":"Give up.","pt":"jogar a toalha","example":["After three failed attempts, I threw in the towel."],"ptEx":["Depois de três tentativas fracassadas, {joguei a toalha}."],"situation":"After failing the driving test five times, Nina decided to stop trying.","origin":"From boxing: a trainer throws a towel into the ring to stop the fight and admit defeat.","forms":[["past","threw in the tow ring the negotiation."],"ptEx":["Ela {não deu o braço a torcer} na negociação."],"situation":"Everyone pushed Marta to change her mind, but she refused to move from her position.","forms":[["past","stood her ground"],["ing","standing your ground"]]},{"idiom":"Start from scratch","level":"B1","meaning":"Begin from the very beginning.","pt":"começar do zero","example":["The file was lost, so I had to start from scratch."],"ptEx":["O arquivo se perdeu, então tive que {começar do zero}."],"situation":"The file was deleted, so I have to write the whole report again from the very beginning.","forms":[["ing","starting from scratch"],["past","started from scratch"]]},{"idiom":"Take the lead","level":"B1","meaning":"Take charge or go first.","example":["Would you like to take the lead on this project?"],"ptEx":["Você gostaria de {tomar a frente} deste projeto?"],"situation":"Nobody knew what to do, so Yara stepped forward and organized the group.","forms":[["past","took the lead"],["ing","taking the lead"]]},{"idiom":"Take the plunge","level":"B1","meaning":"Commit to a big decision.","example":["We took the plunge and bought a house."],"ptEx":["{Demos o grande passo} e compramos uma casa."],"situation":"After years of thinking about it, they finally quit their jobs and moved abroad.","forms":[["past","took the plunge"],["ing","taking the plunge"]]},{"idiom":"Talk shop","level":"B2+","meaning":"Talk about work in a social setting.","example":["Let's stop talking shop and enjoy dinner."],"ptEx":["Vamos parar de {falar de trabalho} e curtir o jantar."],"situation":"Even at the barbecue, the two doctors kept discussing their patients.","forms":[["ing","talking shop"],["past","talked shop"]]},{"idiom":"The tip of the iceberg","level":"B1","meaning":"A small visible part of a bigger problem.","pt":"a ponta do iceberg","example":["These complaints are just the tip of the iceberg."],"ptEx":["Essas reclamações são só {a ponta do iceberg}."],"situation":"The auditors found one fake invoice, and they suspect there are hundreds more."},{"idiom":"Throw someone under the bus","level":"B2+","meaning":"Blame someone to protect yourself.","example":["When the project failed, he threw me under the bus to save his job."],"ptEx":["Quando o projeto deu errado, ele {me jogou aos leões} para salvar o emprego."],"situation":"When the project failed, the manager blamed his assistant to protect himself.","forms":[["past","threw me under the bus"],["ing","throwing me under the bus"]]},{"idiom":"Tie up loose ends","level":"B2+","meaning":"Finish remaining small tasks.","example":["I need to tie up loose ends before my vacation."],"ptEx":["Preciso {resolver as pendências} antes das férias."],"situation":"Before her vacation, Olga finished the last few small tasks on her list.","forms":[["ing","tying up loose ends"],["past","tied up loose ends"]]},{"idiom":"Top-notch","level":"B1","meaning":"Excellent.","example":["The service at this hotel is top-notch."],"ptEx":["O atendimento deste hotel é {de primeira}."],"situation":"The service at that hotel is excellent in every way."},{"idiom":"Up to speed","level":"B1","meaning":"Fully informed about the latest.","example":["Let me bring you up to speed on the project."],"ptEx":["Deixa eu {te atualizar} sobre o projeto."],"situation":"I've been away for two weeks. Can you tell me everything that's changed?"},{"idiom":"Vicious circle","level":"B2+","meaning":"A problem that keeps making itself worse.","example":["No sleep leads to stress, and stress leads to no sleep. It's a vicious circle."],"ptEx":["Falta de sono gera estresse, e estresse gera falta de sono. É um {círculo vicioso}."],"situation":"He can't sleep because he's stressed, and he's stressed because he can't sleep.","forms":[["other","vicious circles"]]},{"idiom":"Water under the bridge","level":"B2+","meaning":"Past problems that no longer matter.","pt":"águas passadas","example":["Sorry about the argument.","It's water under the bridge."],"ptEx":["Desculpa pe ing on your feet"],["past","thought on her feet"]]},{"idiom":"Pick up the slack","level":"B2+","meaning":"Do work that others aren't doing.","example":["Two teammates were out sick, so I had to pick up the slack."],"ptEx":["Dois colegas estavam doentes, então eu tive que {cobrir a parte deles}."],"situation":"Two colleagues are on sick leave, so the rest of the team is doing their work.","forms":[["past","picked up the slack"],["ing","picking up the slack"]]},{"idiom":"Pull your weight","level":"B2+","meaning":"Do your fair share of the work.","example":["Everyone has to pull their weight on this project."],"ptEx":["Todo mundo tem que {fazer a sua parte} neste projeto."],"situation":"In the group project, one student did nothing while the others did everything. He needs to do his share.","forms":[["ing","pulling your weight"],["past","pulled his weight"],["other","pull their weight"]]},{"idiom":"Wing it","level":"B1","meaning":"Do something without preparing.","pt":"ir no improviso","example":["I didn't prepare a speech, so I'll just wing it."],"ptEx":["Não preparei um discurso, então vou {no improviso}."],"situation":"Fred hadn't prepared a speech, so he just stood up and made it up as he went.","origin":"Often linked to theater: actors who weren't ready would learn their lines in the wings of the stage and improvise.","forms":[["past","winged it"],["ing","winging it"]]},{"idiom":"Read the room","level":"B2+","meaning":"Sense the mood of a situation and adjust.","example":["Maybe skip the jokes. You need to read the room."],"ptEx":["Melhor pular as piadas. Você precisa {sentir o clima}."],"situation":"Everyone looked sad after the news, so Eva decided not to tell her joke.","forms":[["ing","reading the room"],["s","reads the room"]]},{"idiom":"Ghost someone","level":"B2+","meaning":"Suddenly stop all communication with someone.","example":["We had three great dates, and then he ghosted me."],"ptEx":["A gente teve três encontros ótimos, e aí ele {sumiu do nada}."],"situation":"After two months of daily messages, he suddenly stopped replying and never wrote again.","forms":[["past","ghosted me"],["ing","ghosting me"]]},{"idiom":"Dodge a bullet","level":"B1","meaning":"Narrowly avoid something bad.","example":["I skipped that investment and totally dodged a bullet."],"ptEx":["Não entrei naquele investimento e {escapei de uma boa}."],"situation":"I almost bought that car, and a week later the whole model was recalled.","forms":[["past","dodged a bullet"],["ing","dodging a bullet"]]},{"idiom":"Throw someone a curveball","level":"B2+","meaning":"Surprise someone with something unexpected and difficult.","example":["Life threw me a curveball when the company moved overseas."],"ptEx":["A vida {me deu uma rasteira} quando a empresa se mudou para o exterior."],"situation":"In the interview they suddenly asked Hana to solve a hard puzzle she never expected.","origin":"From baseball: a curveball is a pitch that bends unexpectedly, which makes it hard to hit.","forms":[["past","threw me a curveball"],["ing","throwing me a curveball"]]},{"idiom":"Move the goalposts","level":"B2+","meaning":"Unfairly change the rules or targets halfway through.","example":["Every time we hit the target, they move the goalposts."],"ptEx":["Toda vez que batemos a meta, eles {mudam as regras do jogo}."],"situation":"Each time the team reached the sales target, the boss raised it again before paying the bonus.","forms":[["past","moved the goalposts"],["ing","moving the goalposts"]]},{"idiom":"Low-hanging fruit","level":"B2+","meaning":"The easiest tasks or gains to tackle first.","example":["Let's start with the low-hanging fruit and fix the typos."],"ptEx":["Vamos começar {pelo mais fácil} e corrigir os erros de digitação."],"situation":"Let's fix the three easiest problems first, since they'll take only a few minutes."},{"idiom":"Game changer","level":"B1","meaning":"Something that completely changes a situation.","example":["This new app is a real game changer for my studies."],"ptEx":["Esse aplicativo novo é um {divisor de águas} nos meus estudos."],"situation":"Getting a dishwasher completely transformed how we run our tiny restaurant."},{"idiom":"Burn the candle at both ends","level":"B2+","meaning":"Exhaust yourself by doing too much.","example":["You can't work all day and party all night forever. You'll burn the candle at both ends."],"ptEx":["Você não pode trabalhar o dia todo e ir para a balada a noite toda para sempre. Vai {acabar se esgotando}."],"situation":"Ivan works all day, studies all night and barely sleeps. He's wearing himself out.","forms":[["ing","burning the candle at both ends"],["past","burned the candle at both ends"]]},{"idiom":"Get your foot in the door","level":"B2+","meaning":"Get a first opportunity, especially at a company or in a career.","example":["An internship is a great way to get your foot in the door."],"ptEx":["Um estágio é um ótimo jeito de {entrar no mercado}."],"situation":"The internship pays little, but it's a first chance to enter the film industry.","origin":"Often linked to door-to-door salesmen who wedged a foot in the doorway so customers couldn't close it.","forms":[["ing","getting your foot in the door"],["past","got my foot in the door"]]},{"idiom":"Cut your losses","level":"B2+","meaning":"Stop something that is failing to avoid losing more.","example":["The project keeps failing. It's time to cut your losses."],"ptEx":["O projeto continua dando errado. Está na hora de {reduzir o prejuízo}."],"situation":"The shop was losing money every month, so they closed it before things got worse.","forms":[["ing","cutting your losses"]]},{"idiom":"Stay on top of things","level":"B2+","meaning":"Stay organized and up to date.","example":["A planner helps me stay on top of things."],"ptEx":["Uma agenda me ajuda a {manter tudo em dia}."],"situation":"With a calendar and daily lists, Rosa never falls behind on anything.","forms":[["ing","staying on top of things"],["past","stayed he phrase is everywhere in talk about dating and jobs.","forms":[["other","red flags"]]},{"idiom":"Hit the spot","level":"B1","meaning":"Be exactly what you needed.","example":["That cold lemonade really hit the spot."],"ptEx":["Aquela limonada gelada {caiu muito bem}."],"situation":"After a long hike, that bowl of hot soup was exactly what I needed.","forms":[["s","hits the spot"],["ing","hitting the spot"]]},{"idiom":"Deal breaker","level":"B1","meaning":"Something that makes you reject an offer or a person.","example":["No pets allowed? That's a deal breaker for me."],"ptEx":["Não pode ter animal? Para mim, {aí não dá}."],"situation":"I liked the apartment, but with no window in the bedroom I simply won't take it.","forms":[["other","deal breakers"]]},{"idiom":"Go down a rabbit hole","level":"B2+","meaning":"Get absorbed in a topic and lose hours on it.","example":["I went down a rabbit hole of cooking videos last night."],"ptEx":["Ontem à noite eu {fiquei horas preso} em vídeos de culinária."],"situation":"I searched for one fact about sharks and was still reading about the ocean four hours later.","origin":"From Lewis Carroll's Alice's Adventures in Wonderland (1865), where Alice falls down a rabbit hole into a strange world. The internet gave the phrase its modern meaning.","forms":[["past","went down a rabbit hole"],["ing","going down a rabbit hole"]]},{"idiom":"Have a lot on your plate","level":"B1","meaning":"Have many things to deal with.","example":["She had a lot on her plate last month, so I didn't ask."],"ptEx":["Ela estava {cheia de coisa para resolver} no mês passado, então não pedi."],"situation":"This week Nadia has two exams, a move and a sick dog to deal with.","forms":[["past","had a lot on her plate"],["ing","having a lot on my plate"]]},{"idiom":"Push the envelope","level":"B2+","meaning":"Go beyond the usual limits.","example":["This director keeps pushing the envelope with every film."],"ptEx":["Esse diretor {ultrapassa os limites} a cada filme."],"situation":"This chef keeps trying things no restaurant has dared to do before.","origin":"From aviation: the 'flight envelope' is the range of speed and altitude a plane can safely handle, and test pilots pushed its edges. Tom Wolfe's 1979 book The Right Stuff made the phrase popular.","forms":[["past","pushed the envelope"],["ing","pushing the envelope"]]},{"idiom":"Win-win situation","level":"B1","meaning":"A result that is good for everyone involved.","example":["You save money and I get a roommate. It's a win-win situation."],"ptEx":["Você economiza e eu ganho um colega de quarto. {Todo mundo sai ganhando}."],"situation":"The swap gives me a shorter commute and gives her a bigger office. Everybody gains.","forms":[["other","win-win situations"]]},{"idiom":"Give someone a heads-up","level":"B1","meaning":"Warn or inform someone in advance.","example":["Thanks for giving me a heads-up about the traffic."],"ptEx":["Valeu por {me avisar} do trânsito."],"situation":"Just so you know in advance, the boss will visit tomorrow.","forms":[["past","gave me a heads-up"],["ing","giving me a heads-up"]]},{"idiom":"Take a step back","level":"B1","meaning":"Pause to look at a situation more calmly.","example":["Let's take a step back and look at the plan again."],"ptEx":["Vamos {dar um passo atrás} e olhar o plano de novo."],"situation":"We're too stressed to think. Let's pause and look at the problem calmly.","forms":[["past","took a step back"],["ing","taking a step back"]]},{"idiom":"Bottom line","level":"B1","meaning":"The most important fact or final result.","example":["The bottom line is we can't afford it."],"ptEx":["{O fato é que} não temos dinheiro para isso."],"situation":"Forget the details. The most important fact is that we're out of money.","origin":"From accounting: the last line of a financial statement shows the final profit or loss."},{"idiom":"Cut it close","level":"B2+","meaning":"Leave almost no extra time.","example":["Leaving at 8 for a 9 o'cloc uation":"Mina and her new colleague keep finishing each other's sentences and rarely need to explain an idea twice."},{"idiom":"Make a killing","level":"B2+","meaning":"Earn a lot of money quickly.","example":["She made a killing selling umbrellas during the storm."],"ptEx":["Ela {ganhou rios de dinheiro} vendendo guarda-chuva durante a tempestade."],"situation":"Tom bought concert tickets early and resold them for five times the price.","forms":[["past","made a killing"],["ing","making a killing"]]},{"idiom":"Sell like hotcakes","level":"B1","meaning":"Sell very quickly and in large numbers.","pt":"vender como água","example":["The new phones are selling like hotcakes."],"ptEx":["Os celulares novos estão {vendendo como água}."],"situation":"The bakery's new croissants were gone in twenty minutes, and people were still waiting in line.","origin":"Hotcakes (pancakes) cooked at fairs and church events in 1800s America were bought as fast as they could be made.","forms":[["ing","selling like hotcakes"],["past","sold like hotcakes"]]},{"idiom":"A cash cow","level":"B2+","meaning":"Something that reliably earns a lot of money.","example":["The old video game is still the company's cash cow."],"ptEx":["O videogame antigo ainda é {a galinha dos ovos de ouro} da empresa."],"situation":"Years after its release, one simple phone app brings in most of the studio's money.","forms":[["other","cash cow"]]},{"idiom":"A white elephant","level":"B2+","meaning":"A possession that costs a lot but is of little use.","example":["The new stadium became a white elephant after the Olympics."],"ptEx":["O novo estádio virou {um elefante branco} depois das Olimpíadas."],"situation":"The town built a huge conference center that is empty most of the year and costs millions to maintain.","origin":"From a legend about the kings of Siam (now Thailand), who gave rare white elephants to people they disliked. The sacred animals couldn't be put to work and cost a fortune to keep."},{"idiom":"Nest egg" iom":"Give someone a piece of your mind","level":"B2+","meaning":"Tell someone angrily what you think of them.","example":["When he cut in line, I gave him a piece of my mind."],"ptEx":["Quando ele furou a fila, eu {disse umas verdades} para ele."],"situation":"After the airline lost her bag for the third time, Carla marched to the desk and told the staff exactly how angry she was.","forms":[["past","gave him a piece of my mind"],["ing","giving them a piece of my mind"]]},{"idiom":"Hear it through the grapevine","level":"B2+","meaning":"Hear news as a rumor, from other people.","pt":"ficar sabendo pela rádio peão","example":["I heard it through the grapevine that you're moving to Paris."],"ptEx":["{Fiquei sabendo pela rádio peão} que você vai se mudar para Paris."],"situation":"Nobody officially told Erin about the new manager, but a coworker's friend mentioned it at lunch.","origin":"In the US Civil War, rumors passed along by word of mouth were said to come by 'grapevine telegraph'. Marvin Gaye's 1968 hit 'I Heard It Through the Grapevine' made the phrase famous.","forms":[["past","heard it through the grapevine"]]},{"idiom":"On the down-low","level":"B2+","meaning":"Kept secret.","example":["They've been dating on the down-low for months."],"ptEx":["Eles estão namorando {às escondidas} há meses."],"situation":"Only two close friends know that Dana has applied for a job at a rival company."},{"idiom":"Hot take","level":"B2+","meaning":"A bold opinion, often meant to provoke.","example":["Here's my hot take: pineapple belongs on pizza."],"ptEx":["Aqui vai a minha {opinião polêmica}: abacaxi combina com pizza."],"situation":"To get attention online, the TV critic posted that the most popular show of the year was actually terrible.","forms":[["other","hot takes"]]},{"idiom":"Have a bone to pick with someone","level":"B2+","meaning":"Have a complaint you want to discuss with someone.","example":["Mom has a bone to pick with you about the mess in the kitchen."],"ptEx":["A mãe {quer ter uma conversinha} com você sobre a bagunça na cozinha."],"situation":"Gil is annoyed that his roommate keeps using his things without asking, and he wants to talk about it tonight.","forms":[["s","has a bone to pick with you"],["past","had a bone to pick with him"]]},{"idiom":"Gaslight someone","level":"B2+","meaning":"Make someone doubt their own memory or judgment.","example":["He gaslighted her into thinking she had forgotten their plans."],"ptEx":["Ele {fez ela duvidar da própria memória} e achar que tinha esquecido os planos."],"situation":"Every time Sol caught her partner in a lie, he insisted she was imagining things, until she started to believe him.","origin":"From the 1938 play 'Gas Light' and the 1944 film 'Gaslight', in which a husband secretly dims the gas lamps and tells his wife she is imagining it. It was Merriam-Webster's word of the year in 2022.","forms":[["past","gaslighted her"],["ing","gaslighting me"]]},{"idiom":"Love-bomb someone","level":"B2+","meaning":"Overwhelm someone with affection and attention to gain control over them.","example":["At first he love-bombed me with flowers and messages every hour."],"ptEx":["No começo ele {me encheu de atenção}, com flores e mensagens de hora em hora."],"situation":"Two weeks after meeting Ivy, her new boyfriend had sent her gifts every day and called her his soulmate.","origin":"First used in the 1970s to describe how some cults won new members with a flood of attention.","forms":[["past","love-bombed me"],["ing","love-bombing her"]]},{"idiom":"Catfish someone","level":"B2+","meaning":"Trick someone online by pretending to be someone else.","example":["The guy I'd been chatting with for months catfished me. His photos were fake."],"ptEx":["O cara com quem eu conversava há meses {era um perfil falso}. As fotos eram de outra pessoa."],"situation":"For a year, Owen chatted online with a 'pilot' who turned out to be a teenager using someone else's photos.","origin":"From the 2010 documentary 'Catfish' and the TV show that followed. The title comes from a story about catfish being kept in tanks with cod to keep the cod active.","forms":[["past","catfished me"],["ing","catfishing people"]]},{"idiom":"In someone's corner","level":"B2+","meaning":"On someone's side, supporting them.","example":["Whatever you decide, I'm in your corner."],"ptEx":["Seja qual for a sua decisão, {estou do seu lado}."],"situation":"When everyone criticized Jade's decision to quit college, her grandfather told her he supported her completely.","origin":"From boxing, where a fighter's coach and helpers wait in the fighter's corner of the ring.","forms":[["other","in your corner"]]},{"idiom":"Give someone the side-eye","level":"B2+","meaning":"Look at someone with suspicion or disapproval.","example":["When I ordered a third dessert, my wife gave me the side-eye."],"ptEx":["Quando eu pedi a terceira sobremesa, a minha esposa {me olhou torto}."],"situation":"When the stranger on the bus started eating fish, the woman next to him turned her head slightly and stared at him.","forms":[["past","gave me the side-eye"],["ing","giving me the side-eye"]]},{"idiom":"Two peas in a pod","level":"B1","meaning":"Two people who are very alike.","pt":"unha e carne","example":["The twins are like two peas in a pod."],"ptEx":["As gêmeas são {a cara uma da outra}."],"situation":"Tom and his best friend dress alike, love the same music and even laugh the same way."},{"idiom":"The black sheep","level":"B1","meaning":"The member of a family or group who is different or disapproved of.","example":["I'm the black sheep of the family. Everyone else is a lawyer."],"ptEx":["Sou {a ovelha negra} da família. Todo mundo é advogado."],"situation":"In a family of doctors, Nico became a tattoo artist, and his parents still don't talk about it.","origin":"Black wool couldn't be dyed, so a black sheep was worth less to farmers and was sometimes even seen as a bad sign."},{"idiom":"Have a heart of gold","level":"B1","meaning":"Be very kind and generous.","pt":"ter um coração de ouro","example":["He looks tough, but he has a heart of gold."],"ptEx":["Ele parece durão, mas {tem um coração de ouro}."],"situation":"Every winter, Mrs. Ramos knits scarves for homeless people in her neighborhood and never tells anyone.","forms":[["s","has a heart of gold"],["past","had a heart of gold"]]},{"idiom":"Rough around the edges","level":"B2+","meaning":"A bit unpolished, but good underneath.","example":["The new singer is a little rough around the edges, but she's very talented."],"ptEx":["A cantora nova ainda {é meio crua}, mas tem muito talento."],"situation":"Keith swears a lot and has terrible manners, but he's the first to help when a friend is in trouble."},{"idiom":"Larger than life","level":"B2+","meaning":"Louder, more colorful or more impressive than ordinary people.","example":["My grandfather was larger than life. Everyone remembered him."],"ptEx":["Meu avô era {uma figura}. Todo mundo se lembrava dele."],"situation":"Wherever Aunt Bea goes, she wears bright hats, tells wild stories and makes everyone laugh."},{"idiom":"Party pooper","level":"B1","meaning":"Someone who spoils other people's fun.","pt":"estraga-prazeres","example":["Don't be a party pooper. Stay for one more song!"],"ptEx":["Não seja {estraga-prazeres}. Fica para mais uma música!"],"situation":"At eleven o'clock, while everyone was dancing at the celebration, Ted turned on the lights and said it was time to go home.","forms":[["other","party poopers"]]},{"idiom":"Backseat driver","level":"B2+","meaning":"Someone who gives advice nobody asked for, especially to the person driving.","example":["Stop being a backseat driver. I know how to park!"],"ptEx":["Para de {dar palpite na minha direção}. Eu sei estacionar!"],"situation":"Every time Hana drives, her father tells her when to brake, which lane to choose and how fast to go.","forms":[["other","backseat drivers"]]},{"idiom":"Social butterfly","level":"B1","meaning":"Someone who loves meeting and talking to lots of people.","example":["My daughter is a real social butterfly. She knows everyone at school."],"ptEx":["Minha filha é {superpopular}. Ela conhece todo mundo na escola."],"situation":"At every event, Lola moves from group to group, chatting with everyone in the room.","forms":[["other","social butterflies"]]},{"idiom":"Armchair expert","level":"B2+","meaning":"Someone who gives opinions without real knowledge or experience.","example":["The internet is full of armchair experts."],"ptEx":["A internet está cheia de {especialistas de sofá}."],"situation":"Sam has never played soccer, but every weekend he explains on online forums exactly what the national coach is doing wrong.","forms":[["other","armchair experts"]]},{"idiom":"A loose cannon","level":"B2+","meaning":"An unpredictable person who may cause trouble.","example":["The new minister is a loose cannon. Nobody knows what he'll say next."],"ptEx":["O novo ministro é {uma metralhadora giratória}. Ninguém sabe o que ele vai dizer."],"situation":"The team's star player often insults referees and posts angry messages about his own coach.","origin":"On old warships, a cannon that broke free from its ropes rolled across the deck and could crush the sailors."},{"idiom":"A big fish in a small pond","level":"B2+","meaning":"Someone important only in a small group or place.","example":["In her hometown she was a big fish in a small pond, but in New York nobody knew her."],"ptEx":["Na cidade dela, ela {era uma celebridade local}, mas em Nova York ninguém a conhecia."],"situation":"Ali is the best tennis player in his village of 300 people, but he has never won a match outside it."},{"idiom":"The new kid on the block","level":"B2+","meaning":"A newcomer to a place, group or market.","example":["The startup is the new kid on the block, but it's growing fast."],"ptEx":["A startup é {a novata} do mercado, mas está crescendo rápido."],"situation":"Kai joined the office last week and is still learning everyone's names."},{"idiom":"Lose the plot","level":"B2+","meaning":"Start acting irrationally, or lose focus on what matters.","example":["When the printer broke again, Dad totally lost the plot and started shouting at it."],"ptEx":["Quando a impressora quebrou de novo, o pai {surtou} e começou a gritar com ela."],"situation":"Under all the pressure, the film director began changing the story every day and firing actors for no reason.","forms":[["past","lost the plot"],["ing","losing the plot"]]},{"idiom":"Have a short fuse","level":"B2+","meaning":"Get angry very easily.","example":["Be careful what you say. The boss has a short fuse."],"ptEx":["Cuidado com o que você fala. O chefe {tem pavio curto}."],"situation":"Darius shouts at other drivers at every red light and once broke his phone because it was slow.","forms":[["s","has a short fuse"],["past","had a short fuse"]]},{"idiom":"Butterflies in your stomach","level":"B1","meaning":"A nervous, excited feeling.","pt":"frio na barriga","example":["I always get butterflies in my stomach before I go on stage."],"ptEx":["Eu sempre sinto {frio na barriga} antes de subir no palco."],"situation":"Minutes before her first date with Sam, Priya feels nervous and excited at the same time.","forms":[["other","butterflies in my stomach"]]},{"idiom":"At your wits' end","level":"B2+","meaning":"So worried or frustrated that you don't know what to do.","example":["The baby hasn't slept for three nights. I'm at my wits' end."],"ptEx":["O bebê não dorme há três noites. Estou {no meu limite}."],"situation":"Kemal has tried every medicine and every trick, but his dog still barks all night, and he has no ideas left.","origin":"From the Bible: Psalm 107 describes sailors in a storm who 'are at their wit's end'.","forms":[["other","at my wits' end"]]},{"idiom":"A lump in your throat","level":"B2+","meaning":"A tight feeling in your throat when you're about to cry.","pt":"um nó na garganta","example":["I had a har de Aquiles} do time."],"situation":"Gustavo is a brilliant student, but every time he has to speak in public, he freezes.","origin":"From Greek myth: Achilles' mother dipped him in the river Styx to protect him, but the heel she held him by stayed unprotected, and an arrow there killed him."},{"idiom":"Open Pandora's box","level":"B2+","meaning":"Start something that causes many unexpected problems.","pt":"abrir a caixa de Pandora","example":["Changing the tax rules could open Pandora's box."],"ptEx":["Mudar as regras dos impostos pode {abrir a caixa de Pandora}."],"situation":"When the company looked into one small error in the accounts, it found dozens of bigger problems nobody knew about.","origin":"From Greek myth: Pandora opened a jar (later called a box) given to her by the gods and let all the evils out into the world.","forms":[["past","opened Pandora's box"],["ing","opening Pandora's box"],["other","a Pandora's box"]]},{"idiom":"A Trojan horse","level":"B2+","meaning":"Something that looks harmless but is a hidden threat.","pt":"um cavalo de Troia","example":["That free app was a Trojan horse full of ads and spyware."],"ptEx":["Aquele aplicativo grátis era {um cavalo de Troia} cheio de anúncios e programas espiões."],"situation":"The free USB sticks handed out at the conference secretly installed a virus on every computer that used them.","origin":"From Greek legend: the Greeks hid soldiers inside a huge wooden horse, and the Trojans pulled it into their city as a gift."},{"idiom":"A Hail Mary","level":"B2+","meaning":"A desperate last attempt with little chance of success.","example":["Sending my CV straight to the CEO was a Hail Mary, but it worked."],"ptEx":["Mandar o meu currículo direto para o CEO foi {uma cartada desesperada}, mas deu certo."],"situation":"With the deadline only an hour away, the team tried one last, almost impossible idea to save the project.","origin":"From American football: a long, desperate pass at the end of a game. Quarterback Roger Staubach made the term famous in 1975, saying he had closed his eyes and said a Hail Mary."},{"idiom":"Move heaven and earth","level":"B2+","meaning":"Do everything possible.","pt":"mover céus e terra","example":["She moved heaven and earth to get her son into that school."],"ptEx":["Ela {moveu céus e terra} para colocar o filho naquela escola."],"situation":"Carlos called hospitals, friends and even a TV station until he found a donor for his sister.","forms":[["past","moved heaven and earth"],["ing","moving heaven and earth"],["s","moves heaven and earth"]]},{"idiom":"Paint yourself into a corner","level":"B2+","meaning":"Put yourself in a situation with no way out.","example":["By promising a launch date, we painted ourselves into a corner."],"ptEx":["Ao prometer uma data de lançamento, {nos encurralamos sozinhos}."],"situation":"The mayor promised there would never be new taxes, and now the city has no money to fix its roads.","forms":[["past","painted ourselves into a corner"],["ing","painting yourself into a corner"]]},{"idiom":"Thread the needle","level":"B2+","meaning":"Find a way between two difficult extremes.","example":["The new law tries to thread the needle between privacy and safety."],"ptEx":["A nova lei tenta {achar o equilíbrio} entre privacidade e segurança."],"situation":"The company had to find a plan that kept customers happy without making the investors angry.","forms":[["past","threaded the needle"],["ing","threading the needle"]]},{"idiom":"Punch above your weight","level":"B2+","meaning":"Do better than people expect from your size or level.","example":["This tiny country punches above its weight in football."],"ptEx":["Este país pequenininho {rende muito mais do que se espera} no futebol."],"situation":"The small startup, with only five employees, won a contract that the big companies all wanted.","origin":"From boxing: a fighter who takes on, and beats, opponents from a heavier weight class.","forms":[["s","punches above its weight"],["ing","punching above her weight"],["past","punched above their weight"]]},{"idiom":"Below the belt","level":"B2+","meaning":"Unfair or cruel.","example":["Bringing up his divorce in the debate was below the belt."],"ptEx":["Mencionar o divórcio dele no debate foi {golpe baixo}."],"situation":"During the argument, Marta mentioned her brother's failed exams in front of everyone just to hurt him.","origin":"From boxing, where hitting an opponent below the belt has been against the rules since the Queensberry rules of 1867."},{"idiom":"Throw your hat in the ring","level":"B2+","meaning":"Announce that you're competing for something.","example":["She's thinking of throwing her hat in the ring for mayor."],"ptEx":["Ela está pensando em {entrar na disputa} pela prefeitura."],"situation":"After years on the city council, Joana announced she would run for governor.","origin":"From 19th-century boxing, where a challenger tossed his hat into the ring to show he wanted to fight.","forms":[["ing","throwing her hat in the ring"],["past","threw his hat in the ring"]]},{"idiom":"Pass the buck","level":"B2+","meaning":"Make someone else responsible.","pt":"tirar o corpo fora","example":["Don't pass the buck. It was your decision."],"ptEx":["Não {tire o corpo fora}. A decisão foi sua."],"situation":"When the project failed, the manager blamed his team instead of admitting his own mistakes.","origin":"From poker: a marker called a 'buck' showed whose turn it was to deal, and players could pass it on. President Truman's desk sign 'The buck stops here' played on it.","forms":[["past","passed the buck"],["ing","passing the buck"]]},{"idiom":"Off the cuff","level":"B2+","meaning":"Without preparation.","example":["He wasn't ready, so he spoke off the cuff."],"ptEx":["Ele não estava preparado, então falou {de improviso}."],"situation":"The minister forgot her notes and gave the whole speech without any preparation.","origin":"Often said to come from speakers who jotted notes on their shirt cuffs.","forms":[["other","off-the-cuff"]]},{"idiom":"A flash in the pan","level":"B2+","meaning":"A success that doesn't last.","pt":"fogo de palha","example":["Their first album was a hit, but the band was just a flash in the pan."],"ptEx":["O primeiro álbum foi um sucesso, mas a banda foi só {fogo de palha}."],"situation":"The singer had one famous song in 2015 and was never heard of again.","origin":"From old flintlock guns: sometimes the powder flashed in the 'pan' without firing the shot."},{"idiom":"Lick your wounds","level":"B2+","meaning":"Recover after a defeat.","example":["After losing the final, the players are licking their wounds."],"ptEx":["Depois de perder a final, os jogadores estão {curando as feridas}."],"situation":"After losing the election, the candidate took a month off to recover before deciding what to do next.","forms":[["ing","licking their wounds"],["past","licked her wounds"]]},{"idiom":"Burn the midnight oil","level":"B2+","meaning":"Work late into the night.","example":["I burned the midnight oil to finish the report."],"ptEx":["{Varei a madrugada} para terminar o relatório."],"situation":"Before her exams, Bia studied until 3 a.m. every night.","origin":"From the days before electric light, when working late meant burning an oil lamp.","forms":[["past","burned the midnight oil"],["ing","burning the midnight oil"]]},{"idiom":"Eat humble pie","level":"B2+","meaning":"Admit you were wrong.","example":["After saying the plan would fail, he had to eat humble pie."],"ptEx":["Depois de dizer que o plano ia dar errado, ele teve que {engolir o orgulho}."],"situation":"The critic who said the film would flop had to admit publicly he was wrong when it won three awards.","origin":"A pun on 'umble pie', a pie made from the cheap inner organs ('umbles') of a deer, once eaten by servants.","forms":[["past","ate humble pie"],["ing","eating humble pie"]]},{"idiom":"Up the ante","level":"B2+","meaning":"Increase what is at stake.","example":[ rt.","pt":"a parte do leão","example":["The lion's share of the budget goes to marketing."],"ptEx":["{A parte do leão} do orçamento vai para o marketing."],"situation":"Of the ten pizzas ordered for the party, the football team ate eight.","origin":"From Aesop's fables, in which the lion, hunting with other animals, keeps all or most of the prey for himself."},{"idiom":"Cut from the same cloth","level":"B2+","meaning":"Very similar in character.","example":["The two brothers are cut from the same cloth."],"ptEx":["Os dois irmãos {saíram da mesma forma}."],"situation":"Like her mother, Clara is stubborn, funny and always ready to help strangers."},{"idiom":"Not hold water","level":"B2+","meaning":"Not be logical or believable.","example":["His excuse doesn't hold water."],"ptEx":["A desculpa dele {não se sustenta}."],"situation":"Pedro said he missed the meeting because of traffic, but he lives two blocks from the office.","forms":[["other","doesn't hold water"],["other","didn't hold water"]]},{"idiom":"Walk a tightrope","level":"B2+","meaning":"Be in a situation where you must be very careful.","pt":"andar na corda bamba","example":["Managers walk a tightrope between their bosses and their teams."],"ptEx":["Gerentes {andam na corda bamba} entre os chefes e as equipes."],"situation":"The diplomat had to keep both countries happy without making either one feel betrayed.","forms":[["ing","walking a tightrope"],["s","walks a tightrope"],["past","walked a tightrope"]]},{"idiom":"The canary in the coal mine","level":"B2+","meaning":"An early warning of danger.","example":["Falling sales in small shops are the canary in the coal mine for the economy."],"ptEx":["A queda nas vendas das lojas pequenas é {o primeiro sinal de alerta} para a economia."],"situation":"When the first bees in the region started dying, scientists saw it as an early sign of a much bigger environmental problem.","origin":"Coal miners once took canaries underground: the birds reacted to poisonous gas be     ding(659.25); setTimeout(function () { ding(987.77); }, 90);
  }
  function copy() {
    var code = PIX.codes[pick].code, ta = el.querySelector(".ebd-code");
    function fallback() {
      ta.value = code; ta.hidden = false; ta.focus(); ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      if (ok) { ta.hidden = true; copied(); }       // else the code stays shown, selected, to copy by hand
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(code).then(copied, fallback);
    else fallback();
  }
  function open(how) {
    if (!el) build();
    if (!el.hidden) return;
    mode = how || "manual";
    stat("Support opened", { from: mode === "ask" ? "menu pop-up" : GAME === "menu" ? "menu link" : "game line", game: GAME });
    back = document.activeElement;
    el.dataset.lang = A.lang();
    el.classList.remove("qr-on");
    el.querySelector(".ebd-later").hidden = mode !== "ask";
    choose(0);
    el.hidden = false;
    document.documentElement.classList.add("ebd-open");
    try { el.querySelector(".ebd-copy").focus({ preventScroll: true }); } catch (e) {}
    if (mode !== "ask") ding(659.25);
  }
  function close(never) {
    if (!el || el.hidden) return;
    if (mode === "ask" && !never) { var s = state(); s.next = rounds() + ASK_AGAIN; save(s); }
    el.hidden = true;
    document.documentElement.classList.remove("ebd-open");
    try { if (back && back.focus) back.focus({ preventScroll: true }); } catch (e) {}
  }
  // While the panel is open the keyboard belongs to it (games use Escape, arrows and letters)
  window.addEventListener("keydown", function (e) {
    if (!el || el.hidden) return;
    e.stopImmediatePropagation();
    if (e.key === "Escape") { e.preventDefault(); close(); return; }
    if (e.key === "Tab") {
      var f = [].filter.call(el.querySelectorAll("button, textarea"), function (b) { return !b.hidden && b.offsetParent !== null; });
      var at = f.indexOf(document.activeElement);
      e.preventDefault(); f[(at + (e.shiftKey ? f.length - 1 : 1) + f.length) % f.length].focus();
    }
  }, true);
  window.ebDonate = open;

  // ------------------------------------------------------------ the menu: the pop-up and the footer link
  if (inMenu) {
    var link = document.getElementById("donlink");
    var showLink = function () { if (link) link.hidden = false; };   // always shown (2026-11-26, the user)
    if (link) link.addEventListener("click", function () { open("manual"); });
    var ask = function () {
      showLink();
      var s = state(), help = document.getElementById("help");
      if (s.off || s.gave || s.asks >= MAX_ASKS || rounds() < Math.max(FIRST, s.next)) return;
      if (help && !help.hidden) return;              // the tour is open
      s.asks += 1; s.next = rounds() + ASK_AGAIN; save(s);
      open("ask");
    };
    // after the page has arrived (the header's slide, then the page's fade-in), and again when Back restores it
    var later = function () { var go = function () { setTimeout(ask, 900); }; if (typeof afterSlide === "function") afterSlide(go); else go(); };
    showLink();
    later();
    window.addEventListener("pageshow", function (e) { if (e.persisted) later(); });
    return;
  }

  // ------------------------------------------------------------ a game: count rounds, add the line
  var lastFp = null;
  function ended(after, fp) {
    if (!after || fp === lastFp) return;
    lastFp = fp;
    var n = rounds() + 1;
    A.set("eb-rounds", String(n));
    stat("Round finished", { game: GAME });
    var old = after.parentNode.querySelector(".ebd-line");
    if (old) old.remove();
    var s = state();
    if (n < FIRST || n < s.line) return;
    s.line = n + (s.gave ? LINE_EVERY_GAVE : LINE_EVERY); save(s);
    var p = document.createElement("p");
    p.className = "ebd-line ebd-l";
    p.dataset.lang = A.lang();
    p.innerHTML = both("Enjoying English Bubbles?", "Está gostando do English Bubbles?") +
      ' <button type="button">' + HEART + both("Support it", "Apoie") + "</button>";
    p.querySelector("button").addEventListener("click", function (e) { e.stopPropagation(); open("manual"); });
    after.parentNode.insertBefore(p, after.nextSibling);
  }
  function text(root, sel) { var x = root && root.querySelector(sel); return x ? x.textContent : ""; }
  var em = document.getElementById("endmodal"), wasOpen = !!(em && em.classList.contains("show"));
  if (em) new MutationObserver(function () {
    var on = em.classList.contains("show");
    if (on && !wasOpen) ended(em.querySelector(".endbtns") || em.querySelector("#endagain"), "m:" + text(em, "#endscore") + "|" + text(em, "#endlist").slice(0, 400));
    wasOpen = on;
  }).observe(em, { attributes: true, attributeFilter: ["class"] });
  var lastBtn = null;
  new MutationObserver(function () {
    var b = document.getElementById("pagain") || document.getElementById("spagain");
    if (!b || b === lastBtn) return;
    lastBtn = b;
    var box = b.closest(".pacts, .endbtns, p") || b;
    var end = b.closest(".pend") || box.parentNode;
    // the same round's end drawn again (a language switch) has the same words: not a new round
    var words = end.querySelectorAll(".w");
    if (!words.length) words = end.querySelectorAll("li");
    ended(box, "p:" + [].map.call(words, function (x) { return x.textContent.slice(0, 30); }).join("|").slice(0, 400) + text(end, ".big"));
  }).observe(document.body, { childList: true, subtree: true });
})();
