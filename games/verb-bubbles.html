<!DOCTYPE html>

<head>
<meta charset="utf-8">
<!-- English Bubbles app (added by the app's build.py, not part of the game's own files) -->
<script>
/* early-theme.js — runs in <head>, before the first paint, in the menu AND in every game: puts on the background
   colour saved in eb-bg (the games' palettes, "p:sky" or "c:#7aa7ff"), so a page never flashes its default colour
   first. The page's own 01-theme.js applies the same colour again a moment later. Keep PAL in step with PALETTES
   (src/js/01-theme.js and the games). */
(function () {
  try {
    var PAL = {
      sky: ["#e4f3fb", "#f1e8fb", "#fdf0e6", 0], peach: ["#ffe6d8", "#ffd6e4", "#fff1c9", 0],
      mint: ["#d9f4e6", "#d3eef6", "#eef6d3", 0], lilac: ["#e9e0fb", "#f7d9ee", "#dbe6fb", 0],
      dusk: ["#2a1740", "#58224f", "#1f3560", 1], midnight: ["#141964", "#441464", "#144e64", 1]
    };
    var s = Storage.prototype.getItem.call(window.localStorage, "eb-bg") || "", c = null;
    if (s.indexOf("p:") === 0) c = PAL[s.slice(2)] || null;
    else if (/^c:#[0-9a-f]{6}$/i.test(s)) {
      var hex = s.slice(2), r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255,
        b = parseInt(hex.slice(5, 7), 16) / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b),
        l = (mx + mn) / 2, h = 0, sat = 0, d = mx - mn;
      if (d) {
        sat = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
        h = (mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) * 60;
      }
      var col = function (dh) { return "hsl(" + ((h + dh + 360) % 360).toFixed(0) + "," + (sat * 100).toFixed(0) + "%," + (l * 100).toFixed(0) + "%)"; };
      c = [col(0), col(40), col(-40), l * 100 < 52];
    }
    if (c) {
      var root = document.documentElement;
      root.style.setProperty("--bg-a", c[0]); root.style.setProperty("--bg-b", c[1]); root.style.setProperty("--bg-c", c[2]);
      root.dataset.theme = c[3] ? "dark" : "light";
    }
  } catch (e) {}
  // The phone's bars (theme-color) follow the background: its top colour --bg-a, set here or later by the page's own
  // colour picker (menu or game: both write --bg-a on <html>). No colour chosen: the default light / dark ones.
  try {
    var html = document.documentElement, last = "";
    var bar = function () {
      var a = html.style.getPropertyValue("--bg-a").trim(), m = document.querySelectorAll('meta[name="theme-color"]');
      for (var i = 0; i < m.length; i++) {
        var v = a || (/dark/.test(m[i].media) ? "#141964" : "#e4f3fb");
        if (m[i].content !== v) m[i].content = v;
      }
      last = a;
    };
    bar();
    document.addEventListener("DOMContentLoaded", bar);
    new MutationObserver(function () {
      if (html.style.getPropertyValue("--bg-a").trim() !== last) bar();
    }).observe(html, { attributes: true, attributeFilter: ["style"] });
  } catch (e) {}
})();

/* iPhone / iPad: ask for a "playback" audio session, so the game's sounds play even with Silent mode on (iOS 17+;
   some games already do this themselves). Websites can't detect Silent mode, so the menu also shows a tip. */
try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
document.documentElement.classList.add("eb-arrive");   /* the header slides in (see the style below) */
</script>
<style>
/* A soft cross-fade between the menu and the games (Chrome; other browsers just switch). Both pages opt in. */
@media (prefers-reduced-motion: no-preference) {
  @view-transition { navigation: auto; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .25s; animation-timing-function: ease-out; }
}
/* The header slides down in from the top when a page arrives (html.eb-arrive, set in <head>, removed when the slide
   ends). It is the real header that moves, not a view-transition snapshot: a snapshot can't show the frosted-glass
   blur (a flat bar showed on PC) and was choppy on Android. The blur is off only while it moves (it is the costly
   part); it returns when the slide ends. */
@media (prefers-reduced-motion: no-preference) {
  html.eb-arrive header.dock { animation: eb-dock-in .48s cubic-bezier(.22,1,.36,1) both; will-change: transform, opacity;
    -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
}
@keyframes eb-dock-in { from { transform: translateY(calc(-100% - 28px)); opacity: 0; } }
/* Leaving with the Games button: the game fades away completely while its sound plays, leaving only its background,
   which is the menu's colour too; the menu then fades in on top. (Half-faded, the page froze on a dim picture while
   the menu loaded: "laggy".) */
html.eb-leaving body { opacity: 0; transition: opacity .22s ease-in; pointer-events: none; }
</style>
<script>
/* Every game saves its progress in the phone's storage. In the app all games share one storage, so each game's
   keys get the prefix "eb:verb-bubbles:" here; two games can then use the same key names without overwriting each other.
   One exception: the background colour (every game saves it as "<prefix>-bg", e.g. "p:sky" or "c:#7aa7ff", like
   the menu) is ONE setting for the whole app, kept under the menu's key "eb-bg": the game opens with the colour
   chosen in the menu, and a colour chosen in a game becomes the menu's and the other games' too. */
(function () {
  try {
    var P = "eb:verb-bubbles:", L = window.localStorage, S = Storage.prototype, BG = /^[a-z]+-bg$/;
    var get = S.getItem, set = S.setItem, del = S.removeItem;
    /* The EN / PT toggles too: ONE language for the whole app, the menu's (eb-lang). Each game saves its toggles
       under its own keys, with its own word for Portuguese (games.json "lang": "pt", "tr" or "native"; English is
       always "en"): reading one gives the menu's language, and a tap in a game changes the menu's and every
       game's. Until EN / PT is chosen, the menu's own rule: Portuguese for My level All / A1 / A2, English from B1. */
    var LG = {"vb-guidelang": "pt"};
    function appLang() {
      var l = get.call(L, "eb-lang");
      if (l === "en" || l === "pt") return l;
      var lv = get.call(L, "eb-level");
      return lv === "B1" || lv === "B2+" ? "en" : "pt";
    }
    S.getItem = function (k) {
      if (this === L && BG.test(k)) { var app = get.call(this, "eb-bg"); if (app) return app; }
      if (this === L && LG.hasOwnProperty(k)) return appLang() === "en" ? "en" : LG[k];
      return get.call(this, this === L ? P + k : k);
    };
    S.setItem = function (k, v) {
      if (this === L && BG.test(k)) set.call(this, "eb-bg", v);
      if (this === L && LG.hasOwnProperty(k)) set.call(this, "eb-lang", String(v) === "en" ? "en" : "pt");
      return set.call(this, this === L ? P + k : k, v);
    };
    S.removeItem = function (k) { return del.call(this, this === L ? P + k : k); };
    /* The app's own keys (eb-rounds, eb-don…) and language, for the injected donation script (donate.js) */
    window.ebApp = { get: function (k) { return get.call(L, k); }, set: function (k, v) { set.call(L, k, v); }, lang: appLang };
    /* Opened from the menu (a card or Continue)? Then the game starts at the menu's level ("My level"): the menu
       leaves a one-time note (sessionStorage eb-level-go), and the matching level is saved under the game's own
       level key before the game reads it (games.json "level"; the nearest level when the game doesn't have it).
       With "All" on the menu, or on a reload, the game keeps its own last level. */
    var LV = {"key": "vb-level", "A1": "A1", "A2": "A2", "B1": "A2", "B2+": "A2"}, SS = window.sessionStorage;
    if (SS.getItem("eb-level-go") === "verb-bubbles") {
      SS.removeItem("eb-level-go");
      var m = get.call(L, "eb-level");
      if (LV && LV[m]) set.call(L, P + LV.key, LV[m]);
    }
  } catch (e) {}
})();
</script>

/* 00-base: Theme tokens (light / dark), page background, base rules. */
/* Base rules from the original page wrapper (one line, kept as they were). */
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
/* Layout: sticky glass dock, then score row, then the bubble tray (three verb families), then one big sentence card. */
:root {
  box-sizing: border-box;
  --bg-a: #e4f3fb; --bg-b: #f1e8fb; --bg-c: #fdf0e6;
  --ink: #26385c;
  --fill-hi: rgba(255,255,255,.95);
  --fill-mid: rgba(255,255,255,.45);
  --fill-lo: rgba(255,255,255,.18);
  --gloss: rgba(255,255,255,.95);
  --underline: #e0558a;
  --clue: hsl(255,55%,48%);
  --rim-l: 74%; --glow-l: 82%; --lab-l: 38%;
  /* the soap bubbles (end of 40-bubbles.css): shine, film, rim, inner glow, shadow */
  --sky-o: .85; --sky-rim-l: 68%; --sky-rim-a: .38; --sky-glow-l: 74%; --sky-glow-a: .2; --sky-hi: .7; --sky-tint-a: .07; --soap-hi: .3; --soap-gl: 1; --spot-plus: 1; --rimhi-l: 56%; --rimhi-a: .85; --faceg-l: 66%; --faceg-a: .18; --soap-lo: .06; --film-a: .18; --srim-l: 70%; --srim-a: .7; --sglow-l: 78%; --sglow-a: .34; --soap-sh: rgba(60,70,140,.07); --soap-sh2: rgba(60,70,140,.12);
  --shadow: rgba(60,70,140,.16);
  --dock-bg: rgba(255,255,255,.62);
  --dock-line: rgba(38,56,92,.14);
  --ok: hsl(150,55%,32%); --ok-bg: hsla(150,70%,55%,.28);
  --bad: hsl(350,70%,45%); --bad-bg: hsla(350,85%,70%,.25);
  --font: "Fredoka", "Nunito", ui-rounded, "Trebuchet MS", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg-a: #141964; --bg-b: #441464; --bg-c: #144e64;
    --ink: #eaf1ff;
    --fill-hi: rgba(255,255,255,.16); --fill-mid: rgba(255,255,255,.07); --fill-lo: rgba(255,255,255,.03);
    --gloss: rgba(255,255,255,.55);
    --underline: #ffb3d1;
  --clue: hsl(255,90%,82%);
    --clue: hsl(255,90%,82%);
    --rim-l: 68%; --glow-l: 62%; --lab-l: 78%;
    --sky-o: .6; --sky-rim-l: 68%; --sky-rim-a: .35; --sky-glow-l: 62%; --sky-glow-a: .22; --sky-hi: .55; --sky-tint-a: .06; --soap-hi: .22; --soap-gl: .5; --spot-plus: .39; --rimhi-l: 88%; --rimhi-a: .75; --faceg-l: 74%; --faceg-a: .13; --soap-lo: .03; --film-a: .24; --srim-l: 72%; --srim-a: .85; --sglow-l: 66%; --sglow-a: .4; --soap-sh: rgba(0,0,0,.22); --soap-sh2: rgba(0,0,0,.32);
    --shadow: rgba(0,0,0,.45);
    --dock-bg: rgba(12,16,44,.55);
    --dock-line: rgba(255,255,255,.16);
    --ok: hsl(150,70%,72%); --ok-bg: hsla(150,70%,45%,.3);
    --bad: hsl(350,95%,80%); --bad-bg: hsla(350,80%,55%,.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ink: #eaf1ff;
  --fill-hi: rgba(255,255,255,.16); --fill-mid: rgba(255,255,255,.07); --fill-lo: rgba(255,255,255,.03);
  --gloss: rgba(255,255,255,.55);
  --underline: #ffb3d1;
  --clue: hsl(255,90%,82%);
  --rim-l: 68%; --glow-l: 62%; --lab-l: 78%;
  --sky-o: .6; --sky-rim-l: 68%; --sky-rim-a: .35; --sky-glow-l: 62%; --sky-glow-a: .22; --sky-hi: .55; --sky-tint-a: .06; --soap-hi: .22; --soap-gl: .5; --spot-plus: .39; --rimhi-l: 88%; --rimhi-a: .75; --faceg-l: 74%; --faceg-a: .13; --soap-lo: .03; --film-a: .24; --srim-l: 72%; --srim-a: .85; --sglow-l: 66%; --sglow-a: .4; --soap-sh: rgba(0,0,0,.22); --soap-sh2: rgba(0,0,0,.32);
  --shadow: rgba(0,0,0,.45);
  --dock-bg: rgba(12,16,44,.55);
  --dock-line: rgba(255,255,255,.16);
  --ok: hsl(150,70%,72%); --ok-bg: hsla(150,70%,45%,.3);
  --bad: hsl(350,95%,80%); --bad-bg: hsla(350,80%,55%,.3);
}
:root[data-theme="dark"]:not([style*="--bg-a"]) { --bg-a: #141964; --bg-b: #441464; --bg-c: #144e64; }
html { height: 100%; }
html, body { overflow-x: clip; }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100%;
  background-color: var(--bg-a);
  background-image:
    radial-gradient(60vmax 50vmax at 8% 6%, var(--bg-a), transparent 70%),
    radial-gradient(55vmax 45vmax at 95% 40%, var(--bg-b), transparent 70%),
    radial-gradient(60vmax 50vmax at 30% 100%, var(--bg-c), transparent 70%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font); font-size: 16px;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .4s ease;
}
/* Theme change (swapBg in 03-theme.js, from Verb Wheel): no transitions for that one style change; the old
   background fades away on top */
.theming body, .theming *, .theming *::before, .theming *::after { transition: none !important; }
.bgfade { position: fixed; inset: 0; z-index: -1; pointer-events: none; background-color: var(--fa);
  background-image: radial-gradient(60vmax 50vmax at 8% 6%, var(--fa), transparent 70%),
    radial-gradient(55vmax 45vmax at 95% 40%, var(--fb), transparent 70%),
    radial-gradient(60vmax 50vmax at 30% 100%, var(--fc), transparent 70%);
  transition: opacity .55s ease; will-change: opacity; }
.bgfade.fading { opacity: 0; }
button { font-family: inherit; }
/* The bubbles drifting up behind everything (2026-11-21, from English Bubbles' 00-base.css; made in 06-sky.js). Sizes
   use lvh (the screen's height with the address bar hidden), not vh: on Android the address bar hides and shows while
   scrolling, which changed vh mid-flight and made every bubble jump (vh is the fallback for old browsers). Only
   transform and opacity animate. They pause while a bubble is carried (body.carrying). */
.sky { position: fixed; top: 0; left: 0; right: 0; height: 100vh; height: 100lvh; z-index: -1; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; }
.sky.in { opacity: var(--sky-o); }   /* light .85, dark .6: subtler on dark backgrounds (2026-11-22: .75 was too strong) */   /* at load the bubbles are already part-way up (06-sky.js); the layer fades in */
.sky span {
  position: absolute; bottom: -120px; border-radius: 50%;
  /* per theme (--sky-*, 00-base.css): on light backgrounds a stronger rim and glow and a tint of the colour inside,
     so they show; on dark ones fainter */
  border: 1.5px solid hsla(var(--h), 80%, var(--sky-rim-l), var(--sky-rim-a));
  background: radial-gradient(circle at 30% 26%, rgba(255,255,255,var(--sky-hi)), hsla(var(--h), 90%, 78%, var(--sky-tint-a)) 50%, hsla(var(--h), 90%, 72%, calc(var(--sky-tint-a) * .8)) 70%, transparent 71%);
  box-shadow: inset 0 0 14px hsla(var(--h), 95%, var(--sky-glow-l), var(--sky-glow-a));
  filter: blur(2px);   /* soft, out of focus: blurred once, then only moved */
  animation: skydrift var(--t, 30s) linear infinite; animation-delay: var(--d, 0s);
  opacity: 0;
}
body.carrying .sky span, body.calm .sky span { animation-play-state: paused; }   /* calm: while the card opens or closes (26-shine.js) */
@keyframes skydrift {
  0% { transform: translate3d(0, 0, 0); opacity: 0; }
  8% { opacity: .6; }
  50% { transform: translate3d(var(--x, 20px), -60vh, 0); transform: translate3d(var(--x, 20px), -60lvh, 0); }
  92% { opacity: .45; }
  100% { transform: translate3d(0, -125vh, 0); transform: translate3d(0, -125lvh, 0); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .sky { display: none; } }

/* While the tutorial or a window (.favmodal) is open (body.covered, 26-shine.js) the game behind it stands still: the
   blur and dimming over it aren't redrawn on every frame (slow phones). Bubbles inside the window keep moving. */
body.covered :is(.sky span, .wb, .spin, .pt .sfx, .lit .sfx, .bcloud .bw):not(.tour *, .favmodal *) { animation-play-state: paused !important; }
/* 10-dock: Header dock: segment buttons, capital labels, practice focus / level pills, volume slider, background swatches, Tutorial button. */
/* Dock */
.dock {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 5;
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 14px;
  width: max-content; max-width: calc(100% - 24px);
  margin: 14px auto 0; padding: 6px 8px; border-radius: 28px;
  background: var(--dock-bg); border: 1px solid var(--dock-line);
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: 0 8px 22px var(--shadow);
}
.seg { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 2px; max-width: 100%; }
.seg button {
  appearance: none; border: 0; cursor: pointer;
  font-weight: 500; font-size: .95rem; line-height: 1;
  color: var(--ink); background: transparent;
  padding: .62em 1.1em; border-radius: 999px; white-space: nowrap;
  transition: background-color .2s ease, color .2s ease;
}
.seg button:hover { background: var(--dock-line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg-a); }
.seg-cap { font-size: .85rem; opacity: .75; padding: 0 .3em 0 .6em; white-space: nowrap; }
/* Menu labels in the dock are set in capitals */
.seg.focus button, .seg-cap, .tourbtn span { text-transform: uppercase; letter-spacing: .07em; }
.seg.focus button { font-size: .88rem; }
.seg-cap { font-size: .76rem; }
.tourbtn span { font-size: .84rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* Focused practice: only that family stays in the tray */
.fam.gone, .wb.gone { display: none; }
.fam.back { animation: famin .45s cubic-bezier(.34,1.56,.64,1) both; }
@keyframes famin { from { opacity: 0; transform: translateY(10px) scale(.92); } }
#hintbtn { transition: opacity .3s ease, visibility 0s linear 0s; }
#hintbtn.off { opacity: 0; visibility: hidden; transition: opacity .3s ease, visibility 0s linear .3s; }
/* A pill slides under the chosen practice option */
.seg.focus, .seg.level { position: relative; isolation: isolate; }
.seg.focus button[aria-pressed="true"], .seg.level button[aria-pressed="true"] { background: transparent; }
.seg.level { padding: 2px; border-radius: 999px; border: 1px solid var(--dock-line); flex-wrap: nowrap; }
.seg.level button { font-size: .82rem; font-weight: 600; letter-spacing: .04em; padding: .5em .8em; transition: color .3s ease, background-color .2s ease; }
.seg-ind { position: absolute; z-index: -1; top: 0; left: 0; width: 0; height: 0; border-radius: 999px; background: var(--ink); pointer-events: none; opacity: 0; }
.seg-ind.ready { opacity: 1; transition: transform .45s cubic-bezier(.34,1.4,.64,1), width .45s cubic-bezier(.34,1.4,.64,1), background-color .3s ease; }
.seg.focus button { transition: color .3s ease, background-color .2s ease; }
.seg.level .seg-ind { top: 0; left: 0; }
/* Each level has its own gradient (--lv, --lv2 on its button, as in Verb Wheel: A1 amber, A2 green): the sliding pill
   takes the chosen one's (40-focus.js), and hovering a level tints it with its own color. */
.seg.level button:hover { background: color-mix(in srgb, var(--lv) 22%, transparent); }
.seg.level button[aria-pressed="true"] { color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
.seg.level .seg-ind { background: linear-gradient(135deg, var(--lv, var(--ink)), var(--lv2, var(--ink))); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 3px 10px var(--shadow); }
.tour-card[dir="rtl"] { text-align: right; }
.tour-card[dir="rtl"] .tour-x { right: auto; left: .2rem; }
.tour-card[dir="rtl"] .tour-step, .tour-card[dir="rtl"] .tour-title { padding-right: 0; padding-left: 2rem; }
.tour-card[dir="rtl"] .tour-nav { margin-left: 0; margin-right: auto; }
.dock button:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
#snd { display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: .5em .75em; }
#snd[aria-pressed="true"] { background: transparent; color: inherit; }
#snd[aria-pressed="true"]:hover { background: var(--dock-line); }

/* The focus pill (All / Be / Do / Modals) wears the level's gradient too (A1 amber, A2 green; set by placeInd in
   40-focus.js). --fc1 / --fc2 are registered colors, so a level change glides from one gradient to the other. */
@property --fc1 { syntax: "<color>"; inherits: false; initial-value: #3fcf9a; }
@property --fc2 { syntax: "<color>"; inherits: false; initial-value: #2bb5c9; }
.seg.focus .seg-ind { background: linear-gradient(135deg, var(--fc1), var(--fc2)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 3px 10px var(--shadow); }
.seg.focus .seg-ind.ready { transition: transform .45s cubic-bezier(.34,1.4,.64,1), width .45s cubic-bezier(.34,1.4,.64,1), --fc1 .45s ease, --fc2 .45s ease; }
.seg.focus button[aria-pressed="true"] { color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
/* The level selector as tall as the header's round buttons (.tourbtn: an 18px icon, its padding at .92rem, a 1px
   border), its buttons filling it (the sliding pill follows them); as in There or Have (2026-11-17) */
.seg.level { box-sizing: content-box; height: calc(18px + 1.1 * .92rem - 4px); align-items: stretch; }   /* - its own 2px padding, top and bottom */
.dock .seg.level button { padding-top: 0 !important; padding-bottom: 0 !important; }
@media (min-width: 601px) and (max-width: 1099px) { .seg.level { height: calc(18px + .92rem - 4px); } }
@media (max-width: 600px) { .seg.level { height: calc(18px + .8 * .92rem - 4px); } }

/* 30-score: Score row: streak tile, Streaks panel, progress bar, new-round tile, hint line. */
/* Score row */
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
.go { display: grid; grid-template-columns: 78px 1fr 78px; align-items: center; column-gap: 10px; max-width: 680px; margin: 20px auto 0; }

.skhead:focus-visible { outline: 2px solid var(--underline); outline-offset: -2px; border-radius: 18px; }
.sknum { flex: none; min-width: 2.4em; text-align: center; font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }

.skchip.gold { background: hsla(45,100%,60%,.45); }
.skchip.green { background: hsla(150,70%,55%,.3); }
.skchev { flex: none; opacity: .6; transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
.sk.open .skchev { transform: rotate(180deg); }
.skbody { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s cubic-bezier(.2,.8,.3,1); }
.skbody > div { min-height: 0; overflow: hidden; }

.skbody .list { margin: 0; padding: 0 10px 10px; }
.score, .tile { justify-self: start; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 78px; height: 54px; padding: 0 8px; border-radius: 18px; background: var(--dock-bg); border: 1px solid var(--dock-line); box-shadow: 0 4px 12px var(--shadow); line-height: 1.05; text-align: center; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: background .35s ease, box-shadow .35s ease; }
.tile { justify-self: end; color: var(--ink); font: inherit; cursor: pointer; transition: transform .28s cubic-bezier(.34,1.56,.64,1), background-color .2s ease; }
.tile:hover { transform: translateY(-2px); background: var(--fill-hi); }
.tile:active { transform: scale(.96); }

.tile small { font-size: .68rem; opacity: .75; white-space: nowrap; line-height: 1.05; }

.score b { font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.score small { font-size: .68rem; opacity: .75; white-space: nowrap; }
.score.up { animation: scup .5s cubic-bezier(.34,1.56,.64,1); }
.score.down { animation: scdn .5s ease; }
.score.win { background: hsla(45,100%,80%,.92); box-shadow: 0 0 0 3px hsla(45,95%,60%,.55), 0 6px 18px var(--shadow); animation: scwin .8s cubic-bezier(.34,1.56,.64,1); }

/* 40-bubbles: The tray: verb families and bubbles (look, hover / selected / drag / shake / right-answer glow). */

.b:focus-visible { outline: 2px solid var(--underline); outline-offset: 4px; }
.wb { touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.wb:focus-visible, .wb.sel, .tray:not(.locked) .wb.hov {
  transform: translateY(-5px) scale(1.06);
  border-color: hsla(var(--h), 85%, calc(var(--rim-l) - 12%), .95);
  box-shadow: inset 0 0 22px hsla(var(--h), 100%, var(--glow-l), .6), inset -6px -8px 18px hsla(calc(var(--h) + 70), 100%, var(--glow-l), .45), 0 14px 24px var(--shadow), 0 0 0 4px hsla(var(--h), 90%, 75%, .22);
}

.wb.shake { animation: shake .5s ease; border-color: hsla(350,85%,62%,.95); box-shadow: inset 0 0 20px hsla(350,95%,70%,.5), 0 8px 18px var(--shadow); }
/* Hover lift only on real mouse pointers, so a tapped bubble never stays raised on a phone */
@media (hover: hover) { .tray:not(.locked) .wb:hover:not(.drag) { transform: translateY(-5px) scale(1.06); border-color: hsla(var(--h), 85%, calc(var(--rim-l) - 12%), .95); } }
/* After an answer the right bubble glows green for a moment, then settles back to normal */
.wb.right { animation: rightglow 1.1s ease-out; }
@keyframes rightglow { 0%, 45% { border-color: hsla(150,60%,45%,.95); box-shadow: inset 0 0 22px hsla(150,90%,70%,.6), 0 8px 18px var(--shadow), 0 0 0 4px hsla(150,80%,60%,.3); transform: scale(1.06); } 100% { transform: none; } }
.tray.locked .wb { cursor: default; }
@keyframes shake { 0%,100% { transform: translateX(0); } 15% { transform: translateX(-9px) rotate(-1.5deg); } 35% { transform: translateX(8px) rotate(1.2deg); } 55% { transform: translateX(-6px); } 75% { transform: translateX(4px); } }
/* Edge jitter (as in Verb Wheel, where the bubbles read their hover from a slot that never moves): while something
   rises on hover it gets an invisible strip below it reaching back past where its bottom edge was, so the cursor on
   that edge stays "inside" after the lift and it doesn't flicker up and down. Only while hovered: a strip that is always
   there catches the cursor below the edge, then rises with the element and loses it (the same jitter, lower down).
   The strip is the lift + 3px, so the springy overshoot of the lift never uncovers the edge. */
.score, .tile, .tourbtn { position: relative; }
@media (hover: hover) {
  .tray:not(.locked) .wb:hover:not(.drag)::after, .b.bw:hover:not(.drag):not(.lock):not(.gone)::after,
  .score:hover::after, .tile:hover::after, .tourbtn:not(.fresh):hover::after { content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: -8px; }
  .score:hover::after, .tile:hover::after { bottom: -5px; }
  .tourbtn:not(.fresh):hover::after { bottom: -4px; }
}
/* the word inside a bubble: its own box, so the negative morph (14-answer.js) can blur it out and in */
.wb .wl { display: inline-block; position: relative; }   /* relative: drawn above the shine, which follows the mouse (26-shine.js) */
/* Negative bubbles (isn't, can't, might not…: the morph in 14-answer.js) are a little smaller, so the longer words
   take no more room than the plain ones and the page doesn't jump (2026-11-16, measured at 375–1280 px: the tray
   keeps its height at A1 and A2). The word at 82% (.wl), the same bubble height (taller padding), narrower sides
   (.508em on phones, as .b's .85em there). Only the word's size changes, never the bubble's font size
   (2026-11-22): that restyled every span inside every bubble (all sized in em) at each switch. The paddings are the
   2026-11-16 ones (.968em .9em 1.008em, phones .846em .62em .886em, then of the 82% size) times .82, so the bubbles
   are exactly as big as before; the shine spots now keep their size and place on negative bubbles. */
.tray.neg .wb { padding: .794em .738em .827em; }
.tray.neg .wb .wl { font-size: .82em; display: block; }   /* block: inline, it would sit on a line as tall as the bubble's full-size font (3 px taller) */
@media (max-width: 600px) { .tray.neg .wb { padding: .694em .508em .727em; } }
/* The soap spans (SOAP in 12-tray.js) never take the mouse, so their cursor is fixed: inherited from the bubble, a
   cursor change on the tray (.locked after an answer, off again for the next sentence) restyled every one of them:
   5-8 ms on a PC each time, 1 ms now. */
.wb .film, .wb .spot, .wb .rim, .wb .glint, .bw .film, .bw .spot, .bw .rim, .bw .glint { cursor: default; }
/* Floating (2026-11-21, like the bubbles in most sibling games, but much smaller): each tray bubble drifts a couple of
   pixels on its own path and pace (--fx / --fy / --fdur / --fdl, set in 12-tray.js). It uses `translate`, so the hover
   lift and the drag (`transform`) add to it. It holds still while hovered (no edge jitter), dragged, shaking or glowing. */
.wb:not(.shake):not(.right) { animation: float var(--fdur, 4s) ease-in-out var(--fdl, 0s) infinite alternate; }
@keyframes float { from { translate: 0 0; } to { translate: var(--fx, 0px) var(--fy, -3px); } }
@media (hover: hover) { .tray:not(.locked) .wb:hover { animation-play-state: paused; } }
.wb.drag { animation-play-state: paused; }
@media (prefers-reduced-motion: reduce) { .wb:not(.shake):not(.right) { animation: none; } }
/* Soap bubbles (2026-11-21, an experiment: "4b · Shimmering film" from drafts/bubble-styles-soap.html), in light and
   dark mode: almost clear, a faint film of colour inside and a 1.5px coloured rim, both turning once in 10 s; the family
   colour leads (about half of each turn: be blue, do yellow, modals violet as their label: --th). The numbers that differ per theme are tokens in 00-base.css
   (--soap-* incl. the shine --soap-gl and its brighter core --spot-plus, --film-a, --srim-*, --sglow-*). The border stays, clear, so nothing changes size.
   Built from spans (SOAP in 12-tray.js; 2026-11-22), each drawn once: the film and the rim turn by rotating a still
   conic gradient (.spin, a transform animation: the graphics chip does it, nothing is repainted), and what follows the
   mouse moves by transform / opacity only (26-shine.js). Before, all this was backgrounds of the bubble driven by
   custom properties: every change restyled the whole bubble (3.8 ms a frame for 15 bubbles on a PC, against 0.5 ms
   now at most) and repainted it. Paint order, bottom to top: the film (.spin, the white sheen ::before, the glow facing the
   mouse .fg, the inner glow ::after), the shine spot, the rim, the small spot, the word. */
.wb, .b.bw { --th: var(--h); border-color: transparent; background: none;
  --ig: inset 0 0 12px hsla(var(--th), 95%, var(--sglow-l), var(--sglow-a));   /* the inner glow, drawn above the film by .film::after (a box-shadow on the bubble would sit under the film); the states below change it */
  box-shadow: 0 6px 14px var(--soap-sh);
  transition: transform .28s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease, border-color .25s ease; }
.fam[data-f="do"] .wb { --th: 45; }
.wb::before, .b.bw::before { content: none; }   /* the shine spot is the .spot span */
.wb .film, .bw .film { position: absolute; inset: -1.5px; z-index: 0; border-radius: inherit; overflow: hidden; pointer-events: none; }
.wb .film::before, .bw .film::before { content: ""; position: absolute; inset: 0; z-index: 1;
  background: radial-gradient(120% 120% at 30% 20%, rgba(255,255,255,var(--soap-hi)), rgba(255,255,255,var(--soap-lo)) 60%, transparent); }
.wb .film::after, .bw .film::after { content: ""; position: absolute; inset: 1.5px; z-index: 3; border-radius: inherit; box-shadow: var(--ig); transition: box-shadow .25s ease; }
/* The turning colour of the film and of the rim: a square a little wider than the bubble's diagonal (w + 1.6em is
   more than the diagonal of every bubble here, the Build words and the negative tray included), centred; rotating it
   is the same picture as turning the conic gradient's start. Both start together, so their colours stay in step. */
.wb .spin, .bw .spin { position: absolute; left: 50%; top: 50%; width: calc(100% + 1.6em); aspect-ratio: 1; translate: -50% -50%; }
.film .spin { background: conic-gradient(from var(--ang), hsla(var(--th), 95%, 76%, var(--film-a)) 0 30%, hsla(calc(var(--th) + 90), 95%, 80%, calc(var(--film-a) * .6)) 50%, hsla(calc(var(--th) + 200), 90%, 82%, calc(var(--film-a) * .7)) 72%, hsla(var(--th), 95%, 76%, var(--film-a)) 92%); }
.rim .spin { background: conic-gradient(from var(--ang), hsla(var(--th), 90%, var(--srim-l), var(--srim-a)) 0 30%, hsla(calc(var(--th) + 90), 90%, calc(var(--srim-l) + 4%), calc(var(--srim-a) * .64)) 50%, hsla(calc(var(--th) + 200), 85%, calc(var(--srim-l) + 8%), calc(var(--srim-a) * .56)) 72%, hsla(var(--th), 90%, var(--srim-l), var(--srim-a)) 92%); }
.wb .spin { animation: spin 10s linear var(--fdl, 0s) infinite; }
.bw .spin { animation: spin 10s linear var(--dl, 0s) infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* Off screen (.still, 26-shine.js), while a bubble is carried or while the card opens or closes (.calm, 26-shine.js;
   not the right / wrong bubble's glow or shake, which start just then), the float and the turning pause */
.tray.still .wb, .bround.still .bw, body.carrying .wb, body.carrying .bw, body.calm .wb:not(.shake):not(.right),
.tray.still .spin, .bround.still .spin, body.carrying .spin, body.calm .spin { animation-play-state: paused !important; }   /* !important: the animation rules are as specific */
/* What follows the mouse: 26-shine.js writes the transform and opacity of these wrappers (at rest they are as here);
   the look is the <i> inside, so a wrapper has nothing to re-read when it moves. Each is its own layer (will-change),
   so moving it repaints nothing. */
.fg > i, .rh > i, .spot i, .glint > i { position: absolute; inset: 0; }
.film .fg { position: absolute; left: -10%; top: -45%; width: 120%; height: 190%; z-index: 2; opacity: 0; will-change: transform, opacity; }   /* inside, the side facing the mouse glows as it nears: an ellipse 60% x 95% of the bubble around that point of the edge (--faceg-* per theme) */
.fg > i { background: radial-gradient(closest-side, hsla(var(--th), 100%, var(--faceg-l), var(--faceg-a)), transparent); }
.wb .spot, .bw .spot { position: absolute; left: .5em; top: .42em; width: .62em; height: .5em; pointer-events: none; transform: rotate(-14deg); will-change: transform; }   /* the shine: a fixed size and place (em), so it never stretches with a wide bubble */
.spot > i:first-child { background: radial-gradient(closest-side, rgba(255,255,255,var(--soap-gl)) 32%, rgba(255,255,255,calc(var(--soap-gl) * .55)) 62%, rgba(255,255,255,0)); }   /* a solid core (--soap-gl) */
.spot .pl { opacity: 0; }   /* brighter, with a wider core, as the mouse nears (its opacity = the nearness) */
.spot .pl i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--spot-plus) * .85)), rgba(255,255,255,var(--spot-plus)) 42%, rgba(255,255,255,calc(var(--spot-plus) * .55)) 52%, rgba(255,255,255,calc(var(--spot-plus) * .33)) 62%, rgba(255,255,255,calc(var(--spot-plus) * .12)) 81%, rgba(255,255,255,0)); }
/* The small second spot (as in the sibling games): a thin streak lying along the bottom-right curve, so a fixed size
   (em) rotated -45deg, its centre .47em in from both edges (on the corner's arc, just inside the rim). It moves the
   other way from the main spot, a third as far, like light seen through the far side, and brightens as the mouse
   nears (26-shine.js: its opacity from .8 to 1 of this brightest value). */
.wb .glint, .bw .glint { position: absolute; right: calc(.47em - .17em); bottom: calc(.47em - .085em); width: .34em; height: .17em; pointer-events: none; opacity: .8; transform: rotate(-45deg); will-change: transform, opacity; }
.glint > i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--soap-gl) * .75)) 45%, rgba(255,255,255,0)); }
/* The rim: a ring (a mask cuts out its middle, and everything inside it), over the clear border */
.wb .rim, .bw .rim { position: absolute; inset: -1.5px; border-radius: inherit; padding: 1.5px; pointer-events: none;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.rim .rh { position: absolute; left: -5%; top: -40%; width: 110%; height: 180%; opacity: 0; will-change: transform, opacity; }   /* the side facing the mouse lights up as it nears: an ellipse 55% x 90% of the rim (--rimhi-* per theme) */
.rh > i { background: radial-gradient(closest-side, hsla(var(--th), 100%, var(--rimhi-l), var(--rimhi-a)), transparent); }
.wb:focus-visible, .wb.sel, .tray:not(.locked) .wb.hov, .wb.drag { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 12px 22px var(--soap-sh2), 0 0 0 4px hsla(var(--th), 90%, 72%, .18); }
.wb.sel { outline-color: hsla(var(--th), 80%, 60%, .6); }
@media (hover: hover) { .tray:not(.locked) .wb:hover:not(.drag) { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 12px 22px var(--soap-sh2); } }
.wb.shake { border-color: transparent; --ig: inset 0 0 14px hsla(350, 95%, 70%, .4); box-shadow: 0 6px 14px var(--soap-sh); }
.wb.shake .rim { background: hsla(350, 85%, 62%, .8); }
.wb.shake .rim i { visibility: hidden; }   /* hidden, not stopped: it keeps turning in step with the film */
@media (prefers-reduced-motion: reduce) { .wb .spin, .bw .spin { animation: none; } }
/* Touch screens: the film doesn't turn (when the turn repainted whole bubbles, 15 of them lagged a phone; 7 were
   smooth); each bubble keeps its own angle (--ang, 12-tray.js). Since 2026-11-22 the turn repaints nothing (a
   rotation), so it may come back: try it on a phone with ?fps (95-perf.js) first. The float stays. */
@media (hover: none) { .wb .spin, .bw .spin { animation: none; } }
/* 50-card: Sentence card: gap, clue marks (u.k, .sfx, .when, .lit), translation, feedback and tip, Next, flying particles, toast. */
/* Sentence card */
.card {
  padding-bottom: 22px !important;   /* the star used to sit in the bottom corner; it is in the top row now */
  position: relative; max-width: 760px; margin: 22px auto 0; padding: 46px clamp(16px, 4vw, 40px) 20px;
  border-radius: 28px; text-align: center;
  background: var(--dock-bg); border: 1px solid var(--dock-line);   /* the same glass, edge and shadow as the header (.dock) */
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: 0 8px 22px var(--shadow);
  transition: border-color .2s ease, box-shadow .25s ease, transform .28s cubic-bezier(.34,1.56,.64,1);
}
.card.hot { border-color: var(--underline); transform: scale(1.015); box-shadow: 0 14px 34px var(--shadow), 0 0 0 5px hsla(335,80%,65%,.22); }
.card-top { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pbtn { display: inline-flex; align-items: center; gap: 5px; font-size: .9rem; font-weight: 500; padding: .45em 1em; border-radius: 999px; border: 1.5px solid var(--dock-line); background: transparent; color: inherit; cursor: pointer; }
.pbtn:hover:not(:disabled) { background: var(--dock-line); }
.pbtn:disabled { opacity: .35; cursor: default; }
.pbtn:focus-visible, .tbtn:focus-visible, .favx:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.pbtn.on { background: var(--ink); color: var(--bg-a); border-color: var(--ink); }
.again { font-size: .75rem; font-weight: 500; padding: .25em .7em; border-radius: 999px; background: var(--bad-bg); }
#qa { animation: pin .3s ease-out; }
@keyframes pin { from { opacity: 0; transform: translateX(22px); } }
.sent { margin: 0; font-size: clamp(1.45rem, 2.6vw + .9rem, 2.35rem); font-weight: 500; line-height: 1.5; text-wrap: balance; }
.gap {
  display: inline-block; min-width: 3.3em; margin: 0 .12em; padding: 0 .35em; line-height: 1.3;
  border: 2.5px dashed var(--underline); border-radius: .45em; cursor: pointer;
  transition: background-color .2s ease, transform .28s cubic-bezier(.34,1.56,.64,1);
}
/* the room opened for the lines after an answer (arcRoom in 18-arc.js) slides in */
.gap.ease { transition: background-color .2s ease, transform .28s cubic-bezier(.34,1.56,.64,1), margin .22s ease; }
.card.hot .gap, .gap.ready { background: hsla(335,80%,65%,.18); transform: scale(1.06); }
.gap.ok, .gap.fix { border-style: solid; border-color: transparent; background: var(--ok-bg); color: var(--ok); font-weight: 600; cursor: default; animation: merge .55s cubic-bezier(.34,1.56,.64,1); }
.gapw { white-space: nowrap; }
/* The ending that carries the meaning (gosta-RIA, llama-RÉ) and whole future markers (vai, vou) stand out */
.sfx { font-weight: 700; color: var(--underline); }
.pt .lit, .fm .lit { font-style: italic; opacity: .85; }
.pt .lit { display: inline-block; max-width: 100%; }
.pt .lit b, .fm .lit b { font-weight: 600; color: var(--underline); }
/* A tense hint after the sentence, e.g. (now) or (in general) */
body.lvl-a1 .when:not(.keep) { display: none; }
.when { display: inline-block; font-size: .62em; font-weight: 500; color: var(--underline); padding: .05em .55em; border: 1.5px solid currentColor; border-radius: 999px; vertical-align: .35em; letter-spacing: .02em; white-space: nowrap; }
.gap s { color: var(--bad); font-weight: 400; opacity: .8; margin-right: .3em; font-size: .8em; }
@keyframes merge { 0% { transform: scale(.8); } 55% { transform: scale(1.14); } 100% { transform: scale(1); } }
u.k { text-decoration: underline; text-decoration-color: var(--underline); text-decoration-thickness: .09em; text-underline-offset: .2em; text-decoration-skip-ink: none; }
/* In the translation (card and lists) clues are never underlined: time/subject clues are bold and colored,
   the deciding verb is bold pink and pulses, and a meaningful ending (-ria, -rá) gets a soft pink highlight */
.pt u.k, .fm u.k { text-decoration: none; font-weight: 600; color: var(--clue); }
.pt u.k.p, .fm u.k.p { color: var(--underline); font-weight: 700; }
.pt .sfx, .fm .sfx { background: hsla(335,85%,65%,.22); border-radius: .25em; padding: 0 .08em; }
.pt { margin: 12px 0 0; font-size: clamp(.95rem, .6vw + .85rem, 1.12rem); color: color-mix(in srgb, var(--ink) 68%, transparent); text-wrap: balance; }
.pt i { font-style: normal; font-size: .68em; font-weight: 600; letter-spacing: .08em; padding: .15em .5em; border-radius: 999px; border: 1px solid currentColor; margin-right: .5em; vertical-align: .12em; opacity: .8; }
.fb { margin-top: 14px; display: flex; flex-direction: column; justify-content: center; gap: 2px; font-size: 1.02rem; line-height: 1.35; }
.fb .v { font-weight: 600; }
.fb.ok .v { color: var(--ok); } .fb.bad .v { color: var(--bad); }
#hintlbl { display: inline-block; }
/* the header buttons (Guia, Favoritas, Vistas, Tutorial) show their names only where the whole dock fits on one line */
@media (min-width: 1100px) { .tourbtn span { display: inline-block; } }
@media (min-width: 601px) and (max-width: 1099px) { .tourbtn span { display: none; } .tourbtn { padding: .5em .6em; } }
.fb .tip { display: inline-block; align-self: center; padding: .2em .8em; border-radius: 999px; background: var(--dock-line); font-weight: 500; }
.fb > * { animation: pup .3s ease-out; }
@keyframes pup { from { opacity: 0; transform: translateY(10px); } }
.nextrow { padding-top: 12px; }
/* The answer area under the translation is closed while the student thinks, and opens when it has something to say */
.more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s cubic-bezier(.2,.8,.3,1); }
.more > div { min-height: 0; overflow: hidden; padding: 0 10px; }
.card.open .more { grid-template-rows: 1fr; }
.card.open .more > div { padding-bottom: 10px; }
/* Only meaningful endings pulse (-rá, -rei, -rão, -ria…); the deciding verb itself is bold pink and still */
u.k.p { display: inline; }
.pt .sfx, .lit .sfx { display: inline-block; animation: cue 1.7s ease-in-out infinite; }
@keyframes cue { 0%, 100% { transform: none; background-color: transparent; } 50% { transform: scale(1.1); background-color: hsla(335,85%,65%,.24); } }
.card.answered .sfx, .list .sfx { animation: none !important; }
.list .sfx { display: inline; }
.cta { font-size: 1rem; font-weight: 600; padding: .6em 1.5em; border: 0; border-radius: 999px; cursor: pointer; color: #fff; background: linear-gradient(135deg, hsl(315,85%,68%), hsl(275,80%,68%)); box-shadow: 0 3px 9px hsla(295,70%,55%,.22); transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease; }
.cta:hover { transform: scale(1.05); box-shadow: 0 4px 12px hsla(295,70%,55%,.3); }
.cta:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.cta.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
.pf { position: fixed; z-index: 25; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at 30% 30%, #fff, hsla(var(--h),85%,75%,.55)); border: 1px solid hsla(var(--h),85%,68%,.85); animation: pfly .7s ease-out forwards; }
@keyframes pfly { from { transform: translate(-50%,-50%) scale(.3); opacity: .95; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1); opacity: 0; } }
.toast { position: fixed; left: 0; right: 0; top: 30%; z-index: 40; text-align: center; font-size: clamp(2.2rem, 8vw, 4rem); font-weight: 600; line-height: 1; color: var(--ink); pointer-events: none; text-shadow: 0 6px 24px var(--shadow); animation: cdpop 1.3s ease-out both; }
@keyframes cdpop { 0% { opacity: 0; transform: scale(.4); } 25% { opacity: 1; transform: scale(1.12); } 75% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.92); } }
/* Lines after an answer (18-arc.js): pink to the subject above the words, clue color to the time word below */
.sent { padding-top: 14px; }
u.k.time { text-decoration-color: var(--clue); }
.subj.hit { background: hsla(335,85%,65%,.2); border-radius: .2em; box-shadow: 0 0 0 .12em hsla(335,85%,65%,.2); transition: background-color .3s ease; }
.time.hit, .when.hit { background: color-mix(in srgb, var(--clue) 18%, transparent); border-radius: .2em; box-shadow: 0 0 0 .12em color-mix(in srgb, var(--clue) 18%, transparent); transition: background-color .3s ease; }
.arc { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.arc svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
.arc path { fill: none; stroke: var(--underline); stroke-width: 2.5; stroke-linecap: round; opacity: .85; }
.arc circle { fill: var(--underline); }
.arc .time path { stroke: var(--clue); }
.arc .time circle { fill: var(--clue); }
.arc.anim circle.end { animation: arcdot .3s .45s cubic-bezier(.34,1.56,.64,1) backwards; transform-box: fill-box; transform-origin: center; }
.arc.anim .time circle.end { animation-delay: calc(.45s + var(--d, 0ms)); }
.arc-lbl { position: absolute; transform: translate(-50%, -50%); padding: .1em .6em .15em; border-radius: 999px; font-size: .8rem; font-weight: 600; line-height: 1.2; white-space: nowrap; color: #fff; background: var(--underline); box-shadow: 0 3px 10px var(--shadow); }
.arc-lbl.time { background: var(--clue); }

  font-size: .68rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;

.prompt { --h: 45; position: relative; display: flex; align-items: center; justify-content: center; width: min(100%, 640px); min-height: 90px;

/* The English sentence: one slot per word, then its final mark */

  padding: 1.55em 1.1em 1.15em; border-radius: 28px; color: var(--ink);

  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);

.bslots { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px 6px; }

/* The soap look on the Build words too (2026-11-21; the shared rules are at the end of 40-bubbles.css: film, .rim,

   The inner glow is --ig (drawn above the film by .film::after), the outer shadow the bubble's box-shadow. */

.b.bw.ok { border-color: transparent; --ig: inset 0 0 16px hsla(150, 80%, 60%, .42); box-shadow: 0 6px 14px var(--soap-sh); }

.b.bw.ok .rim i, .b.bw.bad .rim i, .b.bw.shown .rim i { visibility: hidden; }   /* hidden, not stopped: they keep turning in step with the film */

.b.bw.bad .rim { background: hsla(350, 80%, 60%, .85); }

.gd-a { font-weight: 600; color: hsl(var(--h), 60%, var(--lab-l)); }
/* the opening idea and the checklist */
.gd-tip { display: flex; gap: 10px; margin: 0 2px 12px; font-size: .98rem; line-height: 1.45; }
.gd-tip > span:first-child { flex: none; }

.gd-ask { padding: 12px; border-radius: 20px; background: var(--fill-mid); border: 1px solid var(--dock-line); }

.gd-q { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px 14px; padding: 10px 12px; border-radius: 14px; background: var(--bg-a); border: 1px solid var(--dock-line); }
.gd-q + .gd-q { margin-top: 8px; }
.gd-qt > b { display: block; font-size: 1rem; font-weight: 600; line-height: 1.3; }

.gd-arrow { font-size: 1.2rem; font-weight: 600; line-height: 1; color: var(--underline); }
.gd-go { cursor: pointer; font-family: inherit; }
.gd-go:hover, .gd-go:focus-visible { background: hsla(var(--h), 90%, 75%, .34); outline: none; }
@media (max-width: 560px) { .gd-q { grid-template-columns: 1fr; } }
/* section links */
.gd-nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 12px; }
.gd-navb { appearance: none; cursor: pointer; font-family: inherit; font-size: .84rem; font-weight: 600; padding: .4em .95em; border-radius: 999px; color: var(--ink); background: transparent; border: 1.5px solid var(--dock-line); transition: transform .25s cubic-bezier(.34,1.56,.64,1), background-color .2s ease; }
.gd-navb:hover { transform: translateY(-2px); background: var(--dock-line); }
.gd-navb:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
/* sections */
#guidebody section { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--dock-line); scroll-margin-top: 10px; }
#guidebody h3 { margin: 0; font-size: 1.1rem; font-weight: 600; }
.gd-lead { margin: 4px 0 8px; font-size: .88rem; line-height: 1.4; opacity: .75; }
/* a folding card */
.gd-u { margin-top: 8px; border-radius: 18px; background: var(--fill-mid); border: 1.5px solid hsla(var(--h), 70%, var(--rim-l), .6); scroll-margin-top: 10px; }
.gd-u > summary, .gd-m > summary { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; list-style: none; border-radius: 16px; transition: background-color .2s ease; }
.gd-u > summary::-webkit-details-marker, .gd-m > summary::-webkit-details-marker { display: none; }
.gd-u > summary::after, .gd-m > summary::after { content: ""; flex: none; width: 8px; height: 8px; margin: 0 4px 3px auto; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; opacity: .6; transform: rotate(45deg); transition: transform .25s ease; }
.gd-u[open] > summary::after, .gd-m[open] > summary::after { transform: rotate(-135deg) translate(-3px, -3px); }
.gd-u > summary:hover, .gd-m > summary:hover { background: hsla(var(--h), 85%, 72%, .12); }
.gd-u > summary:focus-visible, .gd-m > summary:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
.gd-u h4 { margin: 0; font-size: 1.05rem; font-weight: 600; color: hsl(var(--h), 60%, var(--lab-l)); }
.gd-u[open] { padding-bottom: 12px; }
.gd-u[open] > :not(summary) { margin-left: 14px; margin-right: 14px; }
.gd-ws { display: flex; flex-wrap: wrap; gap: 4px; }
.gd-cap { font-size: .8rem; font-weight: 500; opacity: .7; }
/* examples: a preposition chip, the English sentence, the translation */
.gd-exs, .gd-xl, .gd-rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.gd-exs li { display: grid; grid-template-columns: 4.4em 1fr; align-items: start; gap: 10px; }
.gd-exs li > .gd-w { justify-self: start; margin-top: .1em; }
.gd-en { display: block; font-size: 1rem; font-weight: 500; line-height: 1.35; }
.gd-pt { display: block; margin: 0; font-size: .88rem; line-height: 1.35; color: color-mix(in srgb, var(--ink) 68%, transparent); }
/* a group: each word, its meaning, its rules with the pink line's tag */
.gd-word + .gd-word { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--dock-line); }
.gd-wh { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0 0 8px; font-size: .92rem; }
.gd-rules li { display: grid; grid-template-columns: 8.2em 1fr; align-items: start; gap: 10px; font-size: .92rem; line-height: 1.4; }
.gd-tag { justify-self: start; padding: .1em .6em .15em; border-radius: 999px; font-size: .78rem; font-weight: 600; line-height: 1.25; color: #fff; background: var(--underline); }
@media (max-width: 560px) { .gd-rules li { grid-template-columns: 1fr; gap: 3px; } .gd-exs li { grid-template-columns: 1fr; gap: 3px; } }
/* expressions */
.gd-xl li > b { display: block; font-size: .95rem; font-weight: 600; }
.gd-xl .gd-en { font-size: .9rem; font-weight: 400; opacity: .8; }
/* the most common mistakes */
.gd-mis h3 { color: hsl(350, 65%, var(--lab-l)); }
.gd-mlist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; align-items: start; gap: 10px; }
.gd-mlist li { border-radius: 16px; background: var(--fill-mid); border: 1px solid var(--dock-line); }
.gd-m { --h: 350; }
.gd-m > summary { padding: 11px 14px; }
.gd-m[open] { padding-bottom: 12px; }
.gd-m[open] > :not(summary) { margin-left: 14px; margin-right: 14px; }
.gd-wrong, .gd-right { margin: 0; font-size: .97rem; font-weight: 600; line-height: 1.4; }
.gd-wrong { margin-top: 2px; color: hsl(350, 70%, var(--lab-l)); text-decoration: line-through; text-decoration-thickness: 1.5px; text-decoration-color: hsla(350, 70%, 55%, .6); }
.gd-wrong span, .gd-right span { display: inline-block; text-decoration: none; margin-right: 2px; }
.gd-right { color: var(--ok); }
.gd-why { margin: 6px 0 0; font-size: .88rem; line-height: 1.45; opacity: .85; }
@media (max-width: 640px) { .gd-mlist { grid-template-columns: 1fr; } }
.gd-cur { margin-top: 22px; }
.gd-cur .gd-wh { margin-bottom: 0; }
@media (prefers-reduced-motion: reduce) { .gd-navb, .gd-u > summary::after, .gd-m > summary::after { transition: none; } }
/* This game: the tables of who takes which word, the deciding word of a translation, Portuguese → English */
#guidebody section h3 { color: hsl(var(--h), 60%, var(--lab-l)); }
#guidebody #gd-map h3 { color: inherit; }
#guidebody section.gd-mis h3 { color: hsl(350, 65%, var(--lab-l)); }
.gd-tab { width: 100%; margin: 6px 0 4px; border-collapse: separate; border-spacing: 0; border-radius: 16px; overflow: hidden; background: var(--fill-mid); border: 1.5px solid hsla(var(--h), 70%, var(--rim-l), .6); font-size: .92rem; }
.gd-tab th, .gd-tab td { padding: 8px 12px; text-align: left; }
.gd-tab thead th { font-size: .72rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; opacity: .65; }
.gd-tab tbody th { font-weight: 600; white-space: nowrap; }
.gd-tab tbody tr > * { border-top: 1px solid var(--dock-line); }
.gd-tab td .gd-w + .gd-w { margin-left: 4px; }
.gd-w.gd-n { border-style: dashed; }
.gd-small { font-size: .8rem; margin-top: 10px; }
.gd-u > summary .gd-w.big { flex: none; }
.gd-exs li { display: block; }
.gd-p { color: var(--underline); font-weight: 600; }
.gd-map { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.gd-map li { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.2fr); align-items: center; gap: 10px; padding: 10px 14px; border-radius: 16px; background: var(--fill-mid); border: 1px solid var(--dock-line); }
.gd-map .gd-pt { font-size: .95rem; }
.gd-map small { display: block; margin-top: 2px; font-size: .82rem; line-height: 1.4; opacity: .75; }
@media (max-width: 560px) { .gd-map li { grid-template-columns: 1fr; gap: 2px; } .gd-map .gd-arrow { display: none; } .gd-tab th, .gd-tab td { padding: 7px 6px; } .gd-tab { font-size: .84rem; } .gd-tab tbody th { white-space: normal; } .gd-tab thead th { font-size: .62rem; letter-spacing: .04em; } .gd-tab .gd-w { font-size: .8rem; padding: .14em .5em .18em; } }
.gd-dot { display: inline-block; margin: 0 .35em; font-weight: 700; opacity: .7; }
/* Be cards: every subject, an example with ser and one with estar */
.gd-bes + .gd-bes { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--dock-line); }
.gd-sj { margin: 0 0 6px; font-size: .78rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; opacity: .65; }
.gd-be .gd-exs li { display: grid; grid-template-columns: 3.6em 1fr; align-items: start; gap: 10px; }
.gd-be .gd-tag { justify-self: start; margin-top: .15em; text-align: center; min-width: 3.4em; }
.gd-tag.gd-ser { background: hsl(265, 60%, 58%); }
.gd-tag.gd-estar { background: hsl(190, 70%, 40%); }
.gd-pt .lit { font-style: italic; opacity: .9; }
.gd-pt .sfx { color: var(--underline); font-weight: 600; }
/* 80-scrollbar: Scrollbars as in There Be or Have (../therebeorhave, styles.css; first from the gerund game): in the cards that scroll
   (Favoritas / Vistas, end of round, Streaks, tutorial) a thin glossy pill with the pink-to-purple gradient on a clear
   track; the page itself has none. Chrome / Edge / Safari use the ::-webkit-scrollbar parts; Firefox only takes
   colours, so it gets a thin pink thumb (in @supports, since Chrome would let these override the pill). */
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: transparent; margin: 18px 0; }
::-webkit-scrollbar-thumb {
  border: 3px solid transparent; border-radius: 999px; background-clip: padding-box;
  background-image: linear-gradient(180deg, hsl(315,85%,66%), hsl(275,80%,64%));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45);
}
::-webkit-scrollbar-thumb:hover { background-image: linear-gradient(180deg, hsl(315,90%,60%), hsl(275,85%,58%)); }
::-webkit-scrollbar-thumb:active { border-width: 2px; }
::-webkit-scrollbar-button, ::-webkit-scrollbar-corner { display: none; background: transparent; }
@supports (-moz-appearance: none) {
  * { scrollbar-width: thin; scrollbar-color: hsl(295,82%,66%) transparent; }
}
/* The page itself still scrolls on short screens, but shows no bar (only the cards and lists do). */
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }
/* 85-speed: The Play menu on the "new round" tile and the speed challenge (goal card + 3-2-1 countdown, clock in the progress bar, what hides during it); copied from Pronoun Bubbles' 80-modes.css. */
/* Play menu */
.playwrap { position: relative; justify-self: end; }
.playmenu { position: absolute; top: calc(100% + 8px); right: 0; z-index: 30; display: flex; flex-direction: column; gap: 4px; width: max-content; min-width: 220px; padding: 6px; border-radius: 20px; background: var(--bg-a); border: 1px solid var(--dock-line); box-shadow: 0 16px 36px var(--shadow); transform-origin: top right; animation: pickin .22s cubic-bezier(.2,.9,.3,1.15); }
@keyframes pickin { from { opacity: 0; transform: translateY(-6px) scale(.96); } }
.playmenu[hidden] { display: none; }
.playmenu button { appearance: none; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: .6em .85em; border: 0; border-radius: 14px; background: transparent; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.playmenu button:hover, .playmenu button:focus-visible { background: var(--dock-line); outline: none; }
.playmenu b { font-weight: 600; font-size: .98rem; }
.playmenu small { font-size: .78rem; opacity: .7; }
/* Review missed / Favorites with an empty list; the game being played has a pink dot (from Question Bubbles) */
.playmenu button:disabled { opacity: .45; cursor: default; }
.playmenu button:disabled:hover { background: transparent; }
.playmenu button.cur b::after { content: " ●"; font-size: .6em; vertical-align: .25em; color: var(--underline); }
/* Speed challenge: the progress bar becomes a clock that turns red in the last 10 seconds */
.prog.clock span { display: inline-block; font-size: 1.15rem; font-weight: 600; }
.prog.clock .pbar i { background: linear-gradient(90deg, hsl(45,95%,58%), hsl(25,95%,60%)); transition: width .25s linear; }
.prog.urgent span { color: var(--bad); animation: tickpulse 1s ease-in-out infinite; }
.prog.urgent .pbar i { background: hsl(350,85%,60%); }
@keyframes tickpulse { 50% { transform: scale(1.12); } }
body.speed #hintbtn, body.speed #nextrow, body.speed #cardstar { visibility: hidden; }
body.speed .score { cursor: default; }
/* Goal card + 3, 2, 1, Já! */
.cdown { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; padding: 16px; background: rgba(20,20,40,.35); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: fadein .2s ease; }
.cdown[hidden] { display: none; }
.cd-card { width: min(380px, 100%); padding: 1.2rem 1.3rem 1.4rem; border-radius: 1.6rem; text-align: center; color: var(--ink); background: var(--bg-a); border: 1px solid var(--dock-line); box-shadow: 0 22px 50px rgba(0,0,0,.3); animation: cardin .3s cubic-bezier(.34,1.56,.64,1); }
.cd-t { margin: 0; font-size: 1.3rem; font-weight: 600; }
.cd-x { margin: .5rem 0 0; font-size: .98rem; line-height: 1.45; opacity: .85; }
.cd-n { display: block; min-height: 1.2em; margin-top: .4rem; font-size: 3.4rem; font-weight: 600; line-height: 1.2; color: var(--underline); }
.cd-n.beat { animation: cdbeat .6s cubic-bezier(.34,1.56,.64,1); }
@keyframes cdbeat { from { opacity: 0; transform: scale(.4); } 60% { opacity: 1; transform: scale(1.15); } }
@media (max-width: 600px) { .playmenu { min-width: 200px; } }
@media (prefers-reduced-motion: reduce) { .playmenu, .cdown, .cd-card, .cd-n.beat, .prog.urgent span { animation: none; } }
/* 95-perf: The hidden test panel (?fps, 95-perf.js) and what its switches turn off or on (classes on <html>). */
.perfbox { position: fixed; left: 8px; bottom: 8px; z-index: 300; display: flex; flex-direction: column; gap: 5px; padding: 8px 11px 9px; border-radius: 12px;
  background: rgba(10,12,30,.86); color: #fff; font: 500 12px/1.2 "Fredoka", system-ui, sans-serif; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
.perfbox b { font-size: 17px; font-weight: 600; cursor: pointer; }
.perfbox.mini label { display: none; }
.perfbox .pf-slow { opacity: .75; margin-bottom: 2px; }
.perfbox label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.perfbox input { width: 15px; height: 15px; margin: 0; accent-color: #3fcf9a; }
/* longhands, so the pauses (.still, carrying: animation-play-state in 40-bubbles.css) still work */
html.pf-film-off .spin { animation-name: none !important; }
html.pf-film-on .spin { animation-name: spin !important; animation-duration: 10s !important; animation-timing-function: linear !important; animation-iteration-count: infinite !important; }
html.pf-film-on .wb .spin { animation-delay: var(--fdl, 0s) !important; }
html.pf-film-on .bw .spin { animation-delay: var(--dl, 0s) !important; }
html.pf-nofloat .wb:not(.shake):not(.right), html.pf-nofloat .bcloud .bw:not(.bad) { animation-name: none !important; }
html.pf-nosky .sky { display: none; }
html.pf-noblur * { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
</style>

me (Ana, my dad) → is, does · you, we, they, um plural (my parents) → are, do.","ans":["am","is","does","are","do"]},{"lv":"A2","q":"Quando? Presente ou passado?","hint":"now, every day, usually → am / is / are, do / does · yesterday, last week, ago → was / were, did. A linha de baixo liga o espaço à palavra de tempo.","ans":["was","were","did"]}],"nav":{"be":"Be","do":"Do","modal":"Modais","map":"Português → inglês","mis":"Erros comuns"},"beTitle":"Be","beLead":"O verbo to be (ser / estar) muda com o sujeito e com o tempo. Também vem antes de um verbo com -ing (She is sleeping).","doTitle":"Do","doLead":"O auxiliar das perguntas e das negativas quando a frase já tem outro verbo. Sozinho ele não quer dizer nada: só mostra a pessoa e o tempo.","modalTitle":"Os modais","modalLead":"Cada um tem um sentido. São iguais para todos os sujeitos e vêm antes do verbo na forma básica, sem to: She can swim (nunca cans, can swims ou can to swim).","subj":"sujeito","now":"presente","past":"passado","neg":"negativa","means":"Toque numa palavra para ver um exemplo do jogo.","mapTitle":"Português → inglês","mapLead":"Coisas que o português diz de um jeito e o inglês de outro.","map":[{"lv":"A1","pt":"Eu tenho 20 anos.","en":"I am 20.","note":"A idade usa be, não have."},{"lv":"A1","pt":"Está frio. / Faz calor.","en":"It is cold. / It is hot.","note":"O tempo (clima) usa it + be."},{"lv":"A1","pt":"Você gosta de pizza?","en":"Do you like pizza?","note":"O português não tem auxiliar na pergunta; o inglês põe do na frente."},{"lv":"A1","pt":"Eu não sei.","en":"I don't know.","note":"O não vira don't / doesn't / didn't antes do verbo."},{"lv":"A1","pt":"Eu sei nadar.","en":"I can swim.","note":"Saber fazer algo = can."},{"lv":"A1","pt":"Eu gostaria de um café.","en":"I would like a coffee.","note":"O -ria do português é would."},{"lv":"A1","pt":"Vai chover amanhã.","en":"It will rain tomorrow.","note":"O futuro (vai, -rá) é will + verbo."},{"lv":"A2","pt":"Você deveria descansar.","en":"You should rest.","note":"Deveria = should: um conselho."},{"lv":"A2","pt":"Eu devo ir.","en":"I must go.","note":"must: uma obrigação."},{"lv":"A2","pt":"Talvez chova.","en":"It might rain.","note":"Talvez = might + verbo."}],"misTitle":"Erros mais comuns","misLead":"Traduções palavra por palavra que não funcionam. Toque num erro para ver a frase certa.","mistakes":[{"lv":"A1","pt":"Ela não gosta de café.","wrong":"She don't like coffee.","right":"She doesn't like coffee.","why":"Com he, she, it o auxiliar é does / doesn't."},{"lv":"A1","pt":"Eu tenho 12 anos.","wrong":"I have 12 years.","right":"I am 12.","why":"A idade usa be."},{"lv":"A1","pt":"Você está cansado?","wrong":"Do you are tired?","right":"Are you tired?","why":"Com be não entra do: o be já faz a pergunta sozinho."},{"lv":"A1","pt":"Ela trabalha aqui?","wrong":"Is she work here?","right":"Does she work here?","why":"work é outro verbo: o auxiliar é do / does, não be."},{"lv":"A1","pt":"Ele sabe nadar.","wrong":"He can swims.","right":"He can swim.","why":"Depois de um modal o verbo fica na forma básica, sem -s."},{"lv":"A1","pt":"Eu concordo.","wrong":"I am agree.","right":"I agree.","why":"agree já é o verbo; não precisa de be."},{"lv":"A2","pt":"Você foi à festa?","wrong":"Did you went to the party?","right":"Did you go to the party?","why":"did já mostra o passado: o verbo volta para a forma básica."},{"lv":"A2","pt":"Eles estavam em casa.","wrong":"They was at home.","right":"They were at home.","why":"you, we, they → were; I, he, she, it → was."},{"lv":"A2","pt":"Você deve estudar.","wrong":"You must to study.","right":"You must study.","why":"Os modais não levam to."},{"lv":"A2","pt":"Eu não consegui dormir ontem.","wrong":"I can't sleep last night.","right":"I couldn't sleep last night.","why":"No passado, can vira could."}],"curTitle":"Para os curiosos","curious":[["Contrações","is not → isn't, are not → aren't, do not → don't, does not → doesn't, did not → didn't, cannot → can't, will not → won't. Não existe amn't: diga I'm not."],["Por que does tira o -s?","O -s de he works passa para o auxiliar: he works → does he work? / he doesn't work. O -s aparece uma vez só."],["Could e would educados","Could you help me? e Would you like some tea? são jeitos gentis de pedir e oferecer."],["Must ou have to?","Os dois são obrigação. Must soa mais forte e pessoal (I must call my mom); have to equivale ao nosso “ter que” e é mais corriqueiro (I have to wear a uniform)."],["Respostas curtas","Do you like it? → Yes, I do. / No, I don't. Is she here? → Yes, she is. Can you swim? → Yes, I can. A resposta repete a palavrinha da pergunta."]]},"en":{"btn":"Guide","title":"Guide","tip":"In Portuguese the verb does it all by itself. In English many sentences need a <b>little extra word<\/b>: an <b>auxiliary<\/b> (do, does, did) or a <b>modal<\/b> (can, will, would, etc.). To choose, look at <b>the meaning<\/b>, <b>the subject<\/b> and <b>the time<\/b>.","askTitle":"Ask yourself, in this order","ask":[{"q":"Is there an idea of ability, advice, maybe, future or imaginary (-ria)?","a1":"is able, knows how, may → can · future (vai, -rá) → will · imaginary (-ria) → would","hint":"is able, knows how → can · was able → could · future (vai, -rá) → will · imaginary (-ria) → would · deveria → should · deve → must · talvez → might","ans":["can","could","will","would","should","must","might"]},{"q":"Is it ser or estar?","hint":"who someone is, how they are (tired, happy), where (at home), age (I am 20) and verb + -ing (is sleeping) → be","ans":["am","is","are","was","were"]},{"q":"If not, does it need an auxiliary in the question or negative?","hint":"like, live, work, know… Almost every verb (except the verb to be and the modals) needs an auxiliary in questions and negatives: do / does / did. E.g.: Does she work? She doesn't work.","ans":["do","does","did"]},{"q":"Who is the subject?","hint":"I → am · he, she, it, a name (Ana, my dad) → is, does · you, we, they, a plural (my parents) → are, do.","ans":["am","is","does","are","do"]},{"lv":"A2","q":"When? Present or past?","hint":"now, every day, usually → am / is / are, do / does · yesterday, last week, ago → was / were, did. The lower line links the gap to the time word.","ans":["was","were","did"]}],"nav":{"be":"Be","do":"Do","modal":"Modals","map":"Portuguese → English","mis":"Common mistakes"},"beTitle":"Be","beLead":"The verb to be (ser / estar) changes with the subject and the time. It also comes before a verb with -ing (She is sleeping).","doTitle":"Do","doLead":"The auxiliary for questions and negatives when the sentence already has another verb. On its own it means nothing: it only shows the person and the time.","modalTitle":"The modals","modalLead":"Each one has a meaning. They are the same for every subject and come before the verb in its base form, with no to: She can swim (never cans, can swims or can to swim).","subj":"subject","now":"present","past":"past","neg":"negative","means":"Tap a word to see an example from the game.","mapTitle":"Portuguese → English","mapLead":"Things Portuguese says one way and English says another.","map":[{"lv":"A1","pt":"Eu tenho 20 anos.","en":"I am 20.","note":"Age uses be, not have."},{"lv":"A1","pt":"Está frio. / Faz calor.","en":"It is cold. / It is hot.","note":"Weather uses it + be."},{"lv":"A1","pt":"Você gosta de pizza?","en":"Do you like pizza?","note":"Portuguese has no auxiliary in the question; English puts do first."},{"lv":"A1","pt":"Eu não sei.","en":"I don't know.","note":"Não becomes don't / doesn't / didn't before the verb."},{"lv":"A1","pt":"Eu sei nadar.","en":"I can swim.","note":"Knowing how to do something = can."},{"lv":"A1","pt":"Eu gostaria de um café.","en":"I would like a coffee.","note":"The Portuguese -ria is would."},{"lv":"A1","pt":"Vai chover amanhã.","en":"It will rain tomorrow.","note":"The future (vai, -rá) is will + verb."},{"lv":"A2","pt":"Você deveria descansar.","en":"You should rest.","note":"Deveria = should: advice."},{"lv":"A2","pt":"Eu devo ir.","en":"I must go.","note":"must: an obligation."},{"lv":"A2","pt":"Talvez chova.","en":"It might rain.","note":"Talvez = might + verb."}],"misTitle":"Most common mistakes","misLead":"Word-for-word translations that don't work. Tap one to see the right sentence.","mistakes":[{"lv":"A1","pt":"Ela não gosta de café.","wrong":"She don't like coffee.","right":"She doesn't like coffee.","why":"With he, she, it the auxiliary is does / doesn't."},{"lv":"A1","pt":"Eu tenho 12 anos.","wrong":"I have 12 years.","right":"I am 12.","why":"Age uses be."},{"lv":"A1","pt":"Você está cansado?","wrong":"Do you are tired?","right":"Are you tired?","why":"No do with be: be makes the question on its own."},{"lv":"A1","pt":"Ela trabalha aqui?","wrong":"Is she work here?","right":"Does she work here?","why":"work is another verb: the auxiliary is do / does, not be."},{"lv":"A1","pt":"Ele sabe nadar.","wrong":"He can swims.","right":"He can swim.","why":"After a modal the verb stays in its base form, with no -s."},{"lv":"A1","pt":"Eu concordo.","wrong":"I am agree.","right":"I agree.","why":"agree is already the verb; it needs no be."},{"lv":"A2","pt":"Você foi à festa?","wrong":"Did you went to the party?","right":"Did you go to the party?","why":"did already shows the past: the verb goes back to its base form."},{"lv":"A2","pt":"Eles estavam em casa.","wrong":"They was at home.","right":"They were at home.","why":"you, we, they → were; I, he, she, it → was."},{"lv":"A2","pt":"Você deve estudar.","wrong":"You must to study.","right":"You must study.","why":"Modals take no to."},{"lv":"A2","pt":"Eu não consegui dormir ontem.","wrong":"I can't sleep last night.","right":"I couldn't sleep last night.","why":"In the past, can becomes could."}],"curTitle":"For the curious","curious":[["Contractions","is not → isn't, are not → aren't, do not → don't, does not → doesn't, did not → didn't, cannot → can't, will not → won't. There is no amn't: say I'm not."],["Why does does drop the -s?","The -s of he works moves to the auxiliary: he works → does he work? / he doesn't work. The -s shows up only once."],["Polite could and would","Could you help me? and Would you like some tea? are kind ways to ask and offer."],["Must or have to?","Both are obligation. Must sounds stronger and more personal (I must call my mom); have to is like our “ter que” and more everyday (I have to wear a uniform)."],["Short answers","Do you like it? → Yes, I do. / No, I don't. Is she here? → Yes, she is. Can you swim? → Yes, I can. The answer repeats the little word from the question."]]},"be":[{"a":"is","sj":"she","k":"estar","t":"She ___ tired today.","pt":"Ela {está} cansada hoje."},{"a":"was","sj":"I","k":"ser","t":"I ___ a quiet child.","pt":"Eu {era} uma criança quieta."},{"a":"were","sj":"you","k":"ser","t":"You ___ my best friend at school.","pt":"Você {era} meu melhor amigo na escola."}]},"audio":{"0":"0b42f7a41234.ogg","1":"c949112991e8.ogg","2":"bd636f9d77c1.ogg","3":"4aaa59358c45.ogg","4":"1510f283cf8d.ogg","5":"2be8cda2f72b.ogg","6":"687735d5b11f.ogg","7":"2c3db51e47f5.ogg","8":"b25b252fc7da.ogg","9":"01fb8035d9c7.ogg","10":"6533daaf598e.ogg","11":"3b2b668d857c.ogg","12":"b132da2d89ed.ogg","13":"7d318907789d.ogg","14":"b1e4a20a2983.ogg","15":"7cd4f70bf866.ogg","16":"63d2b68dea45.ogg","17":"6078ab4b8c2d.ogg","18":"873d41ef4471.ogg","19":"5f08ffb3d3a3.ogg","20":"5568da23d6ea.ogg","21":"f150ba3c5534.ogg","22":"0e9a355fd256.ogg","23":"ad00eac32cc9.ogg","24":"4b24ac811cca.ogg","25":"c43a9f7a96f3.ogg","26":"a3fe3aa92a11.ogg","27":"d0073a2f0e72.ogg","28":"e22446c1c8b3.ogg","29":"e8a19d6efec3.ogg","30":"2d4cb71b9822.ogg","31":"4c78c5d4379d.ogg","32":"949bd481ae3d.ogg","33":"286f602009d6.ogg","34":"e7d71fc22502.ogg","35":"53d5a5b34d88.ogg","36":"ff747f6029d1.ogg","37":"1d7010abdb36.ogg","38":"ab6d2224d33a.ogg","39":"40b9ca699d59.ogg","40":"690f7eff6aad.ogg","41":"27ed94823236.ogg","42":"f7fce0d4d536.ogg","43":"bbef91d7ad3f.ogg","44":"ee0f148fb39 // 00-data: turns DATA (src/data, put in by build.py) into the tables the game uses.
// S = [{ t, a, who, pt, tip, lit, id, f }] (id = position in sentences.json, f = family id; who = the pronoun a noun
// subject stands for) · FAMS = the three verb families · famOf = word -> family ·
// A1ALT = id -> its A1 version { t, pt, tip } (swapped in by applyLevelText in 13-round.js).
var S = [], FAMS = DATA.families, famOf = {}, A1ALT = {};
FAMS.forEach(function (f) { f.w.forEach(function (w) { famOf[w] = f; }); });
DATA.sentences.forEach(function (d, i) {
  S.push({ t: d.t, a: d.a, who: d.who || "", pt: d.pt, tip: d.tip, lit: d.lit || "", id: i, f: famOf[d.a].id });
  if (d.a1) {
    var a = { t: d.a1.t };
    if (d.a1.pt) a.pt = d.a1.pt;
    if (d.a1.tip) a.tip = d.a1.tip;
    A1ALT[i] = a;
  }
});
// 01-text: The current sentence's Portuguese side: tipOf ({v} = the pink word(s) of the translation), pinkOf, litOf (word-for-word note), paintPt.
function pinkOf(s) { return (s.pt.match(/\{[^}]+\}/g) || []).map(function (x) { return x.slice(1, -1).replace(/\^/g, ""); }).join(" "); }
function tipOf(s) { return s.tip.replace("{v}", pinkOf(s) || "…"); }
function litOf(s) { return s.lit ? ' <span class="lit">(' + s.lit + ')</span>' : ''; }
function paintPt() {
  if (!cur) return;
  ptEl.innerHTML = '<i>PT</i>' + mk(cur.pt) + litOf(cur);
}

function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
/* Replay a one-shot animation class (the score tile's up / down). The class goes at the animation's end, so the next
   flash needs no forced layout to replay it (2026-11-22: void offsetWidth made the page lay out at once, in the
   middle of an answer); one is forced only while the last flash (or the round's win) is still on. */
function flash(el, c) {
  var on = el.classList.contains("up") || el.classList.contains("down") || el.classList.contains("win");
  el.classList.remove("up", "down", "win"); if (on) void el.offsetWidth; el.classList.add(c);
  if (!el._flEnd) { el._flEnd = 1; el.addEventListener("animationend", function (e) { if (e.target === el) el.classList.remove("up", "down"); }); }
}
