<script>
/* early-theme.js — runs in <head>, before the first paint, in the menu AND in every game: puts on the background
   colour saved in eb-bg (the games' palettes, "p:sky" or "c:#7aa7ff"), so a page never flashes its default colour
   first. The page's own 01-theme.js applies the same colour again a moment later. Keep PAL in step with PALETTES
   (src/js/01-theme.js and the games). */
(function () {
  try {
    var PAL = {
      sky: ["#e4f3fb", "#f1e8fb", "#fdf0e6", 0], peach: ["#ffe6d8", "#ffd6e4", "#fff1c9", 0],
      mint: ["#d9f4e6", "#d3eef6", "#eef6d3", 0], lilac: ["#e9e0fb", "#f7d9ee", "#dbe6fb", 0],
      dusk: ["#2a1740", "#58224f", "#1f3560", 1], midnight: ["#141964", "#441464", "#144e64", 1]
    };
    var s = Storage.prototype.getItem.call(window.localStorage, "eb-bg") || "", c = null;
    if (s.indexOf("p:") === 0) c = PAL[s.slice(2)] || null;
    else if (/^c:#[0-9a-f]{6}$/i.test(s)) {
      var hex = s.slice(2), r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255,
        b = parseInt(hex.slice(5, 7), 16) / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b),
        l = (mx + mn) / 2, h = 0, sat = 0, d = mx - mn;
      if (d) {
        sat = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
        h = (mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) * 60;
      }
      var col = function (dh) { return "hsl(" + ((h + dh + 360) % 360).toFixed(0) + "," + (sat * 100).toFixed(0) + "%," + (l * 100).toFixed(0) + "%)"; };
      c = [col(0), col(40), col(-40), l * 100 < 52];
    }
    if (c) {
      var root = document.documentElement;
      root.style.setProperty("--bg-a", c[0]); root.style.setProperty("--bg-b", c[1]); root.style.setProperty("--bg-c", c[2]);
      root.dataset.theme = c[3] ? "dark" : "light";
    }
  } catch (e) {}
  // The phone's bars (theme-color) follow the background: its top colour --bg-a, set here or later by the page's own
  // colour picker (menu or game: both write --bg-a on <html>). No colour chosen: the default light / dark ones.
  try {
    var html = document.documentElement, last = "";
    var bar = function () {
      var a = html.style.getPropertyValue("--bg-a").trim(), m = document.querySelectorAll('meta[name="theme-color"]');
      for (var i = 0; i < m.length; i++) {
        var v = a || (/dark/.test(m[i].media) ? "#141964" : "#e4f3fb");
        if (m[i].content !== v) m[i].content = v;
      }
      last = a;
    };
    bar();
    document.addEventListener("DOMContentLoaded", bar);
    new MutationObserver(function () {
      if (html.style.getPropertyValue("--bg-a").trim() !== last) bar();
    }).observe(html, { attributes: true, attributeFilter: ["style"] });
  } catch (e) {}
})();

/* iPhone / iPad: ask for a "playback" audio session, so the game's sounds play even with Silent mode on (iOS 17+;
   some games already do this themselves). Websites can't detect Silent mode, so the menu also shows a tip. */
try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
document.documentElement.classList.add("eb-arrive");   /* the header slides in (see the style below) */
</script>

@media (prefers-reduced-motion: no-preference) {

/* The header slides down in from the top when a page arrives (html.eb-arrive, set in <head>, removed when the slide
   ends). It is the real header that moves, not a view-transition snapshot: a snapshot can't show the frosted-glass

/* Leaving with the Games button: the game fades away completely while its sound plays, leaving only its background,
   which is the menu's colour too; the menu then fades in on top. (Half-faded, the page froze on a dim picture while

html.eb-leaving body { opacity: 0; transition: opacity .22s ease-in; pointer-events: none; }

<script>
/* Every game saves its progress in the phone's storage. In the app all games share one storage, so each game's
   keys get the prefix "eb:there-or-have:" here; two games can then use the same key names without overwriting each other.
   One exception: the background colour (every game saves it as "<prefix>-bg", e.g. "p:sky" or "c:#7aa7ff", like
   the menu) is ONE setting for the whole app, kept under the menu's key "eb-bg": the game opens with the colour
   chosen in the menu, and a colour chosen in a game becomes the menu's and the other games' too. */
(function () {
  try {
    var P = "eb:there-or-have:", L = window.localStorage, S = Storage.prototype, BG = /^[a-z]+-bg$/;
    var get = S.getItem, set = S.setItem, del = S.removeItem;
    /* The EN / PT toggles too: ONE language for the whole app, the menu's (eb-lang). Each game saves its toggles
       under its own keys, with its own word for Portuguese (games.json "lang": "pt", "tr" or "native"; English is
       always "en"): reading one gives the menu's language, and a tap in a game changes the menu's and every
       game's. Until EN / PT is chosen, the menu's own rule: Portuguese for My level All / A1 / A2, English from B1. */
    var LG = {};
    function appLang() {
      var l = get.call(L, "eb-lang");
      if (l === "en" || l === "pt") return l;
      var lv = get.call(L, "eb-level");
      return lv === "B1" || lv === "B2+" ? "en" : "pt";
    }
    S.getItem = function (k) {
      if (this === L && BG.test(k)) { var app = get.call(this, "eb-bg"); if (app) return app; }
      if (this === L && LG.hasOwnProperty(k)) return appLang() === "en" ? "en" : LG[k];
      return get.call(this, this === L ? P + k : k);
    };
    S.setItem = function (k, v) {
      if (this === L && BG.test(k)) set.call(this, "eb-bg", v);
      if (this === L && LG.hasOwnProperty(k)) set.call(this, "eb-lang", String(v) === "en" ? "en" : "pt");
      return set.call(this, this === L ? P + k : k, v);
    };
    S.removeItem = function (k) { return del.call(this, this === L ? P + k : k); };
    /* Opened from the menu (a card or Continue)? Then the game starts at the menu's level ("My level"): the menu
       leaves a one-time note (sessionStorage eb-level-go), and the matching level is saved under the game's own
       level key before the game reads it (games.json "level"; the nearest level when the game doesn't have it).
       With "All" on the menu, or on a reload, the game keeps its own last level. */
    var LV = {"key": "th-level", "A1": "A1", "A2": "A2", "B1": "B1", "B2+": "B2"}, SS = window.sessionStorage;
    if (SS.getItem("eb-level-go") === "there-or-have") {
      SS.removeItem("eb-level-go");
      var m = get.call(L, "eb-level");
      if (LV && LV[m]) set.call(L, P + LV.key, LV[m]);
    }
  } catch (e) {}
})();
</script>

  background: var(--cp-track); box-shadow: inset 0 0 0 1px var(--dock-line); outline: none; touch-action: none; }
.cp-h { --cp-track: linear-gradient(90deg, hsl(0,85%,62%), hsl(60,85%,62%), hsl(120,85%,62%), hsl(180,85%,62%), hsl(240,85%,62%), hsl(300,85%,62%), hsl(359,85%,62%)); }

.cp-r::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 4px solid var(--cp-c); box-shadow: 0 2px 6px var(--shadow); transition: transform .2s cubic-bezier(.34,1.56,.64,1); }

.swwrap { position: relative; padding: 0 4px; }

.swwrap .sw { position: absolute; top: calc(100% + 12px); right: 0; z-index: 30; width: max-content; max-width: calc(100vw - 32px); flex-wrap: wrap; justify-content: center; padding: 10px 14px; border-radius: 24px; background: var(--bg-a); border: 1px solid var(--dock-line); box-shadow: 0 10px 26px var(--shadow); opacity: 0; visibility: hidden; transform: translateY(-6px) scale(.96); transform-origin: top right; transition: opacity .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1), visibility 0s linear .25s; }

}

@keyframes tourhl { 0%, 100% { box-shadow: 0 0 0 0 hsla(335,85%,62%,.65), 0 0 14px hsla(335,85%,62%,.35); transform: scale(1); } 50% { box-shadow: 0 0 0 7px hsla(335,85%,62%,0), 0 0 22px hsla(335,85%,62%,.55); transform: scale(1.08); } }
.tourbtn:hover { background: var(--dock-line); transform: translateY(-1px); }
.tour { position: fixed; inset: 0; z-index: 50; touch-action: none; }

  position: fixed; left: 50%; top: 50%; width: 0; height: 0; border-radius: 22px; pointer-events: none;

.tour-card {
  position: fixed; left: 50%; top: 50%; width: min(380px, calc(100vw - 32px)); box-sizing: border-box;
  display: flex; flex-direction: column; gap: .45rem;

}

  transition: transform .25s cubic-bezier(.34,1.56,.64,1), background-color .2s ease;
}

@keyframes tourping { 0% { opacity: .9; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(1.18); } }
@media (max-width: 600px) {
  .dock { width: calc(100% - 20px); max-width: none; margin: 10px auto 0; padding: 6px; gap: 6px 10px; border-radius: 24px; }
  /* Phones: the level picker (on the left) and Practice focus share the first row; everything else wraps to the second (the empty ::after
     is the line break, the buttons after the level picker come after it) */
  .seg.focus { flex: 0 1 auto; min-width: 0; }
  .seg.focus button { flex: 0 1 auto; padding: .62em .7em; letter-spacing: .04em; font-size: clamp(.74rem, 3.3vw, .92rem); }
  .seg.level { flex: none; order: -1; margin-right: 4px; }
  .dock::after { content: ""; order: 1; flex-basis: 100%; height: 0; margin-top: -6px; }
  .dock > .seg.level ~ * { order: 2; }
  .seg-cap { display: none; }
  .swwrap { position: static; }
  .swwrap .sw { left: 12px; right: 12px; width: auto; max-width: none; transform-origin: top center; }

}

/* Score row */
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
.go { display: grid; grid-template-columns: 78px 1fr 78px; align-items: center; column-gap: 10px; max-width: 680px; margin: 20px auto 0; }
.score { cursor: pointer; font: inherit; color: var(--ink); transition: transform .28s cubic-bezier(.34,1.56,.64,1), background .35s ease, box-shadow .35s ease; }
.score:hover { transform: translateY(-2px); }
.score:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.sklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.sk { border: 1.5px solid var(--dock-line); border-radius: 18px; background: var(--fill-mid); overflow: hidden; }
.sk.now { border-color: hsla(150,60%,45%,.7); }
.sk.top { border-color: hsla(45,95%,55%,.9); background: hsla(45,100%,75%,.18); }
.skhead { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.skhead:focus-visible { outline: 2px solid var(--underline); outline-offset: -2px; border-radius: 18px; }
.sknum { flex: none; min-width: 2.4em; text-align: center; font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.skmeta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.skmeta b { font-weight: 500; font-size: .95rem; }
.skmeta small { font-size: .78rem; opacity: .7; }
.skchips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.skchip { font-size: .7rem; font-weight: 600; padding: .1em .55em; border-radius: 999px; background: var(--dock-line); white-space: nowrap; }
.skchip.gold { background: hsla(45,100%,60%,.45); }
.skchip.green { background: hsla(150,70%,55%,.3); }
.skchev { flex: none; opacity: .6; transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
.sk.open .skchev { transform: rotate(180deg); }
.skbody { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s cubic-bezier(.2,.8,.3,1); }
.skbody > div { min-height: 0; overflow: hidden; }
.sk.open .skbody { grid-template-rows: 1fr; }
.skbody .list { margin: 0; padding: 0 10px 10px; }
.score, .tile { justify-self: start; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 78px; height: 54px; padding: 0 8px; border-radius: 18px; background: var(--dock-bg); border: 1px solid var(--dock-line); box-shadow: 0 4px 12px var(--shadow); line-height: 1.05; text-align: center; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: background .35s ease, box-shadow .35s ease; }
.tile { justify-self: end; color: var(--ink); font: inherit; cursor: pointer; transition: transform .28s cubic-bezier(.34,1.56,.64,1), background-color .2s ease; }
.tile:hover { transform: translateY(-2px); background: var(--fill-hi); }
.tile:active { transform: scale(.96); }
.tile svg { display: block; transition: transform .5s cubic-bezier(.34,1.56,.64,1); }
.tile:hover svg { transform: rotate(-200deg); }
.tile small { font-size: .68rem; opacity: .75; white-space: nowrap; line-height: 1.05; }
.tile:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.score b { font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.score small { font-size: .68rem; opacity: .75; white-space: nowrap; }
.score.up { animation: scup .5s cubic-bezier(.34,1.56,.64,1); }
.score.down { animation: scdn .5s ease; }
.score.win { background: hsla(45,100%,80%,.92); box-shadow: 0 0 0 3px hsla(45,95%,60%,.55), 0 6px 18px var(--shadow); animation: scwin .8s cubic-bezier(.34,1.56,.64,1); }
.score.win b, .score.win small { color: #5a3d00; opacity: 1; }
@keyframes scup { 0% { transform: none; } 35% { transform: translateY(-8px) scale(1.22); background: hsla(150,75%,78%,.95); } 100% { transform: none; } }
@keyframes scdn { 0%, 100% { transform: none; } 20% { transform: translateX(-7px) scale(.94); background: hsla(350,85%,82%,.95); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
@keyframes scwin { 0% { transform: scale(1); } 40% { transform: scale(1.3) rotate(-4deg); } 70% { transform: scale(.95) rotate(2deg); } 100% { transform: scale(1); } }
.prog { width: min(100%, 300px); justify-self: center; text-align: center; }
.prog span { font-size: .9rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.pbar { height: 6px; border-radius: 3px; background: var(--dock-line); margin-top: 6px; overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, hsl(330,85%,68%), hsl(265,80%,68%)); transition: width .5s cubic-bezier(.34,1.2,.64,1); }
.tbtn { justify-self: end; display: inline-flex; align-items: center; gap: 5px; font-size: .9rem; font-weight: 500; padding: .55em .8em; border-radius: 999px; border: 1.5px solid var(--dock-line); background: var(--dock-bg); color: inherit; cursor: pointer; white-space: nowrap; }
.tbtn:hover { background: var(--dock-line); }
.hint { text-align: center; margin: 14px 0 0; font-size: 1rem; opacity: .75; }

/* Bubbles */
.tray { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 14px 26px; margin-top: 18px; }
.fam { display: flex; flex-direction: column; align-items: center; gap: 8px; transition: opacity .35s ease, filter .35s ease; }
.fam.dim { opacity: .28; filter: saturate(.4); }
.fam-cap { font-size: .72rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: hsl(var(--h), 55%, var(--lab-l)); }
.fam-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.b {
  --h: 200;
  position: relative; appearance: none; cursor: pointer;
  font-weight: 500; font-size: clamp(1.1rem, 1.2vw + .8rem, 1.4rem); line-height: 1; letter-spacing: .01em;
  color: var(--ink);
  padding: .7em 1.1em .74em; border-radius: 1.1em;
  border: 1.5px solid hsla(var(--h), 75%, var(--rim-l), .75);
  background: radial-gradient(120% 140% at 22% 14%, var(--fill-hi), var(--fill-mid) 48%, var(--fill-lo) 100%);
  box-shadow:
    inset 0 0 16px hsla(var(--h), 95%, var(--glow-l), .38),
    inset -5px -7px 14px hsla(calc(var(--h) + 70), 95%, var(--glow-l), .28),
    0 7px 16px var(--shadow);
  transition: transform .28s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease, border-color .25s ease;
}
.b::before { content: ""; position: absolute; left: 9%; top: 12%; width: 22%; height: 22%; border-radius: 50%; background: radial-gradient(closest-side, var(--gloss), transparent); transform: rotate(-14deg); opacity: .8; pointer-events: none; }
.b:focus-visible { outline: 2px solid var(--underline); outline-offset: 4px; }
.wb { touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.wb:focus-visible, .wb.sel, .tray:not(.locked) .wb.hov {
  transform: translateY(-5px) scale(1.06);
  border-color: hsla(var(--h), 85%, calc(var(--rim-l) - 12%), .95);
  box-shadow: inset 0 0 22px hsla(var(--h), 100%, var(--glow-l), .6), inset -6px -8px 18px hsla(calc(var(--h) + 70), 100%, var(--glow-l), .45), 0 14px 24px var(--shadow), 0 0 0 4px hsla(var(--h), 90%, 75%, .22);
}
.wb.sel { outline: 3px solid hsla(var(--h),80%,60%,.75); outline-offset: 3px; }
.wb.drag { z-index: 20; cursor: grabbing; transition: box-shadow .25s ease; box-shadow: inset 0 0 22px hsla(var(--h),100%,var(--glow-l),.6), 0 18px 28px var(--shadow), 0 0 0 4px hsla(var(--h),90%,75%,.25); }
.wb.shake { animation: shake .5s ease; border-color: hsla(350,85%,62%,.95); box-shadow: inset 0 0 20px hsla(350,95%,70%,.5), 0 8px 18px var(--shadow); }
/* Hover lift only on real mouse pointers, so a tapped bubble never stays raised on a phone */
@media (hover: hover) { .tray:not(.locked) .wb:hover:not(.drag) { transform: translateY(-5px) scale(1.06); border-color: hsla(var(--h), 85%, calc(var(--rim-l) - 12%), .95); } }
/* After an answer the right bubble glows green for a moment, then settles back to normal */
.wb.right { animation: rightglow 1.1s ease-out; }
@keyframes rightglow { 0%, 45% { border-color: hsla(150,60%,45%,.95); box-shadow: inset 0 0 22px hsla(150,90%,70%,.6), 0 8px 18px var(--shadow), 0 0 0 4px hsla(150,80%,60%,.3); transform: scale(1.06); } 100% { transform: none; } }
.tray.locked .wb { cursor: default; }
@keyframes shake { 0%,100% { transform: translateX(0); } 15% { transform: translateX(-9px) rotate(-1.5deg); } 35% { transform: translateX(8px) rotate(1.2deg); } 55% { transform: translateX(-6px); } 75% { transform: translateX(4px); } }

/* Sentence card */
.card {
  padding-bottom: 46px !important;
  position: relative; max-width: 760px; margin: 22px auto 0; padding: 46px clamp(16px, 4vw, 40px) 20px;
  border-radius: 28px; text-align: center;
  background: var(--dock-bg); border: 1px solid var(--dock-line);   /* the same glass, edge and shadow as the header (.dock) */
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: 0 8px 22px var(--shadow);
  transition: border-color .2s ease, box-shadow .25s ease, transform .28s cubic-bezier(.34,1.56,.64,1);
}
.card.hot { border-color: var(--underline); transform: scale(1.015); box-shadow: 0 14px 34px var(--shadow), 0 0 0 5px hsla(335,80%,65%,.22); }
.card-top { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pbtn { display: inline-flex; align-items: center; gap: 5px; font-size: .9rem; font-weight: 500; padding: .45em 1em; border-radius: 999px; border: 1.5px solid var(--dock-line); background: transparent; color: inherit; cursor: pointer; }
.pbtn:hover:not(:disabled) { background: var(--dock-line); }
.pbtn:disabled { opacity: .35; cursor: default; }
.pbtn:focus-visible, .tbtn:focus-visible, .favx:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.pbtn.on { background: var(--ink); color: var(--bg-a); border-color: var(--ink); }
.again { font-size: .75rem; font-weight: 500; padding: .25em .7em; border-radius: 999px; background: var(--bad-bg); }
#qa { animation: pin .3s ease-out; }
@keyframes pin { from { opacity: 0; transform: translateX(22px); } }
.sent { margin: 0; font-size: clamp(1.45rem, 2.6vw + .9rem, 2.35rem); font-weight: 500; line-height: 1.5; text-wrap: balance; }
.gap {
  display: inline-block; min-width: 3.3em; margin: 0 .12em; padding: 0 .35em; line-height: 1.3;
  border: 2.5px dashed var(--underline); border-radius: .45em; cursor: pointer;
  transition: background-color .2s ease, transform .28s cubic-bezier(.34,1.56,.64,1);
}
/* the room opened for the lines after an answer (arcRoom in arc.js) slides in */
.gap.ease { transition: background-color .2s ease, transform .28s cubic-bezier(.34,1.56,.64,1), margin .22s ease; }
.card.hot .gap, .gap.ready { background: hsla(335,80%,65%,.18); transform: scale(1.06); }
.gap.ok, .gap.fix { border-style: solid; border-color: transparent; background: var(--ok-bg); color: var(--ok); font-weight: 600; cursor: default; animation: merge .55s cubic-bezier(.34,1.56,.64,1); }
.gapw { white-space: nowrap; }
/* The ending that carries the meaning (gosta-RIA, llama-RÉ) and whole future markers (vai, vou) stand out */
.sfx { font-weight: 700; color: var(--underline); }
.pt .lit, .fm .lit { font-style: italic; opacity: .85; }
.pt .lit { display: inline-block; max-width: 100%; }
.pt .lit b, .fm .lit b { font-weight: 600; color: var(--underline); }
/* A tense hint after the sentence, e.g. (now) or (in general) */
body.lvl-a1 .when:not(.keep) { display: none; }
.when { display: inline-block; font-size: .62em; font-weight: 500; color: var(--underline); padding: .05em .55em; border: 1.5px solid currentColor; border-radius: 999px; vertical-align: .35em; letter-spacing: .02em; white-space: nowrap; }
.gap.nt { margin-right: 0; }

@keyframes spin { to { transform: rotate(360deg); } }
/* Off screen (.still, shine.js), while a bubble is carried or while the card opens or closes (.calm, shine.js;
   not the right / wrong bubble's glow or shake, which start just then), the float and the turning pause */
.tray.still .wb, .bround.still .bw, body.carrying .wb, body.carrying .bw, body.calm .wb:not(.shake):not(.right),
.tray.still .spin, .bround.still .spin, body.carrying .spin, body.calm .spin { animation-play-state: paused !important; }   /* !important: the animation rules are as specific */
/* What follows the mouse: shine.js writes the transform and opacity of these wrappers (at rest they are as here);
   the look is the <i> inside, so a wrapper has nothing to re-read when it moves. Each is its own layer (will-change),
   so moving it repaints nothing. */
.fg > i, .rh > i, .spot i, .glint > i { position: absolute; inset: 0; }
.film .fg { position: absolute; left: -10%; top: -45%; width: 120%; height: 190%; z-index: 2; opacity: 0; will-change: transform, opacity; }   /* inside, the side facing the mouse glows as it nears: an ellipse 60% x 95% of the bubble around that point of the edge (--faceg-* per theme) */
.fg > i { background: radial-gradient(closest-side, hsla(var(--th), 100%, var(--faceg-l), var(--faceg-a)), transparent); }
.wb .spot, .bw .spot { position: absolute; left: .5em; top: .42em; width: .62em; height: .5em; pointer-events: none; transform: rotate(-14deg); will-change: transform; }   /* the shine: a fixed size and place (em), so it never stretches with a wide bubble */
.spot > i:first-child { background: radial-gradient(closest-side, rgba(255,255,255,var(--soap-gl)) 32%, rgba(255,255,255,calc(var(--soap-gl) * .55)) 62%, rgba(255,255,255,0)); }   /* a solid core (--soap-gl) */
.spot .pl { opacity: 0; }   /* brighter, with a wider core, as the mouse nears (its opacity = the nearness) */
.spot .pl i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--spot-plus) * .85)), rgba(255,255,255,var(--spot-plus)) 42%, rgba(255,255,255,calc(var(--spot-plus) * .55)) 52%, rgba(255,255,255,calc(var(--spot-plus) * .33)) 62%, rgba(255,255,255,calc(var(--spot-plus) * .12)) 81%, rgba(255,255,255,0)); }
/* The small second spot (as in the sibling games): a thin streak lying along the bottom-right curve, so a fixed size
   (em) rotated -45deg, its centre .47em in from both edges (on the corner's arc, just inside the rim). It moves the
   other way from the main spot, a third as far, like light seen through the far side, and brightens as the mouse
   nears (shine.js: its opacity from .8 to 1 of this brightest value). */
.wb .glint, .bw .glint { position: absolute; right: calc(.47em - .17em); bottom: calc(.47em - .085em); width: .34em; height: .17em; pointer-events: none; opacity: .8; transform: rotate(-45deg); will-change: transform, opacity; }
.glint > i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--soap-gl) * .75)) 45%, rgba(255,255,255,0)); }
/* The rim: a ring (a mask cuts out its middle, and everything inside it), over the clear border */
.wb .rim, .bw .rim { position: absolute; inset: -1.5px; border-radius: inherit; padding: 1.5px; pointer-events: none;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.rim .rh { position: absolute; left: -5%; top: -40%; width: 110%; height: 180%; opacity: 0; will-change: transform, opacity; }   /* the side facing the mouse lights up as it nears: an ellipse 55% x 90% of the rim (--rimhi-* per theme) */
.rh > i { background: radial-gradient(closest-side, hsla(var(--th), 100%, var(--rimhi-l), var(--rimhi-a)), transparent); }
.wb:focus-visible, .wb.sel, .tray:not(.locked) .wb.hov, .wb.drag { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 12px 22px var(--soap-sh2), 0 0 0 4px hsla(var(--th), 90%, 72%, .18); }
.wb.sel { outline-color: hsla(var(--th), 80%, 60%, .6); }
@media (hover: hover) { .tray:not(.locked) .wb:hover:not(.drag) { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 12px 22px var(--soap-sh2); } }
.wb.shake { border-color: transparent; --ig: inset 0 0 14px hsla(350, 95%, 70%, .4); box-shadow: 0 6px 14px var(--soap-sh); }
.wb.shake .rim { background: hsla(350, 85%, 62%, .8); }
.wb.shake .rim i { visibility: hidden; }   /* hidden, not stopped: it keeps turning in step with the film */
@media (prefers-reduced-motion: reduce) { .wb .spin, .bw .spin { animation: none; } }
/* Touch screens: the film doesn't turn (when the turn repainted whole bubbles, 15 of them lagged a phone; 7 were
   smooth); each bubble keeps its own angle (--ang, tray.js). Since 2026-11-22 the turn repaints nothing (a
   rotation), so it may come back: try it on a phone with ?fps (perf.js) first. The float stays. */
@media (hover: none) { .wb .spin, .bw .spin { animation: none; } }
/* Sentence type: + (statements), – (negatives), ? (questions), or all three */
.kindbtn { appearance: none; cursor: pointer; flex: none; display: inline-flex; align-items: center; gap: .4em; padding: .42em .7em; border-radius: 999px; border: 1px solid var(--dock-line); background: transparent; color: var(--ink); font-family: inherit; font-weight: 600; font-size: .85rem; line-height: 1; letter-spacing: .04em; transition: transform .25s cubic-bezier(.34,1.56,.64,1), background-color .2s ease, border-color .2s ease; }
.kindbtn:hover { background: var(--dock-line); }
.kindbtn:active { transform: scale(.94); }
.kindbtn .ksym { font-size: 1rem; white-space: nowrap; display: inline-flex; gap: .3em; }
.kindbtn .ksym i { font-style: normal; opacity: .3; transition: opacity .25s ease, transform .3s cubic-bezier(.34,1.56,.64,1); }
.kindbtn .ksym i.on { opacity: 1; }
.kindbtn.only .ksym i.on { transform: scale(1.25); }
.kindbtn.only { border-color: var(--underline); color: var(--underline); background: hsla(335,80%,65%,.12); }
.kindbtn .klbl { font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; font-weight: 500; }
.kindbtn .klbl { display: inline-grid; justify-items: start; }   /* all four labels in one cell (kind.js): the widest sets the width */
.kindbtn .klbl i { grid-area: 1 / 1; font-style: normal; visibility: hidden; }
.kindbtn .klbl i.on { visibility: visible; }
.kindbtn:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
/* Same height as the header's round buttons (.tourbtn: an 18px icon, .55em padding at .92rem): the same font basis for
   the padding, the same padding, an 18px row inside (its symbols and label are sized in rem, so they don't change) */
.kindbtn { font-size: .92rem; padding: .55em .8em; }
.kindbtn > span { height: 18px; display: inline-flex; align-items: center; }
/* The level selector too: the round buttons' height (18px icon + their padding at .92rem + 2px border), its buttons
   filling it (the sliding pill follows them) */
.seg.level { box-sizing: content-box; height: calc(18px + 1.1 * .92rem - 4px); align-items: stretch; }   /* - its own 2px padding, top and bottom; the border adds as on the buttons */
.dock .seg.level button { padding-top: 0 !important; padding-bottom: 0 !important; }   /* .dock: wins over the narrow-phone paddings below */
@media (max-width: 600px) { .seg.level { height: calc(18px + .8 * .92rem - 4px); } }
@media (max-width: 600px) {
  .kindbtn { padding: .4em .42em; } .kindbtn .klbl { display: none; } .kindbtn .ksym { gap: .18em; font-size: .92rem; }
  .seg.level button { padding: .45em .38em !important; }
  #snd { padding: .45em .36em !important; }
}
@media (max-width: 384px) {
  .seg.level button { font-size: .74rem !important; padding: .45em .32em !important; }
  .swbtn { width: 23px !important; height: 23px !important; }
  .dock { column-gap: 0 !important; }
  .dock .tourbtn { margin-left: 4px; }
}

/* Scrollbars, copied from Verb Bubbles (../bedomodal, 80-scrollbar.css), as in the newer games: in the cards that scroll
   (Favoritas / Vistas, end of round, Streaks, tutorial) a thin glossy pill with the pink-to-purple gradient on a clear
   track; the page itself has none. Chrome / Edge / Safari use the ::-webkit-scrollbar parts; Firefox only takes
   colours, so it gets a thin pink thumb (in @supports, since Chrome would let these override the pill). */
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: transparent; margin: 18px 0; }
::-webkit-scrollbar-thumb {
  border: 3px solid transparent; border-radius: 999px; background-clip: padding-box;
  background-image: linear-gradient(180deg, hsl(315,85%,66%), hsl(275,80%,64%));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45);
}
::-webkit-scrollbar-thumb:hover { background-image: linear-gradient(180deg, hsl(315,90%,60%), hsl(275,85%,58%)); }
::-webkit-scrollbar-thumb:active { border-width: 2px; }
::-webkit-scrollbar-button, ::-webkit-scrollbar-corner { display: none; background: transparent; }
@supports (-moz-appearance: none) {
  * { scrollbar-width: thin; scrollbar-color: hsl(295,82%,66%) transparent; }
}
/* The page itself still scrolls on short screens, but shows no bar (only the cards and lists do). */
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }

/* The Build round (bonus) in the middle of a game (js/build.js), copied from Verb Bubbles (../bedomodal, 55-build.css),
   in the look of Question Bubbles: a glossy prompt bubble with the Portuguese, a dashed bubble with one pill slot per
   word, and a cloud of bobbing word bubbles, each its own colour. It takes the place of the tray and the card. */
body.building .tray, body.building #card { display: none; }
.bround[hidden] { display: none; }
.bround { display: flex; flex-direction: column; align-items: center; gap: 26px; max-width: 920px; margin: 26px auto 0; }
/* The tag sitting on a bubble's top edge ("Diga em inglês", "Sua frase · 1 / 2") */
.bround .tag { position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%); z-index: 2; padding: calc(.3em + 1.5px) calc(.85em + 1.5px); border-radius: 999px; white-space: nowrap;
  font-size: .68rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: #fff; background: linear-gradient(90deg, var(--g1), var(--g2)); }   /* flat gradient pill (2026-11-22, from Be or Do or Modal) */
.prompt .tag { --g1: hsl(45, 92%, 58%); --g2: hsl(27, 85%, 58%); }
.qbox .tag { --g1: hsl(330, 80%, 62%); --g2: hsl(300, 60%, 60%); }
/* The sentence in Portuguese */
.prompt { --h: 45; position: relative; display: flex; align-items: center; justify-content: center; width: min(100%, 640px); min-height: 90px;
  padding: 1.5em 1.4em 1.15em; border-radius: 28px; color: var(--ink);
  background: var(--dock-bg); border: 1px solid var(--dock-line);
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: 0 8px 22px var(--shadow); }   /* the header's glass (2026-11-22, from Be or Do or Modal) */
/* smaller than the English word bubbles, so the English stays the focus */
.pt.bpt { margin: 0; text-align: center; font-size: clamp(1rem, .4vw + .9rem, 1.18rem); font-weight: 500; line-height: 1.3; color: var(--ink); text-wrap: balance; }
/* The English sentence: one slot per word, then its final mark */
.qbox { --h: 330; position: relative; display: flex; align-items: center; justify-content: center; width: min(100%, 760px); min-height: 96px;
  padding: 1.55em 1.1em 1.15em; border-radius: 28px; color: var(--ink);
  background: var(--dock-bg); border: 1px solid var(--dock-line);
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: 0 8px 22px var(--shadow);   /* the header's glass, as the sentence card */
  transition: box-shadow .3s ease, border-color .3s ease; }
.qbox.hot { border-color: hsla(var(--h),85%,62%,.9); box-shadow: 0 8px 22px var(--shadow), 0 0 0 5px hsla(var(--h),90%,70%,.24); }
.qbox.shake { animation: shake .5s ease; }
.qbox.solved { animation: merge .6s cubic-bezier(.34,1.56,.64,1); box-shadow: 0 8px 22px var(--shadow), 0 0 0 4px hsla(var(--h),90%,75%,.28); }
.bslots { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px 6px; }
.bslot { display: inline-flex; align-items: center; justify-content: center; min-width: 3.6em; min-height: 2.75em; border-radius: 999px;
  border: 2px dashed hsla(var(--h),60%,var(--rim-l),.85); transition: background-color .2s ease, border-color .2s ease; }
.bslot.filled { border-color: transparent; min-width: 0; }
.bslot.hot { background: hsla(var(--h),90%,70%,.28); border-color: hsla(var(--h),85%,60%,1); }
.bpunct { align-self: flex-end; font-size: 1.6rem; font-weight: 600; line-height: 1; margin: 0 0 .3em -1px; }
/* The word cloud: each word in a home that keeps its place (a dashed ghost) while the word is in a slot */
.bcloud { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 14px 12px; width: min(100%, 760px); min-height: 60px; }
.bhome { display: inline-flex; border-radius: 999px; }
.bhome.away { border: 1.5px dashed var(--dock-line); }
.b.bw { font-size: 1.12rem; line-height: 1.1; padding: .58em 1.05em .62em; border-radius: 999px; white-space: nowrap; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
.bcloud .bw { animation: bob var(--dur, 4s) ease-in-out var(--dl, 0s) infinite alternate; }
@keyframes bob { from { translate: 0 0; } to { translate: var(--bx, 0px) var(--by, -6px); } }
@media (hover: hover) { .b.bw:hover:not(.drag):not(.lock):not(.gone) { transform: translateY(-4px) scale(1.07); border-color: hsla(var(--h), 85%, calc(var(--rim-l) - 12%), .95); } }
.b.bw.drag { z-index: 30; cursor: grabbing; animation: none; transition: none; box-shadow: inset 0 0 22px hsla(var(--h),100%,var(--glow-l),.6), 0 18px 30px var(--shadow), 0 0 0 4px hsla(var(--h),90%,75%,.25); }
.b.bw.lock, .b.bw.gone, .b.bw.shown { cursor: default; }
.b.bw.ok { border-color: hsl(150,60%,48%); box-shadow: inset 0 0 18px hsla(150,80%,60%,.45), 0 6px 14px var(--shadow); }
.b.bw.bad { border-color: hsl(350,75%,60%); box-shadow: inset 0 0 18px hsla(350,90%,68%,.5), 0 6px 14px var(--shadow); animation: shake .5s ease; }
.b.bw.shown { border-color: hsl(40,90%,55%); box-shadow: inset 0 0 18px hsla(45,95%,60%,.5), 0 6px 14px var(--shadow); }
/* Words that start in their slot (at most 2 words to place at A1, 3 at A2, 4 at B1, 5 at B2): already there, quieter */
.b.bw.pre { opacity: .78; box-shadow: inset 0 0 12px hsla(var(--h),80%,var(--glow-l),.25), 0 3px 8px var(--shadow); }
.bcloud .b.bw.gone { opacity: .3; filter: saturate(.3); pointer-events: none; animation: none; }
.bround .fb { margin-top: -8px; }
.bround .fb:empty { display: none; }
.bround .nextrow { padding-top: 0; }
@media (max-width: 600px) {
  .bround { gap: 22px; margin-top: 22px; }
  .prompt, .qbox { padding-left: .8em; padding-right: .8em; }
  .bslots { gap: 8px 4px; } .bcloud { gap: 10px 8px; }
  .b.bw { font-size: 1.02rem; padding: .55em .85em .6em; }
}
@media (prefers-reduced-motion: reduce) { .bcloud .bw { animation: none; } }
/* The soap look on the Build words too (2026-11-22, from Be or Do or Modal; the shared rules are with the tray rules: film, .rim,
   shine). Each word keeps its own random colour (--h). The film turns on every word (not on touch screens); in the
   cloud it bobs as well. Right / wrong / shown turn the rim green / red / yellow; a pre-filled word stays quieter.
   The inner glow is --ig (drawn above the film by .film::after), the outer shadow the bubble's box-shadow. */
.b.bw .bwl { position: relative; }
@media (hover: hover) { .b.bw:hover:not(.drag):not(.lock):not(.gone) { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 12px 22px var(--soap-sh2); } }
.b.bw.drag { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 18px 30px var(--soap-sh2), 0 0 0 4px hsla(var(--th), 90%, 72%, .2); }
.b.bw.ok { border-color: transparent; --ig: inset 0 0 16px hsla(150, 80%, 60%, .42); box-shadow: 0 6px 14px var(--soap-sh); }
.b.bw.bad { border-color: transparent; --ig: inset 0 0 16px hsla(350, 90%, 68%, .45); box-shadow: 0 6px 14px var(--soap-sh); }
.b.bw.shown { border-color: transparent; --ig: inset 0 0 16px hsla(45, 95%, 60%, .45); box-shadow: 0 6px 14px var(--soap-sh); }
.b.bw.ok .rim i, .b.bw.bad .rim i, .b.bw.shown .rim i { visibility: hidden; }   /* hidden, not stopped: they keep turning in step with the film */
.b.bw.ok .rim { background: hsla(150, 60%, 48%, .85); }
.b.bw.bad .rim { background: hsla(350, 80%, 60%, .85); }
.b.bw.shown .rim { background: hsla(40, 90%, 55%, .9); }
.b.bw.pre { --ig: inset 0 0 10px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) * .7)); box-shadow: 0 3px 8px var(--soap-sh); }
.bcloud .b.bw.gone .spin { animation-play-state: paused; }   /* a used trap word, faded: no need to keep turning */
/* Play menu on the "new round" tile and the speed challenge (goal card + 3-2-1 countdown, clock in the progress bar,
   what hides during it); copied from Verb Bubbles (../bedomodal, 85-speed.css). */
.playwrap { position: relative; justify-self: end; }
.playmenu { position: absolute; top: calc(100% + 8px); right: 0; z-index: 30; display: flex; flex-direction: column; gap: 4px; width: max-content; min-width: 220px; padding: 6px; border-radius: 20px; background: var(--bg-a); border: 1px solid var(--dock-line); box-shadow: 0 16px 36px var(--shadow); transform-origin: top right; animation: pickin .22s cubic-bezier(.2,.9,.3,1.15); }
@keyframes pickin { from { opacity: 0; transform: translateY(-6px) scale(.96); } }
.playmenu[hidden] { display: none; }
.playmenu button { appearance: none; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: .6em .85em; border: 0; border-radius: 14px; background: transparent; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.playmenu button:hover, .playmenu button:focus-visible { background: var(--dock-line); outline: none; }
.playmenu b { font-weight: 600; font-size: .98rem; }
.playmenu small { font-size: .78rem; opacity: .7; }
/* Review missed / Favorites with an empty list; the game being played has a pink dot (from Question Bubbles) */
.playmenu button:disabled { opacity: .45; cursor: default; }
.playmenu button:disabled:hover { background: transparent; }
.playmenu button.cur b::after { content: " ●"; font-size: .6em; vertical-align: .25em; color: var(--underline); }
/* Speed challenge: the progress bar becomes a clock that turns red in the last 10 seconds */
.prog.clock span { display: inline-block; font-size: 1.15rem; font-weight: 600; }
.prog.clock .pbar i { background: linear-gradient(90deg, hsl(45,95%,58%), hsl(25,95%,60%)); transition: width .25s linear; }
.prog.urgent span { color: var(--bad); animation: tickpulse 1s ease-in-out infinite; }
.prog.urgent .pbar i { background: hsl(350,85%,60%); }
@keyframes tickpulse { 50% { transform: scale(1.12); } }
body.speed #hintbtn, body.speed #nextrow, body.speed #cardstar { visibility: hidden; }
body.speed .score { cursor: default; }
/* Goal card + 3, 2, 1, Já! */
.cdown { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; padding: 16px; background: rgba(20,20,40,.35); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: fadein .2s ease; }
.cdown[hidden] { display: none; }
.cd-card { width: min(380px, 100%); padding: 1.2rem 1.3rem 1.4rem; border-radius: 1.6rem; text-align: center; color: var(--ink); background: var(--bg-a); border: 1px solid var(--dock-line); box-shadow: 0 22px 50px rgba(0,0,0,.3); animation: cardin .3s cubic-bezier(.34,1.56,.64,1); }
.cd-t { margin: 0; font-size: 1.3rem; font-weight: 600; }
.cd-x { margin: .5rem 0 0; font-size: .98rem; line-height: 1.45; opacity: .85; }
.cd-n { display: block; min-height: 1.2em; margin-top: .4rem; font-size: 3.4rem; font-weight: 600; line-height: 1.2; color: var(--underline); }
.cd-n.beat { animation: cdbeat .6s cubic-bezier(.34,1.56,.64,1); }
@keyframes cdbeat { from { opacity: 0; transform: scale(.4); } 60% { opacity: 1; transform: scale(1.15); } }
@media (max-width: 600px) { .playmenu { min-width: 200px; } }
@media (prefers-reduced-motion: reduce) { .playmenu, .cdown, .cd-card, .cd-n.beat, .prog.urgent span { animation: none; } }
/* Edge jitter (copied from Verb Bubbles, 40-bubbles.css): while something rises on hover it gets an invisible strip
   below it reaching back past where its bottom edge was, so the cursor on that edge stays "inside" after the lift and
   it doesn't flicker up and down. Only while hovered: a strip that is always there catches the cursor below the edge,
   then rises with the element and loses it (the same jitter, lower down). The strip is the lift + 3px, so the springy
   overshoot of the lift never uncovers the edge. Bubbles (tray, Build words) rise 4-5px, the score / new-round tiles
   2px, the round buttons (Favoritas, Vistas, Tutorial) 1px. */
.score, .tile { position: relative; }
@media (hover: hover) {
  .tray:not(.locked) .wb:hover:not(.drag)::after, .b.bw:hover:not(.drag):not(.lock):not(.gone)::after,
  .score:hover::after, .tile:hover::after, .tourbtn:not(.fresh):hover::after { content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: -8px; }
  .score:hover::after, .tile:hover::after { bottom: -5px; }
  .tourbtn:not(.fresh):hover::after { bottom: -4px; }
}
/* The Guide (guide.js; look copied from Be or Do or Modal's 75-guide.css): the opening tip, the "Pergunte-se"
   checklist, section links, a table per family, folding cards, word chips in their family's color, Portuguese →
   English, the most common mistakes, "Para os curiosos". */
.guidecard { max-width: 780px; max-height: 88vh; }
#guidebody { --h: 285; }
.gd-w { display: inline-block; padding: .16em .62em .2em; border-radius: 999px; font-size: .86rem; font-weight: 600; line-height: 1.15; white-space: nowrap; color: hsl(var(--h), 55%, var(--lab-l)); background: hsla(var(--h), 90%, 75%, .16); border: 1.5px solid hsla(var(--h), 70%, 60%, .55); }

/* The bubbles drifting up behind everything (2026-11-22, from Be or Do or Modal; made in background.js). Sizes use lvh
   (the screen's height with the address bar hidden), not vh: on Android the address bar hides and shows while

   transform and opacity animate. They pause while a bubble is carried (body.carrying) or the card opens (body.calm). */
.sky { position: fixed; top: 0; left: 0; right: 0; height: 100vh; height: 100lvh; z-index: -1; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; }
.sky.in { opacity: var(--sky-o); }   /* light .85, dark .6; at load the bubbles are already part-way up and the layer fades in */

  background: radial-gradient(circle at 30% 26%, rgba(255,255,255,var(--sky-hi)), hsla(var(--h), 90%, 78%, var(--sky-tint-a)) 50%, hsla(var(--h), 90%, 72%, calc(var(--sky-tint-a) * .8)) 70%, transparent 71%);

  kindBtn.querySelector(".klbl").innerHTML = KINDS.map(function (x) { return '<i' + (x === kind ? ' class="on"' : "") + ">" + KLBL[x] + "</i>"; }).join("");

// perf.js: A hidden test panel (2026-11-22, from Be or Do or Modal): add ?fps to the address (there-or-have.html?fps) to see the frame rate and the slow frames, and switch each moving effect off or on (the turning film, the shine, the float, the background bubbles, the frosted glass), to find what makes a phone lag. Nothing at all without ?fps; the switches are not saved. Their CSS: the end of styles.css.
(function () {
  if (!/[?&#]fps\b/.test(location.search + location.hash)) return;
  var touchDev = !!(window.matchMedia && matchMedia("(hover: none)").matches);
  var SW = [   /* [id, label, on at the start] */
    ["film", "Film turning", !touchDev && !reduce],   /* off on touch screens (styles.css): the switch can turn it on there */
    ["shine", "Shine", !reduce],
    ["float", "Float", !reduce],
    ["sky", "Background bubbles", !reduce],
    ["blur", "Frosted glass", true]
  ];
  var box = document.createElement("div"); box.className = "perfbox";
  box.innerHTML = '<b class="pf-fps">… fps</b><span class="pf-slow"></span>' + SW.map(function (s) {
    return '<label><input type="checkbox" data-k="' + s[0] + '"' + (s[2] ? " checked" : "") + "> " + s[1] + "</label>";
  }).join("");
  document.body.appendChild(box);
  box.querySelector(".pf-fps").addEventListener("click", function () { box.classList.toggle("mini"); });   /* a tap on the number folds the switches away (on a phone the panel covers the card) */
  box.addEventListener("change", function (e) {
    var k = e.target.dataset.k, on = e.target.checked;
    if (k === "film") { root.classList.toggle("pf-film-on", on); root.classList.toggle("pf-film-off", !on); }
    else root.classList.toggle("pf-no" + k, !on);
  });
  /* frames in the last second, and frames that took over 25 ms (a missed frame at 60 Hz) in the last 10 s */
  var fpsEl = box.querySelector(".pf-fps"), slowEl = box.querySelector(".pf-slow"), times = [], slow = [], prev = 0, shown = 0;
  function tick(t) {
    if (prev && t - prev > 25 && t - prev < 1000) slow.push(t);
    prev = t; times.push(t);
    while (times[0] < t - 1000) times.shift();
    while (slow.length && slow[0] < t - 10000) slow.shift();
    if (t - shown > 500) { shown = t; fpsEl.textContent = times.length + " fps"; slowEl.textContent = slow.length + " slow frames in 10 s"; }

<script>
(function () {
  var MENU = "../index.html";
  var a = document.createElement("a");
  a.className = "eb-home";
  a.href = MENU;
  a.title = "All games · Todos os jogos";
  a.setAttribute("aria-label", "All games");
  // a simple house (2026-11-22, the user: "more reminiscent of home"; it was four little bubbles)
  a.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<path d="M3.5 11.2 12 4l8.5 7.2"/><path d="M6 9.4V19a1 1 0 0 0 1 1h3.6v-5.2h2.8V20H17a1 1 0 0 0 1-1V9.4"/></svg><span>Games</span>';
  // Back to the menu: if we came from it, go back (so the phone's back button doesn't return here); else open it.
  a.addEventListener("click", function (e) {
    e.preventDefault();
    var from = null;
    try { from = sessionStorage.getItem("eb-from-menu"); sessionStorage.removeItem("eb-from-menu"); } catch (x) {}
    var back = from === "there-or-have" && history.length > 1;
    try { sessionStorage.setItem("eb-back", "1"); } catch (x) {}         // the menu skips its entrance animation
    document.documentElement.classList.add("eb-leaving");
    var go = function () { if (back) history.back(); else location.href = MENU; };
    // The menu's "open a game" pop + chime, played through the game's own tone() (so the game's volume and mute
    // apply); then leave once it has been heard.
    if (typeof tone === "function") {

  // In the game's header (the "dock"). The header must never get an extra row because of this button (phones: at
  // most two rows, the user's rule, 2026-11-17). So every place is tried, in order of preference: before the level
  // pills, right after them, then before / after each control, then inside a group of buttons (Verb Wheel's
  // .tools); the place that gives the shortest header wins (the first one on a tie). If every place still adds a
  // row, "tight" mode narrows the gaps between the header's controls and the button a little, and tries again.
  var dock = document.querySelector("header.dock, .dock");
  var tightened = [];
  function height() { return dock.getBoundingClientRect().height; }
  function spots() {
    var out = [], kids = [], i, c, lv = dock.querySelector(":scope > #levelseg");
    for (i = 0; i < dock.children.length; i++) if (dock.children[i] !== a) kids.push(dock.children[i]);
    if (lv) { out.push([dock, lv]); out.push([dock, lv.nextElementSibling === a ? a.nextElementSibling : lv.nextElementSibling]); }
    for (i = 0; i < kids.length; i++) out.push([dock, kids[i]]);
    out.push([dock, null]);
    for (i = 0; i < kids.length; i++) {
      c = kids[i];
      if (/\b(seg|swwrap|volwrap|lang|sw)\b/.test(c.className) || c.getAttribute("role") === "group") continue;
      var d = getComputedStyle(c).display;
      if ((d === "flex" || d === "inline-flex") && c.querySelectorAll(":scope > button").length >= 2) {
        out.push([c, c.firstElementChild]); out.push([c, null]);

  }
  function best() {
    var s = spots(), win = null, h = Infinity, i, hi;
    for (i = 0; i < s.length; i++) {
      if (s[i][1] === a) continue;

      hi = height();
      if (hi < h - 2) { h = hi; win = s[i]; }

    win[0].insertBefore(a, win[1]);
    return h;
  }
  function tight(on) {
    tightened.forEach(function (el) { el.classList.remove("eb-tight"); });
    tightened = on ? [dock, a, a.parentNode] : [];
    tightened.forEach(function (el) { el.classList.add("eb-tight"); });
  }
  function place() {
    tight(false);
    var at = a.parentNode ? [a.parentNode, a.nextSibling] : null;
    if (a.parentNode) a.parentNode.removeChild(a);
    var base = height();                                     // the header as the game made it
    if (at) at[0].insertBefore(a, at[1]); else dock.appendChild(a);
    if (best() <= base + 4) return;
    tight(true);
    if (best() <= base + 4) return;
    tight(false); best();                                    // nothing helps: keep the normal look
  }
  if (dock) {
    // the slide-in has ended: the header gets its frosted blur back
    dock.addEventListener("animationend", function (e) { if (e.animationName === "eb-dock-in") document.documentElement.classList.remove("eb-arrive"); });
    setTimeout(function () { document.documentElement.classList.remove("eb-arrive"); }, 1500);   // in case it never ran
    place();
    var t = 0;
    window.addEventListener("resize", function () { clearTimeout(t); t = setTimeout(place, 150); });
    window.addEventListener("load", place);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
  } else { a.classList.add("eb-float"); document.body.appendChild(a); }

  window.addEventListener("pageshow", function () { document.documentElement.classList.remove("eb-leaving"); });

    navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(function () {});
  }
})();
</script>
