   first. The page's own 01-theme.js applies the same colour again a moment later. Keep PAL in step with PALETTES
   (src/js/01-theme.js and the games). */
(function () {
  try {
    var PAL = {
      sky: ["#e4f3fb", "#f1e8fb", "#fdf0e6", 0], peach: ["#ffe6d8", "#ffd6e4", "#fff1c9", 0],
      mint: ["#d9f4e6", "#d3eef6", "#eef6d3", 0], lilac: ["#e9e0fb", "#f7d9ee", "#dbe6fb", 0],

        l = (mx + mn) / 2, h = 0, sat = 0, d = mx - mn;
      if (d) {

        h = (mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) * 60;
      }

      c = [col(0), col(40), col(-40), l * 100 < 52];
    }

      var root = document.documentElement;
      root.style.setProperty("--bg-a", c[0]); root.style.setProperty("--bg-b", c[1]); root.style.setProperty("--bg-c", c[2]);
      root.dataset.theme = c[3] ? "dark" : "light";

  try {

<script>
/* Every game saves its progress in the phone's storage. In the app all games share one storage, so each game's
   keys get the prefix "eb:conditionals:" here; two games can then use the same key names without overwriting each other.
   One exception: the background colour (every game saves it as "<prefix>-bg", e.g. "p:sky" or "c:#7aa7ff", like
   the menu) is ONE setting for the whole app, kept under the menu's key "eb-bg": the game opens with the colour
   chosen in the menu, and a colour chosen in a game becomes the menu's and the other games' too. */
(function () {
  try {
    var P = "eb:conditionals:", L = window.localStorage, S = Storage.prototype, BG = /^[a-z]+-bg$/;
    var get = S.getItem, set = S.setItem, del = S.removeItem;
    /* The EN / PT toggles too: ONE language for the whole app, the menu's (eb-lang). Each game saves its toggles
       under its own keys, with its own word for Portuguese (games.json "lang": "pt", "tr" or "native"; English is
       always "en"): reading one gives the menu's language, and a tap in a game changes the menu's and every
       game's. Until EN / PT is chosen, the menu's own rule: Portuguese for My level All / A1 / A2, English from B1. */
    var LG = {"cond-guide-lang": "pt", "cond-tour-lang": "tr"};
    function appLang() {
      var l = get.call(L, "eb-lang");
      if (l === "en" || l === "pt") return l;
      var lv = get.call(L, "eb-level");
      return lv === "B1" || lv === "B2+" ? "en" : "pt";
    }
    /* The sound-effects volume too (2026-11-26, the user): ONE for the whole app, the menu's "eb-vol" (0-100,
       0 = sound off). Every game saves "<prefix>-vol" (0-100, its Effects slider) plus an on / off key:
       "<prefix>-snd" ("0" = off) or "<prefix>-mute" ("1" = off). Reading them gives the menu's volume (menu at 0:
       the game opens muted, its slider where it was); after a game writes either, eb-vol = 0 if muted, else its
       slider. The Voice slider ("-vvol") stays each game's own. */
    var VOL = /^[a-z]+-vol$/, MUTE = /^[a-z]+-(snd|mute)$/;
    function own(k) { return get.call(L, P + k); }
    function syncVol(k) {
      var pre = k.slice(0, k.indexOf("-")), v = parseInt(own(pre + "-vol"), 10);
      if (isNaN(v) || v < 0 || v > 100) return;
      var off = own(pre + "-snd") === "0" || own(pre + "-mute") === "1";
      set.call(L, "eb-vol", String(off ? 0 : v));
    }
    S.getItem = function (k) {
      if (this === L && BG.test(k)) { var app = get.call(this, "eb-bg"); if (app) return app; }
      if (this === L && (VOL.test(k) || MUTE.test(k))) {
        var ev = get.call(this, "eb-vol");
        if (ev !== null && VOL.test(k) && ev !== "0") return ev;
        if (ev !== null && MUTE.test(k)) { var off = ev === "0"; return /-snd$/.test(k) ? (off ? "0" : "1") : (off ? "1" : "0"); }
      }
      if (this === L && LG.hasOwnProperty(k)) return appLang() === "en" ? "en" : LG[k];
      return get.call(this, this === L ? P + k : k);
    };
    S.setItem = function (k, v) {
      if (this === L && BG.test(k)) set.call(this, "eb-bg", v);
      if (this === L && LG.hasOwnProperty(k)) set.call(this, "eb-lang", String(v) === "en" ? "en" : "pt");
      var r = set.call(this, this === L ? P + k : k, v);
      if (this === L && (VOL.test(k) || MUTE.test(k))) syncVol(k);
      return r;
    };
    S.removeItem = function (k) { return del.call(this, this === L ? P + k : k); };
    /* The app's own keys (eb-rounds, eb-don…) and language, for the injected donation script (donate.js) */
    window.ebApp = { get: function (k) { return get.call(L, k); }, set: function (k, v) { set.call(L, k, v); }, lang: appLang, title: "Conditionals" };
    /* Opened from the menu (a card or Continue)? Then the game starts at the menu's level ("My level"): the menu
       leaves a one-time note (sessionStorage eb-level-go), and the matching level is saved under the game's own
       level key before the game reads it (games.json "level"; the nearest level when the game doesn't have it).
       With "All" on the menu, or on a reload, the game keeps its own last level. */
    var LV = {"key": "cond-level", "A1": "A1", "A2": "A2", "B1": "B1", "B2+": "B2"}, SS = window.sessionStorage;
    if (SS.getItem("eb-level-go") === "conditionals") {
      SS.removeItem("eb-level-go");
      var m = get.call(L, "eb-level");
      if (LV && LV[m]) set.call(L, P + LV.key, LV[m]);
    }
  } catch (e) {}
})();
</script>

.b.w { font-size: 1.12rem; line-height: 1.1; padding: .58em 1.05em .62em; border-radius: 999px; white-space: nowrap; touch-action: none; user-select: none; -webkit-user-select: none; }

@keyframes bob { from { translate: 0 0; } to { translate: var(--bx, 0px) var(--by, -6px); } }
.b.w:hover, .b.w:focus-visible { transform: translateY(-4px) scale(1.07); }
.w.drag { position: fixed; z-index: 60; margin: 0; pointer-events: none; animation: none; transition: none; transform: scale(1.1) rotate(-3deg);
  box-shadow: inset 0 0 22px hsla(var(--h),100%,var(--glow-l),.6), 0 18px 30px var(--shadow), 0 0 0 4px hsla(var(--h),90%,75%,.25); }
.w.ok, .w.shown { cursor: default; }
.w.ok:hover, .w.shown:hover { transform: none; }
.w.ok { border-color: hsl(150,60%,48%); box-shadow: inset 0 0 18px hsla(150,80%,60%,.45), 0 6px 14px var(--shadow); }
.w.bad { border-color: hsl(350,75%,60%); box-shadow: inset 0 0 18px hsla(350,90%,68%,.5), 0 6px 14px var(--shadow); animation: shake .5s ease; }
.w.shown { border-color: hsl(40,90%,55%); box-shadow: inset 0 0 18px hsla(45,95%,60%,.5), 0 6px 14px var(--shadow); }
.w.hinted::after { content: ""; right: -3px; top: -3px; bottom: auto; width: 10px; height: 10px; background: hsl(45,95%,55%); opacity: 1; }

/* Clause bubbles */
.row { position: relative; display: flex; justify-content: center; align-items: stretch; gap: 18px; width: 100%; }
.clause { --h: 205; position: relative; flex: 1 1 0; min-width: 0; max-width: 470px; min-height: 112px; display: flex; align-items: center; justify-content: center;
  padding: 1.6em 1.2em 1.2em; border-radius: 1.8em; color: var(--ink);
  border: 2px solid hsla(var(--h),75%,var(--rim-l),.9);
  background: radial-gradient(120% 140% at 22% 14%, var(--fill-hi), var(--fill-mid) 48%, var(--fill-lo) 100%);
  box-shadow: inset 0 0 24px hsla(var(--h),95%,var(--glow-l),.42), inset -6px -8px 18px hsla(calc(var(--h) + 70),95%,var(--glow-l),.25), 0 10px 24px var(--shadow);
  transition: box-shadow .3s ease, border-color .3s ease; }
.clause::before { content: ""; position: absolute; left: 7%; top: 10%; width: 20%; height: 16%; border-radius: 50%; background: radial-gradient(closest-side, var(--gloss), transparent); transform: rotate(-12deg); opacity: .7; pointer-events: none; }
.clause.answer { border-style: dashed; background: radial-gradient(120% 140% at 22% 14%, var(--fill-mid), var(--fill-lo) 70%); }
.clause.answer.hot { box-shadow: inset 0 0 24px hsla(var(--h),95%,var(--glow-l),.55), 0 10px 24px var(--shadow), 0 0 0 6px hsla(var(--h),90%,70%,.3); }
.clause.shake { animation: shake .5s ease; }
.ctext { margin: 0; font-size: clamp(1.2rem, 1vw + .95rem, 1.5rem); font-weight: 500; line-height: 1.3; text-align: center; text-wrap: balance; }
.tag { position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%); z-index: 2; padding: .3em .85em; border-radius: 999px; white-space: nowrap;
  font-size: .68rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  background: var(--bg-a); color: hsl(var(--h),60%,var(--lab-l)); border: 1.5px solid hsla(var(--h),75%,var(--rim-l),.95); }
.slots { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px 6px; }
.slot { display: inline-flex; align-items: center; justify-content: center; min-width: 3.6em; min-height: 2.75em; border-radius: 999px;
  border: 2px dashed hsla(var(--h),60%,var(--rim-l),.85); transition: background-color .2s ease, border-color .2s ease; }
.slot.filled { border-color: transparent; min-width: 0; }
.slot.hot { background: hsla(var(--h),90%,70%,.28); border-color: hsla(var(--h),85%,60%,1); }
.punct { align-self: flex-end; font-size: 1.5rem; font-weight: 600; line-height: 1; margin: 0 0 .35em -2px; }
.row.solved .clause, .row.revealed .clause { border-style: solid; background: radial-gradient(120% 140% at 22% 14%, var(--fill-hi), var(--fill-mid) 48%, var(--fill-lo) 100%); }
.row.solved .clause { animation: merge .6s cubic-bezier(.34,1.56,.64,1); box-shadow: inset 0 0 26px hsla(var(--h),100%,var(--glow-l),.6), 0 10px 24px var(--shadow), 0 0 0 4px hsla(var(--h),90%,75%,.28); }
#hintleft.tick { display: inline-block; animation: tick .5s cubic-bezier(.34,1.56,.64,1); }
@keyframes tick { 0% { transform: scale(1); } 40% { transform: scale(1.5); color: hsl(45,95%,55%); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 15% { transform: translateX(-9px) rotate(-1.5deg); } 35% { transform: translateX(8px) rotate(1.2deg); } 55% { transform: translateX(-6px); } 75% { transform: translateX(4px); } }
@keyframes merge { 0% { transform: scale(.94); } 55% { transform: scale(1.05); } 100% { transform: scale(1); } }

/* Tools row */
.tools { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.trywrap { display: inline-flex; align-items: center; gap: 4px; }
.trylab { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
/* Key verb forms in the finished sentence */
.w.key, .ctext b, .c-if b, .c-main b { font-weight: 700; }
.ctext b { color: hsl(var(--h),70%,var(--lab-l)); }
/* Quiet note for mixed conditionals, under the hint line */
.mixnote { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 8px; margin: 8px 12px 0; font-size: .9rem; opacity: .85; text-align: center; }
.mixnote[hidden] { display: none; }
.mixnote .chip { font-size: .62rem; padding: .3em .75em; }

/* Amber card: A1 translation, A2 pattern (always on), B1 pattern (unfolds with the Pattern button) */
.mixnote .tr-card { display: flex; flex-direction: column; align-items: center; width: min(100%, 620px); margin: 10px auto 4px; padding: 16px 22px;
  border: 2px solid hsl(45 85% var(--rim-l)); border-radius: 24px; background: linear-gradient(160deg, var(--fill-hi), var(--fill-mid));
  box-shadow: 0 6px 20px var(--shadow), inset 0 0 22px hsl(48 95% var(--glow-l) / .35); }
.mixnote .note-row.tr-card { flex-basis: auto; flex-wrap: nowrap; gap: 0; }
/* B1: the whole card folds open */
.mixnote .note-row.fold { display: grid; grid-template-rows: 0fr; justify-content: stretch; opacity: 0; transition: grid-template-rows .35s ease, opacity .3s ease; }
.mixnote .note-row.fold > .card-fold { overflow: hidden; min-height: 0; padding: 0 14px; transition: padding .35s ease; }
.mixnote .note-row.fold.open > .card-fold { padding-bottom: 14px; }
.mixnote .note-row.fold.open { grid-template-rows: 1fr; opacity: 1; transition: grid-template-rows .35s ease, opacity .4s ease .1s; }
.tr-card .card-line { font-size: .72em; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 12px; }
@media (min-width: 881px) { .tr-card .card-line { font-size: .86em; } }
/* A2: the Translation button unfolds the translation inside the card */
.tr-card .card-more { display: grid; grid-template-rows: 0fr; width: 100%; opacity: 0; transition: grid-template-rows .35s ease, opacity .3s ease; }
.tr-card .card-more > .card-line { overflow: hidden; min-height: 0; padding-top: 8px; }
.tr-card.open .card-more { grid-template-rows: 1fr; opacity: 1; transition: grid-template-rows .35s ease, opacity .4s ease .15s; }
@media (prefers-reduced-motion: reduce) { .tr-card .card-more, .tr-card.open .card-more, .mixnote .note-row.fold { transition: none; } }
.tries { display: inline-flex; align-items: center; gap: 6px; padding: 0 6px; }
.tries i { width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(135deg, hsl(330,85%,68%), hsl(265,80%,68%)); box-shadow: 0 1px 4px var(--shadow); transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .3s ease; }
.tries i.used { opacity: .18; transform: scale(.65); }

/* Reveal card */
.reveal { position: relative; max-width: 640px; margin: 18px auto 0; padding: 16px 18px 18px; border-radius: 26px; text-align: center;
  background: var(--dock-bg); border: 1px solid var(--dock-line); box-shadow: 0 12px 30px var(--shadow);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); animation: cardin .45s cubic-bezier(.34,1.56,.64,1); transition: opacity .25s ease; }
.reveal[hidden] { display: none; }
.reveal.out { opacity: 0; }
.rv-head { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 12px; }
.chip { display: inline-block; font-size: .74rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: .38em .95em; border-radius: 999px; color: #fff; white-space: nowrap;
  background: linear-gradient(135deg, hsl(var(--h),75%,52%), hsl(calc(var(--h) + 35),70%,50%)); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); text-shadow: 0 1px 1px rgba(0,0,0,.18); }
.formula { font-size: .98rem; font-weight: 600; }
.c-if { color: hsl(330,70%,var(--lab-l)); }
.c-main { color: hsl(205,75%,var(--lab-l)); }
.rv-use { margin: 6px 0 0; font-size: .88rem; opacity: .75; }
.rv-tr { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 14px 0 0; padding: 12px 14px; border-radius: 18px; background: var(--fill-mid); border: 1px solid var(--dock-line); animation: pup .5s .2s ease-out backwards; }
.rv-tr p { margin: 0; font-size: clamp(1.05rem, .6vw + .95rem, 1.25rem); font-weight: 500; text-align: left; line-height: 1.35; }
.rv-tr .pick-badge { font-size: .8rem; }
.rv-note { margin: 12px 0 0; padding: 8px 12px; border-radius: 14px; font-size: .9rem; background: hsla(45,100%,70%,.2); border: 1px dashed hsla(45,90%,50%,.6); animation: pup .5s .4s ease-out backwards; }
.rv-note b { color: hsl(35,85%,var(--lab-l)); }
.rv-btns { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 16px; }
@keyframes cardin { from { opacity: 0; transform: scale(.92) translateY(12px); } }
@keyframes pup { from { opacity: 0; transform: translateY(10px); } }
/* Buttons (Next, Practise these, Play again…): the gradient and soft glow of "Practice" in the verb wheel
   (pink 315° to purple 275°) */
.cta { background: linear-gradient(135deg, hsl(315,85%,68%), hsl(275,80%,68%)); box-shadow: 0 3px 9px hsla(295,70%,55%,.22);
  transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease; }
.cta:hover { box-shadow: 0 4px 12px hsla(295,70%,55%,.3); }
.cta:active { transform: scale(.96); }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }

/* Toast + confetti bubbles */
.toast { position: absolute; left: 50%; top: 0; z-index: 5; padding: .35em 1em; border-radius: 999px; font-weight: 600; white-space: nowrap; pointer-events: none;
  background: hsl(150,60%,42%); color: #fff; box-shadow: 0 6px 16px var(--shadow); animation: toast 1.7s ease-out forwards; }
.toast.zero { background: hsl(35,85%,48%); }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%,-40%) scale(.6); } 15% { opacity: 1; transform: translate(-50%,-115%) scale(1.08); } 75% { opacity: 1; transform: translate(-50%,-130%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-175%); } }
.pf { position: fixed; z-index: 55; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at 30% 30%, #fff, hsla(var(--h),85%,75%,.55)); border: 1px solid hsla(var(--h),85%,68%,.85); animation: pfly .8s ease-out forwards; }
@keyframes pfly { from { transform: translate(-50%,-50%) scale(.3); opacity: .95; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1); opacity: 0; } }

/* Tour spotlight glides between targets */
.tour-spot { transition: left .45s cubic-bezier(.3,1.15,.5,1), top .45s cubic-bezier(.3,1.15,.5,1), width .45s cubic-bezier(.3,1.15,.5,1), height .45s cubic-bezier(.3,1.15,.5,1); }
/* No glide until Next / Back (.glide, set in tourGo): the first card pops in where it belongs instead of flying in. */
.tour:not(.glide) .tour-card, .tour:not(.glide) .tour-spot { transition: none; }
.tour-card { transition: left .4s ease, top .4s ease; max-height: calc(100vh - 24px); overflow-y: auto; }
/* Tour header: step label + EN / translation toggle (kept clear of the close button) */
.tour-head { display: flex; align-items: center; gap: .6rem; padding-right: 2.2rem; }
.tour-head .tour-step { padding-right: 0; flex: 1; }
.tour-lang { display: flex; gap: 2px; padding: 2px; border-radius: 999px; border: 1px solid var(--dock-line); flex: none; }
.tour-lang[hidden] { display: none; }
.tour-lang button { appearance: none; border: 0; cursor: pointer; font-family: inherit; font-size: .7rem; font-weight: 600; letter-spacing: .06em; line-height: 1;
  padding: .45em .75em; border-radius: 999px; color: var(--ink); background: transparent; transition: background-color .2s ease, color .2s ease; }
.tour-lang button:hover { background: var(--dock-line); }
.tour-lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg-a); }
.tour-lang button:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
/* Welcome card: one colour-coded example per conditional type */
.tour-ex { list-style: none; margin: .55rem 0 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; }
.tour-ex li { display: flex; flex-wrap: wrap; align-items: baseline; gap: .15rem .5rem; font-weight: 500; }
.tour-ex .chip { font-size: .62rem; padding: .32em .75em; }
.tour-ex .tour-tr { flex-basis: 100%; font-size: .88rem; font-weight: 400; opacity: .8; }

/* Narrow screens: stack the clauses (the words sit in rows under them) */
@media (max-width: 880px) {
  .row { flex-direction: column; align-items: stretch; gap: 22px; }
  .clause { flex: none; max-width: none; }
}
@media (max-width: 600px) {
  .lang-cap { display: none; }
  .dock { gap: 6px 8px; }
  .clause { min-height: 88px; padding: 1.5em .8em 1em; }
  .b.w { font-size: 1rem; padding: .5em .85em .55em; }
  .slot { min-width: 3em; min-height: 2.5em; }
  .tools { margin-top: 14px; }
  /* Tries, Hint, (Translation / Pattern,) Clear: one row on phones */
  .tools { flex-wrap: nowrap; gap: 6px; }
  .tools .pbtn { font-size: .8rem; padding: .45em .75em; gap: .3em; white-space: nowrap; }
  .tools .pbtn small { font-size: .68rem; }
  .tools .pbtn svg { width: 14px; height: 14px; }
  .trywrap { flex-direction: column; gap: 3px; }   /* the "Tries" label sits on top of the dots */
  .trylab { font-size: .58rem; letter-spacing: .05em; line-height: 1; }
  .tries { gap: 4px; padding: 0 3px; }
  .tries i { width: 10px; height: 10px; }
  .reveal { margin-top: 14px; padding: 14px 12px 16px; }
}
@media (prefers-reduced-motion: reduce) {
  #hintleft.tick, .orbit .w, .row.solved .clause, .reveal, .rv-tr, .rv-note, .toast, #stage.rise .home, #stage.rise .clause { animation: none !important; }
  .tour-spot, .tour-card, #stage, .arena, .orbit .home { transition: none; }
}
/* Meaning of a pre-filled word, shown on hover or tap (16-gloss.js) */
.glosstip { position: fixed; z-index: 60; display: flex; align-items: center; gap: 8px; max-width: min(80vw, 300px); padding: 7px 13px 7px 8px; border-radius: 14px;
  background: var(--dock-bg); border: 1px solid var(--dock-line); color: var(--ink); box-shadow: 0 8px 22px var(--shadow);
  backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
  font-weight: 600; font-size: 1rem; line-height: 1.25; pointer-events: none; animation: gpop .12s ease-out; }
.glosstip[hidden] { display: none; }
.gw { cursor: pointer; border-radius: 6px; transition: background-color .15s ease; }
.gw.on { background: hsla(var(--h),90%,70%,.25); }
@media (hover: hover) { .gw:hover { background: hsla(var(--h),90%,70%,.18); } }
.glosstip .pick-badge { flex: none; font-size: .68rem; }
@keyframes gpop { from { opacity: 0; transform: translateY(3px); } }
@media (prefers-reduced-motion: reduce) { .glosstip { animation: none; } }
/* Idle reminder on the hint button (14-explain.js) */
#hintbtn.nudge { animation: nudge .7s ease-in-out; }
@keyframes nudge { 0%, 100% { transform: none; } 15% { transform: rotate(-6deg) scale(1.08); } 35% { transform: rotate(5deg) scale(1.08); } 55% { transform: rotate(-3deg) scale(1.04); } 75% { transform: rotate(2deg); } }

/* Theme change (swapBg in 01-theme.js, from Verb Wheel): no transitions for that one style change; the old
   background fades away on top */
.theming body, .theming *, .theming *::before, .theming *::after { transition: none !important; }
.bgfade { position: fixed; inset: 0; z-index: -1; pointer-events: none; background-color: var(--fa);
  background-image: radial-gradient(60vmax 50vmax at 8% 6%, var(--fa), transparent 70%),
    radial-gradient(55vmax 45vmax at 95% 40%, var(--fb), transparent 70%),
    radial-gradient(60vmax 50vmax at 30% 100%, var(--fc), transparent 70%);
  transition: opacity .55s ease; will-change: opacity; }
.bgfade.fading { opacity: 0; }

/* Edge jitter (from Verb Wheel, via Be Do Modal): while something rises on hover it gets an invisible strip below it
   reaching back past where its bottom edge was, so the cursor on that edge stays "inside" after the lift and it
   doesn't flicker up and down. Only while hovered (a strip that is always there rises with it and loses the cursor
   lower down). The strip is the lift + 3-4px. Word and bonus bubbles lend their gloss dot (::after) to it on hover. */
.score, .tile, .pbtn { position: relative; }
@media (hover: hover) {
  .b.w:hover:not(.drag):not(.ok):not(.shown):not(.hinted)::after, .b.mb:hover::after,
  .score:hover::after, .tile:hover::after, .tourbtn:not(.fresh):hover::after, .pbtn:hover:not(:disabled)::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: -8px; width: auto; height: auto; border-radius: 0; background: none; opacity: 0; pointer-events: auto; }
  .b.mb:hover::after, .score:hover::after, .tile:hover::after { bottom: -5px; }
  .tourbtn:not(.fresh):hover::after, .pbtn:hover:not(:disabled)::after { bottom: -4px; }
}

/* 21-soap.css — the word bubbles as soap bubbles (from Be Do Modal, 2026-11-22): almost clear, a faint film of colour
   inside and a 1.5px coloured rim, both turning once in 10 s (each word its own random hue, --h). Built from spans
   (SOAP in 27-shine.js), each drawn once: the film and the rim turn by rotating a still conic gradient (.spin, a
   transform animation), and what follows the mouse moves by transform / opacity only (27-shine.js). Paint order,
   bottom to top: the film (.spin, the white sheen ::before, the glow facing the mouse .fg, the inner glow ::after),
   the shine spot, the rim, the small spot, the word (.wl). Per-theme numbers are tokens in 10-base.css (--soap-*,
   --spot-plus, --film-a, --srim-*, --sglow-*, --rimhi-*, --faceg-*). The border stays, clear, so no size changes. */
.b.w { --th: var(--h); border-color: transparent; background: none;
  --ig: inset 0 0 12px hsla(var(--th), 95%, var(--sglow-l), var(--sglow-a));   /* the inner glow, drawn above the film by .film::after; states change it */
  box-shadow: 0 6px 14px var(--soap-sh); }
.b.w::before { content: none; }   /* the shine spot is the .spot span */
.b.w:not(.hinted)::after { background: none; }   /* ::after is only the hint dot and the hover strip (20-game.css) */
.b.w .wl { position: relative; }   /* above the moving shine */
:is(.w, .mb) .film, :is(.w, .mb) .spot, :is(.w, .mb) .rim, :is(.w, .mb) .glint { cursor: inherit; }
:is(.w, .mb) .film { position: absolute; inset: -1.5px; z-index: 0; border-radius: inherit; overflow: hidden; pointer-events: none; }
:is(.w, .mb) .film::before { content: ""; position: absolute; inset: 0; z-index: 1;
  background: radial-gradient(120% 120% at 30% 20%, rgba(255,255,255,var(--soap-hi)), rgba(255,255,255,var(--soap-lo)) 60%, transparent); }
:is(.w, .mb) .film::after { content: ""; position: absolute; inset: 1.5px; z-index: 3; border-radius: inherit; box-shadow: var(--ig); transition: box-shadow .25s ease; }
/* The turning colour of film and rim: a square wider than the bubble's diagonal, centred; rotating it = turning the
   conic gradient's start. Both start together, so their colours stay in step. */
:is(.w, .mb) .spin { position: absolute; left: 50%; top: 50%; width: calc(100% + 1.6em); aspect-ratio: 1; translate: -50% -50%; animation: spin 10s linear var(--dl, 0s) infinite; }
:is(.w, .mb) .film .spin { background: conic-gradient(from var(--ang), hsla(var(--th), 95%, 76%, var(--film-a)) 0 30%, hsla(calc(var(--th) + 90), 95%, 80%, calc(var(--film-a) * .6)) 50%, hsla(calc(var(--th) + 200), 90%, 82%, calc(var(--film-a) * .7)) 72%, hsla(var(--th), 95%, 76%, var(--film-a)) 92%); }
:is(.w, .mb) .rim .spin { background: conic-gradient(from var(--ang), hsla(var(--th), 90%, var(--srim-l), var(--srim-a)) 0 30%, hsla(calc(var(--th) + 90), 90%, calc(var(--srim-l) + 4%), calc(var(--srim-a) * .64)) 50%, hsla(calc(var(--th) + 200), 85%, calc(var(--srim-l) + 8%), calc(var(--srim-a) * .56)) 72%, hsla(var(--th), 90%, var(--srim-l), var(--srim-a)) 92%); }
@keyframes spin { to { transform: rotate(360deg); } }
/* What follows the mouse: 27-shine.js writes these wrappers' transform / opacity; the look is the <i> inside, and each
   is its own layer, so moving it repaints nothing. */
:is(.w, .mb) .fg > i, :is(.w, .mb) .rh > i, :is(.w, .mb) .spot i, :is(.w, .mb) .glint > i { position: absolute; inset: 0; }
:is(.w, .mb) .film .fg { position: absolute; left: -10%; top: -45%; width: 120%; height: 190%; z-index: 2; opacity: 0; will-change: transform, opacity; }
:is(.w, .mb) .fg > i { background: radial-gradient(closest-side, hsla(var(--th), 100%, var(--faceg-l), var(--faceg-a)), transparent); }
:is(.w, .mb) .spot { position: absolute; left: .5em; top: .42em; width: .62em; height: .5em; pointer-events: none; transform: rotate(-14deg); will-change: transform; }   /* the shine: one size and place (em), never stretched by a wide bubble */
:is(.w, .mb) .spot > i:first-child { background: radial-gradient(closest-side, rgba(255,255,255,var(--soap-gl)) 32%, rgba(255,255,255,calc(var(--soap-gl) * .55)) 62%, rgba(255,255,255,0)); }
:is(.w, .mb) .spot .pl { opacity: 0; }   /* brighter, wider core as the mouse nears */
:is(.w, .mb) .spot .pl i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--spot-plus) * .85)), rgba(255,255,255,var(--spot-plus)) 42%, rgba(255,255,255,calc(var(--spot-plus) * .55)) 52%, rgba(255,255,255,calc(var(--spot-plus) * .33)) 62%, rgba(255,255,255,calc(var(--spot-plus) * .12)) 81%, rgba(255,255,255,0)); }
/* the small second spot: a thin streak along the bottom-right curve; it moves the other way, a third as far */
:is(.w, .mb) .glint { position: absolute; right: calc(.47em - .17em); bottom: calc(.47em - .085em); width: .34em; height: .17em; pointer-events: none; opacity: .8; transform: rotate(-45deg); will-change: transform, opacity; }
:is(.w, .mb) .glint > i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--soap-gl) * .75)) 45%, rgba(255,255,255,0)); }
/* the rim: a ring (a mask cuts out its middle) over the clear border */
:is(.w, .mb) .rim { position: absolute; inset: -1.5px; border-radius: inherit; padding: 1.5px; pointer-events: none;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
:is(.w, .mb) .rim .rh { position: absolute; left: -5%; top: -40%; width: 110%; height: 180%; opacity: 0; will-change: transform, opacity; }   /* the side facing the mouse lights up */
:is(.w, .mb) .rh > i { background: radial-gradient(closest-side, hsla(var(--th), 100%, var(--rimhi-l), var(--rimhi-a)), transparent); }
/* States: hover / focus / drag glow more; right / wrong / shown turn the rim green / red / yellow; pre-filled stay quiet */
.b.w:focus-visible { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 12px 22px var(--soap-sh2), 0 0 0 4px hsla(var(--th), 90%, 72%, .18); }
@media (hover: hover) { .b.w:hover:not(.drag):not(.ok):not(.shown):not(.pre) { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 12px 22px var(--soap-sh2); } }
.b.w.drag { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 18px 30px var(--soap-sh2), 0 0 0 4px hsla(var(--th), 90%, 72%, .2); }
.b.w.ok { border-color: transparent; --ig: inset 0 0 16px hsla(150, 80%, 60%, .42); box-shadow: 0 6px 14px var(--soap-sh); }
.b.w.bad { border-color: transparent; --ig: inset 0 0 16px hsla(350, 90%, 68%, .45); box-shadow: 0 6px 14px var(--soap-sh); }
.b.w.shown { border-color: transparent; --ig: inset 0 0 16px hsla(45, 95%, 60%, .45); box-shadow: 0 6px 14px var(--soap-sh); }
.w.ok .rim i, .w.bad .rim i, .w.shown .rim i { visibility: hidden; }   /* hidden, not stopped: they keep turning in step with the film */
.w.ok .rim { background: hsla(150, 60%, 48%, .85); }
.w.bad .rim { background: hsla(350, 80%, 60%, .85); }
.w.shown .rim { background: hsla(40, 90%, 55%, .9); }
.b.w.pre { --ig: inset 0 0 10px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) * .7)); box-shadow: 0 3px 8px var(--soap-sh); }
/* The bob holds still while hovered (no edge jitter); off screen (#stage.still), while a word is carried
   (body.carrying) or while the reveal card opens or closes (body.calm, 27-shine.js), bob and film pause */
@media (hover: hover) { .orbit .w:hover { animation-play-state: paused; } }
#stage.still .w, #stage.still .spin, body.carrying .w:not(.bad), body.carrying .spin, body.calm .orbit .w, body.calm .spin { animation-play-state: paused !important; }
/* Touch screens: the film doesn't turn (each word keeps its own --ang); the bob stays */
@media (hover: none) { :is(.w, .mb) .spin { animation: none; } }
@media (prefers-reduced-motion: reduce) { :is(.w, .mb) .spin { animation: none; } }
/* The bonus round's bubbles (26-bonus.js) in the same soap look: the column's colour leads (English blue 205,
   Portuguese pink 330, as their labels); picked = pink ring, hot = a stronger glow, wrong = red rim, matched = green
   rim (yellow when the point was lost). Their text sits above the film (position: relative). */
.mboard .b.mb { --th: var(--h); border-color: transparent; background: none; border-width: 1.5px;
  --ig: inset 0 0 12px hsla(var(--th), 95%, var(--sglow-l), var(--sglow-a)); box-shadow: 0 6px 14px var(--soap-sh); }
.mcol.q .b.mb { --th: 205; }
.mboard .b.mb.q { border-width: 1.5px; }   /* the soap insets assume a 1.5px border; the bold text still marks the English */
.mcol.a .b.mb { --th: 330; }
.mboard .b.mb::before { content: none; }
.mboard .b.mb:not(:hover)::after { content: none; }   /* ::after is only the hover strip (20-game.css) */
.mboard .b.mb .wl, .b.mb .chip, .b.mb .mq, .b.mb .ma { position: relative; }
.mboard .b.mb.sel { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 12px 22px var(--soap-sh2), 0 0 0 4px hsla(330,90%,70%,.45); }
.mboard .b.mb.hot { border-color: transparent; --ig: inset 0 0 18px hsla(var(--th), 100%, var(--sglow-l), calc(var(--sglow-a) + .2)); box-shadow: 0 10px 20px var(--soap-sh2), 0 0 0 5px hsla(var(--th),90%,70%,.3); }
.mboard .b.mb.drag { box-shadow: 0 18px 28px var(--soap-sh2), 0 0 0 4px hsla(var(--th),90%,75%,.25); }
.mboard .b.mb.bad { border-color: transparent; --ig: inset 0 0 16px hsla(350, 90%, 68%, .45); box-shadow: 0 6px 14px var(--soap-sh), 0 0 0 4px hsla(350,85%,65%,.2); }
.mboard .b.mb.done { border-color: transparent; --ig: inset 0 0 16px hsla(150, 80%, 60%, .4); box-shadow: 0 6px 14px var(--soap-sh), 0 0 0 3px hsla(150,70%,60%,.16); }
.mboard .b.mb.done.half { border-color: transparent; --ig: inset 0 0 16px hsla(45, 95%, 60%, .45); box-shadow: 0 6px 14px var(--soap-sh); }
.mb.bad .rim i, .mb.done .rim i { visibility: hidden; }
.mb.bad .rim { background: hsla(350, 80%, 60%, .85); }
.mb.done .rim { background: hsla(150, 60%, 48%, .85); }
.mb.done.half .rim { background: hsla(40, 90%, 55%, .9); }
body.carrying #bonus .spin, body.calm #bonus .spin { animation-play-state: paused !important; }

/* 22-glass.css — from Be Do Modal's revamp (2026-11-22): clause boxes and the reveal card in the header's frosted glass
   with flat gradient labels, the background bubbles, the custom colour picker, no page scroll behind a window. */
/* Clause boxes: the header's glass (same background, 1px edge, shadow); the clause colour lives in the label pill
   (if = pink 330, main = blue 205), the dashed slots and the hot / solved ring */
.clause, .clause.answer, .row.solved .clause, .row.revealed .clause { border-radius: 28px;
  background: var(--dock-bg); border: 1px solid var(--dock-line);
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: 0 8px 22px var(--shadow); }
.clause::before { content: none; }
.clause.answer.hot { border-color: hsla(var(--h),85%,62%,.9); box-shadow: 0 8px 22px var(--shadow), 0 0 0 5px hsla(var(--h),90%,70%,.24); }
.row.solved .clause { box-shadow: 0 8px 22px var(--shadow), 0 0 0 4px hsla(var(--h),90%,75%,.28); }
/* the label on a box's top edge: a flat gradient pill in the clause's colour, white text */
.clause .tag { padding: calc(.3em + 1.5px) calc(.85em + 1.5px); border: 0; color: #fff;
  background: linear-gradient(90deg, hsl(var(--h), 80%, 62%), hsl(calc(var(--h) - 30), 65%, 60%)); }
/* The amber card under the hint line (A1 translation, A2 / B1 pattern; 14-explain.js): a flat card, a soft amber
   fill and a 1px amber edge, no glow; 16px of room below it before the clause boxes */
.mixnote .tr-card { border: 1px solid hsla(42, 85%, 55%, .45); background: hsla(45, 95%, 62%, .14); box-shadow: 0 6px 16px var(--soap-sh); margin-bottom: 16px; }
/* the reveal card: the same edge and shadow as the header */
.reveal { box-shadow: 0 8px 22px var(--shadow); -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); }

/* Background bubbles drifting up behind everything (made in 08-sky.js). lvh, not vh: Android's address bar would make
   them jump. Only transform / opacity animate; paused while a word is carried or the reveal card opens. */
.sky { position: fixed; top: 0; left: 0; right: 0; height: 100vh; height: 100lvh; z-index: -1; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; }
.sky.in { opacity: var(--sky-o); }
.sky span {
  position: absolute; bottom: -120px; border-radius: 50%;
  border: 1.5px solid hsla(var(--h), 80%, var(--sky-rim-l), var(--sky-rim-a));
  background: radial-gradient(circle at 30% 26%, rgba(255,255,255,var(--sky-hi)), hsla(var(--h), 90%, 78%, var(--sky-tint-a)) 50%, hsla(var(--h), 90%, 72%, calc(var(--sky-tint-a) * .8)) 70%, transparent 71%);
  box-shadow: inset 0 0 14px hsla(var(--h), 95%, var(--sky-glow-l), var(--sky-glow-a));
  filter: blur(2px);
  animation: skydrift var(--t, 30s) linear infinite; animation-delay: var(--d, 0s);
  opacity: 0;
}
body.carrying .sky span, body.calm .sky span { animation-play-state: paused; }
@keyframes skydrift {
  0% { transform: translate3d(0, 0, 0); opacity: 0; }
  8% { opacity: .6; }
  50% { transform: translate3d(var(--x, 20px), -60vh, 0); transform: translate3d(var(--x, 20px), -60lvh, 0); }
  92% { opacity: .45; }
  100% { transform: translate3d(0, -125vh, 0); transform: translate3d(0, -125lvh, 0); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .sky { display: none; } }

/* The custom colour picker (01-theme.js): a full-width row under the swatches while picking. Tracks are pills of their
   own gradient, the handle a white disc ringed in the colour being made. contain: it never widens the pop-over. */
.cpick { contain: inline-size; min-width: 0; display: none; flex: 1 0 100%;
  flex-direction: column; gap: 12px; padding: 12px 0 4px; margin-top: 4px; border-top: 1px solid var(--dock-line); }
.swwrap.open.picking .cpick { display: flex; }
.cpick { --cp-h: 220; --cp-s: 100%; --cp-l: 74%; --cp-c: hsl(var(--cp-h), var(--cp-s), var(--cp-l)); }
.cp-top { display: flex; align-items: center; gap: 10px; }
.cp-hex { flex: 1; min-width: 0; font-family: inherit; font-size: .95rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: transparent;
  border: 1px solid var(--dock-line); border-radius: 999px; padding: .45em .9em; outline: none; }
.cp-hex:focus-visible { border-color: var(--underline); box-shadow: 0 0 0 3px hsla(335,80%,65%,.2); }
.cp-r { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 14px; margin: 4px 0; border-radius: 999px; cursor: pointer;
  background: var(--cp-track); box-shadow: inset 0 0 0 1px var(--dock-line); outline: none; touch-action: none; }
.cp-h { --cp-track: linear-gradient(90deg, hsl(0,85%,62%), hsl(60,85%,62%), hsl(120,85%,62%), hsl(180,85%,62%), hsl(240,85%,62%), hsl(300,85%,62%), hsl(359,85%,62%)); }
.cp-s { --cp-track: linear-gradient(90deg, hsl(var(--cp-h), 0%, var(--cp-l)), hsl(var(--cp-h), 100%, var(--cp-l))); }
.cp-l { --cp-track: linear-gradient(90deg, hsl(var(--cp-h), var(--cp-s), 8%), hsl(var(--cp-h), var(--cp-s), 50%), hsl(var(--cp-h), var(--cp-s), 92%)); }
.cp-r::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 4px solid var(--cp-c); box-shadow: 0 2px 6px var(--shadow); transition: transform .2s cubic-bezier(.34,1.56,.64,1); }
.cp-r::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 4px solid var(--cp-c); box-shadow: 0 2px 6px var(--shadow); }
.cp-r::-moz-range-track { background: transparent; }
.cp-r:hover::-webkit-slider-thumb, .cp-r:active::-webkit-slider-thumb { transform: scale(1.15); }
.cp-r:focus-visible { box-shadow: inset 0 0 0 1px var(--dock-line), 0 0 0 3px hsla(335,80%,65%,.25); }

/* While a window (Favorites, Seen, Guide, end card) or the tutorial is open, the page behind doesn't scroll; only the
   window's card does. Scripts can still scroll the page (the tutorial moves it to what it points at). */
html:has(.favmodal.show), html:has(.tour:not([hidden])) { overflow: hidden; overscroll-behavior: none; }

/* While the tutorial or a window (.favmodal) is open (body.covered, 27-shine.js) the game behind it stands still: the
   blur and dimming over it aren't redrawn on every frame (slow phones). Bubbles inside the window keep moving. */
body.covered :is(.orbit .w, .spin, .sky span):not(.tour *, .favmodal *) { animation-play-state: paused !important; }

/* 30-end.css — end-of-game modal contents. */
.pend { text-align: center; padding: 6px 0 4px; }
.pend b { display: block; font-size: 2.2rem; }
.stars { font-size: 2.2rem; letter-spacing: .12em; color: #f5a300; line-height: 1; }
.stars span { display: inline-block; animation: starin .5s cubic-bezier(.34,1.56,.64,1) backwards; }
.stars span:nth-child(2) { animation-delay: .12s; }
.stars span:nth-child(3) { animation-delay: .24s; }
.stars .off { opacity: .22; }
@keyframes starin { from { opacity: 0; transform: scale(.3) rotate(-60deg); } }
.fams { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 12px 0 4px; }
.endbtns { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 14px 0; }
.rlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.rlist li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 18px; border: 2px solid hsla(150,60%,50%,.55); background: hsla(150,70%,60%,.1); }
.rlist li.miss { border-color: hsla(350,75%,60%,.55); background: hsla(350,85%,70%,.1); }
.rlist .ri { flex: none; width: 1.2em; text-align: center; font-size: 1.1rem; }
.rlist .rs { flex: 1; min-width: 0; line-height: 1.35; }
.rlist .rt { font-size: .86rem; opacity: .78; margin-top: 3px; }
.rlist .rp { flex: none; font-weight: 600; opacity: .8; }
@media (prefers-reduced-motion: reduce) { .stars span { animation: none; } }

/* 31-lists.css — favourite star and the Favorites / Seen list modal. */
.hbtns { display: inline-flex; gap: inherit; flex: none; }
.favstar { appearance: none; border: 0; background: transparent; cursor: pointer; padding: .3em; line-height: 0; border-radius: 50%;
  color: var(--ink); opacity: .55; transition: transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s ease, color .2s ease; }
.favstar svg { display: block; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; }
.favstar:hover { opacity: .9; transform: scale(1.12); }
.favstar.on { color: #f5a300; opacity: 1; }
.favstar.on svg { fill: currentColor; }
.favstar.pop { animation: favwob .45s cubic-bezier(.34,1.56,.64,1); }
.favstar:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
/* On the translation card: bottom-right corner */
.reveal > .favstar { position: absolute; right: 12px; bottom: 12px; }
.listtabs { width: max-content; margin: 0 auto 12px; padding: 2px; border: 1px solid var(--dock-line); border-radius: 999px; flex-wrap: nowrap; }
.listtabs[hidden] { display: none; }
.rlist li.plain { border-color: var(--dock-line); background: transparent; }
/* Row buttons (rowBtns in 21-lists.js): Listen, then the star */
.rlist .rb { flex: none; align-self: center; display: flex; align-items: center; gap: 2px; margin-right: -4px; }
.lsay { flex: none; width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--ink); opacity: .6; cursor: pointer; transition: opacity .2s ease, background-color .2s ease; }
.lsay:hover { opacity: .9; background: var(--dock-line); }
.lsay.speaking { opacity: 1; color: var(--underline); }
.lsay svg { display: block; }
.lsay:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
/* Favoriting (favFx): the header Favorites button wobbles; gold sparks (.pf.fx) fly above the windows */
#favbtn.pop { animation: favwob .45s cubic-bezier(.34,1.56,.64,1); }
@keyframes favwob { 0% { transform: scale(1); } 35% { transform: scale(1.45) rotate(-12deg); } 100% { transform: scale(1); } }
.pf.fx { z-index: 130; animation-duration: .8s; }
.rlist .chip { font-size: .6rem; padding: .28em .7em; margin-bottom: 4px; }
/* A level chip on a list row: its level's gradient, as on the level pill */
.chip.lvchip { background: linear-gradient(135deg, var(--lv), var(--lv2)); color: #fff; }
.listempty { text-align: center; opacity: .7; margin: 18px 0 8px; }
@media (prefers-reduced-motion: reduce) { .favstar.pop, #favbtn.pop { animation: none; } .lsay { transition: none; } }

/* 32-modes.css — progress bars and meters, day streak, combo badge, Play menu, quick question, practice buttons. */
.pbar { height: 6px; margin-top: 5px; border-radius: 999px; background: var(--dock-line); overflow: hidden; }
/* Fill in the level's gradient (--lv / --lv2: the chosen level on the page, each level's own on the mastery meters) */
.pbar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--lv, hsl(330,85%,62%)), var(--lv2, hsl(265,80%,62%))); transition: width .4s ease; }
/* Speed challenge clock (replaces "Sentence 1 of 5") */
.prog.clock #proglbl { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; }
.prog.clock #clk { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.prog.clock #clkdone { font-size: .75rem; opacity: .75; margin-top: 3px; }
.prog.clock .pbar { height: 8px; }
.prog.clock .days { display: none; }   /* the clock needs the room */
#clk.beat { animation: beat .7s cubic-bezier(.34,1.56,.64,1); }
@keyframes beat { 0% { transform: scale(1); } 30% { transform: scale(1.45); color: hsl(45,95%,55%); text-shadow: 0 0 18px hsla(45,95%,60%,.7); } 100% { transform: scale(1); } }
.prog.urgent #clk { color: hsl(350,80%,58%); animation: pulse 1s ease-in-out infinite; }
.prog.urgent .pbar i { background: hsl(350,80%,58%); }
.days { margin-left: .45em; font-size: .8rem; font-weight: 600; }
/* Combo badge on the score tile */
.score { position: relative; }
.combo { position: absolute; top: -9px; right: -9px; padding: .22em .5em; border-radius: 999px; font-style: normal; font-size: .72rem; font-weight: 700; line-height: 1;
  color: #fff; background: linear-gradient(135deg, hsl(330,85%,62%), hsl(265,80%,62%)); box-shadow: 0 2px 8px var(--shadow); }
.combo[hidden] { display: none; }
.combo.tick { animation: tick .5s cubic-bezier(.34,1.56,.64,1); }
/* Play menu on the "new game" tile */
.playwrap { position: relative; justify-self: end; }
.playmenu { position: absolute; top: calc(100% + 8px); right: 0; z-index: 40; display: flex; flex-direction: column; gap: 2px; width: max-content; min-width: 210px; padding: 6px;
  border-radius: 20px; background: var(--bg-a); border: 1px solid var(--dock-line); box-shadow: 0 12px 30px var(--shadow); animation: cardin .22s cubic-bezier(.34,1.56,.64,1);
  -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4); }
.playmenu[hidden] { display: none; }
.playmenu button { appearance: none; border: 0; background: transparent; color: var(--ink); font: inherit; font-weight: 600; text-align: left; cursor: pointer;
  display: flex; flex-direction: column; gap: 1px; padding: .55em .9em; border-radius: 14px; }
.playmenu button small { font-weight: 400; font-size: .76rem; opacity: .7; }
.playmenu button:hover:not(:disabled), .playmenu button:focus-visible { background: var(--dock-line); outline: none; }
.playmenu button.cur span::after { content: " ●"; font-size: .6em; vertical-align: .25em; color: var(--underline); }   /* current mode */
.playmenu button:disabled { opacity: .45; cursor: default; }
/* Quick question (replaces the stage for one step) */
#stage[hidden], .tools[hidden], .bonus[hidden] { display: none; }
/* Bonus round (26-bonus.js), as in the verb wheel: English (blue) and Portuguese (pink) columns of glass bubbles */
.bonus { max-width: 760px; margin: 30px auto 0;   /* room between the hint line and the English / Portuguese labels */ }
.mboard { display: grid; grid-template-columns: 1fr 1fr; gap: 0 clamp(14px, 4vw, 48px); }
.mcol { position: relative; display: flex; flex-direction: column; gap: 10px; padding-top: 18px; min-width: 0; }
.mtag { position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%); z-index: 2; padding: .28em .85em; border-radius: 999px; white-space: nowrap;
  font-size: .68rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; background: var(--bg-a);
  color: hsl(var(--h), 60%, var(--lab-l)); border: 1.5px solid hsla(var(--h), 75%, var(--rim-l), .95); }
.mcol.q { --h: 205; }

/* 33-guide.css — header extras (level colours, conditional-type chip) and the Guide modal. */

/* Level picker: each level has its own gradient (--lv, --lv2 on its button, from levels.json "color"); the sliding
   pill takes the chosen one's (placeInd in 05-controls.js) and hovering a level tints it with its own colour. */
.seg.level button:hover { background: color-mix(in srgb, var(--lv) 22%, transparent); }
.seg.level button[aria-pressed="true"] { color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
.seg.level .seg-ind { background: linear-gradient(135deg, var(--lv, var(--ink)), var(--lv2, var(--ink))); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 3px 10px var(--shadow); }

/* Conditional-type chip: one symbol per type of the level; the chosen one stays lit, in that type's hue (--h). */
.typebtn { --h: 0; appearance: none; cursor: pointer; flex: none; display: inline-flex; align-items: center; gap: .45em; padding: .5em .8em; border-radius: 999px; border: 1px solid var(--dock-line); background: transparent; color: var(--ink); font-family: inherit; font-weight: 600; font-size: .85rem; line-height: 1; letter-spacing: .04em; transition: transform .25s cubic-bezier(.34,1.56,.64,1), background-color .2s ease, border-color .2s ease; }
.typebtn:hover { background: var(--dock-line); }
.typebtn:active { transform: scale(.94); }
.typebtn .tsym { font-size: .95rem; white-space: nowrap; display: inline-flex; gap: .38em; }
.typebtn .tsym i { font-style: normal; opacity: .3; transition: opacity .25s ease, transform .3s cubic-bezier(.34,1.56,.64,1); }
.typebtn .tsym i.on { opacity: 1; }
.typebtn .tsym i.off { opacity: .14; filter: grayscale(1); }
.typebtn.only .tsym i.on { transform: scale(1.3); }
.typebtn.only { border-color: hsl(var(--h),70%,var(--rim-l)); color: hsl(var(--h),65%,var(--lab-l)); background: hsla(var(--h),85%,65%,.14); }
.typebtn .tlbl { font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; font-weight: 500; display: inline-grid; justify-items: center; }
.typebtn .tlbl > span { grid-area: 1 / 1; visibility: hidden; }   /* all names stacked: the widest sets the width */
.typebtn .tlbl > span.cur { visibility: visible; }
.typebtn:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.typebtn.pop { animation: typepop .45s cubic-bezier(.34,1.56,.64,1); }
@keyframes typepop { 0% { transform: scale(1); } 40% { transform: scale(1.16); } 100% { transform: scale(1); } }
/* Header rows. .dock-top holds the levels and the type chip. Wide screens: one row (the wrapper is transparent).
   At 900px and below the header is always exactly two rows: levels + chip on top, the buttons underneath (icons only
   below 720px, so they never need a third row). */
/* Level selector and type chip as tall as the header's round buttons (.tourbtn: an 18px icon, its padding at .92rem,
   a 1px border) at every screen size; the level buttons fill it (the sliding pill follows them). As in There or Have.
   Content-box heights, so their 1px borders round like the buttons' do. */
.seg.level { box-sizing: content-box; height: calc(18px + 1.1 * .92rem - 4px); align-items: stretch; }   /* - its own 2px padding */
.typebtn { box-sizing: content-box; height: calc(18px + 1.1 * .92rem); padding-top: 0 !important; padding-bottom: 0 !important; }
.dock .seg.level button { padding-top: 0 !important; padding-bottom: 0 !important; }
@media (max-width: 720px) { .seg.level { height: calc(18px + .92rem - 4px); } .typebtn { height: calc(18px + .92rem); } }
.dock-top { display: contents; }
@media (max-width: 900px) {
  .dock-top { display: flex; flex: 1 1 100%; justify-content: center; align-items: center; gap: 8px; min-width: 0; }
  .dock { flex-wrap: wrap; }
  .dock > :not(.dock-top) { flex: none; }

  .hbtns { display: contents; }
}

, I would learn new words.","3":"If I had watched the movie in English, I would have learned new words.","m":"If I spoke English well, I would have understood the movie."},{"id":"bx-13","0":"If I run in the morning, I feel good.","1":"If I run tomorrow morning, I will feel good.","2":"If I ran every morning, I would feel good.","3":"If I had run this morning, I would have felt good.","m":"If I liked running, I would have joined the race last week."},{"id":"bx-14","0":"If she has money, she buys books.","1":"If she has money tomorrow, she will buy a book.","2":"If she had more money, she would buy a car.","3":"If she had had more money, she would have bought the car.","m":"If she had saved more money, she would have a car now."},{"id":"bx-15","0":"If I forget my keys, I call my brother.","1":"If I forget my keys, I will call my brother.","2":"If I forgot my keys, I would call my brother.","3":"If I had forgotten my keys, I would have called my brother.","m":"If I hadn't forgotten my keys, I would be at home now."}],"audio":["166e6f34","6e2acea4","7b8d32fa","fd17bb9c","ae0680b2","d6f7152c","0d2374e7","3bf1f433","a2588768","5dfe8af6","dec97b45","9a7366bd","abd16207","b96a00fb","3be939ed","6e2a69ca","67a1678a","b7b5ace8","a6db48b9","57ba7a0f","724860b6","4c2bec9a","3f7ab87d","39d9e9cb","cc03636c","db7d7ba4","8eef8e75","c23aa92d","8bc36ce9","c49f19bb","2b6e309d","c3c600f6","ce3dc26c","9f6a9e88","42ab3fb0","1aa2c34a","96d2a752","f51e2f85","3c7b5e21","db544d9d","713c4e5b","15be4524","a71cda25","7c9abc60","7a0a8cce","e8017de9","072aef15","fde5480b","a148de31","d1df29f6","136c7425","861c8598","5a5f3e11","e9a744a5","db4ce8d3","79a421ed","ce2f89da","82b37a09","21918414","1fbf8009","a73f7e6f","053e7530","4cb589db","d56e4550","a5f1594b","2dc3a013","c4f3f622","c46b2a81","b75ecc91","fa646ded","917bbe8b","82c8eb3f","f9cf035c","4601a550","a0b85680","2a295dda","683aec88","64ddf82f","d9592477","ca738058","f0ae60b8","c4965200","3346b156","7b7aacd6","8b962c54","8641e6eb","d7984b49","dc4 function keyMask(words, key) {

function lang() { return DATA.i18n[curLang]; }

/* ---------- Level segment ---------- */
// Each level has its own gradient (levels.json "color": [from, to]); a pill in that gradient slides under the chosen one.
const lvlBox = $("levelseg");
// lvVars(l) = its "--lv:…;--lv2:…" style (levels.json "color"): on the level button, the list chips and the mastery meters.
const lvVars = l => { const c = (DATA.levels[l] || {}).color || ["#ff5ea8", "#8a5cff"]; return "--lv:" + esc(c[0]) + ";--lv2:" + esc(c[1] || c[0]); };
Object.keys(DATA.levels).forEach(l => {
  lvlBox.insertAdjacentHTML("beforeend", '<button type="button" data-l="' + l + '" aria-pressed="false" title="' + l + " · " + esc(DATA.levels[l].title) +
    '" style="' + lvVars(l) + '">' + l + "</button>");
});
function placeInd(box) {
  const ind = box.querySelector(".seg-ind"), b = box.querySelector('button[aria-pressed="true"]'); if (!ind || !b) return;
  ind.style.width = b.offsetWidth + "px"; ind.style.height = b.offsetHeight + "px";
  ind.style.transform = "translate(" + b.offsetLeft + "px," + b.offsetTop + "px)";
  // The chosen level's colours also go on the page, for the game's progress bar.
  ["--lv", "--lv2"].forEach(p => { const v = b.style.getPropertyValue(p); ind.style.setProperty(p, v); document.documentElement.style.setProperty(p, v); });
}
function setLevelUI(l) {
  lvlBox.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === l)));
  placeInd(lvlBox);
}
lvlBox.addEventListener("click", e => {
  const b = e.target.closest("button[data-l]"); if (!b) return;
  const l = b.dataset.l; store("cond-level", l); setLevelUI(l); sndShuffle(); newGame(l);
});
requestAnimationFrame(() => { placeInd(lvlBox); requestAnimationFrame(() => lvlBox.querySelector(".seg-ind").classList.add("ready")); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => placeInd(lvlBox));
window.addEventListener("resize", () => placeInd(lvlBox));

/* ---------- Conditional-type chip: all → zero → 1st → … → all ---------- */
// focusType = "all" or a group of the level: "0" "1" "2" "3" "m" (both mixed types). Games then use only those sentences.
let focusType = "all";
const typeBtn = $("typebtn"), TSYM = { "0": "0", "1": "1", "2": "2", "3": "3", m: "M" };
const typeGroup = t => t.charAt(0) === "m" ? "m" : t;
const levelGroups = level => [...new Set(DATA.levels[level].types.map(typeGroup))];
const inFocus = s => focusType === "all" || typeGroup(s.type) === focusType;
const focusName = () => tx("ty" + (focusType === "all" ? "All" : focusType));
// Repaint the chip for this level (a type the level doesn't have falls back to all). Every symbol is always shown,
// the level's missing types greyed out; the label stacks every possible name so the chip never changes width.
const ALL_GROUPS = Object.keys(TSYM);
function paintType(level) {
  const gs = levelGroups(level);
  if (!gs.includes(focusType)) focusType = "all";
  typeBtn.querySelector(".tsym").innerHTML = ALL_GROUPS.map(g => '<i class="' +
    (!gs.includes(g) ? "off" : focusType === "all" || focusType === g ? "on" : "") + '">' + TSYM[g] + "</i>").join("");
  const names = new Set(["All"].concat(ALL_GROUPS).flatMap(g => [UI_EN["ty" + g], (lang().ui || {})["ty" + g]]).filter(Boolean));
  const cur = focusName();
  typeBtn.querySelector(".tlbl").innerHTML = [...names].map(n => '<span' + (n === cur ? ' class="cur"' : ' aria-hidden="true"') + ">" + esc(n) + "</span>").join("");
  typeBtn.classList.toggle("only", focusType !== "all");
  const t = Object.keys(DATA.types).find(k => typeGroup(k) === focusType);
  typeBtn.style.setProperty("--h", t ? DATA.types[t].hue : 0);
  typeBtn.title = tx("tyTitle", { x: focusName() }); typeBtn.setAttribute("aria-label", typeBtn.title);
  placeInd(lvlBox);   // on phones the chip shares the levels' row, so its width moves the level buttons
}
typeBtn.addEventListener("click", () => {
  const order = ["all"].concat(levelGroups(G.level));
  focusType = order[(order.indexOf(focusType) + 1) % order.length];
  flash(typeBtn, "pop");
  startMode(G.mode === "review" || G.mode === "fav" ? "normal" : G.mode);   // newGame repaints the chip
  focusNote();
});
// For a moment the hint line says which sentences the chip picked ("Only 1st conditional sentences"), then the
// round's instruction comes back (unless something else changed the line meanwhile).
let focusT = 0;
function focusNote() {
  const was = hintEl.innerHTML, t = Object.keys(DATA.types).find(k => typeGroup(k) === focusType);
  const name = t ? tyOf(t).name : "";
  hintEl.innerHTML = t ? tx("focusOnly", { x: esc(name.charAt(0).toLowerCase() + name.slice(1)) }) : tx("focusAll");
  const now = hintEl.innerHTML; hintEl.classList.remove("fading");
  if (!reduceMotion) flash(hintEl, "alert");   // two pulses, so the player notices the change
  clearTimeout(focusT);
  // Fade out, swap back to the instruction, fade in.
  focusT = setTimeout(() => {
    if (hintEl.innerHTML !== now) return;
    if (reduceMotion) { hintEl.innerHTML = was; return; }
    hintEl.classList.add("fading");
    focusT = setTimeout(() => { if (hintEl.innerHTML === now) hintEl.innerHTML = was; hintEl.classList.remove("fading"); }, 300);
  }, 2600);
}

// True when the chosen level shows its instructions in the translation language.
function nativeUi() { return !!(DATA.levels[G.level] || {}).nativeUi; }
// Text for key k, with {name} placeholders filled from v.
function tx(k, v) {
  let s = (nativeUi() && (lang().ui || {})[k]) || UI_EN[k] || k;
  if (v) Object.keys(v).forEach(n => { s = s.split("{" + n + "}").join(v[n]); });
  return s;
}
// A conditional type as shown on screen: name, formulas, use and note translated at native-UI levels.
function tyOf(t) {
  const ty = DATA.types[t], L = nativeUi() && (lang().types || {})[t];
  const o = Object.assign({ k: t }, ty);   // k = the type's key (17-forms.js looks its formula terms up by it)
  if (L) ["name", "use", "ifForm", "mainForm", "alert"].forEach(k => { if (L[k]) o[k] = L[k]; });
  return o;
}
function applyUi() {
  document.querySelectorAll("[data-ui]").forEach(el => { el.textContent = tx(el.dataset.ui); });
  document.querySelectorAll("[data-ui-aria]").forEach(el => { el.setAttribute("aria-label", tx(el.dataset.uiAria)); });
}

/* 07-back.js — copied from Question Practice (../question practice, itself from Present Perfect Bubbles): the phone's
   back gesture (or the browser's Back) closes the open window instead of leaving the page: Favorites / Seen, the end
   card, the Guide, the tutorial, the Play menu and the header pop-ups (colours, volume); in any other mode (Speed, Listening, Review missed, Favorites) it goes
   back to a normal game. Each window holds a history entry while it is open. A MutationObserver sees it open and close,
   whatever closed it (✕, Escape, a click outside, a button), so the entry is added and taken back in one place. Back
   closes the window opened last. A new window needs one backLayer(el, isOpen, close) call. */
// Our history entries must not bring back an old scroll position (the page scrolls itself to the result card).
try { history.scrollRestoration = "manual"; } catch (e) {}
const BACK = [];     // open windows, oldest first: { el, close, pushed }
let backSkip = 0;    // our own history.back() calls, whose popstate is not a Back press
// A window that opens while one of those history.back() calls is still on its way (the Play menu closes and Review missed
// starts in the same click) waits for it: the browser aims history.back() when it is called, so an entry pushed in
// between would be swept away with it, and the next Back would leave the page. Pushed once the popstate arrives.
const pendingPush = [];
function pushEntry(L) { try { history.pushState({ layer: 1 }, ""); L.pushed = true; } catch (e) { L.pushed = false; } }   // a file:// page may refuse
// el: the window's element; isOpen(): whether it shows; close(): what Back does (the same as its ✕ or Escape).
function backLayer(el, isOpen, close) {
  const L = { el, close, pushed: false, byBack: false };
  let was = isOpen();
  new MutationObserver(() => {
    const now = isOpen(); if (now === was) return; was = now;
    if (now) {
      if (backSkip) pendingPush.push(L); else pushEntry(L);
      BACK.push(L);
    } else {
      const i = BACK.indexOf(L); if (i >= 0) BACK.splice(i, 1);
      const p = pendingPush.indexOf(L); if (p >= 0) pendingPush.splice(p, 1);   // closed before its entry was even added
      // Closed by the game, not by Back: take its history entry away, so the next Back isn't a dead press.
      if (L.pushed && !L.byBack) { backSkip++; history.back(); }
      L.pushed = false;
    }
  }).observe(el, { attributes: true, attributeFilter: ["class", "hidden"] });
}
window.addEventListener("popstate", () => {
  if (backSkip) { backSkip--; if (!backSkip) pendingPush.splice(0).forEach(pushEntry); return; }
  const L = BACK[BACK.length - 1]; if (!L) return;
  L.byBack = true; L.close(); setTimeout(() => { L.byBack = false; }, 0);   // the observer has run by then
});
// Header pop-ups (01-theme.js, 02-sound.js, 04-picker.js): the back gesture closes them too.
backLayer(swwrap, () => swwrap.classList.contains("open"), () => swOpen(false));
backLayer(volwrap, () => volwrap.classList.contains("open"), () => volwrap.classList.remove("open"));
backLayer(pickList, () => !pickList.hidden, () => closePick(false));

/* 08-sky.js — background bubbles drifting up behind everything (from Be Do Modal, via English Bubbles): 7 see-through,
   softly blurred bubbles of random size (40-140 px), place and pace (95-145 s a climb). At load they are already
   part-way up and the layer fades in. Transform / opacity only; none with reduced motion. Look: .sky in 22-glass.css. */
(function () {
  const host = $("sky");
  if (!host || reduceMotion) return;
  const hues = [215, 330, 150, 265, 30, 190];
  for (let k = 0; k < 7; k++) {
    const s = document.createElement("span"), size = 40 + Math.round(Math.random() * 100), t = 95 + Math.round(Math.random() * 50);
    const at = (0.15 + 0.65 * (k + Math.random() * 0.8) / 7) * t;   // a negative delay: 15% to 80% of the way up
    s.style.cssText = "width:" + size + "px;height:" + size + "px;left:" + Math.round(Math.random() * 96) + "%;" +
      "--h:" + hues[k % hues.length] + ";--t:" + t + "s;--d:-" + at.toFixed(1) + "s;--x:" + Math.round(Math.random() * 80 - 40) + "px";
    host.appendChild(s);
  }
  setTimeout(() => host.classList.add("in"), 60);   // a timer, not a frame: a page opened in the background gets none
})();

/* 09-choices.js — which distractors a round shows. Levels with "oneVariant": true (A1) keep only one other form of
   the answer's words (get → gets, not got / getting), and "maxDx" caps how many distractors there are. */
const FAMILY = {
  be: "is am are was were be being been isn't aren't wasn't weren't", do: "do does did done doing don't doesn't didn't",
  have: "has have had having hasn't haven't hadn't", will: "will would won't wouldn't 'll",
  get: "got gotten", go: "went gone", come: "came", make: "made", take: "took taken", give: "gave given",
  swim: "swam swum", sing: "sang sung", buy: "bought", feed: "fed", eat: "ate eaten", see: "saw seen",
  fall: "fell fallen", break: "broke broken", run: "ran", drink: "drank drunk", write: "wrote written",
  ride: "rode ridden", fly: "flew flown", grow: "grew grown", know: "knew known", throw: "threw thrown",
  drive: "drove driven", speak: "spoke spoken", wake: "woke woken", forget: "forgot forgotten", freeze: "froze frozen",
  sleep: "slept", feel: "felt", keep: "kept", leave: "left", meet: "met", lose: "lost", catch: "caught",
  bring: "brought", think: "thought", teach: "taught", find: "found", hear: "heard", say: "said", pay: "paid",
  tell: "told", sell: "sold", build: "built", send: "sent", spend: "spent", sit: "sat", win: "won", stand: "stood",
  understand: "understood", hold: "held", begin: "began begun", wear: "wore worn", choose: "chose chosen", hide: "hid hidden"
};
const IRR = {};
Object.entries(FAMILY).forEach(([b, ws]) => ws.split(" ").forEach(w => { IRR[w] = b; }));
// Possible base forms of a word (regular endings undone, irregular forms looked up).
function bases(w) {
  w = w.toLowerCase(); const out = new Set([w, IRR[w] || w]);
  const add = s => { if (s.length > 1) out.add(s); };
  const undouble = s => /([bcdfgklmnprstvz])\1$/.test(s) ? s.slice(0, -1) : s;
  if (w.endsWith("ies")) add(w.slice(0, -3) + "y");
  if (w.endsWith("es")) add(w.slice(0, -2));
  if (w.endsWith("s")) add(w.slice(0, -1));
  if (w.endsWith("ied")) add(w.slice(0, -3) + "y");
  if (w.endsWith("ed")) { add(w.slice(0, -2)); add(w.slice(0, -1)); add(undouble(w.slice(0, -2))); }
  if (w.endsWith("ing")) { const s = w.slice(0, -3); add(s); add(s + "e"); add(undouble(s)); }
  return out;
}
const sameFamily = (a, b) => { const A = bases(a); return [...bases(b)].some(x => A.has(x)); };
// Agreement pairs (get / gets, is / are, don't / doesn't): the variant A1 keeps when it has a choice.
const AGREE = [["is", "am", "are"], ["was", "were"], ["do", "does"], ["don't", "doesn't"], ["has", "have"]];
function agrees(a, b) {
  [a, b] = [a.toLowerCase(), b.toLowerCase()];
  const s = (x, y) => y === x + "s" || y === x + "es" || (x.endsWith("y") && y === x.slice(0, -1) + "ies");
  return s(a, b) || s(b, a) || AGREE.some(g => g.includes(a) && g.includes(b) && a !== b);
}
// The distractors for round r (missing half r.miss), in data order.
function pickDx(r) {
  const v = lvl(), all = r.s.dx[r.miss];
  let dx = all;
  if (v.oneVariant) {
    // Compare with the key verbs (falls back to every answer word), so "bees" or "bed" never count as forms of "be".
    const key = (r.s.key || {})[r.miss], ans = (key ? key.split(" ") : r.ans).map(t => t.toLowerCase()), isVar = w => ans.some(a => sameFamily(a, w));
    const vars = all.filter(isVar), keep = vars.find(w => ans.some(a => agrees(a, w))) || vars[0];
    dx = (keep ? [keep] : []).concat(all.filter(w => !isVar(w)));   // the variant first, so the cap keeps it
  }
  return v.maxDx ? dx.slice(0, v.maxDx) : dx;
}

/* 10-game.js — the game. One game = ROUNDS sentences at the chosen level.
   Each round shows one clause (the "given" bubble) and an empty "answer" bubble with one slot per word.
   Word bubbles (correct words + distractors from the data) float above and below; the player taps or drags them
   into the slots. When every slot is full the answer is checked automatically.
   Scoring per round: 3 points, minus 1 per wrong try (min 0). Hints come from a pool for the whole game (levels.json
   "hints"), at most MAX_HINTS per sentence; each unused hint is +1 bonus point at the end.
   Each level (levels.json) sets its tries (default MAX_TRIES) and hint kind: "place" a correct word, or "remove"
   HINT_REMOVE wrong words from the arc. Out of tries = the answer is revealed for 0 points. */
const ROUNDS = 5, MAX_TRIES = 3, MAX_PTS = 3, MAX_HINTS = 2, HINT_REMOVE = 2;
// Rules come from the level of the sentence being played (practice games can mix levels).
const lvl = () => DATA.levels[(G.r && G.r.level) || G.level] || {};
const levelOf = s => s.id.split("-")[0].toUpperCase();
const maxTries = () => lvl().tries || MAX_TRIES;
// The hint pool belongs to the game's level, not to the last round played (that may still be the old level).
const hintPool = () => (DATA.levels[G.level] || {}).hints || 5;
// [missing clause, clause that comes first] — the four layouts are spread evenly over a game.
const LAYOUTS = [["main", "if"], ["if", "if"], ["main", "main"], ["if", "main"]];
// A main clause that opens with a pronoun for the if clause's subject ("it cries" for "a baby") must come second,
// or the pronoun would come before the noun it stands for ("It cries if a baby is hungry").
const ifFirst = s => { const p = s.main.split(" ")[0].toLowerCase(); return ["it", "they", "he", "she"].includes(p) && s.if.split(" ")[1].toLowerCase() !== p; };
// A half shorter than the level's "minBlanks" is never the missing one; a sentence with no half that long is skipped.
const missable = (s, half) => toks(s[half]).length >= ((DATA.levels[levelOf(s)] || {}).minBlanks || 0);
const usable = s => missable(s, "if") || missable(s, "main");
const HUE = { if: 330, main: 205 };
const G = { level: "A2", mode: "normal", queue: [], pool: [], total: ROUNDS, idx: 0, score: 0, results: [], streak: 0, r: null, phase: "idle" };
const stage = $("stage"), rowEl = $("row"), arena = $("arena"), orbit = $("orbit"), revealEl = $("reveal"), hintEl = $("hint");
const scoreEl = $("score"), scEl = $("sc"), bestEl = $("bestlbl"), hintBtn = $("hintbtn"), clearBtn = $("clearbtn"), triesEl = $("tries");

/* ---------- Game flow ---------- */
// mode: "normal" | "speed" | "review" | "fav" (see 22-modes.js); ids = the sentences for a review / favourites game.
function newGame(level, mode = "normal", ids) {
  document.body.classList.toggle("practice-mode", mode !== "normal");   // any other mode: Back returns to a normal game (22-modes.js)
  if (level !== G.level) focusType = "all";   // a new level always starts with every type
  G.level = level; G.mode = mode; G.bag = null; G.r = null; applyUi(); paintType(level);
  G.pool = (ids ? shuffle(ids.map(id => SENT[id]).filter(Boolean)).filter(usable) : featurePool(orderPool(DATA.sentences[level].filter(inFocus)).filter(usable), level));   // the level pool keeps to the type chip
  G.total = mode === "speed" ? Infinity : Math.min(ROUNDS, G.pool.length);   // "listen" plays ROUNDS like a normal game
  G.queue = []; G.idx = 0; G.score = 0; G.results = []; G.streak = 0; G.hintsLeft = hintPool(); G.bonus = null;
  stopSpeed(); hideBonus(); stage.hidden = $("tools").hidden = false;
  showScore(); showCombo();
  if (mode === "speed") return speedIntro();   // goal card and 3-2-1 first; it starts the round and the clock
  startRound();
}
// Next sentence for the queue; the four layouts are dealt from a shuffled bag so they stay even.
function enqueue() {
  if (!G.bag || !G.bag.length) G.bag = shuffle([0, 1, 2, 3]);
  const s = G.pool[G.queue.length % G.pool.length], lay = LAYOUTS[G.bag.pop()];
  const miss = missable(s, lay[0]) ? lay[0] : lay[0] === "if" ? "main" : "if";
  G.queue.push({ s, lay: [miss, ifFirst(s) ? "if" : lay[1]] });
}
function startRound() {
  if (!G.queue[G.idx]) enqueue();
  const q = G.queue[G.idx], s = q.s, miss = q.lay[0], first = q.lay[1];
  const ans = toks(s[miss]);
  const alts = [ans].concat(((s.alt && s.alt[miss]) || []).map(toks));
  G.r = { s, miss, first, ans, alts, target: ans, slots: Array(ans.length).fill(null), slotEls: [], ansBox: null, words: [], tries: 0, hints: 0, level: levelOf(s) };
  G.phase = "play";
  revealEl.hidden = true; revealEl.innerHTML = "";

    const tries = [pairUp(even), pairUp(tight.filter(l => l.length))].filter(ok);
    const solo = l => l.length > 1 && l.some(x => x.length < 2);
    const best = tries.find(l => !solo(l)) || (n < 2 * (L + 1) || L === n ? tries[0] : null);
    if (best || L === n) return (best || even).map(l => l.sort((a, b) => a - b));
  }
}
// Centred rows of words stacked downwards from below rect A.
function orbitRows(A, sizes) {
  const g = ORB_GAP, out = [], ws = sizes.map(s => s.w);
  const maxW = Math.min(A.w, ORB_MAXW);
  let edge = A.y + A.h + g + 4;
  orbitBalance(ws, maxW).forEach(ids => {
    const h = Math.max(...ids.map(i => sizes[i].h));
    let x = A.x + (A.w - lineW(ids, ws)) / 2;
    ids.forEach(i => { out[i] = { x, y: edge + (h - sizes[i].h) / 2, w: sizes[i].w, h: sizes[i].h }; x += sizes[i].w + g; });
    edge += h + g;
  });

}

// Lay the current round's words under the clauses. Called on render, resize and font load.
function layoutOrbit() {
  const r = G.r; if (!r || !r.ansBox || !r.words.length || arena.classList.contains("folded")) return;
  const box = r.ansBox;
  if (orbRO && orbBox !== box) { orbRO.disconnect(); orbRO.observe(box); orbBox = box; }
  const words = r.words.filter(W => W.home.isConnected);   // words that started in a slot have no home in the rows
  const sizes = words.map(W => ({ w: W.home.offsetWidth, h: W.home.offsetHeight }));
  // offset* ignores the rise / shake transforms, unlike getBoundingClientRect.
  const A = { x: rowEl.offsetLeft, y: rowEl.offsetTop, w: rowEl.offsetWidth, h: rowEl.offsetHeight };
  const boxes = orbitRows(A, sizes);
  const y1 = boxes.length ? Math.max(...boxes.map(b => b.y + b.h)) : 0;
  arena.style.padding = "0 0 " + Math.round(Math.max(0, y1 - A.y - A.h + 4)) + "px";
  words.forEach((W, i) => { W.home.style.left = boxes[i].x + "px"; W.home.style.top = boxes[i].y + "px"; });

}
// Re-lay only when the empty bubble or the arena really changed size (words dropping into slots can resize it).
function orbitCheck() { const b = G.r && G.r.ansBox; if (b && orbSig !== [b.offsetWidth, b.offsetHeight, arena.clientWidth].join()) layoutOrbit(); }
window.addEventListener("resize", orbitCheck);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { orbSig = ""; layoutOrbit(); });

/* 14-explain.js — teaching helpers during a round: the one-line "why" after a wrong try, the quiet note under the

const WILL = ["will", "won't"], WOULD = ["would", "wouldn't"];

const formHTML = (ty, half) => '<span class="c-' + half + '">' + formTerm(ty, half) + "</span>";
// The whole formula in the sentence's order: "if + …, …" or, main clause first, "… if + …" (no comma).
const patHTML = (ty, first) => first === "main" ? formHTML(ty, "main") + " " + formHTML(ty, "if") : formHTML(ty, "if") + ", " + formHTML(ty, "main");

// Why the built clause is wrong, in one short line. target = the accepted answer it was checked against.
function whyWrong(r, target) {
  const ty = tyOf(r.s.type), got = r.slots.map(W => W.t.toLowerCase());
  const need = r.ans.map(t => t.toLowerCase()).sort().join(" ");
  if (got.slice().sort().join(" ") === need) return tx("rightWords");
  const bad = got.find(w => !target.includes(w)) || "";
  if (r.miss === "if" && WILL.concat(WOULD).includes(bad)) return tx("noWillIf");
  if (r.miss === "main" && r.s.type === "0" && WILL.concat(WOULD).includes(bad)) return tx("zeroPresent", { w: esc(bad) });
  if (r.miss === "main" && WILL.includes(bad) && r.s.type !== "1") return tx("imaginary");
  if (r.miss === "main" && WOULD.includes(bad) && r.s.type === "1") return tx("real");
  return tx("needs", { form: formHTML(ty, r.miss) });
}

// Idle reminder: the hint button wiggles after 12 s without a tap or key (again every 12 s), while a hint is usable.
let lastAct = Date.now();
["pointerdown", "keydown"].forEach(t => addEventListener(t, () => { lastAct = Date.now(); }, true));
setInterval(() => {
  if (G.phase !== "play" || G.mode === "speed" || hintBtn.disabled || Date.now() - lastAct < 12000) return;
  lastAct = Date.now(); if (!reduceMotion) flash(hintBtn, "nudge");
}, 1000);
// The note under the hint line: the mixed-conditional alert, the level's always-on line ("show" in levels.json:
// "translation" or "pattern"), and what the Pattern / Translation button adds while it is pressed.
function noteHTML(kind, bare) {
  const ty = tyOf(G.r.s.type), L = lang(), tr = L.sentences[G.r.s.id];
  if (kind === "translation") return tr ? (bare ? "" : '<span class="pick-badge" style="--g:' + esc(L.grad || "") + '">' + esc(L.badge) + "</span>") +
    '<span lang="' + esc(curLang) + '">' + sentenceHTML(tr, G.r.first) + "</span>" : "";
  return (bare ? "" : '<span class="chip" style="--h:' + ty.hue + '">' + esc(ty.name) + "</span> ") + patHTML(ty, G.r.first);
}
function drawNote() {
  const v = lvl(), ty = tyOf(G.r.s.type), mix = $("mixnote"), on = $("patbtn").getAttribute("aria-pressed") === "true";
  const rows = [];
  if (ty.alert && v.show !== "pattern") rows.push(['<span class="chip" style="--h:' + ty.hue + '">' + esc(ty.name) + "</span> " + esc(ty.alert), ""]);
  // Always-on line ("show") in an amber card; a Translation button (A2) unfolds the translation inside it.
  const main = v.show && noteHTML(v.show, true);
  const more = v.show && v.show !== "translation" && v.pattern === "translation" && noteHTML("translation", true);
  if (main) rows.push(['<span class="card-line">' + main + "</span>" + (more ? '<span class="card-more"><span class="card-line">' + more + "</span></span>" : ""),
    " big tr-card" + (on ? " open" : "")]);

  const solo = !v.show && v.pattern && v.pattern !== "translation" && noteHTML("pattern", true);
  if (solo) rows.push(['<span class="card-fold"><span class="tr-card"><span class="card-line">' + solo + "</span></span></span>", " big fold" + (on ? " open" : "")]);
  else if (on && v.pattern && !more) rows.push([noteHTML(v.pattern === "translation" ? "translation" : "pattern"), ""]);
  const out = rows.filter(r => r[0]);
  mix.hidden = !out.length;
  mix.innerHTML = out.map(r => '<span class="note-row' + r[1] + '">' + r[0] + "</span>").join("");
}
// At the start of a round: the Pattern button for levels that offer it ("pattern": "translation" = Translation button).
function roundNote() {
  const pb = $("patbtn"), peek = lvl().pattern === "translation";
  pb.hidden = !lvl().pattern; pb.setAttribute("aria-pressed", "false");
  pb.dataset.ui = peek ? "translation" : "pattern"; pb.textContent = tx(pb.dataset.ui);
  pb.title = peek ? "Show the translation of this sentence" : "Show the pattern for this sentence";
  drawNote();
}
// Pattern / Translation button: add or remove its line under the hint line.
function togglePattern() {
  if (G.phase !== "play" && G.phase !== "checking") return;
  const pb = $("patbtn"), on = pb.getAttribute("aria-pressed") !== "true";
  pb.setAttribute("aria-pressed", String(on));
  const card = $("mixnote").querySelector(".fold, .tr-card:has(.card-more)");
  if (card) card.classList.toggle("open", on); else drawNote();  // unfold in place
