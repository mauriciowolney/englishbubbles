/* 15-progress.js — what the player has done with every sentence, across games, and the daily streak.
   cond-prog = {id: [attempts, lastPoints, time]} (lastPoints -1 = missed). "Mastered" = the latest try was perfect.
   cond-days = "YYYY-MM-DD|days in a row". */
function getProg() { try { return JSON.parse(load("cond-prog")) || {}; } catch (e) { return {}; } }
function recordProgress(id, pts) {
  const p = getProg(), o = p[id] || [0, 0, 0];
  p[id] = [o[0] + 1, pts, Date.now()]; store("cond-prog", JSON.stringify(p));
}
// A level's sentences in play order: never seen (random), then missed, then not yet perfect, then mastered (oldest first).
// The last RECENT_N sentences played (about 3 games) wait at the back, so a sentence missed in one game doesn't come
// straight back in the next one; they still come before nothing else is left.
const RECENT_N = 15;
function orderPool(list) {
  const p = getProg(), recent = new Set(getList("cond-seen").slice(0, RECENT_N).map(x => x.id));
  const grp = s => { const o = p[s.id]; return (recent.has(s.id) ? 4 : 0) + (!o ? 0 : o[1] < 0 ? 1 : o[1] < MAX_PTS ? 2 : 3); };
  const t = s => (p[s.id] || [0, 0, 0])[2];
  return shuffle(list.slice()).sort((a, b) => grp(a) - grp(b) || t(a) - t(b));
}
// A level can feature one type group (levels.json "feature": [group, share], e.g. ["2", 0.5] = about half the sentences
// of a game are 2nd conditionals). The ordered pool is re-dealt in blocks of ROUNDS: each block takes its share from
// the featured sentences and the rest from the others, both still in play order, then shuffles the block.
function featurePool(list, level) {
  const f = (DATA.levels[level] || {}).feature;
  if (!f || focusType !== "all") return list;
  const F = list.filter(s => typeGroup(s.type) === f[0]), O = list.filter(s => typeGroup(s.type) !== f[0]), out = [];
  while (F.length && O.length) {
    const x = ROUNDS * f[1], k = Math.floor(x) + (Math.random() < x - Math.floor(x) ? 1 : 0);
    out.push(...shuffle(F.splice(0, k).concat(O.splice(0, ROUNDS - k))));
  }
  return out.concat(F, O);
}
// Mastered / total for a level, overall and per conditional type (mixed types share one name); p = sentences played.
function mastery(level) {
  const p = getProg(), by = {}, ok = s => p[s.id] && p[s.id][1] === MAX_PTS;
  DATA.levels[level].types.forEach(t => { const ty = tyOf(t); by[ty.name] = by[ty.name] || { m: 0, n: 0, p: 0, hue: ty.hue }; });   // keep type order
  let m = 0;
  DATA.sentences[level].forEach(s => {
    const ty = tyOf(s.type), b = by[ty.name] = by[ty.name] || { m: 0, n: 0, p: 0, hue: ty.hue };
    b.n++; if (p[s.id]) b.p++; if (ok(s)) { b.m++; m++; }
  });
  return { m, n: DATA.sentences[level].length, by };
}
// One level's meter: label, bar, "23 / 60".
function meterHTML(level) {
  const x = mastery(level);
  return '<div class="meter" style="' + lvVars(level) + '"><b>' + esc(level) + '</b><div class="pbar"><i style="width:' + (x.m / x.n * 100).toFixed(1) + '%"></i></div><span>' + x.m + " / " + x.n + "</span></div>";
}

// Seen: this level's types by accuracy (played sentences perfect on the latest try), weakest first; red ring under 60%.
// As in There Be or Have / Perfect or Past?
function accHTML(level) {
  const by = mastery(level).by, ks = Object.keys(by).filter(k => by[k].p).sort((a, b) => by[a].m / by[a].p - by[b].m / by[b].p);
  if (!ks.length) return "";
  return '<p class="lp-h">' + tx("accHead", { lvl: esc(level) }) + '</p><div class="fams">' + ks.map(k => '<span class="chip' + (by[k].m / by[k].p < .6 ? " weak" : "") +
    '" style="--h:' + by[k].hue + '">' + esc(k) + " " + by[k].m + "/" + by[k].p + "</span>").join("") + "</div>";
}

/* ---------- Daily streak ---------- */
function dayStr(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dayState() {
  const [d, n] = (load("cond-days") || "|0").split("|"), y = new Date(); y.setDate(y.getDate() - 1);
  return { d, n: +n || 0, today: dayStr(new Date()), yest: dayStr(y) };
}
// Days in a row, counting today or yesterday (the streak is still alive until a day is skipped).
function getDays() { const s = dayState(); return s.d === s.today || s.d === s.yest ? s.n : 0; }
// Called when a sentence is finished: the first one of the day extends (or restarts) the streak.
function tickDay() {
  const s = dayState(); if (s.d === s.today) return;
  store("cond-days", s.today + "|" + (s.d === s.yest ? s.n + 1 : 1)); showDays();
}
function showDays() { const n = getDays(), el = $("days"); el.hidden = n < 2; el.textContent = "🔥 " + n; el.title = n + " days in a row"; }

/* 16-gloss.js — tap or hover a word that is already in the sentence to see what it means in the translation language:
   every word of the given clause, the pre-filled bubbles, and (once the sentence is complete) every word of it.
   Bubbles still to be placed never show a meaning, so nothing is given away.
   Meanings come from i18n/<lang>.json "words", or from the sentence's own "w" when the word means something else there. */
const glossEl = document.createElement("div");
glossEl.className = "glosstip"; glossEl.setAttribute("role", "tooltip"); glossEl.hidden = true;
document.body.appendChild(glossEl);
let glossFor = null, glossTimer = 0, lastPointer = "mouse";

// The given clause as HTML: one tappable span per word, key verb forms in bold.
function glossText(text, key) {
  const ws = toks(text), m = keyMask(ws, key);
  return ws.map((w, i) => (m[i] ? '<b class="gw">' : '<span class="gw">') + esc(w) + (m[i] ? "</b>" : "</span>")).join(" ");
}
// The meaning of word t in this sentence, or "" when there is none.
function glossOf(t) {
  const L = lang(), k = t.toLowerCase(), tr = G.r && L.sentences[G.r.s.id];
  return (tr && tr.w && tr.w[k]) || (L.words || {})[k] || "";
}
// The explainable word under an event: { el, t } or null.
function glossTarget(e) {
  const x = e.target.closest ? e.target : null; if (!x) return null;
  const g = x.closest(".gw"); if (g) return { el: g, t: g.textContent };
  const b = x.closest(".w"), W = b && b.__w, done = G.phase === "solved" || G.phase === "revealed";
  return W && (b.classList.contains("pre") || (done && W.slot >= 0)) ? { el: b, t: W.t } : null;
}
// Show the meaning just above the word (below it near the top of the screen); linger = hide by itself after a moment.
function showGloss(tg, linger) {
  const g = glossOf(tg.t), L = lang();
  if (!g) return hideGloss();
  showTip(tg.el, '<span class="pick-badge" style="--g:' + esc(L.grad || "") + '">' + esc(L.badge) + '</span><span lang="' + esc(curLang) + '">' + esc(g) + "</span>", linger ? 2600 : 0);
}
// The tooltip itself, on element el. ms = hide by itself after that long (0 = stay); note = the wider text style
// of a formula explanation (17-forms.js).
function showTip(el, html, ms, note) {
  clearTimeout(glossTimer);
  if (glossFor && glossFor !== el) glossFor.classList.remove("on");
  glossEl.innerHTML = html; glossEl.classList.toggle("note", !!note);
  glossEl.hidden = false; glossFor = el; el.classList.add("on");
  const b = el.getBoundingClientRect(), t = glossEl.getBoundingClientRect(), below = b.top - t.height - 10 < 8;
  glossEl.style.left = Math.min(Math.max(b.left + b.width / 2 - t.width / 2, 8), innerWidth - t.width - 8) + "px";
  glossEl.style.top = (below ? b.bottom + 10 : b.top - t.height - 10) + "px";
  if (ms) glossTimer = setTimeout(hideGloss, ms);
}
function hideGloss() { clearTimeout(glossTimer); glossEl.hidden = true; if (glossFor) glossFor.classList.remove("on"); glossFor = null; }

// Mouse: hovering shows the meaning. Tap or click: the meaning (for a moment on touch).
stage.addEventListener("pointerover", e => { const tg = glossTarget(e); if (tg && e.pointerType === "mouse" && !(drag && drag.on)) showGloss(tg); });
stage.addEventListener("pointerout", e => { const tg = glossTarget(e); if (tg && tg.el === glossFor && e.pointerType === "mouse" && !tg.el.contains(e.relatedTarget)) hideGloss(); });
stage.addEventListener("click", e => { const tg = glossTarget(e); if (!tg) return; showGloss(tg, lastPointer !== "mouse"); });
document.addEventListener("pointerdown", e => { lastPointer = e.pointerType; if (!glossTarget(e) && !(e.target.closest && e.target.closest(".ft"))) hideGloss(); }, true);
addEventListener("scroll", hideGloss, true); addEventListener("resize", hideGloss);

/* 17-forms.js — the verb form in a formula ("past simple*", "would + base verb") can be hovered or tapped for a short
   explanation with example forms and the Portuguese equivalent. Used wherever a formula shows: the card after each
   sentence, the Pattern line, the "this clause needs…" line and the Guide. The past simple carries an asterisk,
   because in a conditional it is not about the past. The explanations are always in Portuguese (the students are
   Brazilian), at every level and whatever the Guide's language. Shares the tooltip of 16-gloss.js. */
const FORM_TIPS = {
  "0.if": "<b>Presente simples</b>: <i>heat, rains, works</i> (he / she / it leva -s). Igual ao português: <i>se você esquenta…</i>",
  "0.main": "<b>Presente simples</b> de novo: <i>melts, gets, don't sleep</i>. Sem <b>will</b>: é sempre verdade.",
  "1.if": "<b>Presente simples</b>: <i>rains, study, doesn't hurry</i>. O português diz <i>se chover, se você estudar</i>; o inglês usa o presente normal aqui, nunca <b>will</b>.",
  "1.main": "<b>will</b> + o verbo sem terminação: <i>will stay, will pass</i> = <i>vai ficar, vai passar</i>. Negativa: <b>won't</b>.",
  "2.if": "<b>*</b> A forma do <b>passado simples</b>: <i>had, went, were</i>. Aqui ela <b>não</b> fala do passado: mostra que a situação é imaginária, como <i>tivesse, fosse, fizesse</i>.",
  "2.main": "<b>would</b> + o verbo sem terminação: <i>would fly, would buy</i> = <i>voaria, compraria</i> (-ria). Negativa: <b>wouldn't</b>.",
  "3.if": "<b>had</b> + particípio: <i>had studied, had gone</i> = <i>tivesse estudado, tivesse ido</i>.",
  "3.main": "<b>would have</b> + particípio: <i>would have passed, would have gone</i> = <i>teria passado, teria ido</i>. Negativa: <b>wouldn't have</b>."
};
// The mixed types borrow each half from the 2nd or 3rd conditional.
const FORM_AS = { "m1.if": "3.if", "m1.main": "2.main", "m2.if": "2.if", "m2.main": "3.main" };
// One half of a type's formula as HTML: "if + " stays plain, the verb form becomes a tappable term.
// ty = a type from tyOf / guideTy (k = its key in types.json).
function formTerm(ty, half) {
  const f = half === "if" ? ty.ifForm : ty.mainForm, m = /^(if \+ )?(.*)$/.exec(f), id = ty.k + "." + half;

/* 18-squash.js — squash and stretch (from Be Do Modal): a carried word stretches along the way it moves, more the
   faster (up to STRETCH longer, as much thinner across), and rounds out as the pointer slows or stops. Let go, it
   wobbles (the `scale` property, so it adds to the FLIP move home and the bob). One frame loop while it moves, writing
   only the carried word's transform (its position is left / top, 11-moves.js). None with reduced motion.
   While a word is carried every word stops bobbing and turning (body.carrying, 21-soap.css). */
const STRETCH = .2, sq = { el: null, x: 0, y: 0, vx: 0, vy: 0, lt: 0, raf: 0 };
function sqStart(el, x, y) { sq.el = el; sq.vx = sq.vy = 0; sq.x = x; sq.y = y; sq.lt = 0; document.body.classList.add("carrying"); }
function sqMove(x, y) {
  const now = performance.now();
  if (sq.lt) { const dt = Math.max(8, now - sq.lt); sq.vx += ((x - sq.x) / dt - sq.vx) * .5; sq.vy += ((y - sq.y) / dt - sq.vy) * .5; }   // px per ms, smoothed
  sq.x = x; sq.y = y; sq.lt = now;

}
function sqTick() {
  sq.raf = 0; if (!sq.el) return;
  const v = Math.hypot(sq.vx, sq.vy), s = reduceMotion ? 0 : Math.min(STRETCH, v * .08);
  let t = "scale(1.1) rotate(-3deg)";   // the carried look at rest (20-game.css .w.drag)
  if (s > .004) { const a = (Math.atan2(sq.vy, sq.vx) * 180 / Math.PI).toFixed(1); t = "rotate(" + a + "deg) scale(" + (1.1 * (1 + s)).toFixed(3) + "," + (1.1 / (1 + s)).toFixed(3) + ") rotate(" + (-a) + "deg) rotate(-3deg)"; }
  sq.el.style.transform = t;
  if (performance.now() - sq.lt > 30) { sq.vx *= .8; sq.vy *= .8; }   // the pointer has stopped: round out
  if (s > .004) sq.raf = requestAnimationFrame(sqTick);
}
function sqEnd(el) {
  if (sq.raf) cancelAnimationFrame(sq.raf);
  const v = Math.hypot(sq.vx, sq.vy); sq.raf = 0; sq.el = null;
  document.body.classList.remove("carrying");
  el.style.transform = "";
  if (reduceMotion || !el.animate) return;
  const k = Math.min(1, .35 + v * .6);   // a fuller wobble after a fast move
  el.animate([{ scale: (1 + .07 * k) + " " + (1 - .07 * k) }, { scale: (1 - .045 * k) + " " + (1 + .045 * k) }, { scale: (1 + .02 * k) + " " + (1 - .02 * k) }, { scale: "1 1" }], { duration: 480, easing: "ease-out" });
}

// Slots that start filled: the player fills only the level's "speedBlanks" (default 4) in a speed round, or its

function prefill(r) {

  if (!n || r.ans.length <= n) return [];
  const key = keyMask(r.ans, (r.s.key || {})[r.miss]), idx = r.ans.map((_, i) => i);
  const gaps = shuffle(idx.filter(i => key[i])).concat(shuffle(idx.filter(i => !key[i]))).slice(0, n);

/* 23-listen.js — listening mode: the voice reads the missing half and the player TYPES it (no word bubbles).
   The empty clause holds a text box; Enter or Check submits. Case, punctuation and contractions don't matter
   ("won't" = "will not"). A wrong try colours each typed word; the text stays to be fixed. A hint types the next
   correct word. When solved (or out of tries) the words drop into the clause's slots as in the normal game. */
const CONTR = { "won't": "will not", "wouldn't": "would not", "don't": "do not", "doesn't": "does not", "didn't": "did not",
  "hadn't": "had not", "haven't": "have not", "hasn't": "has not", "weren't": "were not", "wasn't": "was not", "isn't": "is not",
  "aren't": "are not", "can't": "cannot", "couldn't": "could not", "i'm": "i am", "i'll": "i will", "you'll": "you will",
  "we'll": "we will", "they'll": "they will", "she'll": "she will", "he'll": "he will", "it'll": "it will", "you're": "you are",
  "we're": "we are", "they're": "they are" };
// Phone keyboards often drop the apostrophe: accept "wont", "didnt"... too, except where that is another word.
Object.keys(CONTR).forEach(k => { const bare = k.replace("'", ""); if (!["ill", "well", "were", "hell", "shell"].includes(bare)) CONTR[bare] = CONTR[k]; });
// Words for comparing: lower case, no punctuation, contractions spelled out.
function normWords(s) {
  return s.toLowerCase().replace(/[’‘`´]/g, "'").replace(/[^a-z0-9'\- ]/g, " ").split(/\s+/).filter(Boolean)
    .flatMap(w => (CONTR[w] || w).split(" "));
}

// Per round: Listen / Slower under the hint line, the text box in the empty clause, then read the missing half.
function modeRound() {
  const on = G.mode === "listen", r = G.r;

  r.ansBox.insertAdjacentHTML("beforeend", '<form class="typebox" autocomplete="off"><input class="typein" type="text" aria-label="' + esc(tx("typeHere")) + '" placeholder="' + esc(tx("typeHere")) + '" autocapitalize="off" autocorrect="off" spellcheck="false">' +
    '<button type="submit" class="pbtn">Check</button><p class="typefb" aria-live="polite"></p></form>');
  r.ansBox.querySelector(".typebox").addEventListener("submit", e => { e.preventDefault(); checkTyped(); });
  hintEl.innerHTML = tx("listenType", { clause: tx(r.miss === "if" ? "ifClause" : "mainClause") });
  setTimeout(() => { if (G.r === r && G.phase === "play") { listenNow(); typeIn().focus({ preventScroll: true }); } }, reduceMotion ? 200 : 700);
}
function typeIn() { return G.r.ansBox.querySelector(".typein"); }
function listenNow(slow) {
  if (!voiceGain()) { hintEl.innerHTML = tx("volumeUp"); return; }
  speak(G.r.s[G.r.miss], $(slow ? "slowbtn" : "lsnbtn"), { rate: slow ? .6 : .9 });
}

$("slowbtn").addEventListener("click", () => listenNow(true));

// Which typed words line up with the answer (longest common subsequence), so one missing word doesn't turn the
// rest red. Returns a true/false per typed word.
function aligned(got, want) {
  const L = got.map(() => Array(want.length + 1).fill(0)).concat([Array(want.length + 1).fill(0)]);
  for (let i = got.length - 1; i >= 0; i--) for (let j = want.length - 1; j >= 0; j--)
    L[i][j] = got[i] === want[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const ok = got.map(() => false);
  for (let i = 0, j = 0; i < got.length && j < want.length;) {
    if (got[i] === want[j]) { ok[i] = true; i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++;
  }
  return ok;
}
// The accepted answer (main or alt) closest to what was typed, as { words, norm, ok (per typed word), hits }.
function typedTarget(got) {
  return G.r.alts.map(words => { const norm = normWords(words.join(" ")), ok = aligned(got, norm); return { words, norm, ok, hits: ok.filter(Boolean).length }; })
    .sort((a, b) => b.hits - a.hits)[0];
}
function checkTyped() {
  const r = G.r; if (G.phase !== "play" || G.mode !== "listen") return;
  const got = normWords(typeIn().value); if (!got.length) return;
  const t = typedTarget(got);
  if (got.join(" ") === t.norm.join(" ")) { fillTyped(t.words, "ok"); return solve(); }
  r.tries++; G.streak = 0; showCombo(); sndBad(); flash(r.ansBox, "shake"); renderTools();
  r.ansBox.querySelector(".typefb").innerHTML = got.map((w, i) => '<span class="' + (t.ok[i] ? "ok" : "bad") + '">' + esc(w) + "</span>").join(" ") +
    (t.hits < t.norm.length ? ' <span class="miss">+ ' + (t.norm.length - t.hits) + " missing</span>" : "");
  if (r.tries >= maxTries()) { hintEl.innerHTML = tx("outOfTries"); setTimeout(() => { if (G.r === r) { G.phase = "revealed"; fillTyped(t.words, "shown"); finishRound(0, false); } }, 900); return; }
  const left = maxTries() - r.tries;
  hintEl.innerHTML = tx("listenWrong", { k: t.hits, m: t.norm.length }) + " " + tx(left === 1 ? "tryLeft" : "triesLeft", { n: left });
  typeIn().focus({ preventScroll: true });
}
// Swap the text box for the answer's words in the clause's slots (so the rest of the round works as usual).
function fillTyped(words, cls) {
  const r = G.r;
  r.ansBox.querySelector(".typebox").remove(); r.ansBox.classList.remove("typing");
  r.target = words.map(w => w.toLowerCase());
  words.forEach((w, i) => { const W = mkWord(w, 0); setSlot(i, W); W.locked = true; W.el.classList.add(cls); W.el.tabIndex = -1; r.words.push(W); });
}
// Hint (listening): type the right words up to and including the first one that is missing or wrong.
function hintType(r) {
  const inp = typeIn(), got = normWords(inp.value), t = typedTarget(got);
  let k = 0; while (k < got.length && got[k] === t.norm[k]) k++;
  if (k >= t.norm.length) return false;
  inp.value = t.norm.slice(0, k + 1).join(" ") + " "; inp.focus({ preventScroll: true });
  return true;
}
function clearTyped() { const inp = typeIn(); if (inp && inp.value) { inp.value = ""; inp.focus(); sndBack(); } }

    { lv: "A1", bad: "If she study, she will pass.", good: "If she studies, she will pass.",

    { lv: "A1", bad: "If he don't hurry, he will be late.", good: "If he doesn't hurry, he will be late.",

    { lv: "A2", bad: "If I would have money, I would travel.", good: "If I had money, I would travel.",
      why: ["<i>Se eu tivesse</i> is <b>if I had</b>, not <i>would have</i>. <b>would</b> stays in the main clause.", "<i>Se eu tivesse</i> é <b>if I had</b>, não <i>would have</i>. O <b>would</b> fica na oração principal."] },
    { lv: "A2", bad: "If I had a car, I will drive to work.", good: "If I had a car, I would drive to work.",

      why: ["The past result is <b>would have</b> + participle: <i>teria ajudado</i>. Don't drop <b>have</b>.", "O resultado no passado é <b>would have</b> + particípio: <i>teria ajudado</i>. Não esqueça o <b>have</b>."] },
    { lv: "B1", bad: "If we would have left earlier, we would have caught the train.", good: "If we had left earlier, we would have caught the train.",
      why: ["<i>Se tivéssemos saído</i> = <b>if we had left</b>. Still no <b>would</b> in the if clause.", "<i>Se tivéssemos saído</i> = <b>if we had left</b>. Continua sem <b>would</b> na oração com if."] },
    { lv: "B2", bad: "If I had studied medicine, I would have been a doctor now.", good: "If I had studied medicine, I would be a doctor now.",
      why: ["<i>now</i> is the present, so the result is <b>would + verb</b> (mixed conditional).", "<i>now</i> é o presente, então o resultado é <b>would + verbo</b> (condicional mista)."] },
    { lv: "B2", bad: "If she weren't so shy, she would talk to him at the party yesterday.", good: "If she weren't so shy, she would have talked to him at the party yesterday.",
      why: ["<i>yesterday</i> is the past, so the result is <b>would have</b> + participle.", "<i>yesterday</i> é o passado, então o resultado é <b>would have</b> + particípio."] }
  ],
  curious: [
    { t: ["Unless = if … not", "Unless = if … not"],
      x: ["<b>Unless you hurry, you'll miss the bus</b> means <b>If you don't hurry, you'll miss the bus</b>. Like <i>a menos que</i>.", "<b>Unless you hurry, you'll miss the bus</b> quer dizer <b>If you don't hurry, you'll miss the bus</b>. Como <i>a menos que</i>."] },
    { t: ["When or if?", "When ou if?"],
      x: ["In the zero conditional they mean the same: <b>When / If you heat ice, it melts.</b> In the future, <b>when</b> means you are sure it will happen: <b>When I get home, I'll call you</b> (I will get home). <b>If I get home early, I'll call you</b> (maybe).", "Na condicional zero dá no mesmo: <b>When / If you heat ice, it melts.</b> No futuro, <b>when</b> mostra certeza: <b>When I get home, I'll call you</b> (eu vou chegar). <b>If I get home early, I'll call you</b> (talvez)."] },

    { t: ["Orders and requests", "Ordens e pedidos"],
      x: ["The result can be an imperative: <b>If you see Ana, tell her to call me.</b> <b>If it rains, take the bus.</b>", "O resultado pode ser um imperativo: <b>If you see Ana, tell her to call me.</b> <b>If it rains, take the bus.</b>"] },
    { t: ["I'd: had or would?", "I'd: had ou would?"],
      x: ["<b>I'd</b> can be <i>I had</i> or <i>I would</i>. Look at the next word: <b>If I'd known</b> (had + participle), <b>I'd have come</b> (would + have).", "<b>I'd</b> pode ser <i>I had</i> ou <i>I would</i>. Olhe a palavra seguinte: <b>If I'd known</b> (had + particípio), <b>I'd have come</b> (would + have)."] },

      x: ["Formal English can drop <b>if</b> and swap the order: <b>Had I known, I would have come</b> = If I had known.", "O inglês formal pode tirar o <b>if</b> e inverter a ordem: <b>Had I known, I would have come</b> = If I had known."] }
  ]

// Common mistakes up to the chosen level, numbered, each with its level chip.
function guideMistakes(pt) {
  const L = p => p[pt ? 1 : 0], lv = Object.keys(DATA.levels), cur = Math.max(0, lv.indexOf(G.level));
  const ms = GUIDE_MORE.mistakes.filter(m => lv.indexOf(m.lv) <= cur);
  return '<section class="gd-mis" id="gd-mistakes"><h3 class="gd-h3">' + esc(L(GUIDE_MORE.misTitle)) + '</h3><p class="gd-short">' + esc(L(GUIDE_MORE.misLead)) + '</p><ol class="gd-mlist">' +
    ms.map(m => '<li><span class="chip lvchip" style="' + lvVars(m.lv) + '">' + esc(m.lv) + '</span><p class="gd-wrong" lang="en"><span aria-label="wrong">✗</span> ' + esc(m.bad) + "</p>" +
      '<p class="gd-right" lang="en"><span aria-label="right">✓</span> ' + esc(m.good) + '</p><p class="gd-why">' + L(m.why) + "</p></li>").join("") + "</ol></section>";
}
// For the curious: one folded card.
function guideCurious(pt) {
  const L = p => p[pt ? 1 : 0];
  return '<details class="gd-u gd-cur" id="gd-curious" style="--h:205"><summary><div><h4>' + esc(L(GUIDE_MORE.curTitle)) + '</h4><p class="gd-sum">' + esc(L(GUIDE_MORE.curLead)) + "</p></div></summary>" +
    GUIDE_MORE.curious.map(c => '<div class="gd-word"><p class="gd-wh"><b>' + esc(L(c.t)) + '</b></p><p class="gd-why">' + L(c.x) + "</p></div>").join("") + "</details>";
}

/* 26-bonus.js — the bonus round, as in the verb wheel: in a normal game (all types), before sentence BONUS_AT + 1.
   One situation told in each conditional type of the level (A1 2, A2 3, B1 4, B2 4 pairs: no zero): English on the left, its
   Portuguese on the right, shuffled. Drag one onto the other, or tap both. A right pair melts into one bubble (with
   its type) and is read aloud; a wrong pair shakes, and both pairs it involved lose their point. Each pair matched on
   the first go = +1. The hint (the game's pool) matches one pair by itself, for no point. Each matched pair gets a
   favourite star (id "<set>/<type>", shown in Favorites but not replayed). Once all are matched: Listen (reads them all)
   and Next. Sets: data/bonus.json (English) + i18n "bonusSets"; the last 8 sets shown are skipped (cond-bonus). */
const BONUS_AT = 3;   // G.idx when it comes up (before the 4th sentence)
const bonusEl = $("bonus"), mcolQ = $("mcolq"), mcolA = $("mcola"), bnHint = $("bnhint");
function bonusDue() { return G.mode === "normal" && focusType === "all" && G.idx === BONUS_AT && !G.bonus && DATA.bonus.length > 0; }
function pickBonusSet() {
  const recent = getList("cond-bonus"), fresh = DATA.bonus.filter(b => !recent.includes(b.id)), pool = fresh.length ? fresh : DATA.bonus;
  const b = pool[Math.floor(Math.random() * pool.length)];
  store("cond-bonus", JSON.stringify([b.id].concat(recent.filter(x => x !== b.id)).slice(0, 8)));
  return b;
}
// A shuffle where nothing stays in its row, so no Portuguese starts next to its own sentence.
function derange(n) { let a; do { a = shuffle([...Array(n).keys()]); } while (n > 1 && a.some((v, j) => v === j)); return a; }
const groupTy = g => tyOf(g === "m" ? "m1" : g);

function showBonus() {
  const set = pickBonusSet(), tr = (lang().bonusSets || {})[set.id] || {};
  const gs = lvl().bonusGroups || levelGroups(G.level);   // levels.json "bonusGroups" can leave a type out (B2: no zero)
  const pairs = gs.map(g => ({ g, en: set[g], pt: tr[g] || "", wrong: false, done: false, hinted: false }));
  G.bonus = { id: set.id, pairs, sel: null, done: 0, pts: 0, finished: false }; G.phase = "bonus";
  stage.hidden = $("tools").hidden = $("mixnote").hidden = revealEl.hidden = true;
  hintEl.innerHTML = tx("bonusAsk");
  $("proglbl").textContent = tx("bonusLabel");
  const board = bonusEl.querySelector(".mboard"); board.classList.remove("lineup"); board.style.minHeight = "";
  mcolQ.innerHTML = '<span class="mtag">English</span>';
  mcolA.innerHTML = '<span class="mtag">' + esc((lang().name || "").split(" (")[0]) + "</span>";
  pairs.forEach((p, j) => mcolQ.appendChild(mbub(p, "q", j)));
  derange(pairs.length).forEach((k, j) => mcolA.appendChild(mbub(pairs[k], "a", j)));
  $("bnlisten").hidden = $("bnnext").hidden = true;
  syncBonusHint(); bonusEl.hidden = false; sndShuffle();
}
function mbub(p, side, j) {
  const sl = document.createElement("div"), b = document.createElement("div");
  sl.className = "mslot"; sl.style.setProperty("--d", (j * 70 + (side === "a" ? 35 : 0)) + "ms");
  b.className = "b mb " + side; b.tabIndex = 0; b.setAttribute("role", "button");
  b.lang = side === "q" ? "en" : "pt"; b.innerHTML = SOAP + '<span class="wl">' + esc(side === "q" ? p.en : p.pt) + "</span>";   // soap look: 21-soap.css
  b.style.setProperty("--ang", Math.round(rnd(0, 360)) + "deg"); b.style.setProperty("--dl", rnd(-10, 0).toFixed(2) + "s");
  b.__m = { side, p, el: b, slot: sl };
  sl.appendChild(b); return sl;
}
function syncBonusHint() {
  const B = G.bonus, open = B && !B.finished ? B.pairs.filter(p => !p.done).length : 0;
  $("bnleft").textContent = tx("left", { n: G.hintsLeft });
  bnHint.hidden = !open; bnHint.disabled = !G.hintsLeft;
}
function setSel(m) { const B = G.bonus; if (B.sel) B.sel.el.classList.remove("sel"); B.sel = m; if (m) m.el.classList.add("sel"); }
function bump(el) {
  if (reduceMotion || !el.animate) return;
  el.animate([{ transform: "translateX(0)" }, { transform: "translateX(-7px)" }, { transform: "translateX(6px)" }, { transform: "translateX(-3px)" }, { transform: "none" }], { duration: 420, easing: "ease-out" });
}
function tryPair(x, y) {
  const B = G.bonus; if (!B || x.side === y.side || x.p.done || y.p.done) return;
  const q = x.side === "q" ? x : y, a = x.side === "q" ? y : x;
  setSel(null);
  if (q.p === a.p) return mergePair(q, a, false);
  // Wrong: both pairs lose their point.
  q.p.wrong = a.p.wrong = true; G.streak = 0;
  [q.el, a.el].forEach(e => { e.classList.add("bad"); bump(e); setTimeout(() => e.classList.remove("bad"), 600); });
  sndBad(); hintEl.innerHTML = tx("bonusNot");
}
// The Portuguese melts into its English; that bubble then shows both, with the conditional's name.
function mergePair(q, a, hinted) {
  const B = G.bonus, p = q.p, pts = hinted || p.wrong ? 0 : 1, ty = groupTy(p.g);
  p.done = true; p.hinted = hinted; B.done++; B.pts += pts;
  if (pts) { G.score++; showScore(); flash(scoreEl, "up"); sndOk(B.pts); toastAt(q.el, "+1"); } else sndHint();
  speak(p.en);
  hintEl.innerHTML = '<span class="chip" style="--h:' + ty.hue + '">' + esc(ty.name) + "</span> " + formHTML(ty, "if") + ", " + formHTML(ty, "main");
  const go = () => {
    a.slot.remove();
    q.el.classList.add("done"); if (hinted || p.wrong) q.el.classList.add("half");
    q.el.removeAttribute("tabindex"); q.el.removeAttribute("role");
    q.el.innerHTML = SOAP + '<span class="chip" style="--h:' + ty.hue + '">' + esc(ty.name) + '</span><span class="mq" lang="en">' + esc(p.en) + '</span><span class="ma" lang="pt">' + esc(p.pt) + "</span>" + favBtn(B.id + "/" + p.g, "if");
    syncBonusHint();
    if (B.done === B.pairs.length) setTimeout(finishBonus, reduceMotion ? 0 : 450);
  };
  if (reduceMotion || !a.el.animate) return go();
  const qa = q.el.getBoundingClientRect(), aa = a.el.getBoundingClientRect();
  a.el.animate([{ transform: "none", opacity: 1 }, { transform: "translate(" + (qa.left - aa.left) + "px," + (qa.top - aa.top) + "px) scale(.6)", opacity: 0 }],
    { duration: 340, easing: "cubic-bezier(.5,0,.7,.4)", fill: "forwards" });
  setTimeout(go, 330);
}
function finishBonus() {
  const B = G.bonus; if (!B || B.finished) return;   // pairs merged in quick succession each ask for this
  B.finished = true;
  const n = B.pairs.length, clean = B.pairs.filter(p => !p.wrong && !p.hinted).length;
  hintEl.innerHTML = clean === n ? tx("bonusPerfect", { n }) : tx("bonusSome", { k: clean, n });
  bnHint.hidden = true; lineup(); if (clean === n) sndWin();
  // The player looks at them, listens, stars some, then goes on with Next (or Enter).
  $("bnlisten").hidden = $("bnnext").hidden = false;
  setTimeout(() => $("bnnext").focus({ preventScroll: true }), 60);
}
// The merged pairs gather in one column in the middle, each sliding from where it was; the board shrinks after.
function lineup() {
  const board = bonusEl.querySelector(".mboard"), els = [...mcolQ.querySelectorAll(".mslot")];
  const before = els.map(e => e.getBoundingClientRect());
  board.style.minHeight = board.offsetHeight + "px"; board.classList.add("lineup");
  setTimeout(() => { board.style.minHeight = ""; }, reduceMotion ? 0 : 500);   // then the board closes up over Listen / Next
  if (reduceMotion) return;
  els.forEach((e, i) => {
    const a = before[i], b = e.getBoundingClientRect();
    e.animate([{ transform: "translate(" + (a.left - b.left) + "px," + (a.top - b.top) + "px)" }, { transform: "none" }], { duration: 450, easing: "cubic-bezier(.3,1.2,.55,1)" });
  });
}
function endBonus() {
  const B = G.bonus; if (!B || !B.finished || bonusEl.hidden) return;
  bonusEl.hidden = true; stage.hidden = $("tools").hidden = false; G.phase = "idle";
  startRound();
}
function hideBonus() { bonusEl.hidden = true; }
$("bnnext").addEventListener("click", endBonus);
$("bnlisten").addEventListener("click", () => { const B = G.bonus; if (B) speak(B.pairs.map(p => p.en), $("bnlisten")); });
bnHint.addEventListener("click", () => {
  const B = G.bonus; if (!B || B.finished || !G.hintsLeft) return;
  const open = B.pairs.filter(p => !p.done); if (!open.length) return;
  const p = open[Math.floor(Math.random() * open.length)];
  const find = side => [...bonusEl.querySelectorAll(".mb." + side)].map(e => e.__m).find(m => m.p === p);
  G.hintsLeft--; if (B.sel) setSel(null);
  mergePair(find("q"), find("a"), true);
});
document.addEventListener("keydown", e => {
  const B = G.bonus; if (!B || bonusEl.hidden) return;
  if (e.key === "Enter" && B.finished && !document.querySelector(".favmodal.show") && $("tour").hidden && !e.target.closest("button")) { e.preventDefault(); endBonus(); return; }
  const m = e.target.__m;
  if (m && !m.p.done && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); tapBubble(m); }
});
function tapBubble(m) {
  const B = G.bonus; if (!B || m.p.done) return;
  if (!B.sel) return setSel(m);
  if (B.sel === m) return setSel(null);
  if (B.sel.side === m.side) return setSel(m);
  tryPair(B.sel, m);
}
// Drag: a bubble follows the finger or mouse; dropped on one of the other side, the two are tried as a pair.
// A press that doesn't move is a tap.
let bdrag = null;
bonusEl.addEventListener("pointerdown", e => {
  const el = e.target.closest(".mb");
  if (!el || !el.__m || el.__m.p.done || e.button > 0) return;
  bdrag = { m: el.__m, x: e.clientX, y: e.clientY, on: false, id: e.pointerId };
});
function bonusHit(x, y, m) {
  m.el.style.visibility = "hidden";
  let el = document.elementFromPoint(x, y);
  m.el.style.visibility = "";
  el = el && el.closest(".mb");
  return el && el.__m && el.__m.side !== m.side && !el.__m.p.done ? el.__m : null;
}
document.addEventListener("pointermove", e => {
  if (!bdrag || e.pointerId !== bdrag.id) return;
  const dx = e.clientX - bdrag.x, dy = e.clientY - bdrag.y;
  if (!bdrag.on) {
    if (Math.abs(dx) + Math.abs(dy) < 8) return;
    bdrag.on = true; bdrag.m.el.classList.add("drag"); if (G.bonus.sel) setSel(null);
  }
  e.preventDefault();
  bdrag.m.el.style.transform = "translate(" + dx + "px," + dy + "px) scale(1.05)";
  const over = bonusHit(e.clientX, e.clientY, bdrag.m);
  bonusEl.querySelectorAll(".mb.hot").forEach(b => { if (!over || b !== over.el) b.classList.remove("hot"); });
  if (over) over.el.classList.add("hot");
});
document.addEventListener("pointerup", e => {
  if (!bdrag || e.pointerId !== bdrag.id) return;
  const d = bdrag; bdrag = null;
  if (!d.on) return tapBubble(d.m);
  const over = bonusHit(e.clientX, e.clientY, d.m);
  d.m.el.classList.remove("drag"); d.m.el.style.transform = "";
  bonusEl.querySelectorAll(".mb.hot").forEach(b => b.classList.remove("hot"));
  if (over) tryPair(d.m, over);
});
document.addEventListener("pointercancel", () => { if (!bdrag) return; bdrag.m.el.classList.remove("drag"); bdrag.m.el.style.transform = ""; bdrag = null; });
/* Safety nets for this drag (2026-11-22, from Question Bubbles: on computers, a MacBook among them, a dragged bubble
   could stay stuck on its target when the browser never reported the release, e.g. let go outside the window). A mouse
   move with no button held = the drop (a release is sent); a new mouse press or the window losing focus = back. */
(function () {
  function fire(type, e) { bonusEl.dispatchEvent(new PointerEvent(type, { bubbles: true, clientX: e ? e.clientX : 0, clientY: e ? e.clientY : 0, pointerId: e ? e.pointerId : (bdrag.id || 1), pointerType: "mouse" })); }
  function back(e) { if (!bdrag) return; fire("pointercancel", e); }
  document.addEventListener("pointermove", function (e) { if (bdrag && e.pointerType === "mouse" && !e.buttons) fire("pointerup", e); }, true);
  document.addEventListener("pointerdown", function (e) { if (e.pointerType === "mouse") back(e); }, true);
  window.addEventListener("blur", function () { back(); });
})();

/* 27-shine.js — the word bubbles' soap look and its shine (from Be Do Modal, 2026-11-22). SOAP = the spans inside every
   word bubble (21-soap.css): the film (and every bonus-round bubble) (.film: the turning colour .spin, the glow facing the mouse .fg), the shine spot
   (.spot + its brighter core .pl), the rim (.rim: .spin + the bright side .rh) and the small spot (.glint). What moves
   is a bare wrapper whose look is the <i> inside, so only transform / opacity change: nothing is repainted.
   The shine: each visible word's spot stays in its top-left corner and leans a little toward the cursor, the small
   spot moves the other way, the side facing the cursor glows as it nears. With a mouse always; with a finger only
   while a word is carried. Nothing with reduced motion. */
var SOAP = '<span class="film" aria-hidden="true"><i class="spin"></i><i class="fg"><i></i></i></span>' +
  '<span class="spot" aria-hidden="true"><i></i><i class="pl"><i></i></i></span>' +
  '<span class="rim" aria-hidden="true"><i class="spin"></i><i class="rh"><i></i></i></span><span class="glint" aria-hidden="true"><i></i></span>';
// Off screen, the words' animations (bob, turning film) pause: #stage.still
if (window.IntersectionObserver) new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle("still", !e.isIntersecting))).observe(stage);
// While the reveal card opens or closes, the bobs, films and background bubbles pause (body.calm), so each frame of

// While the tutorial or a window (.favmodal) covers the game, everything behind it stands still (body.covered: the
// CSS pauses the loops; the shine above ignores the mouse), so slow phones don't redraw the blur over it every frame
(() => {
  const check = () => { const t = document.getElementById("tour"); document.body.classList.toggle("covered", !!(t && !t.hidden) || !!document.querySelector(".favmodal.show")); };

/* 30-tour.js — guided tutorial: a welcome card, then a spotlight glides from feature to feature with a card explaining each one.
   Edit TOUR to change the steps; sel is a CSS selector for the element(s) to highlight (a list = one spotlight round all of them;
   none = centred card), alt the fallback when they are hidden at the current level.
   The id keys the translation in i18n/<lang>.json "tour.steps"; the EN / <badge> toggle switches the card language. */
const TOUR = [
  { id: "welcome", t: "Ready to practice conditional sentences?", x: "Complete each sentence with the right word bubbles. Here is one example of each type:", ex: true },
  { id: "level", sel: "#levelseg", t: "Choose your level", x: "<b>A1</b>: zero and 1st conditionals, with short sentences. <b>A2</b> adds the 2nd. <b>B1</b> adds the 3rd. <b>B2</b> adds mixed conditionals and longer sentences." },
  { id: "given", sel: ".clause.given", t: "Half the sentence is ready", x: "Every sentence has an <b>if clause</b> (the condition) and a <b>main clause</b> (the result). One of them is already here — and it can come first or second!" },
  { id: "answer", sel: ".clause.answer", t: "Build the other half", x: "<b>Tap</b> a word to drop it into the next empty slot, or <b>drag</b> it to a specific slot. Tap a placed word to send it back. Tap any word that is already there (in the given half, or a faded bubble) to see what it means." },
  { id: "traps", sel: "#orbit", t: "Careful: some words are traps", x: "Not every bubble belongs. Some have the <b>wrong tense</b> or the <b>wrong form</b>. Choose only the words that make a correct conditional." },
  { id: "tools", sel: ".trywrap, #hintbtn", t: "Tries and hints", x: "You have <b>3 tries</b> (<b>2</b> at B2). After a wrong try, words in the right place turn green and stay. Hints are shared by the whole game (<b>5</b> at A1 and A2, <b>4</b> at B1, <b>3</b> at B2; at most 2 per sentence). At A1 and A2 a hint places a correct word; at B1 and B2 it removes two wrong ones. Every hint you save is a <b>bonus point</b> at the end." },
  { id: "peek", sel: "#patbtn", alt: "#tools", t: "Translation and Pattern", x: "At <b>A1</b> the whole sentence is shown in your language above the words. At <b>A2</b> you always see which conditional it is and its formula; tap <b>Translation</b> to see the sentence in your language too. At <b>B1</b>, tap <b>Pattern</b> to see the conditional and its formula. At B2 you see both once the sentence is complete." },
  { id: "score", sel: "#score", t: "Points", x: "A perfect first try is worth <b>3 points</b>. A game has 5 sentences (15 points), a <b>bonus round</b> (1 point for each pair you match on the first go), and 1 bonus point for each hint you don't use." },
  { id: "bonus", sel: ".prog", t: "Bonus round", x: "Before sentence 4 comes a <b>bonus round</b>: one situation told in each conditional of your level. <b>Match</b> each English sentence to its translation (drag one onto the other, or tap both). Each pair right on the first go = <b>+1</b>. Tap a pair's <b>star</b> to keep it in Favorites." },
  { id: "play", sel: "#restart", t: "More ways to play", x: "Tap <b>new game</b> for a fresh game, a <b>90-second speed challenge</b>, a <b>listening</b> game, or a practice game with the sentences you <b>missed</b> or <b>starred</b>." },
  { id: "lists", sel: "#listbtns", t: "Favorites and Seen", x: "Tap the <b>star</b> on a finished sentence to save it in <b>Favorites</b>. <b>Seen</b> shows your progress, the sentences you did recently and the ones you <b>missed</b>, so you can review them." },

const TOUR_UI = { step: "Step {n} of {total}", back: "Back", next: "Next", play: "Let's play!", close: "Close the tutorial" };
const tourEl = $("tour"), spot = $("tour-spot"), tcard = $("tour-card"), tourBtn = $("tour-btn"), tlang = $("tour-lang");
let tourI = -1, tourTr = load("cond-tour-lang") === "tr";
// Translated tour text for the header language, or null when the card is in English.
function tourL() { return (tourTr && lang().tour) || null; }
function tourUI(k) { const T = tourL(); return (T && T.ui && T.ui[k]) || TOUR_UI[k]; }
// One colour-coded example per conditional type (from types.json), with the translation underneath when it's on.
// The two mixed types share a name, so only the first of them is shown.
function tourExamples() {
  const LT = tourL() ? lang().types || {} : {};
  const names = new Set();
  return '<ul class="tour-ex">' + Object.keys(DATA.types).filter(t => { const ty = DATA.types[t]; if (!ty.ex || names.has(ty.name)) return false; names.add(ty.name); return true; }).map(t => {
    const ty = DATA.types[t], tt = LT[t] || {};
    return '<li><span class="chip" style="--h:' + ty.hue + '">' + esc(tt.name || ty.name) + '</span><span lang="en">' + sentenceHTML(ty.ex, "if", ty.ex.key) + "</span>" +
      (tt.ex ? '<span class="tour-tr">' + sentenceHTML(tt.ex, "if") + "</span>" : "") + "</li>";
  }).join("") + "</ul>";
}
// auto = the first visit's automatic opening: it doesn't count, so the button pulses on later visits until the player opens it.
function tourOpen(auto) {
  // Card language: the player's last choice, else the translation at levels with translated instructions (A1).
  if (!load("cond-tour-lang")) tourTr = nativeUi();
  tourI = 0; tourEl.hidden = false; store("cond-tour", auto === true && load("cond-tour") !== "1" ? "auto" : "1"); if (auto !== true) tourBtn.classList.remove("fresh");
  $("tour-dots").innerHTML = TOUR.map(() => "<span></span>").join("");
  tlang.hidden = !lang().tour; tlang.lastChild.textContent = lang().badge; tlang.lastChild.lang = curLang;
  // No glide until Next / Back (.glide in the CSS), so the first card pops in where it belongs instead of flying in.

}
function tourClose() { tourEl.hidden = true; tourI = -1; tourBtn.focus({ preventScroll: true }); }
backLayer(tourEl, () => !tourEl.hidden, tourClose);   // the back gesture closes it (07-back.js)
// The elements step st highlights: those of sel that are visible, else those of alt (null when none).
function tourTgt(st) {
  const vis = q => q ? [...document.querySelectorAll(q)].filter(el => el.getClientRects().length) : [];
  const els = vis(st.sel).length ? vis(st.sel) : vis(st.alt);
  return els.length ? els : null;
}
// One box round all the highlighted elements.
function tourRect(els) {
  const rs = els.map(el => el.getBoundingClientRect()), left = Math.min(...rs.map(r => r.left)), top = Math.min(...rs.map(r => r.top));

function tourShow(anim = true) {
  const st = TOUR[tourI], T = tourL(), tx = (T && T.steps && T.steps[st.id]) || st, tgt = tourTgt(st);
  tcard.lang = T ? curLang : "en";

  $("tour-back").hidden = tourI === 0; $("tour-back").textContent = tourUI("back");
  $("tour-next").textContent = tourUI(tourI === TOUR.length - 1 ? "play" : "next");

// Scroll (at once, so the card is placed from where the target ends up) until the targets show in full: below the

// new-game tiles, right under the header on phones once an earlier step had scrolled down (from Word Family Bubbles).
// The header's own buttons always show; several targets are revealed as one box.
function tourReveal(els) {
  const dock = document.querySelector(".dock");
  els = els.filter(el => !(dock && dock.contains(el)));

  const stuck = dock && /sticky|fixed/.test(getComputedStyle(dock).position);

  if (tourI < 0) return;
  const tgt = tourTgt(TOUR[tourI]), vw = innerWidth, vh = innerHeight, cw = tcard.offsetWidth, ch = tcard.offsetHeight, pad = 8;
  spot.classList.toggle("none", !tgt);
  if (!tgt) { Object.assign(spot.style, { left: vw / 2 + "px", top: vh / 2 + "px", width: "0px", height: "0px" }); Object.assign(tcard.style, { left: (vw - cw) / 2 + "px", top: Math.max(12, (vh - ch) / 2) + "px" }); return; }
  const r = tourRect(tgt);
  Object.assign(spot.style, { left: r.left - pad + "px", top: r.top - pad + "px", width: r.width + pad * 2 + "px", height: r.height + pad * 2 + "px" });
  let top = r.bottom + pad + 14;
  if (top + ch > vh - 12) top = r.top - pad - 14 - ch;
  if (top < 12) top = Math.max(12, vh - ch - 12);
  const left = Math.min(Math.max(r.left + r.width / 2 - cw / 2, 12), vw - cw - 12);

function tourGo(d) { const n = tourI + d; if (n < 0) return; if (n >= TOUR.length) return tourClose(); tourI = n; tourEl.classList.add("glide"); tourShow(); tone(523.25 + d * 60, 0, .1, .03, 0, true); }
tourBtn.addEventListener("click", tourOpen);
$("tour-next").addEventListener("click", () => tourGo(1));
$("tour-back").addEventListener("click", () => tourGo(-1));
$("tour-x").addEventListener("click", tourClose);
tlang.addEventListener("click", e => {

if (load("cond-tour") === "auto") tourBtn.classList.add("fresh");   // it only opened by itself so far: pulse until the player opens it

/* play-nudge.js — the "new game" tile's nudge, copied from Core Vocabulary (vocabulary practice, 22-modes.js) on
   2026-11-27 (the user: every game with a "new game" tile and menu gets it). After three finished games, a player who
   has never opened the tile's menu sees the tile wiggle after 12 s without a tap or key (again every 12 s), only while
   nothing else is open (no window, tutorial or end card) and never with reduced motion. Opening the menu once stops it
   for good. A finished game = the end card opening. Saved: cond-playseen ("1" once opened), cond-gamesdone (count). */
(function () {
  var btn = document.getElementById("restart"), menu = document.getElementById("playmenu"), end = document.getElementById("endmodal");
  if (!btn || !menu) return;
  var SEEN = "cond-playseen", DONE = "cond-gamesdone", IDLE = 12000, AFTER = 3;
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function put(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  var css = document.createElement("style");
  css.textContent = "@keyframes play-nudge { 0%, 100% { transform: none; } 15% { transform: rotate(-6deg) scale(1.08); } " +
    "35% { transform: rotate(5deg) scale(1.08); } 55% { transform: rotate(-3deg) scale(1.04); } 75% { transform: rotate(2deg); } }\n" +
    "#restart.play-nudge { animation: play-nudge .7s ease-in-out; }";
  document.head.appendChild(css);
  btn.addEventListener("click", function () { put(SEEN, "1"); }, true);
  if (end) {
    var was = end.classList.contains("show");
    new MutationObserver(function () {
      var on = end.classList.contains("show");
      if (on && !was) put(DONE, String((+get(DONE) || 0) + 1));
      was = on;
    }).observe(end, { attributes: true, attributeFilter: ["class"] });

  setInterval(function () {
    if (Date.now() - idle < IDLE || still.matches || get(SEEN) || (+get(DONE) || 0) < AFTER || document.hidden) return;
    idle = Date.now();
    if (!menu.hidden || document.body.classList.contains("covered") || (end && end.classList.contains("show")) || !btn.offsetParent) return;
    btn.classList.remove("play-nudge"); void btn.offsetWidth; btn.classList.add("play-nudge");
  }, 1000);
  btn.addEventListener("animationend", function (e) { if (e.animationName === "play-nudge") btn.classList.remove("play-nudge"); });
})();

/* 99-main.js — boot: restore the saved level and start a game. */
(function boot() {
  let l = load("cond-level");
  if (!DATA.levels[l]) l = Object.keys(DATA.levels)[0];
  setLevelUI(l);
  newGame(l);
  // First visit: the tutorial starts with its welcome card.
  if (!load("cond-tour")) setTimeout(function () { tourOpen(true); }, 700);
})();
