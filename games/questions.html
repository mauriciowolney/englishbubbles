 flight?","a":"It leaves at noon.","g":"be","dx":["hour","are","when"],"tr":{"pt-BR":{"q":"A que horas é o seu voo?","a":"Sai ao meio-dia."}}},{"id":"a2-101","q":"Where can I buy a bus ticket?","a":"At the machine over there.","g":"can","dx":["do","buying","am","what"],"tr":{"pt-BR":{"q":"Onde posso comprar uma passagem de ônibus?","a":"Na máquina ali."}}},{"id":"a2-102","q":"What can I bring to the party?","a":"Some drinks would be great.","g":"can","dx":["do","brought","am","where"],"tr":{"pt-BR":{"q":"O que eu posso levar para a festa?","a":"Umas bebidas seriam ótimas."}},"heads":"“levar” to a party is bring in English, not take."},{"id":"a2-103","q":"How can I turn on the TV?","a":"Press the red button.","g":"can","dx":["do","turning","what"],"tr":{"pt-BR":{"q":"Como eu ligo a TV?","a":"Aperte o botão vermelho."}},"note":"turn on = ligar (a machine or a light); call = ligar (on the phone)."},{"id":"a2-104","q":"When can you come over?","a":"On Saturday afternoon.","g":"can","dx":["do","coming","are","where"],"tr":{"pt-BR":{"q":"Quando você pode vir aqui?","a":"No sábado à tarde."}},"note":"come over = vir à casa de alguém."},{"id":"a2-105","q":"What time did you wake up today?","a":"At seven.","g":"did","dx":["do","woke","hour","when"],"tr":{"pt-BR":{"q":"Que horas você acordou hoje?","a":"Às sete."}}},{"id":"a2-106","q":"What time are you going to leave?","a":"Around eight.","g":"going","dx":["is","leaving","hour","when"],"tr":{"pt-BR":{"q":"Que horas você vai sair?","a":"Lá pelas oito."}}},{"id":"a2-107","q":"What time does the movie start?","a":"At half past nine.","g":"do","dx":["do","starts","hour","when"],"tr":{"pt-BR":{"q":"Que horas o filme começa?","a":"Às nove e meia."}}},{"id":"a2-108","q":"Who did you go on vacation with?","a":"My family.","g":"did","dx":["does","went","which"],"tr":{"pt-BR":{"q":"Com quem você viajou de férias?","a":"Com a minha família."}},"heads":"“com quem”: in English the preposition moves to the end."},{"id":"a2-109","q":"What did you buy at the market?","a":"Some fruit and bread.","g":"did","dx":["does","bought","buyed","where"],"tr":{"pt-BR":{"q":"O que você comprou na feira?","a":"Frutas e pão."}}},{"id":"a2-110","q":"What are you doing this weekend?","a":"Visiting my aunt.","g":"ing","dx":["do","does","make","where"],"tr":{"pt-BR":{"q":"O que você vai fazer neste fim de semana?","a":"Visitar a minha tia."}},"heads":"“vai fazer” here is a plan already made, and English uses the -ing form for that."},{"id":"a2-111","q":"What are you talking about?","a":"Our trip to Peru.","g":"ing","dx":["do","talk","is","how"],"tr":{"pt-BR":{"q":"Sobre o que vocês estão falando?","a":"Sobre a nossa viagem ao Peru."}}},{"id":"a2-112","q":"Who is this present for?","a":"My mom. It's her birthday.","g":"be","dx":["are","whose","does"],"tr":{"pt-BR":{"q":"Para quem é este presente?","a":"Para a minha mãe. É aniversário dela."}}},{"id":"a2-113","q":"What is your favorite song about?","a":"Falling in love.","g":"be","dx":["are","does","of","how"],"tr":{"pt-BR":{"q":"Sobre o que é a sua música favorita?","a":"Sobre se apaixonar."}}},{"id":"a2-114","q":"Who did you borrow this from?","a":"My brother.","g":"did","dx":["does","borrowed","to","whose"],"tr":{"pt-BR":{"q":"De quem você pegou isto emprestado?","a":"Do meu irmão."}},"note":"borrow from someone = pegar emprestado; lend to someone = emprestar."},{"id":"a2-115","q":"Which country did she move to?","a":"Portugal.","g":"did","dx":["does","moved","went","where"],"tr":{"pt-BR":{"q":"Para qual país ela se mudou?","a":"Para Portugal."}}},{"id":"a2-116","q":"Who are you writing to?","a":"My pen pal in Japan.","g":"ing","dx":["do","writes","is","whose"],"tr":{"pt-BR":{"q":"Para quem você está escrevendo?","a":"Para o meu amigo por correspondência no Japão."}}},{"id":"a2-117","q":"What do you need the money for?","a":"A new phone.","g":"do","dx":["does","needs","much"],"tr":{"pt-BR":{"q":"Para que você precisa do dinheiro?","a":"Para um celular novo."}},"note":"What … for? = para quê? (the reason or the use)."},{"id":"a2-118","q":"Who did you play tennis with?","a":"My cousin Leo.","g":"did","dx":["does","played","whose"],"tr":{"pt-BR":{"q":"Com quem você jogou tênis?","a":"Com o meu primo Leo."}}},{"id":"a2-119","q":"What kind of things are you good at?","a":"Drawing and singing.","g":"be","dx":["is","well","do","how"],"tr":{"pt-BR":{"q":"Em que tipo de coisa você é bom?","a":"Desenhar e cantar."}},"note":"good at = bom em."},{"id":"a2-120","q":"Where are you flying to?","a":"Mexico City.","g":"ing","dx":["do","fly","is","when"],"tr":{"pt-BR":{"q":"Para onde você vai de avião?","a":"Para a Cidade do México."}}}],"B1":[{"id":"b1-01","q":"Who called you last night?","a":"My cousin did.","g":"subj","dx":["did","call","what"],"tr":{"pt-BR":{"q":"Quem te ligou ontem à noite?","a":"Meu primo."}},"note":"Who is the subject here (the person who called), so there is no did: Who called…?"},{"id":"b1-02","q":"What happened to your car?","a":"Someone hit it in the parking lot.","g":"subj","dx":["did","happen","with","where"],"tr":{"pt-BR":{"q":"O que aconteceu com o seu carro?","a":"Alguém bateu nele no estacionamento."}},"note":"Something happens TO something (not with).","heads":"“acontecer com” uses a different preposition in English."},{"id":"b1-03","q":"Who lives in that house?","a":"An old couple.","g":"subj","dx":["does","live","where"],"tr":{"pt-BR":{"q":"Quem mora naquela casa?","a":"Um casal de idosos."}}},{"id":"b1-04","q":"Which bus goes to the airport?","a":"The 42.","g":"subj","dx":["does","go","who"],"tr":{"pt-BR":{"q":"Qual ônibus vai para o aeroporto?","a":"O 42."}}},{"id":"b1-05","q":"Who wrote this book?","a":"Agatha Christie.","g":"subj","dx":["did","write","whose"],"tr":{"pt-BR":{"q":"Quem escreveu este livro?","a":"Agatha Christie."}}},{"id":"b1-06","q":"How many people came to the meeting?","a":"About fifty.","g":"subj","dx":["did","come","much"],"tr":{"pt-BR":{"q":"Quantas pessoas vieram à reunião?","a":"Umas omo…?” asks for a description, and in English it doesn't start with How."},{"id":"b1-21","q":"What was the weather like in London?","a":"It was cold and rainy.","g":"was","wh":"what-like","dx":["how","were","likes"],"tr":{"pt-BR":{"q":"Como estava o tempo em Londres?","a":"Estava frio e chuvoso."}},"heads":"This “Como…?” asks for a description, and in English it doesn't start with How."},{"id":"b1-22","q":"What does your brother look like?","a":"He's tall, with curly hair.","g":"do","wh":"what-like","dx":["how","do","looks"],"tr":{"pt-BR":{"q":"Como o seu irmão é fisicamente?","a":"Ele é alto e tem cabelo cacheado."}},"note":"look like = how someone looks (their appearance).","heads":"This “Como…?” asks for a description, and in English it doesn't start with How."},{"id":"b1-23","q":"How far is the beach from here?","a":"It's about ten minutes on foot.","g":"be","dx":["long","are","much"],"tr":{"pt-BR":{"q":"A que distância fica a praia daqui?","a":"Fica a uns dez minutos a pé."}}},{"id":"b1-24","q":"How far do you run every day?","a":"About five kilometers.","g":"do","dx":["many","does","runs"],"tr":{"pt-BR":{"q":"Que distância você corre todo dia?","a":"Uns cinco quilômetros."}}},{"id":"b1-25","q":"What were you doing at ten last night?","a":"I was watching a series.","g":"pcont","dx":["was","did","do","where"],"tr":{"pt-BR":{"q":"O que você estava fazendo ontem às dez da noite?","a":"Eu estava assistindo uma série."}}},{"id":"b1-26","q":"Why was she crying?","a":"Because her team lost the final.","g":"pcont","dx":["were","cry","did","what"],"tr":{"pt-BR":{"q":"Por que ela estava chorando?","a":"Porque o time dela perdeu a final."}}},{"id":"b1-27","q":"How often should I take this medicine?","a":"Every eight hours.","g":"modal","dx":["much","do","taking"],"tr":{"pt-BR":{"q":"De quanto em quanto tempo eu devo tomar este remédio?","a":"A cada oito horas."}}},{"id":"b1-28","q":"What would you do with a million dollars?","a":"I would travel around the world.","g":"modal","dx":["does","doing","are","where"],"tr":{"pt-BR":{"q":"O que você faria com um milhão de dólares?","a":"Eu viajaria pelo mundo."}}},{"id":"b1-29","q":"Whose car did you borrow?","a":"My dad's.","g":"did","dx":["who","borrowed","does"],"tr":{"pt-BR":{"q":"De quem você pegou o carro emprestado?","a":"O do meu pai."}},"heads":"“pegar emprestado” is a single verb in English."},{"id":"b1-30","q":"How long does it take to get to work?","a":"About forty minutes.","g":"do","dx":["much","do","takes"],"tr":{"pt-BR":{"q":"Quanto tempo leva para chegar ao trabalho?","a":"Uns quarenta minutos."}}},{"id":"b1-31","q":"What kind of job are you looking for?","a":"Something in marketing.","g":"ing","dx":["is","look","to","how"],"tr":{"pt-BR":{"q":"Que tipo de emprego você está procurando?","a":"Algo na área de marketing."}}},{"id":"b1-32","q":"How much time do you spend online?","a":"About four hours a day.","g":"do","dx":["many","does","pass"],"tr":{"pt-BR":{"q":"Quanto tempo você passa na internet?","a":"Umas quatro horas por dia."}},"note":"passar tempo = spend time (not pass).","heads":"“passar tempo” doesn't use pass in English."},{"id":"b1-33","q":"Who does this umbrella belong to?","a":"It belongs to Clara.","g":"do","dx":["whose","belongs","is"],"tr":{"pt-BR":{"q":"A quem pertence este guarda-chuva?","a":"Pertence à Clara."}},"note":"belong to someone: the to goes at the end. You can also ask: Whose umbrella is this?","heads":"“a quem” — in English the preposition goes to the end."},{"id":"b1-34","q":"Why didn't you tell me?","a":"Because I didn't want to worry you.","g":"did","dx":["don't","told","say","how"],"tr":{"pt-BR":{"q":"Por que você não me contou?","a":"Porque eu não queria te preocupar."}},"note":"tell someone something; say something (to someone)."},{"id":"b1-35","q":"Where did you grow up?","a":"I grew up in a small town.","g":"did","dx":["grew","does","was","what"],"tr":{"pt-BR":{"q":"Onde você cresceu?","a":"Cresci numa cidade pequena."}}},{"id":"b1-36","q":"Who has eaten my cookies?","a":"Not me! Maybe it was the dog.","g":"subj","dx":["did","have","ate","whose"],"tr":{"pt-BR":{"q":"Quem comeu os meus biscoitos?","a":"Não fui eu! Talvez tenha sido o cachorro."}}},{"id":"b1-37","q":"Who sent you this message?","a":"My boss did.","g":"subj","dx":["did","send","whose"],"tr":{"pt-BR":{"q":"Quem te mandou essa mensagem?","a":"Meu chefe."}}},{"id":"b1-38","q":"Who did you send the photos to?","a":"To my mom.","g":"did","dx":["sent","does","whose"],"tr":{"pt-BR":{"q":"Para quem você mandou as fotos?","a":"Para a minha mãe."}},"note":"Compare: Who sent you…? (who = the subject) / Who did you send … to? (you = the subject; to goes at the end).","heads":"“para quem” — in English the preposition goes to the end."},{"id":"b1-39","q":"What broke the window?","a":"A soccer ball did.","g":"subj","dx":["did","break","who"],"tr":{"pt-BR":{"q":"O que quebrou a janela?","a":"Foi uma bola de futebol."}}},{"id":"b1-40","q":"Who taught you to swim?","a":"My father did.","g":"subj","dx":["did","teach","what"],"tr":{"pt-BR":{"q":"Quem te ensinou a nadar?","a":"Meu pai."}}},{"id":"b1-41","q":"Who did your sister marry?","a":"A guy from Ireland.","g":"did","dx":["married","does","with","whose"],"tr":{"pt-BR":{"q":"Com quem a sua irmã se casou?","a":"Com um rapaz da Irlanda."}},"note":"casar com alguém = marry someone (no with).","heads":"“casar com alguém” has no preposition in English."},{"id":"b1-42","q":"How much money did you spend on the trip?","a":"About three thousand dollars.","g":"did","dx":["many","spent","does"],"tr":{"pt-BR":{"q":"Quanto dinheiro você gastou na viagem?","a":"Uns três mil dólares."}}},{"id":"b1-43","q":"How much homework do you have tonight?","a":"Not much, luckily.","g":"do","dx":["many","does","has"],"tr":{"pt-BR":{"q":"Quanta lição de casa você tem hoje à noite?","a":"Não muita, por sorte."}},"note":"You can't count homework → how much (never “homeworks”)."},{"id":"b1-44","q":"How often do you check your phone?","a":"Probably every five minutes!","g":"do","dx":["does","checks","much"],"tr":{"pt-BR":{"q":"Com que frequência você olha o celular?","a":"Provavelmente a cada cinco minutos!"}}},{"id":"b1-45","q":"How often should we water this plant?","a":"Once a week is enough.","g":"modal","dx":["much","do","watering"],"tr":{"pt-BR":{"q":"De quanto em quanto tempo devemos regar esta planta?","a":"Uma vez por semana é suficiente."}}},{"id":"b1-46","q":"Whose house are we going to?","a":"We're going to my cousin's.","g":"ing","dx":["who","is","for"],"tr":{"pt-BR":{"q":"Para a casa de quem nós estamos indo?","a":"Estamos indo para a casa do meu primo."}}},{"id":"b1-47","q":"Whose jacket were you wearing yesterday?","a":"It was my brother's.","g":"pcont","dx":["who","was","wore"],"tr":{"pt-BR":{"q":"De quem era a jaqueta que você estava usando ontem?","a":"Era do meu irmão."}}},{"id":"b1-48","q":"What kind of people do you get along with?","a":"People who are honest and funny.","g":"do","dx":["does","gets","how"],"tr":{"pt-BR":{"q":"Com que tipo de pessoa você se dá bem?","a":"Com pessoas honestas e engraçadas."}},"note":"get along with = se dar bem com. The with goes at the end.","heads":"“com que tipo” — in English the preposition goes to the end."},{"id":"b1-49","q":"What kind of work have you done before?","a":"I've worked in a restaurant.","g":"perf","dx":["did","has","how"],"tr":{"pt-BR":{"q":"Que tipo de trabalho você já fez antes?","a":"Já trabalhei num restaurante."}}},{"id":"b1-50","q":"What were you talking about?","a":"We were talking about the game.","g":"pcont","dx":["was","did","of","how"],"tr":{"pt-BR":{"q":"Sobre o que vocês estavam falando?","a":"Estávamos falando sobre o jogo."}},"note":"talk about something: the about goes at the end."},{"id":"b1-51","q":"Where were you going when I saw you?","a":"To the bank.","g":"pcont","dx":["was","went","did","what"],"tr":{"pt-BR":{"q":"Aonde você estava indo quando eu te vi?","a":"Ao banco."}}},{"id":"b1-52","q":"Who were you waiting for at the airport?","a":"My aunt from Australia.","g":"pcont","dx":["was","wait","to","whose"],"tr":{"pt-BR":{"q":"Quem você estava esperando no aeroporto?","a":"A minha tia da Austrália."}}},{"id":"b1-53","q":"How was the concert last night?","a":"It was amazing!","g":"was","dx":["were","did","what"],"tr":{"pt-BR":{"q":"Como foi o show ontem à noite?","a":"Foi incrível!"}}},{"id":"b1-54","q":"Why were the streets so busy?","a":"Because there was a parade.","g":"was","dx":["was","did","because","what"],"tr":{"pt-BR":{"q":"Por que as ruas estavam tão movimentadas?","a":"Porque tinha um desfile."}}},{"id":"b1-55","q":"What should I bring to the dinner?","a":"Just bring a dessert.","g":"modal","dx":["do","bringing","how"],"tr":{"pt-BR":{"q":"O que eu devo levar para o jantar?","a":"Leve só uma sobremesa."}}},{"id":"b1-56","q":"Where would you like to live?","a":"Somewhere near the sea.","g":"modal","dx":["does","living","are","what"],"tr":{"pt-BR":{"q":"Onde você gostaria de morar?","a":"Em algum lugar perto do mar."}}},{"id":"b1-57","q":"Which of these phones would you buy?","a":"The cheaper one.","g":"modal","dx":["what","buying","does"],"tr":{"pt-BR":{"q":"Qual destes celulares você compraria?","a":"O mais barato."}},"note":"Which of these…? = a choice between things you can see. Not “What of these”."},{"id":"b1-58","q":"How long have you known each other?","a":"Since we were kids.","g":"perf","dx":["do","knew","much"],"tr":{"pt-BR":{"q":"Há quanto tempo vocês se conhecem?","a":"Desde crianças."}},"heads":"Portuguese uses the present here, but English uses the present perfect."},{"id":"b1-59","q":"What have you been doing lately?","a":"I've been studying for my exams.","g":"perf","dx":["did","has","do","where"],"tr":{"pt-BR":{"q":"O que você tem feito ultimamente?","a":"Tenho estudado para as provas."}}},{"id":"b1-60","q":"Who are you going to vote for?","a":"I haven't decided yet.","g":"going","dx":["is","voting","in","whose"],"tr":{"pt-BR":{"q":"Em  end."},{"id":"b1-74","q":"What are you so excited about?","a":"Our trip to Japan next week!","g":"be","dx":["is","with","of","how"],"tr":{"pt-BR":{"q":"Com o que você está tão animado?","a":"Com a nossa viagem para o Japão semana que vem!"}},"heads":"“animado com” uses a different preposition in English, at the end."},{"id":"b1-75","q":"What was the movie about?","a":"A girl who can talk to animals.","g":"was","dx":["were","of","did","how"],"tr":{"pt-BR":{"q":"Sobre o que era o filme?","a":"Sobre uma menina que fala com os animais."}},"heads":"“sobre o que” splits in English: the preposition goes to the end."},{"id":"b1-76","q":"What do you use this app for?","a":"To edit my photos.","g":"do","dx":["does","uses","to","how"],"tr":{"pt-BR":{"q":"Para que você usa este aplicativo?","a":"Para editar as minhas fotos."}},"heads":"“para que” — in English the preposition goes to the end."},{"id":"b1-77","q":"Which gym do you go to?","a":"The one near my office.","g":"do","dx":["does","goes","in","where"],"tr":{"pt-BR":{"q":"Qual academia você frequenta?","a":"A que fica perto do meu escritório."}}},{"id":"b1-78","q":"Who were you arguing with?","a":"My neighbor, again.","g":"pcont","dx":["was","argue","to","whose"],"tr":{"pt-BR":{"q":"Com quem você estava discutindo?","a":"Com o meu vizinho, de novo."}},"heads":"“com quem” — in English the preposition goes to the end."},{"id":"b1-79","q":"Who should I talk to about this?","a":"The manager.","g":"modal","dx":["do","talking","for","whose"],"tr":{"pt-BR":{"q":"Com quem eu devo falar sobre isso?","a":"Com o gerente."}},"heads":"“falar com” uses a different preposition in English, right after the verb."},{"id":"b1-80","q":"Which room is the meeting in?","a":"The big one on the second floor.","g":"be","dx":["are","at","on","where"],"tr":{"pt-BR":{"q":"Em que sala é a reunião?","a":"Na grande, no segundo andar."}},"heads":"“em que sala” — in English the preposition goes to the end."},{"id":"b1-81","q":"Who invented the telephone?","a":"Alexander Graham Bell.","g":"subj","dx":["did","invent","what"],"tr":{"pt-BR":{"q":"Quem inventou o telefone?","a":"Alexander Graham Bell."}}},{"id":"b1-82","q":"What happened at school today?","a":"Nothing special.","g":"subj","dx":["did","happen","with","where"],"tr":{"pt-BR":{"q":"O que aconteceu na escola hoje?","a":"Nada de especial."}}},{"id":"b1-83","q":"Who knows the answer?","a":"I do!","g":"subj","dx":["does","know","whose"],"tr":{"pt-BR":{"q":"Quem sabe a resposta?","a":"Eu sei!"}},"note":"Who is the subject here, so there's no do: Who knows…?"},{"id":"b1-84","q":"How many people live in your building?","a":"Around fifty families.","g":"subj","dx":["does","lives","much"],"tr":{"pt-BR":{"q":"Quantas pessoas moram no seu prédio?","a":"Umas cinquenta famílias."}}},{"id":"b1-85","q":"Which team won the game?","a":"Ours did!","g":"subj","dx":["did","win","who"],"tr":{"pt-BR":{"q":"Que time ganhou o jogo?","a":"O nosso!"}}},{"id":"b1-86","q":"How long have you had your dog?","a":"Since he was a puppy.","g":"perf","dx":["do","has","much"],"tr":{"pt-BR":{"q":"Há quanto tempo você tem o seu cachorro?","a":"Desde filhote."}},"heads":"Portuguese uses the present here, but English uses the present perfect."},{"id":"b1-87","q":"Which of these movies have you seen?","a":"Only the first one.","g":"perf","dx":["did","saw","who"],"tr":{"pt-BR":{"q":"Quais destes filmes você já viu?","a":"Só o primeiro."}},"heads":"“já” + past usually becomes the present perfect in English."},{"id":"b1-88","q":"How long have you been learning English?","a":"Since I was eight.","g":"perf","dx":["do","are","much"],"tr":{"pt-BR":{"q":"Há quanto tempo você estuda inglês?","a":"Desde os oito anos."}},"heads":"Portuguese uses the present here, but English uses the present perfect."},{"id":"b1-89","q":"How far have you walked today?","a":"Almost ten kilometers.","g":"perf","dx":["did","has","long"],"tr":{"pt-BR":{"q":"Quanto você já andou hoje?","a":"Quase dez quilômetros."}},"heads":"“já” + past usually becomes the present perfect in English."},{"id":"b1-90","q":"Why were you running?","a":"I was late for my bus.","g":"pcont","dx":["was","run","did","what"],"tr":{"pt-BR":{"q":"Por que você estava correndo?","a":"Eu estava atrasado para o ônibus."}}},{"id":"b1-91","q":"Who would you like to meet?","a":"Lionel Messi!","g":"modal","dx":["does","meeting","what"],"tr":{"pt-BR":{"q":"Quem você gostaria de conhecer?","a":"O Lionel Messi!"}}},{"id":"b1-92","q":"How much should I tip?","a":"About fifteen percent.","g":"modal","dx":["many","do","tipping"],"tr":{"pt-BR":{"q":"Quanto eu devo dar de gorjeta?","a":"Uns quinze por cento."}}},{"id":"b1-93","q":"What is the food like there?","a":"Spicy but delicious.","g":"be","dx":["how","are","likes"],"tr":{"pt-BR":{"q":"Como é a comida lá?","a":"Apimentada, mas deliciosa."}},"heads":"This “Como…?” asks for a description, and in English it doesn't start with How.","wh":"what-like"},{"id":"b1-94","q":"What are your neighbors like?","a":"Friendly but a bit noisy.","g":"be","dx":["how","is","likes"],"tr":{"pt-BR":{"q":"Como são os seus vizinhos?","a":"Simpáticos, mas um pouco barulhentos."}},"heads":"This “Como…?” asks for a description, and in English it doesn't start with How.","wh":"what-like"},{"id":"b1-95","q":"How far is your school from your house?","a":"About two kilometers.","g":"be","dx":["long","are","much"],"tr":{"pt-BR":{"q":"A que distância a sua escola fica da sua casa?","a":"Uns dois quilômetros."}}},{"id":"b1-96","q":"How often does your family eat out?","a":"About once a month.","g":"do","dx":["do","eats","much"],"tr":{"pt-BR":{"q":"Com que frequência a sua família come fora?","a":"Mais ou menos uma vez por mês."}}},{"id":"b1-97","q":"Whose fault was it?","a":"Nobody's.","g":"was","dx":["who","were","did"],"tr":{"pt-BR":{"q":"De quem foi a culpa?","a":"De ninguém."}},"heads":"“de quem” becomes a single word in English, at the start of the question."},{"id":"b1-98","q":"Why did you change your mind?","a":"I found a cheaper option.","g":"did","dx":["changed","does","because","what"],"tr":{"pt-BR":{"q":"Por que você mudou de ideia?","a":"Encontrei uma opção mais barata."}}},{"id":"b1-99","q":"Where are you going to put the sofa?","a":"Next to the window.","g":"going","dx":["is","putting","when"],"tr":{"pt-BR":{"q":"Onde você vai colocar o sofá?","a":"Ao lado da janela."}}},{"id":"b1-100","q":"How long is it going to take?","a":"A couple of days.","g":"going","dx":["much","are","taking"],"tr":{"pt-BR":{"q":"Quanto tempo vai levar?","a":"Uns dois dias."}},"heads":"“quanto tempo” doesn't become “much time” in English."},{"id":"b1-101","q":"How did you hurt your leg?","a":"I fell off my bike.","g":"did","dx":["does","hurted","what"],"tr":{"pt-BR":{"q":"Como você machucou a perna?","a":"Caí da bicicleta."}},"note":"hurt is irregular and never changes: hurt, hurt, hurt."},{"id":"b1-102","q":"How are you feeling today?","a":"Much better, thanks.","g":"ing","dx":["do","feels","is","why"],"tr":{"pt-BR":{"q":"Como você está se sentindo hoje?","a":"Muito melhor, obrigado."}}},{"id":"b1-103","q":"How was the job interview?","a":"It went really well.","g":"was","dx":["were","did","does","what"],"tr":{"pt-BR":{"q":"Como foi a entrevista de emprego?","a":"Foi muito bem."}}},{"id":"b1-104","q":"How should I cook the fish?","a":"Grill it with some lemon.","g":"modal","dx":["does","cooking","much"],"tr":{"pt-BR":{"q":"Como eu devo fazer o peixe?","a":"Grelhe com um pouco de limão."}}},{"id":"b1-105","q":"How did they find out?","a":"Someone told them.","g":"did","dx":["does","found","do","which"],"tr":{"pt-BR":{"q":"Como eles descobriram?","a":"Alguém contou para eles."}},"note":"find out = descobrir (some news or a secret)."},{"id":"b1-106","q":"How many emails do you get a day?","a":"Too many to count!","g":"do","dx":["much","does","gets"],"tr":{"pt-BR":{"q":"Quantos e-mails você recebe por dia?","a":"Tantos que nem dá para contar!"}}},{"id":"b1-107","q":"How many of your friends speak English?","a":"Almost all of them.","g":"subj","dx":["much","speaks","do"],"tr":{"pt-BR":{"q":"Quantos dos seus amigos falam inglês?","a":"Quase todos."}},"note":"How many of your friends is the subject (they speak), so there is no do."},{"id":"b1-108","q":"How many people were at the party?","a":"About fifty.","g":"was","dx":["much","was","did"],"tr":{"pt-BR":{"q":"Quantas pessoas estavam na festa?","a":"Umas cinquenta."}}},{"id":"b1-109","q":"Where did you learn to cook?","a":"At home, with my grandmother.","g":"did","dx":["does","learned","cooking","who"],"tr":{"pt-BR":{"q":"Onde você aprendeu a cozinhar?","a":"Em casa, com a minha avó."}}},{"id":"b1-110","q":"Where were you living in 2020?","a":"In Chicago.","g":"pcont","dx":["was","did","live","what"],"tr":{"pt-BR":{"q":"Onde você morava em 2020?","a":"Em Chicago."}}},{"id":"b1-111","q":"Where are you going to celebrate your birthday?","a":"At a restaurant downtown.","g":"going","dx":["is","celebrating","go","what"],"tr":{"pt-BR":{"q":"Onde você vai comemorar o seu aniversário?","a":"Num restaurante no centro."}}},{"id":"b1-112","q":"Why were you so quiet at dinner?","a":"I was just tired.","g":"was","dx":["was","did","because","what"],"tr":{"pt-BR":{"q":"Por que você estava tão quieto no jantar?","a":"Eu só estava cansado."}}},{"id":"b1-113","q":"Why is everyone looking at me?","a":"You have paint on your face!","g":"ing","dx":["are","looks","because","what"],"tr":{"pt-BR":{"q":"Por que todo mundo está olhando para mim?","a":"Tem tinta no seu rosto!"}},"note":"everyone is singular in English: everyone is, not everyone are."},{"id":"b1-114","q":"Why haven't you called her yet?","a":"I don't know what to say.","g":"perf","dx":["hasn't","didn't","calling","what"],"tr":{"pt-BR":{"q":"Por que você ainda não ligou para ela?","a":"Não sei o que dizer."}}},{"id":"b1-115","q":"What are you going to cook for dinner?","a":"Pasta with tomato sauce.","g":"going","dx":["is","cooking","do","who"],"tr":{"pt-BR":{"q":"O que você vai fazer para o jantar?","a":"Macarrão com molho de tomate."}}},{"id":"b1-116","q":"Who is going to pick up the kids?","a":"Your dad is.","g":"going","dx":["are","picking","does","whose"],"tr":{"pt-BR":{"q":"Quem vai buscar as crianças?","a":"O seu pai."}},"note":"Who is the subject (the person who will pick them up)."},{"id":"b1-117","q":"What was your favorite subject at school?","a":"History.","g":"was","dx":["were","did","does","where"],"tr":{"pt-BR":{"q":"Qual era a sua matéria favorita na escola?","a":"História."}}},{"id":"b1-118","q":"Which book are you reading at the moment?","a":"A mystery novel.","g":"ing","dx":["do","reads","is","where"],"tr":{"pt-BR":{"q":"Que livro você está lendo agora?","a":"Um romance policial."}}},{"id":"b1-119","q":"What are you planning to do after college?","a":"I'd like to travel for a year.","g":"ing","dx":["does","plan","is","where"],"tr":{"pt-BR":{"q":"O que você está pensando em fazer depois da faculdade?","a":"Eu queria viajar por um ano."}}},{"id":"b1-120","q":"How long are you staying in Rome?","a":"Until Sunday.","g":"ing","dx":["do","stay","much"],"tr":{"pt-BR":{"q":"Até quando você fica em Roma?","a":"Até domingo."}},"heads":"Portuguese uses the simple present (fica) for a plan; English uses the -ing form."},{"id":"b1-121","q":"How far is the nearest hospital?","a":"About ten minutes by car.","g":"be","dx":["long","are","does"],"tr":{"pt-BR":{"q":"A que distância fica o hospital mais próximo?","a":"Uns dez minutos de carro."}}},{"id":"b1-122","q":"How far did you drive yesterday?","a":"Almost five hundred miles.","g":"did","dx":["does","drove","much"],"tr":{"pt-BR":{"q":"Quanto você dirigiu ontem?","a":"Quase quinhentas milhas."}}},{"id":"b1-123","q":"Whose dog was barking all night?","a":"The neighbors' dog.","g":"pcont","dx":["who's","were","did"],"tr":{"pt-BR":{"q":"De quem era o cachorro que latiu a noite toda?","a":"Dos vizinhos."}},"heads":"“De quem” is one word in English, and it isn't who's (= who is)."},{"id":"b1-124","q":"Whose advice should I follow?","a":"Your doctor's.","g":"modal","dx":["who's","do","following"],"tr":{"pt-BR":{"q":"O conselho de quem eu devo seguir?","a":"O do seu médico."}},"heads":"“De quem” is one word in English, and it isn't who's (= who is)."},{"id":"b1-125","q":"What kind of training do you need for this job?","a":"A two-week course.","g":"do","dx":["does","needs","much"],"tr":{"pt-BR":{"q":"Que tipo de formação você precisa para esse trabalho?","a":"Um curso de duas semanas."}}},{"id":"b1-126","q":"What kind of car would you buy?","a":"Something small and electric.","g":"modal","dx":["does","bought","buying","how"],"tr":{"pt-BR":{"q":"Que tipo de carro você compraria?","a":"Algo pequeno e elétrico."}}},{"id":"b1-127","q":"How much have you saved this year?","a":"About two thousand dollars.","g":"perf","dx":["did","has","saving","many"],"tr":{"pt-BR":{"q":"Quanto você economizou este ano?","a":"Uns dois mil dólares."}},"heads":"Portuguese uses the past here; English uses the present perfect, since the year isn't over."},{"id":"b1-128","q":"How much coffee did you drink today?","a":"Four cups. Too many!","g":"did","dx":["many","does","drank"],"tr":{"pt-BR":{"q":"Quanto café você tomou hoje?","a":"Quatro xícaras. Demais!"}}},{"id":"b1-129","q":"How often do you work from home?","a":"Twice a week.","g":"do","dx":["does","works","much"],"tr":{"pt-BR":{"q":"Com que frequência você trabalha de casa?","a":"Duas vezes por semana."}}},{"id":"b1-130","q":"How often were you sick as a child?","a":"Almost never.","g":"was","dx":["was","did","many"],"tr":{"pt-BR":{"q":"Com que frequência você ficava doente quando criança?","a":"Quase nunca."}}}]},"i18n":{"pt-BR":{"name":"Português (Brasil)","sub":"Brazilian Portuguese","badge":"PT","grad":"linear-gradient(135deg, #1fa463, #e8b800)","wh":{"what":["o que / qual","uma coisa ou uma informação"],"where":["onde","um lugar"],"when":["quando","um momento ou um dia"],"what-time":["que horas","a hora no a.","newBest":"Novo recorde no {lvl}!","levelBest":"{lvl} · recorde {n}","hintsUsed":"Dicas usadas: {n} de {m}","bonus":" · +{n} extra","quickQ":"Pergunta rápida: {r}","missed":"errou","mastered":"perguntas dominadas no {lvl}","daysRow":" · 🔥 {n} dias seguidos","playAgain":"Jogar de novo","copy":"Copiar resultados","copied":"Copiado ✓","copyFail":"Não deu para copiar","tryUp":"Tentar o {lvl} →","seenTitle":"Perguntas vistas","tabRecent":"Recentes","tabMissed":"Erradas","masteredHead":"Perguntas dominadas (perfeitas na última tentativa)","weakHead":"Palavras interrogativas para praticar no {lvl} (as mais fracas: perfeitas / jogadas)","weakNone":"Nenhuma palavra interrogativa fraca: 80% ou mais em todas!","practiceOne":"Praticar esta","practiceMany":"Praticar estas","emptyFav":"Nenhuma favorita ainda. Toque na estrela de uma pergunta concluída para guardá-la aqui.","emptyRecent":"As perguntas que você concluir vão aparecer aqui.","emptyMissed":"Nenhuma pergunta errada. Muito bem!","chartAsks":"pergunta sobre","headsUp":"Atenção"},"guide":{"ui":{"tip":"Perguntas abertas no inglês quase sempre seguem a mesma ordem: <b>palavra interrogativa + verbo auxiliar + sujeito + verbo<\/b>. Acertou a ordem, você pergunta qualquer coisa.","stepsTitle":"Monte uma pergunta passo a passo","stepsLead":"Siga esta ordem. O exemplo monta “Where does your sister work?”","navWords":"Palavras interrogativas","navPatterns":"Padrões","navMap":"Português → inglês","navPreps":"Preposições","navMistakes":"Erros comuns","navCurious":"Para os curiosos","wordsLead":"A palavra interrogativa vem primeiro. Ela mostra que tipo de resposta a pergunta quer. Toque num exemplo para ouvir.","asks":"pergunta sobre","from":"a partir do {lvl}","patternsTitle":"Padrões de pergunta","patternsLead":"O verbo auxiliar muda com o tempo verbal. Palavra interrogativa em rosa, verbo auxiliar em azul, como no jogo.","prepsTitle":"Preposições nas perguntas","prepsLead":"O português coloca a preposição primeiro (Com quem…? De onde…?). O inglês quase sempre deixa ela para o final.","prepsMore":"Perguntas que você já viu","mapTitle":"Português → inglês","mapLead":"Coisas que o português diz de um jeito e o inglês diz de outro.","mistakesTitle":"Erros comuns","mistakesLead":"As bolhas-armadilha do jogo vêm destes erros.","curiousTitle":"Para os curiosos"},"steps":{"wh":{"t":"Escolha a palavra interrogativa","x":"O que você quer saber? Um lugar → where, uma pessoa → who, um motivo → why."},"aux":{"t":"Coloque o verbo auxiliar","x":"do / does / did, am / is / are, was / were, can, will, have / has… Ele concorda com o sujeito e mostra o tempo verbal."},"subj":{"t":"Depois o sujeito","x":"A pessoa ou coisa que faz a ação: you, your sister, they…"},"verb":{"t":"Depois o verbo principal, na forma base","x":"Depois de do / does / did, can, will…: work, go, live (nunca works, went, lives)."},"rest":{"t":"O resto no final","x":"Objetos, lugares, horários. Uma preposição pode até ser a última palavra."}},"groups":{"thing":"Coisas e escolhas","person":"Pessoas","place":"Lugares e distância","time":"Tempo","number":"Números e quantidades","reason":"Motivos, jeitos e descrições"},"preps":{"end":{"t":"A preposição vai para o final","x":"Comece com a palavra interrogativa, como sempre, e deixe a preposição por último: De onde você é? → Where are you from? Com quem você mora? → Who do you live with?"},"verb":{"t":"Ela fica com o seu verbo","x":"Muitos verbos vêm com a sua própria preposição: wait for, look for, listen to, talk to, think about. Na pergunta eles continuam um time: o verbo, e a preposição no final."},"none":{"t":"Alguns verbos não levam nenhuma","x":"like, need, visit, call, marry: nada no final, mesmo quando o português tem preposição (gostar de, precisar de)."},"adj":{"t":"Adjetivos também têm","x":"afraid of, interested in, married to, worried about, excited about: o adjetivo leva a sua preposição, e ela vai para o final."},"fixed":{"t":"Perguntas para aprender inteiras","x":"Algumas têm um sentido próprio: What is it for? (para que serve?), What is it like? (como é?), What does he look like? (como ele é fisicamente?), What is it about? (é sobre o quê?)."}},"mistakes":{"no-aux":"Perguntas com outros verbos precisam de do / does (did no passado).","third-s":"O -s fica no does, então o verbo fica na forma base.","be-order":"Com be, o verbo vem antes do sujeito.","name":"Em português se diz “Como é o seu nome?”, mas em inglês se pergunta com what.","age":"Idade usa o verbo be: I am 12. How old are you?","hour":"Que horas = what time. Hour é uma hora de sessenta minutos.","did-past":"O did já mostra o passado, então o verbo fica na forma base.","much-many":"Many para coisas que se contam (books, friends), much para as que não se contam (money, time, water).","why-because":"Why pergunta, because responde: Why are you late? Because I missed the bus.","subject":"Quando who ou what é o sujeito (quem fez a ação), não tem do / does / did.","prep":"No inglês do dia a dia, a preposição vai para o final.","perfect":"Algo que começou no passado e continua agora pede o present perfect (o português usa o presente).","like":"Para pedir uma descrição: what … like, e não how … like."},"curious":{"yesno":{"t":"Perguntas sem palavra interrogativa","x":"Perguntas de sim ou não começam pelo verbo auxiliar: <b>Do you like pizza? Are you tired? Can you swim?<\/b> A mesma ordem, só que sem a palavra interrogativa."},"whom":{"t":"Who ou whom?","x":"<b>Whom<\/b> é a forma formal para quem recebe a ação (<b>Whom did you call?<\/b>). No dia a dia, todo mundo usa <b>who<\/b>."},"which":{"t":"What ou which?","x":"Os dois perguntam sobre uma escolha. <b>Which<\/b> quando as opções são poucas e conhecidas (<b>Which color, red or blue?<\/b>), <b>what<\/b> quando estão em aberto (<b>What color is your car?<\/b>)."},"front":{"t":"A preposição no começo","x":"O inglês formal pode deixar a preposição na frente: <b>With whom did you travel?<\/b> Soa bem formal. O que se diz é <b>Who did you travel with?<\/b>"},"howcome":{"t":"How come?","x":"Jeito informal de dizer <b>why<\/b>, mas na ordem normal, sem verbo auxiliar: <b>How come you're late?<\/b> = <b>Why are you late?<\/b>"}},"map":[{"src":"Qual é o seu nome?","en":"[What] {is} your name?","note":"Qual é… quase sempre vira what is… Which é para escolher entre poucas opções.","noteEn":"Qual é… usually becomes what is… Which is for choosing between a few options."},{"src":"Quantos anos você tem?","en":"[How old] {are} you?","note":"Nada de have: idade usa be.","noteEn":"No have: age uses be."},{"src":"Como é a sua cidade?","en":"[What] {is} your city [like]?","note":"Como você está? = How are you? Mas Como é…? (uma descrição) vira what … like.","noteEn":"Como você está? = How are you? But Como é…? (a description) becomes what … like."},{"src":"Por que você está rindo?","en":"[Why] {are} you laughing?","note":"Por que pergunta (why), porque responde (because).","noteEn":"Por que asks (why), porque answers (because)."},{"src":"Quanto custa?","en":"[How much] {is} it?","note":"Preço é how much. E “costed” não existe: It cost ten dollars.","noteEn":"A price is how much. And “costed” doesn't exist: It cost ten dollars."},{"src":"Onde fica o banco?","en":"[Where] {is} the bank?","note":"Fica = is, não stay.","noteEn":"Fica = is, not stay."},{"src":"Tem uma farmácia aqui perto?","en":"{Is} there a pharmacy near here?","note":"Tem (= existe) é there is / there are, não have.","noteEn":"Tem (= there is) is there is / there are, not have."},{"src":"De quem é este celular?","en":"[Whose] phone {is} this?","note":"De quem = whose, normalmente logo antes da coisa.","noteEn":"De quem = whose, usually right before the thing."},{"src":"Com quem você mora?","en":"[Who] {do} you live with?","note":"A preposição (com, para, de, sobre…) vai para o final.","noteEn":"The preposition (com, para, de, sobre…) goes to the end."},{"src":"Que horas são?","en":"[What time] {is} it?","note":"Que horas = what time, não “what hour”.","noteEn":"Que horas = what time, not “what hour”."},{"src":"Há quanto tempo você mora aqui?","en":"[How long] {have} you lived here?","note":"Há quanto tempo + presente vira how long + present perfect.","noteEn":"Há quanto tempo + present becomes how long + present perfect."},{"src":"Com que frequência você vai à academia?","en":"[How often] {do} you go to the gym?","note":"Responda com always, every day, twice a week…","noteEn":"Answer with always, every day, twice a week…"},{"src":"Quem te ligou?","en":"[Who] called you?","note":"Quem fez a ação: sem did. Quem recebeu a ação: Para quem você ligou? = Who did you call?","noteEn":"The one who did it: no did. The one it was done to: Para quem você ligou? = Who did you call?"}]},"tour":{"ui":{"step":"Passo {n} de {total}","back":"Voltar","next":"Próximo","play":"Vamos jogar!","close":"Fechar o tutorial"},"steps":{"welcome":{"t":"Pronto para praticar perguntas?","x":"Cada jogo tem <b>5 rodadas<\/b>. Numa rodada de <b>Montar<\/b>, você monta uma pergunta a partir da tradução. Numa rodada de <b>Ligar<\/b>, você liga perguntas às respostas."},"level":{"t":"Escolha o seu nível","x":"<b>A1<\/b>: perguntas com be, do e can (what, where, who, how old…). <b>A2<\/b> acrescenta o passado, o futuro, why, which, whose, how much, how often… <b>B1<\/b> acrescenta perguntas sobre o sujeito (<b>Who called you?<\/b>), o present perfect e preposições no final (<b>Who are you waiting for?<\/b>)."},"prompt":{"t":"Leia na sua língua","x":"Numa rodada de Montar, você vê uma pergunta na sua língua, com a resposta embaixo, para saber do que se trata. Sua tarefa: dizer em inglês. Quando o inglês funciona bem diferente, um aviso de <b>Atenção<\/b> aparece antes."},"answer":{"t":"Monte em inglês","x":"<b>Toque<\/b> numa palavra para colocá-la no próximo espaço vazio, ou <b>arraste<\/b> até um espaço. Toque numa palavra colocada para devolvê-la. Nas perguntas longas, algumas palavras já estão no lugar (nunca a palavra interrogativa nem o ve // True when the chosen level shows its text in the translation language.

/* 07-back.js — copied from Present Perfect Bubbles (../present perfect practice): the phone's back gesture (or the
   browser's Back) closes the open window instead of leaving the page: Favorites / Seen, the end card, the Guide, the
   tutorial and the Play menu; in any other mode (Matching, Building…) it goes back to a mixed game. Each window holds a history
   entry while it is open. A MutationObserver sees it open and close, whatever closed it (✕, Escape, a click outside, a
   button), so the entry is added and taken back in one place. Back closes the window opened last. A new window needs one
   backLayer(el, isOpen, close) call. */
// Our history entries must not bring back an old scroll position (the page scrolls itself to the result card).
try { history.scrollRestoration = "manual"; } catch (e) {}
const BACK = [];     // open windows, oldest first: { el, close, pushed }
let backSkip = 0;    // our own history.back() calls, whose popstate is not a Back press
// A window that opens while one of those history.back() calls is still on its way (the Play menu closes and Review missed
// starts in the same click) waits for it: the browser aims history.back() when it is called, so an entry pushed in
// between would be swept away with it, and the next Back would leave the page. Pushed once the popstate arrives.
const pendingPush = [];
function pushEntry(L) { try { history.pushState({ layer: 1 }, ""); L.pushed = true; } catch (e) { L.pushed = false; } }   // a file:// page may refuse
// el: the window's element; isOpen(): whether it shows; close(): what Back does (the same as its ✕ or Escape).
function backLayer(el, isOpen, close) {
  const L = { el, close, pushed: false, byBack: false };
  let was = isOpen();
  new MutationObserver(() => {
    const now = isOpen(); if (now === was) return; was = now;
    if (now) {
      if (backSkip) pendingPush.push(L); else pushEntry(L);
      BACK.push(L);
    } else {
      const i = BACK.indexOf(L); if (i >= 0) BACK.splice(i, 1);
      const p = pendingPush.indexOf(L); if (p >= 0) pendingPush.splice(p, 1);   // closed before its entry was even added
      // Closed by the game, not by Back: take its history entry away, so the next Back isn't a dead press.
      if (L.pushed && !L.byBack) { backSkip++; history.back(); }
      L.pushed = false;
    }
  }).observe(el, { attributes: true, attributeFilter: ["class", "hidden"] });
}
window.addEventListener("popstate", () => {
  if (backSkip) { backSkip--; if (!backSkip) pendingPush.splice(0).forEach(pushEntry); return; }
  const L = BACK[BACK.length - 1]; if (!L) return;
  L.byBack = true; L.close(); setTimeout(() => { L.byBack = false; }, 0);   // the observer has run by then
});
// Header pop-ups (01-theme.js, 02-sound.js; from the sibling games): the back gesture closes them too.
backLayer(swwrap, () => swwrap.classList.contains("open"), () => swOpen(false));
backLayer(volwrap, () => volwrap.classList.contains("open"), () => volwrap.classList.remove("open"));

/* 08-sky.js — background bubbles drifting up behind everything (from Be Do Modal, via English Bubbles): 7 see-through,
   softly blurred bubbles of random size (40-140 px), place and pace (95-145 s a climb). At load they are already
   part-way up and the layer fades in. Transform / opacity only; none with reduced motion. Look: .sky in 23-sky.css. */
(function () {
  const host = $("sky");
  if (!host || reduceMotion) return;
  const hues = [215, 330, 150, 265, 30, 190];
  for (let k = 0; k < 7; k++) {
    const s = document.createElement("span"), size = 40 + Math.round(Math.random() * 100), t = 95 + Math.round(Math.random() * 50);
    const at = (0.15 + 0.65 * (k + Math.random() * 0.8) / 7) * t;   // a negative delay: 15% to 80% of the way up
    s.style.cssText = "width:" + size + "px;height:" + size + "px;left:" + Math.round(Math.random() * 96) + "%;" +
      "--h:" + hues[k % hues.length] + ";--t:" + t + "s;--d:-" + at.toFixed(1) + "s;--x:" + Math.round(Math.random() * 80 - 40) + "px";
    host.appendChild(s);
  }
  setTimeout(() => host.classList.add("in"), 60);   // a timer, not a frame: a page opened in the background gets none
})();

/* 10-game.js — the game. One game = ROUNDS rounds at the chosen level. Each round is a Build round (11-build.js: build a

   Every round is worth MAX_PTS, minus 1 per wrong try or wrong pair (min 0). Hints come from a pool for the whole game

const ROUNDS = 5, MAX_PTS = 3, MAX_TRIES = 3, MAX_HINTS = 2;

const PLAN = { normal: ["build", "match", "build", "match", "build"], match: Array(ROUNDS).fill("match") };
const lvl = () => DATA.levels[G.level] || {};
const hintPool = () => lvl().hints || 5;

/* ---------- Game flow ---------- */
// mode: "normal" (mixed) | "match" | "build" | "listen" | "review" | "fav" (22-modes.js); ids = the questions
// for a review / favorites game.
function newGame(level, mode = "normal", ids) {
  G.level = level; G.mode = mode; G.r = null; applyUi(); hush();
  document.body.classList.toggle("practice-mode", mode !== "normal");   // any other mode: Back returns to a mixed game (22-modes.js)
  G.pool = ids ? shuffle(ids.map(id => ITEM[id]).filter(Boolean)) : orderPool(DATA.items[level]);
  G.used = new Set();
  G.total = ids ? Math.min(ROUNDS, G.pool.length) : ROUNDS;
  G.idx = 0; G.score = 0; G.results = []; G.streak = 0; G.hintsLeft = hintPool(); G.quiz = null;
  closeRoundUi(); showScore(); showCombo();
  startRound();
}
const kindOf = i => (PLAN[G.mode] || [])[i] || "build";
// What kind of answer a question wants; a Match round never has two of the same (so every pair is clear).
const catOf = it => { const w = whOf(it); return w ? w.cat || w.id : "?"; };
// Next question for a Build round: the first in play order not used in this game (the pool starts over when it runs out).
function takeItem() {
  let it = G.pool.find(x => !G.used.has(x.id));
  if (!it) { G.used.clear(); it = G.pool[0]; }
  G.used.add(it.id); return it;
}
// Questions for a Match round, in play order, each with a different kind of answer; unused ones first. null if too few.
function takeSet(n) {
  const out = [], cats = new Set();
  const pick = list => list.forEach(x => { if (out.length < n && !out.includes(x) && !cats.has(catOf(x))) { out.push(x); cats.add(catOf(x)); } });
  pick(G.pool.filter(x => !G.used.has(x.id))); pick(G.pool);
  if (out.length < n) return null;
  out.forEach(x => G.used.add(x.id));
  return out;
}
function startRound() {
  closeRoundUi(); G.phase = "play";
  let kind = kindOf(G.idx);
  const set = kind === "match" ? takeSet(lvl().pairs || 4) : null;
  if (!set) kind = "build";
  if (kind === "match") startMatch(set); else startBuild(takeItem());
  updateProgress();
  stage.classList.remove("out"); stage.classList.add("rise");
  setTimeout(() => stage.classList.remove("rise"), 1400);
}
function nextRound() {
  if (G.phase !== "solved" && G.phase !== "revealed") return;
  G.phase = "idle"; hush();
  G.idx++;
  if (G.idx >= G.total) { updateProgress(); showEnd(); return; }
  stage.classList.add("out"); revealEl.classList.add("out"); footEl.classList.add("out");
  setTimeout(() => { revealEl.classList.remove("out"); footEl.classList.remove("out"); if (quizDue()) showQuiz(); else startRound(); }, reduceMotion ? 0 : 260);
}
// Back to an empty play area (no reveal card, quiz or Next bar).
function closeRoundUi() {
  revealEl.hidden = true; revealEl.innerHTML = ""; footEl.hidden = true; $("quiz").hidden = true; $("patnote").hidden = $("heads").hidden = true;
  stage.hidden = toolsEl.hidden = false;
}

/* ---------- Score, progress, tools ---------- */
// A round is over: add its points, keep the perfect streak (the chime climbs a tone with each), toast + particles.
function scoreRound(pts, el) {

// Best scores are kept per level for each way of playing with the level's questions; practice games keep none.
const BEST = { normal: "whq-best-", match: "whq-match-", build: "whq-build-", listen: "whq-listen-" };

function showCombo() { const c = $("combo"); c.hidden = G.streak < 2; c.textContent = "×" + G.streak; if (G.streak >= 2) flash(c, "tick"); }

/* ---------- Hint ---------- */
// Spends one hint from the game's pool (max MAX_HINTS per round): Build places a correct word, Match pairs one for you.
function useHint() {

/* 11-build.js — a Build round: the question in the player's language with its answer (in Listening: read aloud instead),
   an empty bubble with one slot per English word, and word bubbles (the right words + the traps in "dx") to tap or drag
   in (12-moves.js). When every slot is full it is checked at once. After a wrong try the words in the right place lock
   green, one line says what was wrong (whyWrong), and the rest fly home. Out of tries = the answer is shown, 0 points. */

const bubbleWords = q => qWords(q).map((w, i) => i === 0 && w !== "I" ? w.toLowerCase() : w);

function startBuild(it) {
  const ans = bubbleWords(it.q);
  G.r = { kind: "build", it, ans, alts: [ans].concat((it.alt || []).map(bubbleWords)), target: ans, slots: Array(ans.length).fill(null),
    slotEls: [], words: [], tries: 0, hints: 0, maxTries: (DATA.levels[levelOf(it)] || {}).tries || MAX_TRIES };
  boardEl.hidden = true; buildEl.hidden = false; cloud.hidden = false;
  qbox.className = "qbox"; $("patnote").hidden = true; patBtn.setAttribute("aria-pressed", "false");
  // Heads up (before answering) where English is built very differently; not in Listening, where it would give the
  // question away before it is heard.

  renderPrompt(); renderSlots(); renderCloud(); renderTools();
  hintEl.innerHTML = tx(G.mode === "listen" ? "buildListen" : "build", { n: G.r.slots.filter(x => !x).length });
  if (G.mode === "listen") setTimeout(() => { if (G.r && G.r.it === it && G.phase === "play") speak(it.q, $("plisten")); }, 600);
}
// The question to say in English: translation + its answer, or (Listening, until it is done) Listen / Slower buttons.
function renderPrompt() {
  const r = G.r, tr = trOf(r.it);
  if (G.mode === "listen" && G.phase === "play") {
    promptEl.innerHTML = '<span class="tag">' + tx("tagListen") + '</span><div class="plisten">' +
      '<button type="button" class="pbtn big" id="plisten">' + ICON_SAY + " " + tx("listen") + "</button>" +
      '<button type="button" class="pbtn" id="pslow">' + tx("slower") + "</button></div>";
    $("plisten").addEventListener("click", () => speak(r.it.q, $("plisten")));
    $("pslow").addEventListener("click", () => speak(r.it.q, $("pslow"), { rate: .6 }));
    return;
  }
  promptEl.innerHTML = '<span class="tag">' + tx("tagSay") + "</span>" + badgeHTML() +
    '<div class="ptxt" lang="' + esc(curLang) + '"><p class="pq">' + esc(tr ? tr.q : r.it.q) + "</p>" +
    (tr && tr.a ? '<p class="pa">— ' + esc(tr.a) + "</p>" : "") + "</div>";
}
function renderSlots() {
  const r = G.r;
  qbox.querySelector(".tag").textContent = tx("tagYours");
  slotsEl.innerHTML = "";
  r.slotEls = r.ans.map((_, j) => { const d = document.createElement("span"); d.className = "slot"; d.dataset.i = j; slotsEl.appendChild(d); return d; });
  slotsEl.insertAdjacentHTML("beforeend", '<span class="punct">?</span>');
}
// Right words and traps, shuffled, each in a "home" that keeps its place (as a dashed ghost) while the word is away.
// Words of a long question start in their slot (prefill), so the player fills at most the level's "blanks".
function renderCloud() {
  const r = G.r, dx = r.it.dx, pre = prefill(r);
  cloud.innerHTML = "";
  r.words = shuffle(r.ans.filter((_, i) => !pre.includes(i)).concat(dx)).map((t, n) => { const W = mkWord(t, n); cloud.appendChild(W.home); return W; });
  pre.forEach(i => { const W = mkWord(r.ans[i], 0); setSlot(i, W); W.locked = true; W.el.classList.add("pre"); W.el.tabIndex = -1; r.words.push(W); });

// Which answer words start in their slot. Gaps first go to the question word, the helper verb and a preposition at the
// very end (never pre-filled), then to the words the traps aim at (a form of the same verb, another helper verb,
// preposition or pronoun), then any.

function mkWord(t, n) {

  home.className = "home"; home.style.setProperty("--d", n * 45 + "ms");
  b.type = "button"; b.className = "b w"; b.innerHTML = SOAP + '<span class="wl">' + esc(t) + "</span>";   // SOAP: 16-shine.js
  b.style.setProperty("--h", Math.round(rnd(0, 360)));
  b.style.setProperty("--bx", rnd(-6, 6).toFixed(1) + "px"); b.style.setProperty("--by", rnd(-8, 8).toFixed(1) + "px");
  b.style.setProperty("--dur", rnd(2.6, 4.6).toFixed(2) + "s"); b.style.setProperty("--dl", rnd(-4, 0).toFixed(2) + "s");
  b.style.setProperty("--ang", Math.round(rnd(0, 360)) + "deg");   // the soap film's starting angle (where it stays on touch screens)

<!-- English Bubbles app: the "All games" button (first thing in the game's header) and the offline copy -->
<style>
.eb-home {
  --eb-h: 287;
  position: relative; flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center; gap: .35em;
  height: 34px; min-width: 34px; padding: 0 11px 0 7px; margin: 0;              /* the games' round buttons are 34 px */
  border-radius: 999px; border: 1px solid hsla(var(--eb-h), 70%, 70%, .7);
  background: radial-gradient(120% 140% at 22% 14%, rgba(255,255,255,.95), rgba(255,255,255,.5) 55%, rgba(255,255,255,.25));
  box-shadow: inset 0 0 10px hsla(var(--eb-h), 95%, 80%, .45), 0 4px 10px rgba(60,70,140,.16);
  color: var(--ink, #26385c); font: 600 .85rem/1 "Fredoka", ui-rounded, system-ui, sans-serif; letter-spacing: .01em;
  text-decoration: none; cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease;
}
.eb-home svg { width: 18px; height: 18px; flex: none; }
.eb-home:hover, .eb-home:focus-visible { transform: translateY(-2px) scale(1.05); box-shadow: inset 0 0 14px hsla(var(--eb-h), 95%, 80%, .6), 0 8px 16px rgba(60,70,140,.2); }
.eb-home:active { transform: scale(.94); }
.eb-home:focus-visible { outline: 2px solid #e0558a; outline-offset: 3px; }
.eb-home.eb-float { position: fixed; z-index: 2147483000; left: calc(env(safe-area-inset-left, 0px) + 10px); top: calc(env(safe-area-inset-top, 0px) + 10px); }
@media (max-width: 640px) { .eb-home { padding: 0; width: 34px; } .eb-home span { display: none; } }
/* tight mode (only when the button would otherwise add a row to the header): a little less space between controls */
.eb-tight:not(.eb-home) { column-gap: 4px !important; }
.eb-home.eb-tight { width: 30px; min-width: 30px; height: 30px; padding: 0; }
.eb-home.eb-tight span { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .eb-home { background: radial-gradient(120% 140% at 22% 14%, rgba(255,255,255,.22), rgba(255,255,255,.08)); border-color: hsla(var(--eb-h), 70%, 70%, .55); }
}
:root[data-theme="dark"] .eb-home { background: radial-gradient(120% 140% at 22% 14%, rgba(255,255,255,.22), rgba(255,255,255,.08)); border-color: hsla(var(--eb-h), 70%, 70%, .55); }
@media (prefers-reduced-motion: reduce) { .eb-home { transition: none; } }
</style>
<script>
(function () {
  var MENU = "../index.html";
  var a = document.createElement("a");
  a.className = "eb-home";
  a.href = MENU;
  a.title = "All games · Todos os jogos";
  a.setAttribute("aria-label", "All games");
  // a simple house (2026-11-22, the user: "more reminiscent of home"; it was four little bubbles)
  a.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<path d="M3.5 11.2 12 4l8.5 7.2"/><path d="M6 9.4V19a1 1 0 0 0 1 1h3.6v-5.2h2.8V20H17a1 1 0 0 0 1-1V9.4"/></svg><span>Games</span>';
  // Back to the menu: if we came from it, go back (so the phone's back button doesn't return here); else open it.
  a.addEventListener("click", function (e) {
    e.preventDefault();
    var from = null;
    try { from = sessionStorage.getItem("eb-from-menu"); sessionStorage.removeItem("eb-from-menu"); } catch (x) {}
    var back = from === "questions" && history.length > 1;
    try { sessionStorage.setItem("eb-back", "1"); } catch (x) {}         // the menu skips its entrance animation
    document.documentElement.classList.add("eb-leaving");
    // Safety net (2026-11-24, the user: after reopening the app in a game, Games sometimes left only the background
    // on screen; the swipe-back gesture still worked): the phone can ignore history.back() from a script, so if this
    // page is still here shortly after asking, open the menu directly (replace: Back won't return to the faded game).
    var left = false;
    window.addEventListener("pagehide", function () { left = true; }, { once: true });
    var go = function () {
      if (!back) { location.href = MENU; return; }
      history.back();
      setTimeout(function () { if (!left) location.replace(MENU); }, 800);
    };
    // The menu's "open a game" pop + chime, played through the game's own tone() (so the game's volume and mute
    // apply); then leave once it has been heard.
    if (typeof tone === "function") {
      try { tone(900, 0, .07, .11, 420); tone(783.99, .03, .22, .1, 0, true); tone(1174.66, .07, .3, .07, 0, true); } catch (x) {}
      setTimeout(go, 240);
    } else go();
  });
  // In the game's header (the "dock"). The header must never get an extra row because of this button (phones: at
  // most two rows, the user's rule, 2026-11-17). So every place is tried, in order of preference: before the level
  // pills, right after them, then before / after each control, then inside a group of buttons (Verb Wheel's
  // .tools); the place that gives the shortest header wins (the first one on a tie). If every place still adds a
  // row, "tight" mode narrows the gaps between the header's controls and the button a little, and tries again.
  var dock = document.querySelector("header.dock, .dock");
  var tightened = [];
  function height() { return dock.getBoundingClientRect().height; }
  function spots() {
    var out = [], kids = [], i, c, lv = dock.querySelector(":scope > #levelseg");
    for (i = 0; i < dock.children.length; i++) if (dock.children[i] !== a) kids.push(dock.children[i]);
    if (lv) { out.push([dock, lv]); out.push([dock, lv.nextElementSibling === a ? a.nextElementSibling : lv.nextElementSibling]); }
    for (i = 0; i < kids.length; i++) out.push([dock, kids[i]]);
    out.push([dock, null]);
    for (i = 0; i < kids.length; i++) {
      c = kids[i];
      if (/\b(seg|swwrap|volwrap|lang|sw)\b/.test(c.className) || c.getAttribute("role") === "group") continue;
      var d = getComputedStyle(c).display;
      if ((d === "flex" || d === "inline-flex") && c.querySelectorAll(":scope > button").length >= 2) {
        out.push([c, c.firstElementChild]); out.push([c, null]);
      }
    }
    return out;
  }
  function best() {
    var s = spots(), win = null, h = Infinity, i, hi;
    for (i = 0; i < s.length; i++) {
      if (s[i][1] === a) continue;
      s[i][0].insertBefore(a, s[i][1]);
      hi = height();
      if (hi < h - 2) { h = hi; win = s[i]; }
    }
    win[0].insertBefore(a, win[1]);
    return h;
  }
  function tight(on) {
    tightened.forEach(function (el) { el.classList.remove("eb-tight"); });
    tightened = on ? [dock, a, a.parentNode] : [];
    tightened.forEach(function (el) { el.classList.add("eb-tight"); });
  }
  function place() {
    tight(false);
    var at = a.parentNode ? [a.parentNode, a.nextSibling] : null;
    if (a.parentNode) a.parentNode.removeChild(a);
    var base = height();                                     // the header as the game made it
    if (at) at[0].insertBefore(a, at[1]); else dock.appendChild(a);
    if (best() <= base + 4) return;
    tight(true);
    if (best() <= base + 4) return;
    tight(false); best();                                    // nothing helps: keep the normal look
  }
  if (dock) {
    // the slide-in has ended: the header gets its frosted blur back
    dock.addEventListener("animationend", function (e) { if (e.animationName === "eb-dock-in") document.documentElement.classList.remove("eb-arrive"); });
    setTimeout(function () { document.documentElement.classList.remove("eb-arrive"); }, 1500);   // in case it never ran
    place();
    var t = 0;
    window.addEventListener("resize", function () { clearTimeout(t); t = setTimeout(place, 150); });
    window.addEventListener("load", place);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
  } else { a.classList.add("eb-float"); document.body.appendChild(a); }

  // back here with the phone's Forward (or from the page cache): undo the fade
  window.addEventListener("pageshow", function () { document.documentElement.classList.remove("eb-leaving"); });

  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(function () {});
  }
})();
</script>
