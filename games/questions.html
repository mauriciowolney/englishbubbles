<!-- English Bubbles app (added by the app's build.py, not part of the game's own files) -->
<script>
/* early-theme.js — runs in <head>, before the first paint, in the menu AND in every game: puts on the background
   colour saved in eb-bg (the games' palettes, "p:sky" or "c:#7aa7ff"), so a page never flashes its default colour
   first. The page's own 01-theme.js applies the same colour again a moment later. Keep PAL in step with PALETTES
   (src/js/01-theme.js and the games). */
(function () {
  try {
    var PAL = {
      sky: ["#e4f3fb", "#f1e8fb", "#fdf0e6", 0], peach: ["#ffe6d8", "#ffd6e4", "#fff1c9", 0],
      mint: ["#d9f4e6", "#d3eef6", "#eef6d3", 0], lilac: ["#e9e0fb", "#f7d9ee", "#dbe6fb", 0],
      dusk: ["#2a1740", "#58224f", "#1f3560", 1], midnight: ["#141964", "#441464", "#144e64", 1]
    };
    var s = Storage.prototype.getItem.call(window.localStorage, "eb-bg") || "", c = null;
    if (s.indexOf("p:") === 0) c = PAL[s.slice(2)] || null;
    else if (/^c:#[0-9a-f]{6}$/i.test(s)) {
      var hex = s.slice(2), r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255,
        b = parseInt(hex.slice(5, 7), 16) / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b),
        l = (mx + mn) / 2, h = 0, sat = 0, d = mx - mn;
      if (d) {
        sat = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
        h = (mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) * 60;
      }
      var col = function (dh) { return "hsl(" + ((h + dh + 360) % 360).toFixed(0) + "," + (sat * 100).toFixed(0) + "%," + (l * 100).toFixed(0) + "%)"; };
      c = [col(0), col(40), col(-40), l * 100 < 52];
    }
    if (c) {
      var root = document.documentElement;
      root.style.setProperty("--bg-a", c[0]); root.style.setProperty("--bg-b", c[1]); root.style.setProperty("--bg-c", c[2]);
      root.dataset.theme = c[3] ? "dark" : "light";
    }
  } catch (e) {}
  // The phone's bars (theme-color) follow the background: its top colour --bg-a, set here or later by the page's own
  // colour picker (menu or game: both write --bg-a on <html>). No colour chosen: the default light / dark ones.
  try {
    var html = document.documentElement, last = "";
    var bar = function () {
      var a = html.style.getPropertyValue("--bg-a").trim(), m = document.querySelectorAll('meta[name="theme-color"]');
      for (var i = 0; i < m.length; i++) {
        var v = a || (/dark/.test(m[i].media) ? "#141964" : "#e4f3fb");
        if (m[i].content !== v) m[i].content = v;
      }
      last = a;
    };
    bar();
    document.addEventListener("DOMContentLoaded", bar);
    new MutationObserver(function () {
      if (html.style.getPropertyValue("--bg-a").trim() !== last) bar();
    }).observe(html, { attributes: true, attributeFilter: ["style"] });
  } catch (e) {}
})();

/* iPhone / iPad: ask for a "playback" audio session, so the game's sounds play even with Silent mode on (iOS 17+;
   some games already do this themselves). Websites can't detect Silent mode, so the menu also shows a tip. */
try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
document.documentElement.classList.add("eb-arrive");   /* the header slides in (see the style below) */
</script>
<style>
/* A soft cross-fade between the menu and the games (Chrome; other browsers just switch). Both pages opt in. */
@media (prefers-reduced-motion: no-preference) {
  @view-transition { navigation: auto; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .25s; animation-timing-function: ease-out; }
}
/* The header slides down in from the top when a page arrives (html.eb-arrive, set in <head>, removed when the slide
   ends). It is the real header that moves, not a view-transition snapshot: a snapshot can't show the frosted-glass
   blur (a flat bar showed on PC) and was choppy on Android. The blur is off only while it moves (it is the costly
   part); it returns when the slide ends. */
@media (prefers-reduced-motion: no-preference) {
  html.eb-arrive header.dock { animation: eb-dock-in .48s cubic-bezier(.22,1,.36,1) both; will-change: transform, opacity;
    -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
}
@keyframes eb-dock-in { from { transform: translateY(calc(-100% - 28px)); opacity: 0; } }
/* Leaving with the Games button: the game fades away completely while its sound plays, leaving only its background,
   which is the menu's colour too; the menu then fades in on top. (Half-faded, the page froze on a dim picture while
   the menu loaded: "laggy".) */
html.eb-leaving body { opacity: 0; transition: opacity .22s ease-in; pointer-events: none; }
</style>
<script>
/* Every game saves its progress in the phone's storage. In the app all games share one storage, so each game's
   keys get the prefix "eb:questions:" here; two games can then use the same key names without overwriting each other.
   One exception: the background colour (every game saves it as "<prefix>-bg", e.g. "p:sky" or "c:#7aa7ff", like
   the menu) is ONE setting for the whole app, kept under the menu's key "eb-bg": the game opens with the colour
   chosen in the menu, and a colour chosen in a game becomes the menu's and the other games' too. */
(function () {
  try {
    var P = "eb:questions:", L = window.localStorage, S = Storage.prototype, BG = /^[a-z]+-bg$/;
    var get = S.getItem, set = S.setItem, del = S.removeItem;
    /* The EN / PT toggles too: ONE language for the whole app, the menu's (eb-lang). Each game saves its toggles
       under its own keys, with its own word for Portuguese (games.json "lang": "pt", "tr" or "native"; English is
       always "en"): reading one gives the menu's language, and a tap in a game changes the menu's and every
       game's. Until EN / PT is chosen, the menu's own rule: Portuguese for My level All / A1 / A2, English from B1. */
    var LG = {"whq-guide-lang": "tr", "whq-tour-lang": "tr"};
    function appLang() {
      var l = get.call(L, "eb-lang");
      if (l === "en" || l === "pt") return l;
      var lv = get.call(L, "eb-level");
      return lv === "B1" || lv === "B2+" ? "en" : "pt";
    }
    S.getItem = function (k) {
      if (this === L && BG.test(k)) { var app = get.call(this, "eb-bg"); if (app) return app; }
      if (this === L && LG.hasOwnProperty(k)) return appLang() === "en" ? "en" : LG[k];
      return get.call(this, this === L ? P + k : k);
    };
    S.setItem = function (k, v) {
      if (this === L && BG.test(k)) set.call(this, "eb-bg", v);
      if (this === L && LG.hasOwnProperty(k)) set.call(this, "eb-lang", String(v) === "en" ? "en" : "pt");
      return set.call(this, this === L ? P + k : k, v);
    };
    S.removeItem = function (k) { return del.call(this, this === L ? P + k : k); };
    /* Opened from the menu (a card or Continue)? Then the game starts at the menu's level ("My level"): the menu
       leaves a one-time note (sessionStorage eb-level-go), and the matching level is saved under the game's own
       level key before the game reads it (games.json "level"; the nearest level when the game doesn't have it).
       With "All" on the menu, or on a reload, the game keeps its own last level. */
    var LV = {"key": "whq-level", "A1": "A1", "A2": "A2", "B1": "B1", "B2+": "B1"}, SS = window.sessionStorage;
    if (SS.getItem("eb-level-go") === "questions") {
      SS.removeItem("eb-level-go");
      var m = get.call(L, "eb-level");
      if (LV && LV[m]) set.call(L, P + LV.key, LV[m]);
    }
  } catch (e) {}
})();
</script>

/* Controls */
.dock {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  z-index: 5;
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
  gap: 8px 14px;
  width: max-content; max-width: calc(100% - 24px);
  margin: 14px auto 0;
  padding: 6px 8px;
  border-radius: 28px;
  background: var(--dock-bg);
  border: 1px solid var(--dock-line);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: 0 8px 22px var(--shadow);
}
.seg { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; max-width: 100%; }
.seg button {
  appearance: none; border: 0; cursor: pointer;
  font-family: inherit; font-weight: 500; font-size: .95rem; line-height: 1;
  color: var(--ink); background: transparent;
  padding: .62em 1.1em; border-radius: 999px; white-space: nowrap;
  transition: background-color .2s ease, color .2s ease, transform .2s ease;
}
.seg button:hover { background: var(--dock-line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg-a); }
.sw { display: flex; align-items: center; gap: 8px 0; padding: 0 4px; }   /* circles spaced by margins, so the colour picker row never widens the pop-over */
.sw > button + button { margin-left: 8px; }
.sw button {
  position: relative; display: block; flex: none;
  width: 30px; height: 30px; padding: 0; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.9); cursor: pointer;
  box-shadow: 0 1px 5px var(--shadow);
  transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease;
}
.sw button:hover { transform: scale(1.12); }
.sw .on { box-shadow: 0 0 0 2px var(--dock-bg), 0 0 0 4px var(--ink); }
.sw .swc { background: conic-gradient(#ff7aa8, #ffd36b, #7be0a4, #6bc7ff, #b08cff, #ff7aa8); }
.dock button:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }

/* Glass bubble */
.b {
  --h: 200;
  position: relative;
  appearance: none; cursor: pointer;
  font-family: inherit; font-weight: 500;
  font-size: clamp(1.05rem, 1.5vw + .7rem, 1.4rem);
  line-height: 1;
  letter-spacing: .01em;
  color: var(--ink);
  padding: .78em 1.35em .82em;
  border-radius: 1.5em;
  border: 1.5px solid hsla(var(--h), 75%, var(--rim-l), .75);
  background: radial-gradient(120% 140% at 22% 14%, var(--fill-hi), var(--fill-mid) 48%, var(--fill-lo) 100%);
  box-shadow:
    inset 0 0 16px hsla(var(--h), 95%, var(--glow-l), .38),
    inset -5px -7px 14px hsla(calc(var(--h) + 70), 95%, var(--glow-l), .28),
    0 7px 16px var(--shadow);
  transition: transform .28s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease, border-color .25s ease;
}
.b::before {
  content: ""; position: absolute; left: 11%; top: 9%; width: 26%; height: 20%;
  border-radius: 50%;
  background: radial-gradient(closest-side, var(--gloss), transparent);
  transform: rotate(-14deg); opacity: .8; pointer-events: none; transition: opacity .25s ease;
}

  content: ""; position: absolute; right: 9%; bottom: 12%; width: 7%; height: 12%;
  border-radius: 50%; background: var(--gloss); opacity: .35; pointer-events: none;

.b:hover, .b:focus-visible, .b.playing {

/* Language picker */
.lang { display: flex; align-items: center; gap: .55rem; min-width: 0; max-width: 100%; padding: 0 4px; font-weight: 500; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* The language picker is a glass pill (badge, name, chevron) that opens a list of glass options. The real <select>
   stays in the page, hidden, and holds the value; the pill and the list just set it. */
.pick {
  appearance: none; cursor: pointer; display: flex; align-items: center; gap: .55em; width: 100%; min-width: 0;
  padding: .32em .6em .32em .34em; border-radius: 999px;
  font-family: inherit; font-weight: 500; font-size: .95rem; line-height: 1.2; color: var(--ink); text-align: left;
  background: linear-gradient(180deg, var(--fill-hi), var(--fill-mid));

/* In the header only the colored badge shows; the language name stays for screen readers and the tooltip */
.pick-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pick-chev { flex: none; opacity: .7; transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
.pick[aria-expanded="true"] .pick-chev { transform: rotate(180deg); }
.pick-badge {
  flex: none; display: inline-grid; place-items: center; min-width: 2.35em; height: 1.85em; padding: 0 .55em; white-space: nowrap;
  border-radius: 999px; font-size: .74em; font-weight: 600; letter-spacing: .04em; color: #fff;
  background: var(--g, linear-gradient(135deg, #ff5ea8, #8a5cff)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35);
  text-shadow: 0 1px 1px rgba(0, 0, 0, .18);
}
.pick-list {
  position: fixed; z-index: 40; display: flex; flex-direction: column; gap: 2px; box-sizing: border-box;
  max-height: min(76vh, 500px); overflow-y: auto; overscroll-behavior: contain;

@media (max-width: 600px) {

@media (prefers-reduced-motion: reduce) { .pick, .pick-chev, .pick-list, .pick-check { animation: none; transition: none; } }
#snd { display: inline-flex; align-items: center; justify-content: center; padding: .5em .75em; }
#snd svg { display: block; }
/* Volume */
.volwrap { position: relative; display: flex; flex: 1 1 auto; justify-content: center; }
.volp { position: absolute; top: calc(100% + 10px); left: 50%; z-index: 30; display: flex; align-items: center; padding: 10px 16px; border-radius: 24px; background: var(--bg-a); border: 1px solid var(--dock-line); box-shadow: 0 10px 26px var(--shadow); opacity: 0; visibility: hidden; transform: translateX(-50%) translateY(-6px) scale(.5, .8); transform-origin: top center; transition: opacity .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1), visibility 0s linear .25s; }
.volp::before { content: ""; position: absolute; left: 0; right: 0; top: -12px; height: 12px; }
.volp input { width: 140px; margin: 0; cursor: pointer; accent-color: hsl(300,70%,58%); }

@media (hover: hover) { .volwrap:hover .volp { opacity: 1; visibility: visible; transform: translateX(-50%); transition-delay: 0s; } }
/* Score, progress, tiles, CTA (from template 2) */
.go { display: grid; grid-template-columns: 78px 1fr 78px; align-items: center; column-gap: 10px; max-width: 680px; margin: 20px auto 0; }
.score { cursor: pointer; font: inherit; color: var(--ink); transition: transform .28s cubic-bezier(.34,1.56,.64,1), background .35s ease, box-shadow .35s ease; }
.score:hover { transform: translateY(-2px); }
.score, .tile { justify-self: start; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 78px; height: 54px; padding: 0 8px; border-radius: 18px; background: var(--dock-bg); border: 1px solid var(--dock-line); box-shadow: 0 4px 12px var(--shadow); line-height: 1.05; text-align: center; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: background .35s ease, box-shadow .35s ease; }
.tile { justify-self: end; color: var(--ink); font: inherit; cursor: pointer; transition: transform .28s cubic-bezier(.34,1.56,.64,1), background-color .2s ease; }
.tile:hover { transform: translateY(-2px); background: var(--fill-hi); }
.tile:active { transform: scale(.96); }
.tile svg { display: block; transition: transform .5s cubic-bezier(.34,1.56,.64,1); }
.tile:hover svg { transform: rotate(-200deg); }
.tile small { font-size: .68rem; opacity: .75; white-space: nowrap; line-height: 1.05; }
.tile:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.score b { font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.score small { font-size: .68rem; opacity: .75; white-space: nowrap; }
.score.up { animation: scup .5s cubic-bezier(.34,1.56,.64,1); }
.score.down { animation: scdn .5s ease; }
.score.win { background: hsla(45,100%,80%,.92); box-shadow: 0 0 0 3px hsla(45,95%,60%,.55), 0 6px 18px var(--shadow); animation: scwin .8s cubic-bezier(.34,1.56,.64,1); }
.score.win b, .score.win small { color: #5a3d00; opacity: 1; }
@keyframes scup { 0% { transform: none; } 35% { transform: translateY(-8px) scale(1.22); background: hsla(150,75%,78%,.95); } 100% { transform: none; } }
@keyframes scdn { 0%, 100% { transform: none; } 20% { transform: translateX(-7px) scale(.94); background: hsla(350,85%,82%,.95); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
@keyframes scwin { 0% { transform: scale(1); } 40% { transform: scale(1.3) rotate(-4deg); } 70% { transform: scale(.95) rotate(2deg); } 100% { transform: scale(1); } }
.prog { width: min(100%, 300px); justify-self: center; text-align: center; }
.prog span { font-size: .9rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.cta { font-size: 1rem; font-weight: 600; padding: .6em 1.5em; border: 0; border-radius: 999px; cursor: pointer; color: #fff; background: linear-gradient(135deg, hsl(315,85%,68%), hsl(275,80%,68%)); box-shadow: 0 3px 9px hsla(295,70%,55%,.22); transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease; }
.cta:hover { transform: scale(1.05); box-shadow: 0 4px 12px hsla(295,70%,55%,.3); }   /* lighter pink-to-purple, softer glow (from the sibling games) */
.cta:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.cta.pulse { animation: pulse 1.4s ease-in-out infinite; }
html, body { overflow-x: clip; }
/* Tutorial */
/* Tutorial: the dock button, then a guided tour. A spotlight glides from feature to feature (its huge shadow is the
   dimming), and a card next to it explains each one. */
.tourbtn {
  appearance: none; cursor: pointer; flex: none; position: relative;
  display: inline-flex; align-items: center; gap: .4em;
  padding: .55em .95em .55em .7em; border-radius: 999px;
  font-family: inherit; font-weight: 500; font-size: .92rem; line-height: 1;
  color: var(--ink); background: transparent; border: 1px solid var(--dock-line);
  transition: background-color .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
}

.tourbtn:hover { background: var(--dock-line); transform: translateY(-1px); }
.tourbtn:active { transform: scale(.96); }

.tour { position: fixed; inset: 0; z-index: 50; touch-action: none; }
.tour[hidden] { display: none; }
.tour-shield { position: absolute; inset: 0; }
.tour-spot {
  position: fixed; left: 50%; top: 50%; width: 0; height: 0; border-radius: 22px; pointer-events: none;
  box-shadow: 0 0 0 200vmax rgba(8, 12, 36, .62), 0 0 0 3px rgba(255, 255, 255, .9), 0 0 26px 6px rgba(255, 140, 200, .55);
}
.tour-spot::after {
  content: ""; position: absolute; inset: -6px; border-radius: inherit; border: 2px solid rgba(255, 255, 255, .8);
  animation: tourglow 1.8s ease-out infinite;
}
.tour-spot.none::after { display: none; }
@keyframes tourglow { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.06); } }
.tour-card {
  position: fixed; left: 50%; top: 50%; width: min(380px, calc(100vw - 32px)); box-sizing: border-box;
  display: flex; flex-direction: column; gap: .45rem;
  padding: 1.05rem 1.15rem 1rem; border-radius: 1.4rem;
  color: var(--ink); background: var(--dock-bg); border: 1px solid var(--dock-line);   /* the header's frosted glass (from Be Do Modal) */
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: 0 22px 50px rgba(0, 0, 0, .3);
}
.tour-card.in { animation: tourcard .34s cubic-bezier(.2,.9,.3,1.15); }
@keyframes tourcard { from { opacity: 0; transform: translateY(10px) scale(.96); } }
.tour-step { margin: 0; padding-right: 2rem; font-size: .72rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; opacity: .6; }
.tour-title { margin: 0; padding-right: 1.6rem; font-family: inherit; font-size: 1.32rem; font-weight: 600; line-height: 1.2; }
.tour-text { margin: 0; font-size: .98rem; line-height: 1.45; }

.tour-foot { display: flex; align-items: center; justify-content: space-between; gap: .6rem; margin-top: .45rem; }
.tour-dots { display: flex; gap: 4px; min-width: 0; }
.tour-dots[hidden], .tour-back[hidden] { display: none; }
.tour-dots span { flex: none; width: 6px; height: 6px; border-radius: 99px; background: rgba(128,128,150,.35); transition: width .3s ease, background-color .3s ease; }
.tour-dots span.on { width: 16px; background: var(--underline); }
.tour-dots span.done { background: var(--underline); opacity: .55; }
.tour-nav { display: flex; gap: .4rem; flex: none; margin-left: auto; }
.tour-back, .tour-next {
  appearance: none; cursor: pointer; border: 0; border-radius: 999px;
  font-family: inherit; font-size: .92rem; font-weight: 500; line-height: 1; padding: .7em 1.15em;
  transition: transform .25s cubic-bezier(.34,1.56,.64,1), background-color .2s ease;
}
.tour-back { color: var(--ink); background: transparent; }
.tour-back:hover { background: var(--dock-line); }
.tour-next { color: #fff; font-weight: 600; background: linear-gradient(135deg, #ff5ea8, #c04dff 55%, #8a5cff); box-shadow: 0 4px 14px rgba(200, 77, 255, .4); }
.tour-next:hover { transform: scale(1.05); }
.tour-next:active, .tour-back:active { transform: scale(.96); }
.tour-x {
  appearance: none; cursor: pointer; border: 0; position: absolute; top: .55rem; right: .55rem;

.tourbtn:focus-visible, .tour-back:focus-visible, .tour-next:focus-visible, .tour-x:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.tour-pop { position: fixed; z-index: 51; width: 12px; height: 12px; border-radius: 50%; pointer-events: none; }
@media (max-width: 600px) {

@media (prefers-reduced-motion: reduce) { .tourbtn.fresh::after, .tour-spot::after, .tour-card.in { animation: none; } }

/* 20-game.css — the play area: hint line, pattern note, Build round (prompt bubble, question bubble with slots, word
   cloud), key-word colours, tools row, reveal card (dialogue, translation), toast, particles, tour additions, phones. */
[hidden] { display: none !important; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px 48px; }
#snd[aria-pressed="true"] { background: transparent; color: inherit; }
#snd[aria-pressed="true"]:hover { background: var(--dock-line); }
#snd[aria-pressed="false"] { opacity: .6; }
@media (max-width: 600px) { .seg.vseg { width: auto; } }
div.score { cursor: default; }
div.score:hover { transform: none; }
.hint { text-align: center; margin: 14px 12px 0; font-size: 1rem; opacity: .8; min-height: 1.4em; text-wrap: balance; }
.hint b { color: var(--underline); font-weight: 600; }
.pbtn { font: inherit; font-size: .9rem; font-weight: 500; padding: .5em 1em; border-radius: 999px; border: 1.5px solid var(--dock-line); background: var(--dock-bg); color: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background-color .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s ease; }
.pbtn:hover:not(:disabled) { background: var(--dock-line); transform: translateY(-1px); }
.pbtn:disabled { opacity: .35; cursor: default; }
.pbtn:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.pbtn small { font-size: .74rem; opacity: .65; }
.pbtn.speaking { background: var(--dock-line); }
.pbtn svg { flex: none; }
/* Heads up: a warm note under the hint line, before answering, where English works very differently */
.heads { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 10px; width: fit-content; max-width: min(640px, calc(100% - 24px));
  margin: 10px auto 22px; padding: 6px 14px 6px 8px;   /* 22px below (it merges with #stage's 14px): room for the prompt's label on its top edge */ border-radius: 18px; font-size: .95rem; line-height: 1.35; text-align: center; text-wrap: balance;
  background: hsla(45,95%,62%,.14); border: 1px solid hsla(42,85%,55%,.45); box-shadow: 0 6px 16px var(--soap-sh); }   /* a flat amber card (as Conditional Bubbles', 2026-11-22) */
.heads.in { animation: pup .4s ease-out; }
.chip.hu { --h: 32; font-size: .62rem; padding: .3em .8em; }
/* Pattern note under the hint line (Pattern button) */
.patnote { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 10px; margin: 8px 12px 0; font-size: .95rem; text-align: center; animation: pup .35s ease-out; }
.patnote .chip { font-size: .62rem; padding: .3em .75em; }
#patbtn[aria-pressed="true"] { border-color: var(--underline); }

/* Question word (k1) and helper verb (k2): the same colours everywhere (questions, formulas, word bubbles) */
.k1, .k2 { font-weight: 700; }
.k1 { color: hsl(330,72%,var(--lab-l)); }
.k2 { color: hsl(205,78%,var(--lab-l)); }
.w.k1 { color: hsl(330,72%,var(--lab-l)); border-color: hsla(330,75%,var(--rim-l),.95); }
.w.k2 { color: hsl(205,78%,var(--lab-l)); border-color: hsla(205,75%,var(--rim-l),.95); }

/* Stage */
#stage { position: relative; display: flex; flex-direction: column; align-items: center; max-width: 920px; margin: 14px auto 0; transition: opacity .25s ease, transform .25s ease; }
#stage.out { opacity: 0; transform: translateY(-10px); }
#stage.rise .home { animation: rise .6s cubic-bezier(.2,.8,.3,1) backwards; animation-delay: var(--d, 0s); }
#stage.rise .prompt, #stage.rise .qbox { animation: rise .5s cubic-bezier(.2,.8,.3,1) backwards; }
#stage.rise .qbox { animation-delay: .08s; }
.build { display: flex; flex-direction: column; align-items: center; gap: 26px; width: 100%; }

/* The question in the player's language (or Listen buttons) */
.prompt { --h: 45; position: relative; display: flex; align-items: center; justify-content: center; gap: 14px; width: min(100%, 640px); min-height: 96px;
  padding: 1.5em 1.4em 1.15em; border-radius: 1.8em; color: var(--ink);
  background: var(--dock-bg); border: 1px solid var(--dock-line);   /* the header's frosted glass (from Be Do Modal, 2026-11-22) */
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: 0 8px 22px var(--shadow); }
.prompt > .pick-badge { font-size: .8rem; align-self: center; }
.ptxt { min-width: 0; text-align: left; }
/* Smaller than the English word bubbles, so the English stays the focus */
.pq { margin: 0; font-size: clamp(1rem, .4vw + .9rem, 1.18rem); font-weight: 500; line-height: 1.3; text-wrap: balance; }
.pa { margin: .3em 0 0; font-size: .88rem; opacity: .7; line-height: 1.3; }
.plisten { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.pbtn.big { font-size: 1.1rem; font-weight: 600; padding: .65em 1.4em; }
.tag { position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%); z-index: 2; padding: calc(.3em + 1.5px) calc(.85em + 1.5px); border-radius: 999px; white-space: nowrap;
  font-size: .68rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  /* a flat gradient pill in the box's colour, white text (Be Do Modal's labels): prompt yellow-orange, question pink-violet */
  color: #fff; background: linear-gradient(90deg, var(--g1, hsl(var(--h), 80%, 62%)), var(--g2, hsl(calc(var(--h) - 30), 65%, 60%))); text-shadow: 0 1px 1px rgba(0,0,0,.15); }
.prompt > .tag { --g1: hsl(45, 92%, 58%); --g2: hsl(27, 85%, 58%); }
.qbox > .tag { --g1: hsl(330, 80%, 62%); --g2: hsl(300, 60%, 60%); }

/* The question bubble: one slot per word, then "?" */
.qbox { --h: 330; position: relative; display: flex; align-items: center; justify-content: center; width: min(100%, 760px); min-height: 100px;
  padding: 1.55em 1.1em 1.15em; border-radius: 1.8em; color: var(--ink);
  background: var(--dock-bg); border: 1px solid var(--dock-line);   /* the header's glass; the colour is in the label, slots and rings */
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: 0 8px 22px var(--shadow);
  transition: box-shadow .3s ease, border-color .3s ease; }
.qbox.hot { border-color: hsla(var(--h),85%,62%,.9); box-shadow: 0 8px 22px var(--shadow), 0 0 0 5px hsla(var(--h),90%,70%,.24); }
.qbox.shake { animation: shake .5s ease; }
.qbox.solved { animation: merge .6s cubic-bezier(.34,1.56,.64,1); border-color: hsla(var(--h),85%,62%,.6); box-shadow: 0 8px 22px var(--shadow), 0 0 0 4px hsla(var(--h),90%,75%,.28); }
.slots { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px 6px; }
.slot { display: inline-flex; align-items: center; justify-content: center; min-width: 3.6em; min-height: 2.75em; border-radius: 999px;
  border: 2px dashed hsla(var(--h),60%,var(--rim-l),.85); transition: background-color .2s ease, border-color .2s ease; }
.slot.filled { border-color: transparent; min-width: 0; }
.slot.hot { background: hsla(var(--h),90%,70%,.28); border-color: hsla(var(--h),85%,60%,1); }
.punct { align-self: flex-end; font-size: 1.6rem; font-weight: 600; line-height: 1; margin: 0 0 .3em -1px; }

/* Word cloud under the question bubble */
.cloud { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 14px 12px; width: min(100%, 760px); min-height: 60px; }
.home { display: inline-flex; border-radius: 999px; transition: opacity .35s ease, transform .35s ease; }
.home.away { border: 1.5px dashed var(--dock-line); }
.home.gone { opacity: 0; transform: scale(.6); pointer-events: none; }
.b.w { font-size: 1.12rem; line-height: 1.1; padding: .58em 1.05em .62em; border-radius: 999px; white-space: nowrap; touch-action: none; user-select: none; -webkit-user-select: none; }
.cloud .w { animation: bob var(--dur, 4s) ease-in-out var(--dl, 0s) infinite alternate; }
@keyframes bob { from { translate: 0 0; } to { translate: var(--bx, 0px) var(--by, -6px); } }
.b.w:hover, .b.w:focus-visible { transform: translateY(-4px) scale(1.07); }
.w.drag { position: fixed; z-index: 60; margin: 0; pointer-events: none; animation: none; transition: none; transform: scale(1.1) rotate(-3deg);
  box-shadow: inset 0 0 22px hsla(var(--h),100%,var(--glow-l),.6), 0 18px 30px var(--shadow), 0 0 0 4px hsla(var(--h),90%,75%,.25); }
.w.ok, .w.shown { cursor: default; }
.w.ok:hover, .w.shown:hover { transform: none; }
.w.ok { border-color: hsl(150,60%,48%); box-shadow: inset 0 0 18px hsla(150,80%,60%,.45), 0 6px 14px var(--shadow); }
.w.bad { border-color: hsl(350,75%,60%); box-shadow: inset 0 0 18px hsla(350,90%,68%,.5), 0 6px 14px var(--shadow); animation: shake .5s ease; }
.w.shown { border-color: hsl(40,90%,55%); box-shadow: inset 0 0 18px hsla(45,95%,60%,.5), 0 6px 14px var(--shadow); }
/* Words that start in their slot (levels.json "blanks"): already there, quieter */
.w.pre { cursor: default; opacity: .78; box-shadow: inset 0 0 12px hsla(var(--h),80%,var(--glow-l),.25), 0 3px 8px var(--shadow); }
.w.pre:hover, .w.pre:active { transform: none; }
.w.hinted::after { content: ""; right: -3px; top: -3px; bottom: auto; width: 10px; height: 10px; background: hsl(45,95%,55%); opacity: 1; }
#hintleft.tick { display: inline-block; animation: tick .5s cubic-bezier(.34,1.56,.64,1); }
@keyframes tick { 0% { transform: scale(1); } 40% { transform: scale(1.5); color: hsl(45,95%,55%); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 15% { transform: translateX(-9px) rotate(-1.5deg); } 35% { transform: translateX(8px) rotate(1.2deg); } 55% { transform: translateX(-6px); } 75% { transform: translateX(4px); } }
@keyframes merge { 0% { transform: scale(.94); } 55% { transform: scale(1.05); } 100% { transform: scale(1); } }

/* Tools row */
.tools { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.trywrap { display: inline-flex; align-items: center; gap: 4px; }
.trylab { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
.tries { display: inline-flex; align-items: center; gap: 6px; padding: 0 6px; }
.tries i { width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(135deg, hsl(315,85%,68%), hsl(275,80%,68%)); box-shadow: 0 1px 4px var(--shadow); transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .3s ease; }
.tries i.used { opacity: .18; transform: scale(.65); }

/* Reveal card */
.reveal { position: relative; max-width: 640px; margin: 18px auto 0; padding: 16px 18px 18px; border-radius: 26px; text-align: center;
  background: var(--dock-bg); border: 1px solid var(--dock-line); box-shadow: 0 8px 22px var(--shadow);
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); animation: cardin .45s cubic-bezier(.34,1.56,.64,1); transition: opacity .25s ease; }
.reveal.out, .matchfoot.out { opacity: 0; }
.rv-head { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 12px; }
.chip { display: inline-block; font-size: .74rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: .38em .95em; border-radius: 999px; color: #fff; white-space: nowrap;
  background: linear-gradient(135deg, hsl(var(--h),75%,52%), hsl(calc(var(--h) + 35),70%,50%)); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); text-shadow: 0 1px 1px rgba(0,0,0,.18); }
.formula { font-size: .98rem; font-weight: 600; }
.rv-use { margin: 6px 0 0; font-size: .88rem; opacity: .75; }
/* The question and its answer as two chat bubbles */
.dlg { display: flex; flex-direction: column; gap: 8px; margin: 14px auto 0; max-width: 520px; animation: pup .45s .1s ease-out backwards; }
.dq, .da { margin: 0; padding: .6em 1em; border-radius: 20px; font-size: clamp(1.1rem, .6vw + 1rem, 1.3rem); font-weight: 500; line-height: 1.3; text-align: left; width: fit-content; max-width: 88%; }
.dq { align-self: flex-start; border-bottom-left-radius: 6px; background: hsla(330,90%,75%,.16); border: 1.5px solid hsla(330,75%,var(--rim-l),.8); }
.da { align-self: flex-end; border-bottom-right-radius: 6px; background: hsla(205,90%,72%,.16); border: 1.5px solid hsla(205,75%,var(--rim-l),.8); }
.rv-tr { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 12px 0 0; padding: 10px 14px; border-radius: 18px; background: var(--fill-mid); border: 1px solid var(--dock-line); animation: pup .5s .2s ease-out backwards; }
.rv-tr p { margin: 0; font-size: 1.02rem; font-weight: 500; text-align: left; line-height: 1.35; }
.rv-tr p span { opacity: .75; }
.rv-tr .pick-badge { font-size: .8rem; }
.rv-wh { margin: 10px 0 0; font-size: .9rem; animation: pup .5s .3s ease-out backwards; }
.rv-wh .chip { font-size: .64rem; padding: .3em .8em; margin-right: 2px; }
.rv-wn { opacity: .7; }
.rv-note { margin: 12px 0 0; padding: 8px 12px; border-radius: 14px; font-size: .9rem; background: hsla(45,95%,62%,.14); border: 1px solid hsla(42,85%,55%,.45); animation: pup .5s .4s ease-out backwards; }
.rv-note b { color: hsl(35,85%,var(--lab-l)); }
.rv-btns { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 16px; }
@keyframes cardin { from { opacity: 0; transform: scale(.92) translateY(12px); } }
@keyframes pup { from { opacity: 0; transform: translateY(10px); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }

/* Toast + confetti bubbles */
.toast { position: absolute; left: 50%; top: 0; z-index: 5; padding: .35em 1em; border-radius: 999px; font-weight: 600; white-space: nowrap; pointer-events: none;
  background: hsl(150,60%,42%); color: #fff; box-shadow: 0 6px 16px var(--shadow); animation: toast 1.7s ease-out forwards; }
.toast.zero { background: hsl(35,85%,48%); }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%,-40%) scale(.6); } 15% { opacity: 1; transform: translate(-50%,-115%) scale(1.08); } 75% { opacity: 1; transform: translate(-50%,-130%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-175%); } }
.pf { position: fixed; z-index: 55; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at 30% 30%, #fff, hsla(var(--h),85%,75%,.55)); border: 1px solid hsla(var(--h),85%,68%,.85); animation: pfly .8s ease-out forwards; }
@keyframes pfly { from { transform: translate(-50%,-50%) scale(.3); opacity: .95; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1); opacity: 0; } }

/* Tour spotlight glides between targets */
.tour-spot { transition: left .45s cubic-bezier(.3,1.15,.5,1), top .45s cubic-bezier(.3,1.15,.5,1), width .45s cubic-bezier(.3,1.15,.5,1), height .45s cubic-bezier(.3,1.15,.5,1); }
/* No glide until Next / Back (.glide, set in tourGo): the first card pops in where it belongs instead of flying in. */
.tour:not(.glide) .tour-card, .tour:not(.glide) .tour-spot { transition: none; }
.tour-card { transition: left .4s ease, top .4s ease; max-height: calc(100vh - 24px); overflow-y: auto; }
/* Tour header: step label + EN / translation toggle (kept clear of the close button) */
.tour-head { display: flex; align-items: center; gap: .6rem; padding-right: 2.2rem; }
.tour-head .tour-step { padding-right: 0; flex: 1; }
.tour-lang { display: flex; gap: 2px; padding: 2px; border-radius: 999px; border: 1px solid var(--dock-line); flex: none; }
.tour-lang button { appearance: none; border: 0; cursor: pointer; font-family: inherit; font-size: .7rem; font-weight: 600; letter-spacing: .06em; line-height: 1;
  padding: .45em .75em; border-radius: 999px; color: var(--ink); background: transparent; transition: background-color .2s ease, color .2s ease; }
.tour-lang button:hover { background: var(--dock-line); }
.tour-lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg-a); }
.tour-lang button:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
.tour-text .k1, .tour-text .k2 { color: inherit; }

@media (max-width: 600px) {
  .dock { gap: 6px 8px; }
  .build { gap: 22px; }
  .prompt { min-height: 80px; padding: 1.45em .95em 1em; gap: 10px; }
  .qbox { min-height: 86px; padding: 1.5em .7em 1em; }
  .b.w { font-size: 1rem; padding: .5em .85em .55em; }
  .slot { min-width: 3em; min-height: 2.5em; }
  .cloud { gap: 10px 8px; }
  .tools { margin-top: 18px; }
  .reveal { margin-top: 14px; padding: 14px 12px 16px; }
}
@media (prefers-reduced-motion: reduce) {
  #hintleft.tick, .cloud .w, .qbox.solved, .reveal, .dlg, .rv-tr, .rv-wh, .rv-note, .toast, .patnote, #stage.rise .home, #stage.rise .prompt, #stage.rise .qbox { animation: none !important; }
  .tour-spot, .tour-card, #stage { transition: none; }
}
/* Idle reminder on the hint button */
#hintbtn.nudge { animation: nudge .7s ease-in-out; }
@keyframes nudge { 0%, 100% { transform: none; } 15% { transform: rotate(-6deg) scale(1.08); } 35% { transform: rotate(5deg) scale(1.08); } 55% { transform: rotate(-3deg) scale(1.04); } 75% { transform: rotate(2deg); } }

/* Theme change (swapBg in 01-theme.js, from the sibling games): no transitions for that one style change; the old
   background fades away on top */
.theming body, .theming *, .theming *::before, .theming *::after { transition: none !important; }
.bgfade { position: fixed; inset: 0; z-index: -1; pointer-events: none; background-color: var(--fa);
  background-image: radial-gradient(60vmax 50vmax at 8% 6%, var(--fa), transparent 70%),
    radial-gradient(55vmax 45vmax at 95% 40%, var(--fb), transparent 70%),
    radial-gradient(60vmax 50vmax at 30% 100%, var(--fc), transparent 70%);
  transition: opacity .55s ease; will-change: opacity; }
.bgfade.fading { opacity: 0; }

/* Edge jitter (from the sibling games): while something rises on hover it gets an invisible strip below it reaching
   back past where its bottom edge was, so the cursor on that edge stays "inside" after the lift. Only while hovered.
   Word and Match bubbles lend their gloss dot (::after) to it. */
.score, .tile, .pbtn { position: relative; }
@media (hover: hover) {
  .b.w:hover:not(.drag):not(.ok):not(.shown):not(.hinted):not(.pre)::after, .b.mb:hover:not(.drag):not(.done):not(.miss):not(.hinted)::after,
  .score:hover::after, .tile:hover::after, .tourbtn:not(.fresh):hover::after, .pbtn:hover:not(:disabled)::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: -8px; width: auto; height: auto; border-radius: 0; background: none; opacity: 0; pointer-events: auto; }
  .b.mb:hover::after, .score:hover::after, .tile:hover::after { bottom: -5px; }
  .tourbtn:not(.fresh):hover::after, .pbtn:hover:not(:disabled)::after { bottom: -4px; }
}

/* Level selector as tall as the header's round buttons (.tourbtn: an 18px icon, its padding at .92rem, a 1px border) at
   every screen size; the level buttons fill it (the sliding pill follows them). From the sibling games. Content-box
   height, so its 1px border rounds like the buttons' do. */
.seg.level { box-sizing: content-box; height: calc(18px + 1.1 * .92rem - 4px); align-items: stretch; }   /* - its own 2px padding */
.dock .seg.level button { padding-top: 0 !important; padding-bottom: 0 !important; }
@media (max-width: 600px) { .seg.level { height: calc(18px + .92rem - 4px); } }

/* Phones: the card labels stick up above the cards, so the stage gets room under the instructions, and the labels
   are a tad smaller (as in Core Word Bubbles, 2026-11-23) */
@media (max-width: 600px) {
  #stage { padding-top: 8px; }
  .tag { font-size: .62rem; letter-spacing: .08em; }
}

/* 21-match.css — the Match round board: two columns (questions, answers) of floating bubbles, drag / hot / selected /
   hinted / shake / done states, and the finished board (one list of pairs with translation, Listen and star). */
.board { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 0 clamp(14px, 4vw, 48px); width: 100%; max-width: 860px; padding-top: 14px; }
.mcol { position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 16px; padding-top: 18px; min-width: 0; }
.mcol > .tag { top: 2px; }
.mcol.q { --h: 330; }
.mcol.a { --h: 205; }
.mslot { display: flex; }
.mcol.a .mslot { justify-content: flex-end; }
#stage.rise .mslot { animation: rise .6s cubic-bezier(.2,.8,.3,1) backwards; animation-delay: var(--d, 0s); }
.b.mb { width: 100%; font-size: clamp(.98rem, .7vw + .8rem, 1.16rem); line-height: 1.3; padding: .78em 1em .82em; border-radius: 1.4em; text-align: center;
  cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; animation: bob var(--dur, 4s) ease-in-out var(--dl, 0s) infinite alternate; }
.b.mb.q { border: 3px solid hsla(var(--h),50%,calc(var(--rim-l) - 4%),.8); outline: 2px solid hsla(var(--h),55%,76%,.28); outline-offset: 2px; font-weight: 600; }
.b.mb:hover { transform: translateY(-3px) scale(1.03); }
.b.mb.drag { position: fixed; z-index: 60; margin: 0; pointer-events: none; animation: none; transition: none; cursor: grabbing; transform: scale(1.06) rotate(-2deg);
  box-shadow: inset 0 0 22px hsla(var(--h),100%,var(--glow-l),.6), 0 18px 28px var(--shadow), 0 0 0 4px hsla(var(--h),90%,75%,.25); }
.b.mb.hot { transform: scale(1.06); border-color: hsla(var(--h),90%,60%,1); box-shadow: inset 0 0 22px hsla(var(--h),100%,var(--glow-l),.7), 0 0 0 5px hsla(var(--h),90%,70%,.35), 0 10px 20px var(--shadow); }
.b.mb.sel { transform: translateY(-3px) scale(1.04); border-color: var(--underline); box-shadow: inset 0 0 22px hsla(var(--h),100%,var(--glow-l),.6), 0 0 0 4px hsla(330,90%,70%,.45), 0 12px 22px var(--shadow); }
.b.mb.hinted { border-color: hsl(45,95%,55%); box-shadow: inset 0 0 22px hsla(45,100%,65%,.6), 0 0 0 5px hsla(45,95%,60%,.4), 0 10px 20px var(--shadow); }
.b.mb.shake { animation: shake .5s ease; border-color: hsla(350,85%,62%,.95); box-shadow: inset 0 0 20px hsla(350,95%,70%,.5), 0 8px 18px var(--shadow); }
.b.mb.done { cursor: default; animation: none; border-color: hsla(var(--h),55%,calc(var(--rim-l) - 6%),.9);
  box-shadow: inset 0 0 22px hsla(var(--h),100%,var(--glow-l),.55), inset -6px -8px 18px hsla(calc(var(--h) + 70),100%,var(--glow-l),.4), 0 8px 18px var(--shadow), 0 0 0 3px hsla(var(--h),90%,75%,.2); }
.b.mb.done:hover { transform: none; }
.b.mb.merge { animation: merge .55s cubic-bezier(.34,1.56,.64,1); }
.mb .mq { display: block; }
.mb .ma { display: block; margin-top: .4em; font-weight: 400; font-size: .92em; opacity: .85; }
.b.mb:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }

/* Finished: one list, each pair with its translation and buttons */
.board.finished { grid-template-columns: 1fr; max-width: 640px; }
.board.finished .mcol.a { display: none; }
.board.finished .mcol.q > .tag { display: none; }
.board.finished .mcol { padding-top: 0; gap: 12px; }
.board.finished .b.mb { text-align: left; padding: .75em 1.1em .8em; }
.mb .mtr { display: block; margin-top: .5em; padding-top: .45em; border-top: 1px dashed var(--dock-line); font-weight: 400; font-size: .86em; opacity: .78; animation: pup .45s ease-out backwards; }
.mb .mbtns { position: absolute; right: 10px; bottom: 8px; display: flex; align-items: center; gap: 2px; }
.board.finished .b.mb { padding-right: 5.4em; }
.board.finished .b.mb:not(.miss)::after { display: none; }   /* the glass glint would sit on the buttons */
.board.finished .b.mb::before { opacity: .35; }               /* and the gloss on the left-aligned text */
.mb .pbtn.say { padding: .35em .5em; border-color: transparent; background: transparent; }
.mb .pbtn.say:hover { background: var(--dock-line); }
.mb .favstar svg { width: 20px; height: 20px; }
.b.mb.miss::after { content: ""; position: absolute; left: -4px; top: -4px; right: auto; bottom: auto; width: 12px; height: 12px; border-radius: 50%; background: hsl(350,80%,60%); opacity: 1; box-shadow: 0 0 0 2px var(--bg-a); }
.matchfoot { display: flex; justify-content: center; margin-top: 18px; transition: opacity .25s ease; animation: pup .4s ease-out; }

@media (max-width: 600px) {
  .board { gap: 0 10px; }
  .mcol { gap: 12px; }
  .b.mb { font-size: .95rem; padding: .62em .7em .66em; border-radius: 1.2em; }
  .b.mb.q { border-width: 2.5px; }
  .board.finished .b.mb { padding-right: 4.8em; }
}
@media (prefers-reduced-motion: reduce) { .b.mb, .b.mb.merge, .mb .mtr, #stage.rise .mslot, .matchfoot { animation: none !important; } }

/* 22-soap.css — the Build words and Match bubbles as soap bubbles (from Be Do Modal, 2026-11-22): almost clear, a faint film of colour
   inside and a 1.5px coloured rim, both turning once in 10 s (each word its own random hue, --h). Built from spans
   (SOAP in 16-shine.js), each drawn once: the film and the rim turn by rotating a still conic gradient (.spin, a
   transform animation), and what follows the mouse moves by transform / opacity only (16-shine.js). Paint order,
   bottom to top: the film (.spin, the white sheen ::before, the glow facing the mouse .fg, the inner glow ::after),
   the shine spot, the rim, the small spot, the word (.wl). Per-theme numbers are tokens in 10-base.css (--soap-*,
   --spot-plus, --film-a, --srim-*, --sglow-*, --rimhi-*, --faceg-*). The border stays, clear, so no size changes. */
.b.w { --th: var(--h); border-color: transparent; background: none;
  --ig: inset 0 0 12px hsla(var(--th), 95%, var(--sglow-l), var(--sglow-a));   /* the inner glow, drawn above the film by .film::after; states change it */
  box-shadow: 0 6px 14px var(--soap-sh); }
.b.w::before { content: none; }   /* the shine spot is the .spot span */
.b.w:not(.hinted)::after { background: none; }   /* ::after is only the hint dot and the hover strip (20-game.css) */
/* the question word and the helper verb lead the colour once the question is done (pink / blue, as their text) */
.w.k1 { --th: 330; }
.w.k2 { --th: 205; }
.b.w .wl { position: relative; }   /* above the moving shine */
:is(.w, .mb) .film, :is(.w, .mb) .spot, :is(.w, .mb) .rim, :is(.w, .mb) .glint { cursor: inherit; }
:is(.w, .mb) .film { position: absolute; inset: -1.5px; z-index: 0; border-radius: inherit; overflow: hidden; pointer-events: none; }
:is(.w, .mb) .film::before { content: ""; position: absolute; inset: 0; z-index: 1;
  background: radial-gradient(120% 120% at 30% 20%, rgba(255,255,255,var(--soap-hi)), rgba(255,255,255,var(--soap-lo)) 60%, transparent); }
:is(.w, .mb) .film::after { content: ""; position: absolute; inset: 1.5px; z-index: 3; border-radius: inherit; box-shadow: var(--ig); transition: box-shadow .25s ease; }
/* The turning colour of film and rim: a square wider than the bubble's diagonal, centred; rotating it = turning the
   conic gradient's start. Both start together, so their colours stay in step. */
:is(.w, .mb) .spin { position: absolute; left: 50%; top: 50%; width: calc(100% + 1.6em); aspect-ratio: 1; translate: -50% -50%; animation: spin 10s linear var(--dl, 0s) infinite; }
:is(.w, .mb) .film .spin { background: conic-gradient(from var(--ang), hsla(var(--th), 95%, 76%, var(--film-a)) 0 30%, hsla(calc(var(--th) + 90), 95%, 80%, calc(var(--film-a) * .6)) 50%, hsla(calc(var(--th) + 200), 90%, 82%, calc(var(--film-a) * .7)) 72%, hsla(var(--th), 95%, 76%, var(--film-a)) 92%); }
:is(.w, .mb) .rim .spin { background: conic-gradient(from var(--ang), hsla(var(--th), 90%, var(--srim-l), var(--srim-a)) 0 30%, hsla(calc(var(--th) + 90), 90%, calc(var(--srim-l) + 4%), calc(var(--srim-a) * .64)) 50%, hsla(calc(var(--th) + 200), 85%, calc(var(--srim-l) + 8%), calc(var(--srim-a) * .56)) 72%, hsla(var(--th), 90%, var(--srim-l), var(--srim-a)) 92%); }
@keyframes spin { to { transform: rotate(360deg); } }
/* What follows the mouse: 16-shine.js writes these wrappers' transform / opacity; the look is the <i> inside, and each
   is its own layer, so moving it repaints nothing. */
:is(.w, .mb) .fg > i, :is(.w, .mb) .rh > i, :is(.w, .mb) .spot i, :is(.w, .mb) .glint > i { position: absolute; inset: 0; }
:is(.w, .mb) .film .fg { position: absolute; left: -10%; top: -45%; width: 120%; height: 190%; z-index: 2; opacity: 0; will-change: transform, opacity; }
:is(.w, .mb) .fg > i { background: radial-gradient(closest-side, hsla(var(--th), 100%, var(--faceg-l), var(--faceg-a)), transparent); }
:is(.w, .mb) .spot { position: absolute; left: .5em; top: .42em; width: .62em; height: .5em; pointer-events: none; transform: rotate(-14deg); will-change: transform; }   /* the shine: one size and place (em), never stretched by a wide bubble */
:is(.w, .mb) .spot > i:first-child { background: radial-gradient(closest-side, rgba(255,255,255,var(--soap-gl)) 32%, rgba(255,255,255,calc(var(--soap-gl) * .55)) 62%, rgba(255,255,255,0)); }
:is(.w, .mb) .spot .pl { opacity: 0; }   /* brighter, wider core as the mouse nears */

/* States: hover / focus / drag glow more; right / wrong / shown turn the rim green / red / yellow; pre-filled stay quiet */
.b.w:focus-visible { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 12px 22px var(--soap-sh2), 0 0 0 4px hsla(var(--th), 90%, 72%, .18); }

.b.w.drag { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 18px 30px var(--soap-sh2), 0 0 0 4px hsla(var(--th), 90%, 72%, .2); }

/* 23-sky.css — from Be Do Modal's revamp (2026-11-22, via Conditional Bubbles): the background bubbles, the custom
   colour picker, no page scroll behind a window. */
/* Background bubbles drifting up behind everything (made in 08-sky.js). lvh, not vh: Android's address bar would make
   them jump. Only transform / opacity animate; paused while a bubble is carried or the reveal card opens. */
.sky { position: fixed; top: 0; left: 0; right: 0; height: 100vh; height: 100lvh; z-index: -1; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; }
.sky.in { opacity: var(--sky-o); }
.sky span {
  position: absolute; bottom: -120px; border-radius: 50%;
  border: 1.5px solid hsla(var(--h), 80%, var(--sky-rim-l), var(--sky-rim-a));
  background: radial-gradient(circle at 30% 26%, rgba(255,255,255,var(--sky-hi)), hsla(var(--h), 90%, 78%, var(--sky-tint-a)) 50%, hsla(var(--h), 90%, 72%, calc(var(--sky-tint-a) * .8)) 70%, transparent 71%);
  box-shadow: inset 0 0 14px hsla(var(--h), 95%, var(--sky-glow-l), var(--sky-glow-a));

  opacity: 0;

body.carrying .sky span, body.calm .sky span { animation-play-state: paused; }
@keyframes skydrift {
  0% { transform: translate3d(0, 0, 0); opacity: 0; }
  8% { opacity: .6; }
  50% { transform: translate3d(var(--x, 20px), -60vh, 0); transform: translate3d(var(--x, 20px), -60lvh, 0); }
  92% { opacity: .45; }
  100% { transform: translate3d(0, -125vh, 0); transform: translate3d(0, -125lvh, 0); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .sky { display: none; } }

   own gradient, the handle a white disc ringed in the colour being made. contain: it never widens the pop-over. */
.cpick { contain: inline-size; min-width: 0; display: none; flex: 1 0 100%;

.cp-r::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 4px solid var(--cp-c); box-shadow: 0 2px 6px var(--shadow); transition: transform .2s cubic-bezier(.34,1.56,.64,1); }

/* The gap is an empty underline (one continuous line) until the answer fills it */
.gap { display: inline-block; min-width: 3.6em; min-height: 1.2em; padding: 0 .3em; vertical-align: bottom; border-bottom: 3px solid var(--underline); border-radius: 2px; color: var(--underline); }
.gap.filled { color: hsl(330,72%,var(--lab-l)); animation: tick .5s cubic-bezier(.34,1.56,.64,1); }
.qz-opts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.qz-opts .pbtn { font-size: 1rem; font-weight: 600; }
.qz-opts .pbtn.ok { border-color: hsl(150,60%,48%); background: hsla(150,70%,60%,.18); }
.qz-opts .pbtn.bad { border-color: hsl(350,75%,60%); background: hsla(350,85%,70%,.15); }
.qz-opts .pbtn:disabled { cursor: default; }
.qz-opts .pbtn.ok:disabled, .qz-opts .pbtn.bad:disabled { opacity: 1; }
.qz-why { margin: 12px 0 0; font-size: .95rem; }
.qz-plus { position: fixed; z-index: 60; transform: translate(-50%, -100%); font-weight: 700; font-size: 1.3rem; color: hsl(150,60%,45%); pointer-events: none; animation: qzplus .9s ease-out forwards; }
@keyframes qzplus { to { transform: translate(-50%, -260%); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .combo.tick, .quiz.in, .qz-plus, .playmenu, #rtag, .gap.filled { animation: none; } }

/* 33-guide.css — the Guide, laid out like the Guides of the newer games: tip, steps, jump links, word
   cards in groups, folded pattern cards, Portuguese -> English, common mistakes, For the curious; EN / PT switch. */
.gdcard { max-width: 780px; max-height: 88vh; }
.gdcard .favhead { gap: 10px; }
.gd-lang { margin-left: auto; }
.gd-tip { display: flex; gap: 10px; margin: 0 2px 12px; font-size: .98rem; line-height: 1.45; }
.gd-tip > span:first-child { flex: none; }
.gd-tip b { color: var(--underline); }
/* Folded cards (steps, patterns, For the curious) */
.gd-u { --h: 265; margin-top: 10px; padding: 0; border-radius: 18px; background: var(--fill-mid); border: 1.5px solid hsla(var(--h),70%,var(--rim-l),.6); scroll-margin-top: 12px; }
.gd-u h4 { margin: 0; font-size: 1.05rem; color: hsl(var(--h),60%,var(--lab-l)); }
.gd-u > summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; cursor: pointer; list-style: none; border-radius: 16px; }
.gd-u > summary::-webkit-details-marker { display: none; }
.gd-u > summary::after { content: ""; flex: none; width: 8px; height: 8px; margin-right: 4px; border-right: 2px solid hsl(var(--h),60%,var(--lab-l)); border-bottom: 2px solid hsl(var(--h),60%,var(--lab-l)); transform: rotate(45deg) translateY(-2px); transition: transform .25s ease; }
.gd-u[open] > summary::after { transform: rotate(-135deg) translateY(-2px); }
.gd-u > summary:hover { background: hsla(var(--h),85%,72%,.1); }
.gd-u > summary:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
.gd-u[open] { padding-bottom: 12px; }
.gd-u[open] > :not(summary) { margin-left: 14px; margin-right: 14px; animation: pup .3s ease-out; }
.gd-u .ch-ex { width: calc(100% - 28px); box-sizing: border-box; margin-top: 6px; }
.gd-sum { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.gd-sum .chip { font-size: .64rem; padding: .3em .8em; }
.gd-sum .formula { font-size: .95rem; }
.gd-short { margin: 4px 0 6px; font-size: .88rem; opacity: .75; }
/* Step by step: numbered rows, the question growing on the right */
.gd-steps { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; counter-reset: st; }
.gd-steps > li { counter-increment: st; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 6px 12px; padding: 10px 14px 10px 10px; border-radius: 14px;
  background: hsla(var(--h),85%,72%,.13); border-left: 4px solid hsl(var(--h),70%,58%); }
.gd-steps > li::before { content: counter(st); display: grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%; font-size: .8rem; font-weight: 700; color: #fff; background: hsl(var(--h),65%,56%); }
.gd-qt b { display: block; font-size: 1rem; font-weight: 600; line-height: 1.3; }
.gd-qt small { display: block; margin-top: 3px; font-size: .84rem; line-height: 1.4; opacity: .72; }
.gd-sx { font-size: 1rem; font-weight: 500; white-space: nowrap; text-align: right; }
/* Jump links */
.gd-nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 14px; }
.gd-nav .chip { border: 0; cursor: pointer; font-family: inherit; text-transform: none; letter-spacing: .02em; transition: transform .25s cubic-bezier(.34,1.56,.64,1); }
.gd-nav .chip:hover { transform: translateY(-2px); }
.gd-nav .chip:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
/* Sections */
.gd-t { --h: 285; margin-top: 22px; scroll-margin-top: 12px; }
.gd-t h3 { margin: 0; font-size: 1.15rem; color: hsl(var(--h),65%,var(--lab-l)); }
.gd-gh { margin: 14px 0 6px 4px; font-size: .74rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .65; }
/* Question word cards */
.chart { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.chart li { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 18px; border: 1.5px solid hsla(var(--h),70%,var(--rim-l),.75); background: hsla(var(--h),90%,75%,.08); }
.chart li.later { opacity: .5; }
.ch-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.ch-top .chip { font-size: .78rem; text-transform: none; letter-spacing: .02em; }
.ch-tr { font-weight: 600; font-size: .9rem; opacity: .8; }
.ch-lv { margin-left: auto; font-size: .66rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
.ch-about { margin: 0; font-size: .84rem; opacity: .85; }
.ch-about b { font-weight: 600; }
.ch-ex { appearance: none; display: flex; align-items: flex-start; gap: 6px; margin-top: 2px; padding: 6px 8px; border: 0; border-radius: 12px; background: var(--fill-lo);
  font: inherit; font-size: .9rem; line-height: 1.3; color: inherit; text-align: left; cursor: pointer; transition: background-color .2s ease; }
.ch-ex:hover, .ch-ex.speaking { background: var(--fill-mid); }
.ch-ex svg { flex: none; width: 16px; height: 16px; margin-top: 2px; opacity: .6; }
.ch-ex .ra { opacity: .75; }
.ch-ex .rt { display: block; margin-top: 2px; font-size: .8rem; opacity: .7; }
/* Prepositions in questions: the rules reuse the step rows; the preposition underlined in its section colour */
.gd-preps .gd-steps > li { grid-template-columns: auto 1fr; align-items: start; }
.gd-preps .gd-steps > li > :not(.gd-qt) { grid-column: 2; }
.gd-preps .gd-steps > li::before { margin-top: 1px; }
.gd-preps .gd-wrong { margin-top: 4px; }
.gd-preps .gd-u { margin-top: 12px; }
u.gd-prep { text-decoration: underline 2px hsl(175,70%,48%); text-underline-offset: 3px; }
/* Portuguese -> English */
.gd-map { list-style: none; margin: 6px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.gd-map li { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 2px 8px; padding: 9px 10px 9px 12px; border-radius: 16px; background: var(--fill-mid); border: 1px solid var(--dock-line); }
.gd-src { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; font-size: .9rem; opacity: .85; }
.gd-src .pick-badge { font-size: .6rem; }
.gd-arrow { font-size: 1.1rem; font-weight: 700; line-height: 1; color: hsl(var(--h),65%,var(--lab-l)); }
.gd-en { font-weight: 600; font-size: .98rem; }
.gd-note { grid-column: 1 / -1; font-size: .8rem; line-height: 1.4; opacity: .7; }
.pbtn.gd-say { padding: .35em; border-color: transparent; background: transparent; }
.pbtn.gd-say:hover { background: var(--dock-line); }
.gd-say svg { width: 15px; height: 15px; }
/* Common mistakes: numbered, wrong struck through, right in colour */
.gd-mlist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; align-items: start; gap: 10px; counter-reset: mis; }
.gd-mlist li { counter-increment: mis; position: relative; padding: 11px 12px 11px 42px; border-radius: 16px; background: var(--fill-mid); border: 1px solid var(--dock-line); }
.gd-mlist li::before { content: counter(mis); position: absolute; left: 12px; top: 12px; display: grid; place-items: center; width: 1.5em; height: 1.5em; border-radius: 50%; font-size: .75rem; font-weight: 700; color: #fff; background: hsl(350,70%,56%); }
.gd-wrong, .gd-right { margin: 0; font-size: .97rem; font-weight: 600; line-height: 1.4; }
.gd-wrong { color: hsl(350,70%,var(--lab-l)); text-decoration: line-through; text-decoration-thickness: 1.5px; text-decoration-color: hsla(350,70%,55%,.6); }
.gd-wrong span { display: inline-block; text-decoration: none; margin-right: 2px; }
.gd-right { margin-top: 2px; }
.gd-right > span { margin-right: 2px; color: hsl(150,55%,calc(var(--lab-l) * .8 + 6%)); }
.gd-right .gd-say { vertical-align: middle; margin-left: 2px; }
.gd-mwhy { margin: 6px 0 0; font-size: .88rem; line-height: 1.45; opacity: .82; }
/* For the curious */
.gd-cur { margin-top: 22px; }
.gd-cur .gd-word + .gd-word { margin-top: 14px; }
.gd-cur .gd-mwhy b { font-weight: 600; }
.gd-wh { margin: 0; }
/* A jump lands: a short glow */
.ping { animation: gdping .9s ease-out; }
@keyframes gdping { 0% { box-shadow: 0 0 0 0 hsla(var(--h, 265),80%,65%,.7); } 100% { box-shadow: 0 0 0 14px hsla(var(--h, 265),80%,65%,0); } }
@media (max-width: 600px) {
  .chart, .gd-map, .gd-mlist { grid-template-columns: 1fr; }
  .gd-steps > li { grid-template-columns: auto 1fr; }
  .gd-sx { grid-column: 2; text-align: left; white-space: normal; }
}
@media (prefers-reduced-motion: reduce) { .gd-u[open] > :not(summary), .ping { animation: none; } }

/* 90-scrollbar.css — copied from the a / an / the and present perfect games (from Preposition Bubbles): in the cards
   that scroll (Favorites / Seen, end of game, Guide, tutorial) a thin glossy pill with the pink-to-purple
   gradient on a clear track; the page itself shows none. Firefox only takes colours, so it gets a thin pink thumb. */
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: transparent; margin: 18px 0; }
::-webkit-scrollbar-thumb {
  border: 3px solid transparent; border-radius: 999px; background-clip: padding-box;
  background-image: linear-gradient(180deg, hsl(330,85%,66%), hsl(265,80%,64%));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45);
}
::-webkit-scrollbar-thumb:hover { background-image: linear-gradient(180deg, hsl(330,90%,60%), hsl(265,85%,58%)); }
::-webkit-scrollbar-thumb:active { border-width: 2px; }
::-webkit-scrollbar-button, ::-webkit-scrollbar-corner { display: none; background: transparent; }
@supports (-moz-appearance: none) {
  * { scrollbar-width: thin; scrollbar-color: hsl(330,85%,66%) transparent; }
}
/* The page itself still scrolls on short screens, but shows no bar (only the cards and lists do). */
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }

</style>

<script>

},"do":{"name":"present simple","hue":150,"f":[["wh","Wh-"],["aux","do / does"],["","subject"],["","verb"]],"use":"habits and facts"},"can":{"name":"can","hue":265,"f":[["wh","Wh-"],["aux","can"],["","subject"],["","verb"]],"use":"ability, permission and requests"},"ing":{"name":"present continuous","hue":185,"f":[["wh","Wh-"],["aux","am / is / are"],["","subject"],["","verb-ing"]],"use":"things happening now"},"did":{"name":"past simple","hue":25,"f":[["wh","Wh-"],["aux","did"],["","subject"],["","verb"]],"use":"finished actions in the past (the verb stays in its base form)"},"was":{"name":"past of be","hue":45,"f":[["wh","Wh-"],["aux","was / were"],["","subject"]],"use":"the verb be in the past"},"pcont":{"name":"past continuous","hue":55,"f":[["wh","Wh-"],["aux","was / were"],["","subject"],["","verb-ing"]],"use":"an action in progress at a time in the past"},"going":{"name":"going to","hue":300,"f":[["wh","Wh-"],["aux","am / is / are"],["","subject"],["","going to + verb"]],"use":"plans for the future"},"will":{"name":"will","hue":320,"f":[["wh","Wh-"],["aux","will"],["","subject"],["","verb"]],"use":"the future: decisions and predictions"},"modal":{"name":"would / should","hue":240,"f":[["wh","Wh-"],["aux","would / should"],["","subject"],["","verb"]],"use":"offers, advice and imagined situations"},"perf":{"name":"present perfect","hue":110,"f":[["wh","Wh-"],["aux","have / has"],["","subject"],["","past participle"]],"use":"experiences, and situations that started in the past and go on now"},"subj":{"name":"subject question","hue":0,"f":[["wh","Wh- (subject)"],["","verb"],["","…"]],"use":"the question word is the subject, so there is no do / does / did"}},"guide":{"ui":{"tip":"Open questions in English almost always follow the same order: <b>question word + helper verb + subject + verb<\/b>. Get the order right and you can ask anything.","stepsTitle":"Build a question step by step","stepsLead":"Go in this order. The example builds “Where does your sister work?”","navWords":"Question words","navPatterns":"Patterns","navMap":"Portuguese → English","navPreps":"Prepositions","navMistakes":"Common mistakes","navCurious":"For the curious","wordsLead":"The question word comes first. It tells you what kind of answer the question wants. Tap an example to hear it.","asks":"asks about","from":"from {lvl}","patternsTitle":"Question patterns","patternsLead":"The helper verb changes with the tense. Question word pink, helper verb blue, as in the game.","prepsTitle":"Prepositions in questions","prepsLead":"Portuguese puts the preposition first (Com quem…? De onde…?). English almost always leaves it for the end.","prepsMore":"Questions you have seen","mapTitle":"Portuguese → English","mapLead":"Things Portuguese says one way and English says another.","mistakesTitle":"Common mistakes","mistakesLead":"The trap bubbles in the game come from these.","curiousTitle":"For the curious"},"steps":[{"id":"wh","t":"Pick the question word","x":"What do you want to know? A place → where, a person → who, a reason → why.","ex":"[Where]"},{"id":"aux","t":"Add the helper verb","x":"do / does / did, am / is / are, was / were, can, will, have / has… It agrees with the subject and shows the tense.","ex":"[Where] {does}"},{"id":"subj","t":"Then the subject","x":"The person or thing that does the action: you, your sister, they…","ex":"[Where] {does} your sister"},{"id":"verb","t":"Then the main verb, in its base form","x":"After do / does / did, can, will…: work, go, live (never works, went, lives).","ex":"[Where] {does} your sister work?"},{"id":"rest","t":"Everything else at the end","x":"Objects, places, times. A preposition can even be the very last word.","ex":"[Who] {are} you talking to?"}],"groups":[{"id":"thing","t":"Things and choices","wh":["what","which","what-kind"]},{"id":"person","t":"People","wh":["who","whose"]},{"id":"place","t":"Places and distance","wh":["where","how-far"]},{"id":"time","t":"Time","wh":["when","what-time","how-long","how-often"]},{"id":"number","t":"Numbers and amounts","wh":["how-old","how-many","how-much"]},{"id":"reason","t":"Reasons, ways and descriptions","wh":["why","how","what-like"]}],"preps":[{"id":"end","lv":"A1","t":"The preposition goes to the end","x":"Start with the question word, as always, and leave the preposition for last: De onde você é? → Where are you from? Com quem você mora? → Who do you live with?","bad":"With who do you live?","good":"[Who] {do} you live with?"},{"id":"verb","lv":"A2","t":"It stays with its verb","x":"Many verbs come with their own preposition: wait for, look for, listen to, talk to, think about. In the question they are still a team: the verb, then its preposition at the end.","good":"[What] {are} you looking for?"},{"id":"none","lv":"A2","t":"Some verbs take none","x":"like, need, visit, call, marry: nothing at the end, even when Portuguese has a preposition (gostar de, precisar de).","bad":"Which team do you like of?","good":"[Which] soccer team {do} you like?"},{"id":"adj","lv":"B1","t":"Adjectives have them too","x":"afraid of, interested in, married to, worried about, excited about: the adjective keeps its preposition, and it goes to the end.","good":"[What] {are} you afraid of?"},{"id":"fixed","lv":"B1","t":"Questions to learn whole","x":"Some have a meaning of their own: What is it for? (para que serve?), What is it like? (como é?), What does he look like? (como ele é fisicamente?), What is it about? (é sobre o quê?).","good":"[What] {is} this button for?"}],"mistakes":[{"id":"no-aux","lv":"A1","bad":"Where you live?","good":"[Where] {do} you live?","why":"Questions with other verbs need do / does (did in the past)."},{"id":"third-s","lv":"A1","bad":"Where does she lives?","good":"[Where] {does} she live?","why":"The -s goes on does, so the verb stays in its base form."},{"id":"be-order","lv":"A1","bad":"Where your keys are?","good":"[Where] {are} your keys?","why":"With be, the verb comes before the subject."},{"id":"name","lv":"A1","bad":"How is your name?","good":"[What] {is} your name?","why":"Portuguese says “Como é o seu nome?”, but English asks with what."},{"id":"age","lv":"A1","bad":"How many years do you have?","good":"[How old] {are} you?","why":"Age goes with be: I am 12. How old are you?"},{"id":"hour","lv":"A1","bad":"What hour is it?","good":"[What time] {is} it?","why":"Que horas = what time. An hour is sixty minutes."},{"id":"did-past","lv":"A2","bad":"Where did you went?","good":"[Where] {did} you go?","why":"Did already shows the past, so the verb stays in its base form."},{"id":"much-many","lv":"A2","bad":"How many money do you have?","good":"[How much] money {do} you have?","why":"Many for things you can count (books, friends), much for things you can't (money, time, water)."},{"id":"why-because","lv":"A2","bad":"Because are you late?","good":"[Why] {are} you late?","why":"Why asks, because answers: Why are you late? Because I missed the bus."},{"id":"subject","lv":"B1","bad":"Who did call you?","good":"[Who] called you?","why":"When who or what is the subject (the one who did it), there is no do / does / did."},{"id":"prep","lv":"B1","bad":"With who are you talking?","good":"[Who] {are} you talking to?","why":"In everyday English the preposition goes to the end."},{"id":"perfect","lv":"B1","bad":"How long do you live here?","good":"[How long] {have} you lived here?","why":"Something that started in the past and goes on now takes the present perfect (Portuguese uses the present)."},{"id":"like","lv":"B1","bad":"How is the weather like?","good":"[What] {is} the weather [like]?","why":"To ask for a description: what … like, not how … like."}],"curious":[{"id":"yesno","t":"Questions without a question word","x":"Yes / no questions start with the helper verb: <b>Do you like pizza? Are you tired? Can you swim?<\/b> Same order, just no question word."},{"id":"whom","t":"Who or whom?","x":"<b>Whom<\/b> is the formal form for the person who receives the action (<b>Whom did you call?<\/b>). In everyday English people just say <b>who<\/b>."},{"id":"which","t":"What or which?","x":"Both ask about a choice. <b>Which<\/b> when the options are few and known (<b>Which color, red or blue?<\/b>), <b>what<\/b> when they are open (<b>What color is your car?<\/b>)."},{"id":"front","t":"A preposition at the start","x":"Formal English can keep the preposition in front: <b>With whom did you travel?<\/b> It sounds very formal. People say <b>Who did you travel with?<\/b>"},{"id":"howcome","t":"How come?","x":"Informal for <b>why<\/b>, but with normal order, no helper verb: <b>How come you're late?<\/b> = <b>Why are you late?<\/b>"}]},"items":{"A1":[{"id":"a1-01","q":"What is your name?","a":"My name is Lucas.","g":"be","dx":["are","how","you"],"tr":{"pt-BR":{"q":"Qual é o seu nome?","a":"Meu nome é Lucas.","note":"Use What, e não How: “How is your name?” é um erro comum."}},"note":"Use What, not How: “How is your name?” is a common mistake."},{"id":"a1-02","q":"Where is the bathroom?","a":"It's at the end of the hall.","g":"be","dx":["are","when","it"],"tr":{"pt-BR":{"q":"Onde fica o banheiro?","a":"Fica no fim do corredor.","heads":"Aqui “fica” não é um verbo especial em inglês: é só o verbo be."}},"heads":"“fica” here isn't a special verb in English: it's just be."},{"id":"a1-03","q":"How old are you?","a":"I'm twelve years old.","g":"be","dx":["have","is","many"],"tr":{"pt-BR":{"q":"Quantos anos você tem?","a":"Tenho doze anos.","note":"Em inglês, você É uma idade: How old are you? — I'm twelve. Não use have.","heads":"Em inglês, a idade vai com o verbo be, e não com have."}},"note":"In English you ARE an age: How old are you? — I'm twelve. Don't use have.","heads":"In English, age goes with the verb be, not with have."},{"id":"a1-04","q":"Where are you from?","a":"I'm from Canada.","g":"be","dx":["is","do","of"],"tr":{"pt-BR":{"q":"De onde você é?","a":"Sou do Canadá.","note":"O from vai para o final: Where are you from?","heads":"O “de” vai para o final da :{"q":"Quem é aquele homem?","a":"É o meu tio."}}},{"id":"a1-13","q":"What day is it today?","a":"It's Monday.","g":"be","dx":["are","when","does"],"tr":{"pt-BR":{"q":"Que dia é hoje?","a":"Hoje é segunda-feira.","note":"Diga What day is it today? — com “it”.","heads":"Em português não tem sujeito aqui, mas o inglês precisa de um."}},"note":"Say What day is it today? — with “it”.","heads":"Portuguese has no subject here, but English needs one."},{"id":"a1-14","q":"Where is your school?","a":"It's next to the park.","g":"be","dx":["are","stay","when"],"tr":{"pt-BR":{"q":"Onde fica a sua escola?","a":"Fica ao lado do parque.","note":"“Onde fica…?” = Where is…? (não use stay).","heads":"Aqui “fica” não é um verbo especial em inglês: é só o verbo be."}},"note":"“Onde fica…?” = Where is…? (don't use stay).","heads":"“fica” here isn't a special verb in English: it's just be."},{"id":"a1-15","q":"How old is your sister?","a":"She's nine.","g":"be","dx":["has","are","many"],"tr":{"pt-BR":{"q":"Quantos anos a sua irmã tem?","a":"Ela tem nove anos.","heads":"Em inglês, a idade vai com o verbo be, e não com have."}},"heads":"In English, age goes with the verb be, not with have."},{"id":"a1-16","q":"Who are those girls?","a":"They're my classmates.","g":"be","dx":["is","what","they"],"tr":{"pt-BR":{"q":"Quem são aquelas meninas?","a":"São minhas colegas de turma."}}},{"id":"a1-17","q":"What time is the movie?","a":"It's at nine.","g":"be","dx":["hour","are","when"],"tr":{"pt-BR":{"q":"Que horas é o filme?","a":"É às nove."}}},{"id":"a1-18","q":"How is your mother?","a":"She's fine, thanks.","g":"be","dx":["are","does","she"],"tr":{"pt-BR":{"q":"Como está a sua mãe?","a":"Ela está bem, obrigado."}}},{"id":"a1-19","q":"Where do you live?","a":"I live near the beach.","g":"do","dx":["does","lives","when"],"tr":{"pt-BR":{"q":"Onde você mora?","a":"Eu moro perto da praia."}}},{"id":"a1-20","q":"What do you do?","a":"I'm a teacher.","g":"do","dx":["does","make","are"],"tr":{"pt-BR":{"q":"O que você faz?","a":"Sou professor.","note":"What do you do? pergunta a profissão. O segundo do é o verbo principal (fazer).","heads":"Aqui o verbo principal é igualzinho ao verbo auxiliar."}},"note":"What do you do? asks about your job. The second do is the main verb.","heads":"Here the main verb looks exactly like the helper verb."},{"id":"a1-21","q":"What time do you get up?","a":"I get up at seven.","g":"do","dx":["does","gets","hour"],"tr":{"pt-BR":{"q":"Que horas você se levanta?","a":"Eu me levanto às sete."}}},{"id":"a1-22","q":"Where does your father work?","a":"He works at a bank.","g":"do","dx":["do","works","is"],"tr":{"pt-BR":{"q":"Onde o seu pai trabalha?","a":"Ele trabalha num banco.","note":"He / she / it → does, e o verbo perde o -s: does … work."}},"note":"He / she / it → does, and the verb loses its -s: does … work."},{"id":"a1-23","q":"What does Maria eat for breakfast?","a":"She eats bread and fruit.","g":"do","dx":["do","eats","is"],"tr":{"pt-BR":{"q":"O que a Maria come no café da manhã?","a":"Ela come pão e frutas."}}},{"id":"a1-24","q":"When do you play soccer?","a":"I play on Saturdays.","g":"do","dx":["does","plays","where"],"tr":{"pt-BR":{"q":"Quando você joga futebol?","a":"Eu jogo aos sábados."}}},{"id":"a1-25","q":"How do you go to school?","a":"I go by bus.","g":"do","dx":["does","goes","what"],"tr":{"pt-BR":{"q":"Como você vai para a escola?","a":"Eu vou de ônibus."}}},{"id":"a1-26","q":"Who do you live with?","a":"I live with my parents.","g":"do","dx":["does","lives","where"],"tr":{"pt-BR":{"q":"Com quem você mora?","a":"Eu moro com os meus pais.","note":"O with vai para o final: Who do you live with?","heads":"O “com” vai para o final da pergunta em inglês."}},"note":"With goes at the end: Who do you live with?","heads":"“com” goes to the end of the English question."},{"id":"a1-27","q":"How many brothers do you have?","a":"I have two brothers.","g":"do","dx":["much","does","has"],"tr":{"pt-BR":{"q":"Quantos irmãos você tem?","a":"Tenho dois irmãos."}}},{"id":"a1-28","q":"What do you want to eat?","a":"I want pizza!","g":"do","dx":["does","wants","who"],"tr":{"pt-BR":{"q":"O que você quer comer?","a":"Eu quero pizza!"}}},{"id":"a1-29","q":"Where do they study?","a":"They study at a school near here.","g":"do","dx":["does","studies","are"],"tr":{"pt-BR":{"q":"Onde eles estudam?","a":"Eles estudam numa escola aqui perto."}}},{"id":"a1-30","q":"What time does the class start?","a":"It starts at eight.","g":"do","dx":["do","starts","hour"],"tr":{"pt-BR":{"q":"Que horas começa a aula?","a":"Começa às oito."}}},{"id":"a1-31","q":"What does this word mean?","a":"It means “happy”.","g":"do","dx":["do","means","is"],"tr":{"pt-BR":{"q":"O que essa palavra significa?","a":"Significa “feliz”."}}},{"id":"a1-32","q":"How do you spell your name?","a":"L-U-C-A-S.","g":"do","dx":["does","spells","what"],"tr":{"pt-BR":{"q":"Como se escreve o seu nome?","a":"L-U-C-A-S.","heads":"O inglês não usa “se” aqui: pergunta com “you”."}},"heads":"English has no “se” here: it asks about “you”."},{"id":"a1-33","q":"Where can I buy a ticket?","a":"You can buy one at that window.","g":"can","dx":["do","buying","when"],"tr":{"pt-BR":{"q":"Onde eu posso comprar uma passagem?","a":"Você pode comprar naquele guichê."}}},{"id":"a1-34","q":"How can I help you?","a":"I'm looking for a jacket.","g":"can","dx":["do","helping","what"],"tr":{"pt-BR":{"q":"Como posso ajudar você?","a":"Estou procurando uma jaqueta.","heads":"O inglês precisa do sujeito depois do verbo modal, mesmo quando o português não usa."}},"heads":"English needs a subject after the modal verb, even when Portuguese leaves it out."},{"id":"a1-35","q":"When can you come to my house?","a":"I can come on Friday.","g":"can","dx":["do","coming","where"],"tr":{"pt-BR":{"q":"Quando você pode vir à minha casa?","a":"Posso ir na sexta."}}},{"id":"a1-36","q":"What languages can you speak?","a":"I can speak Spanish and English.","g":"can","dx":["speaking","are","how"],"
