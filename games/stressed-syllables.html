(function () {
  try {
    var PAL = {
      sky: ["#e4f3fb", "#f1e8fb", "#fdf0e6", 0], peach: ["#ffe6d8", "#ffd6e4", "#fff1c9", 0],

      root.style.setProperty("--bg-a", c[0]); root.style.setProperty("--bg-b", c[1]); root.style.setProperty("--bg-c", c[2]);

<script>
/* Every game saves its progress in the phone's storage. In the app all games share one storage, so each game's
   keys get the prefix "eb:stressed-syllables:" here; two games can then use the same key names without overwriting each other.
   One exception: the background colour (every game saves it as "<prefix>-bg", e.g. "p:sky" or "c:#7aa7ff", like
   the menu) is ONE setting for the whole app, kept under the menu's key "eb-bg": the game opens with the colour
   chosen in the menu, and a colour chosen in a game becomes the menu's and the other games' too. */
(function () {
  try {
    var P = "eb:stressed-syllables:", L = window.localStorage, S = Storage.prototype, BG = /^[a-z]+-bg$/;
    var get = S.getItem, set = S.setItem, del = S.removeItem;
    /* The EN / PT toggles too: ONE language for the whole app, the menu's (eb-lang). Each game saves its toggles
       under its own keys, with its own word for Portuguese (games.json "lang": "pt", "tr" or "native"; English is
       always "en"): reading one gives the menu's language, and a tap in a game changes the menu's and every
       game's. Until EN / PT is chosen, the menu's own rule: Portuguese for My level All / A1 / A2, English from B1. */
    var LG = {"lw-ui": "tr"};
    function appLang() {
      var l = get.call(L, "eb-lang");
      if (l === "en" || l === "pt") return l;
      var lv = get.call(L, "eb-level");
      return lv === "B1" || lv === "B2+" ? "en" : "pt";
    }
    /* The sound-effects volume too (2026-11-26, the user): ONE for the whole app, the menu's "eb-vol" (0-100,
       0 = sound off). Every game saves "<prefix>-vol" (0-100, its Effects slider) plus an on / off key:
       "<prefix>-snd" ("0" = off) or "<prefix>-mute" ("1" = off). Reading them gives the menu's volume (menu at 0:
       the game opens muted, its slider where it was); after a game writes either, eb-vol = 0 if muted, else its
       slider. The Voice slider ("-vvol") stays each game's own. */
    var VOL = /^[a-z]+-vol$/, MUTE = /^[a-z]+-(snd|mute)$/;
    function own(k) { return get.call(L, P + k); }
    function syncVol(k) {
      var pre = k.slice(0, k.indexOf("-")), v = parseInt(own(pre + "-vol"), 10);
      if (isNaN(v) || v < 0 || v > 100) return;
      var off = own(pre + "-snd") === "0" || own(pre + "-mute") === "1";
      set.call(L, "eb-vol", String(off ? 0 : v));
    }
    S.getItem = function (k) {
      if (this === L && BG.test(k)) { var app = get.call(this, "eb-bg"); if (app) return app; }
      if (this === L && (VOL.test(k) || MUTE.test(k))) {
        var ev = get.call(this, "eb-vol");
        if (ev !== null && VOL.test(k) && ev !== "0") return ev;
        if (ev !== null && MUTE.test(k)) { var off = ev === "0"; return /-snd$/.test(k) ? (off ? "0" : "1") : (off ? "1" : "0"); }
      }
      if (this === L && LG.hasOwnProperty(k)) return appLang() === "en" ? "en" : LG[k];
      return get.call(this, this === L ? P + k : k);
    };
    S.setItem = function (k, v) {
      if (this === L && BG.test(k)) set.call(this, "eb-bg", v);
      if (this === L && LG.hasOwnProperty(k)) set.call(this, "eb-lang", String(v) === "en" ? "en" : "pt");
      var r = set.call(this, this === L ? P + k : k, v);
      if (this === L && (VOL.test(k) || MUTE.test(k))) syncVol(k);
      return r;
    };
    S.removeItem = function (k) { return del.call(this, this === L ? P + k : k); };
    /* The app's own keys (eb-rounds, eb-don…) and language, for the injected donation script (donate.js) */
    window.ebApp = { get: function (k) { return get.call(L, k); }, set: function (k, v) { set.call(L, k, v); }, lang: appLang, title: "Stressed Syllables" };
    /* Opened from the menu (a card or Continue)? Then the game starts at the menu's level ("My level"): the menu
       leaves a one-time note (sessionStorage eb-level-go), and the matching level is saved under the game's own
       level key before the game reads it (games.json "level"; the nearest level when the game doesn't have it).
       With "All" on the menu, or on a reload, the game keeps its own last level. */
    var LV = null, SS = window.sessionStorage;
    if (SS.getItem("eb-level-go") === "stressed-syllables") {
      SS.removeItem("eb-level-go");
      var m = get.call(L, "eb-level");
      if (LV && LV[m]) set.call(L, P + LV.key, LV[m]);
    }
  } catch (e) {}
})();
</script>

  background: none;
  --th: var(--h);
  --ig: inset 0 0 12px hsla(var(--th), 95%, var(--sglow-l), var(--sglow-a));   /* the inner glow, drawn above the film by .film::after; the states below change it */
  --osh: 0 6px 14px var(--soap-sh);   /* the outer shadow: drawn by the film once the spans are in (it grows with the bubble when it opens) */
  box-shadow: var(--osh);
  transition: transform .28s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease;
}
/* until its spans are added (a bubble near the screen gets them, 14-soap.js), a plain coloured rim */
.b:not(.soap) { border-color: hsla(var(--h), 75%, var(--rim-l), .75); }
.intro .b { animation: rise .7s cubic-bezier(.2,.8,.3,1) backwards; animation-delay: calc(var(--i) * 5ms); }
/* An invisible hit area. On hover the bubble lifts 8px; the area then reaches below it, so a cursor resting on the
   bottom edge stays "on" the bubble instead of making it bob up and down. */
.b::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.b:focus-visible, .b.playing {
  transform: translateY(-8px) scale(1.07);
  --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14));
  --osh: 0 12px 22px var(--soap-sh2), 0 0 0 4px hsla(var(--th), 90%, 72%, .18); box-shadow: var(--osh);
}
.b:focus-visible { outline: 2px solid var(--underline); outline-offset: 4px; }
.b:active { transform: translateY(-3px) scale(.97); }
.s {
  padding-bottom: 2px;
  background: linear-gradient(var(--underline), var(--underline)) left bottom / 0% 2.5px no-repeat;
  transition: background-size .28s ease;
}
/* Primary stress: a pink line that draws itself. Secondary stress: a red dotted line that fades in. */
.s2 { background: none; text-decoration: underline dotted transparent; text-decoration-thickness: 2.5px; text-underline-offset: .2em; transition: text-decoration-color .28s ease; }
.b:focus-visible .s, .b.playing .s, .b.open .s { background-size: 100% 2.5px; }
.b:focus-visible .s2, .b.playing .s2, .b.open .s2 { text-decoration-color: var(--underline2); }
/* Hover effects only with a mouse: on a touch screen a tapped bubble would otherwise stay "hovered" after it is closed */
@media (hover: hover) {
  .b:hover {
  transform: translateY(-8px) scale(1.07);
    --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14));
    --osh: 0 12px 22px var(--soap-sh2), 0 0 0 4px hsla(var(--th), 90%, 72%, .18); box-shadow: var(--osh);
  }
  .b:hover::after { bottom: -14px; }
  .b:hover .s { background-size: 100% 2.5px; }
  .b:hover .s2 { text-decoration-color: var(--underline2); }
}
.key { text-align: center; margin: 14px 12px 0; font-size: .9rem; opacity: .85; }
.key.hint { font-size: .9rem; }
/* Tap a bubble: it grows a little to fit the Portuguese underneath */
.b .en { display: block; position: relative; }   /* relative: drawn above the soap spans */
.sfx .b .x { font-weight: 600; color: hsl(var(--h) 62% var(--lab-l)); }
.b .pt { position: relative; display: grid; grid-template-rows: 0fr; width: 0; min-width: calc(100% + 2.1em); margin: 0 -1.05em; opacity: 0; transition: opacity .2s ease; }
/* The Portuguese never sets the bubble's width: it takes the English word's width plus most of the side padding
   (width 0, min-width, negative margins) and wraps, so a bubble only grows downwards */
.b.open .pt { grid-template-rows: 1fr; opacity: 1; transition: opacity .25s ease .08s; }
/* The height changes in one step; setOpen (10-bubbles.js) plays it back as a glide. A closing bubble keeps its height
   (the words fading out) until the glide ends. */
.b.closing .pt { grid-template-rows: 1fr; }
.b .pt > span { display: block; min-height: 0; overflow: hidden; }
.b .pt em { display: block; padding-top: .7em; font-style: normal; font-weight: 500; font-size: .66em; line-height: 1.2; text-wrap: balance; color: hsl(var(--h) 62% var(--lab-l)); }
.b.open { --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .1)); }
.snap .pt { transition: none !important; }
/* Homograph pair (REcord · reCORD): both forms in one bubble */
/* Smaller than a normal bubble (font and padding) so more pairs fit in a row on phones; the .pt keeps most of the side padding */
.hb { font-size: clamp(.88rem, 1.1vw + .62rem, 1.15rem); padding: .72em 1em .76em; }
.hb .pt { min-width: calc(100% + 1.6em); margin: 0 -.8em; }
.hb .en { display: flex; align-items: baseline; justify-content: center; gap: .4em; }
.hb .hsep { opacity: .35; }
.hb .pt em { white-space: pre-line; }
/* On a pair the stress is the whole point, so its lines always show (other bubbles show them on tap) */
.hb .s { background-size: 100% 2.5px; }
.hb .s2 { text-decoration-color: var(--underline2); }

/* Soap bubbles (2026-11-22, ported from Be Do Modal's 40-bubbles.css): almost clear, a faint film of colour inside and a
   1.5px coloured rim, both turning once in 10 s, the bubble's own colour (--th) leading. The numbers that differ per
   theme are tokens in 00-base.css (--soap-*, --film-a, --srim-*, --sglow-*, --rimhi-*, --faceg-*). Built from spans
   (SOAP in 14-soap.js; the practice chips .sy too, 20-practice.css), added only to bubbles that come near the screen (630 bubbles: kept lazy, like the Portuguese),
   each drawn once: the film and the rim turn by rotating a still conic gradient (.spin, a transform animation, nothing
   repainted). Only bubbles on screen (.vis) turn; the others hold still. The shine follows the mouse (by transform /
   opacity only) on the practice chips only (on the 630 word bubbles it was too taxing, 2026-11-24). Paint order, bottom to top: the film (.spin, the white
   sheen ::before, the glow facing the mouse .fg on the chips, the inner glow ::after), the shine spot, the rim, the small spot,
   the word. */
:is(.b, .sy) .film { position: absolute; inset: -1.5px; z-index: 0; border-radius: inherit; overflow: hidden; pointer-events: none; }
:is(.b, .sy) .film::before { content: ""; position: absolute; inset: 0; z-index: 1;
  background: radial-gradient(120% 120% at 30% 20%, rgba(255,255,255,var(--soap-hi)), rgba(255,255,255,var(--soap-lo)) 60%, transparent); }
/* On a word bubble the film also draws the outer shadow (--osh), so the shadow follows its outline when it opens */
.b.soap { box-shadow: none !important; }
.b .film { box-shadow: var(--osh); transition: box-shadow .25s ease; }
:is(.b, .sy) .film::after { content: ""; position: absolute; inset: 1.5px; z-index: 3; border-radius: inherit; box-shadow: var(--ig); transition: box-shadow .25s ease; }
/* The turning colour: a square wider than the bubble's diagonal (w + 1.6em covers every closed bubble; an open one is
   taller, so its square grows), centred; rotating it is the same picture as turning the conic gradient's start. */
:is(.b, .sy) .spin { position: absolute; left: 50%; top: 50%; width: calc(100% + 1.6em); aspect-ratio: 1; translate: -50% -50%; }
/* On a word bubble the square is centred where a closed bubble's centre is (its height is 2.6em, a pair's 2.48em),
   not at 50%: so when the bubble opens the turning colours stay put (a conic gradient looks the same at any size around
   its centre), and the open one only needs a bigger square (w + 10em covers the tallest open bubble from there) */
.b .spin { top: calc(1.3em + 1.5px); }
.hb .spin { top: calc(1.24em + 1.5px); }
.b.open .spin, .b.closing .spin { width: calc(100% + 10em); }
.film .spin { background: conic-gradient(from var(--ang), hsla(var(--th), 95%, 76%, var(--film-a)) 0 30%, hsla(calc(var(--th) + 90), 95%, 80%, calc(var(--film-a) * .6)) 50%, hsla(calc(var(--th) + 200), 90%, 82%, calc(var(--film-a) * .7)) 72%, hsla(var(--th), 95%, 76%, var(--film-a)) 92%); }
.rim .spin { background: conic-gradient(from var(--ang), hsla(var(--th), 90%, var(--srim-l), var(--srim-a)) 0 30%, hsla(calc(var(--th) + 90), 90%, calc(var(--srim-l) + 4%), calc(var(--srim-a) * .64)) 50%, hsla(calc(var(--th) + 200), 85%, calc(var(--srim-l) + 8%), calc(var(--srim-a) * .56)) 72%, hsla(var(--th), 90%, var(--srim-l), var(--srim-a)) 92%); }
.b.vis .spin, .sy .spin { animation: spin 10s linear infinite; }   /* the practice chips are few: they always turn */
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
/* While the bubbles glide or one opens / closes the turning pauses: calmFor in 00-util.js (playbackRate, no class) */
/* While the practice window covers the page, the page's films hold still; while the tutorial is
   open, everything behind it (2026-11-24, from Silent Letters / False Friend Bubbles): turning under frosted glass
   dropped Silent Letters' window to ~20 fps (60 when paused). */
/* Classes on <html> set by the code (html.pm-on in 20-practice.js, html.tour-on in 25-tour.js), never html:has(...):
   in Silent letters a :has() on the root made every style update 4-5x slower (an arrangement switch ~300 ms). */
html.pm-on #bubbles .spin { animation-play-state: paused; }
html.tour-on :is(#bubbles .spin, #pmodal .spin, .m.roll .mi) { animation-play-state: paused !important; }
/* What follows the mouse (practice chips only): 14-soap.js writes the transform and opacity of these wrappers (at rest they are as here);
   the look is the <i> inside, so a wrapper has nothing to re-read when it moves. */
.fg > i, .rh > i, .spot i, .glint > i { position: absolute; inset: 0; }
.film .fg { position: absolute; left: -10%; top: -45%; width: 120%; height: 190%; z-index: 2; opacity: 0; }   /* inside, the side facing the mouse glows as it nears */
.fg > i { background: radial-gradient(closest-side, hsla(var(--th), 100%, var(--faceg-l), var(--faceg-a)), transparent); }
/* the shine: a fixed size and place (em), so it never stretches with a wide bubble; inside this game's rounder corner */
:is(.b, .sy) .spot { position: absolute; left: .62em; top: .5em; width: .62em; height: .5em; pointer-events: none; transform: rotate(-14deg); }
.spot > i:first-child { background: radial-gradient(closest-side, rgba(255,255,255,var(--soap-gl)) 32%, rgba(255,255,255,calc(var(--soap-gl) * .55)) 62%, rgba(255,255,255,0)); }
.spot .pl { opacity: 0; }   /* brighter, with a wider core, as the mouse nears (its opacity = the nearness) */
.spot .pl i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--spot-plus) * .85)), rgba(255,255,255,var(--spot-plus)) 42%, rgba(255,255,255,calc(var(--spot-plus) * .55)) 52%, rgba(255,255,255,calc(var(--spot-plus) * .33)) 62%, rgba(255,255,255,calc(var(--spot-plus) * .12)) 81%, rgba(255,255,255,0)); }
/* The small second spot: a thin streak lying along the bottom-right curve (its centre .6em in from both edges, just
   inside the rim of this game's 1.5em corner); it moves the other way from the main spot, a third as far. */
:is(.b, .sy) .glint { position: absolute; right: calc(.6em - .17em); bottom: calc(.6em - .085em); width: .34em; height: .17em; pointer-events: none; opacity: .8; transform: rotate(-45deg); }
.glint > i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--soap-gl) * .75)) 45%, rgba(255,255,255,0)); }
/* The rim: a ring (a mask cuts out its middle), over the clear border. Clipped too: a mask hides its turning square but
   doesn't stop it counting as overflow, so on desktops (where it turns) wide chips gave the practice card a scrollbar
   that came and went with the rotation. */
:is(.b, .sy) .rim { position: absolute; inset: -1.5px; border-radius: inherit; padding: 1.5px; pointer-events: none; overflow: hidden;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.rim .rh { position: absolute; left: -5%; top: -40%; width: 110%; height: 180%; opacity: 0; }   /* the side facing the mouse lights up as it nears */
.rh > i { background: radial-gradient(closest-side, hsla(var(--th), 100%, var(--rimhi-l), var(--rimhi-a)), transparent); }
/* Only the few practice chips keep layers of their own for what moves (the shine). The word bubbles don't (2026-11-24,
   as in Silent letters): four layers per on-screen bubble made scrolling stutter, and their spots hold still now. */
.sy .spot { will-change: transform; }
.sy .glint, .sy .fg, .sy .rh { will-change: transform, opacity; }
/* While the page scrolls (#bubbles.scrolling, 14-soap.js: until 150 ms after the last scroll) the films pause too:
   turning while scrolling made slow frames (Silent letters: 5-14 in 100, 0-4 paused). */
#bubbles.scrolling .spin { animation-play-state: paused; }
/* The spans never take the mouse: a fixed cursor, so a cursor change on the bubble restyles none of them */
:is(.b, .sy) .film, :is(.b, .sy) .spot, :is(.b, .sy) .rim, :is(.b, .sy) .glint { cursor: default; }
@media (prefers-reduced-motion: reduce) { .b.vis .spin, .sy .spin { animation: none; } }
/* Touch screens: the film doesn't turn (as in Be Do Modal: each bubble keeps its own angle, --ang); try it with ?fps first */
@media (hover: none) { .b.vis .spin, .sy .spin { animation: none; } }

/* 20-practice.css — pronunciation practice: Practice button, modal card, intro (cognates, secondary stress), syllable chips, feedback, rule box, memory badge, score / streak tile, progress bar, end screen, particles, keyframes. */
/* ---------- Pronunciation practice ---------- */
/* The pink-to-purple gradients of this game (Practice button, CTAs, progress bar, PT / EN, tour Next, volume, scrollbar)
   span 40° of hue: pink-magenta 315° to purple 275° (hex trio #ff5ed7, #f04dff, #bb5cff). */
.practbtn {
  appearance: none; border: 0; cursor: pointer; display: inline-flex; align-items: center; gap: .45em;
  font-family: inherit; font-weight: 600; font-size: .95rem; line-height: 1; color: #fff;
  padding: .62em 1.1em; border-radius: 999px;
  background: linear-gradient(135deg, hsl(315,85%,68%), hsl(275,80%,68%));
  box-shadow: 0 3px 9px hsla(295,70%,55%,.22); /* a soft glow, the gradient's middle hue */
  transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease;
}
.practbtn:hover { transform: scale(1.05); box-shadow: 0 4px 12px hsla(295,70%,55%,.3); }
.practbtn svg { display: block; flex: none; margin: calc((1em - 18px) / 2) 0; } /* the 18px icon overhangs the 1em line instead of making the button taller than the tab pills */
.practbtn .short { display: none; }
@media (max-width: 560px) { .practbtn { padding-top: .6em; padding-bottom: .6em; } /* the tabs' padding there, same height */
  .practbtn .long { display: none; } .practbtn .short { display: inline; } }
/* The page blurs behind a dimmed layer, with the card in the middle */
.pmodal {
  position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px;
  background: rgba(20,20,40,.35); -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px);
  overscroll-behavior: contain; animation: fadein .2s ease;
}
.pmodal[hidden] { display: none; }
.pcard {
  position: relative; box-sizing: border-box; width: 100%; max-width: 600px; max-height: calc(100dvh - 32px); overflow: hidden auto;
  /* never sideways: the next word slides in from the right, and a horizontal scrollbar flashing for a frame made the card jitter */
  padding: 16px 18px 22px; border-radius: 28px; color: var(--ink);
  background: var(--bg-a); background: color-mix(in srgb, var(--bg-a) 82%, transparent);
  -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3);
  border: 1px solid var(--dock-line); box-shadow: 0 20px 50px rgba(0,0,0,.28);
  animation: cardin .3s cubic-bezier(.34,1.56,.64,1);
}
.phead { display: flex; align-items: center; gap: 10px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pclose { appearance: none; flex: none; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--ink); background: transparent; font: inherit; font-size: 1.7rem; line-height: 1; opacity: .7; transition: background-color .2s ease, opacity .2s ease; }
.pclose:hover { background: var(--dock-line); opacity: 1; }
/* PT / EN: the same pill as the tutorial's (.tour-lang) */
.seg.uilang { flex: none; padding: 2px; border-radius: 999px; border: 1px solid var(--dock-line); }
.seg.uilang button { padding: .45em .75em; font-size: .78rem; font-weight: 600; letter-spacing: .06em; opacity: .6; transition: background-color .25s ease, color .25s ease, opacity .25s ease; }
.seg.uilang button:hover { opacity: 1; background: var(--dock-line); }
.seg.uilang button[aria-pressed="true"] { opacity: 1; color: #fff; background: linear-gradient(135deg, #ff5ed7, #f04dff 55%, #bb5cff); }
.phelp { appearance: none; flex: none; width: 32px; height: 32px; padding: 0; border-radius: 50%; border: 1.5px solid var(--dock-line); display: grid; place-items: center; cursor: pointer; color: var(--ink); background: transparent; font: inherit; font-size: 1rem; font-weight: 600; opacity: .75; transition: background-color .2s ease, opacity .2s ease; }
.phelp:hover { background: var(--dock-line); opacity: 1; }
/* The explanation before the game */
.pslide.pintro { text-align: left; max-width: 520px; margin: 0 auto; }
.pihead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 14px 0 6px; }
.pihead h3 { margin: 0; font-size: 1.2rem; font-weight: 600; line-height: 1.25; }
.pihead .seg { flex: none; padding: 3px; border-radius: 999px; background: var(--dock-line); }
.pintro p { margin: 8px 0; font-size: .98rem; line-height: 1.5; }
.pintro p b { font-weight: 600; }
.pcog { list-style: none; margin: 8px 0 10px; padding: 0; display: grid; gap: 6px; }
.pcog li { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: .45em .9em; border-radius: 16px; background: var(--dock-line); font-size: 1.05rem; }
.pcog li > span:last-child { text-align: right; }
.pcog small { display: block; font-size: .68rem; letter-spacing: .05em; text-transform: uppercase; opacity: .6; }
.pcog u { text-decoration: underline solid var(--underline) 2.5px; text-underline-offset: .2em; text-decoration-skip-ink: none; font-weight: 600; }
.pcog i { font-style: normal; opacity: .35; }
.pcog .arr { opacity: .45; }
.phomos .arr { font-weight: 700; }
.psec { list-style: none; margin: 8px 0 10px; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.psec li { padding: .35em .85em; border-radius: 999px; background: var(--dock-line); font-size: 1.1rem; }
.psec u, .pkey u { text-decoration: underline solid var(--underline) 2.5px; text-underline-offset: .2em; text-decoration-skip-ink: none; }
.psec u { font-weight: 600; }
.psec s, .pkey s { text-decoration: underline dotted var(--underline2) 2.5px; text-underline-offset: .2em; text-decoration-skip-ink: none; }
.psec i { font-style: normal; opacity: .35; }
.phow { margin: 12px 0 4px; padding: .7em 1em; border-radius: 16px; border: 1.5px solid var(--dock-line); }
.phow p { margin: 4px 0; font-size: .95rem; }
.pskip { display: flex; align-items: center; justify-content: center; gap: .5em; margin: 14px 0 0; font-size: .88rem; opacity: .8; cursor: pointer; }
.pskip input { width: 16px; height: 16px; accent-color: hsl(300,70%,60%); }
.pround { flex: 1; text-align: center; font-size: .85rem; font-weight: 500; opacity: .6; }
.score { position: relative; }
/* The word: the whole word small on top, then its syllables with the listen button to their right */
.pword { font-size: 1.25rem; font-weight: 500; letter-spacing: .02em; opacity: .75; margin: 0 0 10px; }
.prow { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 0 0 12px; }
.prow .psyl { margin: 0; min-width: 0; }
/* One row on wider screens: the chips never wrap; when the word is too wide, fitSyl (22-practice-round.js) sets a smaller
   --fs. On phones (max-width 560px) long words wrap to a second row instead: shrunk to one row they looked tiny. */
.prow .psyl { flex-wrap: nowrap; }
.prow .psyl .sy { flex: none; }
.prow .psyl.fit .sy { font-size: var(--fs); }
.prow .psyl.fit .dot { font-size: calc(var(--fs) * .62); }
.plisten { appearance: none; flex: none; display: grid; place-items: center; width: 48px; height: 48px; padding: 0; border-radius: 50%; border: 1.5px solid var(--dock-line); background: transparent; color: var(--ink); cursor: pointer; transition: background-color .2s ease, color .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s ease; }
@media (hover: hover) { .plisten:hover:not(:disabled) { background: var(--dock-line); transform: scale(1.08); } }
.pbtns { display: flex; flex-direction: column; gap: 6px; flex: none; }
.plisten.slowb { width: 48px; height: 32px; border-radius: 16px; font-size: .72rem; font-weight: 600; }
.plisten.slowb svg { width: 22px; height: 22px; }
/* The review tag and the memory badge can sit side by side: same box, top-aligned (inline-flex lines up on the text
   baseline, which the memory badge's icon moves), so neither looks offset */
.ptag, .pmem { display: inline-flex; align-items: center; gap: .4em; vertical-align: top; height: 1.95em; margin: 10px 3px 0; padding: 0 .85em; border-radius: 999px; font-size: .84rem; font-weight: 600; line-height: 1; }
.ptag { color: hsl(265,55%,40%); background: hsla(265,80%,85%,.85); box-shadow: 0 0 0 2px hsla(265,70%,70%,.45); }
:root[data-theme="dark"] .ptag { color: hsl(265,80%,88%); background: hsla(265,50%,35%,.85); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ptag { color: hsl(265,80%,88%); background: hsla(265,50%,35%,.85); } }
.prule { margin: 12px auto 0; max-width: 460px; padding: .65em 1em; border-radius: 16px; text-align: left; font-size: .93rem; line-height: 1.45; background: hsla(45,100%,80%,.45); border: 1.5px solid hsla(45,90%,55%,.55); animation: pup .35s ease-out; }
.prule b.rt { display: block; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: #8a5a00; margin-bottom: 2px; }
:root[data-theme="dark"] .prule b.rt { color: hsl(45,95%,70%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .prule b.rt { color: hsl(45,95%,70%); } }
.prule u { text-decoration: underline solid var(--underline) 2.5px; text-underline-offset: .2em; text-decoration-skip-ink: none; font-weight: 600; }
.prule i { font-style: normal; opacity: .4; }
.plisten.playing { background: var(--ink); color: var(--bg-a); transform: scale(1.08); }
.plisten:disabled { cursor: not-allowed; opacity: .4; }
.plisten svg { display: block; }
/* Phones: smaller syllables without the dots, so most words fit on one line next to the listen button */
@media (max-width: 560px) {
  .prow .plisten.slowb { width: 42px; height: 28px; }
  .prow .psyl { gap: 6px; flex-wrap: wrap; }
  .psyl .dot { display: none; }
  /* --u is the word's rough width in em (set from JS): long words shrink, but not below 1.3rem (smaller looked tiny); past that they wrap */

.pq { font-size: 1.02rem; margin: 16px 0 14px; }

.psyl .dot { font-size: 1.5rem; opacity: .3; }
.sy {
  appearance: none; cursor: pointer; font-family: inherit; font-weight: 500; font-size: clamp(1.55rem, 6.5vw, 2.4rem); line-height: 1;
  color: var(--ink); min-width: 1.7em; padding: .32em .5em .42em; border-radius: .55em;

}
@media (hover: hover) { .sy:hover:not(:disabled) { transform: translateY(-4px) scale(1.06); --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 10px 18px var(--soap-sh2); } }
.sy:disabled { cursor: default; color: var(--ink); }
/* After an answer: the main stress gets the pink line, the secondary stress the red dots */

.sy .syt { position: relative; text-decoration: underline transparent; text-decoration-thickness: 3px; text-underline-offset: .2em; text-decoration-skip-ink: none; transition: text-decoration-color .3s ease; }

.sy.sec .syt { text-decoration-style: dotted; text-decoration-color: var(--underline2); }
/* After an answer the rim turns green / red / amber (its turning colours hidden, as on Be Do Modal's Build words),
   with a glow and a faint tint of that colour */
.sy.ok, .sy.bad, .sy.half { --rc: 150, 60%, 50%; background: hsla(var(--rc), .14); --ig: inset 0 0 16px hsla(var(--rc), .5); }
.sy.bad { --rc: 350, 75%, 62%; }
.sy.half { --rc: 40, 90%, 52%; }
.sy.ok .rim, .sy.bad .rim, .sy.half .rim { background: hsl(var(--rc)); }
.sy.ok .rim i, .sy.bad .rim i, .sy.half .rim i { visibility: hidden; }   /* hidden, not stopped: it keeps turning in step with the film */
.sy.ok { animation: ppop .4s cubic-bezier(.34,1.56,.64,1); }
.sy.bad { animation: shake .45s ease; }
/* Half right (the secondary stress): amber, between the right green and the missed red */
.sy.half { animation: ppop .4s cubic-bezier(.34,1.56,.64,1); }
/* The chips' shine spots, sized for their smaller (.55em) corner: the main spot inside the top-left curve, the streak

.sy .spot { left: .22em; top: .2em; width: .36em; height: .28em; }
.sy .glint { right: calc(.24em - .1em); bottom: calc(.24em - .05em); width: .2em; height: .1em; }
.ppt { min-height: 1.4em; font-size: 1.05rem; font-weight: 500; color: hsl(var(--h) 62% var(--lab-l)); opacity: 0; transition: opacity .3s ease; }
.ppt.show { opacity: 1; }
.pfb { min-height: 1.5em; margin-top: 10px; font-size: .98rem; line-height: 1.45; }
.pfb .ft { font-weight: 600; }
.pfb.good .ft { color: hsl(150,55%,36%); }
.pfb.miss .ft { color: hsl(350,70%,52%); }
.pfb.half .ft { color: hsl(35,85%,40%); }
:root[data-theme="dark"] .pfb.half .ft { color: hsl(42,90%,66%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pfb.half .ft { color: hsl(42,90%,66%); } }
/* The note that the voice may stress the secondary syllable more (devices differ) */
.pvn { display: block; margin-top: 6px; font-size: .86rem; opacity: .75; }
:root[data-theme="dark"] .pfb.good .ft { color: hsl(150,60%,62%); }
:root[data-theme="dark"] .pfb.miss .ft { color: hsl(350,85%,74%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pfb.good .ft { color: hsl(150,60%,62%); } :root:not([data-theme="light"]) .pfb.miss .ft { color: hsl(350,85%,74%); } }
.pfb p { margin: 12px 0 0; }
.pbtn { font: inherit; font-size: .95rem; font-weight: 500; padding: .5em 1.15em; border-radius: 999px; border: 1.5px solid var(--dock-line); background: transparent; color: inherit; cursor: pointer; }
.pbtn:hover { background: var(--dock-line); }
.pbtn.cta { background: linear-gradient(135deg, hsl(315,85%,68%), hsl(275,80%,68%)); color: #fff; border: 0; font-weight: 600; font-size: 1rem; padding: .6em 1.35em; box-shadow: 0 3px 9px hsla(295,70%,55%,.22); }
.pbtn.cta:hover { background: linear-gradient(135deg, hsl(315,90%,73%), hsl(275,85%,73%)); }
.pend { text-align: center; padding: 14px 0 2px; animation: pin .3s ease-out; }
.pend b.big { display: block; font-size: 2.6rem; font-weight: 600; animation: scwin .8s cubic-bezier(.34,1.56,.64,1); }
.pmsg { font-size: 1.2rem; font-weight: 600; margin-top: 2px; }
.psub { font-size: .88rem; opacity: .7; }
.prev { margin: 16px auto 0; max-width: 460px; }
.prev h3 { margin: 0 0 8px; font-size: .9rem; font-weight: 500; opacity: .75; }
.prev ul { list-style: none; margin: 0 0 6px; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; text-align: left; }
.pres { width: 100%; display: grid; grid-template-columns: auto 1fr; column-gap: 8px; align-items: baseline; font: inherit; color: inherit; text-align: left; padding: .4em .8em; border-radius: 14px; border: 1.5px solid hsla(150,60%,50%,.55); background: hsla(150,70%,60%,.1); cursor: pointer; transition: background .15s, transform .15s; }
.pres.bad { border-color: hsla(350,75%,62%,.6); background: hsla(350,85%,70%,.12); }

.pres.bad .pk { color: hsl(350,70%,55%); }
.pres.half { border-color: hsla(40,90%,52%,.6); background: hsla(42,95%,62%,.12); }
.pres.half .pk { color: hsl(35,85%,45%); }

.phend .phres { align-items: start; }
.pres.phres .w { font-size: 1rem; font-weight: 400; line-height: 1.4; }
.pres.phres .w b.hw { font-weight: 600; }
.pres.phres .m { white-space: normal; overflow: visible; }
.pres.phres .ptrs { margin-top: 2px; font-style: italic; }
.pres.phres .ptrs b { font-weight: 600; }
.pres .w { font-size: 1.05rem; font-weight: 500; overflow-wrap: anywhere; }
.pres .m { grid-column: 2; font-size: .8rem; opacity: .7; overflow: hidden; white-space: nowrap; }

.pres .mi { display: inline-block; }
.pres .m.roll { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 12px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 12px), transparent); }
.pres .m.roll .mi { animation: mroll var(--t, 6s) ease-in-out infinite alternate; }
@keyframes mroll { 0%, 22% { transform: none; } 78%, 100% { transform: translateX(var(--d)); } }
@media (prefers-reduced-motion: reduce) {

.pres.speaking, .pres.playing { transform: scale(1.03); }
@media (hover: hover) { .pres:hover { background: var(--dock-line); } }
.prev .w u { text-decoration: underline solid var(--underline) 2.5px; text-underline-offset: .2em; text-decoration-skip-ink: none; }
.prev .w s { text-decoration: underline dotted var(--underline2) 2.5px; text-underline-offset: .2em; text-decoration-skip-ink: none; }

.pacts { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 18px; }
.pf { position: fixed; z-index: 120; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at 30% 30%, #fff, hsla(var(--h),85%,75%,.55)); border: 1px solid hsla(var(--h),85%,68%,.85); animation: pfly .7s ease-out forwards; }

@keyframes pin { from { opacity: 0; transform: translateX(22px); } }
@keyframes pup { from { opacity: 0; transform: translateY(10px); } }
@keyframes ppop { 0% { transform: scale(1); } 45% { transform: scale(1.12); } 100% { transform: scale(1); } }

.psent { max-width: 460px; margin: 4px auto 14px; font-size: 1.15rem; line-height: 1.45; }

.ptrw { margin: -6px 0 12px; }

.psyl.hopts { gap: 10px; }

/* 60-scrollbar.css — scrollbars in the look of the newer games (copied from Silent letters; the page and the practice card): a thin
   glossy pill with the buttons' pink-to-purple gradient on a clear track. Chrome / Edge / Safari use the ::-webkit-scrollbar parts;
   Firefox only takes colours, so it gets a thin pink thumb (in @supports, since Chrome would let these override the pill).
   The page keeps its bar: the page itself is the long list of bubbles. */
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: transparent; margin: 18px 0; }
::-webkit-scrollbar-thumb {
  border: 3px solid transparent; border-radius: 999px; background-clip: padding-box;

  box-shadow: inset 0 1px 0 rgba(255,255,255,.45);

::-webkit-scrollbar-thumb:active { border-width: 2px; }
::-webkit-scrollbar-button, ::-webkit-scrollbar-corner { display: none; background: transparent; }
@supports (-moz-appearance: none) {
  * { scrollbar-width: thin; scrollbar-color: hsl(295,82%,66%) transparent; }
}

/* 90-motion.css — bubble entrance keyframes and the reduced-motion switch-off for the page. */
@keyframes rise { from { opacity: 0; transform: translateY(26px) scale(.9); } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .b, .s, .pt, .fam, body, .seg button, .sw button, .sw label, .swbtn, .volp, .sw { animation: none !important; transition: none !important; }

/* 95-perf.css — the hidden test panel (?fps, 95-perf.js; from Be Do Modal) and what its switches turn off or on (classes on <html>). */
.perfbox { position: fixed; left: 8px; bottom: 8px; z-index: 300; display: flex; flex-direction: column; gap: 5px; padding: 8px 11px 9px; border-radius: 12px;
  background: rgba(10,12,30,.86); color: #fff; font: 500 12px/1.2 "Fredoka", system-ui, sans-serif; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
.perfbox b { font-size: 17px; font-weight: 600; cursor: pointer; }
.perfbox.mini label { display: none; }
.perfbox .pf-slow { opacity: .75; margin-bottom: 2px; }
.perfbox label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.perfbox input { width: 15px; height: 15px; margin: 0; accent-color: #3fcf9a; }
/* longhands, so the pause (animation-play-state in 10-bubbles.css) still works */
html.pf-film-off .b .spin { animation-name: none !important; }
html.pf-film-on .b.vis .spin { animation-name: spin !important; animation-duration: 10s !important; animation-timing-function: linear !important; animation-iteration-count: infinite !important; }
html.pf-nosky .sky { display: none; }
html.pf-noblur * { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }

e stress goes.<\/b> Spelling rules and accent marks tell you: <i>ca-FÉ<\/i>, <i>MÚ-si-ca<\/i>, <i>hos-pi-TAL<\/i>. <b>English has no accent marks<\/b>, so you learn the stress together with each word.","i3":"<b>Watch out for words that look the same.<\/b> The stress often moves:","i4":"In English the <b>unstressed syllables get weak<\/b>, often just a quick “uh”, like the <i>a<\/i> in <i>about<\/i>. That makes the stressed syllable stand out even more.","pt":"Portuguese","en":"English","howTitle":"How to play","i5":"<b>Long words can have a second, weaker stress: the secondary stress.<\/b> It is not as strong as the main stress, but its vowel keeps its full sound instead of turning into “uh”. This is new for Portuguese speakers. In Portuguese only one stress per word matters, so learners often skip the secondary stress or turn it into the main one:","i6":"On this page the <b>main stress<\/b> has a <u>pink line<\/u> and the <b>secondary stress<\/b> has <s>red dots<\/s>. In the game, tap the main one (2 points): the secondary stress is half right (1 point).","how1":"Tap the syllable with the <b>main stress<\/b>: 2 points. The secondary stress is <b>half right<\/b>: 1 point. Each word is read aloud when it appears; the speaker plays it again.","how2":"Every 4th word is a <b>memory challenge<\/b>: no listening, and it is worth <b>double points<\/b>.","how3":"Each point adds to your <b>streak<\/b>. Any other syllable is a mistake and starts it again.","how4":"Words you miss come back in later rounds, and you can review them all at the end.","how5":"Word 6 of each round is a <b>sentence<\/b> with one of these two-stress words in bold. Is it a noun or a verb there? Pick its stress: <b>REC·ord<\/b> or <b>re·CORD<\/b>. It is worth <b>double points<\/b>. You can show the translation, and the sentence is read aloud only after you answer (it would give the stress away).","i7":"<b>Same spelling, different stress.<\/b> Some words are a noun (or an adjective) and a verb. The <b>no to secundário é <b>meio certo<\/b>: 1 ponto. Cada palavra é lida em voz alta quando aparece; o alto-falante repete.","how2":"A cada 4 palavras vem um <b>desafio de memória<\/b>: sem ouvir, e vale <b>pontos em dobro<\/b>.","how3":"Cada ponto aumenta a sua <b>sequência<\/b>. Qualquer outra sílaba é erro e faz ela recomeçar.","how4":"As palavras que você errar voltam nas próximas rodadas, e no fim dá para revisar todas.","how5":"A 6ª palavra de cada rodada é uma <b>frase<\/b> com uma dessas palavras de dois acentos em negrito. Ali ela é substantivo ou verbo? Escolha a tônica: <b>REC·ord<\/b> ou <b>re·CORD<\/b>. Vale <b>pontos em dobro<\/b>. Você pode ver a tradução, e a frase só é lida depois da resposta (senão entregaria a tônica).","i7":"<b>Mesma escrita, tônica diferente.<\/b> Algumas palavras são substantivo (ou adjetivo) e verbo. O <b>substantivo<\/b> tem a tônica na <b>primeira<\/b> sílaba, o <b>verbo<\/b> na <b>segunda<\/b>. O sentido diz qual tônica usar:","showTr":"Mostrar tradução","hideTr":"Esconder tradução","skip":"Pular esta explicação da próxima vez","start":"Começar","backToGame":"Voltar ao jogo","otherWords":"Outras palavras","otherNote":"sem padrão de sufixo","translation":"Tradução","tutorial":"Tutorial","tutorialTitle":"Tutorial: um tour de um minuto","langTitle":"Tradução das palavras e idioma das instruções","ordinal":"{n}ª","homoHead":"Mesma escrita, tônica diferente","homoNote":"substantivo ou verbo? A tônica avisa","kind_noun":"substantivo","kind_verb":"verbo","kind_adjective":"adjetivo","kindA_noun":"um substantivo","kindA_verb":"um verbo","kindA_adjective":"um adjetivo","homoBadge":"Mesma escrita, tônica diferente · pontos em dobro","homoAsk":"Qual tônica combina com a palavra em <b>negrito<\/b>?","homoNoListen":"Ouça depois de responder","homoListen":"Ouvir a frase","homoRight":"Certo! +4","homoIs":"Aqui {w} é {k}, então soa {s}.","homoRule":"Mesma escrita, tônica diferente: o {ka} tem a tônica na {na} sílaba ({a}), o {kb} na {nb} ({b})."},"     el.querySelectorAll(".ebd-qr > div").forEach(function (d) { d.hidden = +d.dataset.i !== i; });
    el.querySelector(".ebd-any").hidden = PIX.codes[i].label !== "any";
    el.querySelector(".ebd-done").hidden = true;
    el.querySelector(".ebd-code").hidden = true;
  }
  function copied() {
    el.querySelector(".ebd-done").hidden = false;
    el.querySelector(".ebd-code").hidden = true;
    stat("PIX code copied", { amount: PIX.codes[pick].label, game: GAME });
    var s = state(); s.gave = true; save(s);       // no more pop-ups; the line in the games comes less often
    ding(659.25); setTimeout(function () { ding(987.77); }, 90);
  }
  function copy() {
    var code = PIX.codes[pick].code, ta = el.querySelector(".ebd-code");
    function fallback() {
      ta.value = code; ta.hidden = false; ta.focus(); ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      if (ok) { ta.hidden = true; copied(); }       // else the code stays shown, selected, to copy by hand
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(code).then(copied, fallback);
    else fallback();
  }
  function open(how) {
    if (!el) build();
    if (!el.hidden) return;
    mode = how || "manual";
    stat("Support opened", { from: mode === "ask" ? "menu pop-up" : GAME === "menu" ? "menu link" : "game line", game: GAME });
    back = document.activeElement;
    el.dataset.lang = A.lang();
    el.classList.remove("qr-on");
    el.querySelector(".ebd-later").hidden = mode !== "ask";
    choose(0);
    el.hidden = false;
    document.documentElement.classList.add("ebd-open");
    try { el.querySelector(".ebd-copy").focus({ preventScroll: true }); } catch (e) {}
    if (mode !== "ask") ding(659.25);
  }
  function close(never) {
    if (!el || el.hidden) return;
    if (mode === "ask" && !never) { var s = state(); s.next = rounds() + ASK_AGAIN; save(s); }
    el.hidden = true;
    document.documentElement.classList.remove("ebd-open");
    try { if (back && back.focus) back.focus({ preventScroll: true }); } catch (e) {}
  }
  // While the panel is open the keyboard belongs to it (games use Escape, arrows and letters)
  window.addEventListener("keydown", function (e) {
    if (!el || el.hidden) return;
    e.stopImmediatePropagation();
    if (e.key === "Escape") { e.preventDefault(); close(); return; }
    if (e.key === "Tab") {
      var f = [].filter.call(el.querySelectorAll("button, textarea"), function (b) { return !b.hidden && b.offsetParent !== null; });
      var at = f.indexOf(document.activeElement);
      e.preventDefault(); f[(at + (e.shiftKey ? f.length - 1 : 1) + f.length) % f.length].focus();
    }
  }, true);
  window.ebDonate = open;

  // ------------------------------------------------------------ sharing
  function shareState() {
    var s = { next: SHARE_FIRST, shared: false };
    try { var v = JSON.parse(A.get("eb-share")); if (v) for (var k in v) s[k] = v[k]; } catch (e) {}
    return s;
  }
  var noteEl = null, noteT = 0;
  function note(en, pt) {
    if (!noteEl) {
      noteEl = document.createElement("div"); noteEl.className = "ebd-note ebd-l";
      noteEl.setAttribute("role", "status"); noteEl.setAttribute("aria-live", "polite");
      document.body.appendChild(noteEl);
    }
    noteEl.dataset.lang = A.lang(); noteEl.innerHTML = both(en, pt);
    noteEl.classList.add("on"); clearTimeout(noteT);
    noteT = setTimeout(function () { noteEl.classList.remove("on"); }, 2800);
  }
  function copyText(s) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(s);
    return new Promise(function (ok, no) {
      var ta = document.createElement("textarea"); ta.value = s; ta.style.cssText = "position:fixed;opacity:0;top:0;left:0";
      document.body.appendChild(ta); ta.select();
      var done = false; try { done = document.execCommand("copy"); } catch (e) {}
      ta.remove(); if (done) ok(); else no();
    });
  }
  function share(from) {
    var pt = A.lang() === "pt", title = window.ebApp && window.ebApp.title;
    var url = GAME === "menu" ? SITE : SITE + "games/" + GAME + ".html";
    var text = title
      ? (pt ? "Estou praticando inglês com o jogo “" + title + "” do English Bubbles. É grátis, experimenta:"
            : "I'm practising English with “" + title + "” on English Bubbles. It's free, try it:")
      : (pt ? "English Bubbles: jogos grátis para praticar inglês, sem cadastro. Funciona no celular, até sem internet."
            : "English Bubbles: free games to practise English, no sign-up. Works on your phone, even offline.");
    function done(how) {
      stat("App shared", { from: from, how: how, game: GAME });
      var s = shareState(); s.shared = true; A.set("eb-share", JSON.stringify(s));
    }
    ding(659.25);
    // phones and tablets: their own share menu (WhatsApp, Instagram...); computers: copy (their share windows are clumsy)
    if (navigator.share && matchMedia("(hover: none)").matches) {
      navigator.share({ title: "English Bubbles", text: text, url: url }).then(function () { done("share menu"); }, function () {});
      return;
    }
    copyText(text + " " + url).then(function () {
      note("Copied! Paste it in a message to a friend.", "Copiado! Cole numa mensagem para um amigo.");
      done("copy");
    }, function () { window.prompt(pt ? "Copie o link:" : "Copy the link:", url); });
  }
  window.ebShare = share;

  // ------------------------------------------------------------ the menu: the pop-up and the footer link
  if (inMenu) {
    var link = document.getElementById("donlink");
    var showLink = function () { if (link) link.hidden = false; };   // always shown (2026-11-26, the user)
    if (link) link.addEventListener("click", function () { open("manual"); });
    var sb = document.getElementById("sharebtn");
    if (sb) sb.addEventListener("click", function () { share("menu button"); });
    // If the chip would sit on a row by itself (narrow phones, a long game name in Continue), Continue shortens its
    // name with "…" so both stay on one row (the chip always keeps its label: "Share" on phones, 20-hero.css).
    var fitShare = function () {
      var cont = document.getElementById("continue");
      if (cont) cont.style.maxWidth = "";
      if (!sb || !sb.offsetParent) return;
      var prev = sb.previousElementSibling;
      while (prev && (prev.hidden || !prev.offsetParent)) prev = prev.previousElementSibling;
      if (!prev || prev !== cont) return;
      if (sb.getBoundingClientRect().top >= prev.getBoundingClientRect().bottom)
        prev.style.maxWidth = (sb.parentNode.clientWidth - sb.offsetWidth - (parseFloat(getComputedStyle(sb.parentNode).columnGap) || 0) - 1) + "px";
    };
    if (sb) {
      fitShare();
      window.addEventListener("resize", fitShare);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitShare);
      var mo = new MutationObserver(function () { requestAnimationFrame(fitShare); });
      mo.observe(sb.parentNode, { attributes: true, subtree: true, attributeFilter: ["hidden"] });
      mo.observe(document.documentElement, { attributes: true, attributeFilter: ["data-lang"] });
      window.addEventListener("pageshow", fitShare);
    }
    var ask = function () {
      showLink();
      var s = state(), help = document.getElementById("help");
      if (s.off || s.gave || s.asks >= MAX_ASKS || rounds() < Math.max(FIRST, s.next)) return;
      if (help && !help.hidden) return;              // the tour is open
      s.asks += 1; s.next = rounds() + ASK_AGAIN; save(s);
      open("ask");
    };
    // after the page has arrived (the header's slide, then the page's fade-in), and again when Back restores it
    var later = function () { var go = function () { setTimeout(ask, 900); }; if (typeof afterSlide === "function") afterSlide(go); else go(); };
    showLink();
    later();
    window.addEventListener("pageshow", function (e) { if (e.persisted) later(); });
    return;
  }

  // ------------------------------------------------------------ a game: count rounds, add the line
  var lastFp = null;
  function ended(after, fp) {
    if (!after || fp === lastFp) return;
    lastFp = fp;
    var n = rounds() + 1;
    A.set("eb-rounds", String(n));
    stat("Round finished", { game: GAME });
    var old = after.parentNode.querySelector(".ebd-line");
    if (old) old.remove();
    var s = state();
    if (n < FIRST || n < s.line) { shareLine(after, n); return; }
    s.line = n + (s.gave ? LINE_EVERY_GAVE : LINE_EVERY); save(s);
    var p = document.createElement("p");
    p.className = "ebd-line ebd-l";
    p.dataset.lang = A.lang();
    p.innerHTML = both("Enjoying English Bubbles?", "Está gostando do English Bubbles?") +
      ' <button type="button">' + HEART + both("Support it", "Apoie") + "</button>";
    p.querySelector("button").addEventListener("click", function (e) { e.stopPropagation(); open("manual"); });
    after.parentNode.insertBefore(p, after.nextSibling);
  }
  function shareLine(after, n) {
    var s = shareState();
    if (n < SHARE_FIRST || n < s.next) return;
    s.next = n + (s.shared ? SHARE_EVERY_DONE : SHARE_EVERY); A.set("eb-share", JSON.stringify(s));
    var p = document.createElement("p");
    p.className = "ebd-line ebd-share ebd-l";
    p.dataset.lang = A.lang();
    p.innerHTML = both("Like it?", "Gostou?") +
      ' <button type="button">' + SHARE_ICON + both("Share it with a friend", "Compartilhe com um amigo") + "</button>";
    p.querySelector("button").addEventListener("click", function (e) { e.stopPropagation(); share("game line"); });
    after.parentNode.insertBefore(p, after.nextSibling);
  }
  function text(root, sel) { var x = root && root.querySelector(sel); return x ? x.textContent : ""; }
  var em = document.getElementById("endmodal"), wasOpen = !!(em && em.classList.contains("show"));
  if (em) new MutationObserver(function () {
    var on = em.classList.contains("show");
    if (on && !wasOpen) ended(em.querySelector(".endbtns") || em.querySelector("#endagain"), "m:" + text(em, "#endscore") + "|" + text(em, "#endlist").slice(0, 400));
    wasOpen = on;
  }).observe(em, { attributes: true, attributeFilter: ["class"] });
  var lastBtn = null;
  new MutationObserver(function () {
    var b = document.getElementById("pagain") || document.getElementById("spagain");
    if (!b || b === lastBtn) return;
    lastBtn = b;
    var box = b.closest(".pacts, .endbtns, p") || b;
    var end = b.closest(".pend") || box.parentNode;
    // the same round's end drawn again (a language switch) has the same words: not a new round
    var words = end.querySelectorAll(".w");
    if (!words.length) words = end.querySelectorAll("li");
    ended(box, "p:" + [].map.call(words, function (x) { return x.textContent.slice(0, 30); }).join("|").slice(0, 400) + text(end, ".big"));
  }).observe(document.body, { childList: true, subtree: true });
})();
</script>
<script>
/* lite.js — LIGHT MODE (2026-11-27, the user): fewer animations on devices that struggle. Runs in the menu (appended to
   its scripts) and in every game (in the injected foot); the look is lite.css. ONE setting for the whole app, eb-lite:
     unset / "ok"  not on: the page is checked (below); "ok" = a check found it smooth (pages are still checked)
     "auto"        on, switched on by the check (a note says so, once)
     "on" / "off"  chosen in Help (the menu's tour): never changed by the check again
   THE CHECK: 3 s after a page opens (the header has landed), the frames of 4 s are timed while the page is on screen.
   Slow = under 35 frames a second or 8+ frames over 50 ms. One slow check is not enough (a page can stutter while it
   settles): a second check 6 s later must agree. No frames (a hidden tab) = no decision.
   ON: html.eb-lite (lite.css), and every endlessly repeating decorative animation is paused (hints keep running) (checked every 1.5 s, as pages add
   elements). window.ebLite = {on(), set(true / false)} for the Help switch. Visitor stats: "Light mode" {how}. */
(function () {
  "use strict";
  var A = window.ebApp || {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    lang: function () { return document.documentElement.dataset.lang === "en" ? "en" : "pt"; }
  };
  var KEY = "eb-lite", root = document.documentElement;
  var GAME = (location.pathname.match(/\/games\/([^\/]+)\.html$/) || [])[1] || "menu";
  function stat(how) { try { if (window.umami && umami.track) umami.track("Light mode", { how: how, game: GAME }); } catch (e) {} }
  function val() { return A.get(KEY) || ""; }
  function isOn() { var v = val(); return v === "auto" || v === "on"; }

  // ------------------------------------------------------------ on / off
  // Hints keep running (small and cheap, and they tell the student something): Verb Wheel's flashing "type here" bar
  // (blink2), the ring on a game's tutorial button (tourping), and any pulse / ping / nudge. Checked 2026-11-27: the
  // 20 games' endless animations are float, spin, bob (decoration, paused) and those two hints.
  var HINT = /blink|ping|pulse|nudge|hint/i;
  var paused = [], timer = 0;
  function calm() {
    if (!root.classList.contains("eb-lite") || document.hidden || !document.getAnimations) return;
    try {
      document.getAnimations().forEach(function (a) {
        var t = a.effect && a.effect.getTiming ? a.effect.getTiming() : null;
        if (t && t.iterations === Infinity && a.playState === "running" && !HINT.test(a.animationName || "")) { a.pause(); paused.push(a); }
      });
    } catch (e) {}
  }
  // SOLID PANELS (2026-11-27, the user: a game's Guide was hard to read): without the blur, a see-through panel shows
  // the game behind its text. Every element styled with a backdrop-filter (found in the page's style sheets) gets its
  // own colour laid over the page's background colour (--bg-a) as a solid background-color, so it keeps its tint and
  // its gradients but nothing shows through. Kept in data-ebl; redone when the colour or theme changes.
  var glassSel = null, probe = null, mo = null, queued = 0;
  function sels() {
    if (glassSel) return glassSel;
    var out = [];
    function walk(rules) {
      for (var i = 0; i < rules.length; i++) {
        var r = rules[i];
        if (r.cssRules && !r.selectorText) { try { walk(r.cssRules); } catch (e) {} continue; }
        if (!r.style || !r.selectorText) continue;
        var bf = r.style.getPropertyValue("backdrop-filter") || r.style.getPropertyValue("-webkit-backdrop-filter");
        if (bf && bf !== "none" && !/eb-lite/.test(r.selectorText)) out.push(r.selectorText);
      }
    }
    for (var s = 0; s < document.styleSheets.length; s++) { try { walk(document.styleSheets[s].cssRules); } catch (e) {} }
    glassSel = out.join(",") || "";
    return glassSel;
  }
  function rgba(c) {
    var m = /rgba?\(([^)]+)\)/.exec(c || ""); if (!m) return null;
    var p = m[1].split(/[ ,\/]+/).filter(Boolean).map(parseFloat);
    return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1];
  }
  function base() {
    if (!probe) { probe = document.createElement("i"); probe.style.cssText = "position:fixed;width:0;height:0;visibility:hidden;background:var(--bg-a)"; }
    if (!probe.isConnected) document.body.appendChild(probe);
    return rgba(getComputedStyle(probe).backgroundColor) || [255, 255, 255, 1];
  }
  function solid() {
    queued = 0;
    if (!root.classList.contains("eb-lite") || !document.body) return;
    var s = sels(); if (!s) return;
    var b = null, els;
    try { els = document.querySelectorAll(s); } catch (e) { return; }
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (el.hasAttribute("data-ebl")) continue;
      var c = rgba(getComputedStyle(el).backgroundColor);
      el.setAttribute("data-ebl", el.style.backgroundColor || "");
      if (!c || c[3] >= .97) continue;
      b = b || base();
      var a = c[3], mix = function (k) { return Math.round(c[k] * a + b[k] * (1 - a)); };
      el.style.setProperty("background-color", "rgb(" + mix(0) + "," + mix(1) + "," + mix(2) + ")", "important");
    }
  }
  function unsolid() {
    var els = document.querySelectorAll("[data-ebl]");
    for (var i = 0; i < els.length; i++) {
      els[i].style.removeProperty("background-color");
      if (els[i].getAttribute("data-ebl")) els[i].style.backgroundColor = els[i].getAttribute("data-ebl");
      els[i].removeAttribute("data-ebl");
    }
  }
  // at most one pass every 60 ms (games change classes all the time while a bubble moves)
  function queue() { if (!queued) queued = setTimeout(solid, 60); }
  var mo2 = null;
  function watch(on) {
    if (mo) { mo.disconnect(); mo2.disconnect(); mo = mo2 = null; }
    if (!on || !window.MutationObserver) return;
    mo = new MutationObserver(queue);           // windows opening, elements added
    mo.observe(document.body || root, { childList: true, subtree: true, attributes: true, attributeFilter: ["class", "hidden", "open"] });
    mo2 = new MutationObserver(function () { unsolid(); queue(); });   // the page's colour or theme changed: all again
    mo2.observe(root, { attributes: true, attributeFilter: ["style", "data-theme"] });
  }
  function apply(on) {
    root.classList.toggle("eb-lite", on);
    var sw = document.querySelectorAll(".lite-sw");                 // the menu's switch shows the state
    for (var i = 0; i < sw.length; i++) sw[i].setAttribute("aria-checked", String(on));
    clearInterval(timer);
    if (on) {
      calm(); timer = setInterval(calm, 1500);
      if (document.body) solid(); else document.addEventListener("DOMContentLoaded", solid);
      watch(true);
    } else {
      watch(false); unsolid();
      paused.forEach(function (a) { try { if (a.playState === "paused") a.play(); } catch (e) {} });
      paused = [];
    }
  }
  window.ebLite = {
    on: isOn,
    set: function (on) { A.set(KEY, on ? "on" : "off"); apply(on); stat(on ? "switched on" : "switched off"); }
  };

  // ------------------------------------------------------------ the note (once, when the check switches it on)
  function note() {
    var n = document.createElement("div");
    n.className = "ebl-note"; n.setAttribute("role", "status"); n.dataset.lang = A.lang();
    n.innerHTML = '<span class="ebl-en" lang="en"><b>Light mode on</b>: fewer animations, so the app runs smoothly on this device. ' +
      'To change it: the <b>?</b> button on the main menu.</span>' +
      '<span class="ebl-pt" lang="pt-BR"><b>Modo leve ligado</b>: menos animações, para o app rodar melhor neste aparelho. ' +
      'Para mudar: botão <b>?</b> no menu inicial.</span>';
    document.body.appendChild(n);
    requestAnimationFrame(function () { requestAnimationFrame(function () { n.classList.add("on"); }); });
    setTimeout(function () { n.classList.remove("on"); setTimeout(function () { n.remove(); }, 400); }, 7000);
  }

  // ------------------------------------------------------------ the check
  function measure(ms, done) {
    var prev = 0, frames = 0, long = 0, span = 0, t0 = 0;
    function tick(t) {
      if (document.hidden) { prev = 0; requestAnimationFrame(tick); return; }
      if (prev) {
        var d = t - prev;
        if (d < 300) { frames++; span += d; if (d > 50) long++; }   // longer gaps: the page was paused, not slow
      }
      prev = t;
      if (!t0) t0 = t;
      if (span >= ms) { done(frames / (span / 1000), long); return; }
      if (t - t0 > ms * 6) { done(null, 0); return; }      // hardly any frames (hidden tab, preview): no decision
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  function slow(fps, long) { return fps !== null && (fps < 35 || long >= 8); }
  function check() {
    var v = val();
    if (v === "auto" || v === "on" || v === "off") return;
    setTimeout(function () {
      measure(4000, function (fps, long) {
        if (fps === null) return;
        if (!slow(fps, long)) { A.set(KEY, "ok"); return; }
        setTimeout(function () {
          measure(4000, function (fps2, long2) {
            var now = val();
            if (fps2 === null || now === "on" || now === "off") return;
            if (!slow(fps2, long2)) { A.set(KEY, "ok"); return; }
            A.set(KEY, "auto"); apply(true); note(); stat("auto");
          });
        }, 6000);
      });
    }, 3000);
  }

  apply(isOn());
  document.addEventListener("visibilitychange", function () { if (!document.hidden) calm(); });
  window.addEventListener("pageshow", function (e) { if (e.persisted) apply(isOn()); });
  if (!window.matchMedia || !matchMedia("(prefers-reduced-motion: reduce)").matches) check();   // reduced motion: already calm
})();
</script>
