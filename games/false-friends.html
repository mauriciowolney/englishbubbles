}
// Enter goes on to the next round, unless it's pressing one of the card's other buttons.
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && G.phase === "done" && !revealEl.hidden && !document.querySelector(".favmodal.show") && $("tour").hidden && !(e.target.closest("button") && e.target.id !== "next")) { e.preventDefault(); nextRound(); }
});
// Any Listen button on a word card: read its example; a list row's Listen (data-sayw): the word, then its example;
// a word bubble with data-word: say the word.
document.addEventListener("click", e => {
  const l = e.target.closest("[data-sayw]");
  if (l) { const s = FF[l.dataset.sayw]; if (s) speakList([s.w, sentText(s, 0)], l, () => {}); return; }
  const b = e.target.closest("[data-say]");
  if (b) { const s = FF[b.dataset.say]; if (s) speak(sentText(s, +b.dataset.ei || 0), b); return; }
  const w = e.target.closest("[data-word]"); if (w) speak(w.dataset.word, w);
});

/* ---------- Little celebrations ---------- */
function toast(text, cls) {
  const t = document.createElement("div"); t.className = "toast " + (cls || ""); t.textContent = text;
  stage.appendChild(t); setTimeout(() => t.remove(), 1700);
}
// A small "+1" that floats up from an element.
function toastAt(el, text) {
  if (reduceMotion) return;
  const b = el.getBoundingClientRect(), t = document.createElement("div");
  t.className = "qz-plus"; t.textContent = text; t.style.left = b.left + b.width / 2 + "px"; t.style.top = b.top + "px";
  document.body.appendChild(t); setTimeout(() => t.remove(), 900);
}
// Bubbles flying out of el. hue: one colour (else every colour); cls: an extra class ("top" = above the modals).
function burst(el, n = 16, hue, cls) {
  if (reduceMotion || !el) return;
  const b = el.getBoundingClientRect(), cx = b.left + b.width / 2, cy = b.top + b.height / 2;
  for (let i = 0; i < n; i++) {
    const p = document.createElement("span"), a = Math.PI * 2 * i / n + rnd(-.2, .2), d = rnd(60, 140), sz = rnd(8, 18);
    p.className = "pf" + (cls ? " " + cls : ""); p.style.left = cx + "px"; p.style.top = cy + "px"; p.style.width = p.style.height = sz + "px";
    p.style.setProperty("--h", hue != null ? hue : Math.round(rnd(0, 360)));
    p.style.setProperty("--dx", Math.cos(a) * d + "px"); p.style.setProperty("--dy", Math.sin(a) * d * .7 + "px");
    document.body.appendChild(p); setTimeout(() => p.remove(), 900);
  }
}

/* 17-progress.js — what the player has done with every false friend, across games, and the daily streak.
   ffb-prog = {id: [attempts, ok (1 = the latest round had no mistake with it), time]}. "Mastered" = latest ok.
   ffb-shown = {id: times it was in a round} (11-rounds.js plays the least shown first).
   ffb-days = "YYYY-MM-DD|days in a row". */
function getProg() { return loadJSON("ffb-prog", {}); }
function recordProgress(id, ok) {
  const p = getProg(), o = p[id] || [0, 0, 0];
  p[id] = [o[0] + 1, ok ? 1 : 0, Date.now()]; store("ffb-prog", JSON.stringify(p));
}
const mastered = (p, id) => !!p[id] && p[id][1] === 1;
function getShown() { return loadJSON("ffb-shown", {}); }
function markShown(id) { const s = getShown(); s[id] = (s[id] || 0) + 1; store("ffb-shown", JSON.stringify(s)); }
function mastery(level) {
  const p = getProg(), list = DATA.words.filter(s => s.lv === level);
  return { m: list.filter(s => mastered(p, s.id)).length, n: list.length };
}
// One level's meter: label, bar, "7 / 12". x = { m, n } (default: the level's mastery).
function meterHTML(level, x) {
  x = x || mastery(level);
  return '<div class="meter" style="' + lvVars(level) + '"><b>' + esc(level) + '</b><div class="pbar"><i style="width:' + (x.n ? x.m / x.n * 100 : 0).toFixed(1) + '%"></i></div><span>' + x.m + " / " + x.n + "</span></div>";
}

/* ---------- Daily streak ---------- */
function dayStr(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dayState() {
  const [d, n] = (load("ffb-days") || "|0").split("|"), y = new Date(); y.setDate(y.getDate() - 1);
  return { d, n: +n || 0, today: dayStr(new Date()), yest: dayStr(y) };
}
// Days in a row, counting today or yesterday (the streak is still alive until a day is skipped).
function getDays() { const s = dayState(); return s.d === s.today || s.d === s.yest ? s.n : 0; }
// Called when a round is finished: the first one of the day extends the streak.
function tickDay() {
  const s = dayState(); if (s.d === s.today) return;
  store("ffb-days", s.today + "|" + (s.d === s.yest ? s.n + 1 : 1)); showDays();
}
function showDays() { const n = getDays(), el = $("days"); el.hidden = n < 2; el.textContent = "🔥 " + n; el.title = tx("daysTitle", { n }); }

/* 18-proof.js — Proofreading: round 4 of a normal game (levels.json "proof" sentences, "proofWrong" of them wrong).
   Lucas, a Brazilian student, wrote the sentences; each has one false friend as a bubble. In a wrong one he used it with
   its look-alike's meaning (I pretend to travel = pretendo viajar: pt-BR "pf" in the word files); a right one is the
   word's first example. Tap a bubble: three choices (what he wrote, the right word, another word; the right-use
   sentences offer the word and its "alt" pair). Check marks each sentence right (green, locked) or wrong (red, shakes);
   after "proofTries" checks the rest are shown (amber). Points: PROOF_PTS for a mistake fixed on the first check, 1
   later, 0 after a hint (the hint shows the sentence's translation for "hintSecs"). A word is ok when its sentence
   was right on the first check without a hint. Words: recently seen ones of the level (ffb-seen) that were not in
   this game, topped up with this game's words. */
const proofEl = $("proof"), checkBtn = $("checkbtn");
const PROOF_PTS = 2;
const proofDue = () => G.mode === "normal" && ((DATA.levels[G.level] || {}).proof || 0) > 0;
// n of the 2n most recently seen words of the level that were not in this game, then this game's words.
function proofWords(n) {
  const has = s => s && s.lv === G.level && trOf(s).pf;
  const seen = getList("ffb-seen").map(x => FF[x.id]).filter(s => has(s) && !G.used.has(s.id));
  return shuffle(seen.slice(0, 2 * n)).concat(shuffle([...G.used].map(id => FF[id]).filter(has))).slice(0, n);
}
function startProof() {
  const ws = proofWords(lvlNum("proof", 5));
  if (ws.length < 2) { G.phase = "done"; return nextRound(); }
  const nw = Math.min(lvlNum("proofWrong", 3), ws.length - 1), wrong = new Set(shuffle(ws.slice()).slice(0, nw));
  const items = shuffle(ws.slice()).map((s, k) => {
    const pf = trOf(s).pf, bad = wrong.has(s), e = s.ex[0];
    const it = bad ? { text: pf.s, shown: pf.o[0], right: pf.o[1], opts: pf.o, t: pf.t }
      : { text: e.s, shown: e.g, right: e.g, opts: [e.g].concat(pf.alt), t: (trOf(s).ex || [])[0] || "" };
    return Object.assign(it, { s, k, bad, cur: it.shown, opts: shuffle(it.opts.slice()), lock: false, tries: 0, hinted: false });
  });
  G.r = { proof: true, level: G.level, words: ws, items, pts: 0, max: PROOF_PTS * nw, hints: 0, mistakes: 0, missed: new Set(), sents: [], checks: 0, act: null };
  G.phase = "proof";
  showSection("proof");
  proofEl.innerHTML = '<span class="tag">&#9998; ' + esc(tx("proofTag")) + "</span>" + items.map(it => {
    const [a, b] = it.text.split("{0}");
    return '<div class="srow prow"><p class="ptext">' + glossWrap(a, it.s) + '<span class="pfw"><button type="button" class="b w ew pfb" aria-haspopup="menu" aria-expanded="false">' +
      esc(it.cur) + "</button></span>" + glossWrap(b, it.s) + '</p><p class="strn" lang="' + esc(curLang) + '" hidden>' + esc(it.t) + "</p></div>";
  }).join("");
  [...proofEl.querySelectorAll(".prow")].forEach((row, k) => { items[k].row = row; items[k].b = row.querySelector(".pfb"); items[k].b.__it = items[k]; });
  flash(proofEl, "in");
  hintEl.innerHTML = tx("proofHow");
}

/* ---------- The choice menu ---------- */
let pfMenu = null;
function openMenu(it) {
  const was = pfMenu && pfMenu.it; closeMenu();
  if (it.lock || G.phase !== "proof" || was === it) return;
  setProofAct(it);
  const m = document.createElement("div");
  m.className = "pfmenu"; m.setAttribute("role", "menu");
  m.innerHTML = it.opts.map(o => '<button type="button" role="menuitem" class="b w ew' + (o === it.cur ? " cur" : "") + '" data-o="' + esc(o) + '">' + enHTML(o) + "</button>").join("");
  it.b.parentNode.appendChild(m); it.b.setAttribute("aria-expanded", "true");
  // Keep the menu inside the card.
  const box = proofEl.getBoundingClientRect(), mb = m.getBoundingClientRect();
  if (mb.right > box.right - 8) m.style.left = "calc(50% - " + (mb.right - box.right + 8) + "px)";
  if (mb.left < box.left + 8) m.style.left = "calc(50% + " + (box.left + 8 - mb.left) + "px)";
  pfMenu = { m, it }; sndHint();
  m.querySelector(".cur") && m.querySelector(".cur").focus({ preventScroll: true });
}
function closeMenu() {
  if (!pfMenu) return;
  pfMenu.m.remove(); pfMenu.it.b.setAttribute("aria-expanded", "false"); pfMenu = null;
}
function choose(it, o) {
  closeMenu();
  if (it.lock) return;
  it.cur = o; it.b.innerHTML = esc(o);
  it.b.classList.toggle("chg", o !== it.shown); it.b.classList.remove("bad");
  flash(it.b, "morph"); sndPlace();
}
function setProofAct(it) { G.r.act = it; G.r.items.forEach(x => x.row.classList.toggle("on", x === it)); renderTools(); }
proofEl.addEventListener("click", e => {
  if (G.phase !== "proof") return;
  const o = e.target.closest(".pfmenu [data-o]"); if (o && pfMenu) return choose(pfMenu.it, o.dataset.o);
  const b = e.target.closest(".pfb"); if (b && b.__it) openMenu(b.__it);
});
document.addEventListener("pointerdown", e => { if (pfMenu && !e.target.closest(".pfmenu, .pfb")) closeMenu(); });
document.addEventListener("keydown", e => {
  if (!pfMenu) return;
  if (e.key === "Escape") { const b = pfMenu.it.b; closeMenu(); b.focus(); }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    const bs = [...pfMenu.m.querySelectorAll("button")], i = bs.indexOf(document.activeElement);
    bs[(i + (e.key === "ArrowDown" ? 1 : bs.length - 1)) % bs.length].focus(); e.preventDefault();
  }
});

/* ---------- Check ---------- */
function proofCheck() {
  const r = G.r; if (G.phase !== "proof") return;
  closeMenu(); r.checks++;
  let left = 0;
  r.items.forEach(it => {
    if (it.lock) return;
    if (it.cur === it.right) {
      it.lock = true; it.b.classList.remove("chg"); it.b.classList.add("ok"); flash(it.b, "morph");
      if (it.bad) { addPts(it.hinted ? 0 : r.checks === 1 ? PROOF_PTS : 1, it.b); sndOk(comboUp()); burst(it.b, 8); }
      if (it.hinted || r.checks > 1) r.missed.add(it.s.id);
    } else {
      left++; it.tries++; r.mistakes++; r.missed.add(it.s.id);
      it.b.classList.add("bad"); flash(it.row, "shake");
    }
  });
  if (left) { comboReset(); sndBad(); }
  if (!left) return finishProof();
  if (r.checks >= lvlNum("proofTries", 2)) {
    // Out of checks: the right words go in (amber), no points.
    r.items.forEach(it => {
      if (it.lock) return;
      it.lock = true; it.cur = it.right;
      setTimeout(() => { if (G.r === r) { it.b.innerHTML = esc(it.right); it.b.className = "b w ew pfb shown"; flash(it.b, "morph"); } }, reduceMotion ? 0 : 700);
    });
    hintEl.innerHTML = tx("proofShown");
    return setTimeout(() => { if (G.r === r) finishProof(); }, reduceMotion ? 300 : 1500);
  }
  hintEl.innerHTML = tx(left === 1 ? "proofLeft1" : "proofLeft", { n: left });
  renderTools(); proofShowMsg(r.items.find(it => !it.lock));
}
// A wrong check on a short screen: the message sits above the sentences, out of sight after Check. Scroll up until it
// shows under the sticky header, but never so far that the first wrong sentence leaves the screen (from Present Perfect).
function proofShowMsg(it) {
  const dock = document.querySelector(".dock"), stuck = dock && /sticky|fixed/.test(getComputedStyle(dock).position);
  const top = (stuck ? dock.getBoundingClientRect().bottom : 0) + 12, m = hintEl.getBoundingClientRect();
  if (m.top >= top) return;
  const row = it && it.row.getBoundingClientRect(), room = row ? innerHeight - 12 - row.bottom : Infinity;
  const dy = Math.max(m.top - top, -Math.max(room, 0));
  if (dy < 0) scrollBy({ top: dy, behavior: reduceMotion ? "auto" : "smooth" });
}
checkBtn.addEventListener("click", proofCheck);

/* ---------- Hint ---------- */
// The active sentence (the last one tapped, else the first open one) shows its translation for a few seconds.
function proofHintTarget() {
  const r = G.r; if (!r || !r.proof) return null;
  const it = r.act && !r.act.lock ? r.act : r.items.find(x => !x.lock);
  return it && !it.hinted && !it.peek ? it : null;
}
function proofHint() {
  const it = proofHintTarget(); if (!it) return false;
  const r = G.r, t = it.row.querySelector(".strn");
  it.hinted = true; it.peek = true; setProofAct(it);
  t.hidden = false; flash(t, "next");
  setTimeout(() => { it.peek = false; if (G.r === r && G.phase === "proof") t.hidden = true; renderTools(); }, lvlNum("hintSecs", 3) * 1000);
  hintEl.innerHTML = tx("hintProof", { n: lvlNum("hintSecs", 3) });
  return true;
}

/* ---------- The end of the round ---------- */
// Under each sentence: its translation and "word = meaning ≠ look-alike = what it means", with the word's star.
function finishProof() {
  const r = G.r, perfect = r.pts === r.max && !r.missed.size;
  G.phase = "done"; closeMenu();
  r.items.forEach(it => {
    it.row.classList.remove("on");
    if (it.bad) it.b.parentNode.insertAdjacentHTML("afterbegin", '<s class="pfold" lang="en">' + esc(it.shown) + "</s> ");
    const t = it.row.querySelector(".strn"); t.hidden = false; flash(t, "next");
    t.insertAdjacentHTML("afterend", '<div class="pwhy"><span class="ffchip' + (r.missed.has(it.s.id) ? " miss" : "") + '"><b lang="en">' + esc(it.s.w) + "</b> = " + trHTML(meanOf(it.s)) +
      '</span> <span class="rnot"><span class="ne">≠</span> ' + notHTML(it.s) + "</span>" + favBtn(it.s.id) + "</div>");
  });
  G.streak = perfect ? G.streak + 1 : 0;
  r.words.forEach(s => { const ok = !r.missed.has(s.id); markSeen(s.id, ok, true); recordProgress(s.id, ok); });
  tickDay();
  G.results.push({ proof: true, words: r.items.map(it => it.s), items: r.items, sents: [], pts: r.pts, max: r.max, perfect, missed: new Set(r.missed) });
  renderTools(); updateProgress();
  toast(perfect ? tx("perfect") : tx("roundPts", { n: r.pts, m: r.max }), perfect ? "" : "zero");
  if (perfect) sndWin();
  hintEl.innerHTML = tx("proofDone");
  setTimeout(() => {
    if (G.r !== r) return;
    toolsEl.hidden = true;
    revealEl.innerHTML = '<div class="rv-btns"><button type="button" class="cta" id="next">' + tx("results") + " &rarr;</button></div>";
    revealEl.hidden = false; $("next").classList.add("pulse"); $("next").addEventListener("click", nextRound);
    revealEl.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" });
  }, reduceMotion ? 0 : 650);
}
// A proofreading sentence as it should be: HTML ("I <s>pretend</s> <b>intend</b> ...") or plain text.
function proofHTML(it) { return esc(it.text).replace("{0}", (it.bad ? "<s>" + esc(it.shown) + "</s> " : "") + '<b class="answ">' + esc(it.right) + "</b>"); }
const proofPlain = it => it.text.replace("{0}", it.right);

/* 19-gloss.js — key words in the Sentences step and in Proofreading show their Portuguese meaning on hover (mouse)
   or tap (touch), as in Gerund or Infinitive. Meanings come from each false friend's pt-BR "gl" ({word or phrase:
   meaning}, covering its 3 examples and its proofreading sentence); keys match in any case, longest first, outside
   the gap or bubble only. A glossed word has a dotted underline. */
const glossEl = document.createElement("div");
glossEl.className = "glosstip"; glossEl.setAttribute("role", "tooltip"); glossEl.hidden = true;
document.body.appendChild(glossEl);
let glossFor = null, glossTimer = 0, lastPointer = "mouse";
const glossRes = {};
// One regex per false friend for its glossary keys, longest first.
function glossRe(s) {
  if (s.id in glossRes) return glossRes[s.id];
  const ks = Object.keys(trOf(s).gl || {}).sort((a, b) => b.length - a.length).map(k => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  return (glossRes[s.id] = ks.length ? new RegExp("\\b(" + ks.join("|") + ")\\b", "gi") : null);
}
// Text t as HTML, false friend s's glossary words wrapped in .gw.
function glossWrap(t, s) {
  const re = s && glossRe(s); if (!re) return esc(t);
  let out = "", last = 0, m;
  re.lastIndex = 0;
  while ((m = re.exec(t))) {
    out += esc(t.slice(last, m.index)) + '<span class="gw" data-w="' + esc(s.id) + '" data-g="' + esc(m[1].toLowerCase()) + '">' + esc(m[1]) + "</span>";
    last = re.lastIndex;
  }
  return out + esc(t.slice(last));
}
function glossOf(el) {
  const d = trOf(FF[el.dataset.w]).gl || {};
  return d[Object.keys(d).find(k => k.toLowerCase() === el.dataset.g)] || "";
}
// Show the meaning just above the word (below it near the top of the screen); linger = hide by itself after a moment.
// A phrase that wraps onto two lines has one box per line: use the line the pointer is on (x, y), else the first one
// (its whole bounding box spans both lines, which put the tip far from the word). From the a / an / the game.
function showGloss(el, linger, x, y) {
  const g = glossOf(el);
  if (!g) return hideGloss();
  showTip(el, '<span class="pick-badge" style="--g:' + esc(lang().grad || "") + '">' + esc(lang().badge || "PT") + '</span><span lang="' + esc(curLang) + '">' + esc(g) + "</span>", linger, x, y);
}
// The tip itself (glosses, and the kind notes in the lists: 21-lists.js). html = its content; note = a sentence (a
// wider, lighter tip that lingers longer on touch).
function showTip(el, html, linger, x, y, note) {
  clearTimeout(glossTimer);
  if (glossFor && glossFor !== el) glossFor.classList.remove("on");
  glossEl.innerHTML = html; glossEl.classList.toggle("note", !!note);
  glossEl.style.left = glossEl.style.top = "0px";   // measure at the left edge: at its old place it could be squeezed narrower
  glossEl.hidden = false; glossFor = el; el.classList.add("on");
  const rs = [...el.getClientRects()], hit = x != null && rs.find(r => x >= r.left - 2 && x <= r.right + 2 && y >= r.top - 2 && y <= r.bottom + 2);
  const b = hit || rs[0] || el.getBoundingClientRect(), t = glossEl.getBoundingClientRect(), below = b.top - t.height - 10 < 8;
  glossEl.style.left = Math.min(Math.max(b.left + b.width / 2 - t.width / 2, 8), innerWidth - t.width - 8) + "px";
  glossEl.style.top = (below ? b.bottom + 10 : b.top - t.height - 10) + "px";

}
function hideGloss() { clearTimeout(glossTimer); glossEl.hidden = true; if (glossFor) glossFor.classList.remove("on"); glossFor = null; }

// Mouse: hovering shows the meaning (not while dragging). Tap or click: the meaning, for a moment on touch.
// A sentence drawn (or redrawn) under a still pointer counts as hovered: its word waits for a real mouse move (the
// browser's own moves after a layout change have no movement), so no meaning flashes up and away (from Lexical Families).
const glossTarget = e => e.target.closest ? e.target.closest(".gw") : null;
let glossPend = null, glossMoved = 0;
document.addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse" || !(e.movementX || e.movementY)) return;
  glossMoved = performance.now();

  if (g === p && !(drag && drag.on)) showGloss(g, false, e.clientX, e.clientY);
}, true);
[sentsEl, proofEl].forEach(box => {
  box.addEventListener("pointerover", e => {
    const g = glossTarget(e); if (!g || e.pointerType !== "mouse" || (drag && drag.on)) return;
    if (performance.now() - glossMoved < 120) showGloss(g, false, e.clientX, e.clientY); else glossPend = g;
  });
  box.addEventListener("pointerout", e => { const g = glossTarget(e); if (!g || e.pointerType !== "mouse" || g.contains(e.relatedTarget)) return; if (g === glossPend) glossPend = null; if (g === glossFor) hideGloss(); });
  box.addEventListener("click", e => { const g = glossTarget(e); if (g) showGloss(g, lastPointer !== "mouse", e.clientX, e.clientY); });
});
document.addEventListener("pointerdown", e => { lastPointer = e.pointerType; if (!glossTarget(e)) hideGloss(); }, true);
addEventListener("scroll", hideGloss, true); addEventListener("resize", hideGloss);

/* 20-end.js — end-of-game modal: score, stars (round points only), hint bonus, level progress,
   day streak, every round (its words, green or red, each with its sentence and the translation), and "Copy results"
   (plain text for the teacher). Practice games (review, favorites) keep no best score. */
const endModal = $("endmodal");

  G.phase = "over";

  if (pool) extras.push(tx("hintsUsed", { n: pool - G.hintsLeft, m: pool }) + (bonus ? tx("bonus", { n: bonus }) : ""));

  $("endprog").innerHTML = meterHTML(G.level) + '<span class="psub">' + tx("mastered", { lvl: esc(G.level) }) + (days >= 2 ? tx("daysRow", { n: days }) : "") + "</span>";
  // One block per round: a header line (mark, round, points), then each word (green, or red if missed) with
  // "≠ look-alike", its sentence and translation, and its favourite star on the right.
  $("endlist").innerHTML = G.results.map((x, i) => {
    const cls = x.perfect ? "" : x.pts / x.max < .5 ? "miss" : "plain";
    const hd = '<li class="' + cls + '"><div class="rhd"><span class="ri">' + (x.proof ? "&#9998;" : x.perfect ? "&#9733;" : "&#10003;") + '</span><span class="rn">' + (x.proof ? tx("proofTag") : tx("roundN", { n: i + 1 })) +
      '</span><span class="rp">' + x.pts + "/" + x.max + '</span></div><div class="rs">';
    // Proofreading: each sentence corrected ("pretend" struck, "intend" in bold) with its translation.
    if (x.proof) return hd + x.items.map(it => '<div class="rsent"><div class="rsb"><span class="ffchip' + (x.missed.has(it.s.id) ? " miss" : "") + '"><b lang="en">' + esc(it.s.w) + "</b> = " + trHTML(meanOf(it.s)) + "</span> " +
      '<span class="rnot"><span class="ne">≠</span> <s lang="' + esc(curLang) + '">' + esc(looksOf(it.s)) + "</s></span>" +
      '<div lang="en">' + proofHTML(it) + "</div>" + (it.t ? '<div class="rt" lang="' + esc(curLang) + '">' + esc(it.t) + "</div>" : "") + "</div>" + favBtn(it.s.id) + "</div>").join("") + "</div></li>";
    return hd +
      x.sents.map(({ s, ex }) => '<div class="rsent"><div class="rsb"><span class="ffchip' + (x.missed.has(s.id) ? " miss" : "") + '"><b lang="en">' + esc(s.w) + "</b> = " + trHTML(meanOf(s)) + "</span> " +
        '<span class="rnot"><span class="ne">≠</span> <s lang="' + esc(curLang) + '">' + esc(looksOf(s)) + "</s></span>" +
        '<div lang="en">' + filledHTML(s, ex) + "</div>" + ((trOf(s).ex || [])[ex] ? '<div class="rt" lang="' + esc(curLang) + '">' + esc(trOf(s).ex[ex]) + "</div>" : "") + "</div>" + favBtn(s.id) + "</div>").join("") +

  $("endcopy").textContent = tx("copy");

// Plain-text summary for the teacher (WhatsApp, Classroom...): every round's words and sentences.
function resultsText() {

/* 21-lists.js — favourite and seen words. A star sits on every finished sentence (reveal card, end list) and on every
   word in the lists; the header buttons open a list modal: Favorites, or Seen (Recent / Missed / All words of the
   level, with the mastery meters). Stored in localStorage as JSON arrays, newest first:
   ffb-fav = [{id}], ffb-seen = [{id, ok}] (one entry per word, ok = no mistake with it in its latest round).
   Every row also gets a Reverso Context "+" (revBtn, at the end). */
const SEEN_MAX = 60;
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.2 2.7 5.5 6 .9-4.35 4.25 1 6L12 17l-5.4 2.85 1-6L3.3 9.6l6-.9z" stroke-linejoin="round"/></svg>';

}

  if (keep && i >= 0) a[i] = { id, ok }; else { if (i >= 0) a.splice(i, 1); a.unshift({ id, ok }); }

}
function favBtn(id) {
  const on = isFav(id);

/* 23-guide.js — the Guide (header button, #guidemodal), from Simple Past / Word Family Bubbles: the opening idea, section
   links, then how to spot a false friend, the kinds (kinds.json, with the level's words of each kind), the Portuguese
   -> English list (every word's look-alike and what it is in English, with a search box), common mistakes (Lucas's
   proofreading sentences, level chip each) and a folded "For the curious". Words: the header's level and the ones
   below. The text is data: src/data/guide.json (English) and i18n/<lang>.json "guide" (same shape; arrays merged item
   by item). EN / <badge> switch saved under ffb-guidelang (unset: the level's instruction language). */
const guideModal = $("guidemodal"), guideLang = $("guidelang"), guideBody = $("guidebody");
const GD_LEVELS = Object.keys(DATA.levels);
const gdLevel = () => G.level || GD_LEVELS[0];
const gdWords = () => DATA.words.filter(s => GD_LEVELS.indexOf(s.lv) <= GD_LEVELS.indexOf(gdLevel()));
function guideEn() { if (!lang().guide) return true; const s = load("ffb-guidelang"); return s ? s === "en" : !nativeUi(); }
// English text with the translation laid over it: objects key by key, arrays item by item.
function gdMerge(en, tr) {
  if (tr == null) return en;
  if (Array.isArray(en)) return en.map((x, i) => gdMerge(x, Array.isArray(tr) ? tr[i] : undefined));
  if (en && typeof en === "object") { const o = {}; Object.keys(en).forEach(k => { o[k] = gdMerge(en[k], tr[k]); }); return o; }
  return typeof tr === typeof en ? tr : en;

// *word* = an English word, in italics.

const gdTip = g => '<p class="gd-tip"><span aria-hidden="true">💡</span><span>' + g.tip.replace(/\*([^*]+)\*/g, '<i lang="en">$1</i>') + "</span></p>";
function gdSpot(g) {
  return gdSec("spot", g.spotTitle, g.spotLead, '<div class="gd-list">' + g.spot.map(r =>
    '<div class="gd-row"><p class="gd-wh"><b>' + esc(r.t) + '</b></p><p class="gd-why">' + gdTxt(r.x) + "</p></div>").join("") + "</div>");
}
// Each kind with its explanation and the words of that kind up to the level.
function gdKinds(g, en) {
  const ws = gdWords();
  return gdSec("kinds", g.kindsTitle, g.kindsLead, '<div class="gd-list">' + Object.keys(DATA.kinds).map(k => {

/* 24-shine.js — the soap bubbles (from Phrasal Verb Bubbles, after Be Do Modal, 2026-11-23): SOAP = the spans inside

   What moves is a bare wrapper whose look is the <i> inside, so only transform / opacity change: nothing is repainted. */
// The film (.film: the turning colour .spin, the glow facing the mouse .fg), the shine spot (.spot + its brighter core

const SOAP = '<span class="film" aria-hidden="true"><i class="spin"></i><i class="fg"><i></i></i></span>' +
  '<span class="spot" aria-hidden="true"><i></i><i class="pl"><i></i></i></span>' +

  el.insertAdjacentHTML("afterbegin", SOAP);

/* Squash and stretch: a carried bubble stretches along the way it moves, more the faster (up to max longer, as much
