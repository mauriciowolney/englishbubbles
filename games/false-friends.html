/* Play menu on the "new game" tile */
.playwrap { position: relative; justify-self: end; }
.playmenu { position: absolute; top: calc(100% + 8px); right: 0; z-index: 40; display: flex; flex-direction: column; gap: 2px; width: max-content; min-width: 210px; padding: 6px;
  border-radius: 20px; background: var(--bg-a); border: 1px solid var(--dock-line); box-shadow: 0 12px 30px var(--shadow); animation: cardin .22s cubic-bezier(.34,1.56,.64,1);
  -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4); }
.playmenu[hidden] { display: none; }
.playmenu button { appearance: none; border: 0; background: transparent; color: var(--ink); font: inherit; font-weight: 600; text-align: left; cursor: pointer;
  display: flex; flex-direction: column; gap: 1px; padding: .55em .9em; border-radius: 14px; }
.playmenu button small { font-weight: 400; font-size: .76rem; opacity: .7; }
.playmenu button:hover:not(:disabled), .playmenu button:focus-visible { background: var(--dock-line); outline: none; }
.playmenu button:disabled { opacity: .45; cursor: default; }
.playmenu button.cur > span::after { content: " ●"; font-size: .6em; vertical-align: .25em; color: var(--underline); }   /* the game being played */
#stage[hidden], .tools[hidden] { display: none; }
.qz-plus { position: fixed; z-index: 60; transform: translate(-50%, -100%); font-weight: 700; font-size: 1.3rem; color: hsl(150,60%,45%); pointer-events: none; animation: qzplus .9s ease-out forwards; }
@keyframes qzplus { to { transform: translate(-50%, -260%); opacity: 0; } }
/* Mastery meters (Seen modal, end screen) */
.meter { display: grid; grid-template-columns: 2.4em 1fr auto; align-items: center; gap: 10px; font-size: .88rem; }
.meter .pbar { margin-top: 0; }
.meter span { font-variant-numeric: tabular-nums; opacity: .8; }
.listprog { display: flex; flex-direction: column; gap: 6px; margin: 0 0 14px; }
.listprog[hidden] { display: none; }
.lp-h { margin: 0; font-size: .8rem; opacity: .7; text-align: center; }
/* "Practice these": top-right of the Favorites / Seen card, left of the ✕ (from Conditional Bubbles) */
#listmodal .favhead { gap: 10px; }
#listmodal .favhead h2 { min-width: 0; }
.favtools { flex: none; display: flex; align-items: center; gap: 8px; }
.favtools .cta { font-size: .85rem; padding: .5em 1.1em; white-space: nowrap; }
.favtools .cta[hidden] { display: none; }
.endprog { display: flex; flex-direction: column; gap: 4px; max-width: 320px; margin: 10px auto 0; text-align: center; }
@media (prefers-reduced-motion: reduce) { .combo.tick, .qz-plus, .playmenu { animation: none; } }
/* The round's three steps (pairs, memo, sentences) under the progress bar */
.steps { display: flex; justify-content: center; gap: 6px; margin-top: 6px; }
.steps i { width: 7px; height: 7px; border-radius: 99px; background: var(--dock-line); transition: width .3s ease, background-color .3s ease; }
.steps i.on { width: 20px; background: var(--underline); }
.steps i.done { background: var(--underline); opacity: .5; }


/* 43-guide.css — the Guide panel (23-guide.js), from Simple Past's 43-guide.css: EN / PT switch, the opening tip,
   section links, how to spot them, the kinds, the Portuguese -> English list with its search box, common mistakes
   (level chip each), the folded "For the curious". */
.guidecard { max-width: 780px; max-height: 88vh; }
.favhead .hr { display: flex; align-items: center; gap: 8px; }
#guidebody { --h: 285; }
.gd-lang { display: flex; gap: 2px; padding: 2px; border-radius: 999px; border: 1px solid var(--dock-line); }
.gd-lang button { appearance: none; cursor: pointer; border: 0; border-radius: 999px; padding: .36em .7em; font-family: inherit; font-size: .74rem; font-weight: 600; letter-spacing: .06em; line-height: 1; color: var(--ink); background: transparent; opacity: .6; touch-action: manipulation; transition: background-color .25s ease, color .25s ease, opacity .25s ease; }
.gd-lang button:hover { opacity: 1; background: var(--dock-line); }
.gd-lang button[aria-pressed="true"] { opacity: 1; color: #fff; background: linear-gradient(135deg, hsl(315, 85%, 64%), hsl(275, 80%, 64%)); }
.gd-lang button:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
/* the opening idea */
.gd-tip { display: flex; gap: 10px; margin: 0 2px 12px; font-size: .98rem; line-height: 1.45; }
.gd-tip > span:first-child { flex: none; }
.gd-tip b { color: var(--underline); }
.gd-tip i { font-weight: 600; }
/* section links */
.gd-nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 12px; }
.gd-navb { appearance: none; cursor: pointer; font-family: inherit; font-size: .84rem; font-weight: 600; padding: .4em .95em; border-radius: 999px; color: var(--ink); background: transparent; border: 1.5px solid var(--dock-line); transition: transform .25s cubic-bezier(.34,1.56,.64,1), background-color .2s ease; }
.gd-navb:hover { transform: translateY(-2px); background: var(--dock-line); }
.gd-navb:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
/* sections */
#guidebody section { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--dock-line); scroll-margin-top: 10px; }
#guidebody h3 { margin: 0; font-size: 1.1rem; font-weight: 600; }
.gd-lead { margin: 4px 0 8px; font-size: .88rem; line-height: 1.4; opacity: .75; }
/* text blocks: a habit, a kind, a curiosity */
.gd-list { display: flex; flex-direction: column; gap: 8px; }
.gd-row { padding: 10px 14px; border-radius: 16px; background: var(--fill-mid); border: 1px solid var(--dock-line); }
.gd-wh { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0; font-size: .97rem; }
.gd-why { margin: 4px 0 0; font-size: .9rem; line-height: 1.45; opacity: .85; }
.gd-why i, .gd-wh i { font-weight: 600; }
.gd-word + .gd-word { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--dock-line); }
.gd-wh .kchip { cursor: default; }
/* the words of a kind */
.gd-ws { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.gd-v { display: inline-block; padding: .14em .65em .18em; border-radius: 999px; font-size: .88rem; font-weight: 600; line-height: 1.3; white-space: nowrap; color: hsl(212, 72%, var(--lab-l)); background: var(--bg-a); border: 1px solid var(--dock-line); }
/* the Portuguese -> English list: look-alike → what to say (≠ the false friend), two columns on wide screens */
.gd-find { box-sizing: border-box; width: 100%; margin: 2px 0 8px; padding: .55em 1em; border-radius: 999px; border: 1px solid var(--dock-line); background: var(--fill-mid); color: var(--ink); font-family: inherit; font-size: .92rem; }
.gd-find:focus-visible { outline: 2px solid var(--underline); outline-offset: 1px; }
.gd-map { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 5px 10px; }
.gd-map li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 7px; padding: 6px 12px; border-radius: 14px; background: var(--fill-mid); border: 1px solid var(--dock-line); font-size: .92rem; line-height: 1.3; }
.gd-map li[hidden] { display: none; }
.gd-arrow { font-size: .95rem; font-weight: 600; line-height: 1; color: var(--underline); }
.gd-not { font-size: .82rem; color: hsl(350, 65%, var(--lab-l)); }
.gd-not s { text-decoration-color: hsla(350, 70%, 55%, .7); }
.gd-none { margin-top: 6px; }
@media (max-width: 640px) { .gd-map { grid-template-columns: 1fr; } }
/* a folding card (For the curious) */
.gd-u { margin-top: 8px; border-radius: 18px; background: var(--fill-mid); border: 1.5px solid hsla(var(--h), 70%, var(--rim-l), .6); scroll-margin-top: 10px; }
.gd-u > summary, .gd-m > summary { display: flex; align-items: center; gap: 4px 12px; padding: 10px 34px 10px 14px; position: relative; cursor: pointer; list-style: none; border-radius: 16px; transition: background-color .2s ease; }
.gd-u > summary::-webkit-details-marker, .gd-m > summary::-webkit-details-marker { display: none; }
.gd-u > summary::after, .gd-m > summary::after { content: ""; position: absolute; right: 16px; top: calc(50% - 6px); width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; opacity: .6; transform: rotate(45deg); transition: transform .25s ease; }
.gd-u[open] > summary::after, .gd-m[open] > summary::after { transform: rotate(-135deg) translate(-3px, -3px); }
.gd-u > summary:hover, .gd-m > summary:hover { background: hsla(var(--h), 85%, 72%, .12); }
.gd-u > summary:focus-visible, .gd-m > summary:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
.gd-u h4 { margin: 0; font-size: 1.05rem; font-weight: 600; color: hsl(var(--h), 60%, var(--lab-l)); }
.gd-u[open] { padding-bottom: 12px; }
.gd-u[open] > :not(summary) { margin-left: 14px; margin-right: 14px; }
.gd-cur { margin-top: 22px; }
.gd-all { margin-top: 0; }   /* the folded Portuguese -> English list, right under its search box */
/* common mistakes: Lucas's sentence (red, struck), tap for the fixed one and why */
#gd-mis h3 { color: hsl(350, 65%, var(--lab-l)); }
.gd-mlist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; align-items: start; gap: 10px; }
.gd-mlist li { border-radius: 16px; background: var(--fill-mid); border: 1px solid var(--dock-line); }
.gd-m { --h: 350; }
.gd-m > summary { padding: 11px 34px 11px 14px; }
.gd-m[open] { padding-bottom: 12px; }
.gd-m[open] > :not(summary) { margin-left: 14px; margin-right: 14px; }
.gd-m .lvchip { flex: none; font-size: .6rem; padding: .28em .7em; background: linear-gradient(135deg, var(--lv), var(--lv2)); color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
.gd-wrong, .gd-right { margin: 0; font-size: .97rem; line-height: 1.4; }
.gd-wrong b, .gd-right b { font-weight: 700; }
.gd-wrong { color: hsl(350, 70%, var(--lab-l)); }   /* the sentence red; only the wrong word struck out */
.gd-wrong b { text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: hsla(350, 70%, 55%, .75); }
.gd-wrong span, .gd-right span { display: inline-block; text-decoration: none; margin-right: 2px; }
.gd-right { margin-top: 2px; color: hsl(145, 60%, var(--lab-l)); }
@media (max-width: 640px) { .gd-mlist { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .gd-navb, .gd-u > summary::after, .gd-m > summary::after { transition: none; } }

/* 45-phone.css — phones: a compact top of the page (the dock on one row, smaller score / new game tiles, a short
   instruction) so the board starts higher. */
@media (max-width: 600px) {
  .dock { flex-wrap: nowrap; justify-content: space-between; gap: 2px; margin-top: 8px; padding: 4px 6px; border-radius: 22px; }
  /* the level picker takes the row's spare room (up to 140px), so the icons don't float in empty space */
  .seg.level { width: auto; flex: 1 1 auto; max-width: 140px; }
  .seg.level button { flex: 1 1 0; font-size: .84rem; padding: .55em .7em; }
  .seg.vseg { flex: none; }
  .volwrap { flex: none; }
  #snd { padding: .4em .45em; }
  .pick { padding: .24em .4em .24em .24em; }
  .tourbtn { padding: .42em; }
  .hbtns { gap: 2px; }
  .go { grid-template-columns: 62px 1fr 62px; column-gap: 8px; margin-top: 18px; }   /* more room under the header (as in Core Word Bubbles) */
  .score, .tile { width: 62px; height: 44px; border-radius: 15px; gap: 1px; padding: 0 4px; }
  .score b { font-size: 1.15rem; }
  .score small, .tile small { font-size: .62rem; }
  .tile svg { width: 18px; height: 18px; }
  .hint { font-size: .86rem; line-height: 1.3; margin: 8px 6px 0; min-height: 2.6em; }
  #stage { padding-top: 8px; }   /* the card labels stick up above the cards: room under the instructions (as in Core Word Bubbles) */
  .tag { font-size: .62rem; letter-spacing: .08em; }   /* the card labels a tad smaller */
  /* End card: thinner edges so the sentences get the width */
  #endmodal { padding: 10px; }
  #endmodal .favcard { padding: 12px 10px 14px; max-height: 88vh; }
  #endlist li { padding: 8px 8px 10px 12px; }
}
/* Very narrow phones: the language chevron goes, then the dock may wrap */
@media (max-width: 380px) { .pick-chev { display: none; } }
@media (max-width: 340px) { .dock { flex-wrap: wrap; justify-content: center; } }

/* 60-scrollbar.css — scrollbars in the look of the Stressed syllables game (cards and lists; the page has none): a thin glossy pill with the buttons'
   pink-to-purple gradient on a clear track. Chrome / Edge / Safari use the ::-webkit-scrollbar parts; Firefox only takes
   colours, so it gets a thin pink thumb (in @supports, since Chrome would let these override the pill). */
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: transparent; margin: 18px 0; }
::-webkit-scrollbar-thumb {
  border: 3px solid transparent; border-radius: 999px; background-clip: padding-box;
  background-image: linear-gradient(180deg, hsl(315,85%,66%), hsl(275,80%,64%));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45);
}
::-webkit-scrollbar-thumb:hover { background-image: linear-gradient(180deg, hsl(315,90%,60%), hsl(275,85%,58%)); }
::-webkit-scrollbar-thumb:active { border-width: 2px; }
::-webkit-scrollbar-button, ::-webkit-scrollbar-corner { display: none; background: transparent; }
@supports (-moz-appearance: none) {
  * { scrollbar-width: thin; scrollbar-color: hsl(295,82%,66%) transparent; }
}
/* The page itself still scrolls on short screens, but shows no bar (only the cards and lists do). */
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }

</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"></div>
<header class="dock" role="toolbar" aria-label="Controls">
  <div class="seg level" id="levelseg" role="group" aria-label="Level"><span class="seg-ind" aria-hidden="true"></span></div>
  <button type="button" class="tourbtn" id="guidebtn" aria-label="Guide" title="False friends guide: how to spot them, Portuguese to English, common mistakes"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M8 8h8M8 12h5"/></svg><span data-ui="guide">Guide</span></button>
  <span class="hbtns" id="listbtns">
  <button type="button" class="tourbtn" id="favbtn" aria-label="Favorites" title="Your favorite words"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3.2 2.7 5.5 6 .9-4.35 4.25 1 6L12 17l-5.4 2.85 1-6L3.3 9.6l6-.9z"/></svg><span data-ui="favorites">Favorites</span></button>
  <button type="button" class="tourbtn" id="seenbtn" aria-label="Seen words" title="Recently seen and missed words, and every word of the level"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 4v4.5h4.5"/><path d="M12 7.5V12l3 2"/></svg><span data-ui="seen">Seen</span></button>
  </span>
  <button type="button" class="tourbtn" id="tour-btn" aria-label="Tutorial" title="Tutorial: a one-minute tour"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.2a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.4-2.7 4"/><circle cx="12" cy="17.6" r=".6" fill="currentColor"/></svg><span data-ui="tutorial">Tutorial</span></button>
  <div class="seg vseg">
    <span class="volwrap" id="volwrap"><button type="button" id="snd" aria-pressed="true" aria-label="Volume" title="Volume"></button><span class="volp"><label class="volr"><span data-ui="volEffects">Effects</span><input type="range" id="vol" min="0" max="100" step="1" aria-label="Sound effects volume" data-ui-aria="volEffectsAria"></label><label class="volr"><span data-ui="volVoice">Voice</span><input type="range" id="vvol" min="0" max="100" step="1" aria-label="Voice volume" data-ui-aria="volVoiceAria"></label></span></span>
  </div>
  <div class="swwrap" id="swwrap">
    <button type="button" class="swbtn" id="swbtn" aria-label="Background color" aria-expanded="false" title="Background color"></button>
    <div class="sw" id="swatches" role="group" aria-label="Background color"></div>
  </div>
</header>

<div class="wrap">
  <div class="go">
    <div class="score" id="score" title="Points in this game, and your best at this level"><b id="sc">0</b><small id="bestlbl">best 0</small><i class="combo" id="combo" hidden></i></div>
    <div class="prog"><span id="proglbl">Round 1 of 3</span><span class="days" id="days" hidden></span><div class="pbar"><i id="pfill"></i></div><div class="steps" id="steps" aria-hidden="true"><i></i><i></i><i></i></div></div>
    <div class="playwrap" id="playwrap">
      <button type="button" class="tile" id="restart" title="New game and other ways to play" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.5h-4.5"/></svg><small data-ui="newGame">new game</small></button>
      <div class="playmenu" id="playmenu" role="menu" hidden>
        <button type="button" role="menuitem" data-mode="normal"><span data-ui="pmNormal">Normal game</span><small id="pm-lv"></small></button>
        <button type="button" role="menuitem" data-mode="review"><span data-ui="pmReview">Review missed</span><small id="pm-miss"></small></button>
        <button type="button" role="menuitem" data-mode="fav"><span data-ui="pmFav">Favorites</span><small id="pm-fav"></small></button>
      </div>
    </div>
  </div>
  <p class="hint" id="hint" aria-live="polite"></p>

  <main id="stage" aria-label="Game board">
    <div class="pool" id="pool" aria-label="Words"></div>
    <div class="rows" id="rows"></div>
    <div class="memo" id="memo" hidden aria-live="polite"></div>
    <div class="sents" id="sents" hidden></div>
    <div class="sents proof" id="proof" hidden></div>
  </main>

  <div class="tools" id="tools">
    <button type="button" class="pbtn" id="hintbtn"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2.2h5c.1-1 .5-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg><span class="lbl" data-ui="hint">Hint</span> <small id="hintleft"></small></button>
    <button type="button" class="cta" id="checkbtn" hidden><span data-ui="check">Check</span></button>
  </div>

  <section class="reveal" id="reveal" hidden aria-live="polite"></section>
</div>

<div class="favmodal" id="guidemodal" role="dialog" aria-modal="true" aria-labelledby="guidetitle">
  <div class="favcard guidecard">
    <div class="favhead"><h2 id="guidetitle">Guide</h2><div class="hr"><div class="gd-lang" id="guidelang" role="group" aria-label="Guide language"><button type="button" data-gl="tr" aria-pressed="false"></button><button type="button" data-gl="en" aria-pressed="true">EN</button></div><button type="button" class="favx" data-close aria-label="Close">&times;</button></div></div>
    <div id="guidebody"></div>
  </div>
</div>
<div class="favmodal" id="listmodal" role="dialog" aria-modal="true" aria-labelledby="listtitle">
  <div class="favcard">
    <div class="favhead"><h2 id="listtitle"></h2><div class="favtools"><button type="button" class="cta" id="listplay" hidden></button><button type="button" class="favx" data-close aria-label="Close">&times;</button></div></div>
    <div class="listprog" id="listprog" hidden></div>
    <div class="seg listtabs" id="listtabs" role="group" aria-label="Which words"><button type="button" data-tab="recent" data-ui="tabRecent">Recent</button><button type="button" data-tab="missed" data-ui="tabMissed">Missed</button><button type="button" data-tab="all" data-ui="tabAll">All words</button></div>
    <ul class="rlist" id="listbody"></ul>
    <p class="listempty" id="listempty" hidden></p>
  </div>
</div>
<div class="favmodal" id="endmodal" role="dialog" aria-modal="true" aria-labelledby="endtitle">
  <div class="favcard">
    <div class="favhead"><h2 id="endtitle"></h2><button type="button" class="favx" data-close aria-label="Close">&times;</button></div>
    <div class="pend"><div class="stars" id="endstars"></div><b id="endscore"></b><div class="pmsg" id="endmsg"></div><div class="psub" id="endsub"></div><div class="psub" id="endhints"></div></div>
    <div class="endprog" id="endprog"></div>
    <div class="endbtns"><button type="button" class="cta" id="endagain" data-ui="playAgain">Play again</button><button type="button" class="pbtn" id="endcopy" data-ui="copy">Copy results</button><button type="button" class="pbtn" id="endup" hidden></button></div>
    <ul class="rlist" id="endlist"></ul>
  </div>
</div>

<div class="tour" id="tour" hidden>
  <div class="tour-shield"></div>
  <div class="tour-spot" id="tour-spot" aria-hidden="true"></div>
  <div class="tour-card" id="tour-card" role="dialog" aria-modal="true" aria-labelledby="tour-title" aria-describedby="tour-text">
    <button type="button" class="tour-x" id="tour-x" aria-label="Close the tutorial">&times;</button>
    <div class="tour-head">
      <p class="tour-step" id="tour-step"></p>
      <div class="tour-lang" id="tour-lang" role="group" aria-label="Tutorial language"><button type="button" data-tl="en" lang="en">EN</button><button type="button" data-tl="tr"></button></div>
    </div>
    <h2 class="tour-title" id="tour-title"></h2>
    <div class="tour-text" id="tour-text"></div>
    <div class="tour-foot">
      <div class="tour-dots" id="tour-dots" aria-hidden="true"></div>
      <div class="tour-nav">
        <button type="button" class="tour-back" id="tour-back">Back</button>
        <button type="button" class="tour-next" id="tour-next">Next</button>
      </div>
    </div>
  </div>

item by item, so a translation only needs the fields it changes). *word* = an English word (italics). tip may hold <b>. The kinds section comes from kinds.json (its words from the word files), the Portuguese -> English list from every word's looks / looksEn, and each mistake from that word's proofreading sentence (pf); all of them up to the level being played. build.py checks the keys, the mistake ids and the translation's shape.","title":"False friends guide","tip":"Most English words that look like Portuguese ones mean the same thing: *hospital*, *important*, *family*. A <b>false friend<\/b> looks the same but means something else: *pretend* is <b>fingir<\/b>, not pretender. When the look-alike meaning makes a sentence strange, stop and check.","nav":{"spot":"How to spot them","kinds":"Not always false","map":"Portuguese → English","mis":"Common mistakes"},"spotTitle":"How to spot them","spotLead":"Five habits that keep you out of the traps.","spot":[{"t":"Read the whole sentence","x":"If the Portuguese meaning makes the sentence strange, the word is probably a false friend: in *She pretended to be asleep*, \"pretendeu estar dormindo\" makes no sense, so pretend must mean something else (fingir)."},{"t":"Distrust everyday words","x":"The most common traps are simple words you use every day: *parents*, *college*, *library*, *push*, *actually*."},{"t":"Watch out for borrowed words","x":"Words Brazil took from English often mean something else here: in English, *shopping* is not a mall and *outdoor* is not a billboard."},{"t":"Endings help, but not always","x":"*-tion* = -ção and *-ty* = -dade usually work (*nation*, *city*), but not always: an *inscription* is words carved in stone, not the inscrição for a course (*registration*)."},{"t":"Learn both directions","x":"Know what the English word means, and also how to say its Portuguese look-alike in English: pretender = *intend*. The Portuguese → English list below has them all."}],"kindsTitle":"Not always false","kin confie.","nav":{"spot":"Como reconhecer","kinds":"Nem sempre falsos","map":"Português → inglês","mis":"Erros comuns"},"spotTitle":"Como reconhecer","spotLead":"Cinco hábitos que livram você das armadilhas.","spot":[{"t":"Leia a frase inteira","x":"Se o sentido em português deixa a frase estranha, a palavra provavelmente é um falso cognato: em *She pretended to be asleep*, \"pretendeu estar dormindo\" não faz sentido, então pretend quer dizer outra coisa (fingir)."},{"t":"Desconfie das palavras do dia a dia","x":"As armadilhas mais comuns são palavras simples que a gente usa todo dia: *parents*, *college*, *library*, *push*, *actually*."},{"t":"Cuidado com os estrangeirismos","x":"Palavras que o Brasil pegou do inglês muitas vezes querem dizer outra coisa aqui: em inglês, *shopping* não é o centro comercial e *outdoor* não é o painel na estrada."},{"t":"Terminações ajudam, mas nem sempre","x":"*-tion* = -ção e *-ty* = -dade costumam funcionar (*nation*, *city*), mas nem sempre: *inscription* é uma inscrição gravada na pedra, não a inscrição num curso (*registration*)."},{"t":"Aprenda nos dois sentidos","x":"Saiba o que a palavra em inglês quer dizer e também como dizer em inglês a palavra parecida do português: pretender = *intend*. A lista Português → inglês, mais abaixo, tem todas."}],"kindsTitle":"Nem sempre falsos","kindsLead":"Algumas palavras só são falsas às vezes, ou ganharam outro sentido no Brasil. No jogo, elas levam uma destas etiquetas.","kindsX":{"partial":"Só é falso em alguns contextos: um dos sentidos é igual ao do português.","borrowed":"O português pegou a palavra do inglês e usa com outro sentido.","mixup":"Não é cognato de verdade, mas é fácil confundir as duas palavras."},"mapTitle":"Português → inglês","mapLead":"Quer dizer uma destas palavras em inglês? Não use a parecida: diga esta.","mapFind":"Procurar uma palavra","mapNone":"Nenhuma palavra encontrada.","mapAll":"Ver as {n} palavras","misTitle":"Erros comuns","misLead":"Frases que o Lucas e     s.style.cssText = "width:" + size + "px;height:" + size + "px;left:" + Math.round(Math.random() * 96) + "%;" +
      "--h:" + hues[k % hues.length] + ";--t:" + t + "s;--d:-" + at.toFixed(1) + "s;--x:" + Math.round(Math.random() * 80 - 40) + "px";
    host.appendChild(s);
  }
  setTimeout(() => host.classList.add("in"), 60);   // a timer, not a frame: a page opened in the background gets none
})();

/* 10-game.js — game state, flow and scoring. One game = ROUNDS rounds at the chosen level. A round (chosen by
   11-rounds.js) has three false friends and three steps: Pairs (12-pairs.js: drag the floating words into the rows
   "pretend looks like ___ but it actually means ___"), Memo (14-memo.js: only the word + meaning pairs stay, read aloud
   one by one), Sentences (15-sentence.js: the three words go into three sentences); then the reveal card (16-reveal.js).
   Points: Pairs +1 per gap filled right first time; Sentences +SENT_PTS first time, +1 on the second try. Hints come
   from a pool for the whole game (levels.json "hints"), at most "hintsPerRound" a round; every unused hint is a bonus
   point at the end. G.combo counts right moves in a row (the chime climbs with it). Normal games end with a
   Proofreading round (18-proof.js) when the level has "proof" sentences. */
const ROUNDS = 3, SENT_PTS = 2;
const LEVELS = Object.keys(DATA.levels);
const FF = {};
DATA.words.forEach(s => { FF[s.id] = s; });
const lvIdx = l => LEVELS.indexOf(l);
// Rules come from the level of the round being played (practice games can mix levels).
const lvl = () => DATA.levels[(G.r && G.r.level) || G.level] || {};
const lvlNum = (k, d) => lvl()[k] == null ? d : lvl()[k];
const hintPool = () => (DATA.levels[G.level] || {}).hints || 0;
const maxHints = () => lvlNum("hintsPerRound", 2);
const G = { level: "", mode: "normal", seeds: null, total: ROUNDS, idx: 0, score: 0, results: [], streak: 0, combo: 0, hintsLeft: 0, r: null, used: new Set(), phase: "idle" };
const stage = $("stage"), revealEl = $("reveal"), hintEl = $("hint"), toolsEl = $("tools");
const scoreEl = $("score"), scEl = $("sc"), bestEl = $("bestlbl"), hintBtn = $("hintbtn"), triesEl = $("tries");

/* ---------- Game flow ---------- */
// mode: "normal" | "review" | "fav" (22-modes.js); ids = the words a review / favourites game is built around.
function newGame(level, mode = "normal", ids) {
  G.level = level; G.mode = mode; applyUi();
  document.body.classList.toggle("practice-mode", mode !== "normal");   // review / favorites: Back returns to a normal game (22-modes.js)
  G.seeds = ids ? shuffle(ids.filter(id => FF[id])) : null;
  G.total = G.seeds ? Math.min(ROUNDS, Math.ceil(G.seeds.length / lvlNum("words", 3))) : ROUNDS + (proofDue() ? 1 : 0);
  G.idx = 0; G.score = 0; G.results = []; G.streak = 0; G.combo = 0; G.r = null; G.used = new Set();
  G.hintsLeft = hintPool();
  hush(); stage.hidden = toolsEl.hidden = false; revealEl.hidden = true;
  showCombo(); showScore();
  startRound();
}
function startRound() {
  if (G.mode === "normal" && G.idx >= ROUNDS) {
    revealEl.hidden = true; revealEl.innerHTML = ""; toolsEl.hidden = false;
    startProof(); renderTools(); updateProgress(); riseStage(); return;
  }
  const R = makeRound();
  if (!R) { G.phase = "idle"; hintEl.textContent = tx("noRound"); return; }
  G.r = Object.assign(R, { pts: 0, max: 0, hints: 0, mistakes: 0, missed: new Set(), sents: [] });
  R.words.forEach(s => { G.used.add(s.id); markShown(s.id); });
  revealEl.hidden = true; revealEl.innerHTML = ""; toolsEl.hidden = false;
  startPairs();
  renderTools(); updateProgress(); riseStage();
}
function riseStage() {
  stage.classList.remove("out"); stage.classList.add("rise");
  setTimeout(() => stage.classList.remove("rise"), 1400);
}
function nextRound() {
  if (G.phase !== "done") return;
  G.phase = "idle";
  hush();
  G.idx++;
  if (G.idx >= G.total) { updateProgress(); showEnd(); return; }
  stage.classList.add("out"); revealEl.classList.add("out");
  setTimeout(() => { revealEl.classList.remove("out"); startRound(); }, reduceMotion ? 0 : 260);
}
// All three steps are over: record the round, then the reveal card.
function finishRound() {
  const r = G.r, perfect = r.pts === r.max;
  G.phase = "done";
  G.streak = perfect ? G.streak + 1 : 0;
  r.words.forEach(s => { const ok = !r.missed.has(s.id); markSeen(s.id, ok); recordProgress(s.id, ok); });
  tickDay();
  G.results.push({ words: r.words, sents: r.sents, pts: r.pts, max: r.max, perfect, missed: new Set(r.missed) });
  renderTools(); updateProgress();
  burst($("sents"));
  toast(perfect ? (G.streak >= 2 ? tx("streak", { n: G.streak }) : tx("perfect")) : tx("roundPts", { n: r.pts, m: r.max }), perfect ? "" : "zero");
  if (perfect) sndWin();
  hintEl.innerHTML = tx("roundDone");
  setTimeout(() => { if (G.r === r) showReveal(true); }, reduceMotion ? 0 : 650);
}
/* ---------- Points and combo ---------- */
function addPts(n, el) {
  if (!n) return;
  G.score += n; G.r.pts += n;
  showScore(); flash(scoreEl, "up"); if (el) toastAt(el, "+" + n);
}
// A right move: the combo grows. Returns how many semitones the chime climbs.
function comboUp() { G.combo++; showCombo(); return Math.min(G.combo - 1, 6) * 2; }
function comboReset() { G.combo = 0; showCombo(); }
function showCombo() { const c = $("combo"); c.hidden = G.combo < 3; c.textContent = "×" + G.combo; if (G.combo >= 3) flash(c, "tick"); }
// Best scores are kept for normal games only; practice games don't save one ("" = none).
function bestKey() { return G.mode === "normal" ? "ffb-best-" + G.level : ""; }
function showScore() {
  scEl.textContent = G.score;
  bestEl.textContent = bestKey() ? tx("best", { n: parseInt(load(bestKey()), 10) || 0 }) : tx("practice");
}

/* ---------- Tools row and progress ---------- */
const LIVE = ["pair", "sentence", "proof"];
function renderTools() {
  const r = G.r, live = LIVE.includes(G.phase);
  hintBtn.hidden = !hintPool() || !maxHints() || !live;
  hintBtn.disabled = !G.hintsLeft || r.hints >= maxHints() || !hintable();
  $("hintleft").textContent = tx("left", { n: G.hintsLeft });
  hintBtn.title = tx("hintTitle", { n: G.hintsLeft, m: maxHints() });
  checkBtn.hidden = G.phase !== "proof";
  toolsEl.hidden = !live;
}
const PROG = { normal: "progRound", review: "progReview", fav: "progFav" };
const STEPS = ["pair", "memo", "sentence"];
function updateProgress() {
  showDays();
  const n = Math.min(G.idx + 1, G.total), done = G.idx + (G.phase === "done" ? 1 : 0);
  $("proglbl").textContent = tx(PROG[G.mode] || "progRound", { n, m: G.total });
  $("pfill").style.width = (Math.min(done, G.total) / G.total * 100) + "%";
  // Which step of the round: three little dots under the bar ("checked" = a sentence just answered).
  const ph = G.phase === "checked" ? "sentence" : G.phase, k = STEPS.indexOf(ph), steps = $("steps");
  steps.hidden = !!(G.r && G.r.proof);
  [...steps.children].forEach((d, i) => { d.className = i < k || G.phase === "done" ? "done" : i === k ? "on" : ""; });
}

/* ---------- Hints ---------- */
// One hint from the game's pool (at most maxHints() a round): the active gap shows, for "hintSecs", the word in the
// translation language — Pairs: the word it wants; Sentences: the missing word's meaning (that gap then earns no point,
// and the word counts as missed when it is its meaning or its sentence). Nothing is lifted: the student finds the word.
const hintable = () => G.phase === "pair" ? !!pairHintTarget() : G.phase === "sentence" ? !!sentHintTarget() : G.phase === "proof" ? !!proofHintTarget() : false;
function useHint() {
  const r = G.r;
  if (!r || !LIVE.includes(G.phase) || !G.hintsLeft || r.hints >= maxHints()) return;
  const ok = G.phase === "pair" ? pairHint() : G.phase === "proof" ? proofHint() : sentHint();
  if (!ok) return;
  r.hints++; G.hintsLeft--; sndHint();
  renderTools(); flash($("hintleft"), "tick");
}
hintBtn.addEventListener("click", useHint);
// The peek: the text inside gap g for a few seconds (gone at once when a word is dropped there: unpeek).
function peekGap(g, t) {
  const r = G.r;
  unpeek(g); setAct(g);
  g.el.insertAdjacentHTML("beforeend", '<span class="peek">' + trHTML(t) + "</span>");
  g.peek = g.el.lastChild; flash(g.el, "glow");
  g.peekT = setTimeout(() => {
    if (G.r !== r || !g.peek) return;
    g.peek.classList.add("out");
    g.peekT = setTimeout(() => { if (G.r === r) { unpeek(g); renderTools(); } }, reduceMotion ? 0 : 400);
  }, lvlNum("hintSecs", 3) * 1000);
}
function unpeek(g) { clearTimeout(g.peekT); if (g.peek) g.peek.remove(); g.peek = null; }
// Idle reminder: after 15 s without a tap or key (again every 15 s) the hint button wiggles while a hint is usable.
let lastAct = Date.now();
["pointerdown", "keydown"].forEach(t => addEventListener(t, () => { lastAct = Date.now(); }, true));
setInterval(() => {
  if (!LIVE.includes(G.phase) || Date.now() - lastAct < 15000 || hintBtn.disabled || hintBtn.hidden) return;
  lastAct = Date.now(); if (!reduceMotion) flash(hintBtn, "nudge");
}, 1000);

/* 11-rounds.js — chooses a round's words (build.py's Rounds class simulates the same rules: change both together).
   A round has levels.json "words" false friends of its level (3), the least shown first (ffb-shown), never one already
   used in this game. Practice games (review, favorites) take their words in turn, topped up from the same level.
   No two words of a round may share a label in the translation language — any part of a look-alike or a meaning
   (compreensivo is comprehensive's look-alike and part of sympathetic's meaning) — so every gap has one right answer.
   "decoys" more meanings (B1+: 2), from other words of the level, float in the pool too. Each word's sentence takes
   its examples in turn (ffb-var). */
// A label's parts, lower case, without qualifiers: "política (regras); diretrizes" → política, diretrizes.
const partsOf = t => t.replace(/\(.*?\)/g, "").split(/[,;]/).map(x => x.trim().toLowerCase()).filter(Boolean);
const labelsOf = s => partsOf(looksOf(s)).concat(partsOf(meanOf(s)));
function makeRound() {
  const n = lvlNum("words", 3), picked = [], taken = new Set();
  const fits = s => !G.used.has(s.id) && !picked.includes(s) && labelsOf(s).every(l => !taken.has(l));
  const add = s => { picked.push(s); labelsOf(s).forEach(l => taken.add(l)); };
  // Practice games: the next words of their list first.
  // One that can't join this round (another level, a shared label) waits for the next.
  if (G.seeds) {
    const later = [];
    while (picked.length < n && G.seeds.length) { const id = G.seeds.shift(), s = FF[id]; if (s && fits(s) && (!picked.length || s.lv === picked[0].lv)) add(s); else if (s && !G.used.has(id)) later.push(id); }
    G.seeds.unshift(...later);
  }
  const level = picked.length ? picked[0].lv : G.level, shown = getShown();
  const pool = shuffle(DATA.words.filter(s => s.lv === level)).sort((a, b) => (shown[a.id] || 0) - (shown[b.id] || 0));
  pool.forEach(s => { if (picked.length < n && fits(s)) add(s); });
  if (picked.length < n) return null;
  // Decoys: other meanings of the level that look like none of the round's labels.
  const decoys = [];
  shuffle(pool.filter(s => !picked.includes(s))).forEach(s => {
    const m = meanOf(s), ps = partsOf(m);
    if (decoys.length < lvlNum("decoys", 0) && !ps.some(p => taken.has(p))) { decoys.push(m); ps.forEach(p => taken.add(p)); }
  });
  const ex = {};
  picked.forEach(s => { ex[s.id] = nextEx(s); });
  return { level, words: shuffle(picked), decoys, ex };
}
// The example a word's sentence uses this time: each one in turn, across games.
function nextEx(s) {
  const v = loadJSON("ffb-var", {}), i = (v[s.id] || 0) % s.ex.length;
  v[s.id] = i + 1; store("ffb-var", JSON.stringify(v));
  return i;
}

/* 12-pairs.js — the Pairs step: the round's words in the translation language (each false friend's look-alike and its
   real meaning, plus the level's "decoys") float in the pool at the top; under it, one row per false friend:
   "pretend looks like ___ but it actually means ___". Drag a word into a gap, or tap it and then tap the gap (13-drag.js).
   A gap is checked at once: right = it stays (green, +1 if it is the gap's first try and no hint); wrong = it shakes and
   floats back (the meaning gap of a word with a wrong try counts the word as missed). The look-alike in the meaning gap
   is "the trap" and says so. After "tries" wrong tries the game fills the gap (amber, no point). The step ends when
   every gap is full; then everything but the word + meaning pairs leaves (14-memo.js). */
const poolEl = $("pool"), rowsEl = $("rows");
function startPairs() {
  const r = G.r;
  G.phase = "pair"; r.max += 2 * r.words.length; r.pick = null;
  showSection("pair");
  // The pool: look-alikes, meanings and decoys, shuffled; each one bobs on its own rhythm.
  const items = r.words.flatMap(s => [{ t: looksOf(s), kind: "looks", s }, { t: meanOf(s), kind: "means", s }]).concat(r.decoys.map(t => ({ t, kind: "decoy" })));
  poolEl.innerHTML = '<span class="tag" data-ui="pool">' + esc(tx("pool")) + "</span>";
  r.pool = shuffle(items).map((x, i) => mkPoolWord(x, i));
  rowsEl.innerHTML = "";
  r.gaps = [];
  r.words.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "row"; row.style.setProperty("--d", (.25 + i * .12) + "s");
    row.innerHTML = '<span class="rg"><button type="button" class="b w ew cog" data-word="' + esc(s.w) + '" aria-label="' + esc(s.w + ", " + tx("listen")) + '">' + enHTML(s.w) + "</button>" +
      '<span class="rl">' + tx("looksLike") + '</span><span class="gslot pg" data-k="looks" role="button" tabindex="0"></span></span>' +
      '<span class="rg"><span class="rl">' + tx("actuallyMeans") + '</span><span class="gslot pg" data-k="means" role="button" tabindex="0"></span></span>';
    rowsEl.appendChild(row);
    row.querySelectorAll(".gslot").forEach(el => {
      const g = { el, s, kind: el.dataset.k, row, done: false, busy: false, tries: 0, hinted: false };
      el.__g = g; el.setAttribute("aria-label", s.w + " " + tx(g.kind === "looks" ? "looksLike" : "actuallyMeans") + " …");
      r.gaps.push(g);
    });
  });
  setAct(r.gaps[0]);
  hintEl.innerHTML = tx("pairHow");
}
function mkPoolWord(x, i) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "b w pw"; b.innerHTML = trHTML(x.t);
  b.style.setProperty("--d", (i * 55) + "ms");
  // drift halved, as in the sibling games, and never close to still: ±1.5-3.5 px across, 3-6 px up
  b.style.setProperty("--dur", rnd(3.8, 6).toFixed(2) + "s"); b.style.setProperty("--dl", (-rnd(0, 5)).toFixed(2) + "s");
  b.style.setProperty("--bx", ((Math.random() < .5 ? -1 : 1) * rnd(1.5, 3.5)).toFixed(1) + "px"); b.style.setProperty("--by", rnd(-6, -3).toFixed(1) + "px");
  const W = Object.assign({ el: b, pool: true, used: false }, x);
  b.__w = W;
  poolEl.appendChild(b);
  return W;
}
// Show one part of the stage: "pair" (pool + rows), "memo", "sentence" (pool + sentences), "proof" (18-proof.js).
function showSection(k) {
  rowsEl.hidden = k !== "pair"; $("memo").hidden = k !== "memo"; $("sents").hidden = k !== "sentence"; $("proof").hidden = k !== "proof";
  poolEl.hidden = k === "memo" || k === "proof";
  poolEl.classList.toggle("opts", k === "sentence");
}

/* ---------- The active gap and the lifted word ---------- */
// The active gap (pulsing) is where a second tap on a word sends it; the next open one after each fill.
function setAct(g) {
  const r = G.r;
  r.gaps.forEach(x => x.el.classList.toggle("on", x === g));
  r.act = g || null;
}
const nextOpen = () => G.r.gaps.find(x => !x.done) || null;
// A word lifted by a first tap (G.r.pick): a tap on a gap puts it there, a second tap on it sends it to the active gap.
function pickWord(W) {
  const r = G.r; if (!r) return;
  if (r.pick) r.pick.el.classList.remove("sel");
  r.pick = W || null;
  if (W) W.el.classList.add("sel");
  document.body.classList.toggle("picking", !!W);
}

/* ---------- Placing a word ---------- */
function place(W, g, from) {
  const r = G.r;
  if (G.phase !== "pair" || !g || g.done || g.busy || W.used) return;
  pickWord(null); unpeek(g);
  g.busy = true; W.used = true; W.el.classList.add("away");
  g.el.innerHTML = '<span class="b w pw in">' + trHTML(W.t) + "</span>";
  g.el.classList.add("filled"); sndPlace();
  flyFrom(g.el.firstChild, from || W.el.getBoundingClientRect());
  setTimeout(() => { if (G.r === r) checkPair(W, g); }, reduceMotion ? 60 : 380);
}
function checkPair(W, g) {
  const r = G.r, want = g.kind === "looks" ? looksOf(g.s) : meanOf(g.s);
  if (W.t === want) return pairRight(W, g);
  g.tries++; r.mistakes++;
  if (g.kind === "means") r.missed.add(g.s.id);
  comboReset(); sndBad();
  const b = g.el.firstChild; b.classList.add("bad"); flash(g.el, "shake");
  const left = lvlNum("tries", 3) - g.tries;
  hintEl.innerHTML = pairWhy(W, g) + (left > 0 && left < 3 ? " " + tx(left === 1 ? "tryLeft" : "triesLeft", { n: left }) : "");
  setTimeout(() => {
    if (G.r !== r) return;
    const from = b.getBoundingClientRect();
    g.el.innerHTML = ""; g.el.classList.remove("filled"); g.busy = false;
    W.used = false; W.el.classList.remove("away");
    flyFrom(W.el, from); sndBack();
    if (g.tries >= lvlNum("tries", 3)) showPair(g);
  }, 950);
}
// Why a word doesn't go in that gap: the trap (its own look-alike as its meaning), its meaning in the look-alike gap,
// another row's word, or a decoy.
function pairWhy(W, g) {
  const w = "<b>" + esc(g.s.w) + "</b>", t = "<b>" + esc(W.t) + "</b>";
  if (g.kind === "means" && W.kind === "looks" && W.s === g.s) return tx("trap", { w, l: t, en: esc(looksEnOf(g.s)) });
  if (g.kind === "looks" && W.kind === "means" && W.s === g.s) return tx("notLooks", { w, m: t });
  if (W.kind === "decoy") return tx("decoy", { t });
  if (g.kind === "looks") return tx("wrongLooks", { w, t });
  return tx(W.kind === "looks" ? "wrongMeansLooks" : "wrongMeans", { w, t });
}
function pairRight(W, g) {
  const r = G.r;
  g.done = true; g.busy = false;
  g.el.firstChild.classList.add("ok"); flash(g.el.firstChild, "morph");
  dropPool(W);
  addPts(g.tries === 0 && !g.hinted ? 1 : 0, g.el); sndOk(comboUp()); burst(g.el, 8);
  // A word that is only sometimes false (or borrowed) says why as soon as its meaning is found.
  hintEl.innerHTML = tx(g.kind === "looks" ? "rightLooks" : "rightMeans", { w: "<b>" + esc(g.s.w) + "</b>", t: "<b>" + esc(W.t) + "</b>" }) +
    (g.kind === "means" && noteOf(g.s) ? " " + kindChip(g.s) + " " + esc(noteOf(g.s)) : "");
  afterPair(g);
}
// Out of tries: the game fills the gap (amber, no point).
function showPair(g) {
  const r = G.r, want = g.kind === "looks" ? looksOf(g.s) : meanOf(g.s), W = r.pool.find(x => !x.used && x.t === want);
  g.done = true;
  g.el.innerHTML = '<span class="b w pw in shown">' + trHTML(want) + "</span>"; g.el.classList.add("filled");
  if (W) { flyFrom(g.el.firstChild, W.el.getBoundingClientRect()); dropPool(W); }
  hintEl.innerHTML = tx("pairShown", { w: "<b>" + esc(g.s.w) + "</b>", t: "<b>" + esc(want) + "</b>" });
  afterPair(g);
}
// A gap is done: the next open gap becomes active, or the step ends.
function afterPair(g) {
  renderTools();
  // The same row's other gap first, else the first open one.
  const n = G.r.gaps.find(x => !x.done && x.row === g.row) || nextOpen();
  if (n) { if (!G.r.act || G.r.act.done) setAct(n); return; }
  setAct(null);
  G.phase = "pairs-done"; renderTools();
  setTimeout(() => { if (G.r && G.phase === "pairs-done") startMemo(); }, reduceMotion ? 500 : 1500);
}
// A word that found its gap leaves the pool; the others glide into its place.
function dropPool(W) {
  const r = G.r;
  r.pool = r.pool.filter(x => x !== W);
  flipKids(poolEl, () => W.el.remove());
}
// A change to a row of bubbles without jumps: change() alters it, then every child that moved slides from where it was.
function flipKids(box, change, ms = 450) {
  const els = [...box.children], before = new Map(els.map(e => [e, e.getBoundingClientRect()]));
  change();
  if (reduceMotion) return;
  els.forEach(e => {
    if (!e.isConnected) return;
    const a = before.get(e), b = e.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) e.animate([{ translate: dx + "px " + dy + "px" }, { translate: "0 0" }], { duration: ms, easing: "cubic-bezier(.25,.9,.3,1)" });
  });
}

/* ---------- Hint ---------- */
// Hints only show meanings: the active row's meaning gap (or the first open one) and the pool word that goes in it;
// none while that gap is peeking.
function pairHintTarget() {
  const r = G.r; if (!r || !r.gaps) return null;
  const open = r.gaps.filter(x => x.kind === "means" && !x.done), a = r.act;
  const g = (a && open.find(x => x.row === a.row)) || open[0]; if (!g || g.peek || g.busy) return null;
  const want = g.kind === "looks" ? looksOf(g.s) : meanOf(g.s), W = r.pool.find(x => !x.used && x.t === want);
  return W ? { g, W } : null;
}
function pairHint() {
  const t = pairHintTarget(); if (!t) return false;
  t.g.hinted = true;
  if (t.g.kind === "means") G.r.missed.add(t.g.s.id);
  pickWord(null); peekGap(t.g, t.W.t);
  hintEl.innerHTML = tx("hintPair", { n: lvlNum("hintSecs", 3) });
  return true;
}

/* 13-drag.js — moving bubbles into gaps: pointer drag & drop, tap, keyboard (from Phrasal Verb Bubbles). Pairs: the
   pool's words go into the rows' gaps (12-pairs.js place). Sentences: the false friends go into the sentences' gaps
   (15-sentence.js fillSent). Both steps keep their open gaps in G.r.gaps and the active one in G.r.act.
   While dragging, the bubble stays in place (faded) and a copy follows the pointer; the nearest open gap lights up
   (.hot) and pulls the copy in a little. A press that doesn't move is a tap: the first tap lifts the word (.sel), a tap
   on a gap then puts it there, and a second tap on the word sends it to the active gap. Keyboard: Enter on a word
   lifts it, Enter on a gap places it. */
let drag = null;
// A word that can move now.
function movable(W) {
  if (!W || !G.r || W.used || W.off) return false;
  if (W.pool) return G.phase === "pair";
  if (W.opt) return G.phase === "sentence";
  return false;
}
const putIn = (W, g, from) => W.pool ? place(W, g, from) : fillSent(W, g, from);
const openGaps = () => (G.r && G.r.gaps || []).filter(g => !g.done && !g.busy);
function tap(W) {
  const r = G.r;
  if (r.pick === W) { const g = r.act && !r.act.done ? r.act : openGaps()[0]; if (g) putIn(W, g, W.el.getBoundingClientRect()); return; }
  pickWord(W); sndHint();
}

/* ---------- Targets ---------- */
// The open gap nearest to (x, y), within reach, or null.
function dropAt(x, y) {
  let best = null, bd = 80;
  openGaps().forEach(g => {
    const b = g.el.getBoundingClientRect(), d = Math.hypot(Math.max(b.left - x, 0, x - b.right), Math.max(b.top - y, 0, y - b.bottom));
    if (d < bd) { bd = d; best = g; }
  });
  return best;
}
function setHot(g) {
  document.querySelectorAll(".gslot.hot").forEach(e => e.classList.remove("hot"));
  if (g) g.el.classList.add("hot");
}

/* ---------- Pointer ---------- */
stage.addEventListener("pointerdown", e => {
  const el = e.target.closest(".w"); if (!el || !el.__w || e.button > 0 || !movable(el.__w)) return;
  e.preventDefault();
  drag = { W: el.__w, x0: e.clientX, y0: e.clientY, on: false, hot: null };
  el.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", e => {
  if (!drag) return;
  const W = drag.W, el = W.el;
  if (!drag.on) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 7) return;
    const rc = el.getBoundingClientRect();
    drag.on = true; drag.ox = drag.x0 - rc.left; drag.oy = drag.y0 - rc.top;
    const av = drag.av = el.cloneNode(true);
    av.classList.remove("sel", "glow", "shake"); av.classList.add("drag");
    av.style.width = rc.width + "px"; av.style.height = rc.height + "px";
    document.body.appendChild(av); el.classList.add("lifted"); sqStart(av, e.clientX, e.clientY, 1.1, -3, .2);   // squash and stretch: 24-shine.js
    pickWord(null);
  }
  let x = e.clientX - drag.ox, y = e.clientY - drag.oy;
  const hot = drag.hot = dropAt(e.clientX, e.clientY);
  // Magnet: near a gap the copy is pulled part of the way into it.
  if (hot) {
    const b = hot.el.getBoundingClientRect(), av = drag.av;
    const tx = b.left + b.width / 2 - av.offsetWidth / 2, ty = b.top + b.height / 2 - av.offsetHeight / 2;
    const f = Math.max(0, 1 - Math.hypot(tx - x, ty - y) / 120) * .55;
    x += (tx - x) * f; y += (ty - y) * f;
  }
  drag.av.style.left = x + "px"; drag.av.style.top = y + "px"; sqMove(x, y);
  setHot(hot);
});
function endDrag(e) {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.on) { if (e.type === "pointerup" && movable(d.W)) tap(d.W); return; }
  setHot(null);
  const from = d.av.getBoundingClientRect();
  sqEnd(null); d.av.remove(); d.W.el.classList.remove("lifted");
  if (!d.hot || !movable(d.W)) { flyFrom(d.W.el, from); wobble(d.W.el); sndBack(); return; }
  putIn(d.W, d.hot, from);
}
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
/* Safety nets for this drag (2026-11-22, from Question Bubbles: on computers, a MacBook among them, a dragged bubble
   could stay stuck on its target when the browser never reported the release, e.g. let go outside the window). A mouse
   move with no button held = the drop (a release is sent); a new mouse press or the window losing focus = back. */
(function () {
  function fire(type, e) { stage.dispatchEvent(new PointerEvent(type, { bubbles: true, clientX: e ? e.clientX : 0, clientY: e ? e.clientY : 0, pointerId: e ? e.pointerId : (drag.id || 1), pointerType: "mouse" })); }
  function back(e) { if (!drag) return; drag.hot = null; fire("pointercancel", e); }
  document.addEventListener("pointermove", function (e) { if (drag && e.pointerType === "mouse" && !e.buttons) fire("pointerup", e); }, true);
  document.addEventListener("pointerdown", function (e) { if (e.pointerType === "mouse") back(e); }, true);
  window.addEventListener("blur", function () { back(); });
})();

/* ---------- Clicks and keys ---------- */
stage.addEventListener("click", e => {
  if (!G.r) return;
  // Keyboard Enter / Space on a bubble arrives as a click with detail 0 (pointer taps are handled above).
  const el = e.target.closest(".w");
  if (e.detail === 0 && el && el.__w && movable(el.__w)) return tap(el.__w);
  const gel = e.target.closest(".gslot"); if (gel && gel.__g) gapTap(gel.__g);
});
// A gap: the lifted word goes there; with none lifted, it becomes the active gap.
function gapTap(g) {
  const r = G.r;
  if (g.done || g.busy || !(G.phase === "pair" || G.phase === "sentence")) return;
  if (r.pick && movable(r.pick)) return putIn(r.pick, g, r.pick.el.getBoundingClientRect());
  setAct(g);
}
stage.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const gel = e.target.closest(".gslot"); if (gel && gel.__g) { e.preventDefault(); gapTap(gel.__g); }
});
// A tap anywhere but on a word or a gap lowers the lifted word.
document.addEventListener("pointerdown", e => { if (G.r && G.r.pick && !e.target.closest("#stage .w, .gslot, #hintbtn, .gw")) pickWord(null); });

/* 14-memo.js — the Memo step: everything leaves the stage except the round's false friends and their real meanings,
   which fly into three pairs (pretend = fingir, with "≠ pretender = to intend" under each). The look-alikes pop as they
   go: they are the trap to forget. A word with a kind (only false in some contexts, borrowed, mix-up) shows its chip
   and note. The pairs light up one by one while the word is read aloud (levels.json "memoSecs"
   each, notes included), then "I'm ready" fills up for "memoWait" seconds; each meaning melts into its word and the words fly up to
   become the Sentences step's options (15-sentence.js). Listen again
   replays the pairs (and stops the countdown); tapping a pair reads its word. No points here. */
const memoEl = $("memo");
let memoSeq = 0;
function startMemo() {
  const r = G.r;
  G.phase = "memo";
  // Where each bubble sits now, so the pairs fly from the rows.
  const at = {};
  r.gaps.forEach(g => { if (g.kind === "means") at["m" + g.s.id] = g.el.firstChild.getBoundingClientRect(); else popGhost(g.el.firstChild); });
  rowsEl.querySelectorAll(".cog").forEach((el, i) => { at["w" + r.words[i].id] = el.getBoundingClientRect(); });
  r.pool.forEach(W => popGhost(W.el, true));
  showSection("memo");
  memoEl.innerHTML = '<span class="tag">' + tx("memoTag") + '</span><div class="mpairs">' + r.words.map((s, i) =>
    '<div class="mp" data-i="' + i + '" role="button" tabindex="0" aria-label="' + esc(s.w + " = " + meanOf(s)) + '"><div class="mpr">' +
    '<span class="b w ew" data-k="w' + esc(s.id) + '">' + enHTML(s.w) + '</span><span class="eq">=</span><span class="b w pw" data-k="m' + esc(s.id) + '">' + trHTML(meanOf(s)) + "</span></div>" +
    '<div class="mnot"><span class="ne">≠</span> ' + notHTML(s) + "</div>" + noteHTML(s) + "</div>").join("") + "</div>" +
    '<div class="mbtns"><button type="button" class="pbtn" id="memoagain">' + ICON_SAY + "<span>" + tx("listenAgain") + '</span></button><button type="button" class="cta" id="memogo"><i class="fill"></i><span>' + tx("ready") + " &rarr;</span></button></div>";
  memoEl.querySelectorAll("[data-k]").forEach(el => { el.classList.add("flown"); flyFrom(el, at[el.dataset.k], 700); });
  hintEl.innerHTML = tx("memoHow");
  renderTools(); updateProgress();
  setTimeout(() => { if (G.r === r && G.phase === "memo") readMemo(); }, reduceMotion ? 200 : 900);
}
// A copy of a bubble that pops where it was (a look-alike: struck out first) or floats away (a pool word left over).
function popGhost(el, drift) {
  if (!el || reduceMotion) return;
  const b = el.getBoundingClientRect(), c = el.cloneNode(true);
  c.className = "b w pw ghost " + (drift ? "drift" : "popout"); c.removeAttribute("id");
  Object.assign(c.style, { left: b.left + "px", top: b.top + "px", width: b.width + "px", height: b.height + "px" });
  c.style.setProperty("--dx", rnd(-60, 60).toFixed(0) + "px");
  document.body.appendChild(c);
  setTimeout(() => c.remove(), 1100);
}
// Light up each pair while its word is read, then start the countdown.
function readMemo() {
  const r = G.r, seq = ++memoSeq, pairs = [...memoEl.querySelectorAll(".mp")], ms = lvlNum("memoSecs", 3) * 1000;
  stopReady();
  const go = i => {
    if (seq !== memoSeq || G.r !== r || G.phase !== "memo") return;
    pairs.forEach((p, k) => p.classList.toggle("reading", k === i));
    if (i >= pairs.length) return startReady();
    speak(r.words[i].w, pairs[i]);
    setTimeout(() => go(i + 1), ms);
  };
  go(0);
}
// "I'm ready" fills up; when it is full, the sentences come.
let readyT = 0;
function startReady() {
  const b = $("memogo"); if (!b) return;
  const s = lvlNum("memoWait", 5);
  b.classList.add("pulse", "counting"); b.style.setProperty("--wait", s + "s");
  clearTimeout(readyT); readyT = setTimeout(memoDone, s * 1000);
}
function stopReady() { clearTimeout(readyT); const b = $("memogo"); if (b) b.classList.remove("counting"); }
function memoDone() {
  const r = G.r;
  if (!r || G.phase !== "memo" || r.leaving) return;
  memoSeq++; stopReady(); hush();
  r.leaving = true;
  // Each meaning slides into its word and melts into it while the rest of the card fades; then the words fly up to
  // become the options (startSentences flies them from where they sit now).
  const ms = reduceMotion ? 0 : 480;
  memoEl.querySelectorAll(".mp").forEach(p => p.classList.remove("reading"));
  memoEl.classList.add("leaving"); calmFor(ms + 60);   // the films and background bubbles pause while it melts (24-shine.js)
  memoEl.querySelectorAll(".mpr").forEach(row => {
    const w = row.querySelector(".ew"), m = row.querySelector(".pw");
    if (reduceMotion) return;
    const a = w.getBoundingClientRect(), b = m.getBoundingClientRect();
    const dx = a.left + a.width / 2 - b.left - b.width / 2, dy = a.top + a.height / 2 - b.top - b.height / 2;
    m.animate([{ transform: "none", opacity: 1 }, { transform: "translate(" + dx + "px," + dy + "px) scale(.35)", opacity: 0 }], { duration: ms, easing: "cubic-bezier(.55,0,.8,.3)", fill: "forwards" });
    w.animate([{ transform: "scale(1)" }, { transform: "scale(1.14)", offset: .8 }, { transform: "scale(1)" }], { duration: ms, easing: "ease-in-out" });
  });
  setTimeout(() => {
    if (G.r !== r) return;
    const from = {};
    memoEl.querySelectorAll(".ew[data-k]").forEach(el => { from[el.dataset.k.slice(1)] = el.getBoundingClientRect(); });
    memoEl.classList.remove("leaving");
    startSentences(from);
  }, ms);
}
memoEl.addEventListener("click", e => {
  if (G.phase !== "memo" || G.r.leaving) return;
  if (e.target.closest("#memogo")) return memoDone();
  if (e.target.closest("#memoagain")) { sndHint(); return readMemo(); }
  const p = e.target.closest(".mp"); if (p) { stopReady(); speak(G.r.words[+p.dataset.i].w, p); }
});
memoEl.addEventListener("keydown", e => {
  const p = e.target.closest(".mp");
  if (p && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); p.click(); }
});

/* 15-sentence.js — the Sentences step: the round's false friends float at the top (no meanings: the Memo step was the
   time to learn them), and three sentences sit below, each with a gap for a different one of them (its
   example in turn: 11-rounds.js nextEx); every option is already in its sentence's form (realized, pretending). Drag a
   word into a gap, or tap it and then the gap (13-drag.js). A right word takes the sentence's spelling, leaves the options and the sentence shows its translation.
   +SENT_PTS first time, +1 on the second try, none after a hint; after "sentenceTries" wrong tries the answer is shown
   (amber). A wrong word counts the sentence's word as missed. G.r.sents = [{s, ex}] in the order on screen. */
const sentsEl = $("sents");
// from = where each false friend sat in the Memo step ({id: rect}): the options fly from there.
function startSentences(from) {
  const r = G.r;
  G.phase = "sentence"; r.max += SENT_PTS * r.words.length; r.pick = null;
  showSection("sentence");
  poolEl.innerHTML = '<span class="tag">' + tx("words") + "</span>";
  r.opts = shuffle(r.words.slice()).map((s, i) => mkOption(s, i));
  const order = shuffle(r.words.slice());
  r.sents = order.map(s => ({ s, ex: r.ex[s.id] }));
  sentsEl.innerHTML = '<span class="tag">' + tx("sentTag") + "</span>";
  r.gaps = order.map((s, i) => {
    const e = s.ex[r.ex[s.id]], row = document.createElement("div");
    row.className = "srow"; row.style.setProperty("--d", (.3 + i * .12) + "s");
    row.innerHTML = '<p class="ptext">' + sentHTML(e, s) + '</p><p class="strn" lang="' + esc(curLang) + '" hidden>' + esc((trOf(s).ex || [])[r.ex[s.id]] || "") + "</p>";
    sentsEl.appendChild(row);
    const el = row.querySelector(".gslot"), g = { el, s, e, row, k: i, sent: true, done: false, busy: false, tries: 0, hinted: false };
    el.__g = g; el.setAttribute("aria-label", tx("gapLabel", { n: i + 1 }));
    return g;
  });
  setAct(r.gaps[0]);
  if (from && !reduceMotion) r.opts.forEach(W => { const f = from[W.s.id]; if (f) { W.el.classList.add("flown"); flyFrom(W.el, f, 650); } });
  flash(sentsEl, "in");
  hintEl.innerHTML = tx("sentHow");
  renderTools(); updateProgress();
}
function mkOption(s, i) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "b w ew opt"; b.style.setProperty("--d", i * 60 + "ms");
  b.style.setProperty("--dur", rnd(3.8, 6).toFixed(2) + "s"); b.style.setProperty("--dl", (-rnd(0, 5)).toFixed(2) + "s");   // drift as in the pool (12-pairs.js)
  b.style.setProperty("--bx", ((Math.random() < .5 ? -1 : 1) * rnd(1.5, 3.5)).toFixed(1) + "px"); b.style.setProperty("--by", rnd(-6, -3).toFixed(1) + "px");
  b.innerHTML = enHTML(formOf(s));
  const W = { el: b, s, opt: true, used: false };
  b.__w = W;
  poolEl.appendChild(b);
  return W;
}
// A word in the form its sentence of this round uses (realized, pretending), lower case: each option fills one sentence.
const formOf = s => s.ex[G.r.ex[s.id]].g.toLowerCase();
// The sentence with its gap ("{0}"); punctuation right after the gap stays on its line. Key words of false friend s
// get their meaning on hover / tap (19-gloss.js).
function sentHTML(e, s) {
  const [a, b] = e.s.split("{0}"), p = (b.match(/^[,.;:!?)']+/) || [""])[0];
  return glossWrap(a, s) + '<span class="gapw"><span class="gslot sg" role="button" tabindex="0"></span>' + esc(p) + "</span>" + glossWrap(b.slice(p.length), s);
}
// The finished sentence as HTML (the word in bold) or as text.
function filledHTML(s, ei) { const e = s.ex[ei | 0]; return e ? esc(e.s).replace("{0}", '<b class="answ">' + esc(e.g) + "</b>") : ""; }
function sentText(s, ei) { const e = s.ex[ei | 0]; return e ? e.s.replace("{0}", e.g) : ""; }

/* ---------- Filling a gap ---------- */
function fillSent(W, g, from) {
  const r = G.r;
  if (G.phase !== "sentence" || !g || g.done || g.busy || W.used) return;
  pickWord(null); unpeek(g);
  g.busy = true; W.used = true; W.el.classList.add("away");
  g.el.innerHTML = '<span class="b w ew in">' + enHTML(formOf(W.s)) + "</span>";
  g.el.classList.add("filled"); sndPlace();
  flyFrom(g.el.firstChild, from || W.el.getBoundingClientRect());
  setTimeout(() => { if (G.r === r) checkSent(W, g); }, reduceMotion ? 60 : 400);
}
function checkSent(W, g) {
  const r = G.r;
  if (W.s === g.s) return sentRight(W, g);
  g.tries++; r.mistakes++; r.missed.add(g.s.id);
  comboReset(); sndBad();
  const b = g.el.firstChild; b.classList.add("bad"); flash(g.el, "shake");
  const left = lvlNum("sentenceTries", 2) - g.tries;
  hintEl.innerHTML = tx("sentWrong", { w: "<b>" + esc(W.s.w) + "</b>", m: "<b>" + esc(meanOf(W.s)) + "</b>" }) + (left > 0 ? " " + tx(left === 1 ? "tryLeft" : "triesLeft", { n: left }) : "");
  setTimeout(() => {
    if (G.r !== r) return;
    const from = b.getBoundingClientRect();
    g.el.innerHTML = ""; g.el.classList.remove("filled"); g.busy = false;
    W.used = false; W.el.classList.remove("away");
    flyFrom(W.el, from); sndBack();
    if (g.tries >= lvlNum("sentenceTries", 2)) showSent(g);
  }, 950);
}
// The right word takes the sentence's exact spelling (Push at the start of a sentence).
function morphSent(g, cls) {
  const el = g.el.firstChild;
  el.className = "b w ew in " + cls; el.innerHTML = enHTML(g.e.g);
  flash(el, "morph");
}
// "pretended is pretend in another form" when the sentence changes the word.
function formNote(g) { return g.e.g.toLowerCase() !== g.s.w ? " " + tx("formNote", { form: "<b>" + esc(g.e.g) + "</b>", w: esc(g.s.w) }) : ""; }
function sentRight(W, g) {
  const r = G.r, pts = g.hinted ? 0 : g.tries === 0 ? SENT_PTS : g.tries === 1 ? 1 : 0;
  g.done = true; g.busy = false;
  setTimeout(() => { if (G.r === r) morphSent(g, "ok"); }, reduceMotion ? 0 : 160);
  dropOption(W);
  addPts(pts, g.el); sndOk(comboUp()); burst(g.el, 12);
  hintEl.innerHTML = tx("sentRight", { w: "<b>" + esc(g.s.w) + "</b>", m: "<b>" + esc(meanOf(g.s)) + "</b>" }) + formNote(g);
  afterSent(g);
}
// Out of tries: the answer goes into the gap (amber), no points.
function showSent(g) {
  const r = G.r, W = r.opts.find(x => x.s === g.s);
  g.done = true;
  g.el.innerHTML = '<span class="b w ew in shown">' + enHTML(formOf(g.s)) + "</span>"; g.el.classList.add("filled");
  if (W) { flyFrom(g.el.firstChild, W.el.getBoundingClientRect()); dropOption(W); }
  setTimeout(() => { if (G.r === r) morphSent(g, "shown"); }, reduceMotion ? 0 : 450);
  hintEl.innerHTML = tx("sentShown", { w: "<b>" + esc(g.s.w) + "</b>" }) + formNote(g);
  afterSent(g);
}
// A word that filled its sentence leaves the options; the others glide into its place.
function dropOption(W) {
  const r = G.r;
  r.opts = r.opts.filter(x => x !== W);
  flipKids(poolEl, () => W.el.remove());
}
// A sentence is done: its translation and Listen button appear; the next open gap becomes active, or the round ends.
function afterSent(g) {
  const r = G.r;
  const t = g.row.querySelector(".strn"); t.hidden = false; flash(t, "next");
  g.row.querySelector(".ptext").insertAdjacentHTML("beforeend", '<button type="button" class="pbtn say psay" data-k="' + g.k + '" aria-label="' + esc(tx("listen")) + '" title="' + esc(tx("listen")) + '">' + ICON_SAY + "</button>");
  renderTools();
  const n = r.gaps.find(x => !x.done);
  if (n) { if (!r.act || r.act.done) setAct(n); return; }
  setAct(null);
  poolEl.hidden = true;
  G.phase = "checked"; renderTools(); updateProgress();
  setTimeout(() => { if (G.r === r && G.phase === "checked") finishRound(); }, reduceMotion ? 300 : 1300);
}
sentsEl.addEventListener("click", e => { const b = e.target.closest(".psay"); if (b) readSents(+b.dataset.k, b); });

/* ---------- Hint ---------- */
// The active sentence (or the first open one) and its word: the gap shows the word's meaning for a few seconds.
function sentHintTarget() {
  const r = G.r; if (!r || !r.opts) return null;
  const g = r.act && !r.act.done ? r.act : r.gaps.find(x => !x.done); if (!g || g.peek || g.busy) return null;
  const W = r.opts.find(x => x.s === g.s && !x.used);
  return W ? { g, W } : null;
}
function sentHint() {
  const t = sentHintTarget(); if (!t) return false;
  t.g.hinted = true; G.r.missed.add(t.g.s.id);
  pickWord(null); peekGap(t.g, meanOf(t.g.s));
  hintEl.innerHTML = tx("hintSent", { n: lvlNum("hintSecs", 3) });
  return true;
}

/* 16-reveal.js — the card after each round (the sentences' translations, each with its word's favourite star; (?)
   opens the round's words: meaning, part of speech, the look-alike it is not, English definition), reading the
   sentences aloud, the word card used by every list, and the little celebrations (toasts, bursts). */

/* ---------- A word card ---------- */
// One false friend as a list row: word, part of speech, real meaning; "≠ look-alike = what it means"; its kind and
// note (if any); definition;
// opts.ex = an example (that one, or the first) with its translation and a Listen button.
// opts.list = the Favorites / Seen layout: no chips and no note (the row's head has them, 21-lists.js), "(our word
// "costume" is habit, custom in English)" instead of the struck-through look-alike, no English definition.
function wordHTML(s, opts = {}) {
  const ei = opts.ei | 0;
  return '<div class="sense"><div class="sh"><b class="ffpill" lang="en">' + esc(s.w) + "</b>" + (opts.list ? "" : posChip(s)) +
    '<span class="sm">= ' + trHTML(meanOf(s)) + "</span></div>" +
    (opts.list ? ourWordHTML(s) :'<div class="snot"><span class="ne">≠</span> ' + notHTML(s) + "</div>" + noteHTML(s) + '<div class="sd" lang="en">' + esc(s.def) + "</div>") +
    (opts.ex ? '<div class="sx">' + (opts.list ? "" : '<button type="button" class="pbtn say" data-say="' + esc(s.id) + '" data-ei="' + ei + '" aria-label="' + esc(tx("listen")) + '" title="' + esc(tx("listen")) + '">' + ICON_SAY +
      "</button>") + '<span><span class="sxe" lang="en">' + filledHTML(s, ei) + '</span><span class="sxt" lang="' + esc(curLang) + '">' + esc((trOf(s).ex || [])[ei] || "") + "</span></span></div>" : "") + "</div>";
}

// "(a nossa palavra "costume" no inglês é habit, custom)": the look-alike without its "(qualifier)" (short (bermuda)
// → short) and its real English meaning; nothing when there is none.
function ourWordHTML(s) {
  const en = looksEnOf(s); if (!en) return "";
  const w = looksOf(s).replace(/\s*\([^)]*\)/g, "").trim();
  return '<div class="sour">' + tx("ourWord", { w: '<span lang="' + esc(curLang) + '">' + esc(w) + "</span>", en: '<span lang="en">' + esc(en) + "</span>" }) + "</div>";
}

/* ---------- Reveal card ---------- */
// Kept small so it fits under the finished sentences (which stay on the stage, with their translations): the round's
// words in the sentences' order (word = meaning ≠ look-alike, each with a star), then (?), Next.
// auto = read the sentences aloud (not when only the language changed).

      '</span> <span class="rnot"><span class="ne">≠</span> ' + notHTML(s) + "</span></p>" + favBtn(s.id) + "</div>").join("") + "</div></div>" +
    '<div class="rv-btns"><button type="button" class="pbtn rv-q" id="rvq" aria-expanded="false" aria-controls="rvwhy" aria-label="' + esc(tx("rvTitle")) + '" title="' + esc(tx("rvTitle")) + '">?</button>' +
    '<button type="button" class="cta" id="next">' + tx(last ? "results" : "next") + " &rarr;</button></div>" +
    '<div class="rv-why" id="rvwhy" hidden>' + r.words.map(s => wordHTML(s)).join("") + "</div>";
  revealEl.hidden = false;

  $("next").classList.add("pulse");

  $("rvq").addEventListener("click", e => {

}
// Read the round's sentences one by one (only = just that one); the one being read lights up, on the stage and on
// the card.
function readSents(only, btn) {
  const r = G.r, lines = [...sentsEl.querySelectorAll(".srow")], rows = [...revealEl.querySelectorAll(".rv-row")];
  const ks = only == null ? r.sents.map((_, k) => k) : [only];
  speakList(ks.map(k => sentText(r.sents[k].s, r.sents[k].ex)), btn, i => {
