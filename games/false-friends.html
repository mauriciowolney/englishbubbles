<head>
<meta charset="utf-8">
<!-- English Bubbles app (added by the app's build.py, not part of the game's own files) -->
<script>
/* early-theme.js — runs in <head>, before the first paint, in the menu AND in every game: puts on the background
   colour saved in eb-bg (the games' palettes, "p:sky" or "c:#7aa7ff"), so a page never flashes its default colour
   first. The page's own 01-theme.js applies the same colour again a moment later. Keep PAL in step with PALETTES
   (src/js/01-theme.js and the games). */
(function () {
  try {
    var PAL = {
      sky: ["#e4f3fb", "#f1e8fb", "#fdf0e6", 0], peach: ["#ffe6d8", "#ffd6e4", "#fff1c9", 0],
      mint: ["#d9f4e6", "#d3eef6", "#eef6d3", 0], lilac: ["#e9e0fb", "#f7d9ee", "#dbe6fb", 0],
      dusk: ["#2a1740", "#58224f", "#1f3560", 1], midnight: ["#141964", "#441464", "#144e64", 1]
    };
    var s = Storage.prototype.getItem.call(window.localStorage, "eb-bg") || "", c = null;
    if (s.indexOf("p:") === 0) c = PAL[s.slice(2)] || null;
    else if (/^c:#[0-9a-f]{6}$/i.test(s)) {
      var hex = s.slice(2), r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255,
        b = parseInt(hex.slice(5, 7), 16) / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b),
        l = (mx + mn) / 2, h = 0, sat = 0, d = mx - mn;
      if (d) {
        sat = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
        h = (mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) * 60;
      }
      var col = function (dh) { return "hsl(" + ((h + dh + 360) % 360).toFixed(0) + "," + (sat * 100).toFixed(0) + "%," + (l * 100).toFixed(0) + "%)"; };
      c = [col(0), col(40), col(-40), l * 100 < 52];
    }
    if (c) {
      var root = document.documentElement;
      root.style.setProperty("--bg-a", c[0]); root.style.setProperty("--bg-b", c[1]); root.style.setProperty("--bg-c", c[2]);
      root.dataset.theme = c[3] ? "dark" : "light";
    }
  } catch (e) {}
  // The phone's bars (theme-color) follow the background: its top colour --bg-a, set here or later by the page's own
  // colour picker (menu or game: both write --bg-a on <html>). No colour chosen: the default light / dark ones.
  try {
    var html = document.documentElement, last = "";
    var bar = function () {
      var a = html.style.getPropertyValue("--bg-a").trim(), m = document.querySelectorAll('meta[name="theme-color"]');
      for (var i = 0; i < m.length; i++) {
        var v = a || (/dark/.test(m[i].media) ? "#141964" : "#e4f3fb");
        if (m[i].content !== v) m[i].content = v;
      }
      last = a;
    };
    bar();
    document.addEventListener("DOMContentLoaded", bar);
    new MutationObserver(function () {
      if (html.style.getPropertyValue("--bg-a").trim() !== last) bar();
    }).observe(html, { attributes: true, attributeFilter: ["style"] });
  } catch (e) {}
})();

/* iPhone / iPad: ask for a "playback" audio session, so the game's sounds play even with Silent mode on (iOS 17+;
   some games already do this themselves). Websites can't detect Silent mode, so the menu also shows a tip. */
try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
document.documentElement.classList.add("eb-arrive");   /* the header slides in (see the style below) */
</script>
<style>
/* A soft cross-fade between the menu and the games (Chrome; other browsers just switch). Both pages opt in. */
@media (prefers-reduced-motion: no-preference) {
  @view-transition { navigation: auto; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .25s; animation-timing-function: ease-out; }
}
/* The header slides down in from the top when a page arrives (html.eb-arrive, set in <head>, removed when the slide
   ends). It is the real header that moves, not a view-transition snapshot: a snapshot can't show the frosted-glass
   blur (a flat bar showed on PC) and was choppy on Android. The blur is off only while it moves (it is the costly
   part); it returns when the slide ends. */
@media (prefers-reduced-motion: no-preference) {
  html.eb-arrive header.dock { animation: eb-dock-in .48s cubic-bezier(.22,1,.36,1) both; will-change: transform, opacity;
    -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
}
@keyframes eb-dock-in { from { transform: translateY(calc(-100% - 28px)); opacity: 0; } }
/* Leaving with the Games button: the game fades away completely while its sound plays, leaving only its background,
   which is the menu's colour too; the menu then fades in on top. (Half-faded, the page froze on a dim picture while
   the menu loaded: "laggy".) */
html.eb-leaving body { opacity: 0; transition: opacity .22s ease-in; pointer-events: none; }
</style>
<script>
/* Every game saves its progress in the phone's storage. In the app all games share one storage, so each game's
   keys get the prefix "eb:false-friends:" here; two games can then use the same key names without overwriting each other.
   One exception: the background colour (every game saves it as "<prefix>-bg", e.g. "p:sky" or "c:#7aa7ff", like
   the menu) is ONE setting for the whole app, kept under the menu's key "eb-bg": the game opens with the colour
   chosen in the menu, and a colour chosen in a game becomes the menu's and the other games' too. */
(function () {
  try {
    var P = "eb:false-friends:", L = window.localStorage, S = Storage.prototype, BG = /^[a-z]+-bg$/;
    var get = S.getItem, set = S.setItem, del = S.removeItem;
    /* The EN / PT toggles too: ONE language for the whole app, the menu's (eb-lang). Each game saves its toggles
       under its own keys, with its own word for Portuguese (games.json "lang": "pt", "tr" or "native"; English is
       always "en"): reading one gives the menu's language, and a tap in a game changes the menu's and every
       game's. Until EN / PT is chosen, the menu's own rule: Portuguese for My level All / A1 / A2, English from B1. */
    var LG = {"ffb-guidelang": "tr", "ffb-tour-lang": "tr"};
    function appLang() {
      var l = get.call(L, "eb-lang");
      if (l === "en" || l === "pt") return l;
      var lv = get.call(L, "eb-level");
      return lv === "B1" || lv === "B2+" ? "en" : "pt";
    }
    S.getItem = function (k) {
      if (this === L && BG.test(k)) { var app = get.call(this, "eb-bg"); if (app) return app; }
      if (this === L && LG.hasOwnProperty(k)) return appLang() === "en" ? "en" : LG[k];
      return get.call(this, this === L ? P + k : k);
    };
    S.setItem = function (k, v) {
      if (this === L && BG.test(k)) set.call(this, "eb-bg", v);
      if (this === L && LG.hasOwnProperty(k)) set.call(this, "eb-lang", String(v) === "en" ? "en" : "pt");
      return set.call(this, this === L ? P + k : k, v);
    };
    S.removeItem = function (k) { return del.call(this, this === L ? P + k : k); };
    /* The app's own keys (eb-rounds, eb-don…) and language, for the injected donation script (donate.js) */
    window.ebApp = { get: function (k) { return get.call(L, k); }, set: function (k, v) { set.call(L, k, v); }, lang: appLang };
    /* Opened from the menu (a card or Continue)? Then the game starts at the menu's level ("My level"): the menu
       leaves a one-time note (sessionStorage eb-level-go), and the matching level is saved under the game's own
       level key before the game reads it (games.json "level"; the nearest level when the game doesn't have it).
       With "All" on the menu, or on a reload, the game keeps its own last level. */
    var LV = {"key": "ffb-level", "A1": "A2", "A2": "A2", "B1": "B1+", "B2+": "B1+"}, SS = window.sessionStorage;
    if (SS.getItem("eb-level-go") === "false-friends") {
      SS.removeItem("eb-level-go");
      var m = get.call(L, "eb-level");
      if (LV && LV[m]) set.call(L, P + LV.key, LV[m]);
    }
  } catch (e) {}
})();
</script>

}

    --fill-hi: rgba(255,255,255,.16); --fill-mid: rgba(255,255,255,.07); --fill-lo: rgba(255,255,255,.03);
    --gloss: rgba(255,255,255,.55);
    --underline: #ffb3d1;
    --rim-l: 68%; --glow-l: 62%; --lab-l: 78%;
    --sky-o: .6; --sky-rim-l: 68%; --sky-rim-a: .35; --sky-glow-l: 62%; --sky-glow-a: .22; --sky-hi: .55; --sky-tint-a: .06; --soap-hi: .22; --soap-gl: .5; --spot-plus: .39; --rimhi-l: 88%; --rimhi-a: .75; --faceg-l: 74%; --faceg-a: .13; --soap-lo: .03; --film-a: .24; --srim-l: 72%; --srim-a: .85; --sglow-l: 66%; --sglow-a: .4; --soap-sh: rgba(0,0,0,.22); --soap-sh2: rgba(0,0,0,.32);

html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100%;
  background-color: var(--bg-a);
  background-image:
    radial-gradient(60vmax 50vmax at 8% 6%, var(--bg-a), transparent 70%),
    radial-gradient(55vmax 45vmax at 95% 40%, var(--bg-b), transparent 70%),
    radial-gradient(60vmax 50vmax at 30% 100%, var(--bg-c), transparent 70%);
  background-attachment: fixed;

/* Theme change (01-theme.js swapBg): no transitions for that one style change; the old background fades away on top */
.theming *, .theming *::before, .theming *::after { transition: none !important; }
.bgfade { position: fixed; inset: 0; z-index: -1; pointer-events: none; background-color: var(--fa);
  background-image: radial-gradient(60vmax 50vmax at 8% 6%, var(--fa), transparent 70%),
    radial-gradient(55vmax 45vmax at 95% 40%, var(--fb), transparent 70%),
    radial-gradient(60vmax 50vmax at 30% 100%, var(--fc), transparent 70%);
  transition: opacity .55s ease; will-change: opacity; }
.bgfade.fading { opacity: 0; }

/* Controls */
.dock {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  z-index: 5;
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
  gap: 8px 14px;
  width: max-content; max-width: calc(100% - 24px);
  margin: 14px auto 0;
  padding: 6px 8px;
  border-radius: 28px;
  background: var(--dock-bg);
  border: 1px solid var(--dock-line);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: 0 8px 22px var(--shadow);
}
.seg { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; max-width: 100%; }
.seg button {
  appearance: none; border: 0; cursor: pointer;
  font-family: inherit; font-weight: 500; font-size: .95rem; line-height: 1;
  color: var(--ink); background: transparent;
  padding: .62em 1.1em; border-radius: 999px; white-space: nowrap;
  transition: background-color .2s ease, color .2s ease, transform .2s ease;
}
.seg button:hover { background: var(--dock-line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg-a); }
.sw { display: flex; align-items: center; gap: 8px 0; padding: 0 4px; }   /* circles spaced by margins, so the colour picker row never widens the pop-over */
.sw > button + button { margin-left: 8px; }
.sw button {
  position: relative; display: block; flex: none;
  width: 30px; height: 30px; padding: 0; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.9); cursor: pointer;
  box-shadow: 0 1px 5px var(--shadow);
  transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease;
}
.sw button:hover { transform: scale(1.12); }
.sw .on { box-shadow: 0 0 0 2px var(--dock-bg), 0 0 0 4px var(--ink); }
.sw .swc { background: conic-gradient(#ff7aa8, #ffd36b, #7be0a4, #6bc7ff, #b08cff, #ff7aa8); }
.dock button:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }

/* Phones: the dock fills the width; modes share row one, swatches sit centred on row two */
@media (max-width: 600px) {
  .dock { width: calc(100% - 20px); max-width: none; margin: 10px auto 0; padding: 6px; gap: 6px 10px; border-radius: 24px; }
  .seg { width: 100%; }
  .seg button { flex: 1 1 auto; padding: .62em .35em; font-size: clamp(.78rem, 3.6vw, .92rem); }
  .sw { width: 100%; justify-content: center; gap: 8px 0; padding: 0; }
  .sw > button + button { margin-left: clamp(4px, 1.6vw, 8px); }
}
@media (max-width: 380px) {
  .sw button { width: 28px; height: 28px; }
}
/* Level segment with sliding indicator (from template 2) */
.seg-cap { font-size: .85rem; opacity: .75; padding: 0 .3em 0 .6em; white-space: nowrap; }
/* Menu labels in the dock are set in capitals */
.seg.focus button, .seg-cap, .lang-cap, .tourbtn span { text-transform: uppercase; letter-spacing: .07em; }
.seg.focus button { font-size: .88rem; }
.seg-cap, .lang-cap { font-size: .76rem; }
.tourbtn span { font-size: .84rem; }
.seg.focus, .seg.level { position: relative; isolation: isolate; }
.seg.focus button[aria-pressed="true"], .seg.level button[aria-pressed="true"] { background: transparent; }
.seg.level { padding: 2px; border-radius: 999px; border: 1px solid var(--dock-line); flex-wrap: nowrap; }
.seg.level button { font-size: .82rem; font-weight: 600; letter-spacing: .04em; padding: .5em .8em; transition: color .3s ease, background-color .2s ease; }
.seg-ind { position: absolute; z-index: -1; top: 0; left: 0; width: 0; height: 0; border-radius: 999px; background: var(--ink); pointer-events: none; opacity: 0; }
.seg-ind.ready { opacity: 1; transition: transform .45s cubic-bezier(.34,1.4,.64,1), width .45s cubic-bezier(.34,1.4,.64,1), background-color .3s ease; }
.seg.focus button { transition: color .3s ease, background-color .2s ease; }
.seg.level .seg-ind { top: 0; left: 0; }
/* Glass bubble */
.b {
  --h: 200;
  position: relative;
  appearance: none; cursor: pointer;
  font-family: inherit; font-weight: 500;
  font-size: clamp(1.05rem, 1.5vw + .7rem, 1.4rem);
  line-height: 1;
  letter-spacing: .01em;
  color: var(--ink);
  padding: .78em 1.35em .82em;
  border-radius: 1.5em;
  border: 1.5px solid hsla(var(--h), 75%, var(--rim-l), .75);
  background: radial-gradient(120% 140% at 22% 14%, var(--fill-hi), var(--fill-mid) 48%, var(--fill-lo) 100%);
  box-shadow:
    inset 0 0 16px hsla(var(--h), 95%, var(--glow-l), .38),
    inset -5px -7px 14px hsla(calc(var(--h) + 70), 95%, var(--glow-l), .28),
    0 7px 16px var(--shadow);
  transition: transform .28s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease, border-color .25s ease;
}
.b::before {
  content: ""; position: absolute; left: 11%; top: 9%; width: 26%; height: 20%;
  border-radius: 50%;
  background: radial-gradient(closest-side, var(--gloss), transparent);
  transform: rotate(-14deg); opacity: .8; pointer-events: none; transition: opacity .25s ease;
}
.b::after {
  content: ""; position: absolute; right: 9%; bottom: 12%; width: 7%; height: 12%;
  border-radius: 50%; background: var(--gloss); opacity: .35; pointer-events: none;
}
.b:hover, .b:focus-visible, .b.playing {
  transform: translateY(-8px) scale(1.07);
  border-color: hsla(var(--h), 85%, calc(var(--rim-l) - 12%), .95);
  box-shadow:
    inset 0 0 22px hsla(var(--h), 100%, var(--glow-l), .6),
    inset -6px -8px 18px hsla(calc(var(--h) + 70), 100%, var(--glow-l), .45),
    0 16px 26px var(--shadow),
    0 0 0 4px hsla(var(--h), 90%, 75%, .22);
}
.b:hover::before, .b:focus-visible::before, .b.playing::before { opacity: 1; }
.b:focus-visible { outline: 2px solid var(--underline); outline-offset: 4px; }
.b:active { transform: translateY(-3px) scale(.97); }
@keyframes rise { from { opacity: 0; transform: translateY(26px) scale(.9); } }
@keyframes fade { from { opacity: 0; } }

}

.favmodal { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(20,20,40,.35); -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px); }
.favmodal.show { display: flex; animation: fadein .2s ease; }
.favcard { box-sizing: border-box; width: 100%; max-width: 560px; max-height: 80vh; overflow: auto; padding: 16px 18px 18px; border-radius: 28px; background: var(--bg-a); background: color-mix(in srgb, var(--bg-a) 72%, transparent); color: var(--ink); border: 1px solid var(--dock-line); box-shadow: 0 20px 50px rgba(0,0,0,.28); animation: cardin .3s cubic-bezier(.34,1.56,.64,1); }
.favhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.favhead h2 { margin: 0; font-size: 1.3rem; font-family: inherit; }
.favx { border: 0; background: transparent; color: inherit; font-size: 1.9rem; line-height: 1; cursor: pointer; opacity: .7; padding: 0 4px; }
.pend { text-align: center; padding: 16px 0 4px; }
.pend b { display: block; font-size: 2.2rem; }
.pmsg { font-size: 1.15rem; font-weight: 600; margin-top: 2px; }
.psub { font-size: .85rem; opacity: .7; }
/* Language picker */
.lang { display: flex; align-items: center; gap: .55rem; min-width: 0; max-width: 100%; padding: 0 4px; font-weight: 500; }
.lang-cap { font-size: .85rem; opacity: .75; white-space: nowrap; }
.lang-box { position: relative; display: block; min-width: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* The language picker is a glass pill (badge, name, chevron) that opens a list of glass options. The real <select>
   stays in the page, hidden, and holds the value; the pill and the list just set it. */
.pick {
  appearance: none; cursor: pointer; display: flex; align-items: center; gap: .55em; width: 100%; min-width: 0;
  padding: .32em .6em .32em .34em; border-radius: 999px;
  font-family: inherit; font-weight: 500; font-size: .95rem; line-height: 1.2; color: var(--ink); text-align: left;
  background: linear-gradient(180deg, var(--fill-hi), var(--fill-mid));
  border: 1px solid var(--dock-line);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), 0 2px 8px var(--shadow);
  transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease, background-color .2s ease;
}
.pick:hover { transform: translateY(-1px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), 0 5px 14px var(--shadow); }
.pick:active { transform: scale(.98); }
.pick:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.pick[aria-expanded="true"] { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), 0 0 0 3px rgba(224, 85, 138, .3); }
/* In the header only the colored badge shows; the language name stays for screen readers and the tooltip */
.pick-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pick-chev { flex: none; opacity: .7; transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
.pick[aria-expanded="true"] .pick-chev { transform: rotate(180deg); }
.pick-badge {
  flex: none; display: inline-grid; place-items: center; min-width: 2.35em; height: 1.85em; padding: 0 .55em; white-space: nowrap;
  border-radius: 999px; font-size: .74em; font-weight: 600; letter-spacing: .04em; color: #fff;
  background: var(--g, linear-gradient(135deg, #ff5ea8, #8a5cff)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35);
  text-shadow: 0 1px 1px rgba(0, 0, 0, .18);
}
.pick-list {
  position: fixed; z-index: 40; display: flex; flex-direction: column; gap: 2px; box-sizing: border-box;
  max-height: min(76vh, 500px); overflow-y: auto; overscroll-behavior: contain;
  padding: 6px; border-radius: 20px; outline: none;
  background: var(--bg-a); border: 1px solid var(--dock-line); box-shadow: 0 16px 36px var(--shadow);
  transform-origin: top center; animation: pickin .22s cubic-bezier(.2,.9,.3,1.15);
}
.pick-list[hidden] { display: none; }
.pick-list.up { transform-origin: bottom center; }
@keyframes pickin { from { opacity: 0; transform: translateY(-6px) scale(.96); } }
.pick-opt { display: flex; align-items: center; gap: .7em; padding: .5em .65em .5em .5em; border-radius: 14px; cursor: pointer; color: var(--ink); transition: background-color .15s ease; }
.pick-opt.active { background: var(--dock-line); }
.pick-opt .pick-badge { font-size: .7rem; min-width: 3.2em; }
.pick-txt { display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; }
.pick-name { font-size: .95rem; font-weight: 500; line-height: 1.2; }
.pick-sub { font-size: .74rem; line-height: 1.25; opacity: .62; }
.pick-check { flex: none; width: 18px; height: 18px; color: var(--underline); opacity: 0; transform: scale(.6); transition: opacity .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1); }
.pick-opt[aria-selected="true"] .pick-name { color: var(--underline); font-weight: 600; }
.pick-opt[aria-selected="true"] .pick-check { opacity: 1; transform: none; }
@media (max-width: 600px) {
  .lang { gap: .45rem; padding: 0; }
  .pick { font-size: .9rem; gap: .35em; padding: .28em .5em .28em .28em; }
}
@media (prefers-reduced-motion: reduce) { .pick, .pick-chev, .pick-list, .pick-check { animation: none; transition: none; } }
#snd { display: inline-flex; align-items: center; justify-content: center; padding: .5em .75em; }
#snd svg { display: block; }
/* Volume */
.volwrap { position: relative; display: flex; flex: 1 1 auto; justify-content: center; }
.volp { position: absolute; top: calc(100% + 10px); left: 50%; z-index: 30; display: flex; align-items: center; padding: 10px 16px; border-radius: 24px; background: var(--bg-a); border: 1px solid var(--dock-line); box-shadow: 0 10px 26px var(--shadow); opacity: 0; visibility: hidden; transform: translateX(-50%) translateY(-6px) scale(.5, .8); transform-origin: top center; transition: opacity .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1), visibility 0s linear .25s; }
.volp::before { content: ""; position: absolute; left: 0; right: 0; top: -12px; height: 12px; }
.volp input { width: 140px; margin: 0; cursor: pointer; accent-color: hsl(300,70%,58%); }
.volp { flex-direction: column; align-items: stretch; gap: 6px; }   /* two rows: effects, voice (2026-11-25) */
.volr { display: flex; align-items: center; gap: 10px; font-size: .8rem; white-space: nowrap; cursor: pointer; }
.volr span { flex: 1; opacity: .75; }
.volwrap.muted .volr { opacity: .45; }   /* muted by the speaker: the levels are kept, moving a slider unmutes */
@media (max-width: 560px) { .volwrap { position: static; } }   /* phones: the wider pop-over centres under the dock */
.volwrap.open .volp { opacity: 1; visibility: visible; transform: translateX(-50%); transition-delay: 0s; }
@media (hover: hover) { .volwrap:hover .volp { opacity: 1; visibility: visible; transform: translateX(-50%); transition-delay: 0s; } }
/* Score, progress, tiles, CTA (from template 2) */
.go { display: grid; grid-template-columns: 78px 1fr 78px; align-items: center; column-gap: 10px; max-width: 680px; margin: 20px auto 0; }
.score { cursor: pointer; font: inherit; color: var(--ink); transition: transform .28s cubic-bezier(.34,1.56,.64,1), background .35s ease, box-shadow .35s ease; }
.score:hover { transform: translateY(-2px); }
.score, .tile { justify-self: start; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 78px; height: 54px; padding: 0 8px; border-radius: 18px; background: var(--dock-bg); border: 1px solid var(--dock-line); box-shadow: 0 4px 12px var(--shadow); line-height: 1.05; text-align: center; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: background .35s ease, box-shadow .35s ease; }
.tile { justify-self: end; color: var(--ink); font: inherit; cursor: pointer; transition: transform .28s cubic-bezier(.34,1.56,.64,1), background-color .2s ease; }
.tile:hover { transform: translateY(-2px); background: var(--fill-hi); }
.tile:active { transform: scale(.96); }
.tile svg { display: block; transition: transform .5s cubic-bezier(.34,1.56,.64,1); }
.tile:hover svg { transform: rotate(-200deg); }
.tile small { font-size: .68rem; opacity: .75; white-space: nowrap; line-height: 1.05; }
.tile:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.score b { font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.score small { font-size: .68rem; opacity: .75; white-space: nowrap; }
.score.up { animation: scup .5s cubic-bezier(.34,1.56,.64,1); }
.score.down { animation: scdn .5s ease; }
.score.win { background: hsla(45,100%,80%,.92); box-shadow: 0 0 0 3px hsla(45,95%,60%,.55), 0 6px 18px var(--shadow); animation: scwin .8s cubic-bezier(.34,1.56,.64,1); }
.score.win b, .score.win small { color: #5a3d00; opacity: 1; }
@keyframes scup { 0% { transform: none; } 35% { transform: translateY(-8px) scale(1.22); background: hsla(150,75%,78%,.95); } 100% { transform: none; } }
@keyframes scdn { 0%, 100% { transform: none; } 20% { transform: translateX(-7px) scale(.94); background: hsla(350,85%,82%,.95); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
@keyframes scwin { 0% { transform: scale(1); } 40% { transform: scale(1.3) rotate(-4deg); } 70% { transform: scale(.95) rotate(2deg); } 100% { transform: scale(1); } }
.prog { width: min(100%, 300px); justify-self: center; text-align: center; }
.prog span { font-size: .9rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.cta { font-size: 1rem; font-weight: 600; padding: .6em 1.5em; border: 0; border-radius: 999px; cursor: pointer; color: #fff; background: linear-gradient(135deg, hsl(315,85%,68%), hsl(275,80%,68%)); box-shadow: 0 3px 9px hsla(295,70%,55%,.22); transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease; }
.cta:hover { transform: scale(1.05); box-shadow: 0 4px 12px hsla(295,70%,55%,.3); }
.cta:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.cta.pulse, .pbtn.pulse { animation: pulse 1.4s ease-in-out infinite; }
html, body { overflow-x: clip; }
/* Tutorial */
/* Tutorial: the dock button, then a guided tour. A spotlight glides from feature to feature (its huge shadow is the
   dimming), and a card next to it explains each one. */
.tourbtn {
  appearance: none; cursor: pointer; flex: none; position: relative;
  display: inline-flex; align-items: center; gap: .4em;
  padding: .55em .95em .55em .7em; border-radius: 999px;
  font-family: inherit; font-weight: 500; font-size: .92rem; line-height: 1;
  color: var(--ink); background: transparent; border: 1px solid var(--dock-line);
  transition: background-color .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
}
.tourbtn svg { display: block; flex: none; color: var(--underline); }
.tourbtn:hover { background: var(--dock-line); transform: translateY(-1px); }
.tourbtn:active { transform: scale(.96); }
.tourbtn.fresh::after {
  content: ""; position: absolute; inset: -3px; border-radius: inherit; pointer-events: none;
  border: 2px solid var(--underline); opacity: 0; animation: tourping 2.4s ease-out 1.5s infinite;
}
body.trial-on .tourbtn { pointer-events: none; opacity: .35; }
@keyframes tourping { 0% { opacity: .9; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(1.18); } }
.tour { position: fixed; inset: 0; z-index: 50; touch-action: none; }
.tour[hidden] { display: none; }
.tour-shield { position: absolute; inset: 0; }
.tour-spot {
  position: fixed; left: 50%; top: 50%; width: 0; height: 0; border-radius: 22px; pointer-events: none;
  box-shadow: 0 0 0 200vmax rgba(8, 12, 36, .62), 0 0 0 3px rgba(255, 255, 255, .9), 0 0 26px 6px rgba(255, 140, 200, .55);
}
.tour-spot::after {
  content: ""; position: absolute; inset: -6px; border-radius: inherit; border: 2px solid rgba(255, 255, 255, .8);
  animation: tourglow 1.8s ease-out infinite;
}
.tour-spot.none::after { display: none; }
@keyframes tourglow { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.06); } }
.tour-card {
  position: fixed; left: 50%; top: 50%; width: min(380px, calc(100vw - 32px)); box-sizing: border-box;
  display: flex; flex-direction: column; gap: .45rem;
  padding: 1.05rem 1.15rem 1rem; border-radius: 1.4rem;
  color: var(--ink); background: var(--dock-bg); border: 1px solid var(--dock-line);   /* the header's frosted glass (from Be Do Modal) */
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: 0 22px 50px rgba(0, 0, 0, .3);
}
.tour-card.in { animation: tourcard .34s cubic-bezier(.2,.9,.3,1.15); }
@keyframes tourcard { from { opacity: 0; transform: translateY(10px) scale(.96); } }
.tour-step { margin: 0; padding-right: 2rem; font-size: .72rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; opacity: .6; }
.tour-title { margin: 0; padding-right: 1.6rem; font-family: inherit; font-size: 1.32rem; font-weight: 600; line-height: 1.2; }
.tour-text { margin: 0; font-size: .98rem; line-height: 1.45; }
.tour-text b { color: var(--underline); font-weight: 600; }
.tour-foot { display: flex; align-items: center; justify-content: space-between; gap: .6rem; margin-top: .45rem; }
.tour-dots { display: flex; gap: 4px; min-width: 0; }
.tour-dots[hidden], .tour-back[hidden] { display: none; }
.tour-dots span { flex: none; width: 6px; height: 6px; border-radius: 99px; background: rgba(128,128,150,.35); transition: width .3s ease, background-color .3s ease; }
.tour-dots span.on { width: 16px; background: var(--underline); }
.tour-dots span.done { background: var(--underline); opacity: .55; }
.tour-nav { display: flex; gap: .4rem; flex: none; margin-left: auto; }
.tour-back, .tour-next {
  appearance: none; cursor: pointer; border: 0; border-radius: 999px;
  font-family: inherit; font-size: .92rem; font-weight: 500; line-height: 1; padding: .7em 1.15em;
  transition: transform .25s cubic-bezier(.34,1.56,.64,1), background-color .2s ease;
}
.tour-back { color: var(--ink); background: transparent; }
.tour-back:hover { background: var(--dock-line); }
.tour-next { color: #fff; font-weight: 600; background: linear-gradient(135deg, #ff5ea8, #c04dff 55%, #8a5cff); box-shadow: 0 4px 14px rgba(200, 77, 255, .4); }
.tour-next:hover { transform: scale(1.05); }
.tour-next:active, .tour-back:active { transform: scale(.96); }
.tour-x {
  appearance: none; cursor: pointer; border: 0; position: absolute; top: .55rem; right: .55rem;
  width: 2rem; height: 2rem; border-radius: 50%; font-family: inherit; font-size: 1.25rem; line-height: 1;
  color: var(--ink); background: transparent; transition: background-color .2s ease;
}
.tour-x:hover { background: var(--dock-line); }
.tourbtn:focus-visible, .tour-back:focus-visible, .tour-next:focus-visible, .tour-x:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.tour-pop { position: fixed; z-index: 51; width: 12px; height: 12px; border-radius: 50%; pointer-events: none; }
@media (max-width: 600px) {
  .tourbtn { padding: .5em; }
  .tourbtn span { display: none; }
  .tour-card { padding: .95rem 1rem .9rem; }
  .tour-title { font-size: 1.18rem; }
  .tour-text { font-size: .94rem; }
}
@media (prefers-reduced-motion: reduce) { .tourbtn.fresh::after, .tour-spot::after, .tour-card.in { animation: none; } }

/* 10-game.css — the play area's common parts (from Phrasal Verb Bubbles): hint line, buttons, word bubbles and their
   states, gaps, tools row, reveal card, word cards, toast, confetti, tour extras, voice note. The three steps' own
   layout is in 20-steps.css. */
[hidden] { display: none !important; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px 48px; }
#snd[aria-pressed="true"] { background: transparent; color: inherit; }
#snd[aria-pressed="true"]:hover { background: var(--dock-line); }
#snd[aria-pressed="false"] { opacity: .6; }
@media (max-width: 600px) { .seg.vseg { width: auto; } }
div.score { cursor: default; }
div.score:hover { transform: none; }
.hint { text-align: center; margin: 14px 12px 0; font-size: 1rem; opacity: .85; min-height: 2.8em; text-wrap: balance; line-height: 1.4; }
.hint b { color: var(--underline); font-weight: 600; }
.pbtn { font: inherit; font-size: .9rem; font-weight: 500; padding: .5em 1em; border-radius: 999px; border: 1.5px solid var(--dock-line); background: var(--dock-bg); color: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background-color .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s ease; }
.pbtn:hover:not(:disabled) { background: var(--dock-line); transform: translateY(-1px); }
.pbtn:disabled { opacity: .35; cursor: default; }
.pbtn:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.pbtn small { font-size: .74rem; opacity: .65; }
.pbtn.speaking, .pbtn[aria-pressed="true"] { background: var(--dock-line); }

/* English words are blue, words in the translation language green, everywhere */
.en { color: hsl(212,72%,var(--lab-l)); font-weight: 600; }
.tr { color: hsl(150,60%,var(--lab-l)); font-weight: 600; }
.ew { --h: 212; }
.pw { --h: 150; }
.ne { font-weight: 700; color: hsl(350,70%,58%); }
.not s { text-decoration-thickness: 2px; text-decoration-color: hsla(350,75%,58%,.85); font-weight: 600; }
.not small { font-size: .84em; opacity: .75; }

/* Stage */
#stage { position: relative; max-width: 1000px; margin: 10px auto 0; transition: opacity .25s ease, transform .25s ease; }
#stage.out { opacity: 0; transform: translateY(-10px); }

/* Word bubbles (the look comes from .b in 00-base.css) */
.b.w { font-size: 1.12rem; line-height: 1.1; padding: .58em 1.05em .62em; border-radius: 999px; white-space: nowrap; touch-action: none; user-select: none; -webkit-user-select: none; }
.b.w:hover, .b.w:focus-visible { transform: translateY(-4px) scale(1.07); }
@keyframes bob { from { translate: 0 0; } to { translate: var(--bx, 0px) var(--by, -6px); } }
.w.sel { transform: translateY(-6px) scale(1.1); border-color: var(--underline); animation: none;
  box-shadow: inset 0 0 22px hsla(var(--h),100%,var(--glow-l),.6), 0 14px 24px var(--shadow), 0 0 0 4px hsla(330,90%,70%,.35); }
.w.drag { position: fixed; z-index: 60; margin: 0; pointer-events: none; animation: none; transition: none; transform: scale(1.1) rotate(-3deg);
  box-shadow: inset 0 0 22px hsla(var(--h),100%,var(--glow-l),.6), 0 18px 30px var(--shadow), 0 0 0 4px hsla(var(--h),90%,75%,.25); }
.w.lifted { opacity: .22; }
.w.away { visibility: hidden; }
.w.bad { border-color: hsl(350,75%,60%); box-shadow: inset 0 0 18px hsla(350,90%,68%,.5), 0 6px 14px var(--shadow); }
.w.ok { border-color: hsl(150,60%,48%); box-shadow: inset 0 0 18px hsla(150,80%,60%,.45), 0 6px 14px var(--shadow); }
.w.shown { border-color: hsl(40,90%,55%); box-shadow: inset 0 0 18px hsla(45,95%,60%,.5), 0 6px 14px var(--shadow); }
.w.shake, .gslot.shake { animation: shake .5s ease; }
.w.glow, .gslot.glow { animation: glow 1s ease-in-out 3; }
.w.morph { animation: morph .5s cubic-bezier(.34,1.56,.64,1); }

/* Gaps: dashed pills that pulse when active and light up under a dragged word */
.gslot { display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; min-width: 6.4em; min-height: 2.35em; margin: 0 .15em; border-radius: 999px; cursor: pointer;
  border: 2px dashed hsla(var(--h, 150),55%,var(--rim-l),.95); transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease; }
.gslot:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.gslot.on { border-color: hsla(330,85%,65%,.8); background: hsla(330,90%,70%,.1); }
body.picking .gslot:not(.filled) { animation: gapcall 1.2s ease-in-out infinite; }
@keyframes gapcall { 50% { box-shadow: 0 0 0 4px hsla(330,90%,70%,.25); } }
.gslot.hot { border-style: solid; border-color: var(--underline); background: hsla(330,90%,70%,.18); }
.gslot.filled, .gslot.sg.filled { border-color: transparent; background: none; min-width: 0; cursor: default; animation: none !important; }
.gslot .w { font-size: 1rem; padding: .45em .9em .5em; }
.gslot .w:hover { transform: none; }
/* Hint peek: the word in the translation language, faint inside the gap for a few seconds */
.gslot .peek { padding: 0 .8em; white-space: nowrap; pointer-events: none; animation: peekin .35s ease-out; transition: opacity .4s ease; }
.gslot .peek.out { opacity: 0; }
@keyframes peekin { from { opacity: 0; transform: scale(.85); } }

/* Tools row */
.tools { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
#hintleft.tick { display: inline-block; animation: tick .5s cubic-bezier(.34,1.56,.64,1); }
#hintbtn.nudge { animation: nudge .7s ease-in-out; }

/* Reveal card */
.reveal { position: relative; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px 18px; max-width: 960px; margin: 18px auto 0; padding: 10px 12px 10px 16px; border-radius: 26px;
  background: var(--dock-bg); border: 1px solid var(--dock-line); box-shadow: 0 8px 22px var(--shadow);
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); animation: cardin .45s cubic-bezier(.34,1.56,.64,1); transition: opacity .25s ease; }
.reveal.out { opacity: 0; }
.chip { display: inline-block; font-size: .74rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: .38em .95em; border-radius: 999px; color: #fff; white-space: nowrap;
  background: linear-gradient(135deg, hsl(var(--h),75%,52%), hsl(calc(var(--h) + 35),70%,50%)); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); text-shadow: 0 1px 1px rgba(0,0,0,.18); }
.answ { font-weight: 700; color: hsl(212,72%,var(--lab-l)); }
.rv-tr { flex: 1 1 340px; display: flex; align-items: center; gap: 10px; animation: pup .5s .2s ease-out backwards; }
.rv-rows { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.rv-row { display: flex; align-items: center; gap: 6px; border-radius: .8em; transition: background-color .25s ease, box-shadow .25s ease; }
.rv-row p { flex: 1; margin: 0; font-size: clamp(.95rem, .3vw + .9rem, 1.05rem); font-weight: 500; text-align: left; line-height: 1.35; }
.rv-row .favstar { flex: none; }
.rv-row.reading { background: hsla(45,100%,65%,.22); box-shadow: 0 0 0 .25em hsla(45,100%,65%,.22); }
.rv-tr .pick-badge { font-size: .8rem; }
.rv-why { flex: 1 1 100%; margin: 2px 0 4px; display: flex; flex-direction: column; gap: 10px; text-align: left; animation: pup .35s ease-out backwards; }
.rv-why .sense + .sense { padding-top: 10px; border-top: 1px dashed var(--dock-line); }
.rv-btns { flex: none; display: flex; justify-content: center; align-items: center; gap: 8px; }
.rv-q { justify-content: center; width: 2.3em; height: 2.3em; padding: 0; font-size: 1rem; font-weight: 700; }
.rv-q[aria-expanded="true"] { background: var(--dock-line); }

/* One word card: word, part of speech, meaning; the look-alike it is not; definition; example */
.sense { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.sh { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.ffpill { display: inline-flex; padding: .28em .8em .32em; border-radius: 999px; font-weight: 600; white-space: nowrap; color: hsl(212,72%,var(--lab-l)); background: var(--fill-hi); border: 1.5px solid var(--dock-line); }
/* Each level has its own gradient (--lv, --lv2 on its button, from levels.json "grad"): the sliding pill takes the
   chosen one's (05-controls.js), and hovering a level tints it with its own color. Level chips wear it too. */
.seg.level button:hover { background: color-mix(in srgb, var(--lv) 22%, transparent); }
.seg.level button[aria-pressed="true"] { color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
.seg.level .seg-ind { background: linear-gradient(135deg, var(--lv, var(--ink)), var(--lv2, var(--ink))); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 3px 10px var(--shadow); }
/* The level selector as tall as the header's round buttons (.tourbtn: an 18px icon, its padding at .92rem, a 1px
   border), its buttons filling it (the sliding pill follows them); as in There or Have and Be Do Modal */
.seg.level { box-sizing: content-box; height: calc(18px + 1.1 * .92rem - 4px); align-items: stretch; }   /* - its own 2px padding, top and bottom */
.dock .seg.level button { padding-top: 0 !important; padding-bottom: 0 !important; }
@media (max-width: 600px) { .seg.level { height: calc(18px + .84 * .92rem - 4px); } }   /* phones: .tourbtn padding .42em */
.lvchip[style] { background: linear-gradient(135deg, var(--lv), var(--lv2)); border-color: transparent; color: #fff; opacity: 1; text-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
.lvchip { font-size: .66rem; font-weight: 700; letter-spacing: .06em; padding: .25em .6em; border-radius: 999px; border: 1px solid var(--dock-line); opacity: .8; }
.chip.pchip { font-size: .6rem; padding: .3em .7em; }
/* A word's kind (only false in some contexts, borrowed word, common mix-up) and its note */
.chip.kchip { font-size: .58rem; padding: .28em .7em; vertical-align: .12em; cursor: help; }
.knote { font-size: .86rem; line-height: 1.4; }
.hint .kchip { vertical-align: .15em; }
.sm { font-weight: 600; }
.snot { font-size: .92rem; }
.sd { font-size: .88rem; opacity: .85; line-height: 1.4; }
.sx { display: flex; align-items: flex-start; gap: 6px; margin-top: 2px; }
.sx > span { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.sxe { line-height: 1.35; }
.sxt { font-size: .84rem; opacity: .72; }
.pbtn.say { flex: none; padding: .3em .45em; border-color: transparent; background: transparent; }
.pbtn.say:hover { background: var(--dock-line); }
.ffchip { display: inline-flex; gap: .3em; padding: .18em .65em; border-radius: 999px; font-size: .86rem; border: 1.5px solid hsla(150,60%,50%,.6); background: hsla(150,70%,60%,.12); white-space: nowrap; }
.ffchip b { color: hsl(212,72%,var(--lab-l)); }
.ffchip.miss { border-color: hsla(350,75%,60%,.6); background: hsla(350,85%,70%,.12); }
.rnot { font-size: .84rem; opacity: .8; }

@keyframes cardin { from { opacity: 0; transform: scale(.92) translateY(12px); } }
@keyframes pup { from { opacity: 0; transform: translateY(10px); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }

/* Toast + confetti bubbles */
.toast { position: absolute; left: 50%; top: 0; z-index: 5; padding: .35em 1em; border-radius: 999px; font-weight: 600; white-space: nowrap; pointer-events: none;
  background: hsl(150,60%,42%); color: #fff; box-shadow: 0 6px 16px var(--shadow); animation: toast 1.7s ease-out forwards; }
.toast.zero { background: hsl(35,85%,48%); }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%,-40%) scale(.6); } 15% { opacity: 1; transform: translate(-50%,-115%) scale(1.08); } 75% { opacity: 1; transform: translate(-50%,-130%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-175%); } }
.pf { position: fixed; z-index: 55; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at 30% 30%, #fff, hsla(var(--h),85%,75%,.55)); border: 1px solid hsla(var(--h),85%,68%,.85); animation: pfly .8s ease-out forwards; }
@keyframes pfly { from { transform: translate(-50%,-50%) scale(.3); opacity: .95; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1); opacity: 0; } }

@keyframes tick { 0% { transform: scale(1); } 40% { transform: scale(1.5); color: hsl(45,95%,55%); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 15% { transform: translateX(-9px) rotate(-1.5deg); } 35% { transform: translateX(8px) rotate(1.2deg); } 55% { transform: translateX(-6px); } 75% { transform: translateX(4px); } }
@keyframes morph { 0% { transform: scale(1); } 40% { transform: scale(1.18) rotate(-2deg); filter: brightness(1.15); } 100% { transform: scale(1); } }
@keyframes glow { 0%,100% { box-shadow: 0 0 0 0 hsla(45,100%,60%,0), 0 7px 16px var(--shadow); } 50% { box-shadow: 0 0 0 7px hsla(45,100%,60%,.55), 0 7px 16px var(--shadow); } }
@keyframes nudge { 0%, 100% { transform: none; } 15% { transform: rotate(-6deg) scale(1.08); } 35% { transform: rotate(5deg) scale(1.08); } 55% { transform: rotate(-3deg) scale(1.04); } 75% { transform: rotate(2deg); } }

/* Tour: the spotlight glides between targets; header with the EN / translation toggle */
.tour-spot { transition: left .45s cubic-bezier(.3,1.15,.5,1), top .45s cubic-bezier(.3,1.15,.5,1), width .45s cubic-bezier(.3,1.15,.5,1), height .45s cubic-bezier(.3,1.15,.5,1); }
/* No glide until Next / Back (.glide, set in tourGo): the first card pops in where it belongs instead of flying in. */
.tour:not(.glide) .tour-card, .tour:not(.glide) .tour-spot { transition: none; }
.tour-card { transition: left .4s ease, top .4s ease; max-height: calc(100vh - 24px); overflow-y: auto; }
.tour-head { display: flex; align-items: center; gap: .6rem; padding-right: 2.2rem; }
.tour-head .tour-step { padding-right: 0; flex: 1; }
.tour-lang { display: flex; gap: 2px; padding: 2px; border-radius: 999px; border: 1px solid var(--dock-line); flex: none; }
.tour-lang button { appearance: none; border: 0; cursor: pointer; font-family: inherit; font-size: .7rem; font-weight: 600; letter-spacing: .06em; line-height: 1;
  padding: .45em .75em; border-radius: 999px; color: var(--ink); background: transparent; transition: background-color .2s ease, color .2s ease; }
.tour-lang button:hover { background: var(--dock-line); }
.tour-lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg-a); }
.tour-lang button:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
/* Welcome card: word ≠ look-alike = meaning; sentence card: a sample sentence */
.tour-ex { list-style: none; margin: .7rem 0 0; padding: 0; display: flex; flex-direction: column; gap: .45rem; }
.tour-ex li { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; font-weight: 500; }
.tour-ex i { font-style: normal; font-weight: 700; opacity: .55; }
.tour-ex .tl { text-decoration-thickness: 2px; text-decoration-color: hsla(350,75%,58%,.85); opacity: .8; }
.b.w.mini { font-size: .86rem; padding: .32em .75em .36em; cursor: default; }
.b.w.mini:hover { transform: none; }
.tour-demo { margin: .7rem 0 0; padding: .5rem .8rem; border-radius: 1rem; border: 1px dashed var(--dock-line); font-weight: 500; line-height: 2.3; }

/* No English voice on the device (03-tts.js) */
.voicenote { position: fixed; left: 0; right: 0; margin: 0 auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 70; width: max-content; max-width: min(92vw, 520px);
  padding: .7em 1.1em; border-radius: 16px; text-align: center; font-size: .92rem; font-weight: 500; line-height: 1.35;
  background: var(--dock-bg); border: 1.5px solid hsla(40,90%,55%,.8); color: var(--ink); box-shadow: 0 10px 26px var(--shadow);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); animation: pup .35s ease-out; pointer-events: none; }

@media (max-width: 600px) {
  .dock { gap: 6px 8px; }
  .hint { font-size: .94rem; margin-top: 10px; }
  .b.w { font-size: 1rem; padding: .5em .85em .55em; }
  .gslot .w { font-size: .92rem; padding: .4em .75em .45em; }
  .tools { margin-top: 14px; }
  .reveal { margin-top: 14px; padding: 10px; gap: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  #hintleft.tick, .reveal, .rv-tr, .rv-why, .toast, .w.shake, .w.glow, .gslot.glow, .gslot.shake, #hintbtn.nudge, .w.morph, .voicenote, body.picking .gslot, .gslot .peek { animation: none !important; }
  .tour-spot, .tour-card, #stage { transition: none; }
}
/* Edge jitter (from Be, Do & Modals via Conjunctions): while something rises on hover it gets an invisible strip
   reaching back past where its bottom edge was, so the cursor on that edge keeps the hover after the lift. Only while
   hovered: an always-on strip catches the cursor below the edge and jitters there instead. The strip = the lift + 3-4px. */
.tile, .pbtn { position: relative; }
@media (hover: hover) {
  .b.w:hover:not(.drag)::after, .pbtn:hover:not(:disabled)::after, .score:hover::after, .tile:hover::after,
  .tourbtn:not(.fresh):hover::after { content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: -8px; width: auto;
    height: auto; border-radius: 0; background: none; opacity: 1; animation: none; pointer-events: auto; }
  .score:hover::after, .tile:hover::after { bottom: -5px; }
  .pbtn:hover:not(:disabled)::after, .tourbtn:not(.fresh):hover::after { bottom: -4px; }
}

/* 20-steps.css — the three steps of a round: the floating pool and the rows (Pairs), the remembered pairs (Memo), the
   options and the sentences (Sentences); the bubbles that pop or float away between steps. */

/* The pool: the header's frosted glass at the top where the words float (Sentences: the false friends, as options);
   the pool, the rows, the Memo card and the Sentences card keep a hint of their colour (a faint rim and glow, --zhint) */
.pool { --h: 150; position: relative; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 18px 14px; min-height: 150px; padding: 2.1em 1.2em 1.5em;
  border-radius: 1.8em; border: 1px solid hsla(var(--h),70%,var(--rim-l),.45);
  --zhint: inset 0 0 22px hsla(var(--h), 95%, var(--glow-l), .16);
  background: var(--dock-bg); -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: var(--zhint), 0 8px 22px var(--shadow); }
.pool.opts { --h: 212; min-height: 110px; }
.pool .w { animation: bob var(--dur, 4s) ease-in-out var(--dl, 0s) infinite alternate; }
.pool .w.sel, .pool .w.flown.sel { animation: none; }
.tag { position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%); z-index: 2; display: inline-flex; align-items: center; gap: .5em; padding: calc(.3em + 1.5px) calc(.85em + 1.5px); border-radius: 999px; white-space: nowrap;
  font-size: .7rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  /* a flat gradient pill in the card's colour, white text (Be Do Modal's labels) */
  color: #fff; background: linear-gradient(90deg, hsl(var(--h, 265), 75%, 60%), hsl(calc(var(--h, 265) + 28), 65%, 60%)); text-shadow: 0 1px 1px rgba(0,0,0,.15); }
#stage.rise .pool .w { animation: rise .55s cubic-bezier(.2,.8,.3,1) backwards, bob var(--dur, 4s) ease-in-out var(--dl, 0s) infinite alternate; animation-delay: var(--d, 0s), var(--dl, 0s); }

/* Rows: "pretend looks like ___ but it actually means ___" */
.rows { display: flex; flex-direction: column; gap: 14px; margin-top: 26px; }
.row { --h: 212; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px 14px; padding: .8em 1em; border-radius: 1.6em;
  border: 1px solid hsla(var(--h),70%,var(--rim-l),.4); background: var(--dock-bg); -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: inset 0 0 18px hsla(var(--h), 95%, var(--glow-l), .12), 0 6px 18px var(--shadow); }
#stage.rise .row { animation: rise .55s cubic-bezier(.2,.8,.3,1) backwards; animation-delay: var(--d, 0s); }
.rg { display: inline-flex; align-items: center; gap: 10px; flex-wrap: nowrap; }
.rl { font-size: 1.05rem; font-weight: 500; opacity: .8; white-space: nowrap; }
.b.w.cog { font-size: 1.2rem; padding: .55em 1.15em .6em; cursor: pointer; touch-action: manipulation; }
.b.w.cog.speaking { border-color: var(--underline); }

/* Memo: the three pairs, lit up one by one while the word is read */
.memo { --h: 265; position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; max-width: 720px; margin: 22px auto 0; padding: 2.2em 1.2em 1.3em;
  border-radius: 1.8em;
  border: 1px solid hsla(var(--h),70%,var(--rim-l),.45); background: var(--dock-bg); -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: inset 0 0 22px hsla(var(--h), 95%, var(--glow-l), .16), 0 8px 22px var(--shadow); }
.mpairs { display: flex; flex-direction: column; align-items: stretch; gap: 12px; width: 100%; max-width: 520px; }
.mp { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: .7em .8em .6em; border-radius: 1.3em; cursor: pointer; border: 2px solid transparent;
  transition: background-color .3s ease, border-color .3s ease, transform .35s cubic-bezier(.34,1.56,.64,1), opacity .3s ease; }
.mpairs:has(.reading) .mp:not(.reading) { opacity: .55; }
.mp.reading { background: hsla(45,100%,65%,.2); border-color: hsla(45,95%,60%,.7); transform: scale(1.06); }
.mp:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
.mpr { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.mpr .b.w { font-size: 1.25rem; cursor: inherit; }
.mpr .b.w:hover { transform: none; }
.eq { font-size: 1.5rem; font-weight: 700; opacity: .55; }
.mnot { font-size: .92rem; opacity: .85; }
.mp.reading .mnot { opacity: 1; }
.mbtns { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
/* Leaving for the Sentences step: everything but the bubbles fades while each meaning melts into its word */
.memo .tag, .memo .eq, .mnot, .memo .knote, .mbtns { transition: opacity .3s ease; }
.memo.leaving { pointer-events: none; }
.memo.leaving .tag, .memo.leaving .eq, .memo.leaving .mnot, .memo.leaving .knote, .memo.leaving .mbtns { opacity: 0; }
.mp .knote { max-width: 30em; text-align: center; opacity: .9; }
/* "I'm ready": a bar fills it while the countdown runs */
#memogo { position: relative; overflow: hidden; isolation: isolate; }
#memogo .fill { position: absolute; inset: 0; z-index: -1; width: 0; background: hsla(0,0%,100%,.28); }
#memogo.counting .fill { animation: fillup var(--wait, 5s) linear forwards; }
@keyframes fillup { to { width: 100%; } }

/* Sentences: one card, three sentences, each with its translation once it is done */
.sents { --h: 265; position: relative; display: flex; flex-direction: column; gap: 10px; max-width: 820px; margin: 26px auto 0; padding: 2em 1.4em 1.3em; border-radius: 1.8em;
  border: 1px solid hsla(var(--h),70%,var(--rim-l),.45); background: var(--dock-bg); -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: inset 0 0 22px hsla(var(--h), 95%, var(--glow-l), .16), 0 8px 22px var(--shadow); }
.sents.in { animation: cardin .5s cubic-bezier(.34,1.4,.64,1) .25s backwards; }
.srow { padding: .2em .5em; border-radius: .9em; transition: background-color .25s ease, box-shadow .25s ease; }
.srow + .srow { padding-top: .5em; border-top: 1px dashed var(--dock-line); }
.srow.reading { background: hsla(45,100%,65%,.22); box-shadow: 0 0 0 .25em hsla(45,100%,65%,.22); }
.ptext { margin: 0; font-size: clamp(1.08rem, .7vw + .96rem, 1.3rem); font-weight: 500; line-height: 2.2; text-align: center; text-wrap: balance; }
.gapw { white-space: nowrap; }
.gslot.sg { --h: 212; min-width: 6.8em; }
.strn { margin: 0 0 .3em; text-align: center; font-size: .92rem; opacity: .75; }
.strn.next { animation: pup .4s ease-out; }
.psay { margin-left: .3em; vertical-align: middle; }
.psay svg { width: 1.05em; height: 1.05em; }

/* Between steps: a look-alike pops (struck out first), a leftover word floats away */
.b.w.ghost { position: fixed; z-index: 55; margin: 0; pointer-events: none; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; }
.ghost.popout { animation: popout .9s cubic-bezier(.4,0,.6,1) forwards; }
.ghost.popout .tr { text-decoration: line-through; text-decoration-thickness: 2.5px; text-decoration-color: hsl(350,75%,58%); }
.ghost.drift { animation: drift .9s ease-in forwards; }
@keyframes popout { 0% { transform: none; } 35% { transform: scale(1.08); border-color: hsl(350,75%,60%); } 100% { transform: scale(1.5); opacity: 0; filter: blur(2px); } }
@keyframes drift { to { transform: translate(var(--dx, 0px), -90px) scale(.7); opacity: 0; } }
.w.flown { animation: none; }
.pool .w.flown { animation: bob var(--dur, 4s) ease-in-out var(--dl, 0s) infinite alternate; }

@media (max-width: 600px) {
  .pool { gap: 14px 10px; min-height: 120px; padding: 1.8em .7em 1.1em; border-radius: 1.4em; }
  .rows { gap: 10px; margin-top: 20px; }
  .row { padding: .6em .6em; gap: 8px 8px; border-radius: 1.3em; }
  .rg { gap: 6px; }
  .rl { font-size: .92rem; }
  .b.w.cog { font-size: 1.05rem; }
  .gslot { min-width: 5.4em; min-height: 2.2em; }
  .memo { padding: 2em .6em 1em; }
  .mpr .b.w { font-size: 1.08rem; }
  .sents { padding: 1.8em .7em 1em; }
  .ptext { line-height: 2.05; }
}
@media (prefers-reduced-motion: reduce) {
  .pool .w, .pool .w.flown, #stage.rise .pool .w, #stage.rise .row, .sents.in, .strn.next, .ghost, #memogo.counting .fill { animation: none !important; }
  .mp { transition: none; }
}

/* 22-soap.css — every word bubble (.b.w: pool words, row words, gap words, Memo pairs, Sentences options, Proofreading
   bubbles and their menu, tutorial samples) as a soap bubble (from Phrasal Verb Bubbles, after Be Do Modal, 2026-11-23):
   almost clear, a faint film of colour inside and a 1.5px coloured rim, both turning once in 10 s. The colours stay
   fixed: English blue (212), Portuguese green (150); the film only shimmers ±40° round its hue. Built from spans (SOAP +
   soapify in 24-shine.js) at z-index -1 in the bubble's own stacking context, so the text stays on top. The film and
   the rim turn by rotating a still conic gradient (.spin); what follows the mouse moves by transform / opacity only.
   Per-theme numbers are tokens in 00-base.css (--soap-*, --spot-plus, --film-a, --srim-*, --sglow-*, --rimhi-*, --faceg-*). */
.b.w { --th: var(--h); --s1: var(--th); --s2: calc(var(--th) + 40); --s3: calc(var(--th) - 40);
  isolation: isolate; border-color: transparent; background: none;
  --ig: inset 0 0 12px hsla(var(--th), 95%, var(--sglow-l), var(--sglow-a));   /* the inner glow, drawn above the film by .film::after; states change it */
  box-shadow: 0 6px 14px var(--soap-sh); }
.b.w::before { content: none; }   /* the shine spot is the .spot span */
.b.w::after { background: none; }   /* ::after is only the hover strip (00-base.css) */
.w > :is(.film, .spot, .rim, .glint) { z-index: -1; cursor: inherit; }
.w .film { position: absolute; inset: -1.5px; border-radius: inherit; overflow: hidden; pointer-events: none; }
.w .film::before { content: ""; position: absolute; inset: 0; z-index: 1;
  background: radial-gradient(120% 120% at 30% 20%, rgba(255,255,255,var(--soap-hi)), rgba(255,255,255,var(--soap-lo)) 60%, transparent); }
.w .film::after { content: ""; position: absolute; inset: 1.5px; z-index: 3; border-radius: inherit; box-shadow: var(--ig); transition: box-shadow .25s ease; }
/* The turning colour of film and rim: a square wider than the bubble's diagonal, centred; rotating it = turning the
   conic gradient's start. Both start together, so their colours stay in step. */
.w .spin { position: absolute; left: 50%; top: 50%; width: calc(100% + 1.6em); aspect-ratio: 1; translate: -50% -50%; animation: spin 10s linear var(--dl, 0s) infinite; }
