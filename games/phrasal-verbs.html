  document.querySelectorAll('.favstar[data-id="' + b.dataset.id + '"]').forEach(s => { s.classList.toggle("on", on); s.setAttribute("aria-pressed", on); });
  // Favoriting, as in Simple Past / Be Do Modal: the star wobbles, the header Favorites button pops, gold sparks fly, a chime.
  if (on) { flash(b, "pop"); flash($("favbtn"), "pop"); sndHint(); burst(b, 12, 45, "top"); } else sndBack();
}, true);

/* ---------- List modal ---------- */
const listModal = $("listmodal");
let listMode = "fav", seenTab = "recent";
function itemHTML(x, cls) { return '<li class="' + cls + '"><div class="rs">' + senseHTML(PV[x.id], { level: true, ex: true }) + "</div>" + revBtn(PV[x.id]) + favBtn(x.id) + "</li>"; }
function renderList() {
  const fav = listMode === "fav";
  const items = fav ? getList("phv-fav") : getList("phv-seen").filter(x => seenTab === "recent" || !x.ok);
  $("listtitle").textContent = tx(fav ? "favorites" : "seenTitle");
  $("listtabs").hidden = fav;
  $("listtabs").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tab === seenTab)));
  $("listbody").innerHTML = items.map(x => itemHTML(x, fav ? "plain" : x.ok ? "" : "miss")).join("");
  // Seen: a mastery meter for every level. Practice button for Missed and Favorites.
  $("listprog").hidden = fav;
  if (!fav) $("listprog").innerHTML = '<p class="lp-h">' + tx("masteredHead") + "</p>" + LEVELS.map(l => meterHTML(l)).join("");
  const pl = $("listplay"); pl.hidden = !items.length || (!fav && seenTab !== "missed");
  pl.textContent = tx(items.length === 1 ? "practiseOne" : "practiseMany") + " (" + tx("nRounds", { n: Math.min(items.length, ROUNDS) }) + ") →";
  const empty = $("listempty"); empty.hidden = items.length > 0;
  empty.textContent = tx(fav ? "emptyFav" : seenTab === "recent" ? "emptyRecent" : "emptyMissed");
}
function openList(mode) { listMode = mode; renderList(); listModal.classList.add("show"); setTimeout(() => listModal.querySelector(".favx").focus({ preventScroll: true }), 50); }
function closeList() { listModal.classList.remove("show"); $({ fav: "favbtn", seen: "seenbtn", guide: "guidebtn" }[listMode]).focus({ preventScroll: true }); }
$("favbtn").addEventListener("click", () => openList("fav"));
$("seenbtn").addEventListener("click", () => openList("seen"));
$("listplay").addEventListener("click", () => { listModal.classList.remove("show"); startMode(listMode === "fav" ? "fav" : "review"); });
$("listtabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) { seenTab = b.dataset.tab; renderList(); } });
listModal.addEventListener("click", e => { if (e.target === listModal || e.target.closest("[data-close]")) closeList(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && listModal.classList.contains("show")) closeList(); });
backLayer(listModal, () => listModal.classList.contains("show"), closeList);   // the back gesture closes it (07-back.js)

/* ---------- Reverso Context links (as in Idiom Practice) ---------- */
// A "+" beside the star (Favorites, Seen, the collection) opens — on hover, or a tap — into "more examples on
// Reverso.net" and a link per way to search the phrasal verb, in the translation language (i18n "reverso").
const PLUS = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
const rvUrl = t => "https://context.reverso.net/translation/english-" + (lang().reverso || "portuguese") + "/" + encodeURIComponent(t.toLowerCase()).replace(/%20/g, "+");
// The phrasal verb as said (get carried away, hit it off) and, if separable, round its object too (turn it off).
function rvTerms(s) { const t = [sayOf(s)]; if (s.t === "sep" && !s.mid && !s.pre) t.push(s.v + " " + (s.obj || "it") + " " + s.p); return t; }
function revBtn(s) {
  return '<span class="rvwrap"><span class="more"><span class="mt"><button type="button" class="pl" aria-label="' + esc(tx("reverso")) + '" aria-expanded="false">' + PLUS + '</button><span class="tx">' + esc(tx("reverso")) + "</span></span>" +
    rvTerms(s).map(t => '<a class="mo" target="_blank" rel="noopener noreferrer" href="' + esc(rvUrl(t)) + '">' + esc(t) + " &rarr;</a>").join("") + "</span></span>";
}
// Tapping "+" opens it (and closes any other); a tap anywhere else closes it.
document.addEventListener("click", e => {
  const b = e.target.closest(".more .pl"), m = b && b.closest(".more");
  document.querySelectorAll(".more.open").forEach(o => { if (o !== m) { o.classList.remove("open"); o.querySelector(".pl").setAttribute("aria-expanded", "false"); } });
  if (!b) return;
  e.stopPropagation(); b.setAttribute("aria-expanded", m.classList.toggle("open"));
}, true);

/* 22-modes.js — ways to play beyond a normal game:
   - the header's mode button: Free play (23-free.js) ⇄ Game. It swaps the header (42-modebtn.css): level, Favorites and
     Seen in a game; Particle guide and Your collection in free play. A game under way is left only on a second tap.
     A reload always starts a normal game. In free play the "new game" tile is "start over" (clears the bubbles);
   - the Play menu on the "new game" tile: Normal game, Review missed, Favorites;
   - practice games from the Missed / Favorites lists (no best score): each round's sentence is one of their meanings;
   - one quick "Which particle?" question in a normal game, before round QUIZ_AT + 1, the last (+1 point): a meaning and its verb,
     four particles (the others make other phrasal verbs with that verb when possible); the answer shows them all. */
const QUIZ_AT = 2;
const MODE_NAME = { normal: "Game", free: "Free play", review: "Review missed", fav: "Favorites" };
const playBtn = $("restart"), playMenu = $("playmenu");

/* ---------- Play menu ---------- */
function missedIds() { return getList("phv-seen").filter(x => !x.ok).map(x => x.id); }
function favIds() { return getList("phv-fav").map(x => x.id); }
function openPlay() {
  const m = missedIds().length, f = favIds().length, nm = k => tx(k === 1 ? "oneMeaning" : "nMeanings", { n: k });
  $("pm-lv").textContent = G.level + " · " + tx("nRounds", { n: ROUNDS });
  $("pm-miss").textContent = m ? nm(m) : tx("pmNoMiss");
  $("pm-fav").textContent = f ? nm(f) : tx("pmNoFav");
  playMenu.querySelector('[data-mode="review"]').disabled = !m;
  playMenu.querySelector('[data-mode="fav"]').disabled = !f;
  playMenu.querySelectorAll("button[data-mode]").forEach(b => b.setAttribute("aria-current", b.dataset.mode === G.mode)); // the dot
  playMenu.hidden = false; playBtn.setAttribute("aria-expanded", "true");
  playMenu.querySelector("button:not(:disabled)").focus({ preventScroll: true });
}
function closePlay() { playMenu.hidden = true; playBtn.setAttribute("aria-expanded", "false"); }
// Start a game in this mode; review / favourites fall back to a normal game when their list is empty.
function startMode(mode) {
  closePlay(); sndShuffle();
  const ids = mode === "review" ? missedIds() : mode === "fav" ? favIds() : null;
  if (ids && !ids.length) mode = "normal";
  newGame(G.level, mode, ids && ids.length ? ids : undefined);
}
function playAgain() { startMode(G.mode); }
playBtn.addEventListener("click", () => G.mode === "free" ? freeRestart() : playMenu.hidden ? openPlay() : closePlay());

/* ---------- Mode button: Free play ⇄ Normal game ---------- */
const modeBtn = $("modebtn");
const ICON_FREE = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="8" cy="9" r="4.5"/><circle cx="16.5" cy="8" r="3"/><circle cx="14.5" cy="17" r="4.5"/></svg>';
const ICON_GAME = '<svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.1 5.6 5.9.4-4.6 3.8 1.5 5.8L12 14.9l-4.9 3.2 1.5-5.8L4 8.5l5.9-.4z"/></svg>';
// Free play on / off: body.free swaps the header (42-modebtn.css); its width glides from the old side's to the new one's.
// The width is held, and the glide waits at least 120 ms and then for a frame at the normal pace (at most 400 ms): by
// then free play has filled its buttons (the collection's count) and its board's first, heavy frame is drawn (the first
// visit is slow), so the glide doesn't stutter through it.
function swapHeader(free) {
  const hs = $("hswap"), was = document.body.classList.contains("free"), w0 = hs.offsetWidth;
  $("collcount").textContent = getFound().length;
  document.body.classList.toggle("free", free);
  if (was === free || reduceMotion || getComputedStyle(hs).display === "contents") return;
  hs.style.width = w0 + "px";
  const t0 = performance.now(); let last = t0;
  const step = t => {
    const slow = t - last > 30; last = t;
    if ((t - t0 < 120 || slow) && t - t0 < 400) return requestAnimationFrame(step);
    hs.style.width = ""; const w1 = hs.offsetWidth;
    if (Math.abs(w1 - w0) > 1) hs.animate([{ width: w0 + "px" }, { width: w1 + "px" }], { duration: 420, easing: "cubic-bezier(.3,.9,.3,1)" });
  };
  requestAnimationFrame(step);
}
// The button names the other mode; the "new game" tile becomes "start over" in free play.
function setModeBtn() {
  const free = G.mode === "free", tl = playBtn.querySelector("small");
  clearTimeout(modeBtn._t); modeBtn.classList.remove("sure"); modeBtn.classList.toggle("on", free);
  // Both labels share one cell (the other one hidden), so the button keeps its width and the header doesn't move.
  modeBtn.innerHTML = (free ? ICON_GAME : ICON_FREE) + '<span class="ml"><span>' + tx(free ? "modeGame" : "modeFree") + '</span><span aria-hidden="true">' + tx(free ? "modeFree" : "modeGame") + "</span></span>";
  modeBtn.title = tx(free ? "modeGameTitle" : "modeFreeTitle");
  if (modeBtn._free !== undefined && modeBtn._free !== free) modeBtn.querySelectorAll(".ml, svg").forEach(e => e.classList.add("in"));
  modeBtn._free = free;
  $("hgame").inert = free; $("hfree").inert = !free;
  tl.dataset.ui = free ? "startOver" : "newGame"; tl.textContent = tx(tl.dataset.ui);
  playBtn.title = free ? tx("startOverTitle") : "New game and other ways to play";
  if (free) playBtn.removeAttribute("aria-haspopup"); else playBtn.setAttribute("aria-haspopup", "menu");
}
// A game with something done in it (not yet over) is left only on a second tap within 3 s.
function gameUnderway() { return G.mode !== "free" && G.phase !== "over" && (G.idx > 0 || G.score > 0 || !!(G.r && G.r.pvs && G.r.pvs.length)); }
modeBtn.addEventListener("click", () => {
  if (gameUnderway() && !modeBtn.classList.contains("sure")) {
    modeBtn.classList.add("sure"); modeBtn.querySelector(".ml span").textContent = tx(matchMedia("(max-width: 600px)").matches ? "modeLeaveShort" : "modeLeave"); modeBtn.title = tx("modeLeaveTitle");
    sndBack(); modeBtn._t = setTimeout(setModeBtn, 3000); return;
  }
  startMode(G.mode === "free" ? "normal" : "free");
});
playMenu.addEventListener("click", e => { const b = e.target.closest("button[data-mode]"); if (b && !b.disabled) startMode(b.dataset.mode); });
document.addEventListener("click", e => { if (!playMenu.hidden && !e.target.closest("#playwrap")) closePlay(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !playMenu.hidden) { closePlay(); playBtn.focus(); } });
backLayer(playMenu, () => !playMenu.hidden, closePlay);   // the back gesture closes it (07-back.js)
// Free play, review and favorites games hold a history entry like a window: Back leaves them for a normal game.
backLayer(document.body, () => document.body.classList.contains("other-mode"), () => startMode("normal"));

/* ---------- Quick question: which particle? ---------- */
function quizDue() { return G.mode === "normal" && G.idx === QUIZ_AT && !G.quiz; }
// Four particles for meaning s: its own, then particles that make another phrasal verb with the same verb (not a
// near-synonym: "fits"), then particles that make none with it.
function quizOptions(s) {
  const others = Object.keys(DATA.pool.particles).filter(p => p !== s.p && !(s.fits || []).includes(comboOf(s.v, p)) && !(BY[comboOf(s.v, p)] || []).some(x => (x.fits || []).includes(keyOf(s))));
  const real = shuffle(others.filter(p => BY[comboOf(s.v, p)])), none = shuffle(others.filter(p => !BY[comboOf(s.v, p)] && !ALSO.has(comboOf(s.v, p))));
  return shuffle([s.p, ...real.slice(0, 2), ...none].slice(0, 4));
}
function showQuiz() {
  // A three-word phrasal verb (tail) is never asked: its particle alone would not finish it.
  const L = lvIdx(G.level), cands = DATA.pv.filter(s => !s.tail && lvIdx(s.lv) <= L && !G.used.has(keyOf(s)) && trOf(s).m && quizOptions(s).length === 4);
  if (!cands.length) return startRound();
  const s = pick(cands), opts = quizOptions(s);
  G.quiz = { s, ok: null }; G.phase = "quiz";
  stage.hidden = toolsEl.hidden = revealEl.hidden = true;
  hintEl.innerHTML = tx("quizAsk");
  $("proglbl").textContent = tx("quizLabel"); $("steps").hidden = true;
  quizEl.innerHTML = '<p class="qz-m" lang="' + esc(curLang) + '">“' + esc(trOf(s).m) + '”</p><p class="qz-s">' + preHTML(s) + '<span class="pv-v">' + esc(verbOf(s)) + '</span>' + midHTML(s) + ' <span class="qz-gap"></span></p><div class="qz-opts">' +
    opts.map(p => '<button type="button" class="pbtn" data-p="' + esc(p) + '"><span class="pv-p">' + esc(p) + "</span></button>").join("") +
    '</div><ul class="qz-why" hidden></ul><div class="rv-btns" hidden><button type="button" class="cta pulse" id="qznext">' + tx("next") + " &rarr;</button></div>";
  quizEl.hidden = false; quizEl.classList.remove("in"); void quizEl.offsetWidth; quizEl.classList.add("in");
}
function answerQuiz(btn) {
  const q = G.quiz; if (!q || q.ok !== null) return;
  q.ok = btn.dataset.p === q.s.p;
  quizEl.querySelectorAll(".qz-opts button").forEach(b => { b.disabled = true; if (b.dataset.p === q.s.p) b.classList.add("ok"); });
  if (q.ok) { G.score++; showScore(); flash(scoreEl, "up"); sndOk(); toastAt(btn, "+1"); } else { btn.classList.add("bad"); sndBad(); }
  quizEl.querySelector(".qz-gap").innerHTML = '<span class="pv-p">' + esc(q.s.p) + "</span>";
  // What each option makes with the verb.
  const why = quizEl.querySelector(".qz-why");
  why.innerHTML = [...quizEl.querySelectorAll(".qz-opts button")].map(b => {
    const p = b.dataset.p, c = comboOf(q.s.v, p), x = p === q.s.p ? q.s : (BY[c] || [])[0];
    return "<li" + (p === q.s.p ? ' class="ok"' : x ? "" : ' class="none"') + "><b>" + (p === q.s.p ? pvOf(q.s) : pvHTML(q.s.v, p)) + "</b> " + (x ? '<span lang="' + esc(curLang) + '">' + esc(trOf(x).m || x.def) + "</span>" : '<span class="no">' + tx("quizNone") + "</span>") + "</li>";
  }).join("");
  why.hidden = false; quizEl.querySelector(".rv-btns").hidden = false;
  hintEl.innerHTML = tx(q.ok ? "quizBonus" : "quizNoBonus");
  $("qznext").focus({ preventScroll: true });
}
function endQuiz() {
  if (!G.quiz || G.quiz.ok === null) return;
  quizEl.hidden = true; stage.hidden = toolsEl.hidden = false; G.phase = "idle";
  startRound();
}
quizEl.addEventListener("click", e => {
  const b = e.target.closest(".qz-opts button"); if (b) return answerQuiz(b);
  if (e.target.closest("#qznext")) endQuiz();
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && G.phase === "quiz" && G.quiz && G.quiz.ok !== null && e.target.id !== "qznext") { e.preventDefault(); endQuiz(); } });

/* 23-free.js — Free play: no rounds and no score. The whole pool is on the board (every verb, every particle) with one
   slot in the middle; any phrasal verb of the game (any level) the player makes floats as a bubble under the slot
   (newest first: it pushes the others down; tap one to hear it and see its meanings again) and joins the collection
   ("Your collection" button: a modal, newest on top, tap one for its meanings, definitions and examples). The
   collection is kept (phv-found = ["give up", "come up with", ...]: forms, newest first; "Clear collection" in the
   modal empties it); "Start over" only clears the bubbles. A pair with more than one form (get around / get around
   to) asks for its third word, like the Build step: each form counts on its own (FFORMS, 10-game.js). Each word's
   badge = phrasal verbs still to find with it; a word with none
   left leaves the board. The untaught combinations (pool "also") count too: they have meanings in phrasal/extra.json (FBY); anything
   else just shakes.
   Hint (free): a verb and a particle that go together light up; with a word already in the slot, a few words that
   go with it light up. The Particle guide lists every particle's idea. */
const flistEl = $("flist"), fmadeEl = $("fmade"), collModal = $("collmodal");
let freeOpen = "";
// The forms found. Saved before forms were counted, a pair stands for its two-word form (or its forms, if it has none).
function getFound() {
  const a = loadJSON("phv-found", []), out = [];
  if (Array.isArray(a)) a.forEach(x => { if (FFORMS[x]) out.push(x); else if (FBY[x]) fformsOf(x).forEach(t => out.push(x + " " + t)); });
  return [...new Set(out)];
}
// A pair's forms (its third words, "" = none), a form's meanings, and its level (its easiest meaning's).
const fformsOf = c => [...new Set(FBY[c].map(s => s.tail || ""))];
const formSenses = f => FBY[FFORMS[f]].filter(s => fullOf(s) === f);
const formLevel = f => formSenses(f).map(s => s.lv).sort((a, b) => lvIdx(a) - lvIdx(b))[0];
// A word's forms, worked out once per word (the badges ask for every word's at each find).
const WFORMS = {};
const wordForms = (w, side) => WFORMS[side + w] || (WFORMS[side + w] = Object.keys(FFORMS).filter(f => FFORMS[f].split(" ")[side === "v" ? 0 : 1] === w));
function startFree() {
  G.phase = "free";
  G.r = { level: G.level, free: true, words: [], slots: [], pvs: [] };
  showSection("free");
  renderBoard(Object.keys(DATA.pool.verbs), Object.keys(DATA.pool.particles), 1, () => 0);
  $("slotstag").textContent = tx("freeTag");
  hintEl.innerHTML = tx(canHover ? "freeHow" : "freeHowTouch");
  freeOpen = ""; fmadeEl.innerHTML = "";
  // The collection's list is built when its modal opens (renderFound); here only the header's count.
  updateBadges(true); $("collcount").textContent = getFound().length; renderTools(); updateProgress();
  stage.classList.remove("out"); stage.classList.add("rise");
  setTimeout(() => stage.classList.remove("rise"), 1400);
}
// Badges = phrasal verbs still to find with each word. A word with none left leaves the board (at once when the board
// is built; otherwise it shrinks away). Returns the words that just left.
function updateBadges(initial) {
  const f = new Set(getFound()), left = [];
  G.r.words.forEach(W => {
    const n = wordForms(W.w, W.side).filter(x => !f.has(x)).length;
    setMore(W, n);
    if (n || W.gone) return;
    W.gone = true; W.home.classList.add("gone"); left.push(W);
    if (initial || reduceMotion) W.home.classList.add("out");
    else setTimeout(() => W.home.classList.add("out"), 380);
  });
  return left;
}
// The score tile counts phrasal verbs found; the bar shows them out of every phrasal verb (any level).
function freeProgress() {
  const f = getFound(), here = Object.keys(FFORMS), got = here.filter(x => f.includes(x)).length;
  scEl.textContent = f.length; bestEl.textContent = tx("found");
  $("proglbl").textContent = tx("progFree", { n: got, m: here.length });
  $("pfill").style.width = (here.length ? got / here.length * 100 : 0) + "%";
  $("steps").hidden = true;
}

/* ---------- The message line ---------- */
// Phones (the slot card is pinned to the bottom): in free play the message line sits in that card, under its tag.
const hintHome = [hintEl.parentNode, hintEl.nextSibling], narrow = matchMedia("(max-width: 760px)");
let hintFree = false;
function placeHint(free) {
  if (free != null) hintFree = free;
  const inCard = hintFree && narrow.matches;
  if (inCard && hintEl.parentNode !== $("center")) $("slotstag").after(hintEl);
  if (!inCard && hintEl.parentNode !== hintHome[0]) hintHome[0].insertBefore(hintEl, hintHome[1]);
  hintEl.classList.toggle("incard", inCard);
}
narrow.addEventListener("change", () => placeHint());
// The shorter box's words ride down with the page (sticky, 10-game.css): under the dock, or higher when they don't fit
// above the bottom card (phones), so their last row stays in view.
function fitStick() {
  if (G.mode !== "free") return;
  const top = document.querySelector(".dock").getBoundingClientRect().bottom + 14, room = innerHeight - (narrow.matches ? $("ccol").offsetHeight + 8 : 0) - 12;
  [$("vwords"), $("pwords")].forEach(el => { el.style.top = Math.round(Math.min(top, room - el.offsetHeight)) + "px"; });
}
if (window.ResizeObserver) { const ro = new ResizeObserver(() => fitStick()); [$("ccol"), $("vwords"), $("pwords")].forEach(e => ro.observe(e)); }
addEventListener("resize", fitStick); addEventListener("scroll", fitStick, { passive: true });

/* ---------- Checking a pair ---------- */
// The meaning that names a pair on screen: a two-word one when the pair has one (give up, not give up on), so a
// pair whose only meanings have a third word shows it (look forward to).
const pairSense = c => FBY[c].find(x => !x.tail) || FBY[c][0];
function freeCheck(S) {
  const c = comboOf(S.v.w, S.p.w), pv = FBY[c] ? pvOf(pairSense(c)) : pvHTML(S.v.w, S.p.w);
  if (G.phase !== "free") return;
  if (FBY[c]) {
    const from = S.el.getBoundingClientRect(), forms = fformsOf(c);
    S.busy = false; ["v", "p"].forEach(side => { const W = S[side]; S[side] = null; W.pend = 0; W.el.classList.remove("pending"); (side === "v" ? S.hv : S.hp).innerHTML = ""; (side === "v" ? S.hv : S.hp).classList.remove("filled"); });
    hideLast();
    // One form: it's made. More (get around / get around to): the third word decides which; the board waits.
    if (forms.length === 1) return collectForm(c, forms[0], from);
    G.r.tail = { c, forms, from, box: tailBox(c, forms, freePickTail) };
    return;
  }
  if (ALSO.has(c)) { hintEl.innerHTML = tx("freeAlso", { pv }); sndMeh(); flash(S.el, "meh"); return setTimeout(() => returnBoth(S), 700); }
  comboReset(); hintEl.innerHTML = tx("freeWrong", { pv }); sndBack(); flash(S.el, "shake");
  setTimeout(() => returnBoth(S), 500);
}
// A third word picked: a form of the pair is made (any of them), else try again (no cost in free play).
function freePickTail(b) {
  const T = G.r.tail, t = b.dataset.t; if (!T) return;
  if (!T.forms.includes(t)) {
    b.disabled = true; b.classList.add("off"); flash(b, "shake"); sndBack();
    hintEl.innerHTML = tx("tailWrong", { pv: pvHTML(...T.c.split(" "), t) });
    return;
  }
  G.r.tail = null; T.box.classList.add("gone"); setTimeout(() => T.box.remove(), reduceMotion ? 0 : 260);
  collectForm(T.c, t, T.from); setActive(0);
}
// Form c + t made: into the collection (newest first), its bubble floats up, the badges count down.
function collectForm(c, t, from) {
  const f = c + (t ? " " + t : ""), s = formSenses(f)[0], found = getFound(), isNew = !found.includes(f);
  store("phv-found", JSON.stringify([f, ...found.filter(x => x !== f)]));
  hintEl.innerHTML = tx(isNew ? "freeNew" : "freeAgain", { pv: pvOf(s), m: esc(trOf(s).m || s.def), lv: formLevel(f) });
  if (isNew) { sndOk(comboUp()); tickDay(); } else sndHint();
  freeOpen = f; $("collcount").textContent = getFound().length;
  if (collModal.classList.contains("show")) renderFound();
  freeProgress();
  const out = updateBadges();
  if (out.length) hintEl.innerHTML += "<br>" + tx("freeWordDone", { w: out.map(W => "<b>" + esc(W.w) + "</b>").join(" · ") });
  addBubble(c, t, from, isNew); sayMade(s);

}

// Under the bubbles, for the bubble tapped (again: it closes): every meaning of that form (f = "get away with"), with
// an example (phones: the first line).
function showLast(f) {
  const el = $("flast"), close = !el.hidden && el.dataset.f === f, c = f.split(" ").slice(0, 2).join(" ");
  fmadeEl.querySelectorAll(".fpv").forEach(b => b.classList.toggle("sel", !close && b.dataset.f === f));
  el.dataset.f = close ? "" : f;
  if (close) return popOut(el);
  clearTimeout(el._t); el.classList.remove("out"); el.hidden = false;
  el.innerHTML = FBY[c].filter(s => fullOf(s) === f).sort((a, b) => lvIdx(a.lv) - lvIdx(b.lv)).map(s => senseHTML(s, { level: true, ex: true })).join("");
  flash(el, "in");
}
// Close the card with a little shrink (at once with reduced motion).
function popOut(el) {

  el._t = setTimeout(() => { el.classList.remove("out"); el.hidden = true; }, 220);

function hideLast() { $("flast").dataset.f = ""; popOut($("flast")); fmadeEl.querySelectorAll(".sel").forEach(b => b.classList.remove("sel")); }
// The buttons above the slot box stay on one row: words go (c1, then c2) until they fit.
function fitTools() {

  if (!fits()) { toolsEl.classList.add("c1"); if (!fits()) toolsEl.classList.add("c2"); }

}
if (window.ResizeObserver) new ResizeObserver(() => fitTools()).observe($("ccol"));

/* ---------- The bubbles under the slot ---------- */
// The phrasal verb just made flies from the slot to the front; the others slide along (down a little as rows fill).
// Made again: its bubble moves back to the front. One bubble per form: t = its third word ("" = none).
function addBubble(c, t, from, isNew) {
  const old = [...fmadeEl.children], before = new Map(old.map(e => [e, e.getBoundingClientRect()])), f = c + (t ? " " + t : "");
  let b = old.find(e => e.dataset.f === f);
  if (!b) {
    const s = FBY[c].find(x => (x.tail || "") === t);
    b = document.createElement("button");
    b.type = "button"; b.className = "b w pv fpv"; b.dataset.f = f; b.dataset.say = sayOf(s); b.innerHTML = pvOf(s);
    b.setAttribute("aria-label", f + ": " + (trOf(s).m || ""));
    b.style.cssText = "--dur:" + (4.2 + Math.random() * 1.8).toFixed(2) + "s;--dl:-" + (Math.random() * 3).toFixed(2) + "s;--bx:" + (Math.random() * 3 - 1.5).toFixed(1) + "px;--by:-" + (2 + Math.random() * 2).toFixed(1) + "px";   // drift halved 2026-11-22
  }
  fmadeEl.prepend(b); fitCloud(); fmadeEl.scrollTop = 0;
  if (reduceMotion) return;
  old.forEach(e => {
    if (e === b) return;
    const a = before.get(e), n = e.getBoundingClientRect();
    if (Math.abs(a.left - n.left) > 1 || Math.abs(a.top - n.top) > 1)
      e.animate([{ transform: "translate(" + (a.left - n.left) + "px," + (a.top - n.top) + "px)" }, { transform: "none" }], { duration: 450, easing: "cubic-bezier(.25,.9,.3,1.1)" });
  });
  // From the slot's centre at its own size (the slot's rect made it start about 3 times as big: a giant flash)
  let st = before.get(b) && !isNew ? before.get(b) : from;
  if (st === from && from) { const r = b.getBoundingClientRect(); st = { left: from.left + (from.width - r.width) / 2, top: from.top + (from.height - r.height) / 2, width: r.width }; }
  flyFrom(b, st, 520);
  setTimeout(() => flash(b, isNew ? "newpv" : "glow"), 480);
}
// The cloud scrolls (with faded edges) only once it is taller than its room; until then nothing clips the bubbles.
function fitCloud() {

  fmadeEl.classList.toggle("scrolls", fmadeEl.scrollHeight > parseFloat(getComputedStyle(fmadeEl).maxHeight));
}
if (window.ResizeObserver) new ResizeObserver(() => fitCloud()).observe(fmadeEl);
fmadeEl.addEventListener("click", e => {

});
// Start over (the "new game" tile in free play, 22-modes.js): the bubbles go; the collection stays.
function freeRestart() {

  hintEl.innerHTML = tx(canHover ? "freeHow" : "freeHowTouch"); sndBack();
}

/* ---------- The collection ---------- */
// fresh = the phrasal verb just made (it opens, so its meaning shows at once).
function renderFound(fresh) {
  const f = getFound();
  if (fresh) freeOpen = fresh;
  $("fcount").textContent = tx("foundOf", { n: f.length, m: Object.keys(FFORMS).length });
  $("collcount").textContent = f.length; fitTools();
  $("fmeters").innerHTML = LEVELS.map(l => {

  }).join("");
  $("fempty").hidden = f.length > 0; $("collclear").hidden = !f.length;
  flistEl.innerHTML = f.map(c => {
    const ss = formSenses(c).sort((a, b) => lvIdx(a.lv) - lvIdx(b.lv)), open = c === freeOpen;
    return '<li class="fitem' + (open ? " open" : "") + '" data-c="' + esc(c) + '"><button type="button" class="fhead" aria-expanded="' + open + '"><b class="pvpill">' + pvOf(ss[0]) + "</b>" +
      '<span class="lvchip" style="' + lvStyle(ss[0].lv) + '">' + esc(ss[0].lv) + '</span><span class="fm" lang="' + esc(curLang) + '">' + esc(ss.map(s => trOf(s).m).filter(Boolean).join(" · ")) + '</span><span class="chev" aria-hidden="true"></span></button>' +
      '<div class="fbody"' + (open ? "" : " hidden") + ">" + ss.map(s => '<div class="frow">' + senseHTML(s, { level: ss.length > 1, ex: true, pill: false, tr: ss.length > 1 }) + revBtn(s) + favBtn(s.id) + "</div>").join("") + "</div></li>";
  }).join("");
}
flistEl.addEventListener("click", e => {

  freeOpen = open ? "" : c;
  if (!open) { li.classList.add("open"); li.querySelector(".fbody").hidden = false; h.setAttribute("aria-expanded", "true"); speak(sayOf(formSenses(c)[0]), h.querySelector(".pvpill")); }
  else sndBack();
});
// The collection modal: the latest find (or the one last opened) open at the top.
function closeColl() { collModal.classList.remove("show"); $("collbtn").focus({ preventScroll: true }); }
$("collbtn").addEventListener("click", () => {

$("collclear").addEventListener("click", e => {
  const b = e.currentTarget;
  if (!b.classList.contains("sure")) { b.classList.add("sure"); b.textContent = tx("resetSure"); setTimeout(() => { b.classList.remove("sure"); b.textContent = tx("clearColl"); }, 3500); return; }
  b.classList.remove("sure"); b.textContent = tx("clearColl");

});
collModal.addEventListener("click", e => { if (e.target === collModal || e.target.closest("[data-close]")) closeColl(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && collModal.classList.contains("show")) closeColl(); });
backLayer(collModal, () => collModal.classList.contains("show"), closeColl);   // the back gesture closes it (07-back.js)

/* ---------- Hint and the Particle guide ---------- */
// A phrasal verb not found yet (the chosen level's first): its verb and particle light up. Free of charge.
function freeHint() {
  if (G.r.tail) return tailHint();
  const f = new Set(getFound()), L = lvIdx(G.level), S = G.r.slots[0], one = S && !S.busy && (S.v ? !S.p : !!S.p) ? S.v || S.p : null;
  if (one && hintWith(one, f, L)) return;
  const left = Object.keys(FFORMS).filter(x => !f.has(x)), mine = left.filter(x => lvIdx(formLevel(x)) <= L);
  const x = pick(mine.length ? mine : left);
  if (!x) { hintEl.innerHTML = tx("freeAll"); return; }
  const [v, p] = FFORMS[x].split(" ");
  G.r.words.filter(W => (W.side === "v" && W.w === v) || (W.side === "p" && W.w === p)).forEach(W => { flash(W.el, "glow"); W.el.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" }); });
  hintEl.innerHTML = tx("hintPair"); sndHint();
}
// A word is in the slot: up to three words that make a phrasal verb still to find with it light up.
function hintWith(W, f, L) {
  const i = W.side === "v" ? 0 : 1, cs = wordForms(W.w, W.side).filter(x => !f.has(x));
  const mine = cs.filter(x => lvIdx(formLevel(x)) <= L), ws = new Set(shuffle(mine.length ? mine : cs).map(x => FFORMS[x].split(" ")[1 - i]).filter((w, k, a) => a.indexOf(w) === k).slice(0, 3));
  const els = G.r.words.filter(x => x.side !== W.side && !x.gone && ws.has(x.w));
  if (!els.length) return false;
  els.forEach((x, k) => { flash(x.el, "glow"); if (!k) x.el.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" }); });
  hintEl.innerHTML = tx("hintWith", { w: "<b>" + esc(W.w) + "</b>" }); sndHint();
  return true;
}
function guideHTML() {
  const f = new Set(getFound());
  return Object.keys(DATA.pool.particles).map(p => {
    const P = DATA.pool.particles[p], cs = wordForms(p, "p");
    return '<li class="plain"><div class="rs"><div class="gh"><b class="pvpill"><span class="pv-p">' + esc(p) + '</span></b><span class="gi">' + esc(P.idea || "") + '</span><span class="gt" lang="' + esc(curLang) + '">' + esc(P[curLang] || "") + "</span></div>" +
      '<div class="gx">' + cs.map(x => { const s = formSenses(x)[0]; return f.has(x) ? '<span class="pvchip" title="' + esc(trOf(s).m || "") + '">' + pvOf(s) + "</span>" : '<span class="pvchip unk" title="' + esc(tx("notFound")) + '"><span class="pv-v">?</span> <span class="pv-p">' + esc(p) + "</span>" + (s.tail ? ' <span class="pv-t">' + esc(s.tail) + "</span>" : "") + "</span>"; }).join("") + "</div></div></li>";
  }).join("");
}
$("guidebtn").addEventListener("click", () => {
  listMode = "guide";
  $("listtitle").textContent = tx("guideTitle"); $("listtabs").hidden = true; $("listprog").hidden = false;
  $("listprog").innerHTML = '<p class="lp-h">' + tx("guideHead") + "</p>";
  $("listbody").innerHTML = guideHTML(); $("listempty").hidden = true; $("listplay").hidden = true;
  listModal.classList.add("show"); setTimeout(() => listModal.querySelector(".favx").focus({ preventScroll: true }), 50);

/* 30-tour.js — guided tutorial (from Conditional Bubbles): a welcome card, then a spotlight glides from feature to
   feature with a card explaining each one. The steps are in src/data/tour.json: sel = CSS selector of the element to
   highlight (none, or hidden at the moment = a centred card), ex = the welcome card's sample phrasal verbs (verb,
   particle and, if the first meaning isn't the one meant, the meaning's id), demo = a sample sentence with its gap filled. The id keys the translation in
   i18n/<lang>.json "tour.steps"; the EN / <badge> toggle switches the card language. */
const TOUR = DATA.tour;
const TOUR_UI = { step: "Step {n} of {total}", back: "Back", next: "Next", play: "Let's play!", close: "Close the tutorial" };
const tourEl = $("tour"), spot = $("tour-spot"), tcard = $("tour-card"), tourBtn = $("tour-btn"), tlang = $("tour-lang");
let tourI = -1, tourTr = load("phv-tour-lang") === "tr";
// Translated tour text for the header language, or null when the card is in English.
function tourL() { return (tourTr && lang().tour) || null; }
function tourUI(k) { const T = tourL(); return (T && T.ui && T.ui[k]) || TOUR_UI[k]; }
// Welcome card: verb + particle = phrasal verb, with its meaning.
function tourExamples(ex) {
  return '<ul class="tour-ex">' + ex.map(([v, p, id]) => {
    const s = PV[id] || (BY[comboOf(v, p)] || [])[0];
    return '<li><span class="b w vw mini">' + esc(v) + '</span><i>+</i><span class="b w pw mini">' + esc(p) + '</span><i>=</i><b class="pvpill">' + pvHTML(v, p) + "</b>" +
      (s ? '<span class="tm" lang="' + esc(curLang) + '">' + esc(trOf(s).m || "") + "</span>" : "") + "</li>";
  }).join("") + "</ul>";
}
// Sentence card: a sentence with its gap filled, as it looks in the game ("{turn} the TV {off}": split).
function tourDemo(d) {
  const g = [];
  const html = esc(d.text).replace(/\{([^}]+)\}/g, (_, w) => { g.push(w); return "\0"; });
  let i = 0;
  return '<p class="tour-demo" lang="en">' + html.replace(/\0/g, () => { const w = g[i], cls = g.length > 1 ? (i ? "pv-p" : "pv-v") : ""; i++; return '<span class="b w pv in ok mini">' + (cls ? '<span class="' + cls + '">' + w + "</span>" : pvHTML(...w.split(" "))) + "</span>"; }) + "</p>";
}
// auto = the first visit's automatic opening: it doesn't count, so the button pulses on later visits until the player opens it.
function tourOpen(auto) {
  // Card language: the player's last choice, else the translation at levels with translated instructions (A2).
  if (!load("phv-tour-lang")) tourTr = nativeUi();
  closePlay();
  tourI = 0; tourEl.hidden = false; store("phv-tour", auto === true && load("phv-tour") !== "1" ? "auto" : "1"); if (auto !== true) tourBtn.classList.remove("fresh");
  $("tour-dots").innerHTML = TOUR.map(() => "<span></span>").join("");
  tlang.hidden = !lang().tour; tlang.lastChild.textContent = lang().badge || ""; tlang.lastChild.lang = curLang;
  // No glide until Next / Back (.glide in the CSS), so the first card pops in where it belongs instead of flying in.
  tourEl.classList.remove("glide");
  tourShow();
  $("tour-next").focus({ preventScroll: true });
}
function tourClose() { tourEl.hidden = true; tourI = -1; tourBtn.focus({ preventScroll: true }); }
// The element a step points at, if it is on screen now.
function tourTarget(st) { const t = st.sel && document.querySelector(st.sel); return t && t.getClientRects().length && getComputedStyle(t).visibility !== "hidden" ? t : null; }
// Fill the card for step tourI; anim = false when only the language changed.
function tourShow(anim = true) {
  const st = TOUR[tourI], T = tourL(), tt = (T && T.steps && T.steps[st.id]) || st, tgt = tourTarget(st);
  tcard.lang = T ? curLang : "en";
  tlang.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String((b.dataset.tl === "tr") === !!T)));
  $("tour-step").textContent = tourUI("step").replace("{n}", tourI + 1).replace("{total}", TOUR.length);
  $("tour-title").textContent = tt.t;
  $("tour-text").innerHTML = tt.x + (st.ex ? tourExamples(st.ex) : "") + (st.demo ? tourDemo(st.demo) : "");
  $("tour-back").hidden = tourI === 0; $("tour-back").textContent = tourUI("back");
  $("tour-next").textContent = tourUI(tourI === TOUR.length - 1 ? "play" : "next");
  $("tour-x").setAttribute("aria-label", tourUI("close"));
  [].forEach.call($("tour-dots").children, (d, i) => { d.className = i === tourI ? "on" : i < tourI ? "done" : ""; });
  if (anim) { tcard.classList.remove("in"); void tcard.offsetWidth; tcard.classList.add("in"); }
  if (tgt) tourReveal(tgt);
  tourPlace();
}
// Centred in the visible page (without the scrollbar). Called again whenever the card's size changes (ResizeObserver).
// Scroll (at once, so the card is placed from where the target ends up) until the target shows in full: below the
// sticky header, above the bottom edge. scrollIntoView("nearest") put targets near the top, such as the score and
// new-game tiles, right under the header on phones once an earlier step had scrolled down (from Word Family Bubbles).
// The header's own buttons always show.
function tourReveal(t) {
  const dock = document.querySelector(".dock");
  if (dock && dock.contains(t)) return;
  const stuck = dock && /sticky|fixed/.test(getComputedStyle(dock).position);
  const top = (stuck ? dock.getBoundingClientRect().bottom : 0) + 12, bottom = innerHeight - 12, r = t.getBoundingClientRect();
  const dy = r.top < top ? r.top - top : r.bottom > bottom ? Math.min(r.bottom - bottom, r.top - top) : 0;
  if (dy) scrollBy(0, dy);
}
function tourPlace() {
  if (tourI < 0) return;
  const tgt = tourTarget(TOUR[tourI]), vw = document.documentElement.clientWidth || innerWidth, vh = innerHeight, cw = tcard.offsetWidth, ch = tcard.offsetHeight, pad = 8;
  spot.classList.toggle("none", !tgt);
  if (!tgt) { Object.assign(spot.style, { left: vw / 2 + "px", top: vh / 2 + "px", width: "0px", height: "0px" }); Object.assign(tcard.style, { left: (vw - cw) / 2 + "px", top: Math.max(12, (vh - ch) / 2) + "px" }); return; }
  const r = tgt.getBoundingClientRect();
  Object.assign(spot.style, { left: r.left - pad + "px", top: r.top - pad + "px", width: r.width + pad * 2 + "px", height: r.height + pad * 2 + "px" });
  let top = r.bottom + pad + 14;
  if (top + ch > vh - 12) top = r.top - pad - 14 - ch;
  if (top < 12) top = Math.max(12, vh - ch - 12);
  const left = Math.min(Math.max(r.left + r.width / 2 - cw / 2, 12), vw - cw - 12);
  Object.assign(tcard.style, { left: left + "px", top: top + "px" });
}
function tourGo(d) { const n = tourI + d; if (n < 0) return; if (n >= TOUR.length) return tourClose(); tourI = n; tourEl.classList.add("glide"); tourShow(); tone(523.25 + d * 60, 0, .1, .03, 0, true); }
tourBtn.addEventListener("click", tourOpen);
$("tour-next").addEventListener("click", () => tourGo(1));
$("tour-back").addEventListener("click", () => tourGo(-1));
$("tour-x").addEventListener("click", tourClose);
tlang.addEventListener("click", e => {
  const b = e.target.closest("button[data-tl]"); if (!b) return;
  tourTr = b.dataset.tl === "tr"; store("phv-tour-lang", b.dataset.tl); tourShow(false);
});
document.addEventListener("keydown", e => {
  if (tourEl.hidden) return;
  if (e.key === "Escape") tourClose(); else if (e.key === "ArrowRight") tourGo(1); else if (e.key === "ArrowLeft") tourGo(-1); else return;
  e.preventDefault();
});
window.addEventListener("resize", tourPlace);
if (window.ResizeObserver) new ResizeObserver(() => tourPlace()).observe(tcard);
if (load("phv-tour") === "auto") tourBtn.classList.add("fresh");   // it only opened by itself so far: pulse until the player opens it
backLayer(tourEl, () => !tourEl.hidden, tourClose);   // the back gesture closes it (07-back.js)

/* 99-main.js — boot: restore the saved level and start a normal game (always, even after free play). */
(function boot() {
  let l = load("phv-level");
  if (!DATA.levels[l]) l = LEVELS[0];
  setLevelUI(l);
  newGame(l);
  // First visit: the tutorial starts with its welcome card.
  if (!load("phv-tour")) setTimeout(function () { tourOpen(true); }, 700);
})();

  // a simple house (2026-11-22, the user: "more reminiscent of home"; it was four little bubbles)
  a.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<path d="M3.5 11.2 12 4l8.5 7.2"/><path d="M6 9.4V19a1 1 0 0 0 1 1h3.6v-5.2h2.8V20H17a1 1 0 0 0 1-1V9.4"/></svg><span>Games</span>';
  // Back to the menu: if we came from it, go back (so the phone's back button doesn't return here); else open it.
  a.addEventListener("click", function (e) {
    e.preventDefault();
    var from = null;
    try { from = sessionStorage.getItem("eb-from-menu"); sessionStorage.removeItem("eb-from-menu"); } catch (x) {}
    var back = from === "phrasal-verbs" && history.length > 1;
    try { sessionStorage.setItem("eb-back", "1"); } catch (x) {}         // the menu skips its entrance animation
    document.documentElement.classList.add("eb-leaving");
    var go = function () { if (back) history.back(); else location.href = MENU; };
    // The menu's "open a game" pop + chime, played through the game's own tone() (so the game's volume and mute
    // apply); then leave once it has been heard.
    if (typeof tone === "function") {
      try { tone(900, 0, .07, .11, 420); tone(783.99, .03, .22, .1, 0, true); tone(1174.66, .07, .3, .07, 0, true); } catch (x) {}
      setTimeout(go, 240);
    } else go();
  });
  // In the game's header (the "dock"). The header must never get an extra row because of this button (phones: at
  // most two rows, the user's rule, 2026-11-17). So every place is tried, in order of preference: before the level
  // pills, right after them, then before / after each control, then inside a group of buttons (Verb Wheel's
  // .tools); the place that gives the shortest header wins (the first one on a tie). If every place still adds a
  // row, "tight" mode narrows the gaps between the header's controls and the button a little, and tries again.
  var dock = document.querySelector("header.dock, .dock");
  var tightened = [];
  function height() { return dock.getBoundingClientRect().height; }
  function spots() {
    var out = [], kids = [], i, c, lv = dock.querySelector(":scope > #levelseg");
    for (i = 0; i < dock.children.length; i++) if (dock.children[i] !== a) kids.push(dock.children[i]);
    if (lv) { out.push([dock, lv]); out.push([dock, lv.nextElementSibling === a ? a.nextElementSibling : lv.nextElementSibling]); }
    for (i = 0; i < kids.length; i++) out.push([dock, kids[i]]);
    out.push([dock, null]);
    for (i = 0; i < kids.length; i++) {
      c = kids[i];
      if (/\b(seg|swwrap|volwrap|lang|sw)\b/.test(c.className) || c.getAttribute("role") === "group") continue;
      var d = getComputedStyle(c).display;
      if ((d === "flex" || d === "inline-flex") && c.querySelectorAll(":scope > button").length >= 2) {
        out.push([c, c.firstElementChild]); out.push([c, null]);
      }
    }
    return out;
  }
  function best() {
    var s = spots(), win = null, h = Infinity, i, hi;
    for (i = 0; i < s.length; i++) {
      if (s[i][1] === a) continue;
      s[i][0].insertBefore(a, s[i][1]);
      hi = height();
      if (hi < h - 2) { h = hi; win = s[i]; }
    }
    win[0].insertBefore(a, win[1]);
    return h;
  }
  function tight(on) {
    tightened.forEach(function (el) { el.classList.remove("eb-tight"); });
    tightened = on ? [dock, a, a.parentNode] : [];
    tightened.forEach(function (el) { el.classList.add("eb-tight"); });
  }
  function place() {
    tight(false);
    var at = a.parentNode ? [a.parentNode, a.nextSibling] : null;
    if (a.parentNode) a.parentNode.removeChild(a);
    var base = height();                                     // the header as the game made it
    if (at) at[0].insertBefore(a, at[1]); else dock.appendChild(a);
    if (best() <= base + 4) return;
    tight(true);
    if (best() <= base + 4) return;
    tight(false); best();                                    // nothing helps: keep the normal look
  }
  if (dock) {
    // the slide-in has ended: the header gets its frosted blur back
    dock.addEventListener("animationend", function (e) { if (e.animationName === "eb-dock-in") document.documentElement.classList.remove("eb-arrive"); });
    setTimeout(function () { document.documentElement.classList.remove("eb-arrive"); }, 1500);   // in case it never ran
    place();
    var t = 0;
    window.addEventListener("resize", function () { clearTimeout(t); t = setTimeout(place, 150); });
    window.addEventListener("load", place);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
  } else { a.classList.add("eb-float"); document.body.appendChild(a); }

  // back here with the phone's Forward (or from the page cache): undo the fade
  window.addEventListener("pageshow", function () { document.documentElement.classList.remove("eb-leaving"); });

  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(function () {});
  }
})();
</script>
