/* Key words in the Sentence step: dotted underline, translation on hover / tap (18-gloss.js) */
.kw { text-decoration: underline dotted hsla(45,90%,60%,.85); text-decoration-thickness: 2px; text-underline-offset: .22em; cursor: help; border-radius: .25em; }
.kw:hover, .kw:focus-visible { background: hsla(45,100%,65%,.18); outline: none; }

/* 20-match.css — the Match step (from Question Bubbles): two columns (phrasal verbs, meanings) of floating bubbles,
   drag / hot / selected / hinted / shake / done states. */
.mboard { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 0 clamp(14px, 4vw, 48px); width: 100%; max-width: 760px; margin: 0 auto; padding-top: 6px; }
.mcol { position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 10px; padding-top: 16px; min-width: 0; }
.mcol > .tag { top: 2px; }
.mcol.q { --h: 212; }
.mcol.a { --h: 328; }
.mslot { display: flex; }
.mcol.a .mslot { justify-content: flex-end; }
#stage .mboard.in .mslot { animation: rise .6s cubic-bezier(.2,.8,.3,1) backwards; animation-delay: var(--d, 0s); }
.b.mb { --h: 265; width: 100%; font-size: clamp(.95rem, .5vw + .8rem, 1.08rem); line-height: 1.25; padding: .52em .9em .56em; border-radius: 1.2em; text-align: center;
  cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; animation: bob var(--dur, 4s) ease-in-out var(--dl, 0s) infinite alternate; }
.b.mb.q { border: 3px solid hsla(var(--h),50%,calc(var(--rim-l) - 4%),.8); outline: 2px solid hsla(var(--h),55%,76%,.28); outline-offset: 2px; font-size: clamp(1rem, .6vw + .85rem, 1.15rem); }
.b.mb:hover { transform: translateY(-3px) scale(1.03); }
.b.mb.drag { position: fixed; z-index: 60; margin: 0; pointer-events: none; animation: none; transition: none; cursor: grabbing; transform: scale(1.06) rotate(-2deg);
  box-shadow: inset 0 0 22px hsla(var(--h),100%,var(--glow-l),.6), 0 18px 28px var(--shadow), 0 0 0 4px hsla(var(--h),90%,75%,.25); }
.b.mb.hot { transform: scale(1.06); border-color: hsla(var(--h),90%,60%,1); box-shadow: inset 0 0 22px hsla(var(--h),100%,var(--glow-l),.7), 0 0 0 5px hsla(var(--h),90%,70%,.35), 0 10px 20px var(--shadow); }
.b.mb.sel { transform: translateY(-3px) scale(1.04); border-color: var(--underline); box-shadow: inset 0 0 22px hsla(var(--h),100%,var(--glow-l),.6), 0 0 0 4px hsla(330,90%,70%,.45), 0 12px 22px var(--shadow); }
.b.mb.hinted { border-color: hsl(45,95%,55%); box-shadow: inset 0 0 22px hsla(45,100%,65%,.6), 0 0 0 5px hsla(45,95%,60%,.4), 0 10px 20px var(--shadow); }
.b.mb.shake { animation: shake .5s ease; border-color: hsla(350,85%,62%,.95); box-shadow: inset 0 0 20px hsla(350,95%,70%,.5), 0 8px 18px var(--shadow); }
.b.mb.done { cursor: default; animation: none; border-color: hsla(150,55%,52%,.9);
  box-shadow: inset 0 0 22px hsla(150,90%,var(--glow-l),.5), inset -6px -8px 18px hsla(220,100%,var(--glow-l),.3), 0 8px 18px var(--shadow), 0 0 0 3px hsla(150,90%,70%,.18); }
.b.mb.done.hinted-done { border-color: hsl(40,90%,55%); }
.b.mb.done:hover { transform: none; }
.b.mb.merge { animation: merge .55s cubic-bezier(.34,1.56,.64,1); }
@keyframes merge { 0% { transform: scale(.9); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
.mb .mq { display: block; }
/* A matched pair takes one line when it fits: "give up — desistir" */
.b.mb.done { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 0 .45em; }
.mb .ma { display: block; font-weight: 500; font-size: .86em; opacity: .85; }
.mb .ma::before { content: "— "; opacity: .6; }
.b.mb:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
@media (max-width: 600px) {
  .mboard { gap: 0 10px; }
  .mcol { gap: 8px; }
  .b.mb { font-size: .9rem; padding: .48em .6em .52em; border-radius: 1.1em; }
  .b.mb.q { border-width: 2.5px; }
}
@media (prefers-reduced-motion: reduce) { .b.mb, .b.mb.merge, #stage .mboard.in .mslot { animation: none !important; } }
/* After Match (from Vocabulary Practice): the matched bubbles line up in a row and glow gold one by one as they are read. */
.mboard.lineup { display: flex; justify-content: center; align-items: center; min-height: min(46vh, 360px); cursor: pointer; }
.mboard.lineup .mcol.a, .mboard.lineup .mcol > .tag { display: none; }
.mboard.lineup .mcol.q { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: center; gap: 14px; padding-top: 0; }
.mboard.lineup .b.mb { width: auto; transition: transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease, border-color .3s ease; }
.mboard.lineup .b.mb.done { cursor: pointer; }
.b.mb.reading { transform: scale(1.14); border-color: hsl(45,95%,58%);
  box-shadow: inset 0 0 24px hsla(45,100%,68%,.6), 0 0 0 5px hsla(45,95%,62%,.38), 0 12px 24px var(--shadow); }
@media (prefers-reduced-motion: reduce) { .mboard.lineup .b.mb { transition: none; } .b.mb.reading { transform: none; } }

/* 22-soap.css — every word bubble (.b.w: box words, slot halves, made phrasal verbs, third-word options, Sentence options,
   gap words, free play's bubbles, tutorial samples) and Match bubble (.b.mb) as a soap bubble (from Be Do Modal via
   Question Bubbles, 2026-11-22): almost clear, a faint film of colour inside and a 1.5px coloured rim, both turning once
   in 10 s. The colours stay fixed (the user's choice): verbs blue, particles pink, third words green, a phrasal verb blue
   to pink; the film only shimmers ±40° round its hue. Built from spans (SOAP + soapify in 19-shine.js) at z-index -1 in
   the bubble's own stacking context, so the text stays on top. The film and the rim turn by rotating a still conic
   gradient (.spin); what follows the mouse moves by transform / opacity only. Per-theme numbers are tokens in
   00-base.css (--soap-*, --spot-plus, --film-a, --srim-*, --sglow-*, --rimhi-*, --faceg-*). The border stays, clear. */
.b.w, .b.mb { --th: var(--h); --s1: var(--th); --s2: calc(var(--th) + 40); --s3: calc(var(--th) - 40);
  isolation: isolate; border-color: transparent; background: none;
  --ig: inset 0 0 12px hsla(var(--th), 95%, var(--sglow-l), var(--sglow-a));   /* the inner glow, drawn above the film by .film::after; states change it */
  box-shadow: 0 6px 14px var(--soap-sh); }
/* A phrasal verb: the film and rim run from the verb's blue to the particle's pink; its glow is the purple between */
.b.pv, .b.mb.q, .b.mb.done { --th: 265; --s1: 212; --s2: 270; --s3: 328; }
.b.w::before, .b.mb::before { content: none; }   /* the shine spot is the .spot span */
.b.w::after, .b.mb::after { background: none; }   /* ::after is only the hover strip (00-base.css) */
:is(.w, .mb) > :is(.film, .spot, .rim, .glint) { z-index: -1; cursor: inherit; }
:is(.w, .mb) .film { position: absolute; inset: -1.5px; border-radius: inherit; overflow: hidden; pointer-events: none; }
:is(.w, .mb) .film::before { content: ""; position: absolute; inset: 0; z-index: 1;
  background: radial-gradient(120% 120% at 30% 20%, rgba(255,255,255,var(--soap-hi)), rgba(255,255,255,var(--soap-lo)) 60%, transparent); }
:is(.w, .mb) .film::after { content: ""; position: absolute; inset: 1.5px; z-index: 3; border-radius: inherit; box-shadow: var(--ig); transition: box-shadow .25s ease; }
/* The turning colour of film and rim: a square wider than the bubble's diagonal, centred; rotating it = turning the
   conic gradient's start. Both start together, so their colours stay in step. Wide Match bubbles need a bigger one. */
:is(.w, .mb) .spin { position: absolute; left: 50%; top: 50%; width: calc(100% + 1.6em); aspect-ratio: 1; translate: -50% -50%; animation: spin 10s linear var(--dl, 0s) infinite; }
:is(.w, .mb) .film .spin { background: conic-gradient(from var(--ang), hsla(var(--s1), 95%, 76%, var(--film-a)) 0 30%, hsla(var(--s2), 95%, 80%, calc(var(--film-a) * .7)) 50%, hsla(var(--s3), 90%, 78%, calc(var(--film-a) * .85)) 72%, hsla(var(--s1), 95%, 76%, var(--film-a)) 92%); }
:is(.w, .mb) .rim .spin { background: conic-gradient(from var(--ang), hsla(var(--s1), 90%, var(--srim-l), var(--srim-a)) 0 30%, hsla(var(--s2), 90%, calc(var(--srim-l) + 4%), calc(var(--srim-a) * .7)) 50%, hsla(var(--s3), 85%, calc(var(--srim-l) + 2%), calc(var(--srim-a) * .85)) 72%, hsla(var(--s1), 90%, var(--srim-l), var(--srim-a)) 92%); }
@keyframes spin { to { transform: rotate(360deg); } }
/* What follows the mouse: 19-shine.js writes these wrappers' transform / opacity; the look is the <i> inside */
:is(.w, .mb) .fg > i, :is(.w, .mb) .rh > i, :is(.w, .mb) .spot i, :is(.w, .mb) .glint > i { position: absolute; inset: 0; }
:is(.w, .mb) .film .fg { position: absolute; left: -10%; top: -45%; width: 120%; height: 190%; z-index: 2; opacity: 0; will-change: transform, opacity; }
:is(.w, .mb) .fg > i { background: radial-gradient(closest-side, hsla(var(--th), 100%, var(--faceg-l), var(--faceg-a)), transparent); }
:is(.w, .mb) .spot { position: absolute; left: .5em; top: .42em; width: .62em; height: .5em; pointer-events: none; transform: rotate(-14deg); will-change: transform; }   /* one size and place (em), never stretched by a wide bubble */
:is(.w, .mb) .spot > i:first-child { background: radial-gradient(closest-side, rgba(255,255,255,var(--soap-gl)) 32%, rgba(255,255,255,calc(var(--soap-gl) * .55)) 62%, rgba(255,255,255,0)); }
:is(.w, .mb) .spot .pl { opacity: 0; }   /* brighter, wider core as the mouse nears */
:is(.w, .mb) .spot .pl i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--spot-plus) * .85)), rgba(255,255,255,var(--spot-plus)) 42%, rgba(255,255,255,calc(var(--spot-plus) * .55)) 52%, rgba(255,255,255,calc(var(--spot-plus) * .33)) 62%, rgba(255,255,255,calc(var(--spot-plus) * .12)) 81%, rgba(255,255,255,0)); }
/* the small second spot: a thin streak along the bottom-right curve; it moves the other way, a third as far */
:is(.w, .mb) .glint { position: absolute; right: calc(.47em - .17em); bottom: calc(.47em - .085em); width: .34em; height: .17em; pointer-events: none; opacity: .8; transform: rotate(-45deg); will-change: transform, opacity; }
:is(.w, .mb) .glint > i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--soap-gl) * .75)) 45%, rgba(255,255,255,0)); }
/* the rim: a ring (a mask cuts out its middle) over the clear border */
:is(.w, .mb) .rim { position: absolute; inset: -1.5px; border-radius: inherit; padding: 1.5px; pointer-events: none; overflow: hidden;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
:is(.w, .mb) .rim .rh { position: absolute; left: -5%; top: -40%; width: 110%; height: 180%; opacity: 0; will-change: transform, opacity; }   /* the side facing the mouse lights up */
:is(.w, .mb) .rh > i { background: radial-gradient(closest-side, hsla(var(--th), 100%, var(--rimhi-l), var(--rimhi-a)), transparent); }

/* States. Hover / focus / carried / picked glow more (picked: a pink ring); a word of the other box under a carried
   one (.hot) a ring of its colour; right / wrong / shown turn the rim green / red / yellow (hidden, not stopped, so
   the spans keep turning in step); a higher-level phrasal verb (.adv) keeps an amber ring. */
.b.w, .b.mb { --glow2: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); }
@media (hover: hover) {
  .b.w:hover:not(.drag):not(.ok):not(.shown):not(.bad), .b.mb:hover:not(.drag):not(.done) { border-color: transparent; --ig: var(--glow2); box-shadow: 0 12px 22px var(--soap-sh2); }
}
.b.w:focus-visible, .b.mb:focus-visible { border-color: transparent; --ig: var(--glow2); box-shadow: 0 12px 22px var(--soap-sh2); }
.b.w.sel, .b.mb.sel { border-color: transparent; --ig: var(--glow2); box-shadow: 0 12px 22px var(--soap-sh2), 0 0 0 4px hsla(330,90%,70%,.45); }
.b.w.drag { border-color: transparent; --ig: var(--glow2); box-shadow: 0 18px 30px var(--soap-sh2), 0 0 0 4px hsla(var(--th),90%,72%,.2); }
.b.mb.drag { border-color: transparent; --ig: var(--glow2); box-shadow: 0 18px 28px var(--soap-sh2), 0 0 0 4px hsla(var(--th),90%,75%,.25); }
.box .b.w.hot, .b.mb.hot { border-color: transparent; --ig: inset 0 0 18px hsla(var(--th), 100%, var(--sglow-l), calc(var(--sglow-a) + .2)); box-shadow: 0 10px 20px var(--soap-sh2), 0 0 0 5px hsla(var(--th),90%,70%,.32); }
.b.w.ok, .b.mb.done { border-color: transparent; --ig: inset 0 0 16px hsla(150, 80%, 60%, .42); box-shadow: 0 6px 14px var(--soap-sh); }
.b.mb.done { box-shadow: 0 6px 14px var(--soap-sh), 0 0 0 3px hsla(150,90%,70%,.16); }
.b.w.bad, .b.mb.shake { border-color: transparent; --ig: inset 0 0 16px hsla(350, 90%, 68%, .45); box-shadow: 0 6px 14px var(--soap-sh), 0 0 0 4px hsla(350,85%,65%,.16); }
.b.w.shown, .b.pv.shown, .b.mb.hinted, .b.mb.done.hinted-done { border-color: transparent; --ig: inset 0 0 16px hsla(45, 95%, 60%, .45); box-shadow: 0 6px 14px var(--soap-sh); }
.b.mb.hinted { box-shadow: 0 6px 14px var(--soap-sh), 0 0 0 5px hsla(45,95%,60%,.3); }
.b.w.made-pv.adv { border-color: transparent; box-shadow: 0 6px 14px var(--soap-sh), 0 0 0 3px hsla(45,95%,60%,.4); }
.b.mb.reading { border-color: transparent; --ig: inset 0 0 20px hsla(45, 100%, 64%, .55); box-shadow: 0 12px 24px var(--soap-sh2), 0 0 0 5px hsla(45,95%,62%,.38); }
.board.free .b.w.fpv.sel { box-shadow: 0 6px 14px var(--soap-sh), 0 0 0 3px hsla(265,80%,70%,.7); }
:is(.w.ok, .w.bad, .w.shown, .mb.done, .mb.shake, .mb.hinted, .mb.reading) .rim i { visibility: hidden; }
.w.ok .rim, .mb.done .rim { background: hsla(150, 60%, 48%, .85); }
.mb.done .rim { padding: 2px; }   /* a matched pair: a fuller rim */
.w.bad .rim, .mb.shake .rim { background: hsla(350, 80%, 60%, .85); }
.w.shown .rim, .mb.hinted .rim, .mb.done.hinted-done .rim, .mb.reading .rim { background: hsla(40, 90%, 55%, .9); }
.b.mb.q { border-width: 1.5px; outline: 0; }   /* the phrasal verb side: told apart by its blue-to-pink rim now */

/* Bob and film pause while hovered (no edge jitter); off screen (#stage.still), while a bubble is carried
   (body.carrying) or while the reveal card opens or closes (body.calm, 19-shine.js); the films also while the page scrolls (body.scrolling) */
@media (hover: hover) { .box .w:hover, .b.w.fpv:hover, .b.mb:hover { animation-play-state: paused; } }
#stage.still :is(.w, .mb, .spin), body.carrying :is(.box .w, .fpv, .mb:not(.shake), .spin), body.calm :is(.box .w, .fpv, .mb, .spin), body.scrolling .spin { animation-play-state: paused !important; }
/* Free play (up to ~100 bubbles) lagged: there the films don't turn and the shine spans are plain, unlayered
   (no will-change; 19-shine.js doesn't move them). The soap look itself stays. */
body.free :is(.w, .mb) .spin { animation: none; }
body.free :is(.w, .mb) :is(.fg, .spot, .glint, .rh) { will-change: auto; }
/* Touch screens: the film doesn't turn (each bubble keeps its own --ang); the bob stays */
@media (hover: none) { :is(.w, .mb) .spin { animation: none; } }
@media (prefers-reduced-motion: reduce) { :is(.w, .mb) .spin { animation: none; } }

/* 23-sky.css — from Be Do Modal's revamp (2026-11-22, via Conditional Bubbles): the background bubbles, the custom
   colour picker, no page scroll behind a window. */
/* Background bubbles drifting up behind everything (made in 08-sky.js). lvh, not vh: Android's address bar would make
   them jump. Only transform / opacity animate; paused while a bubble is carried or the reveal card opens. */
.sky { position: fixed; top: 0; left: 0; right: 0; height: 100vh; height: 100lvh; z-index: -1; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; }
.sky.in { opacity: var(--sky-o); }
.sky span {
  position: absolute; bottom: -120px; border-radius: 50%;
  border: 1.5px solid hsla(var(--h), 80%, var(--sky-rim-l), var(--sky-rim-a));
  background: radial-gradient(circle at 30% 26%, rgba(255,255,255,var(--sky-hi)), hsla(var(--h), 90%, 78%, var(--sky-tint-a)) 50%, hsla(var(--h), 90%, 72%, calc(var(--sky-tint-a) * .8)) 70%, transparent 71%);
  box-shadow: inset 0 0 14px hsla(var(--h), 95%, var(--sky-glow-l), var(--sky-glow-a));
  filter: blur(2px);
  animation: skydrift var(--t, 30s) linear infinite; animation-delay: var(--d, 0s);
  opacity: 0;
}
body.carrying .sky span, body.calm .sky span { animation-play-state: paused; }
@keyframes skydrift {
  0% { transform: translate3d(0, 0, 0); opacity: 0; }
  8% { opacity: .6; }
  50% { transform: translate3d(var(--x, 20px), -60vh, 0); transform: translate3d(var(--x, 20px), -60lvh, 0); }
  92% { opacity: .45; }
  100% { transform: translate3d(0, -125vh, 0); transform: translate3d(0, -125lvh, 0); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .sky { display: none; } }

/* The custom colour picker (01-theme.js): a full-width row under the swatches while picking. Tracks are pills of their
   own gradient, the handle a white disc ringed in the colour being made. contain: it never widens the pop-over. */
.cpick { contain: inline-size; min-width: 0; display: none; flex: 1 0 100%;
  flex-direction: column; gap: 12px; padding: 12px 0 4px; margin-top: 4px; border-top: 1px solid var(--dock-line); }
.swwrap.open.picking .cpick { display: flex; }
.cpick { --cp-h: 220; --cp-s: 100%; --cp-l: 74%; --cp-c: hsl(var(--cp-h), var(--cp-s), var(--cp-l)); }
.cp-top { display: flex; align-items: center; gap: 10px; }
.cp-hex { flex: 1; min-width: 0; font-family: inherit; font-size: .95rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: transparent;
  border: 1px solid var(--dock-line); border-radius: 999px; padding: .45em .9em; outline: none; }
.cp-hex:focus-visible { border-color: var(--underline); box-shadow: 0 0 0 3px hsla(335,80%,65%,.2); }
.cp-r { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 14px; margin: 4px 0; border-radius: 999px; cursor: pointer;
  background: var(--cp-track); box-shadow: inset 0 0 0 1px var(--dock-line); outline: none; touch-action: none; }
.cp-h { --cp-track: linear-gradient(90deg, hsl(0,85%,62%), hsl(60,85%,62%), hsl(120,85%,62%), hsl(180,85%,62%), hsl(240,85%,62%), hsl(300,85%,62%), hsl(359,85%,62%)); }
.cp-s { --cp-track: linear-gradient(90deg, hsl(var(--cp-h), 0%, var(--cp-l)), hsl(var(--cp-h), 100%, var(--cp-l))); }
.cp-l { --cp-track: linear-gradient(90deg, hsl(var(--cp-h), var(--cp-s), 8%), hsl(var(--cp-h), var(--cp-s), 50%), hsl(var(--cp-h), var(--cp-s), 92%)); }
.cp-r::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 4px solid var(--cp-c); box-shadow: 0 2px 6px var(--shadow); transition: transform .2s cubic-bezier(.34,1.56,.64,1); }
.cp-r::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 4px solid var(--cp-c); box-shadow: 0 2px 6px var(--shadow); }
.cp-r::-moz-range-track { background: transparent; }
.cp-r:hover::-webkit-slider-thumb, .cp-r:active::-webkit-slider-thumb { transform: scale(1.15); }
.cp-r:focus-visible { box-shadow: inset 0 0 0 1px var(--dock-line), 0 0 0 3px hsla(335,80%,65%,.25); }

/* While a window (Favorites, Seen, Guide, end card) or the tutorial is open, the page behind doesn't scroll; only the
   window's card does. Scripts can still scroll the page (the tutorial moves it to what it points at). */
html:has(.favmodal.show), html:has(.tour:not([hidden])) { overflow: hidden; overscroll-behavior: none; }

/* 30-end.css — end-of-game modal, favourite star and the Favorites / Seen list modal (from Conditional Bubbles). */
.pend { text-align: center; padding: 6px 0 4px; }
.pend b { display: block; font-size: 2.2rem; }
.stars { font-size: 2.2rem; letter-spacing: .12em; color: #f5a300; line-height: 1; }
.stars span { display: inline-block; animation: starin .5s cubic-bezier(.34,1.56,.64,1) backwards; }
.stars span:nth-child(2) { animation-delay: .12s; }
.stars span:nth-child(3) { animation-delay: .24s; }
.stars .off { opacity: .22; }
@keyframes starin { from { opacity: 0; transform: scale(.3) rotate(-60deg); } }
.fams { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 12px 0 4px; }
.endbtns { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 14px 0; }
.rlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.rlist li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 18px; border: 2px solid hsla(150,60%,50%,.55); background: hsla(150,70%,60%,.1); }
.rlist li.miss { border-color: hsla(350,75%,60%,.55); background: hsla(350,85%,70%,.1); }
.rlist .ri { flex: none; width: 1.2em; text-align: center; font-size: 1.1rem; }
.rlist .rs { flex: 1; min-width: 0; line-height: 1.35; }
.rlist .rt { font-size: .86rem; opacity: .78; margin-top: 3px; }
.rlist .rp { flex: none; font-weight: 600; opacity: .8; }
@media (prefers-reduced-motion: reduce) { .stars span { animation: none; } }
.hbtns { display: inline-flex; gap: inherit; flex: none; }
.favstar { appearance: none; border: 0; background: transparent; cursor: pointer; padding: .3em; line-height: 0; border-radius: 50%;
  color: var(--ink); opacity: .55; transition: transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s ease, color .2s ease; }
.favstar svg { display: block; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; }
.favstar:hover { opacity: .9; transform: scale(1.12); }
.favstar.on { color: #f5a300; opacity: 1; }
.favstar.on svg { fill: currentColor; }
/* Favoriting (as in Simple Past / Be Do Modal): the star and the header Favorites button wobble; gold sparks (.pf.top)
   fly above the modals, so a star in the lists or on the end card bursts in front of it. */
.favstar.pop, #favbtn.pop { animation: starpop .45s cubic-bezier(.34,1.56,.64,1); }
@keyframes starpop { 0% { transform: scale(1); } 35% { transform: scale(1.45) rotate(-12deg); } 100% { transform: scale(1); } }
.pf.top { z-index: 130; }
.favstar:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
/* On the translation card: bottom-right corner */
.reveal > .favstar { position: absolute; right: 12px; bottom: 12px; }
.listtabs { width: max-content; margin: 0 auto 12px; padding: 2px; border: 1px solid var(--dock-line); border-radius: 999px; flex-wrap: nowrap; }
.listtabs[hidden] { display: none; }
.rlist li.plain { border-color: var(--dock-line); background: transparent; }
.rlist .favstar { flex: none; align-self: flex-start; }   /* top-right corner, level with the Reverso + */
.rlist .chip { font-size: .6rem; padding: .28em .7em; margin-bottom: 4px; }
.listempty { text-align: center; opacity: .7; margin: 18px 0 8px; }
@media (prefers-reduced-motion: reduce) { .favstar.pop, #favbtn.pop { animation: none; } }
/* End list: each sentence of a round with its phrasal verb chip and star */
#endlist li { flex-direction: column; align-items: stretch; gap: 6px; }
.rhd { display: flex; align-items: center; gap: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--dock-line); }
.rhd .rn { flex: 1; font-weight: 600; font-size: .92rem; opacity: .85; }
.rsent { display: flex; align-items: center; gap: 6px; }
.rsent + .rsent { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--dock-line); }
.rsb { flex: 1; min-width: 0; }
.rsb .pvchip { display: inline-block; margin-bottom: 4px; }
#endlist .rsent .favstar { flex: none; align-self: center; margin: 0 -4px 0 0; }
/* Phrasal verbs in the lists: a row of chips (green / red), meanings with their example */
.rpvs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
.rlist .sense .sh .pvpill { font-size: 1rem; }
.rlist .favstar { margin-left: auto; }
/* Particle guide */
.gh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.gi { font-weight: 600; }
.gt { font-size: .86rem; opacity: .75; }
.gx { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
/* Reverso Context "+" beside a list row's star (from Idiom Practice): a round badge that opens to the left and down,
   over the row, into "more examples on Reverso.net" and its links (revBtn, 21-lists.js). */
.rvwrap { position: relative; flex: none; width: 32px; height: 32px; }
.more { position: absolute; top: 0; right: 0; z-index: 3; width: max-content; max-width: 32px; max-height: 32px; overflow: hidden; border-radius: 16px;
  border: 1px solid var(--dock-line); background: var(--bg-a); color: var(--ink); white-space: nowrap; font-size: .88rem; box-shadow: 0 2px 8px var(--shadow);
  transition: max-width .35s cubic-bezier(.34,1.2,.64,1), max-height .35s cubic-bezier(.34,1.2,.64,1), border-radius .35s; }
.more .mt { display: flex; flex-direction: row-reverse; align-items: center; height: 30px; }
.more .pl { flex: none; display: grid; place-items: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--underline); cursor: pointer; }
.more .tx { padding: 0 4px 0 14px; font-weight: 500; }
.more .mo { display: block; padding: .45em 14px; color: inherit; text-decoration: none; border-top: 1px solid var(--dock-line); }
.more .mo:hover, .more .mo:focus-visible { background: var(--dock-line); }
.more.open, .more:focus-within { max-width: min(300px, 78vw); max-height: 190px; border-radius: 18px; box-shadow: 0 8px 22px var(--shadow); }
@media (hover: hover) { .more:hover { max-width: min(300px, 78vw); max-height: 190px; border-radius: 18px; box-shadow: 0 8px 22px var(--shadow); } }
@media (prefers-reduced-motion: reduce) { .more { transition: none; } }

/* 40-modes.css — progress bar, round steps, combo badge, Play menu, quick question, mastery meters, free-play collection. */
.pbar { height: 6px; margin-top: 5px; border-radius: 999px; background: var(--dock-line); overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, hsl(315,85%,62%), hsl(275,80%,62%)); transition: width .4s ease; }
.days { margin-left: .45em; font-size: .8rem; font-weight: 600; }
/* Combo badge on the score tile */
.score { position: relative; }
.combo { position: absolute; top: -9px; right: -9px; padding: .22em .5em; border-radius: 999px; font-style: normal; font-size: .72rem; font-weight: 700; line-height: 1;
  color: #fff; background: linear-gradient(135deg, hsl(315,85%,62%), hsl(275,80%,62%)); box-shadow: 0 2px 8px var(--shadow); }
.combo[hidden] { display: none; }
.combo.tick { animation: tick .5s cubic-bezier(.34,1.56,.64,1); }
/* Play menu on the "new game" tile */
.playwrap { position: relative; justify-self: end; }
.playmenu { position: absolute; top: calc(100% + 8px); right: 0; z-index: 40; display: flex; flex-direction: column; gap: 2px; width: max-content; min-width: 210px; padding: 6px;
  border-radius: 20px; background: var(--bg-a); border: 1px solid var(--dock-line); box-shadow: 0 12px 30px var(--shadow); animation: cardin .22s cubic-bezier(.34,1.56,.64,1);
  -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4); }
.playmenu[hidden] { display: none; }
.playmenu button { appearance: none; border: 0; background: transparent; color: var(--ink); font: inherit; font-weight: 600; text-align: left; cursor: pointer;
  display: flex; flex-direction: column; gap: 1px; padding: .55em .9em; border-radius: 14px; }
.playmenu button small { font-weight: 400; font-size: .76rem; opacity: .7; }
.playmenu button:hover:not(:disabled), .playmenu button:focus-visible { background: var(--dock-line); outline: none; }
.playmenu button:disabled { opacity: .45; cursor: default; }
/* Quick question (replaces the stage for one step) */
#stage[hidden], .tools[hidden], .quiz[hidden] { display: none; }
.quiz { max-width: 640px; margin: 18px auto 0; padding: 18px; border-radius: 26px; text-align: center;
  background: var(--dock-bg); border: 1px solid var(--dock-line); box-shadow: 0 8px 22px var(--shadow);   /* the header's glass */
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); }
.quiz.in { animation: cardin .3s cubic-bezier(.34,1.56,.64,1); }
.qz-s { margin: 0 0 14px; font-size: clamp(1.15rem, 1vw + .9rem, 1.4rem); font-weight: 500; line-height: 1.35; text-wrap: balance; }
.qz-opts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.qz-opts .pbtn.ok { border-color: hsl(150,60%,48%); background: hsla(150,70%,60%,.18); }
.qz-opts .pbtn.bad { border-color: hsl(350,75%,60%); background: hsla(350,85%,70%,.15); }
.qz-opts .pbtn:disabled { cursor: default; }
.qz-opts .pbtn.ok:disabled, .qz-opts .pbtn.bad:disabled { opacity: 1; }
.qz-why { margin: 12px 0 0; font-size: .95rem; }
.quiz .rv-btns { margin-top: 14px; }   /* the Next button clear of the explanation (they touched; Word Family Bubbles' fix) */
.qz-plus { position: fixed; z-index: 60; transform: translate(-50%, -100%); font-weight: 700; font-size: 1.3rem; color: hsl(150,60%,45%); pointer-events: none; animation: qzplus .9s ease-out forwards; }
@keyframes qzplus { to { transform: translate(-50%, -260%); opacity: 0; } }
/* Mastery meters (Seen modal, end screen) */
.meter { display: grid; grid-template-columns: 2.4em 1fr auto; align-items: center; gap: 10px; font-size: .88rem; }
.meter .pbar { margin-top: 0; }
.meter span { font-variant-numeric: tabular-nums; opacity: .8; }
.listprog { display: flex; flex-direction: column; gap: 6px; margin: 0 0 14px; }
.listprog[hidden] { display: none; }
.lp-h { margin: 0; font-size: .8rem; opacity: .7; text-align: center; }
.listprog .fams { margin: 4px 0 0; }
.listfoot { display: flex; justify-content: center; margin-top: 12px; }
.listfoot .cta[hidden], .listfoot .pbtn[hidden] { display: none; }
.endprog { display: flex; flex-direction: column; gap: 4px; max-width: 320px; margin: 10px auto 0; text-align: center; }
@media (prefers-reduced-motion: reduce) { .combo.tick, .quiz.in, .qz-plus, .playmenu { animation: none; } }
/* The round's three steps (build, match, sentence) under the progress bar */
.steps { display: flex; justify-content: center; gap: 6px; margin-top: 6px; }
.steps i { width: 7px; height: 7px; border-radius: 99px; background: var(--dock-line); transition: width .3s ease, background-color .3s ease; }
.steps i.on { width: 20px; background: var(--underline); }
.steps i.done { background: var(--underline); opacity: .5; }
/* Quick question: the meaning, then "verb ___" */
.qz-m { margin: 0 0 6px; font-size: 1.1rem; font-weight: 600; }
.qz-gap { display: inline-block; min-width: 3.2em; height: 1.1em; padding-bottom: 5px; vertical-align: baseline; border-bottom: 3px dotted var(--underline); }
.qz-opts .pbtn { font-size: 1.05rem; padding: .5em 1.2em; }
ul.qz-why { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 4px; align-items: center; }
.qz-why li { display: flex; gap: 8px; align-items: baseline; opacity: .8; }
.qz-why li b { flex: none; white-space: nowrap; }
.qz-why li.ok { opacity: 1; font-weight: 600; }
.qz-why .no { font-style: italic; opacity: .7; }
.qz-why li.none b { text-decoration: line-through; text-decoration-thickness: 1.5px; opacity: .55; }

/* Free play: the collection (a modal from the "Your collection" button), newest on top */
.favcard.found { max-width: 640px; }
.favcard.found .favhead { gap: 10px; }
.favcard.found .favhead h2 { margin-right: auto; }
#collclear { flex: none; font-size: .8rem; padding: .4em .85em; }
#collclear[hidden] { display: none; }
.fcount { font-size: .88rem; font-weight: 500; opacity: .75; font-variant-numeric: tabular-nums; white-space: nowrap; }
.fmeters { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 6px 16px; margin: 10px 0 12px; }
.fempty { text-align: center; opacity: .7; margin: 12px 0 6px; }
.flist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.fitem { border-radius: 18px; border: 1.5px solid var(--dock-line); background: var(--fill-lo); transition: background-color .2s ease; }
.fitem.open { background: var(--fill-mid); border-color: hsla(265,70%,70%,.6); }
.fitem.newpv { animation: newpv .9s cubic-bezier(.34,1.56,.64,1); }
.fhead { appearance: none; border: 0; background: transparent; color: inherit; font: inherit; width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; text-align: left; border-radius: inherit; }
.fhead:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
.fhead .pvpill { font-size: 1.02rem; }
.fm { flex: 1; min-width: 0; font-size: .9rem; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chev { flex: none; width: 9px; height: 9px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); opacity: .5; transition: transform .25s ease; margin: 0 4px 4px; }
.fitem.open .chev { transform: rotate(225deg); margin-bottom: -2px; }
.fbody { display: flex; flex-direction: column; gap: 12px; padding: 4px 14px 12px; }
.frow { display: flex; align-items: flex-start; gap: 8px; }
.frow .sense { flex: 1; }
.frow + .frow { padding-top: 10px; border-top: 1px dashed var(--dock-line); }
@keyframes newpv { 0% { transform: scale(.85); background: hsla(150,80%,60%,.35); } 60% { transform: scale(1.03); } 100% { transform: none; } }
@media (max-width: 600px) { .favcard.found { padding: 12px 10px 10px; } .fm { white-space: normal; } }
@media (prefers-reduced-motion: reduce) { .fitem.newpv, .steps i { animation: none; transition: none; } }
/* Play menu: a dot after the game being played (from the sibling games) */
.playmenu button[aria-current="true"] span::after { content: " ●"; font-size: .6em; vertical-align: .25em; color: var(--underline); }

/* 42-modebtn.css — the header's mode button (Free play ⇄ Normal game, from Verb Wheel's Practice button) and the header part
   it swaps: level + Favorites + Seen in a game, Particle guide + Your collection in free play. The side in use sets the
   width (so the header's buttons stay evenly spaced); the other one is lifted out of the row, centred, and fades.
   On a switch the width glides from one to the other (swapHeader, 22-modes.js) while the sides fade and scale. */
.hswap { display: grid; align-items: center; justify-items: center; justify-content: center; flex: none; position: relative; }
.hside { grid-area: 1 / 1; display: inline-flex; align-items: center; gap: 14px;
  transition: opacity .3s ease .08s, scale .4s cubic-bezier(.3,1.2,.5,1) .04s, visibility 0s linear 0s; }
.hswap #listbtns { gap: 14px; }
body.free #hgame, body:not(.free) #hfree { position: absolute; top: 50%; left: 50%; translate: -50% -50%; opacity: 0; scale: .9; visibility: hidden; pointer-events: none;
  transition: opacity .22s ease, scale .3s ease, visibility 0s linear .3s; }
/* The collection's count: a small pill on the button (it stays on phones, where the labels go) */
.hcount { min-width: 1.6em; padding: .15em .45em; border-radius: 999px; font-size: .74rem; font-weight: 600; line-height: 1.2; text-align: center;
  background: linear-gradient(135deg, hsl(150,60%,45%), hsl(185,65%,42%)); color: #fff; }
.hcount:empty { display: none; }

.mode {
  appearance: none; border: 0; cursor: pointer; flex: none; position: relative;
  display: inline-flex; align-items: center; gap: .45em;
  padding: .62em 1.2em .62em 1em; border-radius: 999px;
  font-family: inherit; font-weight: 600; font-size: .95rem; line-height: 1; letter-spacing: .01em; white-space: nowrap; isolation: isolate;
  /* The sibling games' gradient and soft glow (pink 315° to purple 275°, as in Verb Wheel's Practice button) */
  color: #fff;
  background: linear-gradient(135deg, hsl(315,85%,68%), hsl(275,80%,68%));
  box-shadow: 0 3px 9px hsla(295,70%,55%,.22);
  transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease;
}
.mode svg { display: block; flex: none; }
.mode .ml { display: grid; justify-items: center; }
.mode .ml > span { grid-area: 1 / 1; }
.mode .ml > span + span { visibility: hidden; }
.mode:hover { transform: scale(1.05); box-shadow: 0 4px 12px hsla(295,70%,55%,.3); }
.mode:active { transform: scale(.96); }
/* In free play it leads back to the game: blue (a layer over the pink that fades in, so the colours blend) */
.mode::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none;
  background: linear-gradient(135deg, #22c7b8, #2f9bf0 55%, #4f6cff); opacity: 0; transition: opacity .4s ease; }
.mode.on::after { opacity: 1; }
.mode.sure::after { opacity: 0; }
.mode .ml.in, .mode svg.in { animation: mlin .35s ease; }
@keyframes mlin { from { opacity: 0; transform: translateY(4px); } }
.mode.on { box-shadow: 0 3px 9px rgba(47, 155, 240, .22); }   /* the blue keeps the same soft glow */
.mode.on:hover { box-shadow: 0 4px 12px rgba(47, 155, 240, .3); }
/* "Leave this game?": amber, waiting for a second tap */
.mode.sure { background: linear-gradient(135deg, #ffb340, #ff7a45); box-shadow: 0 3px 9px rgba(255, 130, 60, .3); animation: modesure .4s ease; }
@keyframes modesure { 30% { transform: scale(1.08); } 100% { transform: none; } }

/* Phones: two rows (45-phone.css): the mode button alone on top, in the middle; level (free play: Particle guide +
   Your collection) and the other icons below. The swap's parts become the dock's own items; the side not in use is simply gone. */
@media (max-width: 600px) {
  .hswap, #hgame { display: contents; }
  body.free #hgame, body:not(.free) #hfree { display: none; }
  #levelseg, #hfree { order: 4; }
  .mode { order: 1; font-size: .86rem; padding: .55em 1em .55em .85em; }
  .mode svg { width: 15px; height: 15px; }
  .hside, .hswap #listbtns { gap: 2px; }
  .hcount { font-size: .68rem; }
}
@media (prefers-reduced-motion: reduce) { .hside, .mode, .mode::after { transition: none !important; } .mode.sure, .mode .ml.in, .mode svg.in { animation: none; } }

/* 45-phone.css — phones: a compact top of the page (the dock on two rows, smaller score / new game tiles, a short
   instruction) so the board starts higher. */
@media (max-width: 600px) {
  /* Two rows: the mode button (42-modebtn.css), then a break (::after), then everything else, centred */
  .dock { flex-wrap: wrap; justify-content: center; gap: 4px 2px; margin-top: 8px; padding: 4px 6px; border-radius: 22px; }
  .dock::after { content: ""; order: 2; flex-basis: 100%; height: 0; }
  .dock > :not(#hswap, .mode) { order: 4; }
  #listbtns { order: 4; }
  .seg.level { width: auto; flex: none; }
  .seg.level button { flex: none; font-size: .78rem; padding: .5em .7em; }
  .seg.vseg { flex: none; }
  .volwrap { flex: none; }
  #snd { padding: .4em .45em; }
  .tourbtn { padding: .42em; }
  .hbtns { gap: 2px; }
  .go { grid-template-columns: 62px 1fr 62px; column-gap: 8px; margin-top: 18px; }   /* more room under the header on phones (as in Core Word Bubbles) */
  .score, .tile { width: 62px; height: 44px; border-radius: 15px; gap: 1px; padding: 0 4px; }
  .score b { font-size: 1.15rem; }
  .score small, .tile small { font-size: .62rem; }
  .tile svg { width: 18px; height: 18px; }
  .hint { font-size: .86rem; line-height: 1.3; margin: 8px 6px 0; min-height: 2.6em; }
  /* End card: thinner edges so the sentences get the width */
  #endmodal { padding: 10px; }
  #endmodal .favcard { padding: 12px 10px 14px; max-height: 88vh; }
  #endlist li { padding: 8px 8px 10px 12px; }
  /* A split gap keeps to one line when it can */
  .gap.split .gslot { min-width: 2.8em; }
}


/* 60-scrollbar.css — scrollbars as in the newer games (lists, collection, end card, tour card; the page has none): a thin glossy pill with the
   pink-to-purple gradient on a clear track. Chrome / Edge / Safari use the ::-webkit-scrollbar parts; Firefox only takes
   colours, so it gets a thin pink thumb (in @supports, since Chrome would let these override the pill). */
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: transparent; margin: 18px 0; }
::-webkit-scrollbar-thumb {
  border: 3px solid transparent; border-radius: 999px; background-clip: padding-box;
  background-image: linear-gradient(180deg, hsl(315,85%,66%), hsl(275,80%,64%));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45);
}
::-webkit-scrollbar-thumb:hover { background-image: linear-gradient(180deg, hsl(315,90%,60%), hsl(275,85%,58%)); }
::-webkit-scrollbar-thumb:active { border-width: 2px; }
::-webkit-scrollbar-button, ::-webkit-scrollbar-corner { display: none; background: transparent; }
@supports (-moz-appearance: none) {
  * { scrollbar-width: thin; scrollbar-color: hsl(295,82%,66%) transparent; }
}
/* The page itself still scrolls on short screens, but shows no bar (only the cards and lists do). */
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }

</style>

function applyUi() { document.querySelectorAll("[data-ui]").forEach(el => { el.textContent = tx(el.dataset.ui); }); }

/* ---------- Phrasal verbs on screen ---------- */
// "give up" as HTML: the verb and the particle in their own colours (verbs blue, particles pink everywhere); t = the
// third word of a three-word phrasal verb ("tail": come up with), green.
function pvHTML(v, p, t) { return '<span class="pv-v">' + esc(v) + '</span> <span class="pv-p">' + esc(p) + "</span>" + (t ? ' <span class="pv-t">' + esc(t) + "</span>" : ""); }
// A meaning's phrasal verb in full: "come up with" (keyOf, 10-game.js, is only the verb and the particle).
const fullOf = s => s.v + " " + s.p + (s.tail ? " " + s.tail : "");
// A meaning used in a fixed frame ("pre": "get", "vf": "pp": get carried away) shows the verb in that form, "(get)" before it.
const verbOf = s => s.vf ? DATA.pool.verbs[s.v].f[["s", "past", "pp", "ing"].indexOf(s.vf)] : s.v;
const preHTML = s => s.pre ? '<span class="pv-pre">(' + esc(s.pre) + ")</span> " : "";
// A fixed object ("mid": "it": hit it off) sits between the verb and the particle, greyed like the frame.
const midHTML = s => s.mid ? ' <span class="pv-pre">' + esc(s.mid) + "</span>" : "";
const pvOf = s => s.mid ? preHTML(s) + '<span class="pv-v">' + esc(verbOf(s)) + "</span>" + midHTML(s) + ' <span class="pv-p">' + esc(s.p) + "</span>" : preHTML(s) + pvHTML(verbOf(s), s.p, s.tail);
// What speech says for a meaning: "get carried away", "come up with".
const sayOf = s => (s.pre ? s.pre + " " : "") + verbOf(s) + (s.mid ? " " + s.mid : "") + " " + s.p + (s.tail ? " " + s.tail : "");
// A meaning's type (types.json: separable, inseparable, no object), its name translated at native-UI levels.
function typeOf(t) {
  const T = DATA.types[t] || {}, L = nativeUi() && (lang().types || {})[t];
  return L ? Object.assign({}, T, L) : T;
}
// Where the object goes: "turn it off ✓ · turn off it ✗" (separable), "look after her" (inseparable), "" (no object).
function patternHTML(s) {
  const o = esc(s.obj || "it"), v = '<span class="pv-v">' + esc(s.v) + "</span>", p = '<span class="pv-p">' + esc(s.p) + "</span>";
  // A three-word phrasal verb keeps its words together, the object after them: put up with it.
  if (s.tail) return pvOf(s) + " " + o + ' <i class="ok">✓</i>';
  if (s.t === "sep") return v + " " + o + " " + p + ' <i class="ok">✓</i> · ' + v + " " + p + " " + o + ' <i class="no">✗</i>';
  if (s.t === "ins") return v + " " + p + " " + o + ' <i class="ok">✓</i> · ' + v + " " + o + " " + p + ' <i class="no">✗</i>';
  return "";
}
// The type chip: its colour, name and (as a tooltip) what it means.
function typeChip(s) { const T = typeOf(s.t); return '<span class="chip tchip" style="--h:' + T.hue + '" title="' + esc(T.x || "") + '">' + esc(T.name || s.t) + "</span>"; }

/* 07-back.js — the phone's back gesture (or the browser's Back) closes the open window instead of leaving the page
   (from the sibling games, via Simple Past): Favorites / Seen / Particle guide, Your collection, the end card, the
   tutorial, the Play menu and the header pop-ups (colours, volume); in free play, a review or a favorites game it goes
   back to a normal game. Each window holds a history entry while it is open. A MutationObserver sees it open and
   close, whatever closed it (✕, Escape, a click outside, a button), so the entry is added and taken back in one place.
   Back closes the window opened last. A new window needs one backLayer(el, isOpen, close) call. */
// Our history entries must not bring back an old scroll position.
try { history.scrollRestoration = "manual"; } catch (e) {}
const BACK = [];     // open windows, oldest first: { el, close, pushed }
let backSkip = 0;    // our own history.back() calls, whose popstate is not a Back press
// A window that opens while one of those history.back() calls is on its way (the Play menu closes and a new mode
// starts in the same click) waits for its popstate: an entry pushed in between would be swept away with it.
const pendingPush = [];
function pushEntry(L) { try { history.pushState({ layer: 1 }, ""); L.pushed = true; } catch (e) { L.pushed = false; } }   // a file:// page may refuse
// el: the window's element; isOpen(): whether it shows; close(): what Back does (the same as its ✕ or Escape).
function backLayer(el, isOpen, close) {
  const L = { el, close, pushed: false, byBack: false };
  let was = isOpen();
  new MutationObserver(() => {
    const now = isOpen(); if (now === was) return; was = now;
    if (now) {
      if (backSkip) pendingPush.push(L); else pushEntry(L);
      BACK.push(L);
    } else {
      const i = BACK.indexOf(L); if (i >= 0) BACK.splice(i, 1);
      const p = pendingPush.indexOf(L); if (p >= 0) pendingPush.splice(p, 1);   // closed before its entry was even added
      // Closed by the game, not by Back: take its history entry away, so the next Back isn't a dead press.
      if (L.pushed && !L.byBack) { backSkip++; history.back(); }
      L.pushed = false;
    }
  }).observe(el, { attributes: true, attributeFilter: ["class", "hidden"] });
}
addEventListener("popstate", () => {
  if (backSkip) { backSkip--; if (!backSkip) pendingPush.splice(0).forEach(pushEntry); return; }
  const L = BACK[BACK.length - 1]; if (!L) return;
  L.byBack = true; L.close(); setTimeout(() => { L.byBack = false; }, 0);   // the observer has run by then
});
// Header pop-ups (01-theme.js, 02-sound.js).
backLayer(swwrap, () => swwrap.classList.contains("open"), () => swOpen(false));
backLayer(volwrap, () => volwrap.classList.contains("open"), () => volwrap.classList.remove("open"));

/* 08-sky.js — background bubbles drifting up behind everything (from Be Do Modal, via English Bubbles): 7 see-through,
   softly blurred bubbles of random size (40-140 px), place and pace (95-145 s a climb). At load they are already
   part-way up and the layer fades in. Transform / opacity only; none with reduced motion. Look: .sky in 23-sky.css. */
(function () {
  const host = $("sky");
  if (!host || reduceMotion) return;
  const hues = [215, 330, 150, 265, 30, 190];
  for (let k = 0; k < 7; k++) {
    const s = document.createElement("span"), size = 40 + Math.round(Math.random() * 100), t = 95 + Math.round(Math.random() * 50);
    const at = (0.15 + 0.65 * (k + Math.random() * 0.8) / 7) * t;   // a negative delay: 15% to 80% of the way up
    s.style.cssText = "width:" + size + "px;height:" + size + "px;left:" + Math.round(Math.random() * 96) + "%;" +
      "--h:" + hues[k % hues.length] + ";--t:" + t + "s;--d:-" + at.toFixed(1) + "s;--x:" + Math.round(Math.random() * 80 - 40) + "px";
    host.appendChild(s);
  }
  setTimeout(() => host.classList.add("in"), 60);   // a timer, not a frame: a page opened in the background gets none
})();

/* 10-game.js — game state, flow and scoring. One game = ROUNDS rounds at the chosen level (free play, 23-free.js, has
   none). A round (chosen by 11-rounds.js) has three steps: Build (12-build.js: make the round's phrasal verbs from a few
   verbs and particles), Match (14-match.js: each phrasal verb with its meaning), Sentence (15-sentence.js: complete one
   sentence with one of them); then the reveal card (16-reveal.js).
   Points: Build +1 per phrasal verb made with no wrong pair since the last right one; Match +1 per pair whose phrasal
   verb was never in a wrong pair; Sentence +SENT_PTS first time, +1 on the second try. Hints come from a pool for the
   whole game (levels.json "hints"), at most "hintsPerRound" a round; every unused hint is a bonus point at the end.
   G.combo counts right moves in a row (the chime climbs with it). */
const ROUNDS = 3, SENT_PTS = 2;
const LEVELS = Object.keys(DATA.levels);
// BY = the game's phrasal verbs by pair; FBY = free play's, with the untaught ones too (extra.json, "x"). Rounds,
// progress and the quick question only ever see DATA.pv without them.
const PV = {}, BY = {}, FBY = {};
const keyOf = s => s.v + " " + s.p;
DATA.pv.forEach(s => { PV[s.id] = s; (FBY[keyOf(s)] = FBY[keyOf(s)] || []).push(s); if (!s.x) (BY[keyOf(s)] = BY[keyOf(s)] || []).push(s); });
DATA.pv = DATA.pv.filter(s => !s.x);
// Free play counts forms: get around and get around to are two phrasal verbs. FFORMS = every form (fullOf) -> its pair.
const FFORMS = {};
Object.keys(FBY).forEach(c => FBY[c].forEach(s => { FFORMS[fullOf(s)] = c; }));
const ALSO = new Set(DATA.also);
const lvIdx = l => LEVELS.indexOf(l);
// Rules come from the level of the round being played (practice games can mix levels).
const lvl = () => DATA.levels[(G.r && G.r.level) || G.level] || {};
const lvlNum = (k, d) => lvl()[k] == null ? d : lvl()[k];
const hintPool = () => (DATA.levels[G.level] || {}).hints || 0;
const maxHints = () => lvlNum("hintsPerRound", 2);
const G = { level: "", mode: "normal", seeds: null, total: ROUNDS, idx: 0, score: 0, results: [], streak: 0, combo: 0, hintsLeft: 0, quiz: null, r: null, used: new Set(), phase: "idle" };
const stage = $("stage"), board = $("board"), revealEl = $("reveal"), hintEl = $("hint"), toolsEl = $("tools"), quizEl = $("quiz");
const scoreEl = $("score"), scEl = $("sc"), bestEl = $("bestlbl"), hintBtn = $("hintbtn"), triesEl = $("tries");

/* ---------- Game flow ---------- */
// mode: "normal" | "free" | "review" | "fav" (22-modes.js); ids = the meanings a review / favourites game is built
// around (each round's sentence is one of them).
function newGame(level, mode = "normal", ids) {
  G.level = level; G.mode = mode; applyUi();
  document.body.classList.toggle("other-mode", mode !== "normal");   // Back returns to a normal game (07-back.js)
  G.seeds = ids ? shuffle(ids.filter(id => PV[id])) : null;
  G.total = mode === "free" ? 0 : G.seeds ? Math.min(ROUNDS, G.seeds.length) : ROUNDS;
  G.idx = 0; G.score = 0; G.results = []; G.streak = 0; G.combo = 0; G.quiz = null; G.r = null; G.used = new Set();
  G.hintsLeft = mode === "free" ? 0 : hintPool();
  hush(); hideGloss(); quizEl.hidden = true; stage.hidden = toolsEl.hidden = false; revealEl.hidden = true;
  swapHeader(mode === "free"); setModeBtn();
  showCombo();
  if (mode === "free") return startFree();
  showScore();
  startRound();
}
function startRound() {
  const seed = G.seeds ? PV[G.seeds[G.idx]] : null, L = seed ? lvIdx(seed.lv) : lvIdx(G.level);
  const R = makeRound(L, seed);
  if (!R) { G.phase = "idle"; hintEl.textContent = tx("noRound"); return; }
  G.r = Object.assign(R, { level: LEVELS[L], pvs: [], ex: 0, pts: 0, max: 0, hints: 0, mistakes: 0, wrongRun: 0, missed: new Set() });
  revealEl.hidden = true; revealEl.innerHTML = ""; toolsEl.hidden = false; hideGloss();
  startBuild();
  renderTools(); updateProgress();
  stage.classList.remove("out"); stage.classList.add("rise");
  setTimeout(() => stage.classList.remove("rise"), 1400);
}
function nextRound() {
  if (G.phase !== "done") return;
  G.phase = "idle";
  hush();
  G.idx++;
  if (G.idx >= G.total) { updateProgress(); showEnd(); return; }
  stage.classList.add("out"); revealEl.classList.add("out");
  setTimeout(() => { revealEl.classList.remove("out"); if (quizDue()) showQuiz(); else startRound(); }, reduceMotion ? 0 : 260);
}
// All three steps are over: record the round, then the reveal card.
function finishRound() {
  const r = G.r, perfect = r.pts === r.max;
  G.phase = "done";
  G.streak = perfect ? G.streak + 1 : 0;
  r.pvs.forEach(s => { const ok = !r.missed.has(s.id); markSeen(s.id, ok); recordProgress(s.id, ok); });
  tickDay();
  G.results.push({ pvs: r.pvs, sents: r.sents, pts: r.pts, max: r.max, perfect, missed: new Set(r.missed) });
  renderTools(); updateProgress();
  burst($("para"));
  toast(perfect ? (G.streak >= 2 ? tx("streak", { n: G.streak }) : tx("perfect")) : tx("roundPts", { n: r.pts, m: r.max }), perfect ? "" : "zero");
  // The "finished!" jingle after every round (as in the other games' end), perfect or not; the reveal card (and its
  // reading) waits until it has nearly rung out.
  sndWin();
  hintEl.innerHTML = tx("roundDone");
  setTimeout(() => { if (G.r === r) showReveal(true); }, soundOn ? 1100 : reduceMotion ? 0 : 650);
}

/* ---------- Points and combo ---------- */
function addPts(n, el) {
  if (!n) return;
  G.score += n; G.r.pts += n;
  showScore(); flash(scoreEl, "up"); if (el) toastAt(el, "+" + n);
}
// A right move: the combo grows. Returns how many semitones the chime climbs.
function comboUp() { G.combo++; showCombo(); return Math.min(G.combo - 1, 6) * 2; }
function comboReset() { G.combo = 0; showCombo(); }
function showCombo() { const c = $("combo"); c.hidden = G.combo < 3; c.textContent = "×" + G.combo; if (G.combo >= 3) flash(c, "tick"); }
// Best scores are kept for normal games only; practice games don't save one ("" = none).
function bestKey() { return G.mode === "normal" ? "phv-best-" + G.level : ""; }
function showScore() {
  scEl.textContent = G.score;
  bestEl.textContent = bestKey() ? tx("best", { n: parseInt(load(bestKey()), 10) || 0 }) : tx("practice");
}

/* ---------- Tools row and progress ---------- */
const LIVE = ["build", "match", "sentence"];
function renderTools() {
  const r = G.r, live = LIVE.includes(G.phase), free = G.mode === "free";
  hintBtn.hidden = !free && (!hintPool() || !maxHints() || !live);
  hintBtn.disabled = !free && (!G.hintsLeft || r.hints >= maxHints() || !hintable());
  $("hintleft").hidden = free;
  $("hintleft").textContent = tx("left", { n: G.hintsLeft });
  hintBtn.title = free ? tx("freeHintTitle") : tx("hintTitle", { n: G.hintsLeft, m: maxHints() });
  const st = G.phase === "sentence" && r.gap;
  $("trywrap").hidden = !st;
  if (st) triesEl.innerHTML = Array.from({ length: r.gap.max }, (_, i) => '<i class="' + (i < r.gap.tries ? "used" : "") + '"></i>').join("");
  $("skipbtn").hidden = G.phase !== "lineup";
  if (free) fitTools();
  const tb = $("trbtn");
  tb.hidden = !st || !trHidable();
  if (st) { tb.textContent = tx(r.showTr ? "hideTr" : "showTr"); tb.setAttribute("aria-pressed", r.showTr); }
}
const PROG = { normal: "progRound", review: "progReview", fav: "progFav" };
function updateProgress() {
  showDays();
  if (G.mode === "free") return freeProgress();
  const n = Math.min(G.idx + 1, G.total), done = G.idx + (G.phase === "done" ? 1 : 0);
  $("proglbl").textContent = tx(PROG[G.mode] || "progRound", { n, m: G.total });
  $("pfill").style.width = (Math.min(done, G.total) / G.total * 100) + "%";
  // Which step of the round: three little dots under the bar.
  const k = ["build", "match", "sentence"].indexOf(G.phase === "lineup" ? "match" : G.phase), steps = $("steps");
  steps.hidden = false;
  [...steps.children].forEach((d, i) => { d.className = i < k || G.phase === "done" ? "done" : i === k ? "on" : ""; });
}

/* ---------- Hints ---------- */
// One hint from the game's pool (at most maxHints() a round): Build lights up a verb and a particle that go together,
// Match pairs one for you, Sentence greys out a phrasal verb that doesn't fit.
const hintable = () => G.phase === "build" ? !!buildHintPair() : G.phase === "match" ? true : G.phase === "sentence" ? sentGreyable().length > 0 : false;
function useHint() {
  if (G.mode === "free") return freeHint();
  const r = G.r;
  if (!r || !LIVE.includes(G.phase) || !G.hintsLeft || r.hints >= maxHints()) return;
  const ok = G.phase === "build" ? buildHint() : G.phase === "match" ? matchHint() : sentHint();
  if (!ok) return;
  r.hints++; G.hintsLeft--; sndHint();
  renderTools(); flash($("hintleft"), "tick");
}
hintBtn.addEventListener("click", useHint);
// Idle reminder: after 15 s without a tap or key (again every 15 s) the hint button wiggles while a hint is usable.
let lastAct = Date.now();
["pointerdown", "keydown"].forEach(t => addEventListener(t, () => { lastAct = Date.now(); }, true));
setInterval(() => {
  if (!LIVE.includes(G.phase) || Date.now() - lastAct < 15000 || hintBtn.disabled || hintBtn.hidden) return;
  lastAct = Date.now(); if (!reduceMotion) flash(hintBtn, "nudge");
}, 1000);

/* 11-rounds.js — chooses a round's words (build.py's Rounds class simulates the same rules: change both together).
   A round shows a few verbs and particles from the global pool (levels.json "verbs" / "particles" / "words") that make
   "known" phrasal verbs — with a meaning at or below the round's level — ([min, max] of them), at most "advanced" ones
   of a higher level (accepted, with a note) and at most "also" untaught combinations (pool.json). Every word makes at
   least one phrasal verb, and the same word never sits on both sides ("back"). The player makes any of them, up to
   "pairs"; the Match and Sentence steps then use the ones made (meanings chosen as they are made: pickSense).
   The seed — a meaning of the level, least shown first (or the practice game's meaning) — is always on the board and is
   the preferred sentence. */
const comboOf = (v, p) => v + " " + p;
// The forms a pair makes: "" (two words) and its tails ("come up" → ["", "with"]). Each can be made once a round.
const formsOf = c => [...new Set(BY[c].map(s => s.tail || ""))];
// Combinations known at level index L: {"give up": [meanings at or below L]}.
function knownAt(L) {
  const k = {};
  Object.keys(BY).forEach(c => { const ss = BY[c].filter(s => lvIdx(s.lv) <= L); if (ss.length) k[c] = ss; });
  return k;
}
function construct(seed, L, known) {
  const cfg = DATA.levels[LEVELS[L]], K = randInt(cfg.known[0], cfg.known[1]), maxadv = cfg.advanced || 0, maxalso = cfg.also || 0, sizes = [];
  for (let a = cfg.verbs[0]; a <= cfg.verbs[1]; a++) for (let b = cfg.particles[0]; b <= cfg.particles[1]; b++) if (!cfg.words || a + b === cfg.words) sizes.push([a, b]);
  const [nv, np] = pick(sizes), target = nv + np;
  const count = (V, P, f) => { let n = 0; V.forEach(v => P.forEach(p => { if (f(comboOf(v, p))) n++; })); return n; };
  const edges = (V, P) => { const e = []; V.forEach(v => P.forEach(p => { if (known[comboOf(v, p)]) e.push(comboOf(v, p)); })); return e; };
  const adv = c => BY[c] && !known[c], also = c => ALSO.has(c);
  let V = [seed.v], P = [seed.p], E = edges(V, P);
  if (E.length !== 1) return null;
  const cands = shuffle(Object.keys(known));
  // Grow: add a known combination that brings one or two new words, keeping the sizes and the count reachable.
  while (E.length < K) {
    const nw = target - V.length - P.length;
    let ok = null;
    for (const c of cands) {
      if (E.includes(c)) continue;
      const [v, p] = c.split(" ");
      if (P.includes(v) || V.includes(p)) continue;
      const nV = V.includes(v) ? V : V.concat(v), nP = P.includes(p) ? P : P.concat(p);
      if (nV.length > nv || nP.length > np) continue;
      const added = nV.length + nP.length - V.length - P.length, w2 = nw - added, nE = edges(nV, nP), ne = K - nE.length;
      if (!added || w2 < 0 || ne < 0 || w2 > 2 * ne || (!ne && w2 > 0) || count(nV, nP, adv) > maxadv || count(nV, nP, also) > maxalso) continue;
      ok = [nV, nP, nE]; break;
    }
    if (!ok) return null;
    [V, P, E] = ok;
  }
  if (V.length !== nv || P.length !== np) return null;
  const A = E.slice(); V.forEach(v => P.forEach(p => { if (adv(comboOf(v, p))) A.push(comboOf(v, p)); }));
  return { V, P, A };
}
// The round: { V, P, all (every phrasal verb the words make), need (how many to make), seed (the preferred sentence) }.
function makeRound(L, fixed) {
  const known = knownAt(L), sh = getShown(), n = id => sh[id] || 0, lv = LEVELS[L];
  const seeds = fixed ? [fixed] : shuffle(DATA.pv.filter(s => s.lv === lv && !G.used.has(keyOf(s)))).sort((a, b) => n(a.id) - n(b.id));
  if (!fixed && !seeds.length) return makeRound(L, pick(DATA.pv.filter(s => s.lv === lv)));
  const found = [];
  for (const seed of seeds.slice(0, 10)) {
    for (let t = 0; t < 25; t++) {
      const st = construct(seed, L, known); if (!st) continue;
      const low = c => Math.min(...BY[c].map(s => n(s.id)));
      const score = st.A.filter(c => BY[c].some(s => s.lv === lv)).length * 3 - st.A.reduce((t, c) => t + low(c), 0)
        - 5 * st.A.filter(c => G.used.has(c)).length + Math.random();
      found.push({ score, st, seed });
    }
    if (found.length >= 8) break;
  }
  if (!found.length) return null;
  const best = found.sort((a, b) => b.score - a.score)[0], cfg = DATA.levels[lv];
  return { V: shuffle(best.st.V), P: shuffle(best.st.P), all: best.st.A, need: Math.min(cfg.pairs, best.st.A.reduce((t, c) => t + formsOf(c).length, 0)), seed: best.seed };
}
// The meaning a phrasal verb made in this round gets: the seed's, else one at or below the level, least shown, whose
// translation no phrasal verb made before it already uses (Match then has one clear answer per pair). tail = the
// third word the player picked ("" = none): only meanings with it. A form already made this round is never picked
// again (skip = the place being decided, not counted as made).
function pickSense(c, tail, skip) {
  const r = G.r, L = lvIdx(r.level), sh = getShown(), used = new Set(r.pvs.filter(x => x !== skip).map(s => (trOf(s).m || "").toLowerCase()));
  const made = t => r.pvs.some(x => x && x !== skip && keyOf(x) === c && (x.tail || "") === t);
  const fit = s => (tail == null || (s.tail || "") === tail) && !made(s.tail || "");
  if (keyOf(r.seed) === c && fit(r.seed)) return r.seed;
  const ss = shuffle(BY[c].filter(fit)).sort((a, b) => ((lvIdx(a.lv) > L) - (lvIdx(b.lv) > L)) || (used.has((trOf(a).m || "").toLowerCase()) - used.has((trOf(b).m || "").toLowerCase())) || ((sh[a.id] || 0) - (sh[b.id] || 0)));
  return ss[0] || BY[c][0];
}
// The round's n sentences, among the phrasal verbs made: ones that no other made one could also fill ("fits"), the
// seed first, then the level's, least shown; in the order they were made.
function pickTargets(n) {
  const r = G.r, L = lvIdx(r.level), sh = getShown(), ks = r.pvs.map(keyOf);
  const clear = s => !(s.fits || []).some(f => ks.includes(f) && f !== keyOf(s)) && !r.pvs.some(x => x !== s && (x.fits || []).includes(keyOf(s)));
  const rank = s => (s === r.seed ? 0 : 10) + (lvIdx(s.lv) > L ? 5 : 0) + (clear(s) ? 0 : 100) + (sh[s.id] || 0) / 1000 + Math.random() / 1e6;
  const pick = r.pvs.slice().sort((a, b) => rank(a) - rank(b)).slice(0, n);
  return r.pvs.filter(s => pick.includes(s));
}

$("trbtn").addEventListener("click", () => {
  const r = G.r; r.showTr = !r.showTr;

// The translations grow out of (or shrink into) the bubbles: each one opens from its centre without its text

function toggleTr(show) {

  smalls.forEach(s => s.getAnimations().forEach(a => a.cancel()));
  choicesEl.classList.remove("notr");

  const T = 420, ease = "cubic-bezier(.3,.9,.3,1.12)", m = getComputedStyle(smalls[0] || choicesEl).marginTop;
  smalls.forEach((s, i) => {

    s.firstChild.style.cssText = "flex: none; width: " + w + "px"; s.style.overflow = "hidden";
    s.animate(show ? [shut, open] : [open, shut], { duration: T, easing: show ? ease : "ease-in", fill: "both" }).onfinish = a => {

// For ms, a bubble that jumps to another row (the row wrapped) slides from where it was instead.
function glideRows(ms) {

  const tick = () => {
    els.forEach(e => {
      const [x, y] = pos.get(e), nx = e.offsetLeft, ny = e.offsetTop;
      if (Math.abs(ny - y) > 8) e.animate([{ translate: (x - nx) + "px " + (y - ny) + "px" }, { translate: "0 0" }], { duration: 300, easing: "cubic-bezier(.2,.8,.3,1)" });

// A change to the options row without jumps: change() alters it, then every bubble that moved (along its row or to
// another one) slides from where it was.
function flipChoices(change, ms = 450) {

  change();

    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) e.animate([{ translate: dx + "px " + dy + "px" }, { translate: "0 0" }], { duration: ms, easing: "cubic-bezier(.25,.9,.3,1)" });

}
// A phrasal verb that filled a sentence leaves the options: lifted out of the row where it sits, it shrinks away
// while the others glide into its place (flipChoices).
function dropChoice(s) {
  const r = G.r, W = r.choices.find(x => fullOf(x.s) === fullOf(s));
  if (!W) return;
  r.choices = r.choices.filter(x => x !== W);
  if (reduceMotion) return W.el.remove();
  const el = W.el, b = el.getBoundingClientRect(), c = choicesEl.getBoundingClientRect();
  el.style.cssText += ";position:absolute;margin:0;box-sizing:border-box;left:" + (b.left - c.left) + "px;top:" + (b.top - c.top) + "px;width:" + b.width + "px;height:" + b.height + "px";
  el.classList.add("gone");

// An option in the form of sentence e.
function setChoice(W, e) {

function choiceLabel(W, e) {

// The sentence with its gap: "{0}" or "{0} … {1}" (a split phrasal verb: the words between stay inside the gap).
// Punctuation right after the gap stays on its line.
// kw = the meaning's key words ({word: translation}): dotted, with their translation on hover / tap (18-gloss.js).
function kwHTML(text, kw) {
  const ks = Object.keys(kw || {}).sort((a, b) => b.length - a.length);
  if (!ks.length) return esc(text);
  const re = new RegExp("(?<![A-Za-z])(" + ks.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")(?![A-Za-z])", "gi");

    const i = +parts[k];

    out += '<span class="gslot" data-i="' + i + '"></span>';

function gapWords(s) { const g = G.r.gap, c = conjOf(s, g.e); return g.slots.length > 1 ? [c[0], c.slice(1).join(" ")] : [c.join(" ")]; }
function showInGap(words, cls, from) {

/* ---------- Filling the gap ---------- */
function fillGap(W, from) {
  const r = G.r, g = r.gap;

  g.busy = true; W.used = true; W.el.classList.add("used");
  showInGap(gapWords(W.s), "", from);
  setTimeout(() => { if (G.r === r) checkGap(W); }, reduceMotion ? 60 : 420);
}
function checkGap(W) {

  g.slots.forEach(sl => sl.firstChild && sl.firstChild.classList.add("bad"));
  const left = g.max - g.tries;

  renderTools();

/* ---------- Hint ---------- */

/* 16-reveal.js — the card after each round (the sentences' translations, the round's phrasal verbs behind (?)
   with their meaning, English definition and where the object goes, Next, favourite star), the helpers that write a
   finished sentence, and the little celebrations (toasts, bursts). */

/* ---------- A finished sentence ---------- */
// HTML: the phrasal verb in bold, in its colours, the object (if split) between its pieces.
function filledHTML(s, ei) {
  const e = s.ex[ei | 0]; if (!e) return "";
  return e.s.split(/\{(\d)\}/).map((t, k) => {
    if (!(k % 2)) return esc(t);
    const w = e.g[+t];
    return '<b class="answ">' + (e.g.length > 1 ? '<span class="' + (+t ? "pv-p" : "pv-v") + '">' + esc(w) + "</span>" : pvHTML(...w.split(" "))) + "</b>";
  }).join("");
}
function sentText(s, ei) { const e = s.ex[ei | 0]; return e ? e.s.replace(/\{(\d)\}/g, (_, i) => e.g[+i]) : ""; }
// One phrasal verb meaning as a list row: pill, level, type, translation, definition, where the object goes.
// opts: level (chip), ex (example), pill / tr false = leave out the pill / translation (already in a header above).
function senseHTML(s, opts = {}) {
  const pat = patternHTML(s);
  return '<div class="sense"><div class="sh">' + (opts.pill === false ? "" : '<b class="pvpill">' + pvOf(s) + "</b>") + (opts.level ? '<span class="lvchip" style="' + lvStyle(s.lv) + '">' + esc(s.lv) + "</span>" : "") + typeChip(s) +
    (opts.tr === false ? "" : '<span class="sm" lang="' + esc(curLang) + '">' + esc(trOf(s).m || "") + "</span>") + "</div>" +
    '<div class="sd">' + esc(s.def) + (pat ? ' <span class="pat">' + pat + "</span>" : "") + "</div>" +
    (opts.ex ? '<div class="sx"><button type="button" class="pbtn say" data-say="' + esc(s.id) + '" aria-label="' + esc(tx("listen")) + '" title="' + esc(tx("listen")) + '">' + ICON_SAY + '</button><span><span class="sxe">' + filledHTML(s, 0) + '</span><span class="sxt" lang="' + esc(curLang) + '">' + esc((trOf(s).ex || [])[0] || "") + "</span></span></div>" : "") + "</div>";
}

/* ---------- Reveal card ---------- */
// Kept small so it fits under the finished sentences (which stay on the stage): their translations (each with a star),
// then (?), Next. (?) opens the round's phrasal verbs. auto = read the sentences aloud (not when only the language
// changed); each finished sentence on the stage has its own Listen button (sayBtns).
function showReveal(auto) {

    '<div class="rv-tr"><span class="pick-badge" style="--g:' + esc(L.grad || "") + '">' + esc(L.badge) + '</span><div class="rv-rows">' +
    r.sents.map(x => '<div class="rv-row"><p lang="' + esc(curLang) + '">' + esc((trOf(x.s).ex || [])[x.ex] || "") + "</p>" + favBtn(x.s.id) + "</div>").join("") + "</div></div>" +
    '<div class="rv-btns"><button type="button" class="pbtn rv-q" id="rvq" aria-expanded="false" aria-controls="rvwhy" aria-label="' + esc(tx("rvTitle")) + '" title="' + esc(tx("rvTitle")) + '">?</button>' +
    '<button type="button" class="cta" id="next">' + tx(last ? "results" : "next") + " &rarr;</button></div>" +
    '<div class="rv-why" id="rvwhy" hidden>' + r.pvs.map(x => senseHTML(x)).join("") + "</div>";

  const showCard = () => {
    if (revealEl.hidden || !revealEl.offsetParent) return;
    const top = revealEl.getBoundingClientRect().bottom + scrollY + 32 - innerHeight;

  };

  $("next").classList.add("pulse");

  $("next").addEventListener("click", nextRound);
  $("rvq").addEventListener("click", e => {

  });

});

/* ---------- Little celebrations ---------- */
function toast(text, cls) {
  const t = document.createElement("div"); t.className = "toast " + (cls || ""); t.textContent = text;
  stage.appendChild(t); setTimeout(() => t.remove(), 1700);
}
// A small "+1" that floats up from an element.
function toastAt(el, text) {
  if (reduceMotion) return;
  const b = el.getBoundingClientRect(), t = document.createElement("div");
  t.className = "qz-plus"; t.textContent = text; t.style.left = b.left + b.width / 2 + "px"; t.style.top = b.top + "px";
  document.body.appendChild(t); setTimeout(() => t.remove(), 900);
}
// Bubbles flying out of an element. hue: one colour (± 20) instead of all; cls: an extra class ("top": above the modals).
function burst(el, n = 16, hue, cls) {
  if (reduceMotion || !el) return;
  const b = el.getBoundingClientRect(), cx = b.left + b.width / 2, cy = b.top + b.height / 2;
  for (let i = 0; i < n; i++) {
    const p = document.createElement("span"), a = Math.PI * 2 * i / n + rnd(-.2, .2), d = rnd(60, 140), sz = rnd(8, 18);
    p.className = "pf" + (cls ? " " + cls : ""); p.style.left = cx + "px"; p.style.top = cy + "px"; p.style.width = p.style.height = sz + "px";
    p.style.setProperty("--h", hue == null ? Math.round(rnd(0, 360)) : hue + Math.round(rnd(-20, 20)));
    p.style.setProperty("--dx", Math.cos(a) * d + "px"); p.style.setProperty("--dy", Math.sin(a) * d * .7 + "px");
    document.body.appendChild(p); setTimeout(() => p.remove(), 900);

}

/* 17-progress.js — what the player has done with every meaning, across games, and the daily streak.
   phv-prog = {id: [attempts, ok (1 = the latest round had no mistake with it), time]}. "Mastered" = latest ok.
   phv-shown = {id: times it was in a round} (11-rounds.js plays the least shown first).
   phv-days = "YYYY-MM-DD|days in a row". */
function getProg() { return loadJSON("phv-prog", {}); }
function recordProgress(id, ok) {
  const p = getProg(), o = p[id] || [0, 0, 0];
  p[id] = [o[0] + 1, ok ? 1 : 0, Date.now()]; store("phv-prog", JSON.stringify(p));
}
const mastered = (p, id) => !!p[id] && p[id][1] === 1;
function getShown() { return loadJSON("phv-shown", {}); }
function markShown(id) { const s = getShown(); s[id] = (s[id] || 0) + 1; store("phv-shown", JSON.stringify(s)); }
function mastery(level) {
  const p = getProg(), list = DATA.pv.filter(s => s.lv === level);
  return { m: list.filter(s => mastered(p, s.id)).length, n: list.length };
}
// One level's meter: label, bar, "7 / 12". x = { m, n } (default: the level's mastery).
function meterHTML(level, x) {
  x = x || mastery(level);
  return '<div class="meter"><b>' + esc(level) + '</b><div class="pbar"><i style="width:' + (x.n ? x.m / x.n * 100 : 0).toFixed(1) + '%"></i></div><span>' + x.m + " / " + x.n + "</span></div>";
}

/* ---------- Daily streak ---------- */
function dayStr(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dayState() {
  const [d, n] = (load("phv-days") || "|0").split("|"), y = new Date(); y.setDate(y.getDate() - 1);
  return { d, n: +n || 0, today: dayStr(new Date()), yest: dayStr(y) };
}
// Days in a row, counting today or yesterday (the streak is still alive until a day is skipped).
function getDays() { const s = dayState(); return s.d === s.today || s.d === s.yest ? s.n : 0; }
// Called when a round is finished (or a phrasal verb found in free play): the first one of the day extends the streak.
function tickDay() {
  const s = dayState(); if (s.d === s.today) return;
  store("phv-days", s.today + "|" + (s.d === s.yest ? s.n + 1 : 1)); showDays();
}
function showDays() { const n = getDays(), el = $("days"); el.hidden = n < 2; el.textContent = "🔥 " + n; el.title = tx("daysTitle", { n }); }

/* 18-gloss.js — hover (mouse) a word in the boxes, or tap it once (touch: 13-drag.js), to see what it means on its
   own: a verb's everyday meaning, a particle's core idea (pool.json). Phrasal verbs never show a meaning before the
   Match step. The Sentence step's key words (dotted, .kw: the meaning's "kw" in its translation) use the same tip. */
const glossEl = document.createElement("div");
glossEl.className = "glosstip"; glossEl.setAttribute("role", "tooltip"); glossEl.hidden = true;
document.body.appendChild(glossEl);
let glossFor = null, glossTimer = 0, glossPt = null;   // glossPt: the pointer (x, y) that opened it
// HTML: the word's meaning in the translation language (a particle adds its idea in English, smaller).
function glossOf(W) {
  const d = (W.side === "v" ? DATA.pool.verbs : DATA.pool.particles)[W.w] || {};
  return d[curLang] ? esc(d[curLang]) + (d.idea ? "<small>" + esc(d.idea) + "</small>" : "") : "";
}
// A touch tap passes no linger: the meaning stays while the word is lifted (pickWord(null) hides it).
function showGloss(W, linger) { showTip(W.el, glossOf(W), linger); }
// The tip over el with g (HTML, in the translation language).
function showTip(el, g, linger, pt) {
  const L = lang(); glossPt = pt || null;
  clearTimeout(glossTimer);
  if (!g) return hideGloss();
  if (glossFor && glossFor !== el) glossFor.classList.remove("on");
  glossEl.innerHTML = '<span class="pick-badge" style="--g:' + esc(L.grad || "") + '">' + esc(L.badge) + '</span><span lang="' + esc(curLang) + '">' + g + "</span>";

/* 19-shine.js — the soap bubbles (from Be Do Modal via Question Bubbles, 2026-11-22): SOAP = the spans inside every

// The film (.film: the turning colour .spin, the glow facing the mouse .fg), the shine spot (.spot + its brighter core

  '<span class="spot" aria-hidden="true"><i></i><i class="pl"><i></i></i></span>' +
  '<span class="rim" aria-hidden="true"><i class="spin"></i><i class="rh"><i></i></i></span><span class="glint" aria-hidden="true"><i></i></span>';

const SOAP_SEL = ".b.w, .b.mb";

/* Squash and stretch: a carried bubble stretches along the way it moves, more the faster (up to max longer, as much

/* 20-end.js — end-of-game modal: score, stars (round points only), hint bonus, quick-question point, level progress,

  G.phase = "over";

  $("endmsg").textContent = tx("msg" + n);
  $("endsub").textContent = !key ? tx("noSave") : record ? tx("newBest", { lvl: G.level }) : tx("levelBest", { lvl: G.level, n: Math.max(prev, sc) });
  const extras = [];
  if (pool) extras.push(tx("hintsUsed", { n: pool - G.hintsLeft, m: pool }) + (bonus ? tx("bonus", { n: bonus }) : ""));
  if (G.quiz) extras.push(tx("quickQ", { r: G.quiz.ok ? "+1" : tx("missed") }));
  $("endhints").textContent = extras.join(" · ");
  const days = getDays();
  $("endprog").innerHTML = meterHTML(G.level) + '<span class="psub">' + tx("mastered", { lvl: esc(G.level) }) + (days >= 2 ? tx("daysRow", { n: days }) : "") + "</span>";
  // One row per round: each sentence with the phrasal verb it used (green, or red if missed) and its translation.
  // A header line (mark, round, points), then each sentence with its favourite star on the right.
  $("endlist").innerHTML = G.results.map((x, i) => {
    const cls = x.perfect ? "" : x.pts / x.max < .5 ? "miss" : "plain";
    return '<li class="' + cls + '"><div class="rhd"><span class="ri">' + (x.perfect ? "&#9733;" : "&#10003;") + '</span><span class="rn">' + tx("roundN", { n: i + 1 }) +
      '</span><span class="rp">' + x.pts + "/" + x.max + '</span></div><div class="rs">' +
      x.sents.map(({ s, ex }) => '<div class="rsent"><div class="rsb"><span class="pvchip' + (x.missed.has(s.id) ? " miss" : "") + '" title="' + esc(trOf(s).m || "") + '">' + pvOf(s) + "</span>" +
        "<div>" + filledHTML(s, ex) + "</div>" + ((trOf(s).ex || [])[ex] ? '<div class="rt" lang="' + esc(curLang) + '">' + esc(trOf(s).ex[ex]) + "</div>" : "") + "</div>" + favBtn(s.id) + "</div>").join("") +
      "</div></li>";
  }).join("");

  upBtn.hidden = !(G.mode === "normal" && up && n >= 2); if (up) { upBtn.textContent = tx("tryUp", { lvl: up }); upBtn.dataset.l = up; }

}
// Plain-text summary for the teacher (WhatsApp, Classroom...): every round's phrasal verbs and sentence.
function resultsText() {
  const d = new Date().toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  return [document.title + " · " + G.level + " · " + MODE_NAME[G.mode] + " · " + d,
    "Score: " + $("endscore").textContent + ($("endhints").textContent ? " (" + $("endhints").textContent + ")" : ""),
    ...G.results.map((x, i) => (x.perfect ? "★ " : "✓ ") + "Round " + (i + 1) + " " + x.pts + "/" + x.max + " — " +
      x.pvs.map(s => fullOf(s) + (x.missed.has(s.id) ? " ✗" : "")).join(", ") + " — " + x.sents.map(y => sentText(y.s, y.ex)).join(" / "))].join("\n");

function closeEnd() { endModal.classList.remove("show"); }

$("endup").addEventListener("click", e => { const l = e.currentTarget.dataset.l; closeEnd(); store("phv-level", l); setLevelUI(l); newGame(l); });
$("endcopy").addEventListener("click", e => {

endModal.addEventListener("click", e => { if (e.target === endModal || e.target.closest("[data-close]")) { closeEnd(); playAgain(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && endModal.classList.contains("show")) { closeEnd(); playAgain(); } });
backLayer(endModal, () => endModal.classList.contains("show"), () => { closeEnd(); playAgain(); });   // back = ✕ (07-back.js)

/* 21-lists.js — favourite and seen meanings. A star sits on every finished round (reveal card, end list) and on every

   phv-fav = [{id}], phv-seen = [{id, ok}] (one entry per meaning, ok = no mistake with it in its latest round).

const SEEN_MAX = 60;

function setList(k, a) { store(k, JSON.stringify(a)); }

  const a = getList("phv-fav"), on = !a.some(x => x.id === id), b = a.filter(x => x.id !== id);

}

}
// Any star anywhere: toggle, then sync every star for the same meaning.
document.addEventListener("click", e => {
  const b = e.target.closest(".favstar"); if (!b) return;
  e.stopPropagation();
