l","framePt":"E-mail de trabalho","title":"Training day","titlePt":"Dia de treinamento","body":["Hi all, next Thursday we'll have a training day [learn:to:purpose] about the new software. I'd {like everyone|would like someone} [bring:to:obj] their laptop. If you don't know {how} [connect:to:wh] to the Wi-Fi, ask Sam at reception. There will be {time} [ask:to:noun] questions at the end. I {look forward to} [see:ing:toprep] you all there!"],"pt":["Oi, pessoal, na próxima quinta vamos ter um dia de treinamento para aprender sobre o software novo. Eu gostaria que todos trouxessem o notebook. Se vocês não sabem como se conectar ao Wi-Fi, falem com o Sam na recepção. Vai ter tempo para fazer perguntas no final. Estou ansiosa para ver todos vocês lá!"],"w":{"training day":"dia de treinamento","software":"programa, software","reception":"recepção"},"cw":{"like everyone":"gostaria que todos","how":"como","time":"tempo","look forward to":"estou ansiosa para"}},{"id":"b1-27","frame":"Story","framePt":"História","title":"The night without power","titlePt":"A noite sem luz","body":["Last night the power went off at eight. At first we didn't know {what} [do:to:wh]. Then my dad {suggested|suggest} [play:ing:enjoy] cards by candlelight, and we {had so much fun|have fun} [make up:ing:expr] silly stories. It {made us|make someone} [realize:bare:make] how much time we spend on our phones. When the lights came back, nobody {felt like|feel like} [turn on:ing:expr] the TV."],"pt":["Ontem à noite a luz acabou às oito. No começo a gente não sabia o que fazer. Aí o meu pai sugeriu jogar cartas à luz de velas, e a gente se divertiu muito inventando histórias bobas. Isso fez a gente perceber quanto tempo passa no celular. Quando a luz voltou, ninguém estava a fim de ligar a TV."],"w":{"power went off":"a luz acabou","cards":"cartas","candlelight":"luz de velas","silly":"bobas"},"cw":{"what":"o que","suggested":"sugeriu","had so much fun":"nos divertimos muito","made us":"fez a gente","felt like":"estava a fim de"}},{"id":"b1-28","frame":"Interview","framePt":"Entrevista","title":"Five minutes with a chef","titlePt":"Cinco minutos com uma chef","body":["Q: Why did you become a chef?","A: My grandmother {taught me|teach someone} [cook:to:obj] when I was ten. [feed:ing:subject] people still makes me happy.","Q: What's the hardest part?","A: I {got used to|get used to} [work:ing:toprep] late, but I {miss} [have:ing:enjoy] dinner with my family.","Q: And your dream?","A: I'd {love|would love} [open:to:would] a small restaurant by the sea."],"pt":["P: Por que você virou chef?","R: A minha avó me ensinou a cozinhar quando eu tinha dez anos. Alimentar as pessoas ainda me deixa feliz.","P: Qual é a parte mais difícil?","R: Eu me acostumei a trabalhar até tarde, mas sinto falta de jantar com a minha família.","P: E o seu sonho?","R: Eu adoraria abrir um restaurantezinho à beira-mar."],"w":{"chef":"chef de cozinha","hardest part":"parte mais difícil","dream":"sonho","by the sea":"à beira-mar"},"cw":{"taught me":"me ensinou","got used to":"me acostumei a","miss":"sinto falta de","love":"would love = adoraria"}},{"id":"b1-29","frame":"Health article","framePt":"Artigo de saúde","title":"Screens and sleep","titlePt":"Telas e sono","body":["Many of us {spend} an hour [scroll:ing:expr] through our phones in bed. But the blue light {makes|make someone} our brain [think:bare:make] it's still daytime. Doctors {advise us|advise someone} [put away:to:obj] all screens an hour before bed. {Instead of} [watch:ing:prep] videos, {why not} [read:bare:better] a paper book?"],"pt":["Muitos de nós passamos uma hora rolando a tela do celular na cama. Mas a luz azul faz o nosso cérebro pensar que ainda é dia. Os médicos aconselham a gente a guardar todas as telas uma hora antes de dormir. Em vez de assistir vídeos, por que não ler um livro de papel?"],"w":{"blue light":"luz azul","brain":"cérebro","daytime":"dia","screens":"telas","paper book":"livro de papel"},"cw":{"spend":"passamos (tempo)","makes":"faz","advise us":"aconselham a gente","Instead of":"em vez de","why not":"por que não"}},{"id":"b1-30","frame":"Message","framePt":"Mensagem","title":"Moving day","titlePt":"Dia de mudança","body":["Hey Carlos! We move to our new apartment on Saturday. Could you {help us|help} [carry:bare/to:help] the boxes? The sofa is {too} big [go:to:adj] in the elevator, so we need a few strong people. Afterwards, would you {like|would like} [stay:to:would] for pizza? {Let me|let someone} [know:bare:make] if you can come."],"pt":["Oi, Carlos! A gente se muda para o apartamento novo no sábado. Você poderia ajudar a gente a carregar as caixas? O sofá é grande demais para caber no elevador, então a gente precisa de algumas pessoas fortes. Depois, você gostaria de ficar para comer uma pizza? Me avisa se você puder vir."],"w":{"boxes":"caixas","sofa":"sofá","elevator":"elevador","strong":"fortes","Afterwards":"depois"},"cw":{"help us":"ajudar a gente","too":"demais","like":"would like = gostaria","Let me":"me deixe"}},{"id":"b1-31","frame":"Blog","framePt":"Blog","title":"Life without a car","titlePt":"A vida sem carro","body":["Two years ago I {decided|decide} [sell:to:want] my car [save:to:purpose] money. Now [ride:ing:subject] my bike to work takes only 20 minutes! At first I was {worried about} [arrive:ing:prep] at the office all sweaty, but there's a shower in our building. If you {feel like} [try:ing:expr] it, start with one day a week."],"pt":["Dois anos atrás eu decidi vender o meu carro para economizar. Agora, ir de bicicleta para o trabalho leva só 20 minutos! No começo eu estava preocupado em chegar no escritório todo suado, mas tem um chuveiro no nosso prédio. Se você estiver a fim de experimentar, comece com um dia por semana."],"w":{"bike":"bicicleta","sweaty":"suado","shower":"chuveiro","building":"prédio"},"cw":{"decided":"decidi","worried about":"preocupado com","feel like":"estiver a fim de"}},{"id":"b1-32","frame":"Review","framePt":"Avaliação","title":"One hour to get out","titlePt":"Uma hora para sair","body":["In this escape room you have 60 {minutes} [find:to:noun] the key and get out. The staff {let you|let someone} [ask:bare:make] for three clues. It's {hard} [think:to:adj] clearly with a big clock on the wall! [work:ing:subject] as a team is the secret. We {loved|love} [solve:ing/to:like] the puzzles, and we got out with two minutes left."],"pt":["Nesta sala de fuga você tem 60 minutos para encontrar a chave e sair. Os funcionários deixam você pedir três pistas. É difícil pensar com clareza com um relógio enorme na parede! Trabalhar em equipe é o segredo. A gente adorou resolver os enigmas, e saiu faltando dois minutos."],"w":{"escape room":"sala de fuga","key":"chave","staff":"funcionários","clearly":"com clareza","secret":"segredo","puzzles":"enigmas"},"cw":{"minutes":"minutos","let you":"deixam você","hard":"difícil","loved":"adoramos"}},{"id":"b1-33","frame":"Formal email","framePt":"E-mail formal","title":"Too much noise","titlePt":"Barulho demais","body":["Dear Mr. Lopez, the people in apartment 5B often play loud music after midnight. I don't {object to} [hear:ing:toprep] music on weekends, but I have to get up at six for work. Could you {ask them|ask someone} [turn down:to:obj] the volume after eleven? I'd {rather|would rather} not [call:bare:better] the police. {Thank you for} [read:ing:prep] this. Sincerely, Ana Reis"],"pt":["Prezado Sr. Lopez, as pessoas do apartamento 5B costumam tocar música alta depois da meia-noite. Não me oponho a ouvir música nos fins de semana, mas eu tenho que acordar às seis para trabalhar. O senhor poderia pedir a eles que abaixem o volume depois das onze? Eu preferiria não chamar a polícia. Obrigada por ler esta mensagem. Atenciosamente, Ana Reis"],"w":{"loud":"alta","midnight":"meia-noite","police":"polícia","Sincerely":"atenciosamente"},"cw":{"object to":"me oponho a","ask them":"pedir a eles","rather":"would rather = preferiria","Thank you for":"obrigada por"}},{"id":"b1-34","frame":"Group chat","framePt":"Grupo de mensagens","title":"Beach on Sunday","titlePt":"Praia no domingo","body":["Ana: Who {feels like|feel like} [go:ing:expr] to the beach on Sunday?","Rui: Me! But we'd {better} [leave:bare:better] early: the traffic is terrible after nine.","Ana: OK. I'm not sure {what} [bring:to:wh], though.","Bia: Just sunscreen and a towel. I can {help} you [make:bare/to:help] the sandwiches!"],"pt":["Ana: Quem está a fim de ir à praia no domingo?","Rui: Eu! Mas é melhor a gente sair cedo: o trânsito fica horrível depois das nove.","Ana: Beleza. Mas eu não sei bem o que levar.","Bia: Só protetor solar e uma toalha. Eu posso te ajudar a fazer os sanduíches!"],"w":{"traffic":"trânsito","terrible":"horrível","though":"mas, porém","sunscreen":"protetor solar","towel":"toalha"},"cw":{"feels like":"está a fim de","better":"'d better = é melhor","what":"o que","help":"ajudar"}},{"id":"b1-35","frame":"Story","framePt":"História","title":"The lost passport","titlePt":"O passaporte perdido","body":["Two hours before my flight, I couldn't find my passport. I {started|start} [look:ing/to:like] everywhere, even under the bed. My sister {told me|tell someone} [stay:to:obj] calm and {helped me|help} [check:bare/to:help] every bag again. Finally we found it in the fridge, next to the cheese! I still have no idea {how} [explain:to:wh] that."],"pt":["Duas horas antes do meu voo, eu não conseguia encontrar o meu passaporte. Comecei a procurar em todo lugar, até embaixo da cama. A minha irmã me disse para ficar calmo e me ajudou a olhar todas as malas de novo. Finalmente a gente encontrou o passaporte na geladeira, do lado do queijo! Até hoje eu não faço ideia de como explicar isso."],"w":{"flight":"voo","passport":"passaporte","even":"até","fridge":"geladeira","cheese":"queijo"},"cw":{"started":"comecei","told me":"me disse","helped me":"me ajudou","how":"como"}},{"id":"b1-36","frame":"News","framePt":"Notícia","title":"A library of things","titlePt":"Uma biblioteca de coisas","body":["A new library in Lisbon {lets people|let someone} [borrow:bare:make] tools, games and even tents. [buy:ing:subject] a drill you only use once a year is a waste of money, says its founder. The library also {teaches people|teach someone} [fix:to:obj] old things, and its workshops are a great {chance} [meet:to:noun] the neighbors. It's {easy} [join:to:adj]: you only need an ID card."],"pt":["Uma biblioteca nova em Lisboa deixa as pessoas pegarem emprestado ferramentas, jogos e até barracas. Comprar uma furadeira que você só usa uma vez por ano é desperdício de dinheiro, diz o fundador. A biblioteca também ensina as pessoas a consertar coisas velhas, e as oficinas dela são uma ótima chance de conhecer os vizinhos. É fácil se associar: você só precisa de um documento de identidade."],"w":{"tools":"ferramentas","tents":"barracas","drill":"furadeira","waste":"desperdício","founder":"fundador","workshops":"oficinas","ID card":"documento de identidade"},"cw":{"lets people":"deixa as pessoas","teaches people":"ensina as pessoas","chance":"chance, oportunidade","easy":"fácil"}},{"id":"b1-37","frame":"Personal story","framePt":"História pessoal","title":"A year in Osaka","titlePt":"Um ano em Osaka","body":["I moved to Osaka [teach:to:purpose] English, and at first I {wasn't used to|be used to} [bow:ing:toprep] to everyone. People {kept|keep} [give:ing:enjoy] me small presents, and I never knew {what} [say:to:wh]. My neighbor patiently {taught me|teach someone} [use:to:obj] chopsticks the right way. A year later, Osaka feels like home."],"pt":["Eu me mudei para Osaka para dar aulas de inglês, e no começo eu não estava acostumada a fazer reverência para todo mundo. As pessoas viviam me dando pequenos presentes, e eu nunca sabia o que dizer. A minha vizinha me ensinou com paciência a usar os hashis do jeito certo. Um ano depois, Osaka parece a minha casa."],"w":{"presents":"presentes","patiently":"com paciência","chopsticks":"hashis, pauzinhos","the right way":"do jeito certo","feels like home":"parece a minha casa"},"cw":{"wasn't used to":"não estava acostumada a","kept":"continuavam","what":"o que","taught me":"me ensinou"}},{"id":"b1-38","frame":"Advice column","framePt":"Coluna de conselhos","title":"Emails on Sundays","titlePt":"E-mails aos domingos","body":["My boss {expects me|expect someone} [answer:to:obj] emails on Sundays, and I'm always tired on Mondays. What should I do?","Dear Rita, you'd {better} [talk:bare:better] to her soon. Explain that you need {time} [relax:to:noun] with your family. [turn off:ing:subject] notifications on weekends can also help. And don't {let|let someone} work [take over:bare:make] your life!"],"pt":["A minha chefe espera que eu responda e-mails aos domingos, e eu estou sempre cansada nas segundas. O que eu faço?","Querida Rita, é melhor você conversar com ela logo. Explique que você precisa de tempo para descansar com a sua família. Desligar as notificações nos fins de semana também pode ajudar. E não deixe o trabalho tomar conta da sua vida!"],"w":{"tired":"cansada","soon":"logo","Explain":"explique","notifications":"notificações"},"cw":{"expects me":"espera que eu","better":"'d better = é melhor você","time":"tempo","let":"deixe"}},{"id":"b1-39","frame":"Tech support","framePt":"Suporte técnico","title":"Your new phone","titlePt":"O seu celular novo","body":["{Before} [turn on:ing:prep] your new phone, charge it for an hour. If you don't know {how} [move:to:wh] your photos from the old one, download our free app. It {lets you|let someone} [copy:bare:make] everything in about ten minutes. We also {recommend} [choose:ing:enjoy] a strong password. Our team is always {ready} [answer:to:adj] your questions!"],"pt":["Antes de ligar o seu celular novo, carregue a bateria por uma hora. Se você não sabe como passar as suas fotos do aparelho antigo, baixe o nosso aplicativo gratuito. Ele deixa você copiar tudo em uns dez minutos. Também recomendamos escolher uma senha forte. A nossa equipe está sempre pronta para responder às suas perguntas!"],"w":{"charge":"carregue","download":"baixe","free app":"aplicativo gratuito","strong password":"senha forte"},"cw":{"Before":"antes de","how":"como","lets you":"deixa você","recommend":"recomendamos","ready":"pronta"}},{"id":"b1-40","frame":"Blog","framePt":"Blog","title":"My Chile fund","titlePt":"O meu fundo para o Chile","body":["Last year I {wanted|want} [save:to:want] for a trip to Chile. I {spent} a lot of money [eat:ing:expr] out, so I started cooking at home. My roommate {made me|make someone} [write:bare:make] down everything I bought. I was {surprised} [see:to:adj] how much I spent on coffee! Six months later, I had {enough} money [buy:to:adj] the plane tickets."],"pt":["No ano passado eu queria economizar para uma viagem ao Chile. Eu gastava muito dinheiro comendo fora, então comecei a cozinhar em casa. A minha colega de apartamento me fez anotar tudo o que eu comprava. Fiquei surpresa ao ver quanto eu gastava com café! Seis meses depois, eu tinha dinheiro suficiente para comprar as passagens de avião."],"w":{"trip":"viagem","roommate":"colega de apartamento","plane tickets":"passagens de avião"},"cw":{"wanted":"queria","spent":"gastei","made me":"me fez","surprised":"surpresa","enough":"suficiente"}},{"id":"b1-41","frame":"Work email","framePt":"E-mail de trabalho","title":"Ten years with us","titlePt":"Dez anos com a gente","body":["Hi team, Ana has worked here for ten years, so we've {decided|decide} [have:to:want] a lunch for her on Friday. I'd {like you all|would like someone} [sign:to:obj] the card at reception. Please {avoid} [mention:ing:enjoy] it near her desk: it's a surprise! And don't worry if you don't know {what} [write:to:wh]: a simple thank you is enough. I {look forward to} [celebrate:ing:toprep] with you all!"],"pt":["Oi, pessoal, a Ana trabalha aqui há dez anos, então decidimos fazer um almoço para ela na sexta. Eu gostaria que todos vocês assinassem o cartão ":["No inverno passado o meu carro quebrou numa estrada deserta, e eu não tinha como ligar para ninguém: o meu celular estava sem bateria. Depois de vinte minutos, um fazendeiro encostou para me ajudar. Ele me deixou esperar na caminhonete quentinha dele e se ofereceu para me levar até a cidade mais próxima. Naquele dia eu prometi fazer o mesmo pelos outros."],"w":{"broke down":"quebrou","quiet road":"estrada deserta","dead":"sem bateria","farmer":"fazendeiro","pulled over":"encostou (o carro)","truck":"caminhonete"},"cw":{"way":"jeito, como","let me":"me deixou","offered":"se ofereceu","promised":"prometi"}},{"id":"b1-44","frame":"School notice","framePt":"Aviso da escola","title":"A trip to the science museum","titlePt":"Visita ao museu de ciências","body":["Next month, Year 9 will visit the science museum [learn:to:purpose] about space. Students {need} [bring:to:want] a packed lunch and a notebook. The bus is {too} small [take:to:adj] everyone, so we'll travel in two groups. We'd also {like two parents|would like someone} [come:to:obj] with us. Please {let|let someone} us [know:bare:make] by Friday!"],"pt":["No mês que vem, o 9º ano vai visitar o museu de ciências para aprender sobre o espaço. Os alunos precisam levar um lanche e um caderno. O ônibus é pequeno demais para levar todo mundo, então vamos viajar em dois grupos. Também gostaríamos que dois pais viessem com a gente. Por favor, avisem a gente até sexta!"],"w":{"Year 9":"9º ano","space":"espaço","packed lunch":"lanche (de casa)","notebook":"caderno","groups":"grupos"},"cw":{"need":"precisam","too":"demais","like two parents":"gostaríamos que dois pais","let":"deixem"}},{"id":"b1-45","frame":"Message","framePt":"Mensagem","title":"Tips for your first year","titlePt":"Dicas para o primeiro ano","body":["Hey Lia! Congrats {on} [get:ing:prep] into university! {When it comes to} [study:ing:toprep], a little every day works best. Join a club: it's the easiest {way} [make:to:noun] friends. You'd {better} [buy:bare:better] a good alarm clock, too, because 8 a.m. classes are tough! And my brother can {help} you [find:bare/to:help] a cheap room near campus."],"pt":["Oi, Lia! Parabéns por entrar na faculdade! Quando o assunto é estudar, um pouquinho todo dia funciona melhor. Entre num clube: é o jeito mais fácil de fazer amigos. Também é melhor você comprar um bom despertador, porque aulas às 8 da manhã são difíceis! E o meu irmão pode te ajudar a encontrar um quarto barato perto do campus."],"w":{"Congrats":"parabéns","alarm clock":"despertador","tough":"difíceis","cheap":"barato"},"cw":{"on":"por","When it comes to":"quando o assunto é","way":"jeito","better":"'d better = é melhor você","help":"ajudar"}},{"id":"b1-46","frame":"Health article","framePt":"Artigo de saúde","title":"A young brain","titlePt":"Um cérebro jovem","body":["[learn:ing:subject] a new language is great exercise for your brain. Scientists {encourage older people|encourage someone} [take:to:obj] language classes, and it's never {too} late [start:to:adj]. {Instead of} [watch:ing:prep] TV in the evening, {why not} [listen:bare:better] to a podcast in Spanish? Even ten minutes a day can make a difference."],"pt":["Aprender uma língua nova é um ótimo exercício para o cérebro. Os cientistas incentivam os mais velhos a fazer aulas de idiomas, e nunca é tarde demais para começar. Em vez de assistir TV à noite, por que não ouvir um podcast em espanhol? Até dez minutos por dia podem fazer diferença."],"w":{"exercise":"exercício","brain":"cérebro","Scientists":"cientistas","Even":"até","make a difference":"fazer diferença"},"cw":{"encourage older people":"incentivam os mais velhos","too":"demais","Instead of":"em vez de","why not":"por que não"}},{"id":"b1-47","frame":"Travel review","framePt":"Avaliação de viagem","title":"Three days on a farm","titlePt":"Três dias numa fazenda","body":["We {spent} three days [help:ing:expr] on a small farm in Minas Gerais. The owners {let us|let someone} [milk:bare:make] the cows and pick oranges. It was {hard} [get up:to:adj] at five every morning, but breakfast was amazing. If you {like} [wake up:ing/to:like] with the birds, this is the place for you. Our kids would {love|would love} [go back:to:would] next summer!"],"pt":["A gente passou três dias ajudando numa pequena fazenda em Minas Gerais. Os donos deixaram a gente tirar leite das vacas e colher laranjas. Era difícil acordar às cinco toda manhã, mas o café da manhã era incrível. Se você gosta de acordar com os passarinhos, este é o lugar para você. Os nossos filhos adorariam voltar no próximo verão!"],"w":{"farm":"fazenda","owners":"donos","cows":"vacas","pick oranges":"colher laranjas","amazing":"incrível","birds":"passarinhos"},"cw":{"spent":"passamos","let us":"deixaram a gente","hard":"difícil","like":"gosta de","love":"would love = adorariam"}},{"id":"b1-48","frame":"Blog","framePt":"Blog","title":"All eyes on me","titlePt":"Todos os olhos em mim","body":["I always {hated|hate} [speak:ing/to:like] in front of people. Then a teacher {made me|make someone} [give:bare:make] a short presentation every week. At first I didn't even know {where} [look:to:wh]! But little by little I {got used to|get used to} [have:ing:toprep] everyone's eyes on me. Last month my boss {asked me|ask someone} [lead:to:obj] a big meeting, and I said yes."],"pt":["Eu sempre odiei falar na frente das pessoas. Aí uma professora me fez dar uma apresentação curta toda semana. No começo eu nem sabia para onde olhar! Mas aos poucos eu me acostumei a ter os olhos de todo mundo em mim. No mês passado o meu chefe me pediu para conduzir uma reunião grande, e eu disse sim."],"w":{"presentation":"apresentação","little by little":"aos poucos","eyes":"olhos","meeting":"reunião"},"cw":{"hated":"odiei","made me":"me fez","where":"onde","got used to":"me acostumei a","asked me":"me pediu"}}],"B2":[{"id":"b2-01","frame":"Personal essay","framePt":"Relato pessoal","title":"The year I quit","titlePt":"O ano em que eu parei","body":["I {stopped} [smoke:ing:quit] in 2019, and I still {remember} [throw:ing:memory] my last pack into the sea. It wasn't easy. On long drives I used to {stop} [smoke:to:pause] at every gas station. A friend told me to {try} [chew:ing:test] gum, and it actually worked. Now it's not {worth} [think:ing:expr] about anymore, but I {never forget} [thank:to:task] her when we meet."],"pt":["Eu parei de fumar em 2019, e ainda me lembro de jogar o meu último maço no mar. Não foi fácil. Em viagens longas de carro, eu costumava parar para fumar em todo posto de gasolina. Uma amiga me disse para experimentar mascar chiclete, e funcionou mesmo. Hoje nem vale mais a pena pensar nisso, mas eu nunca me esqueço de agradecer a ela quando a gente se encontra."],"w":{"pack":"maço","gas station":"posto de gasolina","gum":"chiclete","actually worked":"funcionou mesmo"},"cw":{"stopped":"parei","remember":"lembro","stop":"parar","try":"tentar","worth":"vale a pena","never forget":"nunca esqueço"},"notes":[null,null,{"en":"stop + *to* here = she stopped the car in order to smoke (*parar para fazer algo*), not quit.","pt":"stop + *to* aqui = parava o carro para fumar (*parar para fazer algo*), não parar de fumar."},{"en":"try + *-ing* = an experiment: chew gum and see if it helps. And it worked!","pt":"try + *-ing* = um teste: mascar chiclete e ver se ajuda. E funcionou!"},null,null]},{"id":"b2-02","frame":"Formal email","framePt":"E-mail formal","title":"Complaint: order #4471","titlePt":"Reclamação: pedido nº 4471","body":["Dear Customer Service, I {object to} [pay:ing:toprep] for a service I never received. Your agent {promised} [refund:to:want] the money within a week, but nothing has happened. There is {no point} [send:ing:expr] me another automatic message. I would {appreciate} [receive:ing:enjoy] a real reply by Friday; otherwise I will have {no choice but} [cancel:to:setto] my account. Sincerely, R. Mendes"],"pt":["Prezado Atendimento ao Cliente, não aceito pagar por um serviço que nunca recebi. O seu atendente prometeu devolver o dinheiro em uma semana, mas nada aconteceu. Não adianta me mandar outra mensagem automática. Eu agradeceria receber uma resposta de verdade até sexta; caso contrário, não terei outra escolha a não ser cancelar a minha conta. Atenciosamente, R. Mendes"],"w":{"agent":"atendente","within a week":"em até uma semana","otherwise":"caso contrário","account":"conta"},"cw":{"object to":"sou contra, me oponho a","promised":"prometeu","no point":"não adianta, não faz sentido","appreciate":"agradeceria","no choice but":"nenhuma escolha a não ser"},"notes":[null,null,null,{"en":"appreciate + *-ing* (I'd appreciate receiving / I'd appreciate it if…).","pt":"appreciate (agradecer) + *-ing* (I'd appreciate receiving / I'd appreciate it if…)."}]},{"id":"b2-03","frame":"Travel podcast","framePt":"Podcast de viagem","title":"Under the Northern Lights","titlePt":"Sob a aurora boreal","body":["I'll {never forget} [see:ing:memory] the Northern Lights for the first time in Norway. The cold {made} my fingers [hurt:bare:make], but I didn't care. I only {regret} not [take:ing:memory] more photos. Next time I must {remember} [charge:to:task] my camera battery before going out at night. Believe me, it's {worth} [travel:ing:expr] that far."],"pt":["Eu nunca vou esquecer de ter visto a aurora boreal pela primeira vez, na Noruega. O frio fez os meus dedos doerem, mas eu não liguei. Eu só me arrependo de não ter tirado mais fotos. Da próxima vez eu preciso lembrar de carregar a bateria da câmera antes de sair à noite. Acredite em mim, vale a pena viajar até tão longe."],"w":{"Northern Lights":"aurora boreal","fingers":"dedos","didn't care":"não liguei","battery":"bateria","that far":"até tão longe"},"cw":{"never forget":"nunca vou esquecer","made":"fez","regret":"me arrependo","remember":"lembrar","worth":"vale a pena"},"notes":[{"en":"never forget + *-ing* = a memory of the past (I saw them, and I'll always remember it).","pt":"never forget + *-ing* = lembrança do passado (eu vi, e sempre vou lembrar)."},null,{"en":"regret + not + *-ing*: I didn't take more photos, and now I'm sorry.","pt":"regret + not + *-ing*: não tirei mais fotos, e agora me arrependo."},{"en":"remember + *to* = a task still to do (charge the battery next time).","pt":"remember + *to* = uma tarefa que ainda falta fazer (carregar a bateria da próxima vez)."},null]},{"id":"b2-04","frame":"Office memo","framePt":"Comunicado interno","title":"Working from home: some tips","titlePt":"Trabalho remoto: algumas dicas","body":["Many employees tell us they {have trouble} [concentrate:ing:expr] at home. We {encourage you|encourage someone} [take:to:obj] short breaks every hour. Also, {stop} [check:ing:quit] your email every five minutes: once in the morning and once after lunch is enough. {Try} [turn off:ing:test] notifications for one afternoon and see what happens. And if you'd {rather} [work:bare:better] from the office on some days, just let us know."],"pt":["Muitos funcionários nos dizem que têm dificuldade de se concentrar em casa. Nós incentivamos vocês a fazer pausas curtas a cada hora. Além disso, parem de checar o e-mail a cada cinco minutos: uma vez de manhã e outra depois do almoço é suficiente. Experimentem desligar as notificações por uma tarde e vejam o que acontece. E se vocês preferirem trabalhar no escritório em alguns dias, é só nos avisar."],"w":{"employees":"funcionários","breaks":"pausas","once":"uma vez","notifications":"notificações","let us know":"nos avise"},"cw":{"have trouble":"têm dificuldade","encourage you":"incentivamos você","stop":"pare","Try":"tente","rather":"'d rather = prefere"},"notes":[null,null,{"en":"stop + *-ing* = don't do it any more (the habit of checking all the time).","pt":"stop + *-ing* = não fazer mais (o hábito de checar o tempo todo)."},{"en":"try + *-ing* … and see what happens = an experiment.","pt":"try + *-ing* … and see what happens = um teste."},null]},{"id":"b2-05","frame":"Story","framePt":"História","title":"The coffee we didn't pay for","titlePt":"O café que a gente não pagou","body":["Halfway to the coast, we {stopped} [buy:to:pause] coffee at a tiny café. The owner {insisted on} [give:ing:prep] us free cake, and we {couldn't help} [laugh:ing:expr] at his jokes. It was only twenty minutes later that I realized I had {forgotten|forget} [pay:to:task] for the coffee! We drove all the way back [apologize:to:purpose], and he just laughed."],"pt":["No meio do caminho para o litoral, a gente parou para comprar café num cafezinho minúsculo. O dono fez questão de dar bolo de graça para a gente, e a gente não conseguia parar de rir das piadas dele. Só vinte minutos depois eu percebi que tinha esquecido de pagar o café! A gente voltou o caminho todo para pedir desculpas, e ele só riu."],"w":{"halfway":"no meio do caminho","coast":"litoral","owner":"dono","realized":"percebi"},"cw":{"stopped":"paramos","insisted on":"fez questão de, insistiu em","couldn't help":"não conseguimos evitar","forgotten":"tinha esquecido"},"notes":[{"en":"stop + *to* = they stopped the car in order to buy coffee (*parar para fazer algo*).","pt":"stop + *to* = pararam o carro para comprar café (*parar para fazer algo*)."},null,null,{"en":"forget + *to* = a task not done: I didn't pay.","pt":"forget + *to* = uma tarefa que não foi feita: eu não paguei."},null]},{"id":"b2-06","frame":"Opinion column","framePt":"Coluna de opinião","title":"Teenagers and their phones","titlePt":"Os adolescentes e os celulares","body":["[scroll:ing:subject] through social media for hours can affect anyone's mood. Many teenagers {admit} [feel:ing:enjoy] anxious after a long evening online. However, it's {no use} [tell:ing:expr] them to just put their phones away. It's {better} [teach:to:adj] them {how} [use:to:wh] these apps wisely. After all, plenty of adults {have trouble} [put:ing:expr] their phones down too."],"pt":["Ficar rolando as redes sociais por horas pode afetar o humor de qualquer um. Muitos adolescentes admitem se sentir ansiosos depois de uma noite inteira on-line. Mas não adianta simplesmente mandar eles guardarem o celular. É melhor ensinar a eles como usar esses aplicativos com sabedoria. Afinal, muitos adultos também têm dificuldade de largar o celular."],"w":{"social media":"redes sociais","mood":"humor","put their phones away":"guardar o celular","wisely":"com sabedoria","plenty of":"muitos"},"cw":{"admit":"admitem","no use":"não adianta","better":"melhor","how":"como","have trouble":"têm dificuldade"}},{"id":"b2-07","frame":"Science news","framePt":"Notícia de ciência","title":"A warm bath for better sleep?","titlePt":"Um banho quente para dormir melhor?","body":["Researchers in Sydney {tried} [give:ing:test] volunteers a warm bath ninety minutes before bed, to see whether it made any difference. Most volunteers {reported} [fall asleep:ing:enjoy] about ten minutes faster. The effect {seems} [work:to:want] for people of all ages. {Instead of} [take:ing:prep] sleeping pills, some doctors now suggest this simple routine. The team {plans} [repeat:to:want] the study with older adults next year."],"pt":["Pesquisadores em Sydney testaram dar um banho quente a voluntários noventa minutos antes de dormir, para ver se fazia alguma diferença. A maioria dos voluntários relatou pegar no sono uns dez minutos mais rápido. O efeito parece funcionar para pessoas de todas as idades. Em vez de tomar remédio para dormir, alguns médicos agora sugerem essa rotina simples. A equipe planeja repetir o estudo com adultos mais velhos no ano que vem."],"w":{"researchers":"pesquisadores","volunteers":"voluntários","whether":"se","sleeping pills":"remédio para dormir","older adults":"adultos mais velhos"},"cw":{"tried":"tentaram, testaram","reported":"relataram","seems":"parece","Instead of":"em vez de","plans":"planeja"},"notes":[{"en":"try + *-ing* = an experiment: do it to see what happens.","pt":"try + *-ing* = um teste: fazer para ver o que acontece."},{"en":"report + *-ing*: they said they fell asleep faster.","pt":"report (relatar) + *-ing*: disseram que pegaram no sono mais rápido."},null,null,null]},{"id":"b2-08","frame":"Cover letter","framePt":"Carta de apresentação","title":"Customer experience manager","titlePt":"Gerente de experiência do cliente","body":["Dear Ms. Novak, I am {committed to} [improve:ing:toprep] the way companies treat their customers. In my current role, I {managed} [reduce:to:want] complaints by thirty percent in one year. I really {enjoy} [solve:ing:enjoy] problems as part of a team. I would welcome the {opportunity} [discuss:to:noun] my ideas with you, and I would be {happy} [provide:to:adj] references. I {look forward to} [hear:ing:toprep] from you."],"pt":["Prezada Sra. Novak, eu tenho um compromisso com melhorar a maneira como as empresas tratam os clientes. No meu cargo atual, consegui reduzir as reclamações em trinta por cento em um ano. Eu gosto muito de resolver problemas em equipe. Eu receberia com prazer a oportunidade de discutir as minhas ideias com a senhora, e teria prazer em fornecer referências. Aguardo o seu retorno."],"w":{"treat":"tratam","current role":"cargo atual","complaints":"reclamações","references":"referências"},"cw":{"committed to":"comprometido com","managed":"consegui","enjoy":"gosto, curto","opportunity":"oportunidade","happy":"feliz","look forward to":"aguardo"},"notes":[{"en":"be committed to + *-ing*: here *to* is a preposition (committed to the project).","pt":"be committed to + *-ing*: aqui *to* é preposição (committed to the project)."},null,null,null,null,null]},{"id":"b2-09","frame":"Diary","framePt":"Diário","title":"Grandma's bread","titlePt":"O pão da vovó","body":["I {remember} [watch:ing:memory] my grandmother make bread every Sunday morning. She {never let me} [touch:bare:make] the dough: it was her job. Last week I finally {decided|decide} [bake:to:want] it myself, using her old notebook. [knead:ing:subject] the dough is much harder than it looks! It wasn't perfect, but I'll {keep} [practice:ing:enjoy] until mine tastes like hers."],"pt":["Eu me lembro de ver a minha avó fazer pão todo domingo de manhã. Ela nunca me deixava tocar na massa: aquele era o trabalho dela. Na semana passada eu finalmente decidi fazer o pão eu mesma, usando o caderno antigo dela. Sovar a massa é muito mais difícil do que parece! Não ficou perfeito, mas eu vou continuar praticando até o meu ficar com o gosto do dela."],"w":{"dough":"massa","notebook":"caderno","looks":"parece","tastes like hers":"fica com o gosto do dela"},"cw":{"remember":"lembro","never let me":"nunca me deixava","decided":"decidi","keep":"continuar"},"notes":[{"en":"remember + *-ing* = a memory of the past (I watched her, and I remember it).","pt":"remember + *-ing* = lembrança do passado (eu via ela, e me lembro disso)."},null,null,null,null]},{"id":"b2-10","frame":"Travel blog","framePt":"Blog de viagem","title":"Surviving long flights","titlePt":"Como sobreviver a voos longos","body":["If you can't sleep on planes, {try} [drink:ing:test] chamomile tea before boarding, and {avoid} [watch:ing:enjoy] screens for the first hour. It's {worth} [pay:ing:expr] a little more for an aisle seat, too. {Don't forget} [download:to:task] a few movies before you leave home. And when you land, resist the {urge} [nap:to:noun] until it's night: it's the best cure for jet lag."],"pt":["Se você não consegue dormir em aviões, experimente tomar chá de camomila antes do embarque, e evite olhar para telas na primeira hora. Também vale a pena pagar um pouco mais por um assento no corredor. Não esqueça de baixar alguns filmes antes de sair de casa. E quando pousar, resista à vontade de cochilar até ser noite: é a melhor cura para o jet lag."],"w":{"boarding":"embarque","screens":"telas","aisle seat":"assento no corredor","land":"pousar","nap":"cochilar"},"cw":{"try":"tente","avoid":"evite","worth":"vale a pena","Don't forget":"não esqueça","urge":"vontade forte"},"notes":[{"en":"try + *-ing* = an experiment: drink the tea and see if it helps you sleep.","pt":"try + *-ing* = um teste: tome o chá e veja se te ajuda a dormir."},null,null,null,{"en":"the urge + *to + verb*: noun + to says what the urge is for.","pt":"the urge (a vontade) + *to + verbo*: substantivo + to diz de que é a vontade."}]},{"id":"b2-11","frame":"Graduation speech","framePt":"Discurso de formatura","title":"To the class of 2026","titlePt":"Para a turma de 2026","body":["Graduates, {instead of} [fear:ing:prep] failure, learn from it. Never {stop} [ask:ing:quit] questions, even when people roll their eyes. I {regret} not [travel:ing:memory] more when I was your age, so don't {let} fear [decide:bare:make] for you. And please, {remember} [call:to:task] your parents tonight: they're very proud of you."],"pt":["Formandos, em vez de ter medo do fracasso, aprendam com ele. Nunca parem de fazer perguntas, mesmo quando as pessoas revirarem os olhos. Eu me arrependo de não ter viajado mais quando tinha a idade de vocês, então não deixem o medo decidir por vocês. E, por favor, lembrem-se de ligar para os seus pais hoje à noite: eles estão muito orgulhosos de vocês."],"w":{"graduates":"formandos","failure":"fracasso","roll their eyes":"reviram os olhos","proud":"orgulhosos"},"cw":{"instead of":"em vez de","stop":"parem","regret":"me arrependo","let":"deixem","remember":"lembrem"},"notes":[null,{"en":"never stop + *-ing* = keep doing it forever.","pt":"never stop + *-ing* = continuar fazendo sempre."},null,null,null]},{"id":"b2-12","frame":"Product review","framePt":"Avaliação de produto","title":"Worth every penny","titlePt":"Vale cada centavo","body":["At first I {considered} [return:ing:enjoy] these headphones, because they felt tight. It took me a week to {get used to} [wear:ing:toprep] them, but now I barely notice them. The battery {seems} [last:to:want] forever, and the noise canceling {lets you} [focus:bare:make] completely, even on the subway. There's {no point} [buy:ing:expr] the more expensive model: this one does everything."],"pt":["No começo eu pensei em devolver estes fones, porque ficavam apertados. Levei uma semana para me acostumar a usar, mas agora eu quase nem percebo. A bateria parece durar para sempre, e o cancelamento de ruído deixa você se concentrar totalmente, até no metrô. Não faz sentido comprar o modelo mais caro: este faz tudo."],"w":{"headphones":"fones de ouvido","tight":"apertados","barely notice":"quase nem percebo","noise canceling":"cancelamento de ruído","subway":"metrô"},"cw":{"considered":"pensei em, considerei","get used to":"me acostumar a","seems":"parece","lets you":"deixa você, permite","no point":"não adianta, não faz sentido"}},{"id":"b2-13","frame":"News","framePt":"Notícia","title":"The missing painting","titlePt":"O quadro desaparecido","body":["A painting worth two million dollars has disappeared from a small museum in Lyon. The thief {seems|seem} [enter~have entered:toperf:perfto] through a window in the roof. A guard {claims|claim} [see~have seen:toperf:perfto] a man in a black coat at midnight, but nobody else noticed anything. The director {denied|deny} [ignore~have ignored:ingperf/ing:perfing/enjoy] earlier warnings about security. Police {expect} it [find~be found:topass:passto] within weeks, because it is {too} famous [sell:to:adj]."],"pt":["Um quadro avaliado em dois milhões de dólares desapareceu de um pequeno museu em Lyon. O ladrão parece ter entrado por uma janela no telhado. Um segurança diz ter visto um homem de casaco preto à meia-noite, mas ninguém mais notou nada. O diretor negou ter ignorado avisos anteriores sobre a segurança. A polícia espera que o quadro seja encontrado em poucas semanas, porque ele é famoso demais para ser vendido."],"w":{"painting":"quadro","thief":"ladrão","roof":"telhado","guard":"segurança, vigia","warnings":"avisos","within weeks":"em poucas semanas"},"cw":{"seems":"parece","claims":"diz, afirma","denied":"negou","expect":"espera","too":"famoso demais"},"notes":[null,null,{"en":"Both work: *having ignored* makes it clear it happened first; *ignoring* is also fine.","pt":"As duas servem: *having ignored* deixa claro que aconteceu antes; *ignoring* também está certo."},null,null]},{"id":"b2-14","frame":"Formal letter","framePt":"Carta formal","title":"Your application","titlePt":"A sua candidatura","body":["Dear Mr. Patel, we {regret} [inform:to:regretto] you that the position has been filled. We truly appreciate {your} [take:ing:possing] the time to apply. {In addition to} [have:ing:toprep] strong experience, you gave an excellent interview. If you would {like|would like} [consider~be considered:topass:passto] for future roles, please reply to this email. We {hope} [hear:to:want] from you again."],"pt":["Prezado Sr. Patel, lamentamos informar que a vaga já foi preenchida. Agradecemos muito por você ter dedicado o seu tempo à candidatura. Além de ter uma experiência sólida, você fez uma ótima entrevista. Se você quiser ser considerado para futuras vagas, por favor responda a este e-mail. Esperamos ter notícias suas de novo."],"w":{"position":"vaga","has been filled":"foi preenchida","apply":"se candidatar","future roles":"futuras vagas"},"cw":{"regret":"lamentamos","your":"o seu (você ter…)","In addition to":"além de","like":"would like = gostaria","hope":"esperamos"}},{"id":"b2-15","frame":"Story","framePt":"História","title":"The wrong train","titlePt":"O trem errado","body":["Last spring I {meant|mean} [visit:to:meanto] my cousin in Porto, but I fell asleep on the train. I woke up when I {heard|hear} someone [call:bare:seebare] my name twice. It was the conductor: we were in Vigo, in Spain! Getting back to Porto {meant|mean} [wait:ing:meaning] three hours for the next train. From the platform I could {see} people [swim:ing:seeing] in the river. {All I could do was} [laugh:bare/to:allwas]."],"pt":["Na primavera passada eu pretendia visitar a minha prima no Porto, mas dormi no trem. Acordei quando ouvi alguém chamar o meu nome duas vezes. Era o fiscal: a gente estava em Vigo, na Espanha! Voltar para o Porto significou esperar três horas pelo próximo trem. Da plataforma eu via pessoas nadando no rio. Tudo o que eu podia fazer era rir."],"w":{"fell asleep":"peguei no sono","twice":"duas vezes","conductor":"fiscal, cobrador","platform":"plataforma"},"cw":{"meant":"mean = pretender / implicar","heard":"ouvi","see":"ver","All I could do was":"tudo o que eu podia fazer era"},"notes":[null,null,null,null,{"en":"Both work: All I could do was (to) laugh. Without *to* is more common.","pt":"As duas servem: All I could do was (to) laugh. Sem *to* é mais comum."}]},{"id":"b2-16","frame":"Profile","framePt":"Perfil","title":"The banker who became a chef","titlePt":"A bancária que virou chef","body":["Rosa Mendes worked in a bank for twenty years, and then she {went on|go on} [open:to:goonto] her own restaurant in Lisbon. She {admits to|admit to} [make:ing:toprep] lots of mistakes in the first year. Today she {seems|seem} [enjoy~have enjoyed:to:want] every minute in the kitchen. She is also {dedicated to} [teach:ing:toprep] young cooks. She only {regrets|regret} not [start:ing:memory] sooner."],"pt":["A Rosa Mendes trabalhou num banco por vinte anos e depois abriu o próprio restaurante em Lisboa. Ela admite ter cometido muitos erros no primeiro ano. Hoje ela parece aproveitar cada minuto na cozinha. Ela também se dedica a ensinar jovens cozinheiros. O único arrependimento dela é não ter começado antes."],"w":{"bank":"banco","kitchen":"cozinha","young cooks":"jovens cozinheiros","sooner":"antes, mais cedo"},"cw":{"went on":"go on = continuar / passar a","admits to":"admite","seems":"parece","dedicated to":"dedicada a","regrets":"se arrepende"},"notes":[null,null,null,null,{"en":"The *not* goes right before the *-ing*: not starting.","pt":"O *not* vem logo antes do *-ing*: not starting."}]},{"id":"b2-17","frame":"Home blog","framePt":"Blog de casa","title":"Before you sell your house","titlePt":"Antes de vender a sua casa","body":["Before you put your house on the market, walk around it like a buyer. Does the front door {need} [paint~be painted:ing/topass:needing/passto]? Buyers {hate} [surprise~be surprised:ingpass/topass:passing/passto] by problems on the day they visit. It's {worth} [spend:ing:expr] a little money on small repairs. During visits, {avoid} [follow~be followed:ing:enjoy] buyers from room to room: let them look around. Your home {deserves|deserve} [see~be seen:topass:passto] at its best."],"pt":["Antes de colocar a sua casa à venda, dê uma volta por ela como se fosse um comprador. A porta da frente precisa ser pintada? Os compradores odeiam ser surpreendidos por problemas no dia da visita. Vale a pena gastar um pouco de dinheiro com pequenos consertos. Durante as visitas, evite seguir os compradores de cômodo em cômodo: deixe que eles olhem à vontade. A sua casa merece ser vista no seu melhor."],"w":{"on the market":"à venda","buyer":"comprador","buyers":"compradores","front door":"porta da frente","repairs":"consertos","look around":"olhem à vontade","at its best":"no seu melhor"},"cw":{"need":"precisa","hate":"odeiam","worth":"vale a pena","avoid":"evite","deserves":"merece"},"notes":[{"en":"Both work: needs painting = needs to be painted (after need, *-ing* has a passive meaning).","pt":"As duas servem: needs painting = needs to be painted (depois de need, o *-ing* tem sentido passivo)."},{"en":"Both work: hate takes *to* or *-ing*, here in the passive: being surprised / to be surprised.","pt":"As duas servem: hate aceita *to* ou *-ing*, aqui na passiva: being surprised / to be surprised."},null,null,null]},{"id":"b2-18","frame":"Opinion column","framePt":"Coluna de opinião","title":"Cars out of the city center?","titlePt":"Carros fora do centro?","body":["Many cities now close their centers to cars {with a goal of|goal of} [reduce:ing:prep] pollution. The idea is simple: it's essential {for everyone} [breathe:to:forto] clean air. But some drivers just {resort to} [park:ing:toprep] on sidewalks nearby. Last year one Spanish city banned cars from its center, {only} [see:to:onlyto] traffic move to the next neighborhood. Still, most shop owners say they appreciate {the city's} [listen:ing:possing] to their concerns. {What we need to do is} [find:bare/to:allwas] a balance."],"pt":["Muitas cidades agora fecham o centro para os carros com o objetivo de reduzir a poluição. A ideia é simples: é essencial que todos respirem ar limpo. Mas alguns motoristas simplesmente apelam para estacionar nas calçadas ali perto. No ano passado uma cidade espanhola proibiu carros no centro, só para ver o trânsito ir para o bairro ao lado. Mesmo assim, a maioria dos lojistas diz que agradece por a prefeitura ouvir as preocupações deles. O que precisamos fazer é encontrar um equilíbrio."],"w":{"pollution":"poluição","sidewalks":"calçadas","nearby":"ali perto","banned":"proibiu","neighborhood":"bairro","shop owners":"lojistas","concerns":"preocupações","balance":"equilíbrio"},"cw":{"with a goal of":"com o objetivo de","for everyone":"para todos (que todos…)","resort to":"apelam para","only":"só (e aí, de surpresa)","the city's":"da prefeitura (a prefeitura…)","What we need to do is":"o que precisamos fazer é"},"notes":[null,null,null,null,null,{"en":"Both work: What we need to do is (to) find a balance. Without *to* is more common.","pt":"As duas servem: What we need to do is (to) find a balance. Sem *to* é mais comum."}]},{"id":"b2-19","frame":"Personal essay","framePt":"Ensaio pessoal","title":"Learning to say no","titlePt":"Aprendendo a dizer não","body":["For years I was {afraid} [say:to:afraidto] no to anyone. I was {afraid of} [lose:ing:afraidof] my friends, or {of} [see~be seen:ingpass:passing] as selfish. I {regret|regret} [agree~have agreed:ingperf/ing:perfing/memory] to so many things I didn't want to do. Then a friend {made me|make someone} [realize:bare:make] that real friends accept a no. Now, when I say no, I don't {mean} [hurt:to:meanto] anyone: I just want to be honest."],"pt":["Durante anos eu tive medo de dizer não para qualquer pessoa. Eu tinha medo de perder os meus amigos, ou de ser visto como egoísta. Eu me arrependo de ter aceitado tantas coisas que eu não queria fazer. Então uma amiga me fez perceber que amigos de verdade aceitam um não. Agora, quando eu digo não, não é para magoar ninguém: eu só quero ser honesto."],"w":{"selfish":"egoísta","real friends":"amigos de verdade","honest":"honesto"},"cw":{"afraid":"com medo","afraid of":"com medo de","of":"de","regret":"me arrependo","made me":"me fez","mean":"mean = querer, pretender / implicar"},"notes":[null,null,null,{"en":"Both work: *having agreed* makes it clear it happened first; *agreeing* is also fine.","pt":"As duas servem: *having agreed* deixa claro que aconteceu antes; *agreeing* também está certo."},null,null]},{"id":"b2-20","frame":"Work email","framePt":"E-mail de trabalho","title":"The new office","titlePt":"O escritório novo","body":["Dear team, I'm {glad} [announce~have announced:to:adj] that our new office is finally ready. Thank you for your patience, and I'm {sorry} [keep~have kept:toperf:perfto] you waiting for so long. Everyone has {contributed to|contribute to} [make:ing:toprep] this move a success. The kitchen is {expected|be expected} [finish~be finished:topass:passto] by Friday. Until then, please {go on} [use:ing:goonin] the coffee machine on the second floor. I {look forward to} [see:ing:toprep] you all on Monday."],"pt":["Querida equipe, tenho o prazer de anunciar que o nosso novo escritório finalmente está pronto. Obrigado pela paciência, e desculpem por ter feito vocês esperarem tanto tempo. Todo mundo contribuiu para tornar esta mudança um sucesso. A previsão é que a cozinha seja concluída até sexta. Até lá, por favor continuem usando a máquina de café do segundo andar. Estou ansioso para ver todos vocês na segunda."],"w":{"ready":"pronto","patience":"paciência","move":"mudança","success":"sucesso","second floor":"segundo andar"},"cw":{"glad":"contente, feliz","sorry":"desculpe","contributed to":"contribuiu para","expected":"previsto, esperado","go on":"go on = continuar / passar a","look forward to":"estou ansioso para"}},{"id":"b2-21","frame":"Podcast","framePt":"Podcast","title":"Why we put things off","titlePt":"Por que a gente deixa tudo para depois","body":["We all know the feeling: you {mean} [start:to:meanto] a project, and then you find yourself checking your phone. The habit is {believed|be believed} [develop~have developed:toperf:perfto] as a way to avoid stress, not because we're lazy. Finishing a task early {means|mean} [give:ing:meaning] up a little fun right now. And it's hard {for most of us} [see:to:forto] a reward that's weeks away. One tip: {decide} not [check:to:want] your phone for the first hour of work. As always, we'd appreciate {your} [share:ing:possing] this episode with a friend."],"pt":["Todo mundo conhece a sensação: você pretende começar um projeto, e de repente está olhando o celular. Acredita-se que o hábito tenha surgido como uma forma de evitar o estresse, e não porque somos preguiçosos. Terminar uma tarefa cedo significa abrir mão de um pouco de diversão agora. E é difícil para a maioria de nós enxergar uma recompensa que está a semanas de distância. Uma dica: decida não olhar o celular na primeira hora de trabalho. Como sempre, agradeceríamos se você compartilhasse este episódio com um amigo."],"w":{"feeling":"sensação","find yourself checking":"se pega olhando","lazy":"preguiçosos","reward":"recompensa","weeks away":"a semanas de distância","episode":"episódio"},"cw":{"mean":"mean = querer, pretender / implicar","believed":"acredita-se","means":"mean = pretender / implicar","for most of us":"para a maioria de nós","decide":"decida","your":"o seu (você…)"},"notes":[null,null,null,null,{"en":"The *not* goes right before *to*: not to check.","pt":"O *not* vem logo antes do *to*: not to check."},null]},{"id":"b2-22","frame":"Story","framePt":"História","title":"The wallet","titlePt":"A carteira","body":["On my way home, I {saw|see} a man [pick up:bare:seebare] a wallet from the sidewalk and put it in his pocket. I followed him for three blocks, {only} [discover:to:onlyto] that the wallet was his: he had dropped it a minute before. When I explained, he {couldn't help|can't help} [laugh:ing:expr]. He {seemed|seem} [find~have found:to:want] the whole thing very funny. I was so embarrassed that I {forgot|forget} [introduce:to:task] myself!"],"pt":["No caminho para casa, eu vi um homem pegar uma carteira na calçada e colocar no bolso. Eu segui o homem por três quarteirões, só para descobrir que a carteira era dele: ele tinha deixado cair um minuto antes. Quando eu expliquei, ele não conseguiu segurar o riso. Ele pareceu achar a coisa toda muito engraçada. Eu fiquei com tanta vergonha que esqueci de me apresentar!"],"w":{"wallet":"carteira","sidewalk":"calçada","pocket":"bolso","blocks":"quarteirões","dropped":"deixado cair","embarrassed":"com vergonha"},"cw":{"saw":"vi","only":"só (e aí, de surpresa)","couldn't help":"não conseguiu evitar","seemed":"pareceu","forgot":"esqueci"}},{"id":"b2-23","frame":"Museum guide","framePt":"Guia de museu","title":"The old lighthouse","titlePt":"O farol antigo","body":["The Cabo Alto lighthouse is {said|be said} [build~have been built:toperf:perfto] in 1820 by a local fisherman. {In addition to} [guide:ing:toprep] ships, it was the village's only clock: the keeper rang a bell every hour. The keeper's daughter grew up here and {went on|go on} [become:to:goonto] a well-known painter. Today visitors {enjoy} [climb:ing:enjoy] the 200 steps to the top. Please don't {let} children [touch:bare:make] the original lamp."],"pt":["Diz-se que o farol de Cabo Alto foi construído em 1820 por um pescador local. Além de guiar os navios, ele era o único relógio da vila: o faroleiro tocava um sino a cada hora. A filha do faroleiro cresceu aqui e depois se tornou uma pintora conhecida. Hoje os visitantes adoram subir os 200 degraus até o topo. Por favor, não deixe as crianças tocarem na lâmpada original."],"w":{"lighthouse":"farol","fisherman":"pescador","ships":"navios","keeper":"faroleiro","rang a bell":"tocava um sino","steps":"degraus","lamp":"lâmpada (do farol)"},"cw":{"said":"diz-se","In addition to":"além de","went on":"go on = continuar / passar a","enjoy":"adoram, curtem","let":"deixe"}},{"id":"b2-24","frame":"Building notice","framePt":"Aviso do prédio","title":"A new elevator","titlePt":"Um elevador novo","body":["Dear residents, our building's elevator is over forty years old and {needs|need} [replace~be replaced:topass/ing:passto/needing]. Work starts on March 1, so it will be necessary {for everyone} [use:to:forto] the stairs for two weeks. The workers have {promised|promise} not [make:to:want] any noise before 9 a.m. If you {have trouble} [climb:ing:expr] stairs, please call the office and we will help. We {appreciate} {your} [understand:ing:possing]."],"pt":["Prezados moradores, o elevador do nosso prédio tem mais de quarenta anos e precisa ser substituído. A obra começa em 1º de março, então será necessário que todos usem as escadas por duas semanas. Os trabalhadores prometeram não fazer nenhum barulho antes das 9h. Se você tem dificuldade para subir escadas, por favor ligue para a administração e nós vamos ajudar. Agradecemos a sua compreensão."],"w":{"residents":"moradores","elevator":"elevador","stairs":"escadas","noise":"barulho","office":"administração"},"cw":{"needs":"precisa","for everyone":"para todos (que todos…)","promised":"prometeram","have trouble":"têm dificuldade","appreciate":"agradecemos","your":"a sua"},"notes":[{"en":"Both work: needs to be replaced = needs replacing (after need, *-ing* has a passive meaning).","pt":"As duas servem: needs to be replaced = needs replacing (depois de need, o *-ing* tem sentido passivo)."},null,{"en":"The *not* goes right before *to*: not to make.","pt":"O *not* vem logo antes do *to*: not to make."},null,null]},{"id":"b2-25","frame":"Personal essay","framePt":"Ensaio pessoal","title":"My last cup of coffee","titlePt":"A minha última xícara de café","body":["Two years ago I {stopped|stop} [drink:ing:quit] coffee for good. My doctor had {told me|tell someone} [cut down:to:obj] many times, and I finally listened. The first week {meant|mean} [live:ing:meaning] with a constant headache. Some mornings I {stopped|stop} at the café near my office [buy:to:pause] just one cup, but I always walked out with tea instead. Looking back, I only {regret} not [do:ing:memory] it sooner."],"pt":["Dois anos atrás eu parei de tomar café de vez. A minha médica tinha me dito várias vezes para diminuir, e eu finalmente ouvi. A primeira semana significou conviver com uma dor de cabeça constante. Algumas manhãs eu parei no café perto do escritório para comprar só uma xícara, mas sempre saí com um chá. Olhando para trás, eu só me arrependo de não ter feito isso antes."],"w":{"for good":"de vez","finally":"finalmente","constant headache":"dor de cabeça constante","instead":"em vez disso","Looking back":"olhando para trás","sooner":"antes"},"cw":{"stopped":"stop = parar","told me":"me disse","meant":"mean = significar / implicar","regret":"me arrependo"}},{"id":"b2-26","frame":"Formal email","framePt":"E-mail formal","title":"Flight LA208","titlePt":"Voo LA208","body":["Dear Mr. Okafor, we {regret} [inform:to:regretto] you that flight LA208 to Lagos has been canceled. Our system also {appears|appear} [send~have sent:toperf:perfto] you the wrong boarding time yesterday. Every passenger {deserves|deserve} [keep~be kept:topass:passto] informed, and this time we failed. If you would {prefer|would prefer} [travel:to:would] on another date, just {let|let someone} us [know:bare:make]. We truly appreciate {your} [understand:ing:possing]."],"pt":["Prezado Sr. Okafor, lamentamos informar que o voo LA208 para Lagos foi cancelado. O nosso sistema também parece ter enviado ao senhor o horário de embarque errado ontem. Todo passageiro merece ser mantido informado, e desta vez nós falhamos. Se o senhor preferir viajar em outra data, é só nos avisar. Agradecemos muito a sua compreensão."],"w":{"canceled":"cancelado","boarding time":"horário de embarque","passenger":"passageiro","informed":"informado","failed":"falhamos","appreciate":"agradecemos"},"cw":{"regret":"lamentamos","appears":"parece","deserves":"merece","prefer":"would prefer = preferiria","let":"deixe","your":"a sua (de você)"},"notes":[null,null,null,null,null,{"en":"*your understanding*: after a possessive, the *-ing* works like a noun (a sua compreensão).","pt":"*your understanding*: depois de um possessivo, o *-ing* funciona como substantivo (a sua compreensão)."}]},{"id":"b2-27","frame":"Science news","framePt":"Notícia de ciência","title":"Hooked on likes","titlePt":"Viciados em curtidas","body":["Researchers {tried|try} [hide:ing:test] the number of likes on a social app for a month, to see whether people would use it less. Most volunteers {tried hard|try} [cut down:to:effort], but later {admitted|admit} [check~have checked:ingperf/ing:perfing/enjoy] their phones over a hundred times a day. Experts say there's {no point} [blame:ing:expr] yourself: these apps are built [hold:to:purpose] your attention. [leave:ing:subject] your phone in another room at night is a good start."],"pt":["Pesquisadores experimentaram esconder o número de curtidas de uma rede social por um mês, para ver se as pessoas a usariam menos. A maioria dos voluntários se esforçou muito para diminuir o uso, mas depois admitiu ter checado o celular mais de cem vezes por dia. Os especialistas dizem que não adianta se culpar: esses aplicativos são feitos para prender a sua atenção. Deixar o celular em outro cômodo à noite é um bom começo."],"w":{"likes":"curtidas","social app":"rede social","volunteers":"voluntários","Experts":"especialistas","attention":"atenção","good start":"bom começo"},"cw":{"tried":"try = tentar / experimentar","tried hard":"se esforçaram muito","admitted":"admitiram","no point":"não adianta, não faz sentido"},"notes":[null,null,{"en":"Both work: *having checked* makes it clear it happened first; *checking* is also fine.","pt":"As duas servem: *having checked* deixa claro que aconteceu antes; *checking* também está certo."},null,null,null]},{"id":"b2-28","frame":"Home blog","framePt":"Blog de casa","title":"Our old house","titlePt":"A nossa casa antiga","body":["When we bought this old house, almost everything {needed|need} [fix~be fixed:ing/topass:needing/passto]. We couldn't {afford} [hire:to:want] builders for every job, so we learned a lot. Have you ever {tried|try} [remove:ing:test] old paint with a hairdryer? It works surprisingly well. The wooden floor in the hall {is believed|be believed} [come~have come:toperf:perfto] from an old ship. Last week I {watched|watch} our neighbor [take:bare:seebare] apart its rusty lock and put it back together in ten minutes."],"pt":["Quando a gente comprou esta casa antiga, quase tudo precisava de conserto. A gente não tinha dinheiro para contratar pedreiros para todo serviço, então aprendeu muito. Você já experimentou tirar tinta velha com secador de cabelo? Funciona surpreendentemente bem. Acredita-se que o piso de madeira do corredor tenha vindo de um navio antigo. Semana passada eu vi o nosso vizinho desmontar a fechadura enferrujada dele e montar de novo em dez minutos."],"w":{"builders":"pedreiros","paint":"tinta","hairdryer":"secador de cabelo","surprisingly":"surpreendentemente","wooden floor":"piso de madeira","hall":"corredor","ship":"navio","rusty lock":"fechadura enferrujada","put it back together":"montar de novo"},"cw":{"needed":"need = precisar","afford":"ter dinheiro para","tried":"try = tentar / experimentar","is believed":"acredita-se","watched":"vi, observei"},"notes":[{"en":"Both work: needed fixing = needed to be fixed (after need, *-ing* has a passive meaning).","pt":"As duas servem: needed fixing = needed to be fixed (depois de need, o *-ing* tem sentido passivo)."},null,null,null,null]},{"id":"b2-29","frame":"Story","framePt":"História","title":"Kilometer 42","titlePt":"Quilômetro 42","body":["At kilometer 35 I {tried hard|try} [keep up:to:effort] with my group, but my legs refused. Then I {saw|see} my daughter [jump:bare:seebare] over the barrier and run toward me. She {went on|go on} [run:ing:goonin] next to me, even when a steward told her to stop. As we passed the park, I could {hear} hundreds of people [cheer:ing:seeing]. I crossed the line in tears, {only} [discover:to:onlyto] that my watch had stopped at kilometer 41!"],"pt":["No quilômetro 35 eu me esforcei muito para acompanhar o meu grupo, mas as minhas pernas não obedeciam. Aí eu vi a minha filha pular a grade e correr na minha direção. Ela continuou correndo do meu lado, mesmo quando um fiscal mandou ela parar. Quando a gente passou pelo parque, eu ouvia centenas de pessoas torcendo. Cruzei a linha de chegada chorando, só para descobrir que o meu relógio tinha parado no quilômetro 41!"],"w":{"legs":"pernas","refused":"se recusaram","barrier":"grade","toward":"em direção a","steward":"fiscal","crossed the line":"cruzei a linha de chegada","in tears":"chorando","watch":"relógio"},"cw":{"tried hard":"me esforcei muito","saw":"vi","went on":"go on = continuar / passar a","hear":"ouvir","only":"só (e aí, de surpresa)"}},{"id":"b2-30","frame":"Office memo","framePt":"Memorando","title":"Before the servers change","titlePt":"Antes da troca dos servidores","body":["Hi everyone, IT {is about|be about} [replace:to:setto] all our servers, so please {remember} [back up:to:task] your files before Friday. Some of you may {remember} [lose:ing:memory] a whole week of work the last time this happened. Nobody {enjoys|enjoy} [ask~be asked:ingpass:passing] to redo a report! It's also essential {for each team} [check:to:forto] its shared folders. Thanks, Marta"],"pt":["Oi, pessoal, o TI está prestes a trocar todos os nossos servidores, então, por favor, lembrem-se de fazer backup dos seus arquivos antes de sexta. Alguns de vocês talvez se lembrem de ter perdido uma semana inteira de trabalho da última vez que isso aconteceu. Ninguém gosta de ter que refazer um relatório! Também é essencial que cada equipe verifique as suas pastas compartilhadas. Obrigada, Marta"],"w":{"servers":"servidores","files":"arquivos","whole":"inteira","redo":"refazer","essential":"essencial","shared folders":"pastas compartilhadas"},"cw":{"is about":"be about to = estar prestes a","remember":"lembrar","enjoys":"gosta de","for each team":"para cada equipe"}},{"id":"b2-31","frame":"Opinion column","framePt":"Coluna de opinião","title":"Less homework, more play","titlePt":"Menos lição, mais brincadeira","body":["[give:ing:subject] young children hours of homework does more harm than good. It's far more important {for kids} [play:to:forto] outside, and they {deserve} [give~be given:topass:passto] time to rest. Many parents {object to} [have:ing:toprep] every evening taken over by worksheets. Besides, it's {no use} [force:ing:expr] a tired child to study at nine at night. Schools should {consider} [replace:ing:enjoy] daily homework with free reading."],"pt":["Dar horas de lição de casa para crianças pequenas faz mais mal do que bem. É muito mais importante que as crianças brinquem ao ar livre, e elas merecem ganhar tempo para descansar. Muitos pais se opõem a ter todas as noites tomadas por folhas de exercícios. Além disso, não adianta forçar uma criança cansada a estudar às nove da noite. As escolas deveriam considerar trocar a lição diária por leitura livre."],"w":{"harm":"mal","rest":"descansar","taken over":"tomadas","worksheets":"folhas de exercícios","Besides":"além disso","daily":"diária","free reading":"leitura livre"},"cw":{"for kids":"para as crianças","deserve":"merecem","object to":"se opõem a","no use":"não adianta","consider":"considerar"}},{"id":"b2-32","frame":"Profile","framePt":"Perfil","title":"From the hospital to the sky","titlePt":"Do hospital para o céu","body":["Maria Lopes worked as a nurse for twelve years before she {went on|go on} [become:to:goonto] one of Brazil's first female airline captains. As a child, she had always {meant|mean} [take:to:meanto] flying lessons, but there was never enough money. Changing careers at 35 {meant|mean} [study:ing:meaning] at night and working weekends. Today she {is said|be said} [fly~have flown:toperf:perfto] over 8,000 hours. Young women often write to her [ask:to:purpose] for advice, and she {encourages them|encourage someone} [ignore:to:obj] anyone who says it's too late."],"pt":["A Maria Lopes trabalhou como enfermeira por doze anos antes de se tornar uma das primeiras comandantes de avião do Brasil. Quando criança, ela sempre teve a intenção de fazer aulas de voo, mas nunca tinha dinheiro suficiente. Mudar de carreira aos 35 significou estudar à noite e trabalhar nos fins de semana. Hoje dizem que ela já voou mais de 8.000 horas. Muitas jovens escrevem para ela para pedir conselhos, e ela as incentiva a ignorar quem diz que é tarde demais."],"w":{"nurse":"enfermeira","female":"mulheres","airline captains":"comandantes de avião","flying lessons":"aulas de voo","careers":"carreiras","advice":"conselhos"},"cw":{"went on":"go on = continuar / passar a","meant":"mean = pretender / implicar","is said":"dizem que ela","encourages them":"as incentiva"}},{"id":"b2-33","frame":"Product review","framePt":"Avaliação de produto","title":"The robot that cleans","titlePt":"O robô que limpa","body":["Setting it up was easy: {all I had to do was} [download:bare/to:allwas] the app. The dust box {needs|need} [empty~be emptied:ing/topass:needing/passto] every few days, but that takes ten seconds. My cat quickly learned to {avoid} [chase~be chased:ingpass:passing] around the living room by it. If it gets stuck under the sofa, {try} [lift:ing:test] it and putting it down somewhere else. It's {worth} [pay:ing:expr] a little more for the model that maps your home."],"pt":["Configurar foi fácil: tudo o que eu tive que fazer foi baixar o aplicativo. O depósito de pó precisa ser esvaziado a cada poucos dias, mas isso leva dez segundos. A minha gata logo aprendeu a evitar ser perseguida por ele pela sala. Se ele ficar preso embaixo do sofá, experimente levantá-lo e colocá-lo em outro lugar. Vale a pena pagar um pouco mais pelo modelo que faz o mapa da sua casa."],"w":{"Setting it up":"configurar","dust box":"depósito de pó","living room":"sala","stuck":"preso","maps":"faz o mapa de"},"cw":{"all I had to do was":"tudo o que eu tive que fazer foi","needs":"precisa","avoid":"evitar","try":"try = tentar / experimentar","worth":"vale a pena"},"notes":[{"en":"Both work: all I had to do was (to) download the app. Without *to* is more common.","pt":"As duas servem: all I had to do was (to) download the app. Sem *to* é mais comum."},{"en":"Both work: needs emptying = needs to be emptied (after need, *-ing* has a passive meaning).","pt":"As duas servem: needs emptying = needs to be emptied (depois de need, o *-ing* tem sentido passivo)."},null,null,null]},{"id":"b2-34","frame":"Diary","framePt":"Diário","title":"The offer","titlePt":"A proposta","body":["Today I was offered a job in Dublin. Part of me is {afraid of} [lose:ing:afraidof] touch with my friends here, and accepting would {mean} [leave:ing:meaning] Mom on her own. I was too {afraid} [tell:to:afraidto] her about it at dinner. Still, I don't {regret} [apply:ing:memory] for a second. I'd {rather|would rather} [try:bare:better] and fail than never know."],"pt":["Hoje me ofereceram um emprego em Dublin. Uma parte de mim tem medo de perder contato com os meus amigos daqui, e aceitar significaria deixar a mamãe sozinha. Fiquei com medo demais de contar para ela no jantar. Mesmo assim, não me arrependo nem por um segundo de ter me candidatado. Prefiro tentar e fracassar a nunca saber."],"w":{"offered":"ofereceram","touch":"contato","on her own":"sozinha","Still":"mesmo assim","fail":"fracassar"},"cw":{"afraid of":"com medo de","mean":"mean = significar / implicar","afraid":"com medo","regret":"me arrependo","rather":"would rather = preferiria"}},{"id":"b2-35","frame":"Formal letter","framePt":"Carta formal","title":"Your scholarship","titlePt":"A sua bolsa","body":["Dear Ms. Chen, congratulations {on} [choose~be chosen:ingpass:passing] for this year's Horizon Scholarship. Your essay {is said|be said} [impress~have impressed:toperf:perfto] the whole committee. {In addition to} [cover:ing:toprep] your tuition, the scholarship includes a monthly allowance. All scholars {are expected|be expected} [attend:to:want] two workshops each semester. We are {committed to} [support:ing:toprep] you in every way we can."],"pt":["Prezada Sra. Chen, parabéns por ter sido escolhida para a Bolsa Horizon deste ano. Dizem que a sua redação impressionou o comitê inteiro. Além de cobrir a sua mensalidade, a bolsa inclui uma ajuda de custo mensal. Espera-se que todos os bolsistas participem de duas oficinas por semestre. Estamos comprometidos em apoiar você de todas as formas possíveis."],"w":{"Scholarship":"bolsa de estudos","essay":"redação","committee":"comitê","tuition":"mensalidade","monthly allowance":"ajuda de custo mensal","scholars":"bolsistas","workshops":"oficinas"},"cw":{"on":"por","is said":"dizem que","In addition to":"além de","are expected":"espera-se que","committed to":"comprometidos em"}},{"id":"b2-36","frame":"Podcast","framePt":"Podcast","title":"The boring middle","titlePt":"A parte chata do meio","body":["Most people {give up|give up} [practice:ing:quit] a new skill after about two weeks. Nobody tells them {how} [deal:to:wh] with the boring middle part. There's {no point} [study:ing:expr] for five hours once a month: make the {decision} [show up:to:noun] every day, even for ten minutes. When you feel stuck, {stop|stop} for a minute [write:to:pause] down exactly what is hard. And remember: [teach:ing:subject] someone else is the fastest way to learn."],"pt":["A maioria das pessoas desiste de praticar uma habilidade nova depois de mais ou menos duas semanas. Ninguém explica a elas como lidar com a parte chata do meio. Não adianta estudar cinco horas uma vez por mês: tome a decisão de aparecer todo dia, nem que seja por dez minutos. Quando você empacar, pare um minuto para anotar exatamente o que está difícil. E lembre: ensinar outra pessoa é o jeito mais rápido de aprender."],"w":{"skill":"habilidade","boring":"chata","middle part":"parte do meio","stuck":"empacado","fastest way":"jeito mais rápido"},"cw":{"give up":"desistem de","how":"como","no point":"não adianta","decision":"decisão","stop":"stop = parar"}},{"id":"b2-37","frame":"News","framePt":"Notícia","title":"The bike that came back","titlePt":"A bicicleta que voltou","body":["A student in Utrecht reported her bike stolen, {only} [find:to:onlyto] it outside her door a week later, freshly painted. A neighbor {saw|see} a young man [lean:bare:seebare] it against the wall and walk away. The man later {admitted|admit} [borrow~have borrowed:ingperf/ing:perfing/enjoy] it for a job interview. He says he {meant|mean} [return:to:meanto] it the same day but lost his nerve. He painted it [say:to:purpose] sorry, and he got the job."],"pt":["Uma estudante em Utrecht registrou o roubo da bicicleta, só para encontrá-la na porta de casa uma semana depois, pintada de novo. Um vizinho viu um rapaz encostar a bicicleta na parede e ir embora. Mais tarde o rapaz admitiu ter pegado a bicicleta emprestada para uma entrevista de emprego. Ele diz que pretendia devolvê-la no mesmo dia, mas perdeu a coragem. Ele a pintou para pedir desculpas, e conseguiu o emprego."],"w":{"reported":"registrou","stolen":"roubada","freshly painted":"pintada de novo","against the wall":"na parede","lost his nerve":"perdeu a coragem"},"cw":{"only":"só (e aí, de surpresa)","saw":"viu","admitted":"admitiu","meant":"mean = pretender / implicar"},"notes":[null,null,{"en":"Both work: *having borrowed* makes it clear it happened first; *borrowing* is also fine.","pt":"As duas servem: *having borrowed* deixa claro que aconteceu antes; *borrowing* também está certo."},null,null]},{"id":"b2-38","frame":"Travel blog","framePt":"Blog de viagem","title":"The night train","titlePt":"O trem noturno","body":["The night train from Delhi {is supposed|be supposed} [arrive:to:setto] at seven, but it rarely does. At every station I could {hear} vendors [shout:ing:seeing] outside my window. If you can't sleep on trains, {try} [wear:ing:test] earplugs and see if it helps. I'll never {forget} [wake up:ing:memory] to the Himalayas at sunrise. I shared my compartment with a family who fed me all night, and I still feel {lucky} [meet~have met:toperf:perfto] them. I don't {regret} [choose~have chosen:ingperf/ing:perfing/memory] the slow train for a second."],"pt":["O trem noturno que sai de Délhi deveria chegar às sete, mas quase nunca chega. Em cada estação eu ouvia os vendedores gritando do lado de fora da janela. Se você não consegue dormir em trem, experimente usar protetor de ouvido e veja se ajuda. Nunca vou me esquecer de quando acordei com o Himalaia ao nascer do sol. Dividi a cabine com uma família que me deu comida a noite toda, e ainda me sinto sortudo por ter conhecido essas pessoas. Não me arrependo nem por um segundo de ter escolhido o trem lento."],"w":{"rarely":"quase nunca","vendors":"vendedores","earplugs":"protetores de ouvido","sunrise":"nascer do sol","compartment":"cabine","fed":"deu comida"},"cw":{"is supposed":"be supposed to = deveria","hear":"ouvir","try":"try = tentar / experimentar","forget":"esquecer","lucky":"sortudo, com sorte","regret":"me arrependo"},"notes":[null,null,null,null,null,{"en":"Both work: *having chosen* makes it clear it happened first; *choosing* is also fine.","pt":"As duas servem: *having chosen* deixa claro que aconteceu antes; *choosing* também está certo."}]},{"id":"b2-39","frame":"Advice column","framePt":"Coluna de conselhos","title":"Money and family","titlePt":"Dinheiro e família","body":["My sister {keeps|keep} [ask:ing:enjoy] me for money, and she never pays it back. I {can't help} [feel:ing:expr] used, but she's family.","There's nothing selfish about {your} [want:ing:possing] it back. Next time, you'd {better} [put:bare:better] the loan in writing, and {encourage her|encourage someone} [make:to:obj] a budget. If nothing changes, you may have {no choice but} [say:to:setto] no."],"pt":["A minha irmã vive me pedindo dinheiro e nunca devolve. Não consigo deixar de me sentir usada, mas ela é da família.","Não há nada de egoísta em você querer o dinheiro de volta. Da próxima vez, é melhor você colocar o empréstimo no papel e incentivar a sua irmã a fazer um orçamento. Se nada mudar, talvez você não tenha outra escolha a não ser dizer não."],"w":{"pays it back":"devolve","used":"usada","selfish":"egoísta","loan":"empréstimo","in writing":"por escrito","budget":"orçamento"},"cw":{"keeps":"vive, continua","can't help":"não consigo deixar de","your":"você (o seu)","better":"'d better = é melhor você","encourage her":"incentive ela","no choice but":"nenhuma outra escolha a não ser"}},{"id":"b2-40","frame":"Museum guide","framePt":"Guia de museu","title":"The island prison","titlePt":"A prisão da ilha","body":["This prison {is believed|be believed} [hold~have held:toperf:perfto] over 2,000 people in its first fifty years. Few prisoners ever {risked|risk} [shoot~be shot:ingpass:passing] by the guards on the walls. In 1962, three men {tried hard|try} [dig:to:effort] a tunnel with kitchen spoons, but only one got out. Despite its reputation, the prison {went on|go on} [operate:ing:goonin] until 1991. On your way out, {stop|stop} at the café [taste:to:pause] bread made with the prisoners' old recipe."],"pt":["Acredita-se que esta prisão tenha abrigado mais de 2.000 pessoas nos seus primeiros cinquenta anos. Poucos presos se arriscaram a levar um tiro dos guardas nas muralhas. Em 1962, três homens se esforçaram muito para cavar um túnel com colheres da cozinha, mas só um conseguiu sair. Apesar da fama, a prisão continuou funcionando até 1991. Na saída, pare no café para provar o pão feito com a antiga receita dos presos."],"w":{"prison":"prisão","guards":"guardas","walls":"muralhas","tunnel":"túnel","spoons":"colheres","Despite its reputation":"apesar da fama","recipe":"receita"},"cw":{"is believed":"acredita-se","risked":"se arriscaram a","tried hard":"se esforçaram muito","went on":"go on = continuar / passar a","stop":"stop = parar"}},{"id":"b2-41","frame":"Story","framePt":"História","title":"Locked out","titlePt":"Trancado do lado de fora","body":["I clearly {remember} [hear:ing:memory] the door close behind me. I had {forgotten|forget} [take:to:task] my keys off the kitchen table. My neighbor told me to {try} [slide:ing:test] a credit card into the gap and see if the lock opened. It didn't, so {all I could do was} [wait:bare/to:allwas] two hours for a locksmith. He {made me|make someone} [show:bare:make] my ID before he opened it. Next time, I'd {better} [leave:bare:better] a spare key with her!"],"pt":["Eu me lembro claramente de ouvir a porta se fechar atrás de mim. Eu tinha esquecido de pegar as chaves na mesa da cozinha. A minha vizinha me disse para experimentar passar um cartão de crédito na fresta e ver se a fechadura abria. Não abriu, então tudo o que eu pude fazer foi esperar duas horas por um chaveiro. Ele me fez mostrar o meu documento antes de abrir. Da próxima vez, é melhor eu deixar uma chave reserva com ela!"],"w":{"clearly":"claramente","gap":"fresta","lock":"fechadura","locksmith":"chaveiro","ID":"documento","spare key":"chave reserva"},"cw":{"remember":"lembrar","forgotten":"esquecido","try":"try = tentar / experimentar","all I could do was":"tudo o que eu pude fazer foi","made me":"me fez","better":"'d better = é melhor"},"notes":[null,null,null,{"en":"Both work: all I could do was
