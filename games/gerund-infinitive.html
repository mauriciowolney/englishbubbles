    if (moving) more(); else last = 0;
  }
  function ask() { dirty = true; if (!raf) raf = requestAnimationFrame(frame); }
  function more() { if (!raf) raf = requestAnimationFrame(frame); }
  document.addEventListener("pointermove", e => {
    touch = e.pointerType !== "mouse";
    if (touch && !carried()) return;
    px = e.clientX; py = e.clientY; on = true; ask();
  }, { passive: true });
  function release(e) { if (e.pointerType !== "mouse") on = false; rcache = null; ask(); }
  document.addEventListener("pointerup", release, true);
  document.addEventListener("pointercancel", release, true);
  document.documentElement.addEventListener("pointerleave", () => { on = false; ask(); });
  window.addEventListener("scroll", () => { rcache = null; if (on) ask(); }, { passive: true });
  window.addEventListener("resize", () => { rcache = null; }, { passive: true });
})();

/* 24-squash.js — squash and stretch (from Be Do Modal): a carried word stretches along the way it moves, more the
   faster (up to STRETCH longer, as much thinner across), and rounds out as the pointer slows or stops. Let go, it
   wobbles (the `scale` property, so it adds to the FLIP move home and the bob). One frame loop while it moves, writing
   only the carried word's transform (its position is left / top, 11-bonus.js). None with reduced motion.
   While a word is carried every word stops bobbing and turning (body.carrying, 14-soap.css). */
const STRETCH = .2, sq = { el: null, x: 0, y: 0, vx: 0, vy: 0, lt: 0, raf: 0 };
function sqStart(el, x, y) { sq.el = el; sq.vx = sq.vy = 0; sq.x = x; sq.y = y; sq.lt = 0; document.body.classList.add("carrying"); }
function sqMove(x, y) {
  const now = performance.now();
  if (sq.lt) { const dt = Math.max(8, now - sq.lt); sq.vx += ((x - sq.x) / dt - sq.vx) * .5; sq.vy += ((y - sq.y) / dt - sq.vy) * .5; }   // px per ms, smoothed
  sq.x = x; sq.y = y; sq.lt = now;
  if (!sq.raf) sq.raf = requestAnimationFrame(sqTick);
}
function sqTick() {
  sq.raf = 0; if (!sq.el) return;
  const v = Math.hypot(sq.vx, sq.vy), s = reduceMotion ? 0 : Math.min(STRETCH, v * .08);
  let t = "scale(1.1) rotate(-3deg)";   // the carried look at rest (13-bonus.css .w.drag)
  if (s > .004) { const a = (Math.atan2(sq.vy, sq.vx) * 180 / Math.PI).toFixed(1); t = "rotate(" + a + "deg) scale(" + (1.1 * (1 + s)).toFixed(3) + "," + (1.1 / (1 + s)).toFixed(3) + ") rotate(" + (-a) + "deg) rotate(-3deg)"; }
  sq.el.style.transform = t;
  if (performance.now() - sq.lt > 30) { sq.vx *= .8; sq.vy *= .8; }   // the pointer has stopped: round out
  if (s > .004) sq.raf = requestAnimationFrame(sqTick);
}
function sqEnd(el) {
  if (sq.raf) cancelAnimationFrame(sq.raf);
  const v = Math.hypot(sq.vx, sq.vy); sq.raf = 0; sq.el = null;
  document.body.classList.remove("carrying");
  el.style.transform = "";
  if (reduceMotion || !el.animate) return;
  const k = Math.min(1, .35 + v * .6);   // a fuller wobble after a fast move
  el.animate([{ scale: (1 + .07 * k) + " " + (1 - .07 * k) }, { scale: (1 - .045 * k) + " " + (1 + .045 * k) }, { scale: (1 + .02 * k) + " " + (1 - .02 * k) }, { scale: "1 1" }], { duration: 480, easing: "ease-out" });
}

/* 30-tour.js — guided tutorial: a welcome card, then a spotlight glides from feature to feature with a card explaining each one.
   Edit TOUR to change the steps; sel is a CSS selector for the element(s) to highlight (a list = one spotlight round all of them;
   none = centred card), alt the fallback when they are hidden. demo: true = the card shows rules.json "demo" sentences
   whose grey bubble rolls, gets tapped and goes round the cycle by itself; live: true = the first gap in the text does
   the same without stopping on its answer (only while a text is being played; it gets its own state back when the step ends).
   The id keys the translation in pt.json "tour.steps"; the EN / PT toggle switches the card language. */
const TOUR = [
  { id: "welcome", t: "<b>Doing</b> or <b>to do</b>?", x: "<b>-ing doesn't always mean an action in progress!</b> Sometimes English uses <b>-ing</b> (the gerund) where Portuguese uses the infinitive: <i><b>Nadar</b> faz bem</i> → <b>Swimming</b> is good for you. In this game we'll practice and see when that happens.<br><br>Every text has grey verb bubbles. Tap one and keep tapping: <b>to cook</b> → <b>cooking</b> (from B1 also <b>cook</b>, the verb alone). Watch:", demo: true },
  { id: "level", sel: "#levelseg", t: "Choose your level", x: "<b>A2</b>: verbs that take <b>-ing</b> and verbs that take <b>to + verb</b>; preposition + <b>-ing</b>; instructions in Portuguese.<br><b>B1</b>: a third form, just the base verb; more advanced expressions like <i>look forward to</i> and <i>used to</i>, and a Right or wrong? round.<br><b>B2+</b>: verbs whose meaning changes (<b>stop smoking</b> vs <b>stop to smoke</b>), perfect and passive forms (<b>to have done</b>, <b>being done</b>) and more bonus questions." },
  { id: "text", sel: "#card", t: "Read the whole text first", x: "For each gap, look at what comes <b>just before</b> it: a preposition? a verb like <i>enjoy</i> or <i>want</i>? Is it the subject, or does it say <b>why</b>? Tap a word with a dotted line to see what it means." },
  { id: "spot", sel: "#card .art", t: "Tap, tap, tap…", x: "Look at the first gap: grey means nothing is chosen yet. Every tap changes the form of the verb.", live: true },
  { id: "check", sel: "#checkbtn, .trywrap", t: "Check", x: "Stop each gap on the right form, then press <b>Check</b>. Right on the first check = <b>2 points</b> per gap; on a later check = 1. At A2 a wrong gap turns red and the right ones lock green." },
  { id: "clues", sel: "#hintbtn", t: "Clues", x: "Stuck? <b>Clues</b> light up the words that decide (<i>enjoy</i>, <i>without</i>, <i>made me</i>…). Hints are shared by the whole game, and every hint you save is a <b>bonus point</b>." },
  { id: "why", sel: "#card", t: "Learn why", x: "After the check, every gap gets an explanation: the rule in English and Portuguese, and the <b>Portuguese trap</b> behind it (<i>interessada em aprender</i> → interested in <b>learning</b>). Gaps marked <b>PT ≠ EN</b> are where the two languages differ." },
  { id: "pockets", sel: "#guidebtn", t: "Your list", x: "Every expression you get right on the first check goes into its group in the Guide: <i>enjoy</i> → the ones that take <b>-ing</b>, <i>decide</i> → the ones that take <b>to</b>… That's the list you really need to learn, and you build it yourself." },
  { id: "bonus", t: "Bonus rounds", x: "At <b>A2</b>, after the 3 texts comes a <b>bonus</b>: a sentence in Portuguese and its English version with gaps: drag (or tap) the word bubbles in; the extra words are the ones Portuguese tempts you to use! At <b>B1</b> the bonus is <b>Right or wrong?</b> At <b>B2+</b> there are two: <b>Which meaning?</b> (<i>stopped smoking</i> or <i>stopped to smoke</i>?) and <b>Proofreading</b> (find the 2–3 wrong forms in a text and fix them)." },
  { id: "guide", sel: "#guidebtn", t: "The guide", x: "Open the <b>Guide</b> any time: the questions to ask yourself, every rule with examples, and the classic traps for Portuguese speakers (<i>parou de fumar</i> → stopped <b>smoking</b>)." },
  { id: "score", sel: "#score", t: "Points", x: "Points for every text and bonus round, plus 1 bonus point for each hint you don't use. Perfect texts in a row build a <b>combo</b>!" },
  { id: "play", sel: "#restart", t: "More ways to play", x: "Tap <b>new game</b> for a fresh game, a 1-minute <b>quick-fire</b> challenge with single sentences, or a practice game with the texts you <b>missed</b> or <b>starred</b>." },
  { id: "lists", sel: "#listbtns", t: "Favorites and Seen", x: "Star a finished text to keep it in <b>Favorites</b>. <b>Seen</b> shows your progress and your accuracy for each rule. Find your weak spots and practice them!" }
];
const TOUR_UI = { step: "Step {n} of {total}", back: "Back", next: "Next", play: "Let's play!", close: "Close the tutorial" };
const tourEl = $("tour"), spot = $("tour-spot"), tcard = $("tour-card"), tourBtn = $("tour-btn"), tlang = $("tour-lang");
let tourI = -1, tourTr = load("ger-tour-lang") === "tr";
// Translated tour text, or null when the card is in English.
function tourL() { return (tourTr && lang().tour) || null; }
function tourUI(k) { const T = tourL(); return (T && T.ui && T.ui[k]) || TOUR_UI[k]; }

/* ---------- Live cycle demo ---------- */
let demoT = [], demoLive = null;
const DEMO = /\[([a-z][a-z' -]*):(to|ing|bare):([a-z0-9]+)\]/;
const demoSpot = d => { const m = DEMO.exec(d.en); return spotInfo(m[1], m[2], m[3], false, nForms(G.level)); };
// The demo sentence(s) (rules.json "demo"; one for now), each with a bubble and a caption, no title.
function tourExamples() {
  return '<ul class="tour-ex">' + DATA.rules.demo.map((d, k) => {
    const m = DEMO.exec(d.en), sp = demoSpot(d);
    const en = esc(d.en.slice(0, m.index)) + '<span class="demo-w"><span class="art demo" data-k="' + k + '" ' + soapVars() + ">" + SOAP + spotWord(sp) + dots(sp) + '</span><span class="finger" aria-hidden="true">👆</span></span>' + esc(d.en.slice(m.index + m[0].length));
    return '<li><span class="demo-cap" data-k="' + k + '"></span>' +
      '<span lang="en" class="demo-s">' + en + "</span>" + (tourL() ? '<span class="tour-tr">' + esc(d.pt) + "</span>" : "") + "</li>";
  }).join("") + "</ul>";
}
// Play el by itself: grey, then a tap picks "to …" and each later tap moves one step until the right one, which
// glows; then again. cap (optional) shows "tap n: …" and then the ✓. free = never stop on the right one (a
// text being played must not give its answer away): four taps, then grey again.
function demoRun(el, sp, cap, delay = 0, free = false) {
  const fin = el.parentNode.querySelector(".finger"), name = st => sp.forms[st], n = sp.forms.length;
  const grey = () => {
    el.classList.remove("right"); paintSpot(el, sp, -1);
    if (cap) cap.textContent = "";
    demoT.push(setTimeout(() => tap(0, 1), ROLL_MS));   // the same pace as the real gaps
  };
  const tap = (st, k) => {
    const right = !free && isRight(sp, st);
    paintSpot(el, sp, st); el.classList.toggle("right", right);
    if (!reduceMotion) flash(el, "pop"); if (fin) flash(fin, "tap");
    tone(CYCLE_TONES[st], 0, .1, .025, 0, true);
    if (cap) cap.textContent = right ? "✓ " + name(st) : (tourL() ? "toque " : "tap ") + k + ": " + name(st);
    if (right) { tone(987.77, .12, .3, .03, 0, true); demoT.push(setTimeout(grey, 2200)); }
    else demoT.push(setTimeout(() => free && k >= n ? grey() : tap((st + 1) % n, k + 1), 950));
  };
  demoT.push(setTimeout(grey, delay));
}
function demoStop() {
  demoT.forEach(clearTimeout); demoT = [];
  // The real gap gets its own state back.
  if (demoLive) { const { el, i } = demoLive; demoLive = null; if (G.r && G.r.spotEls[i] === el) { el.classList.remove("right"); paintSpot(el, G.r.P.spots[i], G.r.st[i]); } }
}
function demoStart(st) {
  demoStop();
  if (st.demo) tcard.querySelectorAll(".art.demo").forEach((el, k) => {
    demoRun(el, demoSpot(DATA.rules.demo[+el.dataset.k]), tcard.querySelector('.demo-cap[data-k="' + el.dataset.k + '"]'), 400 + k * 450);
  });
  if (st.live && G.phase === "play" && G.r) {
    const i = G.r.st.findIndex((x, n) => x < 0 && !G.r.lock[n]), el = G.r.spotEls[i];
    if (el) { demoLive = { el, i }; demoRun(el, G.r.P.spots[i], null, 450, true); }
  }
}

/* ---------- Steps ---------- */
// auto = the first visit's automatic opening: it doesn't count, so the button pulses on later visits until the player opens it.
function tourOpen(auto) {
  // Card language: the player's last choice, else Portuguese at levels with translated instructions (A2).
  if (!load("ger-tour-lang")) tourTr = nativeUi();
  tourI = 0; tourEl.hidden = false; store("ger-tour", auto === true && load("ger-tour") !== "1" ? "auto" : "1"); if (auto !== true) tourBtn.classList.remove("fresh");
  $("tour-dots").innerHTML = TOUR.map(() => "<span></span>").join("");
  tlang.hidden = !lang().tour; tlang.lastChild.textContent = lang().badge; tlang.lastChild.lang = "pt";
  // No glide until Next / Back (.glide in the CSS), so the first card pops in where it belongs instead of flying in.
  tourEl.classList.remove("glide");
  tourShow();
  $("tour-next").focus({ preventScroll: true });
}
function tourClose() { demoStop(); tourEl.hidden = true; tourI = -1; tourBtn.focus({ preventScroll: true }); }
// The elements step st highlights: those of sel that are visible, else those of alt (null when none).
function tourTgt(st) {
  const vis = q => q ? [...document.querySelectorAll(q)].filter(el => el.getClientRects().length) : [];
  const a = vis(st.sel), els = a.length ? (st.sel === "#card .art" ? a.slice(0, 1) : a) : vis(st.alt);
  return els.length ? els : null;
}
// One box round all the highlighted elements.
function tourRect(els) {
  const rs = els.map(el => el.getBoundingClientRect()), left = Math.min(...rs.map(r => r.left)), top = Math.min(...rs.map(r => r.top));
  const right = Math.max(...rs.map(r => r.right)), bottom = Math.max(...rs.map(r => r.bottom));
  return { left, top, right, bottom, width: right - left, height: bottom - top };
}
// Fill the card for step tourI; anim = false when only the language changed.
function tourShow(anim = true) {
  const st = TOUR[tourI], T = tourL(), tt = (T && T.steps && T.steps[st.id]) || st, tgt = tourTgt(st);
  tcard.lang = T ? "pt" : "en";
  tlang.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String((b.dataset.tl === "tr") === !!T)));
  $("tour-step").textContent = tourUI("step").replace("{n}", tourI + 1).replace("{total}", TOUR.length);
  $("tour-title").innerHTML = tt.t; $("tour-text").innerHTML = tt.x + (st.demo ? tourExamples() : "");
  $("tour-back").hidden = tourI === 0; $("tour-back").textContent = tourUI("back");
  $("tour-next").textContent = tourUI(tourI === TOUR.length - 1 ? "play" : "next");
  $("tour-x").setAttribute("aria-label", tourUI("close"));
  [].forEach.call($("tour-dots").children, (d, i) => { d.className = i === tourI ? "on" : i < tourI ? "done" : ""; });
  if (anim) { tcard.classList.remove("in"); void tcard.offsetWidth; tcard.classList.add("in"); }
  if (tgt) tourReveal(tgt);
  tourPlace(); demoStart(st);
}
// Scroll (at once, so the card is placed from where the target ends up) until the targets show in full: below the
// sticky header, above the bottom edge. scrollIntoView("nearest") put targets near the top, such as the score and
// new-game tiles, right under the header on phones once an earlier step had scrolled down (from Word Family Bubbles).
// The header's own buttons always show; several targets are revealed as one box.
function tourReveal(els) {
  const dock = document.querySelector(".dock");
  els = els.filter(el => !(dock && dock.contains(el)));
  if (!els.length) return;
  const stuck = dock && /sticky|fixed/.test(getComputedStyle(dock).position);
  const top = (stuck ? dock.getBoundingClientRect().bottom : 0) + 12, bottom = innerHeight - 12, r = tourRect(els);
  const dy = r.top < top ? r.top - top : r.bottom > bottom ? Math.min(r.bottom - bottom, r.top - top) : 0;
  if (dy) scrollBy(0, dy);
}
function tourPlace() {
  if (tourI < 0) return;
  const tgt = tourTgt(TOUR[tourI]), vw = innerWidth, vh = innerHeight, cw = tcard.offsetWidth, ch = tcard.offsetHeight, pad = 8;
  spot.classList.toggle("none", !tgt);
  if (!tgt) { Object.assign(spot.style, { left: vw / 2 + "px", top: vh / 2 + "px", width: "0px", height: "0px" }); Object.assign(tcard.style, { left: (vw - cw) / 2 + "px", top: Math.max(12, (vh - ch) / 2) + "px" }); return; }
  const r = tourRect(tgt);
  Object.assign(spot.style, { left: r.left - pad + "px", top: r.top - pad + "px", width: r.width + pad * 2 + "px", height: r.height + pad * 2 + "px" });
  let top = r.bottom + pad + 14;
  if (top + ch > vh - 12) top = r.top - pad - 14 - ch;
  if (top < 12) top = Math.max(12, vh - ch - 12);
  const left = Math.min(Math.max(r.left + r.width / 2 - cw / 2, 12), vw - cw - 12);
  Object.assign(tcard.style, { left: left + "px", top: top + "px" });
}
function tourGo(d) { const n = tourI + d; if (n < 0) return; if (n >= TOUR.length) return tourClose(); tourI = n; tourEl.classList.add("glide"); tourShow(); tone(523.25 + d * 60, 0, .1, .03, 0, true); }
backLayer(tourEl, () => !tourEl.hidden, tourClose);   // the back gesture closes it (07-back.js)
tourBtn.addEventListener("click", tourOpen);
$("tour-next").addEventListener("click", () => tourGo(1));
$("tour-back").addEventListener("click", () => tourGo(-1));
$("tour-x").addEventListener("click", tourClose);
tlang.addEventListener("click", e => {
  const b = e.target.closest("button[data-tl]"); if (!b) return;
  tourTr = b.dataset.tl === "tr"; store("ger-tour-lang", b.dataset.tl); tourShow(false);
});
document.addEventListener("keydown", e => {
  if (tourEl.hidden) return;
  if (e.key === "Escape") tourClose(); else if (e.key === "ArrowRight") tourGo(1); else if (e.key === "ArrowLeft") tourGo(-1); else return;
  e.preventDefault();
});
window.addEventListener("resize", tourPlace);
if (load("ger-tour") === "auto") tourBtn.classList.add("fresh");   // it only opened by itself so far: pulse until the player opens it

/* 99-main.js — boot: restore the saved level and start a game. */
(function boot() {
  let l = load("ger-level");
  if (!DATA.levels[l]) l = Object.keys(DATA.levels)[0];
  setLevelUI(l);
  newGame(l);
  // First visit: the tutorial starts with its welcome card.
  if (!load("ger-tour")) setTimeout(function () { tourOpen(true); }, 700);
})();
</script>

  background: radial-gradient(120% 140% at 22% 14%, rgba(255,255,255,.95), rgba(255,255,255,.5) 55%, rgba(255,255,255,.25));
  box-shadow: inset 0 0 10px hsla(var(--eb-h), 95%, 80%, .45), 0 4px 10px rgba(60,70,140,.16);
  color: var(--ink, #26385c); font: 600 .85rem/1 "Fredoka", ui-rounded, system-ui, sans-serif; letter-spacing: .01em;
  text-decoration: none; cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease;
}
.eb-home svg { width: 18px; height: 18px; flex: none; }
.eb-home:hover, .eb-home:focus-visible { transform: translateY(-2px) scale(1.05); box-shadow: inset 0 0 14px hsla(var(--eb-h), 95%, 80%, .6), 0 8px 16px rgba(60,70,140,.2); }
.eb-home:active { transform: scale(.94); }
.eb-home:focus-visible { outline: 2px solid #e0558a; outline-offset: 3px; }
.eb-home.eb-float { position: fixed; z-index: 2147483000; left: calc(env(safe-area-inset-left, 0px) + 10px); top: calc(env(safe-area-inset-top, 0px) + 10px); }
@media (max-width: 640px) { .eb-home { padding: 0; width: 34px; } .eb-home span { display: none; } }
/* tight mode (only when the button would otherwise add a row to the header): a little less space between controls */
.eb-tight:not(.eb-home) { column-gap: 4px !important; }
.eb-home.eb-tight { width: 30px; min-width: 30px; height: 30px; padding: 0; }
.eb-home.eb-tight span { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .eb-home { background: radial-gradient(120% 140% at 22% 14%, rgba(255,255,255,.22), rgba(255,255,255,.08)); border-color: hsla(var(--eb-h), 70%, 70%, .55); }
}
:root[data-theme="dark"] .eb-home { background: radial-gradient(120% 140% at 22% 14%, rgba(255,255,255,.22), rgba(255,255,255,.08)); border-color: hsla(var(--eb-h), 70%, 70%, .55); }
@media (prefers-reduced-motion: reduce) { .eb-home { transition: none; } }
</style>
<script>
(function () {
  var MENU = "../index.html";
  var a = document.createElement("a");
  a.className = "eb-home";
  a.href = MENU;
  a.title = "All games · Todos os jogos";
  a.setAttribute("aria-label", "All games");
  // a simple house (2026-11-22, the user: "more reminiscent of home"; it was four little bubbles)
  a.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<path d="M3.5 11.2 12 4l8.5 7.2"/><path d="M6 9.4V19a1 1 0 0 0 1 1h3.6v-5.2h2.8V20H17a1 1 0 0 0 1-1V9.4"/></svg><span>Games</span>';
  // Back to the menu: if we came from it, go back (so the phone's back button doesn't return here); else open it.
  a.addEventListener("click", function (e) {
    e.preventDefault();
    var from = null;
    try { from = sessionStorage.getItem("eb-from-menu"); sessionStorage.removeItem("eb-from-menu"); } catch (x) {}
    var back = from === "gerund-infinitive" && history.length > 1;
    try { sessionStorage.setItem("eb-back", "1"); } catch (x) {}         // the menu skips its entrance animation
    document.documentElement.classList.add("eb-leaving");
    var go = function () { if (back) history.back(); else location.href = MENU; };
    // The menu's "open a game" pop + chime, played through the game's own tone() (so the game's volume and mute
    // apply); then leave once it has been heard.
    if (typeof tone === "function") {
      try { tone(900, 0, .07, .11, 420); tone(783.99, .03, .22, .1, 0, true); tone(1174.66, .07, .3, .07, 0, true); } catch (x) {}
      setTimeout(go, 240);
    } else go();
  });
  // In the game's header (the "dock"). The header must never get an extra row because of this button (phones: at
  // most two rows, the user's rule, 2026-11-17). So every place is tried, in order of preference: before the level
  // pills, right after them, then before / after each control, then inside a group of buttons (Verb Wheel's
  // .tools); the place that gives the shortest header wins (the first one on a tie). If every place still adds a
  // row, "tight" mode narrows the gaps between the header's controls and the button a little, and tries again.
  var dock = document.querySelector("header.dock, .dock");
  var tightened = [];
  function height() { return dock.getBoundingClientRect().height; }
  function spots() {
    var out = [], kids = [], i, c, lv = dock.querySelector(":scope > #levelseg");
    for (i = 0; i < dock.children.length; i++) if (dock.children[i] !== a) kids.push(dock.children[i]);
    if (lv) { out.push([dock, lv]); out.push([dock, lv.nextElementSibling === a ? a.nextElementSibling : lv.nextElementSibling]); }
    for (i = 0; i < kids.length; i++) out.push([dock, kids[i]]);
    out.push([dock, null]);
    for (i = 0; i < kids.length; i++) {
      c = kids[i];
      if (/\b(seg|swwrap|volwrap|lang|sw)\b/.test(c.className) || c.getAttribute("role") === "group") continue;
      var d = getComputedStyle(c).display;
      if ((d === "flex" || d === "inline-flex") && c.querySelectorAll(":scope > button").length >= 2) {
        out.push([c, c.firstElementChild]); out.push([c, null]);
      }
    }
    return out;
  }
  function best() {
    var s = spots(), win = null, h = Infinity, i, hi;
    for (i = 0; i < s.length; i++) {
      if (s[i][1] === a) continue;
      s[i][0].insertBefore(a, s[i][1]);
      hi = height();
      if (hi < h - 2) { h = hi; win = s[i]; }
    }
    win[0].insertBefore(a, win[1]);
    return h;
  }
  function tight(on) {
    tightened.forEach(function (el) { el.classList.remove("eb-tight"); });
    tightened = on ? [dock, a, a.parentNode] : [];
    tightened.forEach(function (el) { el.classList.add("eb-tight"); });
  }
  function place() {
    tight(false);
    var at = a.parentNode ? [a.parentNode, a.nextSibling] : null;
    if (a.parentNode) a.parentNode.removeChild(a);
    var base = height();                                     // the header as the game made it
    if (at) at[0].insertBefore(a, at[1]); else dock.appendChild(a);
    if (best() <= base + 4) return;
    tight(true);
    if (best() <= base + 4) return;
    tight(false); best();                                    // nothing helps: keep the normal look
  }
  if (dock) {
    // the slide-in has ended: the header gets its frosted blur back
    dock.addEventListener("animationend", function (e) { if (e.animationName === "eb-dock-in") document.documentElement.classList.remove("eb-arrive"); });
    setTimeout(function () { document.documentElement.classList.remove("eb-arrive"); }, 1500);   // in case it never ran
    place();
    var t = 0;
    window.addEventListener("resize", function () { clearTimeout(t); t = setTimeout(place, 150); });
    window.addEventListener("load", place);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
  } else { a.classList.add("eb-float"); document.body.appendChild(a); }

  // back here with the phone's Forward (or from the page cache): undo the fade
  window.addEventListener("pageshow", function () { document.documentElement.classList.remove("eb-leaving"); });

  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(function () {});
  }
})();
</script>
