<!DOCTYPE html>

<meta charset="utf-8">
<!-- English Bubbles app (added by the app's build.py, not part of the game's own files) -->
<script>
/* early-theme.js — runs in <head>, before the first paint, in the menu AND in every game: puts on the background
   colour saved in eb-bg (the games' palettes, "p:sky" or "c:#7aa7ff"), so a page never flashes its default colour
   first. The page's own 01-theme.js applies the same colour again a moment later. Keep PAL in step with PALETTES
   (src/js/01-theme.js and the games). */
(function () {
  try {
    var PAL = {
      sky: ["#e4f3fb", "#f1e8fb", "#fdf0e6", 0], peach: ["#ffe6d8", "#ffd6e4", "#fff1c9", 0],
      mint: ["#d9f4e6", "#d3eef6", "#eef6d3", 0], lilac: ["#e9e0fb", "#f7d9ee", "#dbe6fb", 0],
      dusk: ["#2a1740", "#58224f", "#1f3560", 1], midnight: ["#141964", "#441464", "#144e64", 1]
    };
    var s = Storage.prototype.getItem.call(window.localStorage, "eb-bg") || "", c = null;
    if (s.indexOf("p:") === 0) c = PAL[s.slice(2)] || null;
    else if (/^c:#[0-9a-f]{6}$/i.test(s)) {
      var hex = s.slice(2), r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255,
        b = parseInt(hex.slice(5, 7), 16) / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b),
        l = (mx + mn) / 2, h = 0, sat = 0, d = mx - mn;
      if (d) {
        sat = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
        h = (mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) * 60;
      }
      var col = function (dh) { return "hsl(" + ((h + dh + 360) % 360).toFixed(0) + "," + (sat * 100).toFixed(0) + "%," + (l * 100).toFixed(0) + "%)"; };
      c = [col(0), col(40), col(-40), l * 100 < 52];
    }
    if (c) {
      var root = document.documentElement;
      root.style.setProperty("--bg-a", c[0]); root.style.setProperty("--bg-b", c[1]); root.style.setProperty("--bg-c", c[2]);
      root.dataset.theme = c[3] ? "dark" : "light";
    }
  } catch (e) {}
  // The phone's bars (theme-color) follow the background: its top colour --bg-a, set here or later by the page's own
  // colour picker (menu or game: both write --bg-a on <html>). No colour chosen: the default light / dark ones.
  try {
    var html = document.documentElement, last = "";
    var bar = function () {
      var a = html.style.getPropertyValue("--bg-a").trim(), m = document.querySelectorAll('meta[name="theme-color"]');
      for (var i = 0; i < m.length; i++) {
        var v = a || (/dark/.test(m[i].media) ? "#141964" : "#e4f3fb");
        if (m[i].content !== v) m[i].content = v;
      }
      last = a;
    };
    bar();
    document.addEventListener("DOMContentLoaded", bar);
    new MutationObserver(function () {
      if (html.style.getPropertyValue("--bg-a").trim() !== last) bar();
    }).observe(html, { attributes: true, attributeFilter: ["style"] });
  } catch (e) {}
})();

/* iPhone / iPad: ask for a "playback" audio session, so the game's sounds play even with Silent mode on (iOS 17+;
   some games already do this themselves). Websites can't detect Silent mode, so the menu also shows a tip. */
try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
document.documentElement.classList.add("eb-arrive");   /* the header slides in (see the style below) */
</script>
<style>
/* A soft cross-fade between the menu and the games (Chrome; other browsers just switch). Both pages opt in. */
@media (prefers-reduced-motion: no-preference) {
  @view-transition { navigation: auto; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .25s; animation-timing-function: ease-out; }
}
/* The header slides down in from the top when a page arrives (html.eb-arrive, set in <head>, removed when the slide
   ends). It is the real header that moves, not a view-transition snapshot: a snapshot can't show the frosted-glass
   blur (a flat bar showed on PC) and was choppy on Android. The blur is off only while it moves (it is the costly
   part); it returns when the slide ends. */
@media (prefers-reduced-motion: no-preference) {
  html.eb-arrive header.dock { animation: eb-dock-in .48s cubic-bezier(.22,1,.36,1) both; will-change: transform, opacity;
    -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
}
@keyframes eb-dock-in { from { transform: translateY(calc(-100% - 28px)); opacity: 0; } }
/* Leaving with the Games button: the game fades away completely while its sound plays, leaving only its background,
   which is the menu's colour too; the menu then fades in on top. (Half-faded, the page froze on a dim picture while
   the menu loaded: "laggy".) */
html.eb-leaving body { opacity: 0; transition: opacity .22s ease-in; pointer-events: none; }
</style>
<script>
/* Every game saves its progress in the phone's storage. In the app all games share one storage, so each game's
   keys get the prefix "eb:gerund-infinitive:" here; two games can then use the same key names without overwriting each other.
   One exception: the background colour (every game saves it as "<prefix>-bg", e.g. "p:sky" or "c:#7aa7ff", like
   the menu) is ONE setting for the whole app, kept under the menu's key "eb-bg": the game opens with the colour
   chosen in the menu, and a colour chosen in a game becomes the menu's and the other games' too. */
(function () {
  try {
    var P = "eb:gerund-infinitive:", L = window.localStorage, S = Storage.prototype, BG = /^[a-z]+-bg$/;
    var get = S.getItem, set = S.setItem, del = S.removeItem;
    /* The EN / PT toggles too: ONE language for the whole app, the menu's (eb-lang). Each game saves its toggles
       under its own keys, with its own word for Portuguese (games.json "lang": "pt", "tr" or "native"; English is
       always "en"): reading one gives the menu's language, and a tap in a game changes the menu's and every
       game's. Until EN / PT is chosen, the menu's own rule: Portuguese for My level All / A1 / A2, English from B1. */
    var LG = {"ger-guide-lang": "pt", "ger-tour-lang": "tr"};
    function appLang() {
      var l = get.call(L, "eb-lang");
      if (l === "en" || l === "pt") return l;
      var lv = get.call(L, "eb-level");
      return lv === "B1" || lv === "B2+" ? "en" : "pt";
    }
    S.getItem = function (k) {
      if (this === L && BG.test(k)) { var app = get.call(this, "eb-bg"); if (app) return app; }
      if (this === L && LG.hasOwnProperty(k)) return appLang() === "en" ? "en" : LG[k];
      return get.call(this, this === L ? P + k : k);
    };
    S.setItem = function (k, v) {
      if (this === L && BG.test(k)) set.call(this, "eb-bg", v);
      if (this === L && LG.hasOwnProperty(k)) set.call(this, "eb-lang", String(v) === "en" ? "en" : "pt");
      return set.call(this, this === L ? P + k : k, v);
    };
    S.removeItem = function (k) { return del.call(this, this === L ? P + k : k); };
    /* Opened from the menu (a card or Continue)? Then the game starts at the menu's level ("My level"): the menu
       leaves a one-time note (sessionStorage eb-level-go), and the matching level is saved under the game's own
       level key before the game reads it (games.json "level"; the nearest level when the game doesn't have it).
       With "All" on the menu, or on a reload, the game keeps its own last level. */
    var LV = {"key": "ger-level", "A1": "A2", "A2": "A2", "B1": "B1", "B2+": "B2"}, SS = window.sessionStorage;
    if (SS.getItem("eb-level-go") === "gerund-infinitive") {
      SS.removeItem("eb-level-go");
      var m = get.call(L, "eb-level");
      if (LV && LV[m]) set.call(L, P + LV.key, LV[m]);
    }
  } catch (e) {}
})();
</script>

  margin: 14px auto 0;
  padding: 6px 8px;
  border-radius: 28px;
  background: var(--dock-bg);
  border: 1px solid var(--dock-line);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  backdrop-filter: blur(14px) saturate(1.4);

}
.seg { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; max-width: 100%; }

/* Score, progress, tiles, CTA (from template 2) */

.score, .tile { justify-self: start; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 78px; height: 54px; padding: 0 8px; border-radius: 18px; background: var(--dock-bg); border: 1px solid var(--dock-line); box-shadow: 0 4px 12px var(--shadow); line-height: 1.05; text-align: center; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: background .35s ease, box-shadow .35s ease; }
.tile { justify-self: end; color: var(--ink); font: inherit; cursor: pointer; transition: transform .28s cubic-bezier(.34,1.56,.64,1), background-color .2s ease; }
.tile:hover { transform: translateY(-2px); background: var(--fill-hi); }

.score.win { background: hsla(45,100%,80%,.92); box-shadow: 0 0 0 3px hsla(45,95%,60%,.55), 0 6px 18px var(--shadow); animation: scwin .8s cubic-bezier(.34,1.56,.64,1); }

@keyframes scup { 0% { transform: none; } 35% { transform: translateY(-8px) scale(1.22); background: hsla(150,75%,78%,.95); } 100% { transform: none; } }
@keyframes scdn { 0%, 100% { transform: none; } 20% { transform: translateX(-7px) scale(.94); background: hsla(350,85%,82%,.95); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }

html, body { overflow-x: clip; }
/* Tutorial */
/* Tutorial: the dock button, then a guided tour. A spotlight glides from feature to feature (its huge shadow is the
   dimming), and a card next to it explains each one. */
.tourbtn {
  appearance: none; cursor: pointer; flex: none; position: relative;
  display: inline-flex; align-items: center; gap: .4em;
  padding: .55em .95em .55em .7em; border-radius: 999px;

}

.tourbtn:hover { background: var(--dock-line); transform: translateY(-1px); }
.tourbtn:active { transform: scale(.96); }
.tourbtn.fresh::after {
  content: ""; position: absolute; inset: -3px; border-radius: inherit; pointer-events: none;
  border: 2px solid var(--underline); opacity: 0; animation: tourping 2.4s ease-out 1.5s infinite;
}

@keyframes tourping { 0% { opacity: .9; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(1.18); } }
.tour { position: fixed; inset: 0; z-index: 50; touch-action: none; }

@keyframes tourglow { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.06); } }
.tour-card {

  display: flex; flex-direction: column; gap: .45rem;

  color: var(--ink); background: var(--dock-bg); border: 1px solid var(--dock-line);   /* the header's frosted glass */

  box-shadow: 0 22px 50px rgba(0, 0, 0, .3);
}
.tour-card.in { animation: tourcard .34s cubic-bezier(.2,.9,.3,1.15); }

.tour-step { margin: 0; padding-right: 2rem; font-size: .72rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; opacity: .6; }
.tour-title { margin: 0; padding-right: 1.6rem; font-family: inherit; font-size: 1.32rem; font-weight: 600; line-height: 1.2; }
.tour-text { margin: 0; font-size: .98rem; line-height: 1.45; }

.tour-title b { color: var(--underline); font-weight: 600; }
.tour-foot { display: flex; align-items: center; justify-content: space-between; gap: .6rem; margin-top: .45rem; }
.tour-dots { display: flex; gap: 4px; min-width: 0; }

.tour-dots span { flex: none; width: 6px; height: 6px; border-radius: 99px; background: rgba(128,128,150,.35); transition: width .3s ease, background-color .3s ease; }
.tour-dots span.on { width: 16px; background: var(--underline); }
.tour-dots span.done { background: var(--underline); opacity: .55; }
.tour-nav { display: flex; gap: .4rem; flex: none; margin-left: auto; }
.tour-back, .tour-next {
  appearance: none; cursor: pointer; border: 0; border-radius: 999px;
  font-family: inherit; font-size: .92rem; font-weight: 500; line-height: 1; padding: .7em 1.15em;
  transition: transform .25s cubic-bezier(.34,1.56,.64,1), background-color .2s ease;
}
.tour-back { color: var(--ink); background: transparent; }

.tour-next { color: #fff; font-weight: 600; background: linear-gradient(135deg, #ff5ea8, #c04dff 55%, #8a5cff); box-shadow: 0 4px 14px rgba(200, 77, 255, .4); }

  appearance: none; cursor: pointer; border: 0; position: absolute; top: .55rem; right: .55rem;
  width: 2rem; height: 2rem; border-radius: 50%; font-family: inherit; font-size: 1.25rem; line-height: 1;
  color: var(--ink); background: transparent; transition: background-color .2s ease;
}
.tour-x:hover { background: var(--dock-line); }
.tourbtn:focus-visible, .tour-back:focus-visible, .tour-next:focus-visible, .tour-x:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.tour-pop { position: fixed; z-index: 51; width: 12px; height: 12px; border-radius: 50%; pointer-events: none; }
@media (max-width: 600px) {

@media (prefers-reduced-motion: reduce) { .tourbtn.fresh::after, .tour-spot::after, .tour-card.in { animation: none; } }
/* 10-game.css — page wrap, hint line, buttons, tools row, tries, reveal card, chips, toast, particles, tour extras,
   gloss tooltip, hint nudge. Taken from the conditionals template (play-area rules are in 11-text.css). */
[hidden] { display: none !important; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px 48px; }
#snd[aria-pressed="true"] { background: transparent; color: inherit; }
#snd[aria-pressed="true"]:hover { background: var(--dock-line); }
#snd[aria-pressed="false"] { opacity: .6; }
@media (max-width: 600px) { .seg.vseg { width: auto; } }
div.score { cursor: default; }
div.score:hover { transform: none; }
.hint { text-align: center; margin: 14px 12px 0; font-size: 1rem; opacity: .8; min-height: 1.4em; text-wrap: balance; }
.hint b { color: var(--underline); font-weight: 600; }
.pbtn { font: inherit; font-size: .9rem; font-weight: 500; padding: .5em 1em; border-radius: 999px; border: 1.5px solid var(--dock-line); background: var(--dock-bg); color: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background-color .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s ease; }
.pbtn:hover:not(:disabled) { background: var(--dock-line); transform: translateY(-1px); }

/* Tools row */
.tools { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.trywrap { display: inline-flex; align-items: center; gap: 4px; }
.trylab { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
.tries { display: inline-flex; align-items: center; gap: 6px; padding: 0 6px; }
.tries i { width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(135deg, hsl(315,85%,68%), hsl(275,80%,68%)); box-shadow: 0 1px 4px var(--shadow); transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .3s ease; }
.tries i.used { opacity: .18; transform: scale(.65); }

/* Reveal card */
.reveal { position: relative; max-width: 760px; margin: 18px auto 0; padding: 16px 18px 18px; border-radius: 26px; text-align: center;
  background: var(--dock-bg); border: 1px solid var(--dock-line); box-shadow: 0 8px 22px var(--shadow);   /* the header's glass */
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); animation: cardin .45s cubic-bezier(.34,1.56,.64,1); transition: opacity .25s ease; }
.reveal[hidden] { display: none; }
.reveal.out { opacity: 0; }
.rv-head { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 12px; }
.chip { display: inline-block; font-size: .74rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: .38em .95em; border-radius: 999px; color: #fff; white-space: nowrap;
  background: linear-gradient(135deg, hsl(var(--h),75%,52%), hsl(calc(var(--h) + 35),70%,50%)); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); text-shadow: 0 1px 1px rgba(0,0,0,.18); }
.rv-note { margin: 12px 0 0; padding: 8px 12px; border-radius: 14px; font-size: .9rem; background: hsla(45,100%,70%,.2); border: 1px dashed hsla(45,90%,50%,.6); animation: pup .5s .4s ease-out backwards; }
.rv-note b { color: hsl(35,85%,var(--lab-l)); }
.rv-btns { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 16px; }
@keyframes cardin { from { opacity: 0; transform: scale(.92) translateY(12px); } }
@keyframes pup { from { opacity: 0; transform: translateY(10px); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
/* Toast + confetti bubbles */
.toast { position: absolute; left: 50%; top: 0; z-index: 5; padding: .35em 1em; border-radius: 999px; font-weight: 600; white-space: nowrap; pointer-events: none;
  background: hsl(150,60%,42%); color: #fff; box-shadow: 0 6px 16px var(--shadow); animation: toast 1.7s ease-out forwards; }
.toast.zero { background: hsl(35,85%,48%); }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%,-40%) scale(.6); } 15% { opacity: 1; transform: translate(-50%,-115%) scale(1.08); } 75% { opacity: 1; transform: translate(-50%,-130%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-175%); } }
.pf { position: fixed; z-index: 55; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at 30% 30%, #fff, hsla(var(--h),85%,75%,.55)); border: 1px solid hsla(var(--h),85%,68%,.85); animation: pfly .8s ease-out forwards; }
@keyframes pfly { from { transform: translate(-50%,-50%) scale(.3); opacity: .95; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1); opacity: 0; } }

/* Tour spotlight glides between targets */
.tour-spot { transition: left .45s cubic-bezier(.3,1.15,.5,1), top .45s cubic-bezier(.3,1.15,.5,1), width .45s cubic-bezier(.3,1.15,.5,1), height .45s cubic-bezier(.3,1.15,.5,1); }
/* No glide until Next / Back (.glide, set in tourGo): the first card pops in where it belongs instead of flying in. */
.tour:not(.glide) .tour-card, .tour:not(.glide) .tour-spot { transition: none; }
.tour-card { transition: left .4s ease, top .4s ease; max-height: calc(100vh - 24px); overflow-y: auto; }
/* Tour header: step label + EN / translation toggle (kept clear of the close button) */
.tour-head { display: flex; align-items: center; gap: .6rem; padding-right: 2.2rem; }
.tour-head .tour-step { padding-right: 0; flex: 1; }
.tour-lang { display: flex; gap: 2px; padding: 2px; border-radius: 999px; border: 1px solid var(--dock-line); flex: none; }
.tour-lang[hidden] { display: none; }
.tour-lang button { appearance: none; border: 0; cursor: pointer; font-family: inherit; font-size: .7rem; font-weight: 600; letter-spacing: .06em; line-height: 1;
  padding: .45em .75em; border-radius: 999px; color: var(--ink); background: transparent; transition: background-color .2s ease, color .2s ease; }
.tour-lang button:hover { background: var(--dock-line); }
.tour-lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg-a); }
.tour-lang button:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
/* Welcome card: one colour-coded example per conditional type */
.tour-ex { list-style: none; margin: .55rem 0 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; }
.tour-ex li { display: flex; flex-wrap: wrap; align-items: baseline; gap: .15rem .5rem; font-weight: 500; }
.tour-ex .chip { font-size: .62rem; padding: .32em .75em; }

/* Meaning of a pre-filled word, shown on hover or tap (16-gloss.js) */
.glosstip { position: fixed; z-index: 60; display: flex; align-items: center; gap: 8px; max-width: min(80vw, 300px); padding: 7px 13px 7px 8px; border-radius: 14px;
  background: var(--dock-bg); border: 1px solid var(--dock-line); color: var(--ink); box-shadow: 0 8px 22px var(--shadow);
  backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
  font-weight: 600; font-size: 1rem; line-height: 1.25; pointer-events: none; animation: gpop .12s ease-out; }
.glosstip[hidden] { display: none; }
.gw { cursor: pointer; border-radius: 6px; transition: background-color .15s ease; }
.gw.on { background: hsla(var(--h),90%,70%,.25); }
@media (hover: hover) { .gw:hover { background: hsla(var(--h),90%,70%,.18); } }

@keyframes gpop { from { opacity: 0; transform: translateY(3px); } }
@media (prefers-reduced-motion: reduce) { .glosstip { animation: none; } }
/* Idle reminder on the hint button (14-explain.js) */
#hintbtn.nudge { animation: nudge .7s ease-in-out; }
@keyframes nudge { 0%, 100% { transform: none; } 15% { transform: rotate(-6deg) scale(1.08); } 35% { transform: rotate(5deg) scale(1.08); } 55% { transform: rotate(-3deg) scale(1.04); } 75% { transform: rotate(2deg); } }
/* Theme change (swapBg in 01-theme.js, from Verb Wheel / Be, Do & Modals): no transitions for that one style change;
   the old background fades away on top */
.theming body, .theming *, .theming *::before, .theming *::after { transition: none !important; }
.bgfade { position: fixed; inset: 0; z-index: -1; pointer-events: none; background-color: var(--fa);
  background-image: radial-gradient(60vmax 50vmax at 8% 6%, var(--fa), transparent 70%),
    radial-gradient(55vmax 45vmax at 95% 40%, var(--fb), transparent 70%),
    radial-gradient(60vmax 50vmax at 30% 100%, var(--fc), transparent 70%);
  transition: opacity .55s ease; will-change: opacity; }
.bgfade.fading { opacity: 0; }
/* Edge jitter (from Be, Do & Modals): while something rises on hover it gets an invisible strip reaching back past
   where its bottom edge was, so the cursor on that edge keeps the hover after the lift. Only while hovered: an
   always-on strip catches the cursor below the edge and jitters there instead. The strip = the lift + 3-4px. */
.tile, .jd-b, .pbtn, .gd-nav .chip { position: relative; }
@media (hover: hover) {
  .b.w:hover::after, .card:not(.done) .art:not(.lock):hover::after, .jd-b:hover:not(:disabled)::after, .tile:hover::after, .pbtn:hover:not(:disabled)::after,
  .gd-nav .chip:hover::after, .tourbtn:not(.fresh):hover::after { content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: -8px;
    width: auto; height: auto; border-radius: 0; background: none; opacity: 1; animation: none; }
  .jd-b:hover:not(:disabled)::after, .tile:hover::after, .gd-nav .chip:hover::after { bottom: -5px; }
  .card:not(.done) .art:not(.lock):hover::after, .pbtn:hover:not(:disabled)::after, .tourbtn:not(.fresh):hover::after { bottom: -4px; }
}
/* 11-text.css — the play area: the text card, the verb bubbles ("spots") and their states (grey with the base form, then
   to + verb blue, -ing orange, the verb alone purple), the cycle dots, clue words, the Portuguese lines, the tutorial's demo bubbles,
   tools-row extras. */
#stage { position: relative; max-width: 760px; margin: 14px auto 0; transition: opacity .25s ease, transform .25s ease; }
#stage.out { opacity: 0; transform: translateY(-10px); }
#stage.rise .card { animation: rise .55s cubic-bezier(.2,.8,.3,1) backwards; }

/* The card: the header's frosted glass, 1px edge and shadow (.dock; from the sibling games' revamp, Nov 2026) */
.card { --h: 265; position: relative; padding: 2.1em 1.7em 1.6em; border-radius: 1.8em; color: var(--ink);
  background: var(--dock-bg); border: 1px solid var(--dock-line);
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: 0 8px 22px var(--shadow); }
.card.shake { animation: shake .5s ease; }
.card .tag { position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%); z-index: 2; padding: calc(.3em + 1.5px) calc(.9em + 1.5px); border-radius: 999px; white-space: nowrap;
  font-size: .7rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  /* a flat gradient pill with white text: pink-violet; bonus yellow-orange, Right or wrong / Which meaning / Proofreading teal (13-bonus.css) */
  --g1: hsl(330, 80%, 62%); --g2: hsl(300, 60%, 60%);
  color: #fff; background: linear-gradient(90deg, var(--g1), var(--g2)); text-shadow: 0 1px 1px rgba(0,0,0,.15); }
.ttl { margin: 0 0 .75em; font-size: clamp(1.25rem, 1vw + 1rem, 1.6rem); font-weight: 600; line-height: 1.2; text-align: center; text-wrap: balance; }
.lines { display: flex; flex-direction: column; gap: .7em; }
.ln { position: relative; border-radius: .7em; transition: background-color .3s ease, box-shadow .3s ease; }
.say { margin: 0; font-size: clamp(1.06rem, .55vw + .95rem, 1.26rem); font-weight: 500; line-height: 2.2; text-wrap: pretty; }
/* A tagged paragraph (text "tags"): a little chip at its start; a headline is set in bold */
.ln-tag { display: inline-block; margin-right: .55em; padding: .25em .7em; border-radius: 999px; font-size: .62rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; line-height: 1.3; vertical-align: .25em; background: var(--dock-line); border: 1px solid var(--dock-line); opacity: .85; }
.ln.tag-headline .say { font-weight: 700; }
/* The paragraph the voice is reading (Listen) */
.ln.reading { background: hsla(var(--h, 265),85%,72%,.2); box-shadow: 0 0 0 6px hsla(var(--h, 265),85%,72%,.2); }

/* Spots: a verb gap in a bubble. Grey and dashed, showing the base form, until it is tapped; then
   blue (to + verb), orange (-ing) or purple (the verb alone); a soap bubble (rim and film in that colour). Dots inside the bottom edge show where in the cycle it is. */
.art { --h: 220; position: relative; appearance: none; font: inherit; font-weight: 600; line-height: 1.15; cursor: pointer; white-space: nowrap;
  display: inline-block; margin: 0 .08em; padding: .14em .7em .4em; border-radius: 999px; color: var(--ink);
  /* a soap bubble (the spans of 14-soap.css, SOAP in 23-shine.js): clear, the film and rim in the class colour */
  --th: var(--h); --ig: inset 0 0 12px hsla(var(--th), 95%, var(--sglow-l), var(--sglow-a));
  background: none; border: 1.5px solid transparent; box-shadow: 0 6px 14px var(--soap-sh);
  transition: color .2s ease, box-shadow .25s ease, transform .25s cubic-bezier(.34,1.56,.64,1); }
.art .awrap { position: relative; }   /* above the film and the moving shine */
/* Untouched (grey, the base form): a faint clear bubble, a colourless rim and no film */
.art:not(.set) { --ig: inset 0 0 10px hsla(220, 30%, var(--sglow-l), .14); box-shadow: 0 4px 10px var(--soap-sh); }
.art:not(.set) .rim { background: hsla(220, 12%, 60%, .38); }
.art:not(.set) .rim i, .art:not(.set) .film .spin { visibility: hidden; }
@media (hover: hover) { .art:hover:not(.lock) { --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 10px 20px var(--soap-sh2); } }
.art .aw { opacity: .5; transition: opacity .2s ease; }
/* Fixed width: the visible word and invisible copies of every form share one grid cell (spotWord in 10-game.js) */
.awrap { display: inline-grid; justify-items: center; }
.awrap > * { grid-area: 1 / 1; }
.awrap .sz { visibility: hidden; }
.art:hover { transform: translateY(-1px); }
.art:hover .aw { opacity: .8; }
.art:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
.dots { position: absolute; left: 50%; bottom: .14em; transform: translateX(-50%); display: flex; gap: 3px; pointer-events: none; }
.dots i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: .22; transition: opacity .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1), background-color .2s ease; }
.dots i.on { opacity: 1; transform: scale(1.5); background: hsl(var(--h),75%,52%); }
.art.set .aw { opacity: 1; }
.art.cls-to { --h: 205; }
.art.cls-ing { --h: 28; }
.art.cls-bare { --h: 280; }
.art.nudge { animation: nudge .7s ease-in-out; }
.art .aw { display: inline-block; }
/* The word after a sentence-initial gap takes its capital while that gap is Ø */
.cw.up { text-transform: capitalize; }
.art.pop { animation: spotpop .34s cubic-bezier(.34,1.56,.64,1); }
@keyframes spotpop { 40% { transform: scale(1.13); } }
.art.nudge { animation: nudge .6s ease-in-out; }
/* After a wrong check (A2): wrong ones red, right ones locked green */
.art.err { --ig: inset 0 0 16px hsla(350, 90%, 68%, .45); box-shadow: 0 0 0 3px hsla(350,85%,62%,.3); animation: shake .5s ease; }
.art.lock, .art.ok, .art.right { --h: 150; --ig: inset 0 0 16px hsla(150, 80%, 60%, .42); box-shadow: 0 6px 14px var(--soap-sh); cursor: default; }
/* the state rims (as the bonus words'): green right / locked, red wrong */
.art.lock .rim, .art.ok .rim, .art.right .rim { background: hsla(150, 60%, 48%, .85); }
.art.err .rim, .art.bad .rim { background: hsla(350, 80%, 60%, .85); }
.art.lock .rim i, .art.ok .rim i, .art.right .rim i, .art.err .rim i, .art.bad .rim i { visibility: hidden; }
.art.lock .aw, .art.ok .aw, .art.bad .aw { opacity: 1; }
.art.lock:hover, .card.done .art:hover { transform: none; }
/* Once the text is done: the right form, green (or red when the choice was wrong), its number on the corner */
.card.done .art { cursor: pointer; }
.card.done .art .dots { display: none; }
.art.bad { --h: 350; --ig: inset 0 0 16px hsla(350, 90%, 68%, .45); box-shadow: 0 6px 14px var(--soap-sh); }
.art .sn { position: absolute; top: -.55em; right: -.45em; }
.sn { display: inline-grid; place-items: center; min-width: 1.55em; height: 1.55em; padding: 0 .3em; border-radius: 999px; font-size: .62rem; font-weight: 700; line-height: 1; color: #fff; background: hsl(150,55%,40%); }
.art.bad .sn, .ex.bad .sn { background: hsl(350,70%,54%); }
.art.hot { box-shadow: 0 0 0 5px hsla(50,100%,62%,.45); }
.art.ping, .gd-u.ping { animation: ping .9s ease; }
@keyframes ping { 0%, 100% { box-shadow: 0 0 0 0 hsla(50,100%,55%,0); } 30% { box-shadow: 0 0 0 7px hsla(50,100%,55%,.55); } }

/* Speaker in the card's top-right corner: reads the whole text; it appears only after the check */
.cardsay[hidden] { display: none; }
.cardsay { position: absolute; top: .7em; right: .8em; z-index: 2; appearance: none; padding: .45em; line-height: 0; border: 0; border-radius: 50%;
  color: inherit; background: transparent; opacity: .6; cursor: pointer; transition: opacity .2s ease, background-color .2s ease, color .2s ease; }
.cardsay:hover, .cardsay.speaking { opacity: 1; color: var(--underline); background: var(--dock-line); }
.cardsay:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
.cardsay.speaking svg { animation: pulse 1s ease-in-out infinite; }
/* Clue words: lit up like a highlighter by the Clues hint, and after the check (brighter when linked) */
.clue { padding: .05em .12em; margin: 0 -.12em; border-radius: .3em; -webkit-box-decoration-break: clone; box-decoration-break: clone; transition: background-color .3s ease, box-shadow .3s ease; }
.card.clues .clue, .card .clue.lit { background: hsla(50,100%,58%,.35); }
.card.done .clue { background: hsla(50,100%,58%,.2); }
.card .clue.hot { background: hsla(50,100%,60%,.6); box-shadow: 0 0 0 3px hsla(50,100%,60%,.6); }

/* Portuguese under each paragraph (Translation button) */
.lt { display: none; margin: .05em 0 .2em; font-size: .93rem; font-weight: 400; line-height: 1.4; opacity: .8; font-style: italic; }
.card.tr-on .lt { display: block; animation: pup .35s ease-out; }
/* Gloss words have a dotted underline */
.gw { text-decoration: underline dotted 1.5px; text-decoration-color: hsla(var(--h),50%,50%,.55); text-underline-offset: 4px; }

/* Tutorial: the demo sentences, their self-tapping bubble, the finger and the caption */
.tour-ex .demo-s { line-height: 2.1; }
.demo-w { position: relative; display: inline-block; }
.art.demo { cursor: default; pointer-events: none; font-size: .95em; }
.finger { position: absolute; right: -.5em; bottom: -.55em; font-size: 1.05em; line-height: 1; opacity: 0; pointer-events: none; }
.finger.tap { animation: tap .5s ease-out; }
@keyframes tap { 0% { opacity: 0; transform: translate(6px, 8px); } 35% { opacity: 1; transform: translate(0, 0) scale(.88); } 100% { opacity: 0; transform: translate(4px, 6px); } }
.art.right { animation: glow 1s ease-in-out infinite alternate; }
@keyframes glow { to { box-shadow: 0 0 0 6px hsla(150,65%,50%,.28); } }
.demo-cap { margin-left: auto; font-size: .78rem; font-weight: 600; opacity: .75; min-width: 7.5em; height: 1.4em; line-height: 1.4em; text-align: right; white-space: nowrap; }   /* fixed height: it is empty between cycles */

/* Tools row extras */
#checkbtn { padding: .55em 1.6em; }
.cta:disabled { opacity: .45; cursor: default; animation: none; transform: none; }
#hintleft.tick { display: inline-block; animation: tick .5s cubic-bezier(.34,1.56,.64,1); }
@keyframes tick { 0% { transform: scale(1); } 40% { transform: scale(1.5); color: hsl(45,95%,55%); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 15% { transform: translateX(-9px) rotate(-1deg); } 35% { transform: translateX(8px) rotate(.8deg); } 55% { transform: translateX(-6px); } 75% { transform: translateX(4px); } }
@keyframes nudge { 0%, 100% { transform: none; } 15% { transform: rotate(-6deg) scale(1.08); } 35% { transform: rotate(5deg) scale(1.08); } 55% { transform: rotate(-3deg) scale(1.04); } 75% { transform: rotate(2deg); } }

@media (max-width: 600px) {
  .card { padding: 1.9em 1em 1.2em; border-radius: 1.4em; }
  .say { line-height: 2.1; }
  /* Tries, Clues, Reset, Check: one row on phones, the Tries label on top of its dots (from Conditional Bubbles) */
  .tools { flex-wrap: nowrap; gap: 3px; }
  .tools .pbtn, .tools .cta { font-size: .8rem; padding: .45em .55em; gap: .25em; white-space: nowrap; }
  #resetbtn svg { display: none; }   /* room for Check: Reset (Limpar) keeps only its word */
  .tools .pbtn small { font-size: .62rem; }
  .tools .pbtn svg { width: 14px; height: 14px; }
  .trywrap { flex-direction: column; gap: 3px; }
  .trylab { font-size: .52rem; letter-spacing: .02em; line-height: 1; }
  .tries { gap: 4px; padding: 0; }
  .tries i { width: 10px; height: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  #stage.rise .card, .card.shake, .art.pop, .art.ping, .art.err, .art.nudge, .art.right, .finger.tap, .ex.ping, .gd-u.ping, .card.tr-on .lt, #hintleft.tick { animation: none !important; }
  .art, #stage { transition: none; }
  .finger.tap { opacity: 1; }
}

/* Phones: the card labels stick up above the cards, so the stage gets room under the instructions, and the labels
   are a tad smaller (as in Core Word Bubbles, 2026-11-23) */
@media (max-width: 600px) {
  #stage { padding-top: 8px; }
  .card .tag { font-size: .62rem; letter-spacing: .08em; }
}
/* 12-explain.css — the explanations after a text (with the Portuguese trap), the bonus
   result line, the Guide modal (Ask yourself, pockets, rule groups, Portuguese mistakes) and the quick-fire sentence. */
.rv-score { font-size: 1.25rem; }
/* Result card top bar: score + title (left), star + Next (top-right corner) */
.rv-bar { display: grid; grid-template-columns: 1fr auto; align-items: start; gap: 10px; }
.rv-bar .rv-head { justify-content: flex-start; text-align: left; min-height: 2.6rem; }
.rv-act { display: flex; align-items: center; gap: 6px; }
.rv-act .cta { white-space: nowrap; }
.rv-sc { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.rv-tools { display: inline-flex; align-items: center; gap: 10px; flex-wrap: nowrap; }
/* Phone: score (+ PERFECT) and Next on the first line, Translation, Listen and the star on the second */
@media (max-width: 600px) {
  .rv-bar { grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px 10px; }
  .rv-bar .rv-head, .rv-act { display: contents; }
  .rv-sc, .rv-head > .rv-score { grid-row: 1; grid-column: 1; }
  .rv-score { font-size: 1.1rem; }
  .rv-act .cta { grid-row: 1; grid-column: 2; font-size: .95rem; padding: .6em 1.1em; }
  .rv-tools { grid-row: 2; grid-column: 1; }
  .rv-tools .pbtn { white-space: nowrap; }
  .rv-act .favstar { grid-row: 2; grid-column: 2; justify-self: end; }
}
.rv-ttl { display: inline-flex; align-items: center; gap: 6px; font-size: .95rem; opacity: .85; }
.rv-top { margin-top: 10px; flex-wrap: wrap; }
.rv-top .pick-badge, .ex-pt .pick-badge, .gd-ex .pick-badge { font-size: .68rem; }
#trbtn[aria-pressed="true"] { border-color: var(--underline); }
.pbtn svg { flex: none; }

/* One explanation per verb */
.exl { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; text-align: left; }
.ex { --h: 285; position: relative; padding: 0; border-radius: 20px; background: var(--fill-mid); border: 1.5px solid hsla(150,60%,50%,.5);
  transition: box-shadow .35s ease; animation: pup .45s ease-out backwards; }
/* Back from the Guide (glow() in 00-util.js): the card, or the rule button on a Right-or-wrong / Which-meaning card */
.ex.glow, .ex.glow:hover, .ex-use.glow { box-shadow: 0 0 0 4px hsla(var(--h),85%,60%,.55), 0 8px 22px var(--shadow); }
.ex:nth-child(2) { animation-delay: .07s; } .ex:nth-child(3) { animation-delay: .14s; } .ex:nth-child(4) { animation-delay: .21s; } .ex:nth-child(5) { animation-delay: .28s; }
.ex.bad { border-color: hsla(350,75%,60%,.65); background: hsla(350,85%,70%,.08); }
@media (hover: hover) { .ex:hover { box-shadow: 0 6px 18px var(--shadow); } }
/* Head: number, mark, class and PT ≠ EN on the left, the speaker on the right, all on one line; the rule pill sits
   between them on wide screens and on its own line below on phones */
.ex-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.ex-tags { flex: none; display: flex; align-items: center; gap: 8px; }
.ex-end { flex: none; display: flex; align-items: center; gap: 4px; margin-left: auto; }
.ex-use { max-width: 100%; text-align: left; border-radius: 1em; }
@media (max-width: 600px) {
  .ex-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; }
  .ex-tags { grid-row: 1; grid-column: 1; }
  .ex-end { grid-row: 1; grid-column: 2; }
  .ex-use { grid-row: 2; grid-column: 1 / -1; justify-self: start; }
}
/* Collapsible: the summary (head + sentence) has a chevron on the right; the open part keeps the card's padding */
.ex > details > summary { position: relative; display: block; list-style: none; cursor: pointer; padding: 12px 42px 12px 14px; border-radius: 18px; }
.ex > details > summary::-webkit-details-marker { display: none; }
.ex > details > summary::after { content: ""; position: absolute; right: 18px; top: 27px; width: 8px; height: 8px; margin-top: -6px;
  border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; opacity: .55; transform: rotate(45deg); transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
.ex > details[open] > summary::after { transform: rotate(-135deg); margin-top: -2px; }
.ex > details > summary:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
@media (hover: hover) { .ex > details > summary:hover { background: hsla(var(--h),85%,72%,.08); } }
.ex > details[open] { padding-bottom: 14px; }
.ex > details[open] > :not(summary) { margin-left: 14px; margin-right: 14px; animation: pup .3s ease-out; }
.ex > details[open] > .ex-you { margin-top: 0; }
.ex-head .sn { font-size: .8rem; }
.ex-mk { font-weight: 700; font-size: 1.05rem; color: hsl(150,55%,40%); }
.ex.bad .ex-mk { color: hsl(350,70%,52%); }
.ex-head .chip { font-size: .64rem; padding: .34em .85em; }
.ex-use { appearance: none; cursor: pointer; font: inherit; font-size: .8rem; font-weight: 600; padding: .22em .75em; border-radius: 999px;
  color: hsl(var(--h),60%,var(--lab-l)); background: transparent; border: 1.5px solid hsla(var(--h),70%,var(--rim-l),.9); transition: background-color .2s ease; }
.ex-use:hover { background: hsla(var(--h),90%,75%,.18); }
.ex-use::after { content: "\00a0›"; }
.ex-say { appearance: none; margin-left: auto; padding: .35em; line-height: 0; border: 0; border-radius: 50%; color: inherit; background: transparent; opacity: .6; cursor: pointer; }
.ex-say:hover, .ex-say.speaking { opacity: 1; color: var(--underline); background: var(--dock-line); }
.ex-use:focus-visible, .ex-say:focus-visible, .usechip:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
.ex-s { margin: 8px 0 0; font-size: 1.08rem; font-weight: 500; line-height: 1.5; }
.ex-s mark, .qz-s mark, .rlist mark { color: inherit; padding: .05em .12em; margin: 0 -.12em; border-radius: .3em; -webkit-box-decoration-break: clone; box-decoration-break: clone; background: hsla(50,100%,58%,.3); }
.ex-v { color: hsl(var(--h),65%,var(--lab-l)); }
.ex-you { margin: 4px 0 0; font-size: .9rem; }
.ex-you s { color: hsl(350,70%,52%); text-decoration: none; }   /* the wrong choice: red, not crossed out */
.ex-body { display: grid; grid-template-columns: minmax(0, 300px) 1fr; gap: 8px 16px; align-items: center; margin-top: 8px; }
.ex-why p { margin: 0; font-size: .95rem; line-height: 1.45; }
.eg { list-style: none; margin: 8px 0 2px; padding: 0; display: grid; gap: 5px; font-size: .92rem; line-height: 1.4; }
.eg li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.eg-ar { opacity: .45; }
.ex-why .ex-pt { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: .95rem; font-weight: 600; opacity: 1; }
.ex .rv-note { animation: none; text-align: left; }


/* Guide */
.guidecard { max-width: 780px; max-height: 88vh; }
.guidecard .favhead { gap: 10px; }
.gd-lang { margin-left: auto; }
/* "Ask yourself": one row per question, its tense on the right (below it on phones) */
.gd-ask { padding: 12px 12px 12px; border-radius: 20px; background: var(--fill-mid); border: 1px solid var(--dock-line); }
.gd-ask-h { margin: 0 0 10px 4px; font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .6; }
.gd-q { --h: 200; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px 14px; padding: 11px 14px; border-radius: 14px;
  background: hsla(var(--h),85%,72%,.13); border-left: 4px solid hsl(var(--h),70%,55%); }
.gd-q + .gd-q { margin-top: 8px; }
.gd-qt > b { display: block; font-size: 1.02rem; font-weight: 600; line-height: 1.3; }
.gd-qt small { display: block; margin-top: 4px; font-size: .84rem; line-height: 1.4; opacity: .72; }
.gd-ans { display: inline-flex; align-items: center; gap: 8px; }
.gd-arrow { font-size: 1.25rem; font-weight: 700; line-height: 1; color: hsl(var(--h),65%,var(--lab-l)); }
@media (max-width: 560px) { .gd-q { grid-template-columns: 1fr; } }
.gd-nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 12px; }
.gd-nav .chip { border: 0; cursor: pointer; font-family: inherit; transition: transform .25s cubic-bezier(.34,1.56,.64,1); }
.gd-nav .chip:hover { transform: translateY(-2px); }
.gd-nav .chip:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
.gd-t, .gd-mis { scroll-margin-top: 12px; }
.gd-t { --h: 285; margin-top: 20px; }
/* Most common mistakes */
.gd-mis { --h: 350; margin-top: 24px; }
.gd-mis h3 { margin: 0; font-size: 1.1rem; color: hsl(350,65%,var(--lab-l)); }
.gd-mlist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; align-items: start; gap: 10px; counter-reset: mis; }
.gd-mlist li { counter-increment: mis; position: relative; padding: 0; border-radius: 16px; background: var(--fill-mid); border: 1px solid var(--dock-line); }
.gd-mlist li::before { content: counter(mis); position: absolute; left: 12px; top: 13px; display: grid; place-items: center; width: 1.5em; height: 1.5em; border-radius: 50%;
  font-size: .75rem; font-weight: 700; color: #fff; background: hsl(350,70%,56%); }
.gd-wrong, .gd-right { margin: 0; font-size: .97rem; font-weight: 600; line-height: 1.4; }
.gd-wrong { color: hsl(350,70%,var(--lab-l)); text-decoration: line-through; text-decoration-thickness: 1.5px; text-decoration-color: hsla(350,70%,55%,.6); }
.gd-wrong span, .gd-right span { display: inline-block; text-decoration: none; margin-right: 2px; }
.gd-right { margin-top: 3px; color: hsl(150,55%,calc(var(--lab-l) * .8 + 6%)); }
.gd-mwhy { margin: 6px 0 0; font-size: .88rem; line-height: 1.45; opacity: .82; }
.gd-mlist .lvchip { font-size: .58rem; padding: .25em .65em; margin-bottom: 5px; }
/* For the curious: one folded card after the mistakes; each note = an English title and a line */
.gd-cur { margin-top: 24px; }
.gd-cur h3 { margin: 0; font-size: 1.1rem; color: hsl(var(--h),60%,var(--lab-l)); }
.gd-cur > .gd-short { margin: 0 14px; }
.gd-clist { list-style: none; margin: 8px 0 0; padding: 0 12px 12px; display: grid; gap: 8px; }
.gd-clist li { padding: 10px 12px; border-radius: 14px; background: hsla(var(--h),80%,70%,.07); border: 1px solid var(--dock-line); }

/* Speed challenge intro: the goal, then 3-2-1-Go (22-modes.js) */
.cdown { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(20,20,40,.35); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: cdfade .2s ease; }
.cd-card { box-sizing: border-box; width: min(360px, 100%); padding: 22px 20px 24px; border-radius: 28px; text-align: center; color: var(--ink); background: var(--bg-a); border: 1px solid var(--dock-line); box-shadow: 0 20px 50px rgba(0,0,0,.28); animation: cardin .3s cubic-bezier(.34,1.56,.64,1); }
.cd-t { margin: 0; font-size: .78rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; opacity: .65; }
.cd-x { margin: 8px 0 4px; font-size: 1.25rem; font-weight: 600; line-height: 1.3; text-wrap: balance; }
.cd-n { display: block; height: 1.25em; font-size: 4rem; line-height: 1.25; color: var(--underline); }
.cd-n.pop { animation: cdpop .5s cubic-bezier(.34,1.56,.64,1); }
@keyframes cdfade { from { opacity: 0; } }
@keyframes cdpop { from { transform: scale(.4); } }
@media (prefers-reduced-motion: reduce) { .cdown, .cd-card, .cd-n.pop { animation: none; } }
/* 60-scrollbar.css — scrollbars in the look of the Stressed syllables game (Guide, lists, tour card; the page has none): a thin glossy pill with the
   pink-to-purple gradient on a clear track. Chrome / Edge / Safari use the ::-webkit-scrollbar parts; Firefox only takes
   colours, so it gets a thin pink thumb (in @supports, since Chrome would let these override the pill). */
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: transparent; margin: 18px 0; }
::-webkit-scrollbar-thumb {
  border: 3px solid transparent; border-radius: 999px; background-clip: padding-box;
  background-image: linear-gradient(180deg, hsl(315,85%,66%), hsl(275,80%,64%));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45);
}
::-webkit-scrollbar-thumb:hover { background-image: linear-gradient(180deg, hsl(315,90%,60%), hsl(275,85%,58%)); }
::-webkit-scrollbar-thumb:active { border-width: 2px; }
::-webkit-scrollbar-button, ::-webkit-scrollbar-corner { display: none; background: transparent; }
@supports (-moz-appearance: none) {
  * { scrollbar-width: thin; scrollbar-color: hsl(295,82%,66%) transparent; }
}
/* The page itself still scrolls on short screens, but shows no bar (only the cards and lists do). */
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }
</style>

  <section class="reveal" id="reveal" hidden aria-live="polite"></section>
</div>
