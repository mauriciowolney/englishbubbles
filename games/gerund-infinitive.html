 (to) wait. Without *to* is more common.","pt":"As duas servem: all I could do was (to) wait. Sem *to* é mais comum."},null,null]},{"id":"b2-42","frame":"Opinion column","framePt":"Coluna de opinião","title":"The four-day week","titlePt":"A semana de quatro dias","body":["[work:ing:subject] four days a week sounds like a dream. For a small business, though, it often {means|mean} [hire:ing:meaning] more staff. Iceland {is said|be said} [test~have tested:toperf:perfto] the idea with excellent results a few years ago. Still, it's {no use} [copy:ing:expr] another country's model without asking what workers need. It may be better {for each company} [design:to:forto] its own plan."],"pt":["Trabalhar quatro dias por semana parece um sonho. Para uma empresa pequena, porém, isso muitas vezes significa contratar mais funcionários. Dizem que a Islândia testou a ideia com resultados excelentes alguns anos atrás. Mesmo assim, não adianta copiar o modelo de outro país sem perguntar do que os trabalhadores precisam. Talvez seja melhor cada empresa criar o seu próprio plano."],"w":{"dream":"sonho","though":"porém","staff":"funcionários","results":"resultados","model":"modelo","workers":"trabalhadores"},"cw":{"means":"mean = significar / implicar","is said":"dizem que","no use":"não adianta","for each company":"para cada empresa"}},{"id":"b2-43","frame":"Cover letter","framePt":"Carta de apresentação","title":"Junior designer","titlePt":"Designer júnior","body":["Dear Mr. Haddad, I am {proud} [work~have worked:toperf:perfto] on the new signs for the city metro during my internship. My manager also {asked me|ask someone} [redesign:to:obj] the station maps. After that, I {went on|go on} [join:to:goonto] a small studio in Lisbon, where I lead the packaging team. I always {appreciate} [give~be given:ingpass:passing] honest feedback, and I learn fast. I would welcome the {chance} [discuss:to:noun] my portfolio with you."],"pt":["Prezado Sr. Haddad, tenho orgulho de ter trabalhado na nova sinalização do metrô da cidade durante o meu estágio. O meu gestor também me pediu para redesenhar os mapas das estações. Depois disso, passei a trabalhar num pequeno estúdio em Lisboa, onde lidero a equipe de embalagens. Sempre valorizo receber feedback sincero, e aprendo rápido. Eu adoraria ter a chance de discutir o meu portfólio com o senhor."],"w":{"signs":"sinalização, placas","internship":"estágio","station maps":"mapas das estações","studio":"estúdio","packaging":"embalagens","honest feedback":"feedback sincero","welcome":"receberia bem","portfolio":"portfólio"},"cw":{"proud":"orgulhoso","asked me":"me pediu","went on":"go on = continuar / passar a","appreciate":"valorizo","chance":"chance, oportunidade"}},{"id":"b2-44","frame":"Building notice","framePt":"Aviso do prédio","title":"The pool is closing","titlePt":"A piscina vai fechar","body":["Dear residents, we {regret} [announce:to:regretto] that the pool will close on Monday. The tiles around it {need} [replace~be replaced:ing/topass:needing/passto], and the work {is expected|be expected} [last:to:want] six weeks. We know nobody {enjoys|enjoy} [wake~be woken:ingpass:passing] up by drills, so work will only start at 9 a.m. During this time, it is essential {for parents} [keep:to:forto] children away from the area."],"pt":["Prezados moradores, lamentamos anunciar que a piscina vai fechar na segunda. Os azulejos ao redor dela precisam ser trocados, e a previsão é que a obra dure seis semanas. Sabemos que ninguém gosta de ser acordado por furadeiras, então a obra só vai começar às 9h. Durante esse período, é essencial que os pais mantenham as crianças longe da área."],"w":{"residents":"moradores","pool":"piscina","tiles":"azulejos","drills":"furadeiras","essential":"essencial","area":"área"},"cw":{"regret":"lamentamos","need":"precisam","is expected":"previsto, esperado","enjoys":"gosta de","for parents":"para os pais"},"notes":[null,{"en":"Both work: need replacing = need to be replaced (after need, *-ing* has a passive meaning).","pt":"As duas servem: need replacing = need to be replaced (depois de need, o *-ing* tem sentido passivo)."},null,null,null]},{"id":"b2-45","frame":"Personal essay","framePt":"Ensaio pessoal","title":"Far from the city","titlePt":"Longe da cidade","body":["Five years ago I {gave up|give up} [live:ing:quit] in São Paulo and moved to a village in the mountains. My parents worried about {my} [move:ing:possing] so far from a hospital. I {spent} my first winter [learn:ing:expr] {how} [light:to:wh] a wood stove properly. Two years later I {went on|go on} [open:to:goonto] a small guesthouse with a friend. Now I can't {imagine} [sit:ing:enjoy] in traffic again."],"pt":["Cinco anos atrás eu desisti de morar em São Paulo e me mudei para uma vila nas montanhas. Os meus pais ficaram preocupados com o fato de eu me mudar para tão longe de um hospital. Passei o meu primeiro inverno aprendendo a acender um fogão a lenha direito. Dois anos depois, abri uma pequena pousada com uma amiga. Agora não consigo imaginar ficar parado no trânsito de novo."],"w":{"village":"vila","mountains":"montanhas","wood stove":"fogão a lenha","properly":"direito","guesthouse":"pousada","traffic":"trânsito"},"cw":{"gave up":"desisti de","my":"eu (o meu)","spent":"passei","how":"como","went on":"go on = continuar / passar a","imagine":"imaginar"}},{"id":"b2-46","frame":"Science news","framePt":"Notícia de ciência","title":"Music for plants","titlePt":"Música para plantas","body":["Many gardeners {claim} [notice~have noticed:toperf:perfto] that their plants grow faster with music. Scientists in Korea {tried|try} [play:ing:test] classical music to a rice field, just to see what would happen. The plants {seem} [react~have reacted:to:want] to the vibrations, not to the melody. The results still {need} [confirm~be confirmed:topass/ing:passto/needing] by other teams. Until then, there's {no point} [sing:ing:expr] to your tomatoes, but a little Mozart won't hurt."],"pt":["Muitos jardineiros afirmam ter notado que as plantas crescem mais rápido com música. Cientistas na Coreia experimentaram tocar música clássica para uma plantação de arroz, só para ver o que acontecia. As plantas parecem reagir às vibrações, e não à melodia. Os resultados ainda precisam ser confirmados por outras equipes. Até lá, não adianta cantar para os seus tomates, mas um pouco de Mozart não vai fazer mal."],"w":{"gardeners":"jardineiros","grow":"crescem","rice field":"plantação de arroz","vibrations":"vibrações","melody":"melodia","results":"resultados","hurt":"fazer mal"},"cw":{"claim":"afirmam","tried":"try = tentar / experimentar","seem":"parecem","need":"precisam","no point":"não adianta"},"notes":[null,null,null,{"en":"Both work: need to be confirmed = need confirming (after need, *-ing* has a passive meaning).","pt":"As duas servem: need to be confirmed = need confirming (depois de need, o *-ing* tem sentido passivo)."},null]},{"id":"b2-47","frame":"Speech","framePt":"Discurso","title":"Thirty-six years","titlePt":"Trinta e seis anos","body":["When I started here in 1989, I never {meant|mean} [stay:to:meanto] more than a year. I'll always {remember} [walk:ing:memory] in on my first day with a briefcase full of sandwiches. I still {can't help} [laugh:ing:expr] when I think of our old fax machine. {Thank you all for} [put up:ing:prep] with my terrible jokes for 36 years. [say:ing:subject] goodbye is harder than I expected, so please {go on|go on} [make:ing:goonin] this place feel like a family."],"pt":["Quando eu comecei aqui em 1989, eu não pretendia ficar mais de um ano. Sempre vou me lembrar de quando entrei no meu primeiro dia com uma pasta cheia de sanduíches. Ainda não consigo segurar o riso quando penso no nosso velho aparelho de fax. Obrigada a todos por aguentarem as minhas piadas horríveis por 36 anos. Dizer adeus é mais difícil do que eu esperava, então, por favor, continuem fazendo deste lugar uma família."],"w":{"briefcase":"pasta (de trabalho)","fax machine":"aparelho de fax","terrible jokes":"piadas horríveis","expected":"esperava"},"cw":{"meant":"mean = pretender / implicar","remember":"lembrar","can't help":"não consigo deixar de","Thank you all for":"obrigada a todos por","go on":"go on = continuar / passar a"}},{"id":"b2-48","frame":"Story","framePt":"História","title":"My first interview in English","titlePt":"A minha primeira entrevista em inglês","body":["Before my first job interview in English, I was {afraid of} [freeze:ing:afraidof] in the middle of a sentence. In the hall, I could {hear} the candidate before me [talk:ing:seeing] through the door in perfect English. When my turn came, I {tried hard|try} [stay:to:effort] calm, but I didn't understand the first question and was too {afraid} [ask:to:afraidto] her to repeat it. Luckily, the interviewer smiled and {let me|let someone} [start:bare:make] again. I left sure I had failed, {only} [receive:to:onlyto] a job offer that evening."],"pt":["Antes da minha primeira entrevista de emprego em inglês, eu tinha medo de travar no meio de uma frase. No corredor, eu ouvia o candidato antes de mim falando atrás da porta, num inglês perfeito. Quando chegou a minha vez, eu me esforcei muito para ficar calmo, mas não entendi a primeira pergunta e fiquei com medo demais de pedir para ela repetir. Por sorte, a entrevistadora sorriu e me deixou começar de novo. Saí certo de que tinha ido mal, só para receber uma proposta de emprego naquela noite."],"w":{"hall":"corredor","candidate":"candidato","turn":"vez","Luckily":"por sorte","interviewer":"entrevistadora","failed":"ido mal","job offer":"proposta de emprego"},"cw":{"afraid of":"com medo de","hear":"ouvir","tried hard":"me esforcei muito","afraid":"com medo","let me":"me deixou","only":"só (e aí, de surpresa)"}}]},"bonus":{"A2":[{"id":"a2-b01","pt":"Obrigado por vir!","en":"Thanks [for] [coming]!","dx":["to","come","came"]},{"id":"a2-b02","pt":"Eu vim aqui para estudar inglês.","en":"I came here [to] [study] English.","dx":["for","studying","studied"]},{"id":"a2-b03","pt":"Ela terminou de ler o livro.","en":"She [finished] [reading] the book.","dx":["to","read","of"]},{"id":"a2-b04","pt":"Eu preciso comprar pão.","en":"I [need] [to] [buy] bread.","dx":["buying","for","of"]},{"id":"a2-b05","pt":"Nadar faz bem para a saúde.","en":"[Swimming] is good for your health.","dx":["Swim","To","Swam"]},{"id":"a2-b06","pt":"Antes de sair, desligue a luz.","en":"[Before] [leaving], turn off the light.","dx":["leave","to","of"]},{"id":"a2-b07","pt":"Eu gostaria de visitar Roma.","en":"I [would] [like] [to] [visit] Rome.","dx":["visiting","of","for"]},{"id":"a2-b08","pt":"Ele é bom em desenhar.","en":"He's [good] [at] [drawing].","dx":["in","draw","to"]},{"id":"a2-b09","pt":"Você se importa de esperar?","en":"Do you [mind] [waiting]?","dx":["to","wait","of"]},{"id":"a2-b10","pt":"Inglês é fácil de aprender.","en":"English is [easy] [to] [learn].","dx":["of","learning","for"]},{"id":"a2-b11","pt":"Ela saiu sem dizer tchau.","en":"She left [without] [saying] goodbye.","dx":["say","to","of"]},{"id":"a2-b12","pt":"Nós decidimos ficar em casa.","en":"We [decided] [to] [stay] home.","dx":["staying","for","of"]},{"id":"a2-b13","pt":"Que tal ir ao cinema?","en":"[How] [about] [going] to the movies?","dx":["go","went","of"]},{"id":"a2-b14","pt":"Obrigado por ligar.","en":"Thank you [for] [calling].","dx":["to","call","by"]},{"id":"a2-b15","pt":"Eu acordei cedo para ver o nascer do sol.","en":"I got up early [to] [see] the sunrise.","dx":["for","seeing","saw"]},{"id":"a2-b16","pt":"Ela evita comer doces.","en":"She [avoids] [eating] sweets.","dx":["to","eat","of"]},{"id":"a2-b17","pt":"Aprender inglês é divertido.","en":"[Learning] English is fun.","dx":["Learn","To","Learned"]},{"id":"a2-b18","pt":"Nós planejamos visitar a vovó.","en":"We [plan] [to] [visit] Grandma.","dx":["visiting","for","of"]},{"id":"a2-b19","pt":"É importante dormir bem.","en":"It's [important] [to] [sleep] well.","dx":["sleeping","for","of"]},{"id":"a2-b20","pt":"Estou cansado de esperar.","en":"I'm [tired] [of] [waiting].","dx":["to","wait","for"]},{"id":"a2-b21","pt":"Você gostaria de beber alguma coisa?","en":"[Would] [you] [like] [to] [drink] something?","dx":["drinking","of","for"]},{"id":"a2-b22","pt":"Ele saiu depois de comer.","en":"He left [after] [eating].","dx":["eat","to","ate"]},{"id":"a2-b23","pt":"Ela continua me ligando.","en":"She [keeps] [calling] me.","dx":["to","call","of"]},{"id":"a2-b24","pt":"Eu espero te ver logo!","en":"I [hope] [to] [see] you soon!","dx":["seeing","of","for"]}],"B1":[],"B2":[]},"judge":{"A2":[],"B1":[{"id":"b1-j01","en":"I look forward to [see>seeing] you on Friday.","pt":"Estou ansioso para te ver na sexta.","rule":"toprep","why":"In look forward to, *to* is a preposition (look forward to the weekend), so the verb takes *-ing*.","whyPt":"Em look forward to, o *to* é preposição (look forward to the weekend), então o verbo vai com *-ing*."},{"id":"b1-j02","en":"My parents let me [stay] up late on Saturdays.","pt":"Os meus pais me deixam ficar acordado até tarde aos sábados.","rule":"make","why":"let + someone + the *verb* alone: right.","whyPt":"let + alguém + só o *verbo*: certo."},{"id":"b1-j03","en":"She asked me [wait>to wait] outside.","pt":"Ela me pediu para esperar lá fora.","rule":"obj","why":"ask + someone + *to + verb*.","whyPt":"ask + alguém + *to + verbo*."},{"id":"b1-j04","en":"I don't know what [to say] to him.","pt":"Eu não sei o que dizer a ele.","rule":"wh","why":"what + *to + verb*: right.","whyPt":"what + *to + verbo*: certo."},{"id":"b1-j05","en":"The movie made me [to cry>cry].","pt":"O filme me fez chorar.","rule":"make","why":"make + someone + the *verb* alone, with no *to*.","whyPt":"make + alguém + só o *verbo*, sem *to*."},{"id":"b1-j06","en":"She's used to [working] at night.","pt":"Ela está acostumada a trabalhar à noite.","rule":"toprep","why":"be used to (= be accustomed to) + *-ing*: right.","whyPt":"be used to (estar acostumado a) + *-ing*: certo."},{"id":"b1-j07","en":"You'd better [to take>take] an umbrella.","pt":"É melhor você levar um guarda-chuva.","rule":"better","why":"had better + the *verb* alone, no *to*.","whyPt":"had better + só o *verbo*, sem *to*."},{"id":"b1-j08","en":"I came to Canada [for study>to study] English.","pt":"Eu vim para o Canadá para estudar inglês.","rule":"purpose","why":"*para* (why) = *to + verb*, never for + verb.","whyPt":"*para* (para quê) = *to + verbo*, nunca for + verbo."},{"id":"b1-j09","en":"Do you feel like [going] out tonight?","pt":"Você está com vontade de sair hoje à noite?","rule":"expr","why":"feel like + *-ing*: right.","whyPt":"feel like (estar com vontade de) + *-ing*: certo."},{"id":"b1-j10","en":"We're interested in [learn>learning] Spanish.","pt":"A gente tem interesse em aprender espanhol.","rule":"prep","why":"After a preposition (in): *-ing*.","whyPt":"Depois de preposição (in): *-ing*."},{"id":"b1-j11","en":"It's time [to go] home.","pt":"Está na hora de ir para casa.","rule":"noun","why":"time + *to + verb*: right.","whyPt":"time + *to + verbo*: certo."},{"id":"b1-j12","en":"He suggested [to take>taking] the train.","pt":"Ele sugeriu pegar o trem.","rule":"enjoy","why":"suggest + *-ing*, never suggest to.","whyPt":"suggest + *-ing*, nunca suggest to."},{"id":"b1-j13","en":"I want [that you come>you to come] with me.","pt":"Eu quero que você venha comigo.","rule":"obj","why":"want + someone + *to + verb*. English has no \"want that\".","whyPt":"want + alguém + *to + verbo*. Em inglês não existe \"want that\"."},{"id":"b1-j14","en":"I can't afford [to buy] a new phone.","pt":"Eu não tenho dinheiro para comprar um celular novo.","rule":"want","why":"afford + *to + verb*: right.","whyPt":"afford (ter dinheiro para) + *to + verbo*: certo."},{"id":"b1-j15","en":"Let's go [to shopping>shopping] this weekend.","pt":"Vamos fazer compras neste fim de semana.","rule":"go","why":"go + *-ing* for free-time activities, with no *to*.","whyPt":"go + *-ing* para atividades de lazer, sem *to*."},{"id":"b1-j16","en":"She's too young [to drive].","pt":"Ela é nova demais para dirigir.","rule":"adj","why":"too + adjective + *to + verb*: right.","whyPt":"too + adjetivo + *to + verbo*: certo."},{"id":"b1-j17","en":"I spent the whole day [clean>cleaning] the house.","pt":"Eu passei o dia todo limpando a casa.","rule":"expr","why":"spend time + *-ing*.","whyPt":"spend time (passar tempo) + *-ing*."},{"id":"b1-j18","en":"Would you like [to dance]?","pt":"Você gostaria de dançar?","rule":"would","why":"would like + *to + verb*: right.","whyPt":"would like + *to + verbo*: certo."},{"id":"b1-j19","en":"[Smoke>Smoking] is bad for your health.","pt":"Fumar faz mal para a saúde.","rule":"subject","why":"An action as the subject: *-ing*.","whyPt":"Uma ação como sujeito: *-ing*."},{"id":"b1-j20","en":"Thanks for [helping] me with the boxes!","pt":"Obrigado por me ajudar com as caixas!","rule":"prep","why":"for is a preposition: *-ing*. Right.","whyPt":"for é preposição: *-ing*. Certo."},{"id":"b1-j21","en":"They helped us [move] to the new apartment.","pt":"Eles ajudaram a gente a se mudar para o apartamento novo.","rule":"help","why":"help + someone + the *verb* alone (or *to*): right.","whyPt":"help + alguém + só o *verbo* (ou *to*): certo."},{"id":"b1-j22","en":"I can't stand [wait>waiting] in long lines.","pt":"Eu não suporto esperar em filas longas.","rule":"enjoy","why":"can't stand + *-ing*.","whyPt":"can't stand (não suportar) + *-ing*."},{"id":"b1-j23","en":"She promised [calling>to call] me back.","pt":"Ela prometeu me ligar de volta.","rule":"want","why":"promise + *to + verb*.","whyPt":"promise + *to + verbo*."},{"id":"b1-j24","en":"He left without [saying] a word.","pt":"Ele saiu sem dizer uma palavra.","rule":"prep","why":"without + *-ing*: right.","whyPt":"without + *-ing*: certo."},{"id":"b1-j25","en":"I'm not used to [drive>driving] on the left.","pt":"Eu não estou acostumado a dirigir pela esquerda.","rule":"toprep","why":"In be used to (= be accustomed to), *to* is a preposition, so the verb takes *-ing*.","whyPt":"Em be used to (estar acostumado a), o *to* é preposição, então o verbo vai com *-ing*."},{"id":"b1-j26","en":"The teacher made us [rewrite] the essay.","pt":"A professora fez a gente reescrever a redação.","rule":"make","why":"make + someone + the *verb* alone: right.","whyPt":"make + alguém + só o *verbo*: certo."},{"id":"b1-j27","en":"Dad wants [that Tom drives>Tom to drive] more slowly.","pt":"O papai quer que o Tom dirija mais devagar.","rule":"obj","why":"English has no want that…: want + someone + *to + verb*.","whyPt":"Em inglês não existe want that…: want + alguém + *to + verbo* (querer que alguém faça)."},{"id":"b1-j28","en":"We'd rather [stay] home tonight.","pt":"A gente prefere ficar em casa hoje à noite.","rule":"better","why":"would rather ('d rather) + the *verb* alone: right.","whyPt":"would rather ('d rather) + só o *verbo*: certo."},{"id":"b1-j29","en":"She went to the bank [for get>to get] some cash.","pt":"Ela foi ao banco para pegar dinheiro.","rule":"purpose","why":"To say why, English uses *to + verb*, never for + verb (*para* = to here).","whyPt":"Para dizer o porquê, o inglês usa *to + verbo*, nunca for + verbo (aqui *para* = to)."},{"id":"b1-j30","en":"We had fun [playing] in the snow.","pt":"A gente se divertiu brincando na neve.","rule":"expr","why":"have fun + *-ing*: right.","whyPt":"have fun + *-ing*: certo."},{"id":"b1-j31","en":"This box is too heavy [carrying>to carry].","pt":"Esta caixa é pesada demais para carregar.","rule":"adj","why":"too + adjective + *to + verb*.","whyPt":"too + adjetivo + *to + verbo* (pesada demais *para carregar*)."},{"id":"b1-j32","en":"Can you show me how [to use] this machine?","pt":"Você pode me mostrar como usar esta máquina?","rule":"wh","why":"how + *to + verb*: right.","whyPt":"how + *to + verbo*: certo."},{"id":"b1-j33","en":"Can you help me [carrying>carry] these bags?","pt":"Você pode me ajudar a carregar estas sacolas?","rule":"help","why":"help + someone + the *verb* alone (or *to + verb*), never *-ing*.","whyPt":"help + alguém + só o *verbo* (ou *to + verbo*), nunca *-ing*."},{"id":"b1-j34","en":"I look forward to [meeting] your family.","pt":"Estou ansioso para conhecer a sua família.","rule":"toprep","why":"look forward to + *-ing* (*to* is a preposition): right.","whyPt":"look forward to + *-ing* (o *to* é preposição): certo."},{"id":"b1-j35","en":"My parents didn't let me [to go>go] to the party.","pt":"Os meus pais não me deixaram ir à festa.","rule":"make","why":"let + someone + the *verb* alone, with no *to*.","whyPt":"let + alguém + só o *verbo*, sem *to*."},{"id":"b1-j36","en":"I don't have time [to cook] tonight.","pt":"Eu não tenho tempo para cozinhar hoje à noite.","rule":"noun","why":"time + *to + verb*: right.","whyPt":"time + *to + verbo*: certo."},{"id":"b1-j37","en":"Would you mind [to close>closing] the window?","pt":"Você se importaria de fechar a janela?","rule":"enjoy","why":"mind is always followed by *-ing*.","whyPt":"mind vem sempre com *-ing*."},{"id":"b1-j38","en":"The doctor told me [to rest] for a week.","pt":"O médico me disse para descansar por uma semana.","rule":"obj","why":"tell + someone + *to + verb*: right.","whyPt":"tell + alguém + *to + verbo*: certo."},{"id":"b1-j39","en":"I'd love [visiting>to visit] Japan one day.","pt":"Eu adoraria visitar o Japão um dia.","rule":"would","why":"would love ('d love) takes *to + verb*, even though love alone can take *-ing*.","whyPt":"would love ('d love) pede *to + verbo*, mesmo que love sozinho aceite *-ing*."},{"id":"b1-j40","en":"[Eating] vegetables every day is good for you.","pt":"Comer verduras todo dia faz bem.","rule":"subject","why":"An action as the subject takes *-ing*: right.","whyPt":"Uma ação como sujeito vai com *-ing*: certo."},{"id":"b1-j41","en":"You'd better [not to tell>not tell] her.","pt":"É melhor você não contar para ela.","rule":"better","why":"had better (not) + the *verb* alone, no *to*.","whyPt":"had better (not) + só o *verbo*, sem *to*."},{"id":"b1-j42","en":"I love [dancing] at weddings.","pt":"Eu adoro dançar em casamentos.","rule":"like","why":"love + *-ing* (or *to + verb*): right.","whyPt":"love + *-ing* (ou *to + verbo*): certo."},{"id":"b1-j43","en":"When it comes to [cook>cooking], my dad is the best.","pt":"Quando o assunto é cozinhar, o meu pai é o melhor.","rule":"toprep","why":"In when it comes to, *to* is a preposition, so the verb takes *-ing*.","whyPt":"Em when it comes to, o *to* é preposição, então o verbo vai com *-ing*."},{"id":"b1-j44","en":"This song always makes me [smile].","pt":"Esta música sempre me faz sorrir.","rule":"make","why":"make + someone + the *verb* alone: right.","whyPt":"make + alguém + só o *verbo*: certo."},{"id":"b1-j45","en":"I spent two hours [to fix>fixing] my bike.","pt":"Eu passei duas horas consertando a minha bicicleta.","rule":"expr","why":"spend time + *-ing*, never *to + verb*.","whyPt":"spend time + *-ing*, nunca *to + verbo*."},{"id":"b1-j46","en":"She's old enough [to vote] now.","pt":"Ela já tem idade suficiente para votar.","rule":"adj","why":"adjective + enough + *to + verb*: right.","whyPt":"adjetivo + enough + *to + verbo*: certo."},{"id":"b1-j47","en":"She's good at [solve>solving] puzzles.","pt":"Ela é boa em resolver quebra-cabeças.","rule":"prep","why":"After a preposition (at), the verb takes *-ing*.","whyPt":"Depois de preposição (at), o verbo vai com *-ing* (*boa em resolver*)."},{"id":"b1-j48","en":"We decided [to take] the train.","pt":"A gente decidiu pegar o trem.","rule":"want","why":"decide + *to + verb*: right.","whyPt":"decide + *to + verbo*: certo."}],"B2":[]},"meaning":{"A2":[],"B1":[],"B2":[{"id":"b2-m01","a":"He stopped [smoking].","b":"He stopped [to smoke].","ma":"He doesn't smoke any more.","maPt":"Ele não fuma mais (parou de fumar).","mb":"He stopped what he was doing so he could smoke.","mbPt":"Ele parou o que estava fazendo para fumar.","rule":"quit","why":"stop + *-ing* = no more (*parar de fazer algo*); stop + *to* = in order to (*parar para fazer algo*).","whyPt":"stop + *-ing* = não fazer mais (*parar de fazer algo*); stop + *to* = *parar para fazer algo*."},{"id":"b2-m02","a":"I always remember [locking] the door.","b":"I always remember [to lock] the door.","ma":"Every time I lock it, I can see that moment in my mind later.","maPt":"Toda vez que eu tranco, depois me lembro desse momento.","mb":"Locking it is a task I never forget.","mbPt":"Trancar é uma tarefa que eu nunca esqueço.","rule":"memory","why":"remember + *-ing* = a memory of the past; remember + *to* = a task.","whyPt":"remember + *-ing* = lembrança do passado; remember + *to* = uma tarefa."},{"id":"b2-m03","a":"Try [opening] the window.","b":"Try [to open] the window.","ma":"Open it and see if the room gets cooler.","maPt":"Abra e veja se o quarto fica mais fresco.","mb":"Make an effort: it's stuck.","mbPt":"Faça força: ela está emperrada.","rule":"test","why":"try + *-ing* = an experiment; try + *to* = an effort.","whyPt":"try + *-ing* = um teste; try + *to* = um esforço."},{"id":"b2-m04","a":"I forgot [buying] the milk.","b":"I forgot [to buy] the milk.","ma":"I bought it, but I forgot that I did (so now we have two!).","maPt":"Eu comprei, mas esqueci que tinha comprado (agora temos dois!).","mb":"I didn't buy it.","mbPt":"Eu não comprei.","rule":"task","why":"forget + *to* = a task not done; forget + *-ing* = the memory is gone.","whyPt":"forget + *to* = uma tarefa não feita; forget + *-ing* = a lembrança sumiu."},{"id":"b2-m05","a":"We stopped [chatting].","b":"We stopped [to chat].","ma":"We were chatting, and then we went quiet.","maPt":"A gente estava conversando e ficou em silêncio.","mb":"We stopped walking so we could chat.","mbPt":"A gente parou de andar para conversar.","rule":"quit","why":"stop + *-ing* = no more; stop + *to* = in order to.","whyPt":"stop + *-ing* = não fazer mais; stop + *to* = parar para fazer algo."},{"id":"b2-m06","a":"She tried [to call] him.","b":"She tried [calling] him.","ma":"She made an effort, but she couldn't get through.","maPt":"Ela tentou, mas não conseguiu completar a ligação.","mb":"A text didn't work, so she called him to see if that worked.","mbPt":"A mensagem não funcionou, então ela testou ligar para ver se dava certo.","rule":"effort","why":"try + *to* = an effort (maybe it fails); try + *-ing* = another way, to see if it works.","whyPt":"try + *to* = um esforço (talvez falhe); try + *-ing* = outro jeito, para ver se funciona."},{"id":"b2-m07","a":"He stopped [to look] at the map.","b":"He stopped [looking] at the map.","ma":"He stopped walking so he could look at the map.","maPt":"Ele parou de andar para olhar o mapa.","mb":"He was looking at the map, and then he put it away.","mbPt":"Ele estava olhando o mapa e depois guardou.","rule":"pause","why":"stop + *to* = in order to (*parar para fazer algo*); stop + *-ing* = no more (*parar de fazer algo*).","whyPt":"stop + *to* = *parar para fazer algo*; stop + *-ing* = *parar de fazer algo*."},{"id":"b2-m08","a":"He remembered [to buy] flowers.","b":"He remembered [buying] flowers.","ma":"He didn't forget the task: he bought them.","maPt":"Ele não esqueceu a tarefa: comprou as flores.","mb":"He had a memory of buying them before.","mbPt":"Ele tinha a lembrança de ter comprado antes.","rule":"task","why":"remember + *to* = a task (and he did it); remember + *-ing* = a memory.","whyPt":"remember + *to* = uma tarefa (e ele fez); remember + *-ing* = uma lembrança."},{"id":"b2-m09","a":"They stopped [eating].","b":"They stopped [to eat].","ma":"They were full, so they put down their forks.","maPt":"Estavam satisfeitos, então largaram os garfos.","mb":"They stopped driving so they could have lunch.","mbPt":"Pararam de dirigir para almoçar.","rule":"quit","why":"stop + *-ing* = no more; stop + *to* = in order to.","whyPt":"stop + *-ing* = não fazer mais; stop + *to* = parar para fazer algo."},{"id":"b2-m10","a":"She stopped [to help] the old man.","b":"She stopped [helping] the old man.","ma":"She was walking, and she stopped so she could help him.","maPt":"Ela estava andando e parou para ajudar o senhor.","mb":"She used to help him, but not any more.","mbPt":"Ela ajudava o senhor, mas não ajuda mais.","rule":"pause","why":"stop + *to* = *parar para fazer algo*; stop + *-ing* = *parar de fazer algo*.","whyPt":"stop + *to* = *parar para fazer algo*; stop + *-ing* = *parar de fazer algo*."},{"id":"b2-m11","a":"We tried [pushing] the car.","b":"We tried [to push] the car.","ma":"It wouldn't start, so we pushed it to see if that helped.","maPt":"Ele não pegava, então a gente empurrou para ver se ajudava.","mb":"We made an effort, but it was too heavy to move.","mbPt":"A gente fez força, mas era pesado demais para mover.","rule":"test","why":"try + *-ing* = an experiment; try + *to* = an effort that may fail.","whyPt":"try + *-ing* = um teste; try + *to* = um esforço que pode falhar."},{"id":"b2-m12","a":"I remember [paying] the bill.","b":"I remember [to pay] the bill.","ma":"I paid it; I have a clear memory of doing it.","maPt":"Eu paguei; me lembro bem de ter pago.","mb":"Every month I don't forget to pay it.","mbPt":"Todo mês eu não esqueço de pagar.","rule":"memory","why":"remember + *-ing* = a memory; remember + *to* = a task.","whyPt":"remember + *-ing* = uma lembrança; remember + *to* = uma tarefa."},{"id":"b2-m13","a":"He forgot [to meet] her.","b":"He forgot [meeting] her.","ma":"They had an appointment, but he didn't go.","maPt":"Eles tinham um encontro marcado, mas ele não foi.","mb":"They met once, but he has no memory of it.","mbPt":"Eles se conheceram uma vez, mas ele não se lembra.","rule":"task","why":"forget + *to* = a task not done; forget + *-ing* = a lost memory.","whyPt":"forget + *to* = uma tarefa não feita; forget + *-ing* = uma lembrança perdida."},{"id":"b2-m14","a":"Stop [thinking] for a second.","b":"Stop [to think] for a second.","ma":"Clear your mind: don't think.","maPt":"Esvazie a cabeça: não pense.","mb":"Pause what you're doing and think.","mbPt":"Pare o que está fazendo e pense.","rule":"quit","why":"stop + *-ing* = no more; stop + *to* = pause in order to.","whyPt":"stop + *-ing* = não fazer mais; stop + *to* = parar para fazer algo."},{"id":"b2-m15","a":"After the speech, she went on [talking] about her trip.","b":"After the speech, she went on [to talk] about her trip.","ma":"Her speech was about the trip, and she kept talking about it.","maPt":"O discurso era sobre a viagem, e ela continuou falando dela.","mb":"Her speech was about something else; next, she talked about the trip.","mbPt":"O discurso era sobre outra coisa; depois, ela passou a falar da viagem.","rule":"goonin","why":"go on + *-ing* = keep doing the same thing; go on + *to* = do something new next.","whyPt":"go on + *-ing* = continuar fazendo a mesma coisa; go on + *to* = passar a fazer algo novo."},{"id":"b2-m16","a":"After college, she went on [to work] for the same company.","b":"After college, she went on [working] for the same company.","ma":"College ended, and then she started a job at that company.","maPt":"A faculdade acabou, e aí ela começou a trabalhar naquela empresa.","mb":"She already worked there during college, and she didn't stop.","mbPt":"Ela já trabalhava lá durante a faculdade e continuou trabalhando.","rule":"goonto","why":"go on + *to* = the next step, something new; go on + *-ing* = continue.","whyPt":"go on + *to* = o passo seguinte, algo novo; go on + *-ing* = continuar."},{"id":"b2-m17","a":"I regret [telling] you this.","b":"I regret [to tell] you this.","ma":"I told you, and now I'm sorry I did.","maPt":"Eu contei, e agora me arrependo.","mb":"I'm sorry, but I have bad news for you now.","mbPt":"Lamento, mas tenho uma má notícia para você agora.","rule":"memory","why":"regret + *-ing* = sorry about the past; regret + *to* = sorry about what you are going to say now.","whyPt":"regret + *-ing* = arrependimento pelo passado; regret + *to* = *lamentar* o que você vai dizer agora."},{"id":"b2-m18","a":"I saw her [cross] the street.","b":"I saw her [crossing] the street.","ma":"I saw the whole thing, from one side to the other.","maPt":"Eu vi tudo, de um lado ao outro.","mb":"I saw her in the middle of it, for a moment.","mbPt":"Eu a vi no meio da travessia, por um momento.","rule":"seebare","why":"see + someone + the *verb* alone = the whole action; + *-ing* = part of it, while it was happening.","whyPt":"see + alguém + só o *verbo* = a ação inteira; + *-ing* = só uma parte, enquanto acontecia."},{"id":"b2-m19","a":"I heard the baby [crying].","b":"I heard the baby [cry].","ma":"The baby was crying for a while when I heard it.","maPt":"O bebê estava chorando fazia um tempo quando eu ouvi.","mb":"The baby gave one short cry, and I heard all of it.","mbPt":"O bebê deu um choro curto, e eu ouvi do começo ao fim.","rule":"seeing","why":"hear + someone + *-ing* = in progress; + the *verb* alone = the whole (short) action.","whyPt":"hear + alguém + *-ing* = em andamento; + só o *verbo* = a ação inteira (e curta)."},{"id":"b2-m20","a":"I was afraid [to wake] the baby.","b":"I was afraid [of waking] the baby.","ma":"I didn't dare wake the baby, so I didn't.","maPt":"Eu não tive coragem de acordar o bebê, então não acordei.","mb":"I was worried I might wake the baby by accident, so I walked very quietly.","mbPt":"Eu tinha medo de acordar o bebê sem querer, então andei bem devagar.","rule":"afraidto","why":"afraid + *to* = too scared to do it on purpose; afraid of + *-ing* = scared it might happen.","whyPt":"afraid + *to* = medo de fazer algo de propósito; afraid of + *-ing* = medo de que algo aconteça."},{"id":"b2-m21","a":"Did you remember [to feed] the cat?","b":"Did you remember [feeding] the cat?","ma":"Feeding the cat was your task. Did you do it?","maPt":"Dar comida para o gato era tarefa sua. Você deu?","mb":"You fed the cat. Do you have a memory of it?","mbPt":"Você deu comida para o gato. Você se lembra disso?","rule":"task","why":"remember + *to* = a task; remember + *-ing* = a memory of the past.","whyPt":"remember + *to* = uma tarefa; remember + *-ing* = uma lembrança do passado."},{"id":"b2-m22","a":"The dog needs [walking].","b":"The dog needs [to walk].","ma":"Someone has to take the dog for a walk.","maPt":"Alguém precisa levar o cachorro para passear.","mb":"The dog itself has to walk more (for its health).","mbPt":"O próprio cachorro precisa caminhar mais (pela saúde).","rule":"needing","why":"need + *-ing* is passive (it needs to be walked); need + *to* = the subject does it.","whyPt":"need + *-ing* é passivo (precisa ser levado); need + *to* = o próprio sujeito faz."},{"id":"b2-m23","a":"They stopped [to talk] to us.","b":"They stopped [talking] to us.","ma":"They were walking, and they stopped so they could chat with us.","maPt":"Eles estavam andando e pararam para conversar com a gente.","mb":"They don't speak to us any more.","mbPt":"Eles não falam mais com a gente.","rule":"pause","why":"stop + *to* = stop in order to do something; stop + *-ing* = no more.","whyPt":"stop + *to* = *parar para* fazer algo; stop + *-ing* = *parar de* fazer."},{"id":"b2-m24","a":"He stopped [answering] the phone.","b":"He stopped [to answer] the phone.","ma":"These days he never answers it.","maPt":"Hoje em dia ele nunca atende.","mb":"He stopped what he was doing because the phone rang.","mbPt":"Ele parou o que estava fazendo porque o telefone tocou.","rule":"quit","why":"stop + *-ing* = no more (*parar de*); stop + *to* = in order to (*parar para*).","whyPt":"stop + *-ing* = não fazer mais (*parar de*); stop + *to* = *parar para*."},{"id":"b2-m25","a":"She seems [to know] him.","b":"She seems [to have known] him.","ma":"It looks as if she knows him now.","maPt":"Parece que ela o conhece.","mb":"It looks as if she knew him at some time in the past.","mbPt":"Parece que ela o conheceu em algum momento do passado.","rule":"perfto","why":"seem + *to + verb* = now; seem + *to have* + past participle = before.","whyPt":"seem + *to + verbo* = agora; seem + *to have* + particípio = antes."},{"id":"b2-m26","a":"The kids love [telling] stories.","b":"The kids love [being told] stories.","ma":"The kids are the storytellers.","maPt":"As crianças é que contam as histórias.","mb":"Someone tells the kids stories, and they love it.","mbPt":"Alguém conta histórias para as crianças, e elas adoram.","rule":"passing","why":"*being* + past participle = the subject receives the action; the simple *-ing* = the subject does it.","whyPt":"*being* + particípio = o sujeito recebe a ação; o *-ing* simples = o sujeito faz a ação."},{"id":"b2-m27","a":"Try [taking] the stairs.","b":"Try [to take] the stairs.","ma":"The elevator is slow: take the stairs and see if it's faster.","maPt":"O elevador é lento: vá de escada e veja se é mais rápido.","mb":"Your knee hurts, but make an effort to use the stairs.","mbPt":"O seu joelho dói, mas faça um esforço para usar a escada.","rule":"test","why":"try + *-ing* = an experiment; try + *to* = an effort.","whyPt":"try + *-ing* = um teste; try + *to* = um esforço."},{"id":"b2-m28","a":"We watched the sun [set].","b":"We watched the sun [setting].","ma":"We watched until it disappeared.","maPt":"A gente ficou olhando até ele sumir.","mb":"We watched it for a while as it went down.","mbPt":"A gente olhou por um tempo enquanto ele descia.","rule":"seebare","why":"watch + something + the *verb* alone = the whole action; + *-ing* = part of it.","whyPt":"watch + algo + só o *verbo* = a ação inteira; + *-ing* = só uma parte."}]},"proof":{"A2":[],"B1":[],"B2":[{"id":"b2-f01","frame":"Cover letter","framePt":"Carta de apresentação","title":"Application for the sales job","titlePt":"Candidatura à vaga de vendas","body":["Dear Ms. Lee, I am writing [apply:to:purpose] for the sales position. I {enjoy} [work:to>ing:enjoy] with people, and I have experience {in} [sell:ing:prep] software. Last month I {decided|decide} [leave:ing>to:want] my current job [grow:to:purpose] professionally. I {look forward to} [hear:bare>ing:toprep] from you."],"pt":["Prezada Sra. Lee, escrevo para me candidatar à vaga de vendas. Gosto de trabalhar com pessoas e tenho experiência em vender software. No mês passado decidi deixar o meu emprego atual para crescer profissionalmente. Aguardo o seu retorno."],"w":{"position":"vaga","current job":"emprego atual","professionally":"profissionalmente"},"cw":{"enjoy":"gosto, curto","in":"em","decided":"decidi","look forward to":"aguardo"}},{"id":"b2-f02","frame":"Email","framePt":"E-mail","title":"About my essay","titlePt":"Sobre a minha redação","body":["Dear Professor Kim, {thank you for} [explain:ing:prep] the assignment so clearly. I'm sorry, but I {forgot} [send:ing>to:task] my essay yesterday. I {would like} [request:to:would] one more day, if possible. I usually {avoid} [ask:to>ing:enjoy] for extensions, I promise. Could you {let me} [submit:to>bare:make] it tomorrow? Best, Lucas"],"pt":["Prezada Professora Kim, obrigado por explicar o trabalho com tanta clareza. Desculpe, mas eu esqueci de mandar a minha redação ontem. Eu gostaria de pedir mais um dia, se possível. Normalmente eu evito pedir prorrogação, prometo. A senhora me deixaria entregar amanhã? Abraço, Lucas"],"w":{"assignment":"trabalho, tarefa","clearly":"com clareza","extensions":"prorrogações de prazo"},"cw":{"thank you for":"obrigado por","forgot":"esqueci","would like":"gostaria","avoid":"evito","let me":"me deixar"}},{"id":"b2-f03","frame":"Blog","framePt":"Blog","title":"One year in Berlin","titlePt":"Um ano em Berlim","body":["[live:ing:subject] abroad changes you. At first I {wasn't used to|be used to} [eat:bare>ing:toprep] dinner at six. I {managed} [find:ing>to:want] a job in three months, and my colleagues {made me} [feel:bare:make] welcome. {When it comes to} [learn:ing:toprep] German, I {keep} [mix up:ing:enjoy] der, die and das! On we espostas soam. *to + verbo* (try to practice) = se esforçar para praticar. Nenhuma das duas é erro."}]},{"id":"b2-f07","frame":"Email","framePt":"E-mail","title":"About Friday's workshop","titlePt":"Sobre o workshop de sexta","body":["Dear Ms. Lopez, thank you {for} [organize:ing:prep] Friday's workshop. I really {enjoyed|enjoy} [work:to>ing:enjoy] in small groups. The speaker {seemed|seem} [know~have known:to:want] a lot about the topic, and I only {regret} not [ask:ing:memory] more questions. Next time, it would be useful {for us} [receive:ing>to:forto] the slides before the session. I {look forward to} [attend:bare>ing:toprep] the next one."],"pt":["Prezada Sra. Lopez, obrigado por organizar o workshop de sexta. Eu gostei muito de trabalhar em grupos pequenos. O palestrante parecia saber muito sobre o assunto, e eu só me arrependo de não ter feito mais perguntas. Da próxima vez, seria útil a gente receber os slides antes da sessão. Estou ansioso para participar do próximo."],"w":{"workshop":"workshop, oficina","speaker":"palestrante","topic":"assunto","useful":"útil","session":"sessão"},"cw":{"for":"por","enjoyed":"gostei","seemed":"parecia","regret":"me arrependo","for us":"para nós (a gente…)","look forward to":"estou ansioso para"},"notes":[null,null,null,{"en":"The *not* goes right before the *-ing*: not asking.","pt":"O *not* vem logo antes do *-ing*: not asking."}]},{"id":"b2-f08","frame":"Blog","framePt":"Blog","title":"Our old apartment","titlePt":"O nosso apartamento antigo","body":["When we bought this apartment, almost everything was old. The floors {seem} [install~have been installed:toperf:perfto] in the 1950s, and the kitchen {needed|need} [paint~be painted:to>topass/ing:passto/needing]. We {decided|decide} [do:to:want] most of the work ourselves. It's {worth} [learn:to>ing:expr] a few basic skills: you save a lot of money. One tip: {avoid} [buy:to>ing:enjoy] cheap paint, because you'll need two extra coats."],"pt":["Quando a gente comprou este apartamento, quase tudo era velho. O piso parece ter sido instalado nos anos 1950, e a cozinha precisava ser pintada. A gente decidiu fazer a maior parte da obra sozinhos. Vale a pena aprender algumas habilidades básicas: você economiza muito dinheiro. Uma dica: evite comprar tinta barata, porque você vai precisar de duas demãos a mais."],"w":{"floors":"piso","basic skills":"habilidades básicas","save":"economiza","paint":"tinta","coats":"demãos"},"cw":{"seem":"parece","needed":"precisava","decided":"decidimos","worth":"vale a pena","avoid":"evite"},"notes":[null,{"en":"Both work: needed to be painted = needed painting. *to paint* would mean the kitchen paints something!","pt":"As duas servem: needed to be painted = needed painting. *to paint* seria a cozinha pintando alguma coisa!"}]},{"id":"b2-f09","frame":"Article","framePt":"Artigo","title":"Volunteering abroad","titlePt":"Trabalho voluntário no exterior","body":["Volunteering abroad often {means|mean} [live:to>ing:meaning] without many comforts, but it can change your life. {Before} [decide:to>ing:prep], read reviews from past volunteers, and don't be {afraid} [ask:to:afraidto] questions. Good programs are {dedicated to} [help:bare>ing:toprep] local communities, not tourists. {In addition to} [teach:ing:toprep] English, you might build schools or plant trees. It's important {for you} [choose:to:forto] a program carefully. Many volunteers later {go on} [work:to:goonto] for big charities."],"pt":["Fazer trabalho voluntário no exterior muitas vezes significa viver sem muito conforto, mas pode mudar a sua vida. Antes de decidir, leia avaliações de ex-voluntários e não tenha medo de fazer perguntas. Bons programas se dedicam a ajudar as comunidades locais, e não os turistas. Além de ensinar inglês, você pode construir escolas ou plantar árvores. É importante que você escolha um programa com cuidado. Muitos voluntários depois passam a trabalhar para grandes ONGs."],"w":{"abroad":"no exterior","comforts":"conforto","revie et her":"deixou ela","went on":"go on = continuar / passar a"},"notes":[null,null,null,{"en":"Both work: all she could do was (to) whisper the song. Without *to* is more common.","pt":"As duas servem: all she could do was (to) whisper the song. Sem *to* é mais comum."}]},{"id":"b2-f13","frame":"Email","framePt":"E-mail","title":"Come to Recife!","titlePt":"Venha para Recife!","body":["Hi Jake! I {can't wait} [show:to:want] you around Recife. You'll {need} [bring:ing>to:want] sunscreen: the sun here is strong. {Instead of} [stay:to>ing:prep] in a hotel, you can stay with us. My mom {insists on} [cook:ing:prep] for every guest, so come hungry! I {suggest} [book:to>ing:enjoy] your flight soon, because prices go up in December. {Let me|let someone} [know:bare:make] your dates!"],"pt":["Oi, Jake! Mal posso esperar para te mostrar Recife. Você vai precisar trazer protetor solar: o sol aqui é forte. Em vez de ficar num hotel, você pode ficar com a gente. A minha mãe faz questão de cozinhar para todo hóspede, então venha com fome! Sugiro reservar o seu voo logo, porque os preços sobem em dezembro. Me avisa as suas datas!"],"w":{"around":"por aí, pela cidade","sunscreen":"protetor solar","guest":"hóspede","hungry":"com fome","prices":"preços"},"cw":{"can't wait":"mal posso esperar","need":"precisar","Instead of":"em vez de","insists on":"faz questão de","suggest":"sugiro","Let me":"me deixe"}},{"id":"b2-f14","frame":"Blog","framePt":"Blog","title":"Training for a marathon","titlePt":"Treinando para uma maratona","body":["Six months ago I {decided|decide} [run:to:want] a marathon. At first I {wasn't used to|be used to} [get up:to>ing:toprep] at 5 a.m. My coach {made me|make someone} [do:to>bare:make] stretches every single day. I also {stopped|stop} [eat:ing:quit] sugar, which was the hardest part. On long runs I {stop} every 10 km [drink:to:pause] some water. [finish:ing:subject] my first 30 km felt amazing."],"pt":["Seis meses atrás eu decidi correr uma maratona. No começo prove:bare/to:help] my pronunciation a lot. I {recommend} [use:to>ing:enjoy] it for 20 minutes a day. {Why not} [give:bare:better] it a try?"],"pt":["Praticar com falantes nativos é o melhor jeito de perder o medo. O aplicativo deixa você escolher um parceiro pelos interesses, e é fácil encontrar alguém online a qualquer hora. O meu parceiro me ajudou muito a melhorar a minha pronúncia. Recomendo usar o app por 20 minutos por dia. Por que não dar uma chance?"],"w":{"native speakers":"falantes nativos","fear":"medo","partner":"parceiro","interests":"interesses","pronunciation":"pronúncia","a try":"uma chance"},"cw":{"way":"jeito","lets you":"deixa você","easy":"fácil","helped me":"me ajudou","recommend":"recomendo","Why not":"por que não"}},{"id":"b2-f17","frame":"Story","framePt":"História","title":"Forty","titlePt":"Quarenta","body":["On my 40th birthday, my husband {seemed|seem} [forget~have forgotten:toperf:perfto] completely. All day I {tried hard|try} not [show:ing>to:effort] that I was upset. That evening he {suggested|suggest} [go:to>ing:enjoy] out for a quick pizza, and the restaurant was full of our friends! He {had spent|spend} weeks [organize:to>ing:expr] it with my sister. I felt terrible {for} [doubt~have doubted:ingperf/ing:perfing/prep] him, and he certainly {deserves|deserve} [thank~be thanked:topass:passto] properly."],"pt":["No meu aniversário de 40 anos, o meu marido parecia ter esquecido completamente. O dia todo eu me esforcei muito para não mostrar que estava chateada. Naquela noite ele sugeriu sair para comer uma pizza rápida, e o restaurante estava cheio de amigos nossos! Ele tinha passado semanas organizando tudo com a minha irmã. Eu me senti péssima por ter duvidado dele, e ele com certeza merece ser agradecido do jeito certo."],"w":{"upset":"chateada","quick":"rápida","full of":"cheio de","terrible":"péssima","properly":"do jeito certo"},"cw":{"seemed":"parecia","tried hard":"me esforcei muito","suggested":"sugeriu","had spent":"tinha passado","for":"por","deserves":"merece"},"notes":[null,null,null,null,{"en":"Both work: *for having doubted* makes it clear it happened first; *for doubting* is also fine.","pt":"As duas servem: *for having doubted* deixa claro que aconteceu antes; *for doubting* também está certo."},null]},{"id":"b2-f18","frame":"Formal email","framePt":"E-mail formal","title":"Where is my sofa?","titlePt":"Cadê o meu sofá?","body":["Dear Sir or Madam, I {expected|expect} my new sofa [deliver~be delivered:topass:passto] on March 3. I waited at home all day, {only} [receive:ing>to:onlyto] a text at 8 p.m. saying the driver had run out of time. Your company {claims|claim} [try~have tried:toperf:perfto] to call me twice, but I have no missed calls. I {object to} [treat~be treated:topass>ingpass:passing] like this. I would {appreciate} [get:to>ing:enjoy] a full refund; otherwise, I will have {no choice but} [contact:to:setto] my bank."],"pt":["Prezados, eu esperava que o meu sofá novo fosse entregue no dia 3 de março. Esperei em casa o dia inteiro, só para receber uma mensagem às 20h dizendo que o motorista tinha ficado sem tempo. A empresa de vocês afirma ter tentado me ligar duas vezes, mas eu não tenho nenhuma chamada perdida. Eu me oponho a ser tratada desse jeito. Eu agradeceria se recebesse o reembolso total; caso contrário, não terei outra escolha a não ser acionar o meu banco."],"w":{"Dear Sir or Madam":"prezados","run out of time":"ficado sem tempo","missed calls":"chamadas perdidas","full refund":"reembolso total","otherwise":"caso contrário"},"cw":{"expected":"esperava","only":"só (e aí, de surpresa)","claims":"afirma","object to":"me oponho a","appreciate":"agradeceria","no choice but":"nenhuma outra escolha a não ser"}},{"id":"b2-f19","frame":"Blog","framePt":"Blog","title":"Cooking at 35","titlePt":"Cozinhando aos 35","body":["I never {learned|learn} [cook:ing>to:want] as a kid, because my mom {didn't let|let someone} anyone [touch:bare:make] her pots. Last year I finally {got tired of|get tired of} [order:ing:prep] takeout. I'll never {forget} [burn:ing:memory] my first lasagna! {When it comes to} [bake:bare>ing:toprep], I'm still a disaster, and I {have trouble} [make:to>ing:expr] rice that isn't sticky. At least my kitchen {needs|need} [clean~be cleaned:ing/topass:needing/passto] every night now: proof that I use it!"],"pt":["Eu nunca aprendi a cozinhar quando criança, porque a minha mãe não deixava ninguém tocar nas panelas dela. No ano passado eu finalmente cansei de pedir delivery. Nunca vou esquecer que queimei a minha primeira lasanha! Quando o assunto é fazer bolo e pão, eu ainda sou um desastre, e tenho dificuldade para fazer um arroz que não fique grudento. Pelo menos agora a minha cozinha precisa ser limpa toda noite: prova de que eu uso!"],"w":{"pots":"panelas","takeout":"comida para viagem, delivery","disaster":"desastre","sticky":"grudento","proof":"prova"},"cw":{"learned":"aprendi","didn't let":"não deixava","got tired of":"cansei de","forget":"esquecer","When it comes to":"quando o assunto é","have trouble":"tenho dificuldade","needs":"precisa"},"notes":[null,null,null,null,null,null,{"en":"Both work: needs cleaning = needs to be cleaned (after need, *-ing* has a passive meaning).","pt":"As duas servem: needs cleaning = needs to be cleaned (depois de need, o *-ing* tem sentido passivo)."}]},{"id":"b2-f20","frame":"Advice column","framePt":"Coluna de conselhos","title":"Your first year abroad","titlePt":"O seu primeiro ano no exterior","body":["It's completely normal {for newcomers} [feel:to:forto] lonely at first. Don't be {afraid} [make:ing>to:afraidto] mistakes with the language. I'd {recommend} [join:to>ing:enjoy] a local club or a volunteer group. It's also {worth} [learn:ing:expr] a few phrases before you go. [ask:ing:subject] neighbors for small favors is a great {way} [start:to:noun] a conversation. And {stop} [compare:to>ing:quit] your new life with the old one: give it a year."],"pt":["É completamente normal os recém-chegados se sentirem sozinhos no começo. Não tenha medo de errar no idioma. Eu recomendaria entrar num clube local ou num grupo de voluntários. Também vale a pena aprender algumas frases antes de ir. Pedir pequenos favores aos vizinhos é um ótimo jeito de puxar conversa. E pare de comparar a sua vida nova com a antiga: dê um ano para ela."],"w":{"lonely":"sozinhos","volunteer group":"grupo de voluntários","phrases":"frases","favors":"favores","give it a year":"dê um ano"},"cw":{"for newcomers":"para os recém-chegados","afraid":"com medo","recommend":"recomendaria","worth":"vale a pena","way":"jeito","stop":"stop = parar"}},{"id":"b2-f21","frame":"News","framePt":"Notícia","title":"The school that stayed open","titlePt":"A escola que não fechou","body":["When the town council {decided|decide} [close:to:want] the village's only school, the parents of Vila Nova said no. The school {is said|be said} [teach~have taught:toperf:perfto] three generations of the same families. In just one month, the parents {managed|manage} [raise:ing>to:want] 20,000 euros. They are now {committed to} [pay:bare>ing:toprep] for a second teacher, and the mayor has {let them|let someone} [use:to>bare:make] the old library as an extra classroom. [save:ing:subject] a school, it turns out, takes a village."],"pt":["Quando a prefeitura decidiu fechar a única escola da vila, os pais de Vila Nova disseram não. Dizem que a escola ensinou três gerações das mesmas famílias. Em apenas um mês, os pais conseguiram arrecadar 20.000 euros. Agora eles estão comprometidos em pagar um segundo professor, e o prefeito deixou que eles usassem a antiga biblioteca como sala extra. Salvar uma escola, pelo visto, exige uma vila inteira."],"w":{"town council":"prefeitura","generations":"gerações","mayor":"prefeito","extra classroom":"sala extra","it turns out":"pelo visto","takes a village":"exige uma vila inteira"},"cw":{"decided":"decidiu","is said":"dizem que","managed":"conseguiram","committed to":"comprometidos em","let them":"deixou que eles"}},{"id":"b2-f22","frame":"Personal essay","framePt":"Ensaio pessoal","title":"Sundays in her kitchen","titlePt":"Domingos na cozinha dela","body":["I {remember} [sit:ing:memory] in my grandmother's kitchen every Sunday, watching her make bread. She always {reminded me|remind someone} [say:ing>to:obj] thank you to the cook, even when it was her. She {made me|make someone} [taste:to>bare:make] everything before it went to the table. Now I {regret} never [ask:to>ing:memory] her to write down her recipes. Still, [cook:ing:subject] her dishes from memory {means|mean} [keep:ing:meaning] her close."],"pt":["Eu me lembro de ficar sentada na cozinha da minha avó todo domingo, olhando ela fazer pão. Ela sempre me lembrava de agradecer a quem cozinhou, mesmo quando era ela. Ela me fazia provar tudo antes de ir para a mesa. Agora eu me arrependo de nunca ter pedido para ela anotar as receitas. Mesmo assim, cozinhar os pratos dela de memória significa mantê-la por perto."],"w":{"bread":"pão","recipes":"receitas","dishes":"pratos","from memory":"de memória","close":"por perto"},"cw":{"remember":"lembrar","reminded me":"me lembrava de","made me":"me fazia","regret":"me arrependo","means":"mean = significar / implicar"}},{"id":"b2-f23","frame":"Hotel review","framePt":"Avaliação de hotel","title":"Not quite a sea view","titlePt":"Vista para o mar, só que não","body":["We booked a sea-view room, {only} [discover:to:onlyto] that it faced the parking lot. The receptionist {refused|refuse} [change:ing>to:want] it, even though the hotel was half empty. The hotel {claims|claim} [renovate~have renovated:toperf:perfto] all its rooms last year, but ours had a broken shower. We {can't help} [feel:to>ing:expr] that the photos online were heavily edited. To be fair, the staff {let us|let someone} [check out:bare:make] late on our last day. Still, we wouldn't {consider} [stay:to>ing:enjoy] here again."],"pt":["Reservamos um quarto com vista para o mar, só para descobrir que ele dava para o estacionamento. O recepcionista se recusou a trocar, mesmo com o hotel meio vazio. O hotel afirma ter reformado todos os quartos no ano passado, mas o nosso tinha um chuveiro quebrado. Não conseguimos deixar de sentir que as fotos na internet foram muito editadas. Para ser justo, os funcionários deixaram a gente fazer o check-out mais tarde no último dia. Mesmo assim, não pensaríamos em ficar aqui de novo."],"w":{"sea-view room":"quarto com vista para o mar","faced":"dava para","parking lot":"estacionamento","half empty":"meio vazio","broken shower":"chuveiro quebrado","heavily edited":"muito editadas","To be fair":"para ser justo"},"cw":{"only":"só (e aí, de surpresa)","refused":"se recusou a","claims":"afirma","can't help":"não conseguimos deixar de","let us":"deixaram a gente","consider":"considerar"}},{"id":"b2-f24","frame":"Profile","framePt":"Perfil","title":"A Colombian in orbit","titlePt":"Uma colombiana em órbita","body":["As a child in Bogotá, Ana Reyes {dreamed of|dream of} [fly:ing:prep] to space. Her teachers {encouraged her|encourage someone} [study:ing>to:obj] physics, and she did. {After} [reject~be rejected:ing>ingpass:passing] three times, she was finally accepted into the program in 2019. Last year she {went on|go on} [become:to:goonto] the first Colombian woman on the space station. She {admits|admit} [miss:to>ing:enjoy] her mother's soup up there, but she {seems|seem} [enjoy~have enjoyed:to:want] every minute."],"pt":["Quando criança, em Bogotá, a Ana Reyes sonhava em voar para o espaço. Os professores a incentivaram a estudar física, e ela estudou. Depois de ser rejeitada três vezes, ela finalmente foi aceita no programa em 2019. No ano passado ela se tornou a primeira mulher colombiana na estação espacial. Ela admite que sente falta da sopa da mãe lá em cima, mas parece aproveitar cada minuto."],"w":{"physics":"física","accepted":"aceita","space station":"estação espacial","soup":"sopa","up there":"lá em cima     });

    ttsTimer = setTimeout(() => { if (!started && !tts.speaking && tok === ttsTok && !retry) speakTts(parts, el, Object.assign({}, opt, { retry: true })); }, 2500);

/* 04-forms.js — the forms a verb gap cycles through, and the words for the explanations.
   Cycle order (tap by tap): to cook → cooking → (cook, at levels with "bare": true) → (back to to cook). At the start
   of a sentence: To cook → Cooking → Cook. Every gap of a level has the same steps, so the cycle never gives an answer
   away. The right one is written in the text ([cook:ing:enjoy]) with its reason: a rules.json "rules" key.
   Classes: "to" (to + verb), "ing" (verb + -ing), "bare" (the verb alone).
   B2+ perfect / passive gaps ([leave~have left:toperf:perfto], [fix~be fixed:topass:passto]) have two more steps:
   … → to have left → having left (perfect), or … → to be fixed → being fixed (passive). They are steps 3 and 4 and
   take the colour of their class (to have left is a "to" form). */
const FORMS = ["to", "ing", "bare"], FORM_IDX = { to: 0, ing: 1, bare: 2, toperf: 3, ingperf: 4, topass: 3, ingpass: 4 };
const ZERO = -9;   // the articles game's "nothing" choice: this game has none (kept so the shared helpers stay simple)
const CYCLE_TONES = [523.25, 659.25, 783.99, 880, 1046.5];
const clsOf = st => ["to", "ing", "bare", "to", "ing"][st];
// The form's name for step st of spot sp: to, ing, bare, toperf, ingperf, topass, ingpass.
const formName = (sp, st) => st >= 3 ? clsOf(st) + sp.ext : FORMS[st];
// How many forms a level's gaps cycle through: 2 (to / -ing), or 3 with the bare verb.
const nForms = level => (DATA.levels[level] || {}).bare ? 3 : 2;
// verb + -ing, spelled right: rules.json "spell" first (run → running), else the regular rules
// (-ie → -ying, a silent -e drops, else + ing). Only the first word of a phrase changes (get up → getting up).
function ingOf(v) {
  const [w, ...rest] = v.split(" "), S = DATA.rules.spell || {};
  const ing = S[w] || (/ie$/.test(w) ? w.slice(0, -2) + "ying" : /[^aeiouy]e$|ue$/.test(w) && !/(ee|ye|oe)$/.test(w) ? w.slice(0, -1) + "ing" : w + "ing");
  return [ing, ...rest].join(" ");
}
// The three forms of a verb, capitalised when the gap starts a sentence. x = a perfect / passive verb ("have left",
// "be fixed") adds two: to have left, having left / to be fixed, being fixed.
function formsOf(verb, n, cap, x) {
  const more = x ? ["to " + x, x.replace(/^have /, "having ").replace(/^be /, "being ")] : [];
  return ["to " + verb, ingOf(verb), verb].slice(0, n).concat(more).map(f => cap ? f.charAt(0).toUpperCase() + f.slice(1) : f);
}
// verb: "cook"; ans: "ing", "to/ing" when a second form is right too, or "to>ing" (written "to cook", right "-ing":
// proofreading); rule: "enjoy", or "like/help" (the second form's rule). n = the level's number of forms.
// verb "leave~have left" / "fix~be fixed" = a B2+ perfect / passive gap: the extra verb after ~ (04-forms header).
function spotInfo(verb0, ans, rule, cap, n) {
  const [w, rest] = ans.includes(">") ? ans.split(">") : ["", ans], [a, b] = rest.split("/"), [ru, ru2] = rule.split("/");
  const [verb, x = ""] = verb0.split("~"), ext = !x ? "" : /^be /.test(x) ? "pass" : "perf";
  const k = FORM_IDX[a], alt = b ? FORM_IDX[b] : -1;
  return { verb, x, ext, art: a, rule: ru, altRule: ru2 || ru, cap, ans: k, alt, shown: w ? FORM_IDX[w] : k, cls: clsOf(k),
    forms: formsOf(verb, n, cap, x), base: formsOf(verb, 3, cap)[2] };
}
const ruleOf = sp => DATA.rules.rules[sp.rule] || {};
// The rule key behind choice st: the second form's own rule when that is what was chosen, else the gap's rule.
const ruleKey = (sp, st) => st === sp.alt && sp.alt >= 0 ? sp.altRule : sp.rule;
// An explanation from the data, escaped, with the forms it talks about in their colour: *to* / *to + verb* blue,
// *-ing* orange, *verb* (the verb alone) purple; any other starred words are Portuguese (green): *para*, *de*.
// *bare|understand* names the colour (to, ing, bare, pt) when the word can't tell it.
const starCls = w => /^to\b/i.test(w) ? "to" : /-?ing\b/i.test(w) ? "ing" : /^(verb|verbo|bare)\b/i.test(w) ? "bare" : "pt";
const artTxt = s => esc(s).replace(/\*(?:(to|ing|bare|pt)\|)?([^*]+)\*/g, (m, c, w) => '<b class="aq aq-' + (c || starCls(w)) + '">' + w + "</b>");
// A rule's examples (rules.json "eg"), one line each: English → Portuguese, the structure starred on both sides. In
// English the stars take the rule's form colour (a two-form rule: each its own, a lone verb purple); Portuguese is green.
// max = how many (the explanation cards show EG_CARD; the Guide all of them).
const EG_CARD = 2;
function egHTML(R, max) {
  if (!R.eg) return "";
  const cls = w => R.form !== "both" ? clsOf(FORM_IDX[R.form]) : starCls(w) === "pt" ? "bare" : starCls(w);
  const mark = (s, c) => esc(s).replace(/\*([^*]+)\*/g, (m, w) => '<b class="aq aq-' + c(w) + '">' + w + "</b>");
  return '<ul class="eg">' + R.eg.slice(0, max || R.eg.length).map(([en, pt]) => '<li><span lang="en">' + mark(en, cls) + '</span><span class="eg-ar" aria-hidden="true">→</span>' +
    '<span lang="pt">' + mark(pt, () => "pt") + "</span></li>").join("") + "</ul>";
}
const GROUP_OF = k => { const R = DATA.rules.rules[k] || {}; return R.group || R.form; };
const clsName = (c, pt) => { const D = DATA.rules.groups[c]; return pt ? D.namePt : D.name; };
const ruleName = (k, pt) => { const R = DATA.rules.rules[k]; return pt ? R.namePt : R.name; };
const ruleLine = (k, pt) => { const R = DATA.rules.rules[k]; return pt ? R.rulePt : R.rule; };
// A rule is a Portuguese trap when it has a "trap" (Portuguese says it another way).
const isTrap = k => !!(DATA.rules.rules[k] || {}).trap;
// The choice as words: "to cook", "cooking".
function choiceName(sp, st) { return sp.forms[st] || "?"; }

/* ---------- Words for the explanations ---------- */
// Why choice st is wrong for spot sp (the rule's own "bad", or rules.json "wrong" for perfect / passive), in English or
// Portuguese; "" when it is right or untouched, or when it would only repeat the rule shown under it (the card already
// says "you chose X, but the right one is Y", so a reason must add something: the clue word, what X would mean). {x} = the choice made; {c|this verb} = the gap's clue word (need, enjoy…), else the fallback.
function wrongWhy(sp, st, pt) {
  if (st < 0 || isRight(sp, st)) return "";
  const W = DATA.rules.wrong, L = pt ? "pt" : "en", c = clsOf(st), R = ruleOf(sp), nm = formName(sp, st);
  const fill = s => s.split("{x}").join(sp.forms[st]).replace(/\{c\|([^}]*)\}/g, (m, d) => sp.clueKey || d);
  if (R.bad && R.bad[nm]) return fill(R.bad[nm][L]);
  // Same class, but the perfect / passive is missing or not wanted: say that (simple-for-perf, pass-for-active…).
  if (sp.ext && R.group !== "perf" && c === sp.cls && (st >= 3) !== (sp.ans >= 3)) {   // a perf rule says it already
    const m = W[sp.ext === "perf" ? (st >= 3 ? "perf-for-simple" : "simple-for-perf") : (st >= 3 ? "pass-for-active" : "active-for-pass")];
    if (m) return fill(m[L]);

// "to cook and cooking are both right here." for a gap that takes two forms ("" otherwise).
// "understand and to understand are both right here", each form starred in its colour.
const starForm = (sp, k) => "*" + clsOf(k) + "|" + sp.forms[k] + "*";
function bothLine(sp, pt) { return sp.alt < 0 ? "" : txL(pt, "bothOk").split("{x}").join(starForm(sp, sp.ans)).split("{y}").join(starForm(sp, sp.alt)); }

/* 07-back.js — copied from Perfect or Past? (../present perfect practice): the phone's back gesture (or the browser's
   Back) closes the open window instead of leaving the page: the Guide, Favorites / Seen, the end card, the tutorial,
   the Play menu and the header pop-ups (colours, volume); in Quick-fire, Review missed and Favorites games it goes back
   to a normal game. Each window holds a history entry while it is open. A MutationObserver sees it open and close, whatever
   closed it (✕, Escape, a click outside, a button), so the entry is added and taken back in one place. Back closes the
   window opened last. A new window needs one backLayer(el, isOpen, close) call. */
// Our history entries must not bring back an old scroll position: closing the Guide scrolls to the explanation it was
// opened from, and the browser would undo that.
try { history.scrollRestoration = "manual"; } catch (e) {}
const BACK = [];     // open windows, oldest first: { el, close, pushed }
let backSkip = 0;    // our own history.back() calls, whose popstate is not a Back press
// A window that opens while one of those history.back() calls is still on its way (the Play menu closes and quick-fire
// starts in the same click) waits for it: the browser aims history.back() when it is called, so an entry pushed in
// between would be swept away with it, and the next Back would leave the page. Pushed once the popstate arrives.
const pendingPush = [];
function pushEntry(L) { try { history.pushState({ layer: 1 }, ""); L.pushed = true; } catch (e) { L.pushed = false; } }   // a file:// page may refuse
// el: the window's element; isOpen(): whether it shows; close(): what Back does (the same as its ✕ or Escape).
function backLayer(el, isOpen, close) {
  const L = { el, close, pushed: false, byBack: false };
  let was = isOpen();
  new MutationObserver(() => {
    const now = isOpen(); if (now === was) return; was = now;
    if (now) {
      if (backSkip) pendingPush.push(L); else pushEntry(L);
      BACK.push(L);
    } else {
      const i = BACK.indexOf(L); if (i >= 0) BACK.splice(i, 1);
      const p = pendingPush.indexOf(L); if (p >= 0) pendingPush.splice(p, 1);   // closed before its entry was even added
      // Closed by the game, not by Back: take its history entry away, so the next Back isn't a dead press.
      if (L.pushed && !L.byBack) { backSkip++; history.back(); }
      L.pushed = false;
    }
  }).observe(el, { attributes: true, attributeFilter: ["class", "hidden"] });
}
window.addEventListener("popstate", () => {
  if (backSkip) { backSkip--; if (!backSkip) pendingPush.splice(0).forEach(pushEntry); return; }
  const L = BACK[BACK.length - 1]; if (!L) return;
  L.byBack = true; L.close(); setTimeout(() => { L.byBack = false; }, 0);   // the observer has run by then
});
// Header pop-ups (01-theme.js, 02-sound.js; from Conditional Bubbles): the back gesture closes them too.
backLayer(swwrap, () => swwrap.classList.contains("open"), () => swOpen(false));
backLayer(volwrap, () => volwrap.classList.contains("open"), () => volwrap.classList.remove("open"));
