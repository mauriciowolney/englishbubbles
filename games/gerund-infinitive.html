const DATA = {"levels":{"A2":{"grad":["#3fcf9a","#2bb5c9"],"title":"enjoy + -ing, want + to, prepositions + -ing, to for why","nativeUi":true,"tries":3,"hints":2,"feedback":"spots","rounds":3,"gaps":[3,4]},"B1":{"grad":["#4aa8ff","#5b7bff"],"title":"+ the verb alone (made me laugh), look forward to, used to, want you to — and Right or wrong?","bare":true,"tries":2,"hints":2,"feedback":"count","rounds":3,"gaps":[4,5],"bonus":false,"judge":4},"B2":{"grad":["#a77bff","#d05cff"],"label":"B2+","title":"stop, remember, try, mean, go on: the meaning changes; perfect and passive (to have done, being done) — Which meaning? and Proofreading","bare":true,"tries":2,"hints":0,"feedback":"count","rounds":3,"gaps":[5,6],"bonus":false,"meaning":4,"proof":1}},"rules":{"groups":{"ing":{"name":"verb + -ing","namePt":"verbo + -ing","hue":28,"ask":"After a preposition, as the subject, and after enjoy, avoid, finish…","askPt":"Depois de preposição, como sujeito, e depois de enjoy, avoid, finish…"},"to":{"name":"to + verb","namePt":"to + verbo","hue":205,"ask":"To say why (para), after want, need, decide…, after easy, happy…, and after how / what","askPt":"Para dizer para quê, depois de want, need, decide…, de easy, happy…, e de how / what"},"bare":{"name":"the verb alone","namePt":"só o verbo","hue":280,"ask":"After make / let + someone, had better, would rather, why not","askPt":"Depois de make / let + alguém, had better, would rather, why not"},"both":{"name":"both work","namePt":"as duas servem","hue":170,"ask":"like, love, hate, start, begin, continue (to or -ing); help (to or the verb alone)","askPt":"like, love, hate, start, begin, continue (to ou -ing); help (to ou só o verbo)"},"change":{"name":"the meaning changes","namePt":"o sentido muda","hue":330,"ask":"stop, remember, forget, regret, try: -ing and to say different things","askPt":"stop, remember, forget, regret, try: -ing e to dizem coisas diferentes"},"perf":{"name":"perfect and passive","namePt":"perfeito e passivo","hue":250,"ask":"Earlier than the main verb (to have / having + past participle), or done to the subject (to be / being + past participle)? (B2+)","askPt":"Antes do verbo principal (to have / having + particípio) ou feito com o sujeito (to be / being + particípio)? (B2+)"}},"ask":[{"q":"Is there a preposition right before it (in, at, of, about, for, without, before, after, by…)?","qPt":"Tem uma preposição logo antes (in, at, of, about, for, without, before, after, by…)?","hint":"interested in learning · good at drawing · before leaving · thanks for coming","hintPt":"interessada em aprender → interested in learning · antes de sair → before leaving","ans":"ing"},{"q":"Is the action the subject of the sentence?","qPt":"A ação é o sujeito da frase?","hint":"Swimming is fun · Learning a language takes time","hintPt":"Nadar é divertido → Swimming is fun","ans":"ing"},{"q":"Does it say WHY someone does something (Portuguese *para*)?","qPt":"Ela diz PARA QUÊ alguém faz algo (*para* + verbo)?","hint":"I came here to study · She called to say thanks","hintPt":"Vim aqui para estudar → I came here to study (nunca for study)","ans":"to"},{"q":"Is it after make / let + someone, had better or would rather? (from B1)","qPt":"Vem depois de make / let + alguém, had better ou would rather? (do B1 em diante)","hint":"made me laugh · let us go · you'd better hurry · I'd rather stay","hintPt":"me fez rir → made me laugh · é melhor você ir → you'd better go","ans":"bare"},{"q":"Did it happen before the main verb, or is the subject not the one doing it? (B2+)","qPt":"Aconteceu antes do verbo principal, ou o sujeito não é quem faz a ação? (B2+)","hint":"seems to have left · denied having taken · hates being interrupted · expects to be promoted","hintPt":"parece ter saído → seems to have left · odeia ser interrompido → hates being interrupted","ans":""},{"q":"None of these? Then the word before decides: enjoy, finish, avoid… + -ing; want, need, decide, easy, how… + to.","qPt":"Nenhuma dessas? Então a palavra antes decide: enjoy, finish, avoid… + -ing; want, need, decide, easy, how… + to.","hint":"Learn the word with what comes after it. Your list in the Guide keeps them all.","hintPt":"Aprenda a palavra junto com o que vem depois dela. A sua lista no Guia guarda todas.","ans":""}],"spell":{"be":"being","run":"running","swim":"swimming","sit":"sitting","get":"getting","stop":"stopping","plan":"planning","shop":"shopping","begin":"beginning","put":"putting","cut":"cutting","win":"winning","chat":"chatting","jog":"jogging","hit":"hitting","forget":"forgetting","prefer":"preferring","admit":"admitting","regret":"regretting","quit":"quitting","set":"setting","let":"letting","drop":"dropping","chop":"chopping","skip":"skipping","dig":"digging","nod":"nodding","commit":"committing","refer":"referring","control":"controlling","upset":"upsetting","bet":"betting","beg":"begging","rob":"robbing","hug":"hugging","clap":"clapping","shut":"shutting","spin":"spinning","grab":"grabbing","step":"stepping","stir":"stirring","nap":"napping","jam":"jamming"},"rules":{"prep":{"form":"ing","name":"After a preposition","namePt":"Depois de preposição","hue":28,"clue":true,"rule":"After a preposition (in, at, about, before, after, without…) a verb takes *-ing*.","rulePt":"Depois de preposição (in, at, about, before, after, without…) o verbo vai com *-ing*. Em português vem o infinitivo.","eg":[["interested *in learning*","interessada *em aprender*"],["good *at drawing*","bom *em desenhar*"],["*before leaving*","*antes de sair*"],["thanks *for coming*","obrigado *por vir*"]],"ex":["I'm good at drawing.","Thanks for helping me!","Wash your hands before eating.","He left without saying goodbye.","How about ordering a pizza?"],"trap":{"pt":"Ela é interessada em aprender japonês.","wrong":"She's interested in learn Japanese.","right":"She's interested in learning Japanese."}},"toprep":{"form":"ing","name":"to that is a preposition","namePt":"to que é preposição","hue":28,"clue":true,"rule":"Sometimes *to* is a preposition, not part of the verb: look forward to, be used to, get used to, when it comes to… Then the verb takes *-ing*. Test: if a noun fits there (look forward to the weekend), *to* is a preposition.","rulePt":"Às vezes *to* é preposição, e não parte do verbo: look forward to, be used to, get used to, when it comes to… Aí o verbo vai com *-ing*. Teste: se cabe um substantivo ali (look forward to the weekend), o *to* é preposição.","eg":[["I look forward *to seeing* you.","Estou ansioso *para ver* você."],["I'm used *to waking up* early.","Estou acostumado *a acordar* cedo."],["When it comes *to cooking*…","Quando se trata *de cozinhar*…"]],"ex":["I look forward to hearing from you.","She's used to working at night.","You'll get used to living here.","When it comes to cooking, he's the best."],"trap":{"pt":"Eu estou acostumado a acordar cedo.","wrong":"I'm used to wake up early.","right":"I'm used to waking up early."}},"subject":{"form":"ing","name":"-ing as the subject","namePt":"-ing como sujeito","hue":28,"pocket":false,"rule":"When an action is the subject of the sentence (what the sentence is about), English uses *-ing*.","rulePt":"Quando uma ação é o sujeito da frase (aquilo de que a frase fala), o inglês usa *-ing*. Em português vem o infinitivo.","eg":[["*Swimming* is good for you.","*Nadar* faz bem."],["*Learning* a language takes time.","*Aprender* uma língua leva tempo."]],"ex":["Swimming is good for your back.","Learning a language takes time.","Eating late gives me bad dreams."],"trap":{"pt":"Nadar faz bem para a saúde.","wrong":"Swim is good for your health.","right":"Swimming is good for your health."},"bad":{"to":{"en":"*To* + verb as a subject sounds formal and old-fashioned.","pt":"*To* + verbo como sujeito soa formal e antiquado."}}},"enjoy":{"form":"ing","name":"Verbs + -ing","namePt":"Verbos + -ing","hue":28,"clue":true,"rule":"Some verbs are always followed by *-ing*: enjoy, finish, mind, avoid, keep…","rulePt":"Alguns verbos sempre vêm com *-ing* depois: enjoy, finish, mind, avoid, keep… Em português vem o infinitivo.","eg":[["She finished *reading*.","Ela terminou *de ler*."],["Avoid *eating* late.","Evite *comer* tarde."],["Do you mind *waiting*?","Você se importa *de esperar*?"]],"ex":["She finished reading the book.","Do you mind waiting?","Try to avoid eating late.","I miss seeing my friends.","He suggested taking a taxi."],"trap":{"pt":"Ela terminou de ler o livro.","wrong":"She finished to read the book.","right":"She finished reading the book."},"bad":{"to":{"en":"{c|This verb} is never followed by *to*: it always takes *-ing*.","pt":"{c|Esse verbo} nunca vem com *to*: sempre pede *-ing*."},"bare":{"en":"{c|This verb} takes *-ing* after it, not the verb alone.","pt":"{c|Esse verbo} pede *-ing* depois, não só o verbo."}}},"expr":{"form":"ing","name":"Expressions + -ing","namePt":"Expressões + -ing","hue":28,"clue":true,"rule":"Some expressions take *-ing*: it's worth, there's no point, can't help, spend time, have fun…","rulePt":"Algumas expressões pedem *-ing*: it's worth (vale a pena), there's no point (não adianta), can't help (não consigo evitar), spend time (passar tempo)…","eg":[["It's worth *visiting*.","Vale a pena *visitar*."],["There's no point *waiting*.","Não adianta *esperar*."],["I spent the day *studying*.","Passei o dia *estudando*."]],"ex":["The museum is worth visiting.","There's no point waiting.","I spent the weekend painting the kitchen.","We had fun playing in the snow.","She has trouble sleeping."],"trap":{"pt":"Vale a pena visitar o museu.","wrong":"It's worth to visit the museum.","right":"It's worth visiting the museum."},"bad":{"to":{"en":"{c|This expression} takes *-ing*, not *to*.","pt":"{c|Essa expressão} pede *-ing*, não *to*."},"bare":{"en":"{c|This expression} takes *-ing* after it.","pt":"{c|Essa expressão} pede *-ing* depois."}}},"go":{"form":"ing","name":"go + -ing","namePt":"go + -ing","hue":28,"clue":true,"rule":"For many free-time activities English says go + *-ing*, with no *to*.","rulePt":"Para muitas atividades de lazer o inglês diz go + *-ing*, sem *to*. Cuidado: shopping em português é o lugar (o shopping); em inglês é mall.","eg":[["go *shopping*","fazer *compras*"],["go *camping*","*acampar*"],["go *fishing*","*pescar*"],["go *hiking*","fazer *trilha*"]],"ex":["Let's go shopping on Saturday.","We go camping every summer.","Have you ever gone skiing?"],"trap":{"pt":"Vamos fazer compras no sábado.","wrong":"Let's go to shopping on Saturday.","right":"Let's go shopping on Saturday."}},"want":{"form":"to","name":"Verbs + to","namePt":"Verbos + to","hue":205,"clue":true,"rule":"Many verbs are followed by *to + verb*: want, need, decide, hope, plan…","rulePt":"Muitos verbos vêm com *to + verbo* depois: want, need, decide, hope, manage (conseguir)… Cuidado para não esquecer o *to*.","eg":[["I need *to study*.","Preciso *estudar*."],["We decided *to stay*.","Decidimos *ficar*."],["She hopes *to win*.","Ela espera *ganhar*."]],"ex":["I need to study for the test.","We decided to stay home.","She promised to call me.","He can't afford to buy a car.","I can't wait to see you!"],"trap":{"pt":"Eu preciso estudar para a prova.","wrong":"I need study for the test.","right":"I need to study for the test."},"bad":{"ing":{"en":"{c|This verb} takes *to + verb*, not *-ing*.","pt":"{c|Esse verbo} pede *to + verbo*, não *-ing*."},"bare":{"en":"Don't drop the *to*: {c|this verb} takes *to + verb* (Portuguese has no *to* here).","pt":"Não esqueça o *to*: {c|esse verbo} pede *to + verbo* (o português não tem nada aqui)."}}},"would":{"form":"to","name":"would like / love / prefer + to","namePt":"would like / love / prefer + to","hue":205,"clue":true,"rule":"would like, would love, would prefer (I'd like…) take *to + verb*, even though like and love alone can take *-ing*.","rulePt":"would like (gostaria), would love (adoraria), would prefer pedem *to + verbo*, mesmo que like e love sozinhos aceitem *-ing*.","eg":[["I'd like *to cook* tonight.","Eu gostaria *de cozinhar* hoje à noite."],["Would you like *to come*?","Você gostaria *de vir*?"],["I'd love *to see* it.","Eu adoraria *ver*."]],"ex":["I'd like to travel to Japan.","Would you like to come with us?","She'd love to meet you.","I'd prefer to sit by the window."],"trap":{"pt":"Eu gostaria de viajar para o Japão.","wrong":"I would like traveling to Japan.","right":"I would like to travel to Japan."},"bad":{"ing":{"en":"I like cooking, but I'd like to cook.","pt":"I like cooking, mas I'd like to cook."}}},"purpose":{"form":"to","name":"Why? → to","namePt":"Para quê? → to","hue":205,"pocket":false,"rule":"To say WHY someone does something, English uses *to + verb*, never for + verb.","rulePt":"Para dizer PARA QUÊ alguém faz algo (*para* + infinitivo), o inglês usa *to + verbo*, nunca for + verbo.","eg":[["I came here *to study*.","Vim aqui *para estudar*."],["She called *to say* thanks.","Ela ligou *para agradecer*."],["We stopped *to buy* water.","Paramos *para comprar* água."]],"ex":["I came here to study.","She called to say thanks.","He saves money to buy a bike.","We got up early to see the sunrise."],"trap":{"pt":"Eu vim aqui para estudar.","wrong":"I came here for study.","right":"I came here to study."}},"adj":{"form":"to","name":"Adjective + to","namePt":"Adjetivo + to","hue":205,"clue":true,"rule":"After many adjectives (easy, hard, happy, ready, important…) and in too… / …enough, the verb takes *to*.","rulePt":"Depois de muitos adjetivos (easy, hard, happy, ready, important…) e em too… (demais para) / …enough (o suficiente para), o verbo vai com *to*.","eg":[["It's easy *to use*.","É fácil *de usar*."],["I'm happy *to help*.","Fico feliz *em ajudar*."],["It's too cold *to swim*.","Está frio demais *para nadar*."]],"ex":["This app is easy to use.","I'm happy to help.","It's important to drink water.","She's old enough to drive.","It's too late to call him."],"trap":{"pt":"É difícil aprender inglês?","wrong":"Is difficult learn English?","right":"Is it difficult to learn English?"}},"obj":{"form":"to","name":"Verb + someone + to","namePt":"Verbo + alguém + to","hue":205,"clue":true,"rule":"want, ask, tell, expect, teach… + someone + *to + verb*.","rulePt":"want, ask, tell, expect, teach… + alguém + *to + verbo*. Em português muitas vezes vem que + subjuntivo.","eg":[["I want you *to come*.","Quero que você *venha*."],["She asked me *to wait*.","Ela me pediu *para esperar*."],["They invited us *to stay*.","Eles nos convidaram *para ficar*."]],"ex":["I want you to come to my party.","She asked me to wait.","My mom told us to be quiet.","They invited us to stay for dinner."],"trap":{"pt":"Eu quero que você venha à minha festa.","wrong":"I want that you come to my party.","right":"I want you to come to my party."},"bad":{"bare":{"en":"Only make and let + someone take the *verb* alone.","pt":"Só make e let + alguém pedem só o *verbo*."}}},"wh":{"form":"to","name":"how / what / where + to","namePt":"how / what / where + to","hue":205,"clue":true,"rule":"After how, what, where… (I don't know what…, show me how…), the verb takes *to*.","rulePt":"Depois de how, what, where… (não sei o que…, me mostra como…), o verbo vai com *to*.","eg":[["I don't know what *to say*.","Não sei o que *dizer*."],["Can you show me how *to do* it?","Você me mostra como *fazer*?"]],"ex":["I don't know what to say.","Can you show me how to do it?","We can't decide where to go.","Tell me when to start."],"trap":{"pt":"Eu não sei o que dizer.","wrong":"I don't know what say.","right":"I don't know what to say."}},"noun":{"form":"to","name":"Noun / something + to","namePt":"Substantivo / something + to","hue":205,"clue":true,"rule":"After a noun, or something / nothing / a lot, *to + verb* says what it's for.","rulePt":"Depois de um substantivo, ou de something / nothing / a lot, *to + verbo* diz para que serve.","eg":[["time *to go*","hora *de ir*"],["a chance *to win*","uma chance *de ganhar*"],["nothing *to do*","nada *para fazer*"],["the first *to arrive*","o primeiro *a chegar*"]],"ex":["It's time to go.","I have nothing to do.","This is a great way to save money.","She was the first to arrive.","We have a lot to learn."],"trap":{"pt":"Não tenho nada para fazer.","wrong":"I have nothing for do.","right":"I have nothing to do."}},"setto":{"form":"to","name":"Set phrases + to","namePt":"Expressões fixas + to","hue":205,"clue":true,"rule":"A few set phrases always take *to + verb*: have no choice but, be about, be supposed. Learn them as a block.","rulePt":"Algumas expressões fixas sempre pedem *to + verbo*: have no choice but (não ter outra escolha a não ser), be about (estar prestes a), be supposed (dever, ter que). Aprenda como um bloco.","eg":[["I had no choice but *to cancel*.","Não tive outra escolha a não ser *cancelar*."],["The train is about *to leave*.","O trem está prestes *a sair*."],["You're supposed *to wear* a helmet.","Você deve *usar* capacete."]],"ex":["We had no choice but to wait.","The movie is about to start.","You're supposed to call first."],"trap":{"pt":"Não tive outra escolha a não ser esperar.","wrong":"I had no choice but wait.","right":"I had no choice but to wait."}},"make":{"form":"bare","name":"make / let + someone + verb","namePt":"make / let + alguém + verbo","hue":280,"clue":true,"rule":"After make and let + someone, the *verb* stands alone, with no *to*.","rulePt":"Depois de make (fazer alguém…) e let (deixar alguém…) + alguém, vem só o *verbo*, sem *to*.","eg":[["She made me *laugh*.","Ela me fez *rir*."],["My parents let me *stay up* late.","Meus pais me deixam *ficar acordado* até tarde."],["Let's *go*!","*Vamos*!"]],"ex":["The movie made me cry.","My parents let me stay up late.","Don't make me wait!","Let me help you."],"trap":{"pt":"O filme me fez chorar.","wrong":"The movie made me to cry.","right":"The movie made me cry."}},"better":{"form":"bare","name":"had better / would rather / why not","namePt":"had better / would rather / why not","hue":280,"clue":true,"rule":"had better ('d better), would rather ('d rather) and Why not…? take the *verb* alone.","rulePt":"had better ('d better = é melhor), would rather ('d rather = prefiro) e Why not…? (por que não…?) pedem só o *verbo*.","eg":[["You'd better *hurry*.","É melhor você *se apressar*."],["I'd rather *stay* home.","Prefiro *ficar* em casa."],["Why not *ask* her?","Por que não *perguntar* a ela?"]],"ex":["You'd better hurry.","I'd rather stay home tonight.","Why not ask her?","We'd better leave now."],"trap":{"pt":"É melhor você ir ao médico.","wrong":"You'd better to go to the doctor.","right":"You'd better go to the doctor."}},"like":{"form":"both","name":"like, love, start… (to or -ing)","namePt":"like, love, start… (to ou -ing)","hue":170,"clue":true,"rule":"like, love, hate, start, begin… take *to* or *-ing* with almost no change in meaning. (But would like / would love: only *to*.)","rulePt":"like, love, hate, start, begin… aceitam *to* ou *-ing* quase sem mudar o sentido. (Mas would like / would love: só *to*.)","eg":[["I love *cooking*. = I love *to cook*.","Eu adoro *cozinhar*."],["It started *raining*. = It started *to rain*.","Começou *a chover*."]],"ex":["I love cooking. = I love to cook.","It started raining. = It started to rain.","She hates waiting. = She hates to wait."]},"help":{"form":"both","name":"help + (someone) + verb","namePt":"help + (alguém) + verbo","hue":170,"clue":true,"rule":"help takes *to + verb* or the *verb* alone, with the same meaning. Without *to* is more common.","rulePt":"help aceita *to + verbo* ou só o *verbo*, com o mesmo sentido. Sem *to* é mais comum.","eg":[["She helped me *move*. = She helped me *to move*.","Ela me ajudou *a mudar*."],["Can you help *carry* these?","Você pode ajudar *a carregar* isto?"]],"ex":["She helped me move. = She helped me to move.","Can you help me carry these bags?"]},"memory":{"short":"the past","shortPt":"o passado","form":"ing","group":"change","name":"remember / forget / regret + -ing: the past","namePt":"remember / forget / regret + -ing: o passado","hue":330,"clue":true,"rule":"remember, (never) forget and regret + *-ing* look back at something that already happened.","rulePt":"remember, (never) forget e regret + *-ing* olham para algo que já aconteceu.","eg":[["I remember *meeting* her.","Eu me lembro *de ter conhecido* ela."],["He regrets *selling* his car.","Ele se arrepende *de ter vendido* o carro."]],"ex":["I remember meeting her in 2019.","I'll never forget seeing the ocean for the first time.","He regrets selling his old car."],"trap":{"pt":"Eu me lembro de ter conhecido ela em 2019.","wrong":"I remember to meet her in 2019.","right":"I remember meeting her in 2019."},"bad":{"to":{"en":"remember / forget + *to* = a task still to do.","pt":"remember / forget + *to* = uma tarefa que ainda falta fazer."}}},"task":{"short":"a task","shortPt":"uma tarefa","form":"to","group":"change","name":"remember / forget + to: a task","namePt":"remember / forget + to: uma tarefa","hue":330,"clue":true,"rule":"remember / forget + *to + verb* = something you have to do (first you remember, then you do it).","rulePt":"remember / forget + *to + verbo* = algo que você tem que fazer (primeiro lembra, depois faz).","eg":[["Remember *to lock* the door.","Lembre-se *de trancar* a porta."],["I forgot *to call* my mom.","Esqueci *de ligar* para minha mãe."]],"ex":["Remember to lock the door.","I forgot to call my mom.","Don't forget to bring your passport."],"trap":{"pt":"Lembre-se de trancar a porta.","wrong":"Remember locking the door.","right":"Remember to lock the door."},"bad":{"ing":{"en":"remember / forget + *-ing* = a memory of something already done.","pt":"remember / forget + *-ing* = a lembrança de algo que já foi feito."}}},"quit":{"short":"no more","shortPt":"não fazer mais","form":"ing","group":"change","name":"stop + -ing: no more","namePt":"stop + -ing: não fazer mais","hue":330,"clue":true,"rule":"stop (and quit, give up) + *-ing* = you don't do it any more.","rulePt":"stop (e quit, give up) + *-ing* = você não faz mais aquilo (*parar de fazer algo*).","eg":[["He stopped *smoking*.","Ele parou *de fumar*."],["Stop *talking*, please!","Pare *de falar*, por favor!"]],"ex":["He stopped smoking in 2015.","Please stop talking.","It finally stopped raining."],"trap":{"pt":"Ele parou de fumar em 2015.","wrong":"He stopped to smoke in 2015.","right":"He stopped smoking in 2015."},"bad":{"to":{"en":"stop + *to* = stop in order to do it (*parar para fazer algo*).","pt":"stop + *to* = *parar para* fazer algo."}}},"pause":{"short":"in order to","shortPt":"parar para fazer algo","form":"to","group":"change","name":"stop + to: in order to","namePt":"stop + to: parar para fazer algo","hue":330,"clue":true,"rule":"stop + *to + verb* = you stop what you're doing in order to do something else.","rulePt":"stop + *to + verbo* = você para o que está fazendo *para* fazer outra coisa.","eg":[["We stopped *to buy* water.","Paramos *para comprar* água."],["She stopped *to tie* her shoe.","Ela parou *para amarrar* o sapato."]],"ex":["We stopped to buy water.","She stopped to tie her shoe.","He stopped to take a photo."],"bad":{"ing":{"en":"stop + *-ing* = not do it any more (*parar de fazer algo*).","pt":"stop + *-ing* = *parar de* fazer algo."}}},"test":{"short":"a test","shortPt":"um teste","form":"ing","group":"change","name":"try + -ing: an experiment","namePt":"try + -ing: um teste","hue":330,"clue":true,"rule":"try + *-ing* = do something to see what happens (an experiment, maybe it will solve the problem).","rulePt":"try + *-ing* = fazer algo para ver o que acontece (um teste, para ver se resolve).","eg":[["If you can't sleep, try *drinking* warm milk.","Se não consegue dormir, experimente *tomar* leite morno."]],"ex":["If you can't sleep, try drinking warm milk.","Try restarting your phone.","Have you tried adding more salt?"],"bad":{"to":{"en":"try + *to* = make an effort to do something hard.","pt":"try + *to* = se esforçar para fazer algo difícil."}}},"effort":{"short":"an effort","shortPt":"um esforço","form":"to","group":"change","name":"try + to: make an effort","namePt":"try + to: tentar, se esforçar","hue":330,"clue":true,"rule":"try + *to + verb* = make an effort to do something difficult (maybe you can't).","rulePt":"try + *to + verbo* = se esforçar para fazer algo difícil (talvez não consiga).","eg":[["I tried *to open* the window, but it was stuck.","Tentei *abrir* a janela, mas estava emperrada."]],"ex":["I tried to open the window, but it was stuck.","She's trying to learn Korean.","Try to be on time."],"bad":{"ing":{"en":"try + *-ing* = an experiment, to see what happens.","pt":"try + *-ing* = um teste, para ver o que acontece."}}},"perfto":{"short":"to have done","shortPt":"to have + particípio","form":"toperf","group":"perf","name":"to have + past participle","namePt":"to have + particípio","hue":250,"clue":true,"rule":"*to have* + past participle = the action happened before the main verb. Typical after seem, claim, be said, be lucky…","rulePt":"*to have* + particípio = a ação aconteceu antes do verbo principal. Comum depois de seem, claim, be said, be lucky…","eg":[["She seems *to have left*.","Parece que ela *já saiu*."],["He claims *to have met* the president.","Ele diz *ter conhecido* o presidente."],["I'm sorry *to have kept* you waiting.","Desculpe *ter feito* você esperar."]],"ex":["She seems to have forgotten.","He is said to have built the house himself.","We were lucky to have found a taxi."],"trap":{"pt":"Ela parece ter esquecido.","wrong":"She seems to forget.","right":"She seems to have forgotten."}},"perfing":{"short":"having done","shortPt":"having + particípio","form":"ingperf","group":"perf","name":"having + past participle","namePt":"having + particípio","hue":250,"clue":true,"rule":"*having* + past participle = the *-ing* form for an action before the main verb. After deny, admit, regret… and after prepositions. The simple *-ing* often works too.","rulePt":"*having* + particípio = a forma com *-ing* para uma ação anterior ao verbo principal. Depois de deny, admit, regret… e de preposição. O *-ing* simples muitas vezes também serve.","eg":[["He denied *having taken* the money.","Ele negou *ter pegado* o dinheiro."],["She regrets *having said* that.","Ela se arrepende *de ter dito* aquilo."]],"ex":["He admitted having lied.","I don't remember having met him.","She was accused of having stolen the files."],"trap":{"pt":"Ele negou ter pegado o dinheiro.","wrong":"He denied to have taken the money.","right":"He denied having taken the money."}},"passto":{"short":"to be done","shortPt":"to be + particípio","form":"topass","group":"perf","name":"to be + past participle","namePt":"to be + particípio","hue":250,"clue":true,"rule":"*to be* + past participle = the subject doesn't do the action, it receives it. After want, need, expect, deserve…","rulePt":"*to be* + particípio = o sujeito não faz a ação, ele recebe a ação. Depois de want, need, expect, deserve…","eg":[["I want *to be told* the truth.","Quero *que me contem* a verdade."],["She expects *to be promoted*.","Ela espera *ser promovida*."]],"ex":["Nobody likes to be ignored.","The form needs to be signed.","He deserves to be paid more."],"trap":{"pt":"Ela espera ser promovida.","wrong":"She expects to promote.","right":"She expects to be promoted."}},"passing":{"short":"being done","shortPt":"being + particípio","form":"ingpass","group":"perf","name":"being + past participle","namePt":"being + particípio","hue":250,"clue":true,"rule":"*being* + past participle = the *-ing* form of the passive: the subject receives the action. After enjoy, avoid, mind… and after prepositions.","rulePt":"*being* + particípio = a forma com *-ing* da passiva: o sujeito recebe a ação. Depois de enjoy, avoid, mind… e de preposição.","eg":[["I hate *being interrupted*.","Odeio *ser interrompido*."],["He left *without being seen*.","Ele saiu *sem ser visto*."]],"ex":["She avoided being photographed.","I don't mind being told what to do.","He's afraid of being forgotten."],"trap":{"pt":"Ela não gosta de ser interrompida.","wrong":"She doesn't like interrupting.","right":"She doesn't like being interrupted."}},"needing":{"short":"-ing (= passive)","shortPt":"-ing (= passiva)","form":"ing","group":"perf","name":"need + -ing = passive","namePt":"need + -ing = passiva","hue":250,"clue":true,"rule":"After need, *-ing* can have a passive meaning: the car needs washing = it needs to be washed. *to be* + past participle says the same.","rulePt":"Depois de need, o *-ing* pode ter sentido passivo: the car needs washing = o carro precisa ser lavado. *to be* + particípio diz o mesmo.","eg":[["The car needs *washing*.","O carro precisa *ser lavado*."],["The walls need *painting*.","As paredes precisam *ser pintadas*."]],"ex":["My hair needs cutting.","The plants need watering.","This shirt needs ironing."],"trap":{"pt":"O carro precisa ser lavado.","wrong":"The car needs to wash.","right":"The car needs washing. (or: needs to be washed)"},"bad":{"to":{"en":"*to + verb* would mean the subject does it itself.","pt":"*to + verbo* quer dizer que o próprio sujeito faz a ação."},"ingpass":{"en":"No *being* here: plain *-ing* is enough.","pt":"Sem *being* aqui: o *-ing* simples já basta."}}},"meanto":{"short":"intend","shortPt":"ter a intenção","form":"to","group":"change","name":"mean + to: intend","namePt":"mean + to: ter a intenção","hue":330,"clue":true,"rule":"mean + *to + verb* = intend, plan to (often something you didn't do in the end).","rulePt":"mean + *to + verbo* = ter a intenção (muitas vezes algo que no fim você não fez).","eg":[["I meant *to call* you.","Eu *pretendia ligar* para você."],["Sorry, I didn't mean *to scare* you.","Desculpe, eu não *queria assustar* você."]],"ex":["I meant to tell you, but I forgot.","She didn't mean to hurt anyone."],"trap":{"pt":"Eu tinha a intenção de te ligar.","wrong":"I meant calling you.","right":"I meant to call you."},"bad":{"ing":{"en":"mean + *-ing* = involve (the job means working weekends).","pt":"mean + *-ing* = envolver (the job means working weekends)."}}},"meaning":{"short":"involve","shortPt":"envolver, implicar","form":"ing","group":"change","name":"mean + -ing: involve","namePt":"mean + -ing: envolver","hue":330,"clue":true,"rule":"mean + *-ing* = involve, have as a result. The subject is usually a thing or a situation, not a person.","rulePt":"mean + *-ing* = envolver, implicar. O sujeito costuma ser uma coisa ou uma situação, não uma pessoa.","eg":[["The new job means *working* weekends.","O emprego novo *implica trabalhar* nos fins de semana."]],"ex":["Saving money means eating at home more.","Taking the early train means getting up at five."],"trap":{"pt":"Aceitar o emprego significa mudar de cidade.","wrong":"Taking the job means to move to another city.","right":"Taking the job means moving to another city."},"bad":{"to":{"en":"mean + *to* = intend.","pt":"mean + *to* = ter a intenção."}}},"goonto":{"short":"next","shortPt":"em seguida","form":"to","group":"change","name":"go on + to: the next thing","namePt":"go on + to: a próxima coisa","hue":330,"clue":true,"rule":"go on + *to + verb* = do something new next, after something else.","rulePt":"go on + *to + verbo* = fazer outra coisa em seguida, depois de algo.","eg":[["After college she went on *to become* a doctor.","Depois da faculdade ela *passou a ser* médica."]],"ex":["He talked about the problem and went on to explain the solution.","The band went on to sell millions of records."],"bad":{"ing":{"en":"go on + *-ing* = keep doing the same thing.","pt":"go on + *-ing* = continuar fazendo a mesma coisa."}}},"goonin":{"short":"keep doing","shortPt":"continuar fazendo","form":"ing","group":"change","name":"go on + -ing: keep doing","namePt":"go on + -ing: continuar fazendo","hue":330,"clue":true,"rule":"go on + *-ing* = continue, keep doing the same thing.","rulePt":"go on + *-ing* = continuar, seguir fazendo a mesma coisa.","eg":[["He went on *talking*.","Ele *continuou falando*."]],"ex":["She went on working after the bell.","Don't go on complaining: do something!"],"bad":{"to":{"en":"go on + *to* = do something new next.","pt":"go on + *to* = fazer algo novo em seguida."}}},"regretto":{"short":"sorry to say","shortPt":"lamentar informar","form":"to","group":"change","name":"regret + to: sorry to say","namePt":"regret + to: lamentar informar","hue":330,"clue":true,"rule":"regret + *to + verb* (inform, tell, announce) = be sorry about what you are going to say now. Formal.","rulePt":"regret + *to + verbo* (inform, tell, announce) = lamentar o que você vai dizer agora. Formal: *lamentamos informar*.","eg":[["We regret *to inform* you that…","*Lamentamos informar* que…"]],"ex":["We regret to announce that the show is canceled.","I regret to say that I can't help."],"trap":{"pt":"Lamentamos informar que o voo foi cancelado.","wrong":"We regret informing you that the flight has been canceled.","right":"We regret to inform you that the flight has been canceled."},"bad":{"ing":{"en":"regret + *-ing* = sorry about something you did in the past.","pt":"regret + *-ing* = lamentar algo que você fez no passado."}}},"seebare":{"short":"the whole action","shortPt":"a ação inteira","form":"bare","group":"change","name":"see / hear + someone + verb: the whole action","namePt":"see / hear + alguém + verbo: a ação inteira","hue":330,"clue":true,"rule":"see, hear, watch + someone + the *verb* alone = you saw or heard the whole action, from start to end.","rulePt":"see, hear, watch + alguém + só o *verbo* = você viu ou ouviu a ação inteira, do começo ao fim.","eg":[["I saw her *open* the door and *leave*.","Eu a vi *abrir* a porta e *sair*."]],"ex":["We watched the sun go down.","I heard him close the door."],"trap":{"pt":"Eu vi ele sair.","wrong":"I saw him to leave.","right":"I saw him leave."},"bad":{"ing":{"en":"*-ing* = only part of the action, while it was happening.","pt":"*-ing* = só uma parte da ação, enquanto acontecia."}}},"seeing":{"short":"part of it, in progress","shortPt":"parte da ação, em andamento","form":"ing","group":"change","name":"see / hear + someone + -ing: in progress","namePt":"see / hear + alguém + -ing: em andamento","hue":330,"clue":true,"rule":"see, hear, watch + someone + *-ing* = you saw or heard part of the action, while it was happening.","rulePt":"see, hear, watch + alguém + *-ing* = você viu ou ouviu parte da ação, enquanto ela acontecia.","eg":[["I could hear them *arguing*.","Eu ouvia os dois *discutindo*."]],"ex":["I saw some kids playing in the street.","She noticed a man watching her."],"bad":{"bare":{"en":"The *verb* alone = the whole action, from start to end.","pt":"Só o *verbo* = a ação inteira, do começo ao fim."}}},"afraidto":{"short":"too scared to do it","shortPt":"medo de fazer (e não faz)","form":"to","group":"change","name":"afraid + to: too scared to do it","namePt":"afraid + to: medo de fazer","hue":330,"clue":true,"rule":"afraid + *to + verb* = too scared to do something on purpose, so you don't do it. (afraid of + *-ing* = scared that something might happen to you.)","rulePt":"afraid + *to + verbo* = medo de fazer algo de propósito, e por isso você não faz. (afraid of + *-ing* = medo de que algo aconteça com você.)","eg":[["I was afraid *to ask*.","Tive medo *de perguntar*."]],"ex":["She was afraid to say no.","Don't be afraid to make mistakes."],"trap":{"pt":"Ele teve medo de perguntar.","wrong":"He was afraid of ask.","right":"He was afraid to ask."}},"afraidof":{"short":"scared it might happen","shortPt":"medo de que aconteça","form":"ing","group":"change","name":"afraid of + -ing: scared it might happen","namePt":"afraid of + -ing: medo de que aconteça","hue":330,"clue":true,"rule":"afraid of + *-ing* = scared that something might happen (often by accident). (afraid + *to* = too scared to do it on purpose.)","rulePt":"afraid of + *-ing* = medo de que algo aconteça (muitas vezes sem querer). (afraid + *to* = medo de fazer de propósito.)","eg":[["She's afraid *of falling*.","Ela tem medo *de cair*."]],"ex":["He was afraid of getting lost.","I'm afraid of missing the train."]},"forto":{"form":"to","name":"for + someone + to","namePt":"for + alguém + to","hue":205,"clue":true,"pocket":false,"rule":"To say who does the action, use for + someone + *to + verb*.","rulePt":"Para dizer quem faz a ação: for + alguém + *to + verbo*. Em português muitas vezes vem que + subjuntivo.","eg":[["It's important for you *to rest*.","É importante *que você descanse*."],["The idea is for us *to meet* at six.","A ideia é *a gente se encontrar* às seis."]],"ex":["It's hard for me to say no.","There's no need for you to come."],"trap":{"pt":"É melhor a gente sair cedo.","wrong":"It's better for us leaving early.","right":"It's better for us to leave early."}},"possing":{"form":"ing","name":"my / your… + -ing","namePt":"my / your… + -ing","hue":28,"clue":true,"pocket":false,"rule":"A possessive (my, your, his, our…) before an action gives it its own subject, and the verb takes *-ing*.","rulePt":"Um possessivo (my, your, his, our…) antes de uma ação diz quem faz, e o verbo vai com *-ing*. Em português vem que + subjuntivo ou um substantivo.","eg":[["Do you mind my *asking*?","Você se importa *que eu pergunte*?"],["We appreciate your *coming*.","Agradecemos *a sua vinda*."]],"ex":["I don't mind your using my car.","Excuse my interrupting."],"trap":{"pt":"Você se importa que eu abra a janela?","wrong":"Do you mind that I open the window?","right":"Do you mind my opening the window?"}},"allwas":{"form":"bare","name":"All I did was + verb","namePt":"All I did was + verbo","hue":280,"clue":true,"pocket":false,"afterBe":true,"rule":"After All … did was and What … do is, the *verb* alone says the action (*to + verb* is possible too). Never *-ing*: this is not a continuous tense.","rulePt":"Depois de All … did was e What … do is, vem só o *verbo* (*to + verbo* também serve). Nunca *-ing*: não é um tempo contínuo.","eg":[["All I did was *ask*.","Tudo o que eu fiz foi *perguntar*."],["What you need to do is *call* them.","O que você precisa fazer é *ligar* para eles."]],"ex":["All she did was smile.","What I want to do is sleep."],"trap":{"pt":"Tudo o que eu fiz foi perguntar.","wrong":"All I did was asking.","right":"All I did was ask."}},"onlyto":{"form":"to","name":"only to: a surprise afterwards","namePt":"only to: uma surpresa depois","hue":205,"clue":true,"rule":"…, only *to + verb* = and then, unexpectedly (usually something bad).","rulePt":"…, only *to + verbo* = e aí, de surpresa (quase sempre algo ruim).","eg":[["We ran to the station, only *to find* the train had left.","Corremos até a estação, só *para descobrir* que o trem tinha saído."]],"ex":["She studied all night, only to sleep through the exam.","He finally found his keys, only to lose them again."]}},"wrong":{"simple-for-perf":{"en":"The action happened before the main verb: use the perfect (*to have* / *having* + past participle).","pt":"A ação aconteceu antes do verbo principal: use a forma perfeita (*to have* / *having* + particípio)."},"perf-for-simple":{"en":"No perfect here: the action isn't earlier than the main verb.","pt":"Sem forma perfeita aqui: a ação não é anterior ao verbo principal."},"active-for-pass":{"en":"The subject doesn't do this action, it receives it: use the passive (*to be* / *being* + past participle).","pt":"O sujeito não faz a ação, ele recebe a ação: use a passiva (*to be* / *being* + particípio)."},"pass-for-active":{"en":"The subject does this action itself: no passive here.","pt":"O sujeito faz a ação: sem passiva aqui."}},"mistakes":[{"lv":"A2","pt":"Ela é interessada em aprender japonês.","wrong":"She's interested in learn Japanese.","right":"She's interested in learning Japanese.","rule":"prep","why":"After a preposition (in, at, of, about, for, without…) English uses *-ing*. Portuguese uses the infinitive.","whyPt":"Depois de preposição (in, at, of, about, for, without…) o inglês usa *-ing*. O português usa o infinitivo."},{"lv":"A2","pt":"Obrigado por vir!","wrong":"Thanks for come!","right":"Thanks for coming!","rule":"prep","why":"for is a preposition: the verb after it takes *-ing*.","whyPt":"for é preposição: o verbo depois dele vai com *-ing*."},{"lv":"A2","pt":"Antes de sair, desligue a luz.","wrong":"Before leave, turn off the light.","right":"Before leaving, turn off the light.","rule":"prep","why":"before and after are prepositions here: *-ing*.","whyPt":"before e after são preposições aqui: *-ing*."},{"lv":"A2","pt":"Nadar faz bem para a saúde.","wrong":"Swim is good for your health.","right":"Swimming is good for your health.","rule":"subject","why":"An action as the subject takes *-ing* in English.","whyPt":"Uma ação como sujeito vai com *-ing* em inglês."},{"lv":"A2","pt":"Eu vim aqui para estudar.","wrong":"I came here for study.","right":"I came here to study.","rule":"purpose","why":"*para* (why someone does something) = *to + verb*. Never for + verb.","whyPt":"*para* (para quê) = *to + verbo*. Nunca for + verbo."},{"lv":"A2","pt":"Você se importa de esperar?","wrong":"Do you mind to wait?","right":"Do you mind waiting?","rule":"enjoy","why":"mind, enjoy, finish, avoid, suggest… are always followed by *-ing*.","whyPt":"mind, enjoy, finish, avoid, suggest… sempre vêm com *-ing*."},{"lv":"A2","pt":"Ela sugeriu irmos ao parque.","wrong":"She suggested to go to the park.","right":"She suggested going to the park.","rule":"enjoy","why":"suggest + *-ing* (or suggest that we go). Never suggest to go.","whyPt":"suggest + *-ing* (ou suggest that we go). Nunca suggest to go."},{"lv":"B1","pt":"Estou ansioso para te ver.","wrong":"I look forward to see you.","right":"I look forward to seeing you.","rule":"toprep","why":"In look forward to, *to* is a preposition (look forward to the weekend), so the verb takes *-ing*.","whyPt":"Em look forward to, o *to* é preposição (look forward to the weekend), então o verbo vai com *-ing*."},{"lv":"B1","pt":"Eu estou acostumado a acordar cedo.","wrong":"I'm used to wake up early.","right":"I'm used to waking up early.","rule":"toprep","why":"be used to = be accustomed to: its *to* is a preposition, so *-ing*. (Different from used to + verb = costumava: I used to wake up early.)","whyPt":"be used to = estar acostumado a: o *to* é preposição, então *-ing*. (Diferente de used to + verbo = costumava: I used to wake up early.)"},{"lv":"A2","pt":"Eu preciso estudar.","wrong":"I need study.","right":"I need to study.","rule":"want","why":"need, want, decide, hope… take *to + verb*. Portuguese has nothing between the verbs, English needs to.","whyPt":"need, want, decide, hope… pedem *to + verbo*. O português não tem nada entre os verbos, o inglês precisa do to."},{"lv":"A2","pt":"Eu gostaria de viajar.","wrong":"I would like traveling.","right":"I would like to travel.","rule":"would","why":"would like / would love = a wish: *to + verb*.","whyPt":"would like / would love = um desejo: *to + verbo*."},{"lv":"B1","pt":"Eu quero que você venha.","wrong":"I want that you come.","right":"I want you to come.","rule":"obj","why":"want + someone + *to + verb*. English has no \"want that\".","whyPt":"want + alguém + *to + verbo*. Em inglês não existe \"want that\"."},{"lv":"B1","pt":"Eu não sei o que dizer.","wrong":"I don't know what say.","right":"I don't know what to say.","rule":"wh","why":"how / what / where + *to + verb*.","whyPt":"how / what / where + *to + verbo*."},{"lv":"B1","pt":"O filme me fez chorar.","wrong":"The movie made me to cry.","right":"The movie made me cry.","rule":"make","why":"make / let + someone + the *verb* alone, no *to*.","whyPt":"make / let + alguém + só o *verbo*, sem *to*."},{"lv":"B1","pt":"É melhor você ir ao médico.","wrong":"You'd better to go to the doctor.","right":"You'd better go to the doctor.","rule":"better","why":"had better and would rather + the *verb* alone.","whyPt":"had better e would rather + só o *verbo*."},{"lv":"A2","pt":"Vamos fazer compras no sábado.","wrong":"Let's go to shopping on Saturday.","right":"Let's go shopping on Saturday.","rule":"go","why":"go + *-ing* for free-time activities, no *to*. (And the place is a mall, not a shopping!)","whyPt":"go + *-ing* para atividades de lazer, sem *to*. (E o lugar é mall, não shopping!)"},{"lv":"B2","pt":"Ele parou de fumar.","wrong":"He stopped to smoke.","right":"He stopped smoking.","rule":"quit","why":"*parar de fazer algo* = stop + *-ing*. stop + *to* = *parar para fazer algo* (he stopped to smoke = he stopped in order to smoke!).","whyPt":"*parar de fazer algo* = stop + *-ing*. stop + *to* = *parar para fazer algo* (he stopped to smoke = ele parou para fumar!)."},{"lv":"B2","pt":"Lembre-se de trancar a porta.","wrong":"Remember locking the door.","right":"Remember to lock the door.","rule":"task","why":"A task still to do: remember + *to*. remember + *-ing* is a memory of the past.","whyPt":"Uma tarefa que ainda falta: remember + *to*. remember + *-ing* é a lembrança de algo passado."},{"lv":"B2","pt":"Vale a pena visitar o museu.","wrong":"It's worth to visit the museum.","right":"It's worth visiting the museum.","rule":"expr","why":"it's worth, there's no point, can't help… + *-ing*.","whyPt":"it's worth, there's no point, can't help… + *-ing*."},{"lv":"B2","pt":"Ele afirma ter visto um OVNI ontem à noite.","wrong":"He claims to see a UFO last night.","right":"He claims to have seen a UFO last night.","rule":"perfto","why":"last night came before the claim: *to have* + past participle (*ter visto*). to see would mean now, or in general.","whyPt":"last night veio antes da afirmação: *to have* + particípio (*ter visto*). to see seria agora, ou em geral."},{"lv":"B2","pt":"Desculpa, eu não quis te magoar.","wrong":"Sorry, I didn't mean hurting you.","right":"Sorry, I didn't mean to hurt you.","rule":"meanto","why":"mean + *to* = intend (*ter a intenção de*). mean + *-ing* = involve: Saving money means cooking at home.","whyPt":"mean + *to* = *ter a intenção de*. mean + *-ing* = *significar, implicar*: Saving money means cooking at home."},{"lv":"B2","pt":"Meu carro precisa ser lavado.","wrong":"My car needs to wash.","right":"My car needs washing.","rule":"needing","why":"need + *-ing* has a passive meaning: needs washing = needs to be washed. My car needs to wash would mean the car washes something!","whyPt":"need + *-ing* tem sentido passivo: needs washing = needs to be washed (*precisa ser lavado*). My car needs to wash seria o carro lavando alguma coisa!"}],"curious":[{"t":"like to / like -ing","en":"Both are right and usually mean the same. Some speakers use *-ing* for enjoying the activity itself (I like swimming) and *to + verb* for a habit or something they think is a good idea (I like to get up early on Sundays).","pt":"As duas estão certas e quase sempre querem dizer a mesma coisa. Há quem use *-ing* para o prazer da atividade (I like swimming) e *to + verbo* para um hábito ou algo que acha bom fazer (I like to get up early on Sundays)."},{"t":"Is this to a preposition?","en":"Try a noun after it. If a noun fits (I look forward to the weekend, I'm used to the cold), this *to* is a preposition, so a verb after it takes *-ing*: look forward to seeing, used to waking up.","pt":"Teste com um substantivo depois dele. Se couber (I look forward to the weekend, I'm used to the cold), esse *to* é preposição, e o verbo depois dele vai com *-ing*: look forward to seeing, used to waking up."},{"t":"used to do / be used to doing","en":"used to + the *verb* is a past habit (*costumava*): I used to live in Recife. be used to + *-ing* is *estar acostumado a*: I'm used to living alone. The be (am, was…) tells them apart.","pt":"used to + *verbo* é um hábito do passado (*costumava*): I used to live in Recife. be used to + *-ing* é *estar acostumado a*: I'm used to living alone. O be (am, was…) é o que diferencia."},{"t":"make me cry, but want me to cry","en":"make, let and have (I'll have him call you) take the *verb* alone. Most other verbs take *to*: want me to come, ask him to wait, tell her to call. In the passive, make gets its *to* back: I was made to wait.","pt":"make, let e have (I'll have him call you) pedem só o *verbo*. A maioria dos outros verbos pede *to*: want me to come, ask him to wait, tell her to call. Na voz passiva, o make recupera o *to*: I was made to wait."},{"t":"not to + verb","en":"To say no, put not before *to*: I decided not to go. You'll also hear to not go in everyday speech, but not to go is the safe choice.","pt":"Para negar, o not vem antes do *to*: I decided not to go. Na fala do dia a dia também se ouve to not go, mas not to go é a escolha segura."},{"t":"to really understand","en":"A word between *to* and the verb (to really understand, to boldly go) was once called a mistake. Today it's normal English, and it often sounds more natural.","pt":"Uma palavra entre o *to* e o verbo (to really understand, to boldly go) já foi considerada erro. Hoje é inglês normal, e muitas vezes soa mais natural."},{"t":"help someone (to) do","en":"Both are right: She helped me (to) move. American English usually leaves out *to*.","pt":"As duas estão certas: She helped me (to) move. O inglês americano costuma deixar o *to* de fora."},{"t":"Do you mind me / my opening the window?","en":"Before *-ing* you can put me, him, Ana… or my, his, Ana's… My is more formal; me is what most people say.","pt":"Antes do *-ing* pode vir me, him, Ana… ou my, his, Ana's… O my é mais formal; o me é o que a maioria diz."},{"t":"a building, a meeting, my feelings","en":"Some -ing words became ordinary nouns: they take a, the and a plural -s. a building (*um prédio*), a meeting (*uma reunião*), my feelings (*meus sentimentos*).","pt":"Algumas palavras com -ing viraram substantivos comuns: aceitam a, the e plural com -s. a building (*um prédio*), a meeting (*uma reunião*), my feelings (*meus sentimentos*)."},{"t":"-ing is not the gerúndio","en":"The Portuguese gerúndio (*falando*) is mostly about an action in progress. In this game, English *-ing* works like a noun: Swimming is fun is close to *O nadar é divertido*, or simply *Nadar é divertido*. That's why Portuguese uses the infinitive where English uses *-ing*.","pt":"O gerúndio do português (*falando*) fala quase sempre de uma ação em andamento. Neste jogo, o *-ing* do inglês funciona como um substantivo: Swimming is fun é como *O nadar é divertido*, ou só *Nadar é divertido*. Por isso o português usa o infinitivo onde o inglês usa *-ing*."}],"demo":[{"en":"She enjoys [cook:ing:enjoy] for her friends.","pt":"Ela adora cozinhar para os amigos."}]},"pt":{"name":"Português","badge":"PT","grad":"linear-gradient(135deg, #1fa463, #e8b600)","ui":{"favorites":"Favoritos","seen":"Vistos","tutorial":"Tutorial","guide":"Guia","tries":"Tentativas","hint":"Pistas","left":"{n} restantes","reset":"Limpar","check":"Conferir","nothing":"nada","gap":"Lacuna","textOf":"Texto {n} de {total}","reviewOf":"Revisão {n} de {total}","favOf":"Favorito {n} de {total}","bonusOf":"Rodada bônus","judgeOf":"Certo ou errado? {n} de {total}","intro":"Toque numa bolha cinza e continue tocando: {cycle}. Pare na forma certa e depois toque em <b>Conferir<\/b>.","introShort":"Toque em cada bolha cinza até aparecer a forma certa: {cycle}.","greyLeft":"Toda lacuna precisa de uma forma: toque nas bolhas cinza.","wrong1":"Ainda não: <b>1<\/b> lacuna está errada.","wrongN":"Ainda não: <b>{n}<\/b> lacunas estão erradas.","wrongMarked":"Ela está marcada em vermelho — as verdes ficaram travadas.","wrongMarkedN":"Elas estão marcadas em vermelho.","askCls":"Olhe logo antes da lacuna: tem uma preposição (<b>-ing<\/b>)? Um verbo como <b>enjoy<\/b> (-ing) ou <b>want<\/b> (to)? Ela diz <b>para quê<\/b> (to)?","tryLeft":"Resta 1 tentativa.","triesLeft":"Restam {n} tentativas.","outOfTries":"Aqui estão as respostas certas — leia o porquê abaixo.","cluesOn":"<b>Pistas<\/b>: as palavras que decidem estão destacadas.","cluesWrong":"<b>Pistas<\/b>: as palavras que decidem as lacunas vermelhas estão destacadas.","hintLast":"Essa foi a sua última pista neste jogo.","hintsLeftGame":"Restam <b>{n}<\/b> neste jogo.","perfect":"Perfeito!","streak":"{n} perfeitos seguidos!","nice":"Muito bem!","gotIt":"Boa tentativa!","done":"Pronto!","doneNote":"Leia o porquê abaixo — toque numa bolha do texto para ir até a explicação dela.","correctOf":"{k} de {n} certas","translation":"Tradução","listen":"Ouvir","listenText":"Ouvir o texto","next":"Próximo","results":"Ver resultado","bothTitle":"As duas servem:","tag_headline":"Manchete","toMeaning":"Qual significado?","toProof":"Revisão","meaningTag":"Qual significado?","meaningOf":"Qual significado? {n} de {total}","meaningAsk":"Qual frase quer dizer isto?","meaningIntro":"<b>Qual significado?<\/b> Duas frases, uma forma do verbo de diferença. Escolha a que quer dizer o que o cartão diz (teclas 1 / 2).","meaningScore":"Qual significado? {k} de {n}","meaningRound":"Qual significado? {r}","proofTag":"Revisão","proofSaid":"Estava escrito","proofFixed":"{k} de {n} erros corrigidos","proofRound":"Revisão: {r}","proofIntro":"<b>Revisão!<\/b> Alguém escreveu este texto, e 2 ou 3 formas de verbo estão erradas. Toque nas erradas até ficarem certas e depois em <b>Conferir<\/b>.","bothOk":"{x} e {y} estão certos aqui.","toBonus":"Rodada bônus","toJudge":"Certo ou errado?","toSents":"Suas frases","sentTag":"Frase","sentOf":"Frase {n} de {total}","youChose":"Você escolheu","youChoseFirst":"Primeiro você escolheu","rightIs":"mas o certo é {x}","watchOut":"Atenção!","guideBackEx":"Voltar às explicações","inPt":"Em português","ptTrap":"PT ≠ EN","bonusTag":"Bônus","bonusIntro":"<b>Bônus!<\/b> Monte a frase em inglês: arraste (ou toque) as bolhas para as lacunas. Cuidado: algumas palavras sobram.","bonusWrong":"Quase: as palavras verdes estão certas. Tente as outras de novo!","bonusOut":"Esta é a frase.","bonusPerfect":"Bônus +{n}!","bonusGot":"Conseguiu! +{n}","bonusMissed":"Sem bônus desta vez.","judgeTag":"Certo ou errado?","judgeIntro":"<b>Certo ou errado?<\/b> Leia cada frase: a forma do verbo sublinhada está certa?","judgeRight":"Certo","judgeWrong":"Errado","judgeAsk":"A forma sublinhada está certa?","judgeYes":"Isso! +1","judgeNo":"Não foi desta vez.","judgeWasRight":"Esta frase está certa.","judgeWasWrong":"Esta frase tem um erro.","judgeScore":"Certo ou errado: {k} de {n}","guideTitle":"Doing or to do?","guideAsk":"Pergunte-se, nesta ordem","guideRules":"Todas as regras, com exemplos","askPocket":"depende","guideTip":"<b>Nem sempre o -ing indica ações contínuas!<\/b> Às vezes usamos o -ing (gerúndio) em situações nas quais, no português, usaríamos o infinitivo. O nosso -ndo é quase sempre contínuo (<i>estou nadando<\/i>), mas o -ing do inglês muitas vezes é a ação como uma coisa: <i>Nadar faz bem<\/i> → <b>Swimming<\/b> is good for you. <i>Antes de sair<\/i> → before <b>leaving<\/b>.","pocketsTitle":"Expressões que pedem <b>gerúndio<\/b> e expressões que pedem <b>infinitivo<\/b>","pocketsLead":"Cada expressão que você acerta na primeira conferida vai para o grupo dela: o grupo das que pedem <b>-ing<\/b> e o grupo das que pedem <b>to<\/b>. Do B1 em diante também há os grupos <b>só o verbo<\/b>, <b>to ou -ing<\/b> e <b>o sentido muda<\/b>, e no B2+ <b>perfeito / passivo<\/b>. Esta é a sua lista. Continue aumentando ela!","pocketEmpty":"Nada aqui ainda.","pocketNew":"Novo na sua lista:","pocket_ing":"+ -ing","pocket_to":"+ to","pocket_bare":"+ só o verbo","pocket_both":"to ou -ing","pocket_change":"O sentido muda","pocket_perf":"perfeito / passivo","mistakesTitle":"Português → inglês: armadilhas clássicas","mistakesLead":"O que o português nos faz dizer, o que o inglês diz no lugar, e por quê. Toque num cartão.","curTitle":"Para os curiosos","curLead":"Além das regras: detalhes que você vai ouvir, e por que o jogo deixa alguns de fora.","pmNormal":"Jogo normal","pmSpeed":"Rodada relâmpago","pmReview":"Revisar erros","pmFav":"Favoritos","nTexts":"{n} textos + bônus","nTextsP":"{n} textos","oneText":"1 texto","nSeconds":"{n} segundos · frases soltas","pmNoMiss":"nenhum erro ainda","pmNoFav":"nenhum favorito ainda","oneFav":"1 salvo","nFavs":"{n} salvos","speedTitle":"Rodada relâmpago","speedIntro":"Escolha a forma certa — uma frase de cada vez, o mais rápido que puder!","go":"Já!","speedAsk":"Qual está certa? Toque ou aperte o número dela.","endGame":"Fim de jogo!","endPractice":"Treino concluído!","endTime":"Acabou o tempo!","onePoint":"1 ponto","nPoints":"{n} pontos","inSeconds":"{x} certas em {s} segundos","msg0":"Continue — a prática leva à perfeição!","msg1":"Bom esforço — continue praticando!","msg2":"Ótimo trabalho!","msg3":"Brilhante! Você sabe mesmo quando usar -ing e to.","noSave":"Jogo de treino: a pontuação não é salva.","speedRecord":"Novo recorde relâmpago no {lvl}!","newBest":"Novo recorde no {lvl}!","levelBest":"Nível {lvl} · recorde {n}","hintsUsed":"Pistas usadas: {n} de {m}","bonus":" · +{n} extra","bonusRound":"Rodada bônus: {r}","judgeRound":"Certo ou errado: {r}","missed":"errou","mastered":"textos dominados no {lvl}","daysRow":" · 🔥 {n} dias seguidos","trapsBeaten":"PT ≠ EN — armadilhas do português vencidas: {k} de {n}","playAgain":"Jogar de novo","copy":"Copiar resultado","copied":"Copiado ✓","copyFail":"Não deu para copiar","tryUp":"Tentar o {lvl} →","seenTitle":"Textos vistos","tabRecent":"Recentes","tabMissed":"Com erro","masteredHead":"Textos dominados (perfeitos na primeira conferida)","usesHead":"Regras para praticar (as mais fracas, todos os jogos)","usesOk":"Nenhuma regra fraca: 80% ou mais em todas!","practiseOne":"Praticar este","practiseMany":"Praticar estes","emptyFav":"Nenhum favorito ainda. Toque na estrela de um texto terminado, de uma frase bônus ou de Certo ou errado, de um texto de revisão, ou de uma frase da rodada relâmpago nos resultados, para guardá-lo aqui.","emptyRecent":"Os textos que você terminar aparecem aqui.","emptyMissed":"Nenhum texto com erro. Muito bem!"},"tour":{"ui":{"step":"Passo {n} de {total}","back":"Voltar","next":"Próximo","play":"Vamos jogar!","close":"Fechar o tutorial"},"steps":{"welcome":{"t":"<b>Doing<\/b> or <b>to do<\/b>?","x":"<b>Nem sempre o -ing indica ações contínuas!<\/b> Às vezes usamos o -ing (gerúndio) em situações nas quais, no português, usaríamos o infinitivo. Neste jogo vamos praticar e ver quando isso acontece. <i><b>Nadar<\/b> faz bem<\/i> → <b>Swimming<\/b> is good for you.<br><br>Cada texto tem bolhas cinza com um verbo. Toque numa e continue tocando: <b>to cook<\/b> → <b>cooking<\/b> (do B1 em diante também <b>cook<\/b>, só o verbo). Veja:"},"level":{"t":"Escolha o seu nível","x":"<b>A2<\/b>: verbos que pedem <b>-ing<\/b> e verbos que pedem <b>infinitivo<\/b>; preposição + <b>-ing<\/b>; instruções em português.<br><b>B1<\/b>: uma terceira forma, só o verbo base; expressões mais avançadas como <i>look forward to<\/i> e <i>used to<\/i> e uma rodada de Certo ou errado?<br><b>B2+<\/b>: verbos que mudam de sentido (<b>stop smoking<\/b> vs <b>stop to smoke<\/b>), formas perfeitas e passivas (<b>to have done<\/b>, <b>being done<\/b>) e mais perguntas bônus."},"text":{"t":"Leia o texto inteiro primeiro","x":"Para cada lacuna, olhe o que vem <b>logo antes<\/b> dela: uma preposição? um verbo como <i>enjoy<\/i> ou <i>want<\/i>? Ela é o sujeito da frase, ou diz <b>para quê<\/b>? Toque numa palavra sublinhada com pontinhos para ver o significado."},"spot":{"t":"Toque, toque, toque…","x":"Olhe a primeira lacuna: cinza quer dizer que nada foi escolhido ainda. Cada toque muda a forma do verbo."},"check":{"t":"Conferir","x":"Pare cada lacuna na forma certa e toque em <b>Conferir<\/b>. Certo na primeira conferida = <b>2 pontos<\/b> por lacuna; numa conferida depois = 1. No A2, uma lacuna errada fica vermelha e as certas ficam travadas em verde."},"clues":{"t":"Pistas","x":"Travou? As <b>Pistas<\/b> destacam as palavras que decidem (<i>enjoy<\/i>, <i>without<\/i>, <i>made me<\/i>…). Elas valem para o jogo todo, e cada pista que sobrar vira um <b>ponto extra<\/b>."},"why":{"t":"Entenda o porquê","x":"Depois de conferir, cada lacuna ganha uma explicação: a regra em inglês e em português, e a <b>armadilha do português<\/b> por trás dela (<i>interessada em aprender<\/i> → interested in <b>learning<\/b>). Lacunas marcadas <b>PT ≠ EN<\/b> são onde as duas línguas são diferentes."},"pockets":{"t":"Sua lista","x":"Cada expressão que você acerta na primeira conferida vai para o grupo dela no Guia: <i>enjoy<\/i> → o grupo das que pedem <b>-ing<\/b>, <i>decide<\/i> → o grupo das que pedem <b>to<\/b>… É essa a lista que você precisa aprender, e é você mesmo que monta."},"bonus":{"t":"Rodadas bônus","x":"No <b>A2<\/b>, depois dos 3 textos vem um <b>bônus<\/b>: uma frase em português e a versão em inglês com lacunas: arraste (ou toque) as bolhas de palavras; as que sobram são as que o português faz a gente usar! No <b>B1<\/b> o bônus é <b>Certo ou errado?<\/b>. No <b>B2+<\/b> são dois: <b>Qual significado?<\/b> (<i>stopped smoking<\/i> ou <i>stopped to smoke<\/i>?) e <b>Revisão<\/b> (encontre e corrija as 2 ou 3 formas erradas de um texto)."},"guide":{"t":"O guia","x":"Abra o <b>Guia<\/b> quando quiser: as perguntas para fazer a si mesmo, todas as regras com exemplos, e as armadilhas clássicas para quem fala português (<i>parou de fumar<\/i> → stopped <b>smoking<\/b>)."},"score":{"t":"Pontos","x":"Pontos para cada texto e rodada bônus, mais 1 ponto extra para cada pista que você não usar. Textos perfeitos seguidos formam um <b>combo<\/b>!"},"play":{"t":"Mais jeitos de jogar","x":"Toque em <b>new game<\/b> para um jogo novo, uma <b>rodada relâmpago<\/b> de 1 minuto com frases soltas, ou um treino com os textos em que você <b>errou<\/b> ou que <b>marcou com estrela<\/b>."},"lists":{"t":"Favoritos e Vistos","x":"Marque um texto terminado com estrela para guardá-lo nos <b>Favoritos<\/b>. <b>Vistos<\/b> mostra o seu progresso e os seus acertos em cada regra. Descubra seus pontos fracos e pratique!"}}}},"texts":{"A2":[{"id":"a2-01","frame":"Blog","framePt":"Blog","title":"My weekends","titlePt":"Os meus fins de semana","body":["I really {enjoy} [cook:ing:enjoy] on weekends. On Saturdays I go to the market [buy:to:purpose] fresh vegetables. My brother is very {good at} [bake:ing:prep] bread, so he makes the bread and I make the soup. This weekend we {want} [try:to:want] a new recipe from Thailand."],"pt":["Eu gosto muito de cozinhar nos fins de semana. Aos sábados eu vou à feira para comprar legumes frescos. O meu irmão é muito bom em fazer pão, então ele faz o pão e eu faço a sopa. Neste fim de semana a gente quer experimentar uma receita nova da Tailândia."],"w":{"market":"feira, mercado","fresh vegetables":"legumes frescos","bread":"pão","soup":"sopa","recipe":"receita"},"cw":{"enjoy":"gostar (muito), curtir","good at":"bom em","want":"querer"}},{"id":"a2-02","frame":"Email","framePt":"E-mail","title":"Thanks for everything!","titlePt":"Obrigada por tudo!","body":["Hi Ana, {thanks for} [help:ing:prep] me with my move last week! I {finished|finish} [unpack:ing:enjoy] all the boxes yesterday. Now I {need} [buy:to:want] a sofa and some lamps. Are you free on Saturday? {Before} [go:ing:prep] to the furniture store, we can have lunch together."],"pt":["Oi, Ana, obrigada por me ajudar com a mudança semana passada! Eu terminei de desfazer todas as caixas ontem. Agora eu preciso comprar um sofá e algumas luminárias. Você está livre no sábado? Antes de ir à loja de móveis, a gente pode almoçar junto."],"w":{"move":"mudança","unpacking":"desfazendo (as caixas)","boxes":"caixas","lamps":"luminárias","furniture store":"loja de móveis"},"cw":{"thanks for":"obrigado por","finished":"terminei","need":"preciso","Before":"antes de"}},{"id":"a2-03","frame":"Postcard","framePt":"Cartão-postal","title":"Greetings from Lisbon","titlePt":"Saudações de Lisboa","body":["Dear Grandma, Lisbon is beautiful! Yesterday we {decided|decide} [take:to:want] the old yellow tram to the top of the city. [walk:ing:subject] up the hills is hard work, so the tram was a good idea. Tomorrow I'd {like|would like} [visit:to:would] the castle. I {miss} [see:ing:enjoy] you every day. Love, Sofia"],"pt":["Querida vovó, Lisboa é linda! Ontem a gente decidiu pegar o velho bonde amarelo até o alto da cidade. Subir as ladeiras a pé dá muito trabalho, então o bonde foi uma boa ideia. Amanhã eu gostaria de visitar o castelo. Sinto falta de te ver todo dia. Beijos, Sofia"],"w":{"tram":"bonde","hills":"ladeiras, morros","hard work":"muito trabalho, cansativo","castle":"castelo"},"cw":{"decided":"decidimos","like":"would like = gostaria","miss":"sentir falta de"}},{"id":"a2-04","frame":"School notice","framePt":"Aviso da escola","title":"Chess club","titlePt":"Clube de xadrez","body":["Are you {interested in} [join:ing:prep] the new chess club? We meet every Wednesday {after} [eat:ing:prep] lunch, in Room 12. Chess is {easy} [learn:to:adj], and our teacher, Mr. Okafor, explains everything. You don't {need} [bring:to:want] anything: we have all the boards."],"pt":["Você tem interesse em entrar no novo clube de xadrez? A gente se encontra toda quarta depois do almoço, na sala 12. Xadrez é fácil de aprender, e o nosso professor, o Sr. Okafor, explica tudo. Você não precisa trazer nada: a gente tem todos os tabuleiros."],"w":{"chess":"xadrez","Room 12":"sala 12","explains":"explica","boards":"tabuleiros"},"cw":{"interested in":"interessado em","after":"depois de","easy":"fácil","need":"precisa"}},{"id":"a2-05","frame":"Profile","framePt":"Perfil","title":"About me","titlePt":"Sobre mim","body":["Hi! I'm Kenji, and I'm 24. I {love} [read:ing/to:like] mystery novels, especially at night. I {don't mind} [get up:ing:enjoy] early: I run every morning [stay:to:purpose] healthy. One day I {hope} [visit:to:want] Canada and see the Rocky Mountains."],"pt":["Oi! Eu sou o Kenji e tenho 24 anos. Eu amo ler romances policiais, principalmente à noite. Eu não me importo de acordar cedo: corro toda manhã para me manter saudável. Um dia eu espero visitar o Canadá e ver as Montanhas Rochosas."],"w":{"mystery novels":"romances policiais","especially":"principalmente","healthy":"saudável","one day":"um dia"},"cw":{"love":"amo, adoro","don't mind":"não me importo","hope":"espero"},"notes":[{"en":"love + *-ing* or love + *to*: both are right, with the same meaning.","pt":"love + *-ing* ou love + *to*: os dois estão certos, com o mesmo sentido."},null,null,null]},{"id":"a2-06","frame":"Health tips","framePt":"Dicas de saúde","title":"Sleep better tonight","titlePt":"Durma melhor hoje à noite","body":["[sleep:ing:subject] eight hours a night is good for your body and your mind. {Avoid} [drink:ing:enjoy] coffee after four in the afternoon. It's also {important} [turn off:to:adj] your phone an hour before bed. And {instead of} [watch:ing:prep] TV in bed, read a book!"],"pt":["Dormir oito horas por noite faz bem para o corpo e para a mente. Evite tomar café depois das quatro da tarde. Também é importante desligar o celular uma hora antes de deitar. E em vez de ver TV na cama, leia um livro!"],"w":{"mind":"mente","afternoon":"tarde","turn off":"desligar","before bed":"antes de deitar"},"cw":{"Avoid":"evite","important":"importante","instead of":"em vez de"}},{"id":"a2-07","frame":"Chat","framePt":"Chat","title":"Party on Saturday","titlePt":"Festa no sábado","body":["Leo: Hey Mia! Would you {like|would like} [come:to:would] to my birthday party on Saturday?","Mia: Yes, {thanks for} [invite:ing:prep] me! Do you {mind} [drive:ing:enjoy] me home after the party? My car is at the mechanic.","Leo: No problem, I {promise} [be:to:want] ready at midnight!"],"pt":["Leo: Oi, Mia! Você gostaria de vir na minha festa de aniversário no sábado?","Mia: Sim, obrigada por me convidar! Você se importa de me levar de carro para casa depois da festa? O meu carro está no mecânico.","Leo: tlePt":"Um bilhete na geladeira","body":["Hi Tom, {thanks for} [clean:ing:prep] the kitchen yesterday! I {finished|finish} [paint:ing:enjoy] my room this morning, so it smells a bit. I {want} [invite:to:want] some friends for dinner on Friday. Is that OK? {Instead of} [cook:ing:prep], let's order pizza. Sara"],"pt":["Oi, Tom, obrigada por limpar a cozinha ontem! Eu terminei de pintar o meu quarto hoje de manhã, então está com um pouco de cheiro. Eu quero convidar uns amigos para jantar na sexta. Tudo bem? Em vez de cozinhar, vamos pedir pizza. Sara"],"w":{"smells a bit":"está com um pouco de cheiro","order":"pedir"},"cw":{"thanks for":"obrigado por","finished":"terminei","want":"quero","Instead of":"em vez de"}},{"id":"a2-11","frame":"Blog","framePt":"Blog","title":"Why I study Korean","titlePt":"Por que eu estudo coreano","body":["[learn:ing:subject] a new language takes time. I {decided|decide} [study:to:want] Korean last year, after a trip to Seoul. I {practice} [speak:ing:enjoy] with my friend Min-ji every week. Some words are {hard} [remember:to:adj], but I write them on little cards."],"pt":["Aprender uma língua nova leva tempo. Eu decidi estudar coreano no ano passado, depois de uma viagem a Seul. Eu pratico falar com a minha amiga Min-ji toda semana. Algumas palavras são difíceis de lembrar, mas eu escrevo elas em cartõezinhos."],"w":{"takes time":"leva tempo","trip":"viagem","little cards":"cartõezinhos"},"cw":{"decided":"decidi","practice":"pratico","hard":"difícil"}},{"id":"a2-12","frame":"Ad","framePt":"Anúncio","title":"Join our running club!","titlePt":"Entre no nosso clube de corrida!","body":["Are you {good at} [run:ing:prep], or do you just want to start? Our club is {free} [join:to:adj], and everyone is welcome. We meet in Central Park on Sundays [train:to:purpose] together. If you {enjoy} [meet:ing:enjoy] new people, this club is for you!"],"pt":["Você é bom de corrida, ou só quer começar? O nosso clube é de graça para entrar, e todo mundo é bem-v riendly and always {ready} [help:to:adj]. Our room was {too} small [work:to:adj] in, though. I'd {suggest} [ask:ing:enjoy] for a room on a higher floor, because they're bigger and quieter. {Instead of} [eat:ing:prep] at the hotel restaurant, go to the market across the street. I'd {love|would love} [come:to:would] back next year!"],"pt":["Os funcionários eram muito simpáticos e sempre prontos para ajudar. O nosso quarto era pequeno demais para trabalhar, porém. Eu sugiro pedir um quarto num andar mais alto, porque eles são maiores e mais silenciosos. Em vez de comer no restaurante do hotel, vá ao mercado do outro lado da rua. Eu adoraria voltar no ano que vem!"],"w":{"staff":"funcionários","friendly":"simpáticos","higher floor":"andar mais alto","quieter":"mais silenciosos","across the street":"do outro lado da rua"},"cw":{"ready":"pronto, disposto","too":"pequeno demais","suggest":"sugeriria","Instead of":"em vez de","love":"would love = adoraria"},"notes":[null,{"en":"too + adjective + *to + verb*: too small to work in (pequeno demais para trabalhar).","pt":"too + adjetivo + *to + verbo*: too small to work in (pequeno demais para trabalhar)."},null,null,null]},{"id":"b1-11","frame":"Note","framePt":"Bilhete","title":"For the babysitter","titlePt":"Para a babá","body":["Hi Julia, {thanks for} [look after:ing:prep] Mia tonight! Please don't {let her} [watch:bare:make] TV after eight. She {needs} [go:to:want] to bed at nine. She {loves} [draw:ing/to:like], so there are pencils and paper on her desk. {Feel free} [eat:to:adj] anything in the fridge. Back by eleven! Carla"],"pt":["Oi, Julia, obrigada por cuidar da Mia hoje à noite! Por favor, não deixe ela ver TV depois das oito. Ela precisa ir para a cama às nove. Ela adora desenhar, então tem lápis e papel na escrivaninha dela. Fique à vontade para comer qualquer coisa da geladeira. Volto até as onze! Carla"],"w":{"pencils":"lápis","desk":"escrivaninha","fridge":"geladeira"},"cw":{"thanks for":"obrigado por","let her" rva de 3 de maio para 5 de maio, se possível. Vocês também poderiam me dizer como chegar ao hotel saindo do aeroporto? A minha filha mal pode esperar para ver a piscina! Obrigada pela ajuda. Aguardo o seu retorno."],"w":{"Dear Sir or Madam":"prezados","booking":"reserva","if possible":"se possível","airport":"aeroporto","pool":"piscina"},"cw":{"like":"would like = gostaria","how":"como","can't wait":"mal pode esperar","Thank you for":"obrigada por","look forward to":"aguardo, estou ansiosa para"}},{"id":"b1-21","frame":"Blog","framePt":"Blog","title":"Learning to drive at 40","titlePt":"Aprendendo a dirigir aos 40","body":["Last year I finally {decided|decide} [learn:to:want] to drive. I was nervous, but my instructor was patient and {let me|let someone} [practice:bare:make] in an empty parking lot first. At first I {wasn't used to|be used to} [look:ing:toprep] in three mirrors at the same time! [pass:ing:subject] the test on my first try was the best feeling ever. Now I {enjoy} [drive:ing:enjoy] to the beach on weekends."],"pt":["No ano passado eu finalmente decidi aprender a dirigir. Eu estava nervosa, mas o meu instrutor foi paciente e me deixou praticar primeiro num estacionamento vazio. No começo eu não estava acostumada a olhar em três espelhos ao mesmo tempo! Passar na prova logo na primeira tentativa foi a melhor sensação da minha vida. Agora eu adoro dirigir até a praia nos fins de semana."],"w":{"nervous":"nervosa","patient":"paciente","parking lot":"estacionamento","mirrors":"espelhos","on my first try":"na primeira tentativa"},"cw":{"decided":"decidi","let me":"me deixou","wasn't used to":"não estava acostumada a","enjoy":"gosto de, curto"}},{"id":"b1-22","frame":"Group chat","framePt":"Grupo de mensagens","title":"A surprise for Maya","titlePt":"Uma surpresa para a Maya","body":["Hi everyone! Saturday is Maya's 30th birthday, and I {want us all|want someone} [surprise:to:obj] her. Tom, can you {help me|help} [decorate:bare/to:help] the living room? Plea
