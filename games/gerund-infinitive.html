      "--x:" + Math.round(Math.random() * 80 - 40) + "px";
    host.appendChild(s);
  }
  setTimeout(function () { host.classList.add("in"); }, 60);   // a timer, not animation frames: a page opened in the background gets none until shown
})();

/* 10-game.js — the game. One game = a level's texts (levels.json "rounds" of them), one text per round, then the
   extra rounds its level has (normal games only; EXTRAS): bonus (11-bonus.js), Which meaning? (17-meaning.js), Right
   or wrong (12-judge.js), Proofreading (18-proof.js).
   Every text has 3–6 verb gaps ("spots"). An untouched gap is a grey bubble showing the verb's base form (cook), as in
   the comparatives game. The first tap picks "to cook"; every later tap moves one step round the cycle (04-forms.js). The player stops each gap on the right form and
   presses Check (a grey gap left = a reminder, no try spent).
   Scoring per spot: right on the first check = 2 points, right on a later check = 1, never = 0.
   A wrong check costs a try (levels.json "tries"). Levels with "feedback": "spots" mark the wrong spots and lock the
   right ones; "count" only says how many are wrong. After the last try the answers are shown.
   Hints ("Clues") light up the words that decide: a pool for the whole game (levels.json "hints"), one per text, and
   each unused hint is +1 bonus point at the end. */
const PTS_FIRST = 2, PTS_LATER = 1, ROLL_MS = 2000;   // ROLL_MS: the tutorial demo's pace
// Rules come from the level of the text being played (practice games can mix levels).
const lvl = () => DATA.levels[(G.r && G.r.level) || G.level] || {};
const levelOf = t => t.id.split("-")[0].toUpperCase();
const maxTries = () => lvl().tries || 2;
const hintPool = () => { const h = (DATA.levels[G.level] || {}).hints; return h == null ? 2 : h; };   // 0 = no Clues
const TEXTS = {};
Object.keys(DATA.texts).forEach(l => DATA.texts[l].forEach(t => { TEXTS[t.id] = t; }));
const G = { level: "A2", mode: "normal", pool: [], total: 3, idx: 0, score: 0, results: [], streak: 0, hintsLeft: 0, r: null, b: null, j: null, m: null, bonus: null, judge: null, meaning: null, s: false, xi: -1, favs: null, phase: "idle" };
const stage = $("stage"), card = $("card"), revealEl = $("reveal"), hintEl = $("hint"), toolsEl = $("tools"), quizEl = $("quiz");
const scoreEl = $("score"), scEl = $("sc"), bestEl = $("bestlbl"), hintBtn = $("hintbtn"), resetBtn = $("resetbtn"), checkBtn = $("checkbtn"), triesEl = $("tries");

/* ---------- Game flow ---------- */
// mode: "normal" | "speed" | "review" | "fav" (see 22-modes.js); ids = the texts for a review / favorites game.
function newGame(level, mode = "normal", ids) {
  G.level = level; G.mode = mode; applyUi();
  document.body.classList.toggle("practice-mode", mode !== "normal");   // quick-fire / review / favorites: Back returns to a normal game (22-modes.js)
  G.pool = ids ? shuffle(ids.map(id => TEXTS[id]).filter(Boolean)) : orderPool(DATA.texts[level], DATA.levels[level].rounds || 3);
  G.total = mode === "speed" ? Infinity : Math.min(DATA.levels[level].rounds || 3, G.pool.length);
  Object.assign(G, { newPockets: [], idx: 0, score: 0, results: [], streak: 0, hintsLeft: hintPool(), r: null, b: null, j: null, m: null, bonus: null, judge: null, meaning: null, s: false, xi: -1 });
  G.favs = mode === "fav" ? favParts(ids || []) : null;   // a Favorites game: its sentences, bonus and Right-or-wrong ids
  stopSpeed(); stopSpeech(); quizEl.hidden = true; revealEl.hidden = true; stage.hidden = toolsEl.hidden = false;
  toolsEl.classList.remove("bonus"); card.classList.remove("bonuscard", "judgecard", "meancard", "proofcard");
  showScore(); showCombo();
  if (mode === "speed") return speedIntro();   // goal card and 3-2-1 first; it starts the clock
  (G.total ? startRound : afterRound() || startRound)();   // a Favorites game may have no texts
}
function startRound() {
  const t = G.pool[G.idx % G.pool.length], P = parsed(t);
  G.r = { t, P, level: levelOf(t), st: P.spots.map(() => -1), lock: P.spots.map(() => false), first: null, tries: 0, hinted: false };
  G.b = G.j = G.m = null; G.phase = "play";
  revealEl.hidden = true; revealEl.innerHTML = "";
  toolsEl.classList.remove("bonus"); toolsEl.hidden = false;
  hideGloss(); renderCard(); renderTools(); updateProgress();
  hintEl.innerHTML = tx(G.idx === 0 ? "intro" : "introShort", { cycle: cycleHTML(G.r.level) });
  stage.classList.remove("out"); if (!reduceMotion) flash(stage, "rise");
}
// The extra rounds after the texts, in this order, each only where it's due: favorite sentences (Favorites games),
// bonus, Which meaning?, Right or wrong, Proofreading. G.xi = the one being played (-1 = still texts).
const EXTRAS = () => [[startSents, sentDue], [startBonus, bonusDue], [startMeaning, meaningDue], [startJudge, judgeDue], [startProof, proofDue]];
// What comes after a finished round: the next text, then the next extra round due, then the end screen (null).
function afterRound() {
  if (G.xi < 0 && G.idx + 1 < G.total) return startRound;
  const x = EXTRAS().find((e, k) => k > G.xi && e[1]());
  return x ? x[0] : null;
}
function nextRound() {
  if (G.phase !== "done") return;
  G.phase = "idle"; stopSpeech();
  const next = afterRound();
  if (G.xi < 0) G.idx++;
  if (!next) { updateProgress(); showEnd(); return; }
  stage.classList.add("out"); revealEl.classList.add("out");
  setTimeout(() => {
    revealEl.classList.remove("out");
    next();
    scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
  }, reduceMotion ? 0 : 260);
}
// The label of the button that leaves a finished round.
function nextLabel() {
  const n = afterRound(), L = [[startRound, "next"], [startSents, "toSents"], [startBonus, "toBonus"], [startMeaning, "toMeaning"], [startJudge, "toJudge"], [startProof, "toProof"]];
  return (L.find(x => x[0] === n) || [0, "results"])[1];
}

// "to cook → cooking (→ cook)": the level's cycle, for the instructions.
const cycleHTML = level => formsOf("cook", nForms(level), false).map(f => "<b>" + f + "</b>").join(" → ");

/* ---------- Rendering ---------- */
// The text card: a tag (the text's frame: Email, Blog…), the title, then one block per paragraph.
function renderCard() {
  const r = G.r, t = r.t, P = r.P;
  card.className = "card";
  card.innerHTML = '<span class="tag">' + esc(frameName(t)) + '</span><button type="button" class="cardsay" hidden aria-label="' + esc(tx("listenText")) + '" title="' + esc(tx("listenText")) + '">' + ICON_SPK + '</button><h2 class="ttl">' + esc(t.title) + "</h2>" +
    '<div class="lines">' + P.lines.map((L, li) => { const g = (t.tags || [])[li];   // a paragraph's tag: "headline"
      return '<div class="ln' + (g ? " tagged tag-" + g : "") + '" data-l="' + li + '"><p class="say">' + (g ? '<span class="ln-tag">' + esc(tx("tag_" + g)) + "</span>" : "") + lineHTML(t, P, li) + "</p></div>"; }).join("") + "</div>";
  r.spotEls = [...card.querySelectorAll(".art")];
  r.capEls = P.spots.map((sp, i) => card.querySelector('.cw[data-i="' + i + '"]'));
}
// The card's tag: the text's "frame" ("framePt" at native-UI levels).
function frameName(t) { return (nativeUi() && t.framePt) || t.frame || "Text"; }
// One dot per step of the cycle.
const dots = sp => '<span class="dots" aria-hidden="true">' + "<i></i>".repeat(sp.forms.length) + "</span>";
// The word, stacked over invisible copies of every choice: a bubble is as wide as its longest choice from the start,
// so tapping never moves the text around it.
function spotWord(sp) {
  return '<span class="awrap"><span class="aw">' + esc(sp.base) + "</span>" + sp.forms.map(f => '<span class="sz" aria-hidden="true">' + esc(f) + "</span>").join("") + "</span>";
}
// A soap bubble's own film angle and turn (SOAP: 23-shine.js), so the bubbles don't turn in step.
const soapVars = () => 'style="--ang:' + Math.round(rnd(0, 360)) + "deg;--dl:" + (-rnd(0, 10)).toFixed(2) + 's"';
function spotHTML(sp, i) {
  return '<button type="button" class="art" data-i="' + i + '" aria-label="' + esc(tx("gap")) + " " + (i + 1) + '" ' + soapVars() + ">" + SOAP + spotWord(sp) + dots(sp) + "</button>";
}
// After a gap that starts a sentence, the next word sits in .cw: it takes the capital when that gap is Ø.
function lineHTML(t, P, li) {
  const cw = (html, p) => p >= 0 && P.spots[p].cap ? html.replace(/^(\s*)((?:<[^>]+>)*[^\s<]+(?:<\/[^>]+>)*)/, '$1<span class="cw" data-i="' + p + '">$2</span>') : html;
  return walk(P, li, 0, Infinity, {
    t: (s, p) => cw(glossWrap(s, t), p),
    clue: (c, s, p) => cw('<span class="clue" data-c="' + c + '">' + clueGloss(s, t) + "</span>", p),
    spot: i => spotHTML(P.spots[i], i)
  });
}
// Show spot i in state st: one of its forms (st 0–2), or, untouched (st < 0), the base form in grey.
// The dot under it shows where in the cycle it is.
function paintSpot(el, sp, st) {
  el.querySelector(".aw").textContent = st < 0 ? sp.base : sp.forms[st];
  el.classList.toggle("set", st >= 0);
  FORMS.forEach(c => el.classList.toggle("cls-" + c, st >= 0 && clsOf(st) === c));
  [].forEach.call(el.querySelectorAll(".dots i"), (d, n) => d.classList.toggle("on", st >= 0 && n === st));
  if (el.dataset.i) el.setAttribute("aria-label", tx("gap") + " " + (+el.dataset.i + 1) + ": " + (st >= 0 ? choiceName(sp, st) : "?"));
}
// The word after a sentence-initial gap takes its capital while that gap is Ø.
function capWord(i, st) { const c = G.r && G.r.capEls[i]; if (c) c.classList.toggle("up", st === ZERO); }
function renderTools() {
  const r = G.r, play = G.phase === "play";
  triesEl.innerHTML = Array.from({ length: maxTries() }, (_, i) => '<i class="' + (r && i < r.tries ? "used" : "") + '"></i>').join("");
  triesEl.title = (maxTries() - (r ? r.tries : 0)) + " tries left";
  hintBtn.style.display = hintPool() ? "" : "none";   // levels with "hints": 0 (B2) have no Clues
  hintBtn.disabled = !play || !G.hintsLeft || !r || r.hinted || !r.P.clues.length;
  resetBtn.disabled = !play || !r || !r.st.some((s, i) => !r.lock[i] && s !== startSt(r, i));
  checkBtn.disabled = !play;
  checkBtn.classList.toggle("pulse", play && !!r && r.st.every(s => s >= 0));
  $("hintleft").textContent = tx("left", { n: G.hintsLeft });
}
function updateProgress() {
  showDays();
  if (G.mode === "speed") return speedRender();
  if (G.j) { $("proglbl").textContent = tx("judgeOf", { n: Math.min(G.j.k + 1, G.j.items.length), total: G.j.items.length }); $("pfill").style.width = "100%"; return; }
  if (G.b) { $("proglbl").textContent = tx("bonusOf"); $("pfill").style.width = "100%"; return; }
  if (G.m) { $("proglbl").textContent = tx("meaningOf", { n: Math.min(G.m.k + 1, G.m.items.length), total: G.m.items.length }); $("pfill").style.width = "100%"; return; }
  if (G.xi === 4) { $("proglbl").textContent = tx("proofTag"); $("pfill").style.width = "100%"; return; }
  if (G.xi === 0) { $("proglbl").textContent = tx("sentOf", { n: G.spIdx, total: G.sp.length }); $("pfill").style.width = (G.spIdx / G.sp.length * 100) + "%"; return; }
  const n = Math.min(G.idx + 1, G.total), done = G.idx + (G.phase === "done" ? 1 : 0);
  $("proglbl").textContent = tx({ review: "reviewOf", fav: "favOf" }[G.mode] || "textOf", { n, total: G.total });
  $("pfill").style.width = (Math.min(done, G.total) / G.total * 100) + "%";
}
// Best scores are kept for normal games and quick-fire; practice games don't save one ("" = none).
const BEST = { normal: "ger-best-", speed: "ger-speed-" };
function bestKey() { return BEST[G.mode] ? BEST[G.mode] + G.level : ""; }
function showScore() {
  scEl.textContent = G.score;
  bestEl.textContent = bestKey() ? "best " + (parseInt(load(bestKey()), 10) || 0) : "practice";
}
// "×3" on the score tile while perfect texts keep coming.
function showCombo() { const c = $("combo"); c.hidden = G.streak < 2; c.textContent = "×" + G.streak; if (G.streak >= 2) flash(c, "tick"); }

/* ---------- Playing ---------- */
// A tap: the first one picks "to …"; then one step round the cycle (dir -1 = back: Shift +
// tap, right click, Shift + number key).
function cycleSpot(i, dir = 1) {
  const r = G.r; if (G.phase !== "play" || !r.spotEls[i] || r.lock[i]) return;
  const n = r.P.spots[i].forms.length, s = r.st[i], st = r.st[i] = s < 0 ? (dir > 0 ? 0 : n - 1) : (s + dir + n) % n, el = r.spotEls[i];
  paintSpot(el, r.P.spots[i], st); capWord(i, st);
  el.classList.remove("err", "nudge");
  if (!reduceMotion) flash(el, "pop");
  tone(CYCLE_TONES[st], 0, .12, .07, 0, true);
  renderTools();
}
// A spot's state before any tap: grey (-1), or in a proofreading text what the text says.
const startSt = (r, i) => r.start ? r.start[i] : -1;
function resetAll() {
  const r = G.r; if (G.phase !== "play") return;
  r.st = r.st.map((s, i) => r.lock[i] ? s : startSt(r, i));
  r.spotEls.forEach((el, i) => { if (!r.lock[i]) { el.classList.remove("err"); paintSpot(el, r.P.spots[i], r.st[i]); capWord(i, r.st[i]); } });
  sndBack(); renderTools();
}
function check() {
  const r = G.r; if (G.phase !== "play") return;
  // A grey (untouched) bubble: a reminder, no try spent.
  const grey = r.st.map((s, i) => s < 0 ? i : -1).filter(i => i >= 0);
  if (grey.length) { grey.forEach(i => flash(r.spotEls[i], "nudge")); sndBack(); hintEl.innerHTML = tx("greyLeft"); return; }
  const wrong = r.P.spots.map((sp, i) => !isRight(sp, r.st[i]) ? i : -1).filter(i => i >= 0);
  r.tries++;
  if (!r.first) { r.first = r.P.spots.map((sp, i) => isRight(sp, r.st[i])); r.firstSt = r.st.slice(); }
  if (!wrong.length) return finish(true);
  G.streak = 0; showCombo(); sndBad(); flash(card, "shake");
  if (r.tries >= maxTries()) {
    G.phase = "checking"; renderTools(); hintEl.innerHTML = tx("outOfTries");
    setTimeout(() => { if (G.r === r) finish(false); }, reduceMotion ? 0 : 700);
    return;
  }
  const marks = lvl().feedback === "spots", left = maxTries() - r.tries;
  let msg = tx(wrong.length === 1 ? "wrong1" : "wrongN", { n: wrong.length });
  if (marks) {
    r.wrong = wrong;   // Clues after this check light only these gaps' clues (useHint)
    // Wrong spots go red; right ones lock green. A hint says what kind of mistake the first wrong one is.
    r.P.spots.forEach((sp, i) => {
      if (wrong.includes(i)) { r.spotEls[i].classList.add("err"); return; }
      r.lock[i] = true; r.spotEls[i].classList.add("lock"); r.spotEls[i].tabIndex = -1;
    });
    const w = r.P.spots[wrong[0]];
    msg += " " + tx(wrong.length === 1 ? "wrongMarked" : "wrongMarkedN") + " " + tx("askCls");
  }
  hintEl.innerHTML = msg + " " + tx(left === 1 ? "tryLeft" : "triesLeft", { n: left });
  renderTools();
}
// End of a text: every spot shows its right word (green, or red when the choice was wrong), the score, then the explanations.
function finish(allRight) {
  const r = G.r, P = r.P, t = r.t;
  const ok = P.spots.map((sp, i) => isRight(sp, r.st[i]));
  // The spots that count: all of them, or in a proofreading text only its mistakes. Explained (keep): those, and any
  // spot that wasn't right on the first check.
  const cnt = P.spots.map(sp => !r.proof || sp.shown !== sp.ans), keep = cnt.map((c, i) => c || !r.first[i]);
  const n = cnt.filter(Boolean).length, k = ok.filter((o, i) => o && cnt[i]).length;
  const pts = P.spots.reduce((s, sp, i) => s + (!cnt[i] ? 0 : r.first[i] ? PTS_FIRST : ok[i] ? PTS_LATER : 0), 0);
  const perfect = allRight && r.tries === 1;
  // Portuguese traps: the spots whose rule Portuguese says another way, and how many were right on the first check.
  const traps = P.spots.map((sp, i) => cnt[i] && isTrap(sp.rule) ? i : -1).filter(i => i >= 0);
  Object.assign(r, { ok, pts, perfect, cnt, keep });
  G.phase = "done"; G.score += pts; G.streak = perfect ? G.streak + 1 : 0;
  const cs = card.querySelector(".cardsay"); if (cs) cs.hidden = false;   // the text can be heard only once it's checked
  P.spots.forEach((sp, i) => {
    const el = r.spotEls[i];
    const show = ok[i] ? r.st[i] : sp.ans;   // a right choice stays (the / a book), a wrong one becomes the answer
    paintSpot(el, sp, show); capWord(i, show);
    el.classList.remove("err", "lock"); el.classList.add(ok[i] ? "ok" : "bad");
    if (keep[i]) el.insertAdjacentHTML("beforeend", '<sup class="sn">' + (i + 1) + "</sup>");
    // The bubble keeps its size: the number floats on its corner, and a wrong choice is only in the tooltip and the explanation.
    el.title = (ok[i] ? "✓ " + formOf(sp, show) : "✗ " + sp.forms[r.st[i]] + " → " + formOf(sp));
  });
  card.classList.add("done");
  showScore(); showCombo(); if (pts) flash(scoreEl, "up");
  if (allRight) { sndOk(G.streak > 1 ? Math.min(G.streak - 1, 6) * 2 : 0); burst(card); }
  const msg = perfect ? (G.streak >= 3 ? tx("streak", { n: G.streak }) : tx("perfect")) : tx(allRight ? "nice" : k ? "gotIt" : "done");
  toast("+" + pts + " · " + msg, allRight ? "" : "zero");
  const status = perfect ? 2 : allRight ? 1 : 0;
  if (!r.proof) markSeen(t.id, status);
  pocketAdd(P.spots.filter((sp, i) => cnt[i] && r.first[i]), P);
  recordProgress(t.id, status); recordUses(P.spots.filter((sp, i) => cnt[i]).map(sp => sp.rule), r.first.filter((f, i) => cnt[i])); tickDay();
  G.results.push({ t, pts, max: n * PTS_FIRST, perfect, allRight, k, n, ok, cnt, proof: !!r.proof, first: r.first.slice(), firstSt: r.firstSt.slice(), st: r.st.slice(), hinted: r.hinted,
    traps: [traps.length, traps.filter(i => r.first[i]).length] });
  renderTools(); updateProgress();
  toolsEl.hidden = true;   // tries, Clues, Reset and Check are done with once the text is checked
  hintEl.innerHTML = tx("doneNote");
  setTimeout(() => { if (G.r === r) showReveal(); }, reduceMotion ? 0 : 450);
}

/* ---------- Hint & reset ---------- */
// Clues: light up the words that decide (one hint per text, from the game's pool).
function useHint() {
  const r = G.r; if (G.phase !== "play" || !G.hintsLeft || r.hinted) return;
  r.hinted = true; G.hintsLeft--; sndHint();
  // After a check that marked mistakes (A2), only the red gaps' clues (from the a / an / the game); else all of them.
  const only = r.wrong ? [...new Set(r.wrong.flatMap(i => r.P.spots[i].clues))] : [];
  if (only.length) only.forEach(c => { const el = card.querySelector('.clue[data-c="' + c + '"]'); if (el) el.classList.add("lit"); });
  else card.classList.add("clues");
  hintEl.innerHTML = tx(only.length ? "cluesWrong" : "cluesOn") + " " + (G.hintsLeft ? tx("hintsLeftGame", { n: G.hintsLeft }) : tx("hintLast"));
  renderTools(); flash($("hintleft"), "tick");
}
hintBtn.addEventListener("click", useHint);
resetBtn.addEventListener("click", () => G.b ? bonusClear() : resetAll());
checkBtn.addEventListener("click", check);

/* ---------- Taps and keys ---------- */
// In play a tap moves a spot round its cycle (Shift + tap or right click: back); once the text is done a tap jumps
// to its explanation.
card.addEventListener("click", e => {
  if (G.j || G.b || G.m) return;   // the bonus, Right-or-wrong and Which-meaning cards have their own handlers
  const say = e.target.closest(".cardsay");
  if (say) return say.classList.contains("speaking") ? stopSpeech() : G.phase === "done" ? speak(textParts(G.r.P), say) : null;
  const a = e.target.closest(".art"); if (!a) return;
  if (G.phase === "play") return cycleSpot(+a.dataset.i, e.shiftKey ? -1 : 1);
  if (G.phase === "done") jumpToEx(+a.dataset.i);
});
card.addEventListener("contextmenu", e => { const a = e.target.closest(".art"); if (a && G.phase === "play" && G.r) { e.preventDefault(); cycleSpot(+a.dataset.i, -1); } });
// Keys: 1–9 move the spots (Shift: back), Enter checks (or goes on once the explanations are open).
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || document.querySelector(".favmodal.show") || !$("tour").hidden) return;
  if (e.target.closest && e.target.closest("input, textarea, select")) return;
  const d = /^Digit([1-9])$/.exec(e.code);
  if (G.phase === "play" && G.r && d && G.r.spotEls[+d[1] - 1]) { e.preventDefault(); cycleSpot(+d[1] - 1, e.shiftKey ? -1 : 1); return; }
  if (e.key !== "Enter" || (e.target.closest && e.target.closest("button, a"))) return;
  if (G.phase === "play") { e.preventDefault(); check(); }
  else if (G.phase === "done" && !revealEl.hidden) { e.preventDefault(); nextRound(); }
});

/* 11-bonus.js — the bonus round at the end of a normal game: a Portuguese sentence, its English version with up to 5
   gaps, and word bubbles (the missing words + distractors, src/data/bonus/<LEVEL>.json) to drag or tap into the gaps.
   The distractors are mostly the forms Portuguese would make us use (for study, thanks for come, to cry after made me).
   When every gap is full it is checked: right on the first try = BONUS_FIRST points, on the second = BONUS_LATER.
   A wrong try locks the right words green and sends the others home; after BONUS_TRIES the sentence is shown.
   Moving words (FLIP animation, tap, drag & drop with a magnet) comes from the conditionals game (11-moves.js). */
const BONUS_TRIES = 2, BONUS_FIRST = 3, BONUS_LATER = 1;
const WORD_HUES = [205, 330, 265, 150, 25, 175];
// Normal games: levels.json "bonus": false turns the round off (B1 plays Right or wrong instead).
function bonusDue() { return G.mode === "fav" ? G.favs.B.length > 0 : G.mode === "normal" && lvl().bonus !== false && (DATA.bonus[G.level] || []).length > 0; }
function startBonus() {
  const s = (G.mode === "fav" ? orderPool(G.favs.B) : orderPool(DATA.bonus[G.level], 1))[0], parts = s.en.split(/\[([^\]]+)\]/);
  // parts alternate: text, gap word, text, gap word…
  const ans = parts.filter((_, k) => k % 2);
  G.r = G.j = G.m = null; G.xi = 1; G.phase = "bonus";
  G.b = { s, parts, ans, slots: ans.map(() => null), slotEls: [], words: [], tries: 0, ansBox: null };
  revealEl.hidden = true; revealEl.innerHTML = "";
  toolsEl.classList.add("bonus"); toolsEl.hidden = false;
  hideGloss(); renderBonus(); bonusTools(); updateProgress();
  hintEl.innerHTML = tx("bonusIntro");
  stage.classList.remove("out"); if (!reduceMotion) flash(stage, "rise");
  sndShuffle();
}
function renderBonus() {
  const b = G.b;

function bonusTools() {

/* ---------- Moving words (with FLIP animation) ---------- */
// Run mutate(), then animate every word from where it was to where it is now.
function flipAll(mutate) {
  const ws = G.b.words, before = ws.map(W => W.el.getBoundingClientRect());
  mutate();
  if (reduceMotion) return;
  ws.forEach((W, n) => {
    const a = before[n], c = W.el.getBoundingClientRect(), dx = a.left - c.left, dy = a.top - c.top;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
    W.el.animate([{ transform: "translate(" + dx + "px," + dy + "px)" }, { transform: "none" }], { duration: 420, easing: "cubic-bezier(.3,1.25,.55,1)" });
  });
}
function setSlot(i, W) {
  G.b.slots[i] = W;
  if (W) { W.slot = i; G.b.slotEls[i].appendChild(W.el); }
  G.b.slotEls[i].classList.toggle("filled", !!W);
}
function leaveHome(W) { W.home.style.width = W.el.offsetWidth + "px"; W.home.style.height = W.el.offsetHeight + "px"; W.home.classList.add("away"); }
function toHome(W) { W.slot = -1; W.home.appendChild(W.el); W.home.style.width = W.home.style.height = ""; W.home.classList.remove("away"); }
// Put word W into slot i (i < 0 = back home). An unlocked word already in slot i swaps places with W.
function moveRaw(W, i) {
  const b = G.b, from = W.slot;
  if (i < 0) { if (from >= 0) { setSlot(from, null); toHome(W); } return; }
  const occ = b.slots[i];
  if (occ === W || (occ && occ.locked)) return;
  if (from < 0) leaveHome(W); else setSlot(from, null);
  if (occ) { if (from >= 0) setSlot(from, occ); else toHome(occ); }
  setSlot(i, W);
}
function move(W, i) {
  if (W.locked) return;
  const wasHome = W.slot < 0;
  flipAll(() => moveRaw(W, i));
  if (i < 0) sndBack(); else sndPlace();
  if (wasHome || i >= 0) afterMove();
}
function tapWord(W) {
  if (G.phase !== "bonus" || W.locked) return;
  if (W.slot >= 0) move(W, -1);
  else { const i = G.b.slots.findIndex(x => !x); if (i >= 0) move(W, i); }
}
function afterMove() {
  bonusTools();
  if (G.phase === "bonus" && G.b.slots.every(Boolean)) { G.phase = "bchecking"; setTimeout(bonusCheck, reduceMotion ? 50 : 380); }
}
function bonusClear() {
  const b = G.b; if (G.phase !== "bonus" || !b.slots.some(W => W && !W.locked)) return;
  flipAll(() => b.slots.forEach((W, i) => { if (W && !W.locked) { setSlot(i, null); toHome(W); } }));
  sndBack(); bonusTools();
}

/* ---------- Checking ---------- */
function bonusCheck() {
  const b = G.b, got = b.slots.map(W => W.t.toLowerCase()), want = b.ans.map(t => t.toLowerCase());
  if (got.every((t, i) => t === want[i])) {
    b.slots.forEach(W => { W.el.classList.add("ok"); W.locked = true; });
    return bonusFinish(b.tries === 0 ? BONUS_FIRST : BONUS_LATER, true);
  }
  b.tries++; sndBad(); flash(b.ansBox, "shake"); G.streak = 0; showCombo();
  b.slots.forEach((W, i) => { if (got[i] === want[i]) { W.locked = true; W.el.classList.add("ok"); } else W.el.classList.add("bad"); });
  bonusTools();
  if (b.tries >= BONUS_TRIES) { hintEl.innerHTML = tx("bonusOut"); return setTimeout(bonusReveal, reduceMotion ? 0 : 700); }
  hintEl.innerHTML = tx("bonusWrong");
  setTimeout(() => {
    if (G.b !== b) return;
    flipAll(() => b.slots.forEach((W, i) => { if (!W.locked) { W.el.classList.remove("bad"); setSlot(i, null); toHome(W); } }));
    G.phase = "bonus"; bonusTools();
  }, reduceMotion ? 300 : 900);
}
// Out of tries: every gap gets its right word (amber), then the result.
function bonusReveal() {
  const b = G.b;
  flipAll(() => {
    b.slots.forEach((W, i) => { if (W && !W.locked) { W.el.classList.remove("bad"); setSlot(i, null); toHome(W); } });
    b.ans.forEach((t, i) => {
      if (b.slots[i]) return;
      const W = b.words.find(w => w.slot < 0 && w.t.toLowerCase() === t.toLowerCase());
      if (W) { leaveHome(W); setSlot(i, W); W.locked = true; W.el.classList.add("shown"); }
    });
  });
  bonusFinish(0, false);
}
function bonusFinish(pts, ok) {
  const b = G.b;
  G.phase = "done"; G.score += pts; G.bonus = { s: b.s, pts, ok, first: ok && b.tries === 0 };
  card.classList.add("done");
  b.words.forEach(W => { if (W.slot < 0) W.home.classList.add("gone"); });
  recordProgress(b.s.id, G.bonus.first ? 2 : ok ? 1 : 0);
  showScore(); toolsEl.hidden = true;
  if (ok) { sndOk(); burst(card); flash(scoreEl, "up"); }
  toast(ok ? tx(G.bonus.first ? "bonusPerfect" : "bonusGot", { n: pts }) : tx("bonusMissed"), ok ? "" : "zero");
  hintEl.innerHTML = "";
  setTimeout(() => { if (G.b === b) showBonusReveal(); }, reduceMotion ? 0 : 500);
}
// The result bar: the points, a speaker and See results. The finished sentence is read aloud at once.
function showBonusReveal() {
  const b = G.b, say = () => speak(b.s.en.replace(/[[\]]/g, ""), $("listen"));
  revealEl.innerHTML = '<div class="rv-bar"><div class="rv-head"><span class="rv-sc"><b class="rv-score">' + esc(tx("bonusTag")) + " +" + G.bonus.pts + "</b></span>" +
    '<span class="rv-tools"><button type="button" class="pbtn" id="listen">' + ICON_SPK + " " + tx("listen") + "</button></span></div>" +
    '<div class="rv-act">' + favBtn(b.s.id) + '<button type="button" class="cta pulse" id="next">' + tx(nextLabel()) + " &rarr;</button></div></div>";

/* ---------- Tap & drag ---------- */
let drag = null;
stage.addEventListener("pointerdown", e => {
  const el = e.target.closest(".w"); if (!el || !el.__w || G.phase !== "bonus" || el.__w.locked || e.button > 0) return;
  e.preventDefault();
  drag = { W: el.__w, x0: e.clientX, y0: e.clientY, on: false, hot: -1 };
  el.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", e => {
  if (!drag) return;
  const W = drag.W, el = W.el, b = G.b;
  if (!drag.on) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 7) return;
    const rc = el.getBoundingClientRect();
    drag.on = true; drag.ox = drag.x0 - rc.left; drag.oy = drag.y0 - rc.top;
    if (W.slot < 0) leaveHome(W); else b.slotEls[W.slot].classList.remove("filled");
    el.style.width = rc.width + "px"; el.classList.add("drag"); sqStart(el, e.clientX, e.clientY);
  }
  let x = e.clientX - drag.ox, y = e.clientY - drag.oy;
  drag.hot = slotAt(e.clientX, e.clientY);
  // Magnet: near a free slot the word is pulled part of the way into it.
  if (drag.hot >= 0) {
    const r = b.slotEls[drag.hot].getBoundingClientRect(), tx0 = r.left + r.width / 2 - el.offsetWidth / 2, ty0 = r.top + r.height / 2 - el.offsetHeight / 2;
    const f = Math.max(0, 1 - Math.hypot(tx0 - x, ty0 - y) / 110) * .55;
    x += (tx0 - x) * f; y += (ty0 - y) * f;
  }
  el.style.left = x + "px"; el.style.top = y + "px"; sqMove(x, y);   // squash and stretch: 24-squash.js
  b.slotEls.forEach((s, i) => s.classList.toggle("hot", i === drag.hot));
});
function endDrag(e) {
  if (!drag) return;
  const d = drag, W = d.W, b = G.b; drag = null;
  if (!d.on) { if (e.type === "pointerup") tapWord(W); return; }
  b.slotEls.forEach(s => s.classList.remove("hot"));
  const wasHome = W.slot < 0;
  flipAll(() => {
    sqEnd(W.el); W.el.classList.remove("drag"); W.el.style.left = W.el.style.top = W.el.style.width = "";
    if (W.slot >= 0) b.slotEls[W.slot].classList.add("filled");
    if (d.hot >= 0 && d.hot !== W.slot) moveRaw(W, d.hot);
    else if (d.hot < 0) { if (W.slot >= 0) moveRaw(W, -1); else toHome(W); }
  });
  if (d.hot >= 0) { sndPlace(); if (wasHome || d.hot !== W.slot) afterMove(); } else { sndBack(); bonusTools(); }
}
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
/* Safety nets for this drag (2026-11-22, from Question Bubbles: on computers, a MacBook among them, a dragged bubble
   could stay stuck on its target when the browser never reported the release, e.g. let go outside the window). A mouse
   move with no button held = the drop (a release is sent); a new mouse press or the window losing focus = back. */
(function () {
  function fire(type, e) { stage.dispatchEvent(new PointerEvent(type, { bubbles: true, clientX: e ? e.clientX : 0, clientY: e ? e.clientY : 0, pointerId: e ? e.pointerId : (drag.id || 1), pointerType: "mouse" })); }
  function back(e) { if (!drag) return; drag.hot = drag.W.slot; fire("pointercancel", e); }
  document.addEventListener("pointermove", function (e) { if (drag && e.pointerType === "mouse" && !e.buttons) fire("pointerup", e); }, true);
  document.addEventListener("pointerdown", function (e) { if (e.pointerType === "mouse") back(e); }, true);
  window.addEventListener("blur", function () { back(); });
})();
// Keyboard (Enter / Space on a focused word) arrives as a click with detail 0; pointer taps are handled above.
stage.addEventListener("click", e => { if (e.detail !== 0) return; const el = e.target.closest(".w"); if (el && el.__w) tapWord(el.__w); });
// Index of the free slot nearest the pointer when it is over the sentence, or -1.
function slotAt(x, y) {
  const b = G.b, box = b.ansBox.getBoundingClientRect(), m = 30;
  if (x < box.left - m || x > box.right + m || y < box.top - m || y > box.bottom + m) return -1;
  let best = -1, bd = Infinity;
  b.slotEls.forEach((s, i) => {
    if (b.slots[i] && b.slots[i].locked) return;
    const r = s.getBoundingClientRect(), dd = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2));
    if (dd < bd) { bd = dd; best = i; }
  });
  return best;
}

/* 12-judge.js — Right or wrong? At levels with "judge": n in levels.json (B1), after the texts: n sentences from
   src/data/judge/<LEVEL>.json, one at a time. The player says whether the marked verb form is right; then the mistake
   is corrected in place (struck out → right form) or the form is marked right, with why in English and Portuguese and
   a link to the rule in the Guide. JUDGE_PTS for each right answer.
   Markup in "en": [x>y] = the mistake x and its correction y ([see>seeing], [for study>to study]); [x] = in a right
   sentence, the form to mark. Before the answer every mark looks the same (underlined), so it gives nothing away.
   A sentence is wrong when it has an [x>y]. */
const JUDGE_PTS = 1;
const JMARK = /\[([^\]>]*)(?:>([^\]]*))?\]/g;
const SLOT = "_", GAP_HTML = "";
function judgeDue() { if (G.mode === "fav") return G.favs.J.length > 0; return G.mode === "normal" && (DATA.levels[G.level] || {}).judge > 0 && (DATA.judge[G.level] || []).length > 0; }
const judgeWrong = s => /\[[^\]]*>/.test(s.en);
// The text as plain words: before = the version to judge, else the corrected one.
function judgePlain(s, before) { return tidy(s.en.replace(JMARK, (m, x, y) => x === SLOT ? "" : before || y === undefined ? x : y)); }
// The text as HTML: before = the version to judge, the forms to judge underlined; after = the mistake struck out with
// its correction, or the right form marked.
function judgeHTML(s, after) {
  let out = "", last = 0, m;
  const plain = esc;
  JMARK.lastIndex = 0;
  while ((m = JMARK.exec(s.en))) {
    const x = m[1], y = m[2];
    out += plain(s.en.slice(last, m.index));
    if (x === SLOT) { if (!after) out += GAP_HTML; last = JMARK.lastIndex; continue; }
    if (!after) out += '<mark class="ja">' + esc(x) + "</mark>";
    else if (y === undefined) out += '<mark class="jk">' + esc(x) + "</mark>";
    else out += (x ? '<s class="jx">' + esc(x) + "</s> " : "") + '<b class="jy">' + esc(y) + "</b>";
    last = JMARK.lastIndex;
  }
  return tidy(out + plain(s.en.slice(last)));
}
function startJudge() {
  const n = DATA.levels[G.level].judge || 4;
  G.r = G.b = G.m = null; G.xi = 3; G.phase = "judge";
  G.j = { items: (G.mode === "fav" ? orderPool(G.favs.J) : orderPool(DATA.judge[G.level], n)).slice(0, n), k: 0, res: [] };
  revealEl.hidden = true; revealEl.innerHTML = ""; toolsEl.hidden = true;
  hideGloss(); renderJudge(); updateProgress();
  hintEl.innerHTML = tx("judgeIntro");
  stage.classList.remove("out"); if (!reduceMotion) flash(stage, "rise");
  sndShuffle();
}
function renderJudge() {
  const J = G.j, s = J.items[J.k];
  card.className = "card judgecard";
  card.innerHTML = '<span class="tag">★ ' + esc(tx("judgeTag")) + "</span>" +
    '<div class="jd-pips" aria-hidden="true">' + J.items.map((_, n) => '<i class="' + (n < J.k ? (J.res[n].ok ? "ok" : "bad") : n === J.k ? "on" : "") + '"></i>').join("") + "</div>" +
    '<p class="jd-s" lang="en">' + judgeHTML(s, false) + "</p>" +
    '<div class="jd-btns"><button type="button" class="jd-b yes" data-v="1"><kbd>1</kbd> ✓ ' + esc(tx("judgeRight")) + '</button>' +
    '<button type="button" class="jd-b no" data-v="0"><kbd>2</kbd> ✗ ' + esc(tx("judgeWrong")) + "</button></div>" +
    '<div class="jd-fb" hidden></div>';
  if (J.k) hintEl.innerHTML = tx("judgeAsk");
}
// The player's answer: v = true for "Right".
function judgeAnswer(v) {
  const J = G.j; if (G.phase !== "judge") return;
  const s = J.items[J.k], wrong = judgeWrong(s), ok = v === !wrong, last = J.k === J.items.length - 1, pt = nativeUi();
  J.res.push({ s, ok, pick: v });
  G.phase = last ? "done" : "jwait";
  if (ok) { G.score += JUDGE_PTS; G.streak++; sndOk(Math.min(G.streak - 1, 6) * 2); flash(scoreEl, "up"); toast(tx("judgeYes"), ""); }
  else { G.streak = 0; sndBad(); flash(card, "shake"); toast(tx("judgeNo"), "zero"); }
  showScore(); showCombo();
  recordProgress(s.id, ok ? 2 : 0); recordUses([s.rule], [ok]);
  card.querySelectorAll(".jd-b").forEach(b => {
    b.disabled = true;
    if ((b.dataset.v === "1") === !wrong) b.classList.add("ok"); else if ((b.dataset.v === "1") === v) b.classList.add("bad");
  });
  const pip = card.querySelector(".jd-pips .on"); if (pip) { pip.classList.remove("on"); pip.classList.add(ok ? "ok" : "bad"); }
  card.querySelector(".jd-s").innerHTML = judgeHTML(s, true);
  // Only now the speaker: it reads the corrected sentence (before the answer it would give the mistake away).
  card.insertAdjacentHTML("afterbegin", '<button type="button" class="cardsay" aria-label="' + esc(tx("listen")) + '" title="' + esc(tx("listen")) + '">' + ICON_SPK + "</button>");
  const R = DATA.rules.rules[s.rule] || {}, two = (en, p) => pt ? '<p lang="pt">' + artTxt(p) + '</p><p class="jd-2">' + artTxt(en) + "</p>" : "<p>" + artTxt(en) + '</p><p class="jd-2" lang="pt">' + artTxt(p) + "</p>";
  const fb = card.querySelector(".jd-fb");
  fb.innerHTML = '<div class="jd-head"><b class="' + (ok ? "ok" : "bad") + '">' + (ok ? "✓ " : "✗ ") + esc(tx(wrong ? "judgeWasWrong" : "judgeWasRight")) + "</b>" +
    (R.name ? '<button type="button" class="ex-use" data-rule="' + esc(s.rule) + '" style="--h:' + R.hue + '">' + esc(ruleName(s.rule, pt)) + "</button>" : "") + favBtn(s.id) + "</div>" +
    '<div class="jd-why">' + two(s.why, s.whyPt) + "</div>" +
    '<p class="jd-pt">' + ptBadge() + ' <span lang="pt">' + esc(s.pt) + "</span></p>" +
    (last ? "" : '<div class="jd-next"><button type="button" class="cta pulse" id="jnext">' + esc(tx("next")) + " &rarr;</button></div>");
  fb.hidden = false;
  if (!reduceMotion) flash(fb, "in");
  hintEl.innerHTML = "";
  if (last) { G.judge = { res: J.res, pts: J.res.filter(x => x.ok).length * JUDGE_PTS }; setTimeout(() => { if (G.j === J) showJudgeReveal(); }, reduceMotion ? 0 : 400); }
  else setTimeout(() => { const b = $("jnext"); if (b) b.focus({ preventScroll: true }); }, 50);
}
function judgeNext() {
  const J = G.j; if (G.phase !== "jwait") return;
  J.k++; G.phase = "judge"; stopSpeech();
  renderJudge(); updateProgress();
  if (!reduceMotion) flash(stage, "rise");
}
// After the last sentence: the round's score and See results.
function showJudgeReveal() {
  const k = G.judge.res.filter(x => x.ok).length, n = G.judge.res.length;
  revealEl.innerHTML = '<div class="rv-bar"><div class="rv-head"><b class="rv-score">' + esc(tx("judgeScore", { k, n })) + " · +" + G.judge.pts + "</b></div>" +
    '<div class="rv-act"><button type="button" class="cta pulse" id="next">' + tx(nextLabel()) + " &rarr;</button></div></div>";
  revealEl.hidden = false;
  $("next").addEventListener("click", nextRound);
  $("next").focus({ preventScroll: true });
}
card.addEventListener("click", e => {
  if (!G.j) return;
  const say = e.target.closest(".cardsay"), b = e.target.closest(".jd-b"), use = e.target.closest(".ex-use");
  const s = G.j.items[G.j.k];
  if (say) return say.classList.contains("speaking") ? stopSpeech() : speak(judgePlain(s, false), say);
  if (b) return judgeAnswer(b.dataset.v === "1");
  if (use) return openGuide(use.dataset.rule, use);

// Keys: 1 / R = right, 2 / W = wrong, Enter = next sentence.
document.addEventListener("keydown", e => {
  if (!G.j || e.ctrlKey || e.metaKey || e.altKey || document.querySelector(".favmodal.show") || !$("tour").hidden) return;
  const k = e.key.toLowerCase();
  if (G.phase === "judge" && (k === "1" || k === "r")) { e.preventDefault(); judgeAnswer(true); }
  else if (G.phase === "judge" && (k === "2" || k === "w")) { e.preventDefault(); judgeAnswer(false); }
  else if (G.phase === "jwait" && e.key === "Enter" && !(e.target.closest && e.target.closest("button:not(#jnext)"))) { e.preventDefault(); judgeNext(); }
});

/* 13-reveal.js — the card shown after each text: score, Translation and Listen buttons, then one collapsible explanation
   per gap (number, right / wrong, the form's class, its rule, the sentence with the words that decide marked, what
   was wrong with the player's choice (or first choice, when fixed later), the rule in English and Portuguese, the
   Portuguese trap (what Portuguese says, the word-for-word mistake, the English), and the text's own note). Wrong ones open by default. Explanations are built from rules.json, so texts need no per-gap
   writing (only an optional "notes" entry).
   Hovering an explanation lights up its gap and clues in the text; tapping a gap in the text jumps to it.
   Also the little celebrations (score toast, particle burst). */
const ICON_SPK = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
function showReveal() {
  const r = G.r, t = r.t, P = r.P, n = r.cnt.filter(Boolean).length, k = r.ok.filter((o, i) => o && r.cnt[i]).length;
  revealEl.innerHTML =
    // Top bar: score, Translation and Listen on the left; the favorite star and Next on the right.
    '<div class="rv-bar"><div class="rv-head"><span class="rv-sc"><b class="rv-score">' + tx(r.proof ? "proofFixed" : "correctOf", { k, n }) + "</b>" +
    (r.perfect ? '<span class="chip" style="--h:150">' + tx("perfect") + "</span>" : "") + "</span>" +
    '<span class="rv-tools"><button type="button" class="pbtn" id="trbtn" aria-pressed="false">' + ptBadge() + " " + tx("translation") + "</button>" +
    '<button type="button" class="pbtn" id="listen">' + ICON_SPK + " " + tx("listen") + "</button></span></div>" +
    '<div class="rv-act">' + favBtn(t.id) + '<button type="button" class="cta pulse" id="next">' + tx(nextLabel()) + " &rarr;</button></div></div>" +
    '<ol class="exl">' + P.spots.map((sp, i) => r.keep[i] ? exHTML(r, sp, i) : "").join("") + "</ol>";
  revealEl.hidden = false;
  $("listen").addEventListener("click", () => speak(textParts(P), $("listen")));
  $("trbtn").addEventListener("click", toggleTranslation);
  $("next").addEventListener("click", nextRound);

// The right form in a sentence, in bold in its colour (st: the player's right choice, when the gap takes two).

function burst(el) {

/* 14-guide.js — the Guide: the "-ing is not always continuous" note, an "Ask yourself" checklist (rules.json "ask":
   questions in order, each with the form it leads to), the player's pockets (19-pockets.js), then every rule grouped
   (rules.json "groups": + -ing, + to, the verb alone, both work, the meaning changes; a rule's "group", else its
   "form"), with examples and its Portuguese trap, then the classic Portuguese → English mistakes up to the chosen level (rules.json "mistakes", each with its "lv"),
   then a folded "For the curious" (rules.json "curious": nuances the game doesn't practise).

const guideModal = $("guidemodal"), guideLang = $("guidelang");
const GROUPS = ["ing", "to", "bare", "both", "change", "perf"];
function guideInPt() { const s = load("ger-guide-lang"); return s ? s === "pt" : nativeUi(); }

// The classic traps up to the chosen level (easiest first), each with its level chip (from Conditional Bubbles).

// Fill the Guide in its current language (keeping the scroll position and open cards when only the language changes).

/* 15-progress.js — what the player has done, across games, and the daily streak.
   ger-prog = {id: [attempts, lastStatus, time]} (texts and bonus sentences): status 2 = perfect on the first check
   ("mastered"), 1 = all right on a later check, 0 = some answers still wrong.
   ger-uses = {rule: [answers, right]}: first-check accuracy for each rule (rules.json "rules"), from games and quick-fire.
   ger-days = "YYYY-MM-DD|days in a row". */
function getJSON(k) { try { const o = JSON.parse(load(k)); return o && typeof o === "object" ? o : {}; } catch (e) { return {}; } }
function getProg() { return getJSON("ger-prog"); }
function recordProgress(id, status) {
  const p = getProg(), o = p[id] || [0, 0, 0];
  p[id] = [o[0] + 1, status, Date.now()]; store("ger-prog", JSON.stringify(p));
}
// A level's texts (or bonus sentences) in play order: never seen (random), then wrong last time, then not yet perfect, then mastered (oldest first).
// What the last RECENT_GAMES games played (perGame items a game) waits at the back, so a text missed in one game
// doesn't come straight back in the next one (from Conditional Bubbles); it still comes before nothing else is left.
const RECENT_GAMES = 3;
function orderPool(list, perGame) {
  const p = getProg(), time = t => (p[t.id] || [0, 0, 0])[2];
  const n = Math.max(0, Math.min(RECENT_GAMES * (perGame || 0), list.length - (perGame || 0)));
  const recent = new Set(list.filter(t => time(t)).sort((a, b) => time(b) - time(a)).slice(0, n).map(t => t.id));
  const grp = t => { const o = p[t.id]; return (recent.has(t.id) ? 4 : 0) + (!o ? 0 : o[1] === 0 ? 1 : o[1] === 1 ? 2 : 3); };
  return shuffle(list.slice()).sort((a, b) => grp(a) - grp(b) || time(a) - time(b));
}
// Mastered / total texts at a level.
function mastery(level) {
  const p = getProg(), list = DATA.texts[level];
  return { m: list.filter(t => p[t.id] && p[t.id][1] === 2).length, n: list.length };
}
// One level's meter: label, bar, "3 / 5".
function meterHTML(level) {
  const x = mastery(level);
  return '<div class="meter" style="' + lvVars(level) + '"><b>' + esc(lvName(level)) + '</b><div class="pbar"><i style="width:' + (x.m / x.n * 100).toFixed(1) + '%"></i></div><span>' + x.m + " / " + x.n + "</span></div>";
}

/* ---------- Accuracy per rule ---------- */
// rules = each spot's rule (rules.json key), ok = right on the first check.
function recordUses(rules, ok) {
  const s = getJSON("ger-uses");
  rules.forEach((u, i) => { const o = s[u] || [0, 0]; s[u] = [o[0] + 1, o[1] + (ok[i] ? 1 : 0)]; });
  store("ger-uses", JSON.stringify(s));
}
// Chips "Jobs: what someone is 7/8", one per rule in stats {rule: [n, right]}, weakest first; weak = only the WEAK_MAX
// weakest under WEAK_PCT. Tap one to open the Guide there.
const WEAK_MAX = 3, WEAK_PCT = .8;
function usesHTML(stats, weak) {
  let ks = Object.keys(DATA.rules.rules).filter(k => stats[k] && stats[k][0]);
  ks.sort((a, b) => stats[a][1] / stats[a][0] - stats[b][1] / stats[b][0]);

/* ---------- Daily streak ---------- */
function dayStr(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dayState() {
  const [d, n] = (load("ger-days") || "|0").split("|"), y = new Date(); y.setDate(y.getDate() - 1);
  return { d, n: +n || 0, today: dayStr(new Date()), yest: dayStr(y) };
}
// Days in a row, counting today or yesterday (the streak is still alive until a day is skipped).
function getDays() { const s = dayState(); return s.d === s.today || s.d === s.yest ? s.n : 0; }
// Called when a text is finished: the first one of the day extends (or restarts) the streak.
function tickDay() {
  const s = dayState(); if (s.d === s.today) return;
  store("ger-days", s.today + "|" + (s.d === s.yest ? s.n + 1 : 1)); showDays();
}
function showDays() { const n = getDays(), el = $("days"); el.hidden = n < 2; el.textContent = "🔥 " + n; el.title = n + " days in a row"; }

/* 16-gloss.js — words with a dotted line in the text show their Portuguese meaning on hover or tap. Meanings come from
   the text's own "w" (src/data/texts/*.json); keys can be several words ("of course") and match in any case.
   A clue (the words that decide) has its meaning in "cw", which only applies inside that clue (so "in" or "how"
   elsewhere in the text gets no dotted line).
   The verb gaps have none (a tap moves them round the cycle). */
const glossEl = document.createElement("div");
glossEl.className = "glosstip"; glossEl.setAttribute("role", "tooltip"); glossEl.hidden = true;
document.body.appendChild(glossEl);
let glossFor = null, glossTimer = 0, lastPointer = "mouse";

// One regex per text for its glossary keys, longest first.
function glossRe(t) {
  if (t._gre !== undefined) return t._gre;
  const ks = Object.keys(t.w || {}).sort((a, b) => b.length - a.length).map(k => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  return (t._gre = ks.length ? new RegExp("\\b(" + ks.join("|") + ")\\b", "gi") : null);
}
// Text s as HTML, its glossary words wrapped in .gw.
function glossWrap(s, t) {
  const re = glossRe(t); if (!re) return esc(s);
  let out = "", last = 0, m;
  re.lastIndex = 0;
  while ((m = re.exec(s))) { out += esc(s.slice(last, m.index)) + '<span class="gw" data-g="' + esc(m[1].toLowerCase()) + '">' + esc(m[1]) + "</span>"; last = re.lastIndex; }
  return out + esc(s.slice(last));
}
// A clue as HTML: the whole clue glossed from "cw" when it has a meaning there, else its words from "w".
const cwKey = (t, s) => Object.keys(t.cw || {}).find(x => x.toLowerCase() === s.toLowerCase());
function clueGloss(s, t) {
  return cwKey(t, s) ? '<span class="gw" data-cw="1" data-g="' + esc(s.toLowerCase()) + '">' + esc(s) + "</span>" : glossWrap(s, t);
}
function glossOf(k, clue) {
  const d = G.r && (clue ? G.r.t.cw : G.r.t.w) || {};
  return d[Object.keys(d).find(x => x.toLowerCase() === k)] || "";
}
// The glossed word under an event, or null.
function glossTarget(e) { return e.target.closest ? e.target.closest(".gw") : null; }

function hideGloss() { clearTimeout(glossTimer); glossEl.hidden = true; if (glossFor) glossFor.classList.remove("on"); glossFor = null; }

// Mouse: hovering shows the meaning. Tap or click: the meaning (for a moment on touch).
card.addEventListener("pointerover", e => { const g = glossTarget(e); if (g && e.pointerType === "mouse") showGloss(g); });
card.addEventListener("pointerout", e => { const g = glossTarget(e); if (g && g === glossFor && e.pointerType === "mouse" && !g.contains(e.relatedTarget)) hideGloss(); });

addEventListener("scroll", hideGloss, true); addEventListener("resize", hideGloss);

/* 17-meaning.js — Which meaning? At levels with "meaning": n in levels.json (B2), after the texts: n pairs from

   He stopped [to smoke]), each with its meaning. The card shows one meaning (picked at random) and the two sentences as
   answers; the player picks the one that means it (keys 1 / 2). Then each sentence shows its meaning, with why.

function renderMeaning() {
  const M = G.m, it = M.items[M.k], s = it.s;

    '<div class="jd-pips" aria-hidden="true">' + M.items.map((_, n) => '<i class="' + (n < M.k ? (M.res[n].ok ? "ok" : "bad") : n === M.k ? "on" : "") + '"></i>').join("") + "</div>" +
    '<p class="mn-q">' + esc(tx("meaningAsk")) + '</p><p class="mn-m" lang="en">' + esc(meanText(s, it.ask, false)) + '</p><p class="mn-mpt" lang="pt">' + esc(meanText(s, it.ask, true)) + "</p>" +
    '<div class="mn-btns">' + [0, 1].map(k => '<button type="button" class="jd-b mn-b" data-v="' + k + '"><kbd>' + (k + 1) + '</kbd> <span lang="en">' + meanSent(s, k) + "</span></button>").join("") + "</div>" +

function meaningAnswer(v) {
  const M = G.m; if (G.phase !== "meaning") return;
  const it = M.items[M.k], s = it.s, ok = v === it.ask, last = M.k === M.items.length - 1, pt = nativeUi();
  M.res.push({ s, ok, pick: v, ask: it.ask });
  G.phase = last ? "done" : "mwait";

  else { G.streak = 0; sndBad(); flash(card, "shake"); toast(tx("judgeNo"), "zero"); }
  showScore(); showCombo();
  recordProgress(s.id, ok ? 2 : 0); recordUses([s.rule], [ok]);
  // Each sentence now shows its meaning; the right one green, a wrong pick red.
  card.querySelectorAll(".mn-b").forEach(b => {
    const k = +b.dataset.v; b.disabled = true;

  const R = DATA.rules.rules[s.rule] || {}, two = (en, p) => pt ? '<p lang="pt">' + artTxt(p) + '</p><p class="jd-2">' + artTxt(en) + "</p>" : "<p>" + artTxt(en) + '</p><p class="jd-2" lang="pt">' + artTxt(p) + "</p>";
  const fb = card.querySelector(".jd-fb");
  fb.innerHTML = '<div class="jd-head"><b class="' + (ok ? "ok" : "bad") + '">' + (ok ? "✓ " : "✗ ") + esc(tx(ok ? "judgeYes" : "judgeNo")) + "</b>" +
    (R.name ? '<button type="button" class="ex-use" data-rule="' + esc(s.rule) + '" style="--h:' + R.hue + '">' + esc(ruleName(s.rule, pt)) + "</button>" : "") + "</div>" +
    '<div class="jd-why">' + two(s.why, s.whyPt) + "</div>" +
    (last ? "" : '<div class="jd-next"><button type="button" class="cta pulse" id="mnext">' + esc(tx("next")) + " &rarr;</button></div>");
  fb.hidden = false;

  else setTimeout(() => { const b = $("mnext"); if (b) b.focus({ preventScroll: true }); }, 50);
}
function meaningNext() {

}

function showMeaningReveal() {

function meaningItemHTML(x) {

card.addEventListener("click", e => {

// Keys: 1 / 2 = the sentence, Enter = next pair.
document.addEventListener("keydown", e => {

/* 18-proof.js — Proofreading. At levels with "proof" in levels.json (B2), the last round: a short text from
   src/data/proof/<LEVEL>.json in which every verb that could be "to …", "…ing" or the verb alone is a bubble already
   showing what the writer put, and 2–3 of them are wrong. The player taps the wrong ones round the cycle to the
   right form and presses Check. The rest is a text round (10-game.js): tries, "count" feedback, explanations. Only
   the mistakes score (PTS_FIRST / PTS_LATER), and only they (and spots the player broke) are explained.
   Markup: as in texts, plus [cook:to>ing:enjoy] = the text says "to cook", the right answer is "cooking". */
// A Favorites game plays one favorite proofreading text (the least recently practised).
function proofDue() { if (G.mode === "fav") return G.favs.F.length > 0; return G.mode === "normal" && (DATA.levels[G.level] || {}).proof > 0 && (DATA.proof[G.level] || []).length > 0; }
function startProof() {
  const t = (G.mode === "fav" ? orderPool(G.favs.F) : orderPool(DATA.proof[G.level], 1))[0], P = parsed(t), start = P.spots.map(sp => sp.shown);
  // hinted: true = no Clues here, whatever the level allows.
  G.r = { t, P, level: levelOf(t), st: start.slice(), start, proof: true, lock: P.spots.map(() => false), first: null, tries: 0, hinted: true };
  G.b = G.j = G.m = null; G.xi = 4; G.phase = "play";
  revealEl.hidden = true; revealEl.innerHTML = "";
  toolsEl.classList.remove("bonus"); toolsEl.hidden = false;
  hideGloss(); renderCard();
  card.classList.add("proofcard");
  card.querySelector(".tag").textContent = "✎ " + tx("proofTag");
  P.spots.forEach((sp, i) => paintSpot(G.r.spotEls[i], sp, start[i]));
  renderTools(); updateProgress();
  hintEl.innerHTML = tx("proofIntro");
  stage.classList.remove("out"); if (!reduceMotion) flash(stage, "rise");
  sndShuffle();
}

/* 19-pockets.js — "Your pockets": the player's own collection of the words that decide. Every gap right on the first
   check files its trigger (the gap's first clue: {enjoy}, {interested in}; {enjoys|enjoy} files "enjoy") in the pocket
   of what comes after it: + to, + -ing, + the verb alone, to or -ing (both work), or "the meaning changes" (stop + -ing
   / stop + to, kept apart by rule). Rules with "pocket": false (the subject, purpose) have no trigger word.
   Shown in the Guide (14-guide.js), and the end screen lists what this game added.
   Stored as ger-pockets = {id: [group, rule, times, first seen (ms)]}; id = trigger#group (trigger#rule for "change"). */
const POCKETS = ["ing", "to", "bare", "both", "change", "perf"];
function getPockets() { try { const o = JSON.parse(load("ger-pockets")); return o && typeof o === "object" ? o : {}; } catch (e) { return {}; } }
// The spots right on the first check (from finish() in 10-game.js) go into their pockets.
function pocketAdd(spots, P) {
  const o = getPockets();
  spots.forEach(sp => {
    const R = DATA.rules.rules[sp.rule] || {}, c = sp.clues.length ? P.clues[sp.clues[0]] : null;
    if (!c || R.pocket === false) return;
    const g = GROUP_OF(sp.rule), id = c.key + "#" + (g === "change" ? sp.rule : g);   // "love" can sit in two pockets (love + to / -ing, would love + to)
    if (!o[id]) { o[id] = [g, sp.rule, 0, Date.now()]; (G.newPockets = G.newPockets || []).push(id); }
    o[id][2]++;
  });
  store("ger-pockets", JSON.stringify(o));
}
// "enjoy + -ing", "help + (to) verb", "stop + to: in order to".
function pocketLabel(id, e, pt) {
  const k = id.split("#")[0], g = e[0], R = DATA.rules.rules[e[1]] || {}, verb = pt ? "verbo" : "verb";
  const tail = { ing: "-ing", to: "to", bare: verb, both: e[1] === "help" ? "(to) " + verb : "to / -ing" }[g];
  if (g === "perf") return k + " + " + (pt ? R.shortPt : R.short);   // seem + to have done, need + -ing (= passive)
  return g === "change" ? k + " + " + (/ing/.test(R.form) ? "-ing" : "to") + ": " + (pt ? R.shortPt : R.short) : k + " + " + tail;
}
const pocketHue = g => g === "change" ? 330 : g === "both" ? 170 : DATA.rules.groups[g].hue;
// End screen: what this game added.
function pocketNewHTML() {
  const n = G.newPockets || [], o = getPockets(); if (!n.length) return "";
  return '<span class="pk-new"><span>' + esc(tx("pocketNew")) + "</span>" + n.map(id => o[id] ? '<span class="pk-it" style="--h:' + pocketHue(o[id][0]) + '">' + esc(pocketLabel(id, o[id], nativeUi())) + "</span>" : "").join("") + "</span>";
}
// The Guide section: one row per pocket, newest first, with how many times each one was right.
function pocketsHTML(pt) {
  const o = getPockets(), ids = Object.keys(o).sort((a, b) => o[b][3] - o[a][3]);
  const rows = POCKETS.map(g => {
    const mine = ids.filter(id => o[id][0] === g);
    return '<div class="pk-row" style="--h:' + pocketHue(g) + '"><span class="chip">' + esc(txL(pt, "pocket_" + g)) + " · " + mine.length + "</span>" +
      '<div class="pk-items">' + (mine.length ? mine.map(id => '<span class="pk-it" title="×' + o[id][2] + '">' + esc(pocketLabel(id, o[id], pt)) + "</span>").join("") : '<small class="pk-empty">' + esc(txL(pt, "pocketEmpty")) + "</small>") + "</div></div>";
  }).join("");
  return '<section class="gd-pk" id="gd-pockets"><h3>' + txL(pt, "pocketsTitle") + '</h3><p class="gd-short">' + txL(pt, "pocketsLead") + "</p>" + rows + "</section>";
}

/* 20-end.js — end-of-game modal: score, stars (text points only), hint bonus, bonus round, Right or wrong, Portuguese
   traps beaten, level progress, day streak, every text with its result, and "Copy results" (plain text to send the
   teacher, with accuracy for each rule in this game; on screen that accuracy is only in the Seen list). Adapts to the
   mode: quick-fire (no stars, own best) and practice games (no best score). */
const endModal = $("endmodal");
function stars(n) { return [0, 1, 2].map(i => '<span class="' + (i < n ? "" : "off") + '">&#9733;</span>').join(""); }
function showEnd() {
  stopSpeed(); G.phase = "over";
  const speed = G.mode === "speed", done = G.results.length, pool = hintPool();
  // Stars come from the texts only (not proofreading); the total counts everything.
  const texts = G.results.filter(x => !x.proof), pts = texts.reduce((s, x) => s + x.pts, 0), max = G.results.reduce((s, x) => s + x.max, 0);
  const tmax = texts.reduce((s, x) => s + x.max, 0), pct = tmax ? pts / tmax : 0, n = pct >= .85 ? 3 : pct >= .6 ? 2 : pct >= .35 ? 1 : 0;
  // Unused hints become bonus points (not in quick-fire, where time is the pressure).
  const hints = !speed && G.total > 0 && pool > 0, bonus = hints ? G.hintsLeft : 0;
  G.score += bonus;
  const total = max + (hints ? pool : 0) + (G.bonus ? BONUS_FIRST : 0) + (G.judge ? G.judge.res.length * JUDGE_PTS : 0) + (G.meaning ? G.meaning.res.length * MEAN_PTS : 0), sc = G.score, key = bestKey();
  const prev = key ? parseInt(load(key), 10) || 0 : 0, record = !!key && sc > prev;
  if (record) store(key, sc);

  $("endstars").innerHTML = speed ? "" : stars(n);
  $("endscore").textContent = speed ? tx(sc === 1 ? "onePoint" : "nPoints", { n: sc }) : sc + " / " + total;
  $("endmsg").textContent = speed ? tx("inSeconds", { x: sc + " / " + done, s: SPEED_SECS }) : tx("msg" + n);
  $("endsub").textContent = !key ? tx("noSave") :
    (record ? tx(speed ? "speedRecord" : "newBest", { lvl: lvName(G.level) }) : tx("levelBest", { lvl: lvName(G.level), n: Math.max(prev, sc) }));
  const extras = [], tr = trapsBeaten();

  if (G.bonus) extras.push(tx("bonusRound", { r: G.bonus.pts ? "+" + G.bonus.pts : tx("missed") }));

  if (G.judge) extras.push(tx("judgeRound", { r: G.judge.res.filter(x => x.ok).length + "/" + G.judge.res.length }));
  G.results.filter(x => x.proof).forEach(x => extras.push(tx("proofRound", { r: x.k + "/" + x.n })));
  $("endhints").textContent = extras.join(" · ");
  $("endtraps").innerHTML = (tr[0] ? esc(tx("trapsBeaten", { k: tr[1], n: tr[0] })) : "") + pocketNewHTML();
  const days = getDays();
  $("endprog").innerHTML = speed ? "" : meterHTML(G.level) + '<span class="psub">' + tx("mastered", { lvl: esc(lvName(G.level)) }) + (days >= 2 ? tx("daysRow", { n: days }) : "") + "</span>";
  $("endlist").innerHTML = G.results.map(x => x.sp ? speedItemHTML(x) : textItemHTML(x)).join("") + (G.bonus ? bonusItemHTML(G.bonus) : "") + (G.meaning ? G.meaning.res.map(meaningItemHTML).join("") : "") + (G.judge ? G.judge.res.map(judgeItemHTML).join("") : "");
  // Offer the next level after a good normal game.

  upBtn.hidden = !(G.mode === "normal" && up && n >= 2); if (up) { upBtn.textContent = tx("tryUp", { lvl: lvName(up) }); upBtn.dataset.l = up; }
  $("endcopy").textContent = tx("copy");
  endModal.classList.add("show");
  if (record || (!speed && n >= 2)) sndWin();
  setTimeout(() => $("endagain").focus({ preventScroll: true }), 50);
}
// [traps in this game, right on the first check] (texts and quick-fire).
function trapsBeaten() {
  return G.results.reduce((a, x) => x.traps ? [a[0] + x.traps[0], a[1] + x.traps[1]] : x.sp && isTrap(x.sp.rule) ? [a[0] + 1, a[1] + (x.ok ? 1 : 0)] : a, [0, 0]);

// "✓ Jobs · ✗ Names": each gap's rule, marked right or wrong on the first check.
function rulesLine(x) { return parsed(x.t).spots.map((sp, i) => x.cnt && !x.cnt[i] ? "" : (x.first[i] ? "✓ " : "✗ ") + esc(ruleName(sp.rule, nativeUi()))).filter(Boolean).join(" · "); }

    '<div class="rs"><div><b>★ ' + esc(tx("bonusTag")) + "</b> · " + esc(B.s.en.replace(/[[\]]/g, "")) + '</div><div class="rt" lang="pt">' + esc(B.s.pt) + "</div></div>" +
    '<span class="rp">+' + B.pts + "</span>" + favBtn(B.s.id) + "</li>";
}
function judgeItemHTML(x) {
  return '<li class="' + (x.ok ? "" : "miss") + '"><span class="ri">' + (x.ok ? "&#10003;" : "&#10007;") + "</span>" +
    '<div class="rs"><div>' + judgeHTML(x.s, true) + '</div><div class="rt">' + esc(tx(judgeWrong(x.s) ? "judgeWrong" : "judgeRight")) + " · " + esc(ruleName(x.s.rule, nativeUi())) + "</div></div>" +

// {rule: [answers, right on the first check]} for this game.
function gameUses() {

// Plain-text summary for the teacher (WhatsApp, Classroom...). Wrong answers show the right sentence and the choice made.
function resultsText() {

/* 21-lists.js — favorites and seen texts. A star sits on every finished text, bonus sentence, Right-or-wrong sentence,

   Favorite ids: a text ("a2-03"), a quick-fire sentence ("a2-03#2" = gap 2 of that text), a bonus sentence ("a2-b04")

const SEEN_MAX = 60;

function sentItem(id) { const m = /^(.+)#(\d+)$/.exec(id), t = TEXTS[m[1]], P = parsed(t), i = +m[2]; return { t, P, sp: P.spots[i], i }; }

/* 22-modes.js — ways to play beyond a normal game:

/* ---------- Quick-fire ---------- */
let speedT = 0, speedEnd = 0, speedBeat = 0;
// Every spot of the level: { t, P, sp, i }.
function speedPool(level) {
  const out = [];
  DATA.texts[level].forEach(t => { const P = parsed(t); P.spots.forEach((sp, i) => out.push({ t, P, sp, i })); });
  return shuffle(out);
}
function startSpeed() { speedEnd = Date.now() + SPEED_SECS * 1000; speedBeat = Math.ceil(SPEED_SECS / 30); clearInterval(speedT); speedT = setInterval(speedTick, 250); speedRender(); }
function stopSpeed() { stopIntro(); clearInterval(speedT); speedT = 0; $("proglbl").closest(".prog").classList.remove("clock", "urgent"); }
// Before the clock: a card with the goal, then 3, 2, 1, Go! (a tick each). "Go" starts the first sentence and the clock.
const cdEl = document.createElement("div"); cdEl.className = "cdown"; cdEl.hidden = true; document.body.appendChild(cdEl);
let cdT = 0;
function speedIntro() {
  G.phase = "intro"; stage.hidden = toolsEl.hidden = revealEl.hidden = true;
  hintEl.innerHTML = ""; speedRender();
  cdEl.innerHTML = '<div class="cd-card"><p class="cd-t">' + tx("speedTitle") + '</p><p class="cd-x">' + tx("speedIntro") + '</p><b class="cd-n" id="cdn"></b></div>';
  cdEl.hidden = false;
  const steps = ["3", "2", "1", tx("go")]; let i = 0;
  const tick = () => {
    if (i === steps.length) { cdEl.hidden = true; G.sp = speedPool(G.level); G.spIdx = 0; speedRound(); startSpeed(); return; }
    const n = $("cdn"), go = i === steps.length - 1;
    n.textContent = steps[i++]; n.classList.remove("pop"); void n.offsetWidth; n.classList.add("pop");
    if (go) tone(1046.5, 0, .3, .09, 0, true); else tone(659.25, 0, .12, .07, 0, true);

  };

}
function stopIntro() { clearTimeout(cdT); cdEl.hidden = true; }

// The progress label becomes a big clock with "7 ✓" under it; the bar drains. Every 30 seconds the clock beats
// (with a chime), and the last 10 seconds pulse red.
function speedRender() {
  const left = speedLeft(), s = Math.ceil(left / 1000), lbl = $("proglbl"), prog = lbl.closest(".prog");
  if (!$("clk")) lbl.innerHTML = '<b id="clk"></b><small id="clkdone"></small>';
  prog.classList.add("clock"); prog.classList.toggle("urgent", s <= 10);
  $("clk").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

  $("pfill").style.width = (left / (SPEED_SECS * 1000) * 100) + "%";

}
function speedTick() {

}
// One sentence: the gap grey, and its forms as buttons (keys 1–5, in cycle order).
function speedRound() {

  if (G.spIdx >= G.sp.length) { G.sp = shuffle(G.sp); G.spIdx = 0; }
  const it = G.cur = G.sp[G.spIdx++], sp = it.sp;
  G.phase = "speed";
  quizEl.className = "quiz speed";
  quizEl.innerHTML = '<p class="qz-s">' + sentHTML(it.P, it.i, () => '<span class="qgap">?</span>', false, false) + "</p>" +
    '<div class="qz-opts">' + sp.forms.map((f, k) => '<button type="button" class="pbtn sopt" data-k="' + k + '"><kbd>' + (k + 1) + "</kbd> " + esc(f) + "</button>").join("") +
    '</div><p class="qz-why" hidden></p>';

}

  const sp = it.sp, ok = isRight(sp, k);
  G.phase = "speedwait";
  quizEl.querySelectorAll(".sopt").forEach(b => { b.disabled = true; if (isRight(sp, +b.dataset.k)) b.classList.add("ok"); else if (+b.dataset.k === k) b.classList.add("bad"); });
  // The sentence again with the right form.
  quizEl.querySelector(".qz-s").innerHTML = sentHTML(it.P, it.i, () => '<span class="qgap ' + (ok ? "ok" : "bad") + '">' + esc(formOf(sp, ok ? k : undefined)) + "</span>", false, ok ? k : undefined);

/* 23-shine.js — the bonus words' soap look and its shine (from Conditionals / Be Do Modal, 2026-11-22). SOAP = the spans
   inside every word bubble (14-soap.css): the film (.film: the turning colour .spin, the glow facing the mouse .fg), the
   shine spot (.spot + its brighter core .pl), the rim (.rim: .spin + the bright side .rh) and the small spot (.glint).
   What moves is a bare wrapper whose look is the <i> inside, so only transform / opacity change: nothing is repainted.
   The shine: each visible word's spot stays in its top-left corner and leans a little toward the cursor, the small
   spot moves the other way, the side facing the cursor glows as it nears. With a mouse always; with a finger only
   while a word is carried. Nothing with reduced motion. */
var SOAP = '<span class="film" aria-hidden="true"><i class="spin"></i><i class="fg"><i></i></i></span>' +
  '<span class="spot" aria-hidden="true"><i></i><i class="pl"><i></i></i></span>' +
  '<span class="rim" aria-hidden="true"><i class="spin"></i><i class="rh"><i></i></i></span><span class="glint" aria-hidden="true"><i></i></span>';

if (window.IntersectionObserver) new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle("still", !e.isIntersecting))).observe(stage);
// While the result card opens or closes, the bobs, films and background bubbles pause (body.calm), so each frame of
// that animation doesn't also restyle every running animation
let calmT = 0;
if (window.MutationObserver && !reduceMotion) new MutationObserver(() => {
  document.body.classList.add("calm"); clearTimeout(calmT);
  calmT = setTimeout(() => document.body.classList.remove("calm"), 450);
}).observe(revealEl, { attributes: true, attributeFilter: ["hidden"] });
(function () {
  if (reduceMotion) return;
  let px = 0, py = 0, on = false, touch = false, raf = 0, last = 0, dirty = true, odd = false;
  let rcache = null, rlist = null, rtime = 0;
  const RECT_MS = 250;   // positions measured at most this often (they barely move), and after a scroll / resize
  // the spot leans at most RIGHT / DOWN of the bubble's height toward the cursor, LEFT / UP the other way;
  // from NEAR0 of that (far) to all of it (on it); FALL = how quickly it fades with distance
  const RIGHT = 0.07, DOWN = 0.08, LEFT = 0.025, UP = 0.03, NEAR0 = 0.5, FALL = 160;
  const GLOW = 190;     // nearness sk = (GLOW / (distance + GLOW))^2: 1 on the bubble, 1/4 at GLOW px
  const EASE = 0.3;     // share of the way to the target in one 60 fps frame
  const DRAG_SK = 0.45; // while a word is carried, the others keep at least this nearness
  const carried = () => document.querySelector(".w.drag");
  const parts = b => ({ sp: b.querySelector(".spot"), pl: b.querySelector(".spot .pl"), gl: b.querySelector(".glint"), fg: b.querySelector(".fg"), rh: b.querySelector(".rh"), w: {} });
  // a write only when the value shows a change
  function put(e, n, p, v) { const key = n + p; if (e.w[key] !== v) { e.w[key] = v; e[n].style[p] = v; } }
  function paint(st) {
    const e = st.el, k = Math.round(st.sk * 100) / 100, sx = st.sx, sy = st.sy, o = k.toFixed(2);
    put(e, "sp", "transform", "translate(" + sx.toFixed(1) + "px," + sy.toFixed(1) + "px) rotate(-30deg) scale(" + (1 + 0.1 * k).toFixed(3) + ")");
    put(e, "pl", "opacity", o);
    put(e, "gl", "transform", "translate(" + (-0.35 * sx).toFixed(1) + "px," + (-0.35 * sy).toFixed(1) + "px) rotate(-45deg)");
    put(e, "gl", "opacity", (0.8 + 0.2 * k).toFixed(3));
    // the glows sit on the edge point facing the cursor (a translate in % is a share of the span itself)
    put(e, "fg", "transform", "translate(" + (st.ux * 50 / 1.2).toFixed(1) + "%," + (st.uy * 50 / 1.9).toFixed(1) + "%)");
    put(e, "fg", "opacity", o);
    put(e, "rh", "transform", "translate(" + (st.ux * 50 / 1.1).toFixed(1) + "%," + (st.uy * 50 / 1.8).toFixed(1) + "%)");
    put(e, "rh", "opacity", o);
  }
  function rest(e) { [e.sp, e.pl, e.gl, e.fg, e.rh].forEach(n => { if (n) n.style.transform = n.style.opacity = ""; }); e.w = {}; }
  function frame(now) {
    raf = 0;
    const held = carried();
    if (touch && !held) on = false;
    if (touch && held && (odd = !odd)) { raf = requestAnimationFrame(frame); return; }   // 30 updates a second on a phone
    const f = 1 - Math.pow(1 - EASE, Math.min(4, (now - (last || now - 16.7)) / 16.7));
    last = now;
    const bs = [...stage.querySelectorAll(".b.w, .art")];   // bonus words and article bubbles
    let rs = [], moving = false;
    if (rcache && now - rtime < RECT_MS && rlist.length === bs.length && rlist[0] === bs[0]) rs = rcache;
    else { rs = bs.map(b => b.getBoundingClientRect()); rcache = rs; rlist = bs; rtime = now; }   // reads first, then writes
    bs.forEach((b, i) => {
      const r = rs[i];
      const st = b._sh || (b._sh = { sx: 0, sy: 0, sk: 0, ux: 0, uy: -1, el: parts(b) });
      if (!st.el.sp) return;
      if (!r.width) { if (st.w) { b._sh = null; rest(st.el); } return; }
      let t = st.t;
      if (dirty || !t) t = st.t = { sx: 0, sy: 0, sk: 0, ux: st.ux, uy: st.uy };
      if ((dirty || !st.t0) && on && b !== held) {   // the carried word itself rests
        const dx = px - (r.left + r.width / 2), dy = py - (r.top + r.height / 2);
        let d = Math.hypot(dx, dy);
        const k = (NEAR0 + (1 - NEAR0) * FALL / (d + FALL)) / Math.max(d, 1);
        t.sx = dx * k * (dx > 0 ? RIGHT : LEFT) * r.height;
        t.sy = dy * k * (dy > 0 ? DOWN : UP) * r.height;
        const g = GLOW / (d + GLOW); t.sk = held ? Math.max(g * g, DRAG_SK) : g * g;
        d = Math.max(d, 1); t.ux = dx / d; t.uy = dy / d;
      }
      st.t0 = true;
      let changed = false;
      ["sx", "sy", "sk", "ux", "uy"].forEach(p => {
        let v = st[p] + (t[p] - st[p]) * f;
        if (Math.abs(t[p] - v) < (p === "sx" || p === "sy" ? 0.05 : 0.002)) v = t[p]; else moving = true;
        if (v !== st[p]) changed = true;
        st[p] = v;
      });
      if (!changed && st.w) return;

      paint(st);
    });
