      var s = shareState(); s.shared = true; A.set("eb-share", JSON.stringify(s));
    }
    ding(659.25);
    // phones and tablets: their own share menu (WhatsApp, Instagram...); computers: copy (their share windows are clumsy)
    if (navigator.share && matchMedia("(hover: none)").matches) {
      navigator.share({ title: "English Bubbles", text: text, url: url }).then(function () { done("share menu"); }, function () {});
      return;
    }
    copyText(text + " " + url).then(function () {
      note("Copied! Paste it in a message to a friend.", "Copiado! Cole numa mensagem para um amigo.");
      done("copy");
    }, function () { window.prompt(pt ? "Copie o link:" : "Copy the link:", url); });
  }
  window.ebShare = share;

  // ------------------------------------------------------------ reporting a mistake (2026-11-27, the user)
  // The user's Google Form "English Bubbles – Avisar um erro" (questions: what happened, Game, Automatic details,
  // email if a reply is wanted; no sign-in, emails not collected; answers go to a linked Google Sheet). The app opens
  // it with Game and Automatic details already filled in: the game's menu title and id, where it was opened from,
  // language, light mode, screen size and browser, and the round just played (the game's own "Copy results" text,
  // resultsText(), in 13 games; else the end card's visible text). The student writes only what happened.
  var FORM = "https://docs.google.com/forms/d/e/1FAIpQLSeshi1w10fuw1g2RCJm3pwu9Fkp7DrTgl4TrWv_OtUX3oU7Wg/viewform?usp=pp_url",
    F_GAME = "entry.1472550832", F_DET = "entry.1131403084";
  var FLAG = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4h12l-2.5 4.5L17 13H5"/></svg>';
  function report(from, card) {
    var title = (window.ebApp && window.ebApp.title) || (GAME === "menu" ? "Menu" : GAME), round = "";
    try { if (typeof window.resultsText === "function") round = String(window.resultsText() || ""); } catch (e) {}
    if (!round && card) {
      // the end card's visible text, without its buttons' labels and the app's own lines
      var skip = { "×": 1, "✕": 1 };
      [].forEach.call(card.querySelectorAll("button, .ebd-line, .ebd-report"), function (b) {
        (b.innerText || "").split("\n").forEach(function (x) { skip[x.trim()] = 1; });
      });
      round = (card.innerText || "").split("\n").map(function (x) { return x.replace(/\s+/g, " ").trim(); })
        .filter(function (x) { return x && !skip[x]; }).join("\n");
    }
    var det = [
      (GAME === "menu" ? "Menu" : "games/" + GAME + ".html") + " · " + from,
      "Idioma " + A.lang() + " · modo leve " + (document.documentElement.classList.contains("eb-lite") ? "sim" : "não"),
      "Tela " + window.innerWidth + "×" + window.innerHeight + " · " + navigator.userAgent
    ];
    if (round) det.push("", "Rodada:", round);
    det = det.join("\n");
    if (det.length > 1500) det = det.slice(0, 1500) + "…";     // the address must stay short enough for every browser
    var url = FORM + "&" + F_GAME + "=" + encodeURIComponent(GAME === "menu" ? "Menu" : title + " (" + GAME + ")") +
      "&" + F_DET + "=" + encodeURIComponent(det);
    stat("Report opened", { from: from, game: GAME });
    window.open(url, "_blank", "noopener");
  }
  window.ebReport = report;

  // ------------------------------------------------------------ the menu: the pop-up and the footer links
  if (inMenu) {
    var rl = document.getElementById("reportlink");
    if (rl) rl.addEventListener("click", function () { report("menu link", null); });
    var link = document.getElementById("donlink");
    var showLink = function () { if (link) link.hidden = false; };   // always shown (2026-11-26, the user)
    if (link) link.addEventListener("click", function () { open("manual"); });
    var sb = document.getElementById("sharebtn");
    if (sb) sb.addEventListener("click", function () { share("menu button"); });
    // If the chip would sit on a row by itself (narrow phones, a long game name in Continue), Continue shortens its
    // name with "…" so both stay on one row (the chip always keeps its label: "Share" on phones, 20-hero.css).
    var fitShare = function () {
      var cont = document.getElementById("continue");
      if (cont) cont.style.maxWidth = "";
      if (!sb || !sb.offsetParent) return;
      var prev = sb.previousElementSibling;
      while (prev && (prev.hidden || !prev.offsetParent)) prev = prev.previousElementSibling;
      if (!prev || prev !== cont) return;
      if (sb.getBoundingClientRect().top >= prev.getBoundingClientRect().bottom)
        prev.style.maxWidth = (sb.parentNode.clientWidth - sb.offsetWidth - (parseFloat(getComputedStyle(sb.parentNode).columnGap) || 0) - 1) + "px";
    };
    if (sb) {
      fitShare();
      window.addEventListener("resize", fitShare);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitShare);
      var mo = new MutationObserver(function () { requestAnimationFrame(fitShare); });
      mo.observe(sb.parentNode, { attributes: true, subtree: true, attributeFilter: ["hidden"] });
      mo.observe(document.documentElement, { attributes: true, attributeFilter: ["data-lang"] });
      window.addEventListener("pageshow", fitShare);
    }
    var ask = function () {
      showLink();
      var s = state(), help = document.getElementById("help");
      if (s.off || s.gave || s.asks >= MAX_ASKS || rounds() < Math.max(FIRST, s.next)) return;
      if (help && !help.hidden) return;              // the tour is open
      s.asks += 1; s.next = rounds() + ASK_AGAIN; save(s);
      open("ask");
    };
    // after the page has arrived (the header's slide, then the page's fade-in), and again when Back restores it
    var later = function () { var go = function () { setTimeout(ask, 900); }; if (typeof afterSlide === "function") afterSlide(go); else go(); };
    showLink();
    later();
    window.addEventListener("pageshow", function (e) { if (e.persisted) later(); });
    return;
  }

  // ------------------------------------------------------------ a game: count rounds, add the line
  var lastFp = null;
  function ended(after, fp) {
    if (!after || fp === lastFp) return;
    lastFp = fp;
    var n = rounds() + 1;
    A.set("eb-rounds", String(n));
    stat("Round finished", { game: GAME });
    promo(after, n);
    reportLine(after);
  }
  // At the very bottom of every round's end: "Found a mistake? Tell us" (always; under the share / support line)
  function reportLine(after) {
    var box = after.parentNode, old = box.querySelector(".ebd-report");
    if (old) old.remove();
    var line = box.querySelector(".ebd-line"), card = after.closest("#endmodal, .pend") || box;
    var p = document.createElement("p");
    p.className = "ebd-report ebd-l";
    p.dataset.lang = A.lang();
    p.innerHTML = both("Found a mistake?", "Encontrou um erro?") +
      ' <button type="button">' + FLAG + both("Tell us", "Avise") + "</button>";
    p.querySelector("button").addEventListener("click", function (e) { e.stopPropagation(); report("game end", card); });
    var at = line || after;
    box.insertBefore(p, at.nextSibling);
  }
  // the support line (from round 5) or else, now and then, the share line
  function promo(after, n) {
    var old = after.parentNode.querySelector(".ebd-line");
    if (old) old.remove();
    var s = state();
    if (n < FIRST || n < s.line) { shareLine(after, n); return; }
    s.line = n + (s.gave ? LINE_EVERY_GAVE : LINE_EVERY); save(s);
    var p = document.createElement("p");
    p.className = "ebd-line ebd-l";
    p.dataset.lang = A.lang();
    p.innerHTML = both("Enjoying English Bubbles?", "Está gostando do English Bubbles?") +
      ' <button type="button">' + HEART + both("Support it", "Apoie") + "</button>";
    p.querySelector("button").addEventListener("click", function (e) { e.stopPropagation(); open("manual"); });
    after.parentNode.insertBefore(p, after.nextSibling);
  }
  function shareLine(after, n) {
    var s = shareState();
    if (n < SHARE_FIRST || n < s.next) return;
    s.next = n + (s.shared ? SHARE_EVERY_DONE : SHARE_EVERY); A.set("eb-share", JSON.stringify(s));
    var p = document.createElement("p");
    p.className = "ebd-line ebd-share ebd-l";
    p.dataset.lang = A.lang();
    p.innerHTML = both("Like it?", "Gostou?") +
      ' <button type="button">' + SHARE_ICON + both("Share it with a friend", "Compartilhe com um amigo") + "</button>";
    p.querySelector("button").addEventListener("click", function (e) { e.stopPropagation(); share("game line"); });
    after.parentNode.insertBefore(p, after.nextSibling);
  }
  function text(root, sel) { var x = root && root.querySelector(sel); return x ? x.textContent : ""; }
  var em = document.getElementById("endmodal"), wasOpen = !!(em && em.classList.contains("show"));
  if (em) new MutationObserver(function () {
    var on = em.classList.contains("show");
    if (on && !wasOpen) ended(em.querySelector(".endbtns") || em.querySelector("#endagain"), "m:" + text(em, "#endscore") + "|" + text(em, "#endlist").slice(0, 400));
    wasOpen = on;
  }).observe(em, { attributes: true, attributeFilter: ["class"] });
  var lastBtn = null;
  new MutationObserver(function () {
    var b = document.getElementById("pagain") || document.getElementById("spagain");
    if (!b || b === lastBtn) return;
    lastBtn = b;
    var box = b.closest(".pacts, .endbtns, p") || b;
    var end = b.closest(".pend") || box.parentNode;
    // the same round's end drawn again (a language switch) has the same words: not a new round
    var words = end.querySelectorAll(".w");
    if (!words.length) words = end.querySelectorAll("li");
    ended(box, "p:" + [].map.call(words, function (x) { return x.textContent.slice(0, 30); }).join("|").slice(0, 400) + text(end, ".big"));
  }).observe(document.body, { childList: true, subtree: true });
})();
</script>
<script>
/* lite.js — LIGHT MODE (2026-11-27, the user): fewer animations on devices that struggle. Runs in the menu (appended to
   its scripts) and in every game (in the injected foot); the look is lite.css. ONE setting for the whole app, eb-lite:
     unset / "ok"  not on: the page is checked (below); "ok" = a check found it smooth (pages are still checked)
     "auto"        on, switched on by the check (a note says so, once)
     "on" / "off"  chosen in Help (the menu's tour): never changed by the check again
   THE CHECK: 3 s after a page opens (the header has landed), the frames of 4 s are timed while the page is on screen.
   Slow = under 35 frames a second or 8+ frames over 50 ms. One slow check is not enough (a page can stutter while it
   settles): a second check 6 s later must agree. No frames (a hidden tab) = no decision.
   ON: html.eb-lite (lite.css), and every endlessly repeating decorative animation is paused (hints keep running) (checked every 1.5 s, as pages add
   elements). window.ebLite = {on(), set(true / false)} for the Help switch. Visitor stats: "Light mode" {how}. */
(function () {
  "use strict";
  var A = window.ebApp || {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    lang: function () { return document.documentElement.dataset.lang === "en" ? "en" : "pt"; }
  };
  var KEY = "eb-lite", root = document.documentElement;
  var GAME = (location.pathname.match(/\/games\/([^\/]+)\.html$/) || [])[1] || "menu";
  function stat(how) { try { if (window.umami && umami.track) umami.track("Light mode", { how: how, game: GAME }); } catch (e) {} }
  function val() { return A.get(KEY) || ""; }
  function isOn() { var v = val(); return v === "auto" || v === "on"; }

  // ------------------------------------------------------------ on / off
  // Hints keep running (small and cheap, and they tell the student something): Verb Wheel's flashing "type here" bar
  // (blink2), the ring on a game's tutorial button (tourping), and any pulse / ping / nudge. Checked 2026-11-27: the
  // 20 games' endless animations are float, spin, bob (decoration, paused) and those two hints.
  var HINT = /blink|ping|pulse|nudge|hint/i;
  var paused = [], timer = 0;
  function calm() {
    if (!root.classList.contains("eb-lite") || document.hidden || !document.getAnimations) return;
    try {
      document.getAnimations().forEach(function (a) {
        var t = a.effect && a.effect.getTiming ? a.effect.getTiming() : null;
        if (t && t.iterations === Infinity && a.playState === "running" && !HINT.test(a.animationName || "")) { a.pause(); paused.push(a); }
      });
    } catch (e) {}
  }
  // SOLID PANELS (2026-11-27, the user: a game's Guide was hard to read): without the blur, a see-through panel shows
  // the game behind its text. Every element styled with a backdrop-filter (found in the page's style sheets) gets its
  // own colour laid over the page's background colour (--bg-a) as a solid background-color, so it keeps its tint and
  // its gradients but nothing shows through. Kept in data-ebl; redone when the colour or theme changes.
  var glassSel = null, probe = null, mo = null, queued = 0;
  function sels() {
    if (glassSel) return glassSel;
    var out = [];
    function walk(rules) {
      for (var i = 0; i < rules.length; i++) {
        var r = rules[i];
        if (r.cssRules && !r.selectorText) { try { walk(r.cssRules); } catch (e) {} continue; }
        if (!r.style || !r.selectorText) continue;
        var bf = r.style.getPropertyValue("backdrop-filter") || r.style.getPropertyValue("-webkit-backdrop-filter");
        if (bf && bf !== "none" && !/eb-lite/.test(r.selectorText)) out.push(r.selectorText);
      }
    }
    for (var s = 0; s < document.styleSheets.length; s++) { try { walk(document.styleSheets[s].cssRules); } catch (e) {} }
    glassSel = out.join(",") || "";
    return glassSel;
  }
  function rgba(c) {
    var m = /rgba?\(([^)]+)\)/.exec(c || ""); if (!m) return null;
    var p = m[1].split(/[ ,\/]+/).filter(Boolean).map(parseFloat);
    return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1];
  }
  function base() {
    if (!probe) { probe = document.createElement("i"); probe.style.cssText = "position:fixed;width:0;height:0;visibility:hidden;background:var(--bg-a)"; }
    if (!probe.isConnected) document.body.appendChild(probe);
    return rgba(getComputedStyle(probe).backgroundColor) || [255, 255, 255, 1];
  }
  function solid() {
    queued = 0;
    if (!root.classList.contains("eb-lite") || !document.body) return;
    var s = sels(); if (!s) return;
    var b = null, els;
    try { els = document.querySelectorAll(s); } catch (e) { return; }
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (el.hasAttribute("data-ebl")) continue;
      var c = rgba(getComputedStyle(el).backgroundColor);
      el.setAttribute("data-ebl", el.style.backgroundColor || "");
      if (!c || c[3] >= .97) continue;
      b = b || base();
      var a = c[3], mix = function (k) { return Math.round(c[k] * a + b[k] * (1 - a)); };
      el.style.setProperty("background-color", "rgb(" + mix(0) + "," + mix(1) + "," + mix(2) + ")", "important");
    }
  }
  function unsolid() {
    var els = document.querySelectorAll("[data-ebl]");
    for (var i = 0; i < els.length; i++) {
      els[i].style.removeProperty("background-color");
      if (els[i].getAttribute("data-ebl")) els[i].style.backgroundColor = els[i].getAttribute("data-ebl");
      els[i].removeAttribute("data-ebl");
    }
  }
  // at most one pass every 60 ms (games change classes all the time while a bubble moves)
  function queue() { if (!queued) queued = setTimeout(solid, 60); }
  var mo2 = null;
  function watch(on) {
    if (mo) { mo.disconnect(); mo2.disconnect(); mo = mo2 = null; }
    if (!on || !window.MutationObserver) return;
    mo = new MutationObserver(queue);           // windows opening, elements added
    mo.observe(document.body || root, { childList: true, subtree: true, attributes: true, attributeFilter: ["class", "hidden", "open"] });
    mo2 = new MutationObserver(function () { unsolid(); queue(); });   // the page's colour or theme changed: all again
    mo2.observe(root, { attributes: true, attributeFilter: ["style", "data-theme"] });
  }
  function apply(on) {
    root.classList.toggle("eb-lite", on);
    var sw = document.querySelectorAll(".lite-sw");                 // the menu's switch shows the state
    for (var i = 0; i < sw.length; i++) sw[i].setAttribute("aria-checked", String(on));
    clearInterval(timer);
    if (on) {
      calm(); timer = setInterval(calm, 1500);
      if (document.body) solid(); else document.addEventListener("DOMContentLoaded", solid);
      watch(true);
    } else {
      watch(false); unsolid();
      paused.forEach(function (a) { try { if (a.playState === "paused") a.play(); } catch (e) {} });
      paused = [];
    }
  }
  window.ebLite = {
    on: isOn,
    set: function (on) { A.set(KEY, on ? "on" : "off"); apply(on); stat(on ? "switched on" : "switched off"); }
  };

  // ------------------------------------------------------------ the note (once, when the check switches it on)
  function note() {
    var n = document.createElement("div");
    n.className = "ebl-note"; n.setAttribute("role", "status"); n.dataset.lang = A.lang();
    n.innerHTML = '<span class="ebl-en" lang="en"><b>Light mode on</b>: fewer animations, so the app runs smoothly on this device. ' +
      'To change it: the <b>?</b> button on the main menu.</span>' +
      '<span class="ebl-pt" lang="pt-BR"><b>Modo leve ligado</b>: menos animações, para o app rodar melhor neste aparelho. ' +
      'Para mudar: botão <b>?</b> no menu inicial.</span>';
    document.body.appendChild(n);
    requestAnimationFrame(function () { requestAnimationFrame(function () { n.classList.add("on"); }); });
    setTimeout(function () { n.classList.remove("on"); setTimeout(function () { n.remove(); }, 400); }, 7000);
  }

  // ------------------------------------------------------------ the check
  function measure(ms, done) {
    var prev = 0, frames = 0, long = 0, span = 0, t0 = 0;
    function tick(t) {
      if (document.hidden) { prev = 0; requestAnimationFrame(tick); return; }
      if (prev) {
        var d = t - prev;
        if (d < 300) { frames++; span += d; if (d > 50) long++; }   // longer gaps: the page was paused, not slow
      }
      prev = t;
      if (!t0) t0 = t;
      if (span >= ms) { done(frames / (span / 1000), long); return; }
      if (t - t0 > ms * 6) { done(null, 0); return; }      // hardly any frames (hidden tab, preview): no decision
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  function slow(fps, long) { return fps !== null && (fps < 35 || long >= 8); }
  function check() {
    var v = val();
    if (v === "auto" || v === "on" || v === "off") return;
    setTimeout(function () {
      measure(4000, function (fps, long) {
        if (fps === null) return;
        if (!slow(fps, long)) { A.set(KEY, "ok"); return; }
        setTimeout(function () {
          measure(4000, function (fps2, long2) {
            var now = val();
            if (fps2 === null || now === "on" || now === "off") return;
            if (!slow(fps2, long2)) { A.set(KEY, "ok"); return; }
            A.set(KEY, "auto"); apply(true); note(); stat("auto");
          });
        }, 6000);
      });
    }, 3000);
  }

  apply(isOn());
  document.addEventListener("visibilitychange", function () { if (!document.hidden) calm(); });
  window.addEventListener("pageshow", function (e) { if (e.persisted) apply(isOn()); });
  if (!window.matchMedia || !matchMedia("(prefers-reduced-motion: reduce)").matches) check();   // reduced motion: already calm
})();
</script>
