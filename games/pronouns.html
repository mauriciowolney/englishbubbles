<script>
/* Every game saves its progress in the phone's storage. In the app all games share one storage, so each game's
   keys get the prefix "eb:pronouns:" here; two games can then use the same key names without overwriting each other.
   One exception: the background colour (every game saves it as "<prefix>-bg", e.g. "p:sky" or "c:#7aa7ff", like
   the menu) is ONE setting for the whole app, kept under the menu's key "eb-bg": the game opens with the colour
   chosen in the menu, and a colour chosen in a game becomes the menu's and the other games' too. */
(function () {
  try {
    var P = "eb:pronouns:", L = window.localStorage, S = Storage.prototype, BG = /^[a-z]+-bg$/;
    var get = S.getItem, set = S.setItem, del = S.removeItem;
    /* The EN / PT toggles too: ONE language for the whole app, the menu's (eb-lang). Each game saves its toggles
       under its own keys, with its own word for Portuguese (games.json "lang": "pt", "tr" or "native"; English is
       always "en"): reading one gives the menu's language, and a tap in a game changes the menu's and every
       game's. Until EN / PT is chosen, the menu's own rule: Portuguese for My level All / A1 / A2, English from B1. */
    var LG = {"prn-guidelang": "pt", "prn-tourlang": "native"};
    function appLang() {
      var l = get.call(L, "eb-lang");
      if (l === "en" || l === "pt") return l;
      var lv = get.call(L, "eb-level");
      return lv === "B1" || lv === "B2+" ? "en" : "pt";
    }
    /* The sound-effects volume too (2026-11-26, the user): ONE for the whole app, the menu's "eb-vol" (0-100,
       0 = sound off). Every game saves "<prefix>-vol" (0-100, its Effects slider) plus an on / off key:
       "<prefix>-snd" ("0" = off) or "<prefix>-mute" ("1" = off). Reading them gives the menu's volume (menu at 0:
       the game opens muted, its slider where it was); after a game writes either, eb-vol = 0 if muted, else its
       slider. The Voice slider ("-vvol") stays each game's own. */
    var VOL = /^[a-z]+-vol$/, MUTE = /^[a-z]+-(snd|mute)$/;
    function own(k) { return get.call(L, P + k); }
    function syncVol(k) {
      var pre = k.slice(0, k.indexOf("-")), v = parseInt(own(pre + "-vol"), 10);
      if (isNaN(v) || v < 0 || v > 100) return;
      var off = own(pre + "-snd") === "0" || own(pre + "-mute") === "1";
      set.call(L, "eb-vol", String(off ? 0 : v));
    }
    S.getItem = function (k) {
      if (this === L && BG.test(k)) { var app = get.call(this, "eb-bg"); if (app) return app; }
      if (this === L && (VOL.test(k) || MUTE.test(k))) {
        var ev = get.call(this, "eb-vol");
        if (ev !== null && VOL.test(k) && ev !== "0") return ev;
        if (ev !== null && MUTE.test(k)) { var off = ev === "0"; return /-snd$/.test(k) ? (off ? "0" : "1") : (off ? "1" : "0"); }
      }
      if (this === L && LG.hasOwnProperty(k)) return appLang() === "en" ? "en" : LG[k];
      return get.call(this, this === L ? P + k : k);
    };
    S.setItem = function (k, v) {
      if (this === L && BG.test(k)) set.call(this, "eb-bg", v);
      if (this === L && LG.hasOwnProperty(k)) set.call(this, "eb-lang", String(v) === "en" ? "en" : "pt");
      var r = set.call(this, this === L ? P + k : k, v);
      if (this === L && (VOL.test(k) || MUTE.test(k))) syncVol(k);
      return r;
    };
    S.removeItem = function (k) { return del.call(this, this === L ? P + k : k); };
    /* The app's own keys (eb-rounds, eb-don…) and language, for the injected donation script (donate.js) */
    window.ebApp = { get: function (k) { return get.call(L, k); }, set: function (k, v) { set.call(L, k, v); }, lang: appLang, title: "Pronouns" };
    /* Opened from the menu (a card or Continue)? Then the game starts at the menu's level ("My level"): the menu
       leaves a one-time note (sessionStorage eb-level-go), and the matching level is saved under the game's own
       level key before the game reads it (games.json "level"; the nearest level when the game doesn't have it).
       With "All" on the menu, or on a reload, the game keeps its own last level. */
    var LV = {"key": "prn-level", "A1": "A1", "A2": "A2", "B1": "A2", "B2+": "A2"}, SS = window.sessionStorage;
    if (SS.getItem("eb-level-go") === "pronouns") {
      SS.removeItem("eb-level-go");
      var m = get.call(L, "eb-level");

  } catch (e) {}
})();
</script>

/* 10-dock: Header dock: segment buttons, capital labels, language picker, practice focus / level pills, volume slider, background swatches, Tutorial button. */

.lang { display: flex; align-items: center; gap: .55rem; min-width: 0; max-width: 100%; padding: 0 4px; font-weight: 500; }
.lang-cap { font-size: .85rem; opacity: .75; white-space: nowrap; }

/* The language picker is a glass pill (badge, name, chevron) that opens a list of glass options. The real <select>
   stays in the page, hidden, and holds the value; the pill and the list just set it. */
.pick {

@property --fc2 { syntax: "<color>"; inherits: false; initial-value: #2bb5c9; }

.volwrap { position: relative; display: flex; justify-content: center; }
.volp { position: absolute; top: calc(100% + 10px); left: 50%; z-index: 30; display: flex; align-items: center; padding: 10px 16px; border-radius: 24px; background: var(--bg-a); border: 1px solid var(--dock-line); box-shadow: 0 10px 26px var(--shadow); opacity: 0; visibility: hidden; transform: translateX(-50%) translateY(-6px) scale(.5,.8); transform-origin: top center; transition: opacity .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1), visibility 0s linear .25s; }

.sw { display: flex; align-items: center; gap: 8px 0; }   /* the circles are spaced by margins, not the gap, so the picker row adds nothing to the pop-over's width */

/* The colour picker (03-theme.js): a full-width row under the swatches while picking. Tracks are pills of their own

.cp-l { --cp-track: linear-gradient(90deg, hsl(var(--cp-h), var(--cp-s), 8%), hsl(var(--cp-h), var(--cp-s), 50%), hsl(var(--cp-h), var(--cp-s), 92%)); }
.cp-r::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 4px solid var(--cp-c); box-shadow: 0 2px 6px var(--shadow); transition: transform .2s cubic-bezier(.34,1.56,.64,1); }

.spot .pl { opacity: 0; }   /* brighter, with a wider core, as the mouse nears (its opacity = the nearness) */
.spot .pl i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--spot-plus) * .85)), rgba(255,255,255,var(--spot-plus)) 42%, rgba(255,255,255,calc(var(--spot-plus) * .55)) 52%, rgba(255,255,255,calc(var(--spot-plus) * .33)) 62%, rgba(255,255,255,calc(var(--spot-plus) * .12)) 81%, rgba(255,255,255,0)); }
/* The small second spot (as in the sibling games): a thin streak lying along the bottom-right curve, so a fixed size
   (em) rotated -45deg, its centre .47em in from both edges (on the corner's arc, just inside the rim). It moves the
   other way from the main spot, a third as far, like light seen through the far side, and brightens as the mouse
   nears (26-shine.js: its opacity from .8 to 1 of this brightest value). */
.wb .glint { position: absolute; right: calc(.47em - .17em); bottom: calc(.47em - .085em); width: .34em; height: .17em; pointer-events: none; opacity: .8; transform: rotate(-45deg); will-change: transform, opacity; }
.glint > i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--soap-gl) * .75)) 45%, rgba(255,255,255,0)); }
/* The rim: a ring (a mask cuts out its middle, and everything inside it), over the clear border */
.wb .rim { position: absolute; inset: -1.5px; border-radius: inherit; padding: 1.5px; pointer-events: none;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.rim .rh { position: absolute; left: -5%; top: -40%; width: 110%; height: 180%; opacity: 0; will-change: transform, opacity; }   /* the side facing the mouse lights up as it nears: an ellipse 55% x 90% of the rim (--rimhi-* per theme) */
.rh > i { background: radial-gradient(closest-side, hsla(var(--th), 100%, var(--rimhi-l), var(--rimhi-a)), transparent); }
.wb:focus-visible, .wb.sel, .tray:not(.locked) .wb.hov, .wb.drag { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 12px 22px var(--soap-sh2), 0 0 0 4px hsla(var(--th), 90%, 72%, .18); }
.wb.sel { outline-color: hsla(var(--th), 80%, 60%, .6); }
@media (hover: hover) { .tray:not(.locked) .wb:hover:not(.drag) { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 12px 22px var(--soap-sh2); } }
.wb.shake { border-color: transparent; --ig: inset 0 0 14px hsla(350, 95%, 70%, .4); box-shadow: 0 6px 14px var(--soap-sh); }
.wb.shake .rim { background: hsla(350, 85%, 62%, .8); }
.wb.shake .rim i { visibility: hidden; }   /* hidden, not stopped: it keeps turning in step with the film */
@media (prefers-reduced-motion: reduce) { .wb .spin { animation: none; } }
/* Touch screens: the film doesn't turn (when the turn repainted whole bubbles, 15 of them lagged a phone; 7 were
   smooth); each bubble keeps its own angle (--ang, 12-tray.js). Since 2026-11-22 the turn repaints nothing (a
   rotation), so it may come back: try it on a phone with ?fps (95-perf.js) first. The float stays. */
@media (hover: none) { .wb .spin { animation: none; } }
/* A tall bubble (a word doing two jobs: you, it, her, his) shows both jobs' colours: a still tint from the top row's
   colour (--h) to the bottom row's (--h2) under the film, and the film and the rim turning through both. Its turning
   square is sized by the height (taller than wide), so it still covers the corners. */
.wb.tall { border-color: transparent; background: none; }   /* the old look's two-colour border and tint (above) give way to the film */
.wb.tall .film { background: linear-gradient(180deg, hsla(var(--h), 92%, 74%, calc(var(--film-a) * .8)) 20%, hsla(var(--h2), 92%, 74%, calc(var(--film-a) * .8)) 80%); }
.wb.tall .spin { width: auto; height: calc(100% + 3em); }
.wb.tall .film .spin { background: conic-gradient(from var(--ang), hsla(var(--h), 95%, 76%, calc(var(--film-a) * .7)) 0 20%, hsla(var(--h2), 95%, 78%, calc(var(--film-a) * .7)) 35% 70%, hsla(var(--h), 95%, 76%, calc(var(--film-a) * .7)) 85%); }
.wb.tall .rim .spin { background: conic-gradient(from var(--ang), hsla(var(--h), 90%, var(--srim-l), var(--srim-a)) 0 20%, hsla(var(--h2), 90%, var(--srim-l), var(--srim-a)) 35% 70%, hsla(var(--h), 90%, var(--srim-l), var(--srim-a)) 85%); }
/* The note on the empty "its" cell (hover or tap): why there is no possessive pronoun for "it" */
.ghost { cursor: help; transition: opacity .2s ease, border-color .2s ease; }
.ghost:hover, .ghost:focus-visible { opacity: .9; border-color: hsla(var(--h), 70%, 60%, .9); outline: none; }
.ghosttip { position: fixed; z-index: 35; width: min(280px, calc(100vw - 20px)); padding: .65em .85em; border-radius: 16px; font-size: .86rem; line-height: 1.4; color: var(--ink); background: var(--bg-a); border: 1.5px solid hsla(285, 70%, 62%, .7); box-shadow: 0 12px 30px var(--shadow); pointer-events: none; }
.ghosttip b { display: block; margin-bottom: .2em; color: hsl(285, 55%, var(--lab-l)); font-weight: 600; }
.ghosttip::after { content: ""; position: absolute; left: var(--ax, 50%); bottom: -7px; width: 12px; height: 12px; margin-left: -6px; background: inherit; border: inherit; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }
.ghosttip.below::after { bottom: auto; top: -7px; border-width: 1.5px 0 0 1.5px; }
.ghosttip.in { animation: pickin .2s cubic-bezier(.2,.9,.3,1.15); }
/* Edge jitter (as in Verb Wheel / Verb Bubbles): while something rises on hover it gets an invisible strip below it
   reaching back past where its bottom edge was, so the cursor on that edge stays "inside" after the lift and it doesn't
   flicker up and down. Only while hovered: a strip that is always there catches the cursor below the edge, then rises
   with the element and loses it (the same jitter, lower down). The strip is the lift + 3px or more, so the springy
   overshoot of the lift never uncovers the edge. Something new that rises on hover needs the same. */
.score, .tile, .tourbtn, .pick { position: relative; }
@media (hover: hover) {
  .tray:not(.locked) .wb:hover:not(.drag)::after, .score:hover::after, .tile:hover::after, .tourbtn:not(.fresh):hover::after,
  .pick:hover::after { content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: -8px; }
  .score:hover::after, .tile:hover::after { bottom: -5px; }
  .tourbtn:not(.fresh):hover::after, .pick:hover::after { bottom: -4px; }
}
/* 50-card: Sentence card: gap, clue marks (u.k, u.ref, .sfx, .lit), translation, feedback and tip, Next, the arrow to the person (.arc), flying particles, toast. */
/* Sentence card */
.card {
  padding-bottom: 46px !important;
  position: relative; max-width: 760px; margin: 22px auto 0; padding: 46px clamp(16px, 4vw, 40px) 20px;
  border-radius: 28px; text-align: center;
  background: var(--dock-bg); border: 1.5px solid var(--dock-line);
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: 0 10px 28px var(--shadow);
  transition: border-color .2s ease, box-shadow .25s ease, transform .28s cubic-bezier(.34,1.56,.64,1);
}
.card.hot { border-color: var(--underline); transform: scale(1.015); box-shadow: 0 14px 34px var(--shadow), 0 0 0 5px hsla(335,80%,65%,.22); }
.card-top { position: absolute; top: 10px; left: 12px; right: 12px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
/* three columns, the outer two equal: the tag in the middle (Second chance, Bonus) sits at the card's true centre, whatever the buttons' widths */
.card-top > #hintbtn { grid-column: 1; justify-self: start; }
.card-top > .again, .card-top > .bgrp { grid-column: 2; }
.card-top > .saygrp { grid-column: 3; justify-self: end; }
.pbtn { display: inline-flex; align-items: center; gap: 5px; font-size: .9rem; font-weight: 500; padding: .45em 1em; border-radius: 999px; border: 1.5px solid var(--dock-line); background: transparent; color: inherit; cursor: pointer; }
.pbtn:hover:not(:disabled) { background: var(--dock-line); }
.pbtn:disabled { opacity: .35; cursor: default; }
.pbtn:focus-visible, .tbtn:focus-visible, .favx:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.pbtn.on { background: var(--ink); color: var(--bg-a); border-color: var(--ink); }
.again { font-size: .75rem; font-weight: 500; padding: .25em .7em; border-radius: 999px; background: var(--bad-bg); }
#qa { animation: pin .3s ease-out; }
@keyframes pin { from { opacity: 0; transform: translateX(22px); } }
.sent { margin: 0; padding-top: 14px; font-size: clamp(1.45rem, 2.6vw + .9rem, 2.35rem); font-weight: 500; line-height: 1.5; text-wrap: balance; }
.gap {
  display: inline-block; min-width: 3.3em; margin: 0 .12em; padding: 0 .35em; line-height: 1.1;   /* short enough to stay clear of the dotted underline on the line above */
  border: 2.5px dashed var(--underline); border-radius: .45em; cursor: pointer;
  transition: background-color .2s ease, transform .28s cubic-bezier(.34,1.56,.64,1);
}
/* while the lines are drawn the gap may open room above or below its line (arcRoom in 18-arc.js): it glides */
.gap.ease { transition: background-color .2s ease, transform .28s cubic-bezier(.34,1.56,.64,1), margin .22s ease; }
.card.hot .gap, .gap.ready { background: hsla(335,80%,65%,.18); transform: scale(1.06); }
.gap.ok, .gap.fix { border-style: solid; border-color: transparent; background: var(--ok-bg); color: var(--ok); font-weight: 600; cursor: default; animation: merge .55s cubic-bezier(.34,1.56,.64,1); }
/* The letters that carry the meaning inside the pink word (de-LA, de-LE) stand out */
.sfx { font-weight: 700; color: var(--underline); }
.pt .lit, .fm .lit { font-style: italic; opacity: .85; }
/* The note stays in one piece (it drops to the next line as a block) but wraps inside the card on phones (from Verb Bubbles) */
.pt .lit { display: inline-block; max-width: 100%; }
.pt .lit b, .fm .lit b { font-weight: 600; color: var(--underline); }
.gapw { white-space: nowrap; }
.gap.ct { margin-right: 0; }   /* ___'m: the contraction joins the word in the gap */
.gap s { color: var(--bad); font-weight: 400; opacity: .8; margin-right: .3em; font-size: .8em; }
@keyframes merge { 0% { transform: scale(.8); } 55% { transform: scale(1.14); } 100% { transform: scale(1); } }
u.k { text-decoration: underline; text-decoration-color: var(--underline); text-decoration-thickness: .09em; text-underline-offset: .2em; text-decoration-skip-ink: none; }
/* In the translation (card and lists) clues are never underlined: time/subject clues are bold and colored,
   the deciding verb is bold pink and pulses, and a meaningful ending (-ria, -rá) gets a soft pink highlight */
.pt u.k, .fm u.k { text-decoration: none; font-weight: 600; color: var(--clue); }
.pt u.k.p, .fm u.k.p { color: var(--underline); font-weight: 700; }
.pt .sfx, .fm .sfx { background: hsla(335,85%,65%,.22); border-radius: .25em; padding: 0 .08em; }
.pt { margin: 12px 0 0; font-size: clamp(.95rem, .6vw + .85rem, 1.12rem); color: color-mix(in srgb, var(--ink) 68%, transparent); text-wrap: balance; }
.pt i { font-style: normal; font-size: .68em; font-weight: 600; letter-spacing: .08em; padding: .15em .5em; border-radius: 999px; border: 1px solid currentColor; margin-right: .5em; vertical-align: .12em; opacity: .8; }
.fb { margin-top: 14px; display: flex; flex-direction: column; justify-content: center; gap: 2px; font-size: 1.02rem; line-height: 1.35; }
.fb .v { font-weight: 600; }
.fb.ok .v { color: var(--ok); } .fb.bad .v { color: var(--bad); }
#hintlbl { display: inline-block; }
/* Header buttons (Guia, Favoritas, Vistas, Tutorial) show their names only where the whole dock fits on one line
   (from Verb Bubbles); narrower, icons only (names in the tooltips) */
@media (min-width: 1100px) { .tourbtn span { display: inline-block; } }
@media (min-width: 601px) and (max-width: 1099px) { .tourbtn span { display: none; } .tourbtn { padding: .5em .6em; } }
.fb .tip { display: inline-block; align-self: center; padding: .2em .8em; border-radius: 1em; background: var(--dock-line); font-weight: 500; }
.fb > * { animation: pup .3s ease-out; }
@keyframes pup { from { opacity: 0; transform: translateY(10px); } }
.nextrow { padding-top: 12px; }
/* The answer area under the translation is closed while the student thinks, and opens when it has something to say */
.more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s cubic-bezier(.2,.8,.3,1); }
.more > div { min-height: 0; overflow: hidden; padding: 0 10px; }
.card.open .more { grid-template-rows: 1fr; }
.card.open .more > div { padding-bottom: 10px; }
/* Only meaningful endings pulse (-rá, -rei, -rão, -ria…); the deciding verb itself is bold pink and still */
u.k.p { display: inline; }
.pt .sfx, .lit .sfx { display: inline-block; animation: cue 1.7s ease-in-out infinite; }
@keyframes cue { 0%, 100% { transform: none; background-color: transparent; } 50% { transform: scale(1.1); background-color: hsla(335,85%,65%,.24); } }
.card.answered .sfx, .list .sfx { animation: none !important; }
.list .sfx { display: inline; }
.cta { font-size: 1rem; font-weight: 600; padding: .6em 1.5em; border: 0; border-radius: 999px; cursor: pointer; color: #fff; background: linear-gradient(135deg, hsl(315,85%,68%), hsl(275,80%,68%)); box-shadow: 0 3px 9px hsla(295,70%,55%,.22); transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease; }
.cta:hover { transform: scale(1.05); box-shadow: 0 4px 12px hsla(295,70%,55%,.3); }
.cta:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.cta.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
.pf { position: fixed; z-index: 25; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at 30% 30%, #fff, hsla(var(--h),85%,75%,.55)); border: 1px solid hsla(var(--h),85%,68%,.85); animation: pfly .7s ease-out forwards; }
@keyframes pfly { from { transform: translate(-50%,-50%) scale(.3); opacity: .95; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1); opacity: 0; } }
.toast { position: fixed; left: 0; right: 0; top: 30%; z-index: 40; text-align: center; font-size: clamp(2.2rem, 8vw, 4rem); font-weight: 600; line-height: 1; color: var(--ink); pointer-events: none; text-shadow: 0 6px 24px var(--shadow); animation: cdpop 1.3s ease-out both; }
@keyframes cdpop { 0% { opacity: 0; transform: scale(.4); } 25% { opacity: 1; transform: scale(1.12); } 75% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.92); } }
/* Who the pronoun stands for: [=…] is underlined like a clue; after the answer a curved line runs from the gap to it,
   with the person's column name (ela, ele…) on it, and the words light up */
u.k.ref { text-decoration-style: dotted; }
.ref.hit { background: hsla(335,85%,65%,.2); border-radius: .2em; box-shadow: 0 0 0 .12em hsla(335,85%,65%,.2); transition: background-color .3s ease; }
.arc { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.arc svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
.arc path { fill: none; stroke: var(--underline); stroke-width: 2.5; stroke-linecap: round; opacity: .85; }
.arc circle { fill: var(--underline); }
.arc.anim circle.end { animation: arcdot .3s .45s cubic-bezier(.34,1.56,.64,1) backwards; transform-box: fill-box; transform-origin: center; }
.arc-lbl { position: absolute; transform: translate(-50%, -50%); padding: .1em .6em .15em; border-radius: 999px; font-size: .8rem; font-weight: 600; line-height: 1.2; white-space: nowrap; color: #fff; background: var(--underline); box-shadow: 0 3px 10px var(--shadow); }
.arc.anim .arc-lbl { animation: arclbl .35s .3s cubic-bezier(.34,1.56,.64,1) backwards; }
@keyframes arcdot { from { transform: scale(0); } }
@keyframes arclbl { from { opacity: 0; transform: translate(-50%, -50%) scale(.5); } }
.fb.bad .v { font-weight: 500; }
/* The noun a possessive adjective goes with ([+…]): underlined and linked under the words in the row's color (--rh on the card, --h in lists) */
u.k.thing { text-decoration-color: hsl(var(--rh, var(--h)), 65%, 52%); }
.thing.hit { background: hsla(var(--rh), 85%, 62%, .22); border-radius: .2em; box-shadow: 0 0 0 .12em hsla(var(--rh), 85%, 62%, .22); transition: background-color .3s ease; }
.arc .thing path { stroke: hsl(var(--rh), 65%, 55%); }
.arc .thing circle { fill: hsl(var(--rh), 65%, 55%); }
.arc.anim .thing circle.end { animation-delay: calc(.45s + var(--d, 0ms)); }
/* Touch screens (phones, tablets): the card's glass blur goes (over the soft background it barely shows, and it made
   every change inside the card, the arrow or the answer, repaint the blur), and the answer area opens at once instead
   of growing (growing moved the whole chart under it every frame); its lines still slide in */
@media (max-width: 640px), (hover: none) {
  .card { -webkit-backdrop-filter: none; backdrop-filter: none; }
  .more { transition: none; }
}
/* a line under the words on the gap's own line: the translation moves down to make room for it (lowLine in 18-arc.js) */
.card.lowline .pt { margin-top: 32px; }
/* 55-bonus: The bonus card (19-bonus.js): its tag, Who's who? (the people and things to click, the pronouns in their job's colour, the pairs' numbers, the tray bubble of the word being asked), Too many names! (the repeated names as gaps), the bonus row on the end card. */
.btag { font-size: .75rem; font-weight: 600; padding: .25em .8em; border-radius: 999px; color: #fff; background: linear-gradient(135deg, hsl(315, 75%, 62%), hsl(275, 70%, 60%)); white-space: nowrap; }
.bgrp { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.bgrp[hidden] { display: none; }
.bhow { font-size: .82rem; font-weight: 500; line-height: 1.2; text-align: left; color: color-mix(in srgb, var(--ink) 75%, transparent); }
body.bonus .cardstar { display: none; }
body.bonus .sent { line-height: 1.7; }

/* Who's who? */
.bc {
  font: inherit; color: inherit; background: none; border: 0; margin: 0; padding: 0 .1em; border-radius: .3em; cursor: pointer;
  text-decoration: underline dotted var(--underline); text-decoration-thickness: .09em; text-underline-offset: .2em; text-decoration-skip-ink: none;
  transition: background-color .2s ease;
}
.bc:hover, .bc:focus-visible { background: hsla(335, 80%, 65%, .16); outline: none; }
.bc:focus-visible { box-shadow: 0 0 0 2px var(--underline); }
body.bonus-done .bc { cursor: default; background: none; }
.bc.hit { animation: bchit 1s ease-out; }
.bc.no { animation: shake .45s ease-in-out, bcno 1s ease-out; }
@keyframes bchit { 0%, 45% { background: var(--ok-bg); } 100% { background: transparent; } }
@keyframes bcno { 0%, 45% { background: var(--bad-bg); } 100% { background: transparent; } }
.bp, .bc { white-space: nowrap; }
.bp { font-weight: 600; color: hsl(var(--h), 60%, var(--lab-l)); padding: 0 .1em; border-radius: .35em; transition: background-color .2s ease, box-shadow .2s ease; }
.bp.now { background: hsla(var(--h), 80%, 62%, .18); box-shadow: 0 0 0 2.5px hsla(var(--h), 75%, 55%, .9); animation: bpnow 1.5s ease-in-out infinite; }
@keyframes bpnow { 50% { box-shadow: 0 0 0 5px hsla(var(--h), 75%, 55%, .3); } }
.bp.bad { text-decoration: underline wavy var(--bad); text-decoration-thickness: .06em; text-underline-offset: .22em; }
/* the pair's number: on the pronoun and on the person or thing it stands for, in the job's colour */
.bn {
  display: inline-grid; place-items: center; min-width: 1.45em; height: 1.45em; margin-left: .12em; padding: 0 .2em; border-radius: 999px;
  font-size: .42em; font-weight: 700; line-height: 1; color: #fff; background: hsl(var(--h), 62%, 50%); vertical-align: 1.1em;
  animation: merge .5s cubic-bezier(.34, 1.56, .64, 1);
}
.bp.bad .bn { box-shadow: 0 0 0 2px var(--bad); }
.tray .wb.who { outline: 3px solid hsla(var(--h), 80%, 58%, .9); outline-offset: 3px; animation: bpnow 1.5s ease-in-out infinite; }
/* Who's who? is answered in the text, not with the chart: the whole tray (legend too) goes grey and still for the card */
.tray { transition: filter .35s ease, opacity .35s ease; }
body.bonus-who .tray { filter: grayscale(1); opacity: .4; pointer-events: none; }
body.bonus-who .tray * { animation-play-state: paused !important; }
body.bonus-who .tray .wb.who { outline: none; }

/* Too many names! the repeated names wait in faint gaps; the one being asked is the gap */
.bslot { min-width: 0; color: color-mix(in srgb, var(--ink) 55%, transparent); font-style: italic; cursor: default; border-color: color-mix(in srgb, var(--underline) 40%, transparent); }
.bslot.now { color: var(--ink); cursor: pointer; border-color: var(--underline); animation: bpnow 1.6s ease-in-out infinite; --h: 335; }
.card.hot .bslot:not(.now) { background: none; transform: none; }
.bslot.ok, .bslot.fix { font-style: normal; }
@media (prefers-reduced-motion: reduce) { .bp.now, .bslot.now, .tray .wb.who { animation: none; } }

/* The end card's bonus row */
.list li.bonli .fe .btag { font-size: .68rem; padding: .15em .6em; margin-right: .25em; vertical-align: .1em; }
/* On a phone there is no room beside the tag: the instruction gets its own line under the card's top row */
@media (max-width: 700px) {
  .bhow { position: absolute; left: 0; right: 0; top: 100%; margin-top: 8px; text-align: center; }
  body.bonus .sent { padding-top: 40px; }
}
/* 60-modals: Pop-up modals (.favmodal / .favcard), sentence lists, Review tabs, phone layout of the second header row. */
/* Modals */
/* Windows (Guia, Favoritas, Vistas, Streaks, end of round): a translucent card over the blurred page, as in Linking Words */
.favmodal { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(20,20,40,.35); -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px); overscroll-behavior: contain; }
.favmodal.show { display: flex; animation: fadein .2s ease; }
@keyframes fadein { from { opacity: 0; } }
@keyframes cardin { from { opacity: 0; transform: scale(.9) translateY(10px); } }

  background: linear-gradient(135deg, var(--lv), var(--lv2)); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); text-shadow: 0 1px 1px rgba(0,0,0,.18); }

/* Favorites: a star in the header, one in the sentence card's bottom-right corner, and one on each saved sentence */
/* One header button for review and favorites: a history arrow with a star inside; the star turns gold once there are favorites */

.saygrp { display: inline-flex; align-items: center; gap: 6px; }

.slowbtn.tour-hl { filter: none; }
.slowbtn.pop { animation: starpop .45s cubic-bezier(.34,1.56,.64,1); }
.cardstar { position: absolute; right: 12px; bottom: 10px; z-index: 2; display: grid; place-items: center; width: 38px; height: 38px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--ink); opacity: .45; cursor: pointer; transition: opacity .2s ease, transform .3s cubic-bezier(.34,1.56,.64,1), background-color .2s ease; }
.cardstar:hover { opacity: .9; background: var(--dock-line); }
.cardstar svg { fill: none; }

.cardstar:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.cardstar.pop, #favbtn.pop { animation: starpop .45s cubic-bezier(.34,1.56,.64,1); }
@keyframes starpop { 0% { transform: scale(1); } 35% { transform: scale(1.45) rotate(-12deg); } 100% { transform: scale(1); } }
.list li { position: relative; }
.list li .lstar { position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: transparent; color: #f5a300; cursor: pointer; }
.list li .lstar svg { fill: none; width: 20px; height: 20px; }
.list li .lstar[aria-pressed="false"] { color: var(--ink); opacity: .45; }
.list li .lstar[aria-pressed="false"]:hover { opacity: .9; }
.list li .lstar[aria-pressed="true"] svg { fill: #f5a300; }

.rk { font-weight: 600; }

.fe { font-size: .85rem; margin-top: 6px; font-weight: 500; }

@media (max-width: 600px) {

}
/* Mastery meters at the top of the Review panel: one bar per job, in the job's color */
.meters { display: grid; gap: 7px; margin: 0 0 12px; padding: 10px 12px 12px; border-radius: 18px; background: var(--fill-mid); border: 1px solid var(--dock-line); }
.mcap { margin: 0 0 2px; font-size: .74rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; opacity: .7; }

.meter > span:first-child { color: hsl(var(--h), 55%, var(--lab-l)); }
.meter .bar { height: 10px; border-radius: 5px; background: var(--dock-line); overflow: hidden; }
.meter .bar i { display: block; width: 0; height: 100%; border-radius: 5px; background: linear-gradient(90deg, hsl(var(--h), 80%, 64%), hsl(calc(var(--h) + 35), 75%, 60%)); transition: width .7s cubic-bezier(.3,1.1,.5,1); }

.meters[hidden], .rtabs[hidden] { display: none; }
/* List rows (Favoritas, Vistas, end card, streaks) are a quiet summary (from Verb Bubbles): no clue underlines (no

   the note's pink key words) keep their colour. The game card keeps all of them. */
.list .ft u.k { text-decoration: none; }
.list .fm { font-size: .84rem; }
.list .fm u.k:not(.p) { color: inherit; font-weight: inherit; }
/* Favoriting (favPop in 22-review.js, from Word Family Bubbles): gold sparks above the windows; the header Favoritas button wobbles */

#favbtn.fav { animation: favwob .45s cubic-bezier(.34,1.56,.64,1); }
@keyframes favwob { 0% { transform: scale(1); } 35% { transform: scale(1.45) rotate(-12deg); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { #favbtn.fav { animation: none; } }
/* 75-guide: The Guide panel (24-guide.js; copied from Verb Bubbles): PT / EN switch, the opening tip, the "Pergunte-se" checklist, section links, the chart, folding cards (jobs, for the curious), word chips in their job's color, the seu / sua trap, Portuguese → English, the most common mistakes. */
.guidecard { max-width: 780px; max-height: 88vh; }

.gd-lang button { appearance: none; cursor: pointer; border: 0; border-radius: 999px; padding: .36em .7em; font-family: inherit; font-size: .74rem; font-weight: 600; letter-spacing: .06em; line-height: 1; color: var(--ink); background: transparent; opacity: .6; touch-action: manipulation; transition: background-color .25s ease, color .25s ease, opacity .25s ease; }
.gd-lang button:hover { opacity: 1; background: var(--dock-line); }
.gd-lang button[aria-pressed="true"] { opacity: 1; color: #fff; background: linear-gradient(135deg, #ff5ea8, #c04dff 55%, #8a5cff); }
.gd-lang button:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }

.gd-a { font-weight: 600; color: hsl(var(--h), 60%, var(--lab-l)); }
/* the opening idea and the checklist */

.gd-tip > span:first-child { flex: none; }
.gd-tip b { color: var(--underline); }
.gd-ask { padding: 12px; border-radius: 20px; background: var(--fill-mid); border: 1px solid var(--dock-line); }
.gd-h { margin: 0 0 10px 4px; font-size: .72rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; opacity: .6; }

@media (max-width: 560px) { .gd-q { grid-template-columns: 1fr; } }
/* section links */

.gd-navb { appearance: none; cursor: pointer; font-family: inherit; font-size: .84rem; font-weight: 600; padding: .4em .95em; border-radius: 999px; color: var(--ink); background: transparent; border: 1.5px solid var(--dock-line); transition: transform .25s cubic-bezier(.34,1.56,.64,1), background-color .2s ease; }
.gd-navb:hover { transform: translateY(-2px); background: var(--dock-line); }

#gd-jobs .gd-u > summary::after { order: 1; }
#gd-jobs .gd-u > summary .gd-cap { order: 2; flex: 1 1 100%; }
/* Phones: the chart's five columns share the card's width (fixed layout, smaller chips and headings) */
@media (max-width: 560px) {
  .gd-tab { table-layout: fixed; }
  .gd-tab th, .gd-tab td { padding: 7px 3px; }
  .gd-tab th:first-child, .gd-tab td:first-child { padding-left: 8px; }
  .gd-tab thead th { font-size: .54rem; letter-spacing: 0; overflow-wrap: anywhere; }
  .gd-tab tbody th { font-size: .78rem; overflow-wrap: anywhere; }
  .gd-tab .gd-w { font-size: .72rem; padding: .12em .42em .16em; }
}

/* a hint's groups (gdHint): one line each, or pills for a plain list (the user's choice, 2026-11-26: no " · ") */
.gd-hint { display: block; margin-top: 6px; font-size: .84rem; line-height: 1.4; }
.gd-hl { display: block; padding-left: 10px; border-left: 2px solid color-mix(in srgb, currentColor 22%, transparent); }
.gd-hl + .gd-hl, .gd-htail { margin-top: 5px; }
.gd-htail { display: block; opacity: .72; }
.gd-cue { opacity: .72; }
.gd-harr { opacity: .45; }
.gd-hex { font-weight: 600; }
.gd-pills { display: flex; flex-wrap: wrap; gap: 5px; }
.gd-pill { padding: 2px 9px; border-radius: 999px; background: color-mix(in srgb, currentColor 9%, transparent); border: 1px solid color-mix(in srgb, currentColor 16%, transparent); }
/* 80-modes: Days-in-a-row badge on the score tile, the Play menu on the "new round" tile, the speed challenge (goal card + 3-2-1 countdown, clock in the progress bar, what hides during it). */
/* 🔥 days in a row, pinned to the score tile's corner */
.score { position: relative; }
.days { position: absolute; top: -9px; right: -12px; padding: .12em .45em; border-radius: 999px; font-size: .72rem; font-weight: 600; line-height: 1.2; white-space: nowrap; color: #6b3200; background: hsl(38, 100%, 78%); box-shadow: 0 2px 8px var(--shadow); }
.days.pop { animation: starpop .45s cubic-bezier(.34,1.56,.64,1); }
/* Play menu */
.playwrap { position: relative; justify-self: end; }
.playmenu { position: absolute; top: calc(100% + 8px); right: 0; z-index: 30; display: flex; flex-direction: column; gap: 4px; width: max-content; min-width: 220px; padding: 6px; border-radius: 20px; background: var(--bg-a); border: 1px solid var(--dock-line); box-shadow: 0 16px 36px var(--shadow); transform-origin: top right; animation: pickin .22s cubic-bezier(.2,.9,.3,1.15); }
.playmenu[hidden] { display: none; }
.playmenu button { appearance: none; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: .6em .85em; border: 0; border-radius: 14px; background: transparent; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.playmenu button:hover, .playmenu button:focus-visible { background: var(--dock-line); outline: none; }
.playmenu b { font-weight: 600; font-size: .98rem; }
.playmenu small { font-size: .78rem; opacity: .7; }
/* Review missed / Favorites with an empty list; the game being played has a pink dot (from Verb Bubbles) */
.playmenu button:disabled { opacity: .45; cursor: default; }
.playmenu button:disabled:hover { background: transparent; }
.playmenu button.cur b::after { content: " ●"; font-size: .6em; vertical-align: .25em; color: var(--underline); }
/* Speed challenge: the progress bar becomes a clock that turns red in the last 10 seconds */
.prog.clock span { font-size: 1.15rem; font-weight: 600; }
.prog.clock .pbar i { background: linear-gradient(90deg, hsl(45,95%,58%), hsl(25,95%,60%)); transition: width .25s linear; }
.prog.urgent span { color: var(--bad); animation: tickpulse 1s ease-in-out infinite; }
.prog.urgent .pbar i { background: hsl(350,85%,60%); }
@keyframes tickpulse { 50% { transform: scale(1.12); } }
.prog.clock span { display: inline-block; }
body.speed #hintbtn, body.speed #nextrow, body.speed #cardstar { visibility: hidden; }
body.speed .score { cursor: default; }
/* Goal card + 3, 2, 1, Go! */
.cdown { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; padding: 16px; background: rgba(20,20,40,.35); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: fadein .2s ease; }
.cdown[hidden] { display: none; }
.cd-card { width: min(380px, 100%); padding: 1.2rem 1.3rem 1.4rem; border-radius: 1.6rem; text-align: center; color: var(--ink); background: var(--bg-a); border: 1px solid var(--dock-line); box-shadow: 0 22px 50px rgba(0,0,0,.3); animation: cardin .3s cubic-bezier(.34,1.56,.64,1); }
.cd-t { margin: 0; font-size: 1.3rem; font-weight: 600; }
.cd-x { margin: .5rem 0 0; font-size: .98rem; line-height: 1.45; opacity: .85; }
.cd-n { display: block; min-height: 1.2em; margin-top: .4rem; font-size: 3.4rem; font-weight: 600; line-height: 1.2; color: var(--underline); }
.cd-n.beat { animation: cdbeat .6s cubic-bezier(.34,1.56,.64,1); }
@keyframes cdbeat { from { opacity: 0; transform: scale(.4); } 60% { opacity: 1; transform: scale(1.15); } }
@media (max-width: 600px) { .playmenu { min-width: 200px; } .days { right: -8px; } }
@media (prefers-reduced-motion: reduce) { .playmenu, .cdown, .cd-card, .cd-n.beat, .prog.urgent span { animation: none; } }
/* 90-scrollbar: Scrollbars as in Verb Bubbles (../bedomodal, 80-scrollbar.css): in the cards that scroll
   (Review, end of round, Streaks, tutorial, language list) a thin glossy pill with the pink-to-purple gradient on a clear
   track; the page itself has none. Chrome / Edge / Safari use the ::-webkit-scrollbar parts; Firefox only takes
   colours, so it gets a thin pink thumb (in @supports, since Chrome would let these override the pill). */
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: transparent; margin: 18px 0; }
::-webkit-scrollbar-thumb {
  border: 3px solid transparent; border-radius: 999px; background-clip: padding-box;
  background-image: linear-gradient(180deg, hsl(315,85%,66%), hsl(275,80%,64%));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45);
}
::-webkit-scrollbar-thumb:hover { background-image: linear-gradient(180deg, hsl(315,90%,60%), hsl(275,85%,58%)); }
::-webkit-scrollbar-thumb:active { border-width: 2px; }
::-webkit-scrollbar-button, ::-webkit-scrollbar-corner { display: none; background: transparent; }
@supports (-moz-appearance: none) {
  * { scrollbar-width: thin; scrollbar-color: hsl(295,82%,66%) transparent; }
}
/* The page itself still scrolls on short screens, but shows no bar (only the cards and lists do). */
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }
</style>

<script>

 Bubbles!","Em cada frase falta um pronome: <b>I<\/b>, <b>me<\/b>, <b>my<\/b>, <b>mine<\/b>… Aqui você aprende quando usar cada um. Este tour leva mais ou menos um minuto."],"read":["Leia a frase","O pronome que falta vai no espaço em branco. A <b>tradução<\/b> logo abaixo mostra o que a frase completa quer dizer."],"clues":["Siga as pistas","As palavras <b>sublinhadas<\/b> mostram de quem a frase fala e o que vem depois do espaço. Na tradução, a palavra que decide a resposta fica em <b>rosa<\/b>: <i>dela<\/i> → her, <i>dele<\/i> → his."],"tray":["A tabela de pronomes","Cada <b>coluna<\/b> é uma pessoa: eu, você, ele, ela, isso (coisa ou animal), nós, eles. Cada <b>cor<\/b> é um trabalho: <b>sujeito<\/b> (I), <b>objeto<\/b> (me), <b>adjetivo possessivo<\/b> (my) e, no A2, <b>pronome possessivo<\/b> (mine). Palavras como <i>you<\/i> e <i>her<\/i> fazem dois trabalhos, por isso ocupam duas fileiras."],"fill":["Preencha o espaço","<b>Arraste<\/b> uma bolha até o espaço ou dê um <b>clique duplo<\/b> nela. No celular, toque <b>duas vezes<\/b> nela, ou toque nela e depois no espaço. Veja:"],"learn":["Aprenda com cada resposta","Uma <b>linha<\/b> liga o pronome à pessoa ou coisa de quem ele fala; no adjetivo possessivo, outra linha, embaixo, liga ao nome que vem com ele (my → car). Embaixo aparece a <b>regra<\/b>, e <b>Listen<\/b> lê a frase em voz alta (a <b>🐢<\/b> deixa a voz mais lenta). Se errar, você vê o porquê, e a frase volta mais tarde na partida."],"hint":["Travou? Peça uma dica","O botão <b>Dica<\/b> deixa acesa só a fileira certa (sujeito, objeto…). Depois é só achar a pessoa."],"score":["Mantenha a sequência","O contador mostra seus acertos <b>seguidos<\/b> e o seu recorde; toque nele para ver suas sequências. O <b>🔥<\/b> conta os dias seguidos em que você praticou. Em <b>new game<\/b> você escolhe uma partida nova ou o <b>desafio de 60 segundos<\/b>."],"bonus":["A 5ª frase é um bônus","No meio de cada partida vem um <b>bônus<\/b>. No <b>A1<\/b> é <b>Quem é quem?<\/b> Os pronomes já estão no texto, e você clica na pessoa ou na coisa de que cada um fala. No <b>A2<\/b> é <b>Nomes demais!<\/b> Um texto repete os nomes o tempo todo, e você troca cada nome repetido por um pronome."],"focus":["Escolha o que praticar","Misture tudo (<b>ALL<\/b>), pratique sujeito e objeto (<b>I / ME<\/b>) ou os possessivos (<b>MY / MINE<\/b>). As outras fileiras saem de cena."],"level":["Seu nível","<b>A1<\/b>: sujeito, objeto e adjetivo possessivo (<i>I, me, my<\/i>). <b>A2<\/b> acrescenta os <b>pronomes possessivos<\/b>: <i>mine, yours, his, hers, ours, theirs<\/i>."],"guide":["Ficou com dúvida? Abra o Guia","No <b>Guia<\/b> estão a tabela inteira, como escolher a palavra certa, a armadilha do <b>seu / sua<\/b> e os erros mais comuns, com exemplos do jogo."],"review":["Frases vistas","Em <b>Vistas<\/b> ficam as <b>últimas 30 frases<\/b> que você respondeu (<b>Recentes<\/b>) e as que você errou (<b>Erros<\/b>). No topo, uma barra por categoria mostra quantas frases você já acerta de primeira. Toque em <b>Praticar estas<\/b> para uma partida com as frases da aba aberta."],"fav":["Guarde suas favoritas","Toque na <b>estrela<\/b> no canto da frase para guardá-la. Elas ficam no botão <b>Favoritas<\/b> lá em cima, onde você também pode praticá-las."],"lang":["Seu idioma","Escolha aqui a sua língua materna. As traduções e este tutorial aparecem nela."],"sound":["Do seu jeito","Dois controles de <b>volume<\/b>: um para os efeitos sonoros, outro para a voz. Toque no alto-falante de novo para silenciar tudo. Escolha também uma <b>cor de fundo<\/b>. Este tour fica sempre a um toque, em <b>TUTORIAL<\/b>."],"final":["Tudo pronto!","Leia a frase, descubra de quem ela fala e coloque o pronome certo no espaço. Boa sorte!"]}},"guide":{"btn":"Guia","title":"Guia","tip":"Escolher entre <b>they<\/b>, <b>them<\/b>, <b>their<\/b> e <b>theirs<\/b> pode ser um desafio no início, mas com prática fica fácil.","askTitle":"Pergunte-se, nesta ordem","ask":[{"q":"A palavra faz a ação?","hint":"Vem antes do verbo: She works here. → sujeito","r":"s"},{"q":"Ela recebe a ação?","hint":"Vem depois do verbo ou de preposições como with ou for: I love her. Come with us. → objeto","r":"o"},{"q":"É de alguém, com um nome logo depois?","hint":"Olhe o dono, não a coisa: dele → his, dela → her","r":"a"},{"q":"É de alguém, sem nome depois?","hint":"é meu, é o seu, é nosso… → pronome possessivo","r":"p","lv":"A2"}],"nav":{"chart":"Tabela","jobs":"Os trabalhos","seu":"seu / sua","map":"Português → inglês","mis":"Erros comuns"},"chartTitle":"A tabela","chartLead":"É a tabela das bolhas: uma coluna por pessoa, uma linha por trabalho. Algumas palavras fazem dois trabalhos (you, it, her).","chartNote":"it não tem pronome possessivo: não existe its sozinho.","person":"pessoa","people":{"I":"eu","you":"você, vocês","he":"ele","she":"ela","it":"coisa, animal","we":"nós, a gente","they":"eles, elas"},"jobsTitle":"Os trabalhos","jobsLead":"Toque num trabalho para ver exemplos do jogo.","jobs":{"s":"Quem faz a ação. Vem antes do verbo: I, you, he, she, it, we, they.","o":"Quem recebe a ação. Vem depois do verbo ou de preposições como with ou for: me, you, him, her, it, us, them.","a":"De quem é, com um nome logo depois: my car, her dog. O dono decide a palavra.","p":"De quem é, sem nome depois (o nome já apareceu): It's mine. Is this yours?"},"seuTitle":"A armadilha do seu / sua","seuLead":"Em português, seu / sua se refere tanto a \"você\" quanto a \"ele\" e \"ela\". Essa associação leva ao erro clássico no inglês: associar your a he, she, it e they na hora de falar. Muito cuidado com esse erro!","mapTitle":"Português → inglês","mapLead":"Coisas que o português diz de um jeito e o inglês de outro.","map":[{"lv":"A1","pt":"Eu vi ele ontem.","en":"I saw him yesterday.","note":"Depois do verbo, ele vira him (objeto)."},{"lv":"A1","pt":"Ele me ligou.","en":"He called me.","note":"Em português o me vem antes do verbo; em inglês, depois."},{"lv":"A1","pt":"Está chovendo.","en":"It's raining.","note":"Toda frase em inglês tem sujeito. Quando não há ninguém, o it entra em cena."},{"lv":"A1","pt":"A gente mora aqui.","en":"We live here.","note":"a gente = nós → we"},{"lv":"A1","pt":"Ela ama a mãe dela.","en":"She loves her mother.","note":"dela → her"},{"lv":"A1","pt":"Escovei os dentes.","en":"I brushed my teeth.","note":"Com partes do corpo, o inglês põe o dono: my teeth, his hand."},{"lv":"A1","pt":"O cachorro abanou o rabo.","en":"The dog wagged its tail.","note":"O dono é um animal → its."},{"lv":"A2","pt":"Esse livro é meu.","en":"This book is mine.","note":"Sem nome depois: mine, não my."},{"lv":"A2","pt":"É o dela.","en":"It's hers.","note":"o dela, sozinho → hers"},{"lv":"A2","pt":"Um amigo meu.","en":"A friend of mine.","note":"Não dá para juntar a e my na frase, então usamos of + pronome possessivo."}],"misTitle":"Erros mais comuns","misLead":"Traduções palavra por palavra que não funcionam. Toque num erro para ver a frase certa.","mistakes":[{"lv":"A1","pt":"Ele comprou o seu primeiro carro.","wrong":"He bought your first car.","right":"He bought his first car.","why":"O carro é dele → his. your refere-se única e exclusivamente a VOCÊ."},{"lv":"A1","pt":"Ela ama ele.","wrong":"She loves he.","right":"She loves him.","why":"Depois do verbo vem o objeto: him."},{"lv":"A1","pt":"Me ajuda!","wrong":"Me help!","right":"Help me!","why":"O objeto vem depois do verbo."},{"lv":"A1","pt":"Está chovendo.","wrong":"Is raining.","right":"It's raining.","why":"A frase precisa de um sujeito: it."},{"lv":"A1","pt":"O Pedro ama a sua mãe.","wrong":"Pedro loves her mother.","right":"Pedro loves his mother.","why":"A mãe é do Pedro (dele) → his. O sua combina com mãe, mas o inglês olha o dono."},{"lv":"A1","pt":"A Laura e o seu irmão.","wrong":"Laura and his brother.","right":"Laura and her brother.","why":"O irmão é da Laura (dela) → her."},{"lv":"A1","pt":"Eles venderam a sua casa.","wrong":"They sold his house.","right":"They sold their house.","why":"A casa é deles → their."},{"lv":"A1","pt":"O cachorro e o seu osso.","wrong":"The dog and it's bone.","right":"The dog and its bone.","why":"its (de uma coisa ou animal) não tem apóstrofo. it's = it is."},{"lv":"A2","pt":"A empresa mudou o seu logotipo.","wrong":"The company changed his logo.","right":"The company changed its logo.","why":"O dono é uma coisa (a empresa) → its."},{"lv":"A2","pt":"Esse carro é meu.","wrong":"This car is my.","right":"This car is mine.","why":"Sem nome depois, use mine."},{"lv":"A2","pt":"É dela.","wrong":"It's her's.","right":"It's hers.","why":"hers, yours, ours e theirs não têm apóstrofo."}],"curTitle":"Para os curiosos","curious":[["you serve para tudo","you é você e vocês, e é sujeito e objeto ao mesmo tempo. your e yours também servem para uma pessoa ou para várias."],["Por que her aparece duas vezes?","her é objeto (I saw her = eu vi ela) e também possessivo (her car = o carro dela). Na tabela é uma bolha só, que ocupa as duas linhas. No A2, his faz o mesmo: his car / it's his."],["it's ou its?","it's = it is (It's cold). its = dele ou dela quando o dono é uma coisa ou um animal (The dog wagged its tail)."],["they para uma pessoa só","Quando não se sabe de quem se está falando, o inglês usa they / them / their / theirs. Ex.: Someone forgot {their} bag. (Alguém esqueceu a bolsa.)"],["Me and him?","Na conversa, muita gente diz Me and him are friends. No inglês padrão, o correto é He and I are friends."],["he ou she para um bicho de estimação?","Quem tem um cachorro ou um gato costuma chamá-lo de he ou she, com carinho: Rex is hungry. He wants his food. Para um animal qualquer, que não conhecemos, use it. Neste jogo, para o bicho de estimação de alguém, it e he / she estão certos."]]}}},"tour":{"ui":{"back":"Back","next":"Next","show":"Show me","play":"Let's play","step":"Step {i} of {n}","tutorial":"Tutorial"},"steps":{"welcome":["Welcome to Pronoun Bubbles!","Each sentence is missing a pronoun: <b>I<\/b>, <b>me<\/b>, <b>my<\/b>, <b>mine<\/b>… Here you learn when to use each one. This tour takes about a minute."],"read":["Read the sentence","The missing pronoun goes in the blank. The <b>translation<\/b> just below shows what the whole sentence means."],"clues":["Follow the clues","The <b>underlined<\/b> words show who the sentence is about and what comes after the blank. In the translation, the word that decides the answer is <b>pink<\/b>, and its key letters pulse: they often tell you whose it is."],"tray":["The pronoun chart","Each <b>column<\/b> is a person: I, you, he, she, it (a thing or an animal), we, they. Each <b>color<\/b> is a job: <b>subject<\/b> (I), <b>object<\/b> (me), <b>possessive adjective<\/b> (my) and, at A2, <b>possessive pronoun<\/b> (mine). Words like <i>you<\/i> and <i>her<\/i> do two jobs, so they fill two rows."],"fill":["Fill the blank","<b>Drag<\/b> a bubble to the blank or <b>double-click<\/b> it. On a phone, tap it <b>twice<\/b>, or tap it and then tap the blank. Watch:"],"learn":["Learn from every answer","A <b>line<\/b> links the pronoun to the person or thing it stands for; for a possessive adjective, a second line underneath links it to its noun (my → car). Below it you see the <b>rule<\/b>, and <b>Listen<\/b> reads the sentence aloud (the <b>🐢<\/b> makes the voice slower). If you get it wrong, you see why, and the sentence comes back later in the round."],"hint":["Stuck? Get a hint","The <b>{hint}<\/b> button keeps only the right row lit (subject, object…). Then you just find the person."],"score":["Keep your streak","The counter shows your correct answers <b>in a row<\/b> and your best; tap it to see your streaks. The <b>🔥<\/b> counts the days in a row you practiced. Under <b>new game<\/b> you can start a new game or the <b>60-second challenge<\/b>."],"bonus":["Sentence 5 is a bonus","Halfway through every round comes a <b>bonus<\/b>. At <b>A1<\/b> it's <b>Who's who?<\/b> The pronouns are already in the text, and you click the person or thing each one stands for. At <b>A2<\/b> it's <b>Too many names!<\/b> A text keeps repeating its names, and you swap each repeated name for a pronoun."],"focus":["Choose what to practice","Mix everything (<b>ALL<\/b>), practice subject and object (<b>I / ME<\/b>) or the possessives (<b>MY / MINE<\/b>). The other rows step aside."],"level":["Your level","<b>A1<\/b>: subject, object and possessive adjective (<i>I, me, my<\/i>). <b>A2<\/b> adds the <b>possessive pronouns<\/b>: <i>mine, yours, his, hers, ours, theirs<\/i>."],"guide":["Not sure? Open the Guide","The <b>Guide<\/b> has the whole chart, how to choose the right word, the <b>seu / sua<\/b> trap and the most common mistakes, with examples from the game."],"review":["Sentences you have seen","In <b>{seen}<\/b> are the <b>last 30 sentences<\/b> you answered (<b>{recent}<\/b>) and the ones you missed (<b>{missed}<\/b>). On top, a bar per category shows how many sentences you get right on the first try. Tap <b>{practice}<\/b> for a round with the sentences of the open tab."],"fav":["Save your favorites","Tap the <b>star<\/b> in the corner of a sentence to save it. They go to the <b>{fav}<\/b> button up top, where you can practice them too."],"lang":["Your language","Choose your native language here. The translations use it."],"sound":["Make it yours","Two <b>volume<\/b> sliders: one for the sound effects, one for the voice. Tap the speaker again to mute everything. Pick a <b>background color<\/b> too. This tour is always one tap away, under <b>TUTORIAL<\/b>."],"final":["All set!","Read the sentence, find who it's about and put the right pronoun in the blank. Good luck!"]}},"guide":{"btn":"Guide","title":"Guide","tip":"Choosing between <b>they<\/b>, <b>them<\/b>, <b>their<\/b> and <b>theirs<\/b> can be a challenge at first, but with practice it gets easy.","askTitle":"Ask yourself, in this order","ask":[{"q":"Does the word do the action?","hint":"It comes before the verb: She works here. → subject","r":"s"},{"q":"Does it receive the action?","hint":"It comes after the verb or after prepositions like with or for: I love her. Come with us. → object","r":"o"},{"q":"Does it belong to someone, with a noun right after it?","hint":"Look at the owner, not the thing: dele → his, dela → her","r":"a"},{"q":"Does it belong to someone, with no noun after it?","hint":"é meu, é o seu, é nosso… → possessive pronoun","r":"p","lv":"A2"}],"nav":{"chart":"Chart","jobs":"The jobs","seu":"seu / sua","map":"Portuguese → English","mis":"Common mistakes"},"chartTitle":"The chart","chartLead":"It is the bubbles' chart: one column per person, one row per job. Some words do two jobs (you, it, her).","chartNote":"it has no possessive pronoun: there is no its on its own.","person":"person","people":{"I":"I","you":"you (one or more)","he":"a man or boy","she":"a woman or girl","it":"a thing, an animal","we":"we","they":"people, things, animals"},"jobsTitle":"The jobs","jobsLead":"Tap a job to see examples from the game.","jobs":{"s":"Who does the action. It comes before the verb: I, you, he, she, it, we, they.","o":"Who receives the action. It comes after the verb or after prepositions like with or for: me, you, him, her, it, us, them.","a":"Whose it is, with a noun right after it: my car, her dog. The owner decides the word.","p":"Whose it is, with no noun after it (the noun came before): It's mine. Is this yours?"},"seuTitle":"The seu / sua trap","seuLead":"In Portuguese, seu / sua can refer to \"você\" as well as to \"ele\" and \"ela\". That link leads to the classic mistake in English: using your for he, she, it and they when speaking. Watch out for this one!","mapTitle":"Portuguese → English","mapLead":"Things Portuguese says one way and English another.","map":[{"lv":"A1","pt":"Eu vi ele ontem.","en":"I saw him yesterday.","note":"After the verb, ele becomes him (object)."},{"lv":"A1","pt":"Ele me ligou.","en":"He called me.","note":"In Portuguese me comes before the verb; in English, after it."},{"lv":"A1","pt":"Está chovendo.","en":"It's raining.","note":"Every English sentence has a subject. When there is nobody, it steps onto the stage."},{"lv":"A1","pt":"A gente mora aqui.","en":"We live here.","note":"a gente = nós → we"},{"lv":"A1","pt":"Ela ama a mãe dela.","en":"She loves her mother.","note":"dela → her"},{"lv":"A1","pt":"Escovei os dentes.","en":"I brushed my teeth.","note":"With parts of the body, English names the owner: my teeth, his hand."},{"lv":"A1","pt":"O cachorro abanou o rabo.","en":"The dog wagged its tail.","note":"The owner is an animal → its."},{"lv":"A2","pt":"Esse livro é meu.","en":"This book is mine.","note":"No noun after it: mine, not my."},{"lv":"A2","pt":"É o dela.","en":"It's hers.","note":"o dela, on its own → hers"},{"lv":"A2","pt":"Um amigo meu.","en":"A friend of mine.","note":"You can't put a and my together, so English uses of + possessive pronoun."}],"misTitle":"Most common mistakes","misLead":"Word-for-word translations that don't work. Tap a mistake to see the right sentence.","mistakes":[{"lv":"A1","pt":"Ele comprou o seu primeiro carro.","wrong":"He bought your first car.","right":"He bought his first car.","why":"The car is his (dele) → his. your refers to YOU and to you only."},{"lv":"A1","pt":"Ela ama ele.","wrong":"She loves he.","right":"She loves him.","why":"After the verb comes the object: him."},{"lv":"A1","pt":"Me ajuda!","wrong":"Me help!","right":"Help me!","why":"The object comes after the verb."},{"lv":"A1","pt":"Está chovendo.","wrong":"Is raining.","right":"It's raining.","why":"The sentence needs a subject: it."},{"lv":"A1","pt":"O Pedro ama a sua mãe.","wrong":"Pedro loves her mother.","right":"Pedro loves his mother.","why":"The mother is Pedro's (dele) → his. Sua agrees with mãe, but English looks at the owner."},{"lv":"A1","pt":"A Laura e o seu irmão.","wrong":"Laura and his brother.","right":"Laura and her brother.","why":"The brother is Laura's (dela) → her."},{"lv":"A1","pt":"Eles venderam a sua casa.","wrong":"They sold his house.","right":"They sold their house.","why":"The house is theirs (deles) → their."},{"lv":"A1","pt":"O cachorro e o seu osso.","wrong":"The dog and it's bone.","right":"The dog and its bone.","why":"its (a thing's or an animal's) has no apostrophe. it's = it is."},{"lv":"A2","pt":"A empresa mudou o seu logotipo.","wrong":"The company changed his logo.","right":"The company changed its logo.","why":"The owner is a thing (the company) → its."},{"lv":"A2","pt":"Esse carro é meu.","wrong":"This car is my.","right":"This car is mine.","why":"With no noun after it, use mine."},{"lv":"A2","pt":"É dela.","wrong":"It's her's.","right":"It's hers.","why":"hers, yours, ours and theirs have no apostrophe."}],"curTitle":"For the curious","curious":[["you does it all","you is você and vocês, and it is subject and object at once. your and yours also work for one person or for many."],["Why does her show up twice?","her is an object (I saw her = eu vi ela) and a possessive too (her car = o carro dela). In the chart it is one bubble across both rows. At A2, his does the same: his car / it's his."],["it's or its?","it's = it is (It's cold). its = dele or dela when the owner is a thing or an animal (The dog wagged its tail)."],["they for one person","When you don't know who you are talking about, English uses they / them / their / theirs. E.g. Someone forgot {their} bag. (Alguém esqueceu a bolsa.)"],["Me and him?","In conversation, many people say Me and him are friends. In standard English, the correct form is He and I are friends."],["he or she for a pet?","People with a dog or a cat usually call it he or she, fondly: Rex is hungry. He wants his food. For any animal we don't know, use it. In this game, for a family pet, it and he / she are both right."]]},"bonus":{"who":[{"t":"[Ana] has [a brother]. {He>a brother} is ten, and {she>Ana} plays with {him>a brother} every day.","tr":{"pt":"A Ana tem um irmão. Ele tem dez anos, e ela brinca com ele todo dia."}},{"t":"[Pedro] calls {his>Pedro} [grandma] on Sundays. {She>grandma} loves {him>Pedro} very much.","tr":{"pt":"O Pedro liga para a avó dele aos domingos. Ela ama muito ele."}},{"t":"[Maria] and [Tom] are at school. {Her:a>Maria} bag is red, and {his>Tom} bag is blue.","tr":{"pt":"A Maria e o Tom estão na escola. A mochila dela é vermelha, e a mochila dele é azul."}},{"t":"[The dog] is in [the garden]. {It:s>The dog} is playing with {its>The dog} [ball].","tr":{"pt":"O cachorro está no jardim. Ele está brincando com a bola dele."}},{"t":"[My mom] and [my dad] work a lot. {She>My mom} is a nurse, and {he>my dad} is a teacher.","tr":{"pt":"Minha mãe e meu pai trabalham muito. Ela é enfermeira, e ele é professor."}},{"t":"[Lucas] has [a cat]. {He>Lucas} loves {it:o>a cat}, and {it:s>a cat} sleeps on {his>Lucas} [bed].","tr":{"pt":"O Lucas tem um gato. Ele adora o gato, e o gato dorme na cama dele."}},{"t":"[Julia] and [Leo] are my friends. I call {her:o>Julia} every day, and I see {him>Leo} at school.","tr":{"pt":"A Julia e o Leo são meus amigos. Eu ligo para ela todo dia, e vejo ele na escola."}},{"t":"[The phone] is on [the table]. Can you give {it:o>The phone} to [Grandma]? {She>Grandma} needs {it:o>The phone}.","tr":{"pt":"O celular está em cima da mesa. Você pode dar ele para a vovó? Ela precisa dele."}},{"t":"[Sofia] lives with {her:a>Sofia} [grandparents]. {They>grandparents} are very kind.","tr":{"pt":"A Sofia mora com os avós dela. Eles são muito gentis."}},{"t":"[Carlos and Ana] have [a new car]. {It:s>a new car} is red. {They>Carlos and Ana} love {it:o>a new car}.","tr":{"pt":"O Carlos e a Ana têm um carro novo. Ele é vermelho. Eles adoram o carro."}},{"t":"[My sister and I] have [a dog]. {We>My sister and I} walk {it:o>a dog} every morning.","tr":{"pt":"Eu e minha irmã temos um cachorro. A gente passeia com ele toda manhã."}},{"t":"[Tom] is at [Ana]'s house. {He>Tom} is playing with {her:a>Ana} [cat].","tr":{"pt":"O Tom está na casa da Ana. Ele está brincando com o gato dela."}},{"t":"[Maria] loves {her:a>Maria} [dad]. {He>dad} is very funny.","tr":{"pt":"A Maria ama o pai dela. Ele é muito engraçado."}},{"t":"[Pedro] and {his>Pedro} [sister] are at the park. {She>sister} is six.","tr":{"pt":"O Pedro e a irmã dele estão no parque. Ela tem seis anos."}},{"t":"[The children] are in [the park]. {They>The children} are playing with {their>The children} [ball].","tr":{"pt":"As crianças estão no parque. Elas estão brincando com a bola delas."}},{"t":"[Ana] and [Pedro] are at home. {His>Pedro} room is small, but {her:a>Ana} room is big.","tr":{"pt":"A Ana e o Pedro estão em casa. O quarto dele é pequeno, mas o quarto dela é grande."}},{"t":"[The cat] is on [the sofa]. {Its>The cat} [eyes] are green.","tr":{"pt":"O gato está no sofá. Os olhos dele são verdes."}},{"t":"[Mr. and Mrs. Lima] live next to [Ana]. {Their>Mr. and Mrs. Lima} [house] is blue, and {her:a>Ana} house is white.","tr":{"pt":"O Sr. e a Sra. Lima moram ao lado da Ana. A casa deles é azul, e a casa dela é branca."}},{"t":"[Leo] is new at [school]. {He>Leo} doesn't know [the other kids], and {they>the other kids} don't know {him>Leo}.","tr":{"pt":"O Leo é novo na escola. Ele não conhece as outras crianças, e elas não conhecem ele."}},{"t":"Look at [the birds] in [the tree]! {They>the birds} are singing. Can you see {them>the birds}?","tr":{"pt":"Olha os passarinhos na árvore! Eles estão cantando. Você está vendo eles?"}},{"t":"[My brother and I] go to school with [Grandpa]. {He>Grandpa} takes {us>My brother and I} in {his>Grandpa} [car].","tr":{"pt":"Eu e meu irmão vamos para a escola com o vovô. Ele leva a gente no carro dele."}},{"t":"[Tom] has [a new bike]. {Its>a new bike} [wheels] are red, and {his>Tom} [helmet] is blue.","tr":{"pt":"O Tom tem uma bicicleta nova. As rodas dela são vermelhas, e o capacete dele é azul."}}],"names":[{"t":"[Ana] is my best friend. {Ana|she} lives near my house. I see {Ana|her:o} every day, and I love {Ana's|her:a} dog.","tr":{"pt":"A Ana é minha melhor amiga. Ela mora perto da minha casa. Eu vejo ela todo dia, e adoro o cachorro dela."}},{"t":"[Pedro] has a sister. {Pedro's|his:a} sister is called [Bia]. {Bia|she} is seven, and {Pedro|he} plays with {Bia|her:o} after school.","tr":{"pt":"O Pedro tem uma irmã. A irmã dele se chama Bia. Ela tem sete anos, e ele brinca com ela depois da aula."}},{"t":"[My grandparents] live on a farm. {My grandparents|they} have a lot of animals. {My grandparents'|their} house is old, and I visit {my grandparents|them} every summer.","tr":{"pt":"Meus avós moram numa fazenda. Eles têm muitos animais. A casa deles é velha, e eu visito eles todo verão."}},{"t":"I have [a new phone]. {The phone|it:s} is black. {The phone's|its} camera is great, and I use {the phone|it:o} every day.","tr":{"pt":"Eu tenho um celular novo. Ele é preto. A câmera dele é ótima, e eu uso ele todo dia."}},{"t":"— Is this [Maria]'s bag? — Yes, it's {Maria's|hers}. — And is that one [Tom]'s? — No, it isn't {Tom's|his:p}. {Tom's|his:a} bag is black.","tr":{"pt":"— Essa mochila é da Maria? — Sim, é dela. — E aquela é do Tom? — Não, não é dele. A mochila dele é preta."}},{"t":"[My brother and I] love football. {My brother and I|we} play every Saturday, and Dad always watches {my brother and me|us}.","tr":{"pt":"Eu e meu irmão adoramos futebol. A gente joga todo sábado, e o papai sempre assiste a gente."}},{"t":"[Mrs. Costa] is our teacher. {Mrs. Costa|she} is from Recife. {Mrs. Costa's|her:a} classes are fun, and all the students like {Mrs. Costa|her:o}.","tr":{"pt":"A Sra. Costa é nossa professora. Ela é de Recife. As aulas dela são divertidas, e todos os alunos gostam dela."}},{"t":"[Carlos] loves cooking. {Carlos|he} makes dinner for {Carlos's|his:a} wife every night. She loves {Carlos's|his:a} pasta.","tr":{"pt":"O Carlos adora cozinhar. Ele faz o jantar para a esposa dele toda noite. Ela adora o macarrão dele."}},{"t":"[Julia] has a new job. {Julia's|her:a} office is in the city center. {Julia|she} goes there by bus, and {Julia's|her:a} boss is very nice.","tr":{"pt":"A Julia tem um emprego novo. O escritório dela fica no centro. Ela vai de ônibus, e o chefe dela é muito legal."}},{"t":"[The company] has a new logo. {The company's|its} old logo was blue. {The company|it:s} sells shoes online.","tr":{"pt":"A empresa tem um logotipo novo. O logotipo antigo dela era azul. Ela vende sapatos pela internet."}},{"t":"[My neighbors] sold {my neighbors'|their} house. {My neighbors|they} are moving to Portugal. I'm going to miss {my neighbors|them}.","tr":{"pt":"Meus vizinhos venderam a casa deles. Eles vão se mudar para Portugal. Vou sentir falta deles."}},{"t":"[Lucas] and [Bia] have new bikes. The red bike is {Lucas's|his:p}, and the green one is {Bia's|hers}. {Bia's|her:a} bike is faster.","tr":{"pt":"O Lucas e a Bia têm bicicletas novas. A bicicleta vermelha é dele, e a verde é dela. A bicicleta dela é mais rápida."}},{"t":"My cousin has [a cat]. {The cat|it/she:s} is white. {The cat's|its/her:a} eyes are blue, and my cousin loves {the cat|it/her:o}.","tr":{"pt":"Minha prima tem uma gata. Ela é branca. Os olhos dela são azuis, e minha prima adora ela."}},{"t":"[Paulo and Rita] have two kids. {Paulo and Rita's|their} kids go to my school, and I often see {Paulo and Rita|them} at the park. {Paulo and Rita|they} are very friendly.","tr":{"pt":"O Paulo e a Rita têm dois filhos. Os filhos deles estudam na minha escola, e eu sempre vejo eles no parque. Eles são muito simpáticos."}},{"t":"[My sister] and I share a room. The big bed is {my sister's|hers}, and the small one is mine. {My sister|she} sleeps a lot!","tr":{"pt":"Eu e minha irmã dividimos um quarto. A cama grande é dela, e a pequena é minha. Ela dorme muito!"}},{"t":"[Leo and Bia] have a big garden. The garden is {Leo and Bia's|theirs}, but {Leo and Bia|they} let us play in it.","tr":{"pt":"O Leo e a Bia têm um jardim grande. O jardim é deles, mas eles deixam a gente brincar nele."}},{"t"
