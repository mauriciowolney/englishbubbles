eason and the result swap places: as if not sleeping made the noise.","whyPt":"Causa e consequência trocam de lugar: como se não dormir fizesse o barulho."},{"en":"It was noisy, [but] I couldn't sleep.","why":"*But* shows a surprise, but nobody is surprised they can't sleep with noise.","whyPt":"*But* mostra uma surpresa, mas ninguém se surpreende de não dormir com barulho."}]},{"id":"a2-s13","s":"I waited at the station [until] the train arrived.","pt":"Esperei na estação até o trem chegar.","o":[{"en":"I stopped waiting [when] the train arrived.","why":"Same message: you waited, and the wait ended when the train came.","whyPt":"Mesma mensagem: você esperou, e a espera acabou quando o trem chegou."},{"en":"I waited at the station [after] the train arrived.","why":"Now you started waiting after the train came, as if you missed it.","whyPt":"Agora você começou a esperar depois que o trem chegou, como se tivesse perdido."},{"en":"I waited at the station [because] the train arrived.","why":"*Because* gives a reason: the arriving train can't be the reason you waited.","whyPt":"*Because* dá uma causa: o trem chegando não pode ser o motivo da espera."}]},{"id":"a2-s14","s":"You can't go into the museum [if] you don't have a ticket.","pt":"Você não pode entrar no museu se não tiver ingresso.","o":[{"en":"You need a ticket [to] go into the museum.","why":"Same message: the ticket is what you need to go in.","whyPt":"Mesma mensagem: o ingresso é o que você precisa para entrar."},{"en":"You can go into the museum [because] you don't have a ticket.","why":"Now having no ticket is the reason you can go in!","whyPt":"Agora não ter ingresso é o motivo para poder entrar!"},{"en":"You can't go into the museum, [and] you don't have a ticket.","why":"*And* just puts two facts together. There's no rule any more: the ticket isn't the condition.","whyPt":"*And* só junta dois fatos. Não existe mais uma regra: o ingresso deixa de ser a condição."}]},{"id":"a2-s15","s":"She learned English [because of] her job.","pt":"Ela aprendeu inglês por causa do trabalho.","o":[{"en":"She learned English [because] she needed it for her job.","why":"Same message: the job is still the reason.","whyPt":"Mesma mensagem: o trabalho continua sendo o motivo."},{"en":"She learned English, [so] she needed it for her job.","why":"Reason and result swap places: now learning English made her need it.","whyPt":"Causa e consequência trocam de lugar: agora aprender inglês fez ela precisar dele."},{"en":"She learned English [after] her job.","why":"*After* is about time: she learned English when the job was over, not because of it.","whyPt":"*After* é sobre tempo: ela aprendeu inglês depois do trabalho, não por causa dele."}]},{"id":"a2-s16","s":"I read a book [before] I go to sleep.","pt":"Eu leio um livro antes de dormir.","o":[{"en":"I go to sleep [after] I read a book.","why":"Same message: first the book, then sleep.","whyPt":"Mesma mensagem: primeiro o livro, depois dormir."},{"en":"I read a book [after] I go to sleep.","why":"The order is the opposite: reading while you're asleep?","whyPt":"A ordem fica ao contrário: ler dormindo?"},{"en":"I read a book [because] I go to sleep.","why":"Now going to sleep is the reason for reading, not the next step.","whyPt":"Agora dormir é o motivo para ler, e não o passo seguinte."}]},{"id":"a2-s17","s":"It was cold, [so] we stayed inside.","pt":"Estava frio, então ficamos dentro de casa.","o":[{"en":"It was cold. [That's why] we stayed inside.","why":"Same message: the cold is the reason, staying inside is the result.","whyPt":"Mesma mensagem: o frio é o motivo, ficar em casa é a consequência."},{"en":"We stayed inside. [That's why] it was cold.","why":"Reason and result swap places: staying inside made it cold!","whyPt":"Causa e consequência trocam de lugar: ficar em casa fez esfriar!"},{"en":"It was cold, [but] we stayed inside.","why":"*But* shows a surprise, as if staying inside on a cold day were strange.","whyPt":"*But* mostra uma surpresa, como se ficar em casa num dia frio fosse estranho."}]},{"id":"a2-s18","s":"[If] you're tired, go to bed.","pt":"Se você estiver cansado, vá dormir.","o":[{"en":"Go to bed [if] you're tired.","why":"Same message: only the order of the two parts changes.","whyPt":"Mesma mensagem: só a ordem das duas partes muda."},{"en":"Go to bed [because] you're tired.","why":"*Because* says you *are* tired: it's a fact now, not a maybe.","whyPt":"*Because* diz que você *está* cansado: agora é um fato, não uma possibilidade."},{"en":"[When] you go to bed, you're tired.","why":"The parts swap: now it says how you feel at bedtime. It isn't advice any more.","whyPt":"As partes trocam: agora diz como você se sente na hora de dormir. Deixa de ser um conselho."}]},{"id":"a2-s19","s":"I'll wait here [until] you come back.","pt":"Vou esperar aqui até você voltar.","o":[{"en":"I won't leave [before] you come back.","why":"Same message: I stay here, and I leave only when you're back.","whyPt":"Mesma mensagem: eu fico aqui e só saio quando você voltar."},{"en":"I'll wait here [after] you come back.","why":"Now the waiting starts when you come back, so you find nobody here!","whyPt":"Agora a espera começa quando você volta, então você não encontra ninguém!"},{"en":"I'll wait here [because] you come back.","why":"*Because* makes your return the reason for waiting, not the end of it.","whyPt":"*Because* transforma a sua volta no motivo da espera, e não no fim dela."}]},{"id":"a2-s20","s":"Many fruits, [like] mangoes and papayas, grow in Brazil.","pt":"Muitas frutas, como manga e mamão, crescem no Brasil.","o":[{"en":"Many fruits grow in Brazil, [for example] mangoes and papayas.","why":"Same message: mangoes and papayas are examples of those fruits.","whyPt":"Mesma mensagem: manga e mamão são exemplos dessas frutas."},{"en":"Many fruits look [like] mangoes and papayas.","why":"Here *like* compares: the fruits are similar to mangoes, not examples of fruits from Brazil.","whyPt":"Aqui *like* compara: as frutas parecem manga, e não são exemplos de frutas do Brasil."},{"en":"Mangoes and papayas grow in Brazil, [but] many fruits don't.","why":"*But* adds a contrast and a new idea: now many fruits don't grow there.","whyPt":"*But* traz um contraste e uma ideia nova: agora muitas frutas não crescem lá."}]},{"id":"a2-s21","s":"He went to the store [to] buy some milk.","pt":"Ele foi ao mercado para comprar leite.","o":[{"en":"He wanted to buy some milk, [so] he went to the store.","why":"Same message: buying milk is the purpose of the trip.","whyPt":"Mesma mensagem: comprar leite é o objetivo da ida."},{"en":"He went to the store [because] he bought some milk.","why":"Now buying milk already happened, and it's the reason for going. That doesn't work.","whyPt":"Agora ele já comprou o leite, e isso é o motivo de ir. Não faz sentido."},{"en":"He bought some milk. [Then] he went to the store.","why":"The order changes: he has the milk before he goes to the store.","whyPt":"A ordem muda: ele tem o leite antes de ir ao mercado."}]},{"id":"a2-s22","s":"[After] lunch, we went for a walk.","pt":"Depois do almoço, fomos dar uma volta.","o":[{"en":"We had lunch. [Then] we went for a walk.","why":"Same message: first lunch, then the walk.","whyPt":"Mesma mensagem: primeiro o almoço, depois a caminhada."},{"en":"[Before] lunch, we went for a walk.","why":"The order is the opposite: the walk comes first.","whyPt":"A ordem fica ao contrário: a caminhada vem primeiro."},{"en":"We went for a walk [because of] lunch.","why":"Now lunch is the reason for the walk, not the time it happened.","whyPt":"Agora o almoço é o motivo da caminhada, e não o momento em que ela aconteceu."}]},{"id":"a2-s23","s":"[When] the movie ended, we went home.","pt":"Quando o filme acabou, fomos para casa.","o":[{"en":"We went home [after] the movie ended.","why":"Same message: first the end of the movie, then home.","whyPt":"Mesma mensagem: primeiro o fim do filme, depois para casa."},{"en":"We went home [before] the movie ended.","why":"Now we left in the middle of the movie.","whyPt":"Agora a gente saiu no meio do filme."},{"en":"The movie ended [because] we went home.","why":"Reason and result swap places: our leaving made the movie end!","whyPt":"Causa e consequência trocam de lugar: a nossa saída fez o filme acabar!"}]},{"id":"a2-s24","s":"I study English [because] I want to travel.","pt":"Eu estudo inglês porque quero viajar.","o":[{"en":"I want to travel. [That's why] I study English.","why":"Same message: traveling is the reason, studying is the result.","whyPt":"Mesma mensagem: viajar é o motivo, estudar é a consequência."},{"en":"I study English. [That's why] I want to travel.","why":"Reason and result swap places: now studying makes me want to travel.","whyPt":"Causa e consequência trocam de lugar: agora estudar me faz querer viajar."},{"en":"I study English, [but] I want to travel.","why":"*But* shows a surprise, as if studying English and traveling didn't go together.","whyPt":"*But* mostra uma surpresa, como se estudar inglês e viajar não combinassem."}]}],"B1":[{"id":"b1-s01","s":"[Although] it was raining, we went for a walk.","pt":"Embora estivesse chovendo, fomos dar uma volta.","o":[{"en":"It was raining. [However], we went for a walk.","why":"Same message: *however* starts a new sentence, but it shows the same surprise.","whyPt":"Mesma mensagem: *however* começa uma frase nova, mas mostra a mesma surpresa."},{"en":"It was raining, [so] we went for a walk.","why":"*So* makes the walk a result of the rain, as if rain were a reason to walk.","whyPt":"*So* transforma o passeio em consequência da chuva, como se chuva fosse motivo para passear."},{"en":"We went for a walk [because] it was raining.","why":"*Because* makes the rain the reason for the walk. The first sentence says you went in spite of the rain.","whyPt":"*Because* faz da chuva o motivo do passeio. A primeira frase diz que vocês foram apesar da chuva."}]},{"id":"b1-s02","s":"[Despite] the traffic, we arrived on time.","pt":"Apesar do trânsito, chegamos na hora.","o":[{"en":"We arrived on time, [even though] the traffic was bad.","why":"Same message: *even though* + a full sentence shows the same surprise as *despite* + a noun.","whyPt":"Mesma mensagem: *even though* + frase completa mostra a mesma surpresa que *despite* + substantivo."},{"en":"We arrived on time [because of] the traffic.","why":"*Because of* makes the traffic the reason you were on time, which makes no sense.","whyPt":"*Because of* faz do trânsito o motivo de chegarem na hora, o que não faz sentido."},{"en":"The traffic was bad, [so] we arrived late.","why":"A different story: here you were late. In the first sentence you were on time.","whyPt":"Outra história: aqui vocês se atrasaram. Na primeira frase, chegaram na hora."}]},{"id":"b1-s03","s":"You can't come in [unless] you have a ticket.","pt":"Você não pode entrar a não ser que tenha ingresso.","o":[{"en":"[If] you don't have a ticket, you can't come in.","why":"Same message: *unless* = if… not.","whyPt":"Mesma mensagem: *unless* = se… não."},{"en":"[If] you have a ticket, you can't come in.","why":"The *not* is missing: now the people with tickets stay outside!","whyPt":"Falta o *not*: agora quem tem ingresso fica de fora!"},{"en":"You can't come in [because] you have a ticket.","why":"*Because* gives a reason: having a ticket would be why you can't come in.","whyPt":"*Because* dá uma causa: ter ingresso seria o motivo de não poder entrar."}]},{"id":"b1-s04","s":"I'll call you [as soon as] I land.","pt":"Te ligo assim que eu pousar.","o":[{"en":"[When] I land, I'll call you right away.","why":"Same message: *as soon as* = when, right away.","whyPt":"Mesma mensagem: *as soon as* = quando, imediatamente."},{"en":"I'll call you [before] I land.","why":"Now the call comes first, while you're still in the air.","whyPt":"Agora a ligação vem antes, ainda no avião."},{"en":"I'll call you [until] I land.","why":"*Until* means up to that moment: you'd keep calling during the whole flight.","whyPt":"*Until* significa até aquele momento: você ficaria ligando o voo todo."}]},{"id":"b1-s05","s":"She saved money [so that] she could travel.","pt":"Ela economizou dinheiro para poder viajar.","o":[{"en":"She saved money [in order to] travel.","why":"Same message: *in order to* + a verb gives the same purpose as *so that* + a sentence.","whyPt":"Mesma mensagem: *in order to* + verbo dá a mesma finalidade que *so that* + frase."},{"en":"She saved money [because] she traveled.","why":"*Because* makes the trip the reason, as if traveling made her save. The trip is the goal, not the cause.","whyPt":"*Because* faz da viagem a causa, como se viajar a fizesse economizar. A viagem é o objetivo, não a causa."},{"en":"She traveled, [so] she saved money.","why":"Now saving money is a result of the trip: the opposite of the first sentence.","whyPt":"Agora economizar é consequência da viagem: o contrário da primeira frase."}]},{"id":"b1-s06","s":"I love the city, [while] my wife prefers the countryside.","pt":"Eu amo a cidade, enquanto a minha esposa prefere o interior.","o":[{"en":"My wife prefers the countryside. [On the other hand], I love the city.","why":"Same message: two different tastes side by side.","whyPt":"Mesma mensagem: dois gostos diferentes lado a lado."},{"en":"I love the city [because] my wife prefers the countryside.","why":"*Because* makes her taste the reason for yours. The first sentence only compares them.","whyPt":"*Because* faz do gosto dela a causa do seu. A primeira frase só compara os dois."},{"en":"My wife prefers the countryside, [so] I love the city.","why":"*So* makes your love of the city a result of her taste. The first sentence only compares them.","whyPt":"*So* faz do seu gosto uma consequência do dela. A primeira frase só compara os dois."}]},{"id":"b1-s07","s":"Take a jacket [in case] it gets cold.","pt":"Leve uma jaqueta, caso esfrie.","o":[{"en":"It might get cold, [so] take a jacket.","why":"Same message: you take the jacket now, just to be safe.","whyPt":"Mesma mensagem: você leva a jaqueta agora, por precaução."},{"en":"Take a jacket [if] it gets cold.","why":"With *if*, you take the jacket only after it gets cold. *In case* means you take it now, just to be safe.","whyPt":"Com *if*, você só leva a jaqueta depois que esfriar. *In case* significa levar agora, por precaução."},{"en":"Take a jacket [because] it's cold.","why":"Now it's already cold. *In case* means it might get cold later.","whyPt":"Agora já está frio. *In case* significa que pode esfriar depois."}]},{"id":"b1-s08","s":"[During] the flight, I watched three movies.","pt":"Durante o voo, assisti a três filmes.","o":[{"en":"[While] I was on the plane, I watched three movies.","why":"Same message: *while* + a sentence = *during* + a noun.","whyPt":"Mesma mensagem: *while* + frase = *during* + substantivo."},{"en":"[After] the flight, I watched three movies.","why":"Now the movies come after the flight, not during it.","whyPt":"Agora os filmes vêm depois do voo, não durante."},{"en":"[Before] I got on the plane, I watched three movies.","why":"Now the movies come before the flight.","whyPt":"Agora os filmes vêm antes do voo."}]},{"id":"b1-s09","s":"[Since] you're here, can you help me with this box?","pt":"Já que você está aqui, pode me ajudar com esta caixa?","o":[{"en":"You're here, [so] can you help me with this box?","why":"Same message: you know they're here, and that's the reason you ask.","whyPt":"Mesma mensagem: você sabe que a pessoa está aqui, e esse é o motivo do pedido."},{"en":"[If] you're here, can you help me with this box?","why":"With *if*, you're not sure they're there. *Since* says you know they are: it's the reason.","whyPt":"Com *if*, você não tem certeza de que a pessoa está ali. *Since* diz que você sabe: é a causa."},{"en":"[Although] you're here, can you help me with this box?","why":"*Although* shows a surprise, as if being here made helping strange.","whyPt":"*Although* mostra uma surpresa, como se estar ali tornasse estranho ajudar."}]},{"id":"b1-s10","s":"We walked [instead of] taking the bus.","pt":"Fomos a pé em vez de pegar o ônibus.","o":[{"en":"We didn't take the bus. [Instead], we walked.","why":"Same message: no bus, just walking.","whyPt":"Mesma mensagem: nada de ônibus, só a pé."},{"en":"We took the bus. [Then] we walked.","why":"Now you did both, one after the other. *Instead of* means only one of them.","whyPt":"Agora vocês fizeram as duas coisas, uma depois da outra. *Instead of* significa só uma."},{"en":"We walked [as well as] taking the bus.","why":"*As well as* adds: you did both. *Instead of* means you didn't take the bus.","whyPt":"*As well as* acrescenta: vocês fizeram as duas. *Instead of* significa que não pegaram o ônibus."}]},{"id":"b1-s11","s":"The hotel was expensive. [Even so], we stayed there again.","pt":"O hotel era caro. Mesmo assim, ficamos lá de novo.","o":[{"en":"[Although] the hotel was expensive, we stayed there again.","why":"Same message: the same surprise, in one sentence.","whyPt":"Mesma mensagem: a mesma surpresa, numa frase só."},{"en":"The hotel was expensive, [so] we stayed there again.","why":"*So* makes the price a reason to go back, as if expensive were a good thing.","whyPt":"*So* faz do preço um motivo para voltar, como se caro fosse bom."},{"en":"We stayed there again [because] the hotel was expensive.","why":"*Because* makes the price the reason you went back. The first sentence says you went back in spite of it.","whyPt":"*Because* faz do preço o motivo da volta. A primeira frase diz que vocês voltaram apesar dele."}]},{"id":"b1-s12","s":"[Once] you finish, you can go home.","pt":"Depois que terminar, pode ir para casa.","o":[{"en":"You can go home [after] you finish.","why":"Same message: *once* = after, as soon as.","whyPt":"Mesma mensagem: *once* = depois que, assim que."},{"en":"You can go home [before] you finish.","why":"Now you can leave before the work is done: the opposite.","whyPt":"Agora dá para sair antes de terminar: o contrário."},{"en":"You can go home [unless] you finish.","why":"*Unless* = if… not: you could go home only if you *don't* finish!","whyPt":"*Unless* = se… não: você só poderia ir para casa se *não* terminasse!"}]},{"id":"b1-s13","s":"My brother likes spicy food. [In contrast], I can't eat anything hot.","pt":"Meu irmão gosta de comida apimentada. Já eu não consigo comer nada picante.","o":[{"en":"[Unlike] my brother, I can't eat spicy food.","why":"Same message: *unlike* + a noun shows the same difference.","whyPt":"Mesma mensagem: *unlike* + substantivo mostra a mesma diferença."},{"en":"[Like] my brother, I can't eat spicy food.","why":"*Like* makes you similar: now neither of you eats spicy food.","whyPt":"*Like* torna vocês parecidos: agora nenhum dos dois come comida apimentada."},{"en":"My brother likes spicy food [because] I can't eat anything hot.","why":"*Because* makes your problem the reason for his taste. The first sentence only compares you.","whyPt":"*Because* faz do seu problema a causa do gosto dele. A primeira frase só compara vocês."}]},{"id":"b1-s14","s":"[Even though] she was tired, she finished the report.","pt":"Mesmo cansada, ela terminou o relatório.","o":[{"en":"She was tired. [However], she finished the report.","why":"Same message: finishing is a surprise when you're tired.","whyPt":"Mesma mensagem: terminar é uma surpresa quando se está cansada."},{"en":"She was tired, [so] she finished the report.","why":"*So* makes being tired the reason she finished. The surprise is gone.","whyPt":"*So* faz do cansaço o motivo de ela terminar. A surpresa some."},{"en":"She finished the report [because] she was tired.","why":"Now tiredness is the reason for finishing, not something she beat.","whyPt":"Agora o cansaço é o motivo de terminar, e não algo que ela superou."}]},{"id":"b1-s15","s":"I'll lend you my car [as long as] you drive carefully.","pt":"Eu te empresto o carro, desde que você dirija com cuidado.","o":[{"en":"I won't lend you my car [unless] you drive carefully.","why":"Same message: driving carefully is the condition. *Unless* = if not.","whyPt":"Mesma mensagem: dirigir com cuidado é a condição. *Unless* = a não ser que."},{"en":"I'll lend you my car [even if] you don't drive carefully.","why":"*Even if* removes the condition: you get the car no matter how you drive.","whyPt":"*Even if* tira a condição: você leva o carro de qualquer jeito."},{"en":"I'll lend you my car [in case] you drive carefully.","why":"*In case* is a precaution, not a condition. The sentence stops making sense.","whyPt":"*In case* é precaução, não condição. A frase deixa de fazer sentido."}]},{"id":"b1-s16","s":"[Due to] the rain, the game was canceled.","pt":"Por causa da chuva, o jogo foi cancelado.","o":[{"en":"It rained. [As a result], the game was canceled.","why":"Same message: the rain is the cause, the cancellation is the result.","whyPt":"Mesma mensagem: a chuva é a causa, o cancelamento é a consequência."},{"en":"The game was canceled. [As a result], it rained.","why":"Cause and result swap places: canceling the game made it rain!","whyPt":"Causa e consequência trocam de lugar: cancelar o jogo fez chover!"},{"en":"[Despite] the rain, the game was canceled.","why":"*Despite* turns the rain into a surprise, as if rain made a game more likely.","whyPt":"*Despite* transforma a chuva numa surpresa, como se a chuva deixasse o jogo mais provável."}]},{"id":"b1-s17","s":"[While] I was cooking, the phone rang.","pt":"Enquanto eu cozinhava, o telefone tocou.","o":[{"en":"I was cooking [when] the phone rang.","why":"Same message: the phone rang in the middle of the cooking.","whyPt":"Mesma mensagem: o telefone tocou no meio da comida."},{"en":"[After] I cooked, the phone rang.","why":"Now the cooking was over before the phone rang.","whyPt":"Agora a comida já estava pronta quando o telefone tocou."},{"en":"I was cooking [because] the phone rang.","why":"The phone call becomes the reason for cooking.","whyPt":"A ligação vira o motivo para cozinhar."}]},{"id":"b1-s18","s":"He took a taxi [so that] he wouldn't be late.","pt":"Ele pegou um táxi para não se atrasar.","o":[{"en":"He didn't want to be late, [so] he took a taxi.","why":"Same message: not being late is the purpose of the taxi.","whyPt":"Mesma mensagem: não se atrasar é o objetivo do táxi."},{"en":"He was late [because] he took a taxi.","why":"Now the taxi made him late: the opposite of the plan.","whyPt":"Agora o táxi fez ele se atrasar: o contrário do plano."},{"en":"He took a taxi, [but] he was late.","why":"*But* says the plan failed: he was late anyway.","whyPt":"*But* diz que o plano falhou: ele se atrasou mesmo assim."}]},{"id":"b1-s19","s":"Bring an umbrella [in case] it rains.","pt":"Leve um guarda-chuva caso chova.","o":[{"en":"It might rain later, [so] bring an umbrella.","why":"Same message: you take it now, to be ready for rain.","whyPt":"Mesma mensagem: você leva agora, para estar pronto se chover."},{"en":"Bring an umbrella [if] it rains.","why":"With *if*, you bring it only once it's raining. *In case* = before, to be ready.","whyPt":"Com *if*, você só leva quando já estiver chovendo. *In case* = antes, para estar preparado."},{"en":"Bring an umbrella [because] it's raining.","why":"*Because* says it is raining now: a fact, not a maybe.","whyPt":"*Because* diz que já está chovendo: um fato, não uma possibilidade."}]},{"id":"b1-s20","s":"[Instead of] driving, we took the train.","pt":"Em vez de ir de carro, fomos de trem.","o":[{"en":"We took the train [rather than] driving.","why":"Same message: we chose the train, not the car.","whyPt":"Mesma mensagem: escolhemos o trem, não o carro."},{"en":"We took the train [as well as] driving.","why":"*As well as* means both: now we used the car too.","whyPt":"*As well as* quer dizer os dois: agora usamos o carro também."},{"en":"We drove [instead of] taking the train.","why":"The choice swaps: now we went by car.","whyPt":"A escolha se inverte: agora fomos de carro."}]},{"id":"b1-s21","s":"[Once] you've paid, you'll get a receipt.","pt":"Assim que você pagar, vai receber um recibo.","o":[{"en":"You'll get a receipt [as soon as] you've paid.","why":"Same message: first you pay, then you get the receipt.","whyPt":"Mesma mensagem: primeiro você paga, depois recebe o recibo."},{"en":"[Since] you've paid, you'll get a receipt.","why":"*Since* gives a reason and says you have already paid. *Once* is about time.","whyPt":"*Since* dá um motivo e diz que você já pagou. *Once* é sobre tempo."},{"en":"You'll get a receipt [before] you pay.","why":"The order is the opposite: the receipt comes first.","whyPt":"A ordem fica ao contrário: o recibo vem primeiro."}]},{"id":"b1-s22","s":"[Unlike] my sister, I hate horror movies.","pt":"Diferente da minha irmã, eu odeio filmes de terror.","o":[{"en":"My sister loves horror movies, [while] I hate them.","why":"Same message: we are different. She loves them, I hate them.","whyPt":"Mesma mensagem: somos diferentes. Ela adora, eu odeio."},{"en":"[Like] my sister, I hate horror movies.","why":"*Like* makes us the same: now we both hate them.","whyPt":"*Like* deixa a gente igual: agora nós duas odiamos."},{"en":"I hate horror movies [because of] my sister.","why":"Now my sister is the reason I hate them.","whyPt":"Agora a minha irmã é o motivo de eu odiar."}]},{"id":"b1-s23","s":"You can join the team [even if] you've never played before.","pt":"Você pode entrar no time mesmo que nunca tenha jogado.","o":[{"en":"Never played before? [Even so], you can join the team.","why":"Same message: no experience, and you can still join.","whyPt":"Mesma mensagem: sem experiência, e mesmo assim você pode entrar."},{"en":"You can join the team [as long as] you've played before.","why":"Now experience is the condition: beginners can't join.","whyPt":"Agora a experiência é a condição: iniciantes não podem entrar."},{"en":"You can join the team [because] you've never played before.","why":"Having no experience becomes the reason you can join.","whyPt":"Não ter experiência vira o motivo para poder entrar."}]},{"id":"b1-s24","s":"The museum was closed, [so] we went to the park.","pt":"O museu estava fechado, então fomos ao parque.","o":[{"en":"[Since] the museum was closed, we went to the park.","why":"Same message: the closed museum is the reason for the park.","whyPt":"Mesma mensagem: o museu fechado é o motivo do parque."},{"en":"We went to the park, [so] the museum was closed.","why":"Reason and result swap places: our trip to the park closed the museum!","whyPt":"Causa e consequência trocam de lugar: a ida ao parque fechou o museu!"},{"en":"The museum was closed. [Meanwhile], we went to the park.","why":"*Meanwhile* only says the two things happened at the same time. The reason is gone.","whyPt":"*Meanwhile* só diz que as duas coisas aconteceram ao mesmo tempo. O motivo some."}]}],"B2":[{"id":"b2-s01","s":"[Much as] I love my job, I need a break.","pt":"Por mais que eu ame meu trabalho, preciso de uma pausa.","o":[{"en":"I love my job. [Nevertheless], I need a break.","why":"Same message: the same surprise, in two sentences.","whyPt":"Mesma mensagem: a mesma surpresa, em duas frases."},{"en":"I love my job; [therefore], I need a break.","why":"*Therefore* makes the break a result of loving the job, as if loving it made you tired.","whyPt":"*Therefore* faz da pausa uma consequência de amar o trabalho, como se amar cansasse."},{"en":"[Since] I love my job, I need a break.","why":"*Since* makes loving the job the reason for the break. The first sentence says you need it in spite of that.","whyPt":"*Since* faz de amar o trabalho o motivo da pausa. A primeira frase diz que você precisa dela apesar disso."}]},{"id":"b2-s02","s":"The flight was canceled [owing to] a storm.","pt":"O voo foi cancelado devido a uma tempestade.","o":[{"en":"There was a storm. [Consequently], the flight was canceled.","why":"Same message: the storm is the cause, the cancellation the result.","whyPt":"Mesma mensagem: a tempestade é a causa, o cancelamento a consequência."},{"en":"[Despite] the storm, the flight was canceled.","why":"*Despite* shows a surprise, but a canceled flight is just what you'd expect in a storm.","whyPt":"*Despite* mostra uma surpresa, mas um voo cancelado é o esperado numa tempestade."},{"en":"The flight was canceled. [As a result], there was a storm.","why":"The cause and the result swap places: now the cancellation caused the storm!","whyPt":"Causa e consequência trocam de lugar: agora o cancelamento causou a tempestade!"}]},{"id":"b2-s03","s":"You can use my car [provided] you fill up the tank.","pt":"Pode usar o meu carro, contanto que encha o tanque.","o":[{"en":"You can use my car [as long as] you fill up the tank.","why":"Same message: *as long as* = *provided*, a condition.","whyPt":"Mesma mensagem: *as long as* = *provided*, uma condição."},{"en":"You can use my car [unless] you fill up the tank.","why":"*Unless* = if… not: you could use the car only if you *don't* fill it up!","whyPt":"*Unless* = se… não: você só poderia usar o carro se *não* enchesse o tanque!"},{"en":"You can use my car [in case] you fill up the tank.","why":"*In case* is for a precaution, and here it makes no sense: it's a condition.","whyPt":"*In case* é para precaução, e aqui não faz sentido: é uma condição."}]},{"id":"b2-s04","s":"Some people work best in the morning, [whereas] others are more productive at night.","pt":"Algumas pessoas rendem mais de manhã, ao passo que outras são mais produtivas à noite.","o":[{"en":"Some people work best in the morning. [By contrast], others are more productive at night.","why":"Same message: two different groups side by side.","whyPt":"Mesma mensagem: dois grupos diferentes lado a lado."},{"en":"Some people work best in the morning; [consequently], others are more productive at night.","why":"*Consequently* makes one group the cause of the other. The first sentence only compares them.","whyPt":"*Consequently* faz de um grupo a causa do outro. A primeira frase só compara os dois."},{"en":"[Just as] some people work best in the morning, others are more productive at night.","why":"*Just as* says the two things are similar. *Whereas* says they're different.","whyPt":"*Just as* diz que as duas coisas são parecidas. *Whereas* diz que são diferentes."}]},{"id":"b2-s05","s":"[Now that] I live near the office, I walk to work.","pt":"Agora que moro perto do escritório, vou a pé para o trabalho.","o":[{"en":"I walk to work [since] I live near the office now.","why":"Same message: living near the office is the reason.","whyPt":"Mesma mensagem: morar perto do escritório é a causa."},{"en":"I walk to work [even though] I live near the office now.","why":"*Even though* shows a surprise, but walking is just what you'd expect when you live close.","whyPt":"*Even though* mostra uma surpresa, mas ir a pé é o esperado quando se mora perto."},{"en":"[Until] I lived near the office, I walked to work.","why":"Now you walked in the past, and stopped when you moved: the opposite.","whyPt":"Agora você ia a pé no passado e parou quando se mudou: o contrário."}]},{"id":"b2-s06","s":"I'll lend you the money [only if] you pay me back next week.","pt":"Só te empresto o dinheiro se você me pagar na semana que vem.","o":[{"en":"I won't lend you the money [unless] you pay me back next week.","why":"Same message: no payment, no money.","whyPt":"Mesma mensagem: sem pagamento, sem dinheiro."},{"en":"I'll lend you the money [even if] you don't pay me back next week.","why":"*Even if* says the loan happens anyway, with or without the payment.","whyPt":"*Even if* diz que o empréstimo acontece de qualquer jeito, com ou sem pagamento."},{"en":"I'll lend you the money [so that] you can pay me back next week.","why":"*So that* gives a purpose: you'd lend money so they can pay you back, which makes no sense.","whyPt":"*So that* dá uma finalidade: emprestar para a pessoa poder pagar de volta, o que não faz sentido."}]},{"id":"b2-s07","s":"We waited for hours. [Eventually], the bus arrived.","pt":"Esperamos horas. Finalmente, o ônibus chegou.","o":[{"en":"We waited for hours [until] the bus finally arrived.","why":"Same message: a long wait that ended when the bus came.","whyPt":"Mesma mensagem: uma espera longa que acabou quando o ônibus chegou."},{"en":"We waited for hours, [although] the bus arrived.","why":"*Although* shows a surprise: as if you kept waiting even after the bus came.","whyPt":"*Although* mostra uma surpresa: como se vocês continuassem esperando depois que o ônibus chegou."},{"en":"We waited for hours [in case] the bus arrived.","why":"*In case* makes it a precaution: you waited just to be safe, without knowing if it would come.","whyPt":"*In case* transforma em precaução: vocês esperaram só por segurança, sem saber se viria."}]},{"id":"b2-s08","s":"[Supposing] you lost your passport abroad, what would you do?","pt":"Supondo que você perdesse o passaporte no exterior, o que faria?","o":[{"en":"What would you do [if] you lost your passport abroad?","why":"Same message: an imagined situation.","whyPt":"Mesma mensagem: uma situação imaginada."},{"en":"[Since] you lost your passport abroad, what did you do?","why":"*Since* says it really happened: it's the reason. *Supposing* only imagines it.","whyPt":"*Since* diz que aconteceu de verdade: é a causa. *Supposing* só imagina."},{"en":"[Unless] you lost your passport abroad, what would you do?","why":"*Unless* = if… not: now it's about not losing it, and the question makes no sense.","whyPt":"*Unless* = se… não: agora é sobre não perder, e a pergunta não faz sentido."}]},{"id":"b2-s09","s":"[The moment] she walked in, everyone stopped talking.","pt":"No momento em que ela entrou, todo mundo parou de falar.","o":[{"en":"[As soon as] she walked in, everyone stopped talking.","why":"Same message: *the moment* = *as soon as*.","whyPt":"Mesma mensagem: *the moment* = *as soon as*."},{"en":"[Just as] everyone stopped talking, she walked in.","why":"The order changes: here the silence came first, and she arrived right at that moment.","whyPt":"A ordem muda: aqui o silêncio veio primeiro, e ela chegou bem naquela hora."},{"en":"[Although] she walked in, everyone stopped talking.","why":"*Although* shows a surprise, as if her coming in should have kept people talking.","whyPt":"*Although* mostra uma surpresa, como se a chegada dela devesse manter a conversa."}]},{"id":"b2-s10","s":"I'd rather stay in tonight. [After all], I have an exam tomorrow.","pt":"Prefiro ficar em casa hoje. Afinal, tenho prova amanhã.","o":[{"en":"I'd rather stay in tonight [because] I have an exam tomorrow.","why":"Same message: the exam is the reason.","whyPt":"Mesma mensagem: a prova é o motivo."},{"en":"I'd rather stay in tonight. [In the end], I have an exam tomorrow.","why":"*In the end* means finally, after everything: it doesn't give a reason.","whyPt":"*In the end* significa no fim das contas, depois de tudo: não dá um motivo."},{"en":"I have an exam tomorrow, [whereas] I'd rather stay in tonight.","why":"*Whereas* compares two different facts. Here one fact is the reason for the other.","whyPt":"*Whereas* compara dois fatos diferentes. Aqui um fato é o motivo do outro."}]},{"id":"b2-s11","s":"He talks [as though] he knew everything.","pt":"Ele fala como se soubesse tudo.","o":[{"en":"He talks [as if] he knew everything.","why":"Same message: *as if* = *as though*.","whyPt":"Mesma mensagem: *as if* = *as though*."},{"en":"He talks [because] he knows everything.","why":"Now he really knows everything, and that's why he talks. *As though* says he only acts like it.","whyPt":"Agora ele sabe tudo de verdade, e por isso fala. *As though* diz que ele só age como se soubesse."},{"en":"He knows everything, [so] he talks a lot.","why":"Now he really knows everything. *As though* says he only seems to.","whyPt":"Agora ele sabe tudo de verdade. *As though* diz que ele só parece saber."}]},{"id":"b2-s12","s":"Some say the plan is too risky. [Moreover], it would cost millions.","pt":"Há quem diga que o plano é arriscado demais. Além disso, custaria milhões.","o":[{"en":"Some say the plan is too risky. [What's more], it would cost millions.","why":"Same message: a second problem, added to the first.","whyPt":"Mesma mensagem: um segundo problema, somado ao primeiro."},{"en":"Some say the plan is too risky. [However], it would cost millions.","why":"*However* shows a contrast, but the cost is not a contrast: it's one more problem.","whyPt":"*However* mostra um contraste, mas o custo não contrasta: é mais um problema."},{"en":"Some say the plan is too risky [because] it would cost millions.","why":"*Because* makes the cost the reason it's risky. *Moreover* just adds a second problem.","whyPt":"*Because* faz do custo o motivo do risco. *Moreover* só acrescenta um segundo problema."}]},{"id":"b2-s13","s":"[Without] your help, I would never have finished.","pt":"Sem a sua ajuda, eu nunca teria terminado.","o":[{"en":"[If] you hadn't helped me, I would never have finished.","why":"Same message: *without* + a noun = if… not + a sentence.","whyPt":"Mesma mensagem: *without* + substantivo = if… not + frase."},{"en":"[Even though] you helped me, I would never have finished.","why":"*Even though* shows a surprise: you helped, and still it wasn't enough.","whyPt":"*Even though* mostra uma surpresa: a pessoa ajudou, e mesmo assim não bastou."},{"en":"[Thanks to] your help, I would never have finished.","why":"*Thanks to* gives a good result, so the sentence contradicts itself.","whyPt":"*Thanks to* dá um resultado bom, então a frase se contradiz."}]},{"id":"b2-s14","s":"[Provided] you book early, you'll get a discount.","pt":"Contanto que você reserve cedo, vai ter desconto.","o":[{"en":"You'll get a discount [as long as] you book early.","why":"Same message: booking early is the condition for the discount.","whyPt":"Mesma mensagem: reservar cedo é a condição para o desconto."},{"en":"You'll get a discount [unless] you book early.","why":"*Unless* = if not: now booking early loses the discount.","whyPt":"*Unless* = a não ser que: agora reservar cedo faz perder o desconto."},{"en":"[Now that] you've booked early, you'll get a discount.","why":"*Now that* says you have already booked: a fact, not a condition.","whyPt":"*Now that* diz que você já reservou: um fato, não uma condição."}]},{"id":"b2-s15","s":"Sales rose sharply. [Consequently], the company hired fifty new staff.","pt":"As vendas subiram muito. Consequentemente, a empresa contratou cinquenta funcionários.","o":[{"en":"The company hired fifty new staff [owing to] a sharp rise in sales.","why":"Same message: the rise in sales is the cause of the hiring.","whyPt":"Mesma mensagem: a alta das vendas é a causa das contratações."},{"en":"Sales rose sharply [owing to] the fifty new staff the company hired.","why":"Cause and result swap places: now the new staff made sales rise.","whyPt":"Causa e consequência trocam de lugar: agora os novos funcionários fizeram as vendas subir."},{"en":"Sales rose sharply. [Nevertheless], the company hired fifty new staff.","why":"*Nevertheless* shows a surprise, as if good sales made hiring unlikely.","whyPt":"*Nevertheless* mostra uma surpresa, como se vender bem tornasse as contratações improváveis."}]},{"id":"b2-s16","s":"[Whereas] my brother saves every penny, I spend everything I earn.","pt":"Enquanto o meu irmão economiza cada centavo, eu gasto tudo o que ganho.","o":[{"en":"My brother saves every penny. [By contrast], I spend everything I earn.","why":"Same message: two opposite habits, side by side.","whyPt":"Mesma mensagem: dois hábitos opostos, lado a lado."},{"en":"My brother saves every penny. [Likewise], I spend everything I earn.","why":"*Likewise* says we do the same thing, but the habits are opposite.","whyPt":"*Likewise* diz que fazemos a mesma coisa, mas os hábitos são opostos."},{"en":"I spend everything I earn. [Consequently], my brother saves every penny.","why":"Now my spending is the reason he saves.","whyPt":"Agora o meu gasto é o motivo de ele economizar."}]},{"id":"b2-s17","s":"[The moment] the doors opened, the crowd rushed in.","pt":"No instante em que as portas abriram, a multidão entrou correndo.","o":[{"en":"The crowd rushed in [as soon as] the doors opened.","why":"Same message: the doors open, and right away the crowd goes in.","whyPt":"Mesma mensagem: as portas abrem e na mesma hora a multidão entra."},{"en":"[By the time] the doors opened, the crowd had rushed in.","why":"Now the crowd was already inside before the doors opened.","whyPt":"Agora a multidão já estava lá dentro antes de as portas abrirem."},{"en":"The doors opened [because] the crowd rushed in.","why":"Cause and result swap places: the crowd pushed the doors open.","whyPt":"Causa e consequência trocam de lugar: a multidão forçou as portas."}]},{"id":"b2-s18","s":"[Apart from] the ending, I loved the book.","pt":"Tirando o final, eu adorei o livro.","o":[{"en":"I loved the book, [although] I didn't like the ending.","why":"Same message: the ending is the only part I didn't love.","whyPt":"Mesma mensagem: o final é a única parte de que eu não gostei."},{"en":"[As well as] the ending, I loved the book.","why":"*As well as* adds the ending to what I loved.","whyPt":"*As well as* acrescenta o final ao que eu adorei."},{"en":"I loved the book [owing to] the ending.","why":"Now the ending is the reason I loved it.","whyPt":"Agora o final é o motivo de eu ter adorado."}]},{"id":"b2-s19","s":"He apologized. [Nevertheless], she was still angry.","pt":"Ele pediu desculpas. Mesmo assim, ela continuava brava.","o":[{"en":"She was still angry, [even though] he had apologized.","why":"Same message: the apology didn't stop her anger, which is a surprise.","whyPt":"Mesma mensagem: o pedido de desculpas não acabou com a raiva, o que é uma surpresa."},{"en":"She was still angry [because] he had apologized.","why":"Now the apology is what made her angry.","whyPt":"Agora o pedido de desculpas é o que a deixou brava."},{"en":"He apologized, [so] she wasn't angry any more.","why":"The result is the opposite: the apology worked.","whyPt":"O resultado é o contrário: o pedido de desculpas funcionou."}]},{"id":"b2-s20","s":"[Supposing] you won the lottery, what would you buy first?","pt":"Supondo que você ganhasse na loteria, o que compraria primeiro?","o":[{"en":"What would you buy first [if] you won the lottery?","why":"Same message: an imagined situation.","whyPt":"Mesma mensagem: uma situação imaginária."},{"en":"What did you buy first [when] you won the lottery?","why":"Now it really happened: you won the lottery.","whyPt":"Agora aconteceu de verdade: você ganhou na loteria."},{"en":"What would you buy first [unless] you won the lottery?","why":"*Unless* = if not: now it's about not winning.","whyPt":"*Unless* = a não ser que: agora fala de não ganhar."}]},{"id":"b2-s21","s":"I'll take the job [only if] they let me work from home.","pt":"Só aceito o emprego se me deixarem trabalhar de casa.","o":[{"en":"I won't take the job [unless] they let me work from home.","why":"Same message: working from home is my one condition.","whyPt":"Mesma mensagem: trabalhar de casa é a minha única condição."},{"en":"I'll take the job [even if] they don't let me work from home.","why":"*Even if* removes the condition: I accept no matter what.","whyPt":"*Even if* tira a condição: eu aceito de qualquer jeito."},{"en":"I'll take the job, [so] they'll let me work from home.","why":"Now taking the job is what gets me permission to work from home.","whyPt":"Agora aceitar o emprego é o que me dá permissão para trabalhar de casa."}]},{"id":"b2-s22","s":"We'll repaint the kitchen next month. [Until then], we'll have to live with the mess.","pt":"Vamos pintar a cozinha mês que vem. Até lá, vamos ter que conviver com a bagunça.","o":[{"en":"We'll repaint the kitchen next month. [In the meantime], we'll have to live with the mess.","why":"Same message: the mess stays until the painting.","whyPt":"Mesma mensagem: a bagunça fica até a pintura."},{"en":"We'll repaint the kitchen next month. [After that], we'll have to live with the mess.","why":"Now the mess comes after the painting.","whyPt":"Agora a bagunça vem depois da pintura."},{"en":"We'll repaint the kitchen next month. [Eventually], we'll have to live with the mess.","why":"*Eventually* = in the end, after a long time: the mess comes later, not now.","whyPt":"*Eventually* = no fim, depois de muito tempo: a bagunça vem depois, não agora."}]},{"id":"b2-s23","s":"[Now that] the kids have left home, the house feels huge.","pt":"Agora que os filhos saíram de casa, a casa parece enorme.","o":[{"en":"The kids have left home, [so] the house feels huge.","why":"Same message: the kids leaving is the reason the house feels big.","whyPt":"Mesma mensagem: a saída dos filhos é o motivo de a casa parecer grande."},{"en":"[Supposing] the kids left home, the house would feel huge.","why":"*Supposing* makes it imaginary: the kids are still at home.","whyPt":"*Supposing* deixa tudo imaginário: os filhos ainda estão em casa."},{"en":"The kids have left home [because] the house feels huge.","why":"Cause and result swap places: the big house made them leave.","whyPt":"Causa e consequência trocam de lugar: a casa grande fez eles saírem."}]},{"id":"b2-s24","s":"She left early [so as to] avoid the traffic.","pt":"Ela saiu cedo para evitar o trânsito.","o":[{"en":"She left early [because] she wanted to avoid the traffic.","why":"Same message: avoiding traffic is the purpose of leaving early.","whyPt":"Mesma mensagem: evitar o trânsito é o objetivo de sair cedo."},{"en":"She left early [despite] the traffic.","why":"*Despite* turns the traffic into an obstacle she ignored, not her reason.","whyPt":"*Despite* transforma o trânsito num obstáculo que ela ignorou, e não no motivo."},{"en":"She got stuck in traffic [bec /* ---------- Text markup (src/data/texts/<LEVEL>.json) ----------
   [although] = a gap ("spot"): the linking word that goes there, by its id in rules.json "words" (since-r = since for a
                reason, since-t = since for time…). Its bubble floats in the pool above the text.
   [although/though/even-though] = a gap where other words are right too: the first one is the bubble in the pool, the
                others are also accepted (and named in the explanation: "Also right here").
   A gap at the start of a sentence shows its word with a capital (However, …).
   parsed(t) reads a text once and keeps the result on it:
     lines  [{ raw, segs }] — segs: { k: "t" | "spot", at, end, s, i (spot) }
     spots  [{ id, ids, W (the word), ok (every accepted word, lower case), cap, line, at, sent [start, end), note }] */
const GAP_RE = /\[([a-z0-9-]+(?:\/[a-z0-9-]+)*)\]/g;
// Sentence breaks: . ! ? … (maybe a closing quote), a space, then (after any opening quotes) a capital, a digit or a
// gap. Not after Mr. Mrs. Ms. Dr. St.
const SENT_END = /(?<!\b(?:Mr|Mrs|Ms|Dr|St)\.)(?<=[.!?…]["”]?)\s+(?=["“(]*[\[A-Z0-9])/g;
function sentRanges(raw) {
  const out = []; let a = 0, m;
  SENT_END.lastIndex = 0;
  while ((m = SENT_END.exec(raw))) { out.push([a, m.index]); a = m.index + m[0].length; }
  out.push([a, raw.length]);
  return out;
}
const bodyOf = t => [].concat(t.body);
function parsed(t) {
  if (t._p) return t._p;
  const P = { lines: [], spots: [] };
  bodyOf(t).forEach((raw, li) => {
    const segs = [], sents = sentRanges(raw);
    let last = 0, m;
    GAP_RE.lastIndex = 0;
    while ((m = GAP_RE.exec(raw))) {
      if (m.index > last) segs.push({ k: "t", at: last, end: m.index, s: raw.slice(last, m.index) });
      const ids = m[1].split("/"), i = P.spots.length;
      const sent = sents.find(r => m.index >= r[0] && m.index < r[1]);
      const capd = /^["“(]*$/.test(raw.slice(sent[0], m.index).trim());
      const ok = [...new Set(ids.map(x => WORD[x].w.toLowerCase()))];
      P.spots.push({ id: ids[0], ids, W: WORD[ids[0]], ok, cap: capd, line: li, at: m.index, sent, sents, note: (t.notes || [])[i] || null });
      segs.push({ k: "spot", at: m.index, end: GAP_RE.lastIndex, i });
      last = GAP_RE.lastIndex;
    }
    if (last < raw.length) segs.push({ k: "t", at: last, end: raw.length, s: raw.slice(last) });
    P.lines.push({ raw, segs });
  });
  return (t._p = P);
}
// Walk part [a, b) of line li: f.t(text) and f.spot(i) give the pieces, joined.
function walk(P, li, a, b, f) {
  return P.lines[li].segs.map(g => {
    if (g.end <= a || g.at >= b) return "";
    if (g.k === "t") return f.t(g.s.slice(Math.max(a, g.at) - g.at, Math.min(b, g.end) - g.at));
    return f.spot(g.i);
  }).join("");
}
// Is the word w (its text, any case) right for spot sp?
const isRight = (sp, w) => !!w && sp.ok.includes(String(w).toLowerCase());
// What a spot says in the sentence: the word given (or its answer), with a capital at the start of a sentence.
function said(sp, w) { const s = w || sp.W.w; return sp.cap ? cap(s) : s; }
const tidy = s => s.replace(/ {2,}/g, " ").replace(/ +([,.!?;:])/g, "$1").trim();
// Plain text of a line (or part of it): every spot with its answer, or the word in st[i] when given.
function linePlain(P, li, a = 0, b = Infinity, st) {
  return tidy(walk(P, li, a, b, { t: s => s, spot: i => said(P.spots[i], st && st[i]) }));
}
function sentPlain(P, i, st) { const sp = P.spots[i]; return linePlain(P, sp.line, sp.sent[0], sp.sent[1], st); }
// Spot i's sentence as HTML: spot i as html(i), the other spots with their answers.
function sentHTML(P, i, html) {
  const sp = P.spots[i];
  return tidy(walk(P, sp.line, sp.sent[0], sp.sent[1], { t: s => esc(s), spot: j => j === i ? html(j) : esc(said(P.spots[j])) }));
}
// The sentence before spot i's sentence (for a gap that links back to it: However, …), or "".
function prevSent(P, i) {
  const sp = P.spots[i], k = sp.sents.findIndex(r => r[0] === sp.sent[0]);
  if (k > 0) return linePlain(P, sp.line, sp.sents[k - 1][0], sp.sents[k - 1][1]);
  if (sp.line > 0) { const L = P.lines[sp.line - 1], r = sentRanges(L.raw).pop(); return linePlain(P, sp.line - 1, r[0], r[1]); }

}

function hexToHsl(hex) {

/* 07-back.js — copied from Question Bubbles (../question practice): the phone's back gesture (or the
   browser's Back) closes the open window instead of leaving the page: Favorites / Seen, the end card, the Guide, the
   tutorial, the Play menu and the header pop-ups (colours, volume); in Quick-fire, Review missed and Favorites games it goes back to a normal game. Each window holds a history
   entry while it is open. A MutationObserver sees it open and close, whatever closed it (✕, Escape, a click outside, a
   button), so the entry is added and taken back in one place. Back closes the window opened last. A new window needs one
   backLayer(el, isOpen, close) call. */
// Our history entries must not bring back an old scroll position (the page scrolls itself to the result card).
try { history.scrollRestoration = "manual"; } catch (e) {}
const BACK = [];     // open windows, oldest first: { el, close, pushed }
let backSkip = 0;    // our own history.back() calls, whose popstate is not a Back press
// A window that opens while one of those history.back() calls is still on its way (the Play menu closes and Review missed
// starts in the same click) waits for it: the browser aims history.back() when it is called, so an entry pushed in
// between would be swept away with it, and the next Back would leave the page. Pushed once the popstate arrives.
const pendingPush = [];
function pushEntry(L) { try { history.pushState({ layer: 1 }, ""); L.pushed = true; } catch (e) { L.pushed = false; } }   // a file:// page may refuse
// el: the window's element; isOpen(): whether it shows; close(): what Back does (the same as its ✕ or Escape).
function backLayer(el, isOpen, close) {
  const L = { el, close, pushed: false, byBack: false };
  let was = isOpen();
  new MutationObserver(() => {
    const now = isOpen(); if (now === was) return; was = now;
    if (now) {
      if (backSkip) pendingPush.push(L); else pushEntry(L);
      BACK.push(L);
    } else {
      const i = BACK.indexOf(L); if (i >= 0) BACK.splice(i, 1);
      const p = pendingPush.indexOf(L); if (p >= 0) pendingPush.splice(p, 1);   // closed before its entry was even added
      // Closed by the game, not by Back: take its history entry away, so the next Back isn't a dead press.
      if (L.pushed && !L.byBack) { backSkip++; history.back(); }
      L.pushed = false;
    }
  }).observe(el, { attributes: true, attributeFilter: ["class", "hidden"] });
}
window.addEventListener("popstate", () => {
  if (backSkip) { backSkip--; if (!backSkip) pendingPush.splice(0).forEach(pushEntry); return; }
  const L = BACK[BACK.length - 1]; if (!L) return;
  L.byBack = true; L.close(); setTimeout(() => { L.byBack = false; }, 0);   // the observer has run by then
});
// Header pop-ups (01-theme.js, 02-sound.js; from Conditional Bubbles): the back gesture closes them too.
backLayer(swwrap, () => swwrap.classList.contains("open"), () => swOpen(false));
backLayer(volwrap, () => volwrap.classList.contains("open"), () => volwrap.classList.remove("open"));

/* 08-sky.js — background bubbles drifting up behind everything (from Be Do Modal, via English Bubbles): 7 see-through,
   softly blurred bubbles of random size (40-140 px), place and pace (95-145 s a climb). At load they are already
   part-way up and the layer fades in. Transform / opacity only; none with reduced motion. Look: .sky in 23-sky.css. */
(function () {
  const host = $("sky");
  if (!host || reduceMotion) return;
  const hues = [215, 330, 150, 265, 30, 190];
  for (let k = 0; k < 7; k++) {
    const s = document.createElement("span"), size = 40 + Math.round(Math.random() * 100), t = 95 + Math.round(Math.random() * 50);
    const at = (0.15 + 0.65 * (k + Math.random() * 0.8) / 7) * t;   // a negative delay: 15% to 80% of the way up
    s.style.cssText = "width:" + size + "px;height:" + size + "px;left:" + Math.round(Math.random() * 96) + "%;" +
      "--h:" + hues[k % hues.length] + ";--t:" + t + "s;--d:-" + at.toFixed(1) + "s;--x:" + Math.round(Math.random() * 80 - 40) + "px";
    host.appendChild(s);
  }
  setTimeout(() => host.classList.add("in"), 60);   // a timer, not a frame: a page opened in the background gets none
})();

/* 10-game.js — the game. One game = a level's texts (levels.json "rounds" of them), one text per round, then the extra
   rounds (normal games only; EXTRAS): Paired conjunctions (12-pairs.js) and the Same message? bonus (17-same.js).
   Every text has 3–5 gaps. The linking words float in the pool above the text: their bubbles, plus (from B1) a few that
   fit no gap (levels.json "fakes", from the text's "dx": same job but wrong shape, or a Portuguese trap). The player
   drags (or taps) a bubble into each gap, then presses Check (an empty gap = a reminder, no try spent).
   Before the check every bubble looks the same; afterwards each one takes the colour of its job.
   Scoring per gap: right on the first check = 2 points, on a later check = 1, never = 0. A wrong check costs a try
   (levels.json "tries"). "feedback": "spots" sends the wrong bubbles back and locks the right ones; "count" only says
   how many are wrong. After the last try the answers are shown.
   Clues name the job of every gap (contrast? reason?): a pool for the whole game (levels.json "hints"), one per text,
   each unused one = +1 at the end. */
const PTS_FIRST = 2, PTS_LATER = 1, POOL_HUE = 265;
const lvl = () => DATA.levels[(G.r && G.r.level) || G.level] || {};
const levelOf = t => t.id.split("-")[0].toUpperCase();
const maxTries = () => lvl().tries || 2;
const hintPool = () => { const h = (DATA.levels[G.level] || {}).hints; return h == null ? 2 : h; };
const TEXTS = {};
Object.keys(DATA.texts).forEach(l => DATA.texts[l].forEach(t => { TEXTS[t.id] = t; }));
const G = { level: "A2", mode: "normal", pool: [], total: 3, idx: 0, score: 0, results: [], streak: 0, hintsLeft: 0, r: null, pr: null, sm: null, pairs: null, same: null, xi: -1, favs: null, phase: "idle", newWords: [] };
const stage = $("stage"), card = $("card"), poolEl = $("pool"), revealEl = $("reveal"), hintEl = $("hint"), toolsEl = $("tools"), quizEl = $("quiz");
const scoreEl = $("score"), scEl = $("sc"), bestEl = $("bestlbl"), hintBtn = $("hintbtn"), resetBtn = $("resetbtn"), checkBtn = $("checkbtn"), triesEl = $("tries");

/* ---------- Game flow ---------- */
// mode: "normal" | "speed" | "review" | "fav" (22-modes.js); ids = the texts of a review / favorites game.
function newGame(level, mode = "normal", ids) {
  G.level = level; G.mode = mode; applyUi();
  document.body.classList.toggle("practice-mode", mode !== "normal");   // Back returns to a normal game (22-modes.js)
  G.pool = ids ? shuffle(ids.map(id => TEXTS[id]).filter(Boolean)) : orderPool(DATA.texts[level], DATA.levels[level].rounds || 3);
  G.total = mode === "speed" ? Infinity : Math.min(DATA.levels[level].rounds || 3, G.pool.length);
  Object.assign(G, { newWords: [], idx: 0, score: 0, results: [], streak: 0, hintsLeft: hintPool(), r: null, pr: null, sm: null, pairs: null, same: null, xi: -1, mv: null });
  G.favs = mode === "fav" ? favParts(ids || []) : null;
  if (mode === "normal") metNewGame();   // words met: a new game's list (17-same.js)
  stopSpeed(); stopSpeech(); quizEl.hidden = true; revealEl.hidden = true; stage.hidden = toolsEl.hidden = false;
  showScore(); showCombo();
  if (mode === "speed") return speedIntro();
  (G.total ? startRound : afterRound() || startRound)();
  requestAnimationFrame(scrollToRound);
}
// Shared start of every round: clear the reveal, the card, the pool and the tools.
function roundBase(kind) {
  revealEl.hidden = true; revealEl.innerHTML = "";
  toolsEl.className = "tools" + (kind ? " " + kind : ""); toolsEl.hidden = false;
  poolEl.innerHTML = ""; poolEl.className = "pool"; poolEl.hidden = false;
  card.className = "card"; hideGloss();
  stage.classList.remove("out"); if (!reduceMotion) flash(stage, "rise");
}
function startRound() {
  const t = G.pool[G.idx % G.pool.length], P = parsed(t), level = levelOf(t);
  const nf = (DATA.levels[level] || {}).fakes || 0, fakes = shuffle((t.dx || []).slice()).slice(0, nf);
  G.r = { t, P, level, fakes, first: null, tries: 0, hinted: false };
  G.pr = G.sm = null; G.phase = "play";
  roundBase("");
  renderCard(); renderPool(); renderTools(); updateProgress();
  metAdd(P.spots.flatMap(sp => sp.ids).concat(fakes).map(wordOf));
  hintEl.innerHTML = tx(G.idx === 0 ? "intro" : "introShort");
}
// The extra rounds after the texts, in this order, each only where it's due: favorite sentences (Favorites games),
// Paired conjunctions, Same message?. G.xi = the one being played (-1 = still texts).
const EXTRAS = () => [[startSents, sentDue], [startPairs, pairsDue], [startSame, sameDue]];
function afterRound() {
  if (G.xi < 0 && G.idx + 1 < G.total) return startRound;
  if (G.pr && G.mode === "fav" && pairsDue()) return startPairs;  // the next favorite paragraph (normal games: one round)
  const x = EXTRAS().find((e, k) => k > G.xi && e[1]());
  return x ? x[0] : null;
}
function nextRound() {
  if (G.phase !== "done") return;
  G.phase = "idle"; stopSpeech();
  const next = afterRound();
  if (G.xi < 0) G.idx++;
  if (!next) { updateProgress(); showEnd(); return; }
  stage.classList.add("out"); revealEl.classList.add("out");
  setTimeout(() => {
    revealEl.classList.remove("out");
    next();
    scrollToRound();
  }, reduceMotion ? 0 : 260);
}
// A new round starts at the top. Check is brought into view only once the last gap is filled (mvMove, 11-pool.js).
const isDesktop = () => canHover && matchMedia("(pointer: fine)").matches && innerWidth >= 768;
function scrollToRound() { scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }); }
// Desktop: scroll down (never up) until el is fully in view, e.g. a quiz round's Next button once it appears.
function showOnDesktop(el) {
  if (!el || !isDesktop()) return;
  const d = el.getBoundingClientRect().bottom + 16 - innerHeight;
  if (d > 0) scrollBy({ top: d, behavior: reduceMotion ? "auto" : "smooth" });
}
// After a check (from Question Bubbles): a short pause, so the result card is seen popping in, then scroll down (never
// up) so as much of it shows as fits: bottom's bottom in view, but top's top never under the sticky dock. Layout
// offsets, not the bounding box: the card's entrance animation moves it while it plays. All devices.
const RESULT_SCROLL_MS = 800;
function scrollDownTo(top, bottom) {
  const pageTop = el => { let y = 0; for (; el; el = el.offsetParent) y += el.offsetTop; return y; };
  const dock = document.querySelector(".dock"), topLimit = (dock ? dock.getBoundingClientRect().bottom : 0) + 12;
  const y = Math.min(pageTop(bottom) + bottom.offsetHeight + 32 - innerHeight, pageTop(top) - topLimit);   // 32px of page under it (Be / Do / Modals)
  if (y > scrollY + 4) scrollTo({ top: y, behavior: reduceMotion ? "auto" : "smooth" });
}
// Back up to el when it is hidden above the sticky dock (never down): Same message?'s next sentence starts in view.
function scrollUpTo(el) {
  const dock = document.querySelector(".dock"), y = el.getBoundingClientRect().top + scrollY - (dock ? dock.getBoundingClientRect().bottom : 0) - 12;
  if (y < scrollY - 4) scrollTo({ top: Math.max(0, y), behavior: reduceMotion ? "auto" : "smooth" });
}
function scrollToResult(isCur) { setTimeout(() => { if (isCur() && !revealEl.hidden) scrollDownTo(revealEl, revealEl); }, reduceMotion ? 0 : RESULT_SCROLL_MS); }
function nextLabel() {
  const n = afterRound(), L = [[startRound, "next"], [startSents, "toSents"], [startPairs, "toPairs"], [startSame, "toSame"]];
  return (L.find(x => x[0] === n) || [0, "results"])[1];
}

/* ---------- Rendering ---------- */
// The text card: a tag (the text's frame: Email, Blog…), the title, then one block per paragraph, with a slot per gap.
function renderCard() {
  const r = G.r, t = r.t, P = r.P;
  card.className = "card";
  card.innerHTML = '<span class="tag">' + esc(frameName(t)) + '</span><button type="button" class="cardsay" aria-label="' + esc(tx("listenText")) + '" title="' + esc(tx("listenText")) + '">' + ICON_SPK + '</button><h2 class="ttl">' + esc(t.title) + "</h2>" +
    '<div class="lines">' + P.lines.map((L, li) => '<div class="ln" data-l="' + li + '"><p class="say">' + lineHTML(t, P, li) + "</p></div>").join("") + "</div>";
  r.slotEls = [...card.querySelectorAll(".slot")];
}
function frameName(t) { return (nativeUi() && t.framePt) || t.frame || "Text"; }
// A slot: an empty dashed pill with its number; Clues add the job of the gap above it (data-jl).
function slotHTML(sp, i) {
  return '<span class="slot" role="button" tabindex="0" data-i="' + i + '" data-jl="' + esc(jobName(sp.W.job, nativeUi())) + '" style="--jh:' + jobHue(sp.W.job) + '" aria-label="' + esc(tx("gap")) + " " + (i + 1) + '"><i class="slot-n" aria-hidden="true">' + (i + 1) + "</i></span>";
}
function lineHTML(t, P, li) { return walk(P, li, 0, Infinity, { t: s => glossWrap(s, t), spot: i => slotHTML(P.spots[i], i) }); }
// The pool: one bubble per gap (its answer) and the round's fakes, shuffled, all in one colour until the check.
function renderPool() {
  const r = G.r, words = r.P.spots.map(sp => sp.id).concat(r.fakes);
  r.M = mvInit({
    slotEls: r.slotEls, area: card, live: () => G.phase === "play" && G.r === r,
    label: (W, i) => i >= 0 && r.P.spots[i].cap ? cap(W.t) : W.t,
    after: () => { renderTools(); }
  }, shuffle(words.map(id => ({ id, t: wordOf(id), fake: r.fakes.includes(id) }))), poolEl, POOL_HUE);
  poolEl.insertAdjacentHTML("afterbegin", '<span class="tag pooltag">' + esc(tx("poolTag")) + "</span>");
}
function renderTools() {
  const r = G.r, play = G.phase === "play";
  triesEl.innerHTML = Array.from({ length: maxTries() }, (_, i) => '<i class="' + (r && i < r.tries ? "used" : "") + '"></i>').join("");
  triesEl.title = (maxTries() - (r ? r.tries : 0)) + " tries left";
  hintBtn.style.display = hintPool() ? "" : "none";
  hintBtn.disabled = !play || !G.hintsLeft || !r || r.hinted;
  const M = r && r.M;
  resetBtn.disabled = !play || !M || !M.slots.some(W => W && !W.locked);
  checkBtn.disabled = !play;
  checkBtn.classList.toggle("pulse", play && !!M && M.slots.every(Boolean));
  // "2 left": on narrow phones only the number shows (.hl-w hides the words), so the tools keep one row.
  const hl = tx("left", { n: "#N#" }).split("#N#").map(p => p ? '<span class="hl-w">' + esc(p) + "</span>" : "");
  $("hintleft").innerHTML = hl[0] + G.hintsLeft + (hl[1] || "");
}
function updateProgress() {
  showDays();

function slotAt(M, x, y) {
  const box = M.area.getBoundingClientRect(), m = 40;
  if (x < box.left - m || x > box.right + m || y < box.top - m || y > box.bottom + m) return -1;
  let best = -1, bd = 110;
  M.slotEls.forEach((s, i) => {
    if (!slotOpen(M, i)) return;
    (M.zone ? M.zone(i) : [s.getBoundingClientRect()]).forEach(r => {
      const dd = Math.hypot(x - Math.max(r.left, Math.min(x, r.right)), y - Math.max(r.top, Math.min(y, r.bottom)));
      if (dd < bd) { bd = dd; best = i; }
    });
  });
  return best;
}
// Keyboard: Enter / Space on a word arrives as a click with detail 0; slots are role=button.
stage.addEventListener("click", e => {
  const M = curM(); if (!M) return;
  const w = e.target.closest(".w");
  if (w && w.__w) { if (e.detail === 0) mvTapWord(M, w.__w); return; }
  const s = e.target.closest(".slot"), z = !s && M.zone && e.target.closest(".pband");
  if (s) { const i = M.slotEls.indexOf(s); if (i >= 0) mvTapSlot(M, i); }
  else if (z) mvTapSlot(M, +z.dataset.i);                    // a pair's band: the rest of the band means its gap
});
stage.addEventListener("keydown", e => {
  const M = curM(); if (!M || (e.key !== "Enter" && e.key !== " ")) return;
  const i = M.slotEls.indexOf(e.target);
  if (i >= 0) { e.preventDefault(); mvTapSlot(M, i); }
});
// Number keys put the lifted bubble into gap n.
document.addEventListener("keydown", e => {
  const M = curM(); if (!M || !M.sel || e.ctrlKey || e.metaKey || e.altKey || document.querySelector(".favmodal.show") || !$("tour").hidden) return;
  const d = /^Digit([1-9])$/.exec(e.code);
  if (d && M.slotEls[+d[1] - 1]) { e.preventDefault(); mvTapSlot(M, +d[1] - 1); }
  else if (e.key === "Escape") mvDeselect(M);
});
// A tap anywhere outside the bubbles and gaps drops the selection.
document.addEventListener("pointerdown", e => {

});

/* 12-pairs.js — Paired conjunctions: the fourth round of every normal game, played like a text. A short paragraph
   (pairs.json "texts") has one gap per pair (levels.json "pairs": A2 1, B1 / B2+ 2). The pairs float in the pool as
   split bubbles (both … and): dropped on a gap, the first half goes there and the second half appears in its own
   place further on. The pool also has levels.json "pairDecoys" bubbles from the text's "dx": other real pairs that
   fit no gap (no made-up combos like both … as: with no translation, they gave themselves away).
   Check, tries and feedback as in a text (10-game.js); no Clues. Points: 2 per gap right on the first check, 1 later. */
const PAIR = {}, PTEXT = {};
DATA.pairs.pairs.forEach(p => { PAIR[p.id] = p; });
DATA.pairs.texts.forEach(t => { PTEXT[t.id] = t; });
const pairTexts = lv => DATA.pairs.texts.filter(t => t.lv === lv);
// A Favorites game plays every favorite paragraph (G.favs.P, one round each; G.favs.pk = the next one).
function pairsDue() { if (G.mode === "fav") return G.favs.pk < G.favs.P.length; return G.mode === "normal" && (DATA.levels[G.level] || {}).pairs > 0 && pairTexts(G.level).length > 0; }
// A bubble: a pair, with its halves and job.
function pairItem(id) { const p = PAIR[id]; return { id, a: p.a, b: p.b, base: p, job: p.job }; }
const pairLabel = x => x.a + " … " + x.b;
function startPairs() {
  const fav = G.mode === "fav", t = fav ? G.favs.P[G.favs.pk++] : orderPool(pairTexts(G.level), 1)[0], L = DATA.levels[t.lv] || DATA.levels[G.level];
  G.r = G.sm = null; G.xi = 1; G.phase = "pairs";
  G.pr = { t, gaps: t.p.map(pairItem), dx: shuffle(t.dx.slice()).slice(0, L.pairDecoys || 0).map(pairItem), tries: 0, first: null, firstPick: null };
  roundBase("ptext");
  renderPairsCard(); renderPairsPool(); pairsTools();
  metAdd(G.pr.gaps.concat(G.pr.dx).flatMap(x => [x.a, x.b]));
  hintEl.innerHTML = tx("pairsIntro");
  updateProgress(); sndShuffle();
}

/* ---------- Rendering ---------- */
// The paragraph: [first half] = a gap (with its number), [second half] = its mirror, filled with the bubble's second half.
// Both halves and the words between sit in one band (.pband), so a pair reads as ONE gap, not two (from the phrasal
// verbs game's split gaps): the band is also a drop target and a tap on it means its gap. The band is a row of pieces
// of one height (.pseg: the gap, each word, the second half; purple to pink), so the dotted slots sit exactly inside it
// and it can wrap between words; a zero-width anchor (.pa) gives the slot pieces the same baseline as the words.
const PAIR_HUE = [265, 330];
function pairBandHTML(k, mid) {
  const ws = mid.trim() ? mid.trim().split(/\s+/) : [], n = ws.length + 2, A = '<i class="pa">&#8203;</i>';
  const h = x => Math.round(PAIR_HUE[0] + (PAIR_HUE[1] - PAIR_HUE[0]) * x / n);
  const seg = (j, inner) => '<span class="pseg' + (j === 0 ? " p0" : "") + (j === n - 1 ? " pz" : "") + '" style="--a:' + h(j) + ";--b:" + h(j + 1) + ";--m:" + h(j + .5) + '">' + inner + "</span>";
  return '<span class="pband" data-i="' + k + '">' + [
    seg(0, A + '<span class="slot pslot" role="button" tabindex="0" data-i="' + k + '" aria-label="' + esc(tx("gap")) + " " + (k + 1) + '"><i class="slot-n" aria-hidden="true">' + (k + 1) + "</i></span>"),
    ...ws.map((w, j) => seg(j + 1, w)),
    seg(n - 1, A + '<span class="pmirror" data-i="' + k + '" aria-hidden="true"></span>')
  ].join("<wbr>") + "</span>";
}
// Where a band wraps, the piece at the end of the line stays open and fades out to the right, and the first piece of
// the next line fades in from the left (.cut-r / .cut-l). Run after every layout change.
function pairBreaks() {
  const R = G.pr; if (!R || !R.bands || !R.bands[0] || !R.bands[0].isConnected) return;
  R.bands.forEach(b => {
    const s = [...b.querySelectorAll(".pseg")], top = s.map(x => x.getBoundingClientRect().top);
    s.forEach((x, j) => { const cut = j + 1 < s.length && top[j + 1] - top[j] > x.offsetHeight / 2; x.classList.toggle("cut-r", cut); if (j + 1 < s.length) s[j + 1].classList.toggle("cut-l", cut); });
  });
}
addEventListener("resize", () => { if (G.phase === "pairs") pairBreaks(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(pairBreaks);
function renderPairsCard() {
  const R = G.pr, t = R.t, raw = t.body[0];
  let n = 0;
  R.caps = [];
  const body = esc(raw).replace(/\[([^\]]+)\]([^\[]*)\[([^\]]+)\]/g, (m, h, mid, h2, off, all) => {
    const k = n++;
    R.caps[k] = /(^|[.!?]\s+)$/.test(all.slice(0, off));
    return pairBandHTML(k, mid);
  });
  card.className = "card pairscard";
  card.innerHTML = '<span class="tag">★ ' + esc(tx("pairsTag")) + " · " + esc((nativeUi() && t.framePt) || t.frame) + '</span><h2 class="ttl">' + esc(t.title) + "</h2>" +
    '<div class="lines"><div class="ln"><p class="say">' + body + '</p><p class="lt" lang="pt">' + esc(t.pt[0]) + "</p></div></div>";
  R.slotEls = [...card.querySelectorAll(".pslot")];
  R.bands = [...card.querySelectorAll(".pband")];
  requestAnimationFrame(pairBreaks);
}
function renderPairsPool() {
  const R = G.pr;
  R.M = mvInit({
    slotEls: R.slotEls, zone: i => [...R.bands[i].querySelectorAll(".pseg")].map(e => e.getBoundingClientRect()), area: card, live: () => G.phase === "pairs" && G.pr === R,
    label: (W, i) => i >= 0 ? (R.caps[i] ? cap(W.a) : W.a) : pairLabel(W),
    after: () => { pairMirror(); pairsTools(); }
  }, shuffle(R.gaps.concat(R.dx).map(x => Object.assign({ t: pairLabel(x), hue: POOL_HUE }, x))), poolEl, POOL_HUE);
  poolEl.insertAdjacentHTML("afterbegin", '<span class="tag pooltag">' + esc(tx("poolTag")) + "</span>");
}
// Every gap's second half shows the second half of the bubble in it.
function pairMirror() {
  const R = G.pr;
  R.M.slots.forEach((W, i) => { const m = card.querySelector('.pmirror[data-i="' + i + '"]'); m.textContent = W ? W.b : ""; m.classList.toggle("filled", !!W); m.classList.toggle("ok", !!W && W.locked && W.el.classList.contains("ok")); R.bands[i].classList.toggle("filled", !!W); });
  pairBreaks();
}
function pairsTools() {
  const R = G.pr, M = R && R.M, play = G.phase === "pairs";
  triesEl.innerHTML = Array.from({ length: maxTries() }, (_, i) => '<i class="' + (R && i < R.tries ? "used" : "") + '"></i>').join("");
  hintBtn.style.display = "none";
  resetBtn.disabled = !play || !M || !M.slots.some(W => W && !W.locked);
  checkBtn.disabled = !play;
  checkBtn.classList.toggle("pulse", play && !!M && M.slots.every(Boolean));
}

/* ---------- Checking ---------- */
function pairsCheck() {
  const R = G.pr, M = R.M; if (G.phase !== "pairs") return;
  const empty = M.slots.map((W, i) => W ? -1 : i).filter(i => i >= 0);
  if (empty.length) { empty.forEach(i => flash(R.slotEls[i], "nudge")); sndBack(); hintEl.innerHTML = tx("emptyLeft"); return; }
  mvDeselect(M);
  const right = R.gaps.map((p, i) => M.slots[i].id === p.id), wrong = right.map((ok, i) => ok ? -1 : i).filter(i => i >= 0);
  R.tries++;
  if (!R.first) { R.first = right.slice(); R.firstPick = M.slots.map(W => W.id); }
  if (!wrong.length) return pairsFinish(true);
  sndBad(); flash(card, "shake");
  if (R.tries >= maxTries()) {
    G.phase = "checking"; pairsTools(); hintEl.innerHTML = tx("outOfTries");
    setTimeout(() => { if (G.pr === R) pairsFinish(false); }, reduceMotion ? 0 : 700);
    return;
  }
  const left = maxTries() - R.tries;
  let msg = '<span class="alert">' + tx(wrong.length === 1 ? "wrong1" : "wrongN", { n: wrong.length }) + "</span>";
  if (lvl().feedback === "spots") {
    M.slots.forEach((W, i) => { if (wrong.includes(i)) W.el.classList.add("bad"); else { W.locked = true; W.el.classList.add("ok"); R.slotEls[i].classList.add("locked"); } });
    pairMirror(); G.phase = "checking";
    setTimeout(() => {
      if (G.pr !== R) return;
      mvFlip(M, () => wrong.forEach(i => { const W = M.slots[i]; W.el.classList.remove("bad"); mvSetSlot(M, i, null); mvHome(M, W); }));
      G.phase = "pairs"; pairMirror(); pairsTools();
    }, reduceMotion ? 300 : 900);
    msg += " " + tx(wrong.length === 1 ? "wrongBack" : "wrongBackN");
  }
  hintEl.innerHTML = msg + " " + tx(left === 1 ? "tryLeft" : "triesLeft", { n: left });
  scrollToHint(); pairsTools();
}
// End of the round: every gap shows its pair (green, or amber when the game put it there), every bubble its job colour.
function pairsFinish(allRight) {
  const R = G.pr, M = R.M, t = R.t;
  const ok = R.gaps.map((p, i) => !!M.slots[i] && M.slots[i].id === p.id);
  R.last = M.slots.map(W => W ? W.id : null);
  mvFlip(M, () => {
    R.gaps.forEach((p, i) => { const W = M.slots[i]; if (W && !ok[i]) { W.el.classList.remove("bad"); mvSetSlot(M, i, null); mvHome(M, W); } });
    R.gaps.forEach((p, i) => {
      if (M.slots[i]) return;
      const W = M.words.find(w => w.slot < 0 && w.id === p.id);
      if (W) { mvLeave(W); mvSetSlot(M, i, W); W.el.classList.add("shown"); }
    });
  });
  M.words.forEach(W => { W.locked = true; W.el.classList.remove("sel"); W.el.style.setProperty("--h", jobHue(W.job)); W.el.classList.add("job"); if (W.slot < 0) W.home.classList.add("extra"); else if (!W.el.classList.contains("shown")) W.el.classList.add("ok"); });
  R.slotEls.forEach((el, i) => { el.classList.add("locked"); el.insertAdjacentHTML("beforeend", '<sup class="sn' + (R.first[i] ? "" : ok[i] ? " late" : " bad") + '">' + (i + 1) + "</sup>"); });
  pairMirror();
  const pts = R.gaps.reduce((s, p, i) => s + (R.first[i] ? PTS_FIRST : ok[i] ? PTS_LATER : 0), 0), max = R.gaps.length * PTS_FIRST;
  const perfect = allRight && R.tries === 1;
  Object.assign(R, { ok, pts, perfect });
  G.phase = "done"; G.score += pts;
  (G.pairs = G.pairs || []).push({ pts, max, t, gaps: R.gaps, first: R.first.slice(), firstPick: R.firstPick.slice() });
  card.classList.add("done"); poolEl.classList.add("done");
  showScore(); if (pts) flash(scoreEl, "up");
  if (allRight) { sndOk(); burst(card); }
  toast("+" + pts + " · " + tx(perfect ? "perfect" : allRight ? "nice" : ok.some(Boolean) ? "gotIt" : "done"), allRight ? "" : "zero");
  recordProgress(t.id, perfect ? 2 : allRight ? 1 : 0);
  tickDay(); updateProgress();
  toolsEl.hidden = true;
  hintEl.innerHTML = tx("doneNote");
  setTimeout(() => { if (G.pr === R) showPairsReveal(); }, reduceMotion ? 0 : 500);
}
function pairsReset() { if (G.phase === "pairs" && G.pr) { mvClear(G.pr.M); sndBack(); pairsTools(); } }

/* ---------- After the round ---------- */
// The score, Translation and Next; a card per gap (the pair, why the first choice was wrong), then the extra bubbles.
function showPairsReveal() {
  const R = G.pr, pt = nativeUi(), k = R.ok.filter(Boolean).length;
  revealEl.innerHTML = '<div class="rv-bar"><div class="rv-head"><span class="rv-sc"><b class="rv-score">' + tx("correctOf", { k, n: R.gaps.length }) + "</b>" +

    '<ol class="exl">' + R.gaps.map((p, i) => pairCardHTML(R, i, pt)).join("") + "</ol>";
  revealEl.hidden = false;

  $("next").addEventListener("click", nextRound);

// Why a bubble is wrong in a gap: so / such, or the general message.
function pairWhy(x, p, pt) {

}
function pairCardHTML(R, i, pt) {
  const p = R.gaps[i], ok = R.ok[i], late = ok && !R.first[i], chose = pairItem(late ? R.firstPick[i] : R.last[i] || R.firstPick[i]), P = p.base;
  const why = !R.first[i] ? '<p class="ex-you">' + tx(late ? "youChoseFirst" : "youChose") + " <b class='ex-bad'>" + esc(pairLabel(chose)) + "</b>, " + tx("rightIs", { x: "<b>" + esc(pairLabel(p)) + "</b>" }) + '<br><span class="ex-wwhy">' + pairWhy(chose, p, pt) + "</span></p>" : "";
  return '<li class="ex ' + (late ? "late" : ok ? "ok" : "bad") + '" data-i="' + i + '" style="--h:' + jobHue(P.job) + '"><details' + (R.first[i] ? "" : " open") + "><summary>" +
    '<div class="ex-head"><span class="ex-tags"><span class="sn">' + (i + 1) + '</span><span class="ex-mk">' + (late ? "↻" : ok ? "✓" : "✗") + "</span>" + jobChip(P.job, pt) +
    (P.trap ? '<span class="chip trapchip">' + esc(tx("ptTrap")) + "</span>" : "") + '</span></div><p class="ex-s"><b class="ex-v">' + esc(pairLabel(p)) + "</b> · " + ptBadge() + ' <span lang="pt">' + esc(P.pt) + "</span></p></summary>" +
    why + '<div class="ex-why"><p class="ex-en">' + starTxt(pt ? P.sayPt : P.say) + "</p>" + (P.note ? '<p class="ex-note">' + starTxt(pt ? P.note.pt : P.note.en) + "</p>" : "") + "</div></details></li>";

// After the round: a tap on a gap opens its card.
card.addEventListener("click", e => {
