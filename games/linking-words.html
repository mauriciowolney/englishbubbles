.pairscard .tag { --h: 302; }   /* its label pill runs violet to the pairs' pink */
/* 14-soap.css — every linking-word bubble (.b.w: pool, gaps, the tutorial's demo) and a pair's filled second half
   (.pmirror.filled) as a soap bubble (from Be Do Modal via Vocabulary Bubbles, 2026-11-22): almost clear, a faint film
   of colour inside and a 1.5px coloured rim, both turning once in 10 s. Before the check every bubble is the pool's
   violet; after it, its job's colour (--h), with a stronger film (.job). Built from spans (SOAP + soapify in
   18-soap.js) at z-index -1 in the bubble's own stacking context, so the text stays on top. The film and the rim turn
   by rotating a still conic gradient (.spin); what follows the mouse moves by transform / opacity only. Per-theme
   numbers are tokens in 00-base.css (--soap-*, --spot-plus, --film-a, --srim-*, --sglow-*, --rimhi-*, --faceg-*). */
.b.w, .pmirror.filled { --th: var(--h); --s1: var(--th); --s2: calc(var(--th) + 40); --s3: calc(var(--th) - 40);
  isolation: isolate; border-color: transparent; background: none;
  --ig: inset 0 0 12px hsla(var(--th), 95%, var(--sglow-l), var(--sglow-a));   /* the inner glow, drawn above the film by .film::after; states change it */
  box-shadow: 0 6px 14px var(--soap-sh); }
.b.w.job, .pmirror.filled { --film-a: .5; --sglow-a: .55; }   /* after the check: the job's colour shows */
.b.w::before { content: none; }   /* the shine spot is the .spot span */
.b.w::after { background: none; }   /* ::after is only the hover strip (10-game.css) */
:is(.w, .pmirror) > :is(.film, .spot, .rim, .glint) { z-index: -1; cursor: inherit; }
.pmirror:not(.filled) > :is(.film, .spot, .rim, .glint) { display: none; }
:is(.w, .pmirror) .film { position: absolute; inset: -1.5px; border-radius: inherit; overflow: hidden; pointer-events: none; }
:is(.w, .pmirror) .film::before { content: ""; position: absolute; inset: 0; z-index: 1;
  background: radial-gradient(120% 120% at 30% 20%, rgba(255,255,255,var(--soap-hi)), rgba(255,255,255,var(--soap-lo)) 60%, transparent); }
:is(.w, .pmirror) .film::after { content: ""; position: absolute; inset: 1.5px; z-index: 3; border-radius: inherit; box-shadow: var(--ig); transition: box-shadow .25s ease; }
/* The turning colour of film and rim: a square wider than the bubble's diagonal, centred; rotating it = turning the
   conic gradient's start. Both start together, so their colours stay in step. */
:is(.w, .pmirror) .spin { position: absolute; left: 50%; top: 50%; width: calc(100% + 1.6em); aspect-ratio: 1; translate: -50% -50%; animation: spin 10s linear var(--dl, 0s) infinite; }
:is(.w, .pmirror) .film .spin { background: conic-gradient(from var(--ang), hsla(var(--s1), 95%, 76%, var(--film-a)) 0 30%, hsla(var(--s2), 95%, 80%, calc(var(--film-a) * .7)) 50%, hsla(var(--s3), 90%, 78%, calc(var(--film-a) * .85)) 72%, hsla(var(--s1), 95%, 76%, var(--film-a)) 92%); }
:is(.w, .pmirror) .rim .spin { background: conic-gradient(from var(--ang), hsla(var(--s1), 90%, var(--srim-l), var(--srim-a)) 0 30%, hsla(var(--s2), 90%, calc(var(--srim-l) + 4%), calc(var(--srim-a) * .7)) 50%, hsla(var(--s3), 85%, calc(var(--srim-l) + 2%), calc(var(--srim-a) * .85)) 72%, hsla(var(--s1), 90%, var(--srim-l), var(--srim-a)) 92%); }
@keyframes spin { to { transform: rotate(360deg); } }
/* What follows the mouse: 18-soap.js writes these wrappers' transform / opacity; the look is the <i> inside */
:is(.w, .pmirror) .fg > i, :is(.w, .pmirror) .rh > i, :is(.w, .pmirror) .spot i, :is(.w, .pmirror) .glint > i { position: absolute; inset: 0; }
:is(.w, .pmirror) .film .fg { position: absolute; left: -10%; top: -45%; width: 120%; height: 190%; z-index: 2; opacity: 0; will-change: transform, opacity; }
:is(.w, .pmirror) .fg > i { background: radial-gradient(closest-side, hsla(var(--th), 100%, var(--faceg-l), var(--faceg-a)), transparent); }
:is(.w, .pmirror) .spot { position: absolute; left: .5em; top: .42em; width: .62em; height: .5em; pointer-events: none; transform: rotate(-14deg); will-change: transform; }   /* one size and place (em), never stretched by a wide bubble */
:is(.w, .pmirror) .spot > i:first-child { background: radial-gradient(closest-side, rgba(255,255,255,var(--soap-gl)) 32%, rgba(255,255,255,calc(var(--soap-gl) * .55)) 62%, rgba(255,255,255,0)); }
:is(.w, .pmirror) .spot .pl { opacity: 0; }   /* brighter, wider core as the mouse nears */
:is(.w, .pmirror) .spot .pl i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--spot-plus) * .85)), rgba(255,255,255,var(--spot-plus)) 42%, rgba(255,255,255,calc(var(--spot-plus) * .55)) 52%, rgba(255,255,255,calc(var(--spot-plus) * .33)) 62%, rgba(255,255,255,calc(var(--spot-plus) * .12)) 81%, rgba(255,255,255,0)); }
/* the small second spot: a thin streak along the bottom-right curve; it moves the other way, a third as far */
:is(.w, .pmirror) .glint { position: absolute; right: calc(.47em - .17em); bottom: calc(.47em - .085em); width: .34em; height: .17em; pointer-events: none; opacity: .8; transform: rotate(-45deg); will-change: transform, opacity; }
:is(.w, .pmirror) .glint > i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--soap-gl) * .75)) 45%, rgba(255,255,255,0)); }
/* the rim: a ring (a mask cuts out its middle) over the clear border */
:is(.w, .pmirror) .rim { position: absolute; inset: -1.5px; border-radius: inherit; padding: 1.5px; pointer-events: none; overflow: hidden;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
:is(.w, .pmirror) .rim .rh { position: absolute; left: -5%; top: -40%; width: 110%; height: 180%; opacity: 0; will-change: transform, opacity; }   /* the side facing the mouse lights up */
:is(.w, .pmirror) .rh > i { background: radial-gradient(closest-side, hsla(var(--th), 100%, var(--rimhi-l), var(--rimhi-a)), transparent); }

/* States. Hover / focus / carried / picked glow more (picked: a pink ring); right / wrong / shown turn the rim green /
   red / amber: the bubble's own border, the masked .rim hidden (recolouring the masked rim left some bubbles painted as
   solid green boxes until the next repaint, in Chromium). */
.b.w { --glow2: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); }
@media (hover: hover) {
  .b.w:hover:not(.drag):not(.ok):not(.shown):not(.bad):not(.job) { border-color: transparent; --ig: var(--glow2); box-shadow: 0 12px 22px var(--soap-sh2); }
}
.b.w:focus-visible { border-color: transparent; --ig: var(--glow2); box-shadow: 0 12px 22px var(--soap-sh2); }
.b.w.sel { border-color: transparent; --ig: var(--glow2); box-shadow: 0 12px 22px var(--soap-sh2), 0 0 0 4px hsla(330,90%,70%,.45); }
.b.w.drag { border-color: transparent; --ig: var(--glow2); box-shadow: 0 18px 30px var(--soap-sh2), 0 0 0 4px hsla(var(--th),90%,72%,.2); }
.b.w.ok, .pmirror.ok { --ig: inset 0 0 16px hsla(150, 80%, 60%, .42); box-shadow: 0 6px 14px var(--soap-sh); }
.pmirror.ok { background: none; }
.b.w.bad { --ig: inset 0 0 16px hsla(350, 90%, 68%, .45); box-shadow: 0 6px 14px var(--soap-sh), 0 0 0 4px hsla(350,85%,65%,.16); }
.b.w.shown { --ig: inset 0 0 16px hsla(45, 95%, 60%, .45); box-shadow: 0 6px 14px var(--soap-sh); }
.b.w.ok, .pmirror.ok { border-color: hsla(150, 60%, 48%, .85); }
.b.w.bad { border-color: hsla(350, 80%, 60%, .85); }
.b.w.shown { border-color: hsla(40, 90%, 55%, .9); }
:is(.w.ok, .w.bad, .w.shown, .pmirror.ok) > .rim { display: none; }

/* Bob and film pause while hovered (no edge jitter); off screen (#stage.still), while a bubble is carried
   (body.carrying) or while the explanations open or close (body.calm, 18-soap.js); the films also while the page
   scrolls (body.scrolling) */
@media (hover: hover) { .pool .w:hover { animation-play-state: paused; } }
#stage.still :is(.w, .spin), body.carrying :is(.pool .w, .spin), body.calm :is(.pool .w, .spin), body.scrolling .spin { animation-play-state: paused !important; }
/* Touch screens: the film doesn't turn (each bubble keeps its own --ang); the bob stays */
@media (hover: none) { :is(.w, .pmirror) .spin { animation: none; } }
@media (prefers-reduced-motion: reduce) { :is(.w, .pmirror) .spin { animation: none; } }
/* the mirror needs a position for its spans; never set one on .b.w: it overrode .w.drag's fixed and a grabbed bubble
   flew off the screen (2026-11-23) */
.pmirror.filled { position: relative; }
.pmirror.filled:not(.ok) { color: var(--ink); font-weight: 500; }   /* the second half looks like the bubble that brought it */
/* 23-sky.css — from Be Do Modal's revamp (2026-11-22, via Vocabulary Bubbles): the background bubbles, the custom
   colour picker, no page scroll behind a window. */
/* Background bubbles drifting up behind everything (made in 08-sky.js). lvh, not vh: Android's address bar would make
   them jump. Only transform / opacity animate; paused while a bubble is carried or an explanation opens. */
.sky { position: fixed; top: 0; left: 0; right: 0; height: 100vh; height: 100lvh; z-index: -1; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; }
.sky.in { opacity: var(--sky-o); }
.sky span {
  position: absolute; bottom: -120px; border-radius: 50%;
  border: 1.5px solid hsla(var(--h), 80%, var(--sky-rim-l), var(--sky-rim-a));
  background: radial-gradient(circle at 30% 26%, rgba(255,255,255,var(--sky-hi)), hsla(var(--h), 90%, 78%, var(--sky-tint-a)) 50%, hsla(var(--h), 90%, 72%, calc(var(--sky-tint-a) * .8)) 70%, transparent 71%);
  box-shadow: inset 0 0 14px hsla(var(--h), 95%, var(--sky-glow-l), var(--sky-glow-a));
  filter: blur(2px);
  animation: skydrift var(--t, 30s) linear infinite; animation-delay: var(--d, 0s);
  opacity: 0;
}
body.carrying .sky span, body.calm .sky span { animation-play-state: paused; }
@keyframes skydrift {
  0% { transform: translate3d(0, 0, 0); opacity: 0; }
  8% { opacity: .6; }
  50% { transform: translate3d(var(--x, 20px), -60vh, 0); transform: translate3d(var(--x, 20px), -60lvh, 0); }
  92% { opacity: .45; }
  100% { transform: translate3d(0, -125vh, 0); transform: translate3d(0, -125lvh, 0); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .sky { display: none; } }

/* The custom colour picker (01-theme.js): a full-width row under the swatches while picking. Tracks are pills of their
   own gradient, the handle a white disc ringed in the colour being made. contain: it never widens the pop-over. */
.cpick { contain: inline-size; min-width: 0; display: none; flex: 1 0 100%;
  flex-direction: column; gap: 12px; padding: 12px 0 4px; margin-top: 4px; border-top: 1px solid var(--dock-line); }
.swwrap.open.picking .cpick { display: flex; }
.cpick { --cp-h: 220; --cp-s: 100%; --cp-l: 74%; --cp-c: hsl(var(--cp-h), var(--cp-s), var(--cp-l)); }
.cp-top { display: flex; align-items: center; gap: 10px; }
.cp-hex { flex: 1; min-width: 0; font-family: inherit; font-size: .95rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: transparent;
  border: 1px solid var(--dock-line); border-radius: 999px; padding: .45em .9em; outline: none; }
.cp-hex:focus-visible { border-color: var(--underline); box-shadow: 0 0 0 3px hsla(335,80%,65%,.2); }
.cp-r { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 14px; margin: 4px 0; border-radius: 999px; cursor: pointer;
  background: var(--cp-track); box-shadow: inset 0 0 0 1px var(--dock-line); outline: none; touch-action: none; }
.cp-h { --cp-track: linear-gradient(90deg, hsl(0,85%,62%), hsl(60,85%,62%), hsl(120,85%,62%), hsl(180,85%,62%), hsl(240,85%,62%), hsl(300,85%,62%), hsl(359,85%,62%)); }
.cp-s { --cp-track: linear-gradient(90deg, hsl(var(--cp-h), 0%, var(--cp-l)), hsl(var(--cp-h), 100%, var(--cp-l))); }
.cp-l { --cp-track: linear-gradient(90deg, hsl(var(--cp-h), var(--cp-s), 8%), hsl(var(--cp-h), var(--cp-s), 50%), hsl(var(--cp-h), var(--cp-s), 92%)); }
.cp-r::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 4px solid var(--cp-c); box-shadow: 0 2px 6px var(--shadow); transition: transform .2s cubic-bezier(.34,1.56,.64,1); }
.cp-r::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 4px solid var(--cp-c); box-shadow: 0 2px 6px var(--shadow); }
.cp-r::-moz-range-track { background: transparent; }
.cp-r:hover::-webkit-slider-thumb, .cp-r:active::-webkit-slider-thumb { transform: scale(1.15); }
.cp-r:focus-visible { box-shadow: inset 0 0 0 1px var(--dock-line), 0 0 0 3px hsla(335,80%,65%,.25); }

/* While a window (Guide, Favorites / Seen, end card) or the tutorial is open, the page behind doesn't scroll; only the
   window's card does. Scripts can still scroll the page (the tutorial moves it to what it points at). */
html:has(.favmodal.show), html:has(.tour:not([hidden])) { overflow: hidden; overscroll-behavior: none; }

/* While the tutorial or a window (.favmodal) is open (body.covered, 18-soap.js) the game behind it stands still: the
   blur and dimming over it aren't redrawn on every frame (slow phones). Bubbles inside the window keep moving. */
body.covered :is(.pool .w, body.picking .slot:not(.filled):not(.locked), .spin, .sky span):not(.tour *, .favmodal *) { animation-play-state: paused !important; }
/* 30-end.css — end-of-game modal contents. */
.pend { text-align: center; padding: 6px 0 4px; }
.pend b { display: block; font-size: 2.2rem; }
.stars { font-size: 2.2rem; letter-spacing: .12em; color: #f5a300; line-height: 1; }
.stars span { display: inline-block; animation: starin .5s cubic-bezier(.34,1.56,.64,1) backwards; }
.stars span:nth-child(2) { animation-delay: .12s; }
.stars span:nth-child(3) { animation-delay: .24s; }
.stars .off { opacity: .22; }
@keyframes starin { from { opacity: 0; transform: scale(.3) rotate(-60deg); } }
.fams { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 12px 0 4px; }
.endbtns { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 14px 0; }
.rlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.rlist li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 18px; border: 2px solid hsla(150,60%,50%,.55); background: hsla(150,70%,60%,.1); }
.rlist li.miss { border-color: hsla(350,75%,60%,.55); background: hsla(350,85%,70%,.1); }
.rlist .ri { flex: none; width: 1.2em; text-align: center; font-size: 1.1rem; }
.rlist .rs { flex: 1; min-width: 0; line-height: 1.35; }
.rlist .rt { font-size: .86rem; opacity: .78; margin-top: 3px; }
.rlist .rp { flex: none; font-weight: 600; opacity: .8; }
@media (prefers-reduced-motion: reduce) { .stars span { animation: none; } }
/* 31-lists.css — favourite star and the Favorites / Seen list modal. */
.hbtns { display: inline-flex; gap: inherit; flex: none; }
.favstar { appearance: none; border: 0; background: transparent; cursor: pointer; padding: .3em; line-height: 0; border-radius: 50%;
  color: var(--ink); opacity: .55; transition: transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s ease, color .2s ease; }
.favstar svg { display: block; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; }
.favstar:hover { opacity: .9; transform: scale(1.12); }
.favstar.on { color: #f5a300; opacity: 1; }
.favstar.on svg { fill: currentColor; }
.favstar.pop, #favbtn.pop { animation: starpop .45s cubic-bezier(.34,1.56,.64,1); }
@keyframes starpop { 0% { transform: scale(1); } 35% { transform: scale(1.45) rotate(-12deg); } 100% { transform: scale(1); } }
.pf.top { z-index: 130; }   /* a star's gold sparks fly in front of the Favorites / end card */
@media (prefers-reduced-motion: reduce) { .favstar.pop, #favbtn.pop { animation: none; } }
.favstar:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
/* On the translation card: bottom-right corner */
.reveal > .favstar { position: absolute; right: 12px; bottom: 12px; }
.listtabs { width: max-content; margin: 0 auto 12px; padding: 2px; border: 1px solid var(--dock-line); border-radius: 999px; flex-wrap: nowrap; }
.listtabs[hidden] { display: none; }
.rlist li.plain { border-color: var(--dock-line); background: transparent; }
.rlist .favstar { flex: none; align-self: center; }
.rlist .chip { font-size: .6rem; padding: .28em .7em; margin-bottom: 4px; }
.listempty { text-align: center; opacity: .7; margin: 18px 0 8px; }
@media (prefers-reduced-motion: reduce) { .favstar.pop { animation: none; } }
/* 32-modes.css — progress bar, speed clock, day streak, combo badge, Play menu, quick question, meters, countdown. */
.pbar { height: 6px; margin-top: 5px; border-radius: 999px; background: var(--dock-line); overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--lv, hsl(315,85%,68%)), var(--lv2, hsl(275,80%,68%))); transition: width .5s cubic-bezier(.34,1.2,.64,1); }
/* --lv / --lv2: the chosen level on the page, each level's own on the mastery meters (05-controls.js lvVars) */
/* Speed challenge clock (replaces "Sentence 1 of 5") */
.prog.clock #proglbl { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; }
.prog.clock #clk { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.prog.clock #clkdone { font-size: .75rem; opacity: .75; margin-top: 3px; }
.prog.clock .pbar { height: 8px; }
.prog.clock .days { display: none; }   /* the clock needs the room */
#clk.beat { animation: beat .7s cubic-bezier(.34,1.56,.64,1); }
@keyframes beat { 0% { transform: scale(1); } 30% { transform: scale(1.45); color: hsl(45,95%,55%); text-shadow: 0 0 18px hsla(45,95%,60%,.7); } 100% { transform: scale(1); } }
.prog.urgent #clk { color: hsl(350,80%,58%); animation: pulse 1s ease-in-out infinite; }
.prog.urgent .pbar i { background: hsl(350,80%,58%); }
.days { margin-left: .45em; font-size: .8rem; font-weight: 600; }
/* Combo badge on the score tile */
.score { position: relative; }
.combo { position: absolute; top: -9px; right: -9px; padding: .22em .5em; border-radius: 999px; font-style: normal; font-size: .72rem; font-weight: 700; line-height: 1;
  color: #fff; background: linear-gradient(135deg, hsl(315,85%,68%), hsl(275,80%,68%)); box-shadow: 0 2px 8px var(--shadow); }
.combo[hidden] { display: none; }
.combo.tick { animation: tick .5s cubic-bezier(.34,1.56,.64,1); }
/* Play menu on the "new game" tile */
.playwrap { position: relative; justify-self: end; }
.playmenu { position: absolute; top: calc(100% + 8px); right: 0; z-index: 40; display: flex; flex-direction: column; gap: 2px; width: max-content; min-width: 210px; padding: 6px;
  border-radius: 20px; background: var(--bg-a); border: 1px solid var(--dock-line); box-shadow: 0 12px 30px var(--shadow); animation: cardin .22s cubic-bezier(.34,1.56,.64,1);
  -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4); }
.playmenu[hidden] { display: none; }
.playmenu button { appearance: none; border: 0; background: transparent; color: var(--ink); font: inherit; font-weight: 600; text-align: left; cursor: pointer;
  display: flex; flex-direction: column; gap: 1px; padding: .55em .9em; border-radius: 14px; }
/* A little red dot after the mode being played (as in the newer games) */
.playmenu button.cur span::after { content: " ●"; font-size: .6em; vertical-align: .25em; color: var(--underline); }
.playmenu button small { font-weight: 400; font-size: .76rem; opacity: .7; }
.playmenu button:hover:not(:disabled), .playmenu button:focus-visible { background: var(--dock-line); outline: none; }
.playmenu button:disabled { opacity: .45; cursor: default; }
/* Quick question (replaces the stage for one step) */
#stage[hidden], .tools[hidden], .quiz[hidden] { display: none; }
.quiz { max-width: 640px; margin: 18px auto 0; padding: 18px; border-radius: 26px; text-align: center; background: var(--dock-bg); border: 1px solid var(--dock-line); box-shadow: 0 8px 22px var(--shadow);
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); }   /* the header's glass */
.quiz.in { animation: cardin .3s cubic-bezier(.34,1.56,.64,1); }
.qz-s { margin: 0 0 14px; font-size: clamp(1.15rem, 1vw + .9rem, 1.4rem); font-weight: 500; line-height: 1.35; text-wrap: balance; }
.qz-opts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.qz-opts .pbtn.ok { border-color: hsl(150,60%,48%); background: hsla(150,70%,60%,.18); }
.qz-opts .pbtn.bad { border-color: hsl(350,75%,60%); background: hsla(350,85%,70%,.15); }
.qz-opts .pbtn:disabled { cursor: default; }
.qz-opts .pbtn.ok:disabled, .qz-opts .pbtn.bad:disabled { opacity: 1; }
.qz-why { margin: 12px 0 0; font-size: .95rem; }
/* Favorites game: after each sentence, its star and Next */
.qz-next { display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin-top: 14px; }
.qz-plus { position: fixed; z-index: 60; transform: translate(-50%, -100%); font-weight: 700; font-size: 1.3rem; color: hsl(150,60%,45%); pointer-events: none; animation: qzplus .9s ease-out forwards; }
@keyframes qzplus { to { transform: translate(-50%, -260%); opacity: 0; } }
/* Mastery meters (Seen modal, end screen) */
.meter { display: grid; grid-template-columns: 2.4em 1fr auto; align-items: center; gap: 10px; font-size: .88rem; }
.meter .pbar { margin-top: 0; }
/* A level chip on a list row: its level's gradient, as on the level pill */
.chip.lvchip { background: linear-gradient(135deg, var(--lv, hsl(265,75%,52%)), var(--lv2, hsl(300,70%,50%))); }
.meter span { font-variant-numeric: tabular-nums; opacity: .8; }
.listprog { display: flex; flex-direction: column; gap: 6px; margin: 0 0 14px; }
.listprog[hidden] { display: none; }
.lp-h { margin: 0; font-size: .8rem; opacity: .7; text-align: center; }
.listprog .fams { margin: 4px 0 0; }
/* "No weak rules" under the weakest rules' heading */
.lp-ok { font-size: .85rem; opacity: .8; }
/* "Practice these": top-right of the Favorites / Seen card, left of the ✕ (from Conditional Bubbles) */
#listmodal .favhead { gap: 10px; }
#listmodal .favhead h2 { min-width: 0; }
.favtools { flex: none; display: flex; align-items: center; gap: 8px; }
.favtools .cta { font-size: .85rem; padding: .5em 1.1em; white-space: nowrap; }
.favtools .cta[hidden] { display: none; }
.endprog { display: flex; flex-direction: column; gap: 4px; max-width: 320px; margin: 10px auto 0; text-align: center; }
@media (prefers-reduced-motion: reduce) { #clk.beat, .prog.urgent #clk, .combo.tick, .quiz.in, .qz-plus, .playmenu { animation: none; } }
/* Speed challenge intro: the goal, then 3-2-1-Go (22-modes.js) */
.cdown { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(20,20,40,.35); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: cdfade .2s ease; }
.cd-card { box-sizing: border-box; width: min(360px, 100%); padding: 22px 20px 24px; border-radius: 28px; text-align: center; color: var(--ink); background: var(--bg-a); border: 1px solid var(--dock-line); box-shadow: 0 20px 50px rgba(0,0,0,.28); animation: cardin .3s cubic-bezier(.34,1.56,.64,1); }
.cd-t { margin: 0; font-size: .78rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; opacity: .65; }
.cd-x { margin: 8px 0 4px; font-size: 1.25rem; font-weight: 600; line-height: 1.3; text-wrap: balance; }
.cd-n { display: block; height: 1.25em; font-size: 4rem; line-height: 1.25; color: var(--underline); }
.cd-n.pop { animation: cdpop .5s cubic-bezier(.34,1.56,.64,1); }
@keyframes cdfade { from { opacity: 0; } }
@keyframes cdpop { from { transform: scale(.4); } }
@media (prefers-reduced-motion: reduce) { .cdown, .cd-card, .cd-n.pop { animation: none; } }
/* 60-scrollbar.css — scrollbars in the look of the Stressed syllables game (Guide, lists, tour card; the page has none): a thin glossy pill with the
   pink-to-purple gradient on a clear track. Chrome / Edge / Safari use the ::-webkit-scrollbar parts; Firefox only takes
   colours, so it gets a thin pink thumb (in @supports, since Chrome would let these override the pill). */
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: transparent; margin: 18px 0; }
::-webkit-scrollbar-thumb {
  border: 3px solid transparent; border-radius: 999px; background-clip: padding-box;
  background-image: linear-gradient(180deg, hsl(315,85%,66%), hsl(275,80%,64%));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45);
}
::-webkit-scrollbar-thumb:hover { background-image: linear-gradient(180deg, hsl(315,90%,60%), hsl(275,85%,58%)); }
::-webkit-scrollbar-thumb:active { border-width: 2px; }
::-webkit-scrollbar-button, ::-webkit-scrollbar-corner { display: none; background: transparent; }
@supports (-moz-appearance: none) {
  * { scrollbar-width: thin; scrollbar-color: hsl(295,82%,66%) transparent; }
}
/* The page itself still scrolls on short screens, but shows no bar (only the cards and lists do). */
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }
/* 95-perf.css — the hidden test panel (?fps, 95-perf.js) and what its switches turn off or on (classes on <html>). */
.perfbox { position: fixed; left: 8px; bottom: 8px; z-index: 300; display: flex; flex-direction: column; gap: 5px; padding: 8px 11px 9px; border-radius: 12px;
  background: rgba(10,12,30,.86); color: #fff; font: 500 12px/1.2 "Fredoka", system-ui, sans-serif; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
.perfbox b { font-size: 17px; font-weight: 600; cursor: pointer; }
.perfbox.mini label { display: none; }
.perfbox .pf-slow { opacity: .75; margin-bottom: 2px; }
.perfbox label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.perfbox input { width: 15px; height: 15px; margin: 0; accent-color: #3fcf9a; }
/* longhands, so the pauses (.still, carrying, scrolling: animation-play-state in 14-soap.css) still work */
html.pf-film-off .spin { animation-name: none !important; }
html.pf-film-on .spin { animation-name: spin !important; animation-duration: 10s !important; animation-timing-function: linear !important; animation-iteration-count: infinite !important; }
html.pf-film-on .spin { animation-delay: var(--dl, 0s) !important; }
html.pf-nofloat .pool .w:not(.bad) { animation-name: none !important; }
html.pf-nosky .sky { display: none; }
html.pf-noblur * { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"></div>
<header class="dock" role="toolbar" aria-label="Controls">
  <div class="seg level" id="levelseg" role="group" aria-label="Level"><span class="seg-ind" aria-hidden="true"></span></div>
  <button type="button" class="tourbtn" id="guidebtn" aria-label="Guide" title="Guide: every linking word by job and shape, with examples and Portuguese traps"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M8 8h8M8 12h5"/></svg><span data-ui="guide">Guide</span></button>
  <span class="hbtns" id="listbtns">
  <button type="button" class="tourbtn" id="favbtn" aria-label="Favorites" title="Your favorite texts"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3.2 2.7 5.5 6 .9-4.35 4.25 1 6L12 17l-5.4 2.85 1-6L3.3 9.6l6-.9z"/></svg><span data-ui="favorites">Favorites</span></button>
  <button type="button" class="tourbtn" id="seenbtn" aria-label="Seen texts" title="Your progress, recent and missed texts"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 4v4.5h4.5"/><path d="M12 7.5V12l3 2"/></svg><span data-ui="seen">Seen</span></button>
  </span>
  <button type="button" class="tourbtn" id="tour-btn" aria-label="Tutorial" title="Tutorial: a one-minute tour"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.2a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.4-2.7 4"/><circle cx="12" cy="17.6" r=".6" fill="currentColor"/></svg><span data-ui="tutorial">Tutorial</span></button>
  <div class="seg vseg">
    <span class="volwrap" id="volwrap"><button type="button" id="snd" aria-pressed="true" aria-label="Volume" title="Volume"></button><span class="volp"><input type="range" id="vol" min="0" max="100" step="1" aria-label="Volume"></span></span>
  </div>
  <div class="swwrap" id="swwrap">
    <button type="button" class="swbtn" id="swbtn" aria-label="Background color" aria-expanded="false" title="Background color"></button>
    <div class="sw" id="swatches" role="group" aria-label="Background color"></div>
  </div>
</header>

<div class="wrap">
  <div class="go">
    <div class="score" id="score" title="Points in this game, and your best at this level"><b id="sc">0</b><small id="bestlbl">best 0</small><i class="combo" id="combo" hidden></i></div>
    <div class="prog"><span id="proglbl">Text 1 of 3</span><span class="days" id="days" hidden></span><div class="pbar"><i id="pfill"></i></div></div>
    <div class="playwrap" id="playwrap">
      <button type="button" class="tile" id="restart" title="New game and other ways to play" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.5h-4.5"/></svg><small>new game</small></button>
      <div class="playmenu" id="playmenu" role="menu" hidden>
        <button type="button" role="menuitem" data-mode="normal"><span data-ui="pmNormal">Normal game</span><small id="pm-lv"></small></button>
        <button type="button" role="menuitem" data-mode="speed"><span data-ui="pmSpeed">Quick-fire</span><small id="pm-speed"></small></button>
        <button type="button" role="menuitem" data-mode="review"><span data-ui="pmReview">Review missed</span><small id="pm-miss"></small></button>
        <button type="button" role="menuitem" data-mode="fav"><span data-ui="pmFav">Favorites</span><small id="pm-fav"></small></button>
      </div>
    </div>
  </div>
  <p class="hint" id="hint" aria-live="polite"></p>

  <main id="stage" aria-label="Text">
    <div class="pool" id="pool" aria-label="Linking words"></div>
    <article class="card" id="card"></article>
  </main>
  <section class="quiz" id="quiz" hidden aria-live="polite"></section>

  <div class="tools" id="tools">
    <span class="trywrap"><small class="trylab" data-ui="tries">Tries</small><span class="tries" id="tries" aria-label="Tries left"></span></span>
    <button type="button" class="pbtn" id="hintbtn" title="Show the job of every gap. 1 per text. Unused hints = bonus points."><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2.2h5c.1-1 .5-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg><span data-ui="hint">Clues</span> <small id="hintleft">3 left</small></button>
    <button type="button" class="pbtn" id="resetbtn" title="Send every word back to the pool"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span data-ui="reset">Reset</span></button>
    <button type="button" class="cta" id="checkbtn"><span data-ui="check">Check</span> &#10003;</button>
  </div>

  <section class="reveal" id="reveal" hidden aria-live="polite"></section>
</div>

<div class="favmodal" id="listmodal" role="dialog" aria-modal="true" aria-labelledby="listtitle">
  <div class="favcard">
    <div class="favhead"><h2 id="listtitle"></h2><div class="favtools"><button type="button" class="cta" id="listplay" hidden>Practice these</button><button type="button" class="favx" data-close aria-label="Close">&times;</button></div></div>
    <div class="listprog" id="listprog" hidden></div>
    <div class="seg listtabs" id="listtabs" role="group" aria-label="Which texts"><button type="button" data-tab="recent" data-ui="tabRecent">Recent</button><button type="button" data-tab="missed" data-ui="tabMissed">Missed</button></div>
    <ul class="rlist" id="listbody"></ul>
    <p class="listempty" id="listempty" hidden></p>
  </div>
</div>
<div class="favmodal" id="endmodal" role="dialog" aria-modal="true" aria-labelledby="endtitle">
  <div class="favcard">
    <div class="favhead"><h2 id="endtitle">Game complete!</h2><button type="button" class="favx" data-close aria-label="Close">&times;</button></div>
    <div class="pend"><div class="stars" id="endstars"></div><b id="endscore"></b><div class="pmsg" id="endmsg"></div><div class="psub" id="endsub"></div><div class="psub" id="endhints"></div><div class="psub" id="endtraps"></div></div>
    <div class="endprog" id="endprog"></div>
    <div class="endbtns"><button type="button" class="cta" id="endagain" data-ui="playAgain">Play again</button><button type="button" class="pbtn" id="endcopy">Copy results</button><button type="button" class="pbtn" id="endup" hidden></button></div>
    <ul class="rlist" id="endlist"></ul>
  </div>
</div>
<div class="favmodal" id="guidemodal" role="dialog" aria-modal="true" aria-labelledby="guidetitle">
  <div class="favcard guidecard">
    <div class="favhead"><h2 id="guidetitle">Linking words</h2>
      <div class="tour-lang gd-lang" id="guidelang" role="group" aria-label="Guide language"><button type="button" data-gl="en" lang="en">EN</button><button type="button" data-gl="pt" lang="pt">PT</button></div>
      <button type="button" class="favx" data-close aria-label="Close">&times;</button></div>
    <div id="guidebody"></div>
    <button type="button" class="gd-back" id="guideback" data-close hidden><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg><span id="guidebackt">Back to the explanations</span></button>
  </div>
</div>

<div class="tour" id="tour" hidden>
  <div class="tour-shield"></div>
  <div class="tour-spot" id="tour-spot" aria-hidden="true"></div>
  <div class="tour-card" id="tour-card" role="dialog" aria-modal="true" aria-labelledby="tour-title" aria-describedby="tour-text">
    <button type="button" class="tour-x" id="tour-x" aria-label="Close the tutorial">&times;</button>
    <div class="tour-head">
      <p class="tour-step" id="tour-step"></p>
      <div class="tour-lang" id="tour-lang" role="group" aria-label="Tutorial language"><button type="button" data-tl="en" lang="en">EN</button><button type="button" data-tl="tr"></button></div>
