["Hi Paula! I started a new job at a big hotel last week. I love it, [but] I'm always tired [because] I start work at 6 a.m. I help the guests [when] they arrive, and I answer the phone. Many guests come from other countries. [thats-why] I'm taking an English class!"],"pt":["Oi, Paula! Comecei num emprego novo num hotel grande semana passada. Estou adorando, mas estou sempre cansada porque começo a trabalhar às 6h. Eu ajudo os hóspedes quando eles chegam e atendo o telefone. Muitos hóspedes vêm de outros países. É por isso que estou fazendo aula de inglês!"],"w":{"guests":"hóspedes","answer the phone":"atendo o telefone","countries":"países"},"dx":["or","until-s","like-e"],"notes":[null,null,null,{"en":"No comma after *that's why*: That's why I'm taking an English class.","pt":"Sem vírgula depois de *that's why*: That's why I'm taking an English class."}]},{"id":"a2-11","frame":"Blog","framePt":"Blog","title":"My favorite place","titlePt":"Meu lugar favorito","body":["Every Saturday, I go to the farmers' market near my house [to] buy fruit and vegetables. I go early [because] it gets very busy after ten. The market sells lots of things. [for-example], you can buy fresh bread, cheese and flowers. It's always noisy, [but] I love it!"],"pt":["Todo sábado, vou à feira perto da minha casa para comprar frutas e legumes. Vou cedo porque fica muito cheio depois das dez. A feira vende muitas coisas. Por exemplo, dá para comprar pão fresco, queijo e flores. É sempre barulhenta, mas eu adoro!"],"w":{"farmers' market":"feira","vegetables":"legumes","busy":"cheio","noisy":"barulhenta"},"dx":["or","until-n","then"]},{"id":"a2-12","frame":"Story","framePt":"História","title":"The surprise party","titlePt":"A festa surpresa","body":["It was Dad's birthday, [so] we planned a surprise party. We hid behind the sofa and waited in the dark. [when] Dad opened the door, we all jumped up and shouted \"Surprise!\" The cake was huge, [but] we ate all of it. [finally], Dad opened his presents."],"pt":["Era aniversário do papai, então planejamos uma festa surpresa. Nos escondemos atrás do sofá e esperamos no escuro. Quando o papai abriu a porta, todos pulamos e gritamos \"Surpresa!\". O bolo era enorme, mas comemos tudo. Por fim, o papai abriu os presentes."],"w":{"planned":"planejamos","hid":"nos escondemos","in the dark":"no escuro","jumped up":"pulamos","shouted":"gritamos","huge":"enorme","presents":"presentes"},"dx":["or","because-of","then"]},{"id":"a2-13","frame":"Message","framePt":"Mensagem","title":"Movie night","titlePt":"Noite de filme","body":["Hi Jess! Do you want to come to my place on Friday? We can order pizza [and] watch a movie. [if] you don't like pizza, I can make pasta. Bring your sister too, [because] my brother really wants to meet her. Let me know [before-n] Thursday, OK?"],"pt":["Oi, Jess! Quer vir aqui em casa na sexta? A gente pode pedir pizza e assistir a um filme. Se você não gostar de pizza, eu posso fazer macarrão. Traga a sua irmã também, porque o meu irmão quer muito conhecê-la. Me avise antes de quinta, tá?"],"w":{"order":"pedir","let me know":"me avise","meet":"conhecer"},"dx":["so","but"]},{"id":"a2-14","frame":"Recipe","framePt":"Receita","title":"A quick smoothie","titlePt":"Uma vitamina rápida","body":["[first], wash the fruit and cut it into small pieces. You can use bananas, strawberries or mangoes. [then] put the fruit in the blender with a cup of milk. Add a spoon of honey [if] you like it sweet. Blend [until-s] everything is smooth. Enjoy!"],"pt":["Primeiro, lave as frutas e corte em pedaços pequenos. Você pode usar banana, morango ou manga. Depois, coloque as frutas no liquidificador com uma xícara de leite. Coloque uma colher de mel se você gosta doce. Bata até ficar tudo cremoso. Aproveite!"],"w":{"wash":"lave","pieces":"pedaços","blender":"liquidificador","spoon":"colher","honey":"mel","blend":"bata","smooth":"cremoso"},"dx":["after-s","before-s"]},{"id":"a2-15","frame":"Blog","framePt":"Blog","title":"My Saturday job","titlePt":"O meu trabalho de sábado","body":["On Saturdays I work at a small pet shop. I feed the animals and clean their cages. I don't earn much money, [but] I love my job [because] I can play with puppies all day. Some animals are difficult, [like-e] our old parrot, Rocky. He bites everyone, [so] nobody wants to feed him!"],"pt":["Aos sábados eu trabalho numa pequena pet shop. Eu dou comida para os animais e limpo as gaiolas. Não ganho muito dinheiro, mas amo o meu trabalho porque posso brincar com filhotes o dia inteiro. Alguns animais são difíceis, como o nosso papagaio velho, o Rocky. Ele morde todo mundo, então ninguém quer dar comida para ele!"],"w":{"feed":"dar comida","cages":"gaiolas","earn":"ganho","puppies":"filhotes","parrot":"papagaio","bites":"morde"},"dx":["or","then"],"notes":[null,null,null,{"en":"*Então* here gives a result (nobody wants to feed him), so English says *so*. *Then* is only about time.","pt":"Aqui o *então* dá uma consequência (ninguém quer dar comida para ele), então em inglês é *so*. *Then* é só sobre tempo."}]},{"id":"a2-16","frame":"Story","framePt":"História","title":"Locked out","titlePt":"Trancada para fora","body":["Last night I got home very late. I looked in my bag for my key, [but] it wasn't there! I called my roommate, Kim, [because] I didn't want to sleep outside. She was asleep, so I waited in the cold for an hour. [finally], she opened the door. Now I always check my bag [before-s] I leave the house."],"pt":["Ontem à noite cheguei em casa muito tarde. Procurei a chave na bolsa, mas ela não estava lá! Liguei para a minha colega de apartamento, a Kim, porque não queria dormir na rua. Ela estava dormindo, então esperei no frio por uma hora. Finalmente, ela abriu a porta. Agora eu sempre confiro a bolsa antes de sair de casa."],"w":{"roommate":"colega de apartamento","outside":"na rua","asleep":"dormindo","check":"confiro"},"dx":["after-s","or"]},{"id":"a2-17","frame":"Email","framePt":"E-mail","title":"Welcome to Toronto","titlePt":"Bem-vindo a Toronto","body":["Hi Marco, I'm so happy you're coming to Toronto! It's very cold in January, [so] bring a warm coat and boots. You can take a taxi from the airport, [or] I can pick you up. Call me [when] you land. We can go downtown [to] see the city lights on your first night.","See you soon! Emma"],"pt":["Oi, Marco, estou muito feliz que você vem para Toronto! Faz muito frio em janeiro, então traga um casaco quente e botas. Você pode pegar um táxi no aeroporto, ou eu posso te buscar. Me ligue quando você pousar. A gente pode ir ao centro para ver as luzes da cidade na sua primeira noite.","Até logo! Emma"],"w":{"warm coat":"casaco quente","boots":"botas","pick you up":"te buscar","land":"pousar","downtown":"ao centro"},"dx":["because","until-s"],"notes":[null,null,null,{"en":"*Para* + a verb is *to* in English: *to see*, *to buy*. Never *for to*.","pt":"*Para* + verbo é *to* em inglês: *to see*, *to buy*. Nunca *for to*."}]},{"id":"a2-18","frame":"Blog","framePt":"Blog","title":"Why I love my bike","titlePt":"Por que eu amo a minha bicicleta","body":["I go everywhere by bike: to school, to the park and to my friends' houses. It's cheap, and it's good for my health. [also], I never get stuck in traffic. Last year I couldn't ride for two months [because-of] a broken arm. It was terrible! [thats-why] I'm always very careful now."],"pt":["Eu vou a todo lugar de bicicleta: para a escola, para o parque e para a casa dos meus amigos. É barato e faz bem para a saúde. Além disso, eu nunca fico preso no trânsito. No ano passado, fiquei dois meses sem pedalar por causa de um braço quebrado. Foi terrível! É por isso que agora eu tomo muito cuidado."],"w":{"health":"saúde","stuck":"preso","traffic":"trânsito","ride":"pedalar","broken arm":"braço quebrado","careful":"cuidadoso"},"dx":["because","then"]},{"id":"a2-19","frame":"Message","framePt":"Mensagem","title":"At the dentist","titlePt":"No dentista","body":["Hi Mom! I'm at the dentist now. I have to wait [until-s] the doctor calls my name, and there are five people in front of me. I'm really hungry, [so] can we have lunch together [after-n] my appointment? I want pizza! [if] you're busy, I can eat at school."],"pt":["Oi, mãe! Estou no dentista agora. Tenho que esperar até o médico chamar o meu nome, e tem cinco pessoas na minha frente. Estou com muita fome, então a gente pode almoçar junto depois da minha consulta? Quero pizza! Se você estiver ocupada, eu posso comer na escola."],"w":{"in front of":"na frente de","hungry":"com fome","appointment":"consulta","busy":"ocupada"},"dx":["or","then"]},{"id":"a2-20","frame":"Postcard","framePt":"Cartão-postal","title":"Hello from the mountains","titlePt":"Oi, das montanhas","body":["Dear Grandpa, we're in a small village in the mountains. It's very quiet here [and] the air is so clean. Every morning we walk to a lake. The water is so still that it looks [like-s] a mirror! We wanted to go hiking today, [but] we can't [because-of] the rain. Maybe tomorrow!","Hugs, Nina"],"pt":["Querido vovô, estamos numa vila pequena nas montanhas. Aqui é muito tranquilo e o ar é tão limpo. Toda manhã a gente caminha até um lago. A água é tão parada que parece um espelho! A gente queria fazer trilha hoje, mas não dá por causa da chuva. Quem sabe amanhã!","Beijos, Nina"],"w":{"village":"vila","quiet":"tranquilo","lake":"lago","still":"parada","mirror":"espelho","go hiking":"fazer trilha"},"dx":["because","or"],"notes":[null,{"en":"*Como* compares two things here: the water looks *like* a mirror.","pt":"Aqui o *como* compara duas coisas: a água parece (*looks like*) um espelho."}]},{"id":"a2-21","frame":"Sign","framePt":"Aviso","title":"Pool rules","titlePt":"Regras da piscina","body":["Welcome to the Sunny Park pool! Please take a shower [before-n] swimming. Children under 10 can swim only [if] an adult is with them. You can bring food, [but] please eat it in the café area. The pool is open from 9 a.m. [until-n] 6 p.m."],"pt":["Bem-vindo à piscina do Sunny Park! Por favor, tome uma ducha antes de nadar. Crianças com menos de 10 anos só podem nadar se um adulto estiver com elas. Você pode trazer comida, mas, por favor, coma na área do café. A piscina fica aberta das 9h até as 18h."],"w":{"shower":"ducha","under":"com menos de","adult":"adulto"},"dx":["or","because-of"]},{"id":"a2-22","frame":"Diary","framePt":"Diário","title":"My first concert","titlePt":"O meu primeiro show","body":["Last Friday I went to my first concert with my cousin. [when] we arrived, there was a huge line outside. We waited for an hour, [but] it was worth it. The band played all my favorite songs. [after-that], we bought T-shirts and took photos. I got home at midnight, [so] I was very tired the next day."],"pt":["Na sexta passada, fui ao meu primeiro show com o meu primo. Quando chegamos, tinha uma fila enorme lá fora. Esperamos por uma hora, mas valeu a pena. A banda tocou todas as minhas músicas favoritas. Depois disso, compramos camisetas e tiramos fotos. Cheguei em casa à meia-noite, então fiquei muito cansado no dia seguinte."],"w":{"huge":"enorme","line":"fila","worth it":"valeu a pena","band":"banda"},"dx":["because","until-s"]},{"id":"a2-23","frame":"Message","framePt":"Mensagem","title":"Moving day","titlePt":"Dia de mudança","body":["Hi Ben! Are you free on Sunday? I'm moving to a new apartment, and I need some help [to] carry the boxes. My brother can't come [because] he broke his leg last week. We can start at 9 [or] 10, it's up to you. [if] you help me, I'll buy you lunch!"],"pt":["Oi, Ben! Você está livre no domingo? Vou me mudar para um apartamento novo e preciso de ajuda para carregar as caixas. O meu irmão não pode vir porque quebrou a perna semana passada. A gente pode começar às 9 ou às 10, você que sabe. Se você me ajudar, eu te pago o almoço!"],"w":{"moving":"me mudando","carry":"carregar","boxes":"caixas","broke his leg":"quebrou a perna","it's up to you":"você que sabe"},"dx":["so","but"]},{"id":"a2-24","frame":"Blog","framePt":"Blog","title":"Sundays at Grandma's","titlePt":"Domingos na casa da vovó","body":["Every Sunday my family has lunch at my grandma's house. She cooks a lot of food, [like-e] roast chicken, rice and her famous chocolate cake. The house is always full and noisy [because] all my cousins come too. [after-n] lunch, the adults drink coffee [and] the kids play in the garden. I love Sundays!"],"pt":["Todo domingo a minha família almoça na casa da minha avó. Ela cozinha muita comida, como frango assado, arroz e o famoso bolo de chocolate dela. A casa fica sempre cheia e barulhenta porque todos os meus primos vêm também. Depois do almoço, os adultos tomam café e as crianças brincam no jardim. Eu amo domingos!"],"w":{"roast chicken":"frango assado","full":"cheia","noisy":"barulhenta","garden":"jardim"},"dx":["so","or"]},{"id":"a2-25","frame":"Email","framePt":"E-mail","title":"Sorry I missed class","titlePt":"Desculpe pela falta","body":["Dear Ms. Lopez, I'm sorry I wasn't in class yesterday. I stayed at home [because] I had a fever. I'm feeling better now, [but] I'm still a little tired. Can you send me the homework, please? I want to do it [before-n] the test on Friday. [also], can I take the quiz next week?","Thank you, Daniel"],"pt":["Prezada professora Lopez, desculpe por não ter ido à aula ontem. Fiquei em casa porque estava com febre. Já estou me sentindo melhor, mas ainda estou um pouco cansado. A senhora pode me mandar a lição de casa, por favor? Quero fazer antes da prova de sexta. Além disso, posso fazer o teste na semana que vem?","Obrigado, Daniel"],"w":{"fever":"febre","still":"ainda","homework":"lição de casa","quiz":"teste"},"dx":["or","until-n"]},{"id":"a2-26","frame":"Story","framePt":"História","title":"A name for the puppy","titlePt":"Um nome para o filhote","body":["Last week we got a puppy! We couldn't choose a name. My dad wanted Max, [but] my sister wanted Buddy. [finally], we chose Coco [because] he's brown like chocolate. Coco is very sweet, but he cries at night [until-s] somebody holds him."],"pt":["Na semana passada ganhamos um filhote! A gente não conseguia escolher um nome. O meu pai queria Max, mas a minha irmã queria Buddy. Finalmente, escolhemos Coco porque ele é marrom como chocolate. O Coco é muito fofo, mas ele chora à noite até alguém pegar ele no colo."],"w":{"puppy":"filhote","choose":"escolher","sweet":"fofo","cries":"chora","holds":"pega no colo"},"dx":["so","or"]},{"id":"a2-27","frame":"Article","framePt":"Artigo","title":"Sleep well!","titlePt":"Durma bem!","body":["Teenagers need about nine hours of sleep every night. Many teens don't sleep enough, [so] they feel tired at school. Some things can help. [for-example], put your phone away an hour before bed. [if] you can't sleep, read a book [or] listen to calm music."],"pt":["Os adolescentes precisam de umas nove horas de sono toda noite. Muitos adolescentes não dormem o suficiente, então ficam cansados na escola. Algumas coisas podem ajudar. Por exemplo, guarde o celular uma hora antes de dormir. Se você não conseguir dormir, leia um livro ou ouça uma música calma."],"w":{"teenagers":"adolescentes","enough":"o suficiente","put your phone away":"guarde o celular","calm":"calma"},"dx":["because","then"]},{"id":"a2-28","frame":"Message","framePt":"Mensagem","title":"Game night","titlePt":"Noite de jogo","body":["Hey Lucas! Do you want to play online tonight? I can play [after-s] I finish my homework, maybe at 8. My internet is slow today, [so] the big games don't work well. We can play for an hour, [but] I have to go to bed at 9:30. [if] you can't play tonight, we can play tomorrow!"],"pt":["E aí, Lucas! Quer jogar online hoje à noite? Posso jogar depois que eu terminar a lição de casa, lá pelas 8. A minha internet está lenta hoje, então os jogos grandes não funcionam bem. A gente pode jogar por uma hora, mas eu tenho que ir dormir às 9h30. Se você não puder jogar hoje, a gente joga amanhã!"],"w":{"homework":"lição de casa","slow":"lenta","work well":"funcionam bem"},"dx":["because","or"]},{"id":"a2-29","frame":"Email","framePt":"E-mail","title":"A new friend","titlePt":"Uma nova amiga","body":["Hi Sofia! I have a new friend at school. Her name is Yuki, [and] she's from Japan. She only arrived in March, but she already speaks English [like-s] an American! She's really funny. [also], she makes amazing cookies. Last week we couldn't play outside [because-of] the rain, so we baked cookies at her house.","Love, Bia"],"pt":["Oi, Sofia! Tenho uma nova amiga na escola. O nome dela é Yuki, e ela é do Japão. Ela só chegou em março, mas já fala inglês como uma americana! Ela é muito engraçada. Além disso, ela faz uns biscoitos incríveis. Na semana passada não deu para brincar lá fora por causa da chuva, então fizemos biscoitos na casa dela.","Beijos, Bia"],"w":{"already":"já","funny":"engraçada","amazing":"incríveis","baked":"assamos","cookies":"biscoitos"},"dx":["because","or"],"notes":[null,{"en":"Portuguese *como* + a noun is *like* in English: like an American.","pt":"*Como* + um substantivo é *like* em inglês: like an American."},null,{"en":"*Because of* + a noun (because of the rain). *Because* + a sentence (because it rained).","pt":"*Because of* + substantivo (because of the rain). *Because* + frase (because it rained)."}]},{"id":"a2-30","frame":"Recipe","framePt":"Receita","title":"Banana bread","titlePt":"Pão de banana","body":["You need very old bananas [to] make good banana bread: black ones are perfect! [first], heat the oven to 180 °C. Mash three bananas with a fork, and mix them with sugar, two eggs and some flour. Pour the mix into a pan and bake it for 50 minutes. [after-that], leave it on the table for ten minutes [before-n] cutting it."],"pt":["Você precisa de bananas bem maduras para fazer um bom pão de banana: as pretas são perfeitas! Primeiro, aqueça o forno a 180 °C. Amasse três bananas com um garfo e misture com açúcar, dois ovos e um pouco de farinha. Despeje a massa numa fôrma e asse por 50 minutos. Depois disso, deixe o pão em cima da mesa por dez minutos antes de cortar."],"w":{"mash":"amasse","fork":"garfo","flour":"farinha","pour":"despeje","pan":"fôrma","bake":"asse"},"dx":["because-of","or"],"notes":[{"en":"*Para* + a verb is *to* in English: to make. Never *for to make*.","pt":"*Para* + verbo é *to* em inglês: to make. Nunca *for to make*."},null,null,{"en":"*Before* + an -ing verb: before cutting it (antes de cortar).","pt":"*Before* + verbo com -ing: before cutting it (antes de cortar)."}]},{"id":"a2-31","frame":"Message","framePt":"Mensagem","title":"Stuck at the airport","titlePt":"Preso no aeroporto","body":["Hi Mom! I'm still at the airport. My flight is late [because-of] a big storm in Chicago, and now I have to wait here [until-n] eleven o'clock! [thats-why] I can't have dinner with you tonight. Sorry! I'll call you [when] I land."],"pt":["Oi, mãe! Ainda estou no aeroporto. Meu voo está atrasado por causa de uma tempestade forte em Chicago, e agora tenho que esperar aqui até as onze horas! É por isso que não vou conseguir jantar com você hoje. Desculpa! Te ligo quando eu pousar."],"w":{"still":"ainda","flight":"voo","storm":"tempestade","land":"pousar"},"dx":["because","before-n"],"notes":[null,{"en":"*Até* + a time is *until* when something goes on up to that moment: wait until eleven.","pt":"*Até* + horário é *until* quando algo continua até aquele momento: wait until eleven."},null,{"en":"*When* + the present for the future: when I land (not *when I will land*).","pt":"*When* + presente para o futuro: when I land (não *when I will land*)."}]},{"id":"a2-32","frame":"Blog","framePt":"Blog","title":"Grandpa's garden","titlePt":"A horta do vovô","body":["My grandpa has a garden behind his house. It's not very big, [but] it's full of food! He grows lots of vegetables there, [like-e] tomatoes, carrots and beans. He works in the garden every morning [because] he says it keeps him young. I visit him on Sundays, and [after-s] we have lunch, he always gives me a big bag of vegetables."],"pt":["Meu avô tem uma horta atrás da casa dele. Não é muito grande, mas é cheia de comida! Ele planta muitos legumes lá, como tomate, cenoura e feijão. Ele trabalha na horta todas as manhãs porque diz que isso o mantém jovem. Eu visito ele aos domingos e, depois que almoçamos, ele sempre me dá uma sacola grande de legumes."],"w":{"grows":"planta","vegetables":"legumes","beans":"feijão","keeps him young":"o mantém jovem","bag":"sacola"},"dx":["so","until-s"]},{"id":"a2-33","frame":"Diary","framePt":"Diário","title":"My first driving lesson","titlePt":"Minha primeira aula de direção","body":["Today I had my first driving lesson! I couldn't eat anything [before-n] the lesson [because] I was so nervous. But my teacher was very calm and patient. [after-n] twenty minutes, I felt much better, and I even drove on a real street! Now I can't stop thinking about cars. [thats-why] I'm still awake at midnight!"],"pt":["Hoje tive a minha primeira aula de direção! Não consegui comer nada antes da aula porque estava muito nervosa. Mas o meu instrutor foi muito calmo e paciente. Depois de vinte minutos, eu já me sentia muito melhor, e até dirigi numa rua de verdade! Agora não consigo parar de pensar em carros. É por isso que ainda estou acordada à meia-noite!"],"w":{"driving lesson":"aula de direção","nervous":"nervosa","patient":"paciente","awake":"acordada"},"dx":["because-of","if"]},{"id":"a2-34","frame":"Postcard","framePt":"Cartão-postal","title":"Hello from Cancún","titlePt":"Olá de Cancún","body":["Hi Lucas! Greetings from Cancún! The weather is perfect, and the sea is warm [like-s] a bath. We go swimming early every morning, [before-s] it gets too hot. [after-n] lunch, we usually sleep for an hour. In the evening, we walk on the beach [or] eat tacos in town. I never want to go home!","Hugs, Nina"],"pt":["Oi, Lucas! Um abraço de Cancún! O tempo está perfeito, e o mar está quente como água de banho. A gente vai nadar cedo todas as manhãs, antes que fique quente demais. Depois do almoço, normalmente dormimos uma hora. À noite, caminhamos na praia ou comemos tacos na cidade. Não quero voltar para casa nunca!","Abraços, Nina"],"w":{"greetings":"saudações","warm":"quente","bath":"banho","too hot":"quente demais"},"dx":["but","thats-why"]},{"id":"a2-35","frame":"Email","framePt":"E-mail","title":"Sorry, I can't come","titlePt":"Desculpe, não posso ir","body":["Dear Mr. Brown, I'm sorry, but I can't come to class tomorrow. My grandma has a doctor's appointment, and I have to go with her [to] help her. She can't walk very well [because-of] her bad knee. Can you send me the homework by email? [also], can I take the test next week? I can do it on Monday [if] that's OK with you.","Thank you, Clara"],"pt":["Prezado Sr. Brown, sinto muito, mas não posso ir à aula amanhã. Minha avó tem consulta médica, e eu preciso ir com ela para ajudá-la. Ela não consegue andar muito bem por causa do joelho ruim. O senhor pode me mandar a lição de casa por e-mail? Além disso, posso fazer a prova na semana que vem? Posso fazer na segunda, se estiver tudo bem para o senhor.","Obrigada, Clara"],"w":{"doctor's appointment":"consulta médica","knee":"joelho","homework":"lição de casa","test":"prova"},"dx":["because","for-example"],"notes":[{"en":"*Para* + a verb is *to*: to help her. Never *for help her*.","pt":"*Para* + verbo é *to*: to help her. Nunca *for help her*."},null,null,null]},{"id":"a2-36","frame":"Article","framePt":"Artigo","title":"Why do cats hate water?","titlePt":"Por que os gatos odeiam água?","body":["Most cats are very clean animals, [but] they hate getting wet. Scientists think this is [because] the first cats lived in the desert, far from rivers and lakes. A cat's fur also gets very heavy in water, [so] it can't run or jump well. Not all cats are the same, though. [for-example], the Turkish Van cat loves swimming!"],"pt":["A maioria dos gatos é muito limpa, mas eles odeiam se molhar. Os cientistas acham que isso acontece porque os primeiros gatos viviam no deserto, longe de rios e lagos. O pelo do gato também fica muito pesado na água, então ele não consegue correr nem pular direito. Mas nem todos os gatos são iguais. Por exemplo, o gato turco Van adora nadar!"],"w":{"getting wet":"se molhar","desert":"deserto","fur":"pelo","heavy":"pesado"},"dx":["because-of","or"],"notes":[null,null,{"en":"Portuguese *então* here gives a result, so English uses *so*, not *then*.","pt":"Aqui o *então* do português dá uma consequência, então em inglês é *so*, não *then*."},null]},{"id":"a2-37","frame":"Blog","framePt":"Blog","title":"My English teacher","titlePt":"Meu professor de inglês","body":["My English classes are really fun this year [because-of] our new teacher, Mr. Davis. He's very tall, and he dances [like-s] a robot when we get an answer right! His homework is never boring. [for-example], last week we had to watch a cartoon in English. [thats-why] English is now my favorite subject."],"pt":["Minhas aulas de inglês estão muito divertidas este ano por causa do nosso novo professor, o Sr. Davis. Ele é muito alto e dança como um robô quando acertamos uma resposta! A lição de casa dele nunca é chata. Por exemplo, na semana passada tivemos que assistir a um desenho em inglês. É por isso que agora inglês é a minha matéria favorita."],"w":{"tall":"alto","robot":"robô","boring":"chata","cartoon":"desenho animado","subject":"matéria"},"dx":["because","if"]},{"id":"a2-38","frame":"Story","framePt":"História","title":"The birthday cake","titlePt":"O bolo de aniversário","body":["It was Dad's birthday, [so] Lucy and her brother decided to make a cake. They had to finish it [before-s] Dad came home at six. The first cake was a disaster: it was black on top! They tried again, [but] the second one was too small. [finally], at 5:55, the third cake was ready. Dad loved it!"],"pt":["Era aniversário do pai, então a Lucy e o irmão decidiram fazer um bolo. Eles tinham que terminar antes de o pai chegar em casa, às seis. O primeiro bolo foi um desastre: ficou preto em cima! Eles tentaram de novo, mas o segundo ficou pequeno demais. Finalmente, às 17h55, o terceiro bolo ficou pronto. O pai adorou!"],"w":{"disaster":"desastre","on top":"em cima","tried again":"tentaram de novo","ready":"pronto"},"dx":["until-s","or"],"notes":[null,{"en":"*Até* is not always *until*: you finish something *before* (or *by*) a time. *Until* is for something that goes on up to that time.","pt":"*Até* nem sempre é *until*: você termina algo *before* (ou *by*) um horário. *Until* é para algo que continua até aquele momento."},null,null]}],"B1":[{"id":"b1-01","frame":"Review","framePt":"Avaliação","title":"Old but charming","titlePt":"Velho, mas charmoso","body":["[although] the hotel is quite old, our room was clean and comfortable. The breakfast was amazing, and the staff were very friendly. [however], the Wi-Fi didn't work [during] our stay, so I couldn't send any emails. [overall], it's a great place for a quiet vacation."],"pt":["Embora o hotel seja bem antigo, o nosso quarto era limpo e confortável. O café da manhã era incrível, e os funcionários eram muito simpáticos. No entanto, o Wi-Fi não funcionou durante a nossa estadia, então não consegui mandar nenhum e-mail. No geral, é um ótimo lugar para férias tranquilas."],"w":{"quite":"bem","staff":"funcionários","stay":"estadia","quiet":"tranquilas"},"dx":["despite","because","even"]},{"id":"b1-02","frame":"Note","framePt":"Bilhete","title":"Looking after Mimi","titlePt":"Cuidando da Mimi","body":["Hi Jake, thanks again for looking after Mimi! She's an easy cat, [as-long-as] she has food and fresh water. I left some extra food in the kitchen [in-case] you need it. Please don't let her go outside [unless] you're watching her. I'll text you [as-soon-as] my plane lands on Sunday.","Thanks! Carla"],"pt":["Oi, Jake, obrigada de novo por cuidar da Mimi! Ela é uma gata tranquila, desde que tenha comida e água fresca. Deixei comida extra na cozinha, caso você precise. Por favor, não deixe ela sair a não ser que você esteja de olho. Te mando mensagem assim que o meu avião pousar no domingo.","Obrigada! Carla"],"w":{"looking after":"cuidar de","fresh water":"água fresca","watching":"de olho","lands":"pousar"},"dx":["since-r","during","despite"]},{"id":"b1-03","frame":"Blog","framePt":"Blog","title":"Can an app teach you English?","titlePt":"Um aplicativo ensina inglês?","body":["Language apps are cheap and fun. [on-the-other-hand], they can't really teach you to have a conversation. My advice is simple: use an app every day, [even-if] it's only for ten minutes. Watch series in English [instead-of/rather-than] watching them dubbed. [in-fact/actually], that's how I learned most of my English!"],"pt":["Os aplicativos de idiomas são baratos e divertidos. Por outro lado, eles não conseguem te ensinar de verdade a conversar. Meu conselho é simples: use um aplicativo todo dia, mesmo que seja só por dez minutos. Assista a séries em inglês em vez de assistir dubladas. Na verdade, foi assim que aprendi a maior parte do meu inglês!"],"w":{"advice":"conselho","dubbed":"dubladas","most of":"a maior parte de"},"dx":["even","instead","in-case"]},{"id":"b1-04","frame":"Story","framePt":"História","title":"A bad start","titlePt":"Um começo ruim","body":["Mariana left home early [so-that] she wouldn't be late for her job interview. [however], there was an accident on the highway, and her bus didn't move for an hour. [by-the-time] she arrived, she was forty minutes late. She was sure she had lost the job. [in-the-end/however], she got it: the manager had been stuck in the same traffic!"],"pt":["A Mariana saiu cedo de casa para não se atrasar para a entrevista de emprego. No entanto, houve um acidente na rodovia, e o ônibus dela ficou parado por uma hora. Quando ela chegou, estava quarenta minutos atrasada. Ela tinha certeza de que tinha perdido a vaga. No fim, ela conseguiu: o gerente tinha ficado preso no mesmo trânsito!"],"w":{"job interview":"entrevista de emprego","highway":"rodovia","sure":"certeza","manager":"gerente","stuck":"preso"},"dx":["at-the-end","in-order-to","despite"]},{"id":"b1-05","frame":"Message","framePt":"Mensagem","title":"Our science project","titlePt":"Nosso trabalho de ciências","body":["Hi team! Here's the plan for our project. Ana will write the introduction [while-t] Leo makes the slides. [meanwhile], I'll look for some good photos. We need to send everything to the teacher [by] Thursday night. Let's meet in the library on Wednesday [in-case] we have any problems."],"pt":["Oi, pessoal! Aqui está o plano do nosso trabalho. A Ana vai escrever a introdução enquanto o Leo faz os slides. Enquanto isso, vou procurar umas fotos boas. Precisamos mandar tudo para o professor até quinta à noite. Vamos nos encontrar na biblioteca na quarta, caso a gente tenha algum problema."],"w":{"slides":"slides","look for":"procurar"},"dx":["during","until-n","unless"],"notes":[null,null,{"en":"*Até* as a deadline is *by* (by Thursday). *Until* is for something that goes on up to then.","pt":"*Até* como prazo é *by* (by Thursday). *Until* é para algo que continua até aquele momento."},null]},{"id":"b1-06","frame":"Article","framePt":"Artigo","title":"Why do cats sleep so much?","titlePt":"Por que os gatos dormem tanto?","body":["Cats sleep up to sixteen hours a day, [but] that doesn't mean they are lazy. Cats are hunters, and hunting uses a lot of energy. [as-a-result/therefore], they need a lot of rest. [unlike] humans, they sleep in lots of short naps. [even-though] they look fast asleep, they can wake up in a second if they hear a noise."],"pt":["Os gatos dormem até dezesseis horas por dia, mas isso não quer dizer que sejam preguiçosos. Os gatos são caçadores, e caçar gasta muita energia. Por isso, eles precisam de muito descanso. Ao contrário dos humanos, eles dormem em vários cochilos curtos. Mesmo parecendo estar num sono profundo, eles conseguem acordar num segundo se ouvem um barulho."],"w":{"lazy":"preguiçosos","hunters":"caçadores","rest":"descanso","naps":"cochilos","fast asleep":"num sono profundo"},"dx":["despite","however","such-as"]},{"id":"b1-07","frame":"Email","framePt":"E-mail","title":"Where is my sofa?","titlePt":"Cadê o meu sofá?","body":["Dear Customer Service, I ordered a sofa from your website on May 2nd, and you promised to deliver it within a week. [since-then], I have called you four times, [but] nobody can tell me where it is. I paid extra for fast delivery, [so] I would like that money back. [unless] I receive the sofa by Friday, I will cancel my order.","Best regards, Paulo Mendes"],"pt":["Prezado Atendimento ao Cliente, comprei um sofá no site de vocês no dia 2 de maio, e vocês prometeram entregá-lo em uma semana. Desde então, liguei quatro vezes, mas ninguém sabe me dizer onde ele está. Paguei a mais pela entrega rápida, então gostaria desse dinheiro de volta. A menos que eu receba o sofá até sexta, vou cancelar o pedido.","Atenciosamente, Paulo Mendes"],"w":{"ordered":"comprei","deliver":"entregar","within":"em até","delivery":"entrega","cancel":"cancelar","order":"pedido"},"dx":["since-n","if","then"]},{"id":"b1-08","frame":"Blog","framePt":"Blog","title":"42 kilometers","titlePt":"42 quilômetros","body":["Last Sunday I ran my first marathon! I trained for six months [in-order-to/to] be ready. [during] the first twenty kilometers, I felt great. [after-that], my legs started to hurt, and I wanted to stop. [despite/in-spite-of] the pain, I didn't give up: people kept cheering all the way. It took me almost five hours, and I loved every minute."],"pt":["No domingo passado, corri a minha primeira maratona! Treinei por seis meses para estar pronto. Durante os primeiros vinte quilômetros, me senti ótimo. Depois disso, as minhas pernas começaram a doer, e eu quis parar. Apesar da dor, não desisti: as pessoas torceram o caminho todo. Levei quase cinco horas, e amei cada minuto."],"w":{"trained":"treinei","hurt":"doer","pain":"dor","give up":"desistir","kept cheering":"continuaram torcendo"},"dx":["while-t","for-n","although"],"notes":[{"en":"*Para* + a verb is *to* (or *in order to*) + the verb, never *for*: in order to be ready.","pt":"*Para* + verbo é *to* (ou *in order to*) + verbo, nunca *for*: in order to be ready."},null,null,null]},{"id":"b1-09","frame":"Tips","framePt":"Dicas","title":"Flying tips","titlePt":"Dicas para voar","body":["Get to the airport at least two hours before your flight. [otherwise], you might miss it. Keep your passport in your carry-on bag [in-case] your suitcase gets lost. [once] you're through security, find your gate first and then relax. Drink lots of water [during] the flight, [as-r/because/since-r] the air on planes is very dry."],"pt":["Chegue ao aeroporto pelo menos duas horas antes do voo. Senão, você pode perdê-lo. Guarde o passaporte na bagagem de mão, caso a sua mala se perca. Depois de passar pela segurança, procure primeiro o seu portão e depois relaxe. Beba bastante água durante o voo, já que o ar dos aviões é muito seco."],"w":{"at least":"pelo menos","carry-on bag":"bagagem de mão","suitcase":"mala","security":"segurança","gate":"portão","dry":"seco"},"dx":["in-case-of","while-t","unless"],"notes":[null,null,{"en":"Careful: Portuguese *uma vez que* gives a reason (since). English *once* is about time: as soon as, after.","pt":"Cuidado: *uma vez que* em português dá uma causa (since). *Once* em inglês é sobre tempo: assim que, depois que."},null,null]},{"id":"b1-10","frame":"Story","framePt":"História","title":"Lights out!","titlePt":"Luzes apagadas!","body":["Last night we were having dinner [when] suddenly all the lights went out. My little sister started to cry, [so] Dad lit some candles. [instead-of] watching TV, we played cards and told stories. [actually/in-fact], it was the best night of the week!"],"pt":["Ontem à noite, estávamos jantando quando, de repente, todas as luzes se apagaram. Minha irmãzinha começou a chorar, então o papai acendeu umas velas. Em vez de assistir à TV, jogamos cartas e contamos histórias. Na verdade, foi a melhor noite da semana!"],"w":{"suddenly":"de repente","went out":"se apagaram","lit":"acendeu","candles":"velas","cards":"cartas"},"dx":["instead","during","unless"],"notes":[null,null,null,{"en":"*Actually* = na verdade. *Atualmente* is *currently* or *these days*.","pt":"*Actually* = na verdade. *Atualmente* é *currently* ou *these days*."}]},{"id":"b1-11","frame":"Forum post","framePt":"Post de fórum","title":"Car or no car?","titlePt":"Carro ou não?","body":["I live in a big city, and I'm thinking of buying a car. A car would be great for weekend trips. [on-the-other-hand], parking is really expensive here. [besides-x], the traffic is terrible [during] rush hour. [since-r/as-r/because] the subway station is close to my apartment, maybe I don't need one. What would you do?"],"pt":["Moro numa cidade grande e estou pensando em comprar um carro. Um carro seria ótimo para viagens de fim de semana. Por outro lado, estacionar é muito caro aqui. Além do mais, o trânsito é terrível na hora do rush. Já que a estação de metrô fica perto do meu apartamento, talvez eu não precise de um. O que vocês fariam?"],"w":{"weekend trips":"viagens de fim de semana","parking":"estacionar","rush hour":"hora do rush","subway":"metrô"},"dx":["while-t","because-of","once"]},{"id":"b1-12","frame":"Card","framePt":"Cartão","title":"Thank you!","titlePt":"Obrigada!","body":["Dear Mrs. Lima, I passed my driving test! [thanks-to] your lessons, I wasn't nervous at all. You taught me lots of useful things, [such-as] parking on a hill. [as-soon-as] I got my license, I drove to my grandma's house. She was very happy, [although/though/even-though] she says I still drive too slowly!","With love, Júlia"],"pt":["Querida Sra. Lima, passei na prova de direção! Graças às suas aulas, não fiquei nem um pouco nervosa. A senhora me ensinou muitas coisas úteis, como estacionar numa ladeira. Assim que peguei a minha carteira, dirigi até a casa da minha avó. Ela ficou muito feliz, embora diga que eu ainda dirijo devagar demais!","Com carinho, Júlia"],"w":{"driving test":"prova de direção","at all":"nem um pouco","useful":"úteis","hill":"ladeira","license":"carteira de motorista"},"dx":["because","despite","until-s"]},{"id":"b1-13","frame":"Blog","framePt":"Blog","title":"Life without a car","titlePt":"A vida sem carro","body":["Two years ago I sold my car, and I don't miss it at all. [since-r/as-r] I live downtown, I can walk almost everywhere. For longer trips, I take the train [instead-of/rather-than] driving. [whats-more/plus/in-addition/besides-x], I save around $400 a month on gas and parking. Life without a car isn't always easy, [though-x]. Carrying groceries home in the rain is no fun!"],"pt":["Há dois anos vendi o meu carro e não sinto nenhuma falta dele. Como moro no centro, consigo ir a pé para quase todo lugar. Para viagens mais longas, pego o trem em vez de dirigir. E tem mais: economizo uns 400 dólares por mês com gasolina e estacionamento. Mas a vida sem carro nem sempre é fácil. Carregar as compras para casa na chuva não tem graça nenhuma!"],"w":{"miss":"sinto falta","downtown":"no centro","gas":"gasolina","parking":"estacionamento","groceries":"compras (de mercado)"},"dx":["once","instead","despite"],"notes":[{"en":"*Uma vez que* (a reason) is *since* or *as*. *Once* is about time: as soon as.","pt":"*Uma vez que* (causa) é *since* ou *as*. *Once* é sobre tempo: assim que."},null,null,{"en":"*Though* at the end of a sentence is a relaxed *but*: it isn't always easy, though.","pt":"*Though* no fim da frase é um *mas* descontraído: nem sempre é fácil, só que."}]},{"id":"b1-14","frame":"Article","framePt":"Artigo","title":"How to remember new words","titlePt":"Como lembrar palavras novas","body":["Learning new words is easy; remembering them is the hard part. Here's a method that works. First, write each new word on a card with a short example. [next/then/after-that], say the example out loud three times. Review your cards the next day, then after three days and again after a week. [in-other-words], see each word again [before-s] you forget it. Apps [such-as/like-e] Anki can do this for you."],"pt":["Aprender palavras novas é fácil; lembrar delas é que é difícil. Aqui vai um método que funciona. Primeiro, escreva cada palavra nova num cartão com um exemplo curto. Em seguida, diga o exemplo em voz alta três vezes. Revise os cartões no dia seguinte, depois de três dias e de novo depois de uma semana. Ou seja, veja cada palavra de novo antes de esquecê-la. Aplicativos como o Anki podem fazer isso por você."],"w":{"out loud":"em voz alta","review":"revise"},"dx":["until-s","anyway","during"],"notes":[null,{"en":"*In other words* (ou seja) says the same idea again, more simply.","pt":"*In other words* (ou seja) repete a mesma ideia de um jeito mais simples."}]},{"id":"b1-15","frame":"Email","framePt":"E-mail","title":"Wrong size, late delivery","titlePt":"Tamanho errado, entrega atrasada","body":["Dear Customer Service, On May 3rd I ordered a pair of running shoes from your website. They arrived two weeks late [due-to/because-of] a problem with the delivery company. [in-addition/also/besides-x/whats-more], they are the wrong size. I would like to exchange them for a size 9. [if-not/otherwise], please give me a full refund. I'm happy to send them back [as-long-as] you pay for the shipping.","Best regards, Paulo Mendes"],"pt":["Prezado Atendimento ao Cliente, no dia 3 de maio comprei um par de tênis de corrida no site de vocês. Eles chegaram com duas semanas de atraso devido a um problema com a transportadora. Além disso, o tamanho está errado. Gostaria de trocá-los por um tamanho 41. Caso contrário, por favor, me devolvam o valor total. Posso enviá-los de volta, desde que vocês paguem o frete.","Atenciosamente, Paulo Mendes"],"w":{"running shoes":"tênis de corrida","delivery company":"transportadora","exchange":"trocar","full refund":"reembolso total","shipping":"frete"},"dx":["because","unless","in-case"],"notes":[null,null,null,{"en":"*Desde que* with a condition is *as long as*, not *since*.","pt":"*Desde que* com sentido de condição é *as long as*, não *since*."}]},{"id":"b1-16","frame":"Story","framePt":"História","title":"Everything went wrong","titlePt":"Deu tudo errado","body":["On the day of my first job interview, everything went wrong. My alarm didn't go off, and [by-the-time] I woke up, it was already 8:30. I spilled coffee on my shirt [while-t/as-t] I was running to the bus stop. [as-soon-as/when] I arrived, I apologized. [even-though/although/though] I was twenty minutes late, the interview went really well. [in-the-end], they gave me the job!"],"pt":["No dia da minha primeira entrevista de emprego, deu tudo errado. O meu despertador não tocou e, quando acordei, já eram 8h30. Derrubei café na camisa enquanto corria para o ponto de ônibus. Assim que cheguei, pedi desculpas. Mesmo estando vinte minutos atrasado, a entrevista foi muito bem. No fim, eles me deram o emprego!"],"w":{"alarm":"despertador","go off":"tocar","spilled":"derrubei","bus stop":"ponto de ônibus","apologized":"pedi desculpas"},"dx":["at-the-end","despite","during"],"notes":[{"en":"*By the time* = when something had already happened: it was already 8:30.","pt":"*By the time* = quando algo já tinha acontecido: já eram 8h30."},null,null,null,{"en":"*No fim* is *in the end*. *At the end* needs *of*: at the end of the day.","pt":"*No fim* é *in the end*. *At the end* pede *of*: at the end of the day."}]},{"id":"b1-17","frame":"Article","framePt":"Artigo","title":"Coffee: friend or enemy?","titlePt":"Café: amigo ou inimigo?","body":["For years, people said coffee was bad for you. [in-fact/actually], recent studies show that two or three cups a day can be good for your heart. Coffee can also help you concentrate. [on-the-other-hand], too much caffeine can cause headaches and sleep problems. [for-instance], if you drink coffee after 4 p.m., you may not sleep well. [overall], coffee is fine [as-long-as] you don't drink too much."],"pt":["Durante anos, as pessoas disseram que café fazia mal. Na verdade, estudos recentes mostram que duas ou três xícaras por dia podem fazer bem para o coração. O café também pode ajudar na concentração. Por outro lado, cafeína demais pode causar dor de cabeça e problemas de sono. Por exemplo, se você toma café depois das 16h, pode não dormir bem. No geral, o café não faz mal, desde que você não beba demais."],"w":{"studies":"estudos","heart":"coração","caffeine":"cafeína","headaches":"dores de cabeça"},"dx":["unless","such-as","even"],"notes":[{"en":"*In fact* and *actually* mean *na verdade*. *Atualmente* (these days) is *currently*.","pt":"*In fact* e *actually* querem dizer *na verdade*. *Atualmente* é *currently*."}]},{"id":"b1-18","frame":"Note","framePt":"Bilhete","title":"Welcome to my place","titlePt":"Bem-vinda à minha casa","body":["Hi Ana, welcome! Here are a few things you need to know. Feel free to use anything in the kitchen, [including] the coffee machine. Water the plants every two days. [otherwise], they'll die in this heat. [whenever] you go out, please lock the back door too. [in-case-of] an emergency, call my neighbor Tom: 555-0182.","Enjoy! Rachel"],"pt":["Oi, Ana, seja bem-vinda! Aqui vão algumas coisas que você precisa saber. Fique à vontade para usar qualquer coisa na cozinha, incluindo a máquina de café. Regue as plantas a cada dois dias. Senão, elas vão morrer com esse calor. Sempre que sair, por favor, tranque a porta dos fundos também. Em caso de emergência, ligue para o meu vizinho Tom: 555-0182.","Aproveite! Rachel"],"w":{"feel free":"fique à vontade","water":"regue","heat":"calor","lock":"tranque","back door":"porta dos fundos","neighbor":"vizinho"},"dx":["unless","even","instead"]},{"id":"b1-19","frame":"Forum post","framePt":"Post de fórum","title":"Guitar or piano?","titlePt":"Violão ou piano?","body":["I'm 35 and I want to learn an instrument, but I can't decide between the guitar and the piano. A guitar is cheap and easy to carry, [while-d/whereas] a good piano costs a lot. [unlike] the piano, though, the guitar hurts your fingers at first. My neighbor says I should start with a keyboard. [in-that-case], I could practice with headphones at night. [anyway], I'm starting lessons next month. Any advice?"],"pt":["Tenho 35 anos e quero aprender um instrumento, mas não consigo decidir entre o violão e o piano. Um violão é barato e fácil de carregar, enquanto um bom piano custa caro. Diferente do piano, porém, o violão machuca os dedos no começo. O meu vizinho diz que eu deveria começar com um teclado. Nesse caso, eu poderia praticar com fones de ouvido à noite. Enfim, vou começar as aulas mês que vem. Alguma dica?"],"w":{"carry":"carregar","hurts":"machuca","keyboard":"teclado","headphones":"fones de ouvido","advice":"conselho; dica"},"dx":["despite","in-case","even"]},{"id":"b1-20","frame":"Card","framePt":"Cartão","title":"Happy 80th, Grandpa!","titlePt":"Feliz 80 anos, vovô!","body":["Dear Grandpa, happy 80th birthday! You've been my hero [since-n] day one. You taught me to fish, ride a bike and play chess, [even-though/although/though] I was the worst student ever. [in-fact/actually], I still lose every game we play! You always say life is too short for bad coffee. [thats-why] I got you the best coffee in town.","Love, Bea"],"pt":["Querido vovô, feliz aniversário de 80 anos! Você é o meu herói desde o primeiro dia. Você me ensinou a pescar, andar de bicicleta e jogar xadrez, mesmo eu sendo o pior aluno do mundo. Na verdade, eu ainda perco todas as partidas! Você sempre diz que a vida é curta demais para café ruim. É por isso que eu te comprei o melhor café da cidade.","Com amor, Bea"],"w":{"day one":"o primeiro dia","fish":"pescar","chess":"xadrez","worst":"pior"},"dx":["even","despite","during"],"notes":[null,{"en":"*Mesmo* + a sentence is *even though*. *Even* alone can't join two sentences.","pt":"*Mesmo* + frase é *even though*. *Even* sozinho não liga duas frases."}]},{"id":"b1-21","frame":"Blog","framePt":"Blog","title":"Six weeks in Peru","titlePt":"Seis semanas no Peru","body":["Last summer I spent six weeks in Peru [as-n] a volunteer English teacher. I went [for-n] the experience, not the money (there wasn't any!). I took Spanish lessons before the trip [so-that] I could talk to the kids' parents. [besides-x/in-addition/also/whats-more/plus], I learned to cook an amazing ceviche. [overall], it was the best summer of my life."],"pt":["No verão passado, passei seis semanas no Peru como professor voluntário de inglês. Fui pela experiência, não pelo dinheiro (não tinha nenhum!). Fiz aulas de espanhol antes da viagem para que eu pudesse conversar com os pais das crianças. Além disso, aprendi a fazer um ceviche incrível. No geral, foi o melhor verão da minha vida."],"w":{"volunteer":"voluntário","trip":"viagem","amazing":"incrível"},"dx":["in-order-to","like-s","to"],"notes":[{"en":"*Como* for a job or role is *as*: as a teacher. *Like a teacher* = similar to one, but not one.","pt":"*Como* para profissão ou papel é *as*: as a teacher. *Like a teacher* = parecido com um, mas não é."},{"en":"*Para* + a noun is *for*: for the experience. *Para* + a verb is *to*.","pt":"*Para* + substantivo é *for*: for the experience. *Para* + verbo é *to*."}]},{"id":"b1-22","frame":"News","framePt":"Notícia","title":"Storm closes schools","titlePt":"Tempestade fecha escolas","body":["Schools across the city are closed today [as-a-result-of/due-to/because-of] last night's storm. Many streets are flooded, and some neighborhoods have no electricity. [as-a-result/therefore], several bus lines have been canceled. Officials say schools will reopen [once/as-soon-as/when] the roads are safe. [meanwhile], students can follow their lessons online."],"pt":["As escolas de toda a cidade estão fechadas hoje em consequência da tempestade de ontem à noite. Muitas ruas estão alagadas e alguns bairros estão sem luz. Como resultado, várias linhas de ônibus foram canceladas. As autoridades dizem que as escolas vão reabrir assim que as ruas estiverem seguras. Enquanto isso, os alunos podem acompanhar as aulas online."],"w":{"flooded":"alagadas","neighborhoods":"bairros","electricity":"luz; eletricidade","officials":"autoridades","reopen":"reabrir"},"dx":["because","in-case","unless"],"notes":[null,null,{"en":"*Once* here is time (assim que). Portuguese *uma vez que* is a reason: *since*.","pt":"Aqui *once* é tempo (assim que). *Uma vez que* em português é causa: *since*."}]},{"id":"b1-23","frame":"Story","framePt":"História","title":"The wrong suitcase","titlePt":"A mala errada","body":["At the airport in Madrid, I grabbed a black suitcase from the belt and took a taxi to my hotel. [as-soon-as/when] I opened it, I knew something was wrong. [instead-of] my clothes, there were ten bottles of olive oil! I felt [as-if/as-though] I was in a comedy. I called the airline right away. [actually/in-fact], the owner was staying at a hotel on the same street!"],"pt":["No aeroporto de Madri, peguei uma mala preta da esteira e fui de táxi para o hotel. Assim que abri, percebi que tinha algo errado. Em vez das minhas roupas, havia dez garrafas de azeite! Eu me senti como se estivesse numa comédia. Liguei para a companhia aérea na mesma hora. Na verdade, a dona da mala estava hospedada num hotel na mesma rua!"],"w":{"grabbed":"peguei","belt":"esteira","olive oil":"azeite","airline":"companhia aérea","right away":"na mesma hora","owner":"dona"},"dx":["instead","even","during"]},{"id":"b1-24","frame":"Tips","framePt":"Dicas","title":"Exam season","titlePt":"Época de provas","body":["Start studying at least two weeks before the exam [rather-than/instead-of] leaving everything for the last night. Take a short break every 45 minutes [in-order-to/to] rest your eyes and your brain. Avoid distractions [such-as/like-e] your phone or social media. [for-instance], you can leave your phone in another room. Don't study all night [unless] you really have to: sleep helps your memory."],"pt":["Comece a estudar pelo menos duas semanas antes da prova, em vez de deixar tudo para a última noite. Faça uma pausa curta a cada 45 minutos para descansar os olhos e o cérebro. Evite distrações, como o celular ou as redes sociais. Por exemplo, você pode deixar o celular em outro cômodo. Não estude a noite toda, a não ser que seja realmente necessário: o sono ajuda a memória."],"w":{"at least":"pelo menos","break":"pausa","brain":"cérebro","distractions":"distrações","social media":"redes sociais"},"dx":["instead","even-if","for-n"],"notes":[null,{"en":"*Para* + a verb is *to* or *in order to*, never *for*: to rest your eyes.","pt":"*Para* + verbo é *to* ou *in order to*, nunca *for*: to rest your eyes."}]},{"id":"b1-25","frame":"Email","framePt":"E-mail","title":"Ten years later","titlePt":"Dez anos depois","body":["Hi everyone! Can you believe it's been ten years [since-t] we finished high school? Let's have a reunion! I'm thinking of a Saturday in October. Please reply [by] September 15th [so-that] I can book a restaurant. Some of you live abroad now, so we'll also set up a video call. [anyway], I can't wait to see you all!","Mia"],"pt":["Oi, pessoal! Dá para acreditar que já faz dez anos que a gente terminou o ensino médio? Vamos fazer um reencontro! Estou pensando num sábado de outubro. Por favor, respondam até 15 de setembro para que eu possa reservar um restaurante. Alguns de vocês moram fora agora, então também vamos fazer uma chamada de vídeo. Enfim, mal posso esperar para ver todo mundo!","Mia"],"w":{"high school":"ensino médio","reunion":"reencontro","reply":"respondam","book":"reservar","abroad":"no exterior","video call":"chamada de vídeo"},"dx":["until-n","in-order-to","during"],"notes":[null,{"en":"*Até* + a deadline is *by*: reply by Friday. *Until* means the whole time up to that moment.","pt":"*Até* + prazo é *by*: reply by Friday. *Until* é o tempo todo até aquele momento."}]},{"id":"b1-26","frame":"Blog","framePt":"Blog","title":"My grandparents, my roommates","titlePt":"Os meus avós, os meus colegas de casa","body":["When I moved to Lisbon for college, I decided to live with my grandparents [instead-of/rather-than] renting a room. Everyone thought I was crazy. [actually/in-fact], it's been great. [besides-n/as-well-as/in-addition-to] free meals, I get a lot of good advice. My grandma is very talkative, [while-d/whereas] my grandpa hardly says a word. We all get along fine, [as-long-as] I'm home by midnight!"],"pt":["Quando me mudei para Lisboa para fazer faculdade, decidi morar com os meus avós em vez de alugar um quarto. Todo mundo achou que eu era louco. Na verdade, tem sido ótimo. Além de refeições de graça, recebo muitos bons conselhos. A minha avó fala muito, ao passo que o meu avô quase não diz uma palavra. A gente se dá bem, desde que eu esteja em casa até a meia-noite!"],"w":{"college":"faculdade","renting":"alugar","advice":"conselhos","talkative":"falante","hardly":"quase não","get along":"se dar bem"},"dx":["unlike","despite","unless"]},{"id":"b1-27","frame":"Article","framePt":"Artigo","title":"Why do we leave things for later?","titlePt":"Por que deixamos tudo para depois?","body":["Why do we leave important tasks for later, [even-though/although/though] we know it's a bad idea? Scientists say procrastination isn't about being lazy. It's about mood. [in-other-words], we avoid tasks that make us feel stressed or bored. [whenever] a task feels too big, our brain looks for something more fun, like checking our phone. One trick is to start with something tiny, [such-as/like-e] writing just one sentence."],"pt":["Por que deixamos tarefas importantes para depois, mesmo sabendo que é uma má ideia? Cientistas dizem que a procrastinação não tem a ver com preguiça. Tem a ver com humor. Ou seja, evitamos tarefas que nos deixam estressados ou entediados. Sempre que uma tarefa parece grande demais, o nosso cérebro procura algo mais divertido, como olhar o celular. Um truque é começar com algo minúsculo, como escrever só uma frase."],"w":{"tasks":"tarefas","lazy":"preguiçoso","mood":"humor","bored":"entediados","tiny":"minúsculo"},"dx":["despite","even","however"]},{"id":"b1-28","frame":"Message","framePt":"Mensagem","title":"Change of plans","titlePt":"Mudança de planos","body":["Hi Sara! Bad news: the concert on Friday is canceled [due-to/because-of/as-a-result-of] the singer's illness. [instead], why don't we try that new Thai restaurant? I can book a table for 8 p.m. Do you like spicy food? [if-not], they have mild dishes too. [as-soon-as/once/when] I get my refund, I'll pay you back for your ticket."],"pt":["Oi, Sara! Notícia ruim: o show de sexta foi cancelado devido à doença do cantor. Em vez disso, que tal a gente experimentar aquele restaurante tailandês novo? Posso reservar uma mesa para as 20h. Você gosta de comida apimentada? Se não, eles também têm pratos suaves. Assim que eu receber o reembolso, te devolvo o dinheiro do ingresso."],"w":{"canceled":"cancelado","illness":"doença","book":"reservar","spicy":"apimentada","mild":"suaves","refund":"reembolso","pay you back":"te devolver o dinheiro"},"dx":["instead-of","because","in-case"]},{"id":"b1-29","frame":"Review","framePt":"Avaliação","title":"Small menu, big flavors","titlePt":"Cardápio pequeno, muito sabor","body":["[though/although/even-though] the menu is small, every dish at Casa Verde is full of flavor. We tried the fish tacos [as-well-as/in-addition-to] the mushroom risotto, and we loved them. The service was a bit slow. [still/however/even-so/nevertheless], we didn't mind: the view of the river was beautiful. Book a table before you go, [as-r/since-r/because] the place gets very busy on weekends."],"pt":["Embora o cardápio seja pequeno, todos os pratos do Casa Verde são cheios de sabor. Provamos os tacos de peixe e também o risoto de cogumelos, e adoramos. O atendimento foi um pouco lento. Mesmo assim, não nos importamos: a vista do rio era linda. Reserve uma mesa antes de ir, já que o lugar fica muito cheio nos fins de semana."],"w":{"dish":"prato","flavor":"sabor","mushroom":"cogumelo","service":"atendimento","didn't mind":"não nos importamos","busy":"cheio"},"dx":["despite","even","unless"],"notes":[null,{"en":"*As well as* + a noun = and also: the tacos as well as the risotto.","pt":"*As well as* + substantivo = e também: os tacos e também o risoto."},{"en":"*Still,* at the start of a sentence means even so (mesmo assim), not *ainda*.","pt":"*Still,* no começo da frase quer dizer mesmo assim, não *ainda*."},null]},{"id":"b1-30","frame":"Email","framePt":"E-mail","title":"Welcome to your new apartment","titlePt":"Bem-vindo ao seu novo apartamento","body":["Hi Daniel, welcome to your new apartment! [in-addition-to/besides-n/apart-from] the rent, there is a monthly fee of $40, but it includes fast Wi-Fi. [plus/in-addition/whats-more/besides-x/also], you can use the gym on the roof for free. Please don't use the washing machine after 10 p.m., [since-r/as-r/because] the walls are quite thin. [in-case-of] problems with the heating, call Mr. Ruiz, the building manager. Enjoy your new home!","Best, Teresa"],"pt":["Oi, Daniel, bem-vindo ao seu novo apartamento! Além do aluguel, há uma taxa mensal de 40 dólares, mas ela inclui Wi-Fi rápido. E mais: você pode usar a academia da cobertura de graça. Por favor, não use a máquina de lavar depois das 22h, já que as paredes são bem finas. Em caso de problemas com o aquecimento, ligue para o Sr. Ruiz, o administrador do prédio. Aproveite a casa nova!","Abraço, Teresa"],"w":{"rent":"aluguel","fee":"taxa","roof":"cobertura","washing machine":"máquina de lavar","thin":"finas","heating":"aquecimento"},"dx":["in-case","unless","despite"],"notes":[null,null,null,{"en":"*In case of* + a noun, mostly in instructions: in case of fire. Portuguese *caso* + a sentence is usually *if*.","pt":"*In case of* + substantivo, mais em instruções: in case of fire. O *caso* + frase do português costuma ser *if*."}]},{"id":"b1-31","frame":"Article","framePt":"Artigo","title":"Why do we yawn?","titlePt":"Por que bocejamos?","body":["Scientists have studied yawning for years. [even-so/however/nevertheless], they still aren't sure why we do it. One theory is that a yawn helps to cool down the brain. Yawning is also contagious: [whenever] we see someone yawn, we often do the same. [similarly/in-the-same-way/likewise], dogs sometimes yawn after their owners do. You might start yawning [even-if] you only read about it. Are you yawning now?"],"pt":["Os cientistas estudam o bocejo há anos. Mesmo assim, eles ainda não sabem ao certo por que bocejamos. Uma teoria é que o bocejo ajuda a resfriar o cérebro. O bocejo também é contagioso: sempre que vemos alguém bocejar, muitas vezes fazemos o mesmo. Da mesma forma, os cães às vezes bocejam depois que os donos bocejam. Você pode começar a bocejar mesmo que só leia sobre isso. Você está bocejando agora?"],"w":{"yawning":"bocejo","theory":"teoria","cool down":"resfriar","contagious":"contagioso","owners":"donos"},"dx":["despite","even","in-case"],"notes":[null,null,null,{"en":"*Mesmo se / mesmo que* = *even if*. *Even* alone can't join two sentences.","pt":"*Mesmo se / mesmo que* = *even if*. *Even* sozinho não liga duas frases."}]},{"id":"b1-32","frame":"Story","framePt":"História","title":"The marathon dog","titlePt":"O cão maratonista","body":["Last October, a stray dog joined the runners at the start of a half marathon in Porto Alegre. It ran all 21 kilometers with them, [in-spite-of/despite] the heat. People along the route cheered for it [as-if/as-though] it were a real athlete. [afterward/after-that], the organizers gave it its own medal. [thanks-to] the photos, which went viral, a local family found the dog and adopted it a week later."],"pt":["Em outubro passado, um cachorro de rua se juntou aos corredores na largada de uma meia maratona em Porto Alegre. Ele correu os 21 quilômetros com eles, apesar do calor. As pessoas ao longo do percurso torciam por ele como se fosse um atleta de verdade. Depois, os organizadores deram uma medalha só para ele. Graças às fotos, que viralizaram, uma família da cidade encontrou o cachorro e o adotou uma semana depois."],"w":{"stray dog":"cachorro de rua","half marathon":"meia maratona","route":"percurso","cheered":"torciam","medal":"medalha","went viral":"viralizaram"},"dx":["although","because","even"],"notes":[{"en":"*Apesar de* + a noun is *in spite of* or *despite* (no *of* after despite). With a sentence, use *although*.","pt":"*Apesar de* + substantivo é *in spite of* ou *despite* (sem *of* depois de despite). Com uma frase, use *although*."},null,null,null]},{"id":"b1-33","frame":"Blog","framePt":"Blog","title":"From the city to a village","titlePt":"Da cidade para a aldeia","body":["I grew up in São Paulo, but I've lived in a small village in Portugal [since-n] 2021. In São Paulo, I spent two hours a day in traffic. [in-contrast/on-the-other-hand/by-contrast], here I walk to work in five minutes. [as-s] you can imagine, my life is much calmer now. I buy food from local farmers [rather-than/instead-of] going to the supermarket. Do I miss anything? The food, of course. [still/even-so/however/nevertheless], I wouldn't go back."],"pt":["Cresci em São Paulo, mas moro numa aldeia pequena em Portugal desde 2021. Em São Paulo, eu passava duas horas por dia no trânsito. Em contrapartida, aqui vou a pé para o trabalho em cinco minutos. Como você pode imaginar, a minha vida está muito mais tranquila agora. Compro comida de agricultores locais em vez de ir ao supermercado. Se sinto falta de alguma coisa? Da comida, claro. Mesmo assim, eu não voltaria."],"w":{"grew up":"cresci","village":"aldeia","traffic":"trânsito","calmer":"mais tranquila","farmers":"agricultores"},"dx":["like-s","instead","for-n"],"notes":[{"en":"*Desde* + a date = *since*, with *have* + verb: I've lived here since 2021.","pt":"*Desde* + data = *since*, com *have* + verbo: I've lived here since 2021."},null,{"en":"*Como* + a sentence is *as*: as you can imagine. *Like* goes before a noun.","pt":"*Como* + frase é *as*: as you can imagine. *Like* vem antes de um substantivo."},null,null]},{"id":"b1-34","frame":"Tips","framePt":"Dicas","title":"Keep your plants alive","titlePt":"Mantenha suas plantas vivas","body":["Most houseplants die from too much water, not too little. Many plants, [including/such-as] the popular snake plant, only need water every two weeks, so don't water them [unless] the soil feels dry. Keep them near a window. [otherwise/if-not], their leaves may turn yellow. Do the leaves have brown tips? [in-that-case/if-so], the air is probably too dry. In summer, you can put them on the balcony [for-n] some fresh air."],"pt":["A maioria das plantas de casa morre por excesso de água, não por falta. Muitas plantas, incluindo a popular espada-de-são-jorge, só precisam de água a cada duas semanas, então não as regue a não ser que a terra esteja seca. Deixe-as perto de uma janela. Caso contrário, as folhas podem ficar amarelas. As folhas estão com as pontas marrons? Nesse caso, o ar provavelmente está seco demais. No verão, você pode colocá-las na varanda para tomar um ar fresco."],"w":{"houseplants":"plantas de casa","snake plant":"espada-de-são-jorge","soil":"terra","leaves":"folhas","tips":"pontas","balcony":"varanda"},"dx":["in-case","in-order-to","instead"],"notes":[null,null,null,null,{"en":"*For* + a noun (for some fresh air); *to* + a verb (to get some fresh air).","pt":"*For* + substantivo (for some fresh air); *to* + verbo (to get some fresh air)."}]},{"id":"b1-35","frame":"News","framePt":"Notícia","title":"Bridge to close for repairs","titlePt":"Ponte vai fechar para reparos","body":["The Riverside Bridge will close for three weeks from Monday [due-to/because-of/owing-to] urgent repairs. Engineers found cracks in two of its pillars last month. [therefore/as-a-result/consequently], the city has decided to close it to all traffic, including bikes. [during] the work, a free ferry will take people across the river every 20 minutes. The bridge will reopen [once/as-soon-as/when/after-s] the repairs are finished, probably in early May."],"pt":["A ponte Riverside vai fechar por três semanas a partir de segunda-feira devido a reparos urgentes. No mês passado, engenheiros encontraram rachaduras em dois de seus pilares. Portanto, a prefeitura decidiu fechá-la para todo o trânsito, inclusive bicicletas. Durante as obras, uma balsa gratuita vai levar as pessoas para o outro lado do rio a cada 20 minutos. A ponte deve reabrir assim que os reparos terminarem, provavelmente no início de maio."],"w":{"repairs":"reparos","cracks":"rachaduras","pillars":"pilares","ferry":"balsa","reopen":"reabrir"},"dx":["because","while-t","since-r"],"notes":[null,null,{"en":"*During* + a noun (during the work); *while* + a sentence (while they work).","pt":"*During* + substantivo (during the work); *while* + frase (while they work)."},null]},{"id":"b1-36","frame":"Message","framePt":"Mensagem","title":"Big news!","titlePt":"Grande notícia!","body":["Hey Lu! Big news: I got the job at the bank! I'll start [as-n] a junior analyst next month. The salary is great. [whats-more/plus/in-addition/besides-x/also], the office is only ten minutes from my apartment. I'm a little nervous, [though-x]. I'll have to work some weekends, and I don't know anyone there yet. [even-so/still/however/nevertheless], I think it's the right move. Let's celebrate on Friday!"],"pt":["Oi, Lu! Grande notícia: consegui o emprego no banco! Vou começar como analista júnior no mês que vem. O salário é ótimo. Além disso, o escritório fica a só dez minutos do meu apartamento. Mas estou um pouco nervosa. Vou ter que trabalhar em alguns fins de semana, e ainda não conheço ninguém lá. Mesmo assim, acho que é a decisão certa. Vamos comemorar na sexta!"],"w":{"salary":"salário","nervous":"nervosa","yet":"ainda","the right move":"a decisão certa","celebrate":"comemorar"},"dx":["like-s","although","even"],"notes":[{"en":"*Como* (in the role of) = *as*: I'll start as an analyst. *Like* = similar to.","pt":"*Como* (no papel de) = *as*: I'll start as an analyst. *Like* = parecido com."},null,{"en":"In speech, *though* often goes at the end: I'm a little nervous, though. (= mas estou um pouco nervosa)","pt":"Na fala, *though* costuma ir no fim: I'm a little nervous, though. (= mas estou um pouco nervosa)"},null]},{"id":"b1-37","frame":"Forum post","framePt":"Post de fórum","title":"Learning to draw at 42","titlePt":"Aprendendo a desenhar aos 42","body":["Last year, at 42, I decided to learn to draw. Here's what worked for me. First, I drew one simple object every day, like a cup or a shoe. [next/after-that/afterward], I started copying photos of faces. It was hard, but I improved quickly. [by] December, I could draw a decent portrait of my daughter. Drawing is like a sport: your muscles get stronger when you train them. [in-the-same-way/similarly/likewise], your eyes and hands learn to work together with practice. So don't give up, [even-if/even-though] you think you have no talent!"],"pt":["No ano passado, aos 42, decidi aprender a desenhar. Vou contar o que funcionou para mim. Primeiro, eu desenhava um objeto simples por dia, como uma xícara ou um sapato. Depois, comecei a copiar fotos de rostos. Foi difícil, mas melhorei rápido. Até dezembro, eu já conseguia desenhar um retrato razoável da minha filha. Desenhar é como um esporte: os músculos ficam mais fortes quando você os treina. Da mesma forma, seus olhos e mãos aprendem a trabalhar juntos com a prática. Então não desista, mesmo que você ache que não tem talento!"],"w":{"object":"objeto","faces":"rostos","improved":"melhorei","decent":"razoável","portrait":"retrato","give up":"desista"},"dx":["until-n","even","in-case"],"notes":[null,{"en":"*Até dezembro* (no later than) = *by* December. *Until* is for something that goes on up to that time.","pt":"*Até dezembro* (no máximo) = *by* December. *Until* é para algo que continua até aquele momento."},null,null]},{"id":"b1-38","frame":"Card","framePt":"Cartão","title":"Happy retirement, Ms. Ortiz!","titlePt":"Feliz aposentadoria, Sra. Ortiz!","body":["Dear Ms. Ortiz, we can't believe you're retiring! You've worked at this school [since-t] it was a small building with only six classrooms. [besides-n/as-well-as/in-addition-to/apart-from] teaching math, you ran the chess club for twenty years. Before your class, most of us didn't like numbers. [in-fact/actually/indeed], some of us hated them! [as-s] you always said, 'Mistakes are how we learn.' We'll never forget that.","With love, Class 9B"],"pt":["Querida Sra. Ortiz, não acreditamos que a senhora vai se aposentar! A senhora trabalha nesta escola desde quando ela era um prédio pequeno, com só seis salas de aula. Além de dar aula de matemática, a senhora coordenou o clube de xadrez por vinte anos. Antes da sua aula, a maioria de nós não gostava de números. Na verdade, alguns de nós odiavam! Como a senhora sempre dizia: 'É errando que se aprende.' Nunca vamos esquecer isso.","Com carinho, Turma 9B"],"w":{"retiring":"se aposentar","classrooms":"salas de aula","ran":"coordenou","chess club":"clube de xadrez","hated":"odiavam","mistakes":"erros"},"dx":["for-n","despite","unlike"],"notes":[{"en":"*Since* + a past moment or event, with *have* + verb: You've worked here since it was small.","pt":"*Since* + um momento ou fato passado, com *have* + verbo: You've worked here since it was small."},null,null,null]}],"B2":[{"id":"b2-01","frame":"Essay","framePt":"Redação","title":"Is working from home here to stay?","titlePt":"O home office veio para ficar?","body":["Working from home saves time and money. [moreover/furthermore], many employees say they can concentrate better [owing-to/due-to] the lack of noise. [nevertheless/however/nonetheless], not everyone enjoys it. Some people feel lonely, [whereas/while-d] others simply miss the routine of going out.","[in-conclusion/to-sum-up], working from home is here to stay, but it should be a choice, not an obligation."],"pt":["Trabalhar de casa economiza tempo e dinheiro. Além disso, muitos funcionários dizem que conseguem se concentrar melhor devido à falta de barulho. No entanto, nem todo mundo gosta. Algumas pessoas se sentem sozinhas, ao passo que outras simplesmente sentem falta da rotina de sair de casa.","Concluindo, o trabalho em casa veio para ficar, mas deveria ser uma escolha, não uma obrigação."],"w":{"employees":"funcionários","lack":"falta","lonely":"sozinhas","miss":"sentem falta de","obligation":"obrigação"},"dx":["because","although","in-spite-of"]},{"id":"b2-02","frame":"Article","framePt":"Artigo","title":"The real cost of cheap clothes","titlePt":"O custo real das roupas baratas","body":["Clothes have never been cheaper. [consequently/as-a-result/therefore], the average shopper now buys twice as many items as twenty years ago. [much-as] we all love a bargain, this habit has a cost: most cheap clothes are thrown away after just a few uses.","So what can we do? Buy fewer, better clothes, [as-opposed-to/rather-than/instead-of] lots of cheap ones. [alternatively], try secondhand stores: they are full of surprises."],"pt":["As roupas nunca foram tão baratas. Consequentemente, o consumidor médio hoje compra o dobro de peças de vinte anos atrás. Por mais que todos nós adoremos uma pechincha, esse hábito tem um custo: a maioria das roupas baratas vai para o lixo depois de poucos usos.","Então, o que podemos fazer? Comprar menos roupas, e melhores, em vez de muitas roupas baratas. Ou então, experimente os brechós: eles estão cheios de surpresas."],"w":{"average shopper":"consumidor médio","items":"peças","bargain":"pechincha","habit":"hábito","thrown away":"jogadas fora","secondhand stores":"brechós"},"dx":["despite","instead","eventually"]},{"id":"b2-03","frame":"Story","framePt":"História","title":"The last train","titlePt":"O último trem","body":["[just-as-t] I reached the platform, the doors of the last train closed. I had no money for a taxi, and my phone was dead. [eventually], a station worker noticed me and offered to call my brother. [in-the-meantime/meanwhile], he made me a cup of tea in his tiny office. [the-moment/as-soon-as] my brother arrived, I burst out laughing: he was still wearing his pajamas."],"pt":["Bem na hora em que cheguei à plataforma, as portas do último trem se fecharam. Eu não tinha dinheiro para um táxi, e o meu celular estava sem bateria. Por fim, um funcionário da estação me viu e se ofereceu para ligar para o meu irmão. Enquanto isso, ele me fez uma xícara de chá no escritoriozinho dele. No momento em que o meu irmão chegou, eu caí na gargalhada: ele ainda estava de pijama."],"w":{"platform":"plataforma","dead":"sem bateria","noticed":"notou","tiny":"minúsculo","burst out laughing":"caí na gargalhada"},"dx":["at-the-end","during","since-t"],"notes":[null,{"en":"*Eventually* is a false friend: it means in the end, after a long time (not eventualmente).","pt":"*Eventually* é falso cognato: significa por fim, depois de muito tempo (não eventualmente)."},null,null]},{"id":"b2-04","frame":"Email","framePt":"E-mail","title":"Your registration","titlePt":"A sua inscrição","body":["Dear Ms. Carter, Thank you for registering for the Green Cities conference. You may bring a guest, [provided/as-long-as] you let us know by June 10th. [if-so], please send us their full name. Lunch is included, [whereas/while-d] dinner must be booked separately. [in-case-of] bad weather, the outdoor tour will move indoors.","Kind regards, The Events Team"],"pt":["Prezada Sra. Carter, obrigado por se inscrever na conferência Green Cities. A senhora pode trazer um acompanhante, contanto que nos avise até 10 de junho. Se for o caso, por favor, nos envie o nome completo da pessoa. O almoço está incluído, ao passo que o jantar deve ser reservado à parte. Em caso de mau tempo, o passeio ao ar livre será transferido para um local fechado.","Atenciosamente, Equipe de Eventos"],"w":{"registering":"se inscrever","guest":"acompanhante","included":"incluído","booked":"reservado","separately":"à parte","outdoor":"ao ar livre","indoors":"para um local fechado"},"dx":["in-case","unless","if-not"]},{"id":"b2-05","frame":"Review","framePt":"Avaliação","title":"Pasta like an Italian","titlePt":"Massa como um italiano","body":["I took this cooking class [so-as-to/in-order-to/to] learn how to make fresh pasta, and it was worth every penny. The chef explains everything clearly. [furthermore/moreover/in-addition/also], she shares little secrets you won't find in any recipe book. [apart-from/as-well-as/besides-n] the pasta, we made two sauces and a dessert. The only problem was the kitchen: it was so hot that we felt [as-though/as-if] we were cooking ourselves!"],"pt":["Fiz essa aula de culinária para aprender a fazer massa fresca, e valeu cada centavo. A chef explica tudo com clareza. Além disso, ela conta segredinhos que você não vai encontrar em nenhum livro de receitas. Além da massa, fizemos dois molhos e uma sobremesa. O único problema era a cozinha: estava tão quente que parecia que nós é que estávamos sendo cozidos!"],"w":{"worth every penny":"valeu cada centavo","clearly":"com clareza","secrets":"segredos","sauces":"molhos"},"dx":["so-that","however","unlike"]},{"id":"b2-06","frame":"Article","framePt":"Artigo","title":"Too many tourists?","titlePt":"Turistas demais?","body":["Every year, millions of tourists visit Venice, a city with fewer than 50,000 residents. [now-that] cruise ships are banned from the city center, the streets are a little calmer. [even-so/still/nevertheless], locals say the problem is far from solved. Rents have gone up so much that many young people have left. [consequently/as-a-result], the city is getting older and emptier every year. Day visitors now pay an entry fee, but experts say it will work [only-if] the fee is high enough to change people's plans."],"pt":["Todo ano, milhões de turistas visitam Veneza, uma cidade com menos de 50 mil moradores. Agora que os navios de cruzeiro estão proibidos no centro, as ruas estão um pouco mais calmas. Mesmo assim, os moradores dizem que o problema está longe de ser resolvido. Os aluguéis subiram tanto que muitos jovens foram embora. Consequentemente, a cidade está ficando mais velha e mais vazia a cada ano. Os visitantes de um dia agora pagam uma taxa de entrada, mas especialistas dizem que isso só vai funcionar se a taxa for alta o suficiente para mudar os planos das pessoas."],"w":{"residents":"moradores","cruise ships":"navios de cruzeiro","banned":"proibidos","locals":"moradores","far from solved":"longe de ser resolvido","rents":"aluguéis","entry fee":"taxa de entrada"},"dx":["unless","even","owing-to"]},{"id":"b2-07","frame":"Opinion","framePt":"Opinião","title":"Less homework, better learning?","titlePt":"Menos lição, mais aprendizado?","body":["Many parents believe that homework teaches children discipline, and some studies show that it can help teenagers do better at school. [by-contrast/in-contrast/on-the-other-hand], young children seem to gain very little from it. [after-all], they learn best through play.","[to-sum-up/in-conclusion], a little homework is fine for older students, [as-long-as/provided] it doesn't take away their free time."],"pt":["Muitos pais acreditam que a lição de casa ensina disciplina às crianças, e alguns estudos mostram que ela pode ajudar os adolescentes a ir melhor na escola. Em contrapartida, as crianças pequenas parecem ganhar muito pouco com ela. Afinal, elas aprendem melhor brincando.","Resumindo, um pouco de lição é bom para alunos mais velhos, desde que não tire o tempo livre deles."],"w":{"discipline":"disciplina","teenagers":"adolescentes","gain":"ganhar","through play":"brincando","take a
