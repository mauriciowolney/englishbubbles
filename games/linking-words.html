<script>
const DATA = {"levels":{"A2":{"grad":["#3fcf9a","#2bb5c9"],"title":"and, but, so, because, when, if, first, then, that's why…","nativeUi":true,"tries":3,"hints":2,"feedback":"spots","rounds":3,"gaps":[3,4],"fakes":0,"pairs":1,"pairDecoys":2,"same":2},"B1":{"grad":["#4aa8ff","#5b7bff"],"title":"although, however, despite, while, during, unless, as long as, in case…","tries":2,"hints":2,"feedback":"spots","rounds":3,"gaps":[4,5],"fakes":2,"pairs":2,"pairDecoys":2,"same":2},"B2":{"grad":["#e0558a","#b44fd1"],"label":"B2+","title":"whereas, nevertheless, provided, owing to, much as, eventually, the moment…","tries":2,"hints":1,"feedback":"count","rounds":3,"gaps":[4,5],"fakes":3,"pairs":2,"pairDecoys":3,"same":2}},"rules":{"jobOrder":["add","surprise","differ","reason","result","purpose","cond","time","order","choice","example","similar","clarify"],"jobs":{"add":{"name":"Adding","namePt":"Adicionar","hue":205,"say":"adding: one more idea of the same kind","sayPt":"adicionar: mais uma ideia do mesmo tipo","ask":"Is it just one more idea?","askPt":"É só mais uma ideia?"},"surprise":{"name":"Contrast: a surprise","namePt":"Contraste: surpresa","hue":25,"say":"a surprise: the second idea is not what you'd expect after the first","sayPt":"uma surpresa: a segunda ideia não é o que se esperaria depois da primeira","ask":"Is the second idea unexpected?","askPt":"A segunda ideia é inesperada?"},"differ":{"name":"Contrast: a difference","namePt":"Contraste: diferença","hue":45,"say":"a difference: two things side by side, and how they are different","sayPt":"uma diferença: duas coisas lado a lado, e como elas são diferentes","ask":"Are two different things side by side?","askPt":"Duas coisas diferentes estão lado a lado?"},"reason":{"name":"Reason","namePt":"Causa","hue":275,"say":"a reason: it answers why?","sayPt":"uma causa: responde por quê?","ask":"Does it answer why?","askPt":"Responde por quê?"},"result":{"name":"Result","namePt":"Consequência","hue":318,"say":"a result: what happened because of the first idea","sayPt":"uma consequência: o que aconteceu por causa da primeira ideia","ask":"Is it what happened because of the first idea?","askPt":"É o que aconteceu por causa da primeira ideia?"},"purpose":{"name":"Purpose","namePt":"Finalidade","hue":255,"say":"a purpose: it answers what for?","sayPt":"uma finalidade: responde para quê?","ask":"Does it answer what for?","askPt":"Responde para quê?"},"cond":{"name":"Condition","namePt":"Condição","hue":55,"say":"a condition: one thing depends on another","sayPt":"uma condição: uma coisa depende da outra","ask":"Does one thing depend on another?","askPt":"Uma coisa depende da outra?"},"time":{"name":"Time","namePt":"Tempo","hue":95,"say":"time: when something happens, compared with something else","sayPt":"tempo: quando algo acontece em relação a outra coisa","ask":"Does it say when?","askPt":"Diz quando?"},"order":{"name":"Order","namePt":"Sequência","hue":105,"say":"order: the steps of a story or a list, one after another","sayPt":"sequência: os passos de uma história ou de uma lista, um depois do outro","ask":"Is it the next step?","askPt":"É o próximo passo?"},"choice":{"name":"Choice","namePt":"Alternativa","hue":240,"say":"a choice: one thing or another, or one instead of another","sayPt":"uma alternativa: uma coisa ou outra, ou uma no lugar da outra","ask":"Is it one thing or another?","askPt":"É uma coisa ou outra?"},"example":{"name":"Example","namePt":"Exemplo","hue":190,"say":"an example of what was just said","sayPt":"um exemplo do que acabou de ser dito","ask":"Is it an example?","askPt":"É um exemplo?"},"similar":{"name":"Comparison","namePt":"Comparação","hue":168,"say":"a comparison: how something is like something else (or the role it plays)","sayPt":"uma comparação: como uma coisa se parece com outra (ou o papel que ela tem)","ask":"Is something like something else?","askPt":"Uma coisa se parece com outra?"},"clarify":{"name":"Clarifying","namePt":"Esclarecer","hue":225,"say":"clarifying or summing up: saying it again, more clearly or in short","sayPt":"esclarecer ou resumir: dizer de novo, mais claro ou em poucas palavras","ask":"Is it saying it again, or summing up?","askPt":"Está repetindo a ideia ou resumindo?"}},"shapeOrder":["s","n","x"],"shapes":{"s":{"name":"Conjunction","namePt":"Conjunção","long":"+ a subject and a verb","longPt":"+ sujeito e verbo","eg":"[Although] {it was raining}, we went out.","egPt":"Embora estivesse chovendo, saímos.","tip":"It joins two ideas in one sentence. After it comes a subject and a verb:","tipPt":"Une duas ideias numa frase só. Depois dele vêm sujeito e verbo:"},"n":{"name":"Preposition","namePt":"Preposição","long":"+ a noun or an -ing","longPt":"+ um substantivo ou um -ing","not":", never a subject and a verb","notPt":", nunca sujeito e verbo","eg":"[Despite] {the rain}, we went out.","egPt":"Apesar da chuva, saímos.","tip":"After it comes a thing (*the rain*), an -ing (*being in the rain*). Never a subject + verb.","tipPt":"Depois dele vem uma coisa (*the rain*), um -ing (*being in the rain*). Nunca sujeito + verbo."},"x":{"name":"Linking adverb","namePt":"Advérbio de ligação","long":"links to the sentence before, usually at the start of a new one","longPt":"liga à frase anterior, quase sempre no começo de uma frase nova","eg":"It was raining. [However], we went out.","egPt":"Estava chovendo. No entanto, saímos.","tip":"It links back to the sentence before. A full stop (or a semicolon) comes before it, and usually a comma after it:","tipPt":"Liga com a frase anterior. Antes dele vem ponto (ou ponto e vírgula) e, quase sempre, vírgula depois:"}},"words":[{"id":"and","w":"and","job":"add","sh":"s","lv":"A2","pt":"e","u":"I called Mia and we talked","eg":"I called Mia and we talked for an hour.","egPt":"Liguei para a Mia e conversamos por uma hora."},{"id":"as-well-as","w":"as well as","job":"add","sh":"n","lv":"B1","pt":"assim como, além de","u":"as well as English","eg":"She speaks French as well as English.","egPt":"Ela fala francês, além de inglês.","note":{"en":"A noun or an -ing after it: as well as *cooking*, he cleans the house.","pt":"Depois dele, substantivo ou -ing: as well as *cooking*, he cleans the house."}},{"id":"in-addition-to","w":"in addition to","job":"add","sh":"n","lv":"B1","pt":"além de","u":"in addition to working","eg":"In addition to working full-time, she studies at night.","egPt":"Além de trabalhar em tempo integral, ela estuda à noite.","trap":{"pt":"Além de ensinar, ele escreve livros.","wrong":"In addition to teach, he writes books.","right":"In addition to teaching, he writes books.","why":"The *to* in in addition to is a preposition, so an *-ing* comes after it, where Portuguese has the infinitive.","whyPt":"O *to* de in addition to é preposição, então vem *-ing* depois, onde o português usa o infinitivo."}},{"id":"besides-n","w":"besides","job":"add","sh":"n","lv":"B1","pt":"além de","u":"besides being cheap","eg":"Besides being cheap, the hotel was very clean.","egPt":"Além de barato, o hotel era muito limpo."},{"id":"apart-from","w":"apart from","job":"add","sh":"n","lv":"B2","pt":"além de; fora","u":"apart from swimming","eg":"Apart from swimming, she also plays tennis.","egPt":"Além de nadar, ela também joga tênis.","note":{"en":"It can also mean except: Apart from Tom, everyone came = everyone came, but not Tom.","pt":"Também pode significar exceto: Apart from Tom, everyone came = todos vieram, menos o Tom."}},{"id":"also","w":"also","job":"add","sh":"x","lv":"A2","pt":"além disso; também","u":"Also, …","eg":"The apartment is small. Also, it's very noisy.","egPt":"O apartamento é pequeno. Além disso, é muito barulhento.","reg":"informal","note":{"en":"Inside a sentence, also goes before the main verb: We *also* went. At the start (Also, …) it's informal.","pt":"No meio da frase, also vem antes do verbo principal: We *also* went. No começo (Also, …) é informal."}},{"id":"in-addition","w":"in addition","job":"add","sh":"x","lv":"B1","pt":"além disso","u":"In addition, …","eg":"The job pays well. In addition, it's close to home.","egPt":"O emprego paga bem. Além disso, é perto de casa."},{"id":"besides-x","w":"besides","job":"add","sh":"x","lv":"B1","pt":"além do mais","u":"Besides, …","eg":"I don't want to go out. Besides, it's raining.","egPt":"Não quero sair. Além do mais, está chovendo.","note":{"en":"In conversation it often adds one more reason.","pt":"Na conversa, muitas vezes acrescenta mais um motivo."}},{"id":"whats-more","w":"what's more","job":"add","sh":"x","lv":"B1","pt":"e tem mais; além disso","u":"What's more, …","eg":"The food was great. What's more, it was cheap.","egPt":"A comida era ótima. E tem mais: era barata."},{"id":"plus","w":"plus","job":"add","sh":"x","lv":"B1","pt":"fora que; e mais","u":"Plus, …","eg":"The apartment is near the beach. Plus, the rent is low.","egPt":"O apartamento é perto da praia. Fora que o aluguel é baixo.","reg":"informal"},{"id":"moreover","w":"moreover","job":"add","sh":"x","lv":"B2","pt":"além disso","u":"Moreover, …","eg":"The plan is too expensive. Moreover, it would take years.","egPt":"O plano é caro demais. Além disso, levaria anos.","reg":"formal"},{"id":"furthermore","w":"furthermore","job":"add","sh":"x","lv":"B2","pt":"além disso","u":"Furthermore, …","eg":"Exercise improves your mood. Furthermore, it helps you sleep.","egPt":"O exercício melhora o humor. Além disso, ajuda a dormir.","reg":"formal"},{"id":"but","w":"but","job":"surprise","sh":"s","lv":"A2","pt":"mas","u":"…, but it was comfortable","eg":"The hotel was old, but it was very comfortable.","egPt":"O hotel era velho, mas era muito confortável.","d":{"en":"it joins the two ideas, and the second one is the surprise","pt":"une as duas ideias, e a segunda é a surpresa"}},{"id":"although","w":"although","job":"surprise","sh":"s","lv":"B1","pt":"embora","u":"although it was late","eg":"Although it was late, we kept talking.","egPt":"Embora fosse tarde, continuamos conversando.","note":{"en":"No *but* after it: Although it was late, *but* we kept talking ✗.","pt":"Sem *but* depois: Although it was late, *but* we kept talking ✗."},"d":{"en":"it goes with the idea that makes the other one surprising","pt":"acompanha a ideia que torna a outra surpreendente"}},{"id":"even-though","w":"even though","job":"surprise","sh":"s","lv":"B1","pt":"mesmo que; embora","u":"even though she was sick","eg":"She went to work even though she was sick.","egPt":"Ela foi trabalhar mesmo estando doente.","note":{"en":"Stronger than although. Even though = it's true (she *was* sick); even if = maybe.","pt":"Mais forte que although. Even though = é verdade (ela *estava* doente); even if = talvez."},"d":{"en":"it goes with the idea that makes the other one surprising","pt":"acompanha a ideia que torna a outra surpreendente"}},{"id":"though","w":"though","job":"surprise","sh":"s","lv":"B1","pt":"embora","u":"though it was cold","eg":"Though it was cold, the kids played outside.","egPt":"Embora estivesse frio, as crianças brincaram lá fora.","reg":"informal","d":{"en":"it goes with the idea that makes the other one surprising","pt":"acompanha a ideia que torna a outra surpreendente"}},{"id":"much-as","w":"much as","job":"surprise","sh":"s","lv":"B2","pt":"por mais que","u":"much as I love my job","eg":"Much as I love my job, I need a vacation.","egPt":"Por mais que eu ame meu trabalho, preciso de férias.","reg":"formal","note":{"en":"Mostly with verbs of feeling: love, like, hate, want, admire.","pt":"Mais com verbos de sentimento: love, like, hate, want, admire."}},{"id":"despite","w":"despite","job":"surprise","sh":"n","lv":"B1","pt":"apesar de","u":"despite the rain","eg":"Despite the rain, we went to the beach.","egPt":"Apesar da chuva, fomos à praia.","note":{"en":"No *of*: despite *of* the rain ✗ (with *of* it's in spite of).","pt":"Sem *of*: despite *of* the rain ✗ (com *of* é in spite of)."},"trap":{"pt":"Apesar de estar chovendo, fomos à praia.","wrong":"Despite it was raining, we went to the beach.","right":"Despite the rain, we went to the beach. / Although it was raining, …","why":"*Despite* takes a noun or an *-ing*, never a subject + verb. Before a full sentence, use *although*.","whyPt":"*Despite* pede substantivo ou *-ing*, nunca sujeito + verbo. Antes de uma frase completa, use *although*."}},{"id":"in-spite-of","w":"in spite of","job":"surprise","sh":"n","lv":"B1","pt":"apesar de","u":"in spite of the traffic","eg":"In spite of the traffic, we arrived on time.","egPt":"Apesar do trânsito, chegamos na hora."},{"id":"however","w":"however","job":"surprise","sh":"x","lv":"B1","pt":"porém; no entanto","u":". However, …","eg":"The test was hard. However, everyone passed.","egPt":"A prova era difícil. No entanto, todo mundo passou.","trap":{"pt":"A prova era difícil, porém todo mundo passou.","wrong":"The test was hard, however everyone passed.","right":"The test was hard. However, everyone passed. / The test was hard, but everyone passed.","why":"*However* can't join two sentences with just a comma. Put a full stop (or a semicolon) before it and a comma after it, or use *but*.","whyPt":"*However* não une duas frases só com vírgula. Use ponto (ou ponto e vírgula) antes e vírgula depois, ou use *but*."}},{"id":"even-so","w":"even so","job":"surprise","sh":"x","lv":"B1","pt":"mesmo assim","u":"Even so, …","eg":"The hotel was expensive. Even so, we stayed there again.","egPt":"O hotel era caro. Mesmo assim, ficamos lá de novo."},{"id":"still","w":"still","job":"surprise","sh":"x","lv":"B1","pt":"ainda assim","u":"Still, …","eg":"It was a long trip. Still, it was worth it.","egPt":"Foi uma viagem longa. Ainda assim, valeu a pena.","note":{"en":"At the start, with a comma, still means even so. Inside a sentence it means ainda: I *still* live here.","pt":"No começo, com vírgula, still significa mesmo assim. No meio da frase significa ainda: I *still* live here."}},{"id":"nevertheless","w":"nevertheless","job":"surprise","sh":"x","lv":"B2","pt":"no entanto; mesmo assim","u":"Nevertheless, …","eg":"The risks were high. Nevertheless, they decided to go on.","egPt":"Os riscos eram altos. Mesmo assim, decidiram continuar.","reg":"formal"},{"id":"nonetheless","w":"nonetheless","job":"surprise","sh":"x","lv":"B2","pt":"ainda assim","u":"Nonetheless, …","eg":"The results were small. Nonetheless, they were important.","egPt":"Os resultados foram pequenos. Ainda assim, foram importantes.","reg":"formal"},{"id":"though-x","w":"though","job":"surprise","sh":"x","lv":"B1","pt":"mas; só que (no fim da frase)","u":"…, though.","eg":"The test was hard. I passed, though.","egPt":"A prova foi difícil. Mas eu passei.","reg":"informal","note":{"en":"In speech, though often goes at the end of the second sentence, after a comma.","pt":"Na fala, though muitas vezes vai no fim da segunda frase, depois de uma vírgula."}},{"id":"while-d","w":"while","job":"differ","sh":"s","lv":"B1","pt":"enquanto (que)","u":"…, while my sister prefers…","eg":"I love the beach, while my sister prefers the mountains.","egPt":"Eu amo a praia, enquanto a minha irmã prefere a montanha.","note":{"en":"While also says time (while I was sleeping). Here it puts two different things side by side.","pt":"While também indica tempo (while I was sleeping). Aqui coloca duas coisas diferentes lado a lado."}},{"id":"whereas","w":"whereas","job":"differ","sh":"s","lv":"B2","pt":"ao passo que; enquanto que","u":"…, whereas Canada is freezing","eg":"Brazil is hot in January, whereas Canada is freezing.","egPt":"O Brasil é quente em janeiro, ao passo que o Canadá é gelado.","reg":"formal"},{"id":"unlike","w":"unlike","job":"differ","sh":"n","lv":"B1","pt":"ao contrário de; diferente de","u":"unlike his brother","eg":"Unlike his brother, Tom loves sports.","egPt":"Ao contrário do irmão, o Tom adora esportes."},{"id":"as-opposed-to","w":"as opposed to","job":"differ","sh":"n","lv":"B2","pt":"e não; em oposição a","u":"as opposed to an office","eg":"I prefer working at home, as opposed to working in an office.","egPt":"Prefiro trabalhar em casa, e não num escritório."},{"id":"on-the-other-hand","w":"on the other hand","job":"differ","sh":"x","lv":"B1","pt":"por outro lado","u":"On the other hand, …","eg":"The city is exciting. On the other hand, it's very expensive.","egPt":"A cidade é animada. Por outro lado, é muito cara.","note":{"en":"Often after On the one hand… It's *on* the other hand, never *by* the other hand.","pt":"Muitas vezes depois de On the one hand… É *on* the other hand, nunca *by* the other hand."}},{"id":"in-contrast","w":"in contrast","job":"differ","sh":"x","lv":"B1","pt":"em contraste; já","u":"In contrast, …","eg":"The north is dry. In contrast, the south gets a lot of rain.","egPt":"O norte é seco. Já o sul recebe muita chuva."},{"id":"by-contrast","w":"by contrast","job":"differ","sh":"x","lv":"B2","pt":"em contrapartida","u":"By contrast, …","eg":"Prices in the city went up. By contrast, prices in the countryside fell.","egPt":"Os preços na cidade subiram. Em contrapartida, os do interior caíram.","reg":"formal"},{"id":"conversely","w":"conversely","job":"differ","sh":"x","lv":"B2","pt":"por outro lado; inversamente","u":"Conversely, …","eg":"Some people work better in the morning. Conversely, others are at their best at night.","egPt":"Algumas pessoas trabalham melhor de manhã. Por outro lado, outras rendem mais à noite.","reg":"formal","note":{"en":"Conversely = the other way round.","pt":"Conversely = ao contrário, de forma inversa."}},{"id":"because","w":"because","job":"reason","sh":"s","lv":"A2","pt":"porque","u":"because it was raining","eg":"We took a taxi because it was raining.","egPt":"Pegamos um táxi porque estava chovendo.","note":{"en":"Usually no comma before because. With a noun it's because *of*: because of the rain.","pt":"Normalmente sem vírgula antes de because. Com substantivo é because *of*: because of the rain."}},{"id":"since-r","w":"since","job":"reason","sh":"s","lv":"B1","pt":"já que; como","u":"since you're here","eg":"Since you're here, can you help me?","egPt":"Já que você está aqui, pode me ajudar?","note":{"en":"Since also says time: since 2010, since I was ten (desde).","pt":"Since também indica tempo: since 2010, since I was ten (desde)."}},{"id":"as-r","w":"as","job":"reason","sh":"s","lv":"B1","pt":"como; já que","u":"as it was late","eg":"As it was late, we took a taxi.","egPt":"Como era tarde, pegamos um táxi.","note":{"en":"Often at the start of the sentence, for a reason the listener already knows.","pt":"Muitas vezes no começo da frase, para uma causa que o ouvinte já conhece."}},{"id":"now-that","w":"now that","job":"reason","sh":"s","lv":"B2","pt":"agora que","u":"now that I work from home","eg":"Now that I work from home, I have more time for my kids.","egPt":"Agora que trabalho de casa, tenho mais tempo para os meus filhos."},{"id":"because-of","w":"because of","job":"reason","sh":"n","lv":"A2","pt":"por causa de","u":"because of the rain","eg":"The game stopped because of the rain.","egPt":"O jogo parou por causa da chuva.","trap":{"pt":"O jogo parou porque estava chovendo.","wrong":"The game stopped because of it was raining.","right":"The game stopped because it was raining. / … because of the rain.","why":"*Because of* takes a noun (the rain). Before a subject + verb, use *because*.","whyPt":"*Because of* pede substantivo (the rain). Antes de sujeito + verbo, use *because*."}},{"id":"due-to","w":"due to","job":"reason","sh":"n","lv":"B1","pt":"devido a","u":"due to bad weather","eg":"The flight was canceled due to bad weather.","egPt":"O voo foi cancelado devido ao mau tempo.","reg":"formal"},{"id":"thanks-to","w":"thanks to","job":"reason","sh":"n","lv":"B1","pt":"graças a","u":"thanks to your help","eg":"Thanks to your help, we finished early.","egPt":"Graças à sua ajuda, terminamos cedo.","note":{"en":"Usually for a good result.","pt":"Normalmente para um resultado bom."}},{"id":"as-a-result-of","w":"as a result of","job":"reason","sh":"n","lv":"B1","pt":"em consequência de","u":"as a result of the storm","eg":"As a result of the storm, the roads were closed.","egPt":"Em consequência da tempestade, as estradas foram fechadas."},{"id":"owing-to","w":"owing to","job":"reason","sh":"n","lv":"B2","pt":"devido a","u":"owing to a technical problem","eg":"Owing to a technical problem, the show started late.","egPt":"Devido a um problema técnico, o show começou atrasado.","reg":"formal"},{"id":"after-all","w":"after all","job":"reason","sh":"x","lv":"B2","pt":"afinal","u":"After all, …","eg":"Don't be too hard on him. After all, he's only six.","egPt":"Não seja tão duro com ele. Afinal, ele só tem seis anos.","note":{"en":"It gives a reason that makes your point stronger. It doesn't mean in the end.","pt":"Dá um motivo que reforça o que você disse. Não significa no fim."}},{"id":"so","w":"so","job":"result","sh":"s","lv":"A2","pt":"então; por isso","u":"…, so we stayed home","eg":"It was raining, so we stayed home.","egPt":"Estava chovendo, então ficamos em casa.","note":{"en":"Usually with a comma before it.","pt":"Normalmente com vírgula antes."}},{"id":"thats-why","w":"that's why","job":"result","sh":"x","lv":"A2","pt":"é por isso que","u":". That's why I'm late","eg":"I missed the bus. That's why I'm late.","egPt":"Perdi o ônibus. É por isso que estou atrasado.","note":{"en":"No comma after it: That's why I'm late.","pt":"Sem vírgula depois: That's why I'm late."}},{"id":"therefore","w":"therefore","job":"result","sh":"x","lv":"B1","pt":"portanto; por isso","u":"Therefore, …","eg":"He didn't study. Therefore, he failed the test.","egPt":"Ele não estudou. Portanto, foi reprovado.","reg":"formal"},{"id":"as-a-result","w":"as a result","job":"result","sh":"x","lv":"B1","pt":"como resultado; por isso","u":"As a result, …","eg":"The bus broke down. As a result, we missed the show.","egPt":"O ônibus quebrou. Por isso, perdemos o show."},{"id":"consequently","w":"consequently","job":"result","sh":"x","lv":"B2","pt":"consequentemente","u":"Consequently, …","eg":"Sales fell. Consequently, the store closed.","egPt":"As vendas caíram. Consequentemente, a loja fechou.","reg":"formal"},{"id":"thus","w":"thus","job":"result","sh":"x","lv":"B2","pt":"assim; dessa forma","u":"Thus, …","eg":"The road was closed. Thus, we had to take the long way.","egPt":"A estrada estava fechada. Assim, tivemos que dar a volta.","reg":"formal"},{"id":"so-that","w":"so that","job":"purpose","sh":"s","lv":"B1","pt":"para que","u":"so that I could catch the train","eg":"I left early so that I could catch the first train.","egPt":"Saí cedo para pegar o primeiro trem.","note":{"en":"Usually with can, could, will or would after it.","pt":"Normalmente com can, could, will ou would depois."},"trap":{"pt":"Falei devagar para que todos entendessem.","wrong":"I spoke slowly for everyone understand.","right":"I spoke slowly so that everyone could understand.","why":"*Para que* + a full sentence is *so that*, never *for*.","whyPt":"*Para que* + frase completa é *so that*, nunca *for*."}},{"id":"to","after":{"en":"+ a verb","pt":"+ um verbo"},"w":"to","job":"purpose","sh":"n","lv":"A2","pt":"para (+ verbo)","u":"to buy milk","eg":"I went to the store to buy milk.","egPt":"Fui ao mercado para comprar leite.","trap":{"pt":"Fui ao mercado para comprar leite.","wrong":"I went to the store for buy milk.","right":"I went to the store to buy milk.","why":"*Para* + a verb is *to* + the verb, never *for* + verb (or *for to*).","whyPt":"*Para* + verbo é *to* + verbo, nunca *for* + verbo (nem *for to*)."}},{"id":"in-order-to","after":{"en":"+ a verb","pt":"+ um verbo"},"w":"in order to","job":"purpose","sh":"n","lv":"B1","pt":"a fim de; para","u":"in order to save money","eg":"We cook at home in order to save money.","egPt":"Cozinhamos em casa para economizar dinheiro.","note":{"en":"A little more formal than to. The negative is in order *not* to.","pt":"Um pouco mais formal que to. O negativo é in order *not* to."}},{"id":"for-n","w":"for","job":"purpose","sh":"n","lv":"B1","pt":"para (+ substantivo)","u":"for a coffee","eg":"Let's stop for a coffee.","egPt":"Vamos parar para um café.","note":{"en":"*For* + a noun (for a coffee); *to* + a verb (to have a coffee).","pt":"*For* + substantivo (for a coffee); *to* + verbo (to have a coffee)."},"bad":{"to":{"en":"*For* goes before a noun (for a coffee). Before a verb, Portuguese *para* is *to*: to buy, to be.","pt":"*For* vai antes de substantivo (for a coffee). Antes de verbo, o *para* do português é *to*: to buy, to be."},"in-order-to":{"en":"*For* goes before a noun (for a coffee). Before a verb, use *to* or *in order to*.","pt":"*For* vai antes de substantivo (for a coffee). Antes de verbo, use *to* ou *in order to*."}}},{"id":"so-as-to","after":{"en":"+ a verb","pt":"+ um verbo"},"w":"so as to","job":"purpose","sh":"n","lv":"B2","pt":"de modo a; para","u":"so as not to wake the baby","eg":"We spoke quietly so as not to wake the baby.","egPt":"Falamos baixo para não acordar o bebê.","reg":"formal"},{"id":"if","w":"if","job":"cond","sh":"s","lv":"A2","pt":"se","u":"if it rains","eg":"If it rains, we'll stay home.","egPt":"Se chover, vamos ficar em casa.","note":{"en":"The present after if for the future: if it rains (not if it will rain).","pt":"Presente depois de if para o futuro: if it rains (não if it will rain)."},"bad":{"unless":{"en":"*If* turns the meaning around here: the sentence needs if… not, and that's *unless*.","pt":"*If* inverte o sentido aqui: a frase pede se… não, e isso é *unless*."},"in-case":{"en":"With *if*, you'd do it only after it happens. *In case* means you do it now, just to be safe.","pt":"Com *if*, você só faria depois que acontecesse. *In case* significa fazer agora, por precaução."}},"d":{"en":"it may happen","pt":"pode acontecer"}},{"id":"unless","w":"unless","job":"cond","sh":"s","lv":"B1","pt":"a menos que; a não ser que","d":{"en":"if it doesn't happen (if… not)","pt":"se não acontecer (se… não)"},"u":"unless you hurry","eg":"You'll miss the bus unless you hurry.","egPt":"Você vai perder o ônibus a não ser que se apresse.","note":{"en":"Unless = if… not. Don't add another not: unless you *don't* hurry ✗.","pt":"Unless = se… não. Não coloque outro not: unless you *don't* hurry ✗."},"bad":{"in-case":{"en":"*Unless* = if… not: it would mean only if there are no problems. *In case* = just to be safe, in case something happens.","pt":"*Unless* = se… não: significaria só se não houver problemas. *In case* = por precaução, caso algo aconteça."},"provided":{"en":"*Unless* = if… not: it says the opposite. Here it's only if, so it's *{y}*.","pt":"*Unless* = se… não: diz o contrário. Aqui é só se, então é *{y}*."},"as-long-as":{"en":"*Unless* = if… not: it says the opposite. Here it's only if, so it's *{y}*.","pt":"*Unless* = se… não: diz o contrário. Aqui é só se, então é *{y}*."},"only-if":{"en":"*Unless* = if… not: it says the opposite. Here it's only if, so it's *{y}*.","pt":"*Unless* = se… não: diz o contrário. Aqui é só se, então é *{y}*."},"if":{"en":"*Unless* = if… not: it turns the meaning around. Here it's a plain condition, so it's *if*.","pt":"*Unless* = se… não: inverte o sentido. Aqui é uma condição simples, então é *if*."}}},{"id":"as-long-as","w":"as long as","job":"cond","sh":"s","lv":"B1","pt":"desde que; contanto que","u":"as long as you drive carefully","eg":"You can borrow my car as long as you drive carefully.","egPt":"Pode pegar o meu carro emprestado, desde que dirija com cuidado.","trap":{"pt":"Pode ir, desde que volte cedo.","wrong":"You can go since you come back early.","right":"You can go as long as you come back early.","why":"*Desde que* as a condition is *as long as*. *Since* is desde (time) or já que (reason).","whyPt":"*Desde que* com sentido de condição é *as long as*. *Since* é desde (tempo) ou já que (causa)."},"d":{"en":"only if (a condition you set)","pt":"só se (uma condição que você impõe)"}},{"id":"provided","w":"provided","job":"cond","sh":"s","lv":"B2","pt":"contanto que; desde que","u":"provided you bring some food","eg":"You can come, provided you bring some food.","egPt":"Pode vir, contanto que traga alguma comida.","reg":"formal","note":{"en":"Also provided that, or providing (that). It means the same as as long as.","pt":"Também provided that, ou providing (that). Significa o mesmo que as long as."},"d":{"en":"only if (a condition you set)","pt":"só se (uma condição que você impõe)"}},{"id":"in-case","w":"in case","job":"cond","sh":"s","lv":"B1","pt":"caso; por precaução","u":"in case it rains","eg":"Take an umbrella in case it rains.","egPt":"Leve um guarda-chuva, caso chova.","trap":{"pt":"Caso chova, vamos ficar em casa.","wrong":"In case it rains, we'll stay home.","right":"If it rains, we'll stay home.","why":"*In case* is for something you do before, just to be safe: take an umbrella in case it rains. When one thing depends on another, use *if*.","whyPt":"*In case* é para algo que você faz antes, por precaução: leve um guarda-chuva caso chova. Quando uma coisa depende da outra, use *if*."},"bad":{"if":{"en":"*In case* means just to be safe: you do something now, in case something happens later. Here one thing depends on the other, so it's *if*.","pt":"*In case* é por precaução: você faz algo agora, caso algo aconteça depois. Aqui uma coisa depende da outra, então é *if*."},"provided":{"en":"*In case* means just to be safe. Here it's a condition (only then), so it's *provided*.","pt":"*In case* é por precaução. Aqui é uma condição (só assim), então é *provided*."},"supposing":{"en":"*In case* means just to be safe. Here you imagine a situation (what if…?), so it's *supposing* (or *if*).","pt":"*In case* é por precaução. Aqui você imagina uma situação (e se…?), então é *supposing* (ou *if*)."}},"d":{"en":"just to be safe","pt":"por precaução"}},{"id":"even-if","w":"even if","job":"cond","sh":"s","lv":"B1","pt":"mesmo se; ainda que","u":"even if it rains","eg":"We're going to the beach even if it rains.","egPt":"Vamos à praia mesmo se chover.","note":{"en":"Even if = maybe (it may rain). Even though = it's true (it is raining).","pt":"Even if = talvez (pode chover). Even though = é verdade (está chovendo)."},"d":{"en":"it doesn't matter whether it happens","pt":"tanto faz se acontecer"}},{"id":"only-if","w":"only if","job":"cond","sh":"s","lv":"B2","pt":"só se","u":"only if you come with me","eg":"I'll go only if you come with me.","egPt":"Só vou se você for comigo.","d":{"en":"only in that case","pt":"só nesse caso"}},{"id":"supposing","w":"supposing","job":"cond","sh":"s","lv":"B2","pt":"supondo que; e se","u":"supposing you won","eg":"Supposing you won the lottery, what would you do?","egPt":"Supondo que você ganhasse na loteria, o que faria?","reg":"informal","d":{"en":"imagine that it happens","pt":"imagine que aconteça"}},{"id":"in-case-of","w":"in case of","job":"cond","sh":"n","lv":"B1","pt":"em caso de","u":"in case of fire","eg":"In case of fire, use the stairs.","egPt":"Em caso de incêndio, use as escadas.","reg":"formal","note":{"en":"Mostly on signs and in instructions.","pt":"Mais em placas e instruções."}},{"id":"without","w":"without","job":"cond","sh":"n","lv":"B2","pt":"sem","u":"without your help","eg":"Without your help, I would never have finished.","egPt":"Sem a sua ajuda, eu nunca teria terminado."},{"id":"otherwise","w":"otherwise","job":"cond","sh":"x","lv":"B1","pt":"senão; caso contrário","u":"Otherwise, …","eg":"Hurry up. Otherwise, we'll miss the train.","egPt":"Anda logo. Senão, vamos perder o trem.","note":{"en":"In speech, or does the same job: Hurry up, or we'll miss it.","pt":"Na fala, or faz o mesmo: Hurry up, or we'll miss it."},"d":{"en":"if not, this will happen","pt":"se não, isto acontece"}},{"id":"in-that-case","w":"in that case","job":"cond","sh":"x","lv":"B1","pt":"nesse caso","u":"In that case, …","eg":"The museum is closed today. In that case, let's go tomorrow.","egPt":"O museu está fechado hoje. Nesse caso, vamos amanhã.","d":{"en":"because of what was just said, then…","pt":"por causa do que acabou de ser dito, então…"}},{"id":"if-not","w":"if not","job":"cond","sh":"x","lv":"B1","pt":"se não; caso contrário","u":"If not, …","eg":"Is the store open on Sunday? If not, I'll go on Monday.","egPt":"A loja abre no domingo? Se não, vou na segunda.","d":{"en":"if the answer is no","pt":"se a resposta for não"}},{"id":"if-so","w":"if so","job":"cond","sh":"x","lv":"B2","pt":"se sim; nesse caso","u":"If so, …","eg":"Do you need a ride? If so, I can pick you up.","egPt":"Você precisa de carona? Se sim, posso te buscar.","d":{"en":"if the answer is yes","pt":"se a resposta for sim"}},{"id":"when","w":"when","job":"time","sh":"s","lv":"A2","pt":"quando","u":"when you get home","eg":"Call me when you get home.","egPt":"Me liga quando chegar em casa.","note":{"en":"The present after when for the future: when you get home (not when you will get home).","pt":"Presente depois de when para o futuro: when you get home (não when you will get home)."},"d":{"en":"at that moment","pt":"naquele momento"}},{"id":"before-s","w":"before","job":"time","sh":"s","lv":"A2","pt":"antes de; antes que","u":"before you leave","eg":"Call me before you leave.","egPt":"Me liga antes de sair.","d":{"en":"earlier than that","pt":"antes disso"}},{"id":"after-s","w":"after","job":"time","sh":"s","lv":"A2","pt":"depois que","u":"after we had dinner","eg":"After we had dinner, we watched a movie.","egPt":"Depois que jantamos, assistimos a um filme.","d":{"en":"later than that","pt":"depois disso"}},{"id":"until-s","w":"until","job":"time","sh":"s","lv":"A2","pt":"até (que)","u":"until I come back","eg":"Wait here until I come back.","egPt":"Espere aqui até eu voltar.","d":{"en":"up to that moment, and then it stops","pt":"até aquele momento, e aí para"}},{"id":"while-t","w":"while","job":"time","sh":"s","lv":"B1","pt":"enquanto","u":"while I was in the shower","eg":"Someone called while I was in the shower.","egPt":"Alguém ligou enquanto eu estava no banho.","bad":{"time":{"en":"*While* is for two things happening at the same time (while I was cooking). Here one thing comes after the other, so it's *{y}*.","pt":"*While* é para duas coisas ao mesmo tempo (while I was cooking). Aqui uma vem depois da outra, então é *{y}*."}},"d":{"en":"at the same time","pt":"ao mesmo tempo"}},{"id":"as-soon-as","w":"as soon as","job":"time","sh":"s","lv":"B1","pt":"assim que","u":"as soon as I arrive","eg":"I'll text you as soon as I arrive.","egPt":"Te mando mensagem assim que eu chegar.","note":{"en":"The present for the future: as soon as I arrive (not will arrive).","pt":"Presente para o futuro: as soon as I arrive (não will arrive)."},"d":{"en":"right after it happens","pt":"logo depois que acontece"}},{"id":"whenever","w":"whenever","job":"time","sh":"s","lv":"B1","pt":"sempre que","u":"whenever I can","eg":"I visit my grandma whenever I can.","egPt":"Visito a minha avó sempre que posso.","d":{"en":"every time","pt":"toda vez que"}},{"id":"since-t","w":"since","job":"time","sh":"s","lv":"B1","pt":"desde que (tempo)","u":"since I was ten","eg":"I've lived here since I was ten.","egPt":"Moro aqui desde os dez anos.","note":{"en":"Usually with the present perfect: I've lived here since…","pt":"Normalmente com o present perfect: I've lived here since…"},"d":{"en":"from that moment up to now","pt":"daquele momento até agora"}},{"id":"once","w":"once","job":"time","sh":"s","lv":"B1","pt":"assim que; depois que","u":"once you've finished","eg":"Once you've finished, you can go home.","egPt":"Depois que terminar, pode ir para casa.","trap":{"pt":"Uma vez que ele não ligou, fui embora.","wrong":"Once he didn't call, I left.","right":"Since he didn't call, I left.","why":"Portuguese *uma vez que* gives a reason, so it's *since* or *as*. English *once* is about time: as soon as, after.","whyPt":"*Uma vez que* em português dá uma causa: é *since* ou *as*. *Once* em inglês é sobre tempo: assim que, depois que."},"bad":{"since-r":{"en":"Portuguese *uma vez que* gives a reason, but English *once* is about time (as soon as). For a reason, it's *since*.","pt":"*Uma vez que* em português dá uma causa, mas *once* em inglês é sobre tempo (assim que). Para causa, é *since*."},"as-r":{"en":"Portuguese *uma vez que* gives a reason, but English *once* is about time (as soon as). For a reason, it's *as* or *since*.","pt":"*Uma vez que* em português dá uma causa, mas *once* em inglês é sobre tempo (assim que). Para causa, é *as* ou *since*."}},"d":{"en":"after it's done","pt":"depois que estiver feito"}},{"id":"by-the-time","w":"by the time","job":"time","sh":"s","lv":"B1","pt":"quando; até o momento em que","u":"by the time we arrived","eg":"By the time we arrived, the movie had started.","egPt":"Quando chegamos, o filme já tinha começado.","note":{"en":"Often with had + past participle: it had already happened.","pt":"Muitas vezes com had + particípio: já tinha acontecido."},"d":{"en":"it had already happened before that moment","pt":"já tinha acontecido antes daquele momento"}},{"id":"as-t","w":"as","job":"time","sh":"s","lv":"B2","pt":"enquanto; quando","u":"as I was leaving","eg":"As I was leaving, the phone rang.","egPt":"Quando eu estava saindo, o telefone tocou.","d":{"en":"while something is going on","pt":"enquanto algo está acontecendo"}},{"id":"just-as-t","w":"just as","job":"time","sh":"s","lv":"B2","pt":"bem na hora em que","u":"just as I sat down","eg":"Just as I sat down, the phone rang.","egPt":"Bem na hora em que me sentei, o telefone tocou.","d":{"en":"at exactly that moment","pt":"exatamente naquele momento"}},{"id":"the-moment","w":"the moment","job":"time","sh":"s","lv":"B2","pt":"no momento em que; assim que","u":"the moment I saw her","eg":"I knew the moment I saw her.","egPt":"Eu soube no momento em que a vi.","d":{"en":"right when it happens","pt":"no exato momento em que acontece"}},{"id":"during","w":"during","job":"time","sh":"n","lv":"B1","pt":"durante","u":"during the night","eg":"It rained during the night.","egPt":"Choveu durante a noite.","trap":{"pt":"Alguém ligou enquanto eu dormia.","wrong":"Someone called during I was sleeping.","right":"Someone called while I was sleeping. / … during the night.","why":"*During* takes a noun (during the night). Before a subject + verb, use *while*.","whyPt":"*During* pede substantivo (during the night). Antes de sujeito + verbo, use *while*."},"d":{"en":"all through that time","pt":"ao longo daquele tempo"}},{"id":"before-n","w":"before","job":"time","sh":"n","lv":"A2","pt":"antes de","u":"before lunch / before eating","eg":"Wash your hands before eating.","egPt":"Lave as mãos antes de comer.","note":{"en":"Before + *-ing* where Portuguese has the infinitive: antes de comer = before *eating*.","pt":"Before + *-ing* onde o português usa o infinitivo: antes de comer = before *eating*."},"d":{"en":"earlier than that","pt":"antes disso"}},{"id":"after-n","w":"after","job":"time","sh":"n","lv":"A2","pt":"depois de","u":"after lunch / after eating","eg":"After lunch, we went for a walk.","egPt":"Depois do almoço, fomos dar uma volta.","d":{"en":"later than that","pt":"depois disso"}},{"id":"until-n","w":"until","job":"time","sh":"n","lv":"A2","pt":"até","u":"until 10 p.m.","eg":"The store is open until 10 p.m.","egPt":"A loja fica aberta até as 22h.","bad":{"by":{"en":"*Until* is for something that goes on up to that time (wait until Friday). For a deadline, no later than, it's *by*.","pt":"*Until* é para algo que continua até aquele momento (wait until Friday). Para um prazo, no máximo até, é *by*."}},"d":{"en":"up to that time, and then it stops","pt":"até aquele momento, e aí para"}},{"id":"since-n","w":"since","job":"time","sh":"n","lv":"B1","pt":"desde","u":"since Monday","eg":"I've been here since Monday.","egPt":"Estou aqui desde segunda.","d":{"en":"from that time up to now","pt":"daquele momento até agora"}},{"id":"by","w":"by","job":"time","sh":"n","lv":"B1","pt":"até (no máximo)","u":"by Friday","eg":"Please send the report by Friday.","egPt":"Por favor, mande o relatório até sexta.","trap":{"pt":"Mande o relatório até sexta.","wrong":"Send the report until Friday.","right":"Send the report by Friday.","why":"*Até* for a deadline (no later than) is *by*. *Until* is for something that goes on up to that time: I'll wait until Friday.","whyPt":"*Até* como prazo (no máximo) é *by*. *Until* é para algo que continua até aquele momento: I'll wait until Friday."},"d":{"en":"no later than (a deadline)","pt":"no máximo até (um prazo)"}},{"id":"meanwhile","w":"meanwhile","job":"time","sh":"x","lv":"B1","pt":"enquanto isso","u":"Meanwhile, …","eg":"I cooked dinner. Meanwhile, the kids set the table.","egPt":"Eu fiz o jantar. Enquanto isso, as crianças puseram a mesa.","d":{"en":"at the same time, somewhere else","pt":"ao mesmo tempo, em outro lugar"}},{"id":"afterward","w":"afterward","job":"time","sh":"x","lv":"B1","pt":"depois; mais tarde","u":"Afterward, …","eg":"We went to the beach. Afterward, we had pizza.","egPt":"Fomos à praia. Depois, comemos pizza.","note":{"en":"Also afterwards (more common in British English).","pt":"Também afterwards (mais comum no inglês britânico)."},"d":{"en":"later","pt":"mais tarde"}},{"id":"since-then","w":"since then","job":"time","sh":"x","lv":"B1","pt":"desde então","u":"Since then, …","eg":"We met in 2015. Since then, we've been best friends.","egPt":"Nos conhecemos em 2015. Desde então, somos melhores amigos.","d":{"en":"from then up to now","pt":"de lá até agora"}},{"id":"in-the-meantime","w":"in the meantime","job":"time","sh":"x","lv":"B2","pt":"nesse meio-tempo; enquanto isso","u":"In the meantime, …","eg":"The doctor will be here soon. In the meantime, please wait here.","egPt":"O médico já vem. Enquanto isso, aguarde aqui.","d":{"en":"until something else happens","pt":"até outra coisa acontecer"}},{"id":"until-then","w":"until then","job":"time","sh":"x","lv":"B2","pt":"até lá","u":"Until then, …","eg":"The new bridge opens in May. Until then, we take the ferry.","egPt":"A ponte nova abre em maio. Até lá, pegamos a balsa.","d":{"en":"up to that time","pt":"até aquele momento"}},{"id":"first","w":"first","job":"order","sh":"x","lv":"A2","pt":"primeiro","u":"First, …","eg":"First, wash the rice.","egPt":"Primeiro, lave o arroz.","d":{"en":"the first step","pt":"o primeiro passo"}},{"id":"then","w":"then","job":"order","sh":"x","lv":"A2","pt":"depois; em seguida","u":". Then …","eg":"We had lunch. Then we went to the museum.","egPt":"Almoçamos. Depois, fomos ao museu.","note":{"en":"Then = next in time. For a result, English uses *so*.","pt":"Then = depois, na sequência do tempo. Para consequência, o inglês usa *so*."},"trap":{"pt":"Eu estava cansado, então fui dormir.","wrong":"I was tired, then I went to bed.","right":"I was tired, so I went to bed.","why":"Portuguese *então* can be a result. English *then* is only about time (next); for a result, use *so*.","whyPt":"O *então* do português pode indicar consequência. O *then* do inglês é só tempo (depois); para consequência, use *so*."},"bad":{"result":{"en":"*Then* means next in time (first this, then that). Portuguese *então* can also give a result, but in English that's *so*.","pt":"*Then* é depois, na sequência do tempo. O *então* do português também indica consequência, mas em inglês isso é *so*."}},"d":{"en":"the next step","pt":"o passo seguinte"}},{"id":"after-that","w":"after that","job":"order","sh":"x","lv":"A2","pt":"depois disso","u":"After that, …","eg":"We visited the castle. After that, we had ice cream.","egPt":"Visitamos o castelo. Depois disso, tomamos sorvete.","d":{"en":"the next step","pt":"o passo seguinte"}},{"id":"finally","w":"finally","job":"order","sh":"x","lv":"A2","pt":"por fim; finalmente","u":"Finally, …","eg":"Finally, add the cheese and serve.","egPt":"Por fim, acrescente o queijo e sirva.","d":{"en":"the last step","pt":"o último passo"}},{"id":"next","w":"next","job":"order","sh":"x","lv":"B1","pt":"em seguida","u":"Next, …","eg":"Next, cut the onions.","egPt":"Em seguida, corte as cebolas.","d":{"en":"the next step","pt":"o passo seguinte"}},{"id":"in-the-end","w":"in the end","job":"order","sh":"x","lv":"B1","pt":"no fim; no final das contas","u":"In the end, …","eg":"We talked for hours. In the end, we decided to stay.","egPt":"Conversamos por horas. No fim, decidimos ficar.","trap":{"pt":"No fim, decidimos ficar.","wrong":"At the end, we decided to stay.","right":"In the end, we decided to stay.","why":"*In the end* = finally, after everything. *At the end* needs *of* + something: at the end of the movie.","whyPt":"*In the end* = no fim das contas, depois de tudo. *At the end* pede *of* + algo: at the end of the movie."},"d":{"en":"what finally happened, after everything","pt":"o que acabou acontecendo, depois de tudo"}},{"id":"eventually","w":"eventually","job":"order","sh":"x","lv":"B2","pt":"por fim; finalmente (depois de muito tempo)","u":"Eventually, …","eg":"We waited for two hours. Eventually, the bus came.","egPt":"Esperamos duas horas. Finalmente, o ônibus chegou.","trap":{"pt":"Eu eventualmente vou ao cinema.","wrong":"I eventually go to the movies.","right":"I sometimes go to the movies.","why":"*Eventually* is a false friend: it means in the end, after a long time. *Eventualmente* is *sometimes* or *occasionally*.","whyPt":"*Eventually* é falso cognato: significa no fim, depois de muito tempo. *Eventualmente* é *sometimes* ou *occasionally*."},"d":{"en":"in the end, after a long time","pt":"no fim, depois de muito tempo"}},{"id":"lastly","w":"lastly","job":"order","sh":"x","lv":"B2","pt":"por último","u":"Lastly, …","eg":"Lastly, I'd like to thank my parents.","egPt":"Por último, gostaria de agradecer aos meus pais.","d":{"en":"the last point of a list","pt":"o último item de uma lista"}},{"id":"or","w":"or","job":"choice","sh":"s","lv":"A2","pt":"ou","u":"…, or we can walk","eg":"We can take the bus, or we can walk.","egPt":"Podemos pegar o ônibus ou ir a pé.","d":{"en":"one or the other","pt":"um ou outro"}},{"id":"instead-of","w":"instead of","job":"choice","sh":"n","lv":"B1","pt":"em vez de","u":"instead of taking the bus","eg":"Let's walk instead of taking the bus.","egPt":"Vamos a pé em vez de pegar o ônibus.","trap":{"pt":"Vamos a pé em vez de pegar o ônibus.","wrong":"Let's walk instead of take the bus.","right":"Let's walk instead of taking the bus.","why":"*Instead of* + *-ing*, where Portuguese has the infinitive.","whyPt":"*Instead of* + *-ing*, onde o português usa o infinitivo."}},{"id":"rather-than","after":{"en":"+ a verb, a noun or an -ing","pt":"+ um verbo, um substantivo ou um -ing"},"w":"rather than","job":"choice","sh":"n","lv":"B1","pt":"em vez de; ao invés de","u":"rather than wait","eg":"We decided to walk rather than wait for the bus.","egPt":"Decidimos ir a pé em vez de esperar o ônibus.","note":{"en":"Rather than can take the verb or an -ing: rather than *wait* / rather than *waiting*.","pt":"Rather than aceita o verbo ou -ing: rather than *wait* / rather than *waiting*."}},{"id":"instead","w":"instead","job":"choice","sh":"x","lv":"B1","pt":"em vez disso","u":"Instead, …","eg":"There were no buses. Instead, we took a taxi.","egPt":"Não tinha ônibus. Em vez disso, pegamos um táxi.","note":{"en":"Instead alone goes at the start or at the end (we took a taxi instead). Instead *of* needs something after it.","pt":"Instead sozinho vai no começo ou no fim (we took a taxi instead). Instead *of* precisa de algo depois."},"d":{"en":"not that one, this one in its place","pt":"não aquele: este no lugar"}},{"id":"alternatively","w":"alternatively","job":"choice","sh":"x","lv":"B2","pt":"ou então; como alternativa","u":"Alternatively, …","eg":"You can pay online. Alternatively, you can pay at the door.","egPt":"Você pode pagar online. Ou então, pode pagar na entrada.","reg":"formal","d":{"en":"here's another option","pt":"aqui vai outra opção"}},{"id":"like-e","w":"like","job":"example","sh":"n","lv":"A2","pt":"como (por exemplo)","u":"like mangoes","eg":"I love tropical fruit, like mangoes and papayas.","egPt":"Adoro frutas tropicais, como manga e mamão.","reg":"informal"},{"id":"such-as","w":"such as","job":"example","sh":"n","lv":"B1","pt":"como; tais como","u":"such as Rio and Salvador","eg":"We visited big cities such as Rio and Salvador.","egPt":"Visitamos cidades grandes, como Rio e Salvador."},{"id":"including","w":"including","job":"example","sh":"n","lv":"B1","pt":"incluindo","u":"including two kids","eg":"Ten people came, including two kids.","egPt":"Vieram dez pessoas, incluindo duas crianças."},{"id":"for-example","w":"for example","job":"example","sh":"x","lv":"A2","pt":"por exemplo","u":"For example, …","eg":"Many animals sleep during the day. For example, owls only wake up at night.","egPt":"Muitos animais dormem durante o dia. Por exemplo, as corujas só acordam à noite."},{"id":"for-instance","w":"for instance","job":"example","sh":"x","lv":"B1","pt":"por exemplo","u":"For instance, …","eg":"Small changes help. For instance, you can take the stairs.","egPt":"Pequenas mudanças ajudam. Por exemplo, você pode ir de escada."},{"id":"as-s","w":"as","job":"similar","sh":"s","lv":"B1","pt":"como","u":"as I said","eg":"As I said, the store closes at six.","egPt":"Como eu disse, a loja fecha às seis.","note":{"en":"As + a sentence (as I said); like + a noun (like a child).","pt":"As + frase (as I said); like + substantivo (like a child)."},"d":{"en":"the way something is said or done","pt":"do jeito que algo é dito ou feito"}},{"id":"as-if","w":"as if","job":"similar","sh":"s","lv":"B1","pt":"como se","u":"as if he knew everything","eg":"He talks as if he knew everything.","egPt":"Ele fala como se soubesse tudo.","d":{"en":"as if it were true (but it isn't)","pt":"como se fosse verdade (mas não é)"}},{"id":"as-though","w":"as though","job":"similar","sh":"s","lv":"B2","pt":"como se","u":"as though she'd seen a ghost","eg":"She looked as though she'd seen a ghost.","egPt":"Ela estava com cara de quem tinha visto um fantasma.","d":{"en":"as if it were true (but it isn't)","pt":"como se fosse verdade (mas não é)"}},{"id":"just-as-s","w":"just as","job":"similar","sh":"s","lv":"B2","pt":"assim como; da mesma forma que","u":"just as plants need water","eg":"Just as plants need water, kids need attention.","egPt":"Assim como as plantas precisam de água, as crianças precisam de atenção.","d":{"en":"in the same way as","pt":"do mesmo jeito que"}},{"id":"like-s","w":"like","job":"similar","sh":"n","lv":"A2","pt":"como (igual a)","u":"like an angel","eg":"She sings like an angel.","egPt":"Ela canta como um anjo."},{"id":"as-n","w":"as","job":"similar","sh":"n","lv":"B1","pt":"como (no papel de)","u":"as a teacher","eg":"She works as a teacher.","egPt":"Ela trabalha como professora.","trap":{"pt":"Ela trabalha como professora.","wrong":"She works like a teacher.","right":"She works as a teacher.","why":"*As* + a job or a role = she really is one. *Like* = similar to one, but she isn't.","whyPt":"*As* + profissão ou papel = ela é mesmo. *Like* = parecida com uma, mas não é."}},{"id":"similarly","w":"similarly","job":"similar","sh":"x","lv":"B1","pt":"da mesma forma","u":"Similarly, …","eg":"Cats need to play. Similarly, dogs need long walks.","egPt":"Os gatos precisam brincar. Da mesma forma, os cães precisam de passeios longos."},{"id":"in-the-same-way","w":"in the same way","job":"similar","sh":"x","lv":"B1","pt":"do mesmo jeito","u":"In the same way, …","eg":"Muscles get stronger with use. In the same way, your memory improves with practice.","egPt":"Os músculos ficam mais fortes com o uso. Do mesmo jeito, a memória melhora com a prática."},{"id":"likewise","w":"likewise","job":"similar","sh":"x","lv":"B2","pt":"igualmente; da mesma forma","u":"Likewise, …","eg":"Teachers must respect students. Likewise, students must respect teachers.","egPt":"Os professores devem respeitar os alunos. Da mesma forma, os alunos devem respeitar os professores.","reg":"formal"},{"id":"in-fact","w":"in fact","job":"clarify","sh":"x","lv":"B1","pt":"na verdade; de fato","u":"In fact, …","eg":"It wasn't cheap. In fact, it was the most expensive hotel in town.","egPt":"Não era barato. Na verdade, era o hotel mais caro da cidade."},{"id":"actually","w":"actually","job":"clarify","sh":"x","lv":"B1","pt":"na verdade","u":"Actually, …","eg":"I thought he was Spanish. Actually, he's from Chile.","egPt":"Achei que ele fosse espanhol. Na verdade, ele é do Chile.","trap":{"pt":"Atualmente eu moro em Recife.","wrong":"Actually I live in Recife.","right":"Currently I live in Recife. / These days I live in Recife.","why":"*Actually* is a false friend: it means na verdade. *Atualmente* is *currently* or *these days*.","whyPt":"*Actually* é falso cognato: significa na verdade. *Atualmente* é *currently* ou *these days*."}},{"id":"in-other-words","w":"in other words","job":"clarify","sh":"x","lv":"B1","pt":"ou seja; em outras palavras","u":"In other words, …","eg":"The flight is full. In other words, we can't go today.","egPt":"O voo está lotado. Ou seja, não podemos ir hoje."},{"id":"anyway","w":"anyway","job":"clarify","sh":"x","lv":"B1","pt":"enfim; de qualquer forma","u":"Anyway, …","eg":"The party was a bit boring. Anyway, I'm home now.","egPt":"A festa foi meio chata. Enfim, já estou em casa.","reg":"informal","note":{"en":"It ends a topic, or goes back to the main point.","pt":"Encerra um assunto, ou volta ao ponto principal."}},{"id":"overall","w":"overall","job":"clarify","sh":"x","lv":"B1","pt":"no geral","u":"Overall, …","eg":"The food was OK and the staff were kind. Overall, it was a good trip.","egPt":"A comida era razoável e os funcionários eram gentis. No geral, foi uma boa viagem."},{"id":"in-conclusion","w":"in conclusion","job":"clarify","sh":"x","lv":"B2","pt":"concluindo; em conclusão","u":"In conclusion, …","eg":"In conclusion, small changes can make a big difference.","egPt":"Concluindo, pequenas mudanças podem fazer uma grande diferença.","reg":"formal"},{"id":"to-sum-up","w":"to sum up","job":"clarify","sh":"x","lv":"B2","pt":"resumindo","u":"To sum up, …","eg":"To sum up, the plan is cheap, fast and safe.","egPt":"Resumindo, o plano é barato, rápido e seguro."},{"id":"indeed","w":"indeed","job":"clarify","sh":"x","lv":"B2","pt":"de fato; realmente","u":"Indeed, …","eg":"The task was difficult. Indeed, few people finished it.","egPt":"A tarefa era difícil. De fato, poucas pessoas a terminaram.","reg":"formal"},{"id":"even","w":"even","fake":true,"lv":"B1","pt":"até; mesmo","u":"even Tom came","eg":"Everyone laughed, even the teacher.","egPt":"Todo mundo riu, até a professora.","why":{"en":"*Even* alone isn't a linking word: it adds emphasis (even the teacher = até a professora). To join two ideas, use *even though* or *even if*.","pt":"*Even* sozinho não liga ideias: só dá ênfase (even the teacher = até a professora). Para unir duas ideias, use *even though* ou *even if*."},"trap":{"pt":"Mesmo estando cansado, fui à festa.","wrong":"Even I was tired, I went to the party.","right":"Even though I was tired, I went to the party.","why":"*Mesmo* + a sentence is *even though* (it's true) or *even if* (maybe). *Even* alone can't join two sentences.","whyPt":"*Mesmo* + frase é *even though* (é verdade) ou *even if* (talvez). *Even* sozinho não une duas frases."}},{"id":"at-the-end","w":"at the end","fake":true,"lv":"B1","pt":"no final (de algo)","u":"at the end of the movie","eg":"Everyone cried at the end of the movie.","egPt":"Todo mundo chorou no final do filme.","why":{"en":"*At the end* needs *of* + something: at the end of the movie. For finally, after everything, it's *in the end*.","pt":"*At the end* pede *of* + algo: at the end of the movie. Para no fim das contas, depois de tudo, é *in the end*."}}],"wrong":{"n-for-s":{"en":"*{x}* has the right kind of meaning, but it takes a noun or an -ing ({xu}). Here a full sentence follows (a subject and a verb), so it's *{y}*.","pt":"*{x}* tem o sentido certo, mas pede substantivo ou -ing ({xu}). Aqui vem uma frase completa (sujeito e verbo), então é *{y}*."},"x-for-s":{"en":"*{x}* has the right kind of meaning, but it starts a new sentence ({xu}). Here the two ideas are in the same sentence, so it's *{y}*.","pt":"*{x}* tem o sentido certo, mas começa uma frase nova ({xu}). Aqui as duas ideias estão na mesma frase, então é *{y}*."},"s-for-n":{"en":"*{x}* has the right kind of meaning, but it needs a full sentence after it, with a subject and a verb ({xu}). Here a noun or an -ing follows, so it's *{y}*.","pt":"*{x}* tem o sentido certo, mas pede uma frase completa depois, com sujeito e verbo ({xu}). Aqui vem substantivo ou -ing, então é *{y}*."},"x-for-n":{"en":"*{x}* has the right kind of meaning, but it starts a new sentence ({xu}). Here a noun or an -ing follows, so it's *{y}*.","pt":"*{x}* tem o sentido certo, mas começa uma frase nova ({xu}). Aqui vem substantivo ou -ing, então é *{y}*."},"s-for-x":{"en":"*{x}* has the right kind of meaning, but it joins two ideas inside one sentence ({xu}). Here a new sentence starts (look at the full stop before the gap), so it's *{y}*.","pt":"*{x}* tem o sentido certo, mas une duas ideias dentro de uma frase ({xu}). Aqui começa uma frase nova (olhe o ponto antes da lacuna), então é *{y}*."},"n-for-x":{"en":"*{x}* has the right kind of meaning, but it takes a noun or an -ing ({xu}). Here a new sentence starts, so it's *{y}*.","pt":"*{x}* tem o sentido certo, mas pede substantivo ou -ing ({xu}). Aqui começa uma frase nova, então é *{y}*."},"job":{"en":"*{x}* is for {xjob}. Here the idea is {yjob}. It's *{y}*.","pt":"*{x}* serve para {xjob}. Aqui a ideia é {yjob}. É *{y}*."},"same-d":{"en":"*{x}* = {xd}. *{y}* = {yd}.","pt":"*{x}* = {xd}. *{y}* = {yd}."},"same":{"en":"*{x}* and *{y}* do similar jobs, but only *{y}* fits this sentence.","pt":"*{x}* e *{y}* fazem trabalhos parecidos, mas só *{y}* cabe nesta frase."},"reason-for-result":{"en":"*{x}* brings in a reason (why?), but what follows the gap is the result. With *{x}* the sentence says the opposite of what happened, so it's *{y}*.","pt":"*{x}* introduz uma causa (por quê?), mas o que vem depois da lacuna é a consequência. Com *{x}* a frase diz o contrário do que aconteceu, então é *{y}*."},"result-for-reason":{"en":"*{x}* brings in a result, but what follows the gap is the reason (why?). It's *{y}*.","pt":"*{x}* introduz uma consequência, mas o que vem depois da lacuna é a causa (por quê?). É *{y}*."},"surprise-for-result":{"en":"*{x}* shows a surprise, but what follows is just what you'd expect: a result. It's *{y}*.","pt":"*{x}* mostra uma surpresa, mas o que vem depois é exatamente o esperado: uma consequência. É *{y}*."},"result-for-surprise":{"en":"*{x}* brings in a result, but what follows is a surprise: not what you'd expect. It's *{y}*.","pt":"*{x}* introduz uma consequência, mas o que vem depois é uma surpresa: não é o esperado. É *{y}*."},"add-for-surprise":{"en":"*{x}* only adds one more idea, but here the second idea is a surprise. It's *{y}*.","pt":"*{x}* só acrescenta mais uma ideia, mas aqui a segunda ideia é uma surpresa. É *{y}*."},"surprise-for-add":{"en":"*{x}* shows a surprise, but here the second idea isn't surprising: it just adds more. It's *{y}*.","pt":"*{x}* mostra uma surpresa, mas aqui a segunda ideia não surpreende: só acrescenta. É *{y}*."},"time-for-cond":{"en":"*{x}* is for something that surely happens. Here it may or may not happen, so it's *{y}*.","pt":"*{x}* é para algo que acontece com certeza. Aqui pode acontecer ou não, então é *{y}*."},"cond-for-time":{"en":"*{x}* is for something that may or may not happen. Here it surely happens, and the question is when, so it's *{y}*.","pt":"*{x}* é para algo que pode acontecer ou não. Aqui acontece com certeza, e a questão é quando, então é *{y}*."},"order-for-result":{"en":"*{x}* only says what came next. Here the second idea is a result of the first, so it's *{y}*.","pt":"*{x}* só diz o que veio depois. Aqui a segunda ideia é consequência da primeira, então é *{y}*."}},"names":[{"name":"Coordinating conjunctions","namePt":"Conjunções coordenativas","sh":"s","what":"Join two ideas of the same weight: for, and, nor, but, or, yet, so (FANBOYS).","whatPt":"Unem duas ideias de mesmo peso: for, and, nor, but, or, yet, so (FANBOYS)."},{"name":"Subordinating conjunctions","namePt":"Conjunções subordinativas","sh":"s","what":"Start the part of a sentence that depends on the other part: although, because, when, if, unless, as soon as…","whatPt":"Começam a parte da frase que depende da outra: although, because, when, if, unless, as soon as…"},{"name":"Prepositions","namePt":"Preposições","sh":"n","what":"Take a noun or an -ing, never a full sentence: despite, because of, during, instead of…","whatPt":"Pedem substantivo ou -ing, nunca uma frase completa: despite, because of, during, instead of…"},{"name":"Linking adverbs (conjunctive adverbs)","namePt":"Advérbios de ligação","sh":"x","what":"Link a new sentence to the one before: however, therefore, moreover, meanwhile…","whatPt":"Ligam uma frase nova à anterior: however, therefore, moreover, meanwhile…"},{"name":"Correlative conjunctions","namePt":"Conjunções correlativas","sh":"","what":"Come in pairs: both… and, either… or, neither… nor, not only… but also. In this game: Paired conjunctions.","whatPt":"Vêm em pares: both… and, either… or, neither… nor, not only… but also. Neste jogo: Conjunções em pares."}],"demo":{"en":"It was raining, [so] we stayed at home.","pt":"Estava chovendo, então ficamos em casa.","dx":["but","because"]}},"pt":{"name":"Português","badge":"PT","grad":"linear-gradient(135deg, #1fa463, #e8b600)","ui":{"favorites":"Favoritos","seen":"Vistos","tutorial":"Tutorial","guide":"Guia","tries":"Tentativas","hint":"Pistas","left":"{n} restante ui também vale:","reg_formal":"formal","reg_informal":"informal","pairsTag":"Conjunções em pares","pairsIntro":"<b>Conjunções em pares!<\/b> Algumas palavras de ligação vêm em duas metades. Cada lacuna é uma faixa com duas partes: uma bolha só preenche as duas. Cuidado: algumas bolhas são armadilhas.","pairsSoSuch":"Olhe as palavras logo depois da lacuna: adjetivo sozinho (*hot*, *fast*) pede *so… that*; substantivo (*a nice day*, *good friends*) pede *such… that*.","pairsWrongUse":"*{x}* não cabe nesta lacuna. Leia em volta: qual é a ligação entre as duas partes?","sameTag":"Same message?","sameOf":"Same message? {n} de {total}","sameIntro":"<b>Bônus: Same message?<\/b> Leia a frase. Qual das versões diz a mesma coisa? (teclas 1–3)","sameAsk":"Qual diz a mesma coisa?","sameYes":"Mesma mensagem! +1","sameNo":"Não é a mesma mensagem.","sameScore":"Same message? {k} de {n}","guideTitle":"Palavras de ligação","guideNav":"Neste guia","guideTip":"<b>Não precisa saber nomes de gramática.<\/b> Para cada lacuna, faça duas perguntas: qual é a <b>função<\/b> dela (como as duas ideias se relacionam?) e o que vem <b>depois<\/b> dela (o formato)?","guideAsk":"Pergunte-se","ask1":"Qual é a função?","ask1Hint":"Como as duas ideias se relacionam? Mais uma ideia, uma surpresa, uma causa, uma consequência, tempo, uma condição…","ask2":"O que vem depois da lacuna?","ask2Hint":"Uma frase completa? Um substantivo ou um -ing? Ou começa uma frase nova?","shapesTitle":"Os três tipos","commaTip":"Vírgulas: normalmente uma antes de *but* e *so* (…, but…), nenhuma antes de *because*. Depois de uma frase que começa com *although*, *if* ou *when*, vírgula: Although it was late, we… As palavras de frase nova pedem vírgula depois: *However,* …","tableTitle":"Todas as palavras, por função e tipo","tableLead":"Apagada = acima do {lvl}. ✓ = na sua lista (certa na primeira conferida). Toque numa palavra para ver o exemplo.","jobsTitle":"Todas as funções, com exemplos","onYourList":"Na sua lista","pairsGuideTitle":"Conjunções em pares","pairsGuideLead":"Palavras que vêm em duas metades. Cada metade vai no seu lugar.","mistakesTitle":"Português → inglês: as armadilhas clássicas","mistakesLead":"O que o português nos faz dizer, o que o inglês diz no lugar, e por quê, até o seu nível. Toque num cartão.","namesTitle":"Para os curiosos: os nomes da gramática","namesLead":"Você não precisa deles para jogar. Aqui estão, ligados aos formatos.","newOnList":"Novas na sua lista:","pmNormal":"Jogo normal","pmSpeed":"Quick-fire","pmReview":"Revisar erros","pmFav":"Favoritos","nTexts":"{n} textos + bônus","nTextsP":"{n} textos","oneText":"1 texto","nSeconds":"{n} segundos · frases soltas","pmNoMiss":"nenhum erro ainda","pmNoFav":"nenhum favorito ainda","oneFav":"1 salvo","nFavs":"{n} salvos","speedTitle":"Quick-fire","speedIntro":"Escolha a palavra de ligação que cabe: uma frase de cada vez, o mais rápido que puder!","go":"Já!","speedAsk":"Qual palavra cabe? Toque nela ou aperte o número.","endGame":"Fim de jogo!","endPractice":"Treino concluído!","endTime":"Acabou o tempo!","onePoint":"1 ponto","nPoints":"{n} pontos","inSeconds":"{x} certas em {s} segundos","msg0":"Continue: a prática leva à perfeição!","msg1":"Bom esforço: continue praticando!","msg2":"Ótimo trabalho!","msg3":"Brilhante! Suas ideias estão perfeitamente ligadas.","noSave":"Jogo de treino: a pontuação não é salva.","speedRecord":"Novo recorde de quick-fire no {lvl}!","newBest":"Novo recorde no {lvl}!","levelBest":"Nível {lvl} · recorde {n}","hintsUsed":"Pistas usadas: {n} de {m}","bonus":" · +{n} de bônus","pairsRound":"Conjunções em pares: {r}","sameRound":"Same message: {r}","mastered":"textos dominados no {lvl}","daysRow":" · 🔥 {n} dias seguidos","trapsBeaten":"PT ≠ EN: armadilhas do português vencidas: {k} de {n}","playAgain":"Jogar de novo","copy":"Copiar resultado","copied":"Copiado ✓","copyFail":"Não deu para copiar","tryUp":"Tentar o {lvl} →","seenTitle":"Textos vistos","tabRecent":"Recentes","tabMissed":"Com erros","masteredHead":"Textos dominados (perfeitos na primeira conferida)","usesHead":"Funções para praticar (as mais fracas, em todos os jogos)","usesOk":"Nenhuma função fraca: 80% ou mais em todas!","practiseOne":"Praticar este","practiseMany":"Praticar estes","emptyFav":"Nenhum favorito ainda. Toque na estrela de um texto terminado, de um parágrafo das Conjunções em pares, de uma frase do Same message? ou de uma frase do quick-fire nos resultados para guardá-la aqui.","emptyRecent":"Os textos que você terminar vão aparecer aqui.","emptyMissed":"Nenhum texto com erro. Muito bem!"},"tour":{"ui":{"step":"Passo {n} de {total}","back":"Voltar","next":"Próximo","play":"Vamos jogar!","close":"Fechar o tutorial"},"steps":{"welcome":{"t":"<b>Linking<\/b> words","x":"As palavras de ligação unem ideias: <b>and<\/b>, <b>but<\/b>, <b>because<\/b>, <b>however<\/b>, <b>despite<\/b>… Em cada texto faltam algumas. Elas flutuam acima do texto: arraste (ou toque) cada uma até a sua lacuna. Veja:"},"level":{"t":"Escolha o seu nível","x":"<b>A2<\/b>: and, but, so, because, when, if, first, then…; instruções em português.<br><b>B1<\/b>: although, however, despite, while, unless, in case… e <b>bolhas extras<\/b> que não cabem em lugar nenhum.<br><b>B2+<\/b>: whereas, nevertheless, provided, owing to, much as… e mais bolhas extras."},"pool":{"t":"As palavras flutuam aqui","x":"Arraste uma bolha até uma lacuna, ou toque nela e depois na lacuna. Toque numa palavra já colocada para devolvê-la. A partir do B1, algumas bolhas são <b>extras<\/b>: parecem certas, mas não cabem em lugar nenhum."},"job":{"t":"Pergunta 1: qual é a função?","x":"Leia o texto inteiro primeiro. Para cada lacuna, pense em como as duas ideias se relacionam: só mais uma ideia (<i>and<\/i>)? Uma surpresa (<i>but<\/i>, <i>although<\/i>)? Uma causa (<i>because<\/i>)? Uma consequência (<i>so<\/i>)? Tempo (<i>when<\/i>)? Uma condição (<i>if<\/i>)?"},"shape":{"t":"Pergunta 2: o que vem depois?","x":"Palavras com a mesma função têm formatos diferentes. Uma frase completa pede algo como <b>although<\/b>. Ex: <i>although it was raining<\/i>. Um substantivo pede algo como <b>despite<\/b>. Ex: <i>despite the rain<\/i>."},"check":{"t":"Conferir","x":"Quando todas as lacunas tiverem uma palavra, toque em <b>Conferir<\/b>. Certa na primeira conferida = <b>2 pontos<\/b> por lacuna; numa conferida seguinte = 1. No A2 e no B1, as palavras erradas voltam para o topo e as certas ficam travadas em verde."},"clues":{"t":"Pistas","x":"Travou? As <b>pistas<\/b> mostram a função de cada lacuna (<i>Causa<\/i>, <i>Contraste: surpresa<\/i>…). As pistas valem para o jogo inteiro, e cada pista que sobrar vira <b>ponto bônus<\/b>."},"why":{"t":"Entenda o porquê","x":"Depois de conferir, cada bolha ganha a cor da sua função, e cada lacuna ganha uma explicação: a função, o formato, o português, um exemplo e as armadilhas <b>PT ≠ EN<\/b> (<i>então<\/i> → <b>so<\/b>, não <i>then<\/i>; <i>caso<\/i> → <b>if<\/b>, não <i>in case<\/i>)."},"pairs":{"t":"Conjunções em pares","x":"Algumas palavras de ligação vêm em duas metades: <b>both… and<\/b>, <b>either… or<\/b>, <b>neither… nor<\/b>, <b>not only… but also<\/b>… Depois dos 3 textos vem um quarto: um parágrafo com lacunas para esses pares."},"same":{"t":"Bônus: Same message?","x":"A última rodada: uma frase e três versões com outras palavras de ligação. Só uma diz a mesma coisa. As outras trocam causa e consequência, transformam uma causa em surpresa, mudam a ordem…"},"guide":{"t":"O guia","x":"Abra o <b>Guia<\/b> quando quiser: as duas perguntas, a tabela de palavras por função e formato (com ✓ em cada palavra que você já acertou), as armadilhas do português e os nomes da gramática para os curiosos."},"score":{"t":"Pontos","x":"Pontos por cada texto e rodada, mais 1 ponto bônus por pista não usada. Textos perfeitos seguidos formam um <b>combo<\/b>!"},"play":{"t":"Outras formas de jogar","x":"Toque em <b>new game<\/b> para um jogo novo, um desafio <b>quick-fire<\/b> de 1 minuto com frases soltas, ou um treino com os textos que você <b>errou<\/b> ou <b>marcou com estrela<\/b>."},"lists":{"t":"Favoritos e vistos","x":"Marque um texto terminado com estrela para guardá-lo nos <b>Favoritos<\/b>. <b>Vistos<\/b> mostra o seu progresso e os seus acertos em cada função. Descubra os seus pontos fracos e pratique!"}}}},"texts":{"A2":[{"id":"a2-01","frame":"Diary","framePt":"Diário","title":"A rainy Saturday","titlePt":"Um sábado chuvoso","body":["Last Saturday it rained all day, [so] we stayed at home. My little brother wanted to play video games, [but] I wanted to watch a movie. Mom had an idea. [first], we played his game for an hour. [then] we watched my movie with a big bowl of popcorn. It was a great day!"],"pt":["No sábado passado choveu o dia todo, então ficamos em casa. Meu irmão mais novo queria jogar videogame, mas eu queria assistir a um filme. A mamãe teve uma ideia. Primeiro, jogamos o jogo dele por uma hora. Depois, assistimos ao meu filme com uma tigela grande de pipoca. Foi um ótimo dia!"],"w":{"little brother":"irmão mais novo","bowl":"tigela","popcorn":"pipoca"},"dx":["because","or","until-s"],"notes":[{"en":"Portuguese *então* here gives a result, so English uses *so*, not *then*.","pt":"Aqui o *então* do português dá uma consequência, então em inglês é *so*, não *then*."},null,null,null]},{"id":"a2-02","frame":"Message","framePt":"Mensagem","title":"Running late","titlePt":"Atrasada","body":["Hi Ana! Sorry, I'm going to be late. I missed the first bus, [so] I'm on the next one now. It's really slow [because-of] the traffic. Please wait for me at the café [until-s] I get there, OK? [if] you're hungry, order something. See you soon!"],"pt":["Oi, Ana! Desculpa, vou me atrasar. Perdi o primeiro ônibus, então estou no próximo agora. Ele está bem devagar por causa do trânsito. Por favor, me espera no café até eu chegar, ok? Se você estiver com fome, pede alguma coisa. Até já!"],"w":{"missed":"perdi","slow":"devagar","traffic":"trânsito","order":"peça"},"dx":["or","after-s","like-e"]},{"id":"a2-03","frame":"Recipe","framePt":"Receita","title":"Easy pancakes","titlePt":"Panquecas fáceis","body":["[first], mix the flour, the milk and two eggs in a big bowl. Heat a little oil in a pan. [then] pour in some of the mix. [when] you see small holes on top, turn the pancake over. [finally], serve it with fruit or honey."],"pt":["Primeiro, misture a farinha, o leite e dois ovos numa tigela grande. Aqueça um pouco de óleo numa frigideira. Depois, despeje um pouco da mistura. Quando aparecerem furinhos em cima, vire a panqueca. Por fim, sirva com frutas ou mel."],"w":{"flour":"farinha","bowl":"tigela","heat":"aqueça","pan":"frigideira","pour":"despeje","holes":"furos","turn":"vire","honey":"mel"},"dx":["because","but","until-s"]},{"id":"a2-04","frame":"Email","framePt":"E-mail","title":"My new school","titlePt":"Minha escola nova","body":["Hi Grandma, I love my new school [because] the teachers are really nice. The building is old, [but] the classrooms are bright and new. We have lots of cool clubs, [like-e] chess and music. [also], the food in the cafeteria is great!","Love, Leo"],"pt":["Oi, vovó, estou adorando a minha escola nova porque os professores são muito legais. O prédio é velho, mas as salas são claras e novas. Temos vários clubes legais, como xadrez e música. Além disso, a comida do refeitório é ótima!","Beijos, Leo"],"w":{"building":"prédio","bright":"claras","chess":"xadrez","cafeteria":"refeitório"},"dx":["so","or","then"]},{"id":"a2-05","frame":"Story","framePt":"História","title":"Where is Max?","titlePt":"Cadê o Max?","body":["[when] Mia got home from school, her dog Max wasn't in the backyard. She was very worried [because] the gate was open. She looked everywhere, [but] she couldn't find him. [after-that], she called her friend Tom. Tom laughed: Max was at his house, eating his lunch!"],"pt":["Quando a Mia chegou da escola, o cachorro dela, o Max, não estava no quintal. Ela ficou muito preocupada porque o portão estava aberto. Ela procurou em todo lugar, mas não conseguiu encontrá-lo. Depois disso, ligou para o amigo Tom. O Tom riu: o Max estava na casa dele, comendo o almoço dele!"],"w":{"backyard":"quintal","worried":"preocupada","gate":"portão","everywhere":"em todo lugar","laughed":"riu"},"dx":["so","or","until-s"]},{"id":"a2-06","frame":"Blog","framePt":"Blog","title":"My morning routine","titlePt":"Minha rotina da manhã","body":["I get up at six every day. [before-n] breakfast, I go for a run in the park. [after-n] the run, I take a quick shower. [then] I have coffee and toast. I don't like crowded buses, [so] I ride my bike to work."],"pt":["Eu acordo às seis todo dia. Antes do café da manhã, vou correr no parque. Depois da corrida, tomo um banho rápido. Depois, tomo café com torrada. Não gosto de ônibus lotado, então vou de bicicleta para o trabalho."],"w":{"get up":"acordo","quick":"rápido","toast":"torrada","crowded":"lotados","ride":"ando de"},"dx":["because","but","until-n"],"notes":[{"en":"*Before* and *after* can also take an *-ing*: before eating, after running (Portuguese: antes de comer).","pt":"*Before* e *after* também aceitam *-ing*: before eating, after running (antes de comer)."},null,null,null]},{"id":"a2-07","frame":"Postcard","framePt":"Cartão-postal","title":"Hello from Lisbon","titlePt":"Oi, de Lisboa","body":["Dear Sam, Lisbon is beautiful! The weather is hot, [so] we go to the beach every afternoon. We eat a lot of fish [because] it's fresh and cheap here. Our hotel is small, [but] our room has an amazing view. Yesterday we visited an old castle. [after-that], we had ice cream by the river.","See you soon! Bia"],"pt":["Querido Sam, Lisboa é linda! O tempo está quente, então vamos à praia toda tarde. Comemos muito peixe porque aqui ele é fresco e barato. Nosso hotel é pequeno, mas o nosso quarto tem uma vista incrível. Ontem visitamos um castelo antigo. Depois disso, tomamos sorvete perto do rio.","Até logo! Bia"],"w":{"weather":"tempo","fresh":"fresco","cheap":"barato","view":"vista","castle":"castelo","river":"rio"},"dx":["or","until-s","first"]},{"id":"a2-08","frame":"Message","framePt":"Mensagem","title":"Saturday plans","titlePt":"Planos para sábado","body":["Hey Bia! What do you want to do on Saturday? We can go to the mall, [or] we can watch a movie at my place. The weather is going to be bad, [so] the park is not a good idea. I can't stay out late [because] I have a test on Monday. Let's meet [after-n] lunch, OK?"],"pt":["Oi, Bia! O que você quer fazer no sábado? Podemos ir ao shopping ou assistir a um filme lá em casa. O tempo vai estar ruim, então o parque não é uma boa ideia. Não posso ficar fora até tarde porque tenho prova na segunda. Vamos nos encontrar depois do almoço, ok?"],"w":{"mall":"shopping","at my place":"lá em casa","stay out late":"ficar fora até tarde","test":"prova"},"dx":["but","until-n","then"]},{"id":"a2-09","frame":"Sign","framePt":"Aviso","title":"City Library: rules","titlePt":"Biblioteca da cidade: regras","body":["Welcome to the City Library! You can borrow three books at a time. You need a library card [to] take books home. [if] you return a book late, you pay a small fine. Food is not allowed [because] it can damage the books. The library is open [until-n] 8 p.m., Monday to Saturday."],"pt":["Bem-vindo à Biblioteca da Cidade! Você pode pegar emprestado três livros por vez. Você precisa de uma carteirinha para levar livros para casa. Se você devolver um livro com atraso, paga uma pequena multa. Não é permitido comer porque a comida pode estragar os livros. A biblioteca fica aberta até as 20h, de segunda a sábado."],"w":{"borrow":"pegar emprestado","at a time":"por vez","library card":"carteirinha da biblioteca","return":"devolver","fine":"multa","allowed":"permitido","damage":"estragar"},"dx":["so","before-s","like-e"]},{"id":"a2-10","frame":"Message","framePt":"Mensagem","title":"My new job","titlePt":"Meu emprego novo","body":
