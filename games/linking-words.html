/* 13-reveal.js — the card shown after each text: score, Translation and Listen, then one collapsible explanation per
   gap (no card for the extra bubbles).
   An explanation shows: the gap's job (its colour) and shape, PT ≠ EN when the word is a Portuguese trap, a register
   chip (formal / informal), the sentence with the word in place, what was wrong with the player's choice (or first
   choice, when fixed later) and why, the other words that are also right there, the job in English and Portuguese, the
   word's Portuguese and its note, and the text's own note ("Watch out!"). Wrong ones open by default.
   Hovering an explanation lights up its gap; tapping a gap in the text jumps to it. Also the little celebrations. */
const ICON_SPK = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
function showReveal() {

  revealEl.innerHTML =
    '<div class="rv-bar"><div class="rv-head"><span class="rv-sc"><b class="rv-score">' + tx("correctOf", { k, n }) + "</b>" +
    (r.perfect ? '<span class="chip" style="--h:150">' + tx("perfect") + "</span>" : "") + "</span>" +
    '<span class="rv-tools"><button type="button" class="pbtn" id="trbtn" aria-pressed="false">' + ptBadge() + " " + tx("translation") + "</button>" +
    '<button type="button" class="pbtn" id="listen">' + ICON_SPK + " " + tx("listen") + "</button></span></div>" +
    '<div class="rv-act">' + favBtn(r.t.id) + '<button type="button" class="cta pulse" id="next">' + tx(nextLabel()) + " &rarr;</button></div></div>" +
    '<ol class="exl">' + P.spots.map((sp, i) => exHTML(r, sp, i)).join("") + "</ol>";
  revealEl.hidden = false;
  $("listen").addEventListener("click", () => speak(textParts(P), $("listen")));
  $("trbtn").addEventListener("click", toggleTranslation);
  $("next").addEventListener("click", nextRound);
  scrollToResult(() => G.r === r && G.phase === "done");
}
// The word shown in a gap, in bold in its job's colour.
const wordHTML = (sp, w) => '<b class="ex-v" style="--h:' + jobHue(sp.W.job) + '">' + esc(said(sp, w)) + "</b>";
// The body every explanation shares: the job, the word's shape and Portuguese, and its note (no example, no trap card).
function wordBody(W, pt, noName) {   // noName: the card already shows the word above
  const two = (en, p) => pt ? '<p class="ex-ptw" lang="pt">' + starTxt(p) + '</p><p class="ex-en">' + starTxt(en) + "</p>" : '<p class="ex-en">' + starTxt(en) + '</p><p class="ex-ptw" lang="pt">' + starTxt(p) + "</p>";
  return '<div class="ex-why">' + (W.job ? '<p class="ex-job">' + esc(cap(jobSay(W.job, pt))) + "</p>" : "") +
    '<p class="ex-word">' + (noName ? "" : '<b class="aq" style="--h:' + jobHue(W.job) + '">' + esc(W.w) + "</b> ") + (W.sh ? shapeLine(W, pt) + " " : "") + '<span class="ex-pt">' + ptBadge() + ' <span lang="pt">' + esc(W.pt) + "</span></span></p>" +

    (W.note ? '<p class="ex-note">' + starTxt(pt ? W.note.pt : W.note.en) + "</p>" : "") + "</div>";
}
// One explanation. Wrong ones, and ones only fixed on a later check ("late", ↻), open by default and show the choice
// that was wrong (the final one, or the first one for a late fix) and why.
function exHTML(r, sp, i) {
  const pt = nativeUi(), ok = r.ok[i], late = ok && !r.first[i], W = sp.W;
  const chose = WORD[late ? r.firstPick[i] : r.last[i]], shown = ok ? WORD[r.last[i]].w : W.w;
  const why = !ok || late ? wrongWhy(sp, chose, pt) : "";
  const alts = sp.ok.filter(w => w !== shown.toLowerCase());
  return '<li class="ex ' + (late ? "late" : ok ? "ok" : "bad") + '" data-i="' + i + '" style="--h:' + jobHue(W.job) + '"><details' + (ok && !late ? "" : " open") + "><summary>" +
    '<div class="ex-head"><span class="ex-tags"><span class="sn">' + (i + 1) + '</span><span class="ex-mk" aria-label="' + (late ? "right on a later check" : ok ? "right" : "wrong") + '">' + (late ? "↻" : ok ? "✓" : "✗") + "</span>" +
    // the job is the tag that opens the Guide at this word (as the rule tag in the a / an / the game)
    '<button type="button" class="ex-use" data-word="' + W.id + '" style="--h:' + jobHue(W.job) + '" title="' + esc(tx("inGuide")) + '">' + esc(jobName(W.job, pt)) + "</button>" +
    shapeChip(W.sh, pt) + (isTrapWord(W) ? '<span class="chip trapchip">' + esc(tx("ptTrap")) + "</span>" : "") + regChip(W, pt) + "</span>" +
    '<span class="ex-end"><button type="button" class="ex-say" aria-label="' + esc(tx("listen")) + '">' + ICON_SPK + "</button></span></div>" +
    '<p class="ex-s">' + sentHTML(r.P, i, j => wordHTML(sp, shown)) + "</p></summary>" +
    (why ? '<p class="ex-you">' + tx(late ? "youChoseFirst" : "youChose") + " <b class='ex-bad'>" + esc(chose.w) + "</b>, " + tx("rightIs", { x: "<b>" + esc(W.w) + "</b>" }) + '<br><span class="ex-wwhy">' + starTxt(why) + "</span></p>" : "") +
    (alts.length ? '<p class="ex-both"><b>' + esc(tx("alsoRight")) + "</b> " + alts.map(a => "<b>" + esc(a) + "</b>").join(", ") + "</p>" : "") +
    wordBody(ok ? WORD[r.last[i]] : W, pt) +
    (sp.note ? '<p class="rv-note"><b>' + tx("watchOut") + "</b> " + starTxt(pt ? sp.note.pt : sp.note.en) + "</p>" : "") + "</details></li>";
}
// What the voice reads: every paragraph with the words now in its gaps (a right alternative the player chose, else the

/* ---------- Little celebrations ---------- */
function toast(text, cls) {
  const t = document.createElement("div"); t.className = "toast " + (cls || ""); t.textContent = text;
  stage.appendChild(t); setTimeout(() => t.remove(), 1700);
}
// n particles (random hues, or all of hue); cls "top" = gold sparks from a star, above the windows and from its own centre.
function burst(el, n = 18, hue, cls) {
  if (reduceMotion || !el) return;
  const b = el.getBoundingClientRect(), cx = b.left + b.width / 2, cy = cls ? b.top + b.height / 2 : Math.min(b.top + b.height / 2, innerHeight / 2);
  for (let i = 0; i < n; i++) {
    const p = document.createElement("span"), a = Math.PI * 2 * i / n + rnd(-.2, .2), d = cls ? rnd(60, 140) : rnd(80, 170), sz = rnd(8, 18);
    p.className = "pf" + (cls ? " " + cls : ""); p.style.left = cx + "px"; p.style.top = cy + "px"; p.style.width = p.style.height = sz + "px";
    p.style.setProperty("--h", hue != null ? hue : Math.round(rnd(0, 360)));
    p.style.setProperty("--dx", Math.cos(a) * d + "px"); p.style.setProperty("--dy", Math.sin(a) * d * .7 + "px");
    document.body.appendChild(p); setTimeout(() => p.remove(), 900);
  }
}

/* 15-progress.js — what the player has done, across games, and the daily streak.
   lw-prog = {id: [attempts, lastStatus, time]} (texts and Same message? sentences): status 2 = perfect on the first
   check ("mastered"), 1 = all right on a later check, 0 = some answers still wrong.
   lw-uses = {job: [answers, right]}: first-check accuracy for each job (rules.json "jobs"), from games and quick-fire.
   lw-days = "YYYY-MM-DD|days in a row". */
function getJSON(k) { try { const o = JSON.parse(load(k)); return o && typeof o === "object" ? o : {}; } catch (e) { return {}; } }
function getProg() { return getJSON("lw-prog"); }
function recordProgress(id, status) {
  const p = getProg(), o = p[id] || [0, 0, 0];
  p[id] = [o[0] + 1, status, Date.now()]; store("lw-prog", JSON.stringify(p));
}
// A level's texts (or bonus sentences) in play order: never seen (random), then wrong last time, then not yet perfect, then mastered (oldest first).
// What the last RECENT_GAMES games played (perGame items a game) waits at the back, so a text missed in one game
// doesn't come straight back in the next one (from Conditional Bubbles); it still comes before nothing else is left.
const RECENT_GAMES = 3;
function orderPool(list, perGame) {
  const p = getProg(), time = t => (p[t.id] || [0, 0, 0])[2];
  const n = Math.max(0, Math.min(RECENT_GAMES * (perGame || 0), list.length - (perGame || 0)));
  const recent = new Set(list.filter(t => time(t)).sort((a, b) => time(b) - time(a)).slice(0, n).map(t => t.id));
  const grp = t => { const o = p[t.id]; return (recent.has(t.id) ? 4 : 0) + (!o ? 0 : o[1] === 0 ? 1 : o[1] === 1 ? 2 : 3); };
  return shuffle(list.slice()).sort((a, b) => grp(a) - grp(b) || time(a) - time(b));
}
// Mastered / total texts at a level (the Paired conjunctions paragraphs count as texts).
function mastery(level) {
  const p = getProg(), list = DATA.texts[level].concat(pairTexts(level));
  return { m: list.filter(t => p[t.id] && p[t.id][1] === 2).length, n: list.length };
}
// One level's meter: label, bar, "3 / 5".
function meterHTML(level) {
  const x = mastery(level);
  return '<div class="meter" style="' + lvVars(level) + '"><b>' + esc(lvName(level)) + '</b><div class="pbar"><i style="width:' + (x.m / x.n * 100).toFixed(1) + '%"></i></div><span>' + x.m + " / " + x.n + "</span></div>";
}

/* ---------- Accuracy per job ---------- */
// jobs = each gap's job (rules.json "jobs" key), ok = right on the first check.
function recordUses(jobs, ok) {
  const s = getJSON("lw-uses");
  jobs.forEach((u, i) => { const o = s[u] || [0, 0]; s[u] = [o[0] + 1, o[1] + (ok[i] ? 1 : 0)]; });
  store("lw-uses", JSON.stringify(s));
}
// Chips "Reason 7/8", one per job in stats {job: [n, right]}, weakest first; weak = only the WEAK_MAX weakest under
// WEAK_PCT. Tap one to open the Guide at that job.
const WEAK_MAX = 3, WEAK_PCT = .8;
function usesHTML(stats, weak) {
  let ks = Object.keys(JOBS).filter(k => stats[k] && stats[k][0]);
  ks.sort((a, b) => stats[a][1] / stats[a][0] - stats[b][1] / stats[b][0]);
  if (weak) ks = ks.filter(k => stats[k][1] / stats[k][0] < WEAK_PCT).slice(0, WEAK_MAX);
  return ks.map(k => {
    const s = stats[k], pct = s[1] / s[0];
    return '<button type="button" class="chip usechip' + (pct < .6 ? " weak" : "") + '" data-job="' + k + '" style="--h:' + jobHue(k) + '" title="' + esc(JOBS[k].name + " · " + JOBS[k].namePt) + '">' +
      esc(jobName(k, nativeUi())) + " " + s[1] + "/" + s[0] + "</button>";
  }).join("");
}

/* ---------- Daily streak ---------- */
function dayStr(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dayState() {
  const [d, n] = (load("lw-days") || "|0").split("|"), y = new Date(); y.setDate(y.getDate() - 1);
  return { d, n: +n || 0, today: dayStr(new Date()), yest: dayStr(y) };
}
// Days in a row, counting today or yesterday (the streak is still alive until a day is skipped).
function getDays() { const s = dayState(); return s.d === s.today || s.d === s.yest ? s.n : 0; }
// Called when a text is finished: the first one of the day extends (or restarts) the streak.
function tickDay() {
  const s = dayState(); if (s.d === s.today) return;
  store("lw-days", s.today + "|" + (s.d === s.yest ? s.n + 1 : 1)); showDays();
}
function showDays() { const n = getDays(), el = $("days"); el.hidden = n < 2; el.textContent = "🔥 " + n; el.title = n + " days in a row"; }

/* 16-gloss.js — words with a dotted line in the text show their Portuguese meaning on hover or tap. Meanings come from
   the text's own "w" (src/data/texts/*.json); keys can be several words ("of course") and match in any case.
   A clue (the words that decide) has its meaning in "cw", which only applies inside that clue (so "in" or "how"
   elsewhere in the text gets no dotted line).
   The verb gaps have none (a tap moves them round the cycle). */
const glossEl = document.createElement("div");
glossEl.className = "glosstip"; glossEl.setAttribute("role", "tooltip"); glossEl.hidden = true;
document.body.appendChild(glossEl);
let glossFor = null, glossTimer = 0, lastPointer = "mouse";

// One regex per text for its glossary keys, longest first.
function glossRe(t) {

        t.sx = dx * k * (dx > 0 ? RIGHT : LEFT) * Math.min(r.height, 60);   // capped: a tall bubble's spot keeps its small lean
        t.sy = dy * k * (dy > 0 ? DOWN : UP) * Math.min(r.height, 60);
        const g = GLOW / (d + GLOW); t.sk = held ? Math.max(g * g, DRAG_SK) : g * g;
        d = Math.max(d, 1); t.ux = dx / d; t.uy = dy / d;
      }
      st.t0 = true;
      let changed = false;
      ["sx", "sy", "sk", "ux", "uy"].forEach(p => {
        let v = st[p] + (t[p] - st[p]) * f;
        if (Math.abs(t[p] - v) < (p === "sx" || p === "sy" ? 0.05 : 0.002)) v = t[p]; else moving = true;
        if (v !== st[p]) changed = true;
        st[p] = v;
      });
      if (!changed && st.w) return;
      st.w = true;
      paint(st);
    });
    dirty = false;
    if (moving) more(); else last = 0;
  }
  function ask() { dirty = true; if (!raf) raf = requestAnimationFrame(frame); }
  function more() { if (!raf) raf = requestAnimationFrame(frame); }
  document.addEventListener("pointermove", e => {
    if (document.body.classList.contains("covered")) return;   // the tutorial or a window is open: the spots stay still
    if (root.classList.contains("pf-noshine")) return;   // the ?fps panel's Shine switch (95-perf.js)
    touch = e.pointerType !== "mouse";
    if (touch && !carried()) return;
    px = e.clientX; py = e.clientY; on = true; ask();

  function release(e) { if (e.pointerType !== "mouse") on = false; rcache = null; ask(); }
  document.addEventListener("pointerup", release, true);
  document.addEventListener("pointercancel", release, true);
  document.documentElement.addEventListener("pointerleave", () => { on = false; ask(); });
  window.addEventListener("scroll", () => { rcache = null; if (on) ask(); }, { passive: true });
  window.addEventListener("resize", () => { rcache = null; }, { passive: true });
})();

/* 95-perf.js — a hidden test panel (from Be Do Modal, 2026-11-22): add ?fps to the address (linking-words.html?fps) to see the frame rate and the slow frames, and switch each moving effect off or on (the turning film, the shine, the float, the background bubbles, the frosted glass), to find what makes a phone lag. Nothing at all without ?fps; the switches are not saved. Their CSS: 95-perf.css. */
(function () {
  if (!/[?&#]fps\b/.test(location.search + location.hash)) return;
  var touchDev = !!(window.matchMedia && matchMedia("(hover: none)").matches);
  var SW = [   /* [id, label, on at the start] */
    ["film", "Film turning", !touchDev && !reduceMotion],   /* off on touch screens (14-soap.css): the switch can turn it on there */
    ["shine", "Shine", !reduceMotion],
    ["float", "Float", !reduceMotion],
    ["sky", "Background bubbles", !reduceMotion],
    ["blur", "Frosted glass", true]
  ];
  var box = document.createElement("div"); box.className = "perfbox";
  box.innerHTML = '<b class="pf-fps">… fps</b><span class="pf-slow"></span>' + SW.map(function (s) {
    return '<label><input type="checkbox" data-k="' + s[0] + '"' + (s[2] ? " checked" : "") + "> " + s[1] + "</label>";
  }).join("");
  document.body.appendChild(box);
  box.querySelector(".pf-fps").addEventListener("click", function () { box.classList.toggle("mini"); });   /* a tap on the number folds the switches away (on a phone the panel covers the card) */
  box.addEventListener("change", function (e) {
    var k = e.target.dataset.k, on = e.target.checked;
    if (k === "film") { root.classList.toggle("pf-film-on", on); root.classList.toggle("pf-film-off", !on); }
    else root.classList.toggle("pf-no" + k, !on);
  });
  /* frames in the last second, and frames that took over 25 ms (a missed frame at 60 Hz) in the last 10 s */
  var fpsEl = box.querySelector(".pf-fps"), slowEl = box.querySelector(".pf-slow"), times = [], slow = [], prev = 0, shown = 0;
  function tick(t) {
    if (prev && t - prev > 25 && t - prev < 1000) slow.push(t);
    prev = t; times.push(t);
    while (times[0] < t - 1000) times.shift();
    while (slow.length && slow[0] < t - 10000) slow.shift();
    if (t - shown > 500) { shown = t; fpsEl.textContent = times.length + " fps"; slowEl.textContent = slow.length + " slow frames in 10 s"; }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  document.addEventListener("visibilitychange", function () { prev = 0; times = []; });   /* a hidden page gets no frames: don't count that gap */
})();

/* 99-main.js — boot: restore the saved level and start a game. */
(function boot() {

  if (!load("lw-tour")) {
    tourOpen(true);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(tourPlace);   // the font changes sizes

<script>
(function () {
  var MENU = "../index.html";
  var a = document.createElement("a");
  a.className = "eb-home";
  a.href = MENU;
  a.title = "All games · Todos os jogos";
  a.setAttribute("aria-label", "All games");
  // a simple house (2026-11-22, the user: "more reminiscent of home"; it was four little bubbles)
  a.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<path d="M3.5 11.2 12 4l8.5 7.2"/><path d="M6 9.4V19a1 1 0 0 0 1 1h3.6v-5.2h2.8V20H17a1 1 0 0 0 1-1V9.4"/></svg><span>Games</span>';
  // Back to the menu: if we came from it, go back (so the phone's back button doesn't return here); else open it.
  a.addEventListener("click", function (e) {
    e.preventDefault();
    var from = null;
    try { from = sessionStorage.getItem("eb-from-menu"); sessionStorage.removeItem("eb-from-menu"); } catch (x) {}
    var back = from === "linking-words" && history.length > 1;
    try { sessionStorage.setItem("eb-back", "1"); } catch (x) {}         // the menu skips its entrance animation
    document.documentElement.classList.add("eb-leaving");
    // Safety net (2026-11-24, the user: after reopening the app in a game, Games sometimes left only the background
    // on screen; the swipe-back gesture still worked): the phone can ignore history.back() from a script, so if this
    // page is still here shortly after asking, open the menu directly (replace: Back won't return to the faded game).
    var left = false;
    window.addEventListener("pagehide", function () { left = true; }, { once: true });
    var go = function () {
      if (!back) { location.href = MENU; return; }
      history.back();
      setTimeout(function () { if (!left) location.replace(MENU); }, 800);
    };
    // The menu's "open a game" pop + chime, played through the game's own tone() (so the game's volume and mute
    // apply); then leave once it has been heard.
    if (typeof tone === "function") {
      try { tone(900, 0, .07, .11, 420); tone(783.99, .03, .22, .1, 0, true); tone(1174.66, .07, .3, .07, 0, true); } catch (x) {}
      setTimeout(go, 240);
    } else go();
  });
  // In the game's header (the "dock"). The header must never get an extra row because of this button (phones: at
  // most two rows, the user's rule, 2026-11-17). So every place is tried, in order of preference: before the level
  // pills, right after them, then before / after each control, then inside a group of buttons (Verb Wheel's
  // .tools); the place that gives the shortest header wins (the first one on a tie). If every place still adds a
  // row, "tight" mode narrows the gaps between the header's controls and the button a little, and tries again.
  var dock = document.querySelector("header.dock, .dock");
  var tightened = [];
  function height() { return dock.getBoundingClientRect().height; }
  function spots() {
    var out = [], kids = [], i, c, lv = dock.querySelector(":scope > #levelseg");
    for (i = 0; i < dock.children.length; i++) if (dock.children[i] !== a) kids.push(dock.children[i]);
    if (lv) { out.push([dock, lv]); out.push([dock, lv.nextElementSibling === a ? a.nextElementSibling : lv.nextElementSibling]); }
    for (i = 0; i < kids.length; i++) out.push([dock, kids[i]]);
    out.push([dock, null]);
    for (i = 0; i < kids.length; i++) {
      c = kids[i];
      if (/\b(seg|swwrap|volwrap|lang|sw)\b/.test(c.className) || c.getAttribute("role") === "group") continue;
      var d = getComputedStyle(c).display;
      if ((d === "flex" || d === "inline-flex") && c.querySelectorAll(":scope > button").length >= 2) {
        out.push([c, c.firstElementChild]); out.push([c, null]);
      }
    }
    return out;
  }
  function best() {
    var s = spots(), win = null, h = Infinity, i, hi;
    for (i = 0; i < s.length; i++) {
      if (s[i][1] === a) continue;
      s[i][0].insertBefore(a, s[i][1]);
      hi = height();
      if (hi < h - 2) { h = hi; win = s[i]; }
    }
    win[0].insertBefore(a, win[1]);
    return h;
  }
  function tight(on) {
    tightened.forEach(function (el) { el.classList.remove("eb-tight"); });
    tightened = on ? [dock, a, a.parentNode] : [];
    tightened.forEach(function (el) { el.classList.add("eb-tight"); });
  }
  function place() {
    tight(false);
    var at = a.parentNode ? [a.parentNode, a.nextSibling] : null;
    if (a.parentNode) a.parentNode.removeChild(a);
    var base = height();                                     // the header as the game made it
    if (at) at[0].insertBefore(a, at[1]); else dock.appendChild(a);
    if (best() <= base + 4) return;
    tight(true);
    if (best() <= base + 4) return;
    tight(false); best();                                    // nothing helps: keep the normal look
  }
  if (dock) {
    // the slide-in has ended: the header gets its frosted blur back
    dock.addEventListener("animationend", function (e) { if (e.animationName === "eb-dock-in") document.documentElement.classList.remove("eb-arrive"); });
    setTimeout(function () { document.documentElement.classList.remove("eb-arrive"); }, 1500);   // in case it never ran
    place();
    var t = 0;
    window.addEventListener("resize", function () { clearTimeout(t); t = setTimeout(place, 150); });
    window.addEventListener("load", place);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
  } else { a.classList.add("eb-float"); document.body.appendChild(a); }

  // back here with the phone's Forward (or from the page cache): undo the fade
  window.addEventListener("pageshow", function () { document.documentElement.classList.remove("eb-leaving"); });

  }
})();
