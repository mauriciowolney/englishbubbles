way":"tirar"},"dx":["in-the-end","since-r","whereas"]},{"id":"b2-08","frame":"Email","framePt":"E-mail","title":"Thinking of moving to Canada","titlePt":"Pensando em me mudar para o Canadá","body":["Hi Rafa, big news: I've been offered a job in Toronto! [apart-from/as-well-as/in-addition-to/besides-n] a great salary, the company is offering to pay for my flight. [supposing/if] I accept, could you help me find an apartment? I'd need one [by] the end of July. The winters there are brutal, I know. [still/even-so/nevertheless/however], I think it's an opportunity I can't miss.","Hugs, Nanda"],"pt":["Oi, Rafa, novidade: me ofereceram um emprego em Toronto! Além de um ótimo salário, a empresa está se oferecendo para pagar a minha passagem. Supondo que eu aceite, você pode me ajudar a encontrar um apartamento? Eu precisaria de um até o fim de julho. Os invernos lá são brutais, eu sei. Ainda assim, acho que é uma oportunidade que não posso perder.","Beijos, Nanda"],"w":{"big news":"novidade","salary":"salário","accept":"aceitar","brutal":"brutais","miss":"perder"},"dx":["until-n","in-case","even"]},{"id":"b2-09","frame":"News","framePt":"Notícia","title":"City opens new bike lanes","titlePt":"Cidade abre novas ciclovias","body":["The city opened forty kilometers of new bike lanes last month. [since-then], the number of cyclists has almost doubled. Store owners were worried at first, [as-r/because/since-r] they were afraid of losing parking spaces. [nevertheless/however/nonetheless/even-so/still], many of them now say business is better than ever. The mayor plans to add more lanes next year, [provided/as-long-as] the budget allows it."],"pt":["A cidade abriu quarenta quilômetros de novas ciclovias no mês passado. Desde então, o número de ciclistas quase dobrou. Os lojistas ficaram preocupados no começo, já que tinham medo de perder vagas de estacionamento. Mesmo assim, muitos deles agora dizem que os negócios nunca foram tão bons. O prefeito planeja acrescentar mais ciclovias no ano que vem, contanto que o orçamento permita."],"w":{"bike lanes":"ciclovias","doubled":"dobrou","store owners":"lojistas","parking spaces":"vagas de estacionamento","mayor":"prefeito","budget":"orçamento"},"dx":["although","unless","due-to"]},{"id":"b2-10","frame":"Blog","framePt":"Blog","title":"Lessons from my grandmother","titlePt":"Lições da minha avó","body":["My grandmother never used a recipe. She cooked [as-though/as-if] the food were talking to her. [just-as-s] she knew every plant in her garden, she knew exactly how long every dish needed. She taught me that cooking is about patience. [likewise/similarly/in-the-same-way], she believed that good friendships need time to grow. [whenever] I make her bean stew, I can almost hear her voice."],"pt":["A minha avó nunca usou receita. Ela cozinhava como se a comida conversasse com ela. Assim como conhecia cada planta do jardim, ela sabia exatamente quanto tempo cada prato precisava. Ela me ensinou que cozinhar é questão de paciência. Da mesma forma, ela acreditava que as boas amizades precisam de tempo para crescer. Sempre que faço o feijão dela, quase consigo ouvir a sua voz."],"w":{"recipe":"receita","dish":"prato","patience":"paciência","friendships":"amizades","bean stew":"feijão"},"dx":["unlike","even-if","however"],"notes":[{"en":"In careful English, *as though* (or *as if*) + *were* for something unreal: as though the food *were* talking.","pt":"No inglês mais cuidado, *as though* (ou *as if*) + *were* para algo irreal: as though the food *were* talking."},null,null,null]},{"id":"b2-11","frame":"Letter","framePt":"Carta","title":"Noise at night","titlePt":"Barulho à noite","body":["Dear Sir or Madam, I am writing to complain about the noise from the new bar on Pine Street. Music plays until 3 a.m., [even-though/although/though] the law says bars must be quiet after midnight. [consequently/as-a-result/therefore], my children cannot sleep. I have spoken to the owner several times. [however/nevertheless/even-so/still], nothing has changed. [unless] the city council takes action soon, I will contact the local newspaper.","Yours faithfully, Helena Costa"],"pt":["Prezados senhores, escrevo para reclamar do barulho do bar novo da Pine Street. A música toca até as 3h, embora a lei diga que os bares devem fazer silêncio depois da meia-noite. Consequentemente, os meus filhos não conseguem dormir. Já falei com o dono várias vezes. No entanto, nada mudou. A menos que a prefeitura tome uma providência logo, vou procurar o jornal local.","Atenciosamente, Helena Costa"],"w":{"complain":"reclamar","law":"lei","midnight":"meia-noite","owner":"dono","city council":"prefeitura","takes action":"tome uma providência"},"dx":["despite","if","eventually"]},{"id":"b2-12","frame":"Story","framePt":"História","title":"An honest stranger","titlePt":"Um estranho honesto","body":["Last summer I lost my wallet on a crowded beach in Florianópolis. I had looked everywhere [by-the-time] the sun went down. [just-as-t] I was about to give up, a teenager came running toward me with it in his hand. [without] his help, I would have lost all my documents. I offered him some money, [but] he refused. [instead], he asked me to buy him an ice cream!"],"pt":["No verão passado, perdi a minha carteira numa praia lotada em Florianópolis. Eu já tinha procurado em todo lugar quando o sol se pôs. Bem quando eu estava quase desistindo, um adolescente veio correndo na minha direção com ela na mão. Sem a ajuda dele, eu teria perdido todos os meus documentos. Ofereci um dinheiro a ele, mas ele recusou. Em vez disso, pediu que eu comprasse um sorvete para ele!"],"w":{"wallet":"carteira","crowded":"lotada","went down":"se pôs","give up":"desistir","toward":"em direção a","refused":"recusou"},"dx":["instead-of","despite","during"]},{"id":"b2-13","frame":"Essay","framePt":"Redação","title":"Should university be free?","titlePt":"A universidade deveria ser gratuita?","body":["Free university education sounds like a great idea, and countries such as Germany have offered it for years. [nevertheless/nonetheless/however/even-so/still], someone has to pay for it, and that someone is the taxpayer. Critics also point out that free tuition mainly helps middle-class families, [whereas/while-d] poorer students still struggle to pay for rent and food. [thus/therefore/consequently/as-a-result], many experts prefer grants for low-income students.","[in-conclusion/to-sum-up/overall], free tuition is a good start, but it is not enough on its own."],"pt":["A universidade gratuita parece uma ótima ideia, e países como a Alemanha a oferecem há anos. Mesmo assim, alguém tem que pagar por ela, e esse alguém é o contribuinte. Os críticos também apontam que o ensino gratuito ajuda principalmente as famílias de classe média, ao passo que os alunos mais pobres ainda têm dificuldade para pagar aluguel e comida. Assim, muitos especialistas preferem bolsas para alunos de baixa renda.","Concluindo, o ensino gratuito é um bom começo, mas não basta sozinho."],"w":{"taxpayer":"contribuinte","tuition":"mensalidade","struggle":"têm dificuldade","grants":"bolsas","low-income":"de baixa renda","on its own":"sozinho"},"dx":["despite","unlike","at-the-end"]},{"id":"b2-14","frame":"Article","framePt":"Artigo","title":"The four-day week","titlePt":"A semana de quatro dias","body":["Several companies in the UK have tested a four-day working week, with surprising results. Productivity stayed the same, [owing-to/due-to/thanks-to] lower stress and fewer sick days. [furthermore/moreover/in-addition/besides-x/whats-more/plus/also], staff turnover fell sharply. The model works best in offices. [conversely/by-contrast/in-contrast/on-the-other-hand], hospitals and schools find it much harder to adapt. Most experts agree it can succeed, [provided/as-long-as/only-if] workloads are reorganized rather than simply squeezed into fewer days."],"pt":["Várias empresas no Reino Unido testaram a semana de quatro dias de trabalho, com resultados surpreendentes. A produtividade continuou a mesma, graças a menos estresse e menos faltas por doença. Além disso, a rotatividade de funcionários caiu bastante. O modelo funciona melhor em escritórios. Por outro lado, hospitais e escolas têm muito mais dificuldade de se adaptar. A maioria dos especialistas concorda que ele pode dar certo, desde que a carga de trabalho seja reorganizada, e não simplesmente espremida em menos dias."],"w":{"productivity":"produtividade","sick days":"faltas por doença","staff turnover":"rotatividade de funcionários","sharply":"bastante","workloads":"cargas de trabalho","squeezed":"espremidas"},"dx":["because","unless","whereas"]},{"id":"b2-15","frame":"Story","framePt":"História","title":"The pitch","titlePt":"A apresentação","body":["I knew the meeting would not go well the moment I walked into the room. The investor barely looked up from her laptop and spoke to me [as-though/as-if] I were wasting her time. [as-t/while-t] the questions went on, I grew more and more nervous. Then her phone rang, and she took the call. [eventually/finally/in-the-end], she hung up and said, 'Sorry, where were we?' [much-as/although/even-though/though] I disliked her, I said yes when she offered to invest in our app."],"pt":["Eu soube que a reunião não ia bem no momento em que entrei na sala. A investidora mal tirava os olhos do notebook e falava comigo como se eu estivesse fazendo ela perder tempo. À medida que as perguntas continuavam, eu ficava cada vez mais nervoso. Então o telefone dela tocou e ela atendeu. Finalmente, ela desligou e disse: 'Desculpe, onde a gente estava?' Por mais que eu não tivesse gostado dela, aceitei quando ela se ofereceu para investir no nosso aplicativo."],"w":{"investor":"investidora","barely":"mal","laptop":"notebook","grew":"fui ficando","took the call":"atendeu","hung up":"desligou","disliked":"não gostei de"},"dx":["despite","at-the-end","during"],"notes":[null,null,{"en":"*Eventually* = finally, after a long time. Portuguese *eventualmente* (sometimes) is *occasionally*.","pt":"*Eventually* = finalmente, depois de muito tempo. *Eventualmente* (às vezes) é *occasionally*."}]},{"id":"b2-16","frame":"Email","framePt":"E-mail","title":"Third-floor renovation","titlePt":"Reforma do terceiro andar","body":["Dear all, The third-floor offices will be closed for renovation from March 4th to 29th. [until-then], everything will work as usual. During the works, you can use the meeting rooms on the second floor. [alternatively], you may work from home, [provided/as-long-as] your manager agrees. Please clear your desks by March 1st [so-as-to/in-order-to/to] allow the builders to start on time. [lastly/finally], remember that parking will be limited throughout March.","Thank you for your patience, The Facilities Team"],"pt":["Prezados, os escritórios do terceiro andar ficarão fechados para reforma de 4 a 29 de março. Até lá, tudo funcionará normalmente. Durante as obras, vocês podem usar as salas de reunião do segundo andar. Outra opção é trabalhar de casa, desde que o seu gestor concorde. Por favor, desocupem as mesas até 1º de março, de modo a permitir que os pedreiros comecem no prazo. Por último, lembrem-se de que o estacionamento será limitado durante todo o mês de março.","Obrigado pela paciência, Equipe de Manutenção"],"w":{"renovation":"reforma","works":"obras","clear your desks":"desocupem as mesas","builders":"pedreiros","on time":"no prazo","throughout":"durante todo"},"dx":["unless","for-n","whereas"],"notes":[{"en":"*Until then* = até lá: the time before the change starts.","pt":"*Until then* = até lá: o tempo antes da mudança começar."}]},{"id":"b2-17","frame":"Opinion","framePt":"Opinião","title":"Too young for social media?","titlePt":"Jovem demais para as redes sociais?","body":["[much-as/although/even-though/though] I love technology, I believe young teenagers should not have social media accounts. Studies link heavy use to anxiety and poor sleep. [consequently/as-a-result/therefore/thus], several countries are now considering age limits. Critics say a ban would be impossible to enforce. That may be true, but laws also send a message. [after-all], we don't let thirteen-year-olds drive, [even-if] their parents agree."],"pt":["Por mais que eu adore tecnologia, acredito que adolescentes mais novos não deveriam ter contas em redes sociais. Estudos relacionam o uso intenso à ansiedade e ao sono ruim. Consequentemente, vários países estão considerando limites de idade. Os críticos dizem que uma proibição seria impossível de fiscalizar. Pode ser verdade, mas as leis também passam uma mensagem. Afinal, não deixamos jovens de treze anos dirigir, mesmo que os pais concordem."],"w":{"accounts":"contas","heavy use":"uso intenso","anxiety":"ansiedade","ban":"proibição","enforce":"fiscalizar"},"dx":["despite","eventually","even"],"notes":[null,null,{"en":"*After all* = afinal: a reason everyone should remember. It doesn't mean *depois de tudo*.","pt":"*After all* = afinal: um motivo que todo mundo deveria lembrar. Não quer dizer *depois de tudo*."}]},{"id":"b2-18","frame":"News","framePt":"Notícia","title":"Museum reopens","titlePt":"Museu reabre","body":["After three years of restoration, the City History Museum reopens to the public this Saturday. [now-that] the roof has been repaired, the museum can finally display its famous dinosaur skeletons again. Entry will be free during the opening week. [likewise/similarly/in-the-same-way], the museum café will offer half-price drinks. Visitors should book online [owing-to/due-to/because-of] the expected crowds. [as-opposed-to/unlike] the old museum, the new building is fully accessible to wheelchair users."],"pt":["Depois de três anos de restauração, o Museu de História da Cidade reabre ao público neste sábado. Agora que o telhado foi consertado, o museu pode finalmente expor de novo os seus famosos esqueletos de dinossauro. A entrada será gratuita durante a semana de inauguração. Da mesma forma, o café do museu vai oferecer bebidas pela metade do preço. Os visitantes devem reservar online devido à multidão esperada. Ao contrário do antigo museu, o novo prédio é totalmente acessível para cadeirantes."],"w":{"restoration":"restauração","roof":"telhado","skeletons":"esqueletos","half-price":"pela metade do preço","crowds":"multidão","wheelchair users":"cadeirantes"},"dx":["whereas","despite","by-contrast"]},{"id":"b2-19","frame":"Blog","framePt":"Blog","title":"Two suitcases","titlePt":"Duas malas","body":["A year ago, I gave away almost everything I owned. [apart-from/besides-n] a few books and some family photos, all my things now fit in two suitcases. Owning lots of stuff used to make me anxious. [conversely/by-contrast/on-the-other-hand], owning less has made me surprisingly calm. I also spend far less money. [thus/consequently/therefore/as-a-result], I have been able to cut my working week to four days. [to-sum-up/in-conclusion/overall], I have never felt richer."],"pt":["Há um ano, doei quase tudo o que eu tinha. Tirando alguns livros e umas fotos de família, todas as minhas coisas agora cabem em duas malas. Ter muitas coisas me deixava ansioso. Inversamente, ter menos me deixou surpreendentemente calmo. Também gasto muito menos dinheiro. Assim, consegui reduzir a minha semana de trabalho para quatro dias. Resumindo, nunca me senti tão rico."],"w":{"gave away":"doei","owned":"tinha","suitcases":"malas","stuff":"coisas","anxious":"ansioso","cut":"reduzir"},"dx":["whereas","at-the-end","despite"]},{"id":"b2-20","frame":"Email","framePt":"E-mail","title":"Re: the cabin","titlePt":"Re: o chalé","body":["Hi Tom, Thanks for booking the cabin! Just a few questions. [supposing] it rains all weekend, is there anything to do nearby? Also, are dogs allowed? [if-so/in-that-case], I'd love to bring Biscuit. I'm happy to drive, [provided/as-long-as] someone else reads the map. I always get lost! We should leave early on Friday. [otherwise], we'll hit the rush-hour traffic.","See you soon, Priya"],"pt":["Oi, Tom, obrigada por reservar o chalé! Só umas perguntas. Supondo que chova o fim de semana todo, tem alguma coisa para fazer por perto? Além disso, pode levar cachorro? Se puder, eu adoraria levar o Biscuit. Posso dirigir, contanto que outra pessoa leia o mapa. Eu sempre me perco! A gente deveria sair cedo na sexta. Senão, vamos pegar o trânsito da hora do rush.","Até logo, Priya"],"w":{"cabin":"chalé","nearby":"por perto","allowed":"permitidos","get lost":"me perco","rush-hour traffic":"trânsito da hora do rush"},"dx":["unless","even-if","instead"]},{"id":"b2-21","frame":"Article","framePt":"Artigo","title":"How habits grow","titlePt":"Como os hábitos crescem","body":["[just-as-s/as-s] a muscle grows stronger with exercise, a habit grows stronger every time we repeat it. That is why the first few weeks are the hardest. [without] a clear trigger, like finishing breakfast, a new habit rarely lasts. Experts suggest linking new habits to old ones [so-as-to/in-order-to/to] make them automatic. [moreover/furthermore/in-addition/also/besides-x/whats-more/plus], small rewards, such as a piece of chocolate, can help a lot."],"pt":["Assim como um músculo fica mais forte com exercício, um hábito fica mais forte cada vez que o repetimos. É por isso que as primeiras semanas são as mais difíceis. Sem um gatilho claro, como terminar o café da manhã, um novo hábito raramente dura. Especialistas sugerem ligar hábitos novos a hábitos antigos de modo a torná-los automáticos. Além disso, pequenas recompensas, como um pedaço de chocolate, podem ajudar muito."],"w":{"muscle":"músculo","trigger":"gatilho","lasts":"dura","linking":"ligar","rewards":"recompensas"},"dx":["unless","as-though","for-n"]},{"id":"b2-22","frame":"Letter","framePt":"Carta","title":"Seven hours late","titlePt":"Sete horas de atraso","body":["Dear Sir or Madam, I am writing regarding flight AT215 from Madrid to Boston on May 12th, which was delayed by seven hours. [despite/in-spite-of] repeated requests, your staff gave passengers no information about the cause. [consequently/as-a-result/therefore/thus], I missed an important business meeting. [moreover/furthermore/in-addition/besides-x/also/whats-more], the meal vouchers we received were only valid at one café, which closed at 9 p.m. Under EU rules, I am entitled to €600 in compensation. I will take further action [unless] I hear from you within 14 days.","Sincerely, Daniel Ruiz"],"pt":["Prezados, escrevo a respeito do voo AT215 de Madri para Boston, no dia 12 de maio, que atrasou sete horas. Apesar de pedidos repetidos, os seus funcionários não deram aos passageiros nenhuma informação sobre o motivo. Consequentemente, perdi uma reunião de negócios importante. Além disso, os vales-refeição que recebemos só valiam em um café, que fechava às 21h. De acordo com as normas da UE, tenho direito a 600 euros de indenização. Tomarei outras medidas, a menos que receba uma resposta em 14 dias.","Atenciosamente, Daniel Ruiz"],"w":{"regarding":"a respeito de","requests":"pedidos","meal vouchers":"vales-refeição","valid":"válidos","entitled to":"tenho direito a","compensation":"indenização","further action":"outras medidas"},"dx":["although","nevertheless","provided"]},{"id":"b2-23","frame":"Story","framePt":"História","title":"The best part of the wedding","titlePt":"A melhor parte do casamento","body":["[just-as-t] the bride and groom were about to cut the cake, all the lights went out. For a moment, nobody moved. Then the waiters brought candles from the kitchen. [meanwhile/in-the-meantime], the band carried on playing with acoustic guitars, and people started dancing in the dark. [by-the-time] the power came back two hours later, nobody really cared. [indeed/in-fact/actually], the couple now say it was the best part of their wedding."],"pt":["Bem quando os noivos iam cortar o bolo, todas as luzes se apagaram. Por um momento, ninguém se mexeu. Então os garçons trouxeram velas da cozinha. Enquanto isso, a banda continuou tocando com violões, e as pessoas começaram a dançar no escuro. Quando a luz voltou, duas horas depois, ninguém ligava mais. Na verdade, os noivos hoje dizem que foi a melhor parte do casamento."],"w":{"bride and groom":"noivos","went out":"se apagaram","waiters":"garçons","candles":"velas","carried on":"continuou","power":"energia; luz"},"dx":["during","at-the-end","despite"]},{"id":"b2-24","frame":"Article","framePt":"Artigo","title":"Are electric cars really green?","titlePt":"Os carros elétricos são mesmo verdes?","body":["Electric cars produce no exhaust fumes, and they are cheaper to run than gas cars. [nevertheless/nonetheless/however/even-so/still], they are not as green as they seem. Building their batteries requires huge amounts of energy and rare metals. [furthermore/moreover/in-addition/besides-x/also/whats-more/plus], in countries that still burn coal, charging them can produce almost as much CO2 as driving a normal car.","[in-conclusion/to-sum-up/overall], electric cars can help, but [only-if] the electricity comes from clean sources."],"pt":["Os carros elétricos não soltam gases de escapamento e são mais baratos de manter do que os carros a gasolina. Mesmo assim, eles não são tão verdes quanto parecem. Fabricar as baterias exige uma quantidade enorme de energia e de metais raros. Além disso, em países que ainda queimam carvão, carregá-los pode produzir quase tanto CO2 quanto dirigir um carro comum.","Concluindo, os carros elétricos podem ajudar, mas só se a eletricidade vier de fontes limpas."],"w":{"exhaust fumes":"gases de escapamento","cheaper to run":"mais baratos de manter","batteries":"baterias","rare metals":"metais raros","coal":"carvão","charging":"carregar"},"dx":["although","unless","at-the-end"]},{"id":"b2-25","frame":"Forum post","framePt":"Post de fórum","title":"A gap year?","titlePt":"Um ano sabático?","body":["I've just finished high school, and I'm thinking of taking a gap year [so-as-to/in-order-to/to] work and travel around South America. My parents are worried that [once/if] I stop studying, I'll never go back. [by-contrast/in-contrast/on-the-other-hand], my older sister took a year off and came back far more motivated. [alternatively], I could start college now and travel in the summer. [after-all], I'm only eighteen. What would you do?"],"pt":["Acabei de terminar o ensino médio e estou pensando em tirar um ano sabático de modo a trabalhar e viajar pela América do Sul. Os meus pais têm medo de que, depois que eu parar de estudar, nunca mais volte. Em contrapartida, a minha irmã mais velha tirou um ano de folga e voltou muito mais motivada. Outra opção seria começar a faculdade agora e viajar nas férias. Afinal, eu só tenho dezoito anos. O que vocês fariam?"],"w":{"gap year":"ano sabático","worried":"preocupados","year off":"ano de folga","motivated":"motivada","college":"faculdade"},"dx":["for-n","since-r","whereas"],"notes":[null,{"en":"*Once* = assim que, depois que. Portuguese *uma vez que* gives a reason: *since*.","pt":"*Once* = assim que, depois que. *Uma vez que* em português dá uma causa: *since*."}]},{"id":"b2-26","frame":"Review","framePt":"Avaliação","title":"A disappointing sequel","titlePt":"Uma continuação decepcionante","body":["[much-as/although/even-though/though] I loved the first film, I left the movie theater disappointed. The original had a clever plot and real tension, [whereas/while-d] the sequel relies almost entirely on special effects. [apart-from/besides-n] a brilliant five-minute chase scene, nothing really happens. The actors say their lines [as-though/as-if] they were reading them for the first time. [to-sum-up/in-conclusion/overall], wait until it's free to stream."],"pt":["Por mais que eu tenha adorado o primeiro filme, saí do cinema decepcionado. O original tinha um enredo inteligente e tensão de verdade, ao passo que a continuação depende quase só de efeitos especiais. Tirando uma perseguição brilhante de cinco minutos, nada acontece de fato. Os atores dizem as falas como se estivessem lendo pela primeira vez. Resumindo, espere até estar de graça no streaming."],"w":{"plot":"enredo","tension":"tensão","sequel":"continuação","relies":"depende","chase scene":"cena de perseguição","lines":"falas","stream":"assistir por streaming"},"dx":["unlike","at-the-end","even"]},{"id":"b2-27","frame":"News","framePt":"Notícia","title":"Red alert for heat","titlePt":"Alerta vermelho de calor","body":["Authorities have issued a red alert, as temperatures are expected to reach 109°F this weekend. Outdoor events have been canceled, and parks will close at noon [so-as-to/in-order-to/to] protect visitors. Forecasters say the heat should ease on Tuesday. [until-then], residents are advised to stay indoors between 11 a.m. and 5 p.m. Hospitals have reported a sharp rise in cases of heatstroke. [consequently/as-a-result/therefore/thus], extra staff have been called in. People are urged to call 911 [the-moment/as-soon-as] they notice symptoms such as confusion or dizziness."],"pt":["As autoridades emitiram um alerta vermelho, já que as temperaturas devem chegar a 43 °C neste fim de semana. Eventos ao ar livre foram cancelados, e os parques vão fechar ao meio-dia de modo a proteger os visitantes. Os meteorologistas dizem que o calor deve diminuir na terça-feira. Até lá, recomenda-se que os moradores fiquem em casa entre 11h e 17h. Os hospitais relataram um forte aumento de casos de insolação. Consequentemente, mais funcionários foram chamados. Pede-se que as pessoas liguem para a emergência assim que notarem sintomas como confusão ou tontura."],"w":{"issued":"emitiram","forecasters":"meteorologistas","ease":"diminuir","residents":"moradores","heatstroke":"insolação","urged":"pede-se","dizziness":"tontura"},"dx":["for-n","while-t","during"]},{"id":"b2-28","frame":"Blog","framePt":"Blog","title":"Advice for new teachers","titlePt":"Conselhos para professores novos","body":["Here is the advice I wish someone had given me in my first year of teaching. First, learn your students' names as quickly as you can: [without] that, you can't build real relationships. Second, ask questions [rather-than/instead-of] giving answers all the time. Students remember what they discover for themselves. [lastly/finally], look after yourself. Tired teachers are rarely patient ones. [likewise/similarly/in-the-same-way], stressed teachers tend to have stressed students."],"pt":["Este é o conselho que eu queria que alguém tivesse me dado no meu primeiro ano como professor. Primeiro, aprenda o nome dos alunos o mais rápido possível: sem isso, não dá para construir relações de verdade. Segundo, faça perguntas em vez de dar respostas o tempo todo. Os alunos lembram do que descobrem sozinhos. Por último, cuide de si mesmo. Professores cansados raramente são pacientes. Da mesma forma, professores estressados costumam ter alunos estressados."],"w":{"relationships":"relações","discover":"descobrem","look after yourself":"cuide de si mesmo","patient":"pacientes","tend to":"costumam"},"dx":["unless","instead","eventually"],"notes":[null,null,{"en":"*Lastly* = por último, the last point of a list. *At last* = enfim, after a long wait.","pt":"*Lastly* = por último, o último item de uma lista. *At last* = enfim, depois de uma longa espera."}]},{"id":"b2-29","frame":"Essay","framePt":"Redação","title":"Car-free city centers","titlePt":"Centros sem carros","body":["Many European cities have closed their historic centers to cars in recent years. Supporters say the air becomes cleaner and the streets safer. [indeed/in-fact], pollution in central Madrid fell sharply after its ban began. [nonetheless/nevertheless/however/even-so/still], shop owners often fear they will lose customers who arrive by car. [supposing/if] our city tried the same, would local businesses survive? The evidence suggests they would, but [only-if/provided/as-long-as] public transport is cheap and reliable."],"pt":["Muitas cidades europeias fecharam seus centros históricos para carros nos últimos anos. Os defensores dizem que o ar fica mais limpo e as ruas, mais seguras. De fato, a poluição no centro de Madri caiu bastante depois que a proibição começou. Ainda assim, os lojistas muitas vezes temem perder os clientes que chegam de carro. Supondo que a nossa cidade fizesse o mesmo, o comércio local sobreviveria? As evidências sugerem que sim, mas só se o transporte público for barato e confiável."],"w":{"supporters":"defensores","fell sharply":"caiu bastante","ban":"proibição","shop owners":"lojistas","survive":"sobreviver","reliable":"confiável"},"dx":["despite","unless","whereas"]},{"id":"b2-30","frame":"Story","framePt":"História","title":"It's a girl!","titlePt":"É menina!","body":["[as-t/while-t/just-as-t] Leo was locking his front door, he heard his phone ringing inside. It was the hospital: his sister had gone into labor, three weeks early. He drove across the city [as-though/as-if] he were in a race. When he arrived, a nurse stopped him at the door. 'The baby is on its way. [in-the-meantime/meanwhile/until-then], you can call your parents.' Leo waited for what felt like hours. [eventually/in-the-end/finally], a smiling doctor came out and said, 'It's a girl!'"],"pt":["Quando o Leo estava trancando a porta de casa, ouviu o celular tocando lá dentro. Era o hospital: a irmã dele tinha entrado em trabalho de parto, três semanas antes do previsto. Ele atravessou a cidade de carro como se estivesse numa corrida. Quando chegou, uma enfermeira o parou na porta. 'O bebê está chegando. Enquanto isso, você pode ligar para os seus pais.' O Leo esperou pelo que pareceram horas. Por fim, uma médica sorridente saiu e disse: 'É menina!'"],"w":{"locking":"trancando","gone into labor":"entrado em trabalho de parto","nurse":"enfermeira","on its way":"chegando","smiling":"sorridente"},"dx":["during","at-the-end","after-all"],"notes":[null,null,null,{"en":"*Eventually* = in the end, after a long time. It never means *eventualmente* (now and then).","pt":"*Eventually* = por fim, depois de muito tempo. Nunca significa *eventualmente* (de vez em quando)."}]},{"id":"b2-31","frame":"Article","framePt":"Artigo","title":"Morning people and night owls","titlePt":"Matutinos e notívagos","body":["Some people do their best work early in the morning. [conversely/by-contrast/in-contrast/on-the-other-hand], others only really wake up after dark. Scientists believe this is mostly genetic, [as-opposed-to/rather-than] a question of discipline. Most schools and offices, however, are designed for early risers. [thus/consequently/as-a-result/therefore], night owls often spend their days tired. [now-that/since-r] more people work from home, though, many of them can finally sleep in."],"pt":["Algumas pessoas rendem mais logo cedo. Outras, ao contrário, só acordam de verdade depois que escurece. Os cientistas acreditam que isso é sobretudo genético, e não uma questão de disciplina. A maioria das escolas e dos escritórios, porém, é pensada para quem acorda cedo. Assim, os notívagos costumam passar o dia cansados. Agora que mais gente trabalha de casa, no entanto, muitos deles finalmente podem dormir até mais tarde."],"w":{"genetic":"genético","discipline":"disciplina","early risers":"quem acorda cedo","night owls":"notívagos","sleep in":"dormir até mais tarde"},"dx":["unlike","whereas","even"]},{"id":"b2-32","frame":"Email","framePt":"E-mail","title":"Re: your order","titlePt":"Re: o seu pedido","body":["Dear Ms. Patel, thank you for your email, and I'm very sorry that your lamp arrived damaged. [owing-to/due-to/because-of] a problem with one of our delivery partners, several orders were affected last week. Here is what we can offer. First, we will send you a new lamp as soon as it is back in stock, on May 12. [until-then/in-the-meantime/meanwhile], you can use the code SORRY15 for 15% off anything in our store. Second, would you prefer a full refund? [if-so], just reply to this email. [lastly/finally], there is no need to return the damaged lamp: please keep it or recycle it.","Kind regards, Daniel Moore, Customer Care"],"pt":["Prezada Sra. Patel, obrigado pelo seu e-mail, e sinto muito que a sua luminária tenha chegado danificada. Devido a um problema com uma de nossas transportadoras parceiras, vários pedidos foram afetados na semana passada. Veja o que podemos oferecer. Primeiro, vamos enviar uma luminária nova assim que ela voltar ao estoque, no dia 12 de maio. Até lá, a senhora pode usar o código SORRY15 para ter 15% de desconto em qualquer produto da loja. Segundo, a senhora prefere o reembolso total? Se sim, é só responder a este e-mail. Por último, não é preciso devolver a luminária danificada: pode ficar com ela ou reciclá-la.","Atenciosamente, Daniel Moore, Atendimento ao Cliente"],"w":{"damaged":"danificada","delivery partners":"transportadoras parceiras","back in stock":"de volta ao estoque","refund":"reembolso","recycle":"reciclar"},"dx":["if-not","at-the-end","despite"]},{"id":"b2-33","frame":"Opinion","framePt":"Opinião","title":"In praise of boredom","titlePt":"Elogio ao tédio","body":["[much-as/although/though/even-though] I love my phone, I've started leaving it at home when I go for a walk. Boredom, it turns out, is good for us. [just-as-s] our bodies need rest after exercise, our minds need time to wander. That is often when new ideas appear. [likewise/similarly/in-the-same-way], children who are allowed to get bored tend to become more creative. So next time you're waiting in line, don't reach for your phone. [after-all], some of history's greatest ideas came from people staring out of windows."],"pt":["Por mais que eu ame o meu celular, comecei a deixá-lo em casa quando saio para caminhar. O tédio, ao que parece, faz bem para nós. Assim como o corpo precisa de descanso depois do exercício, a mente precisa de tempo para divagar. Muitas vezes é aí que surgem as ideias novas. Da mesma forma, crianças que podem ficar entediadas costumam ser mais criativas. Então, da próxima vez que estiver numa fila, não pegue o celular. Afinal, algumas das maiores ideias da história vieram de pessoas olhando pela janela."],"w":{"boredom":"tédio","it turns out":"ao que parece","wander":"divagar","reach for":"pegar","staring":"olhando fixamente"},"dx":["despite","whereas","eventually"]},{"id":"b2-34","frame":"News","framePt":"Notícia","title":"Seventy years late","titlePt":"Setenta anos de atraso","body":["A copy of Treasure Island borrowed from a small library in Maine in 1954 was returned last week, seventy years late. The borrower's daughter found it in her late father's attic. [apart-from] a few yellowed pages, the book is in perfect condition. [the-moment/as-soon-as] she saw the library stamp, she knew she had to take it back. The fine would now be over $500. [nonetheless/nevertheless/however/even-so/still], the library has decided not to charge her. [indeed/in-fact], staff were delighted: the book will now go on display near the entrance."],"pt":["Um exemplar de A Ilha do Tesouro emprestado por uma pequena biblioteca do Maine em 1954 foi devolvido na semana passada, com setenta anos de atraso. A filha do leitor encontrou o livro no sótão do pai, já falecido. Tirando algumas páginas amareladas, o livro está em perfeito estado. No instante em que viu o carimbo da biblioteca, ela soube que precisava devolvê-lo. Hoje a multa passaria de 500 dólares. Mesmo assim, a biblioteca decidiu não cobrar nada. Na verdade, os funcionários ficaram encantados: o livro agora vai ficar exposto perto da entrada."],"w":{"borrowed":"emprestado","attic":"sótão","yellowed":"amareladas","stamp":"carimbo","fine":"multa","charge":"cobrar"},"dx":["as-opposed-to","eventually","even"]},{"id":"b2-35","frame":"Blog","framePt":"Blog","title":"A year without social media","titlePt":"Um ano sem redes sociais","body":["Last January, I deleted every social media app from my phone. The first few weeks were strange: I kept picking up my phone [the-moment/whenever/as-soon-as] I felt bored. Slowly, though, things changed. I now sleep better, and I've read more books this year than in the previous five. [moreover/furthermore/in-addition/whats-more/plus/also], I actually call my friends now [rather-than/instead-of] just liking their photos. Do I miss anything? Birthday reminders, mostly. [nonetheless/nevertheless/still/even-so/however], I'm not going back."],"pt":["Em janeiro passado, apaguei todos os aplicativos de redes sociais do celular. As primeiras semanas foram estranhas: eu pegava o celular no instante em que ficava entediado. Aos poucos, porém, as coisas mudaram. Hoje durmo melhor e li mais livros este ano do que nos cinco anteriores. Além disso, agora eu ligo de verdade para os meus amigos em vez de só curtir as fotos deles. Se sinto falta de alguma coisa? Dos lembretes de aniversário, principalmente. Mesmo assim, não vou voltar."],"w":{"deleted":"apaguei","picking up":"pegando","slowly":"aos poucos","previous":"anteriores","reminders":"lembretes"},"dx":["instead","despite","during"]},{"id":"b2-36","frame":"Story","framePt":"História","title":"The wrong door","titlePt":"A porta errada","body":["[just-as-t/as-t] Ana was about to fall asleep, she heard someone trying to open her front door. She froze. [supposing/if] it was a burglar, what should she do? She grabbed her phone and called the police. [in-the-meantime/meanwhile], the noise went on. When the officers arrived, they found her upstairs neighbor, completely confused: he had come home late and tried the wrong door. [after-all], every door in the building looks exactly the same."],"pt":["Bem quando a Ana estava quase pegando no sono, ouviu alguém tentando abrir a porta da frente. Ela congelou. E se fosse um ladrão, o que ela deveria fazer? Pegou o celular e ligou para a polícia. Enquanto isso, o barulho continuava. Quando os policiais chegaram, encontraram o vizinho de cima, totalmente confuso: ele tinha chegado tarde e tentado abrir a porta errada. Afinal, todas as portas do prédio são exatamente iguais."],"w":{"froze":"congelou","burglar":"ladrão","grabbed":"pegou","upstairs neighbor":"vizinho de cima","confused":"confuso"},"dx":["unless","as-though","eventually"]},{"id":"b2-37","frame":"Review","framePt":"Avaliação","title":"The Nova 9","titlePt":"O Nova 9","body":["The Nova 9 is an excellent phone, [provided/as-long-as] you don't care much about photos. The screen is bright and sharp, and the battery easily lasts two days. [furthermore/moreover/in-addition/whats-more/plus/also], it charges fully in under half an hour. [by-contrast/in-contrast/on-the-other-hand/however], the camera is a real disappointment: night shots are dark and blurry. Its main rival, the Zeta X, takes far better pictures, [whereas/while-d/but] its battery barely lasts a day."],"pt":["O Nova 9 é um ótimo celular, desde que você não ligue muito para fotos. A tela é clara e nítida, e a bateria dura dois dias com folga. Além disso, ele carrega por completo em menos de meia hora. Em contrapartida, a câmera é uma grande decepção: as fotos noturnas saem escuras e borradas. O principal concorrente, o Zeta X, tira fotos muito melhores, ao passo que a bateria dele mal dura um dia."],"w":{"sharp":"nítida","lasts":"dura","disappointment":"decepção","blurry":"borradas","rival":"concorrente","barely":"mal"},"dx":["unlike","unless","despite"],"notes":[{"en":"*Provided* = only if (desde que). Portuguese *desde que* as a condition is never *since*.","pt":"*Provided* = desde que (condição). O *desde que* de condição nunca é *since*."},null,null,null]},{"id":"b2-38","frame":"Email","framePt":"E-mail","title":"Re: team retreat","titlePt":"Re: retiro da equipe","body":["Hi everyone, a quick update on next month's team retreat. Unfortunately, the hotel has canceled our booking [owing-to/due-to/because-of] flood damage. We now have two options. We can move the retreat to a lake house in Ridgeview on the same dates, though it's a bit smaller. [alternatively], we can stay with the original hotel and push everything back to June. Please vote by Friday. [in-the-meantime/meanwhile/until-then], don't book any trains or flights. My vote? The lake house. [much-as/although/though/even-though] I love that hotel, June is our busiest month.","Best, Priya"],"pt":["Oi, pessoal, uma atualização rápida sobre o retiro da equipe no mês que vem. Infelizmente, o hotel cancelou a nossa reserva por causa de danos causados por uma enchente. Agora temos duas opções. Podemos levar o retiro para uma casa no lago em Ridgeview nas mesmas datas, embora ela seja um pouco menor. Outra opção é ficar com o hotel original e adiar tudo para junho. Por favor, votem até sexta. Enquanto isso, não comprem passagens de trem nem de avião. Meu voto? A casa do lago. Por mais que eu adore aquele hotel, junho é o nosso mês mais corrido.","Abraço, Priya"],"w":{"retreat":"retiro","booking":"reserva","flood damage":"danos de enchente","push everything back":"adiar tudo","busiest":"mais corrido"},"dx":["despite","rather-than","conversely"]}]},"pairs":{"pairs":[{"id":"both-and","a":"both","b":"and","lv":"A2","job":"add","pt":"tanto… quanto; tanto… como","say":"two things, and the sentence is true for both","sayPt":"duas coisas, e a frase vale para as duas","eg":"Both Ana and Leo play the guitar.","egPt":"Tanto a Ana quanto o Leo tocam violão.","note":{"en":"Two people or things with both… and take a plural verb: Both Ana and Leo *play*.","pt":"Duas pessoas ou coisas com both… and pedem verbo no plural: Both Ana and Leo *play*."},"trap":{"pt":"Tanto a Ana quanto o Leo tocam violão.","wrong":"Both Ana as Leo play the guitar.","right":"Both Ana and Leo play the guitar.","why":"Portuguese *tanto… quanto* is *both… and*, never both… *as*.","whyPt":"*Tanto… quanto* é *both… and*, nunca both… *as*."},"tempt":{"as":{"en":"*Both* goes with *and*. Portuguese says tanto… quanto, but English never says both… as.","pt":"*Both* vai com *and*. O português diz tanto… quanto, mas o inglês nunca diz both… as."},"or":{"en":"*Both* means the two of them, so it goes with *and*, not *or*.","pt":"*Both* significa os dois, então vai com *and*, não com *or*."},"nor":{"en":"*Nor* goes with *neither*. *Both* goes with *and*.","pt":"*Nor* vai com *neither*. *Both* vai com *and*."}}},{"id":"either-or","a":"either","b":"or","lv":"A2","job":"choice","pt":"ou… ou","say":"one of two things: this one or that one","sayPt":"uma de duas coisas: esta ou aquela","eg":"You can either pay now or pay at the door.","egPt":"Você pode ou pagar agora ou pagar na entrada.","note":{"en":"With two subjects, the verb agrees with the nearer one: Either the kids or their mom *has* the keys.","pt":"Com dois sujeitos, o verbo concorda com o mais próximo: Either the kids or their mom *has* the keys."},"trap":{"pt":"Ou você liga ou manda mensagem.","wrong":"Or you call or you send a message.","right":"Either you call or you send a message.","why":"Portuguese *ou… ou* is *either… or*: the first *ou* becomes *either*.","whyPt":"*Ou… ou* é *either… or*: o primeiro *ou* vira *either*."},"tempt":{"nor":{"en":"*Nor* goes with *neither*. *Either* goes with *or*.","pt":"*Nor* vai com *neither*. *Either* vai com *or*."},"and":{"en":"*Either* is a choice (one or the other), so it goes with *or*.","pt":"*Either* é escolha (um ou outro), então vai com *or*."}}},{"id":"neither-nor","a":"neither","b":"nor","lv":"A2","job":"add","pt":"nem… nem","say":"not this one and not that one either","sayPt":"nem esta nem aquela","eg":"The hotel was neither clean nor quiet.","egPt":"O hotel não era nem limpo nem silencioso.","note":{"en":"Neither… nor is already negative: no *not* or *don't* in the same part of the sentence. With two subjects, the verb agrees with the nearer one.","pt":"Neither… nor já é negativo: sem *not* ou *don't* na mesma parte da frase. Com dois sujeitos, o verbo concorda com o mais próximo."},"trap":{"pt":"Eu não gosto nem de café nem de chá.","wrong":"I don't like neither coffee nor tea.","right":"I like neither coffee nor tea. / I don't like coffee or tea.","why":"*Neither… nor* is already negative, so no *don't*. With *don't*, use *or*.","whyPt":"*Neither… nor* já é negativo, então sem *don't*. Com *don't*, use *or*."},"tempt":{"or":{"en":"*Neither* goes with *nor* (Portuguese nem… nem). *Or* goes with *either*.","pt":"*Neither* vai com *nor* (nem… nem). *Or* vai com *either*."},"and":{"en":"*Neither* means not one and not the other, so it goes with *nor*.","pt":"*Neither* significa nem um nem outro, então vai com *nor*."}}},{"id":"not-only","a":"not only","b":"but also","lv":"B1","job":"add","pt":"não só… mas também","say":"one thing, and a second, more surprising one too","sayPt":"uma coisa, e mais outra, ainda mais surpreendente","eg":"The trip was not only cheap but also really fun.","egPt":"A viagem foi não só barata, mas também muito divertida.","note":{"en":"At the start of a sentence, the verb jumps before the subject, as in a question: Not only *did we* win…","pt":"No começo da frase, o verbo vem antes do sujeito, como numa pergunta: Not only *did we* win…"},"tempt":{"and also":{"en":"*Not only* goes with *but also*, never and also.","pt":"*Not only* vai com *but also*, nunca com and also."}}},{"id":"whether-or","a":"whether","b":"or","lv":"B1","job":"choice","pt":"se… ou (não)","say":"it doesn't matter which: this or that","sayPt":"não importa qual: isto ou aquilo","eg":"I'm going to the beach whether it rains or not.","egPt":"Vou à praia, chova ou não.","tempt":{"nor":{"en":"*Whether* goes with *or*: whether it rains or not.","pt":"*Whether* vai com *or*: whether it rains or not."}}},{"id":"so-that-r","a":"so","b":"that","lv":"B1","job":"result","pt":"tão… que","say":"so + an adjective or adverb, then its result","sayPt":"so + adjetivo ou advérbio, depois a consequência","eg":"I was so tired that I fell asleep on the bus.","egPt":"Eu estava tão cansado que dormi no ônibus.","note":{"en":"*So* + an adjective (so tired); *such* + a noun (such a long day).","pt":"*So* + adjetivo (so tired); *such* + substantivo (such a long day)."},"tempt":{"as":{"en":"*So… that* gives a result: so tired that I fell asleep. *As* is for comparisons.","pt":"*So… that* dá a consequência: so tired that I fell asleep. *As* é para comparações."}}},{"id":"such-that","a":"such","b":"that","lv":"B1","job":"result","pt":"tão… que; tanto… que","say":"such + a noun, then its result","sayPt":"such + substantivo, depois a consequência","eg":"It was such a nice day that we went to the beach.","egPt":"Era um dia tão bonito que fomos à praia.","trap":{"pt":"Era um dia tão bonito que fomos à praia.","wrong":"It was so nice day that we went to the beach.","right":"It was such a nice day that we went to the beach. / The day was so nice that…","why":"Before a noun (a nice day) it's *such*; before an adjective alone (nice) it's *so*.","whyPt":"Antes de substantivo (a nice day) é *such*; antes de adjetivo sozinho (nice) é *so*."},"tempt":{"as":{"en":"*Such… that* gives a result: such a nice day that… *Such as* gives examples.","pt":"*Such… that* dá a consequência: such a nice day that… *Such as* dá exemplos."}}},{"id":"the-the","a":"the more","b":"the better","lv":"B2","job":"result","pt":"quanto mais… melhor","say":"when one thing grows, the other grows too","sayPt":"quando uma coisa aumenta, a outra também aumenta","eg":"The more you practice, the better you get.","egPt":"Quanto mais você pratica, melhor você fica.","note":{"en":"Any comparatives work: the sooner, the better; the older I get, the less I sleep.","pt":"Qualquer comparativo funciona: the sooner, the better; the older I get, the less I sleep."},"trap":{"pt":"Quanto mais você pratica, melhor você fica.","wrong":"How much more you practice, better you get.","right":"The more you practice, the better you get.","why":"*Quanto mais… melhor* is *the more… the better*: *the* before both comparatives.","whyPt":"*Quanto mais… melhor* é *the more… the better*: *the* antes dos dois comparativos."},"tempt":{"the best":{"en":"It's *the* + a comparative (better), not the superlative (best): the more, the better.","pt":"É *the* + comparativo (better), não superlativo (best): the more, the better."}}},{"id":"would-rather","a":"would rather","b":"than","lv":"B2","job":"choice","pt":"preferiria… a; prefiro… do que","say":"what you prefer, and what you don't","sayPt":"o que você prefere, e o que não prefere","eg":"I would rather walk than wait for the bus.","egPt":"Prefiro ir a pé a esperar o ônibus.","note":{"en":"Both verbs without *to*: would rather *walk* than *wait*.","pt":"Os dois verbos sem *to*: would rather *walk* than *wait*."},"tempt":{"that":{"en":"*Would rather* compares two choices, so it goes with *than*.","pt":"*Would rather* compara duas escolhas, então vai com *than*."}}},{"id":"no-sooner","a":"no sooner","b":"than","lv":"B2","job":"time","pt":"mal… e já","say":"the second thing happened right after the first","sayPt":"a segunda coisa aconteceu logo depois da primeira","eg":"No sooner had we sat down than the phone rang.","egPt":"Mal nos sentamos e o telefone já tocou.","note":{"en":"At the start, the verb jumps before the subject: No sooner *had we* sat down…","pt":"No começo, o verbo vem antes do sujeito: No sooner *had we* sat down…"},"tempt":{"when":{"en":"*No sooner* goes with *than* (it's a comparative). *Hardly* goes with *when*.","pt":"*No sooner* vai com *than* (é um comparativo). *Hardly* vai com *when*."}}},{"id":"hardly-when","a":"hardly","b":"when","lv":"B2","job":"time","pt":"mal… quando","say":"the second thing happened right after the first","sayPt":"a segunda coisa aconteceu logo depois da primeira","eg":"I had hardly closed my eyes when the alarm went off.","egPt":"Eu mal tinha fechado os olhos quando o alarme tocou.","tempt":{"than":{"en":"*Hardly* goes with *when*. *Than* goes with *no sooner*.","pt":"*Hardly* vai com *when*. *Than* vai com *no sooner*."}}}],"texts":[{"id":"pa2-01","lv":"A2","frame":"Message","framePt":"Mensagem","title":"Thanks for the party!","titlePt":"Obrigada pela festa!","p":["both-and"],"dx":["either-or","neither-nor"],"body":["Hi Sam! Thanks for the birthday party. The food was great: I loved [both] the pizza [and] the chocolate cake, and I had two pieces of each! See you on Monday."],"pt":["Oi, Sam! Obrigada pela festa de aniversário. A comida estava ótima: adorei tanto a pizza quanto o bolo de chocolate, e comi dois pedaços de cada! Até segunda."]},{"id":"pa2-02","lv":"A2","frame":"Notice","framePt":"Aviso","title":"Gym classes","titlePt":"Aulas na academia","p":["either-or"],"dx":["both-and","neither-nor"],"body":["Classes start at 7 a.m. on weekdays. You can come [either] in the morning [or] in the evening, but not both, because there are only twenty places in each class."],"pt":["As aulas começam às 7h nos dias de semana. Você pode vir ou de manhã ou à noite, mas não nos dois horários, porque só há vinte vagas em cada aula."]},{"id":"pa2-03","lv":"A2","frame":"Review","framePt":"Avaliação","title":"Hotel Sol: 2 stars","titlePt":"Hotel Sol: 2 estrelas","p":["neither-nor"],"dx":["both-and","either-or"],"body":["We didn't like this hotel. The room was [neither] clean [nor] quiet: there was dust everywhere, and the street was very noisy at night. We don't want to stay there again."],"pt":["Não gostamos deste hotel. O quarto não era nem limpo nem silencioso: havia poeira por toda parte, e a rua era muito barulhenta à noite. Não queremos ficar lá de novo."]},{"id":"pa2-04","lv":"A2","frame":"About me","framePt":"Sobre mim","title":"My family","titlePt":"Minha família","p":["both-and"],"dx":["either-or","neither-nor"],"body":["I have two sisters, Ana and Julia. [Both] Ana [and] Julia are older than me, so I'm the baby of the family. On weekends, we often cook together."],"pt":["Eu tenho duas irmãs, a Ana e a Julia. Tanto a Ana quanto a Julia são mais velhas do que eu, então eu sou o caçula da família. Nos fins de semana, a gente cozinha junto com frequência."]},{"id":"pa2-05","lv":"A2","frame":"Message","framePt":"Mensagem","title":"Dinner tonight","titlePt":"Jantar hoje","p":["either-or"],"dx":["both-and","neither-nor"],"body":["Hi Leo, I'm making dinner tonight. We can have [either] fish [or] chicken. I only have time to make one, so tell me which one you want!"],"pt":["Oi, Leo, vou fazer o jantar hoje. Podemos comer ou peixe ou frango. Só tenho tempo de fazer um, então me diga qual você quer!"]},{"id":"pa2-06","lv":"A2","frame":"Diary","framePt":"Diário","title":"A bad day","titlePt":"Um dia ruim","p":["neither-nor"],"dx":["both-and","either-or"],"body":["This morning I left my bag at home. I had [neither] my phone [nor] my wallet with me, so I couldn't call my mom or buy lunch. It was a long day!"],"pt":["Hoje de manhã eu esqueci minha bolsa em casa. Eu não estava nem com o celular nem com a carteira, então não consegui ligar para a minha mãe nem comprar almoço. Foi um dia longo!"]},{"id":"pa2-07","lv":"A2","frame":"Ad","framePt":"Anúncio","title":"Summer English Camp","titlePt":"Acampamento de inglês de verão","p":["both-and"],"dx":["either-or","neither-nor"],"body":["Our camp is for [both] kids [and] teenagers: everyone from 8 to 17 years old is welcome. There are classes in the morning and games in the afternoon. Sign up now!"],"pt":["Nosso acampamento é tanto para crianças quanto para adolescentes: todos de 8 a 17 anos são bem-vindos. Há aulas de manhã e jogos à tarde. Inscreva-se já!"]},{"id":"pa2-08","lv":"A2","frame":"Email","framePt":"E-mail","title":"The English test","titlePt":"A prova de inglês","p":["either-or"],"dx":["both-and","neither-nor"],"body":["Dear students, the English test is next week. You can take it [either] on Tuesday [or] on Thursday. Please choose one day and write your name on the list."],"pt":["Queridos alunos, a prova de inglês é na semana que vem. Vocês podem fazê-la ou na terça ou na quinta. Escolham um dia e escrevam seu nome na lista."]},{"id":"pa2-09","lv":"A2","frame":"Message","framePt":"Mensagem","title":"A bad restaurant","titlePt":"Um restaurante ruim","p":["neither-nor"],"dx":["both-and","either-or"],"body":["Hi Sam! We tried the new Italian restaurant last night. Big mistake! The food was [neither] hot [nor] tasty, and the waiter forgot our drinks. Next time, let's just cook at home!"],"pt":["Oi, Sam! A gente experimentou o restaurante italiano novo ontem à noite. Grande erro! A comida não estava nem quente nem gostosa, e o garçom esqueceu as nossas bebidas. Da próxima vez, vamos cozinhar em casa!"]},{"id":"pa2-10","lv":"A2","frame":"Diary","framePt":"Diário","title":"A lazy weekend","titlePt":"Um fim de semana preguiçoso","p":["neither-nor"],"dx":["both-and","either-or"],"body":["This weekend I stayed at home. I was really tired, so I [neither] went out [nor] called anyone. I slept late, read a book and watched old movies. It was perfect!"],"pt":["Neste fim de semana fiquei em casa. Eu estava muito cansada, então não saí nem liguei para ninguém. Dormi até tarde, li um livro e vi filmes antigos. Foi perfeito!"]},{"id":"pa2-11","lv":"A2","frame":"Message","framePt":"Mensagem","title":"Thank you, Grandma!","titlePt":"Obrigada, vó!","p":["both-and"],"dx":["either-or","neither-nor"],"body":["Hi Grandma! Thank you for my birthday present. I love the sweater! It's [both] warm [and] soft, and blue is my favorite color. I wore it to school today. Love, Julia"],"pt":["Oi, vó! Obrigada pelo presente de aniversário. Eu amei o suéter! Ele é quentinho e macio ao mesmo tempo, e azul é a minha cor favorita. Usei hoje na escola. Beijos, Julia"]},{"id":"pa2-12","lv":"A2","frame":"Message","framePt":"Mensagem","title":"Kate's party","titlePt":"A festa da Kate","p":["either-or"],"dx":["both-and","neither-nor"],"body":["Hi Mia! Kate's party is [either] on Friday [or] on Saturday. I'm not sure which day! I'll ask her and send you a message tonight."],"pt":["Oi, Mia! A festa da Kate é ou na sexta ou no sábado. Não sei qual dia! Vou perguntar para ela e te mando mensagem hoje à noite."]},{"id":"pb1-01","lv":"B1","frame":"Review","framePt":"Avaliação","title":"A great little café","titlePt":"Um ótimo cafezinho","p":["such-that","not-only"],"dx":["so-that-r","whether-or"],"body":["I went to Café Luna last weekend, and it was [such] a lovely place [that] I stayed for three hours. The coffee was [not only] cheap [but also] delicious. I'll definitely go back."],"pt":["Fui ao Café Luna no fim de semana passado, e era um lugar tão agradável que fiquei três horas lá. O café era não só barato, mas também delicioso. Com certeza vou voltar."]},{"id":"pb1-02","lv":"B1","frame":"Message","framePt":"Mensagem","title":"A big decision","titlePt":"Uma grande decisão","p":["whether-or","so-that-r"],"dx":["such-that","neither-nor"],"body":["Hi Marta! I can't decide [whether] to take the job in Lisbon [or] stay here. The salary is better, but I would be [so] far from my family [that] I could only see them twice a year. What do you think?"],"pt":["Oi, Marta! Não consigo decidir se aceito o emprego em Lisboa ou se fico aqui. O salário é melhor, mas eu ficaria tão longe da minha família que só conseguiria vê-los duas vezes por ano. O que você acha?"]},{"id":"pb1-03","lv":"B1","frame":"Blog","framePt":"Blog","title":"My first marathon","titlePt":"Minha primeira maratona","p":["not-only","so-that-r"],"dx":["such-that","whether-or"],"body":["Running is [not only] good for your body [but also] good for your mind. On the day of my first marathon, I was [so] nervous [that] I couldn't eat breakfast. But I finished, and I felt amazing!"],"pt":["Correr faz bem não só para o corpo, mas também para a mente. No dia da minha primeira maratona, eu estava tão nervoso que não consegui tomar café da manhã. Mas eu terminei, e me senti incrível!"]},{"id":"pb1-04","lv":"B1","frame":"Email","framePt":"E-mail","title":"Friday's meeting","titlePt":"A reunião de sexta","p":["either-or","whether-or"],"dx":["neither-nor","such-that"],"body":["Hi team, Friday's meeting is still on. You can join [either] in the office [or] online, so choose whatever is easier for you. Please come [whether] you have questions [or] not: it will only take twenty minutes."],"pt":["Oi, pessoal, a reunião de sexta está mantida. Vocês podem participar ou no escritório ou on-line, então escolham o que for mais fácil. Venham, tendo perguntas ou não: vai levar só vinte minutos."]},{"id":"pb1-05","lv":"B1","frame":"Story","framePt":"História","title":"A lucky mistake","titlePt":"Um erro de sorte","p":["such-that","both-and"],"dx":["so-that-r","whether-or"],"body":["Last year I took the wrong train by mistake. It was [such] a beautiful journey [that] I didn't even mind. I saw [both] the mountains [and] the sea from my window, and I took a hundred photos."],"pt":["No ano passado peguei o trem errado sem querer. Foi uma viagem tão bonita que nem me importei. Vi tanto as montanhas quanto o mar da janela, e tirei umas cem fotos."]},{"id":"pb1-06","lv":"B1","frame":"Review","framePt":"Avaliação","title":"Great headphones","titlePt":"Ótimos fones de ouvido","p":["not-only","whether-or"],"dx":["so-that-r","such-that"],"body":["These headphones are amazing. They are [not only] light [but also] really comfortable, and the sound is clear. I wear them every day, [whether] I'm at home [or] on the bus."],"pt":["Esses fones são incríveis. Eles são não só leves, mas também muito confortáveis, e o som é nítido. Uso todos os dias, esteja eu em casa ou no ônibus."]},{"id":"pb1-07","lv":"B1","frame":"Advice","framePt":"Dica","title":"Learning a language","titlePt":"Aprendendo um idioma","p":["whether-or","both-and"],"dx":["such-that","so-that-r"],"body":["Don't worry too much about your accent. What matters is that people understand you, [whether] you sound like a native speaker [or] not. Try to practice [both] speaking [and] listening every day: ten minutes is enough."],"pt":["Não se preocupe demais com o seu sotaque. O que importa é que as pessoas entendam você, soando como um nativo ou não. Tente praticar tanto a fala quanto a escuta todos os dias: dez minutos bastam."]},{"id":"pb1-08","lv":"B1","frame":"Message","framePt":"Mensagem","title":"Sorry, not tonight","titlePt":"Desculpa, hoje não","p":["so-that-r","neither-nor"],"dx":["such-that","whether-or"],"body":["Hi Jo, sorry, I can't come tonight. I'm [so] tired [that] I can barely keep my eyes open. And to be honest, I have [neither] the money [nor] the time for a concert this week. Maybe next month?"],"pt":["Oi, Jo, desculpa, não vou conseguir ir hoje. Estou tão cansado que mal consigo ficar de olhos abertos. E, para ser sincero, não tenho nem dinheiro nem tempo para um show esta semana. Quem sabe mês que vem?"]},{"id":"pb1-09","lv":"B1","frame":"Email","framePt":"E-mail","title":"Our new office","titlePt":"O nosso novo escritório","p":["such-that","either-or"],"dx":["so-that-r","neither-nor"],"body":["Hi everyone, welcome to our new office! It has [such] a great view of the river [that] nobody wants to go home at five. On Friday, we're having a team lunch to celebrate. It will be [either] pizza [or] sushi, so please vote for your favorite by Thursday."],"pt":["Oi, pessoal, bem-vindos ao nosso novo escritório! Ele tem uma vista tão bonita do rio que ninguém quer ir para casa às cinco. Na sexta, vamos ter um almoço da equipe para comemorar. Vai ser ou pizza ou sushi, então votem no favorito de vocês até quinta."]},{"id":"pb1-10","lv":"B1","frame":"Review","framePt":"Avaliação","title":"The Central Inn","titlePt":"O Central Inn","p":["both-and","neither-nor"],"dx":["either-or","whether-or"],"body":["We stayed at the Central Inn for two nights. The location is great: it's close to [both] the train station [and] the old town. Our room, however, was [neither] clean [nor] quiet, and the Wi-Fi didn't work at all. For the price, I expected much more."],"pt":["Ficamos duas noites no Central Inn. A localização é ótima: fica perto tanto da estação de trem quanto do centro histórico. O nosso quarto, porém, não era nem limpo nem silencioso, e o Wi-Fi não funcionou nada. Pelo preço, eu esperava muito mais."]},{"id":"pb1-11","lv":"B1","frame":"Story","framePt":"História","title":"Noisy neighbors","titlePt":"Vizinhos barulhentos","p":["such-that","either-or"],"dx":["so-that-r","whether-or"],"body":["My upstairs neighbors had [such] a loud party last Saturday [that] I couldn't sleep until 4 a.m. The next morning, I had two options: I could [either] complain to them [or] buy some earplugs. I bought the earplugs. A week later, they invited me to their next party!"],"pt":["Os meus vizinhos de cima deram uma festa tão barulhenta no sábado passado que eu não consegui dormir até as 4h. Na manhã seguinte, eu tinha duas opções: ou reclamava com eles ou comprava protetores de ouvido. Comprei os protetores. Uma semana depois, eles me convidaram para a festa seguinte!"]},{"id":"pb1-12","lv":"B1","frame":"Message","framePt":"Mensagem","title":"The climbing gym","titlePt":"A academia de escalada","p":["not-only","neither-nor"],"dx":["such-that","whether-or"],"body":["Hi Bruno! I just tried the new climbing gym downtown. It's [not only] cheap [but also] really friendly: the staff helped me all afternoon. I'm [neither] strong [nor] experienced, but I still climbed three walls! Do you want to come with me next Saturday?"],"pt":["Oi, Bruno! Acabei de experimentar a academia de escalada nova no centro. Ela é não só barata, mas também muito acolhedora: a equipe me ajudou a tarde toda. Não sou nem forte nem experiente, mas mesmo assim escalei três paredes! Quer vir comigo no sábado que vem?"]},{"id":"pb2-01","lv":"B2","frame":"Story","framePt":"História","title":"The interview","titlePt":"A entrevista","p":["no-sooner","the-the"],"dx":["would-rather","such-that","whether-or"],"body":["[No sooner] had I sat down [than] the manager asked me the hardest question of all. I would have liked a minute to breathe, but [the more] I talked, [the better] I felt. By the end, I was almost enjoying it."],"pt":["Mal tinha me sentado e o gerente já me fez a pergunta mais difícil de todas. Eu teria gostado de um minuto para respirar, mas quanto mais eu falava, melhor me sentia. No final, eu estava quase gostando."]},{"id":"pb2-02","lv":"B2","frame":"Message","framePt":"Mensagem","title":"Not tonight","titlePt":"Hoje não","p":["would-rather","hardly-when"],"dx":["the-the","such-that","whether-or"],"body":["Honestly, I [would rather] stay home tonight [than] go to another noisy party. I had [hardly] closed my eyes last night [when] the neighbors started playing loud music again. I need some sleep!"],"pt":["Sinceramente, prefiro ficar em casa hoje a ir a mais uma festa barulhenta. Eu mal tinha fechado os olhos ontem à noite quando os vizinhos começaram a tocar música alta de novo. Preciso dormir!"]},{"id":"pb2-03","lv":"B2","frame":"Article","framePt":"Artigo","title":"Sleep and study","titlePt":"Sono e estudo","p":["would-rather","the-the"],"dx":["such-that","so-that-r","hardly-when"],"body":["Many students say they [would rather] study late at night [than] get up early. But sleep matters more than we think: [the more] you sleep, [the better] you remember what you studied the day before."],"pt":["Muitos estudantes dizem que preferem estudar tarde da noite a acordar cedo. Mas o sono importa mais do que pensamos: quanto mais você dorme, melhor você se lembra do que estudou no dia anterior."]},{"id":"pb2-04","lv":"B2","frame":"Review","framePt":"Avaliação","title":"A disappointing stay","titlePt":"Uma estadia decepcionante","p":["neither-nor","no-sooner"],"dx":["would-rather","such-that","the-the"],"body":["The hotel was [neither] cheap [nor] comfortable, despite what the photos suggested. [No sooner] had we checked in [than] the air conditioning broke, and nobody came to fix it until the next day."],"pt":["O hotel não era nem barato nem confortável, apesar do que as fotos sugeriam. Mal tínhamos feito o check-in e o ar-condicionado quebrou, e ninguém veio consertar até o dia seguinte."]},{"id":"pb2-05","lv":"B2","frame":"Email","framePt":"E-mail","title":"About the offer","titlePt":"Sobre a proposta","p":["not-only","would-rather"],"dx":["hardly-when","such-that","the-the"],"body":["Dear Ms. Grant, thank you for the offer. I am [not only] grateful for the opportunity [but also] excited about the project. However, I [would rather] start in March [than] in January, as I need to finish my current contract first."],"pt":["Prezada Sra. Grant, obrigado pela proposta. Estou não só grato pela oportunidade, mas também animado com o projeto. No entanto, prefiro começar em março a começar em janeiro, pois preciso terminar meu contrato atual primeiro."]},{"id":"pb2-06","lv":"B2","frame":"Story","framePt":"História","title":"The storm","titlePt":"A tempestade","p":["hardly-when","such-that"],"dx":["the-the","would-rather","whether-or"],"body":["We had [hardly] left the beach [when] the first drops of rain fell. Within minutes, it was [such] a strong storm [that] the coast road was closed for the night, and we had to sleep in a small hotel."],"pt":["Mal tínhamos saído da praia quando as primeiras gotas de chuva caíram. Em minutos, a tempestade estava tão forte que a estrada da costa foi fechada durante a noite, e tivemos que dormir num hotelzinho."]},{"id":"pb2-07","lv":"B2","frame":"Opinion","framePt":"Opinião","title":"Working from home","titlePt":"Trabalhar de casa","p":["whether-or","the-the"],"dx":["no-sooner","such-that","would-rather"],"body":["[Whether] you love it [or] hate it, remote work is here to stay. Companies are still learning how to manage it, but [the more] they try it, [the better] they understand what their teams really need."],"pt":["Amando ou odiando, o trabalho remoto veio para ficar. As empresas ainda estão aprendendo a lidar com ele, mas quanto mais o experimentam, melhor entendem do que suas equipes realmente precisam."]},{"id":"pb2-08","lv":"B2","frame":"Message","framePt":"Mensagem","title":"Sold!","titlePt":"Vendido!","p":["no-sooner","both-and"],"dx":["would-rather","such-that","the-the"],"body":["Hi Dan! Guess what? [No sooner] had I posted my old bike online [than] three people wanted to buy it. I got [both] a good price [and] a new friend from the sale: the buyer lives on my street!"],"pt":["Oi, Dan! Adivinha? Mal coloquei minha bicicleta velha à venda na internet e três pessoas já quiseram comprar. Ganhei tanto um bom preço quanto um novo amigo com a venda: o comprador mora na minha rua!"]},{"id":"pb2-09","lv":"B2","frame":"Story","framePt":"História","title":"The last ferry","titlePt":"A última balsa","p":["hardly-when","whether-or"],"dx":["the-the","would-rather","such-that"],"body":["We had [hardly] reached the pier [when] the last ferry pulled away. It was getting dark, and we couldn't decide [whether] to wait for the morning boat [or] look for a hotel in the village. In the end, a fisherman offered to take us across for twenty euros."],"pt":["Mal tínhamos chegado ao píer quando a última balsa partiu. Estava escurecendo, e não conseguíamos decidir se esperávamos o barco da manhã ou se procurávamos um hotel na vila. No fim, um pescador se ofereceu para nos levar por vinte euros."]},{"id":"pb2-10","lv":"B2","frame":"Opinion","framePt":"Opinião","title":"Too many video calls","titlePt":"Videochamadas demais","p":["not-only","neither-nor"],"dx":["the-the","would-rather","whether-or"],"body":["Long video calls are [not only] tiring [but also] surprisingly bad for creativity. Most of them are [neither] necessary [nor] productive: a short email would do the job just as well."],"pt":["Videochamadas longas são não só cansativas, mas também surpreendentemente ruins para a criatividade. A maioria delas não é nem necessária nem produtiva: um e-mail curto resolveria igualmente bem."]},{"id":"pb2-11","lv":"B2","frame":"Article","framePt":"Artigo","title":"Never too late","titlePt":"Nunca é tarde","p":["such-that","both-and"],"dx":["so-that-r","either-or","would-rather"],"body":["Learning an instrument as an adult can be [such] a frustrating experience [that] many people give up within a month. Yet those who keep going are well rewarded: research suggests that regular practice improves [both] memory [and] coordination, even later in life."],"pt":["Aprender um instrumento depois de adulto pode ser uma experiência tão frustrante que muita gente desiste em um mês. Mas quem persiste é bem recompensado: pesquisas indicam que a prática regular melhora tanto a memória quanto a coordenação, mesmo mais tarde na vida."]},{"id":"pb2-12","lv":"B2","frame":"Email","framePt":"E-mail","title":"Re: the conference","titlePt":"Re: o congresso","p":["neither-nor","whether-or"],"dx":["either-or","both-and","the-the"],"body":["Hi Marcus, thank you for the invitation. Unfortunately, I have [neither] the time [nor] the budget to attend this year. I'll still watch the talks online, [whether] they're streamed live [or] recorded. Best of luck with the event!"],"pt":["Oi, Marcus, obrigada pelo convite. Infelizmente, não tenho nem tempo nem verba para participar este ano. Mesmo assim, vou assistir às palestras on-line, sejam elas transmitidas ao vivo ou gravadas. Boa sorte com o evento!"]}]},"same":{"A2":[{"id":"a2-s01","s":"I stayed at home [because] it was raining.","pt":"Fiquei em casa porque estava chovendo.","o":[{"en":"It was raining, [so] I stayed at home.","why":"Same message: *so* gives the result. The rain came first, and staying home was the result.","whyPt":"Mesma mensagem: *so* dá a consequência. A chuva veio primeiro, e ficar em casa foi a consequência."},{"en":"It was raining, [but] I stayed at home.","why":"*But* shows a surprise, as if staying home were strange on a rainy day.","whyPt":"*But* mostra uma surpresa, como se ficar em casa num dia de chuva fosse estranho."},{"en":"I stayed at home, [so] it was raining.","why":"The reason and the result swap places: now staying at home made it rain!","whyPt":"Causa e consequência trocam de lugar: agora ficar em casa fez chover!"}]},{"id":"a2-s02","s":"We had dinner [after] we watched the movie.","pt":"Jantamos depois de assistir ao filme.","o":[{"en":"We watched the movie [before] we had dinner.","why":"Same message: *before* and *after* change places, but the order is the same. First the movie, then dinner.","whyPt":"Mesma mensagem: *before* e *after* trocam de lugar, mas a ordem é a mesma. Primeiro o filme, depois o jantar."},{"en":"We had dinner [before] we watched the movie.","why":"Now dinner comes first: the order is the opposite.","whyPt":"Agora o jantar vem primeiro: a ordem é a contrária."},{"en":"We watched the movie [because] we had dinner.","why":"*Because* gives a reason, as if dinner made you watch the movie. The first sentence only talks about time.","whyPt":"*Because* dá uma causa, como se o jantar fizesse vocês assistirem ao filme. A primeira frase só fala de tempo."}]},{"id":"a2-s03","s":"[First] I did my homework. [Then] I played soccer.","pt":"Primeiro fiz a lição de casa. Depois joguei futebol.","o":[{"en":"I played soccer [after] I did my homework.","why":"Same message: homework first, soccer after it.","whyPt":"Mesma mensagem: primeiro a lição, o futebol depois."},{"en":"I played soccer [before] I did my homework.","why":"Now soccer comes first: the opposite order.","whyPt":"Agora o futebol vem primeiro: a ordem contrária."},{"en":"I did my homework [because] I played soccer.","why":"*Because* gives a reason. The first sentence only says the order: first one thing, then the other.","whyPt":"*Because* dá uma causa. A primeira frase só diz a ordem: primeiro uma coisa, depois a outra."}]},{"id":"a2-s04","s":"Ana was tired, [so] she went to bed early.","pt":"A Ana estava cansada, então foi dormir cedo.","o":[{"en":"Ana went to bed early [because] she was tired.","why":"Same message: *because* gives the reason (she was tired).","whyPt":"Mesma mensagem: *because* dá a causa (ela estava cansada)."},{"en":"Ana was tired [because] she went to bed early.","why":"The reason and the result swap places: now going to bed early made her tired.","whyPt":"Causa e consequência trocam de lugar: agora dormir cedo a deixou cansada."},{"en":"Ana was tired, [but] she went to bed early.","why":"*But* shows a surprise, but going to bed early is just what tired people do.","whyPt":"*But* mostra uma surpresa, mas dormir cedo é exatamente o que gente cansada faz."}]},{"id":"a2-s05","s":"The store was closed, [so] we couldn't buy any bread.","pt":"A padaria estava fechada, então não conseguimos comprar pão.","o":[{"en":"We couldn't buy any bread [because] the store was closed.","why":"Same message: the closed store is the reason.","whyPt":"Mesma mensagem: a loja fechada é a causa."},{"en":"The store was closed [because] we couldn't buy any bread.","why":"The reason and the result swap places: as if the store closed because you couldn't buy bread.","whyPt":"Causa e consequência trocam de lugar: como se a loja fechasse porque vocês não compraram pão."},{"en":"We couldn't buy any bread, [but] the store was closed.","why":"*But* shows a surprise. A closed store is no surprise when you can't buy bread: it's the reason.","whyPt":"*But* mostra uma surpresa. Loja fechada não é surpresa quando não dá para comprar pão: é a causa."}]},{"id":"a2-s06","s":"Call me [when] you get to the airport.","pt":"Me liga quando chegar ao aeroporto.","o":[{"en":"[When] you get to the airport, call me.","why":"Same message: the two parts change places, and *when* stays with getting to the airport.","whyPt":"Mesma mensagem: as duas partes trocam de lugar, e *when* continua com chegar ao aeroporto."},{"en":"Call me [before] you get to the airport.","why":"Now the call comes first, while you're still on your way.","whyPt":"Agora a ligação vem antes, enquanto você ainda está a caminho."},{"en":"Call me [until] you get to the airport.","why":"*Until* means up to that moment: you'd keep calling all the way there.","whyPt":"*Until* significa até aquele momento: você ficaria ligando o caminho todo."}]},{"id":"a2-s07","s":"We can take the bus, [or] we can walk.","pt":"Podemos pegar o ônibus ou ir a pé.","o":[{"en":"We can walk, [or] we can take the bus.","why":"Same message: the same two choices, in a different order.","whyPt":"Mesma mensagem: as mesmas duas opções, em outra ordem."},{"en":"We can take the bus, [and] we can walk.","why":"*And* means both: the bus and walking too. *Or* means you choose one.","whyPt":"*And* significa os dois: o ônibus e também a pé. *Or* significa escolher um."},{"en":"We can take the bus [because] we can walk.","why":"*Because* gives a reason, and here it makes no sense: walking isn't a reason to take the bus.","whyPt":"*Because* dá uma causa, e aqui não faz sentido: andar não é motivo para pegar o ônibus."}]},{"id":"a2-s08","s":"I didn't go to the party [because] I was sick.","pt":"Não fui à festa porque estava doente.","o":[{"en":"I was sick, [so] I didn't go to the party.","why":"Same message: *so* gives the result of being sick.","whyPt":"Mesma mensagem: *so* dá a consequência de estar doente."},{"en":"I was sick, [but] I didn't go to the party.","why":"*But* shows a surprise, but staying away when you're sick is what you'd expect.","whyPt":"*But* mostra uma surpresa, mas faltar quando se está doente é o esperado."},{"en":"I didn't go to the party, [so] I was sick.","why":"The reason and the result swap places: now missing the party made you sick!","whyPt":"Causa e consequência trocam de lugar: agora faltar à festa te deixou doente!"}]},{"id":"a2-s09","s":"[If] it rains tomorrow, we'll stay home.","pt":"Se chover amanhã, vamos ficar em casa.","o":[{"en":"We'll stay home [if] it rains tomorrow.","why":"Same message: the two parts change places, and *if* stays with the rain.","whyPt":"Mesma mensagem: as duas partes trocam de lugar, e *if* continua com a chuva."},{"en":"It will rain tomorrow, [so] we'll stay home.","why":"Now the rain is certain. With *if*, it may or may not rain.","whyPt":"Agora a chuva é certa. Com *if*, pode chover ou não."},{"en":"We'll stay home tomorrow, [but] it will rain.","why":"*But* shows a surprise, and the rain is certain here. The first sentence is a condition: if it rains.","whyPt":"*But* mostra uma surpresa, e aqui a chuva é certa. A primeira frase é uma condição: se chover."}]},{"id":"a2-s10","s":"Wash your hands [before] you eat.","pt":"Lave as mãos antes de comer.","o":[{"en":"[First] wash your hands. [Then] eat.","why":"Same message: hands first, then food.","whyPt":"Mesma mensagem: primeiro as mãos, depois a comida."},{"en":"Wash your hands [after] you eat.","why":"Now you eat first and wash your hands later: the opposite order.","whyPt":"Agora você come primeiro e lava as mãos depois: a ordem contrária."},{"en":"Wash your hands [or] eat.","why":"*Or* gives a choice, as if you could do only one of the two.","whyPt":"*Or* dá uma escolha, como se desse para fazer só uma das duas coisas."}]},{"id":"a2-s11","s":"It's late, [so] let's go home.","pt":"Está tarde, então vamos para casa.","o":[{"en":"Let's go home [because] it's late.","why":"Same message: being late is the reason to go home.","whyPt":"Mesma mensagem: estar tarde é o motivo para ir para casa."},{"en":"It's late, [but] let's go home.","why":"*But* shows a surprise, but going home when it's late is what you'd expect.","whyPt":"*But* mostra uma surpresa, mas ir para casa quando está tarde é o esperado."},{"en":"Let's go home, [so] it's late.","why":"The reason and the result swap places: as if going home made it late.","whyPt":"Causa e consequência trocam de lugar: como se ir para casa deixasse tarde."}]},{"id":"a2-s12","s":"I couldn't sleep [because of] the noise.","pt":"Não consegui dormir por causa do barulho.","o":[{"en":"It was noisy, [so] I couldn't sleep.","why":"Same message: the noise came first, and no sleep was the result.","whyPt":"Mesma mensagem: o barulho veio primeiro, e não dormir foi a consequência."},{"en":"I couldn't sleep, [so] it was noisy.","why":"The r
