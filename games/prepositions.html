<!-- English Bubbles app (added by the app's build.py, not part of the game's own files) -->
<script>
/* early-theme.js — runs in <head>, before the first paint, in the menu AND in every game: puts on the background
   colour saved in eb-bg (the games' palettes, "p:sky" or "c:#7aa7ff"), so a page never flashes its default colour
   first. The page's own 01-theme.js applies the same colour again a moment later. Keep PAL in step with PALETTES
   (src/js/01-theme.js and the games). */
(function () {
  try {
    var PAL = {
      sky: ["#e4f3fb", "#f1e8fb", "#fdf0e6", 0], peach: ["#ffe6d8", "#ffd6e4", "#fff1c9", 0],
      mint: ["#d9f4e6", "#d3eef6", "#eef6d3", 0], lilac: ["#e9e0fb", "#f7d9ee", "#dbe6fb", 0],
      dusk: ["#2a1740", "#58224f", "#1f3560", 1], midnight: ["#141964", "#441464", "#144e64", 1]
    };
    var s = Storage.prototype.getItem.call(window.localStorage, "eb-bg") || "", c = null;
    if (s.indexOf("p:") === 0) c = PAL[s.slice(2)] || null;
    else if (/^c:#[0-9a-f]{6}$/i.test(s)) {
      var hex = s.slice(2), r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255,
        b = parseInt(hex.slice(5, 7), 16) / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b),
        l = (mx + mn) / 2, h = 0, sat = 0, d = mx - mn;
      if (d) {
        sat = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
        h = (mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) * 60;
      }
      var col = function (dh) { return "hsl(" + ((h + dh + 360) % 360).toFixed(0) + "," + (sat * 100).toFixed(0) + "%," + (l * 100).toFixed(0) + "%)"; };
      c = [col(0), col(40), col(-40), l * 100 < 52];
    }
    if (c) {
      var root = document.documentElement;
      root.style.setProperty("--bg-a", c[0]); root.style.setProperty("--bg-b", c[1]); root.style.setProperty("--bg-c", c[2]);
      root.dataset.theme = c[3] ? "dark" : "light";
    }
  } catch (e) {}
  // The phone's bars (theme-color) follow the background: its top colour --bg-a, set here or later by the page's own
  // colour picker (menu or game: both write --bg-a on <html>). No colour chosen: the default light / dark ones.
  try {
    var html = document.documentElement, last = "";
    var bar = function () {
      var a = html.style.getPropertyValue("--bg-a").trim(), m = document.querySelectorAll('meta[name="theme-color"]');
      for (var i = 0; i < m.length; i++) {
        var v = a || (/dark/.test(m[i].media) ? "#141964" : "#e4f3fb");
        if (m[i].content !== v) m[i].content = v;
      }
      last = a;
    };
    bar();
    document.addEventListener("DOMContentLoaded", bar);
    new MutationObserver(function () {
      if (html.style.getPropertyValue("--bg-a").trim() !== last) bar();
    }).observe(html, { attributes: true, attributeFilter: ["style"] });
  } catch (e) {}
})();

/* iPhone / iPad: ask for a "playback" audio session, so the game's sounds play even with Silent mode on (iOS 17+;
   some games already do this themselves). Websites can't detect Silent mode, so the menu also shows a tip. */
try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
document.documentElement.classList.add("eb-arrive");   /* the header slides in (see the style below) */
</script>
<style>
/* A soft cross-fade between the menu and the games (Chrome; other browsers just switch). Both pages opt in. */
@media (prefers-reduced-motion: no-preference) {

/* The header slides down in from the top when a page arrives (html.eb-arrive, set in <head>, removed when the slide
   ends). It is the real header that moves, not a view-transition snapshot: a snapshot can't show the frosted-glass
   blur (a flat bar showed on PC) and was choppy on Android. The blur is off only while it moves (it is the costly
   part); it returns when the slide ends. */
@media (prefers-reduced-motion: no-preference) {
  html.eb-arrive header.dock { animation: eb-dock-in .48s cubic-bezier(.22,1,.36,1) both; will-change: transform, opacity;
    -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
}
@keyframes eb-dock-in { from { transform: translateY(calc(-100% - 28px)); opacity: 0; } }
/* Leaving with the Games button: the game fades away completely while its sound plays, leaving only its background,
   which is the menu's colour too; the menu then fades in on top. (Half-faded, the page froze on a dim picture while
   the menu loaded: "laggy".) */
html.eb-leaving body { opacity: 0; transition: opacity .22s ease-in; pointer-events: none; }

<script>
/* Every game saves its progress in the phone's storage. In the app all games share one storage, so each game's
   keys get the prefix "eb:prepositions:" here; two games can then use the same key names without overwriting each other.
   One exception: the background colour (every game saves it as "<prefix>-bg", e.g. "p:sky" or "c:#7aa7ff", like
   the menu) is ONE setting for the whole app, kept under the menu's key "eb-bg": the game opens with the colour
   chosen in the menu, and a colour chosen in a game becomes the menu's and the other games' too. */
(function () {
  try {
    var P = "eb:prepositions:", L = window.localStorage, S = Storage.prototype, BG = /^[a-z]+-bg$/;
    var get = S.getItem, set = S.setItem, del = S.removeItem;
    /* The EN / PT toggles too: ONE language for the whole app, the menu's (eb-lang). Each game saves its toggles
       under its own keys, with its own word for Portuguese (games.json "lang": "pt", "tr" or "native"; English is
       always "en"): reading one gives the menu's language, and a tap in a game changes the menu's and every
       game's. Until EN / PT is chosen, the menu's own rule: Portuguese for My level All / A1 / A2, English from B1. */
    var LG = {"prb-guidelang": "native", "prb-tourlang": "native"};
    function appLang() {
      var l = get.call(L, "eb-lang");
      if (l === "en" || l === "pt") return l;
      var lv = get.call(L, "eb-level");
      return lv === "B1" || lv === "B2+" ? "en" : "pt";
    }
    /* The sound-effects volume too (2026-11-26, the user): ONE for the whole app, the menu's "eb-vol" (0-100,
       0 = sound off). Every game saves "<prefix>-vol" (0-100, its Effects slider) plus an on / off key:
       "<prefix>-snd" ("0" = off) or "<prefix>-mute" ("1" = off). Reading them gives the menu's volume (menu at 0:
       the game opens muted, its slider where it was); after a game writes either, eb-vol = 0 if muted, else its
       slider. The Voice slider ("-vvol") stays each game's own. */
    var VOL = /^[a-z]+-vol$/, MUTE = /^[a-z]+-(snd|mute)$/;
    function own(k) { return get.call(L, P + k); }
    function syncVol(k) {
      var pre = k.slice(0, k.indexOf("-")), v = parseInt(own(pre + "-vol"), 10);
      if (isNaN(v) || v < 0 || v > 100) return;
      var off = own(pre + "-snd") === "0" || own(pre + "-mute") === "1";
      set.call(L, "eb-vol", String(off ? 0 : v));
    }
    S.getItem = function (k) {
      if (this === L && BG.test(k)) { var app = get.call(this, "eb-bg"); if (app) return app; }
      if (this === L && (VOL.test(k) || MUTE.test(k))) {
        var ev = get.call(this, "eb-vol");
        if (ev !== null && VOL.test(k) && ev !== "0") return ev;
        if (ev !== null && MUTE.test(k)) { var off = ev === "0"; return /-snd$/.test(k) ? (off ? "0" : "1") : (off ? "1" : "0"); }
      }
      if (this === L && LG.hasOwnProperty(k)) return appLang() === "en" ? "en" : LG[k];
      return get.call(this, this === L ? P + k : k);
    };
    S.setItem = function (k, v) {
      if (this === L && BG.test(k)) set.call(this, "eb-bg", v);
      if (this === L && LG.hasOwnProperty(k)) set.call(this, "eb-lang", String(v) === "en" ? "en" : "pt");
      var r = set.call(this, this === L ? P + k : k, v);
      if (this === L && (VOL.test(k) || MUTE.test(k))) syncVol(k);
      return r;
    };
    S.removeItem = function (k) { return del.call(this, this === L ? P + k : k); };
    /* The app's own keys (eb-rounds, eb-don…) and language, for the injected donation script (donate.js) */
    window.ebApp = { get: function (k) { return get.call(L, k); }, set: function (k, v) { set.call(L, k, v); }, lang: appLang };
    /* Opened from the menu (a card or Continue)? Then the game starts at the menu's level ("My level"): the menu
       leaves a one-time note (sessionStorage eb-level-go), and the matching level is saved under the game's own
       level key before the game reads it (games.json "level"; the nearest level when the game doesn't have it).
       With "All" on the menu, or on a reload, the game keeps its own last level. */
    var LV = {"key": "prb-level", "A1": "A1", "A2": "A2", "B1": "A2", "B2+": "A2"}, SS = window.sessionStorage;
    if (SS.getItem("eb-level-go") === "prepositions") {
      SS.removeItem("eb-level-go");
      var m = get.call(L, "eb-level");
      if (LV && LV[m]) set.call(L, P + LV.key, LV[m]);
    }
  } catch (e) {}
})();
</script>

  --shadow: rgba(60,70,140,.16);

  --clue: hsl(255,90%,82%);
    --clue: hsl(255,90%,82%);

    --shadow: rgba(0,0,0,.45);

html { height: 100%; }
html, body { overflow-x: clip; }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100%;
  background-color: var(--bg-a);
  color: var(--ink);
  font-family: var(--font); font-size: 16px;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .4s ease;
}
/* The soft color clouds sit on their own fixed layer (not background-attachment: fixed, which repaints the whole
   page on every scroll and every change on phones) */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image:
    radial-gradient(60vmax 50vmax at 8% 6%, var(--bg-a), transparent 70%),
    radial-gradient(55vmax 45vmax at 95% 40%, var(--bg-b), transparent 70%),
    radial-gradient(60vmax 50vmax at 30% 100%, var(--bg-c), transparent 70%);
  will-change: transform;
}
/* Theme change (swapBg in 03-theme.js, from Pronoun Bubbles / Verb Bubbles): no transitions for that one style change;
   the old background fades away on top */
.theming body, .theming *, .theming *::before, .theming *::after { transition: none !important; }
.bgfade { position: fixed; inset: 0; z-index: -1; pointer-events: none; background-color: var(--fa);
  background-image: radial-gradient(60vmax 50vmax at 8% 6%, var(--fa), transparent 70%),
    radial-gradient(55vmax 45vmax at 95% 40%, var(--fb), transparent 70%),
    radial-gradient(60vmax 50vmax at 30% 100%, var(--fc), transparent 70%);
  transition: opacity .55s ease; will-change: opacity; }
.bgfade.fading { opacity: 0; }
button { font-family: inherit; }
/* The bubbles drifting up behind everything (2026-11-21, from English Bubbles' 00-base.css; made in 06-sky.js). Sizes
   use lvh (the screen's height with the address bar hidden), not vh: on Android the address bar hides and shows while
   scrolling, which changed vh mid-flight and made every bubble jump (vh is the fallback for old browsers). Only
   transform and opacity animate. They pause while a bubble is carried (body.carrying). */
.sky { position: fixed; top: 0; left: 0; right: 0; height: 100vh; height: 100lvh; z-index: -1; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; }
.sky.in { opacity: var(--sky-o); }   /* light .85, dark .6: subtler on dark backgrounds (2026-11-22: .75 was too strong) */   /* at load the bubbles are already part-way up (06-sky.js); the layer fades in */
.sky span {
  position: absolute; bottom: -120px; border-radius: 50%;
  /* per theme (--sky-*, 00-base.css): on light backgrounds a stronger rim and glow and a tint of the colour inside,
     so they show; on dark ones fainter */
  border: 1.5px solid hsla(var(--h), 80%, var(--sky-rim-l), var(--sky-rim-a));
  background: radial-gradient(circle at 30% 26%, rgba(255,255,255,var(--sky-hi)), hsla(var(--h), 90%, 78%, var(--sky-tint-a)) 50%, hsla(var(--h), 90%, 72%, calc(var(--sky-tint-a) * .8)) 70%, transparent 71%);
  box-shadow: inset 0 0 14px hsla(var(--h), 95%, var(--sky-glow-l), var(--sky-glow-a));
  filter: blur(2px);   /* soft, out of focus: blurred once, then only moved */
  animation: skydrift var(--t, 30s) linear infinite; animation-delay: var(--d, 0s);
  opacity: 0;
}
body.carrying .sky span, body.calm .sky span { animation-play-state: paused; }   /* calm: while the card opens or closes (26-shine.js) */
@keyframes skydrift {
  0% { transform: translate3d(0, 0, 0); opacity: 0; }
  8% { opacity: .6; }
  50% { transform: translate3d(var(--x, 20px), -60vh, 0); transform: translate3d(var(--x, 20px), -60lvh, 0); }
  92% { opacity: .45; }
  100% { transform: translate3d(0, -125vh, 0); transform: translate3d(0, -125lvh, 0); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .sky { display: none; } }

/* While the tutorial or a window (.favmodal) is open (body.covered, 26-shine.js) the game behind it stands still: the
   blur and dimming over it aren't redrawn on every frame (slow phones). Bubbles inside the window keep moving. */

/* 10-dock: Header dock: segment buttons, capital labels, language picker, practice focus / level pills, volume slider, background swatches, Tutorial button. */

  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 5;
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 14px;
  width: max-content; max-width: calc(100% - 24px);

.pick {

/* Touch screens: no glass blur behind the tiles (they bounce on every answer, and the blur made each frame a repaint) */
@media (max-width: 640px), (hover: none) { .score, .tile { -webkit-backdrop-filter: none; backdrop-filter: none; } }
/* 40-bubbles: The tray: cluster boxes (soft panel in the cluster's color, caption button, row of bubbles), bubbles (look, hover / selected / drag / shake / right-answer glow, hint dimming; the soap look, float and turning film at the end of the bubble rules), the note (cheat sheet, trap-map example), phone layout. */
/* Clusters: one soft glass panel each, in a row that wraps; the caption (para, em · no · na…) opens the cheat sheet */
.tray { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 12px 14px; margin-top: 18px; }
.fam {
  display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 7px 12px 12px; border-radius: 26px;
  background: linear-gradient(180deg, hsla(var(--h), 90%, 78%, .2), hsla(var(--h), 90%, 78%, .07));
  border: 1px solid hsla(var(--h), 70%, 62%, .3);
  transition: opacity .35s ease, filter .35s ease, transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .35s ease;
}
.fam.dim { opacity: .26; filter: saturate(.35); }
.fam.on { transform: scale(1.04); box-shadow: 0 0 0 3px hsla(var(--h), 85%, 65%, .35), 0 10px 24px var(--shadow); }
.fam-cap {
  appearance: none; cursor: help; border: 0; background: transparent; padding: .15em .5em; border-radius: 999px;
  font-family: inherit; font-size: .72rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; line-height: 1.2;
  color: hsl(var(--h), 55%, var(--lab-l));
  text-decoration: underline dotted hsla(var(--h), 60%, 55%, .7); text-underline-offset: .3em;
  transition: background-color .2s ease;
}
.fam-cap:hover, .fam-cap:focus-visible { background: hsla(var(--h), 90%, 75%, .25); outline: none; }
.fam-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.b {
  --h: 200;
  position: relative; appearance: none; cursor: pointer;
  font-weight: 500; font-size: clamp(1.05rem, .9vw + .8rem, 1.3rem); line-height: 1; letter-spacing: .01em;
  color: var(--ink);
  padding: .66em 1em .7em; border-radius: 1.1em;
  border: 1.5px solid hsla(var(--h), 75%, var(--rim-l), .8);
  background:
    linear-gradient(180deg, hsla(var(--h), 92%, 72%, .2), hsla(var(--h), 92%, 72%, .2)),
    radial-gradient(120% 140% at 22% 14%, var(--fill-hi), var(--fill-mid) 48%, var(--fill-lo) 100%);
  box-shadow:
    inset 0 0 14px hsla(var(--h), 95%, var(--glow-l), .38),
    inset -5px -7px 14px hsla(calc(var(--h) + 70), 95%, var(--glow-l), .24),
    0 6px 14px var(--shadow);
  transition: transform .28s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease, border-color .25s ease, opacity .3s ease, filter .3s ease;
}
.b::before { content: ""; position: absolute; left: 9%; top: 12%; width: 22%; height: 22%; max-height: 1.2em; border-radius: 50%; background: radial-gradient(closest-side, var(--gloss), transparent); transform: rotate(-14deg); opacity: .8; pointer-events: none; }
.b:focus-visible { outline: 2px solid var(--underline); outline-offset: 4px; }
.wb { min-width: 3.4em; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.wb:focus-visible, .wb.sel, .tray:not(.locked) .wb.hov {
  transform: translateY(-4px) scale(1.06);
  border-color: hsla(var(--h), 85%, calc(var(--rim-l) - 12%), .95);
  box-shadow: inset 0 0 22px hsla(var(--h), 100%, var(--glow-l), .6), inset -6px -8px 18px hsla(calc(var(--h) + 70), 100%, var(--glow-l), .4), 0 14px 24px var(--shadow), 0 0 0 4px hsla(var(--h), 90%, 75%, .22);
}
.wb.sel { outline: 3px solid hsla(var(--h),80%,60%,.75); outline-offset: 3px; }
.wb.drag { z-index: 20; cursor: grabbing; will-change: transform; transition: box-shadow .25s ease; box-shadow: inset 0 0 22px hsla(var(--h),100%,var(--glow-l),.6), 0 18px 28px var(--shadow), 0 0 0 4px hsla(var(--h),90%,75%,.25); }
.wb.shake { animation: shake .5s ease; border-color: hsla(350,85%,62%,.95); box-shadow: inset 0 0 20px hsla(350,95%,70%,.5), 0 8px 18px var(--shadow); }
/* Hover lift only on real mouse pointers, so a tapped bubble never stays raised on a phone */
@media (hover: hover) { .tray:not(.locked) .wb:hover:not(.drag) { transform: translateY(-4px) scale(1.06); border-color: hsla(var(--h), 85%, calc(var(--rim-l) - 12%), .95); } }
/* After an answer the right bubble glows green for a moment, then settles back to normal */
.wb.right { animation: rightglow 1.1s ease-out; }
@keyframes rightglow { 0%, 45% { border-color: hsla(150,60%,45%,.95); box-shadow: inset 0 0 22px hsla(150,90%,70%,.6), 0 8px 18px var(--shadow), 0 0 0 4px hsla(150,80%,60%,.3); transform: scale(1.06); } 100% { transform: none; } }
.tray.locked .wb { cursor: default; }
@keyframes shake { 0%,100% { transform: translateX(0); } 15% { transform: translateX(-9px) rotate(-1.5deg); } 35% { transform: translateX(8px) rotate(1.2deg); } 55% { transform: translateX(-6px); } 75% { transform: translateX(4px); } }
/* Phones: the tray stays above the sentence card (the user's choice, 2026-11-20), so the sentence and the bubbles fit on one screen; the clusters get
   smaller (font, padding, gaps scale with the width) and wrap two or three to a row. */
@media (max-width: 640px) {
  .wrap { display: flex; flex-direction: column; }
  .wrap > * { margin-left: 0; margin-right: 0; }
  .wrap > .tray { order: 1; }
  .wrap > .card { order: 2; margin-left: 0; margin-right: 0; }
  .tray { gap: 8px clamp(5px, 2vw, 10px); margin-top: 12px; }
  .fam { gap: 5px; padding: 5px clamp(6px, 2vw, 10px) 9px; border-radius: 20px; }
  .fam-cap { font-size: clamp(.6rem, 2.6vw, .7rem); letter-spacing: .06em; }
  .fam-row { gap: clamp(4px, 1.5vw, 7px); }
  .b { font-size: clamp(.92rem, 3.9vw, 1.08rem); padding: .6em clamp(.5em, 2.4vw, .8em) .64em; border-radius: 1em; }
  .b::before { left: 7%; }
  .wb { min-width: 2.9em; }
  .wb:focus-visible, .wb.sel, .tray:not(.locked) .wb.hov { transform: translateY(-3px) scale(1.05); }
  .sent { font-size: 1.28rem; padding-top: 6px; }
  .wrap > .hint { margin-top: 8px; font-size: .84rem; }
  .wrap > .card { margin-top: 10px; padding-top: 40px; padding-bottom: 34px !important; }
}
/* the word inside a bubble: drawn above the shine, which follows the mouse (26-shine.js) */
.wb .wl { display: inline-block; position: relative; }
/* The soap spans (SOAP in 12-tray.js) never take the mouse, so their cursor is fixed: inherited from the bubble, a
   cursor change on the tray (.locked after an answer, off again for the next sentence) restyled every one of them:
   5-8 ms on a PC each time, 1 ms now. */
.wb .film, .wb .spot, .wb .rim, .wb .glint { cursor: default; }
/* Floating (from Pronoun Bubbles / Verb Bubbles, 2026-11-22): each tray bubble drifts a couple of
   pixels on its own path and pace (--fx / --fy / --fdur / --fdl, set in 12-tray.js). It uses `translate`, so the hover
   lift and the drag (`transform`) add to it. It holds still while hovered (no edge jitter), dragged, shaking or glowing. */
.wb:not(.shake):not(.right) { animation: float var(--fdur, 4s) ease-in-out var(--fdl, 0s) infinite alternate; }
@keyframes float { from { translate: 0 0; } to { translate: var(--fx, 0px) var(--fy, -3px); } }
@media (hover: hover) { .tray:not(.locked) .wb:hover { animation-play-state: paused; } }
.wb.drag { animation-play-state: paused; }
@media (prefers-reduced-motion: reduce) { .wb:not(.shake):not(.right) { animation: none; } }
/* Soap bubbles (2026-11-22, from Pronoun Bubbles / Verb Bubbles, ../bedomodal: "4b · Shimmering film"), in light and
   dark mode: almost clear, a faint film of colour inside and a 1.5px coloured rim, both turning once in 10 s; the cluster's
   colour leads (about half of each turn: --th = the cluster's --h, set in 12-tray.js). The numbers that differ per theme are tokens in 00-base.css
   (--soap-* incl. the shine --soap-gl and its brighter core --spot-plus, --film-a, --srim-*, --sglow-*). The border stays, clear, so nothing changes size.
   Built from spans (SOAP in 12-tray.js; 2026-11-22), each drawn once: the film and the rim turn by rotating a still
   conic gradient (.spin, a transform animation: the graphics chip does it, nothing is repainted), and what follows the
   mouse moves by transform / opacity only (26-shine.js). Before, all this was backgrounds of the bubble driven by
   custom properties: every change restyled the whole bubble (3.8 ms a frame for 15 bubbles on a PC, against 0.5 ms
   now at most) and repainted it. Paint order, bottom to top: the film (.spin, the white sheen ::before, the glow facing the
   mouse .fg, the inner glow ::after), the shine spot, the rim, the small spot, the word. */
.wb { --th: var(--h); border-color: transparent; background: none;
  --ig: inset 0 0 12px hsla(var(--th), 95%, var(--sglow-l), var(--sglow-a));   /* the inner glow, drawn above the film by .film::after (a box-shadow on the bubble would sit under the film); the states below change it */
  box-shadow: 0 6px 14px var(--soap-sh);
  transition: transform .28s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease, border-color .25s ease; }
.wb::before { content: none; }   /* the shine spot is the .spot span */
.wb .film { position: absolute; inset: -1.5px; z-index: 0; border-radius: inherit; overflow: hidden; pointer-events: none; }
.wb .film::before { content: ""; position: absolute; inset: 0; z-index: 1;
  background: radial-gradient(120% 120% at 30% 20%, rgba(255,255,255,var(--soap-hi)), rgba(255,255,255,var(--soap-lo)) 60%, transparent); }
.wb .film::after { content: ""; position: absolute; inset: 1.5px; z-index: 3; border-radius: inherit; box-shadow: var(--ig); transition: box-shadow .25s ease; }
/* The turning colour of the film and of the rim: a square a little wider than the bubble's diagonal (w + 2.4em is
   more than the diagonal of every bubble here), centred; rotating it
   is the same picture as turning the conic gradient's start. Both start together, so their colours stay in step. */
.wb .spin { position: absolute; left: 50%; top: 50%; width: calc(100% + 2.4em); aspect-ratio: 1; translate: -50% -50%; }
.film .spin { background: conic-gradient(from var(--ang), hsla(var(--th), 95%, 76%, var(--film-a)) 0 30%, hsla(calc(var(--th) + 90), 95%, 80%, calc(var(--film-a) * .6)) 50%, hsla(calc(var(--th) + 200), 90%, 82%, calc(var(--film-a) * .7)) 72%, hsla(var(--th), 95%, 76%, var(--film-a)) 92%); }
.rim .spin { background: conic-gradient(from var(--ang), hsla(var(--th), 90%, var(--srim-l), var(--srim-a)) 0 30%, hsla(calc(var(--th) + 90), 90%, calc(var(--srim-l) + 4%), calc(var(--srim-a) * .64)) 50%, hsla(calc(var(--th) + 200), 85%, calc(var(--srim-l) + 8%), calc(var(--srim-a) * .56)) 72%, hsla(var(--th), 90%, var(--srim-l), var(--srim-a)) 92%); }
.wb .spin { animation: spin 10s linear var(--fdl, 0s) infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* Off screen (.still, 26-shine.js), while a bubble is carried or while the card opens or closes (.calm, 26-shine.js;
   not the right / wrong bubble's glow or shake, which start just then), the float and the turning pause */
.tray.still .wb, body.carrying .wb, body.calm .wb:not(.shake):not(.right),
.tray.still .spin, body.carrying .spin, body.calm .spin { animation-play-state: paused !important; }   /* !important: the animation rules are as specific */
/* What follows the mouse: 26-shine.js writes the transform and opacity of these wrappers (at rest they are as here);
   the look is the <i> inside, so a wrapper has nothing to re-read when it moves. Each is its own layer (will-change),
   so moving it repaints nothing. */
.fg > i, .rh > i, .spot i, .glint > i { position: absolute; inset: 0; }
.film .fg { position: absolute; left: -10%; top: -45%; width: 120%; height: 190%; z-index: 2; opacity: 0; will-change: transform, opacity; }   /* inside, the side facing the mouse glows as it nears: an ellipse 60% x 95% of the bubble around that point of the edge (--faceg-* per theme) */
.fg > i { background: radial-gradient(closest-side, hsla(var(--th), 100%, var(--faceg-l), var(--faceg-a)), transparent); }
.wb .spot { position: absolute; left: .5em; top: .42em; width: .62em; height: .5em; pointer-events: none; transform: rotate(-14deg); will-change: transform; }   /* the shine: a fixed size and place (em), so it never stretches with a wide bubble */
.spot > i:first-child { background: radial-gradient(closest-side, rgba(255,255,255,var(--soap-gl)) 32%, rgba(255,255,255,calc(var(--soap-gl) * .55)) 62%, rgba(255,255,255,0)); }   /* a solid core (--soap-gl) */
.spot .pl { opacity: 0; }   /* brighter, with a wider core, as the mouse nears (its opacity = the nearness) */
.spot .pl i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--spot-plus) * .85)), rgba(255,255,255,var(--spot-plus)) 42%, rgba(255,255,255,calc(var(--spot-plus) * .55)) 52%, rgba(255,255,255,calc(var(--spot-plus) * .33)) 62%, rgba(255,255,255,calc(var(--spot-plus) * .12)) 81%, rgba(255,255,255,0)); }
/* The small second spot (as in the sibling games): a thin streak lying along the bottom-right curve, so a fixed size
   (em) rotated -45deg, its centre .47em in from both edges (on the corner's arc, just inside the rim). It moves the
   other way from the main spot, a third as far, like light seen through the far side, and brightens as the mouse
   nears (26-shine.js: its opacity from .8 to 1 of this brightest value). */
.wb .glint { position: absolute; right: calc(.47em - .17em); bottom: calc(.47em - .085em); width: .34em; height: .17em; pointer-events: none; opacity: .8; transform: rotate(-45deg); will-change: transform, opacity; }
.glint > i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--soap-gl) * .75)) 45%, rgba(255,255,255,0)); }
/* The rim: a ring (a mask cuts out its middle, and everything inside it), over the clear border */
.wb .rim { position: absolute; inset: -1.5px; border-radius: inherit; padding: 1.5px; pointer-events: none;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.rim .rh { position: absolute; left: -5%; top: -40%; width: 110%; height: 180%; opacity: 0; will-change: transform, opacity; }   /* the side facing the mouse lights up as it nears: an ellipse 55% x 90% of the rim (--rimhi-* per theme) */
.rh > i { background: radial-gradient(closest-side, hsla(var(--th), 100%, var(--rimhi-l), var(--rimhi-a)), transparent); }
.wb:focus-visible, .wb.sel, .tray:not(.locked) .wb.hov, .wb.drag { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 12px 22px var(--soap-sh2), 0 0 0 4px hsla(var(--th), 90%, 72%, .18); }
.wb.sel { outline-color: hsla(var(--th), 80%, 60%, .6); }
@media (hover: hover) { .tray:not(.locked) .wb:hover:not(.drag) { border-color: transparent; --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14)); box-shadow: 0 12px 22px var(--soap-sh2); } }
.wb.shake { border-color: transparent; --ig: inset 0 0 14px hsla(350, 95%, 70%, .4); box-shadow: 0 6px 14px var(--soap-sh); }
.wb.shake .rim { background: hsla(350, 85%, 62%, .8); }
.wb.shake .rim i { visibility: hidden; }   /* hidden, not stopped: it keeps turning in step with the film */
@media (prefers-reduced-motion: reduce) { .wb .spin { animation: none; } }
/* Touch screens: the film doesn't turn (when the turn repainted whole bubbles, 15 of them lagged a phone; 7 were
   smooth); each bubble keeps its own angle (--ang, 12-tray.js). Since 2026-11-22 the turn repaints nothing (a
   rotation), so it may come back: try it on a phone first (Verb Bubbles' ?fps panel, 95-perf.js). The float stays. */
@media (hover: none) { .wb .spin { animation: none; } }
/* The note: a little bubble of text over a caption (the cluster's cheat sheet) or a trap-map chip (an example) */
.note { position: fixed; z-index: 35; width: min(320px, calc(100vw - 20px)); padding: .65em .85em .75em; border-radius: 16px; font-size: .86rem; line-height: 1.4; color: var(--ink); background: var(--bg-a); border: 1.5px solid hsla(285, 70%, 62%, .6); box-shadow: 0 12px 30px var(--shadow); pointer-events: none; }
.note > b { display: block; margin-bottom: .3em; color: var(--underline); font-weight: 600; }
.note::after { content: ""; position: absolute; left: var(--ax, 50%); bottom: -7px; width: 12px; height: 12px; margin-left: -6px; background: inherit; border: inherit; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }
.note.below::after { bottom: auto; top: -7px; border-width: 1.5px 0 0 1.5px; }
.note.in { animation: pickin .2s cubic-bezier(.2,.9,.3,1.15); }
.nl { display: block; margin-top: .35em; }
.nl i { font-style: normal; font-weight: 600; margin-right: .45em; padding: .02em .5em .06em; border-radius: 999px; color: hsl(var(--h), 55%, var(--lab-l)); background: hsla(var(--h), 90%, 75%, .25); }
.nl small { display: block; margin-top: .1em; padding-left: .2em; font-size: .78rem; opacity: .7; font-style: italic; }
.nx { display: block; font-size: 1rem; font-weight: 500; }
.nx em { font-style: normal; font-weight: 600; color: var(--ok); background: var(--ok-bg); border-radius: 6px; padding: 0 .3em; }
.nt { display: block; margin-top: .2em; font-size: .84rem; opacity: .8; }
.note u.k { text-decoration: none; }
.nt u.k.p { color: var(--underline); font-weight: 700; }
/* Edge jitter (from Pronoun Bubbles / Verb Bubbles): while something rises on hover it gets an invisible strip below it
   reaching back past where its bottom edge was, so the cursor on that edge stays "inside" after the lift and it doesn't
   flicker up and down. Only while hovered: a strip that is always there catches the cursor below the edge, then rises
   with the element and loses it (the same jitter, lower down). The strip is the lift + 3px or more, so the springy
   overshoot of the lift never uncovers the edge. Something new that rises on hover needs the same. */
.score, .tile, .tourbtn, .pick { position: relative; }
@media (hover: hover) {
  .tray:not(.locked) .wb:hover:not(.drag)::after, .score:hover::after, .tile:hover::after, .tourbtn:not(.fresh):hover::after,
  .pick:hover::after { content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: -8px; }
  .score:hover::after, .tile:hover::after { bottom: -5px; }
  .tourbtn:not(.fresh):hover::after, .pick:hover::after { bottom: -4px; }
}
/* 50-card: Sentence card: gap, clue marks (u.k, u.ref, .sfx, .lit), translation, feedback and tip, Next, the line to the deciding word (.arc), the trap map (.pmap), flying particles, toast. */
/* Sentence card */
.card {
  padding-bottom: 46px !important;
  position: relative; max-width: 760px; margin: 22px auto 0; padding: 46px clamp(16px, 4vw, 40px) 20px;
  border-radius: 28px; text-align: center;
  background: var(--dock-bg); border: 1.5px solid var(--dock-line);
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: 0 10px 28px var(--shadow);
  transition: border-color .2s ease, box-shadow .25s ease, transform .28s cubic-bezier(.34,1.56,.64,1);
}
.card.hot { border-color: var(--underline); transform: scale(1.015); box-shadow: 0 14px 34px var(--shadow), 0 0 0 5px hsla(335,80%,65%,.22); }
.card-top { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pbtn { display: inline-flex; align-items: center; gap: 5px; font-size: .9rem; font-weight: 500; padding: .45em 1em; border-radius: 999px; border: 1.5px solid var(--dock-line); background: transparent; color: inherit; cursor: pointer; }
.pbtn:hover:not(:disabled) { background: var(--dock-line); }
.pbtn:disabled { opacity: .35; cursor: default; }
.pbtn:focus-visible, .tbtn:focus-visible, .favx:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.pbtn.on { background: var(--ink); color: var(--bg-a); border-color: var(--ink); }
.again { font-size: .75rem; font-weight: 500; padding: .25em .7em; border-radius: 999px; background: var(--bad-bg); }
#qa { animation: pin .3s ease-out; }
@keyframes pin { from { opacity: 0; transform: translateX(22px); } }
.sent { margin: 0; padding-top: 14px; font-size: clamp(1.45rem, 2.6vw + .9rem, 2.35rem); font-weight: 500; line-height: 1.5; text-wrap: balance; }
.gap {
  display: inline-block; min-width: 3.3em; margin: 0 .12em; padding: 0 .35em; line-height: 1.3;
  border: 2.5px dashed var(--underline); border-radius: .45em; cursor: pointer;
  transition: background-color .2s ease, transform .28s cubic-bezier(.34,1.56,.64,1);
}
.card.hot .gap, .gap.ready { background: hsla(335,80%,65%,.18); transform: scale(1.06); }
.gap.ok, .gap.fix { border-style: solid; border-color: transparent; background: var(--ok-bg); color: var(--ok); font-weight: 600; cursor: default; animation: merge .55s cubic-bezier(.34,1.56,.64,1); }
/* The letters that carry the meaning inside the pink word (de-LA, de-LE) stand out */
.sfx { font-weight: 700; color: var(--underline); }
.pt .lit, .fm .lit { font-style: italic; opacity: .85; }
.pt .lit { display: inline-block; max-width: 100%; }
.pt .lit b, .fm .lit b { font-weight: 600; color: var(--underline); }
.gapw { white-space: nowrap; }
.gap s { color: var(--bad); font-weight: 400; opacity: .8; margin-right: .3em; font-size: .8em; }
@keyframes merge { 0% { transform: scale(.8); } 55% { transform: scale(1.14); } 100% { transform: scale(1); } }
u.k { text-decoration: underline; text-decoration-color: var(--underline); text-decoration-thickness: .09em; text-underline-offset: .2em; text-decoration-skip-ink: none; }
/* In the translation (card and lists) clues are never underlined: time/subject clues are bold and colored,
   the deciding verb is bold pink and pulses, and a meaningful ending (-ria, -rá) gets a soft pink highlight */
.pt u.k, .fm u.k { text-decoration: none; font-weight: 600; color: var(--clue); }
.pt u.k.p, .fm u.k.p { color: var(--underline); font-weight: 700; }
.pt .sfx, .fm .sfx { background: hsla(335,85%,65%,.22); border-radius: .25em; padding: 0 .08em; }
.pt { margin: 12px 0 0; font-size: clamp(.95rem, .6vw + .85rem, 1.12rem); color: color-mix(in srgb, var(--ink) 68%, transparent); text-wrap: balance; }
.pt i { font-style: normal; font-size: .68em; font-weight: 600; letter-spacing: .08em; padding: .15em .5em; border-radius: 999px; border: 1px solid currentColor; margin-right: .5em; vertical-align: .12em; opacity: .8; }
.fb { margin-top: 14px; display: flex; flex-direction: column; justify-content: center; gap: 2px; font-size: 1.02rem; line-height: 1.35; }
.fb .v { font-weight: 600; }
.fb.ok .v { color: var(--ok); } .fb.bad .v { color: var(--bad); }
#hintlbl { display: inline-block; }
/* Header buttons (Guia, Favoritas, Vistas, Tutorial) show their names only where the whole dock fits on one line
   (from Pronoun Bubbles / Verb Bubbles); narrower, icons only (names in the tooltips) */
@media (min-width: 1100px) { .tourbtn span { display: inline-block; } }
@media (min-width: 601px) and (max-width: 1099px) { .tourbtn span { display: none; } .tourbtn { padding: .5em .6em; } }
.fb .tip { display: inline-block; align-self: center; padding: .2em .8em; border-radius: 1em; background: var(--dock-line); font-weight: 500; }
.fb > * { animation: pup .3s ease-out; }
@keyframes pup { from { opacity: 0; transform: translateY(10px); } }
.nextrow { padding-top: 12px; }
/* The answer area under the translation is closed while the student thinks, and opens when it has something to say */
.more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s cubic-bezier(.2,.8,.3,1); }
.more > div { min-height: 0; overflow: hidden; padding: 0 10px; }
.card.open .more { grid-template-rows: 1fr; }
.card.open .more > div { padding-bottom: 10px; }
/* Only meaningful endings pulse (-rá, -rei, -rão, -ria…); the deciding verb itself is bold pink and still */
u.k.p { display: inline; }
.pt .sfx, .lit .sfx { display: inline-block; animation: cue 1.7s ease-in-out infinite; }
@keyframes cue { 0%, 100% { transform: none; background-color: transparent; } 50% { transform: scale(1.1); background-color: hsla(335,85%,65%,.24); } }
.card.answered .sfx, .list .sfx { animation: none !important; }
.list .sfx { display: inline; }
.cta { font-size: 1rem; font-weight: 600; padding: .6em 1.5em; border: 0; border-radius: 999px; cursor: pointer; color: #fff; background: linear-gradient(135deg, hsl(330,85%,62%), hsl(265,80%,62%)); box-shadow: 0 4px 14px hsla(300,70%,55%,.4); transition: transform .25s cubic-bezier(.34,1.56,.64,1); }
.cta:hover { transform: scale(1.05); }
.cta:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.cta.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
.pf { position: fixed; z-index: 25; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at 30% 30%, #fff, hsla(var(--h),85%,75%,.55)); border: 1px solid hsla(var(--h),85%,68%,.85); animation: pfly .7s ease-out forwards; }
@keyframes pfly { from { transform: translate(-50%,-50%) scale(.3); opacity: .95; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1); opacity: 0; } }
.toast { position: fixed; left: 0; right: 0; top: 30%; z-index: 40; text-align: center; font-size: clamp(2.2rem, 8vw, 4rem); font-weight: 600; line-height: 1; color: var(--ink); pointer-events: none; text-shadow: 0 6px 24px var(--shadow); animation: cdpop 1.3s ease-out both; }
@keyframes cdpop { 0% { opacity: 0; transform: scale(.4); } 25% { opacity: 1; transform: scale(1.12); } 75% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.92); } }
/* The word that decides the preposition: [=…] is underlined like a clue; after the answer a curved line runs from the gap
   to it, with the reason on it (dia, hora, destino…), and the word lights up */
u.k.ref { text-decoration-style: dotted; }
.ref.hit { background: hsla(335,85%,65%,.2); border-radius: .2em; box-shadow: 0 0 0 .12em hsla(335,85%,65%,.2); transition: background-color .3s ease; }
/* Spot the mistake (19-spot.js): the bonus card takes the place of the sentence card and the tray. A list of complete
   sentences, each a button with a box: the student marks the ones that are WRONG (a red ✗), then Check. After the check a
   row is green (judged right) or red (misjudged), a wrong preposition is struck out with the right one next to it. */
body.proofing #card, body.proofing .tray { display: none; }
.card.proof { padding: 18px clamp(12px, 3vw, 28px) 22px !important; text-align: left; }
.card.proof[hidden] { display: none; }
.pr-head { display: flex; justify-content: center; margin-bottom: 12px; }
.spottag { color: #fff; font-weight: 600; font-size: .8rem; padding: .3em .9em; background: linear-gradient(135deg, #ff5ea8, #c04dff 55%, #8a5cff); box-shadow: 0 2px 8px var(--shadow); white-space: nowrap; }
.pr-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.pr-row { appearance: none; display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 10px 14px; text-align: left; font-family: inherit; color: var(--ink); cursor: pointer;
  border-radius: 18px; border: 1.5px solid var(--dock-line); background: var(--fill-mid, transparent); touch-action: manipulation;
  transition: border-color .2s ease, background-color .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1); }
.pr-row:hover:not(:disabled) { transform: translateY(-1px); border-color: color-mix(in srgb, var(--bad) 55%, transparent); }
.pr-row:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
.pr-row:disabled { cursor: default; color: var(--ink); }
.pr-box { flex: none; display: grid; place-items: center; width: 1.7rem; height: 1.7rem; margin-top: .15rem; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--ink) 40%, transparent); font-size: 1rem; font-weight: 600; line-height: 1; color: #fff; transition: background-color .2s ease, border-color .2s ease; }
.pr-box.pop { animation: starpop .4s cubic-bezier(.34,1.56,.64,1); }
.pr-row.sel { border-color: var(--bad); background: var(--bad-bg); }
.pr-row.sel .pr-box { background: hsl(350,70%,52%); border-color: hsl(350,70%,52%); }
.pr-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 auto; }
.pr-en { font-size: clamp(1.08rem, 1vw + .9rem, 1.4rem); font-weight: 500; line-height: 1.3; }
.pr-en .pw { font-weight: 600; text-decoration: underline dotted; text-decoration-thickness: 2px; text-underline-offset: .22em; text-decoration-color: var(--underline); }
.pr-pt { font-size: .92rem; color: color-mix(in srgb, var(--ink) 68%, transparent); }
.pr-tip { align-self: flex-start; margin-top: 4px; padding: .15em .7em; border-radius: 1em; background: var(--dock-line); font-size: .86rem; font-weight: 500; }
/* the instruction above the card: its key word in bold red capitals */
.hint.spot { font-size: 1.05rem; color: var(--ink); opacity: 1; }
.hint .hbad { font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: hsl(350,85%,50%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hint .hbad { color: hsl(350,100%,68%); } }
:root[data-theme="dark"] .hint .hbad { color: hsl(350,100%,68%); }
/* after the check */
.pr-row.hit { border-color: var(--ok); background: var(--ok-bg); }
.pr-row.miss { border-color: var(--bad); background: var(--bad-bg); }
.pr-row.hit:not(.sel) { background: color-mix(in srgb, var(--ok-bg) 45%, transparent); }
.pr-mark { flex: none; align-self: center; margin-left: auto; display: grid; place-items: center; width: 1.6rem; height: 1.6rem; border-radius: 50%; font-size: .95rem; font-weight: 600; line-height: 1; color: #fff; background: hsl(150,60%,40%); }
.pr-row.miss .pr-mark { background: hsl(350,70%,52%); }
.pr-row.right .pw { color: var(--ok); text-decoration: none; }
.pr-en s { color: var(--bad); font-weight: 400; opacity: .85; margin-right: .3em; }
.pr-en .pw.fix { color: var(--ok); text-decoration: none; }
.proof .fb { margin-top: 12px; text-align: center; }
.proof .nextrow { display: flex; justify-content: center; }
.proof .cta:disabled { opacity: .4; cursor: default; box-shadow: none; }
.proof .cta[hidden] { display: none; }
@media (max-width: 600px) { .card.proof { margin-top: 10px; } .pr-row { padding: 9px 11px; gap: 10px; } }
@media (prefers-reduced-motion: reduce) { .pr-row, .pr-box { transition: none; animation: none; } }
/* The gap opens room for the line on its own line of text (arcRoom in 18-arc.js): the margin eases in after an answer */
.gap.ease { transition: background-color .2s ease, transform .28s cubic-bezier(.34,1.56,.64,1), margin .22s ease; }
.arc { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.arc svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
.arc path { fill: none; stroke: var(--underline); stroke-width: 2.5; stroke-linecap: round; opacity: .85; }
.arc circle { fill: var(--underline); }
.arc.anim circle.end { animation: arcdot .3s .45s cubic-bezier(.34,1.56,.64,1) backwards; transform-box: fill-box; transform-origin: center; }
.arc-lbl { position: absolute; transform: translate(-50%, -50%); padding: .1em .6em .15em; border-radius: 999px; font-size: .8rem; font-weight: 600; line-height: 1.2; white-space: nowrap; color: #fff; background: var(--underline); box-shadow: 0 3px 10px var(--shadow); }
.arc.anim .arc-lbl { animation: arclbl .35s .3s cubic-bezier(.34,1.56,.64,1) backwards; }
@keyframes arcdot { from { transform: scale(0); } }
@keyframes arclbl { from { opacity: 0; transform: translate(-50%, -50%) scale(.5); } }
.fb.bad .v { font-weight: 500; }
/* Touch screens (phones, tablets): the card's glass blur goes (over the soft background it barely shows, and it made
   every change inside the card, the arrow or the answer, repaint the blur), and the answer area opens at once instead
   of growing (growing moved the whole chart under it every frame); its lines still slide in */
@media (max-width: 640px), (hover: none) {
  .card { -webkit-backdrop-filter: none; backdrop-filter: none; }
  .more { transition: none; }
}
/* The trap map under the rule: the Portuguese word (caption) and every preposition it becomes, as chips in their cluster's
   color; the right one filled. A chip is a button: hover or tap shows an example in the note. */
.pmap { display: flex; flex-direction: column; align-items: center; gap: 5px; margin-top: 8px; }
.pm-cap { font-size: .8rem; font-weight: 500; opacity: .75; }
.pm-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
.pm-w { appearance: none; cursor: pointer; font: inherit; font-size: .86rem; font-weight: 500; line-height: 1.1; padding: .22em .7em .26em; border-radius: 999px; color: hsl(var(--h), 55%, var(--lab-l)); background: hsla(var(--h), 90%, 75%, .14); border: 1.5px dashed hsla(var(--h), 70%, 60%, .55); transition: transform .25s cubic-bezier(.34,1.56,.64,1), background-color .2s ease; }
.pm-w:hover, .pm-w:focus-visible { transform: translateY(-2px); background: hsla(var(--h), 90%, 75%, .3); outline: none; }
.pm-w.on { color: #fff; font-weight: 600; border-style: solid; border-color: hsl(var(--h), 70%, 48%); background: hsl(var(--h), 70%, 52%); box-shadow: 0 3px 10px hsla(var(--h), 70%, 45%, .35); }
.fb > .pmap { animation-delay: .12s; animation-fill-mode: backwards; }
.arc-lbl { max-width: 60vw; overflow: hidden; text-overflow: ellipsis; }
/* 60-modals: Pop-up modals (.favmodal / .favcard), sentence lists, Review tabs, phone layout of the second header row. */
/* Modals */
/* Windows: a translucent card over the blurred page, as in Linking Words */
.favmodal { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(20,20,40,.35); -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px); overscroll-behavior: contain; }
.favmodal.show { display: flex; animation: fadein .2s ease; }
@keyframes fadein { from { opacity: 0; } }
@keyframes cardin { from { opacity: 0; transform: scale(.9) translateY(10px); } }
.favcard { width: 100%; max-width: 560px; max-height: 84vh; overflow: auto; overflow-x: hidden; padding: 16px 18px 18px; border-radius: 28px; background: var(--bg-a); background: color-mix(in srgb, var(--bg-a) 72%, transparent); color: var(--ink); border: 1px solid var(--dock-line); box-shadow: 0 20px 50px rgba(0,0,0,.28); animation: cardin .3s cubic-bezier(.34,1.56,.64,1); }
.favhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.favhead h2 { margin: 0; font-size: 1.3rem; font-weight: 600; }
.favhead .hr { display: flex; align-items: center; gap: 8px; }
.favx { border: 0; background: transparent; color: inherit; font-size: 1.9rem; line-height: 1; cursor: pointer; opacity: .7; padding: 0 4px; border-radius: 50%; }
.list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.list li { border: 2.5px solid hsla(var(--h),80%,62%,.85); background: hsla(var(--h),90%,80%,.2); border-radius: 20px; padding: 10px 12px; min-width: 0; overflow-wrap: anywhere; }
.list li.fempty { border: 0; background: none; text-align: center; opacity: .75; padding: 18px 6px; }
.ft { font-weight: 500; font-size: 1.05rem; }
.ft b { font-weight: 600; color: var(--ok); background: var(--ok-bg); border-radius: 6px; padding: 0 .3em; }
.fm { opacity: .75; font-size: .92rem; margin-top: 2px; }
.rtabs { display: flex; flex-wrap: nowrap; gap: 6px; margin: 0 0 4px; overflow-x: auto; scrollbar-width: none; }
.rtabs::-webkit-scrollbar { display: none; }
.rtabs .pbtn { flex: none; font-size: .8rem; padding: .38em .75em; white-space: nowrap; }
.rtabs .pbtn.on { background: var(--ink); color: var(--bg-a); border-color: var(--ink); }
.rtabs .pbtn.on span { opacity: 1; }
/* Phones: the second header row (level, favorites, seen, tutorial, sound, language, color) stays on one line, as in Verb Bubbles */
@media (max-width: 600px) {
  .dock { column-gap: 2px; }
  .dock .seg:not(.focus) { gap: 0; }
  #snd { padding: .45em .45em; }
  .seg.level button { padding: .45em .5em; font-size: .78rem; }
  .pick { padding: .24em .36em .24em .24em; gap: .2em; }
  .swwrap { padding: 0 2px; }
  .swbtn { width: 25px; height: 25px; }
  .tourbtn { padding: .4em; }
}
/* While a window (Guia, Favoritas, Vistas, Streaks, the end card) or the tutorial is open, the page behind doesn't
   scroll (from Pronoun Bubbles / Verb Bubbles, 2026-11-22): the wheel or a finger scrolls only the window's own card. Scripts can still
   scroll the page (the tutorial moves it to what it points at). The page shows no scrollbar, so nothing shifts. */
html:has(.favmodal.show), html:has(.tour:not([hidden])) { overflow: hidden; overscroll-behavior: none; }
/* 70-review: Review / favorite stars (header, card, list rows), turtle button, end-of-round summary, phone sizes, reduced motion. */
/* Favorites: a star in the header, one in the sentence card's bottom-right corner, and one on each saved sentence */
/* One header button for review and favorites: a history arrow with a star inside; the star turns gold once there are favorites */
#favbtn .rstar { fill: none; transition: fill .3s ease, stroke .3s ease; }
#favbtn.has .rstar { fill: #f5a300; stroke: #f5a300; }
.saygrp { display: inline-flex; align-items: center; gap: 6px; }
.slowbtn { padding: .38em .6em; font-size: .95rem; line-height: 1; opacity: .55; filter: grayscale(1); transition: opacity .2s ease, filter .2s ease, background-color .2s ease, border-color .2s ease; }
.slowbtn[aria-pressed="true"] { opacity: 1; filter: none; border-color: hsl(150,55%,45%); background: hsla(150,70%,55%,.18); }
.slowbtn.tour-hl { filter: none; }
.slowbtn.pop { animation: starpop .45s cubic-bezier(.34,1.56,.64,1); }
.cardstar { position: absolute; right: 12px; bottom: 10px; z-index: 2; display: grid; place-items: center; width: 38px; height: 38px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--ink); opacity: .45; cursor: pointer; transition: opacity .2s ease, transform .3s cubic-bezier(.34,1.56,.64,1), background-color .2s ease; }
.cardstar:hover { opacity: .9; background: var(--dock-line); }
/* Before an answer the translation is the card's last line and would end right beside the star (38px tall, 10px up):
   the card keeps room for the star under it. Once the feedback opens (.open), Next sits there and the star beside it. */
body:not(.speed) #card:not(.open) { padding-bottom: 56px !important; }
.cardstar svg { fill: none; }
.cardstar[aria-pressed="true"] { opacity: 1; color: #f5a300; }
.cardstar[aria-pressed="true"] svg { fill: #f5a300; }
.cardstar:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }
.cardstar.pop, #favbtn.pop { animation: starpop .45s cubic-bezier(.34,1.56,.64,1); }
@keyframes starpop { 0% { transform: scale(1); } 35% { transform: scale(1.45) rotate(-12deg); } 100% { transform: scale(1); } }
.list li { position: relative; }
/* A level chip on a Favoritas / Vistas row: its level's gradient, as on the level pill (from Pronoun Bubbles) */
.list .lvchip { display: inline-block; margin-bottom: 4px; padding: .28em .7em; border-radius: 999px; font-size: .6rem; font-weight: 600; letter-spacing: .06em; line-height: 1.2; color: #fff; white-space: nowrap;
  background: linear-gradient(135deg, var(--lv), var(--lv2)); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); text-shadow: 0 1px 1px rgba(0,0,0,.18); }

/* Mastery meters at the top of the Review panel: one bar per job, in the job's color */

.gd-lang button:hover { opacity: 1; background: var(--dock-line); }

/* a preposition, in its cluster's color (--h) */
.gd-w { display: inline-block; padding: .16em .62em .2em; border-radius: 999px; font-size: .86rem; font-weight: 600; line-height: 1.15; white-space: nowrap; color: hsl(var(--h), 55%, var(--lab-l)); background: hsla(var(--h), 90%, 75%, .16); border: 1.5px solid hsla(var(--h), 70%, 60%, .55); }

.gd-tip b { color: var(--underline); }
.gd-ask { padding: 12px; border-radius: 20px; background: var(--fill-mid); border: 1px solid var(--dock-line); }
.gd-h { margin: 0 0 10px 4px; font-size: .72rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; opacity: .6; }
.gd-q { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px 14px; padding: 10px 12px; border-radius: 14px; background: var(--bg-a); border: 1px solid var(--dock-line); }
.gd-q + .gd-q { margin-top: 8px; }

.gd-hint { display: block; margin-top: 6px; font-size: .84rem; line-height: 1.4; }
.gd-hl { display: block; padding-left: 10px; border-left: 2px solid var(--dock-line); }
.gd-hl + .gd-hl { margin-top: 5px; }
.gd-cue { opacity: .72; }
.gd-harr { opacity: .45; }
.gd-ex { font-weight: 600; }
.gd-ans { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 5px; }

@media (max-width: 560px) { .gd-q { grid-template-columns: 1fr; } }
/* section links */
.gd-nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 12px; }
.gd-navb { appearance: none; cursor: pointer; font-family: inherit; font-size: .84rem; font-weight: 600; padding: .4em .95em; border-radius: 999px; color: var(--ink); background: transparent; border: 1.5px solid var(--dock-line); transition: transform .25s cubic-bezier(.34,1.56,.64,1), background-color .2s ease; }
.gd-navb:hover { transform: translateY(-2px); background: var(--dock-line); }
.gd-navb:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }

#guidebody section { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--dock-line); scroll-margin-top: 10px; }

.gd-lead { margin: 4px 0 8px; font-size: .88rem; line-height: 1.4; opacity: .75; }

.gd-u { margin-top: 8px; border-radius: 18px; background: var(--fill-mid); border: 1.5px solid hsla(var(--h), 70%, var(--rim-l), .6); scroll-margin-top: 10px; }
.gd-u > summary, .gd-m > summary { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; list-style: none; border-radius: 16px; transition: background-color .2s ease; }

.gd-u > summary::after, .gd-m > summary::after { content: ""; flex: none; width: 8px; height: 8px; margin: 0 4px 3px auto; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; opacity: .6; transform: rotate(45deg); transition: transform .25s ease; }
.gd-u[open] > summary::after, .gd-m[open] > summary::after { transform: rotate(-135deg) translate(-3px, -3px); }
.gd-u > summary:hover, .gd-m > summary:hover { background: hsla(var(--h), 85%, 72%, .12); }
.gd-u > summary:focus-visible, .gd-m > summary:focus-visible { outline: 2px solid var(--underline); outline-offset: 2px; }
.gd-u h4 { margin: 0; font-size: 1.05rem; font-weight: 600; color: hsl(var(--h), 60%, var(--lab-l)); }
.gd-u[open] { padding-bottom: 12px; }
.gd-u[open] > :not(summary) { margin-left: 14px; margin-right: 14px; }
.gd-ws { display: flex; flex-wrap: wrap; gap: 4px; }
.gd-cap { font-size: .8rem; font-weight: 500; opacity: .7; }
/* examples: a preposition chip, the English sentence, the translation */
.gd-exs, .gd-xl, .gd-rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.gd-exs li { display: grid; grid-template-columns: 4.4em 1fr; align-items: start; gap: 10px; }
.gd-exs li > .gd-w { justify-self: start; margin-top: .1em; }
.gd-en { display: block; font-size: 1rem; font-weight: 500; line-height: 1.35; }
.gd-pt { display: block; margin: 0; font-size: .88rem; line-height: 1.35; color: color-mix(in srgb, var(--ink) 68%, transparent); }
/* a group: each word, its meaning, its rules with the pink line's tag */
.gd-word + .gd-word { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--dock-line); }
.gd-wh { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0 0 8px; font-size: .92rem; }
.gd-rules li { display: grid; grid-template-columns: 8.2em 1fr; align-items: start; gap: 10px; font-size: .92rem; line-height: 1.4; }
.gd-tag { justify-self: start; padding: .1em .6em .15em; border-radius: 999px; font-size: .78rem; font-weight: 600; line-height: 1.25; color: #fff; background: var(--underline); }
@media (max-width: 560px) { .gd-rules li { grid-template-columns: 1fr; gap: 3px; } .gd-exs li { grid-template-columns: 1fr; gap: 3px; } }
/* expressions */

.cd-card { width: min(380px, 100%); padding: 1.2rem 1.3rem 1.4rem; border-radius: 1.6rem; text-align: center; color: var(--ink); background: var(--bg-a); border: 1px solid var(--dock-line); box-shadow: 0 22px 50px rgba(0,0,0,.3); animation: cardin .3s cubic-bezier(.34,1.56,.64,1); }

/* 90-scrollbar: Scrollbars copied from Verb Bubbles (../bedomodal, 80-scrollbar.css): in the cards that scroll
   (Favoritas / Vistas, end of round, Streaks, tutorial) a thin glossy pill with the pink-to-purple gradient on a clear
   track; the page itself has none. Chrome / Edge / Safari use the ::-webkit-scrollbar parts; Firefox only takes

::-webkit-scrollbar { width: 12px; height: 12px; }

::-webkit-scrollbar-thumb {

  box-shadow: inset 0 1px 0 rgba(255,255,255,.45);

html { scrollbar-width: none; }

gente joga futebol aos domingos.","wrong":"We play soccer in Sundays.","right":"We play soccer on Sundays.","why":"Dia da semana e data pedem on. In é para mês, ano e parte do dia."},{"pt":"Eu estou no ônibus.","wrong":"I'm in the bus.","right":"I'm on the bus.","why":"Ônibus, trem e avião (dá para andar lá dentro) pedem on. Carro e táxi pedem in."},{"pt":"Eu estudo à noite.","wrong":"I study in the night.","right":"I study at night.","why":"in the morning, in the afternoon, in the evening, mas at night."},{"pt":"Eu sou do Brasil.","wrong":"I'm of Brazil.","right":"I'm from Brazil.","why":"De onde uma coisa vem pede from. Of é para parte ou tipo de alguma coisa."},{"pt":"A gente foi de ônibus.","wrong":"We went of bus.","right":"We went by bus.","why":"Meio de transporte pede by, sem the: by bus, by car, by plane."},{"pt":"O que você quer de jantar?","wrong":"What do you want of dinner?","right":"What do you want for dinner?","why":"Refeição pede for: for breakfast, for lunch, for dinner, for dessert."},{"pt":"Depende do tempo.","wrong":"It depends of the weather.","right":"It depends on the weather.","why":"depender de = depend on. Nunca of."},{"pt":"Minha irmã é casada com um médico.","wrong":"My sister is married with a doctor.","right":"My sister is married to a doctor.","why":"casado com = married to. Nunca with."},{"pt":"Eu escuto música no carro.","wrong":"I listen music in the car.","right":"I listen to music in the car.","why":"Em português não tem preposição; em inglês, listen sempre pede to."},{"pt":"Eu estou esperando o ônibus.","wrong":"I'm waiting the bus.","right":"I'm waiting for the bus.","why":"Em português não tem preposição; em inglês, wait sempre pede for."},{"pt":"Eu penso em você todo dia.","wrong":"I think in you every day.","right":"I think about you every day.","why":"pensar em = think about. In é para dentro de um lugar."},{"pt":"Obrigada pelas flores!","wrong":"Thank you by the flowers!","right":"Thank you for the flowers!","why":"por / pelo nem sempre é by: obrigado por = thank you for."}],"curTitle":"Para os curiosos","curious":[["on the weekend / at the weekend","Os americanos dizem on the weekend; os britânicos, at the weekend. As duas estão certas, por isso o jogo evita essa frase."],["jump on / jump onto · get in / get into","Na fala do dia a dia, in e on aparecem no lugar de into e onto (jump on the bed, get in the car). O jogo aceita as duas nessas frases e diz qual é a mais clara."],["at school / in school · at the park / in the park","Com lugares como school, the park, the beach ou the airport, at e in são possíveis (at = o ponto onde você está; in = lá dentro). O jogo evita essas frases."],["think about / think of · dream about / dream of","Quase sempre querem dizer a mesma coisa. O jogo usa about."],["made of / made from","made of: ainda dá para ver o material (a table made of wood). made from: o material mudou (wine is made from grapes)."],["by bus / by the bus","O meio vem sem the: by bus, by car, by email. Com the, by quer dizer perto: by the bus = ao lado do ônibus."]]},"tour":{"ui":{"back":"Voltar","next":"Próximo","show":"Mostre-me","play":"Vamos jogar","step":"Passo {i} de {n}","tutorial":"Tutorial"},"steps":{"welcome":["Bem-vindo ao Preposition Bubbles!","Em cada frase falta uma preposição: <b>to<\/b>, <b>for<\/b>, <b>in<\/b>, <b>on<\/b>, <b>at<\/b>… Em português, uma palavra só (<i>para<\/i>, <i>em<\/i>, <i>de<\/i>) vira várias em inglês. Aqui você aprende a escolher. Este tour leva mais ou menos um minuto."],"read":["Leia a frase","A preposição que falta vai no espaço em branco. A <b>tradução<\/b> logo abaixo mostra o que a frase quer dizer."],"clues":["Siga as pistas","A palavra <b>sublinhada<\/b> é a que decide a preposição: um dia, uma hora, um lugar… Na tradução, a palavra em <b>rosa<\/b> é a que a gente traduz ao pé da letra. Cuidado com ela: é ali que mora a armadilha."],"tray":["Os grupos","As bolhas vêm em <b>grupos<\/b> que o português mistura: <b>to / for<\/b> (para), <b>in / on / at<\/b> (em, no, na), <b>of / from<\/b> (de), no A2 <b>into / onto<\/b>, e ainda <b>about<\/b> e <b>by<\/b>. Toque no nome de um grupo para ver o que cada palavra quer dizer."],"fill":["Preencha o espaço","<b>Arraste<\/b> uma bolha até o espaço ou dê um <b>clique duplo<\/b> nela. No celular, toque <b>duas vezes<\/b> nela, ou toque nela e depois no espaço. Veja:"],"learn":["Aprenda com cada resposta","Uma <b>linha<\/b> liga a preposição à palavra que decide, com o motivo escrito nela (dia, hora, destino…). Embaixo vem a <b>regra<\/b>, e <b>Listen<\/b> lê a frase em voz alta (a <b>🐢<\/b> deixa a voz mais lenta). Se errar, você vê o porquê, e a frase volta mais tarde na partida."],"map":["Uma palavra, várias preposições","Este é o <b>mapa da armadilha<\/b>: a palavra rosa do português e todas as preposições em que ela se transforma nas frases do jogo. Toque numa delas para ver um exemplo."],"hint":["Travou? Peça uma dica","O botão <b>{hint}<\/b> deixa aceso só o grupo certo e lembra o que cada palavra dele quer dizer."],"spot":["Bônus: caça ao erro","Duas vezes por partida aparece uma lista de frases <b>já completas<\/b>: algumas estão certas, outras têm a preposição errada. Toque nas que estão <b>erradas<\/b> e depois em <b>Conferir<\/b>. Cada lista vale como uma frase. Veja:"],"score":["Mantenha a sequência","O contador mostra seus acertos <b>seguidos<\/b> e o seu recorde; toque nele para ver suas sequências. O <b>🔥<\/b> conta os dias seguidos em que você praticou. Em <b>new game<\/b> você escolhe uma partida nova ou o <b>desafio de 60 segundos<\/b>."],"focus":["Escolha o que praticar","Misture tudo (<b>ALL<\/b>), pratique um grupo só (<b>TO · FOR<\/b>, <b>IN · ON · AT<\/b>…) ou tudo em que o <b>de<\/b> se transforma (<b>DE → ?<\/b>): of, from, about, by e, de vez em quando, for e in. Em <b>INTO · ONTO<\/b> o <b>em<\/b> (no, na) também traz in, on, at e to. Os outros grupos saem de cena."],"level":["Seu nível","<b>A1<\/b>: os usos mais comuns de to, for, in, on, at, of, from, about e by. <b>A2<\/b> acrescenta <b>into / onto<\/b> e usos novos: <i>depend on, good at, by Friday, for ten years<\/i>…"],"review":["Frases vistas","Aqui ficam as <b>últimas 30 frases<\/b> que você respondeu (<b>{recent}<\/b>) e as que você errou (<b>{missed}<\/b>). No topo, uma barra por grupo mostra quantas frases você já acerta de primeira. Toque em <b>{practice}<\/b> para uma partida com as frases da aba aberta."],"fav":["Guarde suas favoritas","Toque na <b>estrela<\/b> no canto da frase para guardá-la. Suas favoritas ficam no botão <b>{fav}<\/b> lá em cima, onde você também pode praticá-las."],"lang":["Seu idioma","Escolha aqui a sua língua materna. As traduções e este tutorial aparecem nela."],"sound":["Do seu jeito","Dois controles de <b>volume<\/b>: um para os efeitos sonoros, outro para a voz. Toque no alto-falante de novo para silenciar tudo. Escolha também uma <b>cor de fundo<\/b>. Este tour fica sempre a um toque, em <b>TUTORIAL<\/b>."],"final":["Tudo pronto!","Leia a frase, ache a palavra que decide e escolha a preposição certa. Desconfie da palavra rosa! Boa sorte!"]}}}},"tour":{"ui":{"back":"Back","next":"Next","show":"Show me","play":"Let's play","step":"Step {i} of {n}","tutorial":"Tutorial"},"steps":{"welcome":["Welcome to Preposition Bubbles!","Each sentence is missing a preposition: <b>to<\/b>, <b>for<\/b>, <b>in<\/b>, <b>on<\/b>, <b>at<\/b>… In your language, one little word can become several in English. Here you learn to choose. This tour takes about a minute."],"read":["Read the sentence","The missing preposition goes in the blank. The <b>translation<\/b> just below shows what the whole sentence means."],"clues":["Follow the clues","The <b>underlined<\/b> word decides the preposition: a day, a time, a place… In the translation, the <b>pink<\/b> word is the one people translate word for word. Watch out for it: that's where the trap is."],"tray":["The groups","The bubbles come in <b>groups<\/b> that are easy to mix up: <b>to / for<\/b>, <b>in / on / at<\/b>, <b>of / from<\/b>, at A2 <b>into / onto<\/b>, and also <b>about<\/b> and <b>by<\/b>. Tap the name of a group to see what each word means."],"fill":["Fill the blank","<b>Drag<\/b> a bubble to the blank or <b>double-click<\/b> it. On a phone, tap it <b>twice<\/b>, or tap it and then tap the blank. Watch:"],"learn":["Learn from every answer","A <b>line<\/b> links the preposition to the word that decides it, with the reason on it (day, time, place…). Below it you see the <b>rule<\/b>, and <b>Listen<\/b> reads the sentence aloud (the <b>🐢<\/b> makes the voice slower). If you get it wrong, you see why, and the sentence comes back later in the round."],"map":["One word, many prepositions","This is the <b>trap map<\/b>: the pink word from the translation and every preposition it becomes in this game's sentences. Tap one of them to see an example."],"hint":["Stuck? Get a hint","The <b>{hint}<\/b> button keeps only the right group lit and reminds you what each of its words means."],"spot":["Bonus: spot the mistake","Twice a round you get a list of <b>complete<\/b> sentences: some are right, some have the wrong preposition. Tap the ones that are <b>wrong<\/b>, then tap <b>Conferir<\/b>. Each list counts as one sentence. Watch:"],"score":["Keep your streak","The counter shows your correct answers <b>in a row<\/b> and your best; tap it to see your streaks. The <b>🔥<\/b> counts the days in a row you practiced. Under <b>new game<\/b> you can start a new game or the <b>60-second challenge<\/b>."],"focus":["Choose what to practice","Mix everything (<b>ALL<\/b>), practice one group (<b>TO · FOR<\/b>, <b>IN · ON · AT<\/b>…) or everything Portuguese <b>de<\/b> turns into (<b>DE → ?<\/b>): of, from, about, by and, now and then, for and in. In <b>INTO · ONTO<\/b>, Portuguese <b>em<\/b> (no, na) brings in, on, at and to as well. The other groups step aside."],"level":["Your level","<b>A1<\/b>: the most common uses of to, for, in, on, at, of, from, about and by. <b>A2<\/b> adds <b>into / onto<\/b> and new uses: <i>depend on, good at, by Friday, for ten years<\/i>…"],"review":["Sentences you have seen","Here are the <b>last 30 sentences<\/b> you answered (<b>{recent}<\/b>) and the ones you missed (<b>{missed}<\/b>). On top, a bar per group shows how many sentences you get right on the first try. Tap <b>{practice}<\/b> for a round with the sentences of the open tab."],"fav":["Save your favorites","Tap the <b>star<\/b> in the corner of a sentence to save it. Your favorites are in the <b>{fav}<\/b> button up top, where you can practice them too."],"lang":["Your language","Choose your native language here. The translations use it."],"sound":["Make it yours","Two <b>volume<\/b> sliders: one for the sound effects, one for the voice. Tap the speaker again to mute everything. Pick a <b>background color<\/b> too. This tour is always one tap away, under <b>TUTORIAL<\/b>."],"final":["All set!","Read the sentence, find the word that decides, and put the right preposition in the blank. Don't trust the pink word! Good luck!"]}},"guide":{"btn":"Guide","title":"Preposition guide","tip":"One Portuguese word becomes <b>several<\/b> in English: <b>em<\/b> can be in, on or at; <b>de<\/b> can be of, from, about, by… Don't translate the little word: look at <b>what comes after it<\/b>.","askTitle":"Ask yourself, in this order","askExpr":"expression","ask":[{"q":"Is it a set expression?","hint":"wait for, listen to, afraid of, by mistake: the verb or the adjective already picks the preposition. These you learn by heart.","go":"expr"},{"q":"Is it a time, a day or a month?","hint":"clock time → at 8:00 · day of the week or date → on Monday, on May 5 · month, year, part of the day → in July, in the morning","ans":["at","on","in"]},{"q":"Is it a place, with no movement?","hint":"a point or an event → at home, at the door, at a party · a surface → on the table · inside, a city, a country → in the box, in Brazil","ans":["at","on","in"]},{"q":"Is there movement?","hint":"where you go → go to school · going inside → walk into the room · going on top → jump onto the table · where it comes from → from Brazil","ans":["to","into","onto","from"]},{"q":"Is it for someone or for something?","hint":"who receives it (give, send, show) → give it to Ana · who gets it, what for, a meal → a gift for you, for dinner","ans":["to","for"]},{"q":"Is it “de” in Portuguese?","hint":"part or type of → a cup of coffee, the end of the movie · origin or who gave it → from Brazil, a gift from Ana · topic → a movie about dogs · author or means → by Tarsila, by bus","ans":["of","from","about","by"]}],"nav":{"map":"em · de · para…","groups":"Groups","expr":"Expressions","mis":"Common mistakes"},"mapTitle":"One word, several prepositions","mapLead":"What each little Portuguese word becomes in this game's sentences. Tap a word to see an example of each.","groupsTitle":"Each group, word by word","groupsLead":"The tags are the ones on the pink line after you answer.","exprTitle":"Expressions to learn by heart","exprLead":"The verb or the adjective picks the preposition. Tap a preposition to see its list.","misTitle":"Most common mistakes","misLead":"Word-for-word translations that don't work. Tap one to see the right sentence.","mistakes":[{"pt":"A gente joga futebol aos domingos.","wrong":"We play soccer in Sundays.","right":"We play soccer on Sundays.","why":"Days of the week and dates take on. In is for months, years and parts of the day."},{"pt":"Eu estou no ônibus.","wrong":"I'm in the bus.","right":"I'm on the bus.","why":"Buses, trains and planes (you can walk inside) take on. Cars and taxis take in."},{"pt":"Eu estudo à noite.","wrong":"I study in the night.","right":"I study at night.","why":"in the morning, in the afternoon, in the evening, but at night."},{"pt":"Eu sou do Brasil.","wrong":"I'm of Brazil.","right":"I'm from Brazil.","why":"Where something comes from takes from. Of is for a part or a type of something."},{"pt":"A gente foi de ônibus.","wrong":"We went of bus.","right":"We went by bus.","why":"How you travel takes by, with no the: by bus, by car, by plane."},{"pt":"O que você quer de jantar?","wrong":"What do you want of dinner?","right":"What do you want for dinner?","why":"A meal takes for: for breakfast, for lunch, for dinner, for dessert."},{"pt":"Depende do tempo.","wrong":"It depends of the weather.","right":"It depends on the weather.","why":"depender de = depend on. Never of."},{"pt":"Minha irmã é casada com um médico.","wrong":"My sister is married with a doctor.","right":"My sister is married to a doctor.","why":"casado com = married to. Never with."},{"pt":"Eu escuto música no carro.","wrong":"I listen music in the car.","right":"I listen to music in the car.","why":"Portuguese has no preposition here; in English, listen always takes to."},{"pt":"Eu estou esperando o ônibus.","wrong":"I'm waiting the bus.","right":"I'm waiting for the bus.","why":"Portuguese has no preposition here; in English, wait always takes for."},{"pt":"Eu penso em você todo dia.","wrong":"I think in you every day.","right":"I think about you every day.","why":"pensar em = think about. In is for inside a place."},{"pt":"Obrigada pelas flores!","wrong":"Thank you by the flowers!","right":"Thank you for the flowers!","why":"por / pelo is not always by: obrigado por = thank you for."}],"curTitle":"For the curious","curious":[["on the weekend / at the weekend","Americans say on the weekend; the British say at the weekend. Both are right, so the game avoids this one."],["jump on / jump onto · get in / get into","In everyday speech, in and on often take the place of into and onto (jump on the bed, get in the car). The game accepts both in these sentences and tells you which one is clearer."],["at school / in school · at the park / in the park","With places like school, the park, the beach or the airport, at and in are both possible (at = the point where you are; in = inside it). The game avoids these sentences."],["think about / think of · dream about / dream of","They almost always mean the same. The game uses about."],["made of / made from","made of: you can still see the material (a table made of wood). made from: the material changed (wine is made from grapes)."],["by bus / by the bus","The means comes with no the: by bus, by car, by email. With the, by means next to: by the bus = ao lado do ônibus."]]},"audio":["00ce721f","a6d7ffcc","948ecac1","db6f82f2","4f6d5d0e","4763d239","9db57961","176dffd0","c6da2612","40482550","818bee28","e5d8590c","2b8677e6","48983e43","9ea9442b","ba40f0c0","b8139b3f","3a083933","4dd50acc","01b76f51","9a5ccfc5","afda51ad","fecc2694","8ace6fd3","e1dcddd6","f99ecf56","f781a8f6","991ce70a","643f6f74","9dfd6a25","eb61775d","aee8d7a0","9f92bf8b","536c0094","3ea39880","e7337e8d","bad1e6cb","d3cf9773","51689ac4","547a0e31","d0513a06","03b4da4b","0ec3de18","8ed42923","86b2baaa","bb29dcd4","9d01ef8f","4802d67f","d24d2293","9812eb69","e602065d","a7fa6f38","237b69bd","93ddde47","2097374e","b821434a","bfa605a7","c4eabbb6","df81dc3b","c4f6df80","021b0584","99fe79b4","5795008b","6832e08a","6b4840aa","dc9fde5c","c60970a5","c940605f","94168367","ca2b9a2d","1526282b","d9573699","f0fdde36","bc078cf2","e4ad9900","5f57d645","27288d26","7be26e85","2b74576e","b1b744c5","bfe5c7fe","17c0d47b","69000916","b973c36c","fe5a6b81","a1f23112","c692b8bc","b483d7e1","b14a47bc","6e66d9f6","001c2262","ffed6af4","ff3270e4","b569748f","d718affd","a7cabe0b","af2af600","4d06c95f","de3a7ae7","ce3019d5","9275da69","e8fdcd93","d0112f3d","eb63639a","90513968","59737f03","41d0e7f6","bc2fed0d","4b7949a8","1799a6aa","80737040","6e89a020","e34dfd7d","eb1b2a62","2592a861","27d7b409","6c03cb52","6cc48076","575fcda9","88333a63","8f615a2b","05dcff86","23b45781","022460f3","f6a21a3a","35c85ac3","32488f0c","5b49c833","1cf1968e","60c1c96b","da6c29c2","0bb4dc5f","4816de98","30f97a2a","be4c232d","979e037b","dab387f3","db899b1c","05188b30","8408a974","2633a96e","f2045e97","cbaf     // on screen; the swipe-back gesture still worked): the phone can ignore history.back() from a script, so if this
    // page is still here shortly after asking, open the menu directly (replace: Back won't return to the faded game).

    // apply); then leave once it has been heard.

  // pills, right after them, then before / after each control, then inside a group of buttons (Verb Wheel's
  // .tools); the place that gives the shortest header wins (the first one on a tie). If every place still adds a
