<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- English Bubbles app (added by the app's build.py, not part of the game's own files) -->
<script>
/* early-theme.js — runs in <head>, before the first paint, in the menu AND in every game: puts on the background
   colour saved in eb-bg (the games' palettes, "p:sky" or "c:#7aa7ff"), so a page never flashes its default colour
   first. The page's own 01-theme.js applies the same colour again a moment later. Keep PAL in step with PALETTES
   (src/js/01-theme.js and the games). */
(function () {
  try {
    var PAL = {
      sky: ["#e4f3fb", "#f1e8fb", "#fdf0e6", 0], peach: ["#ffe6d8", "#ffd6e4", "#fff1c9", 0],
      mint: ["#d9f4e6", "#d3eef6", "#eef6d3", 0], lilac: ["#e9e0fb", "#f7d9ee", "#dbe6fb", 0],
      dusk: ["#2a1740", "#58224f", "#1f3560", 1], midnight: ["#141964", "#441464", "#144e64", 1]
    };
    var s = Storage.prototype.getItem.call(window.localStorage, "eb-bg") || "", c = null;
    if (s.indexOf("p:") === 0) c = PAL[s.slice(2)] || null;
    else if (/^c:#[0-9a-f]{6}$/i.test(s)) {
      var hex = s.slice(2), r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255,
        b = parseInt(hex.slice(5, 7), 16) / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b),
        l = (mx + mn) / 2, h = 0, sat = 0, d = mx - mn;
      if (d) {
        sat = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
        h = (mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) * 60;
      }
      var col = function (dh) { return "hsl(" + ((h + dh + 360) % 360).toFixed(0) + "," + (sat * 100).toFixed(0) + "%," + (l * 100).toFixed(0) + "%)"; };
      c = [col(0), col(40), col(-40), l * 100 < 52];
    }
    if (c) {
      var root = document.documentElement;
      root.style.setProperty("--bg-a", c[0]); root.style.setProperty("--bg-b", c[1]); root.style.setProperty("--bg-c", c[2]);
      root.dataset.theme = c[3] ? "dark" : "light";
    }
  } catch (e) {}
  // The phone's bars (theme-color) follow the background: its top colour --bg-a, set here or later by the page's own
  // colour picker (menu or game: both write --bg-a on <html>). No colour chosen: the default light / dark ones.
  try {
    var html = document.documentElement, last = "";
    var bar = function () {
      var a = html.style.getPropertyValue("--bg-a").trim(), m = document.querySelectorAll('meta[name="theme-color"]');
      for (var i = 0; i < m.length; i++) {
        var v = a || (/dark/.test(m[i].media) ? "#141964" : "#e4f3fb");
        if (m[i].content !== v) m[i].content = v;
      }
      last = a;
    };
    bar();
    document.addEventListener("DOMContentLoaded", bar);
    new MutationObserver(function () {
      if (html.style.getPropertyValue("--bg-a").trim() !== last) bar();
    }).observe(html, { attributes: true, attributeFilter: ["style"] });
  } catch (e) {}
})();

/* iPhone / iPad: ask for a "playback" audio session, so the game's sounds play even with Silent mode on (iOS 17+;
   some games already do this themselves). Websites can't detect Silent mode, so the menu also shows a tip. */
try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
document.documentElement.classList.add("eb-arrive");   /* the header slides in (see the style below) */
</script>
<style>
/* A soft cross-fade between the menu and the games (Chrome; other browsers just switch). Both pages opt in. */
@media (prefers-reduced-motion: no-preference) {
  @view-transition { navigation: auto; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .25s; animation-timing-function: ease-out; }
}
/* The header slides down in from the top when a page arrives (html.eb-arrive, set in <head>, removed when the slide
   ends). It is the real header that moves, not a view-transition snapshot: a snapshot can't show the frosted-glass
   blur (a flat bar showed on PC) and was choppy on Android. The blur is off only while it moves (it is the costly
   part); it returns when the slide ends. */
@media (prefers-reduced-motion: no-preference) {
  html.eb-arrive header.dock { animation: eb-dock-in .48s cubic-bezier(.22,1,.36,1) both; will-change: transform, opacity;
    -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
}
@keyframes eb-dock-in { from { transform: translateY(calc(-100% - 28px)); opacity: 0; } }
/* Leaving with the Games button: the game fades away completely while its sound plays, leaving only its background,
   which is the menu's colour too; the menu then fades in on top. (Half-faded, the page froze on a dim picture while
   the menu loaded: "laggy".) */
html.eb-leaving body { opacity: 0; transition: opacity .22s ease-in; pointer-events: none; }
</style>
<script>
/* Every game saves its progress in the phone's storage. In the app all games share one storage, so each game's
   keys get the prefix "eb:silent-letters:" here; two games can then use the same key names without overwriting each other.
   One exception: the background colour (every game saves it as "<prefix>-bg", e.g. "p:sky" or "c:#7aa7ff", like
   the menu) is ONE setting for the whole app, kept under the menu's key "eb-bg": the game opens with the colour
   chosen in the menu, and a colour chosen in a game becomes the menu's and the other games' too. */
(function () {
  try {
    var P = "eb:silent-letters:", L = window.localStorage, S = Storage.prototype, BG = /^[a-z]+-bg$/;
    var get = S.getItem, set = S.setItem, del = S.removeItem;
    /* The EN / PT toggles too: ONE language for the whole app, the menu's (eb-lang). Each game saves its toggles
       under its own keys, with its own word for Portuguese (games.json "lang": "pt", "tr" or "native"; English is
       always "en"): reading one gives the menu's language, and a tap in a game changes the menu's and every
       game's. Until EN / PT is chosen, the menu's own rule: Portuguese for My level All / A1 / A2, English from B1. */
    var LG = {"sl-lang": "pt"};
    function appLang() {
      var l = get.call(L, "eb-lang");
      if (l === "en" || l === "pt") return l;
      var lv = get.call(L, "eb-level");
      return lv === "B1" || lv === "B2+" ? "en" : "pt";
    }
    S.getItem = function (k) {
      if (this === L && BG.test(k)) { var app = get.call(this, "eb-bg"); if (app) return app; }
      if (this === L && LG.hasOwnProperty(k)) return appLang() === "en" ? "en" : LG[k];
      return get.call(this, this === L ? P + k : k);
    };
    S.setItem = function (k, v) {
      if (this === L && BG.test(k)) set.call(this, "eb-bg", v);
      if (this === L && LG.hasOwnProperty(k)) set.call(this, "eb-lang", String(v) === "en" ? "en" : "pt");
      return set.call(this, this === L ? P + k : k, v);
    };
    S.removeItem = function (k) { return del.call(this, this === L ? P + k : k); };
    /* The app's own keys (eb-rounds, eb-don…) and language, for the injected donation script (donate.js) */
    window.ebApp = { get: function (k) { return get.call(L, k); }, set: function (k, v) { set.call(L, k, v); }, lang: appLang };
    /* Opened from the menu (a card or Continue)? Then the game starts at the menu's level ("My level"): the menu
       leaves a one-time note (sessionStorage eb-level-go), and the matching level is saved under the game's own
       level key before the game reads it (games.json "level"; the nearest level when the game doesn't have it).
       With "All" on the menu, or on a reload, the game keeps its own last level. */
    var LV = null, SS = window.sessionStorage;
    if (SS.getItem("eb-level-go") === "silent-letters") {
      SS.removeItem("eb-level-go");
      var m = get.call(L, "eb-level");
      if (LV && LV[m]) set.call(L, P + LV.key, LV[m]);
    }
  } catch (e) {}
})();
</script>

<style>
/* 00-base: colour tokens (light, dark, forced theme) and the page background. */
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg-a: #e4f3fb; --bg-b: #f1e8fb; --bg-c: #fdf0e6;
  --ink: #26385c;
  --fill-hi: rgba(255,255,255,.95);
  --fill-mid: rgba(255,255,255,.45);
  --fill-lo: rgba(255,255,255,.18);
  --gloss: rgba(255,255,255,.95);
  --underline: #e0558a;
  --rim-l: 74%; --glow-l: 82%; --lab-l: 38%;
  /* the soap bubbles (10-bubbles.css) and the background bubbles (.sky): shine, film, rim, inner glow, shadow (from Stressed syllables / Be Do Modal) */
  --sky-o: .85; --sky-rim-l: 68%; --sky-rim-a: .38; --sky-glow-l: 74%; --sky-glow-a: .2; --sky-hi: .7; --sky-tint-a: .07; --soap-hi: .3; --soap-gl: 1; --spot-plus: 1; --rimhi-l: 56%; --rimhi-a: .85; --faceg-l: 66%; --faceg-a: .18; --soap-lo: .06; --film-a: .18; --srim-l: 70%; --srim-a: .7; --sglow-l: 78%; --sglow-a: .34; --soap-sh: rgba(60,70,140,.07); --soap-sh2: rgba(60,70,140,.12);
  --shadow: rgba(60,70,140,.16);
  --dock-bg: rgba(255,255,255,.62);
  --dock-line: rgba(38,56,92,.14);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-a: #141964; --bg-b: #441464; --bg-c: #144e64;
    --ink: #eaf1ff;
    --fill-hi: rgba(255,255,255,.16); --fill-mid: rgba(255,255,255,.07); --fill-lo: rgba(255,255,255,.03);
    --gloss: rgba(255,255,255,.55);
    --underline: #ffb3d1;
    --rim-l: 68%; --glow-l: 62%; --lab-l: 78%;
    --sky-o: .6; --sky-rim-l: 68%; --sky-rim-a: .35; --sky-glow-l: 62%; --sky-glow-a: .22; --sky-hi: .55; --sky-tint-a: .06; --soap-hi: .22; --soap-gl: .5; --spot-plus: .39; --rimhi-l: 88%; --rimhi-a: .75; --faceg-l: 74%; --faceg-a: .13; --soap-lo: .03; --film-a: .24; --srim-l: 72%; --srim-a: .85; --sglow-l: 66%; --sglow-a: .4; --soap-sh: rgba(0,0,0,.22); --soap-sh2: rgba(0,0,0,.32);
    --shadow: rgba(0,0,0,.45);
    --dock-bg: rgba(12,16,44,.55);
    --dock-line: rgba(255,255,255,.16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #eaf1ff;
  --fill-hi: rgba(255,255,255,.16); --fill-mid: rgba(255,255,255,.07); --fill-lo: rgba(255,255,255,.03);
  --gloss: rgba(255,255,255,.55);
  --underline: #ffb3d1;
  --rim-l: 68%; --glow-l: 62%; --lab-l: 78%;
  --sky-o: .6; --sky-rim-l: 68%; --sky-rim-a: .35; --sky-glow-l: 62%; --sky-glow-a: .22; --sky-hi: .55; --sky-tint-a: .06; --soap-hi: .22; --soap-gl: .5; --spot-plus: .39; --rimhi-l: 88%; --rimhi-a: .75; --faceg-l: 74%; --faceg-a: .13; --soap-lo: .03; --film-a: .24; --srim-l: 72%; --srim-a: .85; --sglow-l: 66%; --sglow-a: .4; --soap-sh: rgba(0,0,0,.22); --soap-sh2: rgba(0,0,0,.32);
  --shadow: rgba(0,0,0,.45);
  --dock-bg: rgba(12,16,44,.55);
  --dock-line: rgba(255,255,255,.16);
  color-scheme: dark;
}
:root[data-theme="dark"]:not([style*="--bg-a"]) { --bg-a: #141964; --bg-b: #441464; --bg-c: #144e64; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  min-height: 100%;
  background-color: var(--bg-a);
  background-image:
    radial-gradient(60vmax 50vmax at 8% 6%, var(--bg-a), transparent 70%),
    radial-gradient(55vmax 45vmax at 95% 40%, var(--bg-b), transparent 70%),
    radial-gradient(60vmax 50vmax at 30% 100%, var(--bg-c), transparent 70%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: "Fredoka", "Nunito", ui-rounded, "Trebuchet MS", system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .4s ease;
}
/* Theme change (swapBg): no transitions for that one style change; the old background fades away on top (as in
   Stressed syllables and Verb Wheel) */
.theming body, .theming *, .theming *::before, .theming *::after { transition: none !important; }
.bgfade { position: fixed; inset: 0; z-index: -1; pointer-events: none; background-color: var(--fa);
  background-image: radial-gradient(60vmax 50vmax at 8% 6%, var(--fa), transparent 70%),
    radial-gradient(55vmax 45vmax at 95% 40%, var(--fb), transparent 70%),
    radial-gradient(60vmax 50vmax at 30% 100%, var(--fc), transparent 70%);
  transition: opacity .55s ease; will-change: opacity; }
.bgfade.go { opacity: 0; }

/* The bubbles drifting up behind everything (from Stressed syllables / Be Do Modal; made in 16-sky.js). Sizes use lvh
   (the screen's height with the address bar hidden), not vh: on Android the address bar hides and shows while
   scrolling, which changed vh mid-flight and made every bubble jump (vh is the fallback). Only transform and opacity animate. */
.sky { position: fixed; top: 0; left: 0; right: 0; height: 100vh; height: 100lvh; z-index: -1; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; }
.sky.in { opacity: var(--sky-o); }   /* light .85, dark .6: subtler on dark backgrounds */
.sky span {
  position: absolute; bottom: -120px; border-radius: 50%;
  border: 1.5px solid hsla(var(--h), 80%, var(--sky-rim-l), var(--sky-rim-a));
  background: radial-gradient(circle at 30% 26%, rgba(255,255,255,var(--sky-hi)), hsla(var(--h), 90%, 78%, var(--sky-tint-a)) 50%, hsla(var(--h), 90%, 72%, calc(var(--sky-tint-a) * .8)) 70%, transparent 71%);
  box-shadow: inset 0 0 14px hsla(var(--h), 95%, var(--sky-glow-l), var(--sky-glow-a));
  filter: blur(2px);   /* soft, out of focus: blurred once, then only moved */
  animation: skydrift var(--t, 30s) linear infinite; animation-delay: var(--d, 0s);
  opacity: 0;
}
/* While the tutorial is open the page behind doesn't scroll (as in Stressed syllables): the tour itself still scrolls it
   to what it points at (scrollBy works on a hidden overflow). The practice window does the same in 20-practice.js. */
html.tour-on { overflow: hidden; overscroll-behavior: none; }

/* 01-dock: the header dock: arrange buttons, Highlight switch, Practice button, volume panel, background swatches. */
/* ---------- Controls ---------- */
.dock {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  z-index: 5;
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
  gap: 8px 12px;
  width: max-content; max-width: calc(100% - 24px);
  margin: 14px auto 0;
  padding: 6px 8px;
  border-radius: 28px;
  background: var(--dock-bg);
  border: 1px solid var(--dock-line);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: 0 8px 22px var(--shadow);
}
.seg { display: flex; gap: 2px; }
.seg button {
  appearance: none; border: 0; cursor: pointer; white-space: nowrap;
  font-family: inherit; font-weight: 500; font-size: .95rem; line-height: 1;
  color: var(--ink); background: transparent;
  padding: .62em 1.1em; border-radius: 999px;
  transition: background-color .2s ease, color .2s ease, transform .2s ease;
}
@media (max-width: 560px) { #modes button { padding: .6em .7em; } }
.seg button:hover { background: var(--dock-line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg-a); }
/* Each arrangement tab has its own gradient, as in Stressed syllables: the level colours of the other games (A1 amber,
   A2 green, B1 blue). Hovering a tab tints it with its own colour. */
#modes [data-mode="alpha"] { --lv: #f9a826; --lv2: #f47b3a; }
#modes [data-mode="letter"] { --lv: #3fcf9a; --lv2: #2bb5c9; }
#modes [data-mode="random"] { --lv: #4aa8ff; --lv2: #5b7bff; }
#modes button:hover { background: color-mix(in srgb, var(--lv) 22%, transparent); }
#modes button[aria-pressed="true"] { color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .2);
  background: linear-gradient(135deg, var(--lv), var(--lv2)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 3px 10px var(--shadow); }
/* As in Be / do / modals (bedomodal 10-dock.css): one pill slides under the chosen arrangement tab with a little spring,
   and its gradient glides to the new tab's colours (--fc1 / --fc2 are registered colours, set by placeModesInd in the
   arrange script). The tabs themselves stay transparent. */
@property --fc1 { syntax: "<color>"; inherits: false; initial-value: #f9a826; }
@property --fc2 { syntax: "<color>"; inherits: false; initial-value: #f47b3a; }
#modes { position: relative; isolation: isolate; }
#modes button { transition: color .3s ease, background-color .2s ease; }
#modes button[aria-pressed="true"], #modes button[aria-pressed="true"]:hover { background: transparent; box-shadow: none; }
#modes .seg-ind { position: absolute; z-index: -1; top: 0; left: 0; width: 0; height: 0; border-radius: 999px; pointer-events: none; opacity: 0;
  background: linear-gradient(135deg, var(--fc1), var(--fc2)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 3px 10px var(--shadow); }
#modes .seg-ind.ready { opacity: 1; transition: transform .45s cubic-bezier(.34,1.4,.64,1), width .45s cubic-bezier(.34,1.4,.64,1), --fc1 .45s ease, --fc2 .45s ease; }
@media (prefers-reduced-motion: reduce) { #modes .seg-ind.ready, #modes button { transition: none; } }

/* Highlight switch */
.tog {
  appearance: none; border: 0; cursor: pointer;
  display: flex; align-items: center; gap: .55em;
  font-family: inherit; font-weight: 500; font-size: .95rem; line-height: 1;
  color: var(--ink); background: transparent; white-space: nowrap;
  padding: .45em .9em .45em .5em; border-radius: 999px;
  transition: background-color .2s ease;
}
.tog:hover { background: var(--dock-line); }
.tog .knob { position: relative; flex: none; width: 34px; height: 20px; border-radius: 999px; background: var(--dock-line); transition: background-color .25s ease; }
.tog .knob::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--ink); transition: transform .25s cubic-bezier(.34,1.56,.64,1), background-color .25s ease;
}
.tog[aria-checked="true"] .knob { background: var(--underline); }
.tog[aria-checked="true"] .knob::after { transform: translateX(14px); background: var(--bg-a); }

/* Practice button. The pink-to-purple gradients of this game (Practice button, CTAs, progress bar, tour Next, scrollbar)
   span 40° of hue, as in Stressed syllables: pink-magenta 315° to purple 275° (hex trio #ff5ed7, #f04dff, #bb5cff). */
.practbtn {
  appearance: none; border: 0; cursor: pointer; display: inline-flex; align-items: center; gap: .45em;
  font-family: inherit; font-weight: 600; font-size: .95rem; line-height: 1; color: #fff; white-space: nowrap;
  padding: .62em 1.1em; border-radius: 999px;
  background: linear-gradient(135deg, hsl(315,85%,68%), hsl(275,80%,68%));
  box-shadow: 0 3px 9px hsla(295,70%,55%,.22); /* a soft glow, the gradient's middle hue */
  transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease;
}
.practbtn:hover { transform: scale(1.05); box-shadow: 0 4px 12px hsla(295,70%,55%,.3); }
.practbtn svg { display: block; flex: none; margin: calc((1em - 18px) / 2) 0; } /* the 18px icon overhangs the 1em line instead of making the button taller than the tab pills */
.practbtn .short { display: none; }
@media (max-width: 560px) { .practbtn .long { display: none; } .practbtn .short { display: inline; } }

/* Sound and colors, each behind one round button */
.tools { display: flex; align-items: center; gap: 2px; }
#snd { appearance: none; border: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: .5em .75em; border-radius: 999px; color: var(--ink); background: transparent; transition: background-color .2s ease, opacity .2s ease; }
#snd:hover { background: var(--dock-line); }
#snd[aria-pressed="false"] { opacity: .6; }
#snd svg { display: block; }
/* The volume (2026-11-24: the sibling games' simple slider, from Past Pairs; 2026-11-25: two sliders, effects and voice): a small pop-over under the speaker */
.volwrap { position: relative; display: flex; justify-content: center; }
.volp { position: absolute; top: calc(100% + 10px); left: 50%; z-index: 30; display: flex; align-items: center; padding: 10px 16px; border-radius: 24px; background: var(--bg-a); border: 1px solid var(--dock-line); box-shadow: 0 10px 26px var(--shadow); opacity: 0; visibility: hidden; transform: translateX(-50%) translateY(-6px) scale(.5, .8); transform-origin: top center; transition: opacity .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1), visibility 0s linear .25s; }
.volp::before { content: ""; position: absolute; left: 0; right: 0; top: -12px; height: 12px; }
.volp { flex-direction: column; align-items: stretch; gap: 6px; }   /* two rows: effects, voice */
.volr { display: flex; align-items: center; gap: 10px; font-size: .8rem; white-space: nowrap; cursor: pointer; }
.volr span { flex: 1; opacity: .75; }
.volwrap.muted .volr { opacity: .45; }   /* muted by the speaker: the levels are kept, moving a slider unmutes */
.volp input { width: 140px; margin: 0; cursor: pointer; accent-color: hsl(300,70%,58%); }
.volwrap.open .volp { opacity: 1; visibility: visible; transform: translateX(-50%); transition-delay: 0s; }
@media (hover: hover) { .volwrap:hover .volp { opacity: 1; visibility: visible; transform: translateX(-50%); transition-delay: 0s; } }
.swwrap { position: relative; padding: 0 4px; }
.swbtn { display: block; width: 34px; height: 34px; padding: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,.9); cursor: pointer; background: conic-gradient(#ff7aa8, #ffd36b, #7be0a4, #6bc7ff, #b08cff, #ff7aa8); box-shadow: 0 1px 5px var(--shadow); transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
.swbtn:hover, .swwrap.open .swbtn { transform: scale(1.12) rotate(40deg); }
.sw { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 0; }   /* the circles are spaced by margins, not the gap, so the picker row adds nothing to the pop-over's width (from Stressed syllables / Be Do Modal) */
.sw > button + button { margin-left: 8px; }
.sw button {
  position: relative; display: block; flex: none;
  width: 30px; height: 30px; padding: 0; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.9); cursor: pointer;
  box-shadow: 0 1px 5px var(--shadow);
  transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease;
}
.sw button:hover { transform: scale(1.12); }
.sw .on { box-shadow: 0 0 0 2px var(--bg-a), 0 0 0 4px var(--ink); }
.sw .swc { background: conic-gradient(#ff7aa8, #ffd36b, #7be0a4, #6bc7ff, #b08cff, #ff7aa8); }
/* The colour picker (13-theme.js; copied from Stressed syllables / Be Do Modal): a full-width row under the swatches
   while picking. Tracks are pills of their own gradient (hue: the rainbow; strength: grey to the hue; light: dark to
   light), the handle a white disc ringed in the colour being made. */
.cpick { contain: inline-size; min-width: 0; display: none; flex: 1 0 100%;   /* contain: it takes the swatch row's width and never widens the pop-over */
  flex-direction: column; gap: 12px; padding: 12px 0 4px; margin-top: 4px; border-top: 1px solid var(--dock-line); }
.swwrap.open.picking .cpick { display: flex; }
.cpick { --cp-h: 220; --cp-s: 100%; --cp-l: 74%; --cp-c: hsl(var(--cp-h), var(--cp-s), var(--cp-l)); }
.cp-top { display: flex; align-items: center; gap: 10px; }
.cp-hex { flex: 1; min-width: 0; font: 500 .95rem "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: transparent;
  border: 1px solid var(--dock-line); border-radius: 999px; padding: .45em .9em; outline: none; }
.cp-hex:focus-visible { border-color: var(--underline); box-shadow: 0 0 0 3px hsla(335,80%,65%,.2); }
.cp-r { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 14px; margin: 4px 0; border-radius: 999px; cursor: pointer;
  background: var(--cp-track); box-shadow: inset 0 0 0 1px var(--dock-line); outline: none; touch-action: none; }
.cp-h { --cp-track: linear-gradient(90deg, hsl(0,85%,62%), hsl(60,85%,62%), hsl(120,85%,62%), hsl(180,85%,62%), hsl(240,85%,62%), hsl(300,85%,62%), hsl(359,85%,62%)); }
.cp-s { --cp-track: linear-gradient(90deg, hsl(var(--cp-h), 0%, var(--cp-l)), hsl(var(--cp-h), 100%, var(--cp-l))); }
.cp-l { --cp-track: linear-gradient(90deg, hsl(var(--cp-h), var(--cp-s), 8%), hsl(var(--cp-h), var(--cp-s), 50%), hsl(var(--cp-h), var(--cp-s), 92%)); }
.cp-r::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 4px solid var(--cp-c); box-shadow: 0 2px 6px var(--shadow); transition: transform .2s cubic-bezier(.34,1.56,.64,1); }
.cp-r::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 4px solid var(--cp-c); box-shadow: 0 2px 6px var(--shadow); }
.cp-r::-moz-range-track { background: transparent; }
.cp-r:hover::-webkit-slider-thumb, .cp-r:active::-webkit-slider-thumb { transform: scale(1.15); }
.cp-r:focus-visible { box-shadow: inset 0 0 0 1px var(--dock-line), 0 0 0 3px hsla(335,80%,65%,.25); }
.swwrap .sw { position: absolute; top: calc(100% + 12px); right: 0; z-index: 30; width: max-content; max-width: calc(100vw - 32px); padding: 10px 14px; border-radius: 24px; background: var(--bg-a); border: 1px solid var(--dock-line); box-shadow: 0 10px 26px var(--shadow); opacity: 0; visibility: hidden; transform: translateY(-6px) scale(.96); transform-origin: top right; transition: opacity .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1), visibility 0s linear .25s; }
.swwrap .sw::before { content: ""; position: absolute; left: 0; right: 0; top: -14px; height: 14px; }
.swwrap.open .sw { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
@media (hover: hover) { .swwrap:hover .sw { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; } }
@media (max-width: 560px) {
  .swwrap, .volwrap { position: static; padding: 0; }
  .swwrap .sw { top: calc(100% + 8px); }
}
/* The volume pop-over lines up with the right edge of the tools (like the swatches): centred under the speaker it would
   stick out of the page when the dock reaches the edge of the screen, and give the page a sideways scroll. */
@media (min-width: 561px) { .tools { position: relative; } }
.volwrap { position: static; }
.volp, .volwrap.open .volp { left: auto; right: 0; transform-origin: top right; }
.volp { transform: translateY(-6px) scale(.5, .8); }
.volwrap.open .volp { transform: none; }
@media (hover: hover) { .volwrap:hover .volp { transform: none; } }
/* Phones: the dock is two rows. Row 1 = the arrangements and Practice; row 2 = Highlight, EN / PT, Tutorial, sound and
   colours (moved after Practice with `order`). Everything is a little tighter so each row fits a 360px screen in both
   languages; on a narrower screen the Highlight switch loses its word (its title stays) and Practice its icon. */
@media (max-width: 560px) {
  .dock { gap: 6px; padding: 6px; max-width: calc(100% - 16px); }
  #modes button { padding: .6em .55em; font-size: .9rem; }
  .practbtn { padding: .6em .85em; font-size: .9rem; gap: .35em; } /* .6em: the tabs' padding, same height */
  #hl, .tourbtn, .tools { order: 1; }
  .tog { padding: .45em .5em .45em .35em; gap: .4em; font-size: .9rem; }
  #snd { padding: .5em; }
}
@media (max-width: 350px) {
  .tog { padding: .45em .35em; }
  .tog span[data-t], .practbtn svg { display: none; }
}
.dock button:focus-visible, .sw button:focus-visible { outline: 2px solid var(--underline); outline-offset: 3px; }

/* 10-bubbles: the word bubbles (soap-bubble look: film, rim, shine spots from 15-soap.js), group headings, the silent-letter mark (.s), the key line, the Portuguese under an open bubble. */
/* ---------- Bubbles ---------- */
main {
  max-width: 1180px;
  margin: 0 auto;
  padding: clamp(16px, 3vw, 34px) clamp(14px, 4vw, 40px) clamp(32px, 6vw, 72px);
  display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start;
  gap: clamp(12px, 1.8vw, 20px) clamp(10px, 1.5vw, 16px);
}
.grp { flex: 0 0 100%; min-width: 0; text-align: center; margin: clamp(12px, 2vw, 22px) 0 0; animation: fade .45s ease backwards; }
.grp:first-child { margin-top: 0; }
.grp .r { font-style: italic; font-weight: 600; font-size: 1.2rem; color: hsl(var(--h) 62% var(--lab-l)); }
.grp .g { margin-left: .7em; font-size: .95rem; opacity: .75; }
.b {
  --h: 200;
  position: relative;
  contain: layout style;
  appearance: none; cursor: pointer;
  font-family: inherit; font-weight: 500;
  font-size: clamp(1.05rem, 1.5vw + .7rem, 1.4rem);
  line-height: 1; letter-spacing: .01em;
  color: var(--ink);
  padding: .78em 1.35em .82em;
  border-radius: 1.5em;
  /* the soap look is drawn by spans (15-soap.js, end of this file); the border stays, clear, so nothing changes size */
  border: 1.5px solid transparent;
  background: none;
  --th: var(--h);
  --ig: inset 0 0 12px hsla(var(--th), 95%, var(--sglow-l), var(--sglow-a));   /* the inner glow, drawn above the film by .film::after; the states below change it */
  --osh: 0 6px 14px var(--soap-sh);   /* the outer shadow: drawn by the film once the spans are in (it grows with the bubble when it opens) */
  box-shadow: var(--osh);
  transition: transform .28s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease;
}
/* until its spans are added (a bubble near the screen gets them, 15-soap.js), a plain coloured rim */
.b:not(.soap) { border-color: hsla(var(--h), 75%, var(--rim-l), .75); }
.intro .b { animation: rise .7s cubic-bezier(.2,.8,.3,1) backwards; animation-delay: calc(var(--i) * 8ms); }
/* Edge jitter (from Stressed syllables): an invisible hit area. On hover the bubble lifts 8px; the area then reaches
   below it, so a cursor resting on the bottom edge stays "on" the bubble instead of making it bob up and down.
   It reaches down only while hovered: always there, it would catch the cursor below the edge and lose it on the lift. */
.b::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.b:focus-visible, .b.playing {
  transform: translateY(-8px) scale(1.07);
  --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14));
  --osh: 0 12px 22px var(--soap-sh2), 0 0 0 4px hsla(var(--th), 90%, 72%, .18); box-shadow: var(--osh);
}
.b:focus-visible { outline: 2px solid var(--underline); outline-offset: 4px; }
.b:active { transform: translateY(-3px) scale(.97); }
/* Hover effects only with a mouse, so a tapped bubble doesn't stay "hovered" on a touch screen */
@media (hover: hover) {
  .b:hover {
    transform: translateY(-8px) scale(1.07);
    --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .14));
    --osh: 0 12px 22px var(--soap-sh2), 0 0 0 4px hsla(var(--th), 90%, 72%, .18); box-shadow: var(--osh);
  }
  .b:hover::after { bottom: -14px; }
}
/* The silent letters: pink, when Highlight is on or the bubble is open */
.s { transition: color .28s ease; }
.hl .s, .b.open .s, .key .s { color: var(--underline); }
.key { text-align: center; margin: 14px 12px 0; font-size: .9rem; opacity: .85; }
body:not(.hl) .on-msg, .hl .off-msg { display: none; }
/* Tap a bubble: it grows downwards to fit the Portuguese underneath */
.b .en { display: block; position: relative; }   /* relative: drawn above the soap spans */
sup.uk { font-size: .6em; font-weight: 600; margin-left: 1px; opacity: .75; line-height: 0; }
/* The * is explained by the group's tip, so the bubbles show it only in Letter view. */
#bubbles:not([data-mode="letter"]) sup.uk { display: none; }
.b .pt { position: relative; display: block; width: 0; min-width: calc(100% + 2.1em); margin: 0 -1.05em; }
/* The Portuguese never sets the bubble's width: it takes the English word's width plus most of the side padding
   (width 0, min-width, negative margins) and wraps, so a bubble only grows downwards (as in Stressed syllables) */
.b .pt em { animation: ptin .32s cubic-bezier(.2,.8,.3,1) .08s backwards; }
@keyframes ptin { from { opacity: 0; transform: translateY(-5px); } }
.b .pt em { display: block; padding-top: .7em; font-style: normal; font-weight: 500; font-size: .66em; line-height: 1.2; text-wrap: balance; color: hsl(var(--h) 62% var(--lab-l)); }
/* The height changes in one step; setOpen (11-bubbles.js) plays it back as a glide. A closing bubble keeps its
   Portuguese (fading out) until the glide ends. */
.b.closing .pt em { opacity: 0; transition: opacity .2s ease; }
.b.open { --ig: inset 0 0 16px hsla(var(--th), 95%, var(--sglow-l), calc(var(--sglow-a) + .1)); }

/* Soap bubbles (2026-11-22, ported from Stressed syllables, itself from Be Do Modal): almost clear, a faint film of
   colour inside and a 1.5px coloured rim, both turning once in 10 s, the bubble's own colour (--th) leading. The numbers
   that differ per theme are tokens in 00-base.css (--soap-*, --film-a, --srim-*, --sglow-*, --rimhi-*, --faceg-*). Built
   from spans (SOAP in 15-soap.js; the practice letter tiles .lt too, 20-practice.css), added only to bubbles that come
   near the screen, each drawn once: the film and the rim turn by rotating a still conic gradient (.spin, a transform
   animation, nothing repainted). Only bubbles on screen (.vis) turn; the others hold still. The shine follows the
   mouse on the practice tiles only (on the word bubbles it was too taxing here, 2026-11-22). Paint order, bottom to top: the film
   (.spin, the white sheen ::before, the inner glow ::after), the shine spot, the rim, the
   small spot, the word. */
:is(.b, .lt) .film { position: absolute; inset: -1.5px; z-index: 0; border-radius: inherit; overflow: hidden; pointer-events: none; }
:is(.b, .lt) .film::before { content: ""; position: absolute; inset: 0; z-index: 1;
  background: radial-gradient(120% 120% at 30% 20%, rgba(255,255,255,var(--soap-hi)), rgba(255,255,255,var(--soap-lo)) 60%, transparent); }
/* On a word bubble the film also draws the outer shadow (--osh), so the shadow follows its outline when it opens */
.b.soap { box-shadow: none !important; }
.b .film { box-shadow: var(--osh); transition: box-shadow .25s ease; }
:is(.b, .lt) .film::after { content: ""; position: absolute; inset: 1.5px; z-index: 3; border-radius: inherit; box-shadow: var(--ig); transition: box-shadow .25s ease; }
/* The turning colour: a square wider than the bubble's diagonal (w + 1.6em covers every closed bubble), centred;
   rotating it is the same picture as turning the conic gradient's start. */
:is(.b, .lt) .spin { position: absolute; left: 50%; top: 50%; width: calc(100% + 1.6em); aspect-ratio: 1; translate: -50% -50%; }
/* On a word bubble the square is centred where a closed bubble's centre is (its height is 2.6em), not at 50%: so when
   the bubble opens the turning colours stay put (a conic gradient looks the same at any size around its centre), and
   the open one only needs a bigger square (w + 10em covers the tallest open bubble from there) */
.b .spin { top: calc(1.3em + 1.5px); }
.b.open .spin, .b.closing .spin { width: calc(100% + 10em); }
.film .spin { background: conic-gradient(from var(--ang), hsla(var(--th), 95%, 76%, var(--film-a)) 0 30%, hsla(calc(var(--th) + 90), 95%, 80%, calc(var(--film-a) * .6)) 50%, hsla(calc(var(--th) + 200), 90%, 82%, calc(var(--film-a) * .7)) 72%, hsla(var(--th), 95%, 76%, var(--film-a)) 92%); }
.rim .spin { background: conic-gradient(from var(--ang), hsla(var(--th), 90%, var(--srim-l), var(--srim-a)) 0 30%, hsla(calc(var(--th) + 90), 90%, calc(var(--srim-l) + 4%), calc(var(--srim-a) * .64)) 50%, hsla(calc(var(--th) + 200), 85%, calc(var(--srim-l) + 8%), calc(var(--srim-a) * .56)) 72%, hsla(var(--th), 90%, var(--srim-l), var(--srim-a)) 92%); }
.b.vis .spin, .lt .spin { animation: spin 10s linear infinite; }   /* the practice tiles are few: they always turn (keyframes in 90-motion.css) */
/* While the bubbles glide or one opens / closes the turning pauses: calmFor in 00-util.js (playbackRate, no class) */
.spot i, .glint > i { position: absolute; inset: 0; }
/* the shine: a fixed size and place (em), so it never stretches with a wide bubble; inside the bubble's round corner */
:is(.b, .lt) .spot { position: absolute; left: .62em; top: .5em; width: .62em; height: .5em; pointer-events: none; transform: rotate(-14deg); }
.spot > i:first-child { background: radial-gradient(closest-side, rgba(255,255,255,var(--soap-gl)) 32%, rgba(255,255,255,calc(var(--soap-gl) * .55)) 62%, rgba(255,255,255,0)); }
/* The small second spot: a thin streak lying along the bottom-right curve (its centre .6em in from both edges, just
   inside the rim of the 1.5em corner); it moves the other way from the main spot, a third as far. */
:is(.b, .lt) .glint { position: absolute; right: calc(.6em - .17em); bottom: calc(.6em - .085em); width: .34em; height: .17em; pointer-events: none; opacity: .8; transform: rotate(-45deg); }
.glint > i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--soap-gl) * .75)) 45%, rgba(255,255,255,0)); }
/* The rim: a ring (a mask cuts out its middle), over the clear border */
:is(.b, .lt) .rim { position: absolute; inset: -1.5px; border-radius: inherit; padding: 1.5px; pointer-events: none;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
/* While the practice window covers the page, the page's films and background bubbles hold still: turning under its
   frosted glass dropped the window to ~20 fps (60 when paused). */
html.pm-on :is(#bubbles .spin, .sky span) { animation-play-state: paused; }
/* The same while the tutorial is open (2026-11-24, from False Friend Bubbles), the practice window's tiles included.
   Classes on <html> set by the code (html.pm-on in 20-practice.js, html.tour-on in 25-tour.js), never html:has(...):
   a :has() on the root made every style update of the page 4-5x slower (an arrangement switch took ~300 ms). */
html.tour-on :is(#bubbles .spin, #pmodal .spin, .sky span, .m.roll .mi) { animation-play-state: paused !important; }
/* While the page scrolls (#bubbles.scrolling, 15-soap.js: until 150 ms after the last scroll) the films pause too: turning
   while scrolling still made 5-14 slow frames in 100 (0-4 paused). Paused, not stopped, so they go on from where they were. */
#bubbles.scrolling .spin { animation-play-state: paused; }
/* The spans never take the mouse: a fixed cursor, so a cursor change on the bubble restyles none of them */
:is(.b, .lt) .film, :is(.b, .lt) .spot, :is(.b, .lt) .rim, :is(.b, .lt) .glint { cursor: default; }
/* The shine on the practice tiles (15-soap.js writes the transform and opacity of these wrappers; at rest they are as
   here, the look is the <i> inside): the glow inside facing the mouse, the spot's brighter core, the rim's bright side.
   The few tiles keep layers of their own for what moves. */
.fg > i, .rh > i { position: absolute; inset: 0; }
.film .fg { position: absolute; left: -10%; top: -45%; width: 120%; height: 190%; z-index: 2; opacity: 0; }
.fg > i { background: radial-gradient(closest-side, hsla(var(--th), 100%, var(--faceg-l), var(--faceg-a)), transparent); }
.spot .pl { opacity: 0; }   /* brighter, with a wider core, as the mouse nears (its opacity = the nearness) */
.spot .pl i { background: radial-gradient(closest-side, rgba(255,255,255,calc(var(--spot-plus) * .85)), rgba(255,255,255,var(--spot-plus)) 42%, rgba(255,255,255,calc(var(--spot-plus) * .55)) 52%, rgba(255,255,255,calc(var(--spot-plus) * .33)) 62%, rgba(255,255,255,calc(var(--spot-plus) * .12)) 81%, rgba(255,255,255,0)); }
.rim .rh { position: absolute; left: -5%; top: -40%; width: 110%; height: 180%; opacity: 0; }
.rh > i { background: radial-gradient(closest-side, hsla(var(--th), 100%, var(--rimhi-l), var(--rimhi-a)), transparent); }
.lt .spot { will-change: transform; }
.lt .glint, .lt .fg, .lt .rh { will-change: transform, opacity; }
@media (prefers-reduced-motion: reduce) { .b.vis .spin, .lt .spin { animation: none; } }
/* Touch screens: the film doesn't turn (as in Stressed syllables: each bubble keeps its own angle, --ang); try it with ?fps first */
@media (hover: none) { .b.vis .spin, .lt .spin { animation: none; } }

/* 20-practice: the practice modal: card, score, explanation, letter tiles, feedback, rule box, end screen, particles. */
/* ---------- Practice ---------- */
.pmodal {
  position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px;
  background: rgba(20,20,40,.35); -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px);
  overscroll-behavior: contain; animation: fadein .2s ease;
}
.pmodal[hidden] { display: none !important; }
.pcard {
  position: relative; width: 100%; max-width: 600px; max-height: calc(100dvh - 32px); overflow: hidden auto;
  /* never sideways: the next word slides in from the right, and a horizontal scrollbar flashing for a frame made the card jitter */
  padding: 16px 18px 22px; border-radius: 28px; color: var(--ink);
  background: var(--bg-a); background: color-mix(in srgb, var(--bg-a) 82%, transparent);
  -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3);
  border: 1px solid var(--dock-line); box-shadow: 0 20px 50px rgba(0,0,0,.28);
  animation: cardin .3s cubic-bezier(.34,1.56,.64,1);
}
.phead { display: flex; align-items: center; gap: 10px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pclose { appearance: none; flex: none; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--ink); background: transparent; font: inherit; font-size: 1.7rem; line-height: 1; opacity: .7; transition: background-color .2s ease, opacity .2s ease; }
.pclose:hover { background: var(--dock-line); opacity: 1; }
.phelp { appearance: none; flex: none; width: 32px; height: 32px; padding: 0; border-radius: 50%; border: 1.5px solid var(--dock-line); display: grid; place-items: center; cursor: pointer; color: var(--ink); background: transparent; font: inherit; font-size: 1rem; font-weight: 600; opacity: .75; transition: background-color .2s ease, opacity .2s ease; }
.phelp:hover { background: var(--dock-line); opacity: 1; }
.pround { flex: 1; text-align: center; font-size: .85rem; font-weight: 500; opacity: .6; }
.score { position: relative; display: flex; flex-direction: column; align-items: center; min-width: 52px; padding: 5px 10px 6px; border-radius: 18px; background: var(--dock-bg); border: 1px solid var(--dock-line); box-shadow: 0 4px 12px var(--shadow); line-height: 1.05; text-align: center; }
.score b { font-size: 1.35rem; font-weight: 600; }
.score small { font-size: .68rem; opacity: .75; white-space: nowrap; }
.score.up { animation: scup .5s cubic-bezier(.34,1.56,.64,1); }
.score.down { animation: scdn .5s ease; }
.score.win { background: hsla(45,100%,80%,.92); box-shadow: 0 0 0 3px hsla(45,95%,60%,.55), 0 6px 18px var(--shadow); animation: scwin .8s cubic-bezier(.34,1.56,.64,1); }
.score.win b, .score.win small { color: #5a3d00; opacity: 1; }
.pbar { height: 6px; border-radius: 3px; background: var(--dock-line); margin: 14px 0 2px; overflow: hidden; }
